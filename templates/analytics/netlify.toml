[build]
ignore = "node ./scripts/netlify-ignore-build.mjs analytics"
command = "if [ -n \"${ANALYTICS_DATABASE_URL_SECRET:-}\" ]; then export ANALYTICS_DATABASE_URL=\"$ANALYTICS_DATABASE_URL_SECRET\"; fi && unset NETLIFY_DATABASE_URL NETLIFY_DATABASE_URL_UNPOOLED DATABASE_URL_UNPOOLED && export DATABASE_URL=\"${ANALYTICS_DATABASE_URL:-$DATABASE_URL}\" && pnpm install && pnpm --filter @agent-native/core build && NITRO_PRESET=netlify pnpm --filter analytics build && if [ \"${CONTEXT:-}\" = \"production\" ] || [ \"${AGENT_NATIVE_RUN_RELEASE_MIGRATIONS:-}\" = \"1\" ]; then pnpm --filter analytics migrate:production; fi"
publish = "templates/analytics/dist"
functions = "templates/analytics/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"
AGENT_PROD_CODE_EXECUTION = "sandboxed"
AGENT_CHAT_DURABLE_BACKGROUND = "true"

[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
AGENT_NATIVE_SSR_CACHE = "30s"
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"

[functions."*"]
timeout = 75

[functions.server-agent-background]
memory = "4gb"

[functions.dashboard-report-sweep-background]
timeout = 300
memory = "2gb"

[functions.analytics-alert-sweep-background]
timeout = 120

[functions.uptime-monitor-sweep-background]
timeout = 120

[functions.analytics-rollup-backfill-background]
timeout = 300
memory = "2gb"

[functions.session-replay-retention-sweep-background]
timeout = 120
