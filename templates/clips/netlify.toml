[build]
ignore = "node ./scripts/netlify-ignore-build.mjs clips"
command = "export DATABASE_URL=${NETLIFY_DATABASE_URL:-$DATABASE_URL} && if [ \"${agentNativePrebuiltBuild:-}\" = \"true\" ]; then export DATABASE_URL=\"${agentNativePrebuiltDatabaseUrl:?}\" BETTER_AUTH_SECRET=\"${agentNativePrebuiltAuthSecret:?}\"; fi && pnpm install && NITRO_PRESET=netlify pnpm --filter clips build && pnpm exec tsx templates/clips/jobs/emit-netlify-brain-export-cron.ts && if { [ \"${CONTEXT:-}\" = \"production\" ] || [ \"${AGENT_NATIVE_RUN_RELEASE_MIGRATIONS:-}\" = \"1\" ]; } && [ \"${agentNativePrebuiltBuild:-}\" != \"true\" ]; then pnpm --filter clips migrate:production; fi"
publish = "templates/clips/dist"
functions = "templates/clips/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"
AUTO_CREATE_DEFAULT_ORG = "1"
AGENT_CHAT_DURABLE_BACKGROUND = "true"

[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
AGENT_NATIVE_SSR_CACHE = "5m"
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"

AGENT_NATIVE_SERVERLESS_FFMPEG_ARCH = "x64"

[functions."*"]
timeout = 75

[functions.clips-brain-export-sweep-background]
timeout = 120
