[build]
ignore = "node ./scripts/netlify-ignore-build.mjs clips"
command = "export DATABASE_URL=${NETLIFY_DATABASE_URL:-$DATABASE_URL} && pnpm install && NITRO_PRESET=netlify pnpm --filter clips build && pnpm exec tsx templates/clips/jobs/emit-netlify-brain-export-cron.ts && if [ \"${CONTEXT:-}\" = \"production\" ]; then pnpm --filter clips migrate:production; fi"
publish = "templates/clips/dist"
functions = "templates/clips/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"
AUTO_CREATE_DEFAULT_ORG = "1"
# Emit the shared 15-minute Netlify background function used by agent chat and
# Clips post-recording transcription/seekability workers.
AGENT_CHAT_DURABLE_BACKGROUND = "true"
# Do not bundle ffmpeg-static here: its 76 MB binary puts both shared server
# functions over the framework's 120 MB per-function budget. Clips falls back
# to the original media when no runtime FFMPEG_PATH or system ffmpeg exists.

# A2A delegation calls run a full agent loop (LLM + tool calls + DB queries).
# The framework does not impose a default agent-run timeout; if a template sets
# AGENT_RUN_SOFT_TIMEOUT_MS, keep it below this function timeout so the hidden
# auto-continuation path can hand off before Netlify kills the function.
[functions."*"]
timeout = 75

[functions.clips-brain-export-sweep-background]
timeout = 120
