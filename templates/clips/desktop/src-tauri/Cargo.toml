[package]
name = "clips-tray"
version = "0.1.1"
description = "Clips — cross-platform tray app (Tauri 2)"
authors = ["Clips"]
license = "MIT"
edition = "2021"
rust-version = "1.88"


[lib]
name = "clips_tray_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "Clips"
path = "src/main.rs"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "devtools",
  "tray-icon",
  "image-png",
  "macos-private-api",
] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sentry = "0.48.3"
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
  "time",
  "sync",
  "macros",
] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
libc = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = { version = "0.6", features = ["exception"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSEvent",
  "block2",
] }
unicode-segmentation = "1.13"
objc2-foundation = { version = "0.3", features = [
  "NSBundle",
  "NSDictionary",
  "NSString",
  "NSError",
  "NSLocale",
  "NSURL",
  "NSValue",
  "NSProcessInfo",
] }
objc2-speech = { version = "0.3", features = [
  "SFSpeechRecognizer",
  "SFSpeechRecognitionRequest",
  "SFSpeechRecognitionResult",
  "SFSpeechRecognitionTask",
  "SFTranscription",
  "SFTranscriptionSegment",
  "SFErrors",
] }
objc2-avf-audio = { version = "0.3", features = [
  "AVAudioEngine",
  "AVAudioFormat",
  "AVAudioIONode",
  "AVAudioNode",
  "AVAudioBuffer",
  "AVAudioSession",
  "AVAudioTypes",
  "block2",
  "objc2-core-audio-types",
  "objc2-audio-toolbox",
] }
objc2-audio-toolbox = { version = "0.3.2", features = [
  "AUComponent",
  "AudioComponent",
] }
objc2-core-audio = { version = "0.3.2", features = ["AudioHardware"] }
block2 = "0.6"
screencapturekit = { version = "2.0.0", features = ["async", "macos_15_0"] }
objc2-core-audio-types = "0.3"
nnnoiseless = { version = "0.5.2", default-features = false }
whisper-rs = { version = "0.16.0", features = ["metal"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
