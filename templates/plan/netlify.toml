[build]
ignore = "node ./scripts/netlify-ignore-build.mjs plan"
command = "if [ \"${agentNativePrebuiltBuild:-}\" = \"true\" ]; then export DATABASE_URL=\"${agentNativePrebuiltDatabaseUrl:?}\" BETTER_AUTH_SECRET=\"${agentNativePrebuiltAuthSecret:?}\"; else export DATABASE_URL=${NETLIFY_DATABASE_URL:-$DATABASE_URL}; fi && pnpm install && NITRO_PRESET=netlify pnpm --filter plan build && if { [ \"${CONTEXT:-}\" = \"production\" ] || [ \"${AGENT_NATIVE_RUN_RELEASE_MIGRATIONS:-}\" = \"1\" ]; } && [ \"${agentNativePrebuiltBuild:-}\" != \"true\" ]; then pnpm --filter plan migrate:production; fi"
publish = "templates/plan/dist"
functions = "templates/plan/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"
AGENT_CHAT_DURABLE_BACKGROUND = "true"

[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
# Production release migrations own schema setup; request functions must skip
# migration probes on every serverless invocation.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"

# A2A/MCP calls may include plan generation, artifact serialization, and
# feedback polling. Keep this aligned with other agent-heavy hosted templates.
# Agent chat runs are dispatched to the emitted Netlify background function;
# the normal server timeout still protects non-background HTTP handlers.
[functions."*"]
timeout = 75
