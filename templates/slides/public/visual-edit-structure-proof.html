<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Visual edit structure proof</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 700px;
      }

      body {
        background: #f8fafc;
        color: #0f172a;
        font: 16px/1.4 system-ui, sans-serif;
      }

      [data-agent-native-node-id="proof-target-anchor"] {
        background: #cbd5e1;
      }

      [data-agent-native-node-id="proof-target-tail"] {
        background: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div
      data-agent-native-node-id="proof-outer-frame"
      data-agent-native-layer-name="Proof outer frame"
      data-an-primitive="frame"
      style="box-sizing:border-box;position:absolute;left:64px;top:64px;width:760px;height:480px;padding:32px;border:2px solid #334155;border-radius:16px;background:#e2e8f0"
    >
      <div
        data-agent-native-node-id="proof-auto-layout-target"
        data-agent-native-layer-name="Proof auto-layout target"
        data-an-primitive="frame"
        style="box-sizing:border-box;display:flex;flex-direction:column;gap:16px;width:696px;height:416px;padding:24px;border:2px dashed #64748b;border-radius:12px;background:#ffffff"
      >
        <div
          data-agent-native-node-id="proof-target-anchor"
          data-agent-native-layer-name="Target anchor"
          data-an-primitive="rectangle"
          style="box-sizing:border-box;flex:none;width:648px;height:64px;padding:18px;border-radius:8px"
        >
          Target anchor
        </div>
        <div
          data-agent-native-node-id="proof-target-tail"
          data-agent-native-layer-name="Target tail"
          data-an-primitive="rectangle"
          style="box-sizing:border-box;flex:none;width:648px;height:64px;padding:18px;border-radius:8px"
        >
          Target tail
        </div>
      </div>
    </div>
  </body>
</html>
