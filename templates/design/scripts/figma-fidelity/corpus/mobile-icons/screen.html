<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mobile with inline SVG icons</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #07070a;
        font-family: Inter, Helvetica, Arial, sans-serif;
        color: #f4f4f5;
      }
      .frame {
        position: relative;
        width: 390px;
        height: 844px;
        overflow: hidden;
        background:
          radial-gradient(
            ellipse 90% 40% at 50% 0%,
            rgba(129, 140, 248, 0.28),
            transparent 65%
          ),
          #07070a;
        display: flex;
        flex-direction: column;
      }
      .status {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 22px 0;
        font-size: 12px;
        font-weight: 700;
      }
      .head {
        padding: 18px 22px 10px;
      }
      .head h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .head p {
        margin: 4px 0 0;
        font-size: 13px;
        color: #a1a1aa;
      }
      .search {
        margin: 14px 22px 0;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 14px;
        border-radius: 14px;
        background: #141419;
        border: 1px solid #26262e;
        color: #71717a;
        font-size: 14px;
      }
      .list {
        flex: 1;
        min-height: 0;
        padding: 16px 22px 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 16px;
        background: #101015;
        border: 1px solid #1f1f27;
      }
      .ico {
        width: 38px;
        height: 38px;
        flex: none;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ico.a {
        background: rgba(129, 140, 248, 0.16);
        color: #a5b4fc;
      }
      .ico.b {
        background: rgba(52, 211, 153, 0.16);
        color: #6ee7b7;
      }
      .ico.c {
        background: rgba(251, 146, 60, 0.16);
        color: #fdba74;
      }
      .ico.d {
        background: rgba(244, 114, 182, 0.16);
        color: #f9a8d4;
      }
      .row .t {
        flex: 1;
        min-width: 0;
      }
      .row .t b {
        display: block;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .row .t span {
        display: block;
        font-size: 12px;
        color: #8b8b96;
        margin-top: 2px;
      }
      .row .v {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .row .v.up {
        color: #34d399;
      }
      .row .v.down {
        color: #fb7185;
      }
      .cta {
        margin: 16px 22px 0;
        height: 50px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: linear-gradient(120deg, #6366f1, #8b5cf6);
        font-size: 15px;
        font-weight: 700;
        box-shadow: 0 12px 26px -10px rgba(99, 102, 241, 0.75);
      }
      .tabs {
        margin-top: auto;
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 78px;
        border-top: 1px solid #1c1c23;
        background: rgba(10, 10, 13, 0.9);
      }
      .tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #52525b;
      }
      .tab.on {
        color: #a5b4fc;
      }
    </style>
  </head>
  <body>
    <main class="frame" data-agent-native-node-id="frame">
      <div class="status">
        <span>9:41</span><span>&#9679;&#9679;&#9679;&#9679;</span>
      </div>
      <div class="head">
        <h1>Portfolio</h1>
        <p>Updated just now</p>
      </div>
      <div class="search">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
        Search assets
      </div>
      <div class="list">
        <div class="row">
          <div class="ico a">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 17l6-6 4 4 7-7" />
              <path d="M14 8h6v6" />
            </svg>
          </div>
          <div class="t"><b>Momentum Fund</b><span>142.8 units</span></div>
          <div class="v up">+4.2%</div>
        </div>
        <div class="row">
          <div class="ico b">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" width="18" height="16" rx="3" />
              <path d="M3 10h18M8 4v4" />
            </svg>
          </div>
          <div class="t">
            <b>Treasury Ladder</b><span>Matures Mar 2027</span>
          </div>
          <div class="v up">+0.8%</div>
        </div>
        <div class="row">
          <div class="ico c">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 3v18M6 8h9a3 3 0 010 6H6" />
            </svg>
          </div>
          <div class="t"><b>Cash Reserve</b><span>Instant access</span></div>
          <div class="v">0.0%</div>
        </div>
        <div class="row">
          <div class="ico d">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 21s-7-4.6-7-10a4 4 0 017-2.6A4 4 0 0119 11c0 5.4-7 10-7 10z"
              />
            </svg>
          </div>
          <div class="t"><b>Impact Basket</b><span>18 holdings</span></div>
          <div class="v down">-1.4%</div>
        </div>
      </div>
      <div class="cta">
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
        Add position
      </div>
      <nav class="tabs">
        <div class="tab on">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 11l8-7 8 7v8a2 2 0 01-2 2H6a2 2 0 01-2-2z" /></svg
          >Home
        </div>
        <div class="tab">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 19V9M10 19V5M16 19v-7M22 19H2" /></svg
          >Markets
        </div>
        <div class="tab">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c1.6-3.6 4.4-5.4 8-5.4s6.4 1.8 8 5.4" /></svg
          >Profile
        </div>
      </nav>
    </main>
  </body>
</html>
