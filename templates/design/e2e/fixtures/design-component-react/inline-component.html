<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inline component fixture</title>
  </head>
  <body style="margin: 0; position: relative; min-height: 900px">
    <aside
      data-agent-native-node-id="legacy-copy"
      data-agent-native-layer-name="Legacy same-name copy"
      data-agent-native-component="ReusableCard"
      style="
        position: absolute;
        left: 40px;
        top: 40px;
        width: 180px;
        height: 80px;
        background: #ddd;
      "
    >
      Legacy
    </aside>
    <section
      data-agent-native-node-id="card-main"
      data-agent-native-layer-name="Card Main"
      style="
        position: absolute;
        left: 300px;
        top: 40px;
        width: 420px;
        height: 360px;
        padding: 20px;
        background: #1f2937;
        color: white;
      "
    >
      <div
        data-agent-native-node-id="card-body"
        data-agent-native-layer-name="Card Body"
        style="display: grid; gap: 8px"
      >
        <strong data-agent-native-node-id="card-title"
          ><span data-agent-native-node-id="card-title-text"
            >Canonical card</span
          ></strong
        >
        <button
          data-agent-native-node-id="card-button"
          data-agent-native-layer-name="Card Action"
          data-agent-native-prop-label="Open"
          style="width: 120px; padding: 10px; background: #6366f1; color: white"
        >
          Open
        </button>
      </div>
      <div
        data-agent-native-node-id="card-slot"
        data-agent-native-layer-name="Card Slot"
        style="min-height: 70px; padding: 10px; background: #374151"
      >
        Reparent target
      </div>
    </section>
  </body>
</html>
