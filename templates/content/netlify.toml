[build]
ignore = "node ./scripts/netlify-ignore-build.mjs content"
command = "export DATABASE_URL=${NETLIFY_DATABASE_URL:-$DATABASE_URL} && pnpm install && NITRO_PRESET=netlify pnpm --filter content build && if [ \"${CONTEXT:-}\" = \"production\" ] || [ \"${AGENT_NATIVE_RUN_RELEASE_MIGRATIONS:-}\" = \"1\" ]; then pnpm --filter content migrate:production; fi"
publish = "templates/content/dist"
functions = "templates/content/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"
AGENT_RUN_SOFT_TIMEOUT_MS = "55000"
AGENT_CHAT_DURABLE_BACKGROUND = "true"

[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
AGENT_NATIVE_SSR_CACHE = "5m"
# Production release migrations own schema setup; request functions must skip
# migration probes on every serverless invocation.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"

[functions."*"]
timeout = 75

# The app-shell service worker (app/service-worker/). Browsers must see each
# deploy's copy, so no CDN keeps one. Building with
# VITE_CONTENT_SERVICE_WORKER=off ships a worker that removes itself.
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"
CDN-Cache-Control = "no-store"
Cloudflare-CDN-Cache-Control = "no-store"
Netlify-CDN-Cache-Control = "no-store"
