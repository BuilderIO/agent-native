[build]
ignore = "node ./scripts/netlify-ignore-build.mjs mail"
command = "export DATABASE_URL=${NETLIFY_DATABASE_URL:-$DATABASE_URL} && pnpm install && DATABASE_URL=${NETLIFY_DATABASE_URL_UNPOOLED:-$DATABASE_URL} NITRO_PRESET=netlify pnpm --filter mail build && if [ \"${CONTEXT:-}\" = \"production\" ] || [ \"${AGENT_NATIVE_RUN_RELEASE_MIGRATIONS:-}\" = \"1\" ]; then DATABASE_URL=${NETLIFY_DATABASE_URL_UNPOOLED:-$DATABASE_URL} pnpm --filter mail migrate:production; fi"
publish = "templates/mail/dist"
functions = "templates/mail/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"
AGENT_NATIVE_SSR_CACHE = "30s"

[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
# Production release migrations own schema setup; request functions must skip
# migration probes on every serverless invocation.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"

[functions."*"]
timeout = 75
