[build]
ignore = "node ./scripts/netlify-ignore-build.mjs mail"
command = "export DATABASE_URL=${NETLIFY_DATABASE_URL:-$DATABASE_URL} && pnpm install && DATABASE_URL=${NETLIFY_DATABASE_URL_UNPOOLED:-$DATABASE_URL} NITRO_PRESET=netlify pnpm --filter mail build && if [ \"${CONTEXT:-}\" = \"production\" ]; then DATABASE_URL=${NETLIFY_DATABASE_URL_UNPOOLED:-$DATABASE_URL} pnpm --filter mail migrate:production; fi"
publish = "templates/mail/dist"
functions = "templates/mail/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
NITRO_PRESET = "netlify"
NPM_CONFIG_PRODUCTION = "false"

[context.production.environment]
AGENT_NATIVE_HOSTED_HARNESS = "true"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"

# A2A delegation calls run a full agent loop (LLM + tool calls + DB queries).
# The framework does not impose a default agent-run timeout; if a template sets
# AGENT_RUN_SOFT_TIMEOUT_MS, keep it below this function timeout so the hidden
# auto-continuation path can hand off before Netlify kills the function.
[functions."*"]
timeout = 75
