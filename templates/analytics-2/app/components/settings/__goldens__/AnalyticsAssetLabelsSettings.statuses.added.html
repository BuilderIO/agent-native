<section class="ws-labels-section" aria-label="Asset statuses">
<h2 class="ws-labels-title">Asset statuses</h2>
<p class="ws-labels-description">Statuses describe where a project or data asset stands. Every member can apply them; workspace admins add them here.</p>
<ul class="ws-label-list">
<li class="ws-label-item">
<span class="ws-label-dot" style="background: #d64545;" aria-hidden="true">
</span>
<span class="ws-label-name">Draft</span>
<button type="button" class="ws-label-remove" aria-label="Remove Draft">Remove</button>
</li>
<li class="ws-label-item">
<span class="ws-label-dot" style="background: #3f9c63;" aria-hidden="true">
</span>
<span class="ws-label-name">Certified</span>
<button type="button" class="ws-label-remove" aria-label="Remove Certified">Remove</button>
</li>
<li class="ws-label-item">
<span class="ws-label-dot" style="background: #6b7280;" aria-hidden="true">
</span>
<span class="ws-label-name">No color</span>
<button type="button" class="ws-label-remove" aria-label="Remove No color">Remove</button>
</li>
</ul>
<form class="ws-label-create">
<label class="ws-label-create-label" for=":id:-name">New status</label>
<div class="ws-label-create-row">
<input id=":id:-name" class="ws-label-create-input" maxlength="200" placeholder="Name" type="text" value="">
<span class="ws-label-swatches">
<button type="button" class="ws-label-swatch" aria-label="Use #d64545" aria-pressed="false" style="background: #d64545;">
</button>
<button type="button" class="ws-label-swatch" aria-label="Use #d97a3a" aria-pressed="false" style="background: #d97a3a;">
</button>
<button type="button" class="ws-label-swatch" aria-label="Use #c9a227" aria-pressed="false" style="background: #c9a227;">
</button>
<button type="button" class="ws-label-swatch" aria-label="Use #3f9c63" aria-pressed="false" style="background: #3f9c63;">
</button>
<button type="button" class="ws-label-swatch" aria-label="Use #2f9e9e" aria-pressed="false" style="background: #2f9e9e;">
</button>
<button type="button" class="ws-label-swatch" aria-label="Use #3f6fb5" aria-pressed="true" style="background: #3f6fb5;">
</button>
<button type="button" class="ws-label-swatch" aria-label="Use #7b5cc4" aria-pressed="false" style="background: #7b5cc4;">
</button>
<button type="button" class="ws-label-swatch" aria-label="Use #c4588f" aria-pressed="false" style="background: #c4588f;">
</button>
<button type="button" class="ws-label-swatch" aria-label="Use #6b7280" aria-pressed="false" style="background: #6b7280;">
</button>
</span>
<button type="submit" class="ws-label-create-submit" disabled="">Add</button>
</div>
</form>
</section>
