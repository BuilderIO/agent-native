version: 1
applications:
  - appRoot: templates/calendar
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 24 && node --version
            - corepack enable && pnpm install --filter 'calendar...' --frozen-lockfile --ignore-scripts
        build:
          commands:
            - NITRO_PRESET=aws_amplify pnpm --filter 'calendar...' run build
      artifacts:
        baseDirectory: templates/calendar/.amplify-hosting
        files:
          - "**/*"
