<title>Design Editor Shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&display=swap">
<style>
/* Layout: 56 rail | 240 file panel (resizable, 8px steps) | canvas | 240 inspector; one 48px header line across all columns. */
:root {
  --bg: hsl(0 0% 100%);
  --fg: hsl(0 0% 10%);
  --muted: hsl(0 0% 95%);
  --muted-fg: hsl(0 0% 45%);
  --border: hsl(0 0% 90%);
  --hover: hsl(0 0% 96%);
  --primary: hsl(0 0% 9%);
  --primary-fg: hsl(0 0% 100%);
  --canvas: hsl(0 0% 96%);
  --accent: hsl(205 100% 53%);
  --accent-soft: color-mix(in srgb, hsl(205 100% 53%) 14%, transparent);
  --accent-row: color-mix(in srgb, hsl(205 100% 53%) 10%, transparent);
  --rail-active: hsl(199 100% 94%);
  --dock: hsl(0 0% 24%);
  --dock-fg: hsl(0 0% 100%);
  --dock-hover: hsl(0 0% 100% / 10%);
  --dock-pressed: hsl(0 0% 100% / 16%);
  --dock-muted: hsl(0 0% 100% / 64%);
  --dock-menu: hsl(0 0% 12%);
  --accent-hover: hsl(205 81% 46%);
  --popover: hsl(0 0% 100%);
  --shadow: 0 8px 28px rgb(0 0 0 / 14%), 0 1px 3px rgb(0 0 0 / 10%);
  --spec-grid: hsl(330 90% 55% / 0.18);
  --spec-line: hsl(330 90% 55% / 0.7);
  --page-fg: hsl(0 0% 10%);
  --page-muted: hsl(0 0% 40%);
  --page-card: hsl(0 0% 97%);
  --page-bg: hsl(0 0% 100%);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: hsl(0 0% 13%); --fg: hsl(0 0% 90%); --muted: hsl(0 0% 17%); --muted-fg: hsl(0 0% 60%);
    --border: hsl(0 0% 22%); --hover: hsl(0 0% 18%); --primary: hsl(0 0% 92%); --primary-fg: hsl(0 0% 10%);
    --canvas: hsl(0 0% 9%); --rail-active: hsl(205 60% 22%); 
    --popover: hsl(0 0% 16%); --shadow: 0 8px 28px rgb(0 0 0 / 50%), 0 1px 3px rgb(0 0 0 / 40%);
    --accent-soft: color-mix(in srgb, hsl(205 100% 53%) 24%, transparent);
    --accent-row: color-mix(in srgb, hsl(205 100% 53%) 18%, transparent);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: hsl(0 0% 13%); --fg: hsl(0 0% 90%); --muted: hsl(0 0% 17%); --muted-fg: hsl(0 0% 60%);
  --border: hsl(0 0% 22%); --hover: hsl(0 0% 18%); --primary: hsl(0 0% 92%); --primary-fg: hsl(0 0% 10%);
  --canvas: hsl(0 0% 9%); --rail-active: hsl(205 60% 22%); 
  --popover: hsl(0 0% 16%); --shadow: 0 8px 28px rgb(0 0 0 / 50%), 0 1px 3px rgb(0 0 0 / 40%);
  --accent-soft: color-mix(in srgb, hsl(205 100% 53%) 24%, transparent);
  --accent-row: color-mix(in srgb, hsl(205 100% 53%) 18%, transparent);
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 12px; overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s12 { width: 12px; height: 12px; }
svg.i.s14 { width: 14px; height: 14px; }
.muted { color: var(--muted-fg); }

/* ───────── review strip ───────── */
.review { height: 36px; display: flex; align-items: center; gap: 8px; padding-inline: 12px; border-bottom: 1px solid var(--border); background: var(--muted); font-size: 12px; }
.review .name { font-weight: 600; }
.review .ver { color: var(--muted-fg); }
.review .grow { flex: 1; }
.chip { height: 24px; padding-inline: 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--bg); white-space: nowrap; }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.chip .k { color: var(--muted-fg); font-size: 11px; }

/* ───────── app shell ───────── */
.app { --panel-w: 240px; height: calc(100% - 36px); display: grid; grid-template-columns: 56px var(--panel-w) minmax(0, 1fr) 240px; grid-template-rows: 48px minmax(0, 1fr); }
.app.no-panel { grid-template-columns: 56px 0 minmax(0, 1fr) 240px; }
.app.no-inspector { grid-template-columns: 56px var(--panel-w) minmax(0, 1fr) 0; }
.app.no-panel.no-inspector { grid-template-columns: 56px 0 minmax(0, 1fr) 0; }

/* rail */
.rail { grid-row: 1 / 3; grid-column: 1; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--bg); }
.rail-head { height: 48px; display: grid; place-items: center; border-bottom: 1px solid var(--border); flex: none; }
.rail-nav { padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 0; }
.rail-item { width: 100%; padding-inline: 4px; padding-block: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; line-height: 16px; }
.rail-item .lbl { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
/* Figma's rail button: label under the icon, the full name in a tooltip to the right after 500ms. */
.rail-tip { position: fixed; z-index: 90; pointer-events: none; height: 24px; padding-inline: 8px; border-radius: 6px; background: var(--fg); color: var(--bg); font-size: 12px; line-height: 24px; white-space: nowrap; }
/* 20px glyph in a 32px button: one step up from the app's 16px icons, same compact rhythm. */
.rail-item .ib { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; }
.rail-item .ib svg.i { width: 20px; height: 20px; }
.rail-item:hover .ib { background: var(--hover); }
.rail-item[aria-current="true"] .ib { background: var(--rail-active); color: var(--accent); }
.rail-foot { margin-top: auto; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rail-foot button { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--fg); }
.rail-foot button:hover { background: var(--hover); }
/* Toolkit AccountMenu compact trigger: 24px avatar in a 32px button (OrgSwitcher COMPACT_TRIGGER_CLASS / AVATAR_CLASS). */
.rail-foot .acct { width: 32px; height: 32px; border-radius: 6px; }
.rail-foot .acct[aria-expanded="true"] { background: var(--hover); }
.acct-av { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); background: var(--muted); color: var(--muted-fg); font-size: 11px; font-weight: 600; display: grid; place-items: center; }

/* left file panel */
.panel { grid-row: 1 / 3; grid-column: 2; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--bg); }
.no-panel .panel { border-right: 0; }
/* Resize handle on the panel's right edge, like DesignEditor's col-resize strip. Widths snap to the 8pt grid: 240px by default, 232px to 416px. */
.panel { position: relative; }
.panel-resize { position: absolute; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; z-index: 6; }
.panel-resize::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px; background: transparent; transition: background .12s; }
.panel-resize:hover::after, .panel-resize.drag::after { background: var(--accent); }
.no-panel .panel-resize { display: none; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
.file-head { height: 48px; flex: none; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 8px; position: relative; }
.file-id { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0 8px; }
.file-name { display: flex; align-items: center; gap: 4px; height: 16px; border-radius: 4px; min-width: 0; text-align: left; }
.file-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-name svg { color: var(--muted-fg); }
.file-name:hover svg, .file-name[aria-expanded="true"] svg { color: var(--fg); }
/* Hover fill extends 4px past the text; the negative margin keeps the label flush with the file name. */
.file-folder { height: 20px; margin: -2px 0 -2px -4px; padding-inline: 4px; display: inline-flex; align-items: center; color: var(--muted-fg); border-radius: 6px; align-self: flex-start; }
.file-folder:hover, .file-folder:focus-visible { color: var(--fg); background: var(--hover); }
.icon-btn { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--hover); }
.icon-btn.sm { width: 22px; height: 22px; border-radius: 6px; }
.icon-btn.xs { width: 24px; height: 24px; border-radius: 6px; }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

.tree { flex: 1; min-height: 0; overflow: auto; padding-bottom: 12px; }
.sec-head { height: 40px; display: flex; align-items: center; padding-right: 11px; position: sticky; top: 0; background: var(--bg); z-index: 1; }
.sec-head + .sec-head, .sec-head.rule { box-shadow: inset 0 1px 0 var(--border); }
.sec-toggle { flex: 1; display: flex; align-items: center; height: 40px; min-width: 0; text-align: left; font-weight: 550; font-size: 11px; letter-spacing: .005em; }
.sec-toggle .chev { width: 16px; display: grid; place-items: center; color: var(--muted-fg); }
.sec-toggle .chev svg { transition: transform .12s; }
.sec-toggle[aria-expanded="false"] .chev svg { transform: rotate(-90deg); }
.sec-actions { display: flex; gap: 0; }
.sec-block { padding-bottom: 4px; }

.row { height: 32px; display: flex; align-items: center; padding-inline: 16px; gap: 0; font-size: 11px; line-height: 16px; letter-spacing: .005em; cursor: default; position: relative; user-select: none; }
.row:hover { background: var(--hover); }
.row[aria-selected="true"] { background: var(--accent-row); }
.row .indent { display: flex; flex: none; }
.row .indent i { width: 24px; height: 32px; display: block; }
.row .slot { width: 16px; height: 16px; display: grid; place-items: center; flex: none; color: var(--muted-fg); }
.row .slot.disc svg { transition: transform .12s; }
.row .slot.disc[aria-expanded="false"] svg { transform: rotate(-90deg); }
.row .gap { width: 8px; flex: none; }
.row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .trail { display: flex; gap: 4px; opacity: 0; margin-left: 8px; }
.row:hover .trail { opacity: 1; }
.row .trail button { width: 16px; height: 16px; display: grid; place-items: center; color: var(--muted-fg); }
.row .trail button:hover { color: var(--fg); }
.row .ico { color: var(--fg); }
.row.text .ico { color: var(--muted-fg); }

/* spacing spec overlay */
.show-spec .row .indent i { background: repeating-linear-gradient(90deg, var(--spec-grid) 0 23px, var(--spec-line) 23px 24px); }
.show-spec .row .gap { background: var(--spec-grid); }
.show-spec .row { box-shadow: inset 0 -1px 0 var(--spec-grid); }
.show-spec .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: var(--spec-grid); }

/* top bar */
/* Three columns so the route is centred on the bar. Equal 1fr sides; when one side outgrows its half it widens and the centre shifts instead of overlapping. */
.topbar { grid-row: 1; grid-column: 3 / 5; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto 1fr auto; align-items: center; column-gap: 8px; padding: 8px; min-width: 0; background: var(--bg); }
.tb-left { justify-self: start; min-width: max-content; gap: 8px; }
.tb-left-extra { gap: 8px; }
.tb-right { justify-self: end; min-width: max-content; }
/* Over the inspector, column 4 starts at its left edge (240 minus the bar's 8px padding), so zoom ends 8px before it
   and the avatars and actions get the inspector's width. */
.app:not(.no-inspector) .topbar { grid-template-columns: 1fr auto 1fr 232px; }
.tb-insp { justify-self: end; min-width: 0; display: flex; align-items: center; gap: 12px; }
@media (max-width: 1100px) { .app:not(.no-inspector) .topbar { grid-template-columns: 1fr auto 1fr auto; } }
.seg { display: inline-flex; padding: 4px; border-radius: 14px; background: var(--muted); flex: none; }
.seg button { height: 20px; padding-inline: 6px; border-radius: 8px; font-size: 12px; font-weight: 500; line-height: 16px; color: var(--muted-fg); }
.seg button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / 10%), 0 1px 1.5px rgb(0 0 0 / 10%); }
.tb-zone { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tb-center { justify-content: center; }
.select { height: 28px; border: 1px solid var(--border); border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; font-size: 14px; line-height: 20px; white-space: nowrap; background: var(--bg); min-width: 0; }
.select:hover { background: var(--hover); }
.select .v { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.select.route { width: clamp(200px, 14vw, 264px); font-weight: 500; }
.select.route .v { flex: 1; text-align: left; }
.select .chev { color: var(--fg); opacity: .8; }
.nav-btns { display: inline-flex; gap: 2px; }
.nav-btns .icon-btn { width: 28px; height: 28px; }
.nav-btns .icon-btn[disabled] { opacity: .35; cursor: default; background: none; }
.avatars { display: flex; }
.avatars span { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--bg); margin-right: -8px; display: grid; place-items: center; font-size: 9px; font-weight: 600; color: #fff; }
.avatars span:last-child { margin-right: 0; }
.btn { height: 32px; padding-inline: 10px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn.secondary { background: var(--muted); }
.btn.secondary:hover { background: var(--border); }
.btn.primary { background: var(--primary); color: var(--primary-fg); }
.btn.primary:hover { opacity: .9; }
.tb-right { gap: 14px; flex: none; }
.tb-right .btns { display: flex; gap: 8px; }
.swap { animation: swap .16s ease-out; }
@keyframes swap { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }


/* Settings: the toolkit SettingsShell (full page at /settings/:page). 252px rail with Back to Design, search, and
   groups Account · Design · Connections · Agent · Organization; an 824px column under a sticky 60px header. */
.settings { position: fixed; inset: 36px 0 0 0; z-index: 45; background: var(--bg); display: grid; grid-template-columns: 252px minmax(0, 1fr); font-size: 13px; line-height: 20px; }
.settings[hidden] { display: none; }
.st-rail { background: var(--sidebar, var(--muted)); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 8px 24px; display: flex; flex-direction: column; }
.st-back { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; font-weight: 500; color: var(--muted-fg); }
.st-back:hover { background: var(--hover); color: var(--fg); }
.st-search { margin: 8px 0 4px; height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--muted-fg); }
.st-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.st-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; color: var(--fg); }
.st-search input::-webkit-search-cancel-button { display: none; }
.st-glabel { margin: 14px 8px 4px; font-size: 11.5px; line-height: 16px; color: var(--muted-fg); font-weight: 500; }
.st-item { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; font-weight: 500; text-align: left; width: 100%; }
.st-item:hover { background: var(--hover); }
.st-item[aria-current="page"] { background: var(--selected, var(--hover)); }
.st-item svg.i { width: 16px; height: 16px; flex: none; }
.st-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); margin-left: auto; }
.st-hit { display: flex; gap: 8px; padding: 6px 8px; border-radius: 6px; text-align: left; width: 100%; }
.st-hit:hover, .st-hit[aria-selected="true"] { background: var(--hover); }
.st-hit small { display: block; color: var(--muted-fg); font-size: 12px; line-height: 16px; }
.st-main { overflow-y: auto; position: relative; }
.st-col { max-width: 824px; margin: 0 auto; padding: 4px 32px 112px; }
.st-head { position: sticky; top: 0; z-index: 2; height: 60px; display: flex; align-items: center; gap: 8px; background: var(--bg); font-size: 14px; font-weight: 500; }
.st-head .crumb { color: var(--muted-fg); }
.st-head .grow { flex: 1; }
.st-head .badge, .st-sec-h .badge, .st-row .badge { font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted-fg); font-weight: 500; }
.st-agent { position: absolute; top: 14px; right: 14px; z-index: 3; }
.st-sec { margin-top: 20px; }
.st-sec-h { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-weight: 600; }
.st-card { border: 1px solid var(--border); border-radius: 10px; }
.st-row { min-height: 56px; display: flex; align-items: center; gap: 16px; padding: 10px 16px; }
.st-row + .st-row { border-top: 1px solid var(--border); }
.st-row .lt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.st-row .lt b { font-weight: 500; display: flex; align-items: center; gap: 8px; }
.st-row .lt small { color: var(--muted-fg); font-size: 12px; line-height: 16px; }
.st-row .rt { flex: none; display: flex; align-items: center; gap: 8px; }
.st-row .ico { width: 32px; height: 32px; border-radius: 8px; background: var(--muted); display: grid; place-items: center; flex: none; }
.st-row.flash { animation: stflash 1.2s ease-out; }
@keyframes stflash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
.st-btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.st-btn:hover { background: var(--hover); }
.st-btn.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
.st-btn.danger { color: hsl(0 72% 51%); }
.st-sel { height: 32px; min-width: 160px; max-width: 280px; padding: 0 8px 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; }
.st-sel span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-in { height: 32px; width: 240px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font: inherit; color: var(--fg); }
.st-in:focus, .st-area:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.st-in.num { width: 96px; }
.st-sw { width: 36px; height: 20px; border-radius: 10px; background: var(--border); position: relative; flex: none; transition: background .15s; }
.st-sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / 20%); transition: transform .15s; }
.st-sw[aria-checked="true"] { background: var(--primary); }
.st-sw[aria-checked="true"]::after { transform: translateX(16px); }
.st-link { color: var(--fg); font-weight: 500; display: inline-flex; align-items: center; gap: 2px; }
.st-link:hover { text-decoration: underline; text-underline-offset: 3px; }
.st-copy { display: flex; gap: 8px; }
.st-copy input { width: 320px; font: 12px/16px var(--mono); }
.st-empty { padding: 32px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.st-empty b { font-weight: 500; }
.st-empty small { color: var(--muted-fg); font-size: 12px; line-height: 16px; max-width: 420px; }
.st-empty .st-btn { margin-top: 8px; }
.st-intro, .st-foot { color: var(--muted-fg); }
.st-foot { margin-top: 24px; font-size: 12px; }
.st-foot button { color: var(--fg); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
.st-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.st-tile { border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; gap: 12px; align-items: flex-start; text-align: left; }
.st-tile:hover { background: var(--hover); }
.st-tile .tn { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.st-tile .tn b { font-weight: 500; }
.st-tile .tn small { color: var(--muted-fg); font-size: 12px; line-height: 16px; }
.st-more { margin-top: 8px; color: var(--muted-fg); font-weight: 500; }
.st-more:hover { color: var(--fg); }
.st-hosts { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 12px; }
.st-hosts button { height: 28px; padding: 0 10px; border-radius: 8px; color: var(--muted-fg); font-weight: 500; }
.st-hosts button[aria-pressed="true"] { background: var(--muted); color: var(--fg); }
.st-steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.st-cmd { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 8px; background: var(--muted); font: 12px/16px var(--mono); margin-top: 8px; }
.st-cmd code { flex: 1; min-width: 0; word-break: break-all; }
.st-area { width: 100%; min-height: 96px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font: inherit; color: var(--fg); resize: vertical; }

.st-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.st-chart { height: 120px; display: flex; align-items: flex-end; gap: 4px; padding: 16px; }
.st-chart span { flex: 1; background: var(--accent); opacity: .75; border-radius: 3px 3px 0 0; }

.st-av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 600; flex: none; }
.st-new { font-size: 10px; line-height: 14px; font-weight: 600; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }

/* canvas */
/* The dock is positioned against the canvas viewport, never the scrolling content, so short pages don't pull it up. */
.canvas { grid-row: 2; grid-column: 3; background: var(--canvas); position: relative; overflow: hidden; min-width: 0; }
.canvas-scroll { position: absolute; inset: 0; overflow: auto; }
/* Bottom room = toolbar 48 + 8 above + 8 below, so the last content scrolls clear of it. */
.canvas-inner { padding: 64px 28px 64px; display: flex; justify-content: center; min-width: max-content; }
.frame-label { position: absolute; transform: translateY(-20px); font-size: 11px; color: var(--muted-fg); display: flex; gap: 6px; }
.page { width: 863px; background: var(--page-bg); color: var(--page-fg); position: relative; transform-origin: top center; }
.interact .page { cursor: default; }
.page [data-node], .page-thumb [data-node] { position: relative; }
.page-thumb { background: var(--page-bg); color: var(--page-fg); }
.page.show-grids::after { content: ""; position: absolute; inset: 0 56px; pointer-events: none; z-index: 2; background: repeating-linear-gradient(90deg, hsl(0 85% 60% / 0.10) 0 calc((100% - 11 * 24px) / 12), transparent calc((100% - 11 * 24px) / 12) calc((100% - 11 * 24px) / 12 + 24px)); }
.design .page [data-node]:hover { outline: 1px solid var(--accent); outline-offset: 0; }
.page [data-node].sel { outline: 1.5px solid var(--accent) !important; outline-offset: 0; }
.page .sel-tag, .page .sel-size { letter-spacing: 0; text-transform: none; text-align: left; }
.page .sel-tag { position: absolute; left: -1px; top: -18px; height: 16px; padding-inline: 4px; background: var(--accent); color: #fff; font: 500 10px/16px var(--font); border-radius: 3px 3px 0 0; white-space: nowrap; pointer-events: none; }
.page .sel-size { position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%); height: 16px; padding-inline: 4px; background: var(--accent); color: #fff; font: 500 10px/16px var(--font); border-radius: 3px; white-space: nowrap; pointer-events: none; }
.page.scheme-dark { --page-fg: hsl(0 0% 95%); --page-muted: hsl(0 0% 64%); --page-card: hsl(0 0% 12%); --page-bg: hsl(0 0% 7%); }
.page.scheme-dark .p-btn { border-color: hsl(0 0% 22%); }
.page.scheme-dark .p-card { background: var(--page-card); }
.page.scheme-dark .p-btn.dark { background: hsl(0 0% 96%); color: hsl(0 0% 8%); border-color: hsl(0 0% 96%); }
.page.scheme-dark .p-code { background: hsl(0 0% 9%); border-color: hsl(0 0% 20%); color: hsl(0 0% 85%); }
.page.scheme-dark .p-cmd code { border-color: hsl(0 0% 22%); color: hsl(0 0% 85%); }
.p-nav { display: flex; align-items: center; justify-content: space-between; padding: 20px var(--space-page, 56px); font-size: 13px; }
.p-nav .links { display: flex; gap: 20px; color: var(--page-muted); }
.p-nav .links a { color: inherit; text-decoration: none; cursor: pointer; }
.p-nav .links a:hover { color: var(--page-fg); }
.p-logo { font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.p-hero { padding: 40px var(--space-page, 56px) var(--space-section, 64px); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.p-pill { height: 26px; padding-inline: 12px; border-radius: var(--radius-pill, 13px); background: var(--page-card); font-size: 12px; display: inline-flex; align-items: center; color: var(--page-muted); }
.p-h1 { font-size: 76px; line-height: 1.04; font-weight: var(--font-weight-display, 700); letter-spacing: var(--tracking-display, -0.035em); font-family: var(--font-display, var(--font)); margin: 0; text-wrap: balance; max-width: 700px; }
.p-sub { font-size: 17px; line-height: 1.35; color: var(--page-muted); max-width: 760px; margin: 0; text-wrap: balance; }
.p-ctas { display: flex; gap: 16px; }
.p-btn { height: 46px; padding-inline: 24px; border-radius: var(--radius-button, 23px); font-size: 16px; display: inline-flex; align-items: center; border: 1px solid #e5e5e5; color: var(--page-fg); background: var(--page-bg); }
.p-btn.dark { background: var(--color-primary, #171717); color: var(--color-on-primary, #fff); border-color: var(--color-primary, #171717); }
.interact .p-btn:hover { filter: brightness(.94); }
.p-cmd { display: flex; gap: 16px; align-items: center; }
.p-cmd code { height: 40px; padding-inline: 16px; border-radius: 20px; border: 1px solid #e5e5e5; display: inline-flex; align-items: center; gap: 12px; font: 14px var(--font); color: #333; }
.p-cmd code b { color: var(--page-muted); font-weight: 400; }
.p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 0 var(--space-page, 56px) var(--space-page, 56px); }
.p-card { background: var(--color-surface, var(--page-card)); border-radius: var(--radius-card, 24px); padding: var(--space-card, 32px); box-shadow: var(--shadow-card, none); display: flex; flex-direction: column; gap: 14px; min-height: 260px; }
.p-eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--page-muted); }
.p-card h3 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -0.015em; }
.p-card p { margin: 0; color: var(--page-muted); font-size: 15px; line-height: 1.4; }
.p-code { background: #fff; border: 1px solid #ececec; border-radius: 12px; padding: 14px; font: 12px/1.6 var(--mono); color: #333; }
.p-code .s { color: var(--color-link, #0a6bd6); }
.p-docs { padding: 56px; display: flex; flex-direction: column; gap: 16px; min-height: 640px; }
.p-docs h2 { font-size: 40px; letter-spacing: -0.03em; margin: 0; }
.p-docs .toc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.p-docs .toc div { background: var(--page-card); border-radius: 16px; padding: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }

/* floating dock: fixed dark chrome. Split buttons: 32px tool, 1px gap, 16px chevron, each with its own hover/pressed fill. */
.dock { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: var(--dock); color: var(--dock-fg); border-radius: 12px; padding: 8px; display: flex; gap: 2px; box-shadow: 0 2px 3px rgb(0 0 0 / 22%); z-index: 5; }
.split { display: grid; grid-template-columns: 32px 16px; column-gap: 1px; height: 32px; }
.split.solo { grid-template-columns: 32px; }
.split button { height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--dock-fg); }
.split .main:hover, .split .chev:hover { background: var(--dock-hover); }
.split .chev { color: var(--dock-muted); }
.split .chev:hover, .split .chev[aria-expanded="true"] { color: var(--dock-fg); }
.split .chev[aria-expanded="true"] { background: var(--dock-pressed); }
.split .main[aria-pressed="true"] { background: var(--accent); }
.split .main[aria-pressed="true"]:hover { background: var(--accent-hover); }
.dock-menu { position: absolute; bottom: calc(100% + 4px); background: var(--dock-menu); color: var(--dock-fg); border-radius: 12px; padding: 8px; min-width: 168px; box-shadow: 0 8px 24px rgb(0 0 0 / 28%); z-index: 6; animation: swap .12s ease-out; }
.dock-menu button { width: 100%; height: 28px; padding-inline: 8px; display: grid; grid-template-columns: 12px 16px 1fr auto; align-items: center; column-gap: 10px; border-radius: 6px; font-size: 13px; text-align: left; white-space: nowrap; }
.dock-menu button:hover, .dock-menu button:focus-visible { background: var(--accent); outline: none; }
.dock-menu button:hover .kbd, .dock-menu button:focus-visible .kbd { color: var(--dock-fg); }
.dock-menu .kbd { color: var(--dock-muted); font-size: 12px; padding-left: 16px; }
.dock-menu hr { border: 0; border-top: 1px solid rgb(255 255 255 / 10%); margin: 6px -8px; }

/* inspector */
.insp { grid-row: 2; grid-column: 4; border-left: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--bg); }
.no-inspector .insp { border-left: 0; }
.insp-tabs { height: 40px; padding: 8px 8px 0; flex: none; display: flex; align-items: center; }
.insp-tabs .seg button { padding-inline: 6px; }
.insp-scroll { flex: 1; min-height: 0; overflow: auto; }
.g5 { display: grid; grid-template-columns: 88px 8px 88px 8px 32px; align-items: center; }
.g5 > .c1 { grid-column: 1; } .g5 > .c3 { grid-column: 3; } .g5 > .c5 { grid-column: 5; justify-self: center; }
.g5 > .c13 { grid-column: 1 / 4; } .g5 > .c15 { grid-column: 1 / 6; } .g5 > .c35 { grid-column: 3 / 6; }
.sel-head { padding: 0 8px; border-bottom: 1px solid var(--border); }
.sel-head .g { display: grid; grid-template-columns: 160px 64px; height: 32px; align-items: center; }
.sel-head .nm { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0; }
.sel-head .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail2 { display: grid; grid-template-columns: 32px 32px; justify-items: center; }
.state { padding: 8px; }
.state button { width: 100%; height: 24px; border-radius: 6px; background: var(--muted); display: flex; align-items: center; justify-content: space-between; padding-inline: 8px; font-size: 11px; font-weight: 600; }
.psec { box-shadow: inset 0 1px 0 var(--border); padding-inline: 8px; }
.psec-h { height: 40px; display: grid; grid-template-columns: 1fr auto; align-items: center; }
.psec-h .t { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; height: 16px; text-align: left; }
.psec-h .t .chev { width: 12px; display: grid; place-items: center; color: var(--muted-fg); }
.psec-h .t .chev svg { transition: transform .12s; }
.psec-h .t[aria-expanded="false"] .chev svg { transform: rotate(-90deg); }
.psec-h .acts { display: grid; grid-auto-flow: column; grid-auto-columns: 32px; justify-items: center; }
.psec-b { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }
.psec.empty .psec-b { display: none; }
.field { display: flex; flex-direction: column; gap: 4px; }
.flabel { font-size: 10px; line-height: 12px; color: var(--muted-fg); height: 12px; }
.inp { height: 24px; border-radius: 6px; background: var(--muted); display: flex; align-items: center; min-width: 0; overflow: hidden; border: 1px solid transparent; }
.inp:hover { border-color: var(--border); }
.inp:focus-within { border-color: var(--accent); }
.inp .pre { width: 24px; height: 22px; display: grid; place-items: center; color: var(--muted-fg); font-size: 11px; font-weight: 500; flex: none; cursor: ew-resize; }
.inp input { flex: 1; min-width: 0; height: 22px; border: 0; background: none; font-size: 11px; padding: 0 6px 0 0; outline: none; font-variant-numeric: tabular-nums; }
.inp .post { width: 20px; height: 22px; display: grid; place-items: center; color: var(--muted-fg); flex: none; }
.inp.sel { justify-content: space-between; padding-inline: 6px 4px; font-size: 11px; cursor: pointer; }
.segc { height: 24px; border-radius: 6px; background: var(--muted); display: flex; overflow: hidden; }
.segc button { flex: 1; display: grid; place-items: center; color: var(--muted-fg); min-width: 24px; border-radius: 6px; }
.segc button:hover { color: var(--fg); }
.segc button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: inset 0 0 0 1px var(--border); }
.segc.disabled button { opacity: .4; pointer-events: none; }
.swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--border); flex: none; margin-left: 6px; }
.fillrow { display: grid; grid-template-columns: 160px 32px 32px; align-items: center; justify-items: center; }
.fillrow .inp { width: 160px; gap: 6px; justify-self: start; }
.fillrow .inp .hex { flex: 1; text-align: left; text-transform: uppercase; font-size: 11px; }
.fillrow .inp .pct { color: var(--muted-fg); font-size: 11px; padding-right: 8px; }
.wide-btn { height: 24px; border-radius: 6px; background: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; font-weight: 500; width: 100%; }
.wide-btn:hover { background: var(--border); }
.export-row { display: grid; grid-template-columns: 72px 1fr 1fr; gap: 4px; }
.disclose { display: inline-flex; align-items: center; gap: 4px; color: var(--muted-fg); font-size: 10px; height: 16px; }
.show-spec .psec-b > .g5, .show-spec .psec-b > .fillrow { background: linear-gradient(90deg, var(--spec-grid) 0 88px, transparent 88px 96px, var(--spec-grid) 96px 184px, transparent 184px 192px, var(--spec-grid) 192px 224px); outline: 1px dashed var(--spec-line); }
.show-spec .psec-h { background: linear-gradient(var(--spec-grid), var(--spec-grid)) no-repeat right center / 64px 24px; }
.show-spec .psec-b { box-shadow: inset 0 -12px 0 var(--spec-grid); }

.comments { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.comment { border-radius: 8px; padding: 10px; background: var(--muted); display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 16px; }
.comment .who { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.comment .who span.d { width: 16px; height: 16px; border-radius: 50%; }
.comment .when { color: var(--muted-fg); font-weight: 400; margin-left: auto; font-size: 11px; }

/* interact-mode inspector */
.int-panel { display: flex; flex-direction: column; }
.int-panel .note { color: var(--muted-fg); font-size: 11px; line-height: 16px; padding: 8px 8px 12px; }


/* keyboard shortcuts window: a modal, not a bottom drawer. Search + category rail + one scrolling list. */
.ks { width: min(760px, 100%); height: min(640px, calc(100vh - 32px)); background: var(--popover); color: var(--fg); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
/* shadcn Dialog: title row with the close button, then content. Search is content, in its own row. */
.ks-h { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; height: 52px; border-bottom: 1px solid var(--border); }
.ks-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ks-search { height: 32px; margin-bottom: 8px; flex: none; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; gap: 8px; padding: 0 4px 0 10px; color: var(--muted-fg); }
.ks-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ks-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 13px; color: var(--fg); }
.ks-search input::-webkit-search-cancel-button { display: none; }
.ks-search .ks-clear { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--muted-fg); flex: none; }
.ks-search .ks-clear:hover { background: var(--hover); color: var(--fg); }
.ks-row mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.ks-b { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 0; }
.ks-nav { border-right: 1px solid var(--border); padding: 8px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.ks-cats { display: flex; flex-direction: column; gap: 2px; }
.ks-cats button { height: 28px; padding: 0 8px; border-radius: 6px; text-align: left; font-size: 13px; color: var(--muted-fg); }
.ks-cats button:hover { background: var(--hover); color: var(--fg); }
.ks-cats button[aria-current="true"] { background: var(--hover); color: var(--fg); font-weight: 500; }
.ks-list { overflow: auto; padding: 0 16px 16px; scroll-padding-top: 8px; }
.ks-sec h3 { position: sticky; top: 0; margin: 0; padding: 16px 0 6px; background: var(--popover); font-size: 12px; font-weight: 600; color: var(--muted-fg); z-index: 1; }
.ks-row { height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-radius: 6px; padding: 0 8px; margin: 0 -8px; font-size: 13px; }
.ks-row:hover { background: var(--hover); }
.ks-row .l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ks-row .ctx { color: var(--muted-fg); font-size: 12px; margin-left: 6px; }
.ks-keys { display: flex; align-items: center; gap: 6px; flex: none; }
.ks-combo { display: inline-flex; gap: 3px; }
.kc { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--border); border-bottom-width: 2px; background: var(--bg); display: inline-grid; place-items: center; font: 500 11px/1 var(--font); color: var(--fg); }
.ks-or { color: var(--muted-fg); font-size: 11px; }
.ks-nudge { display: flex; align-items: center; gap: 8px; padding: 8px 0 4px; font-size: 13px; color: var(--muted-fg); }
.ks-nudge label { display: inline-flex; align-items: center; gap: 6px; }
.ks-nudge input { width: 44px; height: 24px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); padding: 0 6px; font-size: 12px; text-align: right; }
.ks-empty { padding: 40px 0; text-align: center; color: var(--muted-fg); font-size: 13px; }
@media (max-width: 640px) { .ks-b { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } .ks-nav { border-right: 0; padding-bottom: 0; } .ks-cats { display: none; } }


/* Version history: today's HistoryPanel.tsx. A modal shadcn Sheet from the right, 92vw up to 640px. */
.hs-scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 50%); z-index: 85; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
.hs { position: fixed; top: 0; right: 0; bottom: 0; width: min(92vw, 640px); background: var(--bg); border-left: 1px solid var(--border); box-shadow: var(--shadow); z-index: 86; display: flex; flex-direction: column; animation: slidein .3s ease-out; }
@keyframes slidein { from { transform: translateX(100%); } }
.hs-h { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; min-height: 49px; }
.hs-h .ic-accent { color: var(--accent); }
.hs-back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted-fg); }
.hs-back:hover { color: var(--fg); }
.hs-x { position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; opacity: .7; }
.hs-x:hover { opacity: 1; }
.hs-list { flex: 1; overflow: auto; padding: 8px; }
.hs-item { width: 100%; border-radius: 6px; padding: 10px 12px; text-align: left; display: flex; gap: 12px; align-items: flex-start; }
.hs-item:hover { background: var(--hover); }
.hs-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }
.hs-item .tt { min-width: 0; flex: 1; }
.hs-item .tl { display: flex; align-items: center; gap: 8px; }
.hs-item b { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hs-item small { font-size: 10px; color: var(--muted-fg); flex: none; }
.hs-item .when { font-size: 11px; color: var(--muted-fg); margin-top: 2px; }
.hs-meta { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.hs-meta b { display: block; font-size: 14px; font-weight: 500; }
.hs-meta span { display: block; font-size: 11px; color: var(--muted-fg); margin-top: 2px; }
.hs-grid { flex: 1; overflow: auto; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
.hs-thumb { min-width: 0; }
.hs-thumb .frame { aspect-ratio: 16 / 9; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; position: relative; background: var(--page-bg); }
.hs-thumb .frame > div { position: absolute; left: 0; top: 0; width: 863px; transform-origin: top left; pointer-events: none; }
.hs-thumb > .fname { margin: 6px 0 0; font-size: 11px; color: var(--muted-fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hs-foot { border-top: 1px solid var(--border); padding: 12px; }
.hs-foot .btn { width: 100%; height: 32px; justify-content: center; border-radius: 6px; font-size: 14px; }
.hs-empty { padding: 56px 24px; text-align: center; color: var(--muted-fg); }
.hs-empty b { display: block; color: var(--fg); font-size: 14px; font-weight: 500; margin-top: 12px; }

/* history mode */
.history-mode .dock { display: none; }
.page.readonly, .page.readonly * { cursor: default !important; }
.tl-h { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 5px 0 16px; border-bottom: 1px solid var(--border); flex: none; }
.tl-h b { font-size: 12px; font-weight: 600; }
.tl-h .acts { display: flex; gap: 0; }
.tl { flex: 1; min-height: 0; overflow: auto; padding: 8px 8px 16px; position: relative; }
.tl-node { position: relative; width: 100%; display: grid; grid-template-columns: 24px 1fr; column-gap: 8px; padding: 6px 8px; border-radius: 6px; text-align: left; }
.tl-node:hover { background: var(--hover); }
.tl-node.on { background: var(--accent-row); }
/* the connecting line runs through the node column */
.tl-node::before { content: ""; position: absolute; left: 19px; top: 0; bottom: 0; width: 1px; background: var(--border); }
.tl > .tl-node:first-of-type::before, .tl > .tl-form + .tl-node::before { top: 50%; }
.tl > :last-child.tl-node::before, .tl > .tl-group:last-child > .tl-node:last-child::before { bottom: calc(100% - 18px); }
.tl-dot { position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--muted); color: var(--fg); }
.tl-dot.k-current { background: var(--accent); color: #fff; }
.tl-dot.k-named { background: var(--bg); box-shadow: inset 0 0 0 1px var(--border); }
.tl-dot.k-restore { background: var(--bg); box-shadow: inset 0 0 0 1px var(--border); }
.tl-dot.k-auto { background: transparent; color: var(--muted-fg); }
.tl-node.small { padding-block: 2px; }
.tl-node.small .tl-dot { width: 24px; height: 20px; background: transparent; }
.tl-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
.tl-body b { font-size: 12px; font-weight: 500; line-height: 16px; overflow: hidden; text-overflow: ellipsis; }
.tl-node.current b { color: var(--accent); }
.tl-node.small b { font-weight: 400; }
.tl-note, .tl-when { font-size: 11px; line-height: 16px; color: var(--muted-fg); }
.tl-author { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-fg); }
.tl-author .av16 { width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 600; display: grid; place-items: center; flex: none; }
.tl-empty { margin: 12px 8px 0 40px; font-size: 11px; color: var(--muted-fg); }
.tl-form { display: flex; flex-direction: column; gap: 8px; padding: 8px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; }
.tl-form input, .tl-form textarea { border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font: 12px/16px var(--font); padding: 4px 8px; color: var(--fg); resize: none; }
.tl-form input { height: 24px; }
.tl-form input:focus, .tl-form textarea:focus { outline: none; border-color: var(--accent); }
.tl-form-acts { display: flex; justify-content: flex-end; gap: 8px; }
.tl-form-acts .btn { height: 24px; font-size: 12px; padding-inline: 8px; border-radius: 6px; }
.history-mode .insp { display: flex; flex-direction: column; }
.hist-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.hist-tag svg { color: var(--accent); }
.hist-view { font-size: 12px; color: var(--muted-fg); white-space: nowrap; }

/* tokens panel (TokensPanel.tsx), on the shared 16px row strip */
.tk-count { flex: 1; min-width: 0; font-size: 12px; color: var(--muted-fg); }
/* Search swaps in for the whole header line; the field's own 8px padding keeps the icon on the 16px inset. */
.sec-head.searching { padding: 0 8px; }

.tk-search { flex: 1; min-width: 0; height: 32px; margin-left: -8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; gap: 6px; padding: 0 4px 0 7px; color: var(--muted-fg); }
.tk-search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tk-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 12px; color: var(--fg); }
.tk-search .kbd { padding-right: 4px; }

.tk-search .tk-clear:hover { background: var(--hover); color: var(--fg); }
.row.tk .tk-sw { width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%); position: relative; overflow: hidden; }
.row.tk .tk-sw input { position: absolute; inset: -4px; width: 24px; height: 24px; opacity: 0; cursor: pointer; }
.row.tk .tk-glyph { color: var(--muted-fg); }
.row.tk .tk-val { margin-left: 8px; font: 11px/16px var(--mono); color: var(--muted-fg); max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none; text-align: right; }

.row.tk input.tk-edit { margin-left: 8px; width: 104px; height: 20px; border: 1px solid var(--accent); border-radius: 4px; background: var(--bg); font: 11px/16px var(--mono); padding: 0 4px; color: var(--fg); flex: none; }
.row.tk .tk-src { display: none; margin-left: 6px; font-size: 10px; color: var(--muted-fg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; line-height: 14px; flex: none; }
.row.tk:hover .tk-src { display: inline-block; }
.tk-form { margin: 8px 16px; display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 8px; }
.tk-form label { display: flex; flex-direction: column; gap: 4px; font-size: 10px; color: var(--muted-fg); }
.tk-form input, .tk-form textarea { height: 24px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font: 11px/16px var(--mono); padding: 0 6px; color: var(--fg); }
.tk-form textarea { height: 88px; padding: 4px 6px; resize: none; }
.tk-form input:focus, .tk-form textarea:focus { outline: none; border-color: var(--accent); }
.tk-form .acts { display: flex; justify-content: flex-end; gap: 8px; }
.tk-form .btn { height: 24px; font-size: 12px; padding-inline: 8px; border-radius: 6px; }
.dtcg { margin: 0; max-height: 360px; overflow: auto; background: var(--muted); border-radius: 8px; padding: 12px; font: 11px/16px var(--mono); }
.row.tk.draft input { height: 20px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); font: 11px/16px var(--mono); padding: 0 4px; color: var(--fg); }
.row.tk.draft input:focus { outline: none; border-color: var(--accent); }
.row.tk.draft .tk-dname { flex: 1; min-width: 0; }
.row.tk.draft .tk-edit { width: 80px; }
.tk-empty .btn { height: 28px; font-size: 13px; border-radius: 8px; }
.btn.agent { color: hsl(262 70% 52%); background: color-mix(in srgb, hsl(262 70% 52%) 8%, transparent); }
.btn.agent:hover { background: color-mix(in srgb, hsl(262 70% 52%) 14%, transparent); }
.btn[disabled] { opacity: .5; cursor: default; }
.tk-empty .acts { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
.tk-empty { padding: 32px 16px; text-align: center; color: var(--muted-fg); font-size: 11px; line-height: 16px; }
.tk-empty b { display: block; color: var(--fg); font-size: 12px; font-weight: 500; margin-bottom: 4px; }

/* menus: Nova dropdown. Full-bleed 28px rows, no inner padding, dividers edge to edge. */
.menu { position: fixed; z-index: 50; background: var(--popover); border: 1px solid var(--border); border-radius: 10px; min-width: 151px; box-shadow: var(--shadow); font-size: 13px; overflow: hidden; animation: swap .12s ease-out; }

.menu .field-row { padding: 8px 8px; border-bottom: 1px solid var(--border); }
.menu .field-row input { width: 100%; height: 28px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); padding-inline: 8px; font-size: 13px; }

/* Top bar test (2026-10-01): every control at the 24px design-system default, ui/control text 12/16.
   Edge padding follows the edge content: 8px beside text, 4px beside a 16px glyph ((24 - 16) / 2). */
.topbar .seg { padding: 2px; border-radius: 8px; }
.topbar .seg button { height: 20px; padding-inline: 8px; border-radius: 6px; font-size: 12px; line-height: 16px; }
.topbar .select { height: 24px; min-height: 24px; padding: 0 4px 0 8px; gap: 4px; border-radius: 6px; font-size: 12px; line-height: 16px; }
.topbar .select > svg.i:first-child { margin-left: -5px; }
.topbar .select .chev { width: 16px; height: 16px; }
.topbar .select.route { font-weight: 500; }
.topbar .nav-btns .icon-btn, .topbar .icon-btn { width: 24px; height: 24px; border-radius: 6px; }
.topbar .btn { height: 24px; padding-inline: 8px; gap: 4px; border-radius: 6px; font-size: 12px; line-height: 16px; }
.topbar .btn svg.i { width: 16px; height: 16px; }
.topbar .bsplit .btn { border-radius: 6px 0 0 6px; }
.topbar .bsplit .btn + .btn { border-radius: 0 6px 6px 0; width: 20px; padding: 0; }
.topbar .bsplit .btn + .btn svg.i { width: 12px; height: 12px; }
.topbar .avatars span { width: 20px; height: 20px; }
.topbar .tb-zone { gap: 8px; }
.topbar #review-changes { height: 24px !important; font-size: 12px !important; border-radius: 6px !important; }

/* split buttons in the top bar: one control, 1px seam */
.bsplit { display: inline-flex; gap: 1px; }
.bsplit .btn { border-radius: 10px 0 0 10px; }
.bsplit .btn + .btn { border-radius: 0 10px 10px 0; width: 28px; padding: 0; justify-content: center; }
.bsplit .btn[aria-expanded="true"] { filter: brightness(.92); }
.btn.primary + .btn.primary { box-shadow: none; }

/* comments panel + canvas pins */
.rail-item .ib { position: relative; }
.rail-item .badge { position: absolute; top: -3px; right: -5px; min-width: 14px; height: 14px; padding-inline: 3px; border-radius: 7px; background: var(--accent); color: #fff; font-size: 9px; font-weight: 600; line-height: 14px; text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.row .av16 { width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 600; display: grid; place-items: center; }
.row.resolved .label { color: var(--muted-fg); }
.cm-actions { padding: 8px 16px 4px; }
/* canvas comments: Figma 1205:2267 (card), 1259:23236 (mentions); pills collapse a thread to its people */
#cm-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
#cm-layer > * { pointer-events: auto; }
.cm-pill { position: absolute; height: 28px; padding: 2px; border-radius: 14px 14px 14px 4px; background: var(--popover); box-shadow: 0 2px 8px rgb(0 0 0 / 18%), 0 0 0 1px rgb(0 0 0 / 4%); display: inline-flex; align-items: center; font: 600 11px/1 var(--font); color: var(--fg); transition: transform .12s; }
.cm-pill:hover { transform: translateY(-1px); }
.cm-pill.on { box-shadow: 0 0 0 2px var(--accent), 0 2px 8px rgb(0 0 0 / 18%); }
.cm-pill .pav { width: 24px; height: 24px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 10px; box-shadow: 0 0 0 2px var(--popover); }
.cm-pill .pav + .pav { margin-left: -8px; }
.cm-pill .n { padding: 0 6px 0 5px; }
.av16.img, .cav.img, .pav.img, .mav.img { background: transparent; overflow: hidden; }
.img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.img.plate { background: #fff; padding: 3px; }
.cmc { position: absolute; width: 360px; background: var(--popover); color: var(--fg); border-radius: 12px; box-shadow: 0 4px 10px rgb(0 0 0 / 15%), 0 0 0 1px rgb(0 0 0 / 4%); display: flex; flex-direction: column; font-size: 14px; line-height: 20px; }
.cmc-h { height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 12px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 600; }

.icon-btn.cb28 { width: 28px; height: 28px; border-radius: 8px; }
.icon-btn.cb28.round { border-radius: 14px; }
.cmc-body { max-height: 360px; overflow: auto; }
.cmc-msg { padding: 12px 12px 0; display: flex; flex-direction: column; gap: 4px; }
.cmc-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px; }
.cmc-meta b { font-weight: 600; }
.cmc-meta .when { color: var(--muted-fg); }
.cav { width: 24px; height: 24px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 600; flex: none; }
.agent-badge { height: 20px; padding: 0 8px; border: 1px solid var(--border); border-radius: 6px; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; color: var(--muted-fg); margin-left: -6px; }
.cmc-text { display: flex; gap: 4px; padding-left: 32px; align-items: flex-start; }
.cmc-text p { margin: 0; flex: 1; min-width: 0; }
.cmc-react { width: 28px; height: 28px; border-radius: 8px; opacity: 0; margin-top: -4px; }
.cmc-msg:hover .cmc-react, .cmc-react:focus-visible { opacity: 1; }
.cmc-reacts { padding-left: 32px; display: flex; gap: 4px; }
.react-chip { height: 22px; min-width: 32px; padding: 0 8px; border-radius: 6px; background: var(--muted); display: inline-grid; place-items: center; font-size: 12px; }
.mention { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--popover); font-weight: 600; font-size: 13px; vertical-align: middle; line-height: 1; }

.cmc-input { min-height: 40px; padding: 10px 40px 10px 12px; outline: none; font-size: 14px; line-height: 20px; }
.cmc-input:empty::before { content: attr(data-ph); color: var(--muted-fg); }
.cmc-tools { display: none; align-items: center; justify-content: space-between; padding: 8px; border-top: 1px solid var(--border); }
.cmc-tools .l { display: flex; gap: 4px; }
.cmc-send { width: 22px; height: 22px; border-radius: 11px; background: var(--primary); color: var(--primary-fg); display: grid; place-items: center; opacity: .5; }

.cmc-composer.open .cmc-send.mini { display: none; }
.mention-pop { position: absolute; left: 44px; right: 12px; bottom: calc(100% - 12px); background: var(--popover); border: 1px solid var(--border); border-radius: 10px; padding: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 10%), 0 2px 4px -2px rgb(0 0 0 / 10%); z-index: 2; }
.mention-pop button { width: 100%; display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; text-align: left; }
.mention-pop button[aria-selected="true"], .mention-pop button:hover { background: var(--hover); }

.comment-tool .page, .comment-tool .page * { cursor: crosshair !important; }

/* agents panel */
.agents { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.ag-head { height: 48px; flex: none; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 16px; }
/* The back glyph sits on the 16px inset: the button's (32 - 16) / 2 padding is pulled back out. */
.ag-head .back { margin-left: -8px; flex: none; }
.row .unread-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; margin-left: 8px; }
.ag-head .thread { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; height: 24px; text-align: left; }
.ag-head .thread span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag-head .thread svg { color: var(--muted-fg); }
.row .kbd { color: var(--muted-fg); font-size: 11px; margin-left: 8px; flex: none; }
.row.skill .ico { color: var(--fg); }
.ag-body { flex: 1; min-height: 0; overflow: auto; }
.chat { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; font-size: 12px; line-height: 18px; }
.msg-user { align-self: flex-end; max-width: 90%; background: var(--muted); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.skill-chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding-inline: 6px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); font-size: 11px; font-weight: 500; align-self: flex-start; }
.step { display: flex; gap: 8px; align-items: center; color: var(--muted-fg); }

@keyframes spin { to { transform: rotate(360deg); } }
.result { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.result .rh { padding: 8px 10px; font-weight: 600; border-bottom: 1px solid var(--border); }

.result .ra { display: flex; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--border); }
.result .ra .btn { height: 24px; font-size: 12px; border-radius: 6px; padding-inline: 8px; }
.composer { flex: none; margin: 8px; border: 1px solid var(--border); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.composer .ctx { display: flex; gap: 4px; flex-wrap: wrap; }
.composer .ctx span { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding-inline: 6px; border-radius: 6px; background: var(--muted); font-size: 11px; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.composer { position: relative; }
.composer .ask-input { font: 12px/18px var(--font); color: var(--fg); outline: none; min-height: 36px; max-height: 160px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }

.composer .skill-ref svg.i { width: 12px; height: 12px; }
/* "/" reuses the mention picker (toolkit MentionPopover, default density): icon, name, description truncated, full text in the tooltip. */
.mention-pop.slash { left: 0; right: 0; bottom: calc(100% + 4px); padding: 4px; max-height: 240px; overflow-y: auto; }
.mention-pop.slash button { min-height: 32px; gap: 8px; padding: 4px 8px; border-radius: 6px; font-size: 13px; line-height: 16px; }
.mention-pop.slash button svg.i { width: 16px; height: 16px; color: var(--muted-fg); flex: none; }
.mention-pop.slash .nm { font-weight: 500; white-space: nowrap; }

function updateBadge() { const n = CTHREADS.filter(t => !t.resolved).length; const b = $("#cm-badge"); b.textContent = n; b.hidden = !n; }

// The Threads panel is a finder. Opening a row shows the thread on the canvas.
function renderComments() {
  updateBadge();
  const el = $("#comments"); if (S.panel !== "comments") return;
  // Search and filters follow ReviewCommentsPanel: body text of every message; resolved, yours, unread, current page; date or unread order.
  const q = CM.q.trim().toLowerCase(), plain = m => m.text.replace(/<[^>]+>/g, "");
  const list = CTHREADS.filter(t => (CM.resolved || !t.resolved) && (!CM.mine || t.msgs.some(m => m.who === "Shawn")) && (!CM.unread || t.unread) && (!CM.page || t.screen === S.route) && (!q || t.msgs.map(plain).join(" ").toLowerCase().includes(q)))
    .sort((a, b) => CM.sort === "unread" ? (!!b.unread - !!a.unread) : 0);
  const filtered = q || CM.mine || CM.unread || CM.page;
  const head = CM.searching || CM.q ? searchHead("cm-q", "Search comments", CM.q) : `<div class="ag-head"><span class="tk-count">${list.length} thread${list.length === 1 ? "" : "s"}</span>
    <button class="icon-btn" id="cm-search" title="Search comments  ⌘F">${ic("search")}</button>
    <button class="icon-btn" id="cm-filter" title="Filter comments" aria-haspopup="menu" aria-expanded="false" aria-pressed="${!!(CM.resolved || CM.mine || CM.unread || CM.page)}">${ic("filter-2")}</button>
    <button class="icon-btn" id="cm-new" title="Add comment  C" aria-pressed="${S.tool === "comment"}">${ic("plus")}</button></div>`;
  const groups = ROUTES.map(r => [r, list.filter(t => t.screen === r.path)]).filter(([, l]) => l.length);
  const body = (S.scenario === "feedback" && !filtered ? `<div class="cm-actions"><button class="wide-btn" id="apply-feedback" style="height:28px;font-size:12px">${ic("sparkles", "s14")}Apply feedback (${CTHREADS.filter(t => !t.resolved).length})</button></div>` : "") +
    (groups.length ? groups.map(([r, l], gi) => `<div class="sec-head ${gi ? "rule" : ""}"><span class="sec-toggle" style="cursor:default"><span class="chev"></span>${r.screen} <span class="muted" style="font-weight:400;margin-left:4px">${r.path}</span></span></div>
      <div class="sec-block">${l.map(t => { const m = t.msgs[0]; return `<div class="row ${t.resolved ? "resolved" : ""}" data-cthread="${t.id}" role="button" tabindex="0" aria-selected="${S.cmOpen === t.id}"><span class="slot ico">${av(m.who)}</span><span class="gap"></span><span class="label">${m.text.replace(/<[^>]+>/g, "")}</span><span class="kbd">${t.msgs.length > 1 ? t.msgs.length + " · " : ""}${t.msgs[t.msgs.length - 1].when}</span></div>`; }).join("")}</div>`).join("")
      : `<div class="cm-actions muted" style="padding-top:16px">${filtered ? "No comments match." : "No review comments yet."}</div>`);
  el.innerHTML = head + `<div class="ag-body">${body}</div>`;
  focusPanelSearch(CM, "cm-q");
}

/* canvas layer: avatar pills + the open thread card; lives outside the zoom transform so it never scales */
function layer() {
  let l = $("#cm-layer");
  if (!l) { l = document.createElement("div"); l.id = "cm-layer"; $("#page").parentElement.append(l); }
  return l;
}
function anchorRect(node) {
  const el = document.querySelector(`.page [data-node="${node}"]`); if (!el) return null;
  const w = $("#page").parentElement.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { left: r.left - w.left, top: r.top - w.top, right: r.right - w.left, bottom: r.bottom - w.top };
}
function renderPins() {
  const l = layer();
  if (H.active) { l.innerHTML = ""; return; }
  const draftEl = l.querySelector(".cmc [contenteditable]");
  const keepDraft = draftEl && document.activeElement === draftEl ? draftEl.innerHTML : null;
  l.innerHTML = "";
  if (S.showPins !== false) CTHREADS.filter(t => !t.resolved && t.screen === S.route).forEach(t => {
    const a = anchorRect(t.node); if (!a) return;
    const who = authors(t);
    const p = document.createElement("button");
    p.className = "cm-pill" + (S.cmOpen === t.id ? " on" : ""); p.dataset.pin = t.id;
    p.setAttribute("aria-label", `Comment by ${t.msgs[0].who}, ${t.msgs.length} message${t.msgs.length > 1 ? "s" : ""}`);
    p.innerHTML = who.slice(0, 3).map(w => av(w, "pav")).join("") + (t.msgs.length > 1 ? `<span class="n">${t.msgs.length}</span>` : "");
    p.style.left = (a.right - 12) + "px"; p.style.top = (a.top - 14) + "px";
    l.append(p);
  });
  const t = S.cmOpen != null ? CTHREADS.find(x => x.id === S.cmOpen) : null;
  const d = S.cmDraft;
  if ((t && t.screen === S.route) || (d && d.screen === S.route)) {
    const a = anchorRect((t || d).node); if (!a) return;
    const card = document.createElement("div"); card.className = "cmc"; card.setAttribute("role", "dialog"); card.setAttribute("aria-label", "Comment");
    card.innerHTML = cardHTML(t, d);
    l.append(card);
    // To the right of the pill; flip to the pill's left when it would leave the canvas.
    const view = $("#canvas").getBoundingClientRect(), w = $("#page").parentElement.getBoundingClientRect();
    let left = a.right + 20, top = a.top - 14;
    if (w.left + left + 360 > view.right - 8) left = Math.max(a.right - 12 - 8 - 360, view.left - w.left + 8);
    card.style.left = left + "px"; card.style.top = Math.max(top, view.top - w.top + 8) + "px";
    const ed = card.querySelector("[contenteditable]");
    if (keepDraft != null) { ed.innerHTML = keepDraft; expandComposer(card); placeCaret(ed); }
    else if (d) { expandComposer(card); ed.focus(); }
  }
}

    <div class="cmc-text"><p>${m.text}</p><button class="icon-btn cmc-react" title="Add reaction" data-toast="Opens the emoji picker">${ic("mood-smile")}</button></div>
    ${m.react ? `<div class="cmc-reacts">${m.react.map(r => `<span class="react-chip">${r}</span>`).join("")}</div>` : ""}</div>`;
}

        <button class="cmc-send" id="cmc-send" aria-label="Send">${ic("arrow-up", "s12")}</button></div>
