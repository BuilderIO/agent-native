<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #222;
      }
      /* Verbatim from templates/slides/app/global.css (autofit block). */
      .fmd-autofit-scale {
        transform-origin: top left;
      }
      .fmd-autofit-scale[data-fmd-autofit-active] {
        transform: translate(var(--fmd-fit-x, 0px), var(--fmd-fit-y, 0px))
          scale(var(--fmd-fit-scale, 1));
      }
      .fmd-slide > [data-fmd-autofit-content] {
        width: 100%;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: inherit;
        align-items: inherit;
      }
      /* SlideRenderer's `layoutClasses.blank` = "flex flex-col" + sizeStyle. */
      .slide-canvas {
        display: flex;
        flex-direction: column;
      }
      .h-full {
        height: 100%;
      }
      .w-full {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="./dom-to-pptx.bundle.js"></script>
    <script src="./jszip.min.js"></script>
    <script src="./xp.js"></script>
    <script>
      window.__mount = function (slideHtml, id) {
        const stage = document.getElementById("stage");
        stage.innerHTML = "";
        const canvas = document.createElement("div");
        canvas.className = "slide-canvas";
        canvas.setAttribute("data-slide-canvas", id);
        canvas.style.width = "960px";
        canvas.style.height = "540px";
        const autofitRoot = document.createElement("div");
        autofitRoot.setAttribute("data-slide-autofit-root", "true");
        autofitRoot.className = "fmd-autofit-scale h-full w-full";
        autofitRoot.innerHTML = slideHtml;
        canvas.appendChild(autofitRoot);
        stage.appendChild(canvas);
        // SlideRenderer.ensureRawHtmlFitLayers, verbatim behaviour.
        for (const slide of canvas.querySelectorAll(".fmd-slide")) {
          const existing = Array.from(slide.children).find((c) =>
            c.hasAttribute("data-fmd-autofit-content"),
          );
          if (existing) continue;
          const layer = document.createElement("div");
          layer.setAttribute("data-fmd-autofit-content", "true");
          layer.className = "fmd-autofit-scale";
          const kids = Array.from(slide.childNodes).filter(
            (c) => !(c.nodeType === 1 && c.tagName.toLowerCase() === "style"),
          );
          for (const k of kids) layer.appendChild(k);
          slide.appendChild(layer);
        }
        return canvas;
      };
    </script>
  </body>
</html>
