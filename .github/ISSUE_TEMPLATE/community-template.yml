name: Submit a community app
description: Propose a public Agent-Native app for the community marketplace.
title: "Community app: "
labels:
  - community-template
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your app. Community apps are maintained by their authors and listed separately from Agent-Native's first-party apps.

  - type: input
    id: name
    attributes:
      label: App name
      placeholder: Customer Support Hub
    validations:
      required: true

  - type: input
    id: app_url
    attributes:
      label: App URL
      description: Link to the hosted app, a public preview, or the project landing page.
      placeholder: https://example.com
    validations:
      required: true

  - type: input
    id: repository
    attributes:
      label: GitHub repository (optional)
      description: Add the public repository so people can inspect and customize the app.
      placeholder: https://github.com/owner/repository

  - type: textarea
    id: description
    attributes:
      label: What does it do?
      description: In two or three sentences, explain the workflow and who it is for.
    validations:
      required: true

  - type: input
    id: maintainer
    attributes:
      label: Maintainer or support link (optional)
      description: Link to the maintainer profile, support page, or repository support instructions.
      placeholder: https://github.com/owner

  - type: input
    id: license
    attributes:
      label: License (optional)
      description: If a repository is included, name its open-source license.
      placeholder: MIT

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot URLs (optional)
      description: Add one public image URL per line. These become the gallery on the app page.
      placeholder: |
        https://example.com/screenshot-1.png
        https://example.com/screenshot-2.png

  - type: checkboxes
    id: readiness
    attributes:
      label: Submission checklist
      options:
        - label: The app URL is public and the submission does not include secrets or private customer data.
          required: true
        - label: Any linked repository is public, licensed, and safe for reviewers to inspect.
          required: true
        - label: I ran the app's documented install, typecheck, and test steps when a repository is included.
          required: true
        - label: I understand this remains a community-maintained app and is not supported as a first-party Agent-Native app.
          required: true
