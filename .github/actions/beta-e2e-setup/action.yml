name: Beta E2E setup
description: >-
  Toolchain, dependencies, and Chromium for a beta E2E lane. Shared because the
  suite is sharded across many runners, so this preamble runs in every shard.
  Typechecking and the helper unit tests are deliberately not here: the
  workflow's `gate` job runs them once instead of once per shard.

  Callers must run actions/checkout first: a local composite action cannot
  check out the repository that contains it, because it is not on disk until
  checkout has run.

inputs:
  browser:
    description: Install Playwright Chromium. Set "false" for jobs that never open a browser.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # The suite imports only @playwright/test, node built-ins, and one plain
    # TypeScript file from packages/core/src/shared. It needs neither the
    # workspace package build chain nor any package postinstall, so skip them
    # (the full install's postinstall is most of its cost).
    - uses: ./.github/actions/setup-pnpm
      with:
        install: no-scripts

    - name: Restore Playwright browser cache
      if: ${{ inputs.browser == 'true' }}
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: playwright-${{ runner.os }}-

    - name: Install Playwright Chromium
      if: ${{ inputs.browser == 'true' }}
      run: pnpm exec playwright install --only-shell chromium
      shell: bash
