name: Set up the Clips desktop build
description: >-
  Installs what a Clips desktop build needs on this runner: the workspace,
  the Linux system libraries, Rust for the requested target, and on macOS
  that target's ffmpeg sidecar. The build check and the release both use it,
  so a toolchain change that would break the release fails the check first.
  Requires actions/checkout to have already run.

inputs:
  target:
    description: >-
      Rust target to build. Required on macOS, where each architecture
      builds on its own runner: aarch64-apple-darwin or x86_64-apple-darwin.
      Empty builds for the runner's own platform.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check the macOS target
      if: runner.os == 'macOS'
      shell: bash
      run: |
        case "${{ inputs.target }}" in aarch64-apple-darwin|x86_64-apple-darwin) ;; *)
          echo "::error::setup-clips-desktop: macOS needs target aarch64-apple-darwin or x86_64-apple-darwin (got '${{ inputs.target }}')"; exit 1;;
        esac

    - name: Set the macOS deployment target
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
        echo "GGML_METAL_MACOSX_VERSION_MIN=13.0" >> "$GITHUB_ENV"

    - uses: ./.github/actions/setup-pnpm
      with:
        native-canvas-deps: "false"

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          libfuse2 \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-libav \
          gstreamer1.0-pipewire

    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        targets: ${{ inputs.target }}

    - name: Link Apple compiler runtime for Rust
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Xcode emits __isPlatformVersionAtLeast for the macOS 15 checks in
        # transcribe-cpp-sys's arm64 Metal backend. Rust's final link does not
        # add compiler-rt.
        CLANG_RUNTIME="$(xcrun --sdk macosx clang -print-libgcc-file-name)"
        echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=${CLANG_RUNTIME}" >> "$GITHUB_ENV"

    # After RUSTFLAGS is set: the cache key includes it. The shared key drops
    # the job name, which kept the daily check from ever feeding a release,
    # and names the target, which the runner's OS and CPU in the key do not.
    # Only main saves: a release runs on its clips-v tag and a pull request on
    # its merge ref, and only later runs of that same ref can read a cache
    # saved there, so it never hits and only evicts the ones that would.
    - name: Rust cache
      uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      with:
        workspaces: templates/clips/desktop/src-tauri
        shared-key: ${{ inputs.target && format('clips-desktop-{0}', inputs.target) || 'clips-desktop' }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # The prepare script pins the FFmpeg tag, checksum and configure line, so
    # its hash covers everything that changes the binary. It verifies a cached
    # build before staging it.
    - name: Restore the ffmpeg sidecar build
      id: ffmpeg-cache
      if: runner.os == 'macOS'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: templates/clips/desktop/src-tauri/binaries/.cache
        key: clips-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('templates/clips/desktop/scripts/prepare-ffmpeg-sidecar.ts') }}

    - name: Install NASM for x86_64 ffmpeg sidecar
      if: runner.os == 'macOS' && inputs.target == 'x86_64-apple-darwin' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
      shell: bash
      run: if ! command -v nasm >/dev/null 2>&1; then brew install nasm; fi

    # Tauri's build script checks the target's externalBin exists, so cargo
    # needs the sidecar before it compiles, not only the bundle.
    - name: Prepare the macOS ffmpeg sidecar
      if: runner.os == 'macOS'
      working-directory: templates/clips/desktop
      shell: bash
      env:
        CLIPS_FFMPEG_TARGET_TRIPLE: ${{ inputs.target }}
      run: pnpm run prepare:ffmpeg

    - name: Save the ffmpeg sidecar build
      if: runner.os == 'macOS' && github.ref == 'refs/heads/main' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: templates/clips/desktop/src-tauri/binaries/.cache
        key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
