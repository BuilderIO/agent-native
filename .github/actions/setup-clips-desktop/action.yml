name: Set up the Clips desktop build
description: >-
  Installs what a Clips desktop build needs on this runner: the workspace,
  the Linux system libraries, Rust with the requested targets, and on macOS
  the universal ffmpeg sidecar. The build check and the release both use it,
  so a toolchain change that would break the release fails the check first.
  Requires actions/checkout to have already run.

inputs:
  rust-targets:
    description: >-
      Extra Rust targets, comma-separated. The universal macOS build needs
      aarch64-apple-darwin and x86_64-apple-darwin.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set the macOS deployment target
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "MACOSX_DEPLOYMENT_TARGET=13.0" >> "$GITHUB_ENV"
        echo "GGML_METAL_MACOSX_VERSION_MIN=13.0" >> "$GITHUB_ENV"

    - uses: ./.github/actions/setup-pnpm
      with:
        native-canvas-deps: "false"

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          libfuse2 \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-libav \
          gstreamer1.0-pipewire

    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        targets: ${{ inputs.rust-targets }}

    - name: Link Apple compiler runtime for Rust
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Xcode emits __isPlatformVersionAtLeast for the macOS 15 checks in
        # transcribe-cpp-sys's arm64 Metal backend. Rust's final link does not
        # add compiler-rt.
        CLANG_RUNTIME="$(xcrun --sdk macosx clang -print-libgcc-file-name)"
        echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=${CLANG_RUNTIME}" >> "$GITHUB_ENV"

    # After RUSTFLAGS is set: the cache key includes it. The shared key drops
    # the job name, which kept the daily check from ever feeding a release.
    # Only main saves: a release runs on its clips-v tag and a pull request on
    # its merge ref, and only later runs of that same ref can read a cache
    # saved there, so it never hits and only evicts the ones that would.
    - name: Rust cache
      uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      with:
        workspaces: templates/clips/desktop/src-tauri
        shared-key: clips-desktop
        save-if: ${{ github.ref == 'refs/heads/main' }}

    # The prepare script pins the FFmpeg tag, checksum and configure line, so
    # its hash covers everything that changes the binary. It verifies a cached
    # build before staging it.
    - name: Restore the ffmpeg sidecar build
      id: ffmpeg-cache
      if: runner.os == 'macOS'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: templates/clips/desktop/src-tauri/binaries/.cache
        key: clips-ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('templates/clips/desktop/scripts/prepare-ffmpeg-sidecar.ts') }}

    - name: Install NASM for x86_64 ffmpeg sidecar
      if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
      shell: bash
      run: if ! command -v nasm >/dev/null 2>&1; then brew install nasm; fi

    # Tauri's build script checks the macOS externalBin exists, so cargo test
    # needs the native sidecar too, not only the bundle.
    - name: Prepare the universal macOS ffmpeg sidecar
      if: runner.os == 'macOS'
      working-directory: templates/clips/desktop
      shell: bash
      run: |
        CLIPS_FFMPEG_TARGET_TRIPLE=aarch64-apple-darwin pnpm run prepare:ffmpeg
        CLIPS_FFMPEG_TARGET_TRIPLE=x86_64-apple-darwin pnpm run prepare:ffmpeg
        cd src-tauri
        lipo -create \
          binaries/ffmpeg-aarch64-apple-darwin \
          binaries/ffmpeg-x86_64-apple-darwin \
          -output binaries/ffmpeg-universal-apple-darwin
        chmod +x binaries/ffmpeg-universal-apple-darwin
        lipo binaries/ffmpeg-universal-apple-darwin -verify_arch arm64 x86_64

    - name: Save the ffmpeg sidecar build
      if: runner.os == 'macOS' && github.ref == 'refs/heads/main' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: templates/clips/desktop/src-tauri/binaries/.cache
        key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
