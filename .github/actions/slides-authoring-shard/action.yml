name: Run a Slides authoring shard
description: >-
  Install the browsers one Slides rich-text authoring shard needs and run its
  checks. Shared by the PR job in ci.yml and the nightly run on main, so the
  two cannot drift apart. The caller checks out the repo and runs setup-pnpm.

inputs:
  shard:
    description: One of chromium-authoring, corpus-and-firefox, or webkit.
    required: true

runs:
  using: composite
  steps:
    - name: Restore Playwright browser cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: playwright-${{ runner.os }}-

    - name: Install Playwright browsers
      shell: bash
      run: |
        case "${{ inputs.shard }}" in
          chromium-authoring) browsers="chromium" ;;
          corpus-and-firefox) browsers="chromium firefox" ;;
          webkit) browsers="webkit" ;;
          *) echo "::error::Unknown Slides authoring shard: ${{ inputs.shard }}"; exit 1 ;;
        esac
        # apt-get has stalled for the whole 45-minute job budget on the mirror
        # list fetch (run 39816497341), so cap each attempt and retry.
        install_with_retry() {
          for attempt in 1 2 3; do
            if timeout -k 10 300 "$@"; then return 0; fi
            echo "::warning::'$*' failed or stalled (attempt $attempt of 3)"
            sudo dpkg --configure -a || true
          done
          return 1
        }
        for browser in $browsers; do
          if [ "$browser" = chromium ]; then
            # The runner image already carries Chromium's system libraries, so
            # skip --with-deps: it re-runs apt-get on every job.
            install_with_retry pnpm exec playwright install --only-shell chromium
          else
            install_with_retry pnpm exec playwright install --with-deps "$browser"
          fi
        done

    # Every command below would otherwise boot its own scratch dev server, which
    # took 90-160s each on a CI runner. run.ts reuses SLIDES_BASE_URL when set.
    - name: Start one Slides dev server for the shard
      shell: bash
      run: |
        log="$RUNNER_TEMP/slides-shared-server.log"
        pnpm exec tsx scripts/claude-launch.ts \
          --name slides-edit-fidelity --dir templates/slides \
          --env AUTH_MODE=local --env AUTH_DISABLED=true \
          -- dev --port 8099 --inspect=0 > "$log" 2>&1 &
        echo "$!" > "$RUNNER_TEMP/slides-shared-server.pid"
        for _ in $(seq 1 240); do
          if ! kill -0 "$(cat "$RUNNER_TEMP/slides-shared-server.pid")" 2>/dev/null; then
            echo "::error::Slides dev server exited before it was ready"
            cat "$log"
            exit 1
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8099/ || true)"
          if [ -n "$status" ] && [ "$status" -ge 100 ] && [ "$status" -lt 500 ]; then
            echo "SLIDES_BASE_URL=http://localhost:8099" >> "$GITHUB_ENV"
            echo "Slides dev server ready (HTTP $status)"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Slides dev server did not answer within 240s"
        cat "$log"
        exit 1

    - name: Check IME Escape preserves inline slide text editing
      if: inputs.shard == 'chromium-authoring'
      shell: bash
      working-directory: templates/slides
      run: pnpm exec tsx scripts/edit-fidelity/run.ts --ime-escape

    - name: Check mobile PowerPoint import pending status
      if: inputs.shard == 'chromium-authoring'
      shell: bash
      working-directory: templates/slides
      run: pnpm exec tsx scripts/edit-fidelity/run.ts --mobile-import-status

    - name: Check typing fidelity across Slides text surfaces in Chromium
      if: inputs.shard == 'chromium-authoring'
      shell: bash
      working-directory: templates/slides
      run: pnpm exec tsx scripts/edit-fidelity/run.ts --text-surface-qa

    - name: Check typing fidelity across Slides text surfaces in WebKit
      if: inputs.shard == 'webkit'
      shell: bash
      working-directory: templates/slides
      run: pnpm exec tsx scripts/edit-fidelity/run.ts --text-surface-qa --browser webkit

    - name: Check rich-text authoring parity in Slides
      if: inputs.shard == 'chromium-authoring'
      shell: bash
      working-directory: templates/slides
      run: pnpm exec tsx scripts/edit-fidelity/run.ts --authoring

    - name: Check rich-text authoring parity in Slides WebKit
      if: inputs.shard == 'webkit'
      shell: bash
      working-directory: templates/slides
      run: pnpm exec tsx scripts/edit-fidelity/run.ts --authoring --browser webkit

    - name: Check rich-text authoring against the committed corpus
      if: inputs.shard == 'corpus-and-firefox'
      shell: bash
      working-directory: templates/slides
      run: pnpm exec tsx scripts/edit-fidelity/run.ts --authoring-corpus

    - name: Run deterministic authoring smoke in Chromium
      if: inputs.shard == 'corpus-and-firefox'
      shell: bash
      working-directory: templates/slides
      run: >-
        pnpm exec tsx scripts/edit-fidelity/run.ts --authoring-fuzz
        --seed 16 --steps 80 --browser chromium

    - name: Run absolute-layout authoring smoke in Chromium
      if: inputs.shard == 'corpus-and-firefox'
      shell: bash
      working-directory: templates/slides
      run: >-
        pnpm exec tsx scripts/edit-fidelity/run.ts --authoring-fuzz
        --seed 2 --steps 80 --browser chromium

    - name: Run deterministic authoring smoke in WebKit
      if: inputs.shard == 'webkit'
      shell: bash
      working-directory: templates/slides
      env:
        SLIDES_AUTHORING_FUZZ_TRACE: "1"
      run: >-
        pnpm exec tsx scripts/edit-fidelity/run.ts --authoring-fuzz
        --seed 16 --steps 80 --browser webkit

    - name: Run deterministic authoring smoke in Firefox
      if: inputs.shard == 'corpus-and-firefox'
      shell: bash
      working-directory: templates/slides
      env:
        SLIDES_AUTHORING_FUZZ_TRACE: "1"
      run: >-
        pnpm exec tsx scripts/edit-fidelity/run.ts --authoring-fuzz
        --seed 16 --steps 80 --browser firefox

    - name: Stop the shared Slides dev server
      if: always()
      shell: bash
      run: |
        if [ -f "$RUNNER_TEMP/slides-shared-server.pid" ]; then
          kill "$(cat "$RUNNER_TEMP/slides-shared-server.pid")" 2>/dev/null || true
        fi
        if [ "${{ job.status }}" != success ] && [ -f "$RUNNER_TEMP/slides-shared-server.log" ]; then
          tail -n 200 "$RUNNER_TEMP/slides-shared-server.log"
        fi
