name: QA live verify
run-name: QA live verify ${{ inputs.ref || inputs.target || 'forms-seeded' }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Preset (forms-seeded), app name, or JSON {app, ref, path, write, steps, cleanup}"
        default: "forms-seeded"
      provider:
        description: "Browser provider"
        type: choice
        options: [browserbase, local]
        default: browserbase
      slot:
        description: "QA user slot (1-5)"
        default: "1"
      auth:
        description: "Authentication mode for the QA account"
        type: choice
        options: [legacy-password, qa-email-link]
        default: legacy-password
      ref:
        description: "Label for the receipt and run name, e.g. a PR or job ref"
        default: ""
      host:
        description: "Target host"
        default: "labs.agent-native.com"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
      MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      QA_TARGET: ${{ inputs.target || 'forms-seeded' }}
      QA_PROVIDER: ${{ inputs.provider || 'browserbase' }}
      QA_VERIFY_AUTH: ${{ inputs.auth || 'legacy-password' }}
      QA_SLOT: ${{ inputs.slot || '1' }}
      QA_HOST: ${{ inputs.host || 'labs.agent-native.com' }}
      QA_REF: ${{ inputs.ref }}
      QA_OUT_DIR: artifacts/qa-live-verify
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install Playwright
        run: npm install --prefix e2e/labs --no-save --no-package-lock --ignore-scripts @playwright/test@1.63.0
      - name: Install Chromium
        if: env.QA_PROVIDER == 'local'
        run: npx --prefix e2e/labs playwright install --with-deps chromium
      - name: Verify live
        run: node e2e/labs/qa-live-verify.ts
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qa-live-verify
          path: artifacts/qa-live-verify
          if-no-files-found: error
