name: Mirror CI service images

# Copies the Postgres service images CI uses into GHCR. Docker Hub limits
# anonymous pulls per runner IP, and that limit fails jobs while their service
# containers start, before any step runs. Jobs pull from the mirror instead.
# This job logs in to Docker Hub first: a step can authenticate, and service
# containers cannot, so the copy is the one place that needs credentials.

on:
  push:
    paths:
      - ".github/workflows/mirror-ci-service-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror Postgres service images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Log in to Docker Hub
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as repository secrets (a Docker Hub account and a read-only access token). Anonymous pulls are rate-limited on GitHub runners."
            exit 1
          fi
          printf '%s' "${{ secrets.DOCKERHUB_TOKEN }}" | docker login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Copy images with retries
        run: |
          set -euo pipefail
          registry=ghcr.io/builderio/agent-native-ci-postgres
          source=docker.io/library
          for image in postgres:17-alpine postgres:18-alpine; do
            tag="${image#postgres:}"
            for attempt in 1 2 3 4 5; do
              if docker buildx imagetools create --tag "$registry:$tag" "$source/$image"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::could not copy $image after 5 attempts"
                exit 1
              fi
              sleep $((attempt * 60))
            done
            docker buildx imagetools inspect "$registry:$tag"
          done
