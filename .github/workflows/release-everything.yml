name: 🚀 Release everything

on:
  schedule:
    - cron: "0 12 * * 1-4"
      timezone: "America/Los_Angeles"
    - cron: "0 10 * * 5"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      releaseType:
        description: Stable npm release bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: read

concurrency:
  group: release-everything
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare and merge the stable package release
    uses: ./.github/workflows/release-everything-phase.yml
    with:
      phase: prepare
      release_type: ${{ inputs.releaseType || 'patch' }}
    secrets: inherit

  post-merge-release:
    name: Publish and deploy the merged stable release
    needs: prepare-release
    if: ${{ needs.prepare-release.result == 'success' }}
    uses: ./.github/workflows/release-everything-phase.yml
    with:
      phase: post-merge
      release_type: ${{ inputs.releaseType || 'patch' }}
      release_sha: ${{ needs.prepare-release.outputs.release_sha }}
      release_pr_url: ${{ needs.prepare-release.outputs.release_pr_url }}
    secrets: inherit

  notify-failure:
    name: Notify on release failure
    needs: [prepare-release, post-merge-release]
    if: ${{ always() && (needs.prepare-release.result == 'failure' || needs.prepare-release.result == 'cancelled' || needs.post-merge-release.result == 'failure' || needs.post-merge-release.result == 'cancelled') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TYPE: ${{ inputs.releaseType || 'patch' }}
    steps:
      - name: Build the Slack failure alert
        env:
          RELEASE_ERROR: ${{ needs.prepare-release.outputs.error || needs.post-merge-release.outputs.error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          JOB_STATUS: ${{ needs.prepare-release.result }} / ${{ needs.post-merge-release.result }}
        run: |
          jq -n \
            --arg channel C0C7A1Y2EF6 \
            --arg header "<!subteam^S0C43BD9CMT> :rotating_light: *Release everything failed* ($TRIGGER, $RELEASE_TYPE release)" \
            --arg run "<$RUN_URL|Open the run>" \
            --arg reason "${RELEASE_ERROR:-No error message was captured; the job ended $JOB_STATUS (cancelled or timed out).}" \
            '{channel: $channel, text: "\($header)\n\($run)\n```\($reason)```", unfurl_links: false, unfurl_media: false}' \
            > "$RUNNER_TEMP/slack-payload.json"

      - name: Post the failure alert to #dev-agent-native-alerts
        id: slack
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.QA_SLACK_BOT_TOKEN }}
          errors: false
          payload-file-path: ${{ runner.temp }}/slack-payload.json

      - name: Say so when the Slack alert failed
        if: ${{ steps.slack.outputs.ok != 'true' }}
        env:
          SLACK_RESPONSE: ${{ steps.slack.outputs.response }}
        run: |
          reason="$(jq -r '.error // empty' <<< "${SLACK_RESPONSE:-null}" 2> /dev/null || true)"
          echo "::error::Slack alert to #dev-agent-native-alerts failed (${reason:-no response}). Invite the QA_SLACK_BOT_TOKEN bot to the channel and check the token."
