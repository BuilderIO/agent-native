name: 🚀 Release everything

on:
  schedule:
    - cron: "0 12 * * 1-4"
      timezone: "America/Los_Angeles"
    - cron: "0 10 * * 5"
      timezone: "America/Los_Angeles"
  workflow_dispatch:
    inputs:
      releaseType:
        description: Stable npm release bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: release-everything
  cancel-in-progress: false

jobs:
  release-everything:
    name: Release packages, desktop apps, and production sites
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RELEASE_TYPE: ${{ inputs.releaseType || 'patch' }}
    steps:
      - name: Release packages, then desktop apps and production sites
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        timeout-minutes: 355
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const apiVersion = "2026-03-10";
            const releaseType = process.env.RELEASE_TYPE;
            const startedAt = Date.now();
            const coordinatorDeadline = startedAt + 350 * 60_000;
            const pollIntervalMs = 15_000;
            const reservedTags = new Map();

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const phaseDeadline = (timeoutMs) =>
              Math.min(coordinatorDeadline, Date.now() + timeoutMs);

            async function readJsonAt(ref, path) {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref,
              });
              const file = response.data;
              if (Array.isArray(file) || file.type !== "file" || !file.content) {
                throw new Error(`Expected a file at ${path} on ${ref}.`);
              }
              return JSON.parse(Buffer.from(file.content, "base64").toString("utf8"));
            }

            async function dispatch(workflow, ref, inputs) {
              const response = await github.request(
                "POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches",
                {
                  owner,
                  repo,
                  workflow_id: workflow,
                  ref,
                  inputs,
                  return_run_details: true,
                  headers: {
                    accept: "application/vnd.github+json",
                    "X-GitHub-Api-Version": apiVersion,
                  },
                },
              );
              const runId = response.data?.workflow_run_id;
              if (!Number.isInteger(runId)) {
                throw new Error(
                  `GitHub did not return a workflow run id for ${workflow} (HTTP ${response.status}).`,
                );
              }
              const url = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
              core.info(`Dispatched ${workflow}: ${url}`);
              return { id: runId, url };
            }

            async function getRun(runId) {
              return (await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: runId,
              })).data;
            }

            async function listAutoPublishRuns() {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "auto-publish.yml",
                branch: "main",
                per_page: 25,
              });
              return response.data.workflow_runs;
            }

            async function waitForAutoPublishIdle(deadline) {
              while (Date.now() < deadline) {
                const activeRuns = (await listAutoPublishRuns()).filter(
                  (run) =>
                    run.status !== "completed" &&
                    run.event === "workflow_dispatch",
                );
                if (activeRuns.length === 0) return true;
                core.info(
                  `Waiting for auto-publish concurrency: ${activeRuns
                    .map((run) => `${run.id}/${run.status}`)
                    .join(", ")}`,
                );
                const remaining = deadline - Date.now();
                if (remaining <= 0) return false;
                await sleep(Math.min(pollIntervalMs, remaining));
              }
              return false;
            }

            async function listRunJobs(runId) {
              return github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: runId,
                per_page: 100,
              });
            }

            async function wasSupersededPendingRun(run, jobs) {
              if (jobs.length > 0) return false;
              const runCreatedAt = Date.parse(run.created_at || "");
              const runUpdatedAt = Date.parse(run.updated_at || "");
              if (
                !Number.isFinite(runCreatedAt) ||
                !Number.isFinite(runUpdatedAt) ||
                runUpdatedAt < runCreatedAt
              ) {
                return false;
              }
              return (await listAutoPublishRuns()).some(
                (candidate) => {
                  const candidateCreatedAt = Date.parse(candidate.created_at || "");
                  return (
                    candidate.id !== run.id &&
                    candidate.event === run.event &&
                    Number.isFinite(candidateCreatedAt) &&
                    candidateCreatedAt >= runCreatedAt &&
                    candidateCreatedAt <= runUpdatedAt
                  );
                },
              );
            }

            async function getRemoteTagSha(tag) {
              try {
                const response = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                });
                if (response.data.object.type === "tag") {
                  const annotatedTag = await github.rest.git.getTag({
                    owner,
                    repo,
                    tag_sha: response.data.object.sha,
                  });
                  return annotatedTag.data.object.sha;
                }
                return response.data.object.sha;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            async function getReleaseByTag(tag) {
              try {
                return (await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag,
                })).data;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            function parseStableVersion(value, label) {
              const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(value);
              if (!match) {
                throw new Error(`${label} has no exact stable semver: ${value}`);
              }
              return match.slice(1).map(Number);
            }

            function compareStableVersions(left, right) {
              for (let index = 0; index < left.length; index += 1) {
                if (left[index] !== right[index]) return left[index] - right[index];
              }
              return 0;
            }

            function formatStableVersion(version) {
              return version.join(".");
            }

            async function nextStableVersion(tagPrefix, baseVersion) {
              let latest = parseStableVersion(baseVersion, `${tagPrefix} base version`);
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100,
              });
              for (const release of releases) {
                if (release.draft || release.prerelease || !release.tag_name.startsWith(tagPrefix)) {
                  continue;
                }
                const version = release.tag_name.slice(tagPrefix.length);
                if (!/^\d+\.\d+\.\d+$/.test(version)) continue;
                const parsed = parseStableVersion(version, release.tag_name);
                if (compareStableVersions(parsed, latest) > 0) latest = parsed;
              }

              const candidate = [latest[0], latest[1], latest[2] + 1];
              while (await getRemoteTagSha(`${tagPrefix}${formatStableVersion(candidate)}`)) {
                candidate[2] += 1;
              }
              return formatStableVersion(candidate);
            }

            async function reserveStableVersion(tagPrefix, baseVersion, sourceSha) {
              for (let attempt = 0; attempt < 20; attempt += 1) {
                const version = await nextStableVersion(tagPrefix, baseVersion);
                try {
                  await github.rest.git.createRef({
                    owner,
                    repo,
                    ref: `refs/tags/${tagPrefix}${version}`,
                    sha: sourceSha,
                  });
                  reservedTags.set(`${tagPrefix}${version}`, sourceSha);
                  return version;
                } catch (error) {
                  if (error.status !== 422) throw error;
                  core.warning(`Stable tag ${tagPrefix}${version} was reserved concurrently; retrying.`);
                }
              }
              throw new Error(`Could not reserve a stable ${tagPrefix} version after 20 attempts.`);
            }

            async function cleanupReservedTags() {
              const cleanup = await Promise.allSettled(
                [...reservedTags].map(async ([tag, sourceSha]) => {
                  const tagSha = await getRemoteTagSha(tag);
                  if (tagSha && tagSha !== sourceSha) {
                    core.warning(`Keeping changed stable tag ${tag}; it is not owned by this run.`);
                    return;
                  }
                  const release = await getReleaseByTag(tag);
                  if (release && !release.draft) {
                    core.info(`Keeping published stable release ${tag}.`);
                    return;
                  }
                  if (release) {
                    try {
                      await github.rest.repos.deleteRelease({
                        owner,
                        repo,
                        release_id: release.id,
                      });
                    } catch (error) {
                      if (error.status !== 404) throw error;
                    }
                  }
                  try {
                    await github.rest.git.deleteRef({
                      owner,
                      repo,
                      ref: `tags/${tag}`,
                    });
                    core.info(`Removed reserved stable tag ${tag}.`);
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }),
              );
              const failures = cleanup
                .filter((result) => result.status === "rejected")
                .map((result) => result.reason instanceof Error ? result.reason.message : String(result.reason));
              if (failures.length > 0) {
                core.warning(`Could not clean up reserved stable tags:\n${failures.join("\n")}`);
              }
            }

            async function getFirstParentSha(ref) {
              const response = await github.rest.repos.getCommit({
                owner,
                repo,
                ref,
              });
              const parentSha = response.data.parents?.[0]?.sha;
              if (!parentSha) {
                throw new Error(`Release commit ${ref} has no parent commit.`);
              }
              return parentSha;
            }

            // A job cancelled before it ran a step (e.g. no runner acquired it)
            // did nothing, so re-running it cannot repeat part of a release.
            function neverStarted(job) {
              return job.conclusion === "cancelled" && (job.steps?.length ?? 0) === 0;
            }

            // With gateJob, that job alone decides the stage: the rest of the
            // run (downstream notification) is reported, never awaited.
            function judgeRun(run, jobs, gateJob) {
              if (gateJob) {
                const gate = jobs.find((job) => job.name === gateJob);
                if (gate?.conclusion === "success") {
                  return {
                    verdict: "success",
                    others: jobs.filter(
                      (job) =>
                        job !== gate &&
                        job.conclusion !== "success" &&
                        job.conclusion !== "skipped",
                    ),
                  };
                }
                if (run.status !== "completed") return { verdict: "pending", others: [] };
              } else {
                if (run.status !== "completed") return { verdict: "pending", others: [] };
                if (run.conclusion === "success") return { verdict: "success", others: [] };
              }
              const unsuccessful = jobs.filter(
                (job) => !["success", "skipped", "neutral"].includes(job.conclusion),
              );
              return {
                verdict:
                  unsuccessful.length > 0 && unsuccessful.every(neverStarted)
                    ? "rerun"
                    : "failure",
                others: unsuccessful,
              };
            }

            async function waitForRun(
              run,
              label,
              timeoutMs,
              { retryIfSupersededPending = false, gateJob } = {},
            ) {
              const deadline = phaseDeadline(timeoutMs);
              let lastStatus = "";
              let lastLoggedAt = 0;
              let rerunFromAttempt = 0;
              while (Date.now() < deadline) {
                const current = await getRun(run.id);
                const now = Date.now();
                if (
                  current.status !== lastStatus ||
                  now - lastLoggedAt >= 60_000
                ) {
                  core.info(`${label}: ${current.status}/${current.conclusion || "pending"}`);
                  lastStatus = current.status;
                  lastLoggedAt = now;
                }
                const jobs =
                  gateJob || (current.status === "completed" && current.conclusion !== "success")
                    ? await listRunJobs(run.id)
                    : [];
                const { verdict, others } =
                  current.run_attempt <= rerunFromAttempt
                    ? { verdict: "pending", others: [] }
                    : judgeRun(current, jobs, gateJob);
                if (verdict === "success") {
                  for (const job of others) {
                    if (job.status === "completed") {
                      core.warning(`${label}: ${job.name} ended ${job.conclusion}; it does not gate this stage.`);
                    } else {
                      core.info(`${label}: not waiting for ${job.name} (${job.status}).`);
                    }
                  }
                  return current;
                }
                if (verdict === "rerun" && rerunFromAttempt === 0) {
                  core.warning(
                    `${label} ended ${current.conclusion} because ${others.map((job) => job.name).join(", ")} never started; re-running once.`,
                  );
                  rerunFromAttempt = current.run_attempt;
                  await github.rest.actions.reRunWorkflowFailedJobs({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                } else if (verdict !== "pending") {
                  if (
                    retryIfSupersededPending &&
                    current.conclusion === "cancelled" &&
                    (await wasSupersededPendingRun(current, jobs))
                  ) {
                    core.warning(
                      `${label} was superseded while pending; waiting for a free slot before retrying.`,
                    );
                    return null;
                  }
                  throw new Error(
                    `${label} ended ${current.conclusion || "without a conclusion"}${rerunFromAttempt ? " after a re-run of never-started jobs" : ""}: ${run.url}`,
                  );
                }
                const remaining = deadline - Date.now();
                if (remaining <= 0) break;
                await sleep(Math.min(pollIntervalMs, remaining));
              }
              throw new Error(`${label} did not finish before the coordinator timeout: ${run.url}`);
            }

            async function listReleasePullRequests() {
              return github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "all",
                base: "main",
                per_page: 100,
              });
            }

            function isStableReleasePullRequest(pr) {
              return (
                pr.base?.ref === "main" &&
                pr.head?.ref === "changeset-release/main" &&
                typeof pr.title === "string" &&
                pr.title.includes("[stable-release]")
              );
            }

            async function waitForReleasePullRequest(previousNumbers) {
              const deadline = phaseDeadline(30 * 60_000);
              while (Date.now() < deadline) {
                const candidates = (await listReleasePullRequests())
                  .filter(isStableReleasePullRequest)
                  .filter((pr) => {
                    const updatedAt = Date.parse(pr.updated_at || "");
                    return (
                      !previousNumbers.has(pr.number) ||
                      (Number.isFinite(updatedAt) && updatedAt >= startedAt - 60_000)
                    );
                  })
                  .sort((left, right) =>
                    String(right.updated_at || "").localeCompare(String(left.updated_at || "")),
                  );
                if (candidates.length > 0) {
                  const pr = candidates[0];
                  core.info(`Found stable release PR #${pr.number}: ${pr.html_url}`);
                  return pr;
                }
                const remaining = deadline - Date.now();
                if (remaining <= 0) break;
                await sleep(Math.min(pollIntervalMs, remaining));
              }
              throw new Error("The stable package Version Packages PR was not created in time.");
            }

            async function waitForReleaseMerge(pr) {
              const deadline = phaseDeadline(45 * 60_000);
              while (Date.now() < deadline) {
                const current = (await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: pr.number,
                })).data;
                if (current.merged) {
                  // Production treats a blank source_ref as "latest main".
                  if (!/^[0-9a-f]{40}$/.test(current.merge_commit_sha || "")) {
                    throw new Error(
                      `Stable release PR #${pr.number} merged without a full commit SHA: ${current.merge_commit_sha}`,
                    );
                  }
                  core.info(`Stable release PR #${pr.number} merged at ${current.merge_commit_sha}.`);
                  return current.merge_commit_sha;
                }
                if (current.state === "closed") {
                  throw new Error(`Stable release PR #${pr.number} closed without merging: ${pr.html_url}`);
                }
                const remaining = deadline - Date.now();
                if (remaining <= 0) break;
                await sleep(Math.min(pollIntervalMs, remaining));
              }
              throw new Error(`Stable release PR #${pr.number} did not merge in time: ${pr.html_url}`);
            }

            async function waitForStablePackagePublish(mergeSha, packageTag, requireMergeTag) {
              const deadline = phaseDeadline(120 * 60_000);
              while (Date.now() < deadline) {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: "auto-publish.yml",
                  event: "push",
                  head_sha: mergeSha,
                  per_page: 100,
                });
                const run = response.data.workflow_runs.find(
                  (candidate) => candidate.event === "push" && candidate.head_sha === mergeSha,
                );
                if (run) {
                  const remaining = deadline - Date.now();
                  if (remaining <= 0) break;
                  const completed = await waitForRun(
                    {
                      id: run.id,
                      url: run.html_url,
                    },
                    "Stable npm publication",
                    remaining,
                    { gateJob: "Prepare or publish stable npm packages" },
                  );
                  const tagSha = await getRemoteTagSha(packageTag);
                  if (!tagSha || (requireMergeTag && tagSha !== mergeSha)) {
                    const tagDescription = requireMergeTag
                      ? `remote tag ${packageTag} pointing to ${mergeSha}`
                      : `remote tag ${packageTag}`;
                    throw new Error(
                      `Stable npm publication completed without ${tagDescription}: ${run.html_url}`,
                    );
                  }
                  return completed;
                }
                const remaining = deadline - Date.now();
                if (remaining <= 0) break;
                await sleep(Math.min(pollIntervalMs, remaining));
              }
              throw new Error(`Stable npm publication was not started for ${mergeSha}.`);
            }

            const previousReleaseNumbers = new Set(
              (await listReleasePullRequests())
                .filter(isStableReleasePullRequest)
                .map((pr) => pr.number),
            );

            const packagePreparationDeadline = phaseDeadline(90 * 60_000);
            let packagePreparation;
            while (Date.now() < packagePreparationDeadline) {
              const autoPublishIdle = await waitForAutoPublishIdle(packagePreparationDeadline);
              if (!autoPublishIdle || Date.now() >= packagePreparationDeadline) break;
              const dispatched = await dispatch(
                "auto-publish.yml",
                "main",
                {
                  releaseType,
                  redispatchDownstream: "false",
                },
              );
              const remaining = packagePreparationDeadline - Date.now();
              if (remaining <= 0) {
                throw new Error(
                  `Stable package release preparation dispatch exceeded the coordinator timeout: ${dispatched.url}`,
                );
              }
              const completed = await waitForRun(
                dispatched,
                "Stable package release preparation",
                remaining,
                { retryIfSupersededPending: true },
              );
              if (completed) {
                packagePreparation = completed;
                break;
              }
            }
            if (!packagePreparation) {
              throw new Error(
                "Stable package release preparation did not start before the coordinator timeout.",
              );
            }

            const releasePr = await waitForReleasePullRequest(previousReleaseNumbers);
            const releaseSha = await waitForReleaseMerge(releasePr);
            const releaseBaseSha = await getFirstParentSha(releaseSha);
            const initialCorePackage = await readJsonAt(
              releaseBaseSha,
              "packages/core/package.json",
            );
            const corePackage = await readJsonAt(
              releaseSha,
              "packages/core/package.json",
            );
            const stableVersion = (value, label) => {
              parseStableVersion(value, label);
              return value;
            };
            const coreVersion = stableVersion(corePackage.version, "Core package");
            const packageRef = `@agent-native/core@${coreVersion}`;
            const coreVersionChanged = initialCorePackage.version !== corePackage.version;
            // workflow_dispatch accepts a branch or tag, not a raw commit SHA.
            // Use main for the workflow definition when an unchanged package tag
            // predates the coordinated source_ref input. Every build still checks
            // out the exact release commit below.
            const workflowRef = coreVersionChanged ? packageRef : "main";
            let publicationError = null;
            try {
              await waitForStablePackagePublish(releaseSha, packageRef, coreVersionChanged);
            } catch (error) {
              publicationError = error instanceof Error ? error : new Error(String(error));
              core.error(
                `${publicationError.message}\nProduction sites still release from ${releaseSha}; desktop apps are skipped.`,
              );
            }

            const sitesManifest = await readJsonAt(
              releaseSha,
              "scripts/netlify-production-sites.json",
            );
            const productionSites = Object.entries(sitesManifest)
              .filter(([, site]) =>
                typeof site?.host === "string" && site.host.endsWith(".agent-native.com"),
              )
              .map(([name]) => name);
            if (productionSites.length === 0) {
              throw new Error("The production site manifest contains no *.agent-native.com sites.");
            }

            let desktopVersion;
            let clipsVersion;
            if (!publicationError) {
              const desktopPackage = await readJsonAt(
                releaseSha,
                "packages/desktop-app/package.json",
              );
              const clipsPackage = await readJsonAt(
                releaseSha,
                "templates/clips/desktop/package.json",
              );
              try {
                // Private desktop packages do not advance in the npm release commit.
                desktopVersion = await reserveStableVersion(
                  "v",
                  stableVersion(desktopPackage.version, "Desktop app"),
                  releaseSha,
                );
                clipsVersion = await reserveStableVersion(
                  "clips-v",
                  stableVersion(clipsPackage.version, "Clips desktop app"),
                  releaseSha,
                );
              } catch (error) {
                await cleanupReservedTags();
                throw error;
              }
              core.info(`Selected stable desktop versions: v${desktopVersion}, clips-v${clipsVersion}.`);
            }

            // Downstream workflows own these reserved tags after dispatch.
            // Sites build from the release commit, not from npm, so a failed
            // publication skips only the desktop apps. The package tag may not
            // exist then, so the fleet's workflow definition comes from main.
            const [production, desktop, clips] = await Promise.all([
              dispatch("deploy-production-sites-prebuilt.yml", publicationError ? "main" : workflowRef, {
                sites: productionSites.join(","),
                source_ref: releaseSha,
                beta_e2e: "false",
                smoke: "true",
              }),
              publicationError
                ? null
                : dispatch("desktop-release.yml", workflowRef, {
                    channel: "production",
                    version: desktopVersion,
                    source_ref: releaseSha,
                  }),
              publicationError
                ? null
                : dispatch("clips-desktop-release.yml", workflowRef, {
                    channel: "production",
                    version: clipsVersion,
                    source_ref: releaseSha,
                  }),
            ]);

            const stages = [
              ["Production site fleet", production],
              ["Agent-Native desktop stable release", desktop],
              ["Clips desktop stable release", clips],
            ];
            const downstream = await Promise.allSettled(
              stages.map(([label, run]) => run && waitForRun(run, label, 120 * 60_000)),
            );
            const failures = publicationError ? [publicationError.message] : [];
            const outcomes = downstream.map((result, index) => {
              if (!stages[index][1]) return "skipped: stable npm publication failed";
              if (result.status === "fulfilled") return "released";
              failures.push(result.reason instanceof Error ? result.reason.message : String(result.reason));
              return "failed";
            });

            const summary = core.summary
              .addHeading("Release everything")
              .addTable([
                ["Target", "Result"],
                ["npm packages", publicationError ? "failed" : `${releaseType} release published`],
                ["Production sites", `${outcomes[0]}: ${productionSites.length} *.agent-native.com apps`],
                ["Agent-Native desktop", desktop ? `${outcomes[1]}: stable v${desktopVersion}` : outcomes[1]],
                ["Clips desktop", clips ? `${outcomes[2]}: stable v${clipsVersion}` : outcomes[2]],
                ["Source commit", releaseSha],
              ])
              .addLink("Package release PR", releasePr.html_url);
            for (const [label, run] of stages) {
              if (run) summary.addBreak().addLink(`${label} run`, run.url);
            }
            await summary.write();

            if (failures.length > 0) {
              throw new Error(`Release everything had failures:\n${failures.join("\n")}`);
            }
            core.info(`Release everything completed from ${releaseBaseSha} through ${releaseSha}.`);
