name: Desktop App Release
run-name: >-
  ${{ github.event.inputs.coordinator_run_id && format('{0} ({1}) [release:{2}]', github.workflow, github.event.inputs.mode, github.event.inputs.coordinator_run_id) || '' }}

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-release.yml"
      - ".github/actions/build-agent-native-desktop/**"
      - "packages/desktop-app/**"
      - "packages/shared-app-config/**"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: production
        type: choice
        options:
          - production
          - nightly
      version:
        description: "Stable version to release (e.g. 0.2.0). Required for production; Nightly may use the package.json version."
        required: false
        type: string
      source_ref:
        description: "Exact source commit to build for a coordinated release"
        required: false
        type: string
      mode:
        description: "release builds and publishes; stage builds into the draft release without publishing it; publish publishes a draft that a stage run built"
        required: false
        default: release
        type: choice
        options:
          - release
          - stage
          - publish
      coordinator_run_id:
        description: Release coordinator ID used to reconcile a transient dispatch failure
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'push' && 'nightly' || inputs.channel || 'production' }}
  cancel-in-progress: false

env:
  RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'nightly' || inputs.channel || 'production' }}
  RELEASE_MODE: ${{ inputs.mode || 'release' }}
  AUTO_VERSION_SUFFIX: ${{ github.run_number }}

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      source_ref: ${{ steps.v.outputs.source_ref }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Resolve version
        id: v
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
          RELEASE_SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          if [ -n "$RELEASE_SOURCE_REF_INPUT" ] && [[ ! "$RELEASE_SOURCE_REF_INPUT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_ref must be a full 40-character commit SHA."
            exit 1
          fi
          SOURCE_REF="${RELEASE_SOURCE_REF_INPUT:-$GITHUB_SHA}"
          echo "source_ref=${SOURCE_REF,,}" >> "$GITHUB_OUTPUT"

          if [ -n "$RELEASE_VERSION_INPUT" ]; then
            if [ "$RELEASE_CHANNEL" = "nightly" ]; then
              if [[ "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "version=${RELEASE_VERSION_INPUT}-nightly.${AUTO_VERSION_SUFFIX}" >> "$GITHUB_OUTPUT"
              elif [[ "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+$ ]]; then
                echo "version=$RELEASE_VERSION_INPUT" >> "$GITHUB_OUTPUT"
              else
                echo "::error::Nightly versions must be semver or include the -nightly prerelease marker."
                exit 1
              fi
            else
              if [[ ! "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::Production versions must be an exact stable major.minor.patch version."
                exit 1
              fi
              echo "version=$RELEASE_VERSION_INPUT" >> "$GITHUB_OUTPUT"
            fi
          else
            if [ "$RELEASE_CHANNEL" = "nightly" ]; then
              BASE=$(node -p "require('./packages/desktop-app/package.json').version")
              # Use a prerelease tag rather than build metadata: npm version
              # silently strips +metadata, which would make release assets
              # collide across automatic runs.
              echo "version=${BASE}-nightly.${AUTO_VERSION_SUFFIX}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Production releases require an explicit stable version input."
              exit 1
            fi
          fi

  prepare-release:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release before parallel uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ needs.resolve-version.outputs.version }}"
          get_tag_sha() {
            local ref_json object_type object_sha
            if ! ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$1"); then
              return 1
            fi
            object_type=$(printf '%s' "$ref_json" | jq -r '.object.type')
            object_sha=$(printf '%s' "$ref_json" | jq -r '.object.sha')
            if [ "$object_type" = "tag" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/$object_sha" --jq '.object.sha'
            else
              printf '%s\n' "$object_sha"
            fi
          }
          RELEASE_ERROR=$(mktemp)
          TAG_ERROR=$(mktemp)
          # gh release view finds drafts; GET releases/tags/{tag} answers 404
          # for them even when the tag exists.
          if RELEASE_JSON=$(gh release view "$TAG" --json isDraft,targetCommitish -R "$GITHUB_REPOSITORY" 2>"$RELEASE_ERROR"); then
            if [ "$(jq -r '.isDraft' <<< "$RELEASE_JSON")" != "true" ]; then
              echo "::error::Release $TAG is already published. Choose a new version instead of rebuilding it."
              rm -f "$RELEASE_ERROR" "$TAG_ERROR"
              exit 1
            fi
            # A draft gets its tag only when it publishes, unless one was
            # reserved first, so fall back to the commit it targets.
            if EXISTING_TAG_SHA=$(get_tag_sha "$TAG" 2>"$TAG_ERROR"); then
              :
            elif grep -q 'HTTP 404' "$TAG_ERROR"; then
              EXISTING_TAG_SHA=$(jq -r '.targetCommitish' <<< "$RELEASE_JSON")
            else
              cat "$TAG_ERROR"
              rm -f "$RELEASE_ERROR" "$TAG_ERROR"
              exit 1
            fi
            if [ "$EXISTING_TAG_SHA" != "${{ needs.resolve-version.outputs.source_ref }}" ]; then
              echo "::error::Existing release $TAG points to $EXISTING_TAG_SHA, expected ${{ needs.resolve-version.outputs.source_ref }}."
              rm -f "$RELEASE_ERROR" "$TAG_ERROR"
              exit 1
            fi
            echo "Draft release $TAG already points to the coordinated source; build jobs will upload to it."
          elif grep -q 'release not found' "$RELEASE_ERROR"; then
            if [ "$RELEASE_MODE" = "publish" ]; then
              echo "::error::There is no draft release $TAG to publish. Build it first with mode stage."
              rm -f "$RELEASE_ERROR" "$TAG_ERROR"
              exit 1
            fi
            if TAG_SHA=$(get_tag_sha "$TAG" 2>"$TAG_ERROR"); then
              if [ "$TAG_SHA" != "${{ needs.resolve-version.outputs.source_ref }}" ]; then
                echo "::error::Existing tag $TAG points to $TAG_SHA, expected ${{ needs.resolve-version.outputs.source_ref }}."
                rm -f "$RELEASE_ERROR" "$TAG_ERROR"
                exit 1
              fi
              echo "Existing tag $TAG already points to the coordinated source; creating its release."
            elif grep -q 'HTTP 404' "$TAG_ERROR"; then
              :
            else
              cat "$TAG_ERROR"
              rm -f "$RELEASE_ERROR" "$TAG_ERROR"
              exit 1
            fi
            rm -f "$TAG_ERROR"
            if [ "$RELEASE_CHANNEL" = "nightly" ]; then
              gh release create "$TAG" \
                --draft \
                --prerelease \
                --latest=false \
                --target "${{ needs.resolve-version.outputs.source_ref }}" \
                --title "Agent-Native Nightly v${{ needs.resolve-version.outputs.version }}" \
                --notes "Auto-updating Nightly build of the Agent-Native desktop app." \
                -R "${{ github.repository }}"
            else
              gh release create "$TAG" \
                --draft \
                --latest=false \
                --target "${{ needs.resolve-version.outputs.source_ref }}" \
                --title "Agent-Native v${{ needs.resolve-version.outputs.version }}" \
                --notes "Stable release of the Agent-Native desktop app." \
                -R "${{ github.repository }}"
            fi
          else
            cat "$RELEASE_ERROR"
            rm -f "$RELEASE_ERROR" "$TAG_ERROR"
            exit 1
          fi
          rm -f "$RELEASE_ERROR" "$TAG_ERROR"

  build-mac:
    needs: [resolve-version, prepare-release]
    if: ${{ inputs.mode != 'publish' }}
    runs-on: macos-latest
    # A normal build takes 12-20 minutes. Without a bound, one stalled signing
    # step held a macOS runner for the 6-hour default and kept Release everything
    # waiting on it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-version.outputs.source_ref }}

      # Signing credentials and the token go in as inputs: as env they would
      # reach every dependency's install script.
      - uses: ./.github/actions/build-agent-native-desktop
        env:
          SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN || secrets.SENTRY_ELECTRON_DSN || secrets.SENTRY_CLIENT_DSN || secrets.SENTRY_DSN }}
          SENTRY_DESKTOP_CLIENT_KEY: ${{ secrets.SENTRY_DESKTOP_CLIENT_KEY || secrets.SENTRY_CLIENT_KEY }}
          SENTRY_DESKTOP_PROJECT_ID: ${{ secrets.SENTRY_DESKTOP_PROJECT_ID || secrets.SENTRY_PROJECT_ID }}
          SENTRY_DESKTOP_INGEST_HOST: ${{ secrets.SENTRY_DESKTOP_INGEST_HOST || secrets.SENTRY_INGEST_HOST }}
          SENTRY_DESKTOP_ENVIRONMENT: ${{ env.RELEASE_CHANNEL }}
        with:
          platform: mac
          channel: ${{ env.RELEASE_CHANNEL }}
          version: ${{ needs.resolve-version.outputs.version }}
          sign: "true"
          publish: always
          github-token: ${{ secrets.GITHUB_TOKEN }}
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  build-windows:
    needs: [resolve-version, prepare-release]
    if: ${{ inputs.mode != 'publish' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-version.outputs.source_ref }}

      - uses: ./.github/actions/build-agent-native-desktop
        env:
          SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN || secrets.SENTRY_ELECTRON_DSN || secrets.SENTRY_CLIENT_DSN || secrets.SENTRY_DSN }}
          SENTRY_DESKTOP_CLIENT_KEY: ${{ secrets.SENTRY_DESKTOP_CLIENT_KEY || secrets.SENTRY_CLIENT_KEY }}
          SENTRY_DESKTOP_PROJECT_ID: ${{ secrets.SENTRY_DESKTOP_PROJECT_ID || secrets.SENTRY_PROJECT_ID }}
          SENTRY_DESKTOP_INGEST_HOST: ${{ secrets.SENTRY_DESKTOP_INGEST_HOST || secrets.SENTRY_INGEST_HOST }}
          SENTRY_DESKTOP_ENVIRONMENT: ${{ env.RELEASE_CHANNEL }}
        with:
          platform: windows
          channel: ${{ env.RELEASE_CHANNEL }}
          version: ${{ needs.resolve-version.outputs.version }}
          publish: always
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    needs: [resolve-version, prepare-release]
    if: ${{ inputs.mode != 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-version.outputs.source_ref }}

      - uses: ./.github/actions/build-agent-native-desktop
        env:
          SENTRY_DESKTOP_DSN: ${{ secrets.SENTRY_DESKTOP_DSN || secrets.SENTRY_ELECTRON_DSN || secrets.SENTRY_CLIENT_DSN || secrets.SENTRY_DSN }}
          SENTRY_DESKTOP_CLIENT_KEY: ${{ secrets.SENTRY_DESKTOP_CLIENT_KEY || secrets.SENTRY_CLIENT_KEY }}
          SENTRY_DESKTOP_PROJECT_ID: ${{ secrets.SENTRY_DESKTOP_PROJECT_ID || secrets.SENTRY_PROJECT_ID }}
          SENTRY_DESKTOP_INGEST_HOST: ${{ secrets.SENTRY_DESKTOP_INGEST_HOST || secrets.SENTRY_INGEST_HOST }}
          SENTRY_DESKTOP_ENVIRONMENT: ${{ env.RELEASE_CHANNEL }}
        with:
          platform: linux
          channel: ${{ env.RELEASE_CHANNEL }}
          version: ${{ needs.resolve-version.outputs.version }}
          publish: always
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs:
      [resolve-version, prepare-release, build-mac, build-windows, build-linux]
    # A publish run skips the builds, so the default success() check would skip
    # this job too.
    if: >-
      ${{ !cancelled() && inputs.mode != 'stage' &&
      needs.prepare-release.result == 'success' &&
      (inputs.mode == 'publish' || (needs.build-mac.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-linux.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      # A publish run never saw the builds, so check that every platform's
      # updater manifest and the installers it lists reached the draft.
      - name: Require every platform's installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        shell: bash
        run: |
          RELEASE_TAG="v$RELEASE_VERSION"
          ASSETS=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' -R "$GITHUB_REPOSITORY")
          MISSING=()
          for manifest in latest.yml latest-mac.yml latest-linux.yml latest-linux-arm64.yml; do
            if ! grep -qxF "$manifest" <<< "$ASSETS"; then
              MISSING+=("$manifest")
              continue
            fi
            CONTENT=$(gh release download "$RELEASE_TAG" --pattern "$manifest" --output - -R "$GITHUB_REPOSITORY")
            FILES=$(sed -nE "s/^(  - )?(url|path): ['\"]?([^'\"]+)['\"]?$/\3/p" <<< "$CONTENT" | sort -u)
            if [ -z "$FILES" ]; then
              echo "::error::$manifest in $RELEASE_TAG lists no files."
              exit 1
            fi
            while read -r file; do
              grep -qxF "$file" <<< "$ASSETS" || MISSING+=("$file")
            done <<< "$FILES"
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Release $RELEASE_TAG is missing ${MISSING[*]}, so a platform build did not finish. Build it again with mode stage before publishing."
            exit 1
          fi

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ needs.resolve-version.outputs.version }}"
          if [ "$RELEASE_CHANNEL" = "nightly" ]; then
            gh release edit "$TAG" \
              --draft=false \
              --prerelease \
              --latest=false \
              --title "Agent-Native Nightly v${{ needs.resolve-version.outputs.version }}" \
              -R "${{ github.repository }}"
          else
            gh release edit "$TAG" \
              --draft=false \
              --latest \
              --title "Agent-Native v${{ needs.resolve-version.outputs.version }}" \
              -R "${{ github.repository }}"
          fi
