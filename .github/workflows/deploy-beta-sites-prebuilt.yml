name: Deploy Agent-Native beta sites from GitHub

on:
  push:
    branches: [main]
    paths-ignore:
      - ".changeset/**"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional main SHA to publish; blank uses the latest main
        required: false
        type: string
        default: ""
      handoff:
        description: Requeue the latest main source after a production operation
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read

# Beta is a moving mirror of main. Keep one accepted automatic publisher running
# and coalesce pending automatic and production-handoff runs. Manual runs use
# isolated validation so an invalid input cannot evict a valid pending publish;
# builds use per-run artifacts so the shared production-site queue only covers
# the migration and publish critical section.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && !inputs.handoff
        && format('deploy-agent-native-beta-manual-{0}', github.run_id)
        || 'deploy-agent-native-beta-sites-prebuilt' }}
  cancel-in-progress: false

jobs:
  resolve-source:
    name: Resolve beta source revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Write access is only for the beta branch mirror; this job never checks out code.
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: source
        env:
          source_ref: ${{ inputs.source_ref }}
        with:
          script: |
            const requested = process.env.source_ref.trim();
            if (requested && !/^[0-9a-f]{40}$/i.test(requested)) {
              core.setFailed('source_ref must be a full 40-character commit SHA.');
              return;
            }
            const mainSha = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })).data.object.sha;
            const sourceSha = requested || (context.eventName === 'push' ? context.sha : mainSha);
            if (requested) {
              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: sourceSha,
                head: mainSha,
              });
              if (!['ahead', 'identical'].includes(comparison.data.status)) {
                core.setFailed(`source_ref ${sourceSha} is not an ancestor of main ${mainSha}.`);
                return;
              }
            }
            core.setOutput('source_sha', sourceSha);
            core.info(`beta source is pinned to ${sourceSha}`);

      # The beta branch feeds the legacy deploy-beta-sites.yml fallback. A mirror
      # failure must not block publishing, so it only annotates the run.
      - name: Mirror main to the beta branch
        id: mirror-beta
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const repositoryId =
              context.payload.repository?.node_id ??
              (await github.rest.repos.get(repo)).data.node_id;
            for (let attempt = 1; attempt <= 5; attempt++) {
              try {
                const mainSha = (await github.rest.git.getRef({ ...repo, ref: 'heads/main' }))
                  .data.object.sha;
                let betaSha = null;
                try {
                  betaSha = (await github.rest.git.getRef({ ...repo, ref: 'heads/beta' }))
                    .data.object.sha;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
                if (!betaSha) {
                  await github.rest.git.createRef({ ...repo, ref: 'refs/heads/beta', sha: mainSha });
                  core.info(`Created beta at ${mainSha}.`);
                  return;
                }
                const { status } = (await github.rest.repos.compareCommits({
                  ...repo,
                  base: betaSha,
                  head: mainSha,
                })).data;
                // main only moves forward, so beta ahead of main means a newer
                // run already mirrored a later main; never move beta backwards.
                if (status === 'identical' || status === 'behind') {
                  core.info(`beta ${betaSha} already includes main ${mainSha}.`);
                  return;
                }
                // beforeOid is a server-side lease: the update is rejected if
                // another run moved beta after the read above.
                await github.graphql(
                  `mutation($repositoryId: ID!, $afterOid: GitObjectID!, $beforeOid: GitObjectID!, $force: Boolean!) {
                    updateRefs(input: {
                      repositoryId: $repositoryId,
                      refUpdates: [{ name: "refs/heads/beta", afterOid: $afterOid, beforeOid: $beforeOid, force: $force }]
                    }) { clientMutationId }
                  }`,
                  {
                    repositoryId,
                    afterOid: mainSha,
                    beforeOid: betaSha,
                    force: status === 'diverged',
                  },
                );
                core.info(`Mirrored main ${mainSha} to beta (was ${betaSha}, ${status}).`);
                return;
              } catch (error) {
                if (attempt === 5) throw error;
                core.info(`Beta mirror attempt ${attempt} failed: ${error.message}; retrying.`);
                await new Promise((resolve) => setTimeout(resolve, attempt * 2000));
              }
            }

  discover-sites:
    name: Discover beta sites
    needs: resolve-source
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_sites: ${{ steps.matrix.outputs.has_sites }}
    steps:
      # Each beta deploy title carries its source SHA. Knowing what every site
      # already runs lets a push publish only the sites its changes affect.
      # Runs before checkout so the token never reaches repository code; any
      # lookup failure leaves that site unknown, which publishes it.
      - name: Read each beta site's published source
        id: bases
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const token = process.env.NETLIFY_AUTH_TOKEN;
            if (!token) {
              core.warning('NETLIFY_AUTH_TOKEN is not set; publishing every beta site.');
              return;
            }
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'scripts/netlify-beta-sites.json',
              ref: process.env.SOURCE_SHA,
            });
            const sites = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            const bases = {};
            await Promise.all(sites.map(async ({ id, siteId }) => {
              bases[id] = null;
              try {
                const response = await fetch(`https://api.netlify.com/api/v1/sites/${siteId}`, {
                  headers: { Authorization: `Bearer ${token}` },
                  signal: AbortSignal.timeout(20_000),
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const title = (await response.json())?.published_deploy?.title || '';
                bases[id] = (/\b([0-9a-f]{40})\b/i.exec(title) || [])[1]?.toLowerCase() || null;
              } catch (error) {
                core.warning(`Could not read the published source for beta ${id}: ${error.message}`);
              }
            }));
            const file = path.join(process.env.RUNNER_TEMP, 'beta-site-bases.json');
            fs.writeFileSync(file, JSON.stringify(bases, null, 2));
            core.setOutput('bases_file', file);

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: ${{ steps.bases.outputs.bases_file && '0' || '1' }}
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/
            packages/*/package.json
            packages/*/netlify.toml
            templates/*/package.json
            templates/*/netlify.toml
            community-templates/*/package.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Build the beta site matrix
        id: matrix
        env:
          BASES_FILE: ${{ steps.bases.outputs.bases_file }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          args=(--github-output "$GITHUB_OUTPUT")
          if [ -n "$BASES_FILE" ]; then
            args+=(--site-bases "$BASES_FILE" --source "$SOURCE_SHA")
          fi
          node --experimental-strip-types scripts/netlify-beta-targets.ts "${args[@]}"

  build:
    name: ${{ matrix.site }} beta prebuilt build
    permissions:
      contents: read
    needs: [resolve-source, discover-sites]
    if: needs.discover-sites.outputs.has_sites == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover-sites.outputs.matrix) }}
    uses: ./.github/workflows/deploy-netlify-prebuilt.yml
    with:
      target: beta
      site: ${{ matrix.site }}
      caller: automatic-build
      source_ref: ${{ needs.resolve-source.outputs.source_sha }}
      build_context: branch-deploy
      deploy: false
      deploy_mode: draft
      smoke: false
      migration_only: false
      artifact_upload: true
      artifact_name: beta-${{ matrix.site }}-${{ github.run_id }}
    secrets: inherit

  confirm-current-source:
    name: Confirm beta source is current
    if: >-
      ${{ always() && !cancelled() &&
      needs.resolve-source.result == 'success' &&
      needs.discover-sites.result == 'success' &&
      contains(fromJSON('["success","failure"]'), needs.build.result) }}
    needs: [resolve-source, discover-sites, build]
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.source.outputs.current }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: source
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.source_sha }}
        with:
          script: |
            const sourceSha = process.env.SOURCE_SHA.trim();
            const mainSha = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })).data.object.sha;
            // Monotonic check: the source only needs to be an ancestor of (or
            // equal to) current main, not an exact match — main moves faster
            // than this job runs, so exact equality livelocks the whole fleet.
            const onMain = ['ahead', 'identical'].includes(
              (await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: sourceSha,
                head: mainSha,
              })).data.status,
            );
            core.setOutput('current', onMain ? 'true' : 'false');
            if (!onMain) {
              core.info(`Skipping beta source ${sourceSha}: not on main (main is ${mainSha}).`);
            }

  deploy:
    name: ${{ matrix.site }} beta prebuilt deploy
    if: >-
      ${{ always() && !cancelled() &&
      needs.resolve-source.result == 'success' &&
      needs.discover-sites.result == 'success' &&
      contains(fromJSON('["success","failure"]'), needs.build.result) &&
      needs.confirm-current-source.outputs.current == 'true' }}
    permissions:
      contents: read
    needs: [resolve-source, discover-sites, build, confirm-current-source]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover-sites.outputs.matrix) }}
    uses: ./.github/workflows/deploy-netlify-prebuilt.yml
    with:
      target: beta
      site: ${{ matrix.site }}
      caller: ${{ github.event_name == 'workflow_dispatch' && inputs.handoff && 'automatic' || github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
      source_ref: ${{ needs.resolve-source.outputs.source_sha }}
      build_context: branch-deploy
      deploy: true
      deploy_mode: production
      smoke: true
      migration_only: false
      artifact_download: true
      artifact_name: beta-${{ matrix.site }}-${{ github.run_id }}
    secrets: inherit
