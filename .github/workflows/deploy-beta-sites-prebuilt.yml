name: Deploy Agent-Native beta sites from GitHub

# GitHub Actions is the sole automatic beta publisher. It builds once and
# uploads prebuilt artifacts to the independent Netlify beta sites; Netlify
# Git-connected auto-builds are disabled to prevent stale queued builds from
# overwriting a newer result.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Do not add a shared workflow concurrency group here. GitHub retains only one
# pending run per group. Each push run waits for the prior push's beta run
# instead, so every main push remains in the publish order.

jobs:
  resolve-source:
    name: Resolve beta source revision
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: source
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function waitForPredecessor() {
              if (!['push', 'workflow_dispatch'].includes(context.eventName)) {
                return;
              }

              const discoveryDeadline = Date.now() + 60_000;
              const completionDeadline = Date.now() + 110 * 60_000;
              let predecessorRunId;
              while (Date.now() < completionDeadline) {
                if (!predecessorRunId) {
                  const runs = await github.rest.actions.listWorkflowRuns({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'deploy-beta-sites-prebuilt.yml',
                    per_page: 100,
                  });
                  const predecessor = runs.data.workflow_runs
                    .filter(
                      (run) =>
                        run.id < context.runId &&
                        ['push', 'workflow_dispatch'].includes(run.event),
                    )
                    .sort((left, right) => right.id - left.id)[0];
                  if (predecessor) predecessorRunId = predecessor.id;
                }

                if (predecessorRunId) {
                  const predecessor = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: predecessorRunId,
                  });
                  if (predecessor.data.status === 'completed') {
                    core.info(
                      `Predecessor beta run ${predecessorRunId} completed with ${predecessor.data.conclusion ?? 'no conclusion'}.`,
                    );
                    return;
                  }
                  core.info(
                    `Waiting for predecessor beta run ${predecessorRunId} (${predecessor.data.status}).`,
                  );
                } else if (Date.now() >= discoveryDeadline) {
                  core.info('No earlier beta workflow run was found; continuing.');
                  return;
                } else {
                  core.info('Waiting for the earlier beta workflow run to appear.');
                }
                await sleep(30_000);
              }

              core.setFailed(
                `Predecessor beta run ${predecessorRunId ?? 'discovery'} did not finish within 110 minutes.`,
              );
            }

            const sourceSha =
              context.eventName === 'workflow_dispatch'
                ? (await github.rest.git.getRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: 'heads/main',
                  })).data.object.sha
                : context.sha;
            await waitForPredecessor();
            core.setOutput('source_sha', sourceSha);
            core.info(`beta source is pinned to ${sourceSha}`);

  discover-sites:
    name: Discover beta sites
    needs: resolve-source
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 1
          sparse-checkout: scripts/netlify-beta-sites.json
          sparse-checkout-cone-mode: false

      - name: Build the beta site matrix
        id: matrix
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const sites = JSON.parse(
            fs.readFileSync('scripts/netlify-beta-sites.json', 'utf8'),
          );
          if (!sites.length) throw new Error('No beta sites configured.');
          const matrix = { include: sites.map(({ id }) => ({ site: id })) };
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `matrix=${JSON.stringify(matrix)}\n`,
          );
          console.log(`Discovered ${sites.length} beta sites.`);
          NODE

  deploy:
    name: ${{ matrix.site }} beta prebuilt deploy
    needs: [resolve-source, discover-sites]
    strategy:
      fail-fast: false
      # Each beta build can run release migrations against the shared production
      # database. Keep those migrations from opening a connection burst.
      # ponytail: one global beta build at a time; split migration into a single
      # preflight job if fleet duration becomes a problem.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover-sites.outputs.matrix) }}
    uses: ./.github/workflows/deploy-netlify-prebuilt.yml
    with:
      target: beta
      site: ${{ matrix.site }}
      caller: fleet
      source_ref: ${{ needs.resolve-source.outputs.source_sha }}
      build_context: branch-deploy
      deploy: true
      deploy_mode: production
      smoke: true
    secrets: inherit
