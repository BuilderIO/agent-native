name: Deploy Agent-Native beta sites from GitHub

# GitHub Actions is the sole automatic beta publisher. It builds once and
# uploads prebuilt artifacts to the independent Netlify beta sites; Netlify
# Git-connected auto-builds are disabled to prevent stale queued builds from
# overwriting a newer result.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Every main push gets its own workflow. The reusable beta deploy serializes
# each site's remote Netlify publish, while its source freshness check skips
# artifacts that are no longer the current main commit.

jobs:
  resolve-source:
    name: Resolve beta source revision
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: source
        with:
          script: |
            const sourceSha =
              context.eventName === 'workflow_dispatch'
                ? (await github.rest.git.getRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: 'heads/main',
                  })).data.object.sha
                : context.sha;
            core.setOutput('source_sha', sourceSha);
            core.info(`beta source is pinned to ${sourceSha}`);

  discover-sites:
    name: Discover beta sites
    needs: resolve-source
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      migration_matrix: ${{ steps.matrix.outputs.migration_matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 1
          sparse-checkout: scripts/netlify-beta-sites.json
          sparse-checkout-cone-mode: false

      - name: Build the beta site matrix
        id: matrix
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const sites = JSON.parse(
            fs.readFileSync('scripts/netlify-beta-sites.json', 'utf8'),
          );
          if (!sites.length) throw new Error('No beta sites configured.');
          const matrix = { include: sites.map(({ id }) => ({ site: id })) };
          const migrationMatrix = {
            include: sites
              .filter(({ id }) => !['clips', 'plan'].includes(id))
              .map(({ id }) => ({ site: id })),
          };
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `matrix=${JSON.stringify(matrix)}`,
              `migration_matrix=${JSON.stringify(migrationMatrix)}`,
              '',
            ].join('\n'),
          );
          console.log(`Discovered ${sites.length} beta sites.`);
          NODE

  migrate:
    name: ${{ matrix.site }} beta release migration
    needs: [resolve-source, discover-sites]
    strategy:
      fail-fast: false
      # Migration duty is the only serialized part of the fleet. Builds do
      # not touch the database and can run concurrently after this completes.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover-sites.outputs.migration_matrix) }}
    uses: ./.github/workflows/deploy-netlify-prebuilt.yml
    with:
      target: beta
      site: ${{ matrix.site }}
      caller: release-migration
      source_ref: ${{ needs.resolve-source.outputs.source_sha }}
      build_context: branch-deploy
      deploy: false
      deploy_mode: draft
      smoke: false
      migration_only: true
    secrets: inherit

  deploy:
    name: ${{ matrix.site }} beta prebuilt deploy
    needs: [resolve-source, discover-sites, migrate]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.discover-sites.outputs.matrix) }}
    uses: ./.github/workflows/deploy-netlify-prebuilt.yml
    with:
      target: beta
      site: ${{ matrix.site }}
      caller: fleet
      source_ref: ${{ needs.resolve-source.outputs.source_sha }}
      build_context: branch-deploy
      deploy: true
      deploy_mode: production
      smoke: true
      migration_only: false
    secrets: inherit
