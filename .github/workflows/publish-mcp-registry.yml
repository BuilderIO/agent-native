name: Publish MCP Registry servers

on:
  workflow_dispatch:
    inputs:
      server:
        description: Public app slug to publish, or all
        required: true
        type: string
        default: all

permissions: {}

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish selected MCP servers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main branch
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "MCP Registry publication is only allowed from main." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Generate registry metadata
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/mcp-registry.ts --check
          node --experimental-strip-types scripts/mcp-registry.ts --write "$RUNNER_TEMP/mcp-registry"

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/$archive" \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          tar --extract --gzip --file "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            --directory "$RUNNER_TEMP" mcp-publisher
          chmod +x "$RUNNER_TEMP/mcp-publisher"

      - name: Validate and publish selected servers
        env:
          MCP_SERVER: ${{ inputs.server }}
          MCP_PUBLISHER: ${{ runner.temp }}/mcp-publisher
          MCP_OUTPUT_DIRECTORY: ${{ runner.temp }}/mcp-registry
        run: |
          set -euo pipefail
          files=()
          if [[ "$MCP_SERVER" == "all" ]]; then
            while IFS= read -r file; do
              files+=("$file")
            done < <(find "$MCP_OUTPUT_DIRECTORY" -mindepth 2 -maxdepth 2 -name server.json -print | sort)
          elif [[ "$MCP_SERVER" =~ ^[a-z0-9-]+$ && -f "$MCP_OUTPUT_DIRECTORY/$MCP_SERVER/server.json" ]]; then
            files=("$MCP_OUTPUT_DIRECTORY/$MCP_SERVER/server.json")
          else
            echo "Unknown public app slug: $MCP_SERVER" >&2
            exit 1
          fi

          if (( ${#files[@]} == 0 )); then
            echo "No MCP Registry metadata files were generated." >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            "$MCP_PUBLISHER" validate "$file"
          done

          "$MCP_PUBLISHER" login github-oidc
          for file in "${files[@]}"; do
            "$MCP_PUBLISHER" publish "$file"
          done
