name: Test-title production guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: test-title-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-title-production:
    name: Test-title production guard
    if: >-
      startsWith(github.event.pull_request.title, 'test:') ||
      (github.event.action == 'edited' && github.event.changes.title != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check test-title production paths
        run: node --experimental-strip-types scripts/guard-test-title-production.ts
