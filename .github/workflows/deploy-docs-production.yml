name: Deploy Agent-Native docs site from GitHub

on:
  push:
    branches: [main]
    paths:
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/agentkit/**"
      - "packages/core/**"
      - "packages/core-corpus/**"
      - "packages/docs/**"
      - "packages/recap-cli/**"
      - "packages/toolkit/**"
      - "scripts/netlify-prebuilt-target.ts"
      - "scripts/netlify-prebuilt-build.ts"
      - "scripts/netlify-migration-url.ts"
      - "scripts/netlify-api-error.ts"
      - "scripts/netlify-api-request.ts"
      - "scripts/netlify-production-sites.json"
      - "scripts/check-function-size-baseline.mjs"
      - "scripts/ssr-boot-smoke.mjs"
      - "scripts/check-production-cache-contract.mjs"
      - ".github/actions/docs-source-freshness/action.yml"
      - ".github/workflows/deploy-docs-production.yml"
      - ".github/workflows/deploy-netlify-prebuilt.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional exact commit SHA; blank uses the selected ref
        required: false
        type: string
        default: ""
      smoke:
        description: Probe www.agent-native.com after publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-native-docs-production
  cancel-in-progress: false
  queue: max

jobs:
  docs-source-freshness:
    name: Verify docs source before production side effects
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.freshness.outputs.current }}
    steps:
      - name: Verify docs source is current before production side effects
        id: freshness
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        with:
          script: |
            core.setOutput("current", "false");
            const sourceRef = process.env.SOURCE_REF.trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sourceRef)) {
              core.setFailed("Docs production source must be a full 40-character commit SHA.");
              return;
            }

            const mainSha = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            })).data.object.sha.toLowerCase();
            if (sourceRef === mainSha) {
              core.setOutput("current", "true");
              return;
            }

            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: sourceRef,
              head: mainSha,
              per_page: 100,
              page: 1,
            });
            const firstPage = comparison.data;
            if (!["ahead", "identical"].includes(firstPage.status)) {
              core.setFailed(`Docs production source ${sourceRef} is no longer an ancestor of main ${mainSha}.`);
              return;
            }

            const totalCommits = firstPage.total_commits;
            const files = firstPage.files;
            if (
              !Number.isInteger(totalCommits) ||
              totalCommits < 0 ||
              !Array.isArray(firstPage.commits) ||
              !Array.isArray(files) ||
              !files.every(
                (file) =>
                  typeof file?.filename === "string" &&
                  (file.previous_filename === undefined ||
                    typeof file.previous_filename === "string"),
              ) ||
              files.length >= 300
            ) {
              core.setFailed("Cannot verify all newer docs deployment inputs; refusing to publish this queued source.");
              return;
            }

            const pageSize = 100;
            const pageCount = Math.max(1, Math.ceil(totalCommits / pageSize));
            const commits = [];
            const commitShas = new Set();
            for (let page = 1; page <= pageCount; page += 1) {
              const data = page === 1
                ? firstPage
                : (await github.rest.repos.compareCommits({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    base: sourceRef,
                    head: mainSha,
                    per_page: pageSize,
                    page,
                  })).data;
              const expectedPageCommits = Math.min(
                pageSize,
                totalCommits - commits.length,
              );
              if (
                data.status !== firstPage.status ||
                data.total_commits !== totalCommits ||
                !Array.isArray(data.commits) ||
                data.commits.length !== expectedPageCommits
              ) {
                core.setFailed("Cannot verify every newer commit in the docs comparison; refusing to publish this queued source.");
                return;
              }
              for (const commit of data.commits) {
                if (typeof commit.sha !== "string" || commitShas.has(commit.sha)) {
                  core.setFailed("Docs comparison returned a missing or duplicate commit; refusing to publish this queued source.");
                  return;
                }
                commitShas.add(commit.sha);
                commits.push(commit);
              }
            }
            if (commits.length !== totalCommits) {
              core.setFailed("Cannot verify every newer commit in the docs comparison; refusing to publish this queued source.");
              return;
            }

            const docsPaths = [
              ".nvmrc",
              "package.json",
              "pnpm-lock.yaml",
              "pnpm-workspace.yaml",
              "packages/agentkit/**",
              "packages/core/**",
              "packages/core-corpus/**",
              "packages/docs/**",
              "packages/recap-cli/**",
              "packages/toolkit/**",
              "scripts/netlify-prebuilt-target.ts",
              "scripts/netlify-prebuilt-build.ts",
              "scripts/netlify-migration-url.ts",
              "scripts/netlify-api-error.ts",
              "scripts/netlify-api-request.ts",
              "scripts/netlify-production-sites.json",
              "scripts/check-function-size-baseline.mjs",
              "scripts/ssr-boot-smoke.mjs",
              "scripts/check-production-cache-contract.mjs",
              ".github/actions/docs-source-freshness/action.yml",
              ".github/workflows/deploy-docs-production.yml",
              ".github/workflows/deploy-netlify-prebuilt.yml",
            ];
            const matchesDocsPath = (path) => {
              if (typeof path !== "string") return false;
              return docsPaths.some((pattern) => {
                if (!pattern.endsWith("/**")) return path === pattern;
                const directory = pattern.slice(0, -3);
                return path === directory || path.startsWith(`${directory}/`);
              });
            };
            const newerDocsChange = files.some((file) =>
              [file.filename, file.previous_filename].some(matchesDocsPath),
            );
            if (newerDocsChange) {
              const message = `Docs source ${sourceRef} is stale: main contains newer docs deployment inputs.`;
              if (context.eventName === "workflow_dispatch") {
                core.setFailed(`Requested ${message}`);
                return;
              }
              core.notice(`Skipping queued ${message}`);
              return;
            }

            core.setOutput("current", "true");

  migrate:
    name: Migrate docs production schema
    needs: [docs-source-freshness, pause-netlify-builds]
    if: >-
      ${{ always() && !cancelled() &&
      needs.docs-source-freshness.result == 'success' &&
      needs.docs-source-freshness.outputs.current == 'true' &&
      needs.pause-netlify-builds.result == 'success' &&
      needs.pause-netlify-builds.outputs.freshness_current == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-netlify-prebuilt.yml
    with:
      target: production
      site: fw
      caller: release-migration
      source_ref: ${{ inputs.source_ref || github.sha }}
      build_context: production
      deploy: false
      deploy_mode: draft
      smoke: false
      migration_only: true
    secrets: inherit

  deploy:
    name: docs production prebuilt deploy
    permissions:
      contents: read
    needs: [docs-source-freshness, pause-netlify-builds, migrate]
    if: >-
      ${{ always() && !cancelled() &&
      needs.docs-source-freshness.result == 'success' &&
      needs.docs-source-freshness.outputs.current == 'true' &&
      needs.pause-netlify-builds.result == 'success' &&
      needs.pause-netlify-builds.outputs.freshness_current == 'true' &&
      needs.migrate.result == 'success' }}
    uses: ./.github/workflows/deploy-netlify-prebuilt.yml
    with:
      target: production
      site: fw
      caller: docs
      source_ref: ${{ inputs.source_ref || github.sha }}
      build_context: production
      deploy: true
      deploy_mode: production
      smoke: ${{ github.event_name == 'push' || inputs.smoke }}
      migration_only: false
      skip_build_migrations: true
    secrets: inherit

  pause-netlify-builds:
    name: Pause docs site's Git-connected Netlify builds
    needs: [docs-source-freshness]
    if: >-
      ${{ always() && !cancelled() &&
      needs.docs-source-freshness.result == 'success' &&
      needs.docs-source-freshness.outputs.current == 'true' }}
    concurrency:
      group: agent-native-production-site-fw
      cancel-in-progress: false
      queue: max
    outputs:
      cutover_acquired: ${{ steps.pause.outputs.cutover_acquired }}
      has_git_connected_build: ${{ steps.pause.outputs.has_git_connected_build }}
      freshness_current: ${{ steps.docs_post_queue_freshness.outputs.current }}
      site_id: ${{ steps.pause.outputs.site_id }}
      was_stopped: ${{ steps.pause.outputs.was_stopped }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
          sparse-checkout: scripts/netlify-production-sites.json
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          path: .docs-freshness-action
          fetch-depth: 1
          sparse-checkout: .github/actions/docs-source-freshness/action.yml
          sparse-checkout-cone-mode: false

      - name: Verify docs source is current after waiting for production site
        id: docs_post_queue_freshness
        uses: ./.docs-freshness-action/.github/actions/docs-source-freshness
        with:
          source-ref: ${{ inputs.source_ref || github.sha }}

      - name: Disable the docs site's Git-connected Netlify builds
        id: pause
        if: >-
          steps.docs_post_queue_freshness.outcome == 'success' &&
          steps.docs_post_queue_freshness.outputs.current == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          : "${NETLIFY_AUTH_TOKEN:?NETLIFY_AUTH_TOKEN secret is required}"
          node <<'NODE'
          const fs = require('node:fs');

          const sites = JSON.parse(
            fs.readFileSync('scripts/netlify-production-sites.json', 'utf8'),
          );
          const siteId = sites.fw?.siteId;
          if (!siteId) throw new Error('The fw production docs site is not configured.');

          const api = 'https://api.netlify.com/api/v1';
          const headers = {
            Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
            'Content-Type': 'application/json',
          };

          async function readJson(response, label) {
            const text = await response.text();
            let body = null;
            try {
              body = text ? JSON.parse(text) : null;
            } catch {
              if (!response.ok) {
                throw new Error(`${label} failed with HTTP ${response.status}: ${text}`);
              }
              throw new Error(`${label} returned an invalid JSON response.`);
            }
            if (!response.ok) {
              throw new Error(
                `${label} failed with HTTP ${response.status}: ${typeof body === 'string' ? body : JSON.stringify(body)}`,
              );
            }
            if (!body || typeof body !== 'object' || Array.isArray(body)) {
              throw new Error(`${label} returned an invalid JSON object.`);
            }
            return body;
          }

          async function waitForBuildSetting(siteId, expected, label) {
            let actual;
            for (let attempt = 1; attempt <= 15; attempt += 1) {
              const site = await readJson(
                await fetchSiteWithRetry(
                  `${api}/sites/${siteId}`,
                  `${label} verification attempt ${attempt}`,
                ),
                `${label} verification attempt ${attempt}`,
              );
              actual = site.build_settings?.stop_builds ?? site.repo?.stop_builds;
              if (actual === expected) return;
              if (attempt < 15) {
                await new Promise((resolve) => setTimeout(resolve, 2_000));
              }
            }
            throw new Error(`${label} expected stop_builds=${expected}, got ${actual}.`);
          }

          async function fetchSiteWithRetry(siteUrl, label) {
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const response = await fetch(siteUrl, {
                headers,
                signal: AbortSignal.timeout(30_000),
              });
              if (![429, 500, 502, 503, 504].includes(response.status) || attempt === 3) {
                return response;
              }
              const retryAfterHeader = response.headers.get('retry-after');
              const retryAfter =
                retryAfterHeader === null || !retryAfterHeader.trim()
                  ? Number.NaN
                  : Number(retryAfterHeader);
              const delayMs = Number.isFinite(retryAfter) && retryAfter >= 0
                ? Math.min(retryAfter * 1_000, 10_000)
                : attempt * 1_000;
              console.warn(
                `${label} returned HTTP ${response.status}; retrying ${attempt + 1}/3 in ${delayMs}ms.`,
              );
              await new Promise((resolve) => setTimeout(resolve, delayMs));
            }
            throw new Error(`${label} exhausted its retry limit.`);
          }

          (async () => {
            const siteUrl = `${api}/sites/${siteId}`;
            const current = await readJson(
              await fetchSiteWithRetry(siteUrl, 'Netlify docs site lookup'),
              'Netlify docs site lookup',
            );
            const wasStopped =
              (current.build_settings?.stop_builds ?? current.repo?.stop_builds) === true;
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `site_id=${siteId}\nwas_stopped=${wasStopped}\n`,
            );
            const hasGitConnectedBuild = Boolean(
              current.build_settings?.repo_url ||
                current.build_settings?.repo_path ||
                current.build_settings?.provider ||
                current.repo?.repo_url ||
                current.repo?.repo_path ||
                current.git_provider ||
                current.repo?.provider ||
                current.repo?.repo,
            );
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `has_git_connected_build=${hasGitConnectedBuild}\n`,
            );
            let changedStopBuilds = false;
            if (!hasGitConnectedBuild) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'cutover_acquired=false\n');
              console.log('Netlify docs site has no Git-connected build; no auto-build race exists.');
              return;
            }
            if (!wasStopped) {
              await readJson(
                await fetch(siteUrl, {
                  method: 'PATCH',
                  headers,
                  body: JSON.stringify({ build_settings: { stop_builds: true } }),
                  signal: AbortSignal.timeout(30_000),
                }),
                'Netlify docs build pause',
              );
              changedStopBuilds = true;
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'cutover_acquired=true\n');

            let verificationError;
            try {
              await waitForBuildSetting(siteId, true, 'Netlify docs build pause');
              console.log('Docs site is now owned by the GitHub Actions prebuilt publisher.');
              return;
            } catch (error) {
              verificationError = error;
            }
            if (changedStopBuilds) {
              try {
                await readJson(
                  await fetch(siteUrl, {
                    method: 'PATCH',
                    headers,
                    body: JSON.stringify({ build_settings: { stop_builds: false } }),
                    signal: AbortSignal.timeout(30_000),
                  }),
                  'Netlify docs build pause rollback',
                );
              } catch (rollbackError) {
                throw new Error(
                  `Netlify docs Git-connected builds were not disabled: ${verificationError instanceof Error ? verificationError.message : String(verificationError)}; rollback also failed: ${rollbackError instanceof Error ? rollbackError.message : String(rollbackError)}`,
                );
              }
            }
            if (verificationError instanceof Error) {
              throw new Error(
                `Netlify docs Git-connected build pause verification failed: ${verificationError.message}`,
                { cause: verificationError },
              );
            }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

  restore-netlify-builds:
    name: Restore docs site's Git-connected Netlify builds
    needs: [pause-netlify-builds, migrate, deploy]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: agent-native-production-site-fw
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 1
          sparse-checkout: scripts/netlify-api-request.ts
          sparse-checkout-cone-mode: false

      - name: Restore the prior docs build setting
        if: >-
          needs.pause-netlify-builds.outputs.cutover_acquired == 'true' &&
          needs.pause-netlify-builds.outputs.has_git_connected_build == 'true' &&
          needs.pause-netlify-builds.outputs.was_stopped != 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ needs.pause-netlify-builds.outputs.site_id }}
        run: |
          set -euo pipefail
          : "${NETLIFY_AUTH_TOKEN:?NETLIFY_AUTH_TOKEN secret is required}"
          node --experimental-strip-types <<'NODE'
          (async () => {
            const { requestNetlifyApi } = await import('./scripts/netlify-api-request.ts');
            const siteId = process.env.NETLIFY_SITE_ID;
            if (!siteId) throw new Error('Netlify docs site id was not recorded by the pause step.');
            const api = 'https://api.netlify.com/api/v1';
            const headers = {
              Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
              'Content-Type': 'application/json',
              'User-Agent': 'agent-native-docs-build-resume',
            };
            const request = (url, options = {}) => requestNetlifyApi(url, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });
            async function readJson(response, label) {
              const text = await response.text();
              const body = text ? JSON.parse(text) : null;
              if (!response.ok) {
                throw new Error(`${label} failed with HTTP ${response.status}: ${JSON.stringify(body)}`);
              }
              return body;
            }
            await readJson(
              await request(`${api}/sites/${siteId}`, {
                method: 'PATCH',
                body: JSON.stringify({ build_settings: { stop_builds: false } }),
              }),
              'Netlify docs build resume',
            );
            for (let attempt = 1; attempt <= 15; attempt += 1) {
              const site = await readJson(
                await request(`${api}/sites/${siteId}`),
                `Netlify docs build resume verification attempt ${attempt}`,
              );
              const stopped = site.build_settings?.stop_builds ?? site.repo?.stop_builds;
              if (stopped === false) {
                console.log('Restored the docs site Git-connected build setting.');
                return;
              }
              if (attempt < 15) await new Promise((resolve) => setTimeout(resolve, 2_000));
            }
            throw new Error('Netlify docs build resume was not verified.');
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

  handoff-beta:
    name: Hand off latest main to beta publisher
    needs: restore-netlify-builds
    if: ${{ !cancelled() && needs.restore-netlify-builds.result == 'success' }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Queue the current main source for beta
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const mainSha = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })).data.object.sha;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-beta-sites-prebuilt.yml',
              ref: 'main',
              inputs: {
                source_ref: mainSha,
                handoff: 'true',
              },
            });
            core.info(`Handed off current main ${mainSha} to the beta publisher.`);

  report:
    name: Report to #dev-agent-native-alerts
    needs:
      [
        docs-source-freshness,
        pause-netlify-builds,
        migrate,
        deploy,
        restore-netlify-builds,
      ]
    # A manual run reports to whoever started it. A push posts only when docs
    # production starts failing or publishes again, not once per merge.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Compare with the last docs run that deployed or failed
        id: change
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DOCS_JOB_RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            core.setOutput("text", "");
            const needs = JSON.parse(process.env.DOCS_JOB_RESULTS);
            // Restoring the Git build setting runs after the deploy, so its
            // failure does not decide whether docs deployed.
            const published = needs.deploy.result === "success";
            const failed = ["docs-source-freshness", "pause-netlify-builds", "migrate", "deploy"].filter(
              (job) => needs[job].result === "failure",
            );
            // Skipped because a newer docs change reached the queue.
            if (!published && failed.length === 0) return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "deploy-docs-production.yml",
              branch: "main",
              event: "push",
              status: "completed",
              per_page: 100,
            });
            // Earlier runs are judged by the same jobs, not by the run's
            // conclusion, which a failed restore or report also sets. A
            // skipped reusable-workflow job is listed without its " / <job>".
            const isJob = (job, name) => job.name === name || job.name.startsWith(`${name} / `);
            const deployPathJobs = [
              "Verify docs source before production side effects",
              "Pause docs site's Git-connected Netlify builds",
              "Migrate docs production schema",
              "docs production prebuilt deploy",
            ];
            let previous = null;
            for (const run of data.workflow_runs
              .filter((run) => run.id < context.runId && run.conclusion !== "cancelled")
              .sort((a, b) => b.id - a.id)) {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                filter: "latest",
                per_page: 100,
              });
              if (jobs.jobs.some((job) => isJob(job, "docs production prebuilt deploy") && job.conclusion === "success")) {
                previous = "published";
                break;
              }
              if (
                jobs.jobs.some(
                  (job) => job.conclusion === "failure" && deployPathJobs.some((name) => isJob(job, name)),
                )
              ) {
                previous = "failed";
                break;
              }
            }

            const commit = context.sha.slice(0, 10);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            if (!published && previous !== "failed") {
              core.setOutput(
                "text",
                `:warning: Docs production did not deploy ${commit}: ${failed.join(", ")} failed. www.agent-native.com keeps its last published build. Run: ${runUrl}. Re-run its failed jobs once the cause is fixed; the next docs change to main deploys too. This posts again only after docs deploy.`,
              );
            } else if (published && previous === "failed") {
              core.setOutput("text", `:white_check_mark: Docs production deploys again: ${commit} is live. Run: ${runUrl}`);
            }

      - name: Post the change
        if: ${{ steps.change.outputs.text != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.QA_SLACK_BOT_TOKEN }}
          payload: |
            channel: C0C7A1Y2EF6
            text: ${{ toJSON(steps.change.outputs.text) }}
            unfurl_links: false
            unfurl_media: false
