name: Stage independent beta CRM database rotation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NEW_DATABASE_URL: ${{ secrets.BETA_DATABASE_URL_CRM }}
        with:
          script: |
            const id='bef68db5-5bbc-41c6-b3d8-edeb7b871b5e';
            const headers={Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN,'Content-Type':'application/json'};
            async function req(path,options={}){const r=await fetch('https://api.netlify.com/api/v1/'+path,{headers,...options});if(!r.ok)throw new Error('Netlify request failed: '+r.status);return r.status===204?null:await r.json()}
            const site=await req('sites/'+id);if(site.id!==id||site.account_slug!=='steve8708')throw new Error('Unexpected site ownership');
            const replacement=new URL(process.env.NEW_DATABASE_URL);
            const normalized=u=>u.hostname.replace('-pooler.','.');
            if(normalized(replacement)!=='ep-rough-boat-au3q2472.c-10.us-east-1.aws.neon.tech'||replacement.pathname!=='/main'||replacement.username!=='main_owner')throw new Error('Unexpected target database');
            const endpoint='accounts/'+site.account_slug+'/env';
            const entries=await req(endpoint+'?site_id='+id);let updated=0;
            for(const entry of entries.filter(e=>/DATABASE_URL/.test(e.key))){
              if(entry.is_secret)throw new Error('Opaque database value requires separate handling');
              const values=entry.values.map(v=>{const u=new URL(v.value);if(normalized(u)!==normalized(replacement)||u.username!==replacement.username||u.pathname!==replacement.pathname)throw new Error('Different credential scope');u.password=replacement.password;return {...v,value:u.toString()}});
              await req(endpoint+'/'+encodeURIComponent(entry.key)+'?site_id='+id,{method:'PUT',body:JSON.stringify({key:entry.key,scopes:entry.scopes,values})});updated++;
            }
            if(!updated)throw new Error('No database configuration updated');
            const verify=await req(endpoint+'?site_id='+id);
            for(const e of verify.filter(e=>/DATABASE_URL/.test(e.key)))for(const v of e.values)if(new URL(v.value).password!==replacement.password)throw new Error('Credential readback failed');
            core.info('Staged and verified '+updated+' beta CRM database variables. Password reset and deploy remain.');
