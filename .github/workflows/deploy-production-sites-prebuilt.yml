name: Prepare encryption rotation production artifacts
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Build ${{ matrix.site }} production artifact
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        site: [assets, brain, design, clips, crm, starter, slides, mail, forms, plan, dispatch, content, calendar, analytics, factory, fw]
    uses: ./.github/workflows/deploy-netlify-prebuilt.yml
    with:
      target: production
      site: ${{ matrix.site }}
      caller: manual
      source_ref: 32037392301280b203e61f692c690fba1328c4ea
      build_context: production
      deploy: false
      deploy_mode: draft
      smoke: false
      migration_only: false
      artifact_upload: true
      artifact_name: incident-encryption-prod-${{ matrix.site }}-${{ github.run_id }}
    secrets: inherit
