name: Recover encrypted incident database credential
on: workflow_dispatch
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        with:
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const response = await fetch('https://api.netlify.com/api/v1/sites/2636c74c-ce64-4dc5-8028-2f45b511e52b/database?role=netlifydb_owner', {headers:{Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN}});
            if (!response.ok) throw new Error('Database credential lookup HTTP '+response.status);
            const raw = await response.json();
            if (!raw.connection_string || !raw.connection_string.startsWith('postgres')) throw new Error('No usable database credential returned');
            const key=crypto.randomBytes(32),iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',key,iv);
            const payload=Buffer.concat([cipher.update(JSON.stringify(raw)),cipher.final()]);
            const wrapped=crypto.publicEncrypt({key:"-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAkGnlplJpBJEBuuhK+kzv\njd40hdEuhC7FoLt9rDJQ5/ITi6Pi8/0/YfEeZWVf3k4i3W9+2zULzT1J0P/9RPDB\nQ+r1HDyipyywgFb9seez2D0/8B1eU8pvKp4AOX8sPvy5DHVPzCFBHXA24lO0sbDt\nbmuuGQ/kwJf3t5exHtjfLZCivZbnLPTcA/PiGGwMCDFDImDLY2iG5BC2MEGDZcqw\ni2SvUAfWXtbDs3N5b5/UWJxA+y3eD043bgKe6IOo77sBc3zB4yqhOXp9gzE75176\nrJOCAnlFCyr5+eE9rxBogYUqBm+zyLJTRnM6ljzgRrJmVAJlsCJGbEMiyZs9UdYn\nNQIDAQAB\n-----END PUBLIC KEY-----\n",padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},key);
            fs.writeFileSync('database-recovery.enc.json',JSON.stringify({wrapped:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),payload:payload.toString('base64')}));
            core.info('Encrypted recovery artifact prepared. No plaintext credentials logged.');
      - uses: actions/upload-artifact@v7
        with:
          name: encrypted-database-recovery
          path: database-recovery.enc.json
          retention-days: 1
