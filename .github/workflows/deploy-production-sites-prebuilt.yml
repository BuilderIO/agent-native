name: Coordinate prepared authentication cutover
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: agent-native-auth-promotion-production
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      PROMOTION_MANIFEST: ${{ secrets.INCIDENT_AUTH_PROMOTION_PRODUCTION }}
      PROMOTION_OUTPUT: promotion.json
      GITHUB_TOKEN: ${{ github.token }}
      CUTOVER_REF: codex/incident-encryption-build-artifacts
    steps:
      - name: Prepare the verified promotion helper
        run: |
          node <<'NODE'
          require('node:fs').writeFileSync('promotion.cts',"const fs=require('node:fs');\n(async()=>{const manifest=JSON.parse(process.env.PROMOTION_MANIFEST||'{}'),rows=manifest.sites,token=process.env.NETLIFY_AUTH_TOKEN,output=process.env.PROMOTION_OUTPUT||'promotion.json';\nif(!token||!manifest.cutover_id||!Array.isArray(rows)||!rows.length||new Set(rows.map(r=>r.siteId)).size!==rows.length)throw Error('Invalid prepared promotion manifest');\nconst report={cutover_id:manifest.cutover_id,preflight:false,complete:false,sites:rows.map(r=>({siteId:r.siteId,app:r.app,environment:r.environment,previous_deploy_id:r.previous_deploy_id,deploy_id:r.deploy_id,previous_locked:r.previous_locked,owned_temporary_lock:r.owned_temporary_lock,promoted:false}))};\nfunction save(){const fd=fs.openSync(output+'.tmp','w',0o600);fs.writeFileSync(fd,JSON.stringify(report));fs.fsyncSync(fd);fs.closeSync(fd);fs.renameSync(output+'.tmp',output)}\nasync function req(p,method='GET',body){const response=await fetch('https://api.netlify.com/api/v1/'+p,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});if(!response.ok)throw Error('Promotion API HTTP '+response.status);return response.status===204?null:response.json()}\nasync function parallel(list,limit,fn){let index=0;async function worker(){while(index<list.length)await fn(list[index++])}await Promise.all(Array.from({length:Math.min(limit,list.length)},worker))}\nasync function preflight(){await parallel(rows,6,async r=>{const [site,deploy]=await Promise.all([req('sites/'+r.siteId),req('deploys/'+r.deploy_id)]);if(site.account_slug!==r.account_slug||![site.custom_domain,...(site.domain_aliases||[]),new URL(site.ssl_url).hostname].includes(r.host))throw Error('Site ownership changed');if(![r.previous_deploy_id,r.deploy_id].includes(site.published_deploy?.id)||!site.published_deploy?.locked)throw Error('Published deployment or publication lock changed');if(deploy.site_id!==r.siteId||deploy.context!=='production'||deploy.state!=='ready')throw Error('Prepared candidate is not ready for this site')});report.preflight=true;report.preflight_at=new Date().toISOString();save()}\nawait preflight();if(process.argv[2]==='preflight'){console.log('Verified publication ownership and ready candidates for '+rows.length+' sites.');return}\nconst deadline=Date.now()+15*60*1000;let go=false;\nwhile(Date.now()<deadline){\n if(process.env.CUTOVER_GO_FILE){if(fs.existsSync(process.env.CUTOVER_GO_FILE)){const flag=JSON.parse(fs.readFileSync(process.env.CUTOVER_GO_FILE,'utf8'));go=flag.cutover_id===manifest.cutover_id&&flag.go===true}}\n else{const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/contents/.github/incident-auth-cutover.json?ref='+encodeURIComponent(process.env.CUTOVER_REF),{headers:{Authorization:'Bearer '+process.env.GITHUB_TOKEN,Accept:'application/vnd.github+json','Cache-Control':'no-cache'}});if(response.ok){const data=await response.json(),flag=JSON.parse(Buffer.from(data.content,'base64').toString());go=flag.cutover_id===manifest.cutover_id&&flag.go===true}else if(response.status!==404)throw Error('Cutover signal unreadable: HTTP '+response.status)}\n if(go)break;await new Promise(resolve=>setTimeout(resolve,3000));\n}\nif(!go)throw Error('No coordinated cutover signal received; live deployments unchanged');\nawait preflight();report.started_at=new Date().toISOString();save();\nawait parallel(rows,8,async r=>{const out=report.sites.find(x=>x.siteId===r.siteId);try{let site=await req('sites/'+r.siteId);if(site.published_deploy.id!==r.deploy_id){if(site.published_deploy.id!==r.previous_deploy_id||!site.published_deploy.locked)throw Error('Publication changed immediately before promotion');await req('sites/'+r.siteId+'/deploys/'+r.deploy_id+'/restore','POST',{})}\n let verified=false;for(let attempt=0;attempt<30;attempt++){site=await req('sites/'+r.siteId);if(site.published_deploy.id===r.deploy_id){verified=true;break}if(site.published_deploy.id!==r.previous_deploy_id)throw Error('Unrelated deployment appeared during promotion');await new Promise(resolve=>setTimeout(resolve,500))}if(!verified)throw Error('Promotion did not become visible');if(!site.published_deploy.locked)await req('deploys/'+r.deploy_id+'/lock','POST',{});out.promoted=true;out.promoted_at=new Date().toISOString();save();console.log(r.app+'/'+r.environment+': prepared authentication deployment promoted; lock retained for final checks.')}catch(e){out.error=e.message;save();throw e}});\nreport.complete=report.sites.every(r=>r.promoted);report.finished_at=new Date().toISOString();save();console.log('Coordinated promotions complete: '+report.sites.filter(r=>r.promoted).length+' of '+rows.length);\n})().catch(e=>{console.error(e.message&&/^(Invalid prepared|Promotion API|Site ownership|Published deployment|Prepared candidate|Cutover signal|No coordinated|Publication changed|Unrelated deployment|Promotion did not)/.test(e.message)?e.message:'Prepared promotion stopped; inspect private metadata before retrying.');process.exitCode=1});\n");
          NODE
      - name: Verify every candidate and current publication
        run: node promotion.cts preflight
      - name: Wait for coordinated switch and promote
        run: node promotion.cts promote
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: incident-auth-promotion-production-${{ github.run_id }}
          path: promotion.json
          retention-days: 2
