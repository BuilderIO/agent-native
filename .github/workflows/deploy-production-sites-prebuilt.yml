name: Stage beta CRM encryption readers
on: workflow_dispatch
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PREVIOUS_KEYS: ${{ secrets.INCIDENT_CRM_BETA_PREVIOUS_KEYS }}
        with:
          script: |
            const sid='bef68db5-5bbc-41c6-b3d8-edeb7b871b5e';
            const key='SECRETS_ENCRYPTION_KEYS_PREVIOUS';
            const headers={Authorization:'Bearer '+process.env.NETLIFY_AUTH_TOKEN,'Content-Type':'application/json'};
            async function req(path,options={}){const r=await fetch('https://api.netlify.com/api/v1/'+path,{headers,...options});if(!r.ok)throw new Error('Netlify reader staging HTTP '+r.status);return r.status===204?null:await r.json()}
            const site=await req('sites/'+sid);
            if(site.id!==sid||site.account_slug!=='steve8708'||site.custom_domain!=='beta.crm.agent-native.com')throw new Error('Beta CRM ownership changed');
            const endpoint='accounts/'+site.account_slug+'/env?site_id='+sid;
            const entries=await req(endpoint);
            if(entries.some(e=>e.key===key))throw new Error('Reader variable already exists; inspect before retrying');
            const value=process.env.PREVIOUS_KEYS;
            if(!value||value.length<64)throw new Error('Prepared reader material is missing');
            const contexts=['production','branch-deploy','deploy-preview'];
            await req(endpoint,{method:'POST',body:JSON.stringify([{key,is_secret:true,scopes:['builds','functions'],values:contexts.map(context=>({context,value}))}])});
            const entry=(await req(endpoint)).find(e=>e.key===key);
            if(!entry||!entry.is_secret||!entry.scopes.includes('functions')||!contexts.every(context=>entry.values.some(v=>v.context===context)))throw new Error('Reader staging metadata readback failed');
            core.info('Created and verified beta CRM previous-key reader configuration; current writer and authentication keys unchanged.');
