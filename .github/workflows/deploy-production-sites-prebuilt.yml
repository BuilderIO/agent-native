name: Stage encryption readers on production sites
on: workflow_dispatch
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Build ${{ matrix.site }} production artifact
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        site: [clips]
    uses: ./.github/workflows/deploy-netlify-prebuilt.yml
    with:
      target: production
      site: ${{ matrix.site }}
      caller: manual
      source_ref: 32037392301280b203e61f692c690fba1328c4ea
      build_context: production
      deploy: true
      deploy_mode: production
      smoke: true
      migration_only: false
      artifact_upload: false
      artifact_download: true
      checkout_ref: 32037392301280b203e61f692c690fba1328c4ea
      artifact_name: incident-encryption-prod-${{ matrix.site }}-42423863070
    secrets: inherit
