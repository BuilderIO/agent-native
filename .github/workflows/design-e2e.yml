name: Design E2E (browser)

on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch: {}

concurrency:
  group: design-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    # Reserve time after the shard timeout for setup and report upload.
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: design_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d design_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Deleted in parallel because these are independent inode-heavy trees and
      # doing them serially cost ~110s per shard. `docker system prune` is not
      # worth its runtime here: the only image in play is the postgres service,
      # which is running and therefore never pruned.
      - name: Free disk for the design build and browser
        run: |
          for dir in /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                     /usr/local/lib/android /usr/local/share/boost \
                     /usr/share/dotnet /usr/share/swift; do
            sudo rm -rf "$dir" &
          done
          wait
          df -h /

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell --with-deps chromium

      - name: Migrate the isolated test database
        working-directory: templates/design
        env:
          APP_NAME: design
          E2E_DATABASE_URL: postgres://postgres@127.0.0.1:5432/design_e2e
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/design_e2e
          DESIGN_DATABASE_URL: postgres://postgres@127.0.0.1:5432/design_e2e
        run: pnpm migrate:production

      - name: Run shard
        id: run-shard
        working-directory: templates/design
        timeout-minutes: 37
        env:
          E2E_DATABASE_URL: postgres://postgres@127.0.0.1:5432/design_e2e
        run: |
          mkdir -p .react-router/types
          pnpm exec playwright test --shard=${{ matrix.shard }}/8

      - name: Upload report on failure
        if: ${{ !cancelled() && steps.run-shard.outcome != 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-e2e-report-${{ matrix.shard }}
          path: templates/design/test-results
          retention-days: 7
          if-no-files-found: warn
