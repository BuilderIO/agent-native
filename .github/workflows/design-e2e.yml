name: Design E2E (browser)

# Post-merge only: a red canvas suite must not block an unrelated merge, and
# this does not gate the beta deploy. Sharded because the suite is workers:1,
# and shard granularity is per FILE, so a single fat spec sets the floor.
# Known-broken tests carry test.fixme() with the symptom, so a red run here
# means something that was passing broke.

on:
  push:
    branches: [main]
    paths:
      - "templates/design/**"
      - "packages/core/**"
      - "packages/toolkit/**"
      - "packages/creative-context/**"
      - ".github/workflows/design-e2e.yml"
  workflow_dispatch:

concurrency:
  group: design-e2e
  # Preserve the active 8-shard run while newer commits replace pending runs.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # One PGlite instance does not survive a ~15-minute workers:1 shard: it
    # starts raising `stack depth limit exceeded` and never recovers, so every
    # later query — session lookup included — fails and the shard 401s out.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: design_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d design_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deleted in parallel because these are independent inode-heavy trees and
      # doing them serially cost ~110s per shard. `docker system prune` is not
      # worth its runtime here: the only image in play is the postgres service,
      # which is running and therefore never pruned.
      - name: Free disk for the design build and browser
        run: |
          for dir in /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                     /usr/local/lib/android /usr/local/share/boost \
                     /usr/share/dotnet /usr/share/swift; do
            sudo rm -rf "$dir" &
          done
          wait
          df -h /

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell --with-deps chromium

      - name: Run shard
        working-directory: templates/design
        env:
          E2E_DATABASE_URL: postgres://postgres@127.0.0.1:5432/design_e2e
        run: |
          mkdir -p .react-router/types
          pnpm exec playwright test --shard=${{ matrix.shard }}/8

      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: design-e2e-report-${{ matrix.shard }}
          path: templates/design/test-results
          retention-days: 7
          if-no-files-found: ignore
