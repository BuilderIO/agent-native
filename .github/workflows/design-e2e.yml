name: Design E2E (browser)


on:
  push:
    branches: [main]
    paths:
      - "templates/design/**"
      - "packages/core/**"
      - "packages/toolkit/**"
      - "packages/creative-context/**"
      - ".github/workflows/design-e2e.yml"
  workflow_dispatch:

concurrency:
  group: design-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: design_e2e
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d design_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Free disk for the design build and browser
        run: |
          for dir in /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                     /usr/local/lib/android /usr/local/share/boost \
                     /usr/share/dotnet /usr/share/swift; do
            sudo rm -rf "$dir" &
          done
          wait
          df -h /

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell --with-deps chromium

      - name: Run shard
        working-directory: templates/design
        env:
          E2E_DATABASE_URL: postgres://postgres@127.0.0.1:5432/design_e2e
        run: |
          mkdir -p .react-router/types
          pnpm exec playwright test --shard=${{ matrix.shard }}/8

      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: design-e2e-report-${{ matrix.shard }}
          path: templates/design/test-results
          retention-days: 7
          if-no-files-found: ignore
