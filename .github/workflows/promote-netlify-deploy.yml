name: Promote Netlify deploy

# Netlify has no native "jump the queue" primitive: production builds share a
# per-account concurrency pool, so when one site is busted it can sit behind a
# backlog of other sites' queued builds. This manual workflow prioritizes a
# single site by (a) cancelling queued-but-not-yet-started production deploys
# for the target site, (b) optionally cancelling OTHER sites' queued production
# deploys to free build slots, and (c) triggering a fresh production build of
# the target site so the latest main ships immediately. In-progress deploys are
# never cancelled.

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to prioritize, or all production sites
        required: true
        type: choice
        default: all
        options:
          - all
          - assets
          - brain
          - design
          - clips
          - crm
          - starter
          - slides
          - mail
          - macros
          - forms
          - plan
          - dispatch
          - content
          - calendar
          - analytics
          - factory
          - fw
      clear_others:
        description: Cancel other sites' queued (not in-progress) production deploys to free build slots
        required: false
        type: boolean
        default: true
      rebuild:
        description: Trigger a fresh production build of the target site
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Promotion has its own queue; the fleet caller coordinates individual
  # sites at the job level so a promotion cannot replace a pending fleet run.
  group: agent-native-production-promote-${{ inputs.site }}
  cancel-in-progress: false

jobs:
  resolve-sites:
    name: Resolve promotion site matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: scripts/netlify-sites.json
          sparse-checkout-cone-mode: false

      - name: Build one coordination slot per site
        id: matrix
        env:
          TARGET: ${{ inputs.site }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const sites = JSON.parse(fs.readFileSync('scripts/netlify-sites.json', 'utf8'));
          const requested = process.env.TARGET.trim().toLowerCase();
          if (!requested) throw new Error('site must be all or one production site.');
          const names = requested === 'all' ? Object.keys(sites) : [requested];
          const unknown = names.filter((name) => !sites[name]);
          if (unknown.length) throw new Error(`Unknown site(s): ${unknown.join(', ')}`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `matrix=${JSON.stringify({
              include: names.map((site) => ({ site, site_id: sites[site] })),
            })}\n`,
          );
          console.log(`Resolved ${names.length} promotion site(s): ${names.join(', ')}`);
          NODE

  promote:
    name: Promote ${{ matrix.site }} production deploy
    needs: resolve-sites
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.resolve-sites.outputs.matrix) }}
    concurrency:
      # Use the same per-site queue as fleet deploys and manager operations.
      # This prevents restore from racing a prebuilt unlock/upload window.
      group: agent-native-production-site-${{ matrix.site }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: scripts/netlify-sites.json
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          TARGET: ${{ matrix.site }}
          TARGET_ID: ${{ matrix.site_id }}
          REQUESTED_SITE: ${{ inputs.site }}
          CLEAR_OTHERS: ${{ inputs.clear_others }}
          REBUILD: ${{ inputs.rebuild }}
        with:
          script: |
            const fs = require('fs');
            const sites = JSON.parse(fs.readFileSync('scripts/netlify-sites.json', 'utf8'));

            const token = process.env.NETLIFY_TOKEN;
            if (!token) {
              core.setFailed('NETLIFY_AUTH_TOKEN secret not set; cannot promote a deploy.');
              return;
            }

            const target = process.env.TARGET;
            const targetId = process.env.TARGET_ID;
            const requestedSite = process.env.REQUESTED_SITE;
            const ref = 'main';
            if (!sites[target] || sites[target] !== targetId) {
              core.setFailed(`Unknown or mismatched site: ${target}`);
              return;
            }

            const clearOthers = process.env.CLEAR_OTHERS === 'true';
            const rebuild = process.env.REBUILD === 'true';
            const headers = { Authorization: `Bearer ${token}` };
            const API = 'https://api.netlify.com/api/v1';
            const CANCELABLE_STATES = new Set(['new', 'enqueued']);

            async function readJson(response, label) {
              const text = await response.text();
              let body;
              try {
                body = text ? JSON.parse(text) : null;
              } catch {
                body = text;
              }
              if (!response.ok) {
                throw new Error(`${label} failed with HTTP ${response.status}: ${typeof body === 'string' ? body : JSON.stringify(body)}`);
              }
              return body;
            }

            async function buildAndPublish(name, id) {
              const query = new URLSearchParams({ branch: ref });
              const build = await readJson(
                await fetch(`${API}/sites/${id}/builds?${query}`, {
                  method: 'POST',
                  headers,
                }),
                `[${name}] build trigger`,
              );
              if (!build?.id) {
                throw new Error(`[${name}] Netlify did not return a build id.`);
              }
              core.info(`[${name}] queued production build ${build.id} for branch ${ref}.`);

              const deadline = Date.now() + 30 * 60 * 1000;
              let completed = build;
              while (!completed.done && Date.now() < deadline) {
                await new Promise(resolve => setTimeout(resolve, 10_000));
                completed = await readJson(
                  await fetch(`${API}/builds/${build.id}`, { headers }),
                  `[${name}] build status`,
                );
              }
              if (!completed.done) {
                throw new Error(`[${name}] build ${build.id} did not finish within 30 minutes.`);
              }
              if (completed.error) {
                throw new Error(`[${name}] build ${build.id} failed: ${completed.error}`);
              }
              if (!completed.deploy_id) {
                throw new Error(`[${name}] build ${build.id} completed without a deploy id.`);
              }

              await readJson(
                await fetch(`${API}/sites/${id}/deploys/${completed.deploy_id}/restore`, {
                  method: 'POST',
                  headers,
                }),
                `[${name}] publish deploy ${completed.deploy_id}`,
              );
              core.info(`[${name}] published deploy ${completed.deploy_id} from ${ref}.`);
            }

            async function cancelQueuedProductionDeploys(name, id, options = {}) {
              const url = `https://api.netlify.com/api/v1/sites/${id}/deploys?per_page=100`;
              let r;
              try {
                r = await fetch(url, { headers });
              } catch (err) {
                core.warning(`[${name}] list fetch failed: ${err?.message || err}`);
                return 0;
              }
              if (!r.ok) { core.warning(`[${name}] list ${r.status}`); return 0; }
              let deploys;
              try {
                deploys = await r.json();
              } catch (err) {
                core.warning(`[${name}] list json failed: ${err?.message || err}`);
                return 0;
              }
              const queued = deploys.filter(d =>
                d.context === 'production' && CANCELABLE_STATES.has(d.state)
              );
              const keepDeploy = options.keepNewest && queued.length
                ? queued
                    .slice()
                    .sort((a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')))[0]
                : null;
              const cancelable = keepDeploy
                ? queued.filter(d => d.id !== keepDeploy.id)
                : queued;
              if (keepDeploy) {
                core.info(`[${name}] keeping newest queued production deploy ${keepDeploy.id}; canceling older queued deploys only.`);
              }
              let ok = 0;
              for (const d of cancelable) {
                try {
                  const c = await fetch(`https://api.netlify.com/api/v1/deploys/${d.id}/cancel`, { method: 'POST', headers });
                  if (c.ok) ok++;
                } catch (err) {
                  core.warning(`[${name}] cancel ${d.id} failed: ${err?.message || err}`);
                }
              }
              if (cancelable.length) {
                core.info(`[${name}] freed ${ok}/${cancelable.length} queued production deploys`);
              }
              return ok;
            }

            if (clearOthers && requestedSite !== 'all') {
              const others = Object.entries(sites).filter(([name]) => name !== target);
              let freed = 0;
              await Promise.all(others.map(async ([name, id]) => {
                freed += await cancelQueuedProductionDeploys(name, id);
              }));
              core.info(`Cleared ${freed} queued production deploys across other sites.`);
            }

            if (rebuild) {
              await buildAndPublish(target, targetId);
            }
            const freedTarget = await cancelQueuedProductionDeploys(target, targetId, { keepNewest: true });
            core.info(`[${target}] ${rebuild ? 'cleared' : 'rebuild not requested; cleared'} ${freedTarget} older queued deploys.`);

            core.info(`Promotion complete for ${target} (ref=${ref}, clear_others=${clearOthers}, rebuild=${rebuild}).`);
