name: Publish isolated legacy encryption compatibility
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: legacy-encryption-compatibility-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create isolated snapshot versions through changesets
        run: |
          pnpm changeset version --snapshot incident-legacy-key-rotation
          pnpm install --lockfile-only --link-workspace-packages --ignore-scripts
      - name: Use the matching published UI dependency for the legacy build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-toolkit" node_modules/@types packages/toolkit/dist
          npm pack @agent-native/toolkit@0.13.8 --pack-destination "$RUNNER_TEMP/legacy-toolkit"
          tar -xzf "$RUNNER_TEMP/legacy-toolkit/agent-native-toolkit-0.13.8.tgz" -C "$RUNNER_TEMP/legacy-toolkit"
          cp -R "$RUNNER_TEMP/legacy-toolkit/package/dist/." packages/toolkit/dist/
          ln -s ../../packages/core/node_modules/@types/react node_modules/@types/react
      - name: Build legacy Core prerequisites
        run: pnpm --filter @agent-native/recap-cli --filter @agent-native/shared-app-config build
      - name: Verify and build the legacy Core package
        run: |
          pnpm exec vitest run packages/core/src/secrets/crypto.spec.ts packages/core/src/private-blob/registry.spec.ts
          pnpm --filter @agent-native/core build
      - name: Publish only Core under the isolated incident tag
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-core"
          pnpm --dir packages/core pack --pack-destination "$RUNNER_TEMP/legacy-core"
          tarball=$(find "$RUNNER_TEMP/legacy-core" -name '*.tgz' -type f)
          test -n "$tarball"
          npm publish "$tarball" --access public --tag dev-incident-legacy-key-rotation --provenance
