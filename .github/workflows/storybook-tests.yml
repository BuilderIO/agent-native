name: Storybook story tests

# Renders every toolkit story in headless Chromium, once in light and once in
# dark: its play function, an axe check that fails on any violation in either
# appearance, and a screenshot of each.
#
# Pull requests call this from ci.yml and compare their screenshots with the
# baseline the latest successful run on main recorded. Visual differences are
# reported for review and never fail the job; crashes, failed play functions
# and axe violations do. Screenshots run only here, where Linux and Chromium
# are pinned, through STORYBOOK_VISUAL_REGRESSION; local runs never take them.
#
# A passing run publishes the static Storybook to its own Netlify site:
# storybook.agent-native.com from main, and a pr-<number> preview for a pull
# request, with that PR's visual changes at /visual-changes/. It is not an
# Agent-Native app, so it never goes through the beta or production site
# publishers.

on:
  workflow_call:
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: false
      STORYBOOK_NETLIFY_SITE_ID:
        required: false
  push:
    branches: [main]
    # The paths scripts/ci-change-scope.ts names for storybook_tests.
    paths:
      - "packages/design-system/**"
      - "packages/toolkit/src/**"
      - "packages/toolkit/dev/**"
      - "packages/toolkit/.storybook/**"
      - "packages/toolkit/vitest.storybook.config.ts"
      - "packages/toolkit/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/actions/setup-pnpm/action.yml"
      - ".github/workflows/storybook-tests.yml"

permissions:
  contents: read

jobs:
  storybook-tests:
    name: Storybook story tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Reads main's baseline artifact from another run.
      actions: read
    outputs:
      visual-review: ${{ steps.report.outputs.review }}
    concurrency:
      # Pull requests ride CI's own cancellation. A baseline recording on main
      # is never cancelled mid-upload.
      group: ${{ github.event_name == 'push' && format('storybook-baselines-{0}', github.ref) || format('storybook-tests-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm --filter @agent-native/toolkit exec playwright install --only-shell --with-deps chromium

      - name: Test the visual report
        run: pnpm --filter @agent-native/toolkit exec vitest run --dir dev/visual-regression

      - name: Build static Storybook
        timeout-minutes: 10
        run: |
          set -euo pipefail
          pnpm --filter @agent-native/toolkit storybook:build
          test -s .tmp/storybook-static/index.json
          test -s .tmp/storybook-static/manifests/components.json

      - name: Upload static Storybook
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-static-${{ github.run_attempt }}
          path: .tmp/storybook-static/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      # No successful run on main yet means no baseline, which the report
      # says out loud. Any other gap (an API error, an expired artifact) fails.
      - name: Find the baseline from main
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" \
            --jq '.workflows[] | select(.path == ".github/workflows/storybook-tests.yml") | .id')"
          run_id=""
          if [ -n "$workflow_id" ]; then
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty')"
          fi
          if [ -z "$run_id" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          live="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?name=storybook-baselines" \
            --jq '[.artifacts[] | select(.expired | not)] | length')"
          if [ "$live" != "1" ]; then
            echo "::error::Main run $run_id passed, but its storybook-baselines artifact is missing or expired. Re-run Storybook story tests on main to record a new baseline."
            exit 1
          fi
          {
            echo "found=true"
            echo "run-id=$run_id"
          } >> "$GITHUB_OUTPUT"

      - name: Download the baseline
        if: steps.baseline.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-baselines
          path: .tmp/storybook-visual/baseline
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Choose record or compare
        id: visual
        run: |
          if [ "${{ steps.baseline.outputs.found }}" = "true" ]; then
            echo "mode=compare" >> "$GITHUB_OUTPUT"
          else
            echo "mode=record" >> "$GITHUB_OUTPUT"
          fi

      - name: Run story, accessibility and visual tests
        id: tests
        timeout-minutes: 15
        env:
          STORYBOOK_VISUAL_REGRESSION: ${{ steps.visual.outputs.mode }}
        run: pnpm --filter @agent-native/toolkit test:storybook

      - name: Report visual changes
        id: report
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: >-
          node --experimental-strip-types packages/toolkit/dev/visual-regression/report.ts
          --dir .tmp/storybook-visual
          --mode ${{ steps.visual.outputs.mode }}
          --out .tmp/storybook-visual/report
          --summary "$GITHUB_STEP_SUMMARY"
          --output "$GITHUB_OUTPUT"
          ${{ github.event_name == 'pull_request' && steps.visual.outputs.mode == 'record' && '--no-baseline' || '' }}

      - name: Upload the visual baseline
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-baselines
          path: .tmp/storybook-visual/baseline/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Upload the recorded screenshots
        if: github.event_name == 'pull_request' && steps.visual.outputs.mode == 'record' && steps.report.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-screenshots-${{ github.run_attempt }}
          path: .tmp/storybook-visual/baseline/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      - name: Upload visual changes
        if: ${{ !cancelled() && steps.report.outputs.review != '' && steps.report.outputs.review != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-visual-changes-${{ github.run_attempt }}
          path: .tmp/storybook-visual/report/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  # Runs no repository code: it publishes the files the test job built, with
  # a pinned CLI installed without lifecycle scripts, so the token never meets
  # code from the pull request.
  deploy:
    name: Deploy Storybook
    needs: storybook-tests
    # Fork pull requests get no secrets, so they get no preview.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.event_name == 'push' && 'storybook-deploy-production' || format('storybook-deploy-pr-{0}', github.event.pull_request.number) }}
      cancel-in-progress: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check the site settings
        id: site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          STORYBOOK_NETLIFY_SITE_ID: ${{ secrets.STORYBOOK_NETLIFY_SITE_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$NETLIFY_AUTH_TOKEN" ] || missing+=(NETLIFY_AUTH_TOKEN)
          [ -n "$STORYBOOK_NETLIFY_SITE_ID" ] || missing+=(STORYBOOK_NETLIFY_SITE_ID)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="Storybook was not published: the repository has no ${missing[*]} secret."
          if [ "$EVENT_NAME" = "push" ]; then
            echo "::error::$message"
            exit 1
          fi
          echo "::warning::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: Download the static Storybook
        if: steps.site.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-static-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storybook-static

      - name: Download the visual changes
        if: >-
          steps.site.outputs.ready == 'true' &&
          github.event_name == 'pull_request' &&
          needs.storybook-tests.outputs.visual-review != '' &&
          needs.storybook-tests.outputs.visual-review != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: storybook-visual-changes-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storybook-static/visual-changes

      - name: Install the pinned Netlify CLI
        if: steps.site.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          set -euo pipefail
          npm install --global --prefix "$HOME/.netlify-cli" netlify-cli@27.5.2 --ignore-scripts
          echo "$HOME/.netlify-cli/bin" >> "$GITHUB_PATH"

      - name: Publish
        if: steps.site.outputs.ready == 'true'
        # Outside the checkout, so no netlify.toml can change what is deployed.
        working-directory: ${{ runner.temp }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.STORYBOOK_NETLIFY_SITE_ID }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.sha }}
          VISUAL_REVIEW: ${{ needs.storybook-tests.outputs.visual-review }}
        run: |
          set -euo pipefail
          deploy_args=(
            --site "$NETLIFY_SITE_ID"
            --dir storybook-static
            --no-build
          )
          if [ "$EVENT_NAME" = "push" ]; then
            deploy_args+=(--prod --message "main ${SOURCE_SHA}")
          else
            deploy_args+=(--alias "pr-${PULL_REQUEST_NUMBER}" --message "PR #${PULL_REQUEST_NUMBER} ${SOURCE_SHA}")
          fi
          deploy_json="$RUNNER_TEMP/storybook-deploy.json"
          netlify deploy "${deploy_args[@]}" --json > "$deploy_json"
          url="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(process.argv[1], "utf8"));
            process.stdout.write(
              process.env.EVENT_NAME === "push"
                ? result.url || ""
                : result.deploy_url || "",
            );
          ' "$deploy_json")"
          if [[ "$url" != https://* ]]; then
            echo "::error::Netlify did not return a URL for the Storybook deploy."
            cat "$deploy_json"
            exit 1
          fi
          {
            echo "### Storybook"
            echo
            echo "Published to $url"
            if [ -n "$VISUAL_REVIEW" ] && [ "$VISUAL_REVIEW" != "0" ]; then
              echo
              echo "Visual changes to review: ${url%/}/visual-changes/"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Storybook::$url"
