name: Deploy app workspace bundle

on:
  push:
    branches: [main]
  schedule:
    # Run at both UTC hours that can be noon in America/Los_Angeles. The job
    # keeps only the local-noon invocation, so daylight-saving changes do not
    # move the weekday release.
    - cron: "0 19,20 * * 1-5"
  workflow_dispatch:
    inputs:
      lane:
        description: Site to publish
        required: true
        type: choice
        default: beta
        options:
          - beta
          - production

permissions:
  contents: read

concurrency:
  group: app-workspace-${{ github.event_name == 'schedule' || inputs.lane == 'production' && 'production' || 'beta' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish app workspace bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ github.event_name == 'schedule' || inputs.lane == 'production' && secrets.NETLIFY_COMMUNITY_PRODUCTION_SITE_ID || secrets.NETLIFY_COMMUNITY_BETA_SITE_ID }}
    steps:
      - name: Check publish lane
        id: gate
        run: |
          set -euo pipefail
          ready=true
          if [[ -z "$NETLIFY_AUTH_TOKEN" || -z "$NETLIFY_SITE_ID" ]]; then
            ready=false
            echo "Netlify app-workspace credentials are not configured; skipping publish."
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(TZ=America/Los_Angeles date +%H)" != "12" ]]; then
            ready=false
            echo "This UTC tick is not noon in America/Los_Angeles; skipping."
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != "true" ]]; then
            {
              echo "### App workspace publish skipped"
              echo "The configured lane was not ready to publish."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.gate.outputs.ready == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run shared database release migrations
        if: steps.gate.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.COMMUNITY_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::COMMUNITY_DATABASE_URL is required for the app workspace deploy."
            exit 1
          fi
          pnpm --dir community-templates/account-expert migrate:production

      - name: Build the bundle
        if: steps.gate.outputs.ready == 'true'
        run: pnpm --dir community-templates exec agent-native deploy --preset=netlify --build-only

      - name: Install the pinned Netlify CLI
        if: steps.gate.outputs.ready == 'true'
        run: npm install --global netlify-cli@27.5.2 @netlify/build@36.4.8 --ignore-scripts

      - name: Publish the prebuilt bundle
        if: steps.gate.outputs.ready == 'true'
        run: |
          netlify deploy \
            --site "$NETLIFY_SITE_ID" \
            --filter "@agent-native/community-templates" \
            --dir community-templates/dist \
            --functions .netlify/functions-internal \
            --no-build \
            --prod \
            --message "App workspace bundle ${GITHUB_SHA}"
