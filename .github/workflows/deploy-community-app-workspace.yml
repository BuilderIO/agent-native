name: Deploy app workspace bundle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-community-app-workspace.yml"
      - "community-templates/**"
      - "packages/**"
      - "scripts/prebuild-workspace-packages.ts"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
  schedule:
    - cron: "0 19,20 * * 1-5"
  workflow_dispatch:
    inputs:
      lane:
        description: Site to publish
        required: true
        type: choice
        default: beta
        options:
          - beta
          - production

permissions:
  contents: read

concurrency:
  group: app-workspace-${{ (github.event_name == 'schedule' || inputs.lane == 'production') && 'production' || 'beta' }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish app workspace bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_ACCOUNT_ID: ${{ secrets.NETLIFY_ACCOUNT_ID }}
    steps:
      - name: Select deployment lane
        id: lane
        env:
          DISPATCH_LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$DISPATCH_LANE" == "production" ]]; then
            echo "site_id_secret=NETLIFY_COMMUNITY_PRODUCTION_SITE_ID" >> "$GITHUB_OUTPUT"
            echo "database_url_secret=COMMUNITY_DATABASE_URL" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "push" || "$DISPATCH_LANE" == "beta" ]]; then
            echo "site_id_secret=NETLIFY_COMMUNITY_BETA_SITE_ID" >> "$GITHUB_OUTPUT"
            echo "database_url_secret=COMMUNITY_BETA_DATABASE_URL" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported app-workspace deployment lane."
            exit 1
          fi

      - name: Check publish lane
        id: gate
        env:
          NETLIFY_SITE_ID: ${{ secrets[steps.lane.outputs.site_id_secret] }}
          COMMUNITY_DATABASE_URL: ${{ secrets[steps.lane.outputs.database_url_secret] }}
        run: |
          set -euo pipefail
          ready=false
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$(TZ=America/Los_Angeles date +%H)" != "12" ]]; then
            echo "This UTC tick is not noon in America/Los_Angeles; skipping."
          elif [[ -z "$NETLIFY_AUTH_TOKEN" || -z "$NETLIFY_ACCOUNT_ID" || -z "$NETLIFY_SITE_ID" ]]; then
            echo "Netlify app-workspace credentials are not configured; skipping publish."
          elif [[ -z "$COMMUNITY_DATABASE_URL" ]]; then
            echo "::error::The selected app-workspace database secret is not configured."
            exit 1
          else
            ready=true
          fi
          if [[ "$ready" != "true" ]]; then
            {
              echo "### App workspace publish skipped"
              echo "The configured lane was not ready to publish."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: steps.gate.outputs.ready == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install the pinned Netlify CLI
        if: steps.gate.outputs.ready == 'true'
        run: npm install --global netlify-cli@27.9.0 @netlify/build@37.0.0 --ignore-scripts

      - name: Run shared database release migrations
        if: steps.gate.outputs.ready == 'true'
        env:
          CONTEXT: production
          DATABASE_URL: ${{ secrets[steps.lane.outputs.database_url_secret] }}
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::The matching Community database secret is required for this app workspace deploy."
            exit 1
          fi
          pnpm --dir community-templates/account-expert migrate:production

      - name: Build the bundle
        if: steps.gate.outputs.ready == 'true'
        env:
          AGENT_NATIVE_RELEASE_MIGRATIONS: "1"
          CONTEXT: production
        run: pnpm --dir community-templates exec agent-native deploy --preset=netlify --build-only

      - name: Point the runtime to the migrated database
        if: steps.gate.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets[steps.lane.outputs.database_url_secret] }}
          NETLIFY_SITE_ID: ${{ secrets[steps.lane.outputs.site_id_secret] }}
        run: |
          set -euo pipefail
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::The matching Community database secret is required for this app workspace deploy."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const { NETLIFY_AUTH_TOKEN, NETLIFY_ACCOUNT_ID, NETLIFY_SITE_ID, DATABASE_URL } = process.env;
          const headers = {
            Authorization: `Bearer ${NETLIFY_AUTH_TOKEN}`,
            "Content-Type": "application/json",
          };
          const query = new URLSearchParams({ site_id: NETLIFY_SITE_ID });
          const endpoint = `https://api.netlify.com/api/v1/accounts/${encodeURIComponent(NETLIFY_ACCOUNT_ID)}/env`;
          const responseDetails = (response) => {
            const requestId = response.headers.get("x-nf-request-id");
            return `HTTP ${response.status}${requestId ? ` (Netlify request ${requestId})` : ""}`;
          };
          const readVariables = async () => {
            const response = await fetch(`${endpoint}?${query}`, { headers });
            if (!response.ok) {
              throw new Error(`Could not read Netlify environment metadata (${responseDetails(response)}).`);
            }
            return response.json();
          };
          const readSiteVariable = async (key) => {
            const response = await fetch(`${endpoint}/${encodeURIComponent(key)}?${query}`, { headers });
            if (response.status === 404) return null;
            if (!response.ok) {
              throw new Error(`Could not read the Netlify ${key} environment metadata (${responseDetails(response)}).`);
            }
            return response.json();
          };
          const variables = await readVariables();
          const appDatabaseOverride = variables.some(({ key, scopes, values }) => {
            const isPrefixedDatabaseUrl =
              key.endsWith("_DATABASE_URL") || key.endsWith("_DATABASE_URL_UNPOOLED");
            const availableToFunctions = !Array.isArray(scopes) || scopes.includes("functions");
            const availableInProduction =
              !Array.isArray(values) ||
              values.some(({ context }) => ["all", "production"].includes(context));
            return isPrefixedDatabaseUrl && availableToFunctions && availableInProduction;
          });
          if (appDatabaseOverride) {
            throw new Error("A production app-specific database URL would override the shared Community database.");
          }
          const configureDatabaseVariable = async (key) => {
            const existingVariable = await readSiteVariable(key);
            const existingValues = existingVariable?.values ?? [];
            const preservedValues = existingValues.filter(
              ({ context }) => context !== "production",
            );
            const unreadableContexts =
              existingVariable?.is_secret === true
                ? preservedValues
                    .filter(({ context }) => context !== "dev")
                    .map(({ context }) => context)
                : [];
            if (unreadableContexts.length > 0) {
              throw new Error(
                `Cannot safely update ${key}; Netlify does not return existing secret values for these contexts: ${unreadableContexts.join(", ")}.`,
              );
            }
            if (
              preservedValues.some(
                ({ context, value }) =>
                  context === "all" || typeof value !== "string",
              )
            ) {
              throw new Error(
                `Cannot safely preserve the existing ${key} environment variable contexts.`,
              );
            }
            const existingScopes = Array.isArray(existingVariable?.scopes)
              ? existingVariable.scopes.filter(
                  (scope) => scope !== "post-processing",
                )
              : existingVariable
                ? ["builds", "functions", "runtime"]
                : [];
            const variable = {
              key,
              scopes: [...new Set([...existingScopes, "functions"])],
              values: [
                ...preservedValues.map(
                  ({ context, context_parameter, value }) => ({
                    context,
                    ...(context_parameter ? { context_parameter } : {}),
                    value,
                  }),
                ),
                { context: "production", value: DATABASE_URL },
              ],
              is_secret: true,
            };
            const update = await fetch(
              existingVariable
                ? `${endpoint}/${encodeURIComponent(key)}?${query}`
                : `${endpoint}?${query}`,
              {
                method: existingVariable ? "PUT" : "POST",
                headers,
                body: JSON.stringify(existingVariable ? variable : [variable]),
              },
            );
            if (!update.ok) {
              throw new Error(`Could not configure the Community ${key} environment variable (${responseDetails(update)}).`);
            }
            return readSiteVariable(key);
          };
          const verifiedRuntimeDatabase = await configureDatabaseVariable("DATABASE_URL");
          const verifiedUnpooledDatabase = await configureDatabaseVariable("DATABASE_URL_UNPOOLED");
          const hasProductionFunctionValue = (variable) =>
            variable?.is_secret === true &&
            variable.scopes?.includes("functions") &&
            variable.values?.some(({ context }) =>
              ["all", "production"].includes(context),
            );
          if (
            !hasProductionFunctionValue(verifiedRuntimeDatabase) ||
            !hasProductionFunctionValue(verifiedUnpooledDatabase)
          ) {
            throw new Error("The Community runtime and migration database URLs must both be secret and available to production Functions.");
          }
          console.log("Runtime database metadata verified for Netlify Functions.");
          NODE

      - name: Publish the prebuilt bundle
        if: steps.gate.outputs.ready == 'true'
        env:
          NETLIFY_SITE_ID: ${{ secrets[steps.lane.outputs.site_id_secret] }}
        run: |
          netlify deploy \
            --site "$NETLIFY_SITE_ID" \
            --filter "@agent-native/community-templates" \
            --dir community-templates/dist \
            --functions .netlify/functions-internal \
            --no-build \
            --prod \
            --message "App workspace bundle ${GITHUB_SHA}"
