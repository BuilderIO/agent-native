name: Deploy Netlify prebuilt artifacts from GitHub Actions

# GitHub Actions owns builds for the canonical beta, production, and PR preview
# sites. Netlify only receives the resulting prebuilt artifact and serves it.
#
# Safe rollout:
#   1. deploy=false + build_context=deploy-preview validates the GitHub runner.
#   2. deploy=true + deploy_mode=draft validates a non-live Netlify upload.
#   3. deploy=true + deploy_mode=production publishes after readiness checks.
#
# Production deploys use the production Netlify build context because the
# existing netlify.toml commands own the current production environment setup
# and migration behavior. Keep this lane manual until that behavior is audited.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Netlify site family and source branch
        required: true
        type: choice
        default: beta
        options:
          - beta
          - production
      site:
        description: One site id (chat and starter are accepted aliases)
        required: true
        type: string
        default: chat
      build_context:
        description: Netlify context used by the local build
        required: true
        type: choice
        default: deploy-preview
        options:
          - branch-deploy
          - deploy-preview
          - production
      source_ref:
        description: Optional exact commit or ref to build
        required: false
        type: string
        default: ""
      deploy:
        description: Upload the prebuilt output to Netlify
        required: true
        type: boolean
        default: false
      deploy_mode:
        description: Draft creates a non-live deploy; production publishes it
        required: true
        type: choice
        default: draft
        options:
          - draft
          - production
      smoke:
        description: Probe the resulting deploy after upload
        required: true
        type: boolean
        default: true
      artifact_upload:
        description: Package the built output for a separate trusted upload job
        required: true
        type: boolean
        default: false
      artifact_download:
        description: Deploy a prebuilt artifact without checking out PR code
        required: true
        type: boolean
        default: false
      artifact_name:
        description: GitHub Actions artifact name for a prebuilt deploy
        required: false
        type: string
        default: ""
      checkout_ref:
        description: Trusted checkout revision used for artifact-only deploys
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      target:
        required: false
        type: string
        default: beta
      site:
        required: true
        type: string
      build_context:
        required: false
        type: string
        default: deploy-preview
      source_ref:
        required: false
        type: string
        default: ""
      deploy:
        required: false
        type: boolean
        default: false
      deploy_mode:
        required: false
        type: string
        default: draft
      smoke:
        required: false
        type: boolean
        default: true
      caller:
        required: false
        type: string
        default: direct
      migration_only:
        required: false
        type: boolean
        default: false
      skip_build_migrations:
        required: false
        type: boolean
        default: false
      artifact_upload:
        required: false
        type: boolean
        default: false
      artifact_download:
        required: false
        type: boolean
        default: false
      artifact_name:
        required: false
        type: string
        default: ""
      checkout_ref:
        required: false
        type: string
        default: ""
      pull_request_number:
        required: false
        type: number
        default: 0
      preview_alias:
        required: false
        type: string
        default: ""
    secrets:
      NETLIFY_AUTH_TOKEN:
        required: false
      ANALYTICS_DATABASE_URL:
        required: false
      PLAN_DATABASE_URL:
        required: false
      CLIPS_DATABASE_URL:
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # Direct production dispatches share the per-site queue with the fleet,
  # manager, and promotion jobs. Release migrations use a separate queue.
  # Beta uploads share one per-site queue. Keep an accepted publisher alive and
  # coalesce only pending beta children; manual validation must not evict a
  # pending automatic publish, and production lanes are also non-canceling.
  group: >-
    ${{ inputs.caller == 'release-migration'
        && inputs.target == 'production'
        && format('agent-native-production-site-{0}', inputs.site)
        || inputs.caller == 'release-migration'
        && 'agent-native-release-migrations'
        || inputs.target == 'beta'
        && github.event_name == 'workflow_dispatch'
        && !inputs.caller
        && format('netlify-prebuilt-beta-direct-{0}-{1}', inputs.site, github.run_id)
        || inputs.target == 'beta'
        && format('netlify-prebuilt-beta-{0}', inputs.site)
        || inputs.caller == 'fleet'
        && format('netlify-prebuilt-child-{0}-{1}', inputs.target, inputs.site)
        || inputs.target == 'production'
        && format('agent-native-production-site-{0}', inputs.site)
        || format('netlify-prebuilt-{0}-{1}', inputs.target, inputs.site) }}
  # An accepted beta upload must finish so its external Netlify deploy can be
  # reconciled; a newer caller replaces the pending child in this queue.
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.target }} ${{ inputs.site }} prebuilt deploy
    runs-on: ubuntu-latest
    # Reserve time for stale beta cleanup after the 30-minute publish wait.
    timeout-minutes: 100
    steps:
      - name: Validate the source revision
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          TARGET: ${{ inputs.target }}
          CALLER: ${{ inputs.caller }}
        with:
          script: |
            const requested = process.env.SOURCE_REF.trim();
            const target = process.env.TARGET;
            if (target === 'production') {
              const mainSha = (await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/main',
              })).data.object.sha;
              const sourceSha = requested || mainSha;
              if (!/^[0-9a-f]{40}$/i.test(sourceSha)) {
                core.setFailed('Production source_ref must be a full 40-character commit SHA.');
                return;
              }
              if (requested) {
                const comparison = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: sourceSha,
                  head: mainSha,
                });
                if (!['ahead', 'identical'].includes(comparison.data.status)) {
                  core.setFailed(`Production source ${sourceSha} is not an ancestor of main ${mainSha}.`);
                  return;
                }
              }
              core.setOutput('source_ref', sourceSha);
              return;
            }
            if (target === 'preview') {
              const sourceSha = requested || context.sha;
              if (!/^[0-9a-f]{40}$/i.test(sourceSha)) {
                core.setFailed('Preview source_ref must be a full 40-character commit SHA.');
                return;
              }
              core.setOutput('source_ref', sourceSha);
              return;
            }
            if (target === 'beta') {
              if (context.eventName === 'workflow_dispatch' && !process.env.CALLER.trim()) {
                core.setFailed('Direct beta dispatch is unsupported; use deploy-beta-sites-prebuilt.yml.');
                return;
              }
              const mainSha = (await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/main',
              })).data.object.sha;
              const sourceSha = requested || mainSha;
              if (!/^[0-9a-f]{40}$/i.test(sourceSha)) {
                core.setFailed('Beta source_ref must be a full 40-character commit SHA.');
                return;
              }
              if (sourceSha.toLowerCase() !== mainSha.toLowerCase()) {
                core.setFailed(`Beta source_ref must equal current main ${mainSha}.`);
                return;
              }
              core.setOutput('source_ref', sourceSha);
              return;
            }
            core.setFailed(`Unknown deployment target: ${target}`);

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Artifact-only preview uploads use the trusted base revision for
          # target resolution and deployment scripts; PR code stays in the
          # separate build job that has no deployment secrets.
          ref: ${{ inputs.checkout_ref || steps.source.outputs.source_ref }}
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install the pinned Netlify CLI
        run: npm install --global netlify-cli@27.0.0 --ignore-scripts

      - name: Validate rollout mode
        env:
          BUILD_CONTEXT: ${{ inputs.build_context }}
          DEPLOY: ${{ inputs.deploy }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          MIGRATION_ONLY: ${{ inputs.migration_only }}
          PREVIEW_ALIAS: ${{ inputs.preview_alias }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          SITE: ${{ inputs.site }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [[ "$DEPLOY" != "true" && "$DEPLOY_MODE" != "draft" ]]; then
            echo "::error::deploy_mode=production requires deploy=true."
            exit 1
          fi

          if [[ "$BUILD_CONTEXT" == "production" && "$MIGRATION_ONLY" != "true" && ( "$DEPLOY" != "true" || "$DEPLOY_MODE" != "production" ) ]]; then
            echo "::error::The production Netlify build context can run migrations; pair it with an explicit production deploy."
            exit 1
          fi

          if [[ "$MIGRATION_ONLY" == "true" && ( "$DEPLOY" == "true" || "$DEPLOY_MODE" != "draft" ) ]]; then
            echo "::error::Migration-only runs cannot create a Netlify deploy."
            exit 1
          fi

          if [[ "$TARGET" == "production" && "$BUILD_CONTEXT" != "production" ]]; then
            echo "::error::Production sites must use the production Netlify build context."
            exit 1
          fi

          if [[ "$TARGET" == "preview" && "$DEPLOY" == "true" && ( "$BUILD_CONTEXT" != "deploy-preview" || "$DEPLOY_MODE" != "draft" ) ]]; then
            echo "::error::PR previews must use build_context=deploy-preview and deploy_mode=draft."
            exit 1
          fi

          if [[ "$TARGET" == "preview" && "$DEPLOY" == "true" && ( "$PULL_REQUEST_NUMBER" -le 0 || -z "$PREVIEW_ALIAS" ) ]]; then
            echo "::error::PR previews require a pull request number and alias."
            exit 1
          fi

          if [[ "$TARGET" == "production" && ( "$SITE" == "chat" || "$SITE" == "www" ) ]]; then
            echo "::error::Production prebuilt dispatches must use canonical site ids (starter or fw), not aliases."
            exit 1
          fi

      - name: Resolve the canonical Netlify target
        id: target
        env:
          TARGET: ${{ inputs.target }}
          SITE: ${{ inputs.site }}
        run: >-
          node --experimental-strip-types scripts/netlify-prebuilt-target.ts
          --target "$TARGET"
          --site "$SITE"
          --github-output "$GITHUB_OUTPUT"

      - name: Download the prebuilt PR artifact
        if: inputs.artifact_download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/netlify-artifact

      - name: Select the deploy directories
        id: directories
        env:
          ARTIFACT_DOWNLOAD: ${{ inputs.artifact_download }}
          TARGET: ${{ inputs.target }}
          TARGET_FUNCTIONS_DIRECTORY: ${{ steps.target.outputs.functions_directory }}
          TARGET_PUBLISH_DIRECTORY: ${{ steps.target.outputs.publish_directory }}
        run: |
          set -euo pipefail
          if [[ "$ARTIFACT_DOWNLOAD" == "true" ]]; then
            echo "publish_directory=$RUNNER_TEMP/netlify-artifact/publish" >> "$GITHUB_OUTPUT"
            if [[ "$TARGET" == "preview" ]]; then
              echo "functions_directory=$TARGET_FUNCTIONS_DIRECTORY" >> "$GITHUB_OUTPUT"
            else
              echo "functions_directory=$RUNNER_TEMP/netlify-artifact/functions" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "functions_directory=$TARGET_FUNCTIONS_DIRECTORY" >> "$GITHUB_OUTPUT"
            echo "publish_directory=$TARGET_PUBLISH_DIRECTORY" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the release migration from the Netlify environment
        if: inputs.migration_only
        env:
          BUILD_CONTEXT: ${{ inputs.build_context }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          SOURCE_TEMPLATE: ${{ steps.target.outputs.source_template }}
        run: |
          set -euo pipefail
          : "${NETLIFY_AUTH_TOKEN:?NETLIFY_AUTH_TOKEN secret is required}"
          pnpm install --frozen-lockfile

          migration_database_url="$(
            netlify api getEnvVars \
              --data "{\"account_id\":\"builder-io\",\"site_id\":\"$NETLIFY_SITE_ID\"}" |
              BUILD_CONTEXT="$BUILD_CONTEXT" node --experimental-strip-types scripts/netlify-migration-url.ts
          )"
          if [[ -z "$migration_database_url" ]]; then
            echo "::error::Netlify did not provide a PostgreSQL migration URL for $NETLIFY_SITE_ID."
            exit 1
          fi
          export DATABASE_URL="$migration_database_url"

          for attempt in 1 2 3; do
            if pnpm --filter "$SOURCE_TEMPLATE" migrate:production; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 30))
              echo "Migration attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::Release migration failed after 3 attempts."
          exit 1

      - name: Build with the Netlify project configuration
        if: inputs.migration_only != true && inputs.artifact_download != true
        env:
          BUILD_CONTEXT: ${{ inputs.build_context }}
          ARTIFACT_DOWNLOAD: ${{ inputs.artifact_download }}
          DEPLOY: ${{ inputs.deploy }}
          NETLIFY_AUTH_TOKEN: ${{ (inputs.target != 'preview' || inputs.deploy) && secrets.NETLIFY_AUTH_TOKEN || '' }}
          MIGRATION_ONLY: ${{ inputs.migration_only }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          SKIP_BUILD_MIGRATIONS: ${{ inputs.skip_build_migrations }}
          SOURCE_TEMPLATE: ${{ steps.target.outputs.source_template }}
          ANALYTICS_DATABASE_URL_SECRET: ${{ inputs.target == 'production' && steps.target.outputs.source_template == 'analytics' && secrets.ANALYTICS_DATABASE_URL || '' }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" != "preview" || "$DEPLOY" == "true" ]]; then
            : "${NETLIFY_AUTH_TOKEN:?NETLIFY_AUTH_TOKEN secret is required}"
          fi
          # The Netlify CLI uses DEPLOY_ID=0 during local prebuilt builds. Use
          # the checked-out source revision so fixed auth assets get a new URL
          # on every source deploy, including branch and beta deployments.
          AGENT_NATIVE_BUILD_ID="$(git rev-parse HEAD)"
          export AGENT_NATIVE_BUILD_ID
          if [[ "$TARGET" == "beta" ]]; then
            # Beta is built from the release commit with branch-deploy context,
            # so production-scoped Netlify variables are not applied. Export
            # the release owner explicitly for this lane instead of widening
            # the flag to every ordinary preview build.
            if [[ "$SOURCE_TEMPLATE" != "clips" ]]; then
              export AGENT_NATIVE_RELEASE_MIGRATIONS=1
              export AGENT_NATIVE_RUN_RELEASE_MIGRATIONS=1
              if [[ "$MIGRATION_ONLY" != "true" ]]; then
                unset AGENT_NATIVE_RUN_RELEASE_MIGRATIONS
              fi
            else
              export AGENT_NATIVE_BETA_SCHEMA_OWNER=production
              export AGENT_NATIVE_SERVERLESS_FFMPEG_ARCH=x64
            fi
            export AGENT_NATIVE_ENABLE_KEEP_WARM=1
            export AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND=1
            export AGENT_NATIVE_HOSTED_HARNESS=true
            if [[ "$SOURCE_TEMPLATE" == "@agent-native/docs" ]]; then
              export VITE_AGENT_NATIVE_DEPLOYMENT_ENVIRONMENT=beta
            fi
          fi
          if [[ "$SKIP_BUILD_MIGRATIONS" == "true" && "$SOURCE_TEMPLATE" == "@agent-native/docs" ]]; then
            export AGENT_NATIVE_PREBUILT_SKIP_RELEASE_MIGRATIONS=1
          fi
          if [[ "$SOURCE_TEMPLATE" == "clips" || "$SOURCE_TEMPLATE" == "plan" ]]; then
            # Netlify's local CLI receives masked site secrets. These templates
            # only need valid build-time shapes; uploaded Functions read the
            # real site-scoped values at runtime.
            export agentNativePrebuiltBuild=true
            agentNativePrebuiltAuthSecret="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
            export agentNativePrebuiltAuthSecret
          fi
          if [[ "$SOURCE_TEMPLATE" == "crm" ]]; then
            export agentNativePrebuiltBuild=true
            agentNativePrebuiltAuthSecret="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
            export agentNativePrebuiltAuthSecret
          fi
          if [[ ( "$TARGET" == "production" || "$TARGET" == "preview" ) && "$SOURCE_TEMPLATE" == "chat" ]]; then
            # Starter's runtime database and auth secret are Netlify secrets.
            # The external prebuilt runner receives masked values, so use
            # build-only shapes and let the deployed Functions read the real
            # site-scoped values at runtime.
            export agentNativePrebuiltBuild=true
            agentNativePrebuiltAuthSecret="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
            export agentNativePrebuiltAuthSecret
          fi
          if [[ "$TARGET" == "production" && "$SOURCE_TEMPLATE" == "analytics" ]]; then
            : "${ANALYTICS_DATABASE_URL_SECRET:?ANALYTICS_DATABASE_URL secret is required for prebuilt Analytics deployments}"
            # Netlify's local prebuilt runner overlays site-scoped variables
            # with masked values. Keep the real URL under a workflow-only name
            # so the Analytics netlify.toml command can rebind it after that
            # overlay, before its build and release migrations run.
            export ANALYTICS_DATABASE_URL_SECRET
          fi
          if [[ "$SOURCE_TEMPLATE" == "clips" || "$SOURCE_TEMPLATE" == "plan" ]]; then
            export agentNativePrebuiltDatabaseUrl="postgresql://build-only.invalid/agent_native"
          fi
          if [[ "$SOURCE_TEMPLATE" == "crm" ]]; then
            export agentNativePrebuiltDatabaseUrl="postgresql://build-only.invalid/agent_native"
          fi
          if [[ ( "$TARGET" == "production" || "$TARGET" == "preview" ) && "$SOURCE_TEMPLATE" == "chat" ]]; then
            export agentNativePrebuiltDatabaseUrl="postgresql://build-only.invalid/agent_native"
          fi
          netlify build --context "$BUILD_CONTEXT" --filter "$SOURCE_TEMPLATE"
          unset ANALYTICS_DATABASE_URL_SECRET

      - name: Build trusted preview Functions for the PR artifact
        if: >-
          inputs.target == 'preview' && inputs.deploy &&
          inputs.artifact_download && inputs.migration_only != true
        env:
          BUILD_CONTEXT: ${{ inputs.build_context }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          SKIP_BUILD_MIGRATIONS: ${{ inputs.skip_build_migrations }}
          SOURCE_TEMPLATE: ${{ steps.target.outputs.source_template }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          : "${NETLIFY_AUTH_TOKEN:?NETLIFY_AUTH_TOKEN secret is required}"
          # This checkout is the trusted base revision. The PR build job only
          # supplies static files; arbitrary PR Functions never reach Netlify.
          if [[ "$SOURCE_TEMPLATE" == "clips" || "$SOURCE_TEMPLATE" == "plan" || "$SOURCE_TEMPLATE" == "crm" || "$SOURCE_TEMPLATE" == "chat" ]]; then
            export agentNativePrebuiltBuild=true
            export agentNativePrebuiltDatabaseUrl="postgresql://build-only.invalid/agent_native"
            agentNativePrebuiltAuthSecret="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
            export agentNativePrebuiltAuthSecret
          fi
          netlify build --context "$BUILD_CONTEXT" --filter "$SOURCE_TEMPLATE"

      - name: Run Plan release migrations
        if: >-
          inputs.deploy && inputs.deploy_mode == 'production' &&
          steps.target.outputs.source_template == 'plan'
        env:
          DATABASE_URL: ${{ secrets.PLAN_DATABASE_URL }}
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?PLAN_DATABASE_URL secret is required for prebuilt Plan deployments}"
          pnpm --filter plan migrate:production

      - name: Run Clips release migrations
        if: >-
          inputs.target == 'production' && inputs.deploy &&
          inputs.deploy_mode == 'production' &&
          steps.target.outputs.source_template == 'clips'
        env:
          DATABASE_URL: ${{ secrets.CLIPS_DATABASE_URL }}
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?CLIPS_DATABASE_URL secret is required for prebuilt Clips deployments}"
          pnpm --filter clips migrate:production

      - name: Verify deploy directories
        if: inputs.migration_only != true
        env:
          FUNCTIONS_DIRECTORY: ${{ steps.directories.outputs.functions_directory }}
          PUBLISH_DIRECTORY: ${{ steps.directories.outputs.publish_directory }}
        run: |
          set -euo pipefail
          for directory in "$PUBLISH_DIRECTORY" "$FUNCTIONS_DIRECTORY"; do
            if [[ ! -d "$directory" ]]; then
              echo "::error::Expected prebuilt deploy directory is missing: $directory"
              exit 1
            fi
          done
          du -sh "$PUBLISH_DIRECTORY" "$FUNCTIONS_DIRECTORY"

      - name: Verify static SSR cache artifact
        if: >-
          inputs.migration_only != true &&
          inputs.artifact_download != true &&
          (steps.target.outputs.source_template == 'clips' || steps.target.outputs.source_template == '@agent-native/docs')
        env:
          PUBLISH_DIRECTORY: ${{ steps.directories.outputs.publish_directory }}
        run: |
          set -euo pipefail
          GUARD_SSR_CACHE_ARTIFACT_DIR="$PUBLISH_DIRECTORY" pnpm guard:ssr-cache-artifact

      # Every byte here is unzipped on each cold start, and Netlify uploads each
      # function separately. The existing 120MB ceiling never fired because it
      # sat above the whole fleet; this measures growth from where each app
      # actually is. An app with no recorded baseline is named, not passed.
      - name: Check serverless function sizes against their baseline
        if: inputs.migration_only != true && inputs.artifact_download != true
        env:
          FUNCTIONS_DIRECTORY: ${{ steps.directories.outputs.functions_directory }}
          # source_template, not inputs.site: the input is a caller-facing alias
          # (docs production dispatches "fw", the starter site dispatches
          # "starter") and would miss the baseline recorded under the app's own
          # name, taking the unmeasured branch on exactly the deploys that most
          # need asserting.
          SITE: ${{ steps.target.outputs.source_template }}
        run: |
          set -euo pipefail
          node scripts/check-function-size-baseline.mjs --site "$SITE" --dir "$FUNCTIONS_DIRECTORY"

      - name: Package the prebuilt artifact
        if: inputs.artifact_upload && inputs.migration_only != true
        env:
          FUNCTIONS_DIRECTORY: ${{ steps.directories.outputs.functions_directory }}
          PUBLISH_DIRECTORY: ${{ steps.directories.outputs.publish_directory }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/netlify-artifact"
          mkdir -p "$artifact_root/publish"
          cp -R "$PUBLISH_DIRECTORY"/. "$artifact_root/publish/"
          if [[ "$TARGET" != "preview" ]]; then
            mkdir -p "$artifact_root/functions"
            cp -R "$FUNCTIONS_DIRECTORY"/. "$artifact_root/functions/"
          fi

      - name: Upload the prebuilt artifact
        if: inputs.artifact_upload && inputs.migration_only != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/netlify-artifact
          if-no-files-found: error
          retention-days: 1

      - name: Verify docs cold-start budget
        if: >-
          inputs.migration_only != true && inputs.artifact_download != true &&
          steps.target.outputs.source_template == '@agent-native/docs'
        run: NODE_ENV=production NETLIFY=true timeout 180 node scripts/ssr-boot-smoke.mjs packages/docs

      - name: Pause automatic Netlify builds for production cutover
        id: pause
        if: inputs.target == 'production' && inputs.deploy && inputs.deploy_mode == 'production'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          (async () => {
          const fs = require("node:fs");
          const { requestNetlifyApi } = await import("./scripts/netlify-api-request.ts");
          const api = "https://api.netlify.com/api/v1";
          const headers = {
            Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
            "User-Agent": "agent-native-prebuilt-production-build-pause",
          };
          const request = (url, options = {}) => requestNetlifyApi(url, {
            ...options,
            headers: { ...headers, ...(options.headers || {}) },
          });

          async function readJson(response, label) {
            const text = await response.text();
            const body = text ? JSON.parse(text) : null;
            if (!response.ok) {
              throw new Error(`${label} failed with HTTP ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          async function waitForBuildSetting(siteId, expected, label) {
            let actual;
            for (let attempt = 1; attempt <= 15; attempt += 1) {
              const site = await readJson(
                await request(`${api}/sites/${siteId}`),
                `${label} verification attempt ${attempt}`,
              );
              actual = site.build_settings?.stop_builds ?? site.repo?.stop_builds;
              if (actual === expected) return true;
              if (attempt < 15) {
                await new Promise((resolve) => setTimeout(resolve, 2_000));
              }
            }
            throw new Error(`${label} expected stop_builds=${expected}, got ${actual}.`);
          }
          const siteId = process.env.NETLIFY_SITE_ID;
          if (!siteId) throw new Error("Netlify site id is required to pause automatic builds.");
          const siteUrl = `${api}/sites/${siteId}`;
          const site = await readJson(
            await request(siteUrl),
            "Netlify build setting lookup",
          );
          const wasStopped =
            (site.build_settings?.stop_builds ?? site.repo?.stop_builds) === true;
          const hasGitConnectedBuild = Boolean(
            site.build_settings?.repo_url ||
              site.build_settings?.repo_path ||
              site.build_settings?.provider ||
              site.repo?.repo_url ||
              site.repo?.repo_path ||
              site.git_provider ||
              site.repo?.provider ||
              site.repo?.repo,
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `was_stopped=${wasStopped}\n`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `has_git_connected_build=${hasGitConnectedBuild}\n`,
          );
          if (!hasGitConnectedBuild) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "cutover_acquired=true\n");
            console.log(
              "No Git-connected Netlify build is configured; automatic builds are unchanged.",
            );
            return;
          }
          if (!wasStopped) {
            await readJson(
              await request(siteUrl, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ build_settings: { stop_builds: true } }),
              }),
              "Netlify automatic build pause",
            );
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "cutover_acquired=true\n");
          const paused = await waitForBuildSetting(siteId, true, "Netlify automatic build pause");
          if (!paused) throw new Error("Netlify automatic build pause was not verified.");
          console.log(`Automatic Netlify builds paused for production cutover (previously stopped: ${wasStopped}).`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Run CRM release migrations
        if: >-
          inputs.target == 'production' && inputs.deploy &&
          inputs.deploy_mode == 'production' &&
          steps.target.outputs.source_template == 'crm'
        env:
          BUILD_CONTEXT: ${{ inputs.build_context }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
        run: |
          set -euo pipefail
          : "${NETLIFY_AUTH_TOKEN:?NETLIFY_AUTH_TOKEN secret is required}"
          pnpm install --frozen-lockfile

          migration_database_url="$(
            netlify api getSiteDatabase \
              --data "{\"site_id\":\"$NETLIFY_SITE_ID\",\"role\":\"netlifydb_owner\"}" |
              BUILD_CONTEXT="$BUILD_CONTEXT" node --experimental-strip-types scripts/netlify-migration-url.ts
          )"
          if [[ -z "$migration_database_url" ]]; then
            echo "::error::Netlify did not provide a PostgreSQL migration URL for $NETLIFY_SITE_ID."
            exit 1
          fi
          export DATABASE_URL="$migration_database_url"

          for attempt in 1 2 3; do
            if pnpm --filter crm migrate:production; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 30))
              echo "CRM migration attempt $attempt failed; retrying in ${delay}s."
              sleep "$delay"
            fi
          done
          echo "::error::CRM release migration failed after 3 attempts."
          exit 1

      - name: Unlock the published production deploy
        id: unlock
        if: inputs.target == 'production' && inputs.deploy && inputs.deploy_mode == 'production'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          (async () => {
          const { requestNetlifyApi } = await import("./scripts/netlify-api-request.ts");
          const api = "https://api.netlify.com/api/v1";
          const headers = {
            Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
            "User-Agent": "agent-native-prebuilt-production-unlock",
          };

          async function readJson(response, label) {
            const text = await response.text();
            let body = null;
            try {
              body = text ? JSON.parse(text) : null;
            } catch {
              body = text;
            }
            if (!response.ok) {
              throw new Error(
                `${label} failed with HTTP ${response.status}: ${typeof body === "string" ? body : JSON.stringify(body)}`,
              );
            }
            return body;
          }

          const fs = require("node:fs");
          const siteId = process.env.NETLIFY_SITE_ID;
          if (!siteId) throw new Error("Netlify site id is required to unlock production.");

          const request = (url, options = {}) =>
            requestNetlifyApi(url, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const ACTIVE_PRODUCTION_DEPLOY_STATES = [
            "new",
            "pending",
            "enqueued",
            "building",
            "uploading",
            "uploaded",
            "preparing",
            "prepared",
            "processing",
            "processed",
            "retrying",
            "pending_review",
            "accepted",
          ];

          function nextPageUrl(linkHeader) {
            if (!linkHeader) return null;
            const links = /(?:^|,)\s*<([^>]+)>\s*;\s*rel="([^"]+)"/g;
            for (const match of linkHeader.matchAll(links)) {
              if (match[2].split(/\s+/).includes("next")) return match[1];
            }
            return null;
          }

          async function listDeploys(label, states) {
            const deploysByState = await Promise.all(states.map(async (state) => {
              const deploys = [];
              let url = `${api}/sites/${siteId}/deploys?per_page=100&production=true&state=${encodeURIComponent(state)}`;
              while (url) {
                const response = await request(url);
                const page = await readJson(response, `${label} (${state})`);
                if (!Array.isArray(page)) throw new Error(`${label} returned a non-array response.`);
                deploys.push(...page);
                url = nextPageUrl(response.headers.get("link"));
              }
              return deploys;
            }));
            return deploysByState.flat();
          }

          function pendingProductionDeploys(deploys, publishedId, preexistingDeployIds) {
            return deploys.filter(
              (candidate) => {
                if (
                  candidate.id === publishedId ||
                  candidate.context !== "production" ||
                  candidate.published_at ||
                  ["error", "canceled", "rejected"].includes(candidate.state)
                ) {
                  return false;
                }
                if (candidate.state !== "ready") return true;
                return !preexistingDeployIds.has(candidate.id);
              },
            );
          }

          // Netlify has no terminal state for an upload that dies mid-flight, so
          // a deploy can sit in `uploading` forever. Well past any real upload.
          const ABANDONED_DEPLOY_MS = 30 * 60 * 1000;

          async function drainPendingDeploys(publishedId, preexistingDeployIds) {
            const deadline = Date.now() + 5 * 60 * 1000;
            const states = [...ACTIVE_PRODUCTION_DEPLOY_STATES, "ready"];
            while (Date.now() < deadline) {
              let pending = pendingProductionDeploys(
                await listDeploys("Netlify pending production deploy lookup", states),
                publishedId,
                preexistingDeployIds,
              );
              // A deploy that has not moved in ABANDONED_DEPLOY_MS is dead, and
              // no amount of waiting drains it. slides carried one stuck in
              // `uploading` since 2026-07-30 that blocked every production
              // promotion for three weeks: `uploading` is neither `new` nor
              // `enqueued`, so it was never cancelable and the wait always timed
              // out. Cancel it on its age rather than widening the state list,
              // which would kill real in-flight uploads.
              const cancelable = pending.filter((candidate) => {
                if (["new", "enqueued"].includes(candidate.state)) return true;
                const lastMoved = Date.parse(
                  candidate.updated_at || candidate.created_at || "",
                );
                if (!Number.isFinite(lastMoved)) return false;
                const idleMinutes = Math.round((Date.now() - lastMoved) / 60000);
                if (Date.now() - lastMoved < ABANDONED_DEPLOY_MS) return false;
                console.log(
                  `Production deploy ${candidate.id} has been ${candidate.state} for ${idleMinutes} minutes; treating it as abandoned.`,
                );
                return true;
              });
              for (const candidate of cancelable) {
                await readJson(
                  await request(`${api}/deploys/${candidate.id}/cancel`, {
                    method: "POST",
                  }),
                  `Netlify deploy ${candidate.id} cancellation`,
                );
                console.log(`Canceled queued production deploy ${candidate.id}.`);
              }

              pending = pendingProductionDeploys(
                await listDeploys("Netlify production deploy drain verification", states),
                publishedId,
                preexistingDeployIds,
              );
              const ready = pending.filter((candidate) => candidate.state === "ready");
              if (ready.length) {
                throw new Error(
                  `Refusing to unlock ${publishedId} while ready production deploys are pending: ${ready.map((candidate) => candidate.id).join(", ")}.`,
                );
              }
              if (!pending.length) return;

              console.log(
                `Waiting for pending production deploys to drain: ${pending.map((candidate) => `${candidate.id} (${candidate.state || "unknown"})`).join(", ")}`,
              );
              await sleep(10_000);
            }
            throw new Error(
              `Production deploy queue did not drain before unlocking ${publishedId}.`,
            );
          }

          // Snapshot every ready production ID before reading site/deploy state.
          // A ready backlog predating this cutover is not a new blocker.
          const preexistingDeployIds = new Set(
            (
              await listDeploys(
                "Netlify pre-existing production ready deploy lookup",
                ["ready"],
              )
            ).map((candidate) => candidate.id),
          );

          const site = await readJson(
            await request(`${api}/sites/${siteId}`),
            "Netlify published deploy lookup",
          );
          const deployId = site.published_deploy?.id;
          if (!deployId) {
            throw new Error("Netlify site has no published deploy to unlock.");
          }

          const published = await readJson(
            await request(`${api}/deploys/${deployId}`),
            `Netlify deploy ${deployId} lock lookup before drain`,
          );
          await drainPendingDeploys(deployId, preexistingDeployIds);

          const beforeUnlock = await readJson(
            await request(`${api}/sites/${siteId}`),
            "Netlify published deploy verification before unlock",
          );
          if (beforeUnlock.published_deploy?.id !== deployId) {
            throw new Error(
              `Netlify published deploy changed from ${deployId} while draining the production queue; refusing to upload an unrelated production artifact.`,
            );
          }
          const deploy = await readJson(
            await request(`${api}/deploys/${deployId}`),
            `Netlify deploy ${deployId} lookup`,
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `published_deploy_id=${deployId}\nwas_locked=${deploy.locked === true}\n`,
          );

          if (deploy.locked !== true) {
            console.log(`Published deploy ${deployId} is already unlocked.`);
          } else {
            // Queue inspection and unlock are separate Netlify calls. Recheck
            // immediately before the unlock so a ready deploy created during
            // the final site/deploy lookups still fails closed.
            await drainPendingDeploys(deployId, preexistingDeployIds);
            const finalBeforeUnlock = await readJson(
              await request(`${api}/sites/${siteId}`),
              "Netlify final published deploy verification before unlock",
            );
            if (finalBeforeUnlock.published_deploy?.id !== deployId) {
              throw new Error(
                `Netlify published deploy changed from ${deployId} immediately before unlock; refusing to upload an unrelated production artifact.`,
              );
            }
            await readJson(
              await request(`${api}/deploys/${deployId}/unlock`, {
                method: "POST",
              }),
              `Netlify deploy ${deployId} unlock`,
            );

            const unlocked = await readJson(
              await request(`${api}/deploys/${deployId}`),
              `Netlify deploy ${deployId} unlock verification`,
            );
            if (unlocked.locked !== false) {
              throw new Error(
                `Netlify deploy ${deployId} did not report locked=false after unlock.`,
              );
            }
            console.log(`Unlocked published production deploy ${deployId}.`);
          }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Capture the current published deploy for callback rollback
        id: previous
        if: >-
          inputs.deploy && inputs.deploy_mode == 'production' &&
          (inputs.target == 'beta' || (inputs.smoke && steps.target.outputs.source_template != '@agent-native/docs'))
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          (async () => {
            const fs = require("node:fs");
            const { requestNetlifyApi } = await import("./scripts/netlify-api-request.ts");
            const siteId = process.env.NETLIFY_SITE_ID;
            const response = await requestNetlifyApi(`https://api.netlify.com/api/v1/sites/${siteId}`, {
              headers: {
                Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
              },
            });
            const text = await response.text();
            const site = text ? JSON.parse(text) : null;
            if (!response.ok) {
              throw new Error(`Netlify published deploy lookup failed with HTTP ${response.status}.`);
            }
            const deployId = site?.published_deploy?.id;
            if (!deployId) {
              if (process.env.TARGET === "beta") {
                console.log("Netlify beta site has no published deploy; continuing without a rollback baseline.");
                fs.appendFileSync(process.env.GITHUB_OUTPUT, "published_deploy_id=\n");
                return;
              }
              throw new Error("Netlify site has no published deploy to protect.");
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `published_deploy_id=${deployId}\n`);
            console.log(`Captured current published deploy ${deployId} for callback rollback.`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify beta source is current immediately before upload
        id: beta_freshness
        if: inputs.target == 'beta' && inputs.deploy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        with:
          script: |
            const sourceRef = process.env.SOURCE_REF.trim();
            if (!/^[0-9a-f]{40}$/i.test(sourceRef)) {
              core.setOutput('current', 'true');
              return;
            }
            const mainSha = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })).data.object.sha;
            const current = mainSha.toLowerCase() === sourceRef.toLowerCase();
            core.setOutput('current', String(current));
            if (!current) {
              core.notice(
                `Skipping stale beta source ${sourceRef}; main is now ${mainSha}.`,
              );
            }

      - name: Upload the prebuilt deploy
        id: deploy
        if: >-
          inputs.deploy &&
          (inputs.target != 'beta' || steps.beta_freshness.outputs.current == 'true')
        env:
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          FUNCTIONS_DIRECTORY: ${{ steps.directories.outputs.functions_directory }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          PREVIEW_ALIAS: ${{ inputs.preview_alias }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          PUBLISH_DIRECTORY: ${{ steps.directories.outputs.publish_directory }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_TEMPLATE: ${{ steps.target.outputs.source_template }}
          TARGET: ${{ inputs.target }}
          PREVIOUS_DEPLOY_ID: ${{ steps.previous.outputs.published_deploy_id }}
        run: |
          set -euo pipefail

          deploy_message="GitHub Actions prebuilt deploy ${SOURCE_REF:-$GITHUB_SHA}"
          if [[ "$TARGET" == "preview" ]]; then
            deploy_message="GitHub Actions PR preview #${PULL_REQUEST_NUMBER} ${SOURCE_TEMPLATE} ${SOURCE_REF}"
          fi
          deploy_args=(
            --site "$NETLIFY_SITE_ID"
            --dir "$PUBLISH_DIRECTORY"
            --functions "$FUNCTIONS_DIRECTORY"
            --filter "$SOURCE_TEMPLATE"
            --no-build
            --message "$deploy_message"
          )
          if [[ "$TARGET" == "preview" ]]; then
            deploy_args+=(--alias "$PREVIEW_ALIAS")
          fi
          if [[ "$DEPLOY_MODE" == "production" ]]; then
            if [[ "$TARGET" == "beta" && -z "$PREVIOUS_DEPLOY_ID" ]]; then
              echo "Uploading the first beta deploy as a draft until its source is revalidated."
            else
              deploy_args+=(--prod)
            fi
          fi

          deploy_json="$RUNNER_TEMP/netlify-deploy.json"
          netlify deploy "${deploy_args[@]}" --json | tee "$deploy_json"
          deploy_details="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const result = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const deployUrl = result.deploy_url || result.url || "";
            const deployId = result.deploy_id || result.id || "";
            process.stdout.write(JSON.stringify({ deployId, deployUrl }));
          ' "$deploy_json")"
          deploy_url="$(node --input-type=module -e 'process.stdout.write(JSON.parse(process.argv[1]).deployUrl)' "$deploy_details")"
          deploy_id="$(node --input-type=module -e 'process.stdout.write(JSON.parse(process.argv[1]).deployId)' "$deploy_details")"
          if [[ "$deploy_url" != https://* ]]; then
            echo "::error::Netlify did not return a deploy URL."
            exit 1
          fi
          if [[ -z "$deploy_id" ]]; then
            echo "::error::Netlify did not return a deploy id."
            exit 1
          fi
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Uploaded prebuilt ${DEPLOY_MODE} deploy: $deploy_url"

      - name: Wait for the Netlify deploy to publish
        if: >-
          inputs.deploy &&
          (inputs.target != 'beta' || steps.beta_freshness.outputs.current == 'true')
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          PREVIOUS_DEPLOY_ID: ${{ steps.previous.outputs.published_deploy_id }}
          PUBLISH_AFTER_FRESHNESS: ${{ inputs.target == 'beta' && inputs.deploy_mode == 'production' && steps.previous.outputs.published_deploy_id == '' }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          const api = "https://api.netlify.com/api/v1";
          const headers = {
            Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
          };
          const request = (url) =>
            import("./scripts/netlify-api-request.ts").then(({ requestNetlifyApi }) =>
              requestNetlifyApi(url, { headers }),
            );
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function readJson(response, label) {
            const text = await response.text();
            const body = text ? JSON.parse(text) : null;
            if (!response.ok) {
              throw new Error(`${label} failed with HTTP ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          (async () => {
            const deadline = Date.now() + 30 * 60 * 1000;
            while (Date.now() < deadline) {
              const deploy = await readJson(
                await request(`${api}/deploys/${process.env.DEPLOY_ID}`),
                "Netlify deploy status",
              );
              if (deploy.state === "error") {
                throw new Error(`Netlify deploy failed: ${deploy.error_message || "unknown error"}`);
              }
              if (deploy.state === "ready") {
                if (process.env.PUBLISH_AFTER_FRESHNESS === "true") return;
                if (process.env.DEPLOY_MODE !== "production") return;
                const site = await readJson(
                  await request(`${api}/sites/${process.env.NETLIFY_SITE_ID}`),
                  "Netlify published deploy lookup",
                );
                if (site.published_deploy?.id === process.env.DEPLOY_ID) {
                  console.log(`Netlify published ${process.env.DEPLOY_ID}.`);
                  return;
                }
                if (
                  process.env.TARGET === "beta" &&
                  site.published_deploy?.id &&
                  site.published_deploy.id !== process.env.PREVIOUS_DEPLOY_ID
                ) {
                  console.log(
                    `Netlify beta deploy ${process.env.DEPLOY_ID} was superseded by published deploy ${site.published_deploy.id}.`,
                  );
                  return;
                }
                console.log("Deploy is ready; waiting for Netlify to publish it.");
              } else {
                console.log(`Netlify deploy state: ${deploy.state || "unknown"}`);
              }
              await sleep(10_000);
            }
            throw new Error(`Netlify deploy ${process.env.DEPLOY_ID} did not become ready and published within 30 minutes.`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify first beta deploy source immediately before publish
        id: beta_first_publish_freshness
        if: >-
          inputs.target == 'beta' && inputs.deploy &&
          inputs.deploy_mode == 'production' &&
          steps.previous.outputs.published_deploy_id == '' &&
          steps.deploy.outputs.deploy_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        with:
          script: |
            const sourceRef = process.env.SOURCE_REF.trim().toLowerCase();
            const mainSha = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })).data.object.sha.toLowerCase();
            const current = /^[0-9a-f]{40}$/.test(sourceRef) && sourceRef === mainSha;
            core.setOutput('current', String(current));
            if (!current) {
              core.warning(
                `First beta deploy source ${sourceRef || 'unknown'} became stale before publish; main is now ${mainSha}.`,
              );
            }

      - name: Publish first beta deploy after freshness verification
        id: beta_first_publish
        if: >-
          inputs.target == 'beta' && inputs.deploy &&
          inputs.deploy_mode == 'production' &&
          steps.previous.outputs.published_deploy_id == '' &&
          steps.beta_first_publish_freshness.outputs.current == 'true' &&
          steps.deploy.outputs.deploy_id != ''
        continue-on-error: true
        env:
          FUNCTIONS_DIRECTORY: ${{ steps.directories.outputs.functions_directory }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          PUBLISH_DIRECTORY: ${{ steps.directories.outputs.publish_directory }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          SOURCE_TEMPLATE: ${{ steps.target.outputs.source_template }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${main_sha,,}" != "${SOURCE_REF,,}" ]]; then
            echo "::error::First beta deploy became stale before publish; main is now $main_sha."
            exit 1
          fi
          deploy_json="$RUNNER_TEMP/netlify-first-beta-production.json"
          deploy_message="GitHub Actions first beta production deploy $SOURCE_REF"
          publish_started_at="$(date -u +%s%3N)"
          echo "publish_started_at=$publish_started_at" >> "$GITHUB_OUTPUT"
          set +e
          netlify deploy \
            --site "$NETLIFY_SITE_ID" \
            --dir "$PUBLISH_DIRECTORY" \
            --functions "$FUNCTIONS_DIRECTORY" \
            --filter "$SOURCE_TEMPLATE" \
            --no-build \
            --prod \
            --message "$deploy_message" \
            --json | tee "$deploy_json"
          netlify_exit="${PIPESTATUS[0]}"
          set -e
          if [[ "$netlify_exit" -ne 0 ]]; then
            echo "::warning::Netlify CLI exited $netlify_exit after first beta publish; reconciling the accepted deploy before failing."
          fi
          deploy_details="$(
            PUBLISH_STARTED_AT="$publish_started_at" \
            DEPLOY_MESSAGE="$deploy_message" \
            node --experimental-strip-types --input-type=module - "$deploy_json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { requestNetlifyApi } from "./scripts/netlify-api-request.ts";

          const api = "https://api.netlify.com/api/v1";
          const headers = {
            Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
          };
          const deployJsonPath = process.argv[2];
          const startedAt = Number(process.env.PUBLISH_STARTED_AT);
          const sourceRef = process.env.SOURCE_REF.toLowerCase();
          const message = process.env.DEPLOY_MESSAGE;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const details = (deploy) => ({
            deployId: deploy?.deploy_id || deploy?.id || "",
            deployUrl: deploy?.deploy_url || deploy?.deploy_ssl_url || deploy?.ssl_url || deploy?.url || "",
          });
          const readJson = async (response, label) => {
            const text = await response.text();
            const body = text ? JSON.parse(text) : null;
            if (!response.ok) {
              throw new Error(`${label} failed with HTTP ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          };

          let result = {};
          try {
            result = JSON.parse(readFileSync(deployJsonPath, "utf8"));
          } catch (error) {
            console.error(`Could not parse Netlify CLI output; reconciling the site deploy list: ${error}`);
          }
          let selected = details(result);
          if (selected.deployId && !selected.deployUrl) {
            selected = { ...selected, ...details(await readJson(
              await requestNetlifyApi(`${api}/deploys/${selected.deployId}`, { headers }),
              `Netlify first beta production deploy ${selected.deployId} lookup`,
            )) };
          }

          if (!selected.deployId || !selected.deployUrl) {
            const deadline = Date.now() + 60_000;
            while (Date.now() < deadline && (!selected.deployId || !selected.deployUrl)) {
              const deploys = await readJson(
                await requestNetlifyApi(`${api}/sites/${process.env.NETLIFY_SITE_ID}/deploys?per_page=100&production=true`, { headers }),
                "Netlify first beta production deploy reconciliation",
              );
              if (!Array.isArray(deploys)) throw new Error("Netlify returned an invalid deploy list during first beta reconciliation.");
              const candidates = deploys
                .filter((deploy) => {
                  const createdAt = Date.parse(deploy.created_at || "");
                  const candidateSource = String(deploy.commit_ref || "").toLowerCase();
                  const candidateMessage = String(deploy.title || deploy.message || "");
                  return (
                    deploy.context === "production" &&
                    Number.isFinite(createdAt) &&
                    createdAt >= startedAt - 30_000 &&
                    (candidateSource === sourceRef || candidateMessage === message)
                  );
                })
                .sort((left, right) => String(right.created_at || "").localeCompare(String(left.created_at || "")));
              if (candidates[0]) selected = details(candidates[0]);
              if (!selected.deployId || !selected.deployUrl) await sleep(5_000);
            }
          }
          if (!selected.deployId || !selected.deployUrl) {
            throw new Error("Netlify accepted the first beta production upload but its deploy id or URL could not be reconciled.");
          }
          process.stdout.write(JSON.stringify(selected));
          NODE
          )"
          deploy_url="$(node --input-type=module -e 'process.stdout.write(JSON.parse(process.argv[1]).deployUrl)' "$deploy_details")"
          deploy_id="$(node --input-type=module -e 'process.stdout.write(JSON.parse(process.argv[1]).deployId)' "$deploy_details")"
          if [[ "$deploy_url" != https://* ]]; then
            echo "::error::Netlify did not return a first beta production URL."
            exit 1
          fi
          if [[ -z "$deploy_id" ]]; then
            echo "::error::Netlify did not return a first beta production deploy id."
            exit 1
          fi
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Published first beta artifact as production deploy $deploy_id after the final freshness check."

      - name: Reconcile first beta production deploy after publish attempt
        id: beta_first_publish_reconcile
        if: >-
          always() && inputs.target == 'beta' && inputs.deploy &&
          inputs.deploy_mode == 'production' &&
          steps.previous.outputs.published_deploy_id == '' &&
          steps.beta_first_publish.outputs.publish_started_at != '' &&
          steps.beta_first_publish.outputs.deploy_id == ''
        env:
          DEPLOY_MESSAGE: GitHub Actions first beta production deploy ${{ steps.source.outputs.source_ref }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          PUBLISH_STARTED_AT: ${{ steps.beta_first_publish.outputs.publish_started_at }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          (async () => {
          const fs = require("node:fs");
          const { requestNetlifyApi } = await import("./scripts/netlify-api-request.ts");
          const api = "https://api.netlify.com/api/v1";
          const headers = {
            Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const readJson = async (response, label) => {
            const text = await response.text();
            const body = text ? JSON.parse(text) : null;
            if (!response.ok) {
              throw new Error(`${label} failed with HTTP ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          };
          const details = (deploy) => ({
            deployId: deploy?.id || deploy?.deploy_id || "",
            deployUrl: deploy?.deploy_url || deploy?.deploy_ssl_url || deploy?.ssl_url || deploy?.url || "",
          });
          const deadline = Date.now() + 60_000;
          while (Date.now() < deadline) {
            const deploys = await readJson(
              await requestNetlifyApi(`${api}/sites/${process.env.NETLIFY_SITE_ID}/deploys?per_page=100&production=true`, { headers }),
              "Netlify first beta production deploy recovery",
            );
            if (!Array.isArray(deploys)) throw new Error("Netlify returned an invalid deploy list during first beta recovery.");
            const candidates = deploys
              .filter((deploy) => {
                const createdAt = Date.parse(deploy.created_at || "");
                const candidateSource = String(deploy.commit_ref || "").toLowerCase();
                const candidateMessage = String(deploy.title || deploy.message || "");
                return (
                  deploy.context === "production" &&
                  Number.isFinite(createdAt) &&
                  createdAt >= Number(process.env.PUBLISH_STARTED_AT) - 30_000 &&
                  (candidateSource === process.env.SOURCE_REF.toLowerCase() || candidateMessage === process.env.DEPLOY_MESSAGE)
                );
              })
              .sort((left, right) => String(right.created_at || "").localeCompare(String(left.created_at || "")));
            const recovered = details(candidates[0]);
            if (recovered.deployId && recovered.deployUrl) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `deploy_id=${recovered.deployId}\ndeploy_url=${recovered.deployUrl}\n`);
              console.log(`Recovered first beta production deploy ${recovered.deployId} after the publisher step lost its output.`);
              return;
            }
            await sleep(5_000);
          }
          throw new Error("Netlify accepted the first beta production upload, but recovery could not identify its production deploy.");
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Wait for first beta production deploy to publish
        id: beta_first_publish_wait
        if: >-
          always() &&
          (steps.beta_first_publish.outputs.deploy_id != '' ||
          steps.beta_first_publish_reconcile.outputs.deploy_id != '')
        env:
          DEPLOY_ID: ${{ steps.beta_first_publish.outputs.deploy_id || steps.beta_first_publish_reconcile.outputs.deploy_id }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          (async () => {
            const fs = require("node:fs");
            const { requestNetlifyApi } = await import("./scripts/netlify-api-request.ts");
            const api = "https://api.netlify.com/api/v1";
            const headers = {
              Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
            };
            const request = (url) => requestNetlifyApi(url, { headers });
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            async function readJson(response, label) {
              const text = await response.text();
              const body = text ? JSON.parse(text) : null;
              if (!response.ok) {
                throw new Error(`${label} failed with HTTP ${response.status}: ${JSON.stringify(body)}`);
              }
              return body;
            }
            const deployId = process.env.DEPLOY_ID;
            const siteId = process.env.NETLIFY_SITE_ID;
            const deadline = Date.now() + 30 * 60 * 1000;
            while (Date.now() < deadline) {
              const deploy = await readJson(
                await request(`${api}/deploys/${deployId}`),
                "Netlify first beta production deploy status",
              );
              if (["error", "canceled", "rejected"].includes(deploy.state)) {
                throw new Error(
                  `Netlify first beta production deploy ${deployId} failed in state ${deploy.state}: ${deploy.error_message || "unknown error"}`,
                );
              }
              if (deploy.state === "ready") {
                const site = await readJson(
                  await request(`${api}/sites/${siteId}`),
                  "Netlify first beta published deploy lookup",
                );
                const publishedId = site.published_deploy?.id;
                if (publishedId === deployId) {
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `published_deploy_id=${deployId}\n`);
                  console.log(`Netlify published first beta production deploy ${deployId}.`);
                  return;
                }
                if (publishedId) {
                  throw new Error(
                    `Netlify published unrelated deploy ${publishedId} while waiting for first beta production deploy ${deployId}.`,
                  );
                }
                console.log("First beta production deploy is ready; waiting for Netlify to publish it.");
              } else {
                console.log(`Netlify first beta production deploy state: ${deploy.state || "unknown"}`);
              }
              await sleep(10_000);
            }
            throw new Error(
              `Netlify first beta production deploy ${deployId} did not become ready and published within 30 minutes.`,
            );
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Verify beta source is current after publish
        id: beta_post_freshness
        if: >-
          always() && inputs.target == 'beta' && inputs.deploy &&
          steps.beta_freshness.outputs.current == 'true' &&
          steps.deploy.outputs.deploy_id != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        continue-on-error: true
        env:
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        with:
          script: |
            const sourceRef = process.env.SOURCE_REF.trim().toLowerCase();
            const mainSha = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })).data.object.sha.toLowerCase();
            const current = /^[0-9a-f]{40}$/.test(sourceRef) && sourceRef === mainSha;
            core.setOutput('current', String(current));
            if (!current) {
              core.warning(
                `Beta source ${sourceRef || 'unknown'} became stale while publishing; main is now ${mainSha}.`,
              );
            }

      - name: Delete staged first beta draft
        id: beta_draft_cleanup
        if: >-
          always() && inputs.target == 'beta' && inputs.deploy &&
          inputs.deploy_mode == 'production' &&
          steps.previous.outputs.published_deploy_id == '' &&
          steps.deploy.outputs.deploy_id != '' &&
          steps.deploy.outputs.deploy_id != steps.beta_first_publish.outputs.deploy_id &&
          steps.deploy.outputs.deploy_id != steps.beta_first_publish_reconcile.outputs.deploy_id
        env:
          DRAFT_DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          (async () => {
            const { requestNetlifyApi } = await import("./scripts/netlify-api-request.ts");
            const api = "https://api.netlify.com/api/v1";
            const headers = {
              Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
            };
            const request = (url, options = {}) => requestNetlifyApi(url, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });
            const readJson = async (response, label) => {
              const text = await response.text();
              const body = text ? JSON.parse(text) : null;
              if (!response.ok) {
                throw new Error(`${label} failed with HTTP ${response.status}: ${JSON.stringify(body)}`);
              }
              return body;
            };
            const draftId = process.env.DRAFT_DEPLOY_ID;
            const siteId = process.env.NETLIFY_SITE_ID;
            const site = await readJson(
              await request(`${api}/sites/${siteId}`),
              "Netlify staged beta draft site lookup",
            );
            if (site.published_deploy?.id === draftId) {
              throw new Error(`Refusing to delete staged beta draft ${draftId} because Netlify published it.`);
            }
            const deletion = await request(`${api}/deploys/${draftId}`, { method: "DELETE" });
            if (deletion.status === 404) {
              console.log(`Staged beta draft ${draftId} was already removed.`);
              return;
            }
            if (!deletion.ok) {
              const cancellation = await request(`${api}/deploys/${draftId}/cancel`, { method: "POST" });
              if (!cancellation.ok) {
                throw new Error(`Netlify could not delete or cancel staged beta draft ${draftId}.`);
              }
              console.log(`Canceled staged beta draft ${draftId} after deletion was rejected.`);
              return;
            }
            await readJson(deletion, `Netlify staged beta draft ${draftId} deletion`);
            const verification = await request(`${api}/deploys/${draftId}`);
            if (verification.status !== 404) {
              throw new Error(`Netlify staged beta draft ${draftId} still exists after deletion.`);
            }
            console.log(`Deleted staged beta draft ${draftId}.`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Revert stale beta deploy
        if: >-
          always() && inputs.target == 'beta' && inputs.deploy &&
          (steps.beta_first_publish.outputs.deploy_id != '' ||
          steps.beta_first_publish_reconcile.outputs.deploy_id != '' ||
          (steps.previous.outputs.published_deploy_id != '' && steps.deploy.outputs.deploy_id != '')) &&
          (steps.beta_post_freshness.outputs.current == 'false' ||
          steps.beta_post_freshness.outcome == 'failure' ||
          steps.beta_first_publish_wait.outcome == 'failure' ||
          (steps.beta_first_publish.outcome == 'failure' &&
          steps.beta_first_publish.outputs.deploy_id == '' &&
          steps.beta_first_publish_reconcile.outputs.deploy_id == ''))
        env:
          DEPLOY_ID: ${{ steps.beta_first_publish.outputs.deploy_id || steps.beta_first_publish_reconcile.outputs.deploy_id || (steps.previous.outputs.published_deploy_id != '' && steps.deploy.outputs.deploy_id) }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          PREVIOUS_DEPLOY_ID: ${{ steps.previous.outputs.published_deploy_id }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          (async () => {
          const { requestNetlifyApi } = await import("./scripts/netlify-api-request.ts");
          const api = "https://api.netlify.com/api/v1";
          const headers = {
            Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
            "User-Agent": "agent-native-prebuilt-beta-freshness-revert",
          };
          const request = (url, options = {}) => requestNetlifyApi(url, {
            ...options,
            headers: { ...headers, ...(options.headers || {}) },
          });
          async function readJson(response, label) {
            const text = await response.text();
            let body = null;
            try {
              body = text ? JSON.parse(text) : null;
            } catch {
              body = text;
            }
            if (!response.ok) {
              throw new Error(
                `${label} failed with HTTP ${response.status}: ${typeof body === "string" ? body : JSON.stringify(body)}`,
              );
            }
            return body;
          }
          const siteId = process.env.NETLIFY_SITE_ID;
          const deployId = process.env.DEPLOY_ID;
          const previousId = process.env.PREVIOUS_DEPLOY_ID;
          if (!siteId || !deployId) throw new Error("Beta freshness cleanup is missing the site or deploy id.");
          // Keep this job in the per-site concurrency group until Netlify
          // proves the stale deploy cannot publish. The job timeout is the
          // final bound; a local cleanup deadline would release the queue
          // while an external deploy could still win it later.
          const cleanupStartedAt = Date.now();
          let cancellationRequested = false;
          let cancellationRejected = false;
          let deletionRequested = false;
          let lastDeletionAttempt = 0;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          while (true) {
            const site = await readJson(
              await request(`${api}/sites/${siteId}`),
              "Netlify beta freshness site lookup",
            );
            const publishedDeployId = site.published_deploy?.id;
            if (publishedDeployId === deployId) {
              if (!previousId) {
                throw new Error(
                  `Cannot safely revert first beta deploy ${deployId}: no previous published deploy exists. First publishes are staged as drafts and only published after a current-main check; a live first publish here indicates an external race, so the queued latest-main beta run must replace it.`,
                );
              }
              const beforeRestore = await readJson(
                await request(`${api}/sites/${siteId}`),
                "Netlify beta freshness restore precondition",
              );
              if (beforeRestore.published_deploy?.id !== deployId) {
                await sleep(1_000);
                continue;
              }
              const restored = await readJson(
                await request(`${api}/sites/${siteId}/deploys/${previousId}/restore`, { method: "POST" }),
                `Netlify beta freshness revert to ${previousId}`,
              );
              const restoredDeployId = restored?.id;
              if (!restoredDeployId) {
                throw new Error(
                  `Netlify beta freshness revert to ${previousId} did not return a new deploy id.`,
                );
              }
              const restoreDeadline = Date.now() + 5 * 60 * 1000;
              while (Date.now() < restoreDeadline) {
                const current = await readJson(
                  await request(`${api}/sites/${siteId}`),
                  "Netlify beta freshness revert verification",
                );
                if (current.published_deploy?.id === restoredDeployId) {
                  console.log(`Restored beta deploy ${previousId} as ${restoredDeployId} after superseding ${deployId}.`);
                  process.exitCode = 1;
                  return;
                }
                await sleep(10_000);
              }
              throw new Error(
                `Netlify did not publish rollback deploy ${restoredDeployId} (restore of ${previousId}) within five minutes.`,
              );
            }
            if (publishedDeployId && publishedDeployId !== previousId) {
              console.log(
                `Netlify beta deploy ${deployId} was superseded by published deploy ${publishedDeployId}; keeping the beta queue occupied until the stale deploy is non-publishable.`,
              );
            }

            const deployResponse = await request(`${api}/deploys/${deployId}`);
            if (deployResponse.status === 404) {
              throw new Error(
                `Stale beta deploy ${deployId} was removed and cannot publish; the queued successor may proceed.`,
              );
            }
            const deploy = await readJson(
              deployResponse,
              `Netlify beta freshness deploy ${deployId} lookup`,
            );
            if (['error', 'canceled', 'rejected'].includes(deploy.state)) {
              throw new Error(`Beta source ${deployId} was superseded by a newer main commit.`);
            }
            if (!cancellationRequested) {
              try {
                await readJson(
                  await request(`${api}/deploys/${deployId}/cancel`, { method: "POST" }),
                  `Netlify stale beta deploy ${deployId} cancellation`,
                );
                console.log(`Requested cancellation for stale beta deploy ${deployId}; observing until it settles.`);
              } catch (error) {
                console.log(`Netlify stale beta deploy ${deployId} did not accept cancellation; continuing to observe it.`);
                console.log(error instanceof Error ? error.message : error);
                cancellationRejected = true;
              }
              cancellationRequested = true;
            }
            if (
              !deletionRequested &&
              (cancellationRejected || Date.now() - cleanupStartedAt >= 5 * 60 * 1000) &&
              Date.now() - lastDeletionAttempt >= 60_000
            ) {
              lastDeletionAttempt = Date.now();
              try {
                const deletion = await request(`${api}/deploys/${deployId}`, {
                  method: "DELETE",
                });
                if (deletion.status === 404) {
                  deletionRequested = true;
                  console.log(`Stale beta deploy ${deployId} was already removed.`);
                } else {
                  await readJson(
                    deletion,
                    `Netlify stale beta deploy ${deployId} deletion`,
                  );
                  deletionRequested = true;
                  console.log(`Requested deletion for stale beta deploy ${deployId}; observing until it is non-publishable.`);
                }
              } catch (error) {
                console.log(`Netlify stale beta deploy ${deployId} deletion was not accepted; keeping the beta queue occupied.`);
                console.log(error instanceof Error ? error.message : error);
              }
            }
            await sleep(10_000);
          }
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Fail after beta freshness verification
        if: >-
          always() &&
          (steps.beta_post_freshness.outcome == 'failure' ||
          steps.beta_post_freshness.outputs.current == 'false' ||
          steps.beta_first_publish_freshness.outcome == 'failure' ||
          steps.beta_first_publish_freshness.outputs.current == 'false' ||
          (steps.beta_first_publish.outcome == 'failure' &&
          steps.beta_first_publish.outputs.deploy_id == '' &&
          steps.beta_first_publish_reconcile.outputs.deploy_id == ''))
        run: |
          set -euo pipefail
          echo "::error::Beta source freshness could not be verified after publish."
          exit 1

      - name: Smoke-test the uploaded deploy
        if: >-
          inputs.target != 'preview' && inputs.deploy &&
          steps.beta_freshness.outputs.current != 'false' &&
          inputs.smoke && steps.target.outputs.source_template != '@agent-native/docs' &&
          (inputs.target != 'beta' ||
          steps.beta_first_publish.outputs.deploy_id != '' ||
          steps.beta_first_publish_reconcile.outputs.deploy_id != '' ||
          (steps.previous.outputs.published_deploy_id != '' && steps.deploy.outputs.deploy_id != ''))
        env:
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          DEPLOY_ID: ${{ steps.beta_first_publish.outputs.deploy_id || steps.beta_first_publish_reconcile.outputs.deploy_id || (steps.previous.outputs.published_deploy_id != '' && steps.deploy.outputs.deploy_id) }}
          DEPLOY_URL: ${{ steps.beta_first_publish.outputs.deploy_url || steps.beta_first_publish_reconcile.outputs.deploy_url || (steps.previous.outputs.published_deploy_id != '' && steps.deploy.outputs.deploy_url) }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          set -euo pipefail
          url="$DEPLOY_URL"
          # A status-only `curl --fail` cannot see a green deploy silently
          # failing on database health or 500ing on Better Auth's jwks route —
          # smoke-check-health.ts asserts the health body, not just the code.
          if [[ "$DEPLOY_MODE" == "production" ]]; then
            url="https://$HOST"
            node --experimental-strip-types scripts/smoke-check-health.ts \
              --url "$url" --canonical-host "$HOST" --auth-routes
          else
            node --experimental-strip-types scripts/smoke-check-health.ts \
              --url "$url" --auth-routes
          fi

      - name: Smoke-test the uploaded PR preview
        if: >-
          inputs.target == 'preview' && inputs.deploy &&
          steps.beta_freshness.outputs.current != 'false' && inputs.smoke &&
          steps.target.outputs.source_template != '@agent-native/docs'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          HOST: ${{ steps.target.outputs.host }}
          SOURCE_TEMPLATE: ${{ steps.target.outputs.source_template }}
        run: |
          set -euo pipefail
          smoke_args=(
            --url "$DEPLOY_URL"
            --canonical-host "$HOST"
            --auth-routes
            --preview
          )
          if [[ "$SOURCE_TEMPLATE" == "clips" ]]; then
            smoke_args+=(--allow-missing-health)
          fi
          node --experimental-strip-types scripts/smoke-check-health.ts "${smoke_args[@]}"

      - name: Comment the PR preview URL
        if: >-
          inputs.target == 'preview' && inputs.deploy &&
          inputs.pull_request_number > 0 && success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          SITE_NAME: ${{ steps.target.outputs.site_name }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pullRequestNumber = Number(process.env.PULL_REQUEST_NUMBER);
            const marker = `<!-- agent-native-netlify-preview:${process.env.SITE_NAME} -->`;
            const deployUrl = process.env.DEPLOY_URL;
            const sourceRef = process.env.SOURCE_REF;
            if (!deployUrl || !sourceRef || !process.env.DEPLOY_ID) {
              core.setFailed('PR preview upload did not return a complete deploy record.');
              return;
            }
            const body = [
              marker,
              `**${process.env.SITE_NAME} preview:** [Open preview](${deployUrl})`,
              '',
              `Built by GitHub Actions from \`${sourceRef}\`; Netlify is serving the uploaded artifact.`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequestNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequestNumber,
                body,
              });
            }

      # The active managed client and its capability are observable only from
      # the live host, so this is a post-publish verification. If the declared
      # managed callback is definitively unregistered, the immediately
      # following step restores the deploy captured above before leaving the
      # job failed. Inconclusive checks fail loudly without destructive
      # rollback. Draft deploy URLs are intentionally excluded because they
      # are not registered OAuth origins.
      - name: Verify Google OAuth redirect registration
        id: google_redirect
        if: >-
          inputs.deploy && steps.beta_freshness.outputs.current != 'false' &&
          inputs.smoke && inputs.deploy_mode == 'production' &&
          steps.target.outputs.source_template != '@agent-native/docs' &&
          steps.previous.outputs.published_deploy_id != ''
        continue-on-error: true
        env:
          HOST: ${{ steps.target.outputs.host }}
        run: |
          set +e
          node --experimental-strip-types scripts/check-google-redirect-uris.ts --host "$HOST" --paths auto
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Roll back after Google callback verification failure
        if: >-
          steps.google_redirect.outcome == 'failure' &&
          steps.google_redirect.outputs.exit_code == '1'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          NEW_DEPLOY_ID: ${{ steps.beta_first_publish.outputs.deploy_id || steps.beta_first_publish_reconcile.outputs.deploy_id || steps.deploy.outputs.deploy_id }}
          PREVIOUS_DEPLOY_ID: ${{ steps.previous.outputs.published_deploy_id }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          (async () => {
            const { requestNetlifyApi } = await import("./scripts/netlify-api-request.ts");
            const api = "https://api.netlify.com/api/v1";
            const headers = {
              Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
            };
            const request = (url, options = {}) => requestNetlifyApi(url, {
              ...options,
              headers: { ...headers, ...(options.headers || {}) },
            });
            const readJson = async (response, label) => {
              const text = await response.text();
              const body = text ? JSON.parse(text) : null;
              if (!response.ok) {
                throw new Error(`${label} failed with HTTP ${response.status}.`);
              }
              return body;
            };
            const siteId = process.env.NETLIFY_SITE_ID;
            const previousId = process.env.PREVIOUS_DEPLOY_ID;
            const newId = process.env.NEW_DEPLOY_ID;
            if (!siteId || !previousId || !newId || previousId === newId) {
              throw new Error("Callback rollback is missing a distinct previous and new deploy id.");
            }
            const current = await readJson(
              await request(`${api}/sites/${siteId}`),
              "Netlify current deploy lookup",
            );
            if (current?.published_deploy?.id !== newId) {
              throw new Error(
                `Refusing callback rollback because Netlify now serves ${current?.published_deploy?.id || "an unknown deploy"}, expected ${newId}.`,
              );
            }
            const restored = await readJson(
              await request(`${api}/sites/${siteId}/deploys/${previousId}/restore`, {
                method: "POST",
              }),
              `Netlify callback rollback to ${previousId}`,
            );
            const restoredDeployId = restored?.id;
            if (!restoredDeployId) {
              throw new Error(
                `Netlify callback rollback to ${previousId} did not return a new deploy id.`,
              );
            }
            const deadline = Date.now() + 5 * 60 * 1000;
            while (Date.now() < deadline) {
              const site = await readJson(
                await request(`${api}/sites/${siteId}`),
                "Netlify callback rollback verification",
              );
              if (site?.published_deploy?.id === restoredDeployId) {
                console.log(`Restored previous published deploy ${previousId} as ${restoredDeployId}.`);
                process.exitCode = 1;
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }
            throw new Error(
              `Netlify did not publish rollback deploy ${restoredDeployId} (restore of ${previousId}) within five minutes.`,
            );
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Fail after Google callback verification
        if: ${{ steps.google_redirect.outcome == 'failure' }}
        run: |
          set -euo pipefail
          probe_exit_code="${{ steps.google_redirect.outputs.exit_code }}"
          echo "::error::Google OAuth callback verification failed (exit code ${probe_exit_code:-2})."
          exit "${probe_exit_code:-2}"

      - name: Smoke-test the static docs deploy
        if: >-
          inputs.deploy && steps.beta_freshness.outputs.current != 'false' &&
          inputs.smoke && steps.target.outputs.source_template == '@agent-native/docs'
        env:
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          HOST: ${{ steps.target.outputs.host }}
        run: |
          set -euo pipefail
          url="$DEPLOY_URL"
          if [[ "$DEPLOY_MODE" == "production" ]]; then
            url="https://$HOST"
          fi
          curl --fail --silent --show-error --location --max-time 60 "${url%/}/" >/dev/null
          echo "Static docs smoke check passed: ${url%/}/"

      - name: Purge the production Netlify cache
        if: inputs.target == 'production' && inputs.deploy && inputs.deploy_mode == 'production' && success()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          const api = "https://api.netlify.com/api/v1";
          const { requestNetlifyApi } = await import("./scripts/netlify-api-request.ts");
          (async () => {
            const response = await requestNetlifyApi(`${api}/purge`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
                "Content-Type": "application/json",
                "User-Agent": "agent-native-prebuilt-production-cache-purge",
              },
              body: JSON.stringify({ site_id: process.env.NETLIFY_SITE_ID }),
            });
            const text = await response.text();
            let body = null;
            try {
              body = text ? JSON.parse(text) : null;
            } catch {
              body = text;
            }
            if (!response.ok) {
              throw new Error(`Netlify production cache purge failed with HTTP ${response.status}: ${JSON.stringify(body)}`);
            }
            console.log(`Purged the Netlify production cache for ${process.env.NETLIFY_SITE_ID} (HTTP ${response.status}).`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      # An unknown URL must still be storable. When it is not, every dead link
      # and crawler miss re-invokes the render function, and Netlify runs one
      # request per container — so a single site's regression drains the
      # concurrency pool the whole account shares. Source review and green
      # builds both missed this; only the live response shows it. Run after
      # purge so this observes the deployment just published, not its predecessor.
      - name: Verify the deployed site still caches a miss
        if: >-
          inputs.deploy && steps.beta_freshness.outputs.current != 'false' &&
          inputs.smoke && inputs.deploy_mode == 'production' && success()
        env:
          HOST: ${{ steps.target.outputs.host }}
        run: node scripts/check-production-cache-contract.mjs --host "$HOST"

      - name: Lock the published production deploy
        if: inputs.target == 'production' && inputs.deploy && inputs.deploy_mode == 'production' && success()
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          const api = "https://api.netlify.com/api/v1";
          const { requestNetlifyApi } = await import("./scripts/netlify-api-request.ts");
          const headers = {
            Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
            "User-Agent": "agent-native-prebuilt-production-lock",
          };
          const request = (url, options = {}) => requestNetlifyApi(url, {
            ...options,
            headers: { ...headers, ...(options.headers || {}) },
          });

          async function readJson(response, label) {
            const text = await response.text();
            const body = text ? JSON.parse(text) : null;
            if (!response.ok) {
              throw new Error(`${label} failed with HTTP ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          const site = await readJson(
            await request(`${api}/sites/${process.env.NETLIFY_SITE_ID}`),
            "Netlify published deploy lookup before lock",
          );
          if (site.published_deploy?.id !== process.env.DEPLOY_ID) {
            throw new Error(
              `Expected deploy ${process.env.DEPLOY_ID} to be published before locking; Netlify serves ${site.published_deploy?.id || "no deploy"}.`,
            );
          }
          const deployUrl = `${api}/deploys/${process.env.DEPLOY_ID}`;
          const deploy = await readJson(await request(deployUrl), "Netlify deploy lock lookup");
          if (deploy.locked !== true) {
            await readJson(
              await request(`${deployUrl}/lock`, { method: "POST" }),
              `Netlify deploy ${process.env.DEPLOY_ID} lock`,
            );
          }
          const locked = await readJson(await request(deployUrl), "Netlify deploy lock verification");
          if (locked.locked !== true) {
            throw new Error(`Netlify deploy ${process.env.DEPLOY_ID} did not report locked=true after lock.`);
          }
          console.log(`Locked published production deploy ${process.env.DEPLOY_ID}.`);
          NODE

      - name: Resume automatic Netlify builds after production cutover
        if: inputs.target == 'production' && inputs.deploy && inputs.deploy_mode == 'production' && always()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          cutoverWasStopped: ${{ steps.pause.outputs.was_stopped }}
          cutoverWasPaused: ${{ steps.pause.outputs.cutover_acquired }}
          cutoverHasGitConnectedBuild: ${{ steps.pause.outputs.has_git_connected_build }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          const api = "https://api.netlify.com/api/v1";
          const headers = {
            Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
            "User-Agent": "agent-native-prebuilt-production-build-resume",
          };
          const request = (url, options = {}) =>
            import("./scripts/netlify-api-request.ts").then(({ requestNetlifyApi }) =>
              requestNetlifyApi(url, {
                ...options,
                headers: { ...headers, ...(options.headers || {}) },
              }),
            );

          async function readJson(response, label) {
            const text = await response.text();
            const body = text ? JSON.parse(text) : null;
            if (!response.ok) {
              throw new Error(`${label} failed with HTTP ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          if (process.env.cutoverWasPaused !== "true") {
            console.log("No production cutover state was acquired; automatic builds are unchanged.");
            process.exit(0);
          }
          if (process.env.cutoverHasGitConnectedBuild !== "true") {
            console.log(
              "No Git-connected Netlify build was configured; automatic builds are unchanged.",
            );
            process.exit(0);
          }
          if (process.env.cutoverWasStopped === "true") {
            console.log("Automatic Netlify builds were already stopped; preserving that setting.");
            process.exit(0);
          }
          const siteId = process.env.NETLIFY_SITE_ID;
          await readJson(
            await request(`${api}/sites/${siteId}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ build_settings: { stop_builds: false } }),
            }),
            "Netlify automatic build resume",
          );
          async function waitForBuildSetting(expected, label) {
            let actual;
            for (let attempt = 1; attempt <= 15; attempt += 1) {
              const site = await readJson(
                await request(`${api}/sites/${siteId}`),
                `${label} verification attempt ${attempt}`,
              );
              actual = site.build_settings?.stop_builds ?? site.repo?.stop_builds;
              if (actual === expected) return;
              if (attempt < 15) {
                await new Promise((resolve) => setTimeout(resolve, 2_000));
              }
            }
            throw new Error(`${label} expected stop_builds=${expected}, got ${actual}.`);
          }
          await waitForBuildSetting(false, "Netlify automatic build resume");
          console.log("Automatic Netlify builds resumed after production cutover.");
          NODE

      - name: Restore the production deploy lock after a failed cutover
        if: inputs.target == 'production' && inputs.deploy && inputs.deploy_mode == 'production' && failure()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.target.outputs.site_id }}
          cutoverPublishedDeployId: ${{ steps.unlock.outputs.published_deploy_id }}
          cutoverNewDeployId: ${{ steps.deploy.outputs.deploy_id }}
          cutoverWasLocked: ${{ steps.unlock.outputs.was_locked }}
          cutoverWasPaused: ${{ steps.pause.outputs.cutover_acquired }}
        run: |
          set -euo pipefail
          node --experimental-strip-types <<'NODE'
          const api = "https://api.netlify.com/api/v1";
          const headers = {
            Authorization: `Bearer ${process.env.NETLIFY_AUTH_TOKEN}`,
            "User-Agent": "agent-native-prebuilt-production-failure-cleanup",
          };
          const request = (url, options = {}) =>
            import("./scripts/netlify-api-request.ts").then(({ requestNetlifyApi }) =>
              requestNetlifyApi(url, {
                ...options,
                headers: { ...headers, ...(options.headers || {}) },
              }),
            );

          async function readJson(response, label) {
            const text = await response.text();
            const body = text ? JSON.parse(text) : null;
            if (!response.ok) {
              throw new Error(`${label} failed with HTTP ${response.status}: ${JSON.stringify(body)}`);
            }
            return body;
          }

          if (
            process.env.cutoverWasPaused !== "true" ||
            !process.env.cutoverPublishedDeployId
          ) {
            console.log(
              "No production deploy lock state was recorded; lock cleanup is not needed.",
            );
            process.exit(0);
          }
          const originalDeployId = process.env.cutoverPublishedDeployId;
          const newDeployId = process.env.cutoverNewDeployId;
          if (!originalDeployId) {
            throw new Error("Cannot restore the production lock: unlock did not record the original published deploy.");
          }
          const site = await readJson(
            await request(`${api}/sites/${process.env.NETLIFY_SITE_ID}`),
            "Netlify published deploy lookup during failure cleanup",
          );
          const currentDeployId = site.published_deploy?.id;
          if (!currentDeployId) {
            throw new Error("Cannot restore the production lock: site has no published deploy.");
          }
          if (newDeployId && currentDeployId === newDeployId) {
            const deployUrl = `${api}/deploys/${newDeployId}`;
            const deploy = await readJson(await request(deployUrl), "Netlify newly published deploy lock lookup");
            if (deploy.locked !== true) {
              await readJson(
                await request(`${deployUrl}/lock`, { method: "POST" }),
                `Netlify newly published deploy ${newDeployId} failure lock`,
              );
            }
            const locked = await readJson(await request(deployUrl), "Netlify newly published failure lock verification");
            if (locked.locked !== true) {
              throw new Error(`Netlify newly published deploy ${newDeployId} was not locked during failure cleanup.`);
            }
            console.log(`Locked newly published production deploy ${newDeployId} after cutover failure.`);
            process.exit(0);
          }
          if (currentDeployId !== originalDeployId) {
            throw new Error(
              `Refusing failure cleanup to modify published deploy ${currentDeployId}; cutover started from ${originalDeployId}.`,
            );
          }
          const deployUrl = `${api}/deploys/${originalDeployId}`;
          const deploy = await readJson(await request(deployUrl), "Netlify published deploy lock lookup");
          if (process.env.cutoverWasLocked === "true") {
            if (deploy.locked !== true) {
              await readJson(
                await request(`${deployUrl}/lock`, { method: "POST" }),
                `Netlify published deploy ${originalDeployId} failure lock`,
              );
            }
            const locked = await readJson(await request(deployUrl), "Netlify failure lock verification");
            if (locked.locked !== true) {
              throw new Error(`Netlify published deploy ${originalDeployId} was not locked during failure cleanup.`);
            }
            console.log(`Restored production lock on deploy ${originalDeployId}.`);
          } else {
            if (deploy.locked === true) {
              await readJson(
                await request(`${deployUrl}/unlock`, { method: "POST" }),
                `Netlify published deploy ${originalDeployId} failure unlock`,
              );
            }
            const unlocked = await readJson(await request(deployUrl), "Netlify failure unlock verification");
            if (unlocked.locked !== false) {
              throw new Error(`Netlify published deploy ${originalDeployId} was not unlocked during failure cleanup.`);
            }
            console.log(`Restored production unlock state on deploy ${originalDeployId}.`);
          }
          NODE

      - name: Summarize the pilot
        if: always()
        env:
          BUILD_CONTEXT: ${{ inputs.build_context }}
          DEPLOY: ${{ inputs.deploy }}
          DEPLOY_MODE: ${{ inputs.deploy_mode }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          SOURCE_REF: ${{ inputs.source_ref || steps.target.outputs.source_ref }}
          SOURCE_TEMPLATE: ${{ steps.target.outputs.source_template }}
          SITE_NAME: ${{ steps.target.outputs.site_name }}
        run: |
          {
            echo "### Prebuilt Netlify pilot"
            echo "- Site: $SITE_NAME"
            echo "- Source: $SOURCE_TEMPLATE@$SOURCE_REF"
            echo "- Build context: $BUILD_CONTEXT"
            if [[ "$DEPLOY" == "true" ]]; then
              echo "- Deploy: $DEPLOY_MODE ${DEPLOY_URL:-not returned}"
            else
              echo "- Deploy: build-only; no Netlify deploy was created"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
