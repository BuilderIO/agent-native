name: Clips Desktop Release
run-name: >-
  ${{ github.event.inputs.coordinator_run_id && format('{0} ({1}) [release:{2}]', github.workflow, github.event.inputs.mode, github.event.inputs.coordinator_run_id) || '' }}

on:
  push:
    branches: [main]
    paths:
      - "templates/clips/desktop/**"
      - "packages/shared-app-config/**"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: production
        type: choice
        options:
          - production
          - nightly
      version:
        description: "Stable version to release (e.g. 0.2.0). Required for production; Nightly may use the package.json version."
        required: false
        type: string
      source_ref:
        description: "Exact source commit to build for a coordinated release"
        required: false
        type: string
      mode:
        description: "release builds and publishes; stage builds into the draft release without publishing it; publish publishes a draft that a stage run built"
        required: false
        default: release
        type: choice
        options:
          - release
          - stage
          - publish
      coordinator_run_id:
        description: Release coordinator ID used to reconcile a transient dispatch failure
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: clips-desktop-release-${{ github.event_name == 'push' && 'nightly' || inputs.channel || 'production' }}
  cancel-in-progress: false

env:
  TAURI_APP_PATH: templates/clips/desktop
  RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'nightly' || inputs.channel || 'production' }}
  RELEASE_MODE: ${{ inputs.mode || 'release' }}
  RELEASE_TAG_PREFIX: ${{ (github.event_name == 'push' || inputs.channel == 'nightly') && 'clips-nightly-v' || 'clips-v' }}
  RELEASE_POINTER_TAG: ${{ (github.event_name == 'push' || inputs.channel == 'nightly') && 'clips-nightly-latest' || 'clips-latest' }}
  RELEASE_MANIFEST_NAME: ${{ (github.event_name == 'push' || inputs.channel == 'nightly') && 'clips-nightly-latest.json' || 'clips-latest.json' }}
  RELEASE_NAME_PREFIX: ${{ (github.event_name == 'push' || inputs.channel == 'nightly') && 'Clips Nightly' || 'Clips Desktop' }}

jobs:
  resolve-source-ref:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
    steps:
      - name: Validate and pin source commit
        id: source
        env:
          RELEASE_SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        shell: bash
        run: |
          if [ -n "$RELEASE_SOURCE_REF_INPUT" ] && [[ ! "$RELEASE_SOURCE_REF_INPUT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::source_ref must be a full 40-character commit SHA."
            exit 1
          fi
          SOURCE_REF="${RELEASE_SOURCE_REF_INPUT:-$GITHUB_SHA}"
          echo "source_ref=${SOURCE_REF,,}" >> "$GITHUB_OUTPUT"

  prepare-release:
    needs: resolve-source-ref
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-source-ref.outputs.source_ref }}
          sparse-checkout: ${{ env.TAURI_APP_PATH }}

      - name: Resolve version
        id: version
        working-directory: ${{ env.TAURI_APP_PATH }}
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$RELEASE_CHANNEL" = "production" ]; then
            if [ -z "$RELEASE_VERSION_INPUT" ]; then
              echo "::error::Production releases require an explicit stable version input."
              exit 1
            fi
            if [[ ! "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Production versions must be an exact stable major.minor.patch version."
              exit 1
            fi
            RELEASE_VERSION="$RELEASE_VERSION_INPUT"
          else
            # Tauri's Windows MSI target only accepts numeric prerelease
            # identifiers no greater than 65535. Keep Nightly identity in the
            # app name, identifier, tag, and updater endpoint instead.
            if [ "$GITHUB_RUN_NUMBER" -gt 65535 ]; then
              echo "::error::The Nightly run number is too large for a Windows MSI version."
              exit 1
            fi
            if [ -z "$RELEASE_VERSION_INPUT" ]; then
              CURRENT=$(node -p "require('./package.json').version")
              RELEASE_VERSION=$(node -e 'const [ma, mi] = process.argv[1].split("."); console.log(ma + "." + mi + "." + process.argv[2] + "-0")' "$CURRENT" "$GITHUB_RUN_NUMBER")
            elif [[ "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              RELEASE_VERSION="${RELEASE_VERSION_INPUT}-${GITHUB_RUN_NUMBER}"
            elif [[ "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+$ ]]; then
              RELEASE_VERSION="${RELEASE_VERSION_INPUT%-nightly.*}-${GITHUB_RUN_NUMBER}"
            else
              echo "::error::Nightly versions must be semver or include the -nightly prerelease marker."
              exit 1
            fi
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      # The platform builds run at the same time, so the release has to exist
      # before any of them uploads: two builds creating it at once orphaned
      # clips-v0.1.74's macOS bundles.
      - name: Create the draft release the builds upload to
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SOURCE_REF: ${{ needs.resolve-source-ref.outputs.source_ref }}
        run: |
          TAG="${RELEASE_TAG_PREFIX}${RELEASE_VERSION}"
          get_tag_sha() {
            local ref_json object_type object_sha
            if ! ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$1"); then
              return 1
            fi
            object_type=$(printf '%s' "$ref_json" | jq -r '.object.type')
            object_sha=$(printf '%s' "$ref_json" | jq -r '.object.sha')
            if [ "$object_type" = "tag" ]; then
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/$object_sha" --jq '.object.sha'
            else
              printf '%s\n' "$object_sha"
            fi
          }
          RELEASE_ERROR=$(mktemp)
          TAG_ERROR=$(mktemp)
          if RELEASE_JSON=$(gh release view "$TAG" --json isDraft,targetCommitish 2>"$RELEASE_ERROR"); then
            # Rebuilding would replace bundles people may already have
            # downloaded. A run that failed after publishing resumes with
            # "Re-run failed jobs", which does not rerun this job.
            if [ "$(jq -r '.isDraft' <<< "$RELEASE_JSON")" != "true" ]; then
              echo "::error::Release $TAG is already published. To finish publishing it, use \"Re-run failed jobs\" on the run that published it; to rebuild, release a new version."
              exit 1
            fi
            # A draft gets its tag only when it publishes, unless one was
            # reserved first, so fall back to the commit it targets.
            if TAG_SHA=$(get_tag_sha "$TAG" 2>"$TAG_ERROR"); then
              :
            elif grep -q 'HTTP 404' "$TAG_ERROR"; then
              TAG_SHA=$(jq -r '.targetCommitish' <<< "$RELEASE_JSON")
            else
              cat "$TAG_ERROR"
              exit 1
            fi
            if [ "$TAG_SHA" != "$RELEASE_SOURCE_REF" ]; then
              echo "::error::Draft release $TAG points to $TAG_SHA, expected $RELEASE_SOURCE_REF."
              exit 1
            fi
            echo "Draft release $TAG already points to $RELEASE_SOURCE_REF; the builds will upload to it."
          elif grep -q 'release not found' "$RELEASE_ERROR"; then
            if [ "$RELEASE_MODE" = "publish" ]; then
              echo "::error::There is no draft release $TAG to publish. Build it first with mode stage."
              exit 1
            fi
            if TAG_SHA=$(get_tag_sha "$TAG" 2>"$TAG_ERROR"); then
              if [ "$TAG_SHA" != "$RELEASE_SOURCE_REF" ]; then
                echo "::error::Existing tag $TAG points to $TAG_SHA, expected $RELEASE_SOURCE_REF."
                exit 1
              fi
            elif ! grep -q 'HTTP 404' "$TAG_ERROR"; then
              cat "$TAG_ERROR"
              exit 1
            fi
            PRERELEASE=()
            if [ "$RELEASE_CHANNEL" = "nightly" ]; then
              PRERELEASE=(--prerelease)
            fi
            RELEASE_BODY=$(printf '%s\n' \
              "Auto-updating ${RELEASE_CHANNEL} build of the Clips menu-bar app." \
              "" \
              "The in-app updater fetches its manifest from the \`${RELEASE_POINTER_TAG}\`" \
              "release — this versioned release is the immutable source of the" \
              "signed bundles it downloads.")
            gh release create "$TAG" --draft "${PRERELEASE[@]}" --latest=false \
              --target "$RELEASE_SOURCE_REF" \
              --title "${RELEASE_NAME_PREFIX} v${RELEASE_VERSION}" \
              --notes "$RELEASE_BODY"
          else
            cat "$RELEASE_ERROR"
            exit 1
          fi
          RELEASE_ID=$(gh release view "$TAG" --json databaseId --jq '.databaseId')
          if [[ ! "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not read the id of release $TAG (got '$RELEASE_ID')."
            exit 1
          fi
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: [resolve-source-ref, prepare-release]
    if: ${{ inputs.mode != 'publish' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin"
          - os: windows-latest
            rust-targets: ""
            args: ""
          - os: ubuntu-22.04
            rust-targets: ""
            args: "--bundles appimage,deb,rpm"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve-source-ref.outputs.source_ref }}

      - name: Guard — refuse to release with placeholder updater pubkey
        shell: bash
        run: |
          if grep -q 'REPLACE_WITH_TAURI_UPDATER_PUBKEY' "$TAURI_APP_PATH/src-tauri/tauri.conf.json"; then
            echo "::error::tauri.conf.json still has the placeholder updater pubkey."
            echo "::error::Generate a keypair with 'pnpm exec tauri signer generate' and commit the public key."
            echo "::error::See templates/clips/desktop/README.md for the full setup."
            exit 1
          fi

      - uses: ./.github/actions/setup-clips-desktop
        with:
          rust-targets: ${{ matrix.rust-targets }}

      - name: Set version
        working-directory: ${{ env.TAURI_APP_PATH }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.RELEASE_VERSION;
          const configPath = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          config.version = version;
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + "\n");
          const cargoPath = "src-tauri/Cargo.toml";
          const cargo = fs.readFileSync(cargoPath, "utf8");
          fs.writeFileSync(cargoPath, cargo.replace(/^version = ".*"/m, `version = "${version}"`));
          NODE

      - name: Configure release channel
        working-directory: ${{ env.TAURI_APP_PATH }}
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const channel = process.env.RELEASE_CHANNEL;
          const configPath = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          const nightly = channel === "nightly";
          const binaryName = nightly ? "Clips-Nightly" : "Clips";
          config.productName = nightly ? "Clips Nightly" : "Clips";
          config.mainBinaryName = binaryName;
          config.identifier = nightly ? "com.clips.tray.nightly" : "com.clips.tray";
          config.plugins ??= {};
          config.plugins["deep-link"] ??= {};
          config.plugins["deep-link"].desktop ??= {};
          config.plugins["deep-link"].desktop.schemes = [
            nightly ? "clips-nightly" : "clips",
          ];
          config.plugins.updater ??= {};
          config.plugins.updater.endpoints = [
            nightly
              ? "https://clips.agent-native.com/api/clips-updater.json?channel=nightly"
              : "https://clips.agent-native.com/api/clips-updater.json",
          ];
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + "\n");
          const cargoPath = "src-tauri/Cargo.toml";
          const cargo = fs.readFileSync(cargoPath, "utf8");
          if (!/^name = "Clips"$/m.test(cargo)) {
            throw new Error("Could not find the Clips Cargo binary target.");
          }
          const updatedCargo = cargo.replace(
            /^name = "Clips"$/m,
            `name = "${binaryName}"`,
          );
          fs.writeFileSync(cargoPath, updatedCargo);
          NODE

      # clips-desktop-build-check.yml runs this step without the secrets or
      # releaseId; keep the two in step.
      - name: Build and release (tauri-action)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CLIPS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.CLIPS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: W3PMF2T3MW
          CLIPS_DESKTOP_SENTRY_DSN: ${{ secrets.CLIPS_DESKTOP_SENTRY_DSN || secrets.SENTRY_CLIENT_DSN || secrets.SENTRY_DSN }}
          CLIPS_DESKTOP_SENTRY_CLIENT_KEY: ${{ secrets.CLIPS_DESKTOP_SENTRY_CLIENT_KEY || secrets.SENTRY_CLIENT_KEY }}
          CLIPS_DESKTOP_SENTRY_PROJECT_ID: ${{ secrets.CLIPS_DESKTOP_SENTRY_PROJECT_ID || secrets.SENTRY_PROJECT_ID }}
          CLIPS_DESKTOP_SENTRY_INGEST_HOST: ${{ secrets.CLIPS_DESKTOP_SENTRY_INGEST_HOST || secrets.SENTRY_INGEST_HOST }}
          CLIPS_DESKTOP_SENTRY_ENVIRONMENT: ${{ env.RELEASE_CHANNEL }}
          VITE_CLIPS_DEFAULT_SERVER_URL: ${{ env.RELEASE_CHANNEL == 'nightly' && 'https://beta.clips.agent-native.com' || '' }}
        with:
          projectPath: ${{ env.TAURI_APP_PATH }}
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          # Each build would read, merge and re-upload latest.json, and builds
          # running at the same time drop each other's platforms. publish-release
          # writes it once from every build's .sig files.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Verify macOS permission metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="Clips"
          EXPECTED_EXECUTABLE="Clips"
          EXPECTED_IDENTIFIER="com.clips.tray"
          if [ "$RELEASE_CHANNEL" = "nightly" ]; then
            APP_NAME="Clips Nightly"
            EXPECTED_EXECUTABLE="Clips-Nightly"
            EXPECTED_IDENTIFIER="com.clips.tray.nightly"
          fi
          APP_PATH=$(find "$TAURI_APP_PATH/src-tauri/target" -path "*/bundle/macos/$APP_NAME.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find built $APP_NAME.app bundle"
            exit 1
          fi

          INFO="$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSScreenCaptureUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSCalendarsUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSCalendarsFullAccessUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSSpeechRecognitionUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO" | grep -qx "$EXPECTED_IDENTIFIER"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO" | grep -qx "$EXPECTED_EXECUTABLE"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO" >/dev/null

          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP_PATH" 2>/dev/null)
          grep -q '<key>com.apple.security.device.camera</key>' <<< "$ENTITLEMENTS"
          grep -q '<key>com.apple.security.device.audio-input</key>' <<< "$ENTITLEMENTS"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

  publish-release:
    needs: [prepare-release, build-tauri]
    # A publish run skips the builds, so the default success() check would skip
    # this job too.
    if: >-
      ${{ !cancelled() && inputs.mode != 'stage' &&
      needs.prepare-release.result == 'success' &&
      (inputs.mode == 'publish' || needs.build-tauri.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      # The manifest script comes from this workflow's revision, not the
      # release's source commit, which may predate it.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: scripts

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Resolve version
        id: v
        run: echo "version=${{ needs.prepare-release.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Write the updater manifest from every build's signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        shell: bash
        run: |
          RELEASE_TAG="${RELEASE_TAG_PREFIX}${RELEASE_VERSION}"
          # Not manifest/: the pointer step downloads latest.json there and
          # fails when the file already exists.
          mkdir -p updater/signatures
          gh release view "$RELEASE_TAG" --json assets,body > updater/release.json
          # The DMG is the macOS download and has no signature, so the
          # manifest script below never checks for it.
          if ! jq -e 'any(.assets[].name; endswith(".dmg"))' updater/release.json > /dev/null; then
            echo "::error::$RELEASE_TAG has no .dmg, so the macOS build did not finish."
            exit 1
          fi
          SIGNATURES=$(jq '[.assets[].name | select(endswith(".sig"))] | length' updater/release.json)
          if [ "$SIGNATURES" -eq 0 ]; then
            # A publish run never saw the builds, so a draft without signatures
            # may hold no builds at all.
            if [ "$RELEASE_MODE" = "publish" ]; then
              echo "::error::$RELEASE_TAG has no .sig files, so no build reached it. Build it again with mode stage before publishing."
              exit 1
            fi
            echo "⚠️ No .sig files in $RELEASE_TAG — TAURI_SIGNING_PRIVATE_KEY may not be configured; writing no updater manifest."
            exit 0
          fi
          gh release download "$RELEASE_TAG" --pattern '*.sig' --dir updater/signatures
          # One key per bundle the build-tauri matrix makes; each also implies
          # its plain {os}-{arch} key. Tauri's updater reads the installer's
          # own key first, so a .deb install without one gets the AppImage.
          node --experimental-strip-types scripts/clips-updater-manifest.ts \
            --release updater/release.json \
            --signatures updater/signatures \
            --version "$RELEASE_VERSION" \
            --require darwin-universal-app,windows-x86_64-msi,linux-x86_64-appimage,linux-x86_64-deb,linux-x86_64-rpm \
            > updater/latest.json
          gh release upload "$RELEASE_TAG" updater/latest.json --clobber

      - name: Mark versioned release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          retry() {
            local attempts="$1"
            shift
            local delay=2
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi
              echo "Attempt $n failed; retrying in ${delay}s..."
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          retry 5 gh release edit "${{ env.RELEASE_TAG_PREFIX }}${{ steps.v.outputs.version }}" \
            --draft=false \
            --latest=false

      - name: Download and publish updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          retry() {
            local attempts="$1"
            shift
            local delay=2
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi
              echo "Attempt $n failed; retrying in ${delay}s..."
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          RELEASE_TAG="${{ env.RELEASE_TAG_PREFIX }}${{ steps.v.outputs.version }}"
          POINTER_TAG="${{ env.RELEASE_POINTER_TAG }}"
          MANIFEST_NAME="${{ env.RELEASE_MANIFEST_NAME }}"
          mkdir -p manifest

          # latest.json is only produced when TAURI_SIGNING_PRIVATE_KEY is set.
          # Check explicitly so real API/auth errors aren't silently swallowed.
          HAS_MANIFEST=$(gh release view "$RELEASE_TAG" --json assets \
            -q '[.assets[].name] | any(. == "latest.json")') || {
            echo "❌ Failed to query release assets for $RELEASE_TAG"
            exit 1
          }

          if [ "$HAS_MANIFEST" = "true" ]; then
            retry 5 gh release download "$RELEASE_TAG" --pattern 'latest.json' --dir manifest
            mv manifest/latest.json "manifest/$MANIFEST_NAME"

            if [ "$RELEASE_CHANNEL" = "nightly" ]; then
              MANIFEST_TITLE="Clips Nightly — latest (updater manifest)"
              MANIFEST_NOTES="Nightly URL for the Clips auto-updater. Overwritten on every release. Versioned bundles live in clips-nightly-v* releases."
            else
              MANIFEST_TITLE="Clips Desktop — latest (updater manifest)"
              MANIFEST_NOTES="Stable URL for the Clips auto-updater. Overwritten on every release. Versioned bundles live in clips-v* releases."
            fi

            if gh release view "$POINTER_TAG" --json tagName -q .tagName >/dev/null 2>&1; then
              retry 5 gh release delete-asset "$POINTER_TAG" "$MANIFEST_NAME" --yes || true
              retry 5 gh release upload "$POINTER_TAG" "manifest/$MANIFEST_NAME"
              retry 5 gh release edit "$POINTER_TAG" \
                --title "$MANIFEST_TITLE" \
                --notes "$MANIFEST_NOTES"
            else
              retry 5 gh release create "$POINTER_TAG" "manifest/$MANIFEST_NAME" \
                --title "$MANIFEST_TITLE" \
                --notes "$MANIFEST_NOTES" \
                --latest=false
            fi
            echo "✅ Updater manifest published to $POINTER_TAG release"
          else
            echo "⚠️ No latest.json in $RELEASE_TAG — TAURI_SIGNING_PRIVATE_KEY may not be configured."
            echo "⚠️ Release published without auto-update support. Users can still download manually."
          fi
