name: Clips Desktop Release

# Release channels for the Clips Tauri menu-bar app are separate from the main
# Electron desktop app and from each other. Pushes to main build Nightly;
# production is released deliberately through workflow_dispatch. Each channel
# has its own app identifier, release tag namespace, and updater pointer.

on:
  push:
    branches: [main]
    paths:
      - "templates/clips/desktop/**"
      - "packages/shared-app-config/**"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: production
        type: choice
        options:
          - production
          - nightly
      version:
        description: "Stable version to release (e.g. 0.2.0). Required for production; Nightly may use the package.json version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: clips-desktop-release-${{ github.event_name == 'push' && 'nightly' || inputs.channel || 'production' }}
  cancel-in-progress: false

env:
  TAURI_APP_PATH: templates/clips/desktop
  RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'nightly' || inputs.channel || 'production' }}
  RELEASE_TAG_PREFIX: ${{ (github.event_name == 'push' || inputs.channel == 'nightly') && 'clips-nightly-v' || 'clips-v' }}
  RELEASE_POINTER_TAG: ${{ (github.event_name == 'push' || inputs.channel == 'nightly') && 'clips-nightly-latest' || 'clips-latest' }}
  RELEASE_MANIFEST_NAME: ${{ (github.event_name == 'push' || inputs.channel == 'nightly') && 'clips-nightly-latest.json' || 'clips-latest.json' }}
  RELEASE_NAME_PREFIX: ${{ (github.event_name == 'push' || inputs.channel == 'nightly') && 'Clips Nightly' || 'Clips Desktop' }}

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      # Serialize so platform jobs can't race to create the draft release at
      # the same time — when both call tauri-action concurrently, one job's
      # bundles + latest.json get orphaned (clips-v0.1.74 lost its macOS
      # assets this way, leaving the manifest Windows-only and breaking the
      # Tauri updater on macOS clients).
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin"
          - os: windows-latest
            rust-targets: ""
            args: ""
          - os: ubuntu-22.04
            rust-targets: ""
            args: "--bundles appimage,deb,rpm"
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-latest' && '13.0' || '' }}
      GGML_METAL_MACOSX_VERSION_MIN: ${{ matrix.os == 'macos-latest' && '13.0' || '' }}
    outputs:
      app-version: ${{ steps.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-pipewire

      - name: Guard — refuse to release with placeholder updater pubkey
        shell: bash
        run: |
          if grep -q 'REPLACE_WITH_TAURI_UPDATER_PUBKEY' "$TAURI_APP_PATH/src-tauri/tauri.conf.json"; then
            echo "::error::tauri.conf.json still has the placeholder updater pubkey."
            echo "::error::Generate a keypair with 'pnpm exec tauri signer generate' and commit the public key."
            echo "::error::See templates/clips/desktop/README.md for the full setup."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Link Apple compiler runtime for Rust
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # Xcode emits __isPlatformVersionAtLeast for whisper-rs-sys's
          # availability checks. Rust's final link does not add compiler-rt.
          CLANG_RUNTIME="$(xcrun --sdk macosx clang -print-libgcc-file-name)"
          echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=${CLANG_RUNTIME}" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ env.TAURI_APP_PATH }}/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require production version
        if: env.RELEASE_CHANNEL == 'production' && inputs.version == ''
        shell: bash
        run: |
          echo "::error::Production releases require an explicit stable version input."
          exit 1

      - name: Auto-bump Nightly version
        if: env.RELEASE_CHANNEL == 'nightly' && (github.event_name == 'push' || inputs.version == '')
        working-directory: ${{ env.TAURI_APP_PATH }}
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          # Use the run number for monotonic uniqueness, and keep Nightly
          # versions prerelease so they cannot enter the production feed.
          NEXT=$(node -e "const [ma,mi]=process.argv[1].split('.'); console.log(ma+'.'+mi+'.${{ github.run_number }}-nightly.0')" "$CURRENT")
          npm version "$NEXT" --no-git-tag-version
          node -e "
            const fs = require('fs');
            const tc = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            tc.version = '$NEXT';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tc, null, 2) + '\n');
            const cargo = fs.readFileSync('src-tauri/Cargo.toml','utf8');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo.replace(/^version = \".*\"/m, 'version = \"$NEXT\"'));
          "
          echo "Auto-bumped version: $CURRENT → $NEXT"

      - name: Bump version (manual)
        if: inputs.version != ''
        working-directory: ${{ env.TAURI_APP_PATH }}
        shell: bash
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$RELEASE_CHANNEL" = "nightly" ]; then
            if [[ "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              RELEASE_VERSION="${RELEASE_VERSION_INPUT}-nightly.${GITHUB_RUN_NUMBER}.0"
            elif [[ "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+$ ]]; then
              RELEASE_VERSION="$RELEASE_VERSION_INPUT"
            else
              echo "::error::Nightly versions must be semver or include the -nightly prerelease marker."
              exit 1
            fi
          else
            if [[ ! "$RELEASE_VERSION_INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Production versions must be an exact stable major.minor.patch version."
              exit 1
            fi
            RELEASE_VERSION="$RELEASE_VERSION_INPUT"
          fi
          npm version "$RELEASE_VERSION" --no-git-tag-version
          node -e "
            const fs = require('fs');
            const tc = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
            tc.version = '$RELEASE_VERSION';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tc, null, 2) + '\n');
            const cargo = fs.readFileSync('src-tauri/Cargo.toml','utf8');
            fs.writeFileSync('src-tauri/Cargo.toml', cargo.replace(/^version = \".*\"/m, 'version = \"$RELEASE_VERSION\"'));
          "

      - name: Resolve version
        id: resolve-version
        shell: bash
        run: |
          V=$(node -p "require('./${{ env.TAURI_APP_PATH }}/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Configure release channel
        working-directory: ${{ env.TAURI_APP_PATH }}
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ env.RELEASE_CHANNEL }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const channel = process.env.RELEASE_CHANNEL;
          const configPath = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          const nightly = channel === "nightly";
          const binaryName = nightly ? "Clips-Nightly" : "Clips";
          config.productName = nightly ? "Clips Nightly" : "Clips";
          config.mainBinaryName = binaryName;
          config.identifier = nightly ? "com.clips.tray.nightly" : "com.clips.tray";
          config.plugins ??= {};
          config.plugins["deep-link"] ??= {};
          config.plugins["deep-link"].desktop ??= {};
          config.plugins["deep-link"].desktop.schemes = [
            nightly ? "clips-nightly" : "clips",
          ];
          config.plugins.updater ??= {};
          config.plugins.updater.endpoints = [
            nightly
              ? "https://clips.agent-native.com/api/clips-updater.json?channel=nightly"
              : "https://clips.agent-native.com/api/clips-updater.json",
          ];
          fs.writeFileSync(configPath, JSON.stringify(config, null, 2) + "\n");
          const cargoPath = "src-tauri/Cargo.toml";
          const cargo = fs.readFileSync(cargoPath, "utf8");
          if (!/^name = "Clips"$/m.test(cargo)) {
            throw new Error("Could not find the Clips Cargo binary target.");
          }
          const updatedCargo = cargo.replace(
            /^name = "Clips"$/m,
            `name = "${binaryName}"`,
          );
          fs.writeFileSync(cargoPath, updatedCargo);
          NODE

      - name: Build and release (tauri-action)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri signing — REQUIRED for the updater to accept downloaded
          # bundles. See templates/clips/desktop/README.md for key setup.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.CLIPS_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.CLIPS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS codesign + notarize (reuses the Electron app's Apple creds).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: W3PMF2T3MW
          # Sentry error reporting for the Tauri native process and webview.
          CLIPS_DESKTOP_SENTRY_DSN: ${{ secrets.CLIPS_DESKTOP_SENTRY_DSN || secrets.SENTRY_CLIENT_DSN || secrets.SENTRY_DSN }}
          CLIPS_DESKTOP_SENTRY_CLIENT_KEY: ${{ secrets.CLIPS_DESKTOP_SENTRY_CLIENT_KEY || secrets.SENTRY_CLIENT_KEY }}
          CLIPS_DESKTOP_SENTRY_PROJECT_ID: ${{ secrets.CLIPS_DESKTOP_SENTRY_PROJECT_ID || secrets.SENTRY_PROJECT_ID }}
          CLIPS_DESKTOP_SENTRY_INGEST_HOST: ${{ secrets.CLIPS_DESKTOP_SENTRY_INGEST_HOST || secrets.SENTRY_INGEST_HOST }}
          CLIPS_DESKTOP_SENTRY_ENVIRONMENT: ${{ env.RELEASE_CHANNEL }}
        with:
          projectPath: ${{ env.TAURI_APP_PATH }}
          tagName: ${{ env.RELEASE_TAG_PREFIX }}__VERSION__
          releaseName: "${{ env.RELEASE_NAME_PREFIX }} v__VERSION__"
          releaseBody: |
            Auto-updating ${{ env.RELEASE_CHANNEL }} build of the Clips menu-bar app.

            The in-app updater fetches its manifest from the `${{ env.RELEASE_POINTER_TAG }}`
            release — this versioned release is the immutable source of the
            signed bundles it downloads.
          releaseDraft: true
          prerelease: ${{ env.RELEASE_CHANNEL == 'nightly' }}
          args: ${{ matrix.args }}

      - name: Verify macOS permission metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_NAME="Clips"
          EXPECTED_EXECUTABLE="Clips"
          EXPECTED_IDENTIFIER="com.clips.tray"
          if [ "$RELEASE_CHANNEL" = "nightly" ]; then
            APP_NAME="Clips Nightly"
            EXPECTED_EXECUTABLE="Clips-Nightly"
            EXPECTED_IDENTIFIER="com.clips.tray.nightly"
          fi
          APP_PATH=$(find "$TAURI_APP_PATH/src-tauri/target" -path "*/bundle/macos/$APP_NAME.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find built $APP_NAME.app bundle"
            exit 1
          fi

          INFO="$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSScreenCaptureUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSCalendarsUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSCalendarsFullAccessUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSSpeechRecognitionUsageDescription" "$INFO" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO" | grep -qx "$EXPECTED_IDENTIFIER"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO" | grep -qx "$EXPECTED_EXECUTABLE"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO" >/dev/null

          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP_PATH" 2>/dev/null)
          grep -q '<key>com.apple.security.device.camera</key>' <<< "$ENTITLEMENTS"
          grep -q '<key>com.apple.security.device.audio-input</key>' <<< "$ENTITLEMENTS"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve version
        id: v
        run: echo "version=${{ needs.build-tauri.outputs.app-version }}" >> "$GITHUB_OUTPUT"

      - name: Mark versioned release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          retry() {
            local attempts="$1"
            shift
            local delay=2
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi
              echo "Attempt $n failed; retrying in ${delay}s..."
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          retry 5 gh release edit "${{ env.RELEASE_TAG_PREFIX }}${{ steps.v.outputs.version }}" \
            --draft=false \
            --latest=false

      - name: Download and publish updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          retry() {
            local attempts="$1"
            shift
            local delay=2
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi
              echo "Attempt $n failed; retrying in ${delay}s..."
              sleep "$delay"
              n=$((n + 1))
              delay=$((delay * 2))
            done
          }

          RELEASE_TAG="${{ env.RELEASE_TAG_PREFIX }}${{ steps.v.outputs.version }}"
          POINTER_TAG="${{ env.RELEASE_POINTER_TAG }}"
          MANIFEST_NAME="${{ env.RELEASE_MANIFEST_NAME }}"
          mkdir -p manifest

          # latest.json is only produced when TAURI_SIGNING_PRIVATE_KEY is set.
          # Check explicitly so real API/auth errors aren't silently swallowed.
          HAS_MANIFEST=$(gh release view "$RELEASE_TAG" --json assets \
            -q '[.assets[].name] | any(. == "latest.json")') || {
            echo "❌ Failed to query release assets for $RELEASE_TAG"
            exit 1
          }

          if [ "$HAS_MANIFEST" = "true" ]; then
            retry 5 gh release download "$RELEASE_TAG" --pattern 'latest.json' --dir manifest
            mv manifest/latest.json "manifest/$MANIFEST_NAME"

            if [ "$RELEASE_CHANNEL" = "nightly" ]; then
              MANIFEST_TITLE="Clips Nightly — latest (updater manifest)"
              MANIFEST_NOTES="Nightly URL for the Clips auto-updater. Overwritten on every release. Versioned bundles live in clips-nightly-v* releases."
            else
              MANIFEST_TITLE="Clips Desktop — latest (updater manifest)"
              MANIFEST_NOTES="Stable URL for the Clips auto-updater. Overwritten on every release. Versioned bundles live in clips-v* releases."
            fi

            if gh release view "$POINTER_TAG" --json tagName -q .tagName >/dev/null 2>&1; then
              retry 5 gh release delete-asset "$POINTER_TAG" "$MANIFEST_NAME" --yes || true
              retry 5 gh release upload "$POINTER_TAG" "manifest/$MANIFEST_NAME"
              retry 5 gh release edit "$POINTER_TAG" \
                --title "$MANIFEST_TITLE" \
                --notes "$MANIFEST_NOTES"
            else
              retry 5 gh release create "$POINTER_TAG" "manifest/$MANIFEST_NAME" \
                --title "$MANIFEST_TITLE" \
                --notes "$MANIFEST_NOTES" \
                --latest=false
            fi
            echo "✅ Updater manifest published to $POINTER_TAG release"
          else
            echo "⚠️ No latest.json in $RELEASE_TAG — TAURI_SIGNING_PRIVATE_KEY may not be configured."
            echo "⚠️ Release published without auto-update support. Users can still download manually."
          fi
