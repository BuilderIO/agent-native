name: Publish beta packages

# Beta snapshots run for package-related merges to main. They use Changesets'
# snapshot versioning and the beta npm dist-tag without changing the stable
# release PR or the stable package versions on main.
on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".changeset/**"
      - ".github/workflows/beta-publish.yml"
      - "scripts/changeset-publish-sequential.ts"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-beta-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish beta snapshot
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.BUILDER_BOT_FOR_LINT_APP_ID }}
          private-key: ${{ secrets.BUILDER_BOT_FOR_LINT_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Create beta snapshot versions
        id: snapshot
        run: |
          pnpm changeset version --snapshot beta
          pnpm install --lockfile-only
          if git diff --quiet -- package.json pnpm-lock.yaml 'packages/*/package.json'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build all packages
        if: steps.snapshot.outputs.changed == 'true'
        run: pnpm -r build

      - name: Publish beta packages sequentially
        if: steps.snapshot.outputs.changed == 'true'
        env:
          AGENT_NATIVE_NPM_DIST_TAG: beta
          NPM_CONFIG_PROVENANCE: "true"
        run: node scripts/changeset-publish-sequential.ts

      - name: Summarize beta-only publish
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          {
            echo "Beta packages were published with the npm beta dist-tag."
            echo "The stable builder-workspace updater was intentionally not notified."
          } >> "$GITHUB_STEP_SUMMARY"
