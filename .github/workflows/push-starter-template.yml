name: Push Builder Code starter template to starter

# Runs only after a stable publish, from the published core's release tag.
# Building from main HEAD paired unreleased template changes (scripts calling
# new CLI commands) with the previous published core, breaking every app
# scaffolded in between.
on:
  repository_dispatch:
    types: [agent-native-packages-published]
  workflow_dispatch:
    inputs:
      core_version:
        description: "Published @agent-native/core version to mirror (default: npm latest)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: push-starter-template
  cancel-in-progress: false

jobs:
  push:
    name: Materialize and push template branch
    runs-on: ubuntu-latest
    steps:
      # The dispatch payload's sha is not trusted: the auto-publish recovery
      # redispatch sends the branch HEAD, not the release commit. Dispatches
      # mirror npm `latest`, so a late or retried event cannot roll back.
      - name: Resolve the published release tag
        id: source
        env:
          CORE_VERSION_INPUT: ${{ inputs.core_version }}
          PUBLISHED_PACKAGES: ${{ github.event.client_payload.publishedPackages }}
        run: |
          set -euo pipefail
          # Registry failures retry, then fail loudly: no later dispatch will
          # retry this run.
          npm_view() {
            local out attempt
            for attempt in 1 2 3; do
              if out="$(npm view "$@" --prefer-online 2>/dev/null)"; then
                printf '%s' "$out"; return 0
              fi
              echo "npm registry lookup failed (attempt ${attempt}/3); retrying in 5s..." >&2
              sleep 5
            done
            echo "::error::Could not reach npm for: npm view $*" >&2
            return 1
          }
          version="${CORE_VERSION_INPUT:-}"
          if [ -z "$version" ]; then
            # Right after a publish, `latest` can still read the previous
            # release; wait for it to reach the version this dispatch announced.
            expected="$(printf '%s' "${PUBLISHED_PACKAGES:-[]}" \
              | jq -r 'if type == "string" then fromjson else . end | .[]? | select(.name == "@agent-native/core") | .version' \
              | head -n 1)"
            reached() {
              [ -z "$expected" ] ||
                [ "$(printf '%s\n%s\n' "$expected" "$version" | sort -V | head -n 1)" = "$expected" ]
            }
            for attempt in $(seq 1 20); do
              version="$(npm_view @agent-native/core version)"
              reached && break
              echo "npm latest is ${version}; waiting for ${expected} (attempt ${attempt}/20)..."
              sleep 15
            done
            if ! reached; then
              echo "::error::npm latest is still ${version} after waiting for the dispatched core ${expected}."
              exit 1
            fi
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a stable core version: ${version}"
            exit 1
          fi
          versions="$(npm_view @agent-native/core versions --json)"
          if ! printf '%s' "$versions" \
            | jq -e --arg v "$version" '(if type=="array" then . else [.] end) | index($v) != null' >/dev/null; then
            echo "::error::@agent-native/core@${version} is not published on npm."
            exit 1
          fi
          tag="refs/tags/@agent-native/core@${version}"
          if [ -z "$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "$tag")" ]; then
            echo "::error::Release tag ${tag} does not exist; cannot locate the commit core ${version} was published from."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "ref=${tag}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Require the release commit to pin the resolved core version
        env:
          CORE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          pinned="$(jq -r .version packages/core/package.json)"
          if [ "$pinned" != "$CORE_VERSION" ]; then
            echo "::error::Tag for core ${CORE_VERSION} checks out packages/core at ${pinned}; refusing to mirror a mismatched template."
            exit 1
          fi
          echo "Mirroring the builder-code-starter template from the core ${CORE_VERSION} release commit."

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # builder-code-starter is a layer over templates/chat: materialize copies Chat,
      # then applies the starter's deletions, unified-diff patches, new files,
      # and package.json fields.
      - name: Materialize the bundled builder-code-starter template
        run: >-
          pnpm exec tsx packages/core/src/cli/index.ts template materialize
          --template builder-code-starter --name app --out ./dist/template

      - name: Pin toolkit to the published core's compatible range
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/core/package.json').version")"
          # The exit code separates three cases; don't mask it with `|| true`:
          #   exit 0, non-empty -> the range (pin it)
          #   exit 0, empty     -> core declares no toolkit dep (benign; leave as
          #                        materialized, which matches create's fallback)
          #   exit != 0         -> registry error -> retry, then fail (never push
          #                        an uncontrolled toolkit version)
          range=""; ok=""
          for attempt in 1 2 3; do
            if range="$(npm view "@agent-native/core@${version}" dependencies.@agent-native/toolkit --prefer-online 2>/dev/null)"; then
              ok=1; break
            fi
            echo "npm lookup failed (attempt ${attempt}/3); retrying in 5s..."
            sleep 5
          done
          if [ -z "$ok" ]; then
            echo "::error::Could not reach npm to read core ${version}'s toolkit range; failing rather than pushing an uncontrolled toolkit version."
            exit 1
          fi
          if [ -z "$range" ]; then
            echo "::warning::core ${version} declares no @agent-native/toolkit dependency; leaving toolkit as materialized."
            exit 0
          fi
          # Surgical replace so the rest of package.json keeps materialize's exact
          # formatting (no churn on the template branch).
          sed -i "s#\"@agent-native/toolkit\": \"[^\"]*\"#\"@agent-native/toolkit\": \"${range}\"#" \
            ./dist/template/package.json
          if ! grep -q "\"@agent-native/toolkit\": \"${range}\"" ./dist/template/package.json; then
            echo "::error::Failed to pin @agent-native/toolkit to ${range}."
            exit 1
          fi
          echo "Pinned @agent-native/toolkit to ${range} (from core ${version})."

      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BUILDER_BOT_FOR_LINT_APP_ID }}
          private-key: ${{ secrets.BUILDER_BOT_FOR_LINT_PRIVATE_KEY }}
          owner: BuilderIO
          repositories: builder-agent-native-starter

      - name: Push to starter template branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Capture the source commit before cd'ing into the starter clone.
          SRC_SHA="$(git rev-parse --short HEAD)"
          git clone --depth 1 --branch template \
            "https://x-access-token:${GH_TOKEN}@github.com/BuilderIO/builder-agent-native-starter.git" \
            /tmp/starter
          # Mirror the materialized tree onto the template branch. Preserve
          # .github (the starter-side sync workflow lives there) and never send
          # a .git dir. Skills flow through (they compose with skills update on
          # the starter side).
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            ./dist/template/ /tmp/starter/
          cd /tmp/starter
          git config user.name "builder-bot"
          git config user.email "noreply@builder.io"
          git add -A
          if git diff --cached --quiet; then
            echo "template branch already up to date."
            exit 0
          fi
          git commit -m "chore: sync template from builder-code-starter@${SRC_SHA}"
          git push origin template
