name: Deploy paths reaper

# Drops the Postgres databases the deploy-path check leaked. The check drops
# what it creates on every exit, so this only finds something when a runner was
# killed or a cleanup failed, which is exactly when nothing else will.
# scripts/reap-deploy-paths.ts selects only names the check generates
# (`an_deploy_ci_<epoch>_...`) that are at least two hours old, so it cannot
# touch a real database, nor a run still in progress. Host projects are reused
# by every run and never created per run, so there is nothing to sweep there.
#
# A failed listing or drop fails this workflow, and its last step posts that to
# #qa-agent-native.

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        required: false
        default: true

concurrency:
  group: deploy-paths-reaper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reap:
    name: Sweep leaked databases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SLACK_CHANNEL: C0C4U4XRT6X
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check the credentials
        env:
          DEPLOY_CHECK_DATABASE_URL: ${{ secrets.DEPLOY_CHECK_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_CHECK_DATABASE_URL" ]; then
            echo "::error::The DEPLOY_CHECK_DATABASE_URL secret is not available to this run."
            exit 1
          fi

      - uses: ./.github/actions/setup-pnpm
        with:
          install: no-scripts

      # Scheduled runs delete; a manual dispatch defaults to a dry run.
      - name: Sweep
        env:
          DEPLOY_CHECK_DATABASE_URL: ${{ secrets.DEPLOY_CHECK_DATABASE_URL }}
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p report
          args=(--max-age-minutes 120)
          if [ "$dry_run" = "true" ]; then
            args+=(--dry-run)
          fi
          pnpm exec tsx scripts/reap-deploy-paths.ts "${args[@]}" 2>&1 | tee report/reap.log

      # Only a failed sweep leaves anything worth keeping: an hourly artifact
      # for every clean run would be thousands of 90-day files.
      - name: Retain the complete report
        id: report-artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-paths-reaper-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: report/
          if-no-files-found: ignore
          retention-days: 90

      - name: Post the failure
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.QA_SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ env.SLACK_CHANNEL }}
            text: ":rotating_light: The deploy-path reaper failed, so leaked Neon databases may not have been cleaned up. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Full report: ${{ steps.report-artifact.outputs.artifact-url || 'not available, the report could not be saved' }}"
