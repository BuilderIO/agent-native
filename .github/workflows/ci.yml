      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell --with-deps chromium

      - name: Check platform-aware line-edge caret navigation in slide text
        working-directory: templates/slides
        timeout-minutes: 10
        run: pnpm exec tsx scripts/edit-fidelity/run.ts --caret-qa --line-key-platform linux

  slides-chat-typing-e2e:
