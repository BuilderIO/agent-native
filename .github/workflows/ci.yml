name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-scope:
    name: Determine change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      full: ${{ steps.scope.outputs.full }}
      lint: ${{ steps.scope.outputs.lint }}
      typecheck: ${{ steps.scope.outputs.typecheck }}
      workspace_filters: ${{ steps.scope.outputs.workspace_filters }}
      test_workspace_filters: ${{ steps.scope.outputs.test_workspace_filters }}
      fast_tests: ${{ steps.scope.outputs.fast_tests }}
      content: ${{ steps.scope.outputs.content }}
      content_convergence: ${{ steps.scope.outputs.content_convergence }}
      core_integration: ${{ steps.scope.outputs.core_integration }}
      plan_e2e: ${{ steps.scope.outputs.plan_e2e }}
      brain_evals: ${{ steps.scope.outputs.brain_evals }}
      build: ${{ steps.scope.outputs.build }}
      trusted_acceptance: ${{ steps.scope.outputs.trusted_acceptance }}
      scaffold: ${{ steps.scope.outputs.scaffold }}
      builder_code_starter_scaffold: ${{ steps.scope.outputs.builder_code_starter_scaffold }}
      ssr_boot: ${{ steps.scope.outputs.ssr_boot }}
      ssr_boot_apps: ${{ steps.scope.outputs.ssr_boot_apps }}
      guards: ${{ steps.scope.outputs.guards }}
      qa_static: ${{ steps.scope.outputs.qa_static }}
      neon_query_budget: ${{ steps.scope.outputs.neon_query_budget }}
      query_budget_matrix: ${{ steps.scope.outputs.query_budget_matrix }}
      neon_connection_budget: ${{ steps.scope.outputs.neon_connection_budget }}
      design_canvas_interaction_e2e: ${{ steps.scope.outputs.design_canvas_interaction_e2e }}
      pre_auth_session_replay_e2e: ${{ steps.scope.outputs.pre_auth_session_replay_e2e }}
      design_canvas_e2e_specs: ${{ steps.scope.outputs.design_canvas_e2e_specs }}
      agentkit_acceptance: ${{ steps.scope.outputs.agentkit_acceptance }}
      slides_chat_e2e: ${{ steps.scope.outputs.slides_chat_e2e }}
      slides_authoring_e2e: ${{ steps.scope.outputs.slides_authoring_e2e }}
      slides_oracle: ${{ steps.scope.outputs.slides_oracle }}
      changeset: ${{ steps.scope.outputs.changeset }}
      script_tests: ${{ steps.scope.outputs.script_tests }}
      lanes_matrix: ${{ steps.lanes.outputs.matrix }}
      has_tests: ${{ steps.lanes.outputs.has_tests }}
      core_test_files: ${{ steps.lanes.outputs.core_test_files }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Test change scope classifier
        run: node --experimental-strip-types --test scripts/ci-change-scope.test.ts scripts/ci-build-workspaces.test.ts

      - name: Test fast-test lane planner
        run: node --experimental-strip-types --test scripts/ci-test-lanes.test.ts

      - name: Classify changed paths
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node --experimental-strip-types scripts/ci-change-scope.ts

      # Full planning only reads manifests and counts files. Targeted planning
      # runs `pnpm list` and `vitest list --changed`, so it needs an install.
      - name: Install dependencies for targeted lane planning
        if: steps.scope.outputs.full != 'true' && steps.scope.outputs.fast_tests == 'true'
        uses: ./.github/actions/setup-pnpm
        with:
          install: no-scripts

      - name: Partition test packages into sharded lanes
        id: lanes
        if: steps.scope.outputs.full == 'true' || steps.scope.outputs.fast_tests == 'true'
        env:
          CI_FULL: ${{ steps.scope.outputs.full }}
          TARGETED_WORKSPACE_FILTERS: ${{ steps.scope.outputs.test_workspace_filters }}
          LANES: 8
        run: |
          set -euo pipefail
          if [ "$CI_FULL" = "true" ]; then
            node --experimental-strip-types scripts/ci-test-lanes.ts
          else
            base_sha="$(git rev-parse HEAD^1)"
            CI_WORKSPACE_FILTERS="$TARGETED_WORKSPACE_FILTERS" CI_BASE_SHA="$base_sha" \
              node --experimental-strip-types scripts/ci-test-lanes.ts
          fi

  lint:
    name: Lint & format
    needs: change-scope
    if: needs.change-scope.outputs.lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-pnpm
        with:
          install: no-scripts

      - name: Check the full tree
        if: needs.change-scope.outputs.full == 'true'
        # The tree carries ~15k pre-existing warnings; printing them buries
        # the errors that actually fail this step.
        run: pnpm fmt:check && pnpm oxlint --quiet

      - name: Check changed source files
        if: needs.change-scope.outputs.full != 'true'
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          format_files=()
          lint_files=()
          while IFS= read -r -d '' file; do
            [ -f "$file" ] || continue
            case "$file" in
              # oxfmt formats Markdown too, and `fmt:check` covers the whole
              # tree. Leaving .md/.mdx out here let unformatted docs land on
              # main and turn this job red on every unrelated PR afterwards.
              *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.mts|*.cts|*.json|*.jsonc|*.css|*.md|*.mdx)
                format_files+=("$file")
                ;;
            esac
            case "$file" in
              *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.mts|*.cts)
                lint_files+=("$file")
                ;;
            esac
          done < <(git diff --name-only -z "$CI_BASE_SHA...$CI_HEAD_SHA")

          if ((${#format_files[@]} > 0)); then
            pnpm exec oxfmt --check --no-error-on-unmatched-pattern "${format_files[@]}"
          fi
          if ((${#lint_files[@]} > 0)); then
            pnpm exec oxlint --config .oxlintrc.json --no-error-on-unmatched-pattern "${lint_files[@]}"
          fi

      - name: Require changeset for publishable package changes
        if: ${{ !cancelled() && needs.change-scope.outputs.changeset == 'true' && github.event.pull_request.head.ref != 'changeset-release/main' }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-changeset.mjs

      - name: Enforce package bump policy
        if: ${{ !cancelled() && needs.change-scope.outputs.changeset == 'true' && github.event.pull_request.head.ref != 'changeset-release/main' }}
        run: node scripts/guard-no-major-changeset.mjs

  typecheck:
    name: Typecheck
    needs: change-scope
    if: needs.change-scope.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Build core declarations before dependent typechecks
        if: needs.change-scope.outputs.full == 'true' || contains(needs.change-scope.outputs.test_workspace_filters, '{packages/core}')
        run: pnpm --filter @agent-native/core run build

      - name: Typecheck affected workspaces
        env:
          CI_FULL: ${{ needs.change-scope.outputs.full }}
          CI_WORKSPACE_FILTERS: ${{ needs.change-scope.outputs.test_workspace_filters }}
        run: |
          if [ "$CI_FULL" = "true" ]; then
            pnpm typecheck
          else
            filters=()
            while IFS= read -r filter; do
              filters+=(--filter "$filter")
            done < <(node -e 'for (const filter of JSON.parse(process.env.CI_WORKSPACE_FILTERS)) console.log(filter)')
            pnpm -r --no-bail --if-present "${filters[@]}" run typecheck
          fi

  test-rest:
    name: Fast tests ${{ matrix.lane }}
    needs: change-scope
    if: needs.change-scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One worker per core. The shared config's 25% default is for laptops.
      VITEST_CONCURRENCY: "100%"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.change-scope.outputs.lanes_matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium for browser-backed unit tests
        run: |
          pnpm exec playwright install --only-shell --force chromium
          pnpm --filter @agent-native/creative-context exec playwright install --only-shell --force chromium

      - name: Allow the downloaded Chromium sandbox
        uses: ./.github/actions/allow-playwright-sandbox

      - name: Run core fast-test shard
        if: matrix.coreShard != ''
        run: >-
          pnpm --filter @agent-native/core exec vitest run --dir src
          --shard=${{ matrix.coreShard }}
          --exclude "**/*.db.test.ts"
          --exclude "**/*.integration.spec.ts"
          --exclude "**/*.integration.test.ts"
          --exclude "**/*.e2e.spec.ts"
          --exclude "**/*.e2e.test.ts"
          --exclude "**/e2e/**"
          --exclude "**/*.live.spec.ts"
          --exclude "**/*.live.test.ts"
          --exclude "**/*.perf.spec.ts"
          --exclude "**/*.perf.test.ts"
          --exclude "**/create-e2e.spec.ts"

      - name: Run package fast tests for lane
        if: matrix.filters != ''
        run: >-
          pnpm -r --no-bail --workspace-concurrency=1 ${{ matrix.filters }} run test
          --exclude "**/*.db.test.ts"
          --exclude "**/*.integration.spec.ts"
          --exclude "**/*.integration.test.ts"
          --exclude "**/*.e2e.spec.ts"
          --exclude "**/*.e2e.test.ts"
          --exclude "**/e2e/**"
          --exclude "**/*.live.spec.ts"
          --exclude "**/*.live.test.ts"
          --exclude "**/*.perf.spec.ts"
          --exclude "**/*.perf.test.ts"
          --exclude "**/create-e2e.spec.ts"

      - name: Run package fast-test shards for lane
        if: toJSON(matrix.packageShards) != '[]'
        env:
          PACKAGE_SHARDS: ${{ toJSON(matrix.packageShards) }}
        run: |
          set -uo pipefail
          excludes=(
            --exclude "**/*.db.test.ts"
            --exclude "**/*.integration.spec.ts"
            --exclude "**/*.integration.test.ts"
            --exclude "**/*.e2e.spec.ts"
            --exclude "**/*.e2e.test.ts"
            --exclude "**/e2e/**"
            --exclude "**/*.live.spec.ts"
            --exclude "**/*.live.test.ts"
            --exclude "**/*.perf.spec.ts"
            --exclude "**/*.perf.test.ts"
            --exclude "**/create-e2e.spec.ts"
          )
          status=0
          while IFS=$'\t' read -r name shard; do
            echo "::group::$name ($shard)"
            pnpm --filter "$name" run test --shard="$shard" "${excludes[@]}" || status=1
            echo "::endgroup::"
          done < <(
            node -e 'for (const { name, shard } of JSON.parse(process.env.PACKAGE_SHARDS)) console.log(name + "\t" + shard)'
          )
          exit "$status"

      - name: Run isolated Design HTML integrity performance checks
        if: >-
          matrix.lane == 'lane-1' &&
          (needs.change-scope.outputs.full == 'true' ||
           contains(needs.change-scope.outputs.test_workspace_filters, '{templates/design}'))
        working-directory: templates/design
        env:
          VITEST_CONCURRENCY: "1"
        run: pnpm run test:perf

  test-targeted:
    name: Fast tests targeted ${{ matrix.lane }}
    needs: change-scope
    if: needs.change-scope.outputs.fast_tests == 'true' && needs.change-scope.outputs.full != 'true' && needs.change-scope.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One worker per core. The shared config's 25% default is for laptops.
      VITEST_CONCURRENCY: "100%"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.change-scope.outputs.lanes_matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium for browser-backed unit tests
        run: |
          pnpm exec playwright install --only-shell --force chromium
          pnpm --filter @agent-native/creative-context exec playwright install --only-shell --force chromium

      - name: Allow the downloaded Chromium sandbox
        uses: ./.github/actions/allow-playwright-sandbox

      - name: Run core fast-test shard
        if: matrix.coreShard != ''
        env:
          CORE_SHARD: ${{ matrix.coreShard }}
          CORE_TEST_MODE: ${{ matrix.coreMode }}
          CORE_TEST_FILES: ${{ needs.change-scope.outputs.core_test_files }}
        run: |
          set -euo pipefail
          args=(run --dir src --shard="$CORE_SHARD" --passWithNoTests)
          if [ "$CORE_TEST_MODE" = changed ]; then
            core_test_files=()
            while IFS= read -r -d '' file; do
              core_test_files+=("$file")
            done < <(
              node -e 'for (const file of JSON.parse(process.env.CORE_TEST_FILES)) process.stdout.write(file + "\0")'
            )
            if ((${#core_test_files[@]} == 0)); then
              echo "::error::Planner emitted a changed Core shard with no test files"
              exit 1
            fi
            args+=("${core_test_files[@]}")
          fi
          args+=(
            --exclude "**/*.db.test.ts"
            --exclude "**/*.integration.spec.ts"
            --exclude "**/*.integration.test.ts"
            --exclude "**/*.e2e.spec.ts"
            --exclude "**/*.e2e.test.ts"
            --exclude "**/e2e/**"
            --exclude "**/*.live.spec.ts"
            --exclude "**/*.live.test.ts"
            --exclude "**/*.perf.spec.ts"
            --exclude "**/*.perf.test.ts"
            --exclude "**/create-e2e.spec.ts"
          )
          pnpm --filter @agent-native/core exec vitest "${args[@]}"

      - name: Run package fast tests for lane
        if: matrix.filters != ''
        run: >-
          pnpm -r --no-bail --if-present --workspace-concurrency=1 ${{ matrix.filters }} run test
          --exclude "**/*.db.test.ts"
          --exclude "**/*.integration.spec.ts"
          --exclude "**/*.integration.test.ts"
          --exclude "**/*.e2e.spec.ts"
          --exclude "**/*.e2e.test.ts"
          --exclude "**/e2e/**"
          --exclude "**/*.live.spec.ts"
          --exclude "**/*.live.test.ts"
          --exclude "**/*.perf.spec.ts"
          --exclude "**/*.perf.test.ts"
          --exclude "**/create-e2e.spec.ts"

      - name: Run package fast-test shards for lane
        if: toJSON(matrix.packageShards) != '[]'
        env:
          PACKAGE_SHARDS: ${{ toJSON(matrix.packageShards) }}
        run: |
          set -uo pipefail
          excludes=(
            --exclude "**/*.db.test.ts"
            --exclude "**/*.integration.spec.ts"
            --exclude "**/*.integration.test.ts"
            --exclude "**/*.e2e.spec.ts"
            --exclude "**/*.e2e.test.ts"
            --exclude "**/e2e/**"
            --exclude "**/*.live.spec.ts"
            --exclude "**/*.live.test.ts"
            --exclude "**/*.perf.spec.ts"
            --exclude "**/*.perf.test.ts"
            --exclude "**/create-e2e.spec.ts"
          )
          status=0
          while IFS=$'\t' read -r name shard; do
            echo "::group::$name ($shard)"
            pnpm --filter "$name" run test --shard="$shard" "${excludes[@]}" || status=1
            echo "::endgroup::"
          done < <(
            node -e 'for (const { name, shard } of JSON.parse(process.env.PACKAGE_SHARDS)) console.log(name + "\t" + shard)'
          )
          exit "$status"

      - name: Run isolated Design HTML integrity performance checks
        if: >-
          matrix.lane == 'lane-1' &&
          (needs.change-scope.outputs.full == 'true' ||
           contains(needs.change-scope.outputs.test_workspace_filters, '{templates/design}'))
        working-directory: templates/design
        env:
          VITEST_CONCURRENCY: "1"
        run: pnpm run test:perf

  design-canvas-interaction-acceptance:
    name: Design canvas interaction acceptance (${{ matrix.shard }})
    needs: change-scope
    if: needs.change-scope.outputs.design_canvas_interaction_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard == 'music-app-workflow' && 25 || matrix.shard == 'ai-sidebar-loopback' && 20 || (matrix.shard == 'screen-history-1' || matrix.shard == 'screen-history-2' || matrix.shard == 'screen-history-3') && 13 || 9 }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          [
            inspector-1a,
            inspector-1b,
            inspector-2,
            inspector-3a,
            inspector-3b,
            inspector-4a,
            inspector-4b,
            drag-1a,
            drag-1b,
            drag-2a,
            drag-2b,
            position-1a,
            position-1b,
            position-2a,
            position-2b,
            position-3,
            screen-history-1,
            screen-history-2,
            screen-history-3,
            ai-sidebar-loopback,
            music-app-workflow,
          ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/free-disk

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell chromium

      - name: Allow the downloaded Chromium sandbox
        uses: ./.github/actions/allow-playwright-sandbox

      - name: Run focused Screen selection history regressions
        if: startsWith(matrix.shard, 'screen-history-')
        working-directory: templates/design
        timeout-minutes: 8
        env:
          E2E_RUN_ID: design-selection-history-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
        run: |
          case "${{ matrix.shard }}" in
            screen-history-1)
              grep='undo of a screen deletion remaps stale selection-history entries instead of restoring a dead screen id|undo restores a child layer with its additive Screen selection|marquee-selecting child elements after a Screen pick deletes only the elements|undoing a canvas element click restores its explicit Screen target for Delete|failed Screen deletion keeps the explicit Screen target for retry'
              ;;
            screen-history-2)
              grep='a newer layer selection survives failed Screen deletion settlement|Shift-picking a Screen extends the Delete selection in All screens|a newer Screen pick survives failed Screen deletion settlement|a newer sidebar Screen selection survives failed Screen deletion settlement|Select All Screens survives failed Screen deletion settlement'
              ;;
            screen-history-3)
              grep='deleting a selected child layer keeps its owning Screen|marquee selection persists and deletes Screens after a prior layer selection|deep-select marquee over a Screen deletes only the child|Shift-marqueeing child layers preserves an explicit Screen elsewhere for Delete|Shift-marquee reselecting an owner Screen makes Delete target the Screen'
              ;;
            *)
              echo "::error::Unknown Screen-history shard: ${{ matrix.shard }}"
              exit 2
              ;;
          esac
          pnpm exec playwright test \
            e2e/interaction-selection-history-delete-screen.spec.ts \
            --grep "$grep" \
            --workers=1

      - name: Run AI sidebar loopback image regressions
        if: matrix.shard == 'ai-sidebar-loopback'
        working-directory: templates/design
        timeout-minutes: 18
        env:
          E2E_RUN_ID: design-ai-sidebar-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_AI_SIDEBAR_LOOPBACK: "1"
        run: pnpm exec playwright test e2e/ai-sidebar-reporter-path.spec.ts --workers=1 --retries=0

      - name: Run long music-app workflow regression
        if: ${{ matrix.shard == 'music-app-workflow' && contains(fromJSON(needs.change-scope.outputs.design_canvas_e2e_specs), 'templates/design/e2e/interaction-responsive-music-app.spec.ts') }}
        working-directory: templates/design
        timeout-minutes: 23
        env:
          E2E_RUN_ID: design-music-app-${{ github.run_id }}-${{ github.run_attempt }}
          DESIGN_CANVAS_E2E_SPECS: ${{ needs.change-scope.outputs.design_canvas_e2e_specs }}
        run: |
          set -euo pipefail
          music_app_spec='e2e/interaction-responsive-music-app.spec.ts'
          changed_specs_file="$RUNNER_TEMP/design-canvas-e2e-specs.nul"
          node --experimental-strip-types ../../scripts/design-e2e-spec-selection.ts > "$changed_specs_file"
          mapfile -d '' -t existing_changed_specs < "$changed_specs_file"
          if [[ ! -f "$music_app_spec" ]]; then
            echo "::error::The selected music-app workflow spec is missing."
            exit 2
          fi
          if ((${#existing_changed_specs[@]} == 0)); then
            echo "::error::The music-app workflow regression was selected but no runnable changed spec resolved."
            exit 2
          fi
          if ! printf '%s\n' "${existing_changed_specs[@]}" | grep -Fqx "$music_app_spec"; then
            echo "::error::The music-app workflow regression was selected but is absent from the runnable changed specs."
            exit 2
          fi
          pnpm exec playwright test "$music_app_spec" \
            --grep 'create a responsive music-app (desktop shell under a Screen root|tablet Screen from the desktop shell)$' \
            --workers=1 --retries=0 --trace on

      - name: Upload music-app workflow diagnostics
        if: ${{ failure() && matrix.shard == 'music-app-workflow' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-music-app-${{ github.run_id }}-${{ github.run_attempt }}
          path: templates/design/test-results/design-music-app-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Run focused Design regression cases
        if: ${{ !startsWith(matrix.shard, 'screen-history-') && matrix.shard != 'ai-sidebar-loopback' && matrix.shard != 'music-app-workflow' }}
        working-directory: templates/design
        timeout-minutes: 4
        env:
          E2E_RUN_ID: design-dnd-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Workers in a shard share PGlite-backed application state; each matrix shard has its own E2E_RUN_ID.
          focused_specs_file="$RUNNER_TEMP/design-regression-pins.nul"
          node --experimental-strip-types ../../scripts/design-e2e-regression-pins.ts "${{ matrix.shard }}" > "$focused_specs_file"
          mapfile -d '' -t focused_specs < "$focused_specs_file"
          if (( ${#focused_specs[@]} == 0 )); then
            echo "::error::No Design regression pins resolved for shard ${{ matrix.shard }}"
            exit 2
          fi
          pnpm exec playwright test "${focused_specs[@]}" --workers=1

  design-canvas-changed-spec-diagnostics:
    name: Design changed-spec diagnostics (${{ matrix.shard }})
    needs: change-scope
    if: needs.change-scope.outputs.design_canvas_e2e_specs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        shard:
          [
            changed-1,
            changed-2,
            changed-3,
            changed-4,
            changed-5,
            changed-6,
            changed-7,
            changed-8,
            changed-9,
            changed-10,
            changed-11,
            changed-12,
            changed-13,
            changed-14,
            changed-15,
            changed-16,
            changed-17,
            changed-18,
            changed-19,
            changed-20,
            changed-21,
            changed-22,
            changed-23,
            changed-24,
            changed-25,
            changed-26,
            changed-27,
            changed-28,
            changed-29,
            changed-30,
            changed-31,
            changed-32,
            changed-33,
            changed-34,
            changed-35,
            changed-36,
            changed-37,
            changed-38,
            changed-39,
            changed-40,
            changed-41,
            changed-42,
            changed-43,
            changed-44,
            changed-45,
            changed-46,
            changed-47,
            changed-48,
          ]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/free-disk

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell chromium

      - name: Allow the downloaded Chromium sandbox
        uses: ./.github/actions/allow-playwright-sandbox

      - name: Run changed Design E2E specs
        working-directory: templates/design
        timeout-minutes: 7
        env:
          E2E_RUN_ID: design-dnd-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          DESIGN_CANVAS_E2E_SPECS: ${{ needs.change-scope.outputs.design_canvas_e2e_specs }}
        run: |
          set -euo pipefail
          changed_specs_file="$RUNNER_TEMP/design-canvas-e2e-specs.nul"
          node --experimental-strip-types ../../scripts/design-e2e-spec-selection.ts > "$changed_specs_file"
          mapfile -d '' -t existing_changed_specs < "$changed_specs_file"
          if ((${#existing_changed_specs[@]} == 0)); then
            echo "No runnable changed Design E2E specs remain."
            exit 0
          fi
          changed_shard="${{ matrix.shard }}"
          changed_shard="${changed_shard#changed-}"
          pnpm exec playwright test "${existing_changed_specs[@]}" --workers=1 --fully-parallel --shard="${changed_shard}/48" --grep-invert 'create a responsive music-app (desktop shell under a Screen root|tablet Screen from the desktop shell)$'

  pre-auth-session-replay-smoke:
    name: Pre-auth session replay smoke
    needs: change-scope
    if: needs.change-scope.outputs.pre_auth_session_replay_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/free-disk

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell chromium

      - name: Run pre-auth session replay smoke
        working-directory: templates/design
        timeout-minutes: 7
        env:
          E2E_DISABLE_AUTO_DEV_ACCOUNT: "1"
          E2E_RUN_ID: pre-auth-replay-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm exec playwright test e2e/pre-auth-session-replay-smoke.spec.ts --workers=1

  fast-tests:
    name: Fast tests
    needs:
      [
        change-scope,
        docs,
        test-rest,
        test-targeted,
        design-canvas-interaction-acceptance,
        pre-auth-session-replay-smoke,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize upstream test results
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          CI_FULL: ${{ needs.change-scope.outputs.full }}
          FAST_TESTS: ${{ needs.change-scope.outputs.fast_tests }}
          HAS_TESTS: ${{ needs.change-scope.outputs.has_tests }}
          DOCS_RESULT: ${{ needs.docs.result }}
          TEST_REST_RESULT: ${{ needs.test-rest.result }}
          TEST_TARGETED_RESULT: ${{ needs.test-targeted.result }}
          DESIGN_CANVAS_E2E: ${{ needs.change-scope.outputs.design_canvas_interaction_e2e }}
          DESIGN_CANVAS_RESULT: ${{ needs.design-canvas-interaction-acceptance.result }}
          PRE_AUTH_REPLAY_E2E: ${{ needs.change-scope.outputs.pre_auth_session_replay_e2e }}
          PRE_AUTH_REPLAY_RESULT: ${{ needs.pre-auth-session-replay-smoke.result }}
        run: |
          set -euo pipefail

          actions_run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          failures=()
          record_failure() {
            failures+=("$1: $2")
          }
          require_boolean() {
            local selection="$1"
            local value="$2"
            case "$value" in
              true|false) ;;
              *) record_failure "Determine change scope" "$selection selection was missing or invalid ($value)" ;;
            esac
          }
          require_success() {
            local job="$1"
            local result="$2"
            if [[ "$result" == "skipped" ]]; then
              record_failure "$job" "was unexpectedly skipped (expected success)"
            elif [[ "$result" != "success" ]]; then
              record_failure "$job" "did not succeed (expected success, received $result)"
            fi
          }
          require_skipped() {
            local job="$1"
            local result="$2"
            local reason="$3"
            if [[ "$result" != "skipped" ]]; then
              record_failure "$job" "$reason (expected skipped, received $result)"
            fi
          }

          if [[ "$CHANGE_SCOPE_RESULT" != "success" ]]; then
            require_success "Determine change scope" "$CHANGE_SCOPE_RESULT"
          else
            require_boolean "full-suite" "$CI_FULL"
            require_boolean "Fast tests" "$FAST_TESTS"
            require_boolean "docs-only" "$DOCS_ONLY"

            if [[ "$PRE_AUTH_REPLAY_E2E" == "true" ]]; then
              require_success "Pre-auth session replay smoke" "$PRE_AUTH_REPLAY_RESULT"
            elif [[ "$PRE_AUTH_REPLAY_E2E" == "false" ]]; then
              require_skipped "Pre-auth session replay smoke" "$PRE_AUTH_REPLAY_RESULT" "ran outside its selected paths"
            else
              record_failure "Determine change scope" "pre-auth replay selection was missing or invalid ($PRE_AUTH_REPLAY_E2E)"
            fi

            case "$DESIGN_CANVAS_E2E" in
              true)
                require_success "Design canvas interaction acceptance (matrix jobs)" "$DESIGN_CANVAS_RESULT"
                ;;
              false)
                require_skipped "Design canvas interaction acceptance (matrix jobs)" "$DESIGN_CANVAS_RESULT" "ran outside its selected paths"
                ;;
              *)
                record_failure "Determine change scope" "Design canvas selection was missing or invalid ($DESIGN_CANVAS_E2E)"
                ;;
            esac

            if [[ "$DOCS_ONLY" == "true" ]]; then
              require_success "Docs checks" "$DOCS_RESULT"
              require_skipped "Fast tests (test-rest matrix)" "$TEST_REST_RESULT" "ran outside its selected paths"
              require_skipped "Fast tests targeted (test-targeted matrix)" "$TEST_TARGETED_RESULT" "ran outside its selected paths"
              success_message="Docs-only change: docs checks passed; fast-test lanes are not required."
            else
              require_skipped "Docs checks" "$DOCS_RESULT" "ran outside its selected paths"
              if [[ "$CI_FULL" == "true" ]]; then
                if [[ "$HAS_TESTS" != "true" ]]; then
                  record_failure "Determine change scope" "full fast-test lanes were selected without test lanes (has_tests=$HAS_TESTS)"
                fi
                require_success "Fast tests (test-rest matrix)" "$TEST_REST_RESULT"
                require_skipped "Fast tests targeted (test-targeted matrix)" "$TEST_TARGETED_RESULT" "ran outside its selected paths"
                success_message="Full fast-test suite passed across all sharded lanes."
              else
                require_skipped "Fast tests (test-rest matrix)" "$TEST_REST_RESULT" "ran outside its selected paths"
                if [[ "$FAST_TESTS" != "true" ]]; then
                  require_skipped "Fast tests targeted (test-targeted matrix)" "$TEST_TARGETED_RESULT" "ran without a fast-test selection"
                  success_message="No workspace fast tests are selected for this change set."
                else
                  case "$HAS_TESTS" in
                    true)
                      require_success "Fast tests targeted (test-targeted matrix)" "$TEST_TARGETED_RESULT"
                      success_message="Targeted workspace fast tests passed."
                      ;;
                    false)
                      require_skipped "Fast tests targeted (test-targeted matrix)" "$TEST_TARGETED_RESULT" "no affected workspace has a test script"
                      success_message="No affected workspace has a test script; targeted fast tests were skipped."
                      ;;
                    *)
                      record_failure "Determine change scope" "targeted lanes were not planned (has_tests='$HAS_TESTS')"
                      ;;
                  esac
                fi
              fi
            fi
          fi

          if ((${#failures[@]} > 0)); then
            echo "::error title=Fast tests summary::This job summarizes upstream tests and found ${#failures[@]} failing or unexpectedly skipped prerequisite(s). See the linked Actions run and named jobs below: $actions_run_url"
            for failure in "${failures[@]}"; do
              echo "::error::$failure. Actions run: $actions_run_url"
            done
            exit 1
          fi

          echo "$success_message"

  docs:
    name: Docs checks
    needs: change-scope
    if: needs.change-scope.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Run docs package tests
        run: pnpm --filter @agent-native/docs test

      - name: Typecheck docs package
        run: pnpm --filter @agent-native/docs typecheck

  content-parity:
    name: Content parity
    needs: change-scope
    if: needs.change-scope.outputs.content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Run deterministic Content parity checks
        run: pnpm test:content-parity

  content-db-tests:
    name: Content DB tests
    needs: change-scope
    if: needs.change-scope.outputs.content == 'true' || needs.change-scope.outputs.content_convergence == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/builderio/agent-native-ci-postgres-fallback:17-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: content_migration_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d content_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Create isolated Content row-mutation database
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d content_migration_test -c "CREATE DATABASE content_row_mutation_test"

      - name: Run Content DB tests
        run: pnpm test:content-db

      - name: Install isolated PGlite test driver
        if: ${{ !cancelled() }}
        run: >-
          npm install --ignore-scripts --no-save
          --prefix "$RUNNER_TEMP/s2573-pglite"
          @electric-sql/pglite@0.5.8

      - name: Run PGlite lock and migration action semantics tests
        if: ${{ !cancelled() }}
        run: node scripts/test-content-database-lock-pglite.mjs
        env:
          S2573_PGLITE_INSTALL_PREFIX: ${{ runner.temp }}/s2573-pglite

      - name: Run Content PostgreSQL lock integration tests
        if: ${{ !cancelled() }}
        run: |
          pnpm test:content-db-postgres
          pnpm --filter content exec vitest --run actions/upsert-database-item-by-key.db.test.ts --config vitest.config.ts
        env:
          CONTENT_MIGRATION_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/content_migration_test
          CONTENT_ROW_MUTATION_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/content_row_mutation_test

      # Two tabs on one page against the production build, with the realtime
      # stream refused as a serverless function refuses it.
      - name: Restore Playwright browser cache
        if: ${{ !cancelled() && needs.change-scope.outputs.content_convergence == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        if: ${{ !cancelled() && needs.change-scope.outputs.content_convergence == 'true' }}
        run: pnpm exec playwright install --only-shell --with-deps chromium

      - name: Build Content for the two-tab convergence lane
        id: convergence-build
        if: ${{ !cancelled() && needs.change-scope.outputs.content_convergence == 'true' }}
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U postgres content_convergence
          pnpm --filter content build
        env:
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/content_convergence

      - name: Run Content two-tab convergence lane
        id: convergence
        if: ${{ !cancelled() && steps.convergence-build.outcome == 'success' }}
        working-directory: templates/content
        run: |
          BETTER_AUTH_SECRET="$(openssl rand -hex 32)" pnpm exec playwright test \
            -c e2e/playwright.config.ts \
            e2e/two-tab-convergence.spec.ts \
            e2e/chatgpt-widget-body-paint.spec.ts \
            --workers=1 \
            --grep-invert @known-loss --output test-results/required
        env:
          CONTENT_E2E_SERVE_BUILD: "1"
          CONTENT_BASE_URL: http://127.0.0.1:8090
          CONTENT_CONVERGENCE_BUILD: ${{ github.sha }}
          CONTENT_CONVERGENCE_REPORT: ${{ runner.temp }}/content-convergence/convergence.jsonl
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/content-convergence/required.json
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/content_convergence

      # Main still loses text in these. They report every run without failing
      # the PR until the fix that drops their @known-loss tag lands.
      - name: Run Content two-tab scenarios main still loses text in
        if: ${{ !cancelled() && steps.convergence-build.outcome == 'success' }}
        continue-on-error: true
        working-directory: templates/content
        run: |
          BETTER_AUTH_SECRET="$(openssl rand -hex 32)" pnpm exec playwright test \
            -c e2e/playwright.config.ts e2e/two-tab-convergence.spec.ts --workers=1 \
            --grep @known-loss --pass-with-no-tests --output test-results/known-loss
        env:
          CONTENT_E2E_SERVE_BUILD: "1"
          CONTENT_BASE_URL: http://127.0.0.1:8090
          CONTENT_CONVERGENCE_BUILD: ${{ github.sha }}
          CONTENT_CONVERGENCE_REPORT: ${{ runner.temp }}/content-convergence/convergence.jsonl
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/content-convergence/known-loss.json
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/content_convergence

      - name: Summarize Content two-tab convergence
        if: ${{ !cancelled() && steps.convergence-build.outcome == 'success' }}
        working-directory: templates/content
        run: >-
          node --experimental-strip-types e2e/convergence-summary.ts
          "$RUNNER_TEMP/content-convergence/convergence.jsonl"
          "$RUNNER_TEMP/content-convergence/required.json"
          "$RUNNER_TEMP/content-convergence/known-loss.json"
          >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Content two-tab convergence report
        if: ${{ !cancelled() && steps.convergence-build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-convergence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/content-convergence/
            templates/content/test-results/
          if-no-files-found: warn
          retention-days: 14

  core-integration-tests:
    name: Core integration tests
    needs: change-scope
    if: needs.change-scope.outputs.core_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium for browser-backed integration tests
        run: |
          pnpm exec playwright install --only-shell --force chromium
          pnpm --filter @agent-native/creative-context exec playwright install --only-shell --force chromium

      - name: Run Core integration tests
        run: pnpm test:core-integration

