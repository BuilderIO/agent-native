    needs: change-scope
    if: ${{ needs.change-scope.outputs.slides_chat_e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell --with-deps chromium

      - name: Check chat typing while slide text editing remains active
        working-directory: templates/slides
        timeout-minutes: 20
        run: pnpm exec tsx scripts/edit-fidelity/run.ts --typing-chat

  slides-macos-caret-qa:
    name: Slides caret navigation in macOS
    needs: change-scope
    if: ${{ needs.change-scope.outputs.slides_chat_e2e == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell chromium

      - name: Check platform-aware line-edge caret navigation in slide text
        working-directory: templates/slides
        timeout-minutes: 10
        run: pnpm exec tsx scripts/edit-fidelity/run.ts --caret-qa --line-key-platform darwin

  slides-authoring-e2e:
    name: Slides rich-text authoring
    needs: change-scope
    if: needs.change-scope.outputs.slides_authoring_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: |
          pnpm exec playwright install --only-shell --with-deps chromium
          pnpm exec playwright install --with-deps webkit
          pnpm exec playwright install --with-deps firefox

      - name: Check IME Escape preserves inline slide text editing
        working-directory: templates/slides
        run: pnpm exec tsx scripts/edit-fidelity/run.ts --ime-escape

      - name: Check mobile PowerPoint import pending status
        working-directory: templates/slides
        run: pnpm exec tsx scripts/edit-fidelity/run.ts --mobile-import-status

      - name: Check typing fidelity across Slides text surfaces in Chromium
        working-directory: templates/slides
        run: pnpm exec tsx scripts/edit-fidelity/run.ts --text-surface-qa

      - name: Check typing fidelity across Slides text surfaces in WebKit
        working-directory: templates/slides
        run: pnpm exec tsx scripts/edit-fidelity/run.ts --text-surface-qa --browser webkit

      - name: Check rich-text authoring parity in Slides
        working-directory: templates/slides
        run: pnpm exec tsx scripts/edit-fidelity/run.ts --authoring

      - name: Check rich-text authoring parity in Slides WebKit
        working-directory: templates/slides
        run: pnpm exec tsx scripts/edit-fidelity/run.ts --authoring --browser webkit

      - name: Check rich-text authoring against the committed corpus
        working-directory: templates/slides
        run: pnpm exec tsx scripts/edit-fidelity/run.ts --authoring-corpus

      - name: Run deterministic authoring smoke in Chromium
        working-directory: templates/slides
        run: >-
          pnpm exec tsx scripts/edit-fidelity/run.ts --authoring-fuzz
          --seed 16 --steps 80 --browser chromium

      - name: Run absolute-layout authoring smoke in Chromium
        working-directory: templates/slides
        run: >-
          pnpm exec tsx scripts/edit-fidelity/run.ts --authoring-fuzz
          --seed 2 --steps 80 --browser chromium

      - name: Run deterministic authoring smoke in WebKit
        working-directory: templates/slides
        env:
          SLIDES_AUTHORING_FUZZ_TRACE: "1"
        run: >-
          pnpm exec tsx scripts/edit-fidelity/run.ts --authoring-fuzz
          --seed 16 --steps 80 --browser webkit

      - name: Run deterministic authoring smoke in Firefox
        working-directory: templates/slides
        env:
          SLIDES_AUTHORING_FUZZ_TRACE: "1"
        run: >-
          pnpm exec tsx scripts/edit-fidelity/run.ts --authoring-fuzz
          --seed 16 --steps 80 --browser firefox

  brain-evals:
    name: Brain evals
    needs: change-scope
    if: needs.change-scope.outputs.brain_evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Run brain evals
        run: pnpm test:brain-evals

      - name: Block privacy leaks and false positives
        if: ${{ !cancelled() }}
        run: pnpm test:brain-privacy-evals

  build:
    name: Build artifacts
    needs: change-scope
    if: needs.change-scope.result == 'success' && (needs.change-scope.outputs.docs_only == 'true' || needs.change-scope.outputs.build == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/agent_native_build
    services:
      postgres:
        image: ghcr.io/builderio/agent-native-ci-postgres-fallback:17-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: agent_native_build
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_native_build"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Generate isolated build auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build all packages
        if: needs.change-scope.outputs.full == 'true'
        run: node --experimental-strip-types scripts/ci-build-workspaces.ts --full

      - name: Build affected workspaces
        if: needs.change-scope.outputs.build == 'true' && needs.change-scope.outputs.full != 'true'
        env:
          CI_WORKSPACE_FILTERS: ${{ needs.change-scope.outputs.workspace_filters }}
        run: node --experimental-strip-types scripts/ci-build-workspaces.ts

      - name: Build docs site
        if: needs.change-scope.outputs.docs_only == 'true'
        run: pnpm --filter @agent-native/docs build

  build-gate:
    name: Build
    needs: [change-scope, build, typecheck, guards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on scoped build, typecheck, and security guard results
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs_only }}
          BUILD_REQUIRED: ${{ needs.change-scope.outputs.build }}
          BUILD_RESULT: ${{ needs.build.result }}
          TYPECHECK_REQUIRED: ${{ needs.change-scope.outputs.typecheck }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          GUARDS_REQUIRED: ${{ needs.change-scope.outputs.guards }}
          GUARDS_RESULT: ${{ needs.guards.result }}
        run: |
          set -euo pipefail

          require_selector() {
            local check_name="$1"
            local selected="$2"
            if [[ "$selected" == "true" || "$selected" == "false" ]]; then
              return 0
            fi
            echo "::error::$check_name selection was missing or invalid ($selected)"
            return 1
          }

          require_result() {
            local check_name="$1"
            local selected="$2"
            local result="$3"
            local expected_result="skipped"
            if [[ "$selected" == "true" ]]; then
              expected_result="success"
            fi
            if [[ "$result" == "$expected_result" ]]; then
              return 0
            fi
            echo "::error::$check_name selected=$selected expected=$expected_result result=$result"
            return 1
          }

          status=0
          if [[ "$CHANGE_SCOPE_RESULT" != "success" ]]; then
            echo "::error::change-scope did not succeed ($CHANGE_SCOPE_RESULT)"
            status=1
          fi
          require_selector "Docs build" "$DOCS_ONLY" || status=1
          require_selector "Build artifacts" "$BUILD_REQUIRED" || status=1
          require_selector "Typecheck" "$TYPECHECK_REQUIRED" || status=1
          require_selector "Security guards" "$GUARDS_REQUIRED" || status=1

          build_selected=false
          if [[ "$DOCS_ONLY" == "true" || "$BUILD_REQUIRED" == "true" ]]; then
            build_selected=true
          fi
          require_result "Build artifacts" "$build_selected" "$BUILD_RESULT" || status=1
          require_result "Typecheck" "$TYPECHECK_REQUIRED" "$TYPECHECK_RESULT" || status=1
          require_result "Security guards" "$GUARDS_REQUIRED" "$GUARDS_RESULT" || status=1
          exit "$status"

  neon-query-budget:
    name: Cold-request query budget ${{ matrix.shard }}
    needs: change-scope
    if: needs.change-scope.outputs.neon_query_budget == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.change-scope.outputs.query_budget_matrix) }}
    env:
      AGENT_NATIVE_RELEASE_MIGRATIONS: "1"
      AUTH_DISABLED: "true"
      BETTER_AUTH_SECRET: neon-query-budget-test-secret
      DATABASE_URL: pglite:memory
      NETLIFY: "true"
      NODE_ENV: production
      RUN_BACKGROUND_JOBS: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      # change-scope owns the app list: every template when shared code
      # changed, otherwise only the templates this change touched, split
      # across the matrix shards.
      - name: Build and measure the affected first-party templates
        env:
          QUERY_BUDGET_APPS: ${{ toJSON(matrix.apps) }}
        run: |
          set -euo pipefail
          mapfile -t apps < <(jq -r '.[]' <<< "$QUERY_BUDGET_APPS")
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::change-scope selected the query budget but no templates to measure."
            exit 1
          fi
          echo "Measuring: ${apps[*]}"
          for app in "${apps[@]}"; do
            app_dir="templates/$app"
            rm -rf "$app_dir/.netlify" "$app_dir/.output" "$app_dir/.vercel" "$app_dir/dist" "$app_dir/build"
            release_migrations=""
            if [[ -f "$app_dir/netlify.toml" ]]; then
              release_migrations="$(python3 -c 'import pathlib, sys, tomllib; print(tomllib.loads(pathlib.Path(sys.argv[1]).read_text()).get("context", {}).get("production", {}).get("environment", {}).get("AGENT_NATIVE_RELEASE_MIGRATIONS", ""))' "$app_dir/netlify.toml")"
            fi
            if [[ "$release_migrations" == "1" ]]; then
              export AGENT_NATIVE_RELEASE_MIGRATIONS=1
            else
              unset AGENT_NATIVE_RELEASE_MIGRATIONS
            fi
            NITRO_PRESET=netlify pnpm --filter "$app" build
            pnpm ops:neon-query-budget --app "$app" --mode check
            rm -rf "$app_dir/.netlify" "$app_dir/.output" "$app_dir/.vercel" "$app_dir/dist" "$app_dir/build"
          done

  neon-connection-budget:
    name: Serverless Postgres connection budget
    needs: change-scope
    if: needs.change-scope.outputs.neon_connection_budget == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: ghcr.io/builderio/agent-native-ci-postgres-fallback:18-alpine
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: neon-budget
          POSTGRES_DB: neon_budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neon_budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # guard:allow-secret-literal — local ephemeral CI Postgres service only.
      DATABASE_URL: postgresql://postgres:neon-budget@127.0.0.1:5432/neon_budget
      NETLIFY: "true"
      NETLIFY_FUNCTION_NAME: neon-query-budget
      NODE_ENV: production
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Measure one cold and five warm requests against local Postgres
        run: pnpm ops:neon-connection-budget

  trusted-acceptance:
    name: Trusted acceptance substrate
    needs: change-scope
    if: needs.change-scope.outputs.trusted_acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm

      - name: Validate config, provenance, receipts, and workflow boundaries
        run: pnpm test:trusted-acceptance

      - name: Build the pilot as secretless Netlify artifacts
        env:
          AGENT_NATIVE_BUILD_SHA: ${{ github.sha }}
          NITRO_PRESET: netlify
        run: |
          pnpm --filter calendar build
          pnpm --filter content build
          test -d templates/calendar/dist
          test -f templates/calendar/.netlify/functions-internal/server/main.mjs
          test -d templates/content/dist
          test -f templates/content/.netlify/functions-internal/server/main.mjs

  scaffold-e2e:
    name: Scaffold E2E — create + pnpm install
    needs: change-scope
    if: needs.change-scope.outputs.scaffold == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/free-disk

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Headless scaffold — pnpm install + typecheck + action
        run: pnpm --filter @agent-native/core exec vitest run src/cli/create-e2e.spec.ts

      - name: Headless onboarding — local core install + typecheck + action
        env:
          AGENT_NATIVE_CREATE_USE_LOCAL_CORE: "1"
        run: >-
          pnpm --filter @agent-native/core exec vitest run
          src/cli/create-e2e.spec.ts
          -t "pnpm install, pnpm typecheck, and pnpm action hello all succeed"

      - name: Builder Code starter — materialize + pnpm install + typecheck
        if: needs.change-scope.outputs.builder_code_starter_scaffold == 'true'
        env:
          AGENT_NATIVE_CREATE_USE_LOCAL_CORE: "1"
        run: |
          out="$(mktemp -d)/app"
          node "$GITHUB_WORKSPACE/packages/core/dist/cli/index.js" template materialize --template builder-code-starter --name app --out "$out"
          cd "$out"
          pnpm install
          pnpm typecheck

      - name: Scaffold workspace (chat + calendar + dispatch) and verify pnpm install + build
        env:
          AGENT_NATIVE_CREATE_USE_LOCAL_CORE: "1"
        run: |
          cd "$(mktemp -d)"
          node "$GITHUB_WORKSPACE/packages/core/dist/cli/index.js" create test-workspace --template chat,calendar,dispatch
          cd test-workspace
          # Required package must be scaffolded
          if [ ! -d "packages/scheduling" ]; then
            echo "::error::packages/scheduling not scaffolded for calendar template"
            exit 1
          fi
          # Root must have postinstall for required packages
          if ! grep -q 'postinstall' package.json; then
            echo "::error::postinstall script missing for required packages"
            exit 1
          fi
          # Every workspace:* dep in scaffolded apps must resolve to a
          # package actually present in the workspace. Catches the class of
          # bug Sami hit: a template depended on @agent-native/dispatch
          # (a published package, not a workspace member) and `pnpm install`
          # blew up with ERR_PNPM_WORKSPACE_PKG_NOT_FOUND.
          node -e '
            const fs = require("fs");
            const path = require("path");
            const wsMembers = new Set();
            for (const dir of ["apps", "packages"]) {
              if (!fs.existsSync(dir)) continue;
              for (const sub of fs.readdirSync(dir)) {
                const pj = path.join(dir, sub, "package.json");
                if (fs.existsSync(pj)) {
                  const n = JSON.parse(fs.readFileSync(pj, "utf8")).name;
                  if (n) wsMembers.add(n);
                }
              }
            }
            const offenders = [];
            for (const dir of ["apps", "packages"]) {
              if (!fs.existsSync(dir)) continue;
              for (const sub of fs.readdirSync(dir)) {
                const pj = path.join(dir, sub, "package.json");
                if (!fs.existsSync(pj)) continue;
                const pkg = JSON.parse(fs.readFileSync(pj, "utf8"));
                for (const dt of ["dependencies","devDependencies","peerDependencies"]) {
                  for (const [name, ver] of Object.entries(pkg[dt] || {})) {
                    if (typeof ver === "string" && ver.startsWith("workspace:")) {
                      if (!wsMembers.has(name)) {
                        offenders.push(pj + ": " + dt + "." + name + "=" + ver);
                      }
                    }
                  }
                }
              }
            }
            if (offenders.length) {
              console.error("::error::dangling workspace:* refs in scaffold (no matching workspace member):");
              for (const o of offenders) console.error("  " + o);
              process.exit(1);
            }
          '
          pnpm install
          # Build generated apps to catch missing peer/runtime deps that
          # `pnpm install` alone won't surface.
          pnpm --filter ./apps/calendar build
          pnpm --filter ./apps/dispatch build

  ssr-boot-smoke:
    name: SSR cold-start smoke
    needs: change-scope
    if: needs.change-scope.outputs.ssr_boot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSR_BOOT_APPS: ${{ needs.change-scope.outputs.ssr_boot_apps }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Skip postinstall build chain here — core is built explicitly below so we
      # control the exact build order and avoid redundant parallel builds.
      - uses: ./.github/actions/setup-pnpm
        with:
          install: no-scripts

      - name: Build recap CLI, AgentKit, core, OTel, Toolkit, and creative context
        run: |
          pnpm --filter @agent-native/recap-cli build
          pnpm --filter @agent-native/agentkit build
          pnpm --filter @agent-native/core build
          pnpm --filter @agent-native/otel build
          pnpm --filter @agent-native/toolkit build
          pnpm --filter @agent-native/creative-context build

      - name: Build Content template (Cloudflare Workers preset)
        if: contains(fromJSON(env.SSR_BOOT_APPS), 'content')
        run: NITRO_PRESET=cloudflare_module pnpm --filter content build

      - name: Build and import the affected Netlify SSR handlers
        if: >-
          contains(fromJSON(env.SSR_BOOT_APPS), 'plan') ||
          contains(fromJSON(env.SSR_BOOT_APPS), 'clips') ||
          contains(fromJSON(env.SSR_BOOT_APPS), 'assets')
        run: |
          mapfile -t apps < <(jq -r '.[] | select(. != "content")' <<< "$SSR_BOOT_APPS")
          filters=()
          for app in "${apps[@]}"; do filters+=(--filter "$app"); done
          NITRO_PRESET=netlify pnpm "${filters[@]}" build
          NETLIFY=true timeout 180 node scripts/ssr-boot-smoke.mjs "${apps[@]}"

      - name: Build and import Plan SSR handlers (Vercel and AWS Lambda)
        if: contains(fromJSON(env.SSR_BOOT_APPS), 'plan')
        run: |
          NITRO_PRESET=vercel pnpm --filter plan build
          VERCEL=true timeout 120 node scripts/ssr-boot-smoke.mjs --preset vercel plan
          NITRO_PRESET=aws-lambda pnpm --filter plan build
          AWS_LAMBDA_FUNCTION_NAME=ssr-smoke timeout 120 node scripts/ssr-boot-smoke.mjs --preset aws-lambda plan

  guards:
    name: Security guards
    needs: change-scope
    if: needs.change-scope.outputs.guards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm
        with:
          install: no-scripts

      - name: Test production deploy concurrency guard
        run: pnpm test:netlify-prebuilt-workflow

      - name: Test serverless function size baseline guard
        run: pnpm test:function-size-baseline

      - name: Test AgentKit stream ownership guard
        run: pnpm test:agentkit-stream-ownership

      - name: Test untracked-imports guard
        run: pnpm test:no-untracked-imports

      - name: Test mobile build path guard
        run: pnpm test:mobile-build-paths

      - name: Test source-reading tests guard
        run: pnpm test:no-source-reading-tests

      - name: Test Neon transfer alert and offline backtest
        run: pnpm test:neon-transfer-alert

      - name: Build packages for source-backed guards
        run: |
          pnpm --filter @agent-native/recap-cli build
          pnpm --filter @agent-native/agentkit build
          pnpm --filter @agent-native/core build
          pnpm --filter @agent-native/toolkit build
          pnpm --filter @agent-native/creative-context build
          pnpm --filter @agent-native/otel build

      - name: Test unbounded read guards
        run: >-
          pnpm exec tsx --test
          scripts/guard-no-unbounded-table-reads.test.ts
          scripts/guard-no-unscoped-queries.test.ts
          scripts/guard-no-heavy-dashboard-list-reads.test.ts

      - name: Run security guards
        run: pnpm guards

      - name: Check the Slides interaction oracle against one full test run
        if: ${{ !cancelled() && needs.change-scope.outputs.slides_oracle == 'true' }}
        working-directory: templates/slides
        env:
          VITEST_CONCURRENCY: 100%
        run: pnpm oracle:ratchet

      - name: Run root script tests for this change
        if: ${{ !cancelled() && needs.change-scope.outputs.script_tests != '[]' && needs.change-scope.outputs.script_tests != '' }}
        env:
          SCRIPT_TESTS: ${{ needs.change-scope.outputs.script_tests }}
        run: |
          set -euo pipefail
          node_tests=()
          vitest_tests=()
          while IFS= read -r file; do
            if grep -q -E "from ['\"]vitest['\"]" "$file"; then
              vitest_tests+=("$file")
            else
              node_tests+=("$file")
            fi
          done < <(node -e 'for (const file of JSON.parse(process.env.SCRIPT_TESTS)) console.log(file)')
          status=0
          if ((${#node_tests[@]} > 0)); then
            pnpm exec tsx --test "${node_tests[@]}" || status=1
          fi
          if ((${#vitest_tests[@]} > 0)); then
            pnpm exec vitest run "${vitest_tests[@]}" || status=1
          fi
          exit "$status"

      # Source-only template checks: no DB, browser, network, or secrets.
      - name: Template route matrix (fails on drift)
        if: ${{ !cancelled() && needs.change-scope.outputs.qa_static == 'true' }}
        run: pnpm qa:template-routes

      - name: Template action audit (advisory)
        if: ${{ !cancelled() && needs.change-scope.outputs.qa_static == 'true' }}
        run: pnpm actions:audit

  standalone-chat:
    name: Generate + run standalone Chat
    needs: change-scope
    # Required check: run when selected, and also when change-scope did not
    # succeed so the check fails closed instead of reporting "skipped".
    if: ${{ !cancelled() && (needs.change-scope.result != 'success' || needs.change-scope.outputs.agentkit_acceptance == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AGENT_NATIVE_CREATE_USE_LOCAL_CORE: "1"
    steps:
      - name: Require a successful change scope
        env:
          CHANGE_SCOPE_RESULT: ${{ needs.change-scope.result }}
        run: |
          if [ "$CHANGE_SCOPE_RESULT" != "success" ]; then
            echo "::error::change-scope did not succeed ($CHANGE_SCOPE_RESULT)"
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/standalone-chat-acceptance
