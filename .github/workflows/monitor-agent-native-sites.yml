name: Monitor Agent-Native site availability

# This is deliberately independent from app health and Netlify build status:
# an edge outage can make both the app health endpoint and the dashboard
# unavailable while the deploy metadata still says "ready".
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: monitor-agent-native-sites
  # Let an active outage run finish its paging and issue-reporting steps;
  # GitHub still keeps at most one pending replacement for this concurrency group.
  cancel-in-progress: false

jobs:
  monitor:
    name: Probe production and beta hosts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/netlify-site-hosts.json
            scripts/check-google-redirect-uris.ts
            scripts/google-oauth-site-capabilities.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check signup canary dead-man
        run: |
          set -o pipefail
          node <<'NODE' | tee /tmp/agent-native-signup-deadman.log
          (async () => {
            const repository = process.env.GITHUB_REPOSITORY;
            const token = process.env.GH_TOKEN;
            const headers = {
              accept: "application/vnd.github+json",
              authorization: `Bearer ${token}`,
              "x-github-api-version": "2022-11-28",
            };
            const runsUrl = `https://api.github.com/repos/${repository}/actions/workflows/signup-e2e-scheduled.yml/runs?event=schedule&per_page=20`;
            const workflowUrl = `https://api.github.com/repos/${repository}/actions/workflows/signup-e2e-scheduled.yml`;
            const [response, workflowResponse] = await Promise.all([
              fetch(runsUrl, { headers }),
              fetch(workflowUrl, { headers }),
            ]);
            if (!response.ok) {
              console.error(`FAIL\tsignup-e2e\tGitHub Actions API HTTP ${response.status}`);
              process.exitCode = 1;
            } else if (!workflowResponse.ok) {
              console.error(
                `FAIL\tsignup-e2e\tGitHub Actions workflow API HTTP ${workflowResponse.status}`,
              );
              process.exitCode = 1;
            } else {
              const body = await response.json();
              const workflow = await workflowResponse.json();
              if (workflow.state !== "active") {
                console.error(
                  `FAIL\tsignup-e2e\tscheduled workflow state is ${workflow.state ?? "unknown"}`,
                );
                process.exitCode = 1;
                return;
              }
              const workflowUpdatedAt = Date.parse(
                workflow.updated_at ?? workflow.created_at,
              );
              const workflowAgeMs = Date.now() - workflowUpdatedAt;
              const maxAgeMs = 48 * 60 * 60 * 1_000;
              if (!Number.isFinite(workflowAgeMs)) {
                console.error(
                  "FAIL\tsignup-e2e\tscheduled workflow has no valid activation timestamp",
                );
                process.exitCode = 1;
                return;
              }
              const completed = (body.workflow_runs ?? []).filter(
                (run) => run.status === "completed",
              );
              const successful = completed.find(
                (run) => run.conclusion === "success",
              );
              if (completed.length === 0 && workflowAgeMs > maxAgeMs) {
                console.error(
                  `FAIL\tsignup-e2e\tno completed scheduled run exists and workflow has been active for ${Math.round(workflowAgeMs / 3_600_000)}h`,
                );
                process.exitCode = 1;
              } else if (completed.length === 0) {
                console.log(
                  `INFO\tsignup-e2e\tno completed scheduled run yet; ${Math.max(0, Math.round((maxAgeMs - workflowAgeMs) / 3_600_000))}h rollout grace remains`,
                );
              } else if (!successful) {
                console.error(
                  "FAIL\tsignup-e2e\tno successful scheduled run exists",
                );
                process.exitCode = 1;
              } else {
                const ageMs = Date.now() - Date.parse(successful.created_at);
                if (!Number.isFinite(ageMs) || ageMs > maxAgeMs) {
                  console.error(
                    `FAIL\tsignup-e2e\tlast successful scheduled run is ${Math.round(ageMs / 3_600_000)}h old`,
                  );
                  process.exitCode = 1;
                } else {
                  console.log(
                    `PASS\tsignup-e2e\tlast successful scheduled run is ${Math.round(ageMs / 3_600_000)}h old`,
                  );
                }
              }
            }
          })().catch((error) => {
            console.error(`FAIL\tsignup-e2e\t${error?.message ?? error}`);
            process.exitCode = 1;
          });
          NODE

      - name: Probe every public host
        if: ${{ always() }}
        id: probe
        run: |
          set -o pipefail
          node <<'NODE' | tee /tmp/agent-native-site-availability.log
          const fs = require("node:fs");
          const dns = require("node:dns");

          // Netlify publishes an IPv6 edge address, but some runners and
          // corporate networks black-hole IPv6 instead of falling back. Keep
          // this alert path on IPv4 so a client-network quirk does not page us
          // for healthy sites.
          dns.setDefaultResultOrder("ipv4first");

          const manifest = JSON.parse(
            fs.readFileSync("scripts/netlify-site-hosts.json", "utf8"),
          );
          const hosts = [
            ...manifest.production.map((host) => ({ environment: "production", host })),
            ...manifest.beta.map((host) => ({ environment: "beta", host })),
            ...manifest.workspace.map((host) => ({ environment: "workspace", host })),
          ];
          const timeoutMs = 15_000;
          const probeAttemptTimeoutMs = 30_000;
          const maxDocumentBytes = 2_000_000;
          const maxAssetCount = 500;
          const maxRedirects = 5;
          const maxAttempts = 3;
          // Three 30-second attempts plus retry delays take at most 93 seconds
          // per host; twelve workers finish the 36-host manifest in three waves.
          const hostConcurrency = 12;
          // Static assets only need status headers. HEAD avoids transferring
          // each bundle, while the shared limiter prevents twelve host probes
          // from multiplying their batches into a runner-wide request burst.
          const assetConcurrency = 8;

          async function mapWithConcurrency(items, concurrency, mapper) {
            const results = new Array(items.length);
            let nextIndex = 0;
            const workerCount = Math.min(concurrency, items.length);
            await Promise.all(
              Array.from({ length: workerCount }, async () => {
                while (nextIndex < items.length) {
                  const index = nextIndex;
                  nextIndex += 1;
                  results[index] = await mapper(items[index]);
                }
              }),
            );
            return results;
          }

          function createLimiter(concurrency) {
            let active = 0;
            const waiters = [];
            return async function run(task) {
              if (active >= concurrency) {
                await new Promise((resolve) => waiters.push(resolve));
              }
              active += 1;
              try {
                return await task();
              } finally {
                active -= 1;
                waiters.shift()?.();
              }
            };
          }

          const runAssetRequest = createLimiter(assetConcurrency);

          async function fetchOnVerifiedOrigin(url, origin, options) {
            let currentUrl = url;
            for (let redirect = 0; redirect <= maxRedirects; redirect += 1) {
              const response = await fetch(currentUrl, {
                ...options,
                redirect: "manual",
              });
              if (response.status < 300 || response.status >= 400) {
                return { response, url: currentUrl };
              }
              const location = response.headers.get("location");
              await response.body?.cancel();
              if (!location) {
                throw new Error(`redirect from ${currentUrl} did not include a location`);
              }
              const nextUrl = new URL(location, currentUrl);
              if (nextUrl.protocol !== "https:" || nextUrl.origin !== origin) {
                throw new Error(`redirected off origin to ${nextUrl.href}`);
              }
              currentUrl = nextUrl.href;
            }
            throw new Error(`exceeded ${maxRedirects} redirects from ${url}`);
          }

          async function readResponseText(response, maxBytes) {
            const reader = response.body?.getReader();
            if (!reader) return "";
            const decoder = new TextDecoder();
            let bytes = 0;
            let text = "";
            try {
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                bytes += value.byteLength;
                if (bytes > maxBytes) {
                  throw new Error(`document exceeded ${maxBytes} bytes`);
                }
                text += decoder.decode(value, { stream: true });
              }
              return text + decoder.decode();
            } catch (error) {
              await reader.cancel().catch(() => undefined);
              throw error;
            }
          }

          async function probe({ environment, host }) {
            let lastFailure = "unknown error";
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const startedAt = Date.now();
              const deadline = startedAt + probeAttemptTimeoutMs;
              try {
                const documentUrl = `https://${host}/`;
                const documentOrigin = new URL(documentUrl).origin;
                const { response, url: finalDocumentUrl } = await fetchOnVerifiedOrigin(
                  documentUrl,
                  documentOrigin,
                  {
                    headers: { "user-agent": "agent-native-site-monitor" },
                    signal: AbortSignal.timeout(
                      Math.min(timeoutMs, Math.max(1, deadline - Date.now())),
                    ),
                  },
                );
                const ms = Date.now() - startedAt;
                const ok = response.status >= 200 && response.status < 400;
                if (ok) {
                  const html = await readResponseText(response, maxDocumentBytes);
                  const baseUrl = finalDocumentUrl;
                  const assets = new Set();
                  let assetLimitExceeded = false;
                  for (const match of html.matchAll(/<(link|script)\b[^>]*>/gi)) {
                    const tag = match[0];
                    const rel = tag.match(/\brel=["']([^"']+)["']/i)?.[1] || "";
                    const attribute = match[1].toLowerCase() === "script"
                      ? "src"
                      : /(?:^|\s)modulepreload(?:\s|$)/i.test(rel) ||
                          /(?:^|\s)stylesheet(?:\s|$)/i.test(rel)
                        ? "href"
                        : null;
                    if (!attribute) continue;
                    const value = tag.match(new RegExp(`\\b${attribute}=["']([^"']+)["']`, "i"))?.[1];
                    if (!value || value.startsWith("#") || value.startsWith("data:")) continue;
                    try {
                      const url = new URL(value, baseUrl);
                      if (url.origin === documentOrigin) {
                        if (!assets.has(url.href) && assets.size >= maxAssetCount) {
                          assetLimitExceeded = true;
                          break;
                        }
                        assets.add(url.href);
                      }
                    } catch {
                      // Ignore malformed or non-URL markup; the document probe
                      // still reports the host itself as healthy.
                    }
                  }
                  if (assetLimitExceeded) {
                    throw new Error(`document referenced more than ${maxAssetCount} assets`);
                  }

                  // An HTTP error proves the published asset is unavailable;
                  // a transport error may only describe this runner's path to it.
                  const assetFailures = [];
                  const assetWarnings = [];
                  const assetUrls = [...assets];
                  for (let i = 0; i < assetUrls.length; i += assetConcurrency) {
                    if (Date.now() >= deadline) {
                      assetWarnings.push("asset probe deadline exceeded");
                      break;
                    }
                    await Promise.all(assetUrls.slice(i, i + assetConcurrency).map((assetUrl) =>
                      runAssetRequest(async () => {
                        try {
                          if (Date.now() >= deadline) {
                            assetWarnings.push("asset probe deadline exceeded");
                            return;
                          }
                          const assetRequest = (method) => ({
                            headers: { "user-agent": "agent-native-site-monitor" },
                            method,
                            signal: AbortSignal.timeout(
                              Math.min(timeoutMs, Math.max(1, deadline - Date.now())),
                            ),
                          });
                          let { response: assetResponse } = await fetchOnVerifiedOrigin(
                            assetUrl,
                            documentOrigin,
                            assetRequest("HEAD"),
                          );
                          if (assetResponse.status === 405 || assetResponse.status === 501) {
                            await assetResponse.body?.cancel();
                            ({ response: assetResponse } = await fetchOnVerifiedOrigin(
                              assetUrl,
                              documentOrigin,
                              assetRequest("GET"),
                            ));
                          }
                          await assetResponse.body?.cancel();
                          if (assetResponse.status < 200 || assetResponse.status >= 300) {
                            assetFailures.push(`${new URL(assetUrl).pathname} HTTP ${assetResponse.status}`);
                          }
                        } catch (error) {
                          assetWarnings.push(
                            `${new URL(assetUrl).pathname} ${String(error?.message ?? error)}`,
                          );
                        }
                      }),
                    ));
                  }

                  if (assetFailures.length > 0) {
                    assetFailures.sort();
                    lastFailure = `HTTP ${response.status}; ${assetFailures.slice(0, 5).join(", ")}`;
                  } else {
                    const warningDetail = assetWarnings.length > 0
                      ? `; ${assetWarnings.slice(0, 5).join(", ")}`
                      : "";
                    return {
                      environment,
                      host,
                      ok: true,
                      detail: `HTTP ${response.status} with ${assets.size} referenced assets in ${ms}ms (attempt ${attempt})${warningDetail}`,
                    };
                  }
                } else {
                  await response.body?.cancel();
                }
                if (!ok) lastFailure = `HTTP ${response.status}`;
              } catch (error) {
                lastFailure =
                  error?.name === "TimeoutError"
                    ? `timeout after ${timeoutMs}ms`
                    : String(error?.message ?? error);
              }
              if (attempt < maxAttempts) {
                await new Promise((resolve) => setTimeout(resolve, attempt * 1_000));
              }
            }
            return {
              environment,
              host,
              ok: false,
              detail: `${lastFailure} after ${maxAttempts} attempts`,
            };
          }

          (async () => {
            const results = await mapWithConcurrency(hosts, hostConcurrency, probe);
            results.sort((left, right) => left.host.localeCompare(right.host));
            for (const result of results) {
              console.log(
                `${result.ok ? "PASS" : "FAIL"}\t${result.environment}\t${result.host}\t${result.detail}`,
              );
            }
            const failures = results.filter((result) => !result.ok);
            console.log(`Checked ${results.length} hosts; ${failures.length} failed.`);
            if (failures.length > 0) process.exitCode = 1;
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Probe Google sign-in credentials
        # The availability probe above stays green while sign-in is 100% broken:
        # on 2026-08-20 every host reported ok:true for hours with a stale Google
        # secret. The app's callback collapses invalid_client and invalid_grant
        # into one identical error page, so this asks each deploy to ask Google
        # directly and report which of the two it got.
        if: always()
        run: |
          set -o pipefail
          node <<'NODE' | tee /tmp/agent-native-google-credentials.log
          (async () => {
            const fs = require("node:fs");
            const dns = require("node:dns");
            dns.setDefaultResultOrder("ipv4first");

            const manifest = JSON.parse(
              fs.readFileSync("scripts/netlify-site-hosts.json", "utf8"),
            );
            const hosts = [
              ...manifest.production.map((host) => ({ environment: "production", host })),
              ...manifest.beta.map((host) => ({ environment: "beta", host })),
              ...manifest.workspace.map((host) => ({ environment: "workspace", host })),
            ];
            const googleCapabilities = JSON.parse(
              fs.readFileSync("scripts/google-oauth-site-capabilities.json", "utf8"),
            );
            if (
              !Array.isArray(googleCapabilities.notApplicable) ||
              googleCapabilities.notApplicable.some((host) => typeof host !== "string")
            ) {
              throw new Error("google-oauth-site-capabilities.json has an invalid shape");
            }
            // The public docs host intentionally has no Google sign-in
            // credential. Keep it in the availability manifest, but do not
            // turn that expected state into an auth outage. Derive all lane
            // exemptions from the same applicability manifest as the callback probe.
            const googleCredentialExemptions = new Set(
              googleCapabilities.notApplicable.flatMap((host) =>
                ["production", "beta", "workspace"].map(
                  (environment) => `${environment}/${host.toLowerCase()}`,
                ),
              ),
            );
            const credentialHosts = hosts.filter(({ environment, host }) => {
              const key = `${environment}/${host}`;
              if (googleCredentialExemptions.has(key)) {
                console.log(`INFO\\t${environment}\\t${host}\\tcredentials intentionally unconfigured`);
                return false;
              }
              return true;
            });

            // The whole step must finish inside the job timeout even when the
            // fleet is degraded, so probes run concurrently under one deadline
            // rather than serially per host.
            const CONCURRENCY = 6;
            const ATTEMPT_TIMEOUT_MS = 15_000;
            const TOTAL_BUDGET_MS = 150_000;
            const deadline = Date.now() + TOTAL_BUDGET_MS;

            async function probe(host) {
              let last = "no attempt";
              for (let attempt = 1; attempt <= 2; attempt += 1) {
                const remainingMs = deadline - Date.now();
                if (remainingMs <= 0) {
                  return { inconclusive: "probe budget exhausted" };
                }
                try {
                  const response = await fetch(
                    `https://${host}/_agent-native/health/google`,
                    {
                      signal: AbortSignal.timeout(
                        Math.min(ATTEMPT_TIMEOUT_MS, remainingMs),
                      ),
                    },
                  );
                  if (response.status === 404) return { absent: "route not deployed" };
                  const body = await response.json();
                  if (typeof body?.status !== "string") {
                    return { inconclusive: `unrecognised body (http ${response.status})` };
                  }
                  return { body };
                } catch (error) {
                  last = error instanceof Error ? error.message : String(error);
                }
              }
              return { inconclusive: `unreachable: ${last}` };
            }

            const broken = [];
            const inconclusive = [];
            const absent = [];
            const mismatched = [];
            let checked = 0;

            const queue = [...credentialHosts];
            async function worker() {
              for (;;) {
                const next = queue.shift();
                if (!next) return;
                const { environment, host } = next;
                const result = await probe(host);
                if (result.absent) {
                  absent.push(`${environment} ${host}`);
                  console.log(`ABSENT\t${environment}\t${host}\t${result.absent}`);
                  continue;
                }
                if (result.inconclusive) {
                  inconclusive.push(`${environment} ${host} (${result.inconclusive})`);
                  console.log(`INCONCLUSIVE\t${environment}\t${host}\t${result.inconclusive}`);
                  continue;
                }
                const {
                  status,
                  reason,
                  mismatchedPairs,
                  clientId,
                  credentialSource,
                } = result.body;
                if (
                  status !== "valid" &&
                  status !== "invalid" &&
                  status !== "unconfigured" &&
                  status !== "unknown"
                ) {
                  const detail = `unrecognised status ${String(status)}`;
                  inconclusive.push(`${environment} ${host} (${detail})`);
                  console.log(
                    `INCONCLUSIVE\t${environment}\t${host}\t${detail}`,
                  );
                  continue;
                }
                if (status === "unconfigured") {
                  const detail = reason ?? "credentials unconfigured";
                  inconclusive.push(`${environment} ${host} (${detail})`);
                  console.log(
                    `INCONCLUSIVE\t${environment}\t${host}\t${status}\t${detail}`,
                  );
                  continue;
                }
                if (status === "invalid") broken.push(`${environment} ${host} (${reason})`);
                // `unknown` means Google did not answer. It is not a pass.
                if (status === "unknown") {
                  inconclusive.push(`${environment} ${host} (${reason ?? "unknown"})`);
                }
                if (mismatchedPairs) mismatched.push(`${environment} ${host}`);
                if (status === "valid") checked += 1;
                const label =
                  status === "invalid" ? "FAIL" : status === "valid" ? "PASS" : "INFO";
                console.log(
                  `${label}\t${environment}\t${host}\t${status}\t${reason ?? "-"}\t${clientId ?? "-"}\t${credentialSource ?? "-"}`,
                );
              }
            }
            await Promise.all(
              Array.from(
                { length: Math.min(CONCURRENCY, credentialHosts.length) },
                worker,
              ),
            );

            if (mismatched.length > 0) {
              // Latent, not an outage: two credential pairs naming different
              // clients means a repair can land on the pair nobody reads.
              // Report it loudly; do not page for pre-existing config debt.
              console.log(
                `\nWARN: ${mismatched.length} host(s) carry two Google credential pairs for different clients:\n  ${mismatched.join("\n  ")}`,
              );
            }
            if (absent.length > 0) {
              console.log(
                `\nNOTE: ${absent.length} host(s) have not deployed the check yet:\n  ${absent.join("\n  ")}`,
              );
            }
            if (broken.length > 0) {
              console.error(
                `\nGoogle rejected the sign-in credentials on ${broken.length} host(s):\n  ${broken.join("\n  ")}`,
              );
              process.exitCode = 1;
              return;
            }
            if (inconclusive.length > 0) {
              // Never let "we could not tell" print as acceptance — that is the
              // blind spot this check exists to remove.
              console.error(
                `\nINCONCLUSIVE on ${inconclusive.length} host(s); the credential was not verified:\n  ${inconclusive.join("\n  ")}`,
              );
              process.exitCode = 1;
              return;
            }
            if (checked === 0) {
              // Rollout exception: before the route ships fleet-wide every
              // host 404s. Say plainly that nothing was verified rather than
              // paging, and never let this path print acceptance.
              console.log(
                "\nNOT VERIFIED: no host answered the credential check yet (route not deployed).",
              );
              return;
            }
            console.log(
              `\nGoogle accepted the sign-in credentials on all ${checked} host(s) that answered.`,
            );
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE

      - name: Probe Google callback registration
        # The credential probe above cannot see redirect_uri_mismatch because
        # its deliberately invalid code is rejected before redirect handling.
        # Check the fleet-wide root callback plus app-owned callbacks on the
        # hosts that advertise them. During rollout, old deployments are logged
        # as not verified instead of becoming a false incident; managed hosts
        # still fail closed. The explicit five-minute budget leaves the
        # expanded job time for incident paging.
        if: always()
        run: |
          set -o pipefail
          node --experimental-strip-types scripts/check-google-redirect-uris.ts \
            --env all --budget-seconds 300 --allow-legacy-health | tee /tmp/agent-native-google-redirects.log

      - name: Page and open a rolling incident
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_TITLE="Agent-Native site availability failing"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILING="$(grep '^FAIL[[:space:]]' /tmp/agent-native-site-availability.log || true)"
          GOOGLE_FAILING="$(grep -E '^(FAIL|INCONCLUSIVE)' /tmp/agent-native-google-credentials.log || true)"
          REDIRECT_FAILING="$(grep -E '^(FAIL|UNKNOWN|UNPROBEABLE)' /tmp/agent-native-google-redirects.log || true)"
          SIGNUP_DEADMAN_FAILING="$(grep '^FAIL[[:space:]].*signup-e2e' /tmp/agent-native-signup-deadman.log || true)"
          if [ -n "$SIGNUP_DEADMAN_FAILING" ]; then
            FAILING="$SIGNUP_DEADMAN_FAILING${FAILING:+$'\n'}$FAILING"
          fi
          if [ -n "$GOOGLE_FAILING" ]; then
            if [ -n "$FAILING" ]; then
              FAILING="$(printf '%s\n%s' "$FAILING" "$GOOGLE_FAILING")"
            else
              FAILING="$GOOGLE_FAILING"
            fi
          fi
          if [ -n "$REDIRECT_FAILING" ]; then
            if [ -n "$FAILING" ]; then
              FAILING="$(printf '%s\n%s' "$FAILING" "$REDIRECT_FAILING")"
            else
              FAILING="$REDIRECT_FAILING"
            fi
          fi
          if [ -z "$FAILING" ]; then
            FAILING="(the monitor itself failed before producing per-host results)"
          fi
          # Strip timings and status codes so repeated copies of one outage
          # keep one signature and do not bury the actionable issue.
          SIGNATURE="$(printf '%s' "$FAILING" | tr -d '0-9' | shasum | cut -c1-12)"
          # shellcheck disable=SC2016
          BODY="$(printf '%s\n\n```\n%s\n```\n\n%s\n\n<!-- availability-signature: %s -->' \
            "The five-minute public-host availability monitor is failing." "$FAILING" "$RUN_URL" "$SIGNATURE")"

          page_oncall() {
            if [ -z "${PAGERDUTY_ROUTING_KEY:-}" ]; then
              echo "::warning::PAGERDUTY_ROUTING_KEY is not configured; GitHub issue fallback is active but no page was sent."
              return 0
            fi
            # The jq program intentionally uses jq variables, not shell vars.
            # shellcheck disable=SC2016
            jq -n \
              --arg routing_key "$PAGERDUTY_ROUTING_KEY" \
              --arg dedup_key "agent-native-site-availability" \
              --arg summary "Agent-Native public site availability is failing" \
              --arg source "${{ github.repository }}" \
              --arg run_url "$RUN_URL" \
              --arg failing "$FAILING" \
              --arg signature "$SIGNATURE" \
              '{routing_key: $routing_key, event_action: "trigger", dedup_key: $dedup_key, payload: {summary: $summary, source: $source, severity: "critical", custom_details: {run_url: $run_url, failing_hosts: $failing, availability_signature: $signature}}}' \
              | curl --fail-with-body --connect-timeout 10 --max-time 20 --silent --show-error \
                  --header 'Content-Type: application/json' \
                  --data-binary @- \
                  https://events.pagerduty.com/v2/enqueue
          }

          pagerduty_status=0
          page_oncall || pagerduty_status=$?
          ISSUE_NUMBER="$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n1)"
          if [ -z "$ISSUE_NUMBER" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" --body "$BODY"
          else
            LAST="$(gh issue view "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
              --json comments,body --jq '[.body] + [.comments[].body] | last')"
            if printf '%s' "$LAST" | grep -q "availability-signature: $SIGNATURE"; then
              echo "Same failure as the last report - issue #$ISSUE_NUMBER remains open without a duplicate comment."
            else
              gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}" --body "$BODY"
            fi
          fi
          if [ "$pagerduty_status" -ne 0 ]; then
            echo "::error::PagerDuty delivery failed; GitHub issue reporting completed but the audit remains failed." >&2
            exit "$pagerduty_status"
          fi

      - name: Resolve PagerDuty and close a recovered incident
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_TITLE="Agent-Native site availability failing"
          pagerduty_status=0
          if [ -n "${PAGERDUTY_ROUTING_KEY:-}" ]; then
            # shellcheck disable=SC2016
            jq -n \
              --arg routing_key "$PAGERDUTY_ROUTING_KEY" \
              --arg dedup_key "agent-native-site-availability" \
              --arg source "${{ github.repository }}" \
              '{routing_key: $routing_key, event_action: "resolve", dedup_key: $dedup_key, payload: {summary: "Agent-Native public site availability recovered", source: $source}}' \
              | curl --fail-with-body --connect-timeout 10 --max-time 20 --silent --show-error \
                  --header 'Content-Type: application/json' \
                  --data-binary @- \
                  https://events.pagerduty.com/v2/enqueue || pagerduty_status=$?
          else
            echo "PagerDuty resolve skipped: PAGERDUTY_ROUTING_KEY is not configured."
          fi
          ISSUE_NUMBER="$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n1)"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
              --comment "Public-host monitor is green again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          if [ "$pagerduty_status" -ne 0 ]; then
            echo "::error::PagerDuty resolve failed; GitHub issue bookkeeping completed only if available." >&2
            exit "$pagerduty_status"
          fi
