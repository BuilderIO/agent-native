name: Slides authoring container trial

# Temporary A/B: the same three Slides authoring shards on the bare runner
# (apt-get + Playwright install every job) and inside a prebuilt image
# (browsers, system libraries, and a compiler already baked in). Rerun the
# workflow for more samples; delete this file once the comparison is recorded.
on:
  pull_request:
    paths:
      - .github/workflows/slides-authoring-container-trial.yml
      - docker/ci-slides-authoring/**

concurrency:
  group: slides-authoring-container-trial-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-image:
    name: build trial image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - id: image
        run: echo "name=ghcr.io/builderio/agent-native-ci-slides-authoring:trial-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Build and push the trial image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "${{ steps.image.outputs.name }}" docker/ci-slides-authoring
          docker push "${{ steps.image.outputs.name }}"

  host:
    name: host (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [chromium-authoring, corpus-and-firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"
          native-canvas-deps: "false"

      - uses: ./.github/actions/slides-authoring-shard
        with:
          shard: ${{ matrix.shard }}

  container:
    name: container (${{ matrix.shard }})
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.build-image.outputs.image }}
      options: --ipc=host
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        shard: [chromium-authoring, corpus-and-firefox, webkit]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"
          native-canvas-deps: "false"

      - uses: ./.github/actions/slides-authoring-shard
        with:
          shard: ${{ matrix.shard }}
          install-browsers: "false"
