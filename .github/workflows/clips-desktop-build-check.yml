name: Clips Desktop Build Check

on:
  pull_request:
    branches: [main]
    paths:
      - "templates/clips/desktop/**"
      - "packages/shared-app-config/**"
      - ".github/actions/setup-pnpm/**"
      - ".github/actions/setup-clips-desktop/**"
      - ".github/workflows/clips-desktop-build-check.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: clips-desktop-build-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TAURI_APP_PATH: templates/clips/desktop

jobs:
  build-check:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      # Pull requests build only Linux. The macOS and Windows legs run on the
      # daily schedule and manual dispatch, because macOS minutes bill at 10x.
      # Same platforms and tauri-action arguments as build-tauri in
      # clips-desktop-release.yml.
      matrix: ${{ github.event_name == 'pull_request' && fromJSON('{"include":[{"os":"ubuntu-22.04","rust-targets":"","args":"--bundles appimage,deb,rpm"}]}') || fromJSON('{"include":[{"os":"macos-latest","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin","args":"--target universal-apple-darwin"},{"os":"windows-latest","rust-targets":"","args":""},{"os":"ubuntu-22.04","rust-targets":"","args":"--bundles appimage,deb,rpm"}]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-clips-desktop
        with:
          rust-targets: ${{ matrix.rust-targets }}

      - name: Test popover behavior while Control Center is frontmost
        if: runner.os == 'macOS'
        working-directory: ${{ env.TAURI_APP_PATH }}
        run: |
          output=$(cargo test --locked --manifest-path src-tauri/Cargo.toml --lib tests::keeps_popover_open_only_for_visible_camera_bubble_when_control_center_is_frontmost -- --exact)
          printf '%s\n' "$output"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' <<< "$output"

      - name: Typecheck
        working-directory: ${{ env.TAURI_APP_PATH }}
        run: pnpm run typecheck

      - name: Test
        working-directory: ${{ env.TAURI_APP_PATH }}
        run: pnpm run test

      - name: Build frontend
        working-directory: ${{ env.TAURI_APP_PATH }}
        run: pnpm run build

      # The release's build step without its secrets: with no releaseId or
      # tagName, tauri-action builds and uploads nothing. Tauri refuses to
      # write updater artifacts without the signing key, so turn them off.
      - name: Build Tauri app (no signing, no publish)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: ${{ env.TAURI_APP_PATH }}
          args: ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
