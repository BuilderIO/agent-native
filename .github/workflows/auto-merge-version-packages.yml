name: Auto-merge Version Packages PR
run-name: >-
  ${{ inputs.coordinator_run_id && format('{0} [release:{1}]', github.workflow, inputs.coordinator_run_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Bot-generated release PR number
        required: true
        type: number
      base_sha:
        description: Current base commit SHA for the release PR
        required: true
        type: string
      head_sha:
        description: Current head commit SHA for the release PR
        required: true
        type: string
      coordinator_run_id:
        description: Internal Release everything dispatch correlation ID
        required: false
        type: string
      pr_updated_at:
        description: Exact bot release PR update time for coordinator verification
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: auto-merge-version-packages-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Force-merge changeset-release/main
    if: |
      github.ref == 'refs/heads/main' &&
      inputs.pull_request_number != '' &&
      inputs.base_sha != '' &&
      inputs.head_sha != ''
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.BUILDER_BOT_FOR_LINT_APP_ID }}
          private-key: ${{ secrets.BUILDER_BOT_FOR_LINT_PRIVATE_KEY }}

      - name: Verify release dispatch origin
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DISPATCH_ACTOR: ${{ github.triggering_actor }}
          PR_UPDATED_AT: ${{ inputs.pr_updated_at }}
        run: |
          set -euo pipefail
          coordinator=$(jq -r '.inputs.coordinator_run_id // ""' "$GITHUB_EVENT_PATH")
          if [ "$GITHUB_ACTOR" = 'github-actions[bot]' ] || [ -n "$coordinator" ] || [ -n "$PR_UPDATED_AT" ]; then
            if [ "$GITHUB_ACTOR" != 'github-actions[bot]' ] || [ "$DISPATCH_ACTOR" != 'github-actions[bot]' ] ||
                ! [[ "$PR_UPDATED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] ||
                ! [[ "$coordinator" =~ ^([1-9][0-9]*)-[1-9][0-9]*-prepare-[1-9][0-9]*$ ]]; then
              echo "::error::Automated release merge dispatch requires an Actions dispatcher and exact coordination metadata." >&2
              exit 1
            fi
            echo "DISPATCHED_COORDINATOR_RUN_ID=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            echo "PR_UPDATED_AT=$PR_UPDATED_AT" >> "$GITHUB_ENV"
            exit 0
          fi
          dispatch_permission=$(gh api "repos/$REPO/collaborators/$DISPATCH_ACTOR/permission" --jq '.permission')
          if [ "$dispatch_permission" != "admin" ]; then
            echo "::error::Manual release merge dispatch requires repository administrator access." >&2
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"

      - name: Verify release PR identity and event-bound SHAs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER" | jq -e \
            --arg repo "$REPO" \
            --arg head "$HEAD_SHA" \
            '.state == "open" and .draft == false and
              .user.login == "builder-io-integration[bot]" and
              .head.ref == "changeset-release/main" and
              .head.repo.full_name == $repo and
              .head.sha == $head and
              .base.ref == "main" and .base.repo.full_name == $repo' >/dev/null; then
            echo "::error::Release PR is not the expected open bot PR at the verified head SHA; refusing admin-merge." >&2
            exit 1
          fi

      - name: Verify the release comparison base is on main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || [ "$(gh api "repos/$REPO/compare/$BASE_SHA...main?per_page=1" --jq '.merge_base_commit.sha')" != "$BASE_SHA" ]; then
            echo "::error::Release comparison base is not on main; refusing admin-merge." >&2
            exit 1
          fi

      - name: Wait for required release PR checks
        id: required-checks
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPO: ${{ github.repository }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          coordinator_run_id=$(node --experimental-strip-types scripts/release-required-checks.ts wait "$PR_NUMBER" "$REPO")
          echo "coordinator_run_id=$coordinator_run_id" >> "$GITHUB_OUTPUT"

      - name: Generate fresh merge token
        id: merge-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.BUILDER_BOT_FOR_LINT_APP_ID }}
          private-key: ${{ secrets.BUILDER_BOT_FOR_LINT_PRIVATE_KEY }}

      - name: Verify release-only diff
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          files_dir="$RUNNER_TEMP/release-pr-files"
          mkdir -p "$files_dir"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files" \
            | jq -c 'add | .[]' > "$files_dir/files.jsonl"
          # The files endpoint stops at 3,000 entries; a short list is not a
          # clean one.
          expected_files=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.changed_files')
          listed_files=$(wc -l < "$files_dir/files.jsonl" | tr -d ' ')
          if [ "$listed_files" != "$expected_files" ]; then
            echo "::error::Refusing admin-merge: listed $listed_files of $expected_files changed files" >&2
            exit 1
          fi
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            file=$(jq -r '.filename' <<< "$entry")
            # Release prep never renames files; a rename could carry an
            # unchecked path into an allowed one.
            if [ "$(jq -r '.previous_filename != null' <<< "$entry")" = "true" ]; then
              echo "::error::Refusing admin-merge for renamed release PR path: $file" >&2
              exit 1
            fi
            case "$file" in
              .changeset/*.md|package.json|pnpm-lock.yaml|*/package.json|*/CHANGELOG.md|*/changelog/*)
                ;;
              packages/dispatch/src/server/lib/community-apps.ts)
                # Release prep repins the curated community templates' Git blob
                # ids when it bumps their core range. Accept only one-for-one
                # pin replacements; any other edit to the catalog needs a human.
                # No early-exiting pipe here: under pipefail a SIGPIPE would
                # turn a found violation into a passing check.
                patch_file="$files_dir/catalog.patch"
                if [ "$(jq -r '.patch == null' <<< "$entry")" = "true" ]; then
                  echo "::error::Refusing admin-merge: $file has no reviewable patch" >&2
                  exit 1
                fi
                jq -r '.patch' <<< "$entry" > "$patch_file"
                pin='[[:space:]]*blobSha: "[0-9a-f]{40}",?$'
                non_pin=$(grep -E '^[+-]' "$patch_file" | grep -v -E "^[+-]$pin" || true)
                removed=$(grep -c -E "^-$pin" "$patch_file" || true)
                added=$(grep -c -E "^\+$pin" "$patch_file" || true)
                if [ -n "$non_pin" ] || [ "$added" -eq 0 ] || [ "$added" -ne "$removed" ]; then
                  echo "::error::Refusing admin-merge: $file changes more than community template blob pins" >&2
                  exit 1
                fi
                # Pin syntax is not enough: every pin must equal the Git blob
                # of its template file at this head, so a wrong or swapped pin
                # cannot merge.
                node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const repo = process.env.REPO;
          const head = process.env.HEAD_SHA;
          const catalog = "packages/dispatch/src/server/lib/community-apps.ts";
          const gh = (args) => execFileSync("gh", args, { encoding: "utf8" });
          const source = Buffer.from(
            gh(["api", `repos/${repo}/contents/${catalog}?ref=${head}`, "--jq", ".content"]).replace(/\s/g, ""),
            "base64",
          ).toString("utf8");
          let template = null;
          let path = null;
          const pins = [];
          for (const line of source.split("\n")) {
            let match;
            if ((match = line.match(/templatePath:\s*"([^"]+)"/))) template = match[1];
            else if ((match = line.match(/^\s*path:\s*"([^"]+)"/))) path = match[1];
            else if ((match = line.match(/blobSha:\s*"([0-9a-f]{40})"/))) {
              if (!template || !path) throw new Error(`blobSha ${match[1]} has no template path`);
              pins.push({ file: `${template}/${path}`, sha: match[1] });
              path = null;
            }
          }
          if (pins.length === 0) throw new Error("No community template pins found");
          for (const { file, sha } of pins) {
            const actual = gh(["api", `repos/${repo}/contents/${file}?ref=${head}`, "--jq", ".sha"]).trim();
            if (actual !== sha) {
              console.error(`::error::Pin for ${file} is ${sha}, but the release PR head has ${actual}`);
              process.exit(1);
            }
          }
          console.log(`Verified ${pins.length} community template pins at ${head}`);
          NODE
                ;;
              *)
                echo "::error::Refusing admin-merge for unexpected release PR path: $file" >&2
                exit 1
                ;;
            esac
          done < "$files_dir/files.jsonl"
          node --experimental-strip-types scripts/verify-release-package-files.ts

      - name: Verify community QR template pins
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPO: ${{ github.repository }}
        run: node --experimental-strip-types scripts/verify-community-qr-release-pin.ts

      - name: Refuse unattended major promotions
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPO: ${{ github.repository }}
        run: node --experimental-strip-types scripts/verify-release-package-version-changes.ts

      - name: Revalidate release PR before merge
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPO: ${{ github.repository }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_COORDINATOR_RUN_ID: ${{ steps.required-checks.outputs.coordinator_run_id }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER" | jq -e \
            --arg repo "$REPO" \
            --arg head "$HEAD_SHA" \
            '.state == "open" and .draft == false and
              .user.login == "builder-io-integration[bot]" and
              .head.ref == "changeset-release/main" and
              .head.repo.full_name == $repo and
              .head.sha == $head and
              .base.ref == "main" and .base.repo.full_name == $repo' >/dev/null; then
            echo "::error::Release PR changed during validation; refusing admin-merge." >&2
            exit 1
          fi
          node --experimental-strip-types scripts/release-required-checks.ts verify "$PR_NUMBER" "$REPO"

      - name: Force-merge with admin bypass
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          REPO: ${{ github.repository }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          EXPECTED_COORDINATOR_RUN_ID: ${{ steps.required-checks.outputs.coordinator_run_id }}
          GH_ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pull_request=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          if ! jq -e \
            --arg repo "$REPO" \
            --arg head "$HEAD_SHA" \
            '.state == "open" and .draft == false and
              .user.login == "builder-io-integration[bot]" and
              .head.ref == "changeset-release/main" and
              .head.repo.full_name == $repo and .head.sha == $head and
              .base.ref == "main" and .base.repo.full_name == $repo' <<< "$pull_request" >/dev/null; then
            echo "::error::Release PR changed immediately before merge; refusing admin-merge." >&2
            exit 1
          fi
          # `main` moves about three times an hour and validation takes about 26
          # minutes, so main has almost always moved by now. Folding it into the
          # release branch re-runs required checks on a new head, and that
          # restart never converges. The PR only touches release files
          # (verified above), so GitHub applies it to the current main;
          # --match-head-commit keeps the merged head the one that was
          # validated. A conflict fails here, and the next release run rebuilds
          # the PR from the new main.
          mergeable=null
          for _ in $(seq 1 12); do
            mergeable=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.mergeable')
            [ "$mergeable" != "null" ] && break
            sleep 5
          done
          if [ "$mergeable" != "true" ]; then
            echo "::error::Release PR does not merge cleanly onto main (mergeable=$mergeable); refusing admin-merge." >&2
            exit 1
          fi
          node --experimental-strip-types scripts/release-required-checks.ts verify "$PR_NUMBER" "$REPO"
          gh pr merge "$PR_NUMBER" --repo "$REPO" --admin --squash --match-head-commit "$HEAD_SHA"
