name: Auto-merge Version Packages PR

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Bot-generated release PR number
        required: true
        type: number
      base_sha:
        description: Current base commit SHA for the release PR
        required: true
        type: string
      head_sha:
        description: Current head commit SHA for the release PR
        required: true
        type: string

permissions: {}

concurrency:
  group: auto-merge-version-packages-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Force-merge changeset-release/main
    if: |
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'changeset-release/main' &&
        github.event.pull_request.user.login == 'builder-io-integration[bot]' &&
        github.event.sender.login == 'builder-io-integration[bot]' &&
        !github.event.pull_request.draft) ||
      (github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.pull_request_number != '' &&
        inputs.base_sha != '' &&
        inputs.head_sha != '')
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUILDER_BOT_FOR_LINT_APP_ID }}
          private-key: ${{ secrets.BUILDER_BOT_FOR_LINT_PRIVATE_KEY }}

      - name: Verify manual release dispatcher is an administrator
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DISPATCH_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          dispatch_permission=$(gh api "repos/$REPO/collaborators/$DISPATCH_ACTOR/permission" --jq '.permission')
          if [ "$dispatch_permission" != "admin" ]; then
            echo "::error::Manual release merge dispatch requires repository administrator access." >&2
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.base.sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.0"

      - name: Verify release PR identity and event-bound SHAs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER" | jq -e \
            --arg repo "$REPO" \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            '.state == "open" and .draft == false and
              .user.login == "builder-io-integration[bot]" and
              .head.ref == "changeset-release/main" and
              .head.repo.full_name == $repo and
              .head.sha == $head and
              .base.ref == "main" and .base.repo.full_name == $repo and
              .base.sha == $base' >/dev/null; then
            echo "::error::Release PR is not the expected open bot PR at the verified base and head SHAs; refusing admin-merge." >&2
            exit 1
          fi

      - name: Wait for required release PR checks
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr checks "$PR_NUMBER" --repo "$REPO" --required --watch --fail-fast --interval 15
          checks=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --required --json name,bucket)
          if ! jq -e 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' <<< "$checks" >/dev/null; then
            echo "::error::Required release PR checks are missing or not green; refusing admin-merge." >&2
            exit 1
          fi

      - name: Verify release-only diff
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          files_dir="$RUNNER_TEMP/release-pr-files"
          mkdir -p "$files_dir"
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/files" \
            | jq -c 'add | .[]' > "$files_dir/files.jsonl"
          # The files endpoint stops at 3,000 entries; a short list is not a
          # clean one.
          expected_files=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.changed_files')
          listed_files=$(wc -l < "$files_dir/files.jsonl" | tr -d ' ')
          if [ "$listed_files" != "$expected_files" ]; then
            echo "::error::Refusing admin-merge: listed $listed_files of $expected_files changed files" >&2
            exit 1
          fi
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            file=$(jq -r '.filename' <<< "$entry")
            # Release prep never renames files; a rename could carry an
            # unchecked path into an allowed one.
            if [ "$(jq -r '.previous_filename != null' <<< "$entry")" = "true" ]; then
              echo "::error::Refusing admin-merge for renamed release PR path: $file" >&2
              exit 1
            fi
            case "$file" in
              .changeset/*.md|package.json|pnpm-lock.yaml|*/package.json|*/CHANGELOG.md|*/changelog/*)
                ;;
              packages/dispatch/src/server/lib/community-apps.ts)
                # Release prep repins the curated community templates' Git blob
                # ids when it bumps their core range. Accept only one-for-one
                # pin replacements; any other edit to the catalog needs a human.
                # No early-exiting pipe here: under pipefail a SIGPIPE would
                # turn a found violation into a passing check.
                patch_file="$files_dir/catalog.patch"
                if [ "$(jq -r '.patch == null' <<< "$entry")" = "true" ]; then
                  echo "::error::Refusing admin-merge: $file has no reviewable patch" >&2
                  exit 1
                fi
                jq -r '.patch' <<< "$entry" > "$patch_file"
                pin='[[:space:]]*blobSha: "[0-9a-f]{40}",?$'
                non_pin=$(grep -E '^[+-]' "$patch_file" | grep -v -E "^[+-]$pin" || true)
                removed=$(grep -c -E "^-$pin" "$patch_file" || true)
                added=$(grep -c -E "^\+$pin" "$patch_file" || true)
                if [ -n "$non_pin" ] || [ "$added" -eq 0 ] || [ "$added" -ne "$removed" ]; then
                  echo "::error::Refusing admin-merge: $file changes more than community template blob pins" >&2
                  exit 1
                fi
                # Pin syntax is not enough: every pin must equal the Git blob
                # of its template file at this head, so a wrong or swapped pin
                # cannot merge.
                node <<'NODE'
          const { execFileSync } = require("node:child_process");
          const repo = process.env.REPO;
          const head = process.env.HEAD_SHA;
          const catalog = "packages/dispatch/src/server/lib/community-apps.ts";
          const gh = (args) => execFileSync("gh", args, { encoding: "utf8" });
          const source = Buffer.from(
            gh(["api", `repos/${repo}/contents/${catalog}?ref=${head}`, "--jq", ".content"]).replace(/\s/g, ""),
            "base64",
          ).toString("utf8");
          let template = null;
          let path = null;
          const pins = [];
          for (const line of source.split("\n")) {
            let match;
            if ((match = line.match(/templatePath:\s*"([^"]+)"/))) template = match[1];
            else if ((match = line.match(/^\s*path:\s*"([^"]+)"/))) path = match[1];
            else if ((match = line.match(/blobSha:\s*"([0-9a-f]{40})"/))) {
              if (!template || !path) throw new Error(`blobSha ${match[1]} has no template path`);
              pins.push({ file: `${template}/${path}`, sha: match[1] });
              path = null;
            }
          }
          if (pins.length === 0) throw new Error("No community template pins found");
          for (const { file, sha } of pins) {
            const actual = gh(["api", `repos/${repo}/contents/${file}?ref=${head}`, "--jq", ".sha"]).trim();
            if (actual !== sha) {
              console.error(`::error::Pin for ${file} is ${sha}, but the release PR head has ${actual}`);
              process.exit(1);
            }
          }
          console.log(`Verified ${pins.length} community template pins at ${head}`);
          NODE
                ;;
              *)
                echo "::error::Refusing admin-merge for unexpected release PR path: $file" >&2
                exit 1
                ;;
            esac
          done < "$files_dir/files.jsonl"
          node --experimental-strip-types scripts/verify-release-package-files.ts

      - name: Verify community QR package pin
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: node --experimental-strip-types scripts/verify-community-qr-release-pin.ts

      - name: Refuse unattended major promotions
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          const repo = process.env.REPO;
          const gh = (args) =>
            execFileSync("gh", args, { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 });

          /** Read one package.json at a ref, or null when it does not exist there. */
          function versionAt(file, ref) {
            let response;
            try {
              response = JSON.parse(
                gh(["api", `repos/${repo}/contents/${file}?ref=${ref}`]),
              );
            } catch (error) {
              const stderr =
                error && typeof error === "object" && "stderr" in error
                  ? String(error.stderr)
                  : "";
              if (/HTTP 404\b/.test(stderr)) return null;
              throw new Error(`Could not read ${file} at ${ref}: ${stderr || error}`);
            }
            if (!response || typeof response !== "object") {
              throw new Error(`GitHub returned invalid content for ${file} at ${ref}`);
            }
            const { encoding, content, size } = response;
            if (encoding !== "base64" || typeof content !== "string" || !content.trim()) {
              throw new Error(`GitHub returned unreadable content for ${file} at ${ref}`);
            }
            const encoded = content.replace(/\s/g, "");
            if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
              throw new Error(`GitHub returned invalid base64 for ${file} at ${ref}`);
            }
            const bytes = Buffer.from(encoded, "base64");
            if (!Number.isSafeInteger(size) || bytes.length === 0 || bytes.length !== size) {
              throw new Error(`GitHub returned incomplete content for ${file} at ${ref}`);
            }
            const text = bytes.toString("utf8");
            let parsed;
            try {
              parsed = JSON.parse(text);
            } catch {
              throw new Error(`${file} at ${ref} is not valid JSON`);
            }
            return typeof parsed.version === "string" ? parsed.version : null;
          }

          const versionParts = (version) => {
            const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
            if (!match) throw new Error(`unparseable version "${version}"`);
            return match.slice(1).map(Number);
          };

          const files = JSON.parse(gh([
            "api", "--paginate", "--slurp", `repos/${repo}/pulls/${process.env.PR_NUMBER}/files`,
            "--jq", 'add | map(select(.filename == "package.json" or (.filename | endswith("/package.json"))) | {filename, status})',
          ]));
          if (!Array.isArray(files) || files.some((file) =>
            !file || typeof file.filename !== "string" || typeof file.status !== "string"
          )) {
            throw new Error("GitHub returned an invalid release PR file list");
          }

          const promotions = [];
          for (const { filename: file, status } of files) {
            const before = versionAt(file, process.env.BASE_SHA);
            const after = versionAt(file, process.env.HEAD_SHA);
            if (status === "added") {
              if (before !== null || after === null) {
                throw new Error(`Could not verify added package manifest ${file}`);
              }
              continue;
            }
            if (status === "removed") {
              if (before === null || after !== null) {
                throw new Error(`Could not verify removed package manifest ${file}`);
              }
              continue;
            }
            if (status !== "modified" || before === null || after === null) {
              throw new Error(`Could not verify package manifest versions for ${file}`);
            }
            if (before === after) continue;
            const beforeParts = versionParts(before);
            const afterParts = versionParts(after);
            const majorPromotion = afterParts[0] > beforeParts[0];
            if (majorPromotion) {
              promotions.push(`${file}: ${before} -> ${after}`);
            }
          }

          if (promotions.length > 0) {
            console.error(
              "::error::This release PR contains a forbidden major promotion:\n" +
                promotions.map((line) => `  ${line}`).join("\n") +
                "\nMajor promotions remain human-only. Leaving the PR open for deliberate release handling.",
            );
            process.exit(1);
          }
          console.log(
            files.length > 0
              ? `No forbidden promotion in ${files.length} changed package.json file(s).`
              : "No package.json changes in this release PR.",
          );
          NODE

      - name: Revalidate release PR before merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER" | jq -e \
            --arg repo "$REPO" \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            '.state == "open" and .draft == false and
              .user.login == "builder-io-integration[bot]" and
              .head.ref == "changeset-release/main" and
              .head.repo.full_name == $repo and
              .head.sha == $head and
              .base.ref == "main" and .base.repo.full_name == $repo and
              .base.sha == $base' >/dev/null; then
            echo "::error::Release PR changed during validation; refusing admin-merge." >&2
            exit 1
          fi
          checks=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --required --json name,bucket)
          if ! jq -e 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' <<< "$checks" >/dev/null; then
            echo "::error::Required release PR checks are no longer green; refusing admin-merge." >&2
            exit 1
          fi

      - name: Force-merge with admin bypass
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pull_request=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          if ! jq -e \
            --arg repo "$REPO" \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            '.state == "open" and .draft == false and
              .user.login == "builder-io-integration[bot]" and
              .head.ref == "changeset-release/main" and
              .head.repo.full_name == $repo and .head.sha == $head and
              .base.ref == "main" and .base.repo.full_name == $repo and
              .base.sha == $base' <<< "$pull_request" >/dev/null; then
            echo "::error::Release PR changed immediately before merge; refusing admin-merge." >&2
            exit 1
          fi
          current_main=$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')
          if [ "$current_main" != "$BASE_SHA" ]; then
            echo "::error::Main advanced after validation; refusing to merge against an unvalidated base." >&2
            exit 1
          fi
          checks=$(gh pr checks "$PR_NUMBER" --repo "$REPO" --required --json name,bucket)
          if ! jq -e 'length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")' <<< "$checks" >/dev/null; then
            echo "::error::Required release PR checks are no longer green; refusing admin-merge." >&2
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$REPO" --admin --squash --match-head-commit "$HEAD_SHA"
