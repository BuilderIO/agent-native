name: Content product conformance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # An edit the check job skips gets a group of its own. Sharing the PR's
  # group would cancel a real run that is still in progress.
  group: >-
    ${{ (github.event.action == 'edited'
    && !github.event.changes.base
    && !(github.event.changes.body
    && (contains(github.event.pull_request.body, 'content_product_impact')
    || contains(github.event.changes.body.from, 'content_product_impact'))))
    && format('content-product-conformance-skip-{0}', github.run_id)
    || format('content-product-conformance-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  check:
    name: Advisory Content product impact
    # The checker reads the PR body only for a content_product_impact block,
    # so an edit that changes neither the base nor such a block cannot change
    # the result.
    if: >-
      github.event.action != 'edited'
      || github.event.changes.base
      || (github.event.changes.body
      && (contains(github.event.pull_request.body, 'content_product_impact')
      || contains(github.event.changes.body.from, 'content_product_impact')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable conformance controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 72715043afb74b9e4ab82bdb763f812ce180becd
          path: controller
          fetch-depth: 1
          persist-credentials: false

      - name: Check out candidate as inert data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact target revision
        run: git -C candidate fetch --no-tags https://github.com/BuilderIO/agent-native.git ${{ github.event.pull_request.base.sha }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: controller/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: controller/pnpm-lock.yaml

      - run: pnpm --dir controller install --frozen-lockfile --ignore-scripts

      - name: Check Content product impact
        env:
          CONTENT_IMPACT_REPOSITORY: ../candidate
          CONTENT_IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTENT_IMPACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm --dir controller exec tsx scripts/validate-content-product-impact.ts
