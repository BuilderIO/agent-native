name: Nightly full fast-test suite

# Main-branch health check. PRs already run the full fast-test suite (ci.yml),
# so this is not the primary safety net; it catches drift that only shows up
# post-merge — e.g. two individually-green PRs that conflict once combined on
# main, or a newly-flaky test.
#
# Deliberately unsharded: nobody is waiting on a nightly run, so one runner is
# the least wasteful way to cover everything.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-full-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-tests:
    name: Full fast-test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Restore dist + tsBuildInfo cache
        uses: ./.github/actions/restore-dist-cache

      - run: pnpm install --frozen-lockfile

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium for browser-backed unit tests
        run: pnpm exec playwright install --only-shell chromium

      - name: Run full fast-test suite
        run: pnpm test:fast
