name: Nightly full fast-test suite

on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-full-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-tests:
    name: Full fast-test suite
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-v2-${{ runner.os }}-
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium for browser-backed unit tests
        run: |
          pnpm exec playwright install --only-shell chromium
          pnpm --filter @agent-native/creative-context exec playwright install --only-shell chromium

      - name: Allow the downloaded Chromium sandbox
        run: |
          if [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" == "1" ]]; then
            browser_path="$HOME/.cache/ms-playwright/**/chrome-headless-shell"
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\n\nprofile design-playwright-chromium %s flags=(unconfined) {\n  userns,\n}\n' "$browser_path" | sudo tee /etc/apparmor.d/design-playwright-chromium >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/design-playwright-chromium
          fi

      - name: Run full fast-test suite
        run: TEST_WORKSPACE_CONCURRENCY=1 VITEST_CONCURRENCY=100% pnpm test:fast
