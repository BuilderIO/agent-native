name: Feedback fix proof

# Feedback-sweep PRs list their reports under a `Reports` heading, each with a
# `fix-proof: proven` (or `visual:`) line. This re-runs every proof so a
# skipped or invented one fails here instead of merging.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: feedback-fix-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  proof:
    name: Feedback fix proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fix-proof checks out each fix commit and its parent, so it needs the
      # PR's real history, not the default merge commit.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          # Proof commands come from the PR body; keep the token out of
          # .git/config, since only local history is needed.
          persist-credentials: false

      # Pin the runtime the parser needs instead of trusting the runner's.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Each run step copies the gate from the base commit just before using
      # it, after any PR code (the install) has run, so a PR can't loosen the
      # check it is held to. Only a PR that adds the gate runs its own copy.
      # Proofs are limited to tracked repository test files, but those tests
      # and their configuration are PR code; this is not a hostile-PR sandbox.
      - name: Look for a Reports section
        id: find
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          rm -rf "$RUNNER_TEMP/gate" && mkdir "$RUNNER_TEMP/gate"
          for f in feedback-fix-proof.ts fix-proof.ts; do
            if git cat-file -e "$BASE_SHA:scripts/$f" 2>/dev/null; then
              git show "$BASE_SHA:scripts/$f" > "$RUNNER_TEMP/gate/$f"
            else
              cp "scripts/$f" "$RUNNER_TEMP/gate/$f"
            fi
          done
          node --experimental-strip-types --no-warnings "$RUNNER_TEMP/gate/feedback-fix-proof.ts" --has-reports >> "$GITHUB_OUTPUT"

      - if: steps.find.outputs.has_reports == 'true'
        uses: ./.github/actions/setup-pnpm
        with:
          restore-dist-cache: "true"

      - name: Start PostgreSQL for navigation proof
        if: steps.find.outputs.has_reports == 'true' && contains(github.event.pull_request.body, 'query-content-database-items.navigation.postgres.integration.test.ts')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d "$RUNNER_TEMP/feedback-proof-docker.XXXXXX")"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull ghcr.io/builderio/agent-native-ci-postgres-fallback:17-alpine
          docker logout ghcr.io
          rm -rf "$DOCKER_CONFIG"
          trap - EXIT
          unset DOCKER_CONFIG GH_TOKEN
          docker run --pull=never -d --name feedback-proof-postgres \
            -e POSTGRES_DB=content_navigation_test -e POSTGRES_HOST_AUTH_METHOD=trust \
            -p 127.0.0.1:5432:5432 ghcr.io/builderio/agent-native-ci-postgres-fallback:17-alpine
          for attempt in {1..30}; do
            if docker exec feedback-proof-postgres pg_isready -h 127.0.0.1 -U postgres -d content_navigation_test; then
              echo 'CONTENT_NAVIGATION_POSTGRES_URL=postgres://postgres@127.0.0.1:5432/content_navigation_test' >> "$GITHUB_ENV"
              echo 'CONTENT_NAVIGATION_POSTGRES_REQUIRED=1' >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs feedback-proof-postgres
          exit 1

      - name: Re-run each report's proof
        if: steps.find.outputs.has_reports == 'true'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          rm -rf "$RUNNER_TEMP/gate" && mkdir "$RUNNER_TEMP/gate"
          for f in feedback-fix-proof.ts fix-proof.ts; do
            if git cat-file -e "$BASE_SHA:scripts/$f" 2>/dev/null; then
              git show "$BASE_SHA:scripts/$f" > "$RUNNER_TEMP/gate/$f"
            else
              cp "scripts/$f" "$RUNNER_TEMP/gate/$f"
            fi
          done
          node --experimental-strip-types --no-warnings "$RUNNER_TEMP/gate/feedback-fix-proof.ts"
