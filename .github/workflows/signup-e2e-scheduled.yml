name: Signup E2E (scheduled)

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      apps:
        description: "Comma-separated apps or all"
        required: false
        default: "all"
      environments:
        description: "Comma-separated environments: beta,production"
        required: false
        default: "beta"

concurrency:
  group: signup-e2e-scheduled
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signup-e2e:
    name: Full signup flow
    uses: ./.github/workflows/beta-e2e.yml
    with:
      apps: ${{ inputs.apps || 'all' }}
      lane: signup
      grep: ""
      key_source: dedicated
      signup_apps: ${{ inputs.apps || 'all' }}
      signup_environments: ${{ inputs.environments || 'beta' }}
    secrets:
      MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
      MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
    permissions:
      contents: read

  report:
    name: Report signup E2E status
    if: ${{ always() }}
    needs: signup-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
      SIGNUP_E2E_APPS: ${{ inputs.apps || 'all' }}
      SIGNUP_E2E_ENVIRONMENTS: ${{ inputs.environments || 'beta' }}
    steps:
      - name: Update one open issue for a failed run
        if: ${{ needs.signup-e2e.result == 'failure' || needs.signup-e2e.result == 'cancelled' }}
        run: |
          set -euo pipefail

          issue_title="[signup-e2e] Scheduled signup health check failing"
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title | jq -r --arg title "$issue_title" '[.[] | select(.title == $title) | .number] | first // empty')"
          # Each failed job with a link and the step it failed at, the last
          # error annotations from its log, and the evidence artifact.
          failed_jobs="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | "- [\(.name)](\(.url)): \(.conclusion) at step \"\([.steps[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | first // "unknown")\""] | join("\n")')"
          error_lines=""
          for job_id in $(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .databaseId' | head -n 3); do
            if log="$(gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs")"; then
              lines="$(printf '%s\n' "$log" | grep -F '##[error]' | tail -n 5 | sed -E 's/^[^ ]+ //' || true)"
              error_lines="$error_lines${lines:-(no error annotations in the log of job $job_id)}"$'\n'
            else
              error_lines="${error_lines}(could not read the log of job $job_id)"$'\n'
            fi
          done
          artifact_name="signup-e2e-$GITHUB_RUN_ID"
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"$artifact_name\") | .id" | head -n1)"
          if [ -n "$artifact_id" ]; then
            artifact="[$artifact_name]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/$artifact_id) (gh run download $GITHUB_RUN_ID -n $artifact_name)"
          else
            artifact="none uploaded"
          fi
          body="$(cat <<EOF
          The scheduled full signup E2E check failed.

          Run: $RUN_URL
          Failed jobs and the step each failed at:
          $failed_jobs

          Last error lines:
          \`\`\`
          $error_lines
          \`\`\`
          Artifact: $artifact
          Targets: $SIGNUP_E2E_APPS on $SIGNUP_E2E_ENVIRONMENTS
          Reproduce: gh workflow run signup-e2e-scheduled.yml --ref main -f apps=$SIGNUP_E2E_APPS -f environments=$SIGNUP_E2E_ENVIRONMENTS

          The Playwright artifact contains failure screenshots without auth traces or videos.
          This issue is reused while open; a successful run comments with the recovery run and closes it.
          EOF
          )"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$issue_title" --body "$body"
          fi

      - name: Report inconclusive provider result
        if: ${{ needs.signup-e2e.result == 'success' && needs.signup-e2e.outputs.signup_outcome == 'inconclusive' }}
        run: echo "The signup E2E run was inconclusive because Mailosaur was rate-limited; no recovery or page action was taken." >> "$GITHUB_STEP_SUMMARY"

      - name: Close the open issue after recovery
        if: ${{ needs.signup-e2e.result == 'success' && needs.signup-e2e.outputs.signup_outcome == 'success' }}
        run: |
          set -euo pipefail

          issue_title="[signup-e2e] Scheduled signup health check failing"
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title | jq -r --arg title "$issue_title" '[.[] | select(.title == $title) | .number] | first // empty')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "The scheduled signup E2E check recovered: $RUN_URL"
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Resolve PagerDuty after recovery
        if: ${{ needs.signup-e2e.result == 'success' && needs.signup-e2e.outputs.signup_outcome == 'success' && env.PAGERDUTY_ROUTING_KEY != '' }}
        run: |
          set -euo pipefail
          jq -n \
            --arg routing_key "$PAGERDUTY_ROUTING_KEY" \
            --arg dedup_key "agent-native-signup-e2e" \
            --arg source "${{ github.repository }}" \
            '{routing_key: $routing_key, event_action: "resolve", dedup_key: $dedup_key, payload: {summary: "Agent-Native signup E2E recovered", source: $source, severity: "critical"}}' \
            | curl --fail-with-body --connect-timeout 10 --max-time 20 --silent --show-error \
                --header 'Content-Type: application/json' \
                --data-binary @- \
                https://events.pagerduty.com/v2/enqueue
