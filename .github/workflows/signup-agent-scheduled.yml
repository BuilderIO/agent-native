name: Signup agent review (scheduled)

# The deterministic canary (`Signup E2E (scheduled)`) asserts the boundaries we
# already know how to name: link host, session, refresh. This lane exists for
# the failures nobody wrote an assertion for — the clip that started this work
# showed a first-time signup that simply sat there until the user reloaded, and
# no status code or session check describes that.
#
# Deliberately a separate workflow rather than another lane in `beta-e2e.yml`:
# this one spends model tokens, needs a second credential, and must never gate
# or page. Keeping it out of the gating workflow means a model outage or a
# noisy review can never block a merge or wake anyone.
on:
  schedule:
    - cron: "15 17 * * *"
  workflow_dispatch:
    inputs:
      apps:
        description: "Comma-separated apps, or 'all'. Default rotates one app per day."
        required: false
        default: ""
      environments:
        description: "Comma-separated environments: beta,production"
        required: false
        default: "beta"

concurrency:
  group: signup-agent-scheduled
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agent-review:
    name: Agent signup review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNUP_E2E_APPS: all
      SIGNUP_E2E_ENVIRONMENTS: ${{ inputs.environments || 'beta' }}
      SIGNUP_AGENT_APPS: ${{ inputs.apps || '' }}
      MAILOSAUR_API_KEY: ${{ secrets.MAILOSAUR_API_KEY }}
      MAILOSAUR_SERVER_ID: ${{ secrets.MAILOSAUR_SERVER_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SLACK_CHANNEL: C0C4U4XRT6X
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Restore the previous scheduled report state
        id: previous-state
        run: |
          set -euo pipefail
          state_dir=.tmp/signup-agent-continuity
          previous_dir="$state_dir/previous"
          downloaded_dir="$previous_dir/downloaded"
          unknown_state_file="$previous_dir/continuity-unknown"
          mkdir -p "$previous_dir"
          previous_state="$previous_dir/state.json"
          node --experimental-strip-types scripts/signup-report-continuity.ts init-agent --out-file "$previous_state"
          echo "path=$previous_state" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then exit 0; fi

          report_unknown_continuity() {
            message="$1"
            echo "::warning::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            touch "$unknown_state_file"
            exit 0
          }

          prefix="signup-agent-continuity-"
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            if ! same_run_artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"; then
              report_unknown_continuity "Previous Signup agent continuity is unknown because the rerun artifact list could not be loaded."
            fi
            previous_name="$(jq -r --arg name "${prefix}${GITHUB_RUN_ID}-$((GITHUB_RUN_ATTEMPT - 1))" '[.artifacts[] | select(.name == $name and (.expired | not))] | last | .name // empty' <<< "$same_run_artifacts")"
            if [ -n "$previous_name" ]; then
              gh run download "$GITHUB_RUN_ID" --name "$previous_name" --dir "$downloaded_dir" --repo "$GITHUB_REPOSITORY"
              state_file="$(find "$downloaded_dir" -type f -name state.json -print -quit)"
              if [ -z "$state_file" ]; then echo "::error::Previous Signup agent state artifact had no state.json."; exit 1; fi
              cp "$state_file" "$previous_state"
              node --experimental-strip-types -e 'import { readFileSync } from "node:fs"; const value = JSON.parse(readFileSync(process.argv[1], "utf8")); if (value.reporter !== "signup-agent") process.exit(1)' "$previous_state"
              if [ "$(jq -r '.outcome // ""' "$previous_state")" = "unknown" ]; then touch "$unknown_state_file"; fi
              exit 0
            fi
            echo "::error::The prior Signup agent attempt has no continuity artifact; refusing to use stale scheduled state."
            exit 1
          fi

          if ! runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/signup-agent-scheduled.yml/runs?branch=main&event=schedule&status=completed&per_page=100")"; then
            report_unknown_continuity "Previous Signup agent continuity is unknown because scheduled runs could not be loaded. Continuing this review without prior state."
          fi
          previous_run="$(jq -c --arg current "$GITHUB_RUN_ID" '[.workflow_runs[] | select((.id | tostring) != $current)][0] // empty' <<< "$runs")"
          if [ -z "$previous_run" ]; then exit 0; fi
          previous_id="$(jq -r '.id' <<< "$previous_run")"
          previous_conclusion="$(jq -r '.conclusion // "unknown"' <<< "$previous_run")"
          previous_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$previous_id"
          if ! artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_id/artifacts?per_page=100")"; then
            report_unknown_continuity "Previous Signup agent continuity is unknown because the prior run artifact list could not be loaded. Continuing this review without prior state."
          fi
          previous_name="$(jq -r --arg prefix "$prefix$previous_id-" '[.artifacts[] | select((.name | startswith($prefix)) and (.expired | not))] | sort_by(.created_at) | last | .name // empty' <<< "$artifacts")"
          if [ -n "$previous_name" ]; then
            gh run download "$previous_id" --name "$previous_name" --dir "$downloaded_dir" --repo "$GITHUB_REPOSITORY"
            state_file="$(find "$downloaded_dir" -type f -name state.json -print -quit)"
            if [ -z "$state_file" ]; then echo "::error::Previous Signup agent state artifact had no state.json."; exit 1; fi
            cp "$state_file" "$previous_state"
            node --experimental-strip-types -e 'import { readFileSync } from "node:fs"; const value = JSON.parse(readFileSync(process.argv[1], "utf8")); if (value.reporter !== "signup-agent") process.exit(1)' "$previous_state"
            if [ "$(jq -r '.outcome // ""' "$previous_state")" = "unknown" ]; then touch "$unknown_state_file"; fi
            exit 0
          fi

          previous_jobs_file="$previous_dir/jobs.json"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_id/jobs?per_page=100" > "$previous_jobs_file"; then
            report_unknown_continuity "Previous Signup agent continuity is unknown because the prior run jobs could not be loaded. Continuing this review without legacy state."
          fi
          if ! legacy_fallback_allowed="$(node --experimental-strip-types scripts/signup-report-continuity.ts legacy-fallback-allowed \
            --jobs-file "$previous_jobs_file" \
            --persist-step-name "Persist Signup agent continuity state")"; then
            report_unknown_continuity "Previous Signup agent continuity is unknown because legacy fallback eligibility could not be checked. Continuing this review without legacy state."
          fi
          if [ "$legacy_fallback_allowed" != "true" ]; then
            report_unknown_continuity "Previous Signup agent continuity is unknown; legacy state was not restored because fallback was not explicitly allowed. Continuing this review without prior state."
          fi

          legacy_name="$(jq -r --arg name "signup-agent-$previous_id" '[.artifacts[] | select(.name == $name and (.expired | not))] | last | .name // empty' <<< "$artifacts")"
          legacy_id="$(jq -r --arg name "signup-agent-$previous_id" '[.artifacts[] | select(.name == $name and (.expired | not))] | last | .id // empty' <<< "$artifacts")"
          if [ -z "$legacy_name" ]; then
            report_unknown_continuity "Previous Signup agent continuity is unknown because the explicitly allowed legacy report artifact was not found. Continuing this review without prior state."
          fi
          legacy_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$previous_id/artifacts/$legacy_id"
          gh run download "$previous_id" --name "$legacy_name" --dir "$previous_dir/legacy" --repo "$GITHUB_REPOSITORY"
          findings_file="$(find "$previous_dir/legacy" -type f -name findings.md -print -quit)"
          if [ -z "$findings_file" ]; then
            report_unknown_continuity "Previous Signup agent continuity is unknown because the legacy report artifact did not contain findings.md. Continuing this review without prior state."
          fi
          finding_count="$(grep -ciE '^\|[[:space:]]*(high|medium|low)[[:space:]]*\|' "$findings_file" || true)"
          report_complete=false
          if [ "$previous_conclusion" = "success" ] && ! find "$previous_dir/legacy" -type f -name mailosaur-inconclusive.txt -print -quit | grep -q .; then report_complete=true; fi
          if [ "$finding_count" -gt 0 ]; then
            jq -n --arg run_url "$previous_run_url" --arg artifact_url "$legacy_url" --argjson finding_count "$finding_count" \
              --argjson report_complete "$report_complete" \
              '{version: 1, reporter: "signup-agent", outcome: "findings", findingCount: $finding_count, reportComplete: $report_complete, runUrl: $run_url, reportArtifactUrl: $artifact_url}' > "$previous_state"
          elif [ "$report_complete" = "true" ]; then
            jq -n --arg run_url "$previous_run_url" --arg artifact_url "$legacy_url" \
              '{version: 1, reporter: "signup-agent", outcome: "clean", findingCount: 0, reportComplete: true, runUrl: $run_url, reportArtifactUrl: $artifact_url}' > "$previous_state"
          fi

      - name: Typecheck the agent lane
        run: pnpm exec tsc --noEmit -p e2e/signup/tsconfig.json

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --only-shell chromium

      - name: Walk the signup flow and review it
        id: review
        run: pnpm exec playwright test --config e2e/signup/agent.playwright.config.ts

      - name: Classify provider result
        id: classify
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if find e2e/signup/test-results/signup-agent -type f -name 'mailosaur-inconclusive.txt' -print -quit | grep -q .; then
            echo "inconclusive=true" >> "$GITHUB_OUTPUT"
            echo "INCONCLUSIVE: Mailosaur rate-limited the verification inbox; no model review was recorded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "inconclusive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish findings
        id: publish
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -euo pipefail
          findings="e2e/signup/test-results/signup-agent/findings.md"
          if [ ! -s "$findings" ]; then
            # A missing report is incomplete evidence, not a clean review.
            {
              echo "### Signup agent review"
              echo "No findings file was produced; the run did not complete a review."
            } >> "$GITHUB_STEP_SUMMARY"
            {
              echo "actionable=true"
              echo "has_findings=true"
              echo "incomplete=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qiE '^\|[[:space:]]*(high|medium)[[:space:]]*\|' "$findings"; then
            actionable=true
          else
            actionable=false
          fi
          if grep -qiE '^\|[[:space:]]*(high|medium|low)[[:space:]]*\|' "$findings"; then
            has_findings=true
          else
            has_findings=false
          fi
          {
            echo "actionable=$actionable"
            echo "has_findings=$has_findings"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Signup agent review"
            echo
            cat "$findings"
            echo
            echo "[run]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: evidence
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: signup-agent-${{ github.run_id }}
          path: e2e/signup/test-results/signup-agent/
          if-no-files-found: warn
          retention-days: 90

      - name: Build the consolidated Slack report
        id: report
        if: ${{ always() }}
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          REPORT_INCOMPLETE: ${{ steps.publish.outputs.incomplete == 'true' || steps.publish.outcome != 'success' || steps.evidence.outcome == 'failure' }}
          FINDINGS_PATH: e2e/signup/test-results/signup-agent/findings.md
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          targets="${SIGNUP_AGENT_APPS:-daily rotation}"
          if [ "$REVIEW_OUTCOME" != "success" ]; then
            status="did not complete successfully"
          elif [ "$PUBLISH_OUTCOME" != "success" ]; then
            status="could not publish its report"
          elif [ "$EVIDENCE_OUTCOME" = "failure" ]; then
            status="could not preserve its full report artifact"
          elif [ "$REPORT_INCOMPLETE" = "true" ]; then
            status="did not produce a complete findings report"
          elif [ "${{ steps.publish.outputs.actionable }}" = "true" ]; then
            status="reported high or medium findings"
          elif [ "${{ steps.publish.outputs.has_findings }}" = "true" ]; then
            status="reported low findings"
          else
            status="reported no findings"
          fi
          mkdir -p .tmp
          args=(
            --findings "$FINDINGS_PATH"
            --status "$status"
            --targets "$targets"
            --environments "$SIGNUP_E2E_ENVIRONMENTS"
            --run-url "$RUN_URL"
            --out-dir .tmp/signup-agent
            --incomplete "$REPORT_INCOMPLETE"
          )
          continuity_unknown=false
          if [ -f .tmp/signup-agent-continuity/previous/continuity-unknown ]; then
            continuity_unknown=true
          fi
          args+=(--continuity-unknown "$continuity_unknown")
          echo "continuity_unknown=$continuity_unknown" >> "$GITHUB_OUTPUT"
          if [ -n "$ARTIFACT_URL" ]; then args+=(--artifact-url "$ARTIFACT_URL"); fi
          node --experimental-strip-types scripts/signup-agent-rollup.ts "${args[@]}"
          jq -n --arg channel "$SLACK_CHANNEL" --rawfile text .tmp/signup-agent/signup-agent-slack.txt \
            '{channel: $channel, text: $text, unfurl_links: false, unfurl_media: false}' \
            > .tmp/signup-agent-slack-payload.json
          {
            echo "### Signup agent Slack report"
            echo
            cat .tmp/signup-agent/signup-agent-slack.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Plan the Signup agent recovery rollup
        id: continuity-plan
        if: ${{ always() && steps.previous-state.outcome == 'success' }}
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          set -euo pipefail
          outcome=incomplete
          report_complete=false
          finding_count=0
          if [ -s e2e/signup/test-results/signup-agent/findings.md ]; then
            finding_count="$(jq -r '.findingCount // 0' .tmp/signup-agent/signup-agent-rollup.json)"
            if [ "${{ steps.review.outcome }}" = "success" ] && [ "${{ steps.publish.outcome }}" = "success" ] && [ "${{ steps.publish.outputs.incomplete }}" != "true" ] && [ "${{ steps.evidence.outcome }}" = "success" ] && [ "${{ steps.classify.outputs.inconclusive }}" != "true" ]; then
              report_complete=true
              if [ "${{ steps.publish.outputs.has_findings }}" = "true" ]; then outcome=findings; else outcome=clean; fi
            fi
          fi
          if [ "$report_complete" = "false" ] && [ "${{ steps.classify.outputs.inconclusive }}" = "true" ]; then outcome=inconclusive; fi
          args=(plan-agent --previous-state .tmp/signup-agent-continuity/previous/state.json --event "$GITHUB_EVENT_NAME" --outcome "$outcome" --finding-count "$finding_count" --report-complete "$report_complete" --run-url "$RUN_URL" --out-dir .tmp/signup-agent-continuity/plan)
          if [ -n "$ARTIFACT_URL" ]; then args+=(--report-artifact-url "$ARTIFACT_URL"); fi
          node --experimental-strip-types scripts/signup-report-continuity.ts "${args[@]}"
          if [ "$(jq -r '.recovery != null' .tmp/signup-agent-continuity/plan/plan.json)" = "true" ]; then
            jq -n --arg channel "$SLACK_CHANNEL" --rawfile text .tmp/signup-agent-continuity/plan/recovery.txt \
              '{channel: $channel, text: $text, unfurl_links: false, unfurl_media: false}' > .tmp/signup-agent-slack-payload.json
            echo "recovered=true" >> "$GITHUB_OUTPUT"
          else
            echo "recovered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Slack configuration
        id: slack_config
        if: >-
          ${{ always() && (steps.continuity-plan.outputs.recovered == 'true' || steps.report.outputs.continuity_unknown == 'true' || ((steps.classify.outputs.inconclusive != 'true' || steps.evidence.outcome == 'failure') && (steps.review.outcome != 'success' || steps.publish.outcome != 'success' || steps.publish.outputs.has_findings == 'true' || steps.evidence.outcome == 'failure'))) }}
        env:
          QA_SLACK_BOT_TOKEN: ${{ secrets.QA_SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$QA_SLACK_BOT_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            message="Slack notification not configured: QA_SLACK_BOT_TOKEN is empty, so the signup agent report could not be sent to #qa-agent-native."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Post the consolidated report to Slack
        id: slack
        if: ${{ always() && steps.slack_config.outputs.configured == 'true' }}
        continue-on-error: true
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.QA_SLACK_BOT_TOKEN }}
          errors: false
          payload-file-path: .tmp/signup-agent-slack-payload.json

      - name: Report Slack delivery failure
        if: ${{ always() && steps.slack_config.outputs.configured == 'true' && (steps.slack.outcome != 'success' || steps.slack.outputs.ok != 'true') }}
        env:
          SLACK_OUTCOME: ${{ steps.slack.outcome }}
          SLACK_RESPONSE: ${{ steps.slack.outputs.response }}
        run: |
          set -euo pipefail
          reason="$(jq -r '.error // empty' <<< "${SLACK_RESPONSE:-null}" 2> /dev/null || true)"
          reason="${reason:-no Slack API error code returned; step outcome $SLACK_OUTCOME}"
          message="Slack notification failed: chat.postMessage to #qa-agent-native returned \"$reason\". The QA_SLACK_BOT_TOKEN bot must be invited to the channel and the token must be valid. No GitHub issue fallback was used."
          echo "::error::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Finalize Signup agent continuity state
        id: finalize-state
        if: ${{ always() && github.event_name == 'schedule' && steps.continuity-plan.outcome == 'success' }}
        run: |
          set -euo pipefail
          delivered=false
          if [ "${{ steps.report.outputs.continuity_unknown }}" != "true" ] && [ "${{ steps.continuity-plan.outputs.recovered }}" != "true" ] && [ "${{ steps.publish.outputs.has_findings }}" != "true" ]; then delivered=true; fi
          if [ "${{ steps.slack.outputs.ok }}" = "true" ]; then delivered=true; fi
          node --experimental-strip-types scripts/signup-report-continuity.ts finalize-agent \
            --previous-state .tmp/signup-agent-continuity/previous/state.json \
            --plan .tmp/signup-agent-continuity/plan/plan.json \
            --slack-delivered "$delivered" \
            --out-file .tmp/signup-agent-continuity/state.json

      - name: Persist Signup agent continuity state
        if: ${{ always() && github.event_name == 'schedule' && steps.finalize-state.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signup-agent-continuity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/signup-agent-continuity/state.json
          if-no-files-found: error
          retention-days: 90

      - name: Fail after posting an incomplete report
        if: >-
          ${{ always() && steps.slack.outcome == 'success' && steps.slack.outputs.ok == 'true' && (steps.review.outcome != 'success' || steps.publish.outputs.incomplete == 'true' || steps.publish.outcome != 'success' || steps.evidence.outcome == 'failure') }}
        run: |
          message="Signup agent evidence was incomplete or could not be uploaded; the degraded report was posted to #qa-agent-native. See the workflow run for details."
          echo "::error::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1
