packages:
  - packages/*
  - examples/*
  - templates/*
  - templates/*/desktop
  - templates/*/chrome-extension

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@bacons/apple-targets"
  - "@agent-native/core"
  - "@modelcontextprotocol/client"
  - "@modelcontextprotocol/core"
  - "@modelcontextprotocol/node"
  - "@modelcontextprotocol/server"
  - "dom-to-pptx"
  - "fast-xml-parser"
  - "typescript"
  - "@typescript/typescript6"
  - "@typescript/typescript-*"

# Playwright is pinned exactly in the catalog below, kept in step across
# `@playwright/test` and `playwright`: a caret resolves forward to a release
# tied to a different chromium revision, downloading a 2nd ~650 MB browser next
# to the one already on disk. Published packages must NOT inherit that exact
# range — see packages/{recap-cli,creative-context}/package.json.
catalog:
  "@assistant-ui/react": ^0.12.19
  "@playwright/test": 1.61.1
  "@radix-ui/react-dialog": ^1.1.19
  "@radix-ui/react-dropdown-menu": ^2.1.20
  "@radix-ui/react-hover-card": ^1.1.19
  "@radix-ui/react-popover": ^1.1.19
  "@radix-ui/react-select": ^2.3.3
  "@radix-ui/react-tooltip": ^1.2.12
  "@tiptap/core": 3.30.1
  "@tiptap/extension-blockquote": 3.30.1
  "@tiptap/extension-bubble-menu": 3.30.1
  "@tiptap/extension-code-block-lowlight": 3.30.1
  "@tiptap/extension-collaboration": 3.30.1
  "@tiptap/extension-collaboration-caret": 3.30.1
  "@tiptap/extension-color": 3.30.1
  "@tiptap/extension-floating-menu": 3.30.1
  "@tiptap/extension-horizontal-rule": 3.30.1
  "@tiptap/extension-image": 3.30.1
  "@tiptap/extension-link": 3.30.1
  "@tiptap/extension-list": 3.30.1
