  Layout of this file:

<title>Slides</title>
__KIT_HEAD__
<style>
:root {
  --kit-accent: hsl(var(--primary));
  /* Slides' menus are shadcn's default density: 14/20 text, 32px rows, 4px inset. */
  --kit-menu-font: 14px; --kit-menu-line: 20px; --kit-menu-row: 32px; --kit-menu-padding: 4px; --kit-menu-item-radius: 2px;
  /* Not tokens in the code yet: the code writes these as literals. */
  --slides-selection: #609ff8;          /* thumbnail and element selection, history dots, progress bar */
  --slides-agent: #00b5ff;              /* PresenceBar AGENT_COLOR and the AI marker */
  --slides-star: #f5c451;               /* starred deck */
  --slides-stage: #000;                 /* presentation background */
  --slides-presenter: hsl(240 6% 6%);   /* presenter view background */

}
body { font-size: 14px; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible, textarea:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 1px; }
.mix-60 { background: color-mix(in srgb, var(--color-accent) 60%, transparent); }

/* Menus: the toolkit's shadcn DropdownMenu density (text-sm, py-1.5 rows, p-1, rounded-md). */

.menu button.danger { color: var(--color-destructive); }
.menu .badge { margin-left: auto; border-radius: 999px; background: var(--color-primary); color: var(--color-primary-foreground); padding: 0 6px; font-size: 10px; font-weight: 600; }

/* ───────── shell ───────── */
.app { position: relative; height: calc(100vh - 36px); display: flex; overflow: hidden; background: var(--agent-kit-recessed-surface); }

.main-scroll { flex: 1; min-height: 0; overflow-y: auto; }

/* ───────── app sidebar (toolkit AppSidebar): 260 expanded, 56 collapsed ───────── */
.app-left { width: 260px; border-inline-end: 1px solid var(--color-border); transition: width 200ms ease-out; }

/* ───────── header ───────── */
.hdr { flex: none; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 24px; border-bottom: 1px solid var(--color-border); }

.hdr-search { position: relative; width: 100%; max-width: 480px; justify-self: center; }

.b { height: 32px; padding: 0 12px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.b.outline { border: 1px solid var(--color-input); background: var(--color-background); }

.b[disabled] { opacity: .5; cursor: default; }

/* ───────── home (toolkit PromptHome) ───────── */
.home { max-width: 1480px; margin: 0 auto; padding: 0 32px 56px; }
.hero { min-height: clamp(36rem, 64svh, 44rem); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.hero h2 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.02em; }
.hero-composer { width: 100%; max-width: 700px; margin-top: 16px; text-align: start; }
.chips { width: 100%; max-width: 700px; margin-top: 16px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.chip-s { height: 28px; padding: 0 10px; border-radius: 999px; background: color-mix(in srgb, var(--color-muted) 55%, transparent); border: 1px solid transparent; font-size: 11px; color: color-mix(in srgb, var(--color-foreground) 80%, transparent); }
.chip-s:hover { background: var(--color-muted); border-color: color-mix(in srgb, var(--color-border) 55%, transparent); color: var(--color-foreground); }

/* the shared composer (AgentComposerFrame + PromptComposer) */
.composer { border: 1px solid var(--agent-kit-composer-border-color); border-radius: var(--agent-kit-composer-radius); background: var(--agent-kit-raised-surface); box-shadow: var(--agent-kit-composer-elevation); display: flex; flex-direction: column; min-height: var(--agent-kit-composer-min-height); }
.composer.hero-c { min-height: 9rem; }
.composer:focus-within { border-color: var(--agent-kit-composer-focus-border-color); }
.cmp-input { flex: 1; min-height: var(--agent-kit-composer-editor-min-height); max-height: 12rem; overflow-y: auto; padding: 14px 16px 2px; font-size: 14px; line-height: 20px; outline: none; white-space: pre-wrap; text-align: left; }
.hero-c .cmp-input { min-height: 5.125rem; }
.cmp-input:empty::before { content: attr(data-ph); color: var(--color-muted-foreground); pointer-events: none; }

.cmp-btn { height: 28px; min-width: 28px; padding: 0 6px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--color-muted-foreground); }
.cmp-btn:hover { background: var(--color-accent); color: var(--color-foreground); }
.cmp-send { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; background: var(--color-primary); color: var(--color-primary-foreground); }
.cmp-send[disabled] { opacity: .35; cursor: default; }
.cmp-send.stop { background: var(--color-foreground); color: var(--color-background); }

/* library tabs */
.lib { padding-top: 32px; }
.tabs-h { position: sticky; top: 0; z-index: 10; padding: 8px 0; background: var(--color-background); display: flex; align-items: center; gap: 8px; }
.tabs-l { display: inline-flex; height: 36px; align-items: center; padding: 4px; border-radius: 6px; background: var(--color-muted); color: var(--color-muted-foreground); }
.tabs-l button { height: 28px; padding: 4px 12px; border-radius: 2px; font-size: 14px; font-weight: 500; }
.tabs-l button[aria-selected="true"] { background: var(--color-background); color: var(--color-foreground); box-shadow: 0 1px 2px 0 rgb(0 0 0 / 5%); }
.tabs-h .grow { flex: 1; }
.filter-t { position: relative; width: 36px; height: 36px; border-radius: 6px; display: grid; place-items: center; border: 1px solid var(--color-input); background: var(--color-background); }
.filter-t:hover { background: var(--color-accent); }
.filter-t.on { border-color: color-mix(in srgb, var(--color-primary) 40%, transparent); color: var(--color-primary); }
.filter-t.on::after { content: ""; position: absolute; top: -4px; right: -4px; width: 6px; height: 6px; border-radius: 50%; background: var(--color-primary); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 8px; }
@media (max-width: 1280px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.empty-box { border-radius: 12px; background: var(--color-card); padding: 24px; font-size: 14px; color: var(--color-muted-foreground); }

/* deck card */
.card { position: relative; min-width: 0; }
.card-l { display: block; width: 100%; text-align: left; overflow: hidden; border-radius: 12px; border: 1px solid transparent; background: var(--color-card); transition: background-color .2s, border-color .2s; }
.card-l:hover { border-color: var(--color-border); background: color-mix(in srgb, var(--color-accent) 30%, var(--color-card)); }
.card-p { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: color-mix(in srgb, var(--color-muted) 30%, transparent); }
.card-p::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, hsl(240 5% 8%), transparent 50%); opacity: .6; pointer-events: none; }
.card-c { min-height: 80px; padding: 16px 48px 16px 16px; display: flex; align-items: center; gap: 8px; }
.card-c h3 { margin: 0; flex: 1; min-width: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-c input { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1px solid var(--color-border); font-size: 14px; font-weight: 500; outline: none; }
.vis { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--color-muted-foreground); flex: none; }
.card-a { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
.card-a button { padding: 6px; border-radius: 6px; border: 1px solid var(--color-border); background: rgb(0 0 0 / 60%); backdrop-filter: blur(4px); color: rgb(255 255 255 / 70%); display: grid; place-items: center; }
.card-a button:hover { background: rgb(0 0 0 / 80%); }
.card-a .star { opacity: 0; }
.card:hover .card-a .star, .card-a .star.on { opacity: 1; }
.card-a .star.on { color: var(--slides-star); }
.card-a .star.on svg { fill: currentColor; }
.card-tpl .card-c { flex-direction: column; align-items: flex-start; gap: 4px; padding-right: 48px; }
.card-tpl .card-c p { margin: 0; font-size: 14px; line-height: 20px; color: var(--color-muted-foreground); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-tpl .card-p::after { display: none; }
.card-tpl .more { position: absolute; right: 8px; bottom: 34px; opacity: 0; }
.card-tpl:hover .more { opacity: 1; }
.opening { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; background: color-mix(in srgb, var(--color-background) 80%, transparent); backdrop-filter: blur(4px); font-size: 14px; font-weight: 500; }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* templates and design systems pages */
.page { max-width: 1480px; margin: 0 auto; padding: 24px 32px; display: grid; gap: 24px; }
.page .search { position: relative; max-width: 700px; }
.page .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-muted-foreground); }
.page .search .input { padding-left: 36px; }
.ds-page { max-width: 1152px; margin: 0 auto; padding: 40px 24px; }
.ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 320px)); gap: 16px; }
.ds-card { position: relative; border-radius: 12px; border: 1px solid var(--color-border); background: var(--color-card); overflow: hidden; }
.ds-card:hover { border-color: color-mix(in srgb, var(--color-foreground) 20%, transparent); }
.ds-new { border-style: dashed; text-align: left; width: 100%; display: flex; flex-direction: column; justify-content: flex-start; }
.ds-new .pv { aspect-ratio: 16 / 9; display: grid; place-items: center; background: color-mix(in srgb, var(--color-muted) 30%, transparent); }
.ds-new .pv span { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--color-accent) 50%, transparent); color: var(--color-muted-foreground); }
.ds-pv { aspect-ratio: 16 / 9; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
.ds-sw { display: flex; gap: 6px; }
.ds-sw i { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--color-border); }
.ds-info { padding: 16px; display: grid; gap: 6px; }
.ds-info .t { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
.ds-info small { font-size: 12px; color: var(--color-muted-foreground); }
.ds-badge { font-size: 10px; border: 1px solid color-mix(in srgb, var(--slides-selection) 40%, transparent); color: var(--slides-selection); border-radius: 999px; padding: 0 6px; line-height: 16px; }
.ds-acts { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.ds-acts button { height: 36px; min-width: 36px; padding: 0 8px; border-radius: 6px; background: color-mix(in srgb, var(--color-background) 80%, transparent); border: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent); backdrop-filter: blur(4px); display: grid; place-items: center; font-size: 13px; font-weight: 500; }

/* ───────── editor ───────── */
.deck-editor-shell { --agent-native-lower-surface: var(--agent-kit-nav-surface); --slides-editor-surface: color-mix(in srgb, hsl(var(--background)) 35%, var(--agent-native-lower-surface, hsl(var(--background))) 65%); flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border-start-start-radius: 8px; border-end-start-radius: 8px; background: var(--color-background); }
.etb { flex: none; height: 48px; display: flex; align-items: center; gap: 4px; padding: 0 12px; background: var(--color-background); white-space: nowrap; }
.etb .tb-ic { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--color-muted-foreground); flex: none; }
.etb .tb-ic:hover { background: var(--color-accent); color: color-mix(in srgb, var(--color-foreground) 70%, transparent); }
.etb .title { min-width: 40px; max-width: 500px; background: transparent; border: 0; font-size: 14px; font-weight: 500; color: color-mix(in srgb, var(--color-foreground) 90%, transparent); outline: none; margin-left: 4px; }
.etb .title:focus { color: var(--color-foreground); }
.etb .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.view-only { display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-muted) 50%, transparent); padding: 4px 10px; font-size: 12px; font-weight: 500; color: var(--color-muted-foreground); }
/* SaveStatusIndicator: the code draws offline, failed, and conflict saves in destructive red. */
.save-warn { display: inline-flex; align-items: center; gap: 4px; min-width: 0; padding: 4px 6px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--color-destructive) 30%, transparent); background: color-mix(in srgb, var(--color-destructive) 10%, transparent); font-size: 11px; color: var(--color-destructive); margin-right: 4px; flex: none; }
.save-warn button { height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 6px; color: inherit; }
.save-warn button:hover { background: color-mix(in srgb, var(--color-destructive) 10%, transparent); }
.presence { display: flex; align-items: center; padding-left: 8px; }
.pav { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; border: 1px solid #fff; flex: none; }
.pav.pav-ai { background: var(--slides-agent); }
.pav.pav-ai.active { animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--slides-agent) 50%, transparent); } 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--slides-agent) 0%, transparent); } }
.etb .share { height: 36px; padding: 0 12px; border: 1px solid var(--color-input); border-radius: 6px; font-size: 14px; font-weight: 500; background: var(--color-background); margin-left: 4px; }
.etb .share:hover { background: var(--color-accent); }
.etb .present { height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-primary); color: var(--color-primary-foreground); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; margin: 0 4px; }
.etb .present:hover { opacity: .9; }
.etb .present[disabled] { opacity: .5; cursor: default; }
.etb .present svg { width: 14px; height: 14px; }

/* contextual toolbar (SlideContextToolbar), one 40px row under the header */
.ctb { flex: none; height: 40px; display: flex; align-items: center; gap: 4px; padding: 0 12px; white-space: nowrap; overflow-x: auto; }
.ctb .dv { margin: 0 4px; width: 1px; height: 16px; background: var(--color-border); flex: none; }
.ctb .t7 { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--color-muted-foreground); flex: none; }
.ctb .t7:hover { background: var(--color-accent); color: var(--color-foreground); }

.ctb .t7[disabled] { opacity: .5; cursor: default; background: none; }

.ctb .newslide:hover { background: var(--color-accent); color: var(--color-foreground); }

.ctb .val:hover { background: var(--color-accent); }
.ctb .sw { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
.ctb .sw:hover { background: var(--color-accent); }
.ctb .sw i { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--color-border); }
.ctb .zoom { width: 44px; text-align: center; font-size: 12px; color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }
.ctb .ml-auto { margin-left: auto; }
.ctb .size { display: inline-flex; align-items: center; height: 28px; border-radius: 6px; background: color-mix(in srgb, var(--color-muted) 82%, transparent); font-size: 11px; font-weight: 500; }
.ctb .size button { width: 22px; height: 28px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.ctb .size span { width: 32px; text-align: center; font-variant-numeric: tabular-nums; }

.workspace { position: relative; flex: 1; min-height: 0; display: flex; overflow: hidden; background: var(--color-background); }

/* slide rail (EditorSidebar) */
.rail { flex: none; width: 208px; display: flex; flex-direction: column; background: var(--color-background); }
.rail-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.th { width: 100%; text-align: left; display: flex; align-items: flex-start; gap: 6px; padding: 6px; border-radius: 8px; cursor: grab; transition: background-color .15s; position: relative; }
.th.active { background: color-mix(in srgb, var(--color-accent) 60%, transparent); }
.th.selected { background: var(--color-accent); }
.th .num { width: 16px; flex: none; align-self: stretch; position: relative; text-align: center; font-size: 10px; font-weight: 500; line-height: 20px; color: color-mix(in srgb, var(--color-muted-foreground) 70%, transparent); }
.th .num .ai { position: absolute; left: 50%; top: 20px; transform: translateX(-50%); }
.ai-mark { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 8px; font-weight: 700; color: #fff; background: var(--slides-agent); }
.th .fr { flex: 1; min-width: 0; position: relative; border-radius: 4px; border: 1px solid rgb(255 255 255 / 6%); overflow: hidden; }
.th.active .fr, .th.selected .fr { border-color: var(--slides-selection); box-shadow: 0 0 0 2px var(--slides-selection); }
.th.skipped .fr .sl-frame { opacity: .4; }
.th .skip { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; background: rgb(0 0 0 / 40%); color: rgb(255 255 255 / 80%); }
.th .skip svg { width: 24px; height: 24px; }
.th.dragging { opacity: .4; }
.drop-line { height: 2px; border-radius: 1px; background: var(--slides-selection); margin: -3px 6px -1px 28px; }
.shimmer { position: absolute; inset: 0; z-index: 3; background: linear-gradient(100deg, transparent 30%, hsl(var(--foreground) / .08) 50%, transparent 70%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
@keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }

/* canvas */
.ed-col { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; border-start-start-radius: 8px; border-end-start-radius: 8px; background: var(--slides-editor-surface); }
.canvas { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 64px 32px 32px; position: relative; }
.stage { position: relative; flex: none; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 40%); }
.stage [data-el] { cursor: text; }
.stage [data-el]:hover { outline: 1px solid var(--slides-selection); outline-offset: 2px; }
.stage [data-el].sel { outline: 2px solid var(--slides-selection); outline-offset: 2px; }
.gen-stage { width: 100%; max-width: 1152px; margin: auto; }
.gen { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; border: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-muted) 20%, transparent); }
.gen .art { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 14%; background: color-mix(in srgb, var(--color-muted) 30%, transparent); }
.gen.thumb .art { gap: 4px; }
.sk { border-radius: 6px; background: var(--color-muted); position: relative; overflow: hidden; }
.sk::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, hsl(var(--foreground) / .043) 50%, transparent 70%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
.gen .two { margin-top: 5%; display: grid; grid-template-columns: 1fr 1fr; gap: 8%; }
.empty-deck { margin: auto; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; max-width: 384px; }

/* speaker notes */
.notes { flex: none; background: var(--slides-editor-surface); }
.notes .grip { height: 8px; display: flex; align-items: center; justify-content: center; cursor: row-resize; }
.notes .grip i { width: 40px; height: 1px; border-radius: 1px; background: hsl(var(--muted-foreground) / .3); }
.notes .tog { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 6px 16px; }
.notes .tog span { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: var(--color-muted-foreground); }
.notes .tog:hover span { color: color-mix(in srgb, var(--color-foreground) 80%, transparent); }
.notes textarea { display: block; width: 100%; height: 100%; resize: none; background: transparent; border: 0; outline: none; font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--color-muted-foreground); }
.notes .ta { padding: 0 16px 12px; height: 120px; }

/* comments panel */
.cm { flex: none; width: 272px; display: flex; flex-direction: column; background: var(--slides-editor-surface); }
.cm-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
.cm-h span { font-size: 13px; font-weight: 500; color: color-mix(in srgb, var(--color-foreground) 80%, transparent); }
.cm-h .acts { display: flex; gap: 4px; }
.cm-h .acts button { padding: 4px; border-radius: 4px; color: var(--color-muted-foreground); display: grid; }
.cm-h .acts button:hover { background: var(--color-accent); color: var(--color-foreground); }
.cm-f { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 8px; border-bottom: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent); }
.cm-f .segm { display: inline-flex; border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent); border-radius: 6px; padding: 2px; }
.cm-f .segm button { padding: 4px 8px; border-radius: 4px; font-size: 10px; color: var(--color-muted-foreground); }
.cm-f .segm button[aria-pressed="true"] { background: var(--color-accent); color: var(--color-foreground); }
.cm-b { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.thread { border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-background); padding: 10px 12px; font-size: 12px; line-height: 18px; }
.thread .who { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; margin-bottom: 4px; }
.thread .who .pav { width: 20px; height: 20px; font-size: 9px; border: 0; }
.thread .who small { color: var(--color-muted-foreground); font-weight: 400; }
.thread .reply { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--color-border); }
.thread .go { margin-top: 6px; font-size: 11px; color: var(--color-muted-foreground); }
.cm-new { width: 100%; text-align: center; padding: 40px 0; border-radius: 8px; border: 1px dashed color-mix(in srgb, var(--color-border) 70%, transparent); }
.cm-new:hover { background: var(--color-accent); }
.cm-new p { margin: 8px 0 0; font-size: 12px; color: var(--color-muted-foreground); }
.cm-new small { font-size: 11px; color: color-mix(in srgb, var(--color-muted-foreground) 70%, transparent); }
.pin { position: absolute; z-index: 5; width: 24px; height: 24px; border-radius: 50% 50% 50% 0; background: var(--slides-selection); color: #000; display: grid; place-items: center; font-size: 11px; font-weight: 700; transform: translate(-4px, -24px); border: 2px solid #fff; }

/* popovers, sheets, dialogs */
.pop { position: fixed; z-index: 55; background: var(--color-popover); color: var(--color-foreground); border: 1px solid var(--color-border); border-radius: 8px; box-shadow: var(--agent-kit-overlay-elevation); }
.share-pop { width: min(460px, 92vw); padding: 16px; display: flex; flex-direction: column; }
.share-pop h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
.sp-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.sp-row b { display: block; font-size: 14px; font-weight: 500; }
.sp-row small { font-size: 12px; color: var(--color-muted-foreground); }
.sp-lbl { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.sp-access { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.sp-access .ic { width: 36px; height: 36px; border-radius: 50%; background: var(--color-muted); color: var(--color-muted-foreground); display: grid; place-items: center; flex: none; }
.sel-t { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px; margin-left: -6px; border-radius: 6px; font-size: 14px; font-weight: 500; }
.sel-t:hover { background: var(--color-accent); }
.sp-access small { display: block; font-size: 12px; color: var(--color-muted-foreground); }
.sp-add { display: flex; gap: 8px; margin-bottom: 8px; }
.sp-add .input { height: 36px; background: var(--color-card); }
.sp-add .role { height: 36px; padding: 0 10px; border: 1px solid var(--color-input); border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; flex: none; }
.sp-people { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.sp-people li { display: flex; align-items: center; gap: 12px; padding: 6px 4px; font-size: 14px; }
.sp-people li .pav { width: 28px; height: 28px; border: 0; font-size: 11px; }
.sp-people li > span:not(.pav) { flex: 1; min-width: 0; line-height: 18px; }
.sp-people li small { font-size: 12px; color: var(--color-muted-foreground); }
.sp-notify { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-muted-foreground); margin-bottom: 12px; }
.sheet-scrim { position: fixed; inset: 36px 0 0; z-index: 50; background: rgb(0 0 0 / 50%); }
.sheet { position: fixed; top: 36px; right: 0; bottom: 0; z-index: 51; width: min(92vw, 640px); background: var(--color-background); border-left: 1px solid var(--color-border); display: flex; flex-direction: column; box-shadow: var(--agent-kit-drawer-elevation); }
.sheet-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; border-bottom: 1px solid var(--color-border); }
.sheet-h .t { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.sheet-h .t .hi { color: var(--slides-selection); }
.sheet-h .back { display: inline-flex; align-items: center; gap: 6px; color: var(--color-muted-foreground); }
.sheet-h .back:hover { color: var(--color-foreground); }
.ver { width: 100%; text-align: left; border-radius: 6px; padding: 10px 12px; display: flex; gap: 12px; }
.ver:hover { background: var(--color-accent); }
.ver .dot { margin-top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--slides-selection); flex: none; }
.ver b { font-size: 14px; font-weight: 500; }
.ver .when { margin-left: 8px; font-size: 10px; color: var(--color-muted-foreground); }
.ver small { display: block; margin-top: 2px; font-size: 11px; color: var(--color-muted-foreground); }
.ver small.why { color: color-mix(in srgb, var(--color-muted-foreground) 80%, transparent); }
.snap-h { padding: 12px 16px; border-bottom: 1px solid var(--color-border); }
.snap-h b { font-size: 14px; font-weight: 500; }
.snap-h small { display: block; margin-top: 2px; font-size: 11px; color: var(--color-muted-foreground); }
.snap-g { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
.snap-g p { margin: 6px 0 0; font-size: 11px; color: var(--color-muted-foreground); }
.snap-f { padding: 12px; border-top: 1px solid var(--color-border); }
.snap-f .b { width: 100%; }
.dlg-scrim { position: fixed; inset: 0; z-index: 80; background: rgb(0 0 0 / 80%); display: grid; place-items: center; }
.dlg { width: min(512px, calc(100vw - 32px)); background: var(--color-background); border: 1px solid var(--color-border); border-radius: 8px; padding: 24px; box-shadow: var(--agent-kit-overlay-elevation); }
.dlg h2 { margin: 0; font-size: 18px; font-weight: 600; }
.dlg p { margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--color-muted-foreground); }
.dlg .f { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
.add-pop { width: min(420px, calc(100vw - 24px)); padding: 12px; border-radius: 12px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 60%); }
.add-pop .h { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px; font-size: 14px; font-weight: 500; }
.add-pop .opt { width: 100%; margin-bottom: 4px; padding: 8px 10px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: color-mix(in srgb, var(--color-foreground) 90%, transparent); text-align: left; }
.add-pop .opt:hover { background: var(--color-accent); }
.add-pop .opt svg { color: var(--color-muted-foreground); }
.add-pop .opt small { margin-left: auto; font-size: 11px; color: var(--color-muted-foreground); }
.add-pop hr { border: 0; height: 1px; background: var(--color-border); margin: 4px -12px 8px; }
.add-pop .composer { min-height: 0; box-shadow: none; }
.shape-pop { padding: 6px; width: 208px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.shape-pop button { width: 36px; height: 36px; border-radius: 6px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.shape-pop button:hover { background: var(--color-accent); color: var(--color-foreground); }
.shape-pop svg { width: 20px; height: 20px; }
.color-pop { padding: 12px; width: 232px; }
.color-pop .lbl { font-size: 11px; font-weight: 500; color: var(--color-muted-foreground); margin-bottom: 8px; }
.color-pop .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
.color-pop .row button { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--color-border); }
.color-pop .row button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--slides-selection); }
.tip { position: fixed; z-index: 90; padding: 6px 12px; border-radius: 6px; background: var(--color-primary); color: var(--color-primary-foreground); font-size: 12px; pointer-events: none; white-space: nowrap; }
.work { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: min(calc(100vw - 2rem), 384px); z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-popover) 95%, transparent); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 20%); font-size: 14px; font-weight: 500; }
.work .l { display: flex; align-items: center; gap: 8px; }
.work .l svg { color: var(--slides-selection); }
.work button { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--color-border); font-size: 12px; font-weight: 400; color: var(--color-muted-foreground); }
.work button:hover { background: var(--color-accent); }

/* ───────── agent chat (toolkit AgentSidebar): 380 default, nav surface, 13px density ───────── */
.agent { flex: none; width: 0; overflow: clip; transition: width 260ms var(--ease-drawer); background: var(--agent-kit-nav-surface); display: flex; font-size: 13px; }
.agent.open { width: 380px; border-left: 1px solid hsl(var(--border)); }
.agent-in { width: 380px; min-width: 380px; display: flex; flex-direction: column; height: 100%; }
.ag-h { flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px; }
.ag-tabs { display: flex; gap: 2px; min-width: 0; }
.ag-tab { position: relative; min-width: 56px; max-width: 150px; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 500; color: var(--color-muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 6px; }
.ag-tab:hover { background: var(--color-accent); }
.ag-tab[aria-selected="true"] { background: var(--color-accent); color: var(--color-foreground); }
.ag-tab .run { width: 6px; height: 6px; border-radius: 50%; background: var(--slides-agent); animation: blink 1.2s infinite; flex: none; }
.ag-acts { display: flex; gap: 2px; flex: none; }
.ag-acts button { width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.ag-acts button:hover { color: var(--color-foreground); background: color-mix(in srgb, var(--color-accent) 50%, transparent); }
.ag-b { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; }
.ag-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: color-mix(in srgb, var(--color-muted-foreground) 60%, transparent); }
.ag-empty svg { width: 20px; height: 20px; }
.msg { font-size: 14px; line-height: 1.52; margin-bottom: 20px; }
.msg-u { align-self: flex-end; max-inline-size: min(88%, 38rem); background: hsl(var(--muted)); border-radius: 8px; padding: 10px 13px; white-space: pre-wrap; }
.msg-a p { margin: 0 0 10px; }
.msg-a p:last-child { margin: 0; }
.msg-a ul { margin: 0 0 10px; padding-left: 20px; }
.acts-d { font-size: 13px; color: var(--color-muted-foreground); margin-bottom: 12px; }
.acts-d > button { display: inline-flex; align-items: center; gap: 6px; }
.acts-d > button:hover { color: var(--color-foreground); }
.acts-d > button svg { transition: transform .15s; }
.acts-d.open > button svg { transform: rotate(90deg); }
.acts-d .rows { margin-top: 4px; }
.act { display: flex; gap: 8px; padding: 4px 0; align-items: center; }
.act svg { width: 16px; height: 16px; stroke-width: 1.7; flex: none; }
.thinking { font-size: 14px; font-weight: 500; background: linear-gradient(90deg, var(--color-muted-foreground) 30%, var(--color-foreground) 50%, var(--color-muted-foreground) 70%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
.ag-sugs { display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px; scrollbar-width: none; }
.ag-f { flex: none; padding: 0 12px 12px; }
.ag-f .composer { border-radius: 14px; border: 1px solid hsl(var(--border) / .9); min-height: 0; box-shadow: 0 .5rem 1.875rem hsl(var(--foreground) / .06); }
.ag-f .cmp-input { min-height: 52px; padding: 12px 14px 4px; }
.ag-f .cmp-bar { padding: 6px 8px 8px; }
.ag-f .cmp-send { width: 28px; height: 28px; }
.ag-f .cmp-btn { border-radius: 6px; }
.ctx-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 0; }
.ctx-chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; border: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-muted) 50%, transparent); padding: 2px 4px 2px 8px; font-size: 11px; font-weight: 500; }
.ctx-chip button { width: 16px; height: 16px; display: grid; place-items: center; color: var(--color-muted-foreground); border-radius: 4px; }
.ctx-chip button:hover { background: var(--color-accent); color: var(--color-foreground); }

/* ───────── presentation (PresentationView, PresenterView) ───────── */
.present-v { position: fixed; inset: 36px 0 0; z-index: 70; background: var(--slides-stage); overflow: hidden; display: grid; place-items: center; cursor: none; }
.present-v.show { cursor: default; }
.present-v .bar { position: absolute; inset: auto 0 0; transition: opacity .3s, transform .3s; opacity: 0; transform: translateY(16px); }
.present-v.show .bar { opacity: 1; transform: none; }
.present-v .bar-in { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; background: linear-gradient(to top, rgb(0 0 0 / 80%), transparent); color: #fff; }
.present-v .ctr { font-family: var(--mono); font-size: 14px; color: rgb(255 255 255 / 50%); min-width: 120px; }
.present-v .grp { display: flex; gap: 8px; min-width: 120px; justify-content: flex-end; }
.present-v .grp.c { justify-content: center; min-width: 0; }
.pv-b { padding: 8px; border-radius: 8px; background: rgb(255 255 255 / 10%); color: #fff; display: grid; place-items: center; }
.pv-b:hover { background: rgb(255 255 255 / 20%); }
.pv-b[disabled] { opacity: .3; cursor: default; }
.present-v .prog { height: 2px; background: rgb(255 255 255 / 10%); }
.present-v .prog i { display: block; height: 100%; background: var(--slides-selection); transform-origin: left; transition: transform .3s; }
.present-v .fs { position: absolute; top: 16px; right: 16px; display: flex; align-items: center; gap: 8px; border-radius: 8px; background: rgb(255 255 255 / 10%); padding: 12px 16px; font-size: 14px; color: #fff; z-index: 2; }
.present-v .fs:hover { background: rgb(255 255 255 / 20%); }
.presenter { position: fixed; inset: 36px 0 0; z-index: 70; display: flex; flex-direction: column; background: var(--slides-presenter); color: #fff; }
.presenter .h { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border-bottom: 1px solid rgb(255 255 255 / 10%); }
.presenter .h .ctr { font-family: var(--mono); font-size: 14px; color: rgb(255 255 255 / 50%); }
.presenter .h .tm { font-family: var(--mono); font-size: 24px; color: rgb(255 255 255 / 80%); font-variant-numeric: tabular-nums; }
.presenter .h .acts { display: flex; gap: 8px; }
.presenter .bd { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 16px; }
.presenter .top { display: flex; gap: 16px; }
.presenter .cur { width: 66.666%; border-radius: 8px; overflow: hidden; background: #000; }
.presenter .nx { width: 33.333%; display: flex; flex-direction: column; gap: 8px; }

    { acts: "Thinking", running: true, rows: [["book-2", "Read Fieldnote 2.0 PRD.pdf"], ["code", "Created deck Fieldnote 2.0 launch plan"], ["code", "Added slide 1: Fieldnote 2.0"], ["code", "Added slide 2: Why now"], ["code", "Added slide 3: The idea"], ["code", "Added slide 4: What ships"]] },

const SUGGESTIONS = ["Build a 10-slide pitch from this doc", "Apply our brand to this deck", "Generate a hero image for this slide"];
let chatOpenActs = new Set();
function chatKey() { if (S.chat === "new") return "new"; if (S.screen !== "editor") return S.chat === "deck" ? "new" : S.chat; return generating() ? "gen" : S.chat; }
function renderAgent() {
  const el = $("#agent-in"); if (!el) return;

  const chip = S.screen === "editor" ? (S.el ? "Current Selection" : `Slide ${S.cur + 1}`) : "";
  el.innerHTML = `<div class="ag-h"><div class="ag-tabs" role="tablist">${tabs.map(([id, t]) => `<button class="ag-tab" role="tab" aria-selected="true">${running ? '<span class="run"></span>' : ""}${esc(t)}</button>`).join("")}</div><div class="ag-acts"><button data-act="new-chat" data-tip="New chat" aria-label="New chat">${ic("plus", "s14")}</button><button id="ag-menu" data-tip="Agent panel options" aria-label="Agent panel options" aria-haspopup="menu">${ic("dots-vertical", "s14")}</button><button data-act="agent" data-tip="Collapse sidebar" aria-label="Collapse sidebar">${ic("x", "s14")}</button></div></div>

function sendToAgent(text) {
  if (!text.trim()) return;
  if (S.screen !== "editor" && S.chat !== "new") S.chat = "new";
  const key = chatKey(), c = CHATS[key];
  if (key === "new") c.title = text.length > 28 ? text.slice(0, 28) + "…" : text;
  c.msgs.push({ u: text });
  const n = S.cur + 1, act = { acts: "Thinking", running: true, rows: S.screen === "editor" ? [["book-2", `Read slide ${n}`]] : [["search", "Searched your decks"]] };
  c.msgs.push(act);
  renderAgent();
  const s = S.screen === "editor" ? curSlide() : null;
  if (s) { s.aiEditing = true; renderEditor(); }
  setTimeout(() => {
    act.running = false; act.acts = "Worked for 6s";
    if (s) { act.rows.push(["code", `Updated slide ${n}`]); delete s.aiEditing; }
    c.msgs.push({ a: s ? `<p>Done. I updated slide ${n} and kept your speaker notes. Take a look and tell me what to adjust.</p>` : "<p>You have six decks. The most recent is Fieldnote 2.0 launch plan, edited 12 minutes ago. Want me to open it?</p>" });
    renderAgent(); if (S.screen === "editor") renderEditor();
  }, 1600);
}

/* ───────── generation (deck mid-generation scenario) ───────── */
let genTimer = null;
function startGeneration() {
  clearInterval(genTimer);
  S.gen = { done: GEN_DONE };
  const c = CHATS.gen; c.msgs = c.msgs.slice(0, 2); c.msgs[1].running = true; c.msgs[1].rows = c.msgs[1].rows.slice(0, 6);
  genTimer = setInterval(() => {
    if (S.scenario !== "generating") return clearInterval(genTimer);
    S.gen.done++;
    const sl = deck()?.slides[S.gen.done - 1];
    if (sl) c.msgs[1].rows.push(["code", `Added slide ${S.gen.done}: ${sl.html.match(/<h[12][^>]*>([^<]+)/)?.[1] || "Slide"}`]);
    if (S.gen.done >= 9) {
      clearInterval(genTimer);
      c.msgs[1].running = false; c.msgs[1].acts = "Worked for 1m 12s";
      c.msgs.push({ a: "<p>Your launch plan is ready: 9 slides covering why now, what ships, beta results, the timeline, and pricing. Speaker notes are on the slides that need them.</p><p>Want me to apply the Fieldnote design system to the charts next?</p>" });
      S.scenario = "default"; $("#scenario-sel").value = "default"; S.gen = null; S.genSel = false;
      toast("5 slides added");
    }
    if (S.screen === "editor") { renderEditor(); renderAgent(); renderWork(); }
  }, 4000);
}

  const list = presentable(), i = S.presenter.i, [s] = list[i], nx = list[i + 1], d = deck();

  v.innerHTML = `<div class="h"><span class="ctr">${i + 1} / ${list.length}</span><span class="tm">${mmss()}</span><span class="acts"><button class="pv-b" data-pv="prev" aria-label="Previous slide" ${i ? "" : "disabled"}>${ic("chevron-left")}</button><button class="pv-b" data-pv="next" aria-label="Next slide" ${nx ? "" : "disabled"}>${ic("chevron-right")}</button><button class="pv-b" data-pv="exit" aria-label="Close presenter view" data-tip="Close presenter view">${ic("x")}</button></span></div>
  <div class="bd"><div class="top"><div class="cur">${slideHTML(s, d.ds)}</div><div class="nx"><span class="cap">Up next</span>${nx ? `<div class="fr">${slideHTML(nx[0], d.ds)}</div>` : '<div class="end">End of deck</div>'}</div></div>
  <div class="nt"><span class="cap">Speaker notes</span>${s.notes ? `<p>${esc(s.notes)}</p>` : '<p class="none">No notes for this slide</p>'}</div></div>`;
  document.body.append(v); fitScales(v); v.focus();
  v.addEventListener("click", e => { const b = e.target.closest("[data-pv]"); if (!b) return; const a = b.dataset.pv; if (a === "prev") step(-1); else if (a === "next") step(1); else { S.presenter = null; clearInterval(presTimer); if (S.present) renderPresent(); else exitPresent(); } });
}

/* ───────── editor actions ───────── */
let clip = null, dragFrom = null;
function openDeck(id) { S.deck = id; S.screen = "editor"; S.cur = 0; S.sel = [deck().slides[0]?.id].filter(Boolean); S.el = null; S.comments = false; S.zoom = 100; S.genSel = false; if (S.scenario === "generating" && id === "launch") { startGeneration(); S.agentOpen = true; } render(); }
function selectSlide(i, e = {}) {
  const d = deck(), id = editorSlides()[i].id;
  if (e.shiftKey && S.sel.length) { const a = d.slides.findIndex(s => s.id === S.sel[0]); const [lo, hi] = [Math.min(a, i), Math.max(a, i)]; S.sel = d.slides.slice(lo, hi + 1).map(s => s.id); }
  else if (e.metaKey || e.ctrlKey) S.sel = S.sel.includes(id) ? S.sel.filter(x => x !== id) : [...S.sel, id];
  else S.sel = [id];
  S.cur = i; S.el = null; S.genSel = false;
  renderEditor(); renderAgent();
  $(`#rail [data-thumb="${i}"]`)?.focus();
}
function newSlideAfter(i) {
  const d = deck(), s = { id: "s" + uid++, layout: "content", html: "", notes: "" };
  d.slides.splice(i + 1, 0, s); S.cur = i + 1; S.sel = [s.id]; S.el = null; renderEditor();
  openAddSlide($(`#rail [data-thumb="${i + 1}"]`), i + 1);
}
function removeSlides(ids) { const d = deck(); d.slides = d.slides.filter(s => !ids.includes(s.id)); S.cur = Math.min(S.cur, d.slides.length - 1); S.sel = [d.slides[S.cur].id]; renderEditor(); toast("Slide deleted"); }
function pasteAfter(i) { const d = deck(); const c = clip.map(s => ({ ...structuredClone(s), id: "s" + uid++ })); d.slides.splice(i + 1, 0, ...c); S.cur = i + 1; S.sel = [c[0].id]; renderEditor(); }
function moveSlide(from, to) { const d = deck(); const ids = S.sel.length > 1 ? S.sel : [d.slides[from].id]; const moving = d.slides.filter(s => ids.includes(s.id)); const rest = d.slides.filter(s => !ids.includes(s.id)); const before = d.slides.slice(0, to).filter(s => !ids.includes(s.id)).length; rest.splice(before, 0, ...moving); d.slides = rest; S.cur = d.slides.indexOf(moving[0]); renderEditor(); }
function renderGridOnly() { const g = $("#deck-grid"); if (!g) return; if (S.homeTab === "recent") g.innerHTML = renderDeckGrid(); fitScales(g); }

/* ───────── behavior ───────── */
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest(".menu, .pop, .sheet, .dlg-scrim, .present-v, .presenter")) return;
  const q = sel => t.closest(sel);
  let b;
  if ((b = q("[data-nav]"))) { S.screen = b.dataset.nav; S.renaming = null; return render(); }
  if ((b = q("[data-open]"))) { if (S.renaming) return; return openDeck(b.dataset.open); }
  if ((b = q("[data-star]"))) { const d = DECKS.find(x => x.id === b.dataset.star); d.starred = !d.starred; return renderGridOnly(); }
  if ((b = q("[data-deck-menu]"))) return deckMenu(b, DECKS.find(x => x.id === b.dataset.deckMenu));
  if ((b = q("[data-ds-menu]"))) return openMenu(b, [{ t: "Set as workspace default", icon: "building-community", run: () => toast("Set as the workspace default") }, "-", { t: "Delete", icon: "trash", danger: true, run: () => confirmDialog("Delete design system?", "This permanently deletes the design system. Decks using it keep their current look but are no longer linked to it.", "Delete", () => toast("Design system deleted"), true) }], { align: "right", minWidth: 224 });
  if ((b = q("[data-tpl-menu]"))) return openMenu(b, [run("Preview", () => previewTemplate(+b.dataset.tplMenu))], { align: "right" });
  if ((b = q("[data-use-tpl]"))) { const c = b.closest(".card"); c.insertAdjacentHTML("beforeend", `<div class="opening">${ic("loader-2", "spin")}Opening template…</div>`); return setTimeout(() => useTemplate(+b.dataset.useTpl), 700); }
  if ((b = q("[data-tab]"))) { S.homeTab = b.dataset.tab; return render(); }
  if ((b = q("[data-suggest]"))) return startFromPrompt(b.dataset.suggest);
  if ((b = q("[data-agent-suggest]"))) return sendToAgent(b.dataset.agentSuggest);
  if ((b = q("[data-cmp-add]"))) return composerAddMenu(b);
  if ((b = q("[data-cmp-model]"))) return modelMenu(b);
  if ((b = q("[data-cmp-mode]"))) { openMenu(b, [{ t: "Act", icon: "pencil", desc: "Use tools and make approved changes", run: () => {} }, { t: "Plan", icon: "clipboard-list", desc: "Read-only research and approval first", run: () => toast("Plan mode") }], { above: true, align: "right", minWidth: 272 }); return trailingCheck("Act"); }
  if ((b = q("[data-send]"))) { const inp = $("#" + b.dataset.send); const text = inp.innerText; inp.textContent = ""; b.disabled = true; return b.dataset.send === "home-input" ? startFromPrompt(text) : sendToAgent(text); }
  if (q("[data-stop]")) { clearInterval(genTimer); const c = CHATS.gen; c.msgs[1].running = false; c.msgs[1].acts = "Stopped"; S.scenario = "default"; $("#scenario-sel").value = "default"; S.gen = null; render(); return; }
  if (q("[data-chip-x]")) { q(".ctx-chip").remove(); return; }
  if ((b = q("[data-acts]"))) { const id = b.dataset.acts; chatOpenActs.has(id) ? chatOpenActs.delete(id) : chatOpenActs.add(id); return renderAgent(); }
  if (q("#import-btn")) return openMenu(q("#import-btn"), [run("PDF", () => toast("Choose a PDF file.")), run("Google Slides", () => toast("Paste a Google Slides link")), run("PPT", () => toast("Choose a PPTX file."))], { align: "right", minWidth: 160 });
  if (q("#filter-btn")) return openMenu(q("#filter-btn"), [{ t: "Mine", radio: true, on: S.filter === "mine", run: () => { S.filter = "mine"; render(); } }, { t: "All", radio: true, on: S.filter === "all", run: () => { S.filter = "all"; render(); } }], { minWidth: 128 });
  if (q("#org-btn")) return orgMenu(q("#org-btn"));
  if (q("#more-btn")) return moreMenu(q("#more-btn"));
  if (q("#share-btn")) return openShare(q("#share-btn"));
  if (q("#ag-menu")) return agentMenu(q("#ag-menu"));
  if (q("#shapes-btn")) { const p = popover(q("#shapes-btn"), SHAPES.map(([i, l]) => `<button aria-label="${l}" data-tip="${l}" data-shape="${l}">${ic(i)}</button>`).join(""), "shape-pop", { align: "left" }); p.setAttribute("role", "menu"); p.onclick = e2 => { const s = e2.target.closest("[data-shape]"); if (s) { p.remove(); toast(`Click on the slide to place a ${s.dataset.shape.toLowerCase()}`); } }; return; }
  if (q("#bg-btn")) return colorPop(q("#bg-btn"), "Slide background", DS[deck().ds].vars["--ds-bg"], c => { curSlide().html = curSlide().html; $("#stage .sl").style.background = c; curSlide().bg = c; toast("Slide background updated"); });
  if (q("#text-color")) return colorPop(q("#text-color"), "Text color", "", c => { const el = $(`#stage [data-el="${S.el}"]`); if (el) el.style.color = c; });
  if (q("#font-btn")) return pickMenu(q("#font-btn"), ["Inherit", "Sans Serif", "Serif", "Monospace", "Inter", "Poppins", "Playfair Display", "JetBrains Mono"], "Inter", f => toast(`Font: ${f}`));
  if (q("#weight-btn")) return pickMenu(q("#weight-btn"), ["Reg", "Med", "Semi", "Bold"], S.weight || "Bold", w => { S.weight = w; renderEditor(); });
  if (q("#align-btn")) return openMenu(q("#align-btn"), [["Left", "align-left"], ["Center", "align-center"], ["Right", "align-right"], ["Justify", "align-justified"]].map(([t, icon]) => ({ t, icon, run: () => { const el = $(`#stage [data-el="${S.el}"]`); if (el) el.style.textAlign = t.toLowerCase(); } })), { minWidth: 160 });
  if (q("#arrange-btn")) return openMenu(q("#arrange-btn"), [{ label: "Position" }, { t: "Left" }, { t: "Center" }, { t: "Right" }, "-", { t: "Top" }, { t: "Middle" }, { t: "Bottom" }, "-", { t: "Send to back", icon: "stack-back" }, { t: "Send backward", icon: "stack-back" }, { t: "Bring to front", icon: "stack-front" }, { t: "Bring forward", icon: "stack-front" }], { minWidth: 176 });
  if ((b = q("[data-size]"))) { S.size = (S.size || 38) + +b.dataset.size; $("#size-v").textContent = S.size; const el = $(`#stage [data-el="${S.el}"]`); if (el) el.style.fontSize = S.size + "px"; return; }
  if ((b = q("[data-toggle]"))) { const kk = b.dataset.toggle; S[kk] = !S[kk]; b.setAttribute("aria-pressed", S[kk]); const el = $(`#stage [data-el="${S.el}"]`); if (el) el.style[kk === "italic" ? "fontStyle" : "textDecoration"] = S[kk] ? kk : ""; return; }
  if ((b = q("[data-zoom]"))) { S.zoom = Math.max(50, Math.min(200, S.zoom + 25 * +b.dataset.zoom)); return renderEditor(); }
  if ((b = q("[data-thumb]"))) return selectSlide(+b.dataset.thumb, e);
  if (q("[data-gen]")) { S.genSel = true; return renderEditor(); }
  if ((b = q("[data-goto]"))) return selectSlide(+b.dataset.goto);
  if ((b = q("[data-cm-scope]"))) { S.cmScope = b.dataset.cmScope; return renderEditor(); }
  if ((b = q("[data-cm-aud]"))) { S.cmAud = b.dataset.cmAud; return renderEditor(); }
  if ((b = q("#stage [data-el]")) && canEdit()) { S.el = b.dataset.el; renderEditor(); renderAgent(); return; }
  if (q("#canvas") && !q("#stage [data-el]")) { if (S.el) { S.el = null; renderEditor(); renderAgent(); } return; }
  if ((b = q("[data-act]"))) return act(b.dataset.act, b);
});
function act(a, b) {
  switch (a) {
    case "collapse": S.collapsed = !S.collapsed; return render();
    case "agent": S.agentOpen = !S.agentOpen; return render();
    case "back": S.screen = "home"; S.present = null; return render();
    case "present": return startPresent();
    case "new-slide": return newSlideAfter(S.cur);
    case "text-mode": S.textMode = !S.textMode; renderEditor(); return toast(S.textMode ? "Click anywhere on the slide to add a text box" : "Text box tool off");
    case "notes": S.notes = !S.notes; return renderEditor();
    case "comments": S.comments = !S.comments; return renderEditor();
    case "cm-filters": S.cmFilters = !S.cmFilters; return renderEditor();
    case "add-comment": if (!S.comments) { S.comments = true; renderEditor(); } return toast("Click anywhere to drop a comment pin");
    case "animations": return toast("Select an object on the slide to add a transition.");
    case "new-chat": S.chat = "new"; CHATS.new = { title: "New chat", msgs: [] }; return renderAgent();
    case "search-decks": S.screen = "home"; S.homeTab = "recent"; render(); return $("#deck-search")?.focus();
    case "new-ds": return toast("New Design System");
    case "feedback": return toast("Send feedback");
    case "bell": return toast("No notifications");
    case "voice": return toast("Listening…");
    case "list": return toast(b.getAttribute("aria-label"));
    case "backup": return toast("Backup downloaded");
    case "import-backup": return toast("Choose a valid Slides backup JSON file.");
    case "share-ds": return openShare(b, { title: "Fieldnote", visibility: "org" });
    default: toast(b.getAttribute("aria-label") || a);
  }
}
function startFromPrompt(text) {
  if (!text.trim()) return;
  S.scenario = "generating"; $("#scenario-sel").value = "generating";
  const c = CHATS.gen; c.msgs[0].u = text;
  DECKS = DECKS.length ? DECKS : DECKS_ALL();
  openDeck("launch");
}
document.addEventListener("contextmenu", e => {
  const th = e.target.closest("[data-thumb]");
  if (th) { e.preventDefault(); const i = +th.dataset.thumb; const id = editorSlides()[i].id; if (!S.sel.includes(id)) selectSlide(i); return thumbMenu({ target: $(`#rail [data-thumb="${i}"]`), clientX: e.clientX, clientY: e.clientY }, i); }
  const el = e.target.closest("#stage [data-el]");
  if (el && canEdit()) { e.preventDefault(); S.el = el.dataset.el; renderEditor(); return elementMenu({ target: $(`#stage [data-el="${S.el}"]`), clientX: e.clientX, clientY: e.clientY }); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "deck-search") { S.q = t.value; if (S.q.trim() && S.homeTab !== "recent") { S.homeTab = "recent"; render(); const i = $("#deck-search"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } else renderGridOnly(); }
  if (t.id === "tpl-search") { S.tq = t.value; const g = $("#tpl-grid"); const q = S.tq.trim().toLowerCase(); const list = TEMPLATES.map((x, i) => [x, i]).filter(([x]) => !q || (x[0] + x[1]).toLowerCase().includes(q)); g.innerHTML = list.map(([x, i]) => tplCard(x, i)).join("") || '<div class="empty-box">No templates match your search.</div>'; fitScales(g); }
  if (t.id === "deck-title") deck().title = t.value;
  if (t.id === "notes-ta") curSlide().notes = t.value;
  if (t.classList?.contains("cmp-input")) { const sb = t.closest(".composer").querySelector("[data-send]"); if (sb) sb.disabled = !t.innerText.trim(); }
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if (S.presenter || S.present) {
    if (["ArrowRight", "ArrowDown", " "].includes(e.key)) { e.preventDefault(); step(1); }
    else if (["ArrowLeft", "ArrowUp"].includes(e.key)) { e.preventDefault(); step(-1); }
    else if (e.key === "Escape") { if (S.presenter && S.present) { S.presenter = null; clearInterval(presTimer); renderPresent(); } else exitPresent(); }
    else if (!S.presenter && e.key.toLowerCase() === "s") openPresenter();
    else if (!S.presenter && e.key.toLowerCase() === "f") document.documentElement.requestFullscreen?.().catch(() => {});
    return;
  }
  if (t.id === "rename-in") {
    if (e.key === "Enter") { const d = DECKS.find(x => x.id === S.renaming); if (t.value.trim()) d.title = t.value.trim(); S.renaming = null; renderGridOnly(); }
    if (e.key === "Escape") { S.renaming = null; renderGridOnly(); }
    return;
  }
  if (t.classList?.contains("cmp-input") && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); t.closest(".composer").querySelector("[data-send]:not([disabled])")?.click(); return; }
  if (t.closest?.("input, textarea, [contenteditable]")) return;
  if (S.screen !== "editor" || $(".menu, .pop, .sheet, .dlg-scrim")) return;
  const n = editorSlides().length;
  if ((e.metaKey || e.ctrlKey) && (e.key === "ArrowUp" || e.key === "ArrowDown") && canEdit() && t.closest?.("#rail")) { e.preventDefault(); const to = e.shiftKey ? (e.key === "ArrowUp" ? 0 : n) : S.cur + (e.key === "ArrowUp" ? -1 : 2); moveSlide(S.cur, Math.max(0, Math.min(n, to))); $(`#rail [data-thumb="${S.cur}"]`)?.focus(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const i = Math.max(0, Math.min(n - 1, S.cur + (e.key === "ArrowDown" ? 1 : -1))); return selectSlide(i, { shiftKey: e.shiftKey && false }); }
  if (e.key === "Escape" && S.el) { S.el = null; renderEditor(); renderAgent(); }
  if (e.key.toLowerCase() === "t" && !e.metaKey && canEdit()) act("text-mode");
  if ((e.key === "Backspace" || e.key === "Delete") && t.closest?.("#rail") && canEdit() && n > 1) removeSlides(S.sel.length ? S.sel : [curSlide().id]);
});
document.addEventListener("focusout", e => { if (e.target.id === "rename-in") setTimeout(() => { if (!S.renaming) return; const d = DECKS.find(x => x.id === S.renaming); if (e.target.value.trim()) d.title = e.target.value.trim(); S.renaming = null; renderGridOnly(); }); });
// Rail drag to reorder, as the dnd-kit filmstrip does: a drop line marks where the slide lands.
document.addEventListener("dragstart", e => { const th = e.target.closest?.("[data-thumb]"); if (!th) return; dragFrom = +th.dataset.thumb; th.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(dragFrom)); });
document.addEventListener("dragover", e => {
  const th = e.target.closest?.("[data-thumb]"); if (dragFrom === null || !th) return;
  e.preventDefault(); $(".drop-line")?.remove();
  const r = th.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
  th.insertAdjacentHTML(after ? "afterend" : "beforebegin", '<div class="drop-line"></div>');
  th.closest("#rail").dataset.dropAt = +th.dataset.thumb + (after ? 1 : 0);
});
document.addEventListener("drop", e => { const rail = $("#rail"); if (dragFrom === null || !rail?.dataset.dropAt) return; e.preventDefault(); const to = +rail.dataset.dropAt, from = dragFrom; dragFrom = null; moveSlide(from, to); });
document.addEventListener("dragend", () => { dragFrom = null; $(".drop-line")?.remove(); document.querySelectorAll(".th.dragging").forEach(x => x.classList.remove("dragging")); });

// Tooltips: the shadcn Tooltip stands in as a small primary label under the control.
(() => {
  let tip = null, timer = null;
  const hide = () => { clearTimeout(timer); tip?.remove(); tip = null; };
  document.addEventListener("pointerover", e => {
    const b = e.target.closest?.("[data-tip]"); if (!b || b.contains(e.relatedTarget)) return;
    hide(); timer = setTimeout(() => {
      tip = document.createElement("div"); tip.className = "tip"; tip.textContent = b.dataset.tip; document.body.append(tip);
      const r = b.getBoundingClientRect(), side = b.closest(".app-left") ? "right" : "bottom";
      if (side === "right") { tip.style.left = r.right + 8 + "px"; tip.style.top = r.top + r.height / 2 - tip.offsetHeight / 2 + "px"; }
      else { tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2)) + "px"; tip.style.top = (r.bottom + 6 + tip.offsetHeight > innerHeight ? r.top - 6 - tip.offsetHeight : r.bottom + 6) + "px"; }
    }, 500);
  });
  document.addEventListener("pointerout", e => { const b = e.target.closest?.("[data-tip]"); if (b && !b.contains(e.relatedTarget)) hide(); });
  document.addEventListener("pointerdown", hide, true);
})();

/* ───────── review strip ───────── */
$("#theme-btn").addEventListener("click", () => {
  const nx = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nx;
  try { localStorage.setItem("slides-proto-theme", nx); } catch {}
});
$("#scenario-sel").addEventListener("change", e => {
  const v = e.target.value, was = S.scenario;
  S.scenario = v; S.gen = null; clearInterval(genTimer);
  if (v === "empty") { DECKS = []; S.homeTab = "templates"; S.screen = S.screen === "editor" ? "home" : S.screen; }
  else if (was === "empty" || !DECKS.length) { DECKS = DECKS_ALL(); S.homeTab = "recent"; }
  if (v === "generating") { DECKS = DECKS_ALL(); return openDeck("launch"); }
  if (v === "viewer" || v === "offline") { if (!deck()) DECKS = DECKS_ALL(); if (S.screen !== "editor") return openDeck("launch"); }
  render();
});
kitChangesInit($("#changes-btn"));
kitSettingsInit({ app: "Slides", mcpName: "slides", mcpUrl: "https://slides.agent-native.com/mcp" });
render();
</script>
