/* Toolkit Popover (rounded-md border shadow-md, text-sm) holding shadcn Tabs, Input, and Button; person rows follow the toolkit ShareDialog (h-7 avatars, xs muted role). */
.share-pop { position: fixed; z-index: 48; width: 360px; padding: 12px 16px; background: var(--color-popover); color: var(--color-foreground); border: 1px solid var(--color-border); border-radius: 6px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 10%), 0 2px 4px -2px rgb(0 0 0 / 10%); font-size: 14px; line-height: 20px; animation: swap .12s ease-out; }
.share-pop .sp-tabs { display: flex; height: 36px; padding: 4px; border-radius: 6px; background: var(--color-muted); color: var(--color-muted-foreground); }
.share-pop .sp-tabs button { flex: 1; border-radius: 4px; padding: 4px 12px; font-weight: 500; }
.share-pop .sp-tabs button[aria-selected="true"] { background: var(--color-background); color: var(--color-foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 5%), 0 1px 3px rgb(0 0 0 / 10%); }
.share-pop .sp-panes { display: grid; grid-template-columns: minmax(0, 1fr); }
.share-pop .sp-pane { grid-area: 1 / 1; padding-top: 12px; display: flex; flex-direction: column; }
.share-pop .sp-pane[aria-hidden="true"] { visibility: hidden; }
.share-pop .sp-invite { display: flex; gap: 8px; padding-bottom: 8px; }
.share-pop .sp-field { flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; gap: 4px; border: 1px solid var(--color-border); border-radius: 6px; padding: 0 4px 0 12px; background: var(--color-background); box-shadow: 0 1px 2px rgb(0 0 0 / 5%); }
.share-pop .sp-field:focus-within { border-color: var(--design-editor-accent-color); box-shadow: 0 0 0 3px var(--design-editor-selection-color); }
.share-pop .sp-field input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; color: var(--color-foreground); }
.share-pop .sp-role { height: 28px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px 0 8px; border-radius: 4px; color: var(--color-muted-foreground); font-size: 12px; flex: none; }
.share-pop .sp-role:hover { color: var(--color-foreground); background: var(--color-accent); }
.share-pop .sp-send { width: 36px; height: 36px; border-radius: 6px; display: grid; place-items: center; background: var(--color-primary); color: var(--color-primary-foreground); flex: none; }
.share-pop .sp-send[disabled] { opacity: .5; cursor: default; }
.share-pop .sp-label { padding: 8px 0 4px; font-size: 12px; line-height: 16px; color: var(--color-muted-foreground); font-weight: 500; }
.share-pop .sp-row { min-height: 36px; display: flex; align-items: center; gap: 12px; margin: 0 -8px; padding: 4px 8px; border-radius: 6px; text-align: left; width: calc(100% + 16px); }
.share-pop button.sp-row:hover { background: var(--color-accent); }
.share-pop .sp-row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.share-pop .sp-row .muted { color: var(--color-muted-foreground); font-size: 12px; }
.share-pop .sp-av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 600; flex: none; }
.share-pop .sp-av.ico { background: var(--color-muted); color: var(--color-muted-foreground); }
.share-pop .sp-av img { width: 16px; height: 16px; border-radius: 4px; }
.share-pop .sp-row svg { flex: none; color: var(--color-muted-foreground); }
.share-pop .sp-row > svg:first-child { width: 28px; }
.share-pop hr { border: 0; height: 1px; background: var(--color-border); margin: 8px -16px; }
.share-pop hr.sp-foot { margin-top: auto; }
.dlg-h .ic-tip { display: inline-grid; margin-left: 6px; color: var(--color-muted-foreground); cursor: help; }
.nudge-b { gap: 8px; }
.nudge-row { display: flex; align-items: center; justify-content: space-between; height: 32px; font-size: 13px; }
.nudge-row small { margin-left: 8px; color: var(--color-muted-foreground); font-size: 12px; }
.nudge-in { display: inline-flex; align-items: center; gap: 6px; color: var(--color-muted-foreground); }
.nudge-in input { width: 64px; height: 32px; border: 1px solid var(--color-border); border-radius: 8px; padding: 0 8px; background: var(--color-background); color: var(--color-foreground); font: inherit; text-align: right; }
.nudge-in input:focus { outline: none; border-color: var(--design-editor-accent-color); box-shadow: 0 0 0 3px var(--design-editor-selection-color); }
/* An empty design: the canvas offers the three ways to start, centered, with no heading. Dropped files import. */
.canvas.empty .canvas-scroll { display: none; }
.empty-canvas { display: none; }
.canvas.empty .empty-canvas { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: none; }
.btn.ghost:hover { background: var(--color-accent); }
.canvas.drop { box-shadow: inset 0 0 0 2px var(--design-editor-accent-color); }

.chip select { border: 0; background: none; font: inherit; color: inherit; outline: none; }
.labs-tag { font-size: 10px; font-weight: 600; color: hsl(270 60% 55%); }



/* Below 1200px the groups no longer fit around a centred route: the route takes the leftover middle instead, and
   the inspector's group keeps its own column so it never wraps under the bar. */
@media (max-width: 1199px) { .topbar, .app:not(.no-inspector) .topbar { grid-template-columns: max-content minmax(0, 1fr) max-content max-content; } .tb-center { min-width: 0; } .tb-center .select.route { width: auto; flex: 1; min-width: 96px; max-width: 264px; } .tb-insp .avatars { display: none; } }
.tb-left-extra .select .nar { display: none; }
/* Without the inspector, Interact's device and theme pickers drop their labels to leave the route room. */
@media (max-width: 1100px) { .app { grid-template-columns: 56px var(--panel-w) minmax(0, 1fr) 0; } .insp { display: none; } .tb-left-extra .select .v { display: none; } .tb-left-extra .select .nar { display: contents; } }
@media (max-width: 900px) { .tb-insp .btns .bsplit:first-child, .tb-left-extra .select .chev { display: none; } .tb-left-extra .select { padding-inline: 4px; } .tb-center .select.route { min-width: 64px; } }
@media (max-width: 820px) {
  .app, .app.no-panel { grid-template-columns: 56px 0 minmax(0, 1fr) 0; } .panel { display: none; }
  .topbar { gap: 8px; } .tb-left-extra, .avatars, .review .ver, .chip .k { display: none; } .topbar, .app:not(.no-inspector) .topbar { grid-template-columns: auto minmax(0, 1fr) auto auto; } .tb-center .select.route { width: 100%; min-width: 0; } .tb-center .nav-btns:first-child { display: none; }
}
/* ───────── v2 shell: islands over a full-bleed canvas ───────── */
/* Every floating surface is one material: the background, an outside 1px ring that takes no layout room (so a
   240px island still holds the inspector's 8 + 224 + 8 grid), and a soft shadow. Islands sit 8px from the window
   and from each other; each header is 48px, the same height as the mode bar, so the top edge reads as one line. */
:root { --isl-ring: 0 0 0 1px var(--color-border); --isl-shadow: var(--isl-ring), 0 1px 2px rgb(0 0 0 / 5%), 0 6px 20px rgb(0 0 0 / 6%); --agent: hsl(262 70% 56%); --agent-soft: hsl(262 70% 56% / 10%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --isl-shadow: var(--isl-ring), 0 6px 20px rgb(0 0 0 / 40%); --agent: hsl(262 85% 72%); --agent-soft: hsl(262 85% 72% / 14%); --primary: 0 0% 96%; --primary-foreground: 0 0% 9%; } }
:root[data-theme="dark"] { --isl-shadow: var(--isl-ring), 0 6px 20px rgb(0 0 0 / 40%); --agent: hsl(262 85% 72%); --agent-soft: hsl(262 85% 72% / 14%); --primary: 0 0% 96%; --primary-foreground: 0 0% 9%; }

.app { display: block; position: relative; --occ-l: 312px; --occ-r: 256px; }
.app .rail, .app .topbar { display: none !important; }
.app .canvas { position: absolute; inset: 0; }
/* The dot grid scrolls with the frame (attachment: local) and stays off in Interact, where the page is the whole window. */
.app .canvas-scroll { background-image: radial-gradient(circle, var(--hy-canvas-dot, color-mix(in srgb, var(--color-foreground) 7%, transparent)) 1px, transparent 1.4px); background-size: 20px 20px; background-attachment: local; }
.app.preview .canvas-scroll { background-image: none; }
.canvas-inner { padding: 80px var(--occ-r) 160px var(--occ-l); transition: padding .16s ease; }

/* left island: file header, tabs, then the tab's panel */
.app .panel { position: absolute; z-index: 7; top: 8px; left: 8px; bottom: 8px; width: var(--panel-w); border: 0; border-radius: 12px; box-shadow: var(--isl-shadow); overflow: hidden; display: flex; flex-direction: column; }
.app .file-head { height: 48px; padding: 8px; gap: 4px; flex: none; }
.app .file-head .file-id { padding: 0 4px; }
.app .file-head #app-menu-btn svg, .app .file-head #app-menu-btn img { width: 18px; height: 18px; }
.isl-tabs { flex: none; height: 40px; padding: 6px 8px; box-shadow: inset 0 -1px 0 var(--color-border); }
.isl-tabs .kit-seg { display: flex; width: 100%; }
.isl-tabs .kit-seg button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.isl-tabs .n { min-width: 16px; height: 16px; padding-inline: 4px; border-radius: 8px; background: var(--design-editor-accent-color); color: var(--on-brand); font-size: 10px; line-height: 16px; font-weight: 600; }
.app .file-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.app .file-view[hidden] { display: none; }
.app .panel .agents .ag-head { border-bottom: 0; height: 40px; }
/* Collapsed: the island shrinks to its header, which keeps the file, the branch, and the way back. */
.app.no-panel .panel { bottom: auto; width: auto; max-width: calc(100% - 16px); }
.app.no-panel .panel > :not(.file-head) { display: none !important; }
.app.no-panel .file-head .file-id { flex: none; }
.pill-branch { display: none; }
.app.no-panel .pill-branch { display: contents; }

/* right island: presence and Share, then the inspector */
.isl-r { position: absolute; z-index: 7; top: 8px; right: 8px; bottom: 8px; width: 240px; border-radius: 12px; background: var(--color-background); box-shadow: var(--isl-shadow); display: flex; flex-direction: column; overflow: hidden; }
.isl-head { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--color-border); }
.isl-head .grow { flex: 1; }
.app .insp { border: 0; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.app.rc .isl-r, .app.no-inspector .isl-r { bottom: auto; width: auto; }
.app.rc .isl-r .insp, .app.no-inspector .isl-r .insp { display: none; }
.app.rc .isl-head, .app.no-inspector .isl-head { border-bottom: 0; }
.no-inspector #insp-collapse { display: none; }
.stack { display: flex; align-items: center; }
.stack > button, .stack > span { width: 24px; height: 24px; border-radius: 50%; margin-right: -6px; display: grid; place-items: center; font-size: 10px; font-weight: 600; color: #fff; box-shadow: 0 0 0 2px var(--color-background); position: relative; }
.stack > :last-child { margin-right: 0; }
.stack > button:hover { z-index: 2; }
.stack .ag { background: var(--agent); }
.stack .ag svg.i { width: 14px; height: 14px; }
.stack .ag.busy::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid transparent; border-top-color: var(--agent); animation: spin 1s linear infinite; }
/* One control: outer corners round, inner corners square, a hairline in the button's own text color between the halves. */
.isl-head .bsplit { gap: 0; }
.isl-head .bsplit .btn { height: 28px; font-size: 13px; border-radius: 8px 0 0 8px; }
.isl-head .bsplit .btn + .btn { width: 24px; border-radius: 0 8px 8px 0; box-shadow: inset 1px 0 0 color-mix(in srgb, var(--color-primary-foreground) 24%, transparent); }
.isl-head .bsplit .btn + .btn svg.i { width: 14px; height: 14px; }

/* mode bar: top centre over the canvas, the same 48px as the island headers */
.modebar { position: absolute; z-index: 6; top: 8px; left: var(--occ-l); right: var(--occ-r); display: flex; justify-content: center; pointer-events: none; transition: left .16s ease, right .16s ease; }
.modebar .mb { pointer-events: auto; height: 48px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 12px; background: var(--color-background); box-shadow: var(--isl-shadow); white-space: nowrap; }
.modebar .vsep { width: 1px; height: 20px; background: var(--color-border); flex: none; }
.modebar .select { height: 28px; font-size: 13px; }
.modebar .select.route { width: 200px; }
.modebar .zoom { border: 0; padding-inline: 8px 6px; font-variant-numeric: tabular-nums; }

/* tool column: the real tool set on the canvas's left edge; a corner mark means the tool has variants */
.app .dock { left: calc(var(--occ-l) - 56px); top: 50%; bottom: auto; transform: translateY(-50%); flex-direction: column; gap: 4px; padding: 4px; background: var(--color-background); color: var(--color-foreground); box-shadow: var(--isl-shadow); border-radius: 12px; transition: left .16s ease; }
.vt { position: relative; width: 32px; height: 32px; }
.vt .main { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--color-foreground); }
.vt .main:hover { background: var(--color-accent); }
.vt .main[aria-pressed="true"] { background: var(--design-editor-accent-color); color: var(--on-brand); }
.vt .corner { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 0 0 8px 0; }
.vt .corner::after { content: ""; position: absolute; right: 3px; bottom: 3px; border-style: solid; border-width: 0 0 5px 5px; border-color: transparent transparent currentColor transparent; color: var(--color-muted-foreground); }
.vt .main[aria-pressed="true"] + .corner::after { color: color-mix(in srgb, var(--on-brand) 70%, transparent); }
.vt .corner:hover::after, .vt .corner[aria-expanded="true"]::after { color: var(--color-foreground); }
.vt .main[aria-pressed="true"] ~ .badge { display: none; }

/* agent bar: the agent lives on the canvas, centred under the frame, so Layers never leave the screen */
.agentbar { position: absolute; z-index: 6; left: var(--occ-l); right: var(--occ-r); bottom: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; transition: left .16s ease, right .16s ease; }
.agentbar > * { pointer-events: auto; width: min(560px, 100%); }
.agentbar .composer.live { margin: 0; box-shadow: var(--isl-shadow); border: 0; border-radius: 12px; padding: 8px; gap: 4px; }
.agentbar .composer .ctx { min-height: 20px; }
.agentbar .composer .ask-input { font-size: 13px; line-height: 20px; min-height: 20px; padding: 4px 4px 0; }
.agentbar .composer .cb .r { display: flex; align-items: center; gap: 4px; }
.agentbar .composer .send { width: 28px; height: 28px; }
.agentbar .composer .send.stop { background: var(--color-foreground); }
.agentbar .composer .send.stop i { width: 10px; height: 10px; border-radius: 2px; background: var(--color-background); display: block; }
.cx { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding-inline: 6px 2px; border-radius: 6px; background: var(--color-muted); font-size: 11px; max-width: 240px; white-space: nowrap; }
.cx > span { overflow: hidden; text-overflow: ellipsis; }
.cx.cmp { color: var(--design-editor-component-color); }
.cx .x { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.cx .x:hover { background: var(--color-border); color: var(--color-foreground); }
.cx.ghost { background: none; color: var(--color-muted-foreground); padding-inline: 2px; }
.composer .skill-ref.who { background: var(--color-muted); color: var(--color-foreground); }
.composer .skill-ref.lyr { background: var(--design-editor-selection-color); color: var(--brand-ink); }
.agentbar .mention-pop.slash { right: auto; width: 320px; }
.agentbar .mention-pop.slash[data-kind="/"] { width: 400px; }
.steps-fold { display: inline-flex; align-items: center; gap: 4px; height: 20px; color: var(--color-muted-foreground); align-self: flex-start; border-radius: 4px; }
.steps-fold:hover { color: var(--color-foreground); }
.steps-fold svg { transition: transform .12s; }
.steps-fold[aria-expanded="true"] svg { transform: rotate(90deg); }
.mention-pop.slash .grp { padding: 6px 8px 2px; font-size: 11px; color: var(--color-muted-foreground); font-weight: 500; }

.ab-thread { background: var(--color-background); box-shadow: var(--isl-shadow); border-radius: 12px; display: flex; flex-direction: column; max-height: min(296px, calc(100vh - 320px)); overflow: hidden; animation: swap .14s ease-out; }
.ab-th { height: 40px; flex: none; display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 12px; border-bottom: 1px solid var(--color-border); }
.ab-th .title { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 4px; margin-left: -4px; border-radius: 6px; font-size: 12px; font-weight: 600; min-width: 0; }
.ab-th .title:hover { background: var(--color-accent); }
.ab-th .title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ab-th .title svg { color: var(--color-muted-foreground); }
.ab-th .grow { flex: 1; }
.ab-th .icon-btn { width: 28px; height: 28px; color: var(--color-muted-foreground); }
.ab-th .icon-btn:hover { color: var(--color-foreground); background: var(--color-accent); }
.ab-msgs { overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; line-height: 18px; }
.ab-msgs > * { flex: none; }
.ab-msgs .msg-user { max-width: 85%; padding: 6px 10px; }
.ab-msgs .msg-user .skill-ref { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding-inline: 5px; border-radius: 5px; background: var(--design-editor-selection-color); color: var(--brand-ink); font-weight: 500; }
.ab-msgs .msg-user .skill-ref svg.i { width: 12px; height: 12px; }
.ab-msgs .step.stopped .dot::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--color-muted-foreground); }
.lchip { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding-inline: 4px; border-radius: 5px; background: var(--color-muted); font-weight: 500; vertical-align: baseline; }
.lchip:hover { background: var(--design-editor-selection-color); color: var(--brand-ink); }
.lchip svg.i { width: 12px; height: 12px; }
.rcpt { border-radius: 10px; box-shadow: inset 0 0 0 1px var(--color-border); overflow: hidden; }
.rcpt .r { height: 32px; display: grid; grid-template-columns: 16px 1fr auto 12px auto; align-items: center; column-gap: 8px; padding-inline: 10px; font-size: 12px; }
.rcpt .r + .r { box-shadow: inset 0 1px 0 var(--color-border); }
.rcpt .r svg.i { color: var(--color-muted-foreground); }
.rcpt .r .o { color: var(--color-muted-foreground); text-decoration: line-through; font-variant-numeric: tabular-nums; }
.rcpt .r .n { font-weight: 500; font-variant-numeric: tabular-nums; }
.rcpt .r.note { grid-template-columns: 16px 1fr; }
.rcpt.undone .r .n { text-decoration: line-through; color: var(--color-muted-foreground); }
.rcpt .r[data-hl]:hover { background: var(--color-accent); }
.page .hl-node { outline: 2px solid var(--agent) !important; outline-offset: 2px; }
.done-l { display: flex; align-items: center; gap: 8px; min-height: 24px; }
.done-l .grow { flex: 1; }
.btn.sm { height: 24px; font-size: 12px; border-radius: 6px; padding-inline: 8px; color: var(--color-muted-foreground); }
.btn.sm:hover { color: var(--color-foreground); }
.tok-l { display: flex; align-items: center; gap: 6px; color: var(--color-muted-foreground); font-size: 11px; line-height: 16px; }
.tok-l .lnk { color: var(--brand-ink); font-weight: 500; }
.tok-l .lnk:hover { text-decoration: underline; text-underline-offset: 2px; }
.ab-reply-w { position: relative; }
.ab-reply-w .ab-reply { width: 100%; padding-right: 44px; }
.ab-reply-w .ab-x { position: absolute; right: 6px; top: 6px; width: 28px; height: 28px; color: var(--color-muted-foreground); }
.ab-reply-w .ab-x:hover { background: var(--color-accent); color: var(--color-foreground); }
.mention-pop.slash .ds { visibility: hidden; }
.mention-pop.slash[data-kind="/"] .ds { visibility: visible; flex: 1; margin-left: 8px; max-width: none; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mention-pop.slash[data-kind="/"] .nm { flex: none; font-weight: 400; }
.mention-pop.slash [aria-selected="true"] .ds, .mention-pop.slash button:hover .ds { visibility: visible; }
.mav { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 600; flex: none; }
.agentbar .mention-pop.slash button { font-size: 13px; }
.agentbar .composer .send.empty { background: var(--color-muted); color: var(--color-muted-foreground); }
/* The selection's name and size are canvas chrome: they stay 10px at any zoom. */
.page .sel-tag { transform: scale(var(--inv-z, 1)); transform-origin: bottom left; }
.page .sel-size { transform: translateX(-50%) scale(var(--inv-z, 1)); transform-origin: top center; }
/* Layer names run to the row's edge; the hide and lock buttons only take room on hover. */
.tree .row:not(.br) .trail { position: absolute; right: 8px; margin: 0; padding-left: 8px; display: none; background: inherit; }
.tree .row:not(.br):hover .trail { display: flex; }
.tree .row:not(.br):hover { background: var(--color-accent); }
.app .panel .agents .tk-count { visibility: hidden; }
.rcpt .f { height: 40px; display: flex; align-items: center; gap: 8px; padding-inline: 6px 10px; box-shadow: inset 0 1px 0 var(--color-border); color: var(--color-muted-foreground); font-size: 11px; }
.rcpt .f .grow { flex: 1; }
.rcpt .f .btn { height: 24px; font-size: 12px; border-radius: 6px; padding-inline: 8px; }
.btn.ghost { background: none; }
.btn.ghost:hover { background: var(--color-accent); }
.ab-reply { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border-radius: 12px; background: var(--color-background); box-shadow: var(--isl-shadow); font-size: 12px; text-align: left; }
.ab-reply .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ab-reply .m { color: var(--color-muted-foreground); }
.ab-reply svg { color: var(--color-muted-foreground); }
.ab-reply .spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--color-border); border-top-color: var(--agent); animation: spin .8s linear infinite; flex: none; }

/* the agent on the canvas: a labelled frame on the layer it's editing and its cursor */
.agent-on .page .sel-tag, .agent-on .page .sel-size { display: none; }
.tool-tip { position: fixed; z-index: 90; pointer-events: none; height: 24px; padding-inline: 8px; border-radius: 6px; background: var(--color-foreground); color: var(--color-background); font-size: 12px; line-height: 24px; white-space: nowrap; display: flex; gap: 8px; }

.tool-tip .l { display: flex; gap: 8px; }
.tool-tip .d { font-size: 11px; line-height: 16px; opacity: .72; }
#ag-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.ag-frame { position: absolute; border: 1.5px solid var(--agent); border-radius: 2px; transition: all .35s cubic-bezier(.2, .8, .2, 1); }
.ag-frame .lbl { position: absolute; left: -1.5px; top: -22px; height: 20px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 4px 4px 4px 0; background: var(--agent); color: var(--on-brand); font: 500 11px/20px var(--font); white-space: nowrap; }
.ag-frame .lbl svg.i { width: 12px; height: 12px; }
@keyframes agpulse { 50% { opacity: .35; } }
.ag-cursor { position: absolute; transition: left .6s cubic-bezier(.2, .8, .2, 1), top .6s cubic-bezier(.2, .8, .2, 1); color: var(--agent); }
.ag-cursor svg { display: block; filter: drop-shadow(0 1px 1px rgb(0 0 0 / 25%)); }
.ag-cursor .nm { display: none; }
.ag-cursor .x { position: absolute; left: 14px; top: 16px; height: 18px; padding: 0 6px; border-radius: 9px; background: var(--agent); color: var(--on-brand); font: 500 11px/18px var(--font); white-space: nowrap; }

/* branches in the File tab */
.row.br .ico { color: var(--color-muted-foreground); }
.row.br[aria-selected="true"] .ico { color: var(--color-foreground); }
.row.br .meta { margin-left: 8px; color: var(--color-muted-foreground); font-size: 11px; display: inline-flex; align-items: center; gap: 4px; flex: none; height: 20px; padding-inline: 2px; border-radius: 4px; }
.row.br .meta i { width: 6px; height: 6px; border-radius: 50%; background: hsl(38 92% 50%); display: block; }
.row.br button.meta:hover { color: var(--color-foreground); text-decoration: underline; text-underline-offset: 2px; }
.row.br .upd { width: 16px; height: 16px; margin-left: 4px; display: grid; place-items: center; color: var(--brand-ink); flex: none; }
/* Each row keeps its status and its one ⋯ in fixed places; hover only reveals the ⋯, so nothing slides under the pointer. */
.row.br .trail { opacity: 1; position: static; flex: none; margin-left: 4px; }
.row.br .trail button { opacity: 0; }
.row.br:hover .trail button, .row.br .trail button[aria-expanded="true"], .row.br:focus-within .trail button { opacity: 1; }
.row.conn { color: var(--color-muted-foreground); width: 100%; text-align: left; }
.row.conn .ico { color: var(--color-muted-foreground); }
.row.conn:hover { color: var(--color-foreground); }
.repo-btn { height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 6px; color: var(--color-muted-foreground); font-size: 11px; font-weight: 500; max-width: 120px; }
.repo-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.repo-btn:hover { background: var(--color-accent); color: var(--color-foreground); }
.br-chip { height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.br-chip:hover { background: var(--color-accent); }
.br-chip .ic { color: var(--color-muted-foreground); display: inline-grid; }
.br-chip > svg { color: var(--color-muted-foreground); }
.frame-label .brl { display: inline-flex; align-items: center; gap: 4px; color: var(--color-foreground); font-weight: 500; }
.frame-label .brl i, .cmp-l .brl i { display: none; }
.frame-label .brl::before, .cmp-l .brl::before { content: ""; }

/* compare: two branches side by side, read-only */
.cmp-pair { display: flex; gap: 48px; align-items: flex-start; }
.cmp-f { display: flex; flex-direction: column; gap: 8px; }
.cmp-l { height: 24px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--color-muted-foreground); }
.cmp-l .grow { flex: 1; }
.cmp-l .btn { height: 24px; font-size: 12px; border-radius: 6px; padding-inline: 8px; }
.cmp-box { position: relative; overflow: hidden; box-shadow: 0 0 0 1px var(--color-border); }
.cmp-box .page { position: absolute; left: 0; top: 0; transform-origin: top left; pointer-events: none; }
/* page variants that branches carry */
.page.v-playful .hl { color: hsl(262 70% 56%); }
.page.v-playful .p-card { border-radius: 32px; }
.page.v-playful .p-pill { background: hsl(262 70% 56% / 12%); color: hsl(262 70% 50%); }

/* dialogs: connect a repository, send for review */
.dlg .field-l { font-size: 12px; font-weight: 500; }
.dlg .repo-list { display: flex; flex-direction: column; margin: 0 -8px; }
.dlg .repo-list button { height: 36px; display: flex; align-items: center; gap: 8px; padding-inline: 8px; border-radius: 8px; font-size: 13px; text-align: left; }
.dlg .repo-list button:hover { background: var(--color-accent); }
.dlg .repo-list button[aria-checked="true"] { background: var(--design-editor-selection-color); }
.dlg .repo-list .nm { flex: 1; min-width: 0; font-weight: 500; }
.dlg .repo-list .nm small { color: var(--color-muted-foreground); font-weight: 400; }
.dlg .repo-list .ck { width: 16px; color: var(--brand-ink); }
.dlg .fsel { height: 32px; border: 1px solid var(--color-border); border-radius: 8px; display: flex; align-items: center; gap: 6px; padding-inline: 10px 8px; font-size: 13px; background: var(--color-background); width: 100%; text-align: left; }
.dlg .fsel .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlg .fsel .m { color: var(--color-muted-foreground); font-size: 12px; }
.dlg .fsel svg { color: var(--color-muted-foreground); }
.dlg .hint { font-size: 12px; line-height: 16px; color: var(--color-muted-foreground); }
.dlg .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dlg .ba > div { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--color-muted-foreground); }
.dlg .thm { height: 132px; border-radius: 8px; background: var(--design-editor-canvas-bg); overflow: hidden; position: relative; box-shadow: inset 0 0 0 1px var(--color-border); }
.dlg .thm .page { position: absolute; left: 50%; top: 10px; width: 863px; transform: translateX(-50%) scale(.24); transform-origin: top center; pointer-events: none; }
.dlg textarea { min-height: 64px; border: 1px solid var(--color-border); border-radius: 8px; padding: 8px 10px; font: 13px/18px var(--font); background: var(--color-background); color: var(--color-foreground); resize: none; outline: none; }
.dlg textarea:focus { border-color: var(--design-editor-accent-color); }
.dlg .who-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dlg .pp { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px 0 2px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--color-border); font-size: 12px; }
.dlg .pp b { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 10px; }
.dlg-f .btn { height: 32px; font-size: 13px; border-radius: 8px; }

@media (max-width: 1279px) { .modebar .select.route { width: 160px; } }
/* comment pins: glyph and count, tail on the layer's corner; authors and the first line on hover */

/* Interact is a fullscreen preview of the running page */
.modebar .mb.pv .select.route { width: 160px; }
.modebar .mb.pv .select.dev { padding-inline: 6px; gap: 2px; }
.modebar .mb.pv .btn { height: 28px; padding-inline: 12px; font-size: 13px; border-radius: 8px; }
.modebar .mb.pv .icon-btn[aria-pressed="true"] { background: var(--design-editor-accent-color); color: var(--on-brand); }
/* Select: links stop navigating, the deepest layer under the pointer gets a hairline, a click selects it */
.app.iselect .page, .app.iselect .page * { cursor: default !important; }
.app.iselect .page .ihov:not(.sel) { outline: 1px solid var(--design-editor-accent-color); outline-offset: 0; }
.qe-f { display: flex; flex-direction: column; gap: 4px; }
.qe-sw { display: flex; gap: 4px; }
.qe-sw button { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; }
.qe-sw button:hover { background: var(--color-accent); }
.qe-sw button i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-foreground) 16%, transparent); }
.qe-sw button[data-v="transparent"] i { background: linear-gradient(135deg, transparent 45%, var(--color-muted-foreground) 45% 55%, transparent 55%) !important; }
.qe-sw button[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--design-editor-accent-color); }
/* The composer is one line in Interact: add, what's selected, the message, send. */

/* Library: Icons and Tokens */
/* Library: Components, Icons and Tokens share the File tab's layers grid, not the inspector's 8px inset:
   the chevron sits in the 16px gutter, titles and children's icons start at 16, row labels at 40, and
   header glyphs and values end 16px from the right. Rows are full-bleed 32px like layer rows. */
.lib-head { height: 48px; padding: 8px; border-bottom: 0; }
.lib-head .tk-search { flex: 1; margin-left: 0; }
#tokens .ag-body { padding-bottom: 12px; }
.lib-s { padding-inline: 0; }
.lib-s:first-child { box-shadow: none; }
.lib-s .psec-h { padding-right: 11px; }
.lib-s .psec-h .t { gap: 0; font-weight: 550; letter-spacing: .005em; }
.lib-s .psec-h .t .chev { width: 16px; }
.lib-s .psec-h .acts { display: flex; }
.lib-s .psec-h .acts .icon-btn { width: 22px; height: 22px; }
.lib-s .psec-h .acts .icon-btn svg { width: 12px; height: 12px; }
.lib-s .psec-b { gap: 8px; padding: 0 16px 8px; }
.lib-s .lib-n { margin-left: 4px; font-weight: 400; color: var(--color-muted-foreground); }
.lib-gl { height: 24px; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--color-muted-foreground); }
.lib-gl .m { margin-left: auto; font: 10px/1 var(--mono, ui-monospace, monospace); opacity: .8; }
.lib-s .row { height: 32px; padding-inline: 16px; margin-inline: -16px; border-radius: 0; }
.lib-s .row.lib-c { cursor: pointer; }
.lib-s .row.lib-c .ico { color: var(--design-editor-component-color); }
.lib-s .sec-head { height: 24px; padding: 0; position: static; box-shadow: none !important; background: none; }
.lib-s .sec-toggle { height: 24px; pointer-events: none; font-size: 11px; font-weight: 400; color: var(--color-muted-foreground); }
.lib-s .sec-toggle .chev { display: none; }
.lib-s .sec-block { padding-bottom: 0; }
.lib-s .psec-b:has(> .sec-head) { gap: 0; }
.lib-s .sec-block + .sec-head { margin-top: 8px; }
.lib-s .tk-empty { padding: 8px 0; }
/* Tiles bleed by their own padding so the first and last glyphs land on the 16px edges; 32px pitch both ways. */
.lib-s .ic-grid { grid-template-columns: repeat(7, 24px); justify-content: space-between; row-gap: 8px; margin-inline: -4px; }
.lib-s .ic-tile { width: 24px; height: 24px; }
.app .file-head .file-name { height: 24px; padding-inline: 4px; margin-left: -4px; border-radius: 6px; font-size: 13px; font-weight: 500; }
.app .file-head .file-name:hover { background: var(--color-accent); }
.ic-grid { display: grid; grid-template-columns: repeat(7, 32px); }
.ic-tile { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: var(--color-foreground); cursor: grab; }
.ic-tile .i { width: 16px; height: 16px; }
.ic-tile:hover, .ic-tile.first { background: var(--color-accent); }
.ic-tile[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--design-editor-accent-color); }
.page .p-ic { display: inline-flex; flex: none; width: var(--s); height: var(--s); margin-right: 8px; vertical-align: -0.15em; }
.page .p-ic svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: var(--sw); stroke-linecap: round; stroke-linejoin: round; }
.page .p-card > .p-ic { margin: 0; }
.page .drop-on { outline: 2px solid var(--design-editor-accent-color) !important; outline-offset: 2px; }

/* the picker */
.icp { position: fixed; z-index: 60; width: 256px; max-height: 320px; display: flex; flex-direction: column; border-radius: 12px; background: var(--color-background); box-shadow: var(--isl-shadow); overflow: hidden; }
.icp-s { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--color-border); color: var(--color-muted-foreground); }
.icp-s input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 13px; color: var(--color-foreground); }
.icp-b { overflow: auto; padding: 4px 8px 8px; }
.icp .ic-grid { grid-template-columns: repeat(7, 32px); gap: 0; }
.icp-none { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 8px; font-size: 12px; color: var(--color-muted-foreground); }

/* the icon inspector */
.ic-row { display: flex; align-items: center; gap: 8px; }
.ic-big { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 8px; background: var(--color-accent); }
.ic-big .i { width: 24px; height: 24px; }
.ic-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ic-meta .nm { font-size: 12px; font-weight: 550; }
.ic-meta .m { font-size: 11px; color: var(--color-muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ic-seg { display: flex; width: 100%; }
.ic-seg button { flex: 1; }
.ic-code { font: 11px/16px var(--mono, ui-monospace, monospace); color: var(--color-muted-foreground); padding: 4px 8px; border-radius: 6px; background: var(--color-accent); overflow-wrap: anywhere; }
.btn.outline { background: var(--color-background); box-shadow: inset 0 0 0 1px var(--color-border); }
.btn.outline:hover { background: var(--color-accent); }
.ic-row .btn.sm, .icp-none .btn.sm { height: 24px; padding-inline: 8px; font-size: 12px; border-radius: 6px; }

/* a drawing tool says how to stop */
.tool-hint { position: absolute; z-index: 6; top: 64px; left: calc(var(--occ-l) + (100% - var(--occ-l) - var(--occ-r)) / 2); transform: translateX(-50%); height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; border-radius: 12px; background: var(--color-background); box-shadow: var(--isl-shadow); font-size: 12px; white-space: nowrap; animation: swap .14s ease-out; }
.tool-hint b { font-weight: 600; }
.tool-hint .btn { height: 28px; padding-inline: 10px; font-size: 12px; gap: 6px; }
.tool-hint .btn .k { color: var(--color-muted-foreground); font-size: 11px; }
.modebar .mb.pv .pv-app svg, .modebar .mb.pv .pv-app img { width: 18px; height: 18px; }
.modebar .mb.pv { padding-left: 6px; }
.page .iedit { outline: 2px solid var(--design-editor-accent-color) !important; outline-offset: 2px; cursor: text !important; caret-color: var(--design-editor-accent-color); }

/* the logo: a mark (icon layer) and a wordmark (text layer) */
.page .p-logo > .p-ic { margin: 0; }
/* Interact's tag is a path; each step selects that layer */
.page .sel-tag.itag { pointer-events: auto; display: inline-flex; align-items: center; gap: 2px; padding-inline: 2px; z-index: 3; }
.itag button { height: 16px; padding-inline: 3px; border-radius: 2px; color: color-mix(in srgb, var(--on-brand) 65%, transparent); font: inherit; }
.itag button:hover { background: rgb(0 0 0 / 10%); color: var(--on-brand); }
.itag button[aria-current] { color: var(--on-brand); }
.itag i { font-style: normal; opacity: .6; }
.qe-f.scope .ic-seg button { font-size: 12px; }
/* Capture: pick a part (dashed, named), a flash where it was taken, frames beside the screen in Design */
.app.icap .page, .app.icap .page * { cursor: crosshair !important; }
.app.icap .page .ihov { outline: 2px dashed var(--design-editor-accent-color) !important; outline-offset: 2px; }
.app.icap .page .ihov::after { content: attr(data-capname); position: absolute; left: -2px; top: -22px; height: 18px; padding: 0 6px; border-radius: 4px; background: var(--design-editor-accent-color); color: var(--on-brand); font: 500 11px/18px var(--font); letter-spacing: 0; text-transform: none; white-space: nowrap; pointer-events: none; z-index: 5; }
.cap-flash { position: fixed; z-index: 80; pointer-events: none; background: #fff; border-radius: 4px; animation: capflash .6s ease-out forwards; }
@keyframes capflash { from { opacity: .85; } to { opacity: 0; } }
.modebar .kit-seg .n { margin-left: 4px; min-width: 16px; height: 16px; padding-inline: 4px; border-radius: 8px; background: var(--design-editor-accent-color); color: var(--on-brand); font-size: 10px; line-height: 16px; font-weight: 600; display: inline-block; text-align: center; }
.caps { display: flex; align-items: flex-start; gap: 64px; margin-left: 64px; }
.cap-f { position: relative; flex: none; cursor: default; }
.cap-l { position: absolute; left: 0; bottom: calc(100% + 6px); display: flex; gap: 6px; white-space: nowrap; font-size: 11px; color: var(--color-muted-foreground); }
.cap-l .nm { color: var(--color-foreground); }
.cap-box { position: relative; overflow: hidden; background: #fff; box-shadow: var(--isl-ring); }
.cap-f[aria-selected="true"] .cap-box { box-shadow: 0 0 0 2px var(--design-editor-accent-color); }
.cap-f[aria-selected="true"] .cap-l .nm { color: var(--brand-ink); }
.cap-clip { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; }
.cap-page { min-height: 0 !important; box-shadow: none !important; border-radius: 0 !important; }
.cap-page [data-node] { outline: none !important; }
.cap-meta { display: grid; gap: 4px; font-size: 12px; }
.cap-meta div { display: flex; justify-content: space-between; gap: 8px; }
.cap-meta span { color: var(--color-muted-foreground); }
.cap-meta b { font-weight: 500; }
.cap-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.cap-acts .btn { height: 28px; font-size: 12px; gap: 6px; }
.btn.ghost.danger { color: hsl(0 72% 50%); }
/* the agent's versions: directions drawn from the file's own tokens */
.cap-page.var-bold .p-h1 { font-size: 92px !important; font-weight: 900 !important; letter-spacing: -0.055em !important; line-height: .98 !important; }
.cap-page.var-bold h3 { font-weight: 800 !important; }
.cap-page.var-bold .p-btn.dark { font-weight: 700 !important; padding-inline: 36px !important; }
.cap-page.var-accent .p-btn.dark { background: hsl(262 70% 56%) !important; border-color: transparent !important; }
.cap-page.var-accent .p-pill, .cap-page.var-accent .p-eyebrow { color: hsl(262 70% 50%) !important; }
.cap-page.var-soft .p-card { border-radius: 32px !important; background: #f4f2fb !important; }
.cap-page.var-soft .p-btn { border-radius: 999px !important; }

/* The toolbar sits on the selection: the inspector's controls for that kind of layer, in one row */
.tb { position: absolute; z-index: 8; display: flex; align-items: center; gap: 2px; height: 36px; padding: 4px; border-radius: 10px; background: var(--color-background); box-shadow: var(--isl-shadow); white-space: nowrap; animation: swap .12s ease-out; }
.tb-sep { width: 1px; height: 20px; margin: 0 4px; background: var(--color-border); flex: none; }
.tb-btn, .tb-sel { height: 28px; border-radius: 6px; display: inline-flex; align-items: center; color: var(--color-foreground); flex: none; }
.tb-btn { min-width: 28px; padding: 0 6px; justify-content: center; gap: 2px; }
.tb-sel { gap: 6px; padding: 0 6px 0 8px; font-size: 13px; max-width: 168px; }
.tb-sel > span { overflow: hidden; text-overflow: ellipsis; }
.tb-btn:hover, .tb-sel:hover, .tb-btn[aria-expanded="true"], .tb-sel[aria-expanded="true"] { background: var(--color-accent); }
.tb-btn > svg.i:not(.s12) { width: 16px; height: 16px; }
.tb svg.s12 { color: var(--color-muted-foreground); }
.tb-num { height: 28px; width: 64px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 6px; background: var(--color-muted); color: var(--color-muted-foreground); flex: none; }
.tb-num input { width: 100%; min-width: 0; border: 0; background: none; outline: none; font: 13px var(--font); color: var(--color-foreground); font-variant-numeric: tabular-nums; }
.tb-num:focus-within { box-shadow: inset 0 0 0 1px var(--design-editor-accent-color); }
.tb-seg { height: 28px; display: flex; padding: 2px; border-radius: 6px; background: var(--color-muted); flex: none; }
.tb-seg button { height: 24px; min-width: 24px; padding: 0 4px; border-radius: 4px; display: grid; place-items: center; font-size: 12px; color: var(--color-muted-foreground); }
.tb-seg button[aria-pressed="true"] { background: var(--color-background); color: var(--color-foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 8%); }
.tb .sw { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-foreground) 18%, transparent); }
.tb-pop { position: absolute; z-index: 9; width: 240px; padding: 8px; display: flex; flex-direction: column; gap: 6px; border-radius: 10px; background: var(--color-background); box-shadow: var(--isl-shadow); animation: swap .12s ease-out; }
.tb-pop:has(.qe-sw) { width: auto; }
.tb-pop .g5 { margin: 0; }
/* Pending edits sit above the composer until Save or Discard */

/* Component props as the page draws them (the sample's own variants) */

/* ───────── the sample page's sections (page tokens only, so the page's own dark scheme follows) ───────── */

.p-step[aria-pressed="true"] b { background: var(--page-fg); color: var(--page-bg); }
.p-code.big { padding: 0; min-height: 230px; border-radius: 16px; overflow: hidden; }

.p-tab[aria-pressed="true"] { background: var(--page-bg); color: var(--page-fg); box-shadow: 0 1px 2px rgb(0 0 0 / 8%); }
.p-tpl-grid { width: 100%; max-width: 1080px; margin-top: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; text-align: left; }
.p-tpl { border-radius: 20px; background: var(--page-card); overflow: hidden; display: flex; flex-direction: column; }
.p-tpl-b { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

.pv { height: 168px; margin: 14px 14px 0; border-radius: 12px; background: color-mix(in srgb, var(--h) 14%, var(--page-bg)); display: flex; gap: 10px; padding: 14px; overflow: hidden; }
.pv i { display: block; height: 7px; border-radius: 4px; background: color-mix(in srgb, var(--h) 32%, transparent); }

.pv-cal span { border-radius: 5px; background: var(--page-bg); }
.pv-cal span.on { background: var(--h); }
.pv-doc { flex: 1; padding: 16px 18px; border-radius: 8px; background: var(--page-bg); display: flex; flex-direction: column; gap: 9px; }

.pv-slides { flex: 1; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 6px; }
.pv-slides span { border-radius: 6px; background: var(--page-bg); }

.pv-clip { flex: 1; position: relative; border-radius: 8px; background: color-mix(in srgb, var(--h) 70%, #111); }

.pv-bars { flex: 1; display: flex; align-items: flex-end; gap: 8px; padding: 8px 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--h) 30%, transparent); }

.p-feat-grid { width: 100%; max-width: 1080px; margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1px; background: var(--p-line); border: 1px solid var(--p-line); border-radius: 20px; overflow: hidden; text-align: left; }

.p-feat-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--page-card); margin-bottom: 6px; }

.p-feat p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--page-muted); }
.p-band { margin: 96px var(--space-page, 56px) 0; padding: 64px 40px; border-radius: 28px; background: var(--page-fg); color: var(--page-bg); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.p-band .p-lead { color: color-mix(in srgb, var(--page-bg) 65%, transparent); }

.p-cmd-b { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px 0 18px; border-radius: 23px; border: 1px solid color-mix(in srgb, var(--page-bg) 22%, transparent); }
.p-cmd-b code { font: 14px var(--font); } .p-cmd-b code b { font-weight: 400; opacity: .55; margin-right: 10px; }
.p-cmd-b .p-copy { background: transparent; color: var(--page-bg); border-color: color-mix(in srgb, var(--page-bg) 22%, transparent); }
.p-band .p-btn.dark { background: var(--page-bg); color: var(--page-fg); border-color: var(--page-bg); }
.p-band .p-btn:not(.dark) { background: transparent; color: var(--page-bg); border-color: color-mix(in srgb, var(--page-bg) 30%, transparent); }
.p-faqs { width: 100%; max-width: 760px; margin-top: 14px; border-top: 1px solid var(--p-line); text-align: left; }
.p-faq { border-bottom: 1px solid var(--p-line); }
.p-q { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; font: 600 17px var(--font); color: var(--page-fg); text-align: left; }
.p-q svg.i { width: 18px; height: 18px; color: var(--page-muted); transition: transform .15s; }
.p-q[aria-expanded="true"] svg.i { transform: rotate(180deg); }
.p-a { margin: -6px 0 0; padding: 0 0 20px; font-size: 15px; line-height: 1.5; color: var(--page-muted); max-width: 620px; }
.p-foot { margin-top: 96px; padding: 40px var(--space-page, 56px) 48px; border-top: 1px solid var(--p-line); display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 24px; font-size: 14px; }

@container page (max-width: 760px) { .p-how { grid-template-columns: 1fr; } .p-foot { grid-template-columns: 1fr 1fr; } .p-h2 { font-size: 34px; } }

/* The canvas is the file's own color in Design, in light and dark alike; text that sits on it takes its ink from it */
.app:not(.preview) .canvas { background: var(--hy-canvas, var(--design-editor-canvas-bg)); }
.app:not(.preview) .frame-label, .app:not(.preview) .frame-label span, .cap-l, .cap-l .m, .cmp-l { color: var(--hy-canvas-ink); }
.app:not(.preview) .frame-label b, .cap-l .nm { color: var(--hy-canvas-ink-strong); }
.app.nosel .page .sel { outline: none !important; }
.app.nosel .page .sel-tag, .app.nosel .page .sel-size { display: none; }
.cv-field { flex: 1; display: flex; align-items: center; gap: 8px; }
.cv-field input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: 12px var(--font); color: var(--color-foreground); text-transform: uppercase; }

/* Brand: Builder's platform blue #1A73EB nudged under a degree to #1A70EB, so white text on it passes AA (4.6:1).
   It fills buttons, badges and pressed tools. In dark mode it's 3.5:1 against the chrome but 2.5:1 on its own soft
   tint, so blue text and icons go through --brand-ink, which is #67A0F2 there. It marks what's on or selected and the
   primary action, nothing else; the logo stays monochrome. Set on body so menus, popovers and the toolbar pick it up too. */
body { --brand-sub: color-mix(in srgb, #1A70EB 6%, transparent); --brand: #1A70EB; --brand-hover: #1367DD; --on-brand: #FFFFFF; --brand-soft: color-mix(in srgb, #1A70EB 14%, transparent); --brand-row: color-mix(in srgb, #1A70EB 10%, transparent);
  --design-editor-accent-color: var(--brand); --design-editor-accent-hover-color: var(--brand-hover); --design-editor-accent-contrast-color: var(--on-brand);
  --design-editor-selection-color: var(--brand-soft); --design-editor-selected-subtree-color: var(--brand-row);
  --agent: var(--brand); --agent-soft: var(--brand-soft); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body { --brand-hover: #2D7CED; --brand-soft: color-mix(in srgb, #3F87EE 26%, transparent); --brand-row: color-mix(in srgb, #3F87EE 20%, transparent); --brand-sub: color-mix(in srgb, #3F87EE 9%, transparent); } }
:root[data-theme="dark"] body { --brand-hover: #2D7CED; --brand-soft: color-mix(in srgb, #3F87EE 26%, transparent); --brand-row: color-mix(in srgb, #3F87EE 20%, transparent); --brand-sub: color-mix(in srgb, #3F87EE 9%, transparent); }
:focus-visible { outline-color: var(--brand); }
/* Primary actions are the brand button: Share, Save, Connect, Send */
.btn.primary { background: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-hover); opacity: 1; }
.isl-head .bsplit .btn + .btn { box-shadow: inset 1px 0 0 color-mix(in srgb, var(--on-brand) 22%, transparent); }
.composer .send:not(.stop), .cmc-send { background: var(--brand); color: var(--on-brand); }
/* Text on a brand fill is white (4.9:1) */
.page .sel-tag, .page .sel-size, .resp-readout, .tl-dot.k-current, .rail-item .badge { color: var(--on-brand) !important; }
/* Tabler icons at 1.25px, to sit with the type */
svg.i { stroke-width: 1.25; }
/* The selected layer is the strong tint; everything inside it carries a faint one, down to the deepest child */
#tree .row.in-sel { background: var(--brand-sub); }
#tree .row.in-sel:hover { background: color-mix(in srgb, var(--brand) 10%, transparent); }
#tree .row[aria-selected="true"], #tree .row[aria-selected="true"]:hover { background: var(--design-editor-selection-color); }
/* The hover actions cover the end of a long name, so they paint the row's look solidly instead of inheriting a translucent
   tint (which stacked into a darker box on tinted rows). */
.tree .row:not(.br) .trail { background: linear-gradient(var(--rt, transparent), var(--rt, transparent)), var(--color-background); }
.tree .row:hover { --rt: var(--color-accent); }
.tree .row.in-sel { --rt: var(--brand-sub); }
.tree .row[aria-selected="true"] { --rt: var(--design-editor-selection-color); }
/* Your app: connect, the running status, code for a selection */
.dlg .conn-tabs { display: flex; width: 100%; }
.dlg .conn-tabs button { flex: 1; }
.dlg .cmd-row { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; border-radius: 8px; background: var(--color-muted); }
.dlg .cmd-row code { flex: 1; font: 13px var(--mono, ui-monospace, monospace); }
.dlg .cmd-row .btn.sm { height: 28px; padding-inline: 10px; font-size: 12px; }
.dlg .local-wait { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--color-border); font-size: 13px; color: var(--color-muted-foreground); }
.dlg .local-wait b { color: var(--color-foreground); font-weight: 500; }
.dlg .local-wait svg { color: var(--brand); }
.run-steps { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 8px; }
.rs { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--color-muted-foreground); }
.rs > i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--color-border); flex: none; }
.rs.on { color: var(--color-foreground); }
.rs.done svg { color: var(--brand); }
.rs .spin, .local-wait .spin { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--color-border); border-top-color: var(--brand); animation: spin 0.8s linear infinite; flex: none; }
.st-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--color-muted-foreground); }
.st-dot.running { background: hsl(150 60% 40%); box-shadow: 0 0 0 3px hsl(150 60% 40% / 18%); }
.st-dot.starting { background: hsl(38 92% 50%); }
.st-dot.stopped { background: hsl(38 92% 50%); }
.modebar .select.route .st-dot { margin-right: 2px; }
.row.app-st { width: 100%; }
.row.app-st .label { font-weight: 500; }
.upd-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); margin-left: auto; flex: none; }
.kbd.do { font-size: 10px; color: var(--color-muted-foreground); }
.kbd.do.in { color: hsl(150 50% 36%); }
.codev { margin: 0 -8px; border-radius: 8px; overflow: hidden; background: var(--color-muted); }
.codev-h { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px; font: 11px var(--mono, ui-monospace, monospace); color: var(--color-muted-foreground); border-bottom: 1px solid var(--color-border); }
.codev-h > span:not(.grow) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.codev pre { margin: 0; padding: 8px 8px 10px 0; font: 11px/18px var(--mono, ui-monospace, monospace); white-space: pre; overflow-x: auto; color: var(--color-foreground); }
.codev .ln { display: block; padding-left: 8px; background: var(--brand-row); }
.codev .ln::before { content: attr(data-n); display: inline-block; width: 24px; margin-right: 8px; text-align: right; color: var(--color-muted-foreground); }
.codev .t { color: hsl(330 60% 46%); } .codev .a { color: hsl(28 80% 40%); } .codev .s { color: var(--brand); }
.tb-pop.code { width: 360px; }
.tb-pop.code .codev { margin: 0; }
.app-log { margin: 0; padding: 12px; border-radius: 8px; background: var(--color-muted); font: 12px/18px var(--mono, ui-monospace, monospace); white-space: pre-wrap; }
/* Share: one list, general access, copy and send. No tabs, no dividers; the popover hugs its content. */
.share-pop.sp2 { width: 384px; padding: 12px; display: flex; flex-direction: column; gap: 4px; border-radius: 12px; border: 0; box-shadow: var(--isl-shadow); }
.sp2 .sp-inv { display: flex; gap: 8px; align-items: flex-start; }

.sp2 .sp-in:focus-within { box-shadow: inset 0 0 0 1.5px var(--brand); }
.sp2 .sp-in input { flex: 1; min-width: 96px; height: 26px; border: 0; background: none; outline: none; font: 13px var(--font); color: var(--color-foreground); }
.sp2 .sp-tok { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; min-height: 28px; }
.sp2 .sp-chip { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 2px 0 3px; border-radius: 12px; background: var(--color-muted); font-size: 12px; font-weight: 500; }
.sp2 .sp-chip .cav { width: 18px; height: 18px; font-size: 9px; }
.sp2 .sp-chip button { width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.sp2 .sp-chip button:hover { background: var(--color-border); color: var(--color-foreground); }
.sp2 #sp-invite { height: 36px; padding-inline: 14px; font-size: 13px; border-radius: 8px; flex: none; }
.sp2 #sp-invite[disabled] { opacity: .4; cursor: default; }
.sp2 .sp-sugg { display: flex; flex-direction: column; margin: 0 -4px; padding: 4px 0; }
.sp2 .sp-sugg button { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; text-align: left; }
.sp2 .sp-sugg button:hover, .sp2 .sp-sugg button[aria-selected="true"] { background: var(--color-accent); }

    N("nav-links", ["Product", "Pricing", "Docs", "Changelog"].map(l => N("nav-" + l.toLowerCase(), `<a data-href="${l === "Docs" ? "/docs" : l === "Pricing" ? "/pricing" : "/home"}">${l}</a>`)).join(""), 'class="links"') +
    `<span class="p-btn" style="height:34px;font-size:13px;padding-inline:14px">Log in</span><span class="p-menu" aria-label="Menu">${ic("menu-2")}</span>`;
}
function markSelection() {
  document.querySelectorAll(".page .sel").forEach(e => e.classList.remove("sel"));
  document.querySelectorAll(".page .sel-tag, .page .sel-size").forEach(e => e.remove());
  if (S.mode !== "design" || H.active || S.screenSel) return;
  (S.multi || []).forEach(id => document.querySelector(`.page [data-node="${id}"]`)?.classList.add("sel"));
  const el = document.querySelector(`.page [data-node="${S.selected}"]`);
  if (!el) return;
  el.classList.add("sel");
  if ((S.multi || []).length > 1) return;
  const pr = propsFor(S.selected);
  el.insertAdjacentHTML("beforeend", `<span class="sel-tag">${FLAT[S.selected]?.name.slice(0, 32) || pr.tag}</span><span class="sel-size">${pr.w} × ${pr.h}</span>`);
}

/* ───────── inspector ───────── */
function sec(id, title, acts, body, { collapsible = true, empty = false } = {}) {
  if (empty) collapsible = false;
  const open = !S.sections.has(id);
  const t = collapsible
    ? `<button class="t" data-psec="${id}" aria-expanded="${open}"><span class="chev">${ic("chevron-down", "s12")}</span>${title}</button>`
    : `<span class="t"><span class="chev"></span>${title}</span>`;
  return `<section class="psec ${(!open || empty) ? "empty" : ""}"><div class="psec-h">${t}<div class="acts">${acts}</div></div><div class="psec-b">${body}</div></section>`;
}
const act = (icon, title, pressed) => `<button class="icon-btn xs" title="${title}" ${pressed !== undefined ? `aria-pressed="${pressed}"` : ""}>${ic(icon)}</button>`;
const inp = (pre, val, post = "") => `<label class="inp"><span class="pre">${pre}</span><input value="${val}" aria-label="${typeof pre === "string" && pre.length < 3 ? pre : "value"}">${post ? `<span class="post">${post}</span>` : ""}</label>`;
const field = (label, control, cls = "c1") => `<div class="field ${cls}"><span class="flabel">${label}</span>${control}</div>`;
const segc = (icons, on = -1, disabled = false) => `<div class="segc ${disabled ? "disabled" : ""}">${icons.map((n, i) => `<button aria-pressed="${i === on}" title="${n.replace(/-/g, " ")}">${ic(n)}</button>`).join("")}</div>`;
const dd = val => `<button class="inp sel"><span>${val}</span>${ic("chevron-down", "s12")}</button>`;

function renderInspectorBase() {
  const el = $("#insp");
  if (H.active) { app.classList.remove("no-inspector"); return renderTimeline(); }
  app.classList.toggle("no-inspector", S.mode !== "design");
  if (S.mode !== "design" || emptyDesign()) { el.innerHTML = ""; return; }
  if (frameToolArmed()) return renderFramePresets(el);
  if (S.screenSel) return renderScreenInspector(el);
  const id = S.selected, f = FLAT[id], p = propsFor(id);
  const body = `
    ${sec("position", "Position", act("layout-distribute-horizontal", "Auto layout", true), `
      <div class="g5">${field("Alignment", segc(["layout-align-left", "layout-align-center", "layout-align-right"], -1, true))}${field("&nbsp;", segc(["layout-align-top", "layout-align-middle", "layout-align-bottom"], -1, true), "c3")}</div>
      <div class="g5">${field("Position", inp("X", p.x + "px"))}${field("&nbsp;", inp("Y", p.y + "px"), "c3")}<div class="c5" style="align-self:end">${act("box-model-2", "Constraints")}</div></div>
      <div class="g5">${field("Rotation", inp(ic("angle", "s12"), "0deg"))}${field("&nbsp;", segc(["flip-horizontal", "flip-vertical"]), "c3")}<div class="c5" style="align-self:end">${act("rotate-3d", "3D rotation")}</div></div>`)}
    ${sec("layout", "Layout", "", `
      <div class="g5">${field("Width", inp("W", p.w + "px", ic("chevron-down", "s12")))}${field("Height", inp("H", p.h + "px", ic("chevron-down", "s12")), "c3")}<div class="c5" style="align-self:end">${act("link-off", "Lock aspect ratio")}</div></div>`)}
    ${sec("appearance", "Appearance", act("eye", "Visible") + act("droplet", "Blend mode"), `
      <div class="g5">${field("Opacity", inp(ic("grid-dots", "s12"), p.opacity + "%"))}${field("Corner radius", inp(ic("border-radius", "s12"), p.radius), "c3")}<div class="c5" style="align-self:end">${act("border-corners", "Independent corners")}</div></div>`)}
    ${p.text ? sec("typography", "Typography", "", `
      <div class="g5">${field("Font", dd(p.font), "c13")}</div>
      <div class="g5">${field("Weight", dd(p.weight))}${field("Size", inp(ic("text-size", "s12"), p.size + "px"), "c3")}</div>
      <div class="g5">${field("Line height", inp(ic("line-height", "s12"), p.lh))}${field("Letter spacing", inp(ic("letter-spacing", "s12"), p.ls), "c3")}</div>
      <div class="g5">${field("Align", segc(["align-left", "align-center", "align-right"], 1))}${field("&nbsp;", segc(["layout-align-top", "layout-align-middle", "layout-align-bottom"], 0), "c3")}<div class="c5" style="align-self:end">${act("adjustments-horizontal", "More type options")}</div></div>`) : ""}
    ${sec("fill", "Fill", act("layout-grid", "Styles") + act("plus", "Add fill"), `
      <div class="fillrow"><div class="inp fillfield"><button class="fill-main" data-fill aria-haspopup="dialog" title="Edit fill"><span class="swatch" style="background:${fillSwatch(p)}"></span>${(ct => p.fillToken ? `<span class="tok-chip">${fillLabel(p)}</span><span class="pct">100%</span>` : ct ? `<span class="hex${ct.pre && ct.a === 1 ? " wide" : ""}" title="${fillCss(p)}">${colorHTML(ct)}</span>${ct.pre && ct.a === 1 ? "" : `<span class="pct">${Math.round(ct.a * 100)}%</span>`}` : `<span class="hex name">${fillLabel(p)}</span><span class="pct">100%</span>`)(!p.fillToken && !isPaintCss(fillCss(p)) && colorText(fillCss(p)))}</button><button class="post" data-fill-menu aria-haspopup="menu" title="Color tokens">${ic("chevron-down", "s12")}</button></div>${act("eye", "Hide fill")}${act("minus", "Remove fill")}</div>`)}
    ${sec("stroke", "Stroke", act("layout-grid", "Styles") + act("plus", "Add stroke"), "", { empty: true })}
    ${sec("effects", "Effects", act("layout-grid", "Styles") + act("plus", "Add effect"), "", { empty: true })}
    ${responsiveSection(id)}
    ${sec("export", "Export", act("plus", "Add export setting"), `
      <div class="export-row">${dd("1x")}${dd("PNG")}<label class="inp"><input placeholder="Suffix" aria-label="Suffix" style="padding-left:6px"></label></div>
      <button class="wide-btn" data-toast="Exported ${f?.name.slice(0, 20) || "layer"}.png">${ic("download", "s14")}Export ${(f?.name || "layer").length > 18 ? "layer" : f.name}</button>
      <button class="disclose">${ic("chevron-right", "s12")}Preview</button>`)}`;
  el.innerHTML = `<div class="sel-head"><div class="g"><span class="nm">${ic(f?.kind === "text" ? "letter-t" : "frame", "s14")}<span>${p.tag}</span></span><span class="rail2">${act("components", "Create component")}${act("code", "View code")}</span></div></div>
    <div class="insp-scroll"><div class="state"><button>Default${ic("chevron-down", "s14")}</button></div>${body}</div>`;
}

/* what a request does: a few scripted plans keyed on plain words, so any phrasing runs */
function planFor(text, target) {
  const t = text.toLowerCase(), name = short(FLAT[target]?.name), h = DESIGN.headline;
  if (target?.startsWith?.("cap-")) return capPlan(t, target);
  if (/\blogo\b/.test(t) || target === "ic-nav-logo" || target === "nav-logo") return logoPlan(t);
  const icon = iconPlan(t, target); if (icon) return icon;
  if (/respons|mobile|narrow|phone/.test(t)) { const r = SKILL_RUNS["Make responsive"]; return { steps: r.steps, rcpt: r.items.slice(0, 4).map(x => ["device-mobile", x]), apply: () => r.apply(), target: "hero" }; }
  if (/bold|heav|louder|punch|strong/.test(t)) return { steps: [`Reading ${name}`, "Trying a heavier weight and tighter tracking", "Checking it still fits on 13″"], rcpt: [["letter-t", "Weight", "Bold", "Black", "hero-title"], ["letter-spacing", "Letter spacing", "-0.035em", "-0.045em", "hero-title"]], apply: () => { DESIGN = { ...DESIGN, weight: 900, ls: "-0.045em" }; PROPS["hero-title"].weight = "Black"; PROPS["hero-title"].ls = "-0.045em"; }, target: "hero-title" };
  if (/bigger|larger|huge/.test(t)) return { steps: [`Reading ${name}`, "Trying a bigger headline", "Checking it still fits on 13″"], rcpt: [["letter-t", "Size", h + "px", "88px"]], apply: () => setHeadline(88), target: "hero-title" };
  if (/play|fun|warm|friendly/.test(t)) return { steps: [`Reading ${name}`, "Picking an accent from your tokens", "Softening the cards"], rcpt: [["palette", "Word “agent”", "Foreground", "Accent"], ["border-radius", "Card corners", "24px", "32px"]], apply: () => { DESIGN = { ...DESIGN, title: PLAYFUL_TITLE }; $("#page").classList.add("v-playful"); HY.playful = true; }, target: "hero-title" };
  return { steps: [`Reading ${name}`, "Checking the type scale and spacing", "Matching your tokens"], rcpt: [["letter-t", "Headline size", h + "px", (h > 64 ? 64 : h - 8) + "px"], ["line-height", "Subtitle line height", "1.35", "1.45"]], apply: () => setHeadline(h > 64 ? 64 : h - 8), target: target || "hero-title" };
}
// A follow-up while the agent works is folded in before it finishes, and it shows in the receipt like any other change.
function steerRow(s) {

  if (/smaller|two lines|fit/i.test(s)) { setHeadline(64); return ["letter-t", "Size", "76px", "64px"]; }

function setHeadline(px) { DESIGN = { ...DESIGN, headline: px }; PROPS["hero-title"].size = px; PROPS["hero-title"].h = Math.round(px * 1.04 * (px > 70 ? 3 : 2)); }

function runAgent({ text, html, plan, who = "Claude", title }) {
  stopTimers();
  const target = plan.target || ctxTarget() || "hero";
  if (S.chat) S.chat.msgs.push({ user: true, text, html }); else S.chat = { title: title || text.replace(/\s+/g, " ").slice(0, 36), msgs: [{ user: true, text, html }] };
  RUN.chat = S.chat;
  Object.assign(RUN, { on: true, who, target, before: { d: { ...DESIGN }, p: { ...PROPS["hero-title"] }, playful: !!HY.playful, caps: HY.caps.length, placed: JSON.parse(JSON.stringify(PLACED)) }, steer: [] });
  HY.thread = true; render();
  let i = 0;
  const tick = () => {
    RUN.chat.msgs.forEach(m => { if (m.step) m.done = true; });
    if (i < plan.steps.length) { RUN.chat.msgs.push({ step: plan.steps[i++] }); renderAgents(); renderAgentLayer(); RUN.timers.push(setTimeout(tick, 900)); return; }
    plan.apply();
    const extra = RUN.steer.map(steerRow);
    const n = plan.rcpt.length + extra.length, b = curBr();
    if (HY.repo && !b.live) b.edits += n;
    const rows = [...plan.rcpt, ...extra];
    const done = RUN.chat.msgs.filter(m => m.step).map(m => m.step); RUN.chat.msgs = RUN.chat.msgs.filter(m => !m.step);
    RUN.chat.msgs.splice(RUN.chat.msgs.map(m => !!m.user).lastIndexOf(true) + 1, 0, { steps: done, label: `Worked through ${done.length} steps` });
    RUN.chat.msgs.push({ done: true, n, target: RUN.target, where: HY.repo ? `on ${b.name}` : "" }, { rcpt: rows, summary: `${chg(n)} to ${short(FLAT[RUN.target]?.name)}` });
    if (DESIGN.weight && !HY.tokensSynced && !RUN.chat.msgs.some(m => m.tok)) RUN.chat.msgs.push({ tok: true });
    RUN.on = false; saveVersion("Chat autosave", "chat");
    render();
  };
  RUN.timers.push(setTimeout(tick, 350));
}
function stopTimers() { RUN.timers.forEach(clearTimeout); RUN.timers = []; }
function stopAgent() {
  if (!RUN.on) return;
  stopTimers(); RUN.on = false;
  const c = RUN.chat || S.chat, s = [...c.msgs].reverse().find(m => m.step); if (s) { s.done = true; s.stopped = true; s.step += " · stopped"; }
  c.msgs.push({ text: "Stopped. Nothing changed." }); render();
}
function undoRun() {
  const b = RUN.before; if (!b) return;
  DESIGN = { ...b.d }; PROPS["hero-title"] = { ...b.p }; HY.playful = b.playful;
  if (b.ov) { HY.ov = b.ov.ov; HY.ovr = b.ov.ovr; HY.icr = b.ov.icr; }
  HY.caps.splice(b.caps).forEach(c => delete FLAT[c.id]); if (HY.capSel && !capById(HY.capSel)) HY.capSel = null;
  for (const k of Object.keys(PLACED)) if (!b.placed[k]) delete PLACED[k]; Object.assign(PLACED, b.placed);
  S.chat.msgs = S.chat.msgs.filter(m => !m.tok);
  const r = [...S.chat.msgs].reverse().find(m => m.rcpt); if (r) { r.undone = true; if (HY.repo && !curBr().live) curBr().edits = Math.max(0, curBr().edits - r.rcpt.length); }
  RUN.before = null; render(); toast("Undone");
}

  const groups = ["Actions", "Pages", "Layers", "Chats"].map(g => [g, hits.filter(x => x.g === g).slice(0, q ? 6 : 8)]).filter(([, l]) => l.length);
  HY.cmdkList = groups.flatMap(([, l]) => l); HY.cmdkI = Math.min(HY.cmdkI || 0, Math.max(0, HY.cmdkList.length - 1));
  let i = 0;
  box.querySelector(".ck-res").innerHTML = groups.length ? groups.map(([g, l]) => `<div class="lbl">${g}</div>${l.map(x => { const j = i++; return `<button class="ck-r" data-ck="${j}" aria-selected="${j === HY.cmdkI}"><span class="t">${esc(x.t)}</span>${x.m ? `<span class="m">${esc(x.m)}</span>` : ""}${x.k ? `<span class="kbd">${x.k}</span>` : ""}</button>`; }).join("")}`).join("") : `<div class="ck-none">Nothing matches “${esc(q)}”</div>`;
  box.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: "nearest" });
}
function openCmdk() {
  closeCmdk(); closeBell(); closeMenu?.(); HY.cmdkI = 0;
  const box = document.createElement("div"); box.id = "cmdk"; box.className = "cmdk"; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Search");
  box.innerHTML = `<label class="ck-in">${ic("search")}<input placeholder="Search actions, pages, layers and chats" aria-label="Search" autocomplete="off"><span class="kbd">Esc</span></label><div class="ck-res" role="listbox"></div>`;
  document.body.append(box); renderCmdk(); box.querySelector("input").focus();
}
function closeCmdk() { $("#cmdk")?.remove(); }
function runCmdk(j) { const it = HY.cmdkList?.[j]; closeCmdk(); it?.run(); }
document.addEventListener("input", e => { if (e.target.closest?.("#cmdk")) { HY.cmdkI = 0; renderCmdk(); } });
window.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === "k") { e.preventDefault(); e.stopPropagation(); return $("#cmdk") ? closeCmdk() : openCmdk(); }
  if ($("#cmdk")) {
    if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); return closeCmdk(); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); e.stopPropagation(); const n = HY.cmdkList.length; HY.cmdkI = (HY.cmdkI + (e.key === "ArrowDown" ? 1 : -1) + n) % n; return renderCmdk(); }
    if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); return runCmdk(HY.cmdkI); }
  }
  if (e.key === "Escape" && $("#hd-pop")) { e.stopPropagation(); closeBell(); }
}, true);
window.addEventListener("click", e => {
  const b = e.target.closest?.("#hd-search, #hd-bell, [data-nt], #nt-read, [data-ck]");
  if (!b) { if ($("#cmdk") && !e.target.closest?.("#cmdk")) closeCmdk(); if ($("#hd-pop") && !e.target.closest?.("#hd-pop")) closeBell(); return; }
  e.stopPropagation(); e.preventDefault();
  if (b.id === "hd-search") return openCmdk();
  if (b.id === "hd-bell") return $("#hd-pop") ? closeBell() : bellPop(b);
  if (b.id === "nt-read") { HY.notifs.forEach(n => n.unread = false); renderIslHead(); return bellPop($("#hd-bell")); }
  if (b.dataset.nt !== undefined) { const n = HY.notifs[+b.dataset.nt]; n.unread = false; closeBell(); renderIslHead(); return n.go(); }
  if (b.dataset.ck !== undefined) return runCmdk(+b.dataset.ck);
}, true);

/* The account avatar lives in the top bar here, not the rail foot, so its menu opens below it. */
openAccountMenu = (base => function (btn) {
  const om = openMenu;
  openMenu = (b, items, o) => om(b, items, { ...o, above: false });
  try { base(btn); } finally { openMenu = om; }
})(openAccountMenu);

/* Brand directions from the colour board (review strip only). The tokens live in hy.css under :root[data-brand]. */
const BRANDS = [["", "Builder blue"], ["signal", "Signal"], ["daybreak", "Daybreak"], ["deepwater", "Deepwater"], ["cerulean", "Cerulean"], ["ink", "Ink"], ["periwinkle", "Periwinkle"]];
function setBrand(k) {
  if (k) document.documentElement.dataset.brand = k; else delete document.documentElement.dataset.brand;
  try { localStorage.setItem("hy-brand", k); } catch {}
}
$("#theme-btn").insertAdjacentHTML("beforebegin", `<label class="chip" title="Brand direction from the colour board">Brand <select id="brand-sel">${BRANDS.map(([k, n]) => `<option value="${k}">${n}</option>`).join("")}</select></label>`);
try { const k = localStorage.getItem("hy-brand") || ""; if (BRANDS.some(([v]) => v === k)) { setBrand(k); $("#brand-sel").value = k; } } catch {}
$("#brand-sel").addEventListener("change", e => setBrand(e.target.value));
kitChangesInit($("#changes-btn"));
setPanel("file");
render();
</script>
