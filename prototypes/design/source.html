<!--
  The Design editor prototype. Build with: node prototypes/kit/build.ts design. The v2 shell blocks at the
  end of <style> and <script> re-arrange the first editor prototype into islands, a tool column, and the
  agent on the canvas; functions they replace keep their originals under a …Base name.
  (writes dist/index.html; the kit fills the placeholders, see kit/build.ts).
  Layout of this file:
    <style>   review strip, app shell, then one commented block per surface
              (top bar, rail, panels, canvas, comments, inspector, menus, dialogs,
              Settings, tokens, share popover)
    markup    review strip, Settings shell, rail, file panel, canvas, inspector
    <script>  banners "/* ───────── name ───────── */": data, responsive, URL screens
              (route control, unsaved changes, Review changes), screen frame
              inspector, frame tool, tree (Screens + Layers), top bar, floating dock,
              canvas, inspector, comments, menus (context menus, Send to), behavior
              (click and key handlers), keyboard shortcuts window, Settings, version
              history, history mode, tokens (with App menu, Nudge amount, share
              popover, Import), Add a screen from your app, then code mode.
  Search for a banner name to jump to a surface. The review strip's switches (Labs,
  History, Scenario, Spacing, Theme, Changes) exist only in the prototype.
-->
<title>Design v2</title>
__KIT_HEAD__
<style>
/* Layout: 56 rail | 240 file panel (resizable, 8px steps) | canvas | 240 inspector; one 48px header line across all columns.
   The code's tokens and the base reset come from the kit; these are prototype-only (dock, overlays, diffs, syntax). */
:root {
  --kit-accent: var(--design-editor-accent-color);
  --dock: hsl(0 0% 24%);
  --dock-fg: hsl(0 0% 100%);
  --dock-hover: hsl(0 0% 100% / 10%);
  --dock-pressed: hsl(0 0% 100% / 16%);
  --dock-muted: hsl(0 0% 100% / 64%);
  --dock-menu: hsl(0 0% 12%);
  --spec-grid: hsl(330 90% 55% / 0.18);
  --spec-line: hsl(330 90% 55% / 0.7);
  --page-fg: hsl(0 0% 10%);
  --page-muted: hsl(0 0% 40%);
  --page-card: hsl(0 0% 97%);
  --page-bg: hsl(0 0% 100%);
  --diff-add: hsl(140 70% 42%);
  --diff-del: hsl(0 72% 52%);
  --diff-add-bg: hsl(140 60% 94%);
  --diff-del-bg: hsl(0 85% 96%);
  --diff-add-word: hsl(140 55% 82%);
  --diff-del-word: hsl(0 80% 88%);
  --syn-tag: hsl(150 50% 30%);
  --syn-attr: hsl(265 55% 50%);
  --syn-str: hsl(215 70% 35%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --diff-add-bg: hsl(140 40% 16%); --diff-del-bg: hsl(0 45% 18%);
    --diff-add-word: hsl(140 45% 26%); --diff-del-word: hsl(0 50% 30%);
    --syn-tag: hsl(150 50% 62%); --syn-attr: hsl(265 70% 76%); --syn-str: hsl(205 80% 72%);
  }
}
:root[data-theme="dark"] {
  --diff-add-bg: hsl(140 40% 16%); --diff-del-bg: hsl(0 45% 18%);
  --diff-add-word: hsl(140 45% 26%); --diff-del-word: hsl(0 50% 30%);
  --syn-tag: hsl(150 50% 62%); --syn-attr: hsl(265 70% 76%); --syn-str: hsl(205 80% 72%);
}

/* ───────── review strip ───────── */

/* ───────── app shell ───────── */
.app { --panel-w: 240px; height: calc(100% - 36px); display: grid; grid-template-columns: 56px var(--panel-w) minmax(0, 1fr) 240px; grid-template-rows: 48px minmax(0, 1fr); }
.app.no-panel { grid-template-columns: 56px 0 minmax(0, 1fr) 240px; }
.app.no-inspector { grid-template-columns: 56px var(--panel-w) minmax(0, 1fr) 0; }
.app.no-panel.no-inspector { grid-template-columns: 56px 0 minmax(0, 1fr) 0; }

/* rail */
.rail { grid-row: 1 / 3; grid-column: 1; border-right: 1px solid var(--color-border); display: flex; flex-direction: column; background: var(--color-background); }
.rail-head { height: 48px; display: grid; place-items: center; border-bottom: 1px solid var(--color-border); flex: none; }
.rail-nav { padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 0; }
.rail-item { width: 100%; padding-inline: 4px; padding-block: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; line-height: 16px; }
.rail-item .lbl { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
/* Figma's rail button: label under the icon, the full name in a tooltip to the right after 500ms. */
.rail-tip { position: fixed; z-index: 90; pointer-events: none; height: 24px; padding-inline: 8px; border-radius: 6px; background: var(--color-foreground); color: var(--color-background); font-size: 12px; line-height: 24px; white-space: nowrap; }
/* 20px glyph in a 32px button: one step up from the app's 16px icons, same compact rhythm. */
.rail-item .ib { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; }
.rail-item .ib svg.i { width: 20px; height: 20px; }
.rail-item:hover .ib { background: var(--color-accent); }
.rail-item[aria-current="true"] .ib { background: var(--design-editor-selection-color); color: var(--design-editor-accent-color); }
.rail-foot { margin-top: auto; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rail-foot button { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--color-foreground); }
.rail-foot button:hover { background: var(--color-accent); }
/* Toolkit AccountMenu compact trigger: 24px avatar in a 32px button (OrgSwitcher COMPACT_TRIGGER_CLASS / AVATAR_CLASS). */
.rail-foot .acct { width: 32px; height: 32px; border-radius: 6px; }
.rail-foot .acct[aria-expanded="true"] { background: var(--color-accent); }
.acct-av { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--color-border); background: var(--color-muted); color: var(--color-muted-foreground); font-size: 11px; font-weight: 600; display: grid; place-items: center; }

/* left file panel */
.panel { grid-row: 1 / 3; grid-column: 2; border-right: 1px solid var(--color-border); display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--color-background); }
.no-panel .panel { border-right: 0; }
/* Resize handle on the panel's right edge, like DesignEditor's col-resize strip. Widths snap to the 8pt grid: 240px by default, 232px to 416px. */
.panel { position: relative; }
.panel-resize { position: absolute; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; z-index: 6; }
.panel-resize::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px; background: transparent; transition: background .12s; }
.panel-resize:hover::after, .panel-resize.drag::after { background: var(--design-editor-accent-color); }
.no-panel .panel-resize { display: none; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
.file-head { height: 48px; flex: none; border-bottom: 1px solid var(--color-border); display: flex; align-items: center; gap: 12px; padding: 8px; position: relative; }
.file-id { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 0 8px; }
.file-name { display: flex; align-items: center; gap: 4px; height: 16px; border-radius: 4px; min-width: 0; text-align: left; }
.file-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-name svg { color: var(--color-muted-foreground); }
.file-name:hover svg, .file-name[aria-expanded="true"] svg { color: var(--color-foreground); }
/* Hover fill extends 4px past the text; the negative margin keeps the label flush with the file name. */
/* The fill stays on its own 16px line, 2px under the name, so it never paints over the name's descenders. */
.file-folder { height: 16px; margin: 2px 0 0 -4px; padding-inline: 4px; display: inline-flex; align-items: center; color: var(--color-muted-foreground); border-radius: 6px; align-self: flex-start; }
.file-folder:hover, .file-folder:focus-visible { color: var(--color-foreground); background: var(--color-accent); }
.icon-btn[aria-pressed="true"] { background: var(--design-editor-selection-color); color: var(--design-editor-accent-color); }

.tree { flex: 1; min-height: 0; overflow: auto; padding-bottom: 12px; }
.sec-head { height: 40px; display: flex; align-items: center; padding-right: 11px; position: sticky; top: 0; background: var(--color-background); z-index: 1; }
.sec-head + .sec-head, .sec-head.rule { box-shadow: inset 0 1px 0 var(--color-border); }
.sec-toggle { flex: 1; display: flex; align-items: center; height: 40px; min-width: 0; text-align: left; font-weight: 550; font-size: 11px; letter-spacing: .005em; }
.sec-toggle .chev { width: 16px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.sec-toggle .chev svg { transition: transform .12s; }
.sec-toggle[aria-expanded="false"] .chev svg { transform: rotate(-90deg); }
.sec-actions { display: flex; gap: 0; }
.sec-block { padding-bottom: 4px; }

.row { height: 32px; display: flex; align-items: center; padding-inline: 16px; gap: 0; font-size: 11px; line-height: 16px; letter-spacing: .005em; cursor: default; position: relative; user-select: none; }
.row:hover { background: var(--color-accent); }
.row[aria-selected="true"] { background: var(--design-editor-selected-subtree-color); }
.row .indent { display: flex; flex: none; }
.row .indent i { width: 24px; height: 32px; display: block; }
.row .slot { width: 16px; height: 16px; display: grid; place-items: center; flex: none; color: var(--color-muted-foreground); }
.row .slot.disc svg { transition: transform .12s; }
.row .slot.disc[aria-expanded="false"] svg { transform: rotate(-90deg); }
.row .gap { width: 8px; flex: none; }
.row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .trail { display: flex; gap: 4px; opacity: 0; margin-left: 8px; }
.row:hover .trail { opacity: 1; }
.row .trail button { width: 16px; height: 16px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.row .trail button:hover { color: var(--color-foreground); }
.row .ico { color: var(--color-foreground); }
.row.text .ico { color: var(--color-muted-foreground); }

/* spacing spec overlay */
.show-spec .row .indent i { background: repeating-linear-gradient(90deg, var(--spec-grid) 0 23px, var(--spec-line) 23px 24px); }
.show-spec .row .gap { background: var(--spec-grid); }
.show-spec .row { box-shadow: inset 0 -1px 0 var(--spec-grid); }
.show-spec .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 16px; background: var(--spec-grid); }

/* top bar */
/* Three columns so the route is centred on the bar. Equal 1fr sides; when one side outgrows its half it widens and the centre shifts instead of overlapping. */
.topbar { grid-row: 1; grid-column: 3 / 5; border-bottom: 1px solid var(--color-border); display: grid; grid-template-columns: minmax(max-content, 1fr) minmax(0, auto) minmax(max-content, 1fr) auto; align-items: center; column-gap: 8px; padding: 8px; min-width: 0; background: var(--color-background); }
/* The side columns never go below their content (.tb-zone's min-width: 0 would let them), so when the bar runs
   short the address bar shrinks and moves off center instead of sliding under the pickers. */
.tb-left { justify-self: start; gap: 8px; }
.tb-left-extra { gap: 8px; }
.tb-right { justify-self: end; }
/* Over the inspector, column 4 starts at its left edge (240 minus the bar's 8px padding), so zoom ends 8px before it
   and the avatars and actions get the inspector's width. */
.app:not(.no-inspector) .topbar { grid-template-columns: minmax(max-content, 1fr) minmax(0, auto) minmax(max-content, 1fr) 232px; }
.tb-insp { justify-self: end; min-width: 0; display: flex; align-items: center; gap: 12px; }
@media (max-width: 1100px) { .app:not(.no-inspector) .topbar { grid-template-columns: minmax(max-content, 1fr) minmax(0, auto) minmax(max-content, 1fr) auto; } }
.tb-zone { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tb-center { justify-content: center; }
.select { height: 28px; border: 1px solid var(--color-border); border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; font-size: 14px; line-height: 20px; white-space: nowrap; background: var(--color-background); min-width: 0; }
.select:hover { background: var(--color-accent); }
.select .v { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.select.route { width: clamp(200px, 14vw, 264px); font-weight: 500; }
.select.route .v { flex: 1; text-align: left; }
.select .chev { color: var(--color-foreground); opacity: .8; }
.nav-btns { display: inline-flex; gap: 2px; }
.nav-btns .icon-btn { width: 28px; height: 28px; }
.nav-btns .icon-btn[disabled] { opacity: .35; cursor: default; background: none; }
.avatars { display: flex; }
.avatars span { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--color-background); margin-right: -8px; display: grid; place-items: center; font-size: 9px; font-weight: 600; color: #fff; }
.avatars span:last-child { margin-right: 0; }
.tb-right { gap: 14px; flex: none; }
.tb-right .btns { display: flex; gap: 8px; }
.swap { animation: swap .16s ease-out; }
@keyframes swap { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }



/* frame tool presets: icon groups; preset names line up with the group icon, sizes right in tabular figures */
.fp-head { height: 40px; display: flex; align-items: center; padding: 0 16px; font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--color-border); flex: none; }
.insp-scroll.fp { padding: 4px 0 16px; }
.fp-cat { width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 8px; font-size: 12px; font-weight: 500; text-align: left; }
.fp-cat .chev { width: 16px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.fp-cat svg.i.s16 { color: var(--color-muted-foreground); }
.fp-row { width: 100%; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 32px; font-size: 12px; text-align: left; }
.fp-row:hover, .fp-cat:hover { background: var(--color-accent); }
.fp-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fp-row .wh { color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* canvas */
/* The dock is positioned against the canvas viewport, never the scrolling content, so short pages don't pull it up. */
.canvas { grid-row: 2; grid-column: 3; background: var(--design-editor-canvas-bg); position: relative; overflow: hidden; min-width: 0; }
.canvas-scroll { position: absolute; inset: 0; overflow: auto; }
/* Bottom room = toolbar 48 + 8 above + 8 below, so the last content scrolls clear of it. */
.canvas-inner { padding: 64px 28px 64px; display: flex; justify-content: center; min-width: max-content; }
.frame-label { position: absolute; transform: translateY(-20px); font-size: 11px; color: var(--color-muted-foreground); display: flex; gap: 6px; }
.page { width: 863px; background: var(--page-bg); color: var(--page-fg); position: relative; transform-origin: top center; }
.interact .page { cursor: default; }
.page [data-node], .page-thumb [data-node] { position: relative; }
.page-thumb { background: var(--page-bg); color: var(--page-fg); }
.page.show-grids::after { content: ""; position: absolute; inset: 0 56px; pointer-events: none; z-index: 2; background: repeating-linear-gradient(90deg, hsl(0 85% 60% / 0.10) 0 calc((100% - 11 * 24px) / 12), transparent calc((100% - 11 * 24px) / 12) calc((100% - 11 * 24px) / 12 + 24px)); }
.design .page [data-node]:hover { outline: 1px solid var(--design-editor-accent-color); outline-offset: 0; }
.page [data-node].sel { outline: 1.5px solid var(--design-editor-accent-color) !important; outline-offset: 0; }
.page .sel-tag, .page .sel-size { letter-spacing: 0; text-transform: none; text-align: left; }
.page .sel-tag { position: absolute; left: -1px; top: -18px; height: 16px; padding-inline: 4px; background: var(--design-editor-accent-color); color: #fff; font: 500 10px/16px var(--font); border-radius: 3px 3px 0 0; white-space: nowrap; pointer-events: none; }
.page .sel-size { position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%); height: 16px; padding-inline: 4px; background: var(--design-editor-accent-color); color: #fff; font: 500 10px/16px var(--font); border-radius: 3px; white-space: nowrap; pointer-events: none; }
.page.scheme-dark { --page-fg: hsl(0 0% 95%); --page-muted: hsl(0 0% 64%); --page-card: hsl(0 0% 12%); --page-bg: hsl(0 0% 7%); }
.page.scheme-dark .p-btn { border-color: hsl(0 0% 22%); }
.page.scheme-dark .p-card { background: var(--page-card); }
.page.scheme-dark .p-btn.dark { background: hsl(0 0% 96%); color: hsl(0 0% 8%); border-color: hsl(0 0% 96%); }
.page.scheme-dark .p-code { background: hsl(0 0% 9%); border-color: hsl(0 0% 20%); color: hsl(0 0% 85%); }
.page.scheme-dark .p-cmd code { border-color: hsl(0 0% 22%); color: hsl(0 0% 85%); }
.p-nav { display: flex; align-items: center; justify-content: space-between; padding: 20px var(--space-page, 56px); font-size: 13px; }
.p-nav .links { display: flex; gap: 20px; color: var(--page-muted); }
.p-nav .links a { color: inherit; text-decoration: none; cursor: pointer; }
.p-nav .links a:hover { color: var(--page-fg); }
.p-logo { font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
.p-hero { padding: 40px var(--space-page, 56px) var(--space-section, 64px); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.p-pill { height: 26px; padding-inline: 12px; border-radius: var(--radius-pill, 13px); background: var(--page-card); font-size: 12px; display: inline-flex; align-items: center; color: var(--page-muted); }
.p-h1 { font-size: 76px; line-height: 1.04; font-weight: var(--font-weight-display, 700); letter-spacing: var(--tracking-display, -0.035em); font-family: var(--font-display, var(--font)); margin: 0; text-wrap: balance; max-width: 700px; }
.p-sub { font-size: 17px; line-height: 1.35; color: var(--page-muted); max-width: 760px; margin: 0; text-wrap: balance; }
.p-ctas { display: flex; gap: 16px; }
.p-btn { height: 46px; padding-inline: 24px; border-radius: var(--radius-button, 23px); font-size: 16px; display: inline-flex; align-items: center; border: 1px solid #e5e5e5; color: var(--page-fg); background: var(--page-bg); }
.p-btn.dark { background: var(--color-primary, #171717); color: var(--color-on-primary, #fff); border-color: var(--color-primary, #171717); }
.interact .p-btn:hover { filter: brightness(.94); }
.p-btn { transition: filter var(--spring-fast, 150ms ease), background-color var(--duration-base, 250ms) var(--ease-standard, ease); }
.p-cmd { display: flex; gap: 16px; align-items: center; }
.p-cmd code { height: 40px; padding-inline: 16px; border-radius: 20px; border: 1px solid #e5e5e5; display: inline-flex; align-items: center; gap: 12px; font: 14px var(--font); color: #333; }
.p-cmd code b { color: var(--page-muted); font-weight: 400; }
.p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 0 var(--space-page, 56px) var(--space-page, 56px); }
.p-card { background: var(--color-surface, var(--page-card)); border-radius: var(--radius-card, 24px); padding: var(--space-card, 32px); box-shadow: var(--shadow-card, none); display: flex; flex-direction: column; gap: 14px; min-height: 260px; }
.p-eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--page-muted); }
.p-card h3 { font-size: 22px; line-height: 1.2; margin: 0; letter-spacing: -0.015em; }
.p-card p { margin: 0; color: var(--page-muted); font-size: 15px; line-height: 1.4; }
.p-code { background: #fff; border: 1px solid #ececec; border-radius: 12px; padding: 14px; font: 12px/1.6 var(--mono); color: #333; }
.p-code .s { color: var(--color-link, #0a6bd6); }
/* responsive exploration: the frame renders at its true width (scaled to fit), the page is the
   "page" container, and rules compile to container queries in #resp-css */
.page.resp { container: page / inline-size; }
.p-menu { display: none; width: 34px; height: 34px; border-radius: 17px; border: 1px solid #e5e5e5; align-items: center; justify-content: center; }
.p-menu svg.i { width: 18px; height: 18px; }
.resp-handle { display: none; }
.frame-selected > .resp-handle { display: flex; }
.frame-selected > .page { outline: 1.5px solid var(--design-editor-accent-color); }
.inp.tokfield { padding-right: 0; }
.tok-chip { display: inline-flex; align-items: center; gap: 4px; height: 18px; margin-right: auto; padding: 0 6px; border-radius: 4px; background: var(--design-editor-selection-color); color: var(--design-editor-accent-color); font: 500 11px/18px var(--font); }
.tok-chip svg.i { width: 12px; height: 12px; }
/* A URL screen's connection: a status dot, green when your code has every edit, amber when some edits haven't
   reached it yet, grey when the app doesn't answer. */
.sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-agent-kit-positive); flex: none; }
.sdot.off { background: var(--color-muted-foreground); }
.sdot.warn { background: var(--warn); }
.topbar #unsaved-btn { padding-inline: 8px; }
.row .sdot { margin-right: 4px; }
/* Review changes: GitHub-style. Changed files in their folders on the left (shadcn checkboxes pick what saves),
   the selected file's diff on the right. */
.dlg.review-dlg { width: min(880px, 100%); height: min(560px, calc(100vh - 32px)); }
.dlg.review-dlg .dlg-f { justify-content: flex-end; }
.rv { flex: 1; min-height: 0; display: grid; grid-template-columns: 240px minmax(0, 1fr); border-top: 1px solid var(--color-border); }
.rv-tree { border-right: 1px solid var(--color-border); overflow: auto; padding: 8px 0; font-size: 12px; }
.rv-dir, .rv-file { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; }
.rv-dir { color: var(--color-muted-foreground); }
.rv-file { padding-left: 36px; cursor: default; }
.rv-file:hover { background: var(--color-accent); }
.rv-file[aria-selected="true"] { background: var(--design-editor-selected-subtree-color); }
.rv-file .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
.rv-file > svg { color: var(--warn); flex: none; }
.cbx { width: 16px; height: 16px; flex: none; border-radius: 4px; border: 1px solid var(--color-border); background: var(--color-background); color: var(--color-primary-foreground); display: grid; place-items: center; box-shadow: 0 1px 2px rgb(0 0 0 / 5%); }
.cbx svg { width: 12px; height: 12px; stroke-width: 3; }
.cbx[aria-checked="true"], .cbx[aria-checked="mixed"] { background: var(--color-primary); border-color: var(--color-primary); }
.cbx:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--design-editor-selection-color); border-color: var(--design-editor-accent-color); }
.cbx:disabled { opacity: .5; cursor: not-allowed; }
.rv-n { font: 11px/16px var(--mono); white-space: nowrap; }
.rv-n .a { color: var(--diff-add); } .rv-n .d { color: var(--diff-del); }
.rv-diff { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.rv-ch { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; font-size: 12px; border-bottom: 1px solid var(--color-border); flex: none; }

.rv-chip { padding: 2px 6px; border-radius: 6px; background: var(--color-muted); font: 12px/16px var(--mono); }
.rv-ch .grow { flex: 1; }
.rv-ch .btn { height: 24px; border-radius: 6px; font-size: 12px; padding-inline: 8px; gap: 6px; }
.rv-bar { display: inline-flex; gap: 2px; margin-left: 6px; vertical-align: -1px; }
.rv-bar i { width: 8px; height: 8px; border-radius: 2px; background: var(--color-border); }
.rv-bar i.a { background: var(--diff-add); } .rv-bar i.d { background: var(--diff-del); }
.rv-warn { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--color-border); font-size: 12px; line-height: 16px; flex: none; }
.rv-warn > svg { color: var(--warn); flex: none; }
.rv-warn span { flex: 1; }
.rv-warn .btn { height: 24px; border-radius: 6px; font-size: 12px; padding-inline: 8px; flex: none; }
.rv-code { flex: 1; overflow: auto; font: 12px/20px var(--mono); padding: 4px 0; }
.rv-gap { height: 12px; }
.rv-ln { display: grid; grid-template-columns: 40px 20px max-content; white-space: pre; min-width: 100%; }
.rv-ln .no { color: var(--color-muted-foreground); text-align: right; padding-right: 8px; user-select: none; }
.rv-ln .sg { user-select: none; }
.rv-ln.add { background: var(--diff-add-bg); } .rv-ln.add .sg, .rv-ln.add .no { color: var(--diff-add); }
.rv-ln.del { background: var(--diff-del-bg); } .rv-ln.del .sg { color: var(--diff-del); }
.rv-ln.add mark { background: var(--diff-add-word); color: inherit; border-radius: 2px; }
.rv-ln.del mark { background: var(--diff-del-word); color: inherit; border-radius: 2px; }
.rv-ln .tg, .cv-ln .tg { color: var(--syn-tag); } .rv-ln .at, .cv-ln .at { color: var(--syn-attr); } .rv-ln .st, .cv-ln .st { color: var(--syn-str); }
/* Code mode: the code workbench (code-workbench/) as a third mode. Files in the left panel on the Layers row,
   then tabs, breadcrumbs, the editor, and a status bar where the canvas was. */
.code-view { position: absolute; inset: 0; display: none; flex-direction: column; background: var(--color-background); }
.app.code-mode .code-view { display: flex; }
.app.code-mode #canvas-wrap > :not(.code-view) { display: none !important; }
.cv-tabs { display: flex; height: 40px; flex: none; border-bottom: 1px solid var(--color-border); overflow-x: auto; scrollbar-width: none; }
.cv-tab { display: flex; align-items: center; gap: 6px; padding: 0 4px 0 12px; font-size: 12px; color: var(--color-muted-foreground); border-right: 1px solid var(--color-border); white-space: nowrap; cursor: default; }
.cv-tab svg.i { width: 14px; height: 14px; }
.cv-tab[aria-selected="true"] { color: var(--color-foreground); box-shadow: inset 0 -2px 0 var(--color-foreground); }
.cv-tab .x { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; color: var(--color-muted-foreground); visibility: hidden; }
.cv-tab:hover .x, .cv-tab[aria-selected="true"] .x { visibility: visible; }
.cv-tab .x:hover { background: var(--color-accent); color: var(--color-foreground); }
.cv-crumbs { height: 24px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 12px; font-size: 11px; color: var(--color-muted-foreground); }
.cv-crumbs svg.i { width: 12px; height: 12px; }
.cv-code { flex: 1; overflow: auto; font: 12px/20px var(--mono); padding-bottom: 24px; }
.cv-ln { display: grid; grid-template-columns: 48px 3px 13px max-content; white-space: pre; min-width: 100%; }
.cv-ln .no { color: var(--color-muted-foreground); text-align: right; padding-right: 12px; user-select: none; }
.cv-ln.unsaved .mk { background: var(--warn); }
.cv-ln.flash { background: var(--design-editor-selected-subtree-color); }
.cv-status { height: 24px; flex: none; border-top: 1px solid var(--color-border); display: flex; align-items: center; gap: 16px; padding: 0 12px; font-size: 11px; color: var(--color-muted-foreground); }
.cv-status .grow { flex: 1; }
.cv-status button { display: inline-flex; align-items: center; gap: 6px; color: inherit; }
.cv-status button:hover { color: var(--color-foreground); }
.cv-empty { flex: 1; display: grid; place-items: center; color: var(--color-muted-foreground); font-size: 12px; }
.topbar #goto-file .k { color: var(--color-muted-foreground); font-size: 11px; flex: none; }
.inp.sel .v { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.src-offline { position: absolute; left: 50%; top: 24px; translate: -50% 0; z-index: 3; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 12px; border-radius: 8px; background: var(--color-popover); box-shadow: var(--agent-kit-overlay-elevation); font-size: 12px; white-space: nowrap; }
.src-offline button { height: 24px; padding: 0 8px; border-radius: 6px; background: var(--color-muted); font-weight: 500; }
.src-offline button:hover { background: var(--color-border); }
.page.stale { filter: grayscale(1); opacity: .55; }
.segt { display: flex; padding: 2px; border-radius: 6px; background: var(--color-muted); }
.segt button { flex: 1; height: 20px; border-radius: 4px; font-size: 12px; color: var(--color-muted-foreground); }
.segt button[aria-pressed="true"] { background: var(--color-background); color: var(--color-foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 10%); }
.frame-label .fl-name { font: inherit; color: inherit; padding: 0 2px; border-radius: 3px; }
.frame-label .fl-name:hover, .frame-label .fl-name[aria-pressed="true"] { color: var(--design-editor-accent-color); }
.frame-selected > .resp-handle { position: absolute; top: 0; bottom: 0; right: -10px; width: 20px; cursor: ew-resize; display: flex; align-items: center; justify-content: center; z-index: 5; }
.resp-handle::before { content: ""; width: 4px; height: 40px; border-radius: 2px; background: var(--design-editor-accent-color); opacity: .5; }
.resp-handle:hover::before, .resp-handle.drag::before { opacity: 1; }
.resp-readout { position: absolute; top: -26px; right: -4px; transform: translateX(50%); height: 20px; padding: 0 6px; border-radius: 4px; background: var(--design-editor-accent-color); color: #fff; font: 500 11px/20px var(--font); white-space: nowrap; pointer-events: none; }
.frame-label .fl-w { display: inline-flex; align-items: center; gap: 2px; height: 16px; padding: 0 4px; margin-left: 2px; border-radius: 4px; color: var(--color-foreground); font: inherit; }
.frame-label .fl-w:hover { background: var(--color-accent); }
.resp-rules { display: flex; flex-direction: column; gap: 8px; padding: 0 16px 12px; }
.resp-rule { display: grid; grid-template-columns: minmax(0, 1fr) 24px; gap: 4px; align-items: center; }
.resp-rule .dd-btn.change { grid-column: 1; }
.resp-rule .dd-btn { height: 24px; min-width: 0; padding: 0 4px 0 8px; border-radius: 6px; background: var(--color-muted); display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 12px; }
.resp-rule .dd-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resp-rule code { grid-column: 1 / -1; font: 11px/16px var(--mono); color: var(--color-muted-foreground); }
.p-docs { padding: 56px; display: flex; flex-direction: column; gap: 16px; min-height: 640px; }
.p-docs h2 { font-size: 40px; letter-spacing: -0.03em; margin: 0; }
.p-docs .toc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.p-docs .toc div { background: var(--page-card); border-radius: 16px; padding: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }

/* floating dock: fixed dark chrome. Split buttons: 32px tool, 1px gap, 16px chevron, each with its own hover/pressed fill. */
.dock { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: var(--dock); color: var(--dock-fg); border-radius: 12px; padding: 8px; display: flex; gap: 2px; box-shadow: 0 2px 3px rgb(0 0 0 / 22%); z-index: 5; }
.split { display: grid; grid-template-columns: 32px 16px; column-gap: 1px; height: 32px; }
.split.solo { grid-template-columns: 32px; }
.split button { height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--dock-fg); }
.split .main:hover, .split .chev:hover { background: var(--dock-hover); }
.split .chev { color: var(--dock-muted); }
.split .chev:hover, .split .chev[aria-expanded="true"] { color: var(--dock-fg); }
.split .chev[aria-expanded="true"] { background: var(--dock-pressed); }
.split .main[aria-pressed="true"] { background: var(--design-editor-accent-color); }
.split .main[aria-pressed="true"]:hover { background: var(--design-editor-accent-hover-color); }
.dock-menu { position: absolute; bottom: calc(100% + 4px); background: var(--dock-menu); color: var(--dock-fg); border-radius: 12px; padding: 8px; min-width: 168px; box-shadow: 0 8px 24px rgb(0 0 0 / 28%); z-index: 6; animation: swap .12s ease-out; }
.dock-menu button { width: 100%; height: 28px; padding-inline: 8px; display: grid; grid-template-columns: 12px 16px 1fr auto; align-items: center; column-gap: 10px; border-radius: 6px; font-size: 13px; text-align: left; white-space: nowrap; }
.dock-menu button:hover, .dock-menu button:focus-visible { background: var(--design-editor-accent-color); outline: none; }
.dock-menu button:hover .kbd, .dock-menu button:focus-visible .kbd { color: var(--dock-fg); }
.dock-menu .kbd { color: var(--dock-muted); font-size: 12px; padding-left: 16px; }
.dock-menu hr { border: 0; border-top: 1px solid rgb(255 255 255 / 10%); margin: 6px -8px; }

/* inspector */
.insp { grid-row: 2; grid-column: 4; border-left: 1px solid var(--color-border); display: flex; flex-direction: column; min-width: 0; overflow: hidden; background: var(--color-background); }
.no-inspector .insp { border-left: 0; }
.insp-tabs { height: 40px; padding: 8px 8px 0; flex: none; display: flex; align-items: center; }
.insp-tabs .kit-seg button { padding-inline: 6px; }
.insp-scroll { flex: 1; min-height: 0; overflow: auto; }
.g5 { display: grid; grid-template-columns: 88px 8px 88px 8px 32px; align-items: center; }
.g5 > .c1 { grid-column: 1; } .g5 > .c3 { grid-column: 3; } .g5 > .c5 { grid-column: 5; justify-self: center; }
.g5 > .c13 { grid-column: 1 / 4; } .g5 > .c15 { grid-column: 1 / 6; } .g5 > .c35 { grid-column: 3 / 6; }
.sel-head { padding: 0 8px; border-bottom: 1px solid var(--color-border); }
.sel-head .g { display: grid; grid-template-columns: 160px 64px; height: 32px; align-items: center; }
.sel-head .nm { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0; }
.sel-head .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail2 { display: grid; grid-template-columns: 32px 32px; justify-items: center; }
.state { padding: 8px; }
.state button { width: 100%; height: 24px; border-radius: 6px; background: var(--color-muted); display: flex; align-items: center; justify-content: space-between; padding-inline: 8px; font-size: 11px; font-weight: 600; }
.psec { box-shadow: inset 0 1px 0 var(--color-border); padding-inline: 8px; }
.psec-h { height: 40px; display: grid; grid-template-columns: 1fr auto; align-items: center; }
.psec-h .t { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; height: 16px; text-align: left; }
.psec-h .t .chev { width: 12px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.psec-h .t .chev svg { transition: transform .12s; }
.psec-h .t[aria-expanded="false"] .chev svg { transform: rotate(-90deg); }
.psec-h .acts { display: grid; grid-auto-flow: column; grid-auto-columns: 32px; justify-items: center; }
.psec-b { display: flex; flex-direction: column; gap: 8px; padding-bottom: 12px; }
.psec.empty .psec-b { display: none; }
.field { display: flex; flex-direction: column; gap: 4px; }
.flabel { font-size: 10px; line-height: 12px; color: var(--color-muted-foreground); height: 12px; }
.inp { height: 24px; border-radius: 6px; background: var(--color-muted); display: flex; align-items: center; min-width: 0; overflow: hidden; border: 1px solid transparent; }
.inp:hover { border-color: var(--color-border); }
.inp:focus-within { border-color: var(--design-editor-accent-color); }
.inp .pre { width: 24px; height: 22px; display: grid; place-items: center; color: var(--color-muted-foreground); font-size: 11px; font-weight: 500; flex: none; cursor: ew-resize; }
.inp input { flex: 1; min-width: 0; height: 22px; border: 0; background: none; font-size: 11px; padding: 0 6px 0 0; outline: none; font-variant-numeric: tabular-nums; }
.inp .post { width: 20px; height: 22px; display: grid; place-items: center; color: var(--color-muted-foreground); flex: none; }
.inp.sel { justify-content: space-between; padding-inline: 6px 4px; font-size: 11px; cursor: pointer; }
.segc { height: 24px; border-radius: 6px; background: var(--color-muted); display: flex; overflow: hidden; }
.segc button { flex: 1; display: grid; place-items: center; color: var(--color-muted-foreground); min-width: 24px; border-radius: 6px; }
.segc button:hover { color: var(--color-foreground); }
.segc button[aria-pressed="true"] { background: var(--color-background); color: var(--color-foreground); box-shadow: inset 0 0 0 1px var(--color-border); }
.segc.disabled button { opacity: .4; pointer-events: none; }
.swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--color-border); flex: none; margin-left: 6px; }
.fillrow { display: grid; grid-template-columns: 160px 32px 32px; align-items: center; justify-items: center; }
.fillrow .inp { width: 160px; gap: 6px; justify-self: start; }
.fillrow .fillfield { gap: 0; padding-right: 0; }
.fillrow .fill-main { flex: 1; min-width: 0; height: 22px; display: flex; align-items: center; gap: 6px; text-align: left; }
.fillrow .fill-main .tok-chip { margin-right: auto; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fillrow .inp .hex { flex: 1; min-width: 0; text-align: left; text-transform: uppercase; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Only a hex reads in capitals; a gradient's type, Image, or a CSS color keeps its own case. */
.fillrow .inp .hex.name { text-transform: none; }
/* A P3 or OKLCH reading needs about 114px; at full opacity it takes the percent's room, and the percent shows once it isn't 100%. */
.fillrow .inp .hex.wide { padding-right: 0; letter-spacing: -0.01em; }
/* The color space, when a color is past sRGB: muted, like a field prefix. */
.cpre { margin-right: 3px; color: var(--color-muted-foreground); }
.fillrow .inp .pct { color: var(--color-muted-foreground); font-size: 11px; padding-right: 8px; }
.wide-btn { height: 24px; border-radius: 6px; background: var(--color-muted); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; font-weight: 500; width: 100%; }
.wide-btn:hover { background: var(--color-border); }
.export-row { display: grid; grid-template-columns: 72px 1fr 1fr; gap: 4px; }
.disclose { display: inline-flex; align-items: center; gap: 4px; color: var(--color-muted-foreground); font-size: 10px; height: 16px; }
.show-spec .psec-b > .g5, .show-spec .psec-b > .fillrow { background: linear-gradient(90deg, var(--spec-grid) 0 88px, transparent 88px 96px, var(--spec-grid) 96px 184px, transparent 184px 192px, var(--spec-grid) 192px 224px); outline: 1px dashed var(--spec-line); }
.show-spec .psec-h { background: linear-gradient(var(--spec-grid), var(--spec-grid)) no-repeat right center / 64px 24px; }
.show-spec .psec-b { box-shadow: inset 0 -12px 0 var(--spec-grid); }

.comments { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.comment { border-radius: 8px; padding: 10px; background: var(--color-muted); display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 16px; }
.comment .who { display: flex; align-items: center; gap: 6px; font-weight: 600; }
.comment .who span.d { width: 16px; height: 16px; border-radius: 50%; }
.comment .when { color: var(--color-muted-foreground); font-weight: 400; margin-left: auto; font-size: 11px; }

/* interact-mode inspector */
.int-panel { display: flex; flex-direction: column; }
.int-panel .note { color: var(--color-muted-foreground); font-size: 11px; line-height: 16px; padding: 8px 8px 12px; }


/* keyboard shortcuts window: a modal, not a bottom drawer. Search + category rail + one scrolling list. */
.ks { width: min(760px, 100%); height: min(640px, calc(100vh - 32px)); background: var(--color-popover); color: var(--color-foreground); border: 1px solid var(--color-border); border-radius: 12px; box-shadow: var(--agent-kit-overlay-elevation); display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
/* shadcn Dialog: title row with the close button, then content. Search is content, in its own row. */
.ks-h { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; height: 52px; border-bottom: 1px solid var(--color-border); }
.ks-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.ks-search { height: 32px; margin-bottom: 8px; flex: none; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-background); display: flex; align-items: center; gap: 8px; padding: 0 4px 0 10px; color: var(--color-muted-foreground); }
.ks-search:focus-within { border-color: var(--design-editor-accent-color); box-shadow: 0 0 0 3px var(--design-editor-selection-color); }
.ks-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 13px; color: var(--color-foreground); }
.ks-search input::-webkit-search-cancel-button { display: none; }
.ks-search .ks-clear { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--color-muted-foreground); flex: none; }
.ks-search .ks-clear:hover { background: var(--color-accent); color: var(--color-foreground); }
.ks-row mark { background: var(--design-editor-selection-color); color: inherit; border-radius: 3px; padding: 0 1px; }
.ks-b { display: grid; grid-template-columns: 200px minmax(0, 1fr); min-height: 0; }
.ks-nav { border-right: 1px solid var(--color-border); padding: 8px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
.ks-cats { display: flex; flex-direction: column; gap: 2px; }
.ks-cats button { height: 28px; padding: 0 8px; border-radius: 6px; text-align: left; font-size: 13px; color: var(--color-muted-foreground); }
.ks-cats button:hover { background: var(--color-accent); color: var(--color-foreground); }
.ks-cats button[aria-current="true"] { background: var(--color-accent); color: var(--color-foreground); font-weight: 500; }
.ks-list { overflow: auto; padding: 0 16px 16px; scroll-padding-top: 8px; }
.ks-sec h3 { position: sticky; top: 0; margin: 0; padding: 16px 0 6px; background: var(--color-popover); font-size: 12px; font-weight: 600; color: var(--color-muted-foreground); z-index: 1; }
.ks-row { height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-radius: 6px; padding: 0 8px; margin: 0 -8px; font-size: 13px; }
.ks-row:hover { background: var(--color-accent); }
.ks-row .l { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ks-row .ctx { color: var(--color-muted-foreground); font-size: 12px; margin-left: 6px; }
.ks-keys { display: flex; align-items: center; gap: 6px; flex: none; }
.ks-combo { display: inline-flex; gap: 3px; }
.kc { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--color-border); border-bottom-width: 2px; background: var(--color-background); display: inline-grid; place-items: center; font: 500 11px/1 var(--font); color: var(--color-foreground); }
.ks-or { color: var(--color-muted-foreground); font-size: 11px; }
.ks-nudge { display: flex; align-items: center; gap: 8px; padding: 8px 0 4px; font-size: 13px; color: var(--color-muted-foreground); }
.ks-nudge label { display: inline-flex; align-items: center; gap: 6px; }
.ks-nudge input { width: 44px; height: 24px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-background); padding: 0 6px; font-size: 12px; text-align: right; }
.ks-empty { padding: 40px 0; text-align: center; color: var(--color-muted-foreground); font-size: 13px; }
@media (max-width: 640px) { .ks-b { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } .ks-nav { border-right: 0; padding-bottom: 0; } .ks-cats { display: none; } }


/* Version history: today's HistoryPanel.tsx. A modal shadcn Sheet from the right, 92vw up to 640px. */
.hs-scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 50%); z-index: 85; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
.hs { position: fixed; top: 0; right: 0; bottom: 0; width: min(92vw, 640px); background: var(--color-background); border-left: 1px solid var(--color-border); box-shadow: var(--agent-kit-overlay-elevation); z-index: 86; display: flex; flex-direction: column; animation: slidein .3s ease-out; }
@keyframes slidein { from { transform: translateX(100%); } }
.hs-h { padding: 16px 16px 12px; border-bottom: 1px solid var(--color-border); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; min-height: 49px; }
.hs-h .ic-accent { color: var(--design-editor-accent-color); }

.hs-x { position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; opacity: .7; }
.hs-x:hover { opacity: 1; }
.hs-list { flex: 1; overflow: auto; padding: 8px; }
.hs-item { width: 100%; border-radius: 6px; padding: 10px 12px; text-align: left; display: flex; gap: 12px; align-items: flex-start; }
.hs-item:hover { background: var(--color-accent); }
.hs-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--design-editor-accent-color); margin-top: 6px; flex: none; }
.hs-item .tt { min-width: 0; flex: 1; }
.hs-item .tl { display: flex; align-items: center; gap: 8px; }
.hs-item b { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hs-item small { font-size: 10px; color: var(--color-muted-foreground); flex: none; }
.hs-item .when { font-size: 11px; color: var(--color-muted-foreground); margin-top: 2px; }
.hs-meta { padding: 12px 16px; border-bottom: 1px solid var(--color-border); }
.hs-meta b { display: block; font-size: 14px; font-weight: 500; }
.hs-meta span { display: block; font-size: 11px; color: var(--color-muted-foreground); margin-top: 2px; }
.hs-grid { flex: 1; overflow: auto; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
.hs-thumb { min-width: 0; }
.hs-thumb .frame { aspect-ratio: 16 / 9; border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; position: relative; background: var(--page-bg); }
.hs-thumb .frame > div { position: absolute; left: 0; top: 0; width: 863px; transform-origin: top left; pointer-events: none; }
.hs-thumb > .fname { margin: 6px 0 0; font-size: 11px; color: var(--color-muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hs-foot { border-top: 1px solid var(--color-border); padding: 12px; }
.hs-foot .btn { width: 100%; height: 32px; justify-content: center; border-radius: 6px; font-size: 14px; }
.hs-empty { padding: 56px 24px; text-align: center; color: var(--color-muted-foreground); }
.hs-empty b { display: block; color: var(--color-foreground); font-size: 14px; font-weight: 500; margin-top: 12px; }
@media (max-width: 640px) { .hs-grid { grid-template-columns: 1fr; } }


/* history mode */
.history-mode .dock { display: none; }
.page.readonly, .page.readonly * { cursor: default !important; }
.tl-h { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 5px 0 16px; border-bottom: 1px solid var(--color-border); flex: none; }
.tl-h b { font-size: 12px; font-weight: 600; }
.tl-h .acts { display: flex; gap: 0; }
.tl { flex: 1; min-height: 0; overflow: auto; padding: 8px 8px 16px; position: relative; }
.tl-node { position: relative; width: 100%; display: grid; grid-template-columns: 24px 1fr; column-gap: 8px; padding: 6px 8px; border-radius: 6px; text-align: left; }
.tl-node:hover { background: var(--color-accent); }
.tl-node.on { background: var(--design-editor-selected-subtree-color); }
/* the connecting line runs through the node column */
.tl-node::before { content: ""; position: absolute; left: 19px; top: 0; bottom: 0; width: 1px; background: var(--color-border); }
.tl > .tl-node:first-of-type::before, .tl > .tl-form + .tl-node::before { top: 50%; }
.tl > :last-child.tl-node::before, .tl > .tl-group:last-child > .tl-node:last-child::before { bottom: calc(100% - 18px); }
.tl-dot { position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--color-muted); color: var(--color-foreground); }
.tl-dot.k-current { background: var(--design-editor-accent-color); color: #fff; }
.tl-dot.k-named { background: var(--color-background); box-shadow: inset 0 0 0 1px var(--color-border); }
.tl-dot.k-restore { background: var(--color-background); box-shadow: inset 0 0 0 1px var(--color-border); }
.tl-dot.k-auto { background: transparent; color: var(--color-muted-foreground); }
.tl-node.small { padding-block: 2px; }
.tl-node.small .tl-dot { width: 24px; height: 20px; background: transparent; }
.tl-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-top: 4px; }
.tl-body b { font-size: 12px; font-weight: 500; line-height: 16px; overflow: hidden; text-overflow: ellipsis; }
.tl-node.current b { color: var(--design-editor-accent-color); }
.tl-node.small b { font-weight: 400; }
.tl-note, .tl-when { font-size: 11px; line-height: 16px; color: var(--color-muted-foreground); }
.tl-author { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--color-muted-foreground); }
.tl-author .av16 { width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 9px; font-weight: 600; display: grid; place-items: center; flex: none; }
.tl-empty { margin: 12px 8px 0 40px; font-size: 11px; color: var(--color-muted-foreground); }
.tl-form { display: flex; flex-direction: column; gap: 8px; padding: 8px; margin-bottom: 8px; border: 1px solid var(--color-border); border-radius: 8px; }
.tl-form input, .tl-form textarea { border: 1px solid var(--color-border); border-radius: 6px; background: var(--color-background); font: 12px/16px var(--font); padding: 4px 8px; color: var(--color-foreground); resize: none; }
.tl-form input { height: 24px; }
.tl-form input:focus, .tl-form textarea:focus { outline: none; border-color: var(--design-editor-accent-color); }
.tl-form-acts { display: flex; justify-content: flex-end; gap: 8px; }
.tl-form-acts .btn { height: 24px; font-size: 12px; padding-inline: 8px; border-radius: 6px; }
.history-mode .insp { display: flex; flex-direction: column; }
.hist-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.hist-tag svg { color: var(--design-editor-accent-color); }
.hist-view { font-size: 12px; color: var(--color-muted-foreground); white-space: nowrap; }
.hist-view b { color: var(--color-foreground); font-weight: 500; }


/* tokens panel (TokensPanel.tsx), on the shared 16px row strip */
.tk-count { flex: 1; min-width: 0; font-size: 12px; color: var(--color-muted-foreground); }
/* Search swaps in for the whole header line; the field's own 8px padding keeps the icon on the 16px inset. */
.sec-head.searching { padding: 0 8px; }
.sec-head.searching .tk-search { margin-left: 0; }
.tk-search { flex: 1; min-width: 0; height: 32px; margin-left: -8px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-background); display: flex; align-items: center; gap: 6px; padding: 0 4px 0 7px; color: var(--color-muted-foreground); }
.tk-search:focus-within { border-color: var(--design-editor-accent-color); box-shadow: 0 0 0 3px var(--design-editor-selection-color); }
.tk-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 12px; color: var(--color-foreground); }
.tk-search .kbd { padding-right: 4px; }
.tk-search .tk-clear { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--color-muted-foreground); flex: none; }
.tk-search .tk-clear:hover { background: var(--color-accent); color: var(--color-foreground); }
.row.tk .tk-sw { width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%); }
.row.tk[aria-expanded="true"] { background: var(--color-accent); }
.row.tk .tk-warn { margin-left: 6px; display: grid; color: var(--warning); flex: none; }
.row.tk .tk-glyph { color: var(--color-muted-foreground); }
.row.tk .tk-ease { width: 16px; height: 16px; display: grid; color: var(--color-foreground); }
/* A preset name is a word, so it reads in the UI font; custom control points stay mono like other values. */
.row.tk .tk-val.word { font-family: var(--font); max-width: 112px; }
/* Curve editor (Easing and Spring tokens): the color picker's 272px popover, 12px padding, one 248px column.
   A square graph with left and bottom axes; handles sit on dashed tethers to the curve's ends. */
.cpk.curve { display: grid; }
.curve-name { font-size: 12px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.curve-name.custom { color: var(--color-muted-foreground); font-weight: 400; }
.curve-body { padding: 12px; display: grid; gap: 8px; }
.curve-fields .curve-mode { grid-column: 2 / 4; height: 24px; }
/* Spring rows: label 64 · slider 112 · value 56, on the 248px column. */
.curve-fields.springs { grid-template-columns: 64px 112px 56px; align-items: center; row-gap: 8px; column-gap: 8px; }
.cs-l { font-size: 11px; color: var(--color-muted-foreground); }
.cs-track { --t: 0; height: 16px; border-radius: 8px; background: var(--color-accent); position: relative; cursor: ew-resize; touch-action: none; }
.cs-track::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(8px + var(--t) * (100% - 16px)); border-radius: 8px; background: var(--design-editor-selection-color); }
.cs-knob { position: absolute; top: 0; left: calc(var(--t) * (100% - 16px)); width: 16px; height: 16px; border-radius: 50%; background: var(--color-background); box-shadow: 0 0 0 1px var(--color-border), 0 1px 2px rgb(0 0 0 / 16%); }
.cs-v { height: 24px; }
.cs-v input { text-align: right; padding-right: 6px; }
.cs-calc { grid-column: 2 / 4; justify-self: end; padding-right: 6px; font-size: 11px; color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }
.curve-graph { display: block; overflow: visible; touch-action: none; }
.curve-graph .axis { stroke: var(--color-border); stroke-width: 1; }
.curve-graph .guide { stroke: var(--color-border); stroke-width: 1; stroke-dasharray: 2 4; }
.curve-graph .tether { stroke: var(--color-muted-foreground); stroke-width: 1; stroke-dasharray: 3 3; opacity: .7; }
.curve-graph .line { fill: none; stroke: var(--design-editor-accent-color); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.curve-graph .end { fill: var(--design-editor-accent-color); opacity: .3; }
.curve-graph .h { fill: var(--design-editor-accent-color); cursor: grab; }
.curve-graph .h:active { cursor: grabbing; }
.curve-graph .h:hover, .curve-graph .h:focus-visible { outline: none; stroke: var(--design-editor-selection-color); stroke-width: 6; }
.curve-track { height: 16px; border-radius: 8px; background: var(--color-accent); position: relative; }
.curve-dot { position: absolute; left: 4px; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--design-editor-accent-color); }
.curve-fields { display: grid; grid-template-columns: repeat(4, 56px); gap: 8px; }
.curve-fields .inp { height: 24px; }

.row.tk .tk-val { margin-left: 8px; font: 11px/16px var(--mono); color: var(--color-muted-foreground); max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: none; text-align: right; }
.row.tk:hover .tk-val { color: var(--color-foreground); }
.row.tk input.tk-edit { margin-left: 8px; width: 104px; height: 20px; border: 1px solid var(--design-editor-accent-color); border-radius: 4px; background: var(--color-background); font: 11px/16px var(--mono); padding: 0 4px; color: var(--color-foreground); flex: none; }
/* Color picker: 252px popover. Custom: the mode's field, eyedropper beside hue and opacity, Previous/New beside them,
   [Mode ▾] and one joined value field, Document colors. Libraries (inspector only): tokens. Both panes share one grid cell. */
/* Every edge sits on the 8pt grid: 272px wide, 12px padding, one 248px column. The border is an inset ring, like Figma's
   inside stroke, so it takes no layout space; a real 1px border would push the column off the grid. The square is 248; the slider row is
   eyedropper 24 · 8 · two 16px tracks of 168 · 8 · a 40px Previous/New swatch; the value rows share columns 64 · 64 · 64 · 32
   with 8px gaps (the inspector's trailing 32); document colors are 8 × 24 with 8px gaps. */
.cpk { position: fixed; z-index: 49; width: 272px; background: var(--color-popover); color: var(--color-foreground); border-radius: 6px; box-shadow: inset 0 0 0 1px var(--color-border), 0 20px 25px -5px rgb(0 0 0 / 10%), 0 8px 10px -6px rgb(0 0 0 / 10%); overflow: hidden; font-size: 11px; line-height: 16px; animation: swap .12s ease-out; }
.cpk-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--color-border); }
.cpk-head .tabs { display: flex; gap: 4px; margin-left: -8px; }
.cpk-head .acts { display: flex; align-items: center; gap: 4px; }
/* Paint row: the paint types on the left, Blend and Contrast on the right. 24px buttons at 8px, so glyphs line up on the 12px column. */
.cpk-types { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; border-bottom: 1px solid var(--color-border); }
.cpk-types .grp { display: flex; gap: 4px; }
.cpk-types .icon-btn { width: 24px; height: 24px; }
/* Gradient: Type and Angle on the value grid's columns (136 · 104), then the stop bar; the selected stop is edited below. */
.cpk-image { padding: 12px 12px 0; display: grid; grid-template-columns: 136px 104px; gap: 8px; }
.cpk-grad { padding: 12px 12px 4px; display: grid; gap: 8px; }
.cpk-grad .inp, .cpk-image .inp, .cpk-image .btn { height: 24px; }
/* Gradient, as Figma's: Type, then Flip and Rotate; pins over the bar; the Stops list. */
.cpk-grow { display: flex; align-items: center; justify-content: space-between; }
.cpk-grow .cpk-gkind { width: 136px; }
.cpk-grow .grp { display: flex; gap: 4px; margin-right: -4px; }
.cpk-grow .icon-btn, .cpk-shead .icon-btn, .cpk-srm, .cpk-shmore { width: 24px; height: 24px; }
.cpk-grot:disabled { opacity: .4; }
.cpk-gbar { position: relative; height: 52px; cursor: copy; touch-action: none; }
.cpk-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 10%); background-image: var(--cpk-fill), repeating-conic-gradient(#ddd 0 25%, #fff 0 50%); background-size: auto, 8px 8px; }
.cpk-pin { position: absolute; top: 0; width: 20px; height: 20px; translate: -50% 0; border-radius: 5px; padding: 2px; background: var(--color-background); box-shadow: 0 0 0 1px rgb(0 0 0 / 14%), 0 1px 3px rgb(0 0 0 / 18%); cursor: grab; }
/* A stop's color sits over the checker, so a transparent stop reads as transparent, not white. */
.cpk-pin::before { content: ""; display: block; width: 16px; height: 16px; border-radius: 3px; background: linear-gradient(var(--c), var(--c)), repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 8px 8px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%); }
.cpk-pin::after { content: ""; position: absolute; left: 50%; bottom: -4px; translate: -50% 0; border: 4px solid transparent; border-top-color: var(--color-background); border-bottom: 0; }
.cpk-pin[aria-pressed="true"] { background: var(--design-editor-accent-color); box-shadow: 0 1px 3px rgb(0 0 0 / 22%); z-index: 1; }
.cpk-pin[aria-pressed="true"]::after { border-top-color: var(--design-editor-accent-color); }
.cpk-shead { height: 24px; display: flex; align-items: center; justify-content: space-between; margin-right: -4px; font-size: 12px; font-weight: 500; }
/* A stop row: position 56 · color with its opacity 152 · − 24, on the 248px column; the selected row fills edge to edge. */
.cpk-slist { margin: 0 -12px; }
.cpk-srow { display: grid; grid-template-columns: 56px 152px 24px; gap: 8px; align-items: center; height: 32px; padding: 0 12px; }
.cpk-srow[aria-selected="true"] { background: var(--design-editor-selected-subtree-color); }
.cpk-srow .inp { height: 24px; }
.cpk-spos input { padding-left: 6px; }
.cpk-scol { display: flex; align-items: center; gap: 0; padding-right: 6px; }
.cpk-sswatch { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; height: 24px; padding-left: 4px; text-align: left; font-size: 11px; white-space: nowrap; overflow: hidden; text-transform: uppercase; }
.cpk-sswatch .sw { width: 14px; height: 14px; flex: none; border-radius: 3px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%); }
.cpk-sswatch:hover .sw, .cpk-shcol .sw:hover { box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%), 0 0 0 2px var(--design-editor-selection-color); }
.cpk-sswatch .v { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cpk-scol input { width: 28px; flex: none; text-align: right; padding: 0; }
.cpk-scol .post { width: auto; padding-left: 2px; color: var(--color-muted-foreground); }
/* Shader fills (GlslShaderPanel): search, Created by you, Presets as a two-column grid, then the picked shader's controls. */
.cpk-shader { padding: 12px; display: grid; gap: 8px; }
.cpk[data-paint="shader"] :is(.cpk-sv, .cpk-ctl, .cpk-val, .cpk-doc) { display: none; }
.cpk:not([data-paint="shader"]) .cpk-shader { display: none; }
.cpk-shsearch { height: 24px; }
.cpk-shscroll { max-height: 320px; overflow: auto; margin: 0 -12px; padding: 0 12px; }
.cpk-shlabel { height: 24px; display: flex; align-items: end; padding-bottom: 4px; color: var(--color-muted-foreground); }
.cpk-shgrid { display: grid; grid-template-columns: 120px 120px; gap: 8px; padding-bottom: 4px; }
.cpk-scard { display: grid; gap: 4px; text-align: left; border-radius: 6px; }
.cpk-scard .pv { height: 88px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 10%); display: grid; place-items: center; color: var(--color-muted-foreground); }
.cpk-scard.ai .pv { background: var(--color-accent); }
.cpk-scard:hover .pv { box-shadow: inset 0 0 0 1px rgb(0 0 0 / 10%), 0 0 0 2px var(--design-editor-selection-color); }
.cpk-scard .lb { font-size: 11px; line-height: 16px; }
.cpk-shhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cpk-shpick { flex: 1; height: 24px; }
.cpk-shmore { margin-right: -4px; }
.cpk-shcol { grid-column: 2 / 4; height: 24px; gap: 6px; padding-left: 4px; }
.cpk-shcol .sw { width: 14px; height: 14px; flex: none; border-radius: 3px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%); cursor: pointer; }
.cpk-image .btn { font-size: 11px; border-radius: 6px; justify-content: center; }
.cpk-img { grid-column: 1 / -1; height: 160px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 10%); background-color: var(--color-accent); }
.cpk-img.empty { background-image: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%); background-size: 8px 8px; }
.cpk[data-paint="image"] :is(.cpk-sv, .cpk-ctl, .cpk-val, .cpk-doc) { display: none; }
.cpk[data-paint="image"] .cpk-image { padding-bottom: 12px; }
.cpk[data-paint="gradient"] :is(.cpk-sv, .cpk-ctl, .cpk-val, .cpk-doc), .cpk:not([data-paint="gradient"]) .cpk-grad, .cpk:not([data-paint="image"]) .cpk-image, .cpk:not(.contrast-on) .cpk-cbar { display: none; }
/* Contrast mode: the ratio chip (Figma's) and the level it reaches; the square gets the line where it's met. */
.cpk-cbar { padding: 12px 12px 0; display: flex; align-items: center; justify-content: space-between; }
.cpk-chip { height: 24px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; background: var(--design-editor-selection-color); color: var(--design-editor-accent-color); font: 500 11px/16px var(--font); font-variant-numeric: tabular-nums; }
.cpk-level { display: inline-flex; align-items: center; gap: 4px; padding-right: 4px; font-weight: 600; }
.cpk-level.fail { color: var(--warning); }
.cpk-cov { position: absolute; left: 12px; top: 12px; width: 248px; height: 248px; border-radius: 4px; pointer-events: none; }
.cpk .icon-btn { width: 24px; height: 24px; padding: 0; border-radius: 6px; }
.cpk .icon-btn:hover { background: var(--color-accent); }
.cpk-head .tabs button { height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--color-muted-foreground); }
.cpk-head .tabs button[aria-selected="true"] { background: var(--color-muted); color: var(--color-foreground); }
.cpk-panes { display: grid; grid-template-columns: minmax(0, 1fr); }
.cpk-pane { grid-area: 1 / 1; min-width: 0; }
.cpk-pane[aria-hidden="true"] { visibility: hidden; }
.cpk-sv { position: relative; height: 260px; cursor: crosshair; touch-action: none; }
.cpk-sv canvas { position: absolute; left: 12px; top: 12px; width: 248px; height: 248px; border-radius: 4px; }
.cpk-knob { position: absolute; z-index: 1; width: 16px; height: 16px; translate: -50% -50%; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 22%), 0 1px 3px rgb(0 0 0 / 25%); pointer-events: none; background: var(--knob, transparent); }
.cpk-ctl { margin-top: 12px; padding: 0 12px; display: grid; grid-template-columns: 24px 168px 40px; column-gap: 8px; row-gap: 8px; align-items: center; }
.cpk-eye { grid-row: span 2; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; }
.cpk-eye:hover:not([disabled]) { background: var(--color-accent); }
.cpk-eye[disabled] { opacity: .5; cursor: default; }
/* Knobs travel from 8px to width − 8px, so they never leave the track, and each is filled with the value under it. */
.cpk-track { position: relative; height: 16px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 10%); cursor: pointer; touch-action: none; }
.cpk-track .cpk-knob { top: 50%; }
.cpk-alpha, .cpk-new, .cpk-prev, .cpk-alpha .cpk-knob { background-image: var(--cpk-fill), repeating-conic-gradient(#ddd 0 25%, #fff 0 50%); background-size: auto, 8px 8px; }
.cpk-cmp { grid-row: span 2; width: 40px; height: 40px; border-radius: 6px; overflow: hidden; display: grid; grid-template-rows: 1fr 1fr; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%); }
.cpk-cmp > * { display: block; width: 100%; height: 100%; }
.cpk-prev { cursor: pointer; }
.cpk-val { margin-top: 12px; padding: 0 12px 12px; display: grid; grid-template-columns: 64px 64px 64px 32px; gap: 8px; }
