const WINDOWS = ["Acme dashboard", "Release notes"];
const CAMERAS = ["Built-in camera", "Studio camera"];
const MICS = ["Built-in microphone", "USB microphone"];
const S = {
  scenario: "default", pop: false, mode: "screen-camera", source: "Full screen", camera: "Default camera", mic: "Default mic",
  camOn: true, micOn: true, sysAudio: false, bubbleSize: "small",
  phase: "idle", // idle | countdown | recording | done
  count: 3, ms: 0, paused: false, confirm: null, done: null, copied: false, guides: false,
  meeting: false, notes: false, notesMs: 0, signin: "email",
};
try { const t = localStorage.getItem("clips-desktop-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
const fmt = (ms) => { const s = Math.floor(ms / 1000); return s >= 6000 ? `${Math.floor(s / 3600)}:${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}h` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const dur = (ms) => { const s = Math.max(1, Math.round(ms / 1000)); return s < 60 ? `${s} sec` : `${Math.round(s / 60)} min`; };
const hasCam = () => S.mode !== "screen";

/* ───────── desktop ───────── */
function menuBar() {
  const rec = S.phase === "recording";
  return `<div class="mbar"><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span>
    <div class="r"><button class="tray" id="tray" aria-label="${rec ? "Clips — Recording (click to stop)" : "Clips"}" title="${rec ? "Clips — Recording (click to stop)" : "Clips"}" aria-expanded="${S.pop}">${rec ? `<span class="stopsq"></span><span class="tt">${S.paused ? "⏸ " : ""}${fmt(S.ms)}</span>` : '__LOGO_SMALL__'}</button>
    <span>${ic("wifi", "s14")}</span><span>${ic("battery-3", "s18")}</span><span>${ic("search", "s14")}</span><span>${new Date(2026, 9, 12, 9, 41).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</span></div></div>`;
}
const appWindow = () => `<div class="win" aria-hidden="true"><div class="tb"><i></i><i></i><i></i><span class="url">acme.example.com/dashboard</span></div><div class="bd">
  <i style="left:0;top:0;width:180px;bottom:0;border-radius:0"></i><i class="ln" style="left:24px;top:28px;width:96px"></i><i class="ln" style="left:24px;top:60px;width:120px"></i><i class="ln" style="left:24px;top:84px;width:88px"></i><i class="ln" style="left:24px;top:108px;width:110px"></i>
  <i class="ln" style="left:212px;top:28px;width:220px;height:14px"></i>
  <i style="left:212px;top:70px;width:196px;height:96px"></i><i style="left:424px;top:70px;width:196px;height:96px"></i><i style="left:636px;top:70px;width:212px;height:96px"></i>
  <i style="left:212px;top:186px;width:636px;height:300px"></i>
  ${[60, 110, 80, 150, 130, 190, 170, 220, 160, 240].map((h, n) => `<i style="left:${244 + n * 58}px;top:${462 - h}px;width:28px;height:${h}px;background:var(--desk-ink)"></i>`).join("")}
</div></div>`;

/* ───────── popover ───────── */
const MODES = [["screen", "Screen", "screen-mode"], ["screen-camera", "Screen and camera", "screen-camera-mode"], ["camera", "Camera", "camera-mode"]];
function wave() {
  const t = Date.now() / 160;
  const pts = Array.from({ length: 40 }, (_, i) => `${i * 2.5},${9 + Math.sin(i * 0.9 + t) * (S.micOn ? 2 + 4 * Math.abs(Math.sin(i * 0.31 + t / 3)) : 0)}`).join(" L");
  return `<svg class="wave" viewBox="0 0 100 18" preserveAspectRatio="none"><path d="M${pts}"/></svg>`;
}
function popover() {
  if (S.scenario === "signedout") return `<div class="pop" style="right:${popRight()}px"><div class="signin">
    <svg class="mark" viewBox="0 0 114 66" aria-hidden="true"><path d="M24.5537 65.7695H0L15.0859 39.4619L37.708 0L60.4912 39.4619H39.6396L24.5537 65.7695Z" fill="currentColor"/><path d="M89.446 0H114L76.2921 65.7704H51.7383L89.446 0Z" fill="currentColor"/></svg>
    <h1>Welcome to Clips</h1><p>Record your screen, camera, and mic. Share a link the moment you stop.</p>
    <button class="google" data-act="google" title="Comes back to Clips to finish sign-in">${ic("brand-google", "s14")}Sign in with Google</button>
    <div class="or">or</div>
    <input id="email" placeholder="you@example.com" aria-label="Email">${S.signin === "password" ? `<input type="password" placeholder="Password" aria-label="Password">` : ""}
    <button class="primary" data-act="signin">${S.signin === "password" ? "Sign in" : "Continue"}</button>
    <button class="lnk" data-act="signin-mode">${S.signin === "password" ? "Use a sign-in link instead" : "Use a password instead"}</button>
    <div class="foot"><span>clips.example.com</span><button class="lnk" data-act="server">Change server</button></div>
  </div></div>`;
  const camRow = `<div class="row ${S.camOn ? "" : "off"}"><span class="ri">${ic("camera", "s18")}</span><button class="rb" id="cam-btn"><span class="lab">${S.camOn ? S.camera : "Camera"}</span><span class="chev">${ic("chevron-down")}</span><span class="grow"></span></button><span class="tr" data-tip><button class="sw" role="switch" aria-checked="${S.camOn}" data-act="cam" aria-label="${S.camOn ? "Turn off camera" : "Turn on camera"}"></button><span class="tip">${S.camOn ? "Turn off camera" : "Turn on camera"}</span></span></div>`;
  return `<div class="pop" style="right:${popRight()}px" role="dialog" aria-label="Clips">
    <div class="home">
      <div class="mhead"><div class="mode-toggle" role="radiogroup" aria-label="Recording mode">${MODES.map(([k, t, i]) => `<button role="radio" aria-checked="${S.mode === k}" aria-label="${t}" class="${S.mode === k ? "active" : ""}" data-mode="${k}" data-tip>${ic(i, k === "screen-camera" ? "s18" : "")}<span class="tip">${t}</span></button>`).join("")}</div></div>
      ${S.scenario === "update" ? `<div class="banner"><span class="grow"><b>Update ready</b></span><button class="bbtn" data-act="update">Update</button></div>` : ""}
      <div class="panel">
        ${S.mode === "camera" ? "" : `<div class="row src"><span class="ri">${ic("device-desktop", "s20")}</span><button class="rb" id="src-btn"><span class="lab">${S.source}</span><span class="chev">${ic("chevron-down")}</span></button></div>`}
        ${hasCam() ? camRow : ""}
        <div class="row ${S.micOn ? "" : "off"}"><span class="ri">${ic("microphone", "s18")}</span><button class="rb" id="mic-btn"><span class="lab">${S.micOn ? S.mic : "Microphone"}</span><span class="chev">${ic("chevron-down")}</span>${S.micOn ? `<span id="wave" style="flex:1;display:flex">${wave()}</span>` : `<span class="grow"></span>`}</button><span class="tr" data-tip><button class="sw" role="switch" aria-checked="${S.micOn}" data-act="mic" aria-label="${S.micOn ? "Turn off microphone" : "Turn on microphone"}"></button><span class="tip">${S.micOn ? "Turn off microphone" : "Turn on microphone"}</span></span></div>
        ${S.mode === "camera" ? "" : `<div class="row ${S.sysAudio ? "" : "off"}"><span class="ri">${ic("volume-2", "s18")}</span><span style="font-size:13px">Record system audio</span><span class="tr" data-tip><button class="sw" role="switch" aria-checked="${S.sysAudio}" data-act="sys" aria-label="${S.sysAudio ? "Turn off system audio" : "Turn on system audio"}"></button><span class="tip">${S.sysAudio ? "Turn off system audio" : "Turn on system audio"}</span></span></div>`}
      </div>
      <button class="primary" data-act="start"><span class="rec-dot"></span><span>${S.mode === "camera" ? "Start camera recording" : "Start recording"}</span></button>
      ${S.scenario === "recovery" ? `<button class="recov" data-act="recovery"><span class="w">${ic("alert-triangle")}</span><span class="grow">1 clip needs attention</span>${ic("chevron-right", "muted")}</button>` : ""}
    </div>
    <div class="bottom">
      <button class="bot" data-act="library" title="Open library"><span class="bi">${ic("library", "s18")}</span><span class="grow">Library</span><span class="ext">${ic("external-link")}</span></button>
      <button class="bot" data-act="settings" title="Open settings"><span class="bi">${ic("settings-sliders", "s18")}</span><span class="grow">Settings</span></button>
    </div>
  </div>`;
}
const popRight = () => { const t = $("#tray"); return t ? Math.max(8, innerWidth - t.getBoundingClientRect().right - 8) : 160; };

/* ───────── overlays ───────── */
function bubble() {
  const show = hasCam() && S.camOn && S.scenario !== "signedout" && (S.pop || S.phase === "countdown" || S.phase === "recording");
  if (!show) return "";
  const size = S.mode === "camera" ? 400 : S.bubbleSize === "small" ? 264 : 400;
  return `<div class="bubble" style="width:${size}px;height:${size}px"><div class="face">AR</div>
    <div class="bc"><button data-act="cam" aria-label="Turn camera off" title="Turn camera off">${ic("camera-off", "s22")}</button><button class="dotb" data-size="small" aria-label="Small" title="Small"><span class="dot ${S.bubbleSize === "small" ? "on" : ""}" style="width:10px;height:10px"></span></button><button class="dotb" data-size="medium" aria-label="Medium" title="Medium"><span class="dot ${S.bubbleSize === "medium" ? "on" : ""}" style="width:16px;height:16px"></span></button></div>
    <button class="bx" data-act="cam" aria-label="Close camera" title="Close camera">${ic("x", "s12")}</button></div>`;
}
function countdown() {
  return `<div class="dim"><button class="cd-btn l" data-act="cd-cancel" aria-label="Cancel recording" title="Cancel recording">${ic("x", "s30")}</button><div class="cd-num" id="cd-num">${S.count}</div><button class="cd-btn r" data-act="cd-skip" aria-label="Skip countdown and start recording now" title="Skip countdown and start recording now">${ic("player-skip-forward-filled", "s28")}</button></div>`;
}
function meterBars() { return `<span class="meter" id="meter">${Array.from({ length: 5 }, () => `<i></i>`).join("")}</span>`; }
function recPill() {
  if (S.confirm) {
    const restart = S.confirm === "restart";
    return `<div class="rpill keep"><span class="pq">${restart ? "Start a new recording?" : `Discard ${dur(S.ms)}?`}</span><button class="pa soft" data-act="resume-confirm">Resume</button><button class="pa ${restart ? "white" : "red"}" data-act="${restart ? "do-restart" : "do-discard"}">${restart ? "Restart" : "Discard"}</button></div>`;
  }
  return `<div class="rpill ${S.paused ? "paused" : ""}" role="toolbar" aria-label="Recording controls">
    <button class="pb" data-act="stop" aria-label="Stop and save"><span class="sq"></span><span class="ptip">Stop and save</span></button>
    <span class="timer" id="timer">${fmt(S.ms)}</span>
    ${S.micOn ? meterBars() : `<span class="micoff" title="Microphone is off">${ic("exclamation-mark", "s12")}</span>`}
    <button class="pb" data-act="pause" aria-label="${S.paused ? "Resume" : "Pause"}">${ic(S.paused ? "player-play-filled" : "player-pause-filled", "s14")}<span class="ptip">${S.paused ? "Resume (⌥⇧P)" : "Pause (⌥⇧P)"}</span></button>
    <span class="extra"><span class="pdiv"></span><button class="pb" data-act="restart" aria-label="Restart">${ic("refresh", "s14")}<span class="ptip">Restart (⌥⇧R)</span></button><button class="pb" data-act="discard" aria-label="Discard">${ic("trash", "s14")}<span class="ptip">Discard (⌥⇧C)</span></button></span>
  </div>`;
}
function doneCard() {
  const d = S.done;
  const url = "clips.example.com/r/k7f2qm";
  const title = { finishing: "Finishing up", uploading: "Uploading", saved: "Recording saved" }[d.stage];
  return `<div class="card" role="status"><div class="h"><span class="badge ${d.stage === "saved" ? "ok" : ""}">${d.stage === "saved" ? ic("check", "s14") : ic("loader-2", "s14 spin")}</span><span style="min-width:0"><b>${title}</b><small>${dur(d.ms)}</small></span><button class="x" data-act="dismiss" aria-label="Dismiss">${ic("x", "s14")}</button></div>
    ${d.stage === "saved" ? `<div class="well">${ic("link", "s14")}<button class="u" data-act="copy" aria-label="Copy link">${url}</button><button data-act="copy" aria-label="Copy link">${ic(S.copied ? "check" : "copy", "s14")}</button></div><div class="acts"><button class="open" data-act="open">Open</button><button class="copy" data-act="copy">${S.copied ? `Copied${ic("check", "s14")}` : "Copy"}</button></div>` : ""}
  </div>`;
}
function meetingNotif() {
  return `<div class="notif" role="alert"><button class="nx" data-act="notif-x" aria-label="Dismiss">${ic("x", "s12")}</button><span class="t"><b>Design sync</b><small>Starts in 2 min</small></span>
    <span class="split"><button class="main" data-act="join">${ic("calendar-event", "s22")}<span>Join meeting<small>&amp; open Clips</small></span></button><button class="chev" id="notif-menu" aria-label="More options">${ic("chevron-down", "s14")}</button></span></div>`;
}
function meetingPill() {
  return `<div class="mpill" role="status" aria-label="Meeting notes">__LOGO_SMALL__<span class="meter" id="mmeter">${Array.from({ length: 4 }, () => `<i></i>`).join("")}</span><span class="t" id="mtime">${fmt(S.notesMs)}</span><button class="stop" data-act="stop-notes" aria-label="Stop transcription" title="Stop transcription"><i></i></button></div>`;
}
function micDialog() {
  return `<div class="dlg"><div class="box" role="alertdialog" aria-label="Microphone is off"><h2>Microphone is off</h2><p>This recording won't include your voice.</p><div class="ft"><button class="obtn" data-act="mic-back">Go back</button><button class="bbtn" data-act="mic-anyway">Record anyway</button></div></div></div>`;
}

/* ───────── render ───────── */
function render() {
  $("#desk").innerHTML = `${menuBar()}${appWindow()}
    ${S.pop ? popover() : ""}
    ${bubble()}
    ${S.phase === "countdown" ? countdown() : ""}
    ${S.phase === "recording" ? recPill() : ""}
    ${S.phase === "done" ? doneCard() : ""}
    ${S.meeting ? meetingNotif() : ""}
    ${S.notes ? meetingPill() : ""}
    ${S.micDialog ? micDialog() : ""}`;
  if (S.pop) $(".pop").style.right = popRight() + "px";
}

/* ───────── flows ───────── */
let cdTimer = null;
function start() {
  if (!S.micOn && !S.micDialog) { S.micDialog = true; render(); return; }
  S.micDialog = false; S.pop = false; S.phase = "countdown"; S.count = 3; render();
  cdTimer = setInterval(() => { S.count -= 1; if (S.count === 0) beginRecording(); else render(); }, 1000);
}
function beginRecording() { clearInterval(cdTimer); S.phase = "recording"; S.ms = 0; S.paused = false; S.confirm = null; render(); }
function stop() {
  S.done = { ms: S.ms, stage: "finishing" }; S.phase = "done"; S.copied = false; render();
  setTimeout(() => { if (S.done) { S.done.stage = "uploading"; render(); } }, 900);
  setTimeout(() => { if (S.done) { S.done.stage = "saved"; render(); } }, 2200);
}
function trayMenu(anchor) {
  const rec = S.phase === "recording";
  openMenu(anchor, [
    { t: "New recording…", run: () => { S.pop = true; render(); } },
    { t: "Start Meeting Notes", sub: S.scenario === "meeting" ? [{ t: "Design sync — Today at 10:00 AM", run: startNotes }] : [{ t: "No meetings ready", disabled: true }] },
    "-",
    rec ? { t: "Stop recording", run: stop } : S.notes ? { t: "Stop meeting notes", run: stopNotes } : { t: "No active recording", disabled: true },
    { t: "Paste Last Dictation", k: "⌃⌘V", toast: "Pasted last dictation" },
    { t: "Show region guides on screen", toggle: true, on: S.guides, run: (on) => (S.guides = on) },
    { t: "Toggle DevTools", k: "⌥⌘I", toast: "DevTools" },
    "-",
    { t: "Clips v0.9.4", disabled: true },
    "-",
    { t: "Quit Clips", toast: "Quit Clips" },
  ], { align: "right", minWidth: 248 });
}
function startNotes() { S.meeting = false; S.notes = true; S.notesMs = 0; render(); }
function stopNotes() { S.notes = false; render(); toast("Meeting notes saved"); }

/* ───────── events ───────── */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) { if (S.pop && !e.target.closest(".pop, .menu, .bubble") && e.target.closest("#desk")) { S.pop = false; render(); } return; }
  if (t.closest(".menu, .review")) return;
  const d = t.dataset;
  if (t.id === "tray") { if (S.phase === "recording") { stop(); return; } S.pop = !S.pop; render(); return; }
  if (d.mode) { S.mode = d.mode; render(); return; }
  if (d.size) { S.bubbleSize = d.size; render(); return; }
  if (t.id === "src-btn") { openMenu(t, [...SOURCES.map((s) => ({ t: s, radio: true, on: S.source === s, run: () => { S.source = s; render(); } })), "-", { label: "Windows" }, ...WINDOWS.map((w) => ({ t: w, icon: "window", radio: true, on: S.source === w, run: () => { S.source = w; render(); } })), { t: "Window", toast: "Choose a window" }], { minWidth: 216 }); return; }
  if (t.id === "cam-btn") { openMenu(t, [{ t: "Default camera", radio: true, on: S.camera === "Default camera", run: () => { S.camera = "Default camera"; S.camOn = true; render(); } }, ...CAMERAS.map((c) => ({ t: c, radio: true, on: S.camera === c, run: () => { S.camera = c; S.camOn = true; render(); } })), "-", { t: "Refresh cameras", icon: "refresh", toast: "Refreshed cameras" }], { minWidth: 216 }); return; }
  if (t.id === "mic-btn") { openMenu(t, [{ t: "Default mic", radio: true, on: S.mic === "Default mic", run: () => { S.mic = "Default mic"; S.micOn = true; render(); } }, ...MICS.map((c) => ({ t: c, radio: true, on: S.mic === c, run: () => { S.mic = c; S.micOn = true; render(); } })), "-", { t: "Refresh microphones", icon: "refresh", toast: "Refreshed microphones" }], { minWidth: 216 }); return; }
  if (t.id === "notif-menu") { openMenu(t, [{ t: "Join only", run: () => { S.meeting = false; render(); toast("Joining meeting"); } }, { t: "Start notes only", run: startNotes }, { t: "Snooze 5 min", run: () => { S.meeting = false; render(); } }], { align: "right" }); return; }
  switch (d.act) {
    case "cam": S.camOn = !S.camOn; render(); break;
    case "mic": S.micOn = !S.micOn; render(); break;
    case "sys": S.sysAudio = !S.sysAudio; render(); break;
    case "start": start(); break;
    case "mic-back": S.micDialog = false; render(); break;
    case "mic-anyway": start(); break;
    case "cd-cancel": clearInterval(cdTimer); S.phase = "idle"; render(); break;
    case "cd-skip": beginRecording(); break;
    case "stop": stop(); break;
    case "pause": S.paused = !S.paused; render(); break;
    case "restart": S.confirm = "restart"; S.paused = true; render(); break;
    case "discard": S.confirm = "discard"; S.paused = true; render(); break;
    case "resume-confirm": S.confirm = null; S.paused = false; render(); break;
    case "do-restart": S.confirm = null; start(); break;
    case "do-discard": S.confirm = null; S.phase = "idle"; render(); toast("Recording discarded"); break;
    case "copy": S.copied = true; render(); setTimeout(() => { S.copied = false; S.phase === "done" && render(); }, 1400); break;
    case "open": toast("Opens the clip in your browser"); break;
    case "dismiss": S.done = null; S.phase = "idle"; render(); break;
    case "library": S.pop = false; render(); toast("Opens the library in your browser"); break;
    case "settings": toast("Opens Settings"); break;
    case "update": toast("Restarting to update"); break;
    case "recovery": toast("Opens recovery"); break;
    case "google": toast("Sign in from your browser"); break;
    case "signin": toast("Check your email"); break;
    case "signin-mode": S.signin = S.signin === "password" ? "email" : "password"; render(); break;
    case "server": toast("Change server"); break;
    case "join": S.meeting = false; S.notes = true; S.notesMs = 0; render(); toast("Joining meeting"); break;
    case "notif-x": S.meeting = false; render(); break;
    case "stop-notes": stopNotes(); break;
  }
});
document.addEventListener("contextmenu", (e) => { const t = e.target.closest("#tray"); if (t) { e.preventDefault(); if (S.pop) { S.pop = false; render(); } trayMenu($("#tray")); } });
document.addEventListener("keydown", (e) => {
  if (S.phase === "countdown" && e.key === "Escape") { clearInterval(cdTimer); S.phase = "idle"; render(); }
  if (S.phase === "countdown" && e.key === "Enter") beginRecording();
  if (S.pop && e.key === "Escape" && !document.querySelector(".menu")) { S.pop = false; render(); }
});

/* ───────── clock ───────── */
setInterval(() => {
  if (S.phase === "recording" && !S.paused) { S.ms += 250; const tm = $("#timer"); if (tm) tm.textContent = fmt(S.ms); const tt = $(".tray .tt"); if (tt) tt.textContent = fmt(S.ms); }
  if (S.notes) { S.notesMs += 250; const m = $("#mtime"); if (m) m.textContent = fmt(S.notesMs); }
  document.querySelectorAll("#meter i, #mmeter i").forEach((b) => (b.style.height = (S.paused ? 3 : 3 + Math.random() * 13) + "px"));
  const w = $("#wave"); if (w && S.pop) w.innerHTML = wave();
}, 250);

/* ───────── review strip ───────── */
$("#theme-btn").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; try { localStorage.setItem("clips-desktop-theme", nx); } catch {} };
$("#scenario").onchange = (e) => {
  S.scenario = e.target.value; clearInterval(cdTimer); S.phase = "idle"; S.done = null; S.notes = false; S.micDialog = false;
  S.meeting = S.scenario === "meeting"; S.pop = S.scenario !== "meeting"; render();
};
addEventListener("resize", () => S.pop && render());
kitChangesInit($("#changes-btn"));
render();
S.pop = true; render();
</script>
