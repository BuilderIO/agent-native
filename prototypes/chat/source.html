<!--
  Chat prototype: the shipped Chat template (templates/chat) and the toolkit's AgentKit chat it renders.
  Build with: node prototypes/kit/build.ts chat
  Layout of this file:
    <style>   app shell, sidebar (rail, thread rows, hover card, footer), conversation (header, messages,
              work rows, action row), composer, queue, workspace panel, command menu
    markup    review strip, app shell
    <script>  data (threads, messages), render functions per surface, the simulated agent run, handlers
  The review strip's switches (Scenario, Theme, Changes) exist only in the prototype.
-->

function threadRow(t) {
  if (S.renaming === t.id) return `<div class="trow active"><input id="rename-in" value="${esc(t.title)}" maxlength="160" aria-label="Rename Chat"></div>`;
  return `<div class="trow ${t.id === S.thread ? "active" : ""}" data-thread="${t.id}"><button class="tb" data-open="${t.id}"><span class="tt">${esc(t.title)}</span>${t.running ? ic("loader-2", "s14 spin") : ""}</button><button class="menu-t" data-tmenu="${t.id}" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">${ic(t.pinned ? "pinned" : "dots", "s14")}</button></div>`;
}
function renderSide() {
  const side = $("#side"); side.classList.toggle("collapsed", S.collapsed);
  const live = THREADS.filter(t => !t.archived), pinned = live.filter(t => t.pinned), recent = live.filter(t => !t.pinned).slice(0, 30);
  side.innerHTML = `<div class="side-top"><a href="#" data-new title="Chat">__LOGO__<span>Chat</span></a></div>
    <button class="new-chat" data-new ${S.collapsed ? 'title="New Chat"' : ""}>${ic("edit")}<span>New Chat</span></button>
    <div class="threads">${pinned.length ? `<div class="sec-label">Pinned</div>${pinned.map(threadRow).join("")}` : ""}${recent.length ? `<div class="sec-label">Recents</div>${recent.map(threadRow).join("")}` : ""}</div>
    <div class="spacer"></div>
    <div class="side-foot">
      <button class="org" id="org-btn" aria-haspopup="menu" aria-expanded="false"><span class="avatar">${ME.initials}</span><span class="who"><b>${ME.name}</b><span>${ORGS[0]}</span></span><span class="sel">${ic("selector", "s14")}</span></button>
      <button class="sq" id="search-btn" title="Search" aria-label="Search">${ic("search")}</button>
      <button class="sq" id="collapse-btn" title="${S.collapsed ? "Expand Sidebar" : "Collapse Sidebar"}" aria-label="${S.collapsed ? "Expand Sidebar" : "Collapse Sidebar"}">${ic(S.collapsed ? "layout-sidebar-left-expand" : "layout-sidebar-left-collapse")}</button>
    </div>`;
  const r = $("#rename-in"); if (r) { r.focus(); r.select(); }
}

/* ───────── conversation ───────── */
function workHTML(w, live) {
  const label = live ? `<span class="live">Working${w.current ? ` · ${esc(w.current)}` : ""}</span>` : w.secs ? `Worked for ${w.secs}s` : "Worked";
  return `<details class="work" ${live ? "open" : ""}><summary aria-label="Agent activity">${label}${ic("chevron-right")}</summary><div class="groups">${w.groups.map(([g, rows]) => `<div><div class="gl">${g}</div>${rows.map(([icon, text, detail]) => `<div class="ar">${ic(icon)}<span>${esc(text)}</span>${detail ? `<small>${esc(detail)}</small>` : ""}</div>`).join("")}</div>`).join("")}</div></details>`;
}
function messageHTML(m, i, list) {
  if (m.role === "user") return `<div class="msg user"><div class="bubble">${esc(m.text)}</div><div class="acts"><span class="time">${m.time}</span><button data-copy="${i}" title="Copy message" aria-label="Copy message">${ic("copy")}</button><button data-edit="${i}" title="Edit message" aria-label="Edit message">${ic("pencil")}</button></div></div>`;
  const last = i === list.length - 1;
  return `<div class="msg">${m.work ? workHTML(m.work, m.live) : ""}${m.html ? `<div class="prose">${m.html}</div>` : ""}${m.live ? "" : `<div class="acts">
    <button data-copy="${i}" title="Copy message" aria-label="Copy message">${ic("copy")}</button>
    <button data-fb="up" data-i="${i}" aria-pressed="${m.fb === "up"}" title="Helpful" aria-label="Helpful">${ic("thumb-up")}</button>
    <button data-fb="down" data-i="${i}" aria-pressed="${m.fb === "down"}" title="Not helpful" aria-label="Not helpful">${ic("thumb-down")}</button>
    <span class="grow"></span>
    ${last ? `<button data-regen="${i}" title="Regenerate response" aria-label="Regenerate response">${ic("refresh")}</button>` : ""}
    ${m.branches ? `<span class="branch"><button title="Previous branch" aria-label="Previous branch">${ic("chevron-left")}</button>${m.branch}/${m.branches}<button title="Next branch" aria-label="Next branch">${ic("chevron-right")}</button></span>` : ""}
    <span class="time">${m.time}</span>
    <button data-mmenu="${i}" title="Message actions" aria-label="Message actions" aria-haspopup="menu" aria-expanded="false">${ic("dots-vertical")}</button>
  </div>`}</div>`;
}
function renderMain() {
  const t = thread(), msgs = t?.messages || [], empty = !msgs.length;
  const main = $("#main"); main.classList.toggle("empty", empty);
  const model = `${S.model} · ${S.effort}`;
  main.innerHTML = `${empty ? "" : `<div class="chat-h"><span class="title">${esc(t.title || "Chat")}</span><button class="ghost-sq" id="ws-btn" title="Workspace" aria-label="Workspace" aria-pressed="${S.ws}">${ic("layout-sidebar-right")}</button></div>`}
    <div class="scroll" id="scroll"><div class="transcript">${msgs.map(messageHTML).join("")}</div></div>
    <div class="foot">
      <h1 class="hello">How can I help?</h1>
      <div class="stack">
        ${S.queue.length ? `<div class="queue" aria-label="Queued messages">${S.queue.map((q, i) => `<div class="qrow"><span class="qt">${esc(q)}</span><button class="btn secondary" data-steer="${i}">Steer</button><button class="ghost-sq" data-unqueue="${i}" title="Remove queued message" aria-label="Remove queued message">${ic("x", "s14")}</button></div>`).join("")}</div>` : ""}
        <div class="composer">
          <div class="editor"><div contenteditable="true" id="editor" role="textbox" aria-label="Message agent" aria-multiline="true" data-placeholder="Ask the agent...">${esc(S.draft)}</div></div>
          <div class="ctb">
            <button class="cbtn sq" id="plus-btn" title="Add context" aria-label="Add context" aria-haspopup="menu" aria-expanded="false">${ic("plus")}</button>
            <span class="grow"></span>
            <button class="cbtn" id="model-btn" aria-haspopup="menu" aria-expanded="false" title="${model}"><span class="v">${model}</span>${ic("chevron-down", "s14")}</button>
            <button class="cbtn" id="mode-btn" aria-haspopup="menu" aria-expanded="false">${S.mode}${ic("chevron-down", "s14")}</button>
            <button class="cbtn sq ${S.recording ? "rec" : ""}" id="voice-btn" title="Dictate (⌃D)" aria-label="Dictate" aria-pressed="${S.recording}">${ic(S.recording ? "player-stop" : "microphone")}</button>
            <button class="send" id="send-btn" title="${S.running ? "Queue message" : "Send message"}" aria-label="${S.running ? "Queue message" : "Send message"}">${ic("arrow-up")}</button>
          </div>
        </div>
      </div>
    </div>`;
  const sc = $("#scroll"); if (sc) sc.scrollTop = sc.scrollHeight;
  renderWorkspace();
}
function renderWorkspace() {
  $("#ws")?.remove();
  if (!S.ws || !thread()?.messages.length) return;
  const ws = document.createElement("aside"); ws.className = "ws"; ws.id = "ws"; ws.setAttribute("aria-label", "Workspace");
  ws.innerHTML = `<div class="ws-h">Workspace<button class="ghost-sq" id="ws-close" title="Close" aria-label="Close">${ic("x", "s14")}</button></div><div class="ws-b"></div>`;
  $("#app").append(ws);
}
function render() { renderSide(); renderMain(); }

/* ───────── the agent run ───────── */
function startRun(t) {
  const m = { role: "assistant", live: true, work: { groups: [], current: "Reading the request" }, time: now() };
  t.messages.push(m); t.running = true; S.running = t.id; render();
  const steps = REPLY.work.groups.flatMap(([g, rows]) => rows.map(r => [g, r]));
  let k = 0, start = Date.now();
  const tick = () => {
    if (k < steps.length) {
      const [g, row] = steps[k++]; let grp = m.work.groups.find(x => x[0] === g); if (!grp) m.work.groups.push(grp = [g, []]);
      grp[1].push(row); m.work.current = row[1]; if (S.thread === t.id) renderMain(); setTimeout(tick, 700); return;
    }
    m.live = false; m.work.secs = Math.max(1, Math.round((Date.now() - start) / 1000)); m.html = REPLY.html; delete m.work.current;
    t.running = false; S.running = null; t.mins = 0; t.preview = "Here's what I found.";
    if (S.queue.length && S.thread === t.id) { const next = S.queue.shift(); t.messages.push({ role: "user", text: next, time: now() }); render(); return startRun(t); }
    render();
  };
  setTimeout(tick, 500);
}
const now = () => new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
function send() {
  const ed = $("#editor"), text = ed.innerText.trim(); if (!text) return;
  S.draft = "";
  if (S.running) { S.queue.push(text); renderMain(); return; }
  let t = thread();
  if (!t) { t = { id: "t" + Date.now(), title: text.length > 48 ? text.slice(0, 48) + "…" : text, mins: 0, preview: text, apps: [], messages: [] }; THREADS.unshift(t); S.thread = t.id; }
  t.messages.push({ role: "user", text, time: now() });
  startRun(t);
}
function newChat() { S.thread = null; S.ws = false; S.draft = ""; render(); $("#editor")?.focus(); }

/* ───────── menus ───────── */
function threadMenu(btn, t) {
  openMenu(btn, [
    { t: "Rename Chat", icon: "pencil", run: () => { S.renaming = t.id; renderSide(); } },
    { t: t.pinned ? "Unpin Chat" : "Pin Chat", icon: t.pinned ? "pinned-off" : "pinned", run: () => { t.pinned = !t.pinned; renderSide(); } },
    { t: "Archive Chat", icon: "trash", danger: true, run: () => { t.archived = true; if (S.thread === t.id) S.thread = THREADS.find(x => !x.archived)?.id ?? null; render(); toast("Chat archived"); } },
  ], { minWidth: 160 });
}
function plusMenu(btn) {
  openMenu(btn, [
    { t: "Upload File", icon: "file", toast: "Opens the file picker" },
    { t: "Add context", icon: "text-recognition", sub: [{ label: "Agents" }, { t: "Analytics" }, { t: "Mail" }, { t: "Slides" }, "-", { label: "Files" }, { t: "notes/launch.md" }, { t: "metrics/q3.csv" }] },
    { t: "Schedule Task", toast: "Opens Schedule Task" },
    { t: "Create Automation", toast: "Opens Create Automation" },
    { t: "Create Extension", toast: "Opens Create Extension" },
    { t: "Integrations", toast: "Opens Integrations" },
    { t: "Create Skill", sub: [{ t: "Create new skill", toast: "Starts a new skill" }, { t: "Upload skill file", toast: "Opens the file picker for a skill file" }] },
  ], { above: true, minWidth: 256 });
}
function modelMenu(btn) {
  const models = ["Auto", "Claude Opus 5.5", "Claude Sonnet 5.5", "Claude Haiku 4.5"], efforts = ["Auto", "None", "Minimal", "Low", "Medium", "High", "Extra high", "Max"];
  openMenu(btn, [
    { t: "Model", desc: S.model, sub: [...models.map(m => ({ t: m, radio: true, on: S.model === m, run: () => { S.model = m; renderMain(); } })), "-", { t: "Connect Builder.io", icon: "plug-connected" }, { t: "Add your own keys", icon: "key" }, "-", { t: "Image model", sub: [{ t: "Auto", radio: true, on: true }] }] },
    { t: "Effort", desc: S.effort, sub: efforts.map(e => ({ t: e, radio: true, on: S.effort === e, run: () => { S.effort = e; renderMain(); } })) },
  ], { above: true, align: "right", minWidth: 256 });
}
function modeMenu(btn) {
  openMenu(btn, [
    { t: "Act", icon: "pencil", desc: "Use tools and make approved changes", radio: true, on: S.mode === "Act", run: () => { S.mode = "Act"; renderMain(); } },
    { t: "Plan", icon: "clipboard-list", desc: "Read-only research and approval first", radio: true, on: S.mode === "Plan", run: () => { S.mode = "Plan"; renderMain(); } },
  ], { above: true, align: "right", minWidth: 240 });
}
function messageMenu(btn) {
  openMenu(btn, [{ t: "Copy request ID", icon: "id", toast: "Copied" }, { t: "Fork conversation", icon: "git-branch", run: forkThread }], { align: "right", minWidth: 192 });
}
function orgMenu(btn) {
  openMenu(btn, [
    { label: ME.email },
    ...ORGS.map((o, i) => ({ t: o, radio: true, on: i === 0 })),
    { t: "Your workspace", icon: "external-link" },
    { t: "Create organization", icon: "plus" },
    "-",
    { t: "Settings", icon: "settings", k: "⌘,", run: () => openSettings("profile") },
    { t: "Usage", icon: "chart-bar", run: () => openSettings("usage") },
    { t: "Get apps and extensions", icon: "download", sub: [{ t: "Agent-Native Desktop" }, { t: "Chrome extension" }, { t: "Slack app" }] },
    "-",
    { t: "Log out", icon: "logout" },
  ], { above: true, minWidth: 248 });
}
function forkThread() {
  const t = thread(); const f = { ...t, id: "t" + Date.now(), title: t.title + " (fork)", pinned: false, mins: 0, messages: t.messages.map(m => ({ ...m })) };
  THREADS.unshift(f); S.thread = f.id; render(); toast("Conversation forked");
}

/* ───────── command menu (⌘K) ───────── */
function commandMenu() {
  if ($(".cmd-wrap")) return;
  const rows = () => [
    ["Actions", [[S.thread ? "New Chat" : "Chat", "edit", newChat], ["Manage agent", "hierarchy-2", () => openSettings("model")]]],
    ["Appearance", [["Toggle theme", document.documentElement.dataset.theme === "dark" ? "sun" : "moon", toggleTheme]]],
    ["", [["Settings", "settings", () => openSettings("profile")], ["What's new", "history", () => openSettings("whats-new")], ["About Agent-Native", "info-circle", () => toast("Opens About Agent-Native")], ["Log out", "logout", () => toast("Logs out")]]],
  ];
  const wrap = document.createElement("div"); wrap.className = "cmd-wrap";
  wrap.innerHTML = `<div class="cmd" role="dialog" aria-label="Command menu"><label class="cmd-in">${ic("search")}<input id="cmd-q" placeholder="Type a command or ask AI..." aria-label="Type a command or ask AI..."></label><div class="cmd-list" id="cmd-list"></div></div>`;
  document.body.append(wrap);
  let sel = 0, flat = [];
  const draw = () => {
    const q = $("#cmd-q").value.trim().toLowerCase();
    const groups = rows().map(([g, list]) => [g, list.filter(([t]) => t.toLowerCase().includes(q))]).filter(([, l]) => l.length);
    const ask = q ? `Ask AI: “${$("#cmd-q").value.trim()}”` : "Ask AI anything...";
    groups.push(["", [[ask, "message", () => { S.draft = $("#cmd-q").value.trim(); newChat(); S.draft && ($("#editor").textContent = S.draft); }]]]);
    flat = groups.flatMap(([, l]) => l); sel = Math.min(sel, flat.length - 1);
    let n = 0;
    $("#cmd-list").innerHTML = groups.map(([g, l]) => `${g ? `<div class="cmd-g">${g}</div>` : `<div style="height:4px"></div>`}${l.map(([t, icon]) => `<button class="cmd-row" data-cmd="${n}" aria-selected="${n++ === sel}">${ic(icon)}<span>${esc(t)}</span></button>`).join("")}`).join("");
  };
  const close = () => { wrap.remove(); document.removeEventListener("keydown", key, true); };
  const run = i => { const r = flat[i]; close(); r?.[2](); };
  const key = e => {
    if (e.key === "Escape") { e.preventDefault(); close(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + flat.length) % flat.length; draw(); }
    else if (e.key === "Enter") { e.preventDefault(); run(sel); }
  };
  wrap.addEventListener("click", e => { const b = e.target.closest("[data-cmd]"); if (b) return run(+b.dataset.cmd); if (e.target === wrap) close(); });
  $("#cmd-q").addEventListener("input", () => { sel = 0; draw(); });
  document.addEventListener("keydown", key, true);
  draw(); $("#cmd-q").focus();
}

/* ───────── hover card ───────── */
let hoverTimer = null;
function showCard(row) {
  const t = THREADS.find(x => x.id === row.dataset.thread); if (!t || S.collapsed) return;
  hideCard();
  const r = row.getBoundingClientRect(), c = document.createElement("div"); c.className = "hcard"; c.setAttribute("role", "tooltip");
  c.innerHTML = `<b>${esc(t.title)}</b>${t.preview ? `<p>${esc(t.preview)}</p>` : ""}<div class="meta"><span>${ic("clock", "s12")}${ago(t.mins)}</span><span>${ic("messages", "s12")}${t.messages.length}</span>${t.pinned ? `<span>${ic("pin", "s12")}Pinned</span>` : ""}${t.apps.length ? `<span>${ic("apps", "s12")}${t.apps.join(" · ")}</span>` : ""}</div>`;
  document.body.append(c);
  c.style.left = r.right + 8 + "px"; c.style.top = Math.min(r.top, innerHeight - c.offsetHeight - 8) + "px";
}
const hideCard = () => document.querySelector(".hcard")?.remove();

/* ───────── handlers ───────── */
function toggleTheme() {
  const root = document.documentElement, cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = cur === "dark" ? "light" : "dark";
}
function setScenario(v) {
  S.queue = []; S.ws = false;
  if (v === "empty") { S.thread = null; }
  else if (v === "running") { S.thread = "t3"; const t = thread(); if (!t.messages.some(m => m.role === "assistant")) { t.running = false; render(); startRun(t); return; } }
  else S.thread = "t1";
  render();
}
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-new]")) { e.preventDefault(); return newChat(); }
  const open = t.closest("[data-open]"); if (open) { hideCard(); S.thread = open.dataset.open; S.renaming = null; return render(); }
  const tm = t.closest("[data-tmenu]"); if (tm) { hideCard(); return threadMenu(tm, THREADS.find(x => x.id === tm.dataset.tmenu)); }
  if (t.closest("#collapse-btn")) { S.collapsed = !S.collapsed; return renderSide(); }
  if (t.closest("#search-btn")) return commandMenu();
  const org = t.closest("#org-btn"); if (org) return orgMenu(org);
  if (t.closest("#ws-btn")) { S.ws = !S.ws; return renderMain(); }
  if (t.closest("#ws-close")) { S.ws = false; return renderMain(); }
  const plus = t.closest("#plus-btn"); if (plus) return plusMenu(plus);
  const mb = t.closest("#model-btn"); if (mb) return modelMenu(mb);
  const md = t.closest("#mode-btn"); if (md) return modeMenu(md);
  if (t.closest("#voice-btn")) { S.recording = !S.recording; S.draft = $("#editor").innerText; if (!S.recording) S.draft = (S.draft ? S.draft + " " : "") + "Can you check the launch checklist too?"; return renderMain(); }
  if (t.closest("#send-btn")) return send();
  const mm = t.closest("[data-mmenu]"); if (mm) return messageMenu(mm);
  if (t.closest("[data-copy]")) return toast("Copied");
  const fb = t.closest("[data-fb]");
  if (fb) {
    const m = thread().messages[+fb.dataset.i];
    m.fb = m.fb === fb.dataset.fb ? null : fb.dataset.fb; renderMain();
    if (m.fb === "down") toast("What went wrong? Opens the feedback form");
    return;
  }
  const rg = t.closest("[data-regen]"); if (rg) { const tt = thread(); const m = tt.messages[+rg.dataset.regen]; m.branches = (m.branches || 1) + 1; m.branch = m.branches; tt.messages.pop(); return startRun(tt); }
  const ed = t.closest("[data-edit]"); if (ed) { const m = thread().messages[+ed.dataset.edit]; S.draft = m.text; renderMain(); toast("Editing forks the conversation from this message"); return $("#editor").focus(); }
  const st = t.closest("[data-steer]"); if (st) { toast("Sent now to steer the current run"); S.queue.splice(+st.dataset.steer, 1); return renderMain(); }
  const uq = t.closest("[data-unqueue]"); if (uq) { S.queue.splice(+uq.dataset.unqueue, 1); return renderMain(); }
});
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return commandMenu(); }
  if (e.target.id === "editor" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); return send(); }
  if (e.target.id === "rename-in") {
    if (e.key === "Enter") { const t = THREADS.find(x => x.id === S.renaming); t.title = e.target.value.trim() || "Untitled chat"; S.renaming = null; render(); }
    if (e.key === "Escape") { S.renaming = null; renderSide(); }
  }
});
document.addEventListener("focusout", e => { if (e.target.id === "rename-in" && S.renaming) { const t = THREADS.find(x => x.id === S.renaming); t.title = e.target.value.trim() || "Untitled chat"; S.renaming = null; setTimeout(render); } });
document.addEventListener("input", e => { if (e.target.id === "editor") S.draft = e.target.innerText; });
let hoverRow = null;
document.addEventListener("mouseover", e => {
  const row = e.target.closest?.(".trow[data-thread]") || null;
  if (row === hoverRow) return;
  hoverRow = row; clearTimeout(hoverTimer); hideCard();
  if (row) hoverTimer = setTimeout(() => hoverRow === row && row.isConnected && showCard(row), 500);
});
$("#theme-btn").addEventListener("click", toggleTheme);
$("#scenario").addEventListener("change", e => setScenario(e.target.value));
kitChangesInit($("#changes-btn"));
kitSettingsInit({ app: "Chat", mcpName: "chat", mcpUrl: "https://chat.agent-native.com/mcp" });
render();
</script>
