<!--
  Design import prototype: importing a website or a project from another builder into Design.
  Build with: node prototypes/kit/build.ts design-import
  Layout of this file:
    <style>   dialog shell, gradient header, picker tiles, steps, fields, drop zone, progress, announcement hero
    markup    review strip, the dashboard frame, the dialog root
    <script>  sources and their steps, render functions per view, the simulated import, the orbit animation
  The dashboard is the shipped /home page, captured into dashboard.json by capture-dashboard.ts and shown in
  an iframe so its CSS stays its own. Its Import button opens the picker. The review strip's switches
  (Announcement, Import fails, Theme, Changes) exist only in the prototype.
-->

const S = { open: false, view: "picker", src: null, from: null, file: null, err: "", value: "", job: null, fail: false };
const root = $("#imp-root");
let lastFocus = null;

/* ───────── header ───────── */
function headPicker() {

  const row = (ids, side) => ids.map((id, i) => `<span class="${(side === "l" ? i === 0 : i === ids.length - 1) ? "far" : ""}" title="${LOGOS[id].name}">${logo(id)}</span>`).join("");

function headPair(id, running) {

  return `<div class="imh ${running ? "running" : ""}"><div class="pair"><span class="tile">${from}</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="tile">${MARK}</span></div></div>`;
}

/* ───────── views ───────── */
function viewPicker() {
  const tile = (id) => `<button class="src" data-src="${id}"><span class="box">${glyph(id)}</span><span class="tt"><b>${SRC[id].name}</b><small>${SRC[id].sub}</small></span></button>`;
  return headPicker() + `<div class="imb"><h2 id="imd-title">Import a project</h2><p class="lead">Choose where your project lives today to see the steps for it.</p>
    <div class="sec"><h3>App builders</h3><div class="grid">${BUILDERS.map(tile).join("")}</div></div>
    <div class="sec"><h3>Everything else</h3><div class="grid">${OTHERS.map(tile).join("")}
      <button class="src wide" data-src="other"><span class="stack" aria-hidden="true">${PLATFORMS.map((p) => `<span>${logo(p)}</span>`).join("")}</span><span class="tt"><b>Other platforms</b><small>${SRC.other.sub}</small></span></button>
    </div></div></div>`;
}
function fieldHTML(kind) {

}
function viewSteps(id) {

  const steps = s.steps.map(([t, sub], i) => `<li class="step"><span class="box num">${i + 1}</span><span class="tt"><b>${t}</b>${sub ? `<small>${sub}</small>` : ""}</span>${i === 0 ? `<a class="b outline" href="https://${s.site}" target="_blank" rel="noopener noreferrer"><span class="site">Open ${s.site}</span>${ic("arrow-up-right")}</a>` : ""}</li>`).join("");
  const prompt = s.prompt ? `<div class="prompt"><pre tabindex="0" aria-label="Prompt for Manus">${esc(s.prompt)}</pre><button class="b outline" data-act="copy">${ic("copy")}Copy prompt</button></div>` : "";
  const field = s.field ? fieldHTML(s.field) : "";
  const cta = s.field ? `<button class="b primary" data-act="submit-url" ${valid(s.field, S.value) ? "" : "disabled"}>${s.cta}</button>` : `<button class="b outline" data-act="to-upload">Upload the ZIP</button>`;
  return headPair(id) + `<div class="imb"><h2 id="imd-title">${s.title}</h2><p class="lead">${s.lead}</p><ol class="steps" style="padding:0;margin-bottom:0">${steps}</ol>${prompt}${field}<div class="foot"><button class="b ghost" data-act="back">Back</button>${cta}</div></div>`;
}
function viewUrl(id) {
  const s = SRC[id];
  return headPair(id) + `<div class="imb"><h2 id="imd-title">${s.title}</h2><p class="lead">${s.lead}</p>${fieldHTML(s.field)}<div class="foot"><button class="b ghost" data-act="back">Back</button><button class="b primary" data-act="submit-url" ${valid(s.field, S.value) ? "" : "disabled"}>${s.cta}</button></div></div>`;

const size = (b) => b >= 1024 * MB ? `${(b / 1024 / MB).toFixed(1)} GB` : b >= MB ? `${(b / MB).toFixed(1)} MB` : `${Math.max(1, Math.round(b / 1024))} KB`;
function viewUpload(id) {
  const s = SRC[id], f = FILES[s.file], from = S.from && SRC[S.from];
  const title = from ? `Upload your ${from.name} ZIP` : s.title;
  const lead = from ? `Upload the ZIP you downloaded from ${from.name}.` : s.lead;
  const body = S.file
    ? `<div class="picked"><div class="src"><span class="box">${ic(s.file === "fig" ? "file" : "file-zip")}</span><span class="tt"><b>${esc(S.file.name)}</b><small>${size(S.file.size)}</small></span><button class="rm" data-act="remove" aria-label="Remove ${esc(S.file.name)}">${ic("x")}</button></div></div>`
    : `<div class="drop" id="drop">${ic("upload")}<b>${f.drop}</b><small>${f.limit}</small><button class="b outline" data-act="choose">Choose file</button></div>`;
  const note = S.err ? `<p class="warn" role="alert">${ic("alert-triangle")}<span>${esc(S.err)}</span></p>` : `<p class="help">${f.help}</p>`;
  return headPair(S.from || id) + `<div class="imb"><h2 id="imd-title">${title}</h2><p class="lead">${lead}</p>${body}<div class="after">${note}</div><input type="file" id="imp-file" accept="${f.ext}" hidden><div class="foot"><button class="b ghost" data-act="back">Back</button><button class="b primary" data-act="start-file" ${S.file ? "" : "disabled"}>${s.cta}</button></div></div>`;
}
function viewProgress() {
  const j = S.job, done = j.step >= j.phases.length;
  const rows = j.phases.map((p, i) => {
    const st = j.failed && i === j.step ? "bad" : i < j.step ? "ok" : i === j.step ? "now" : "";
    const mark = st === "bad" ? ic("alert-triangle") : st === "ok" ? ic("check") : st === "now" ? ic("loader-2", "spin") : '<i class="pend"></i>';
    return `<li class="${st}"><span class="st">${mark}</span>${esc(p)}</li>`;
  }).join("");
  const pct = j.failed ? (j.step / j.phases.length) * 100 : done ? 100 : ((j.step + .5) / j.phases.length) * 100;
  if (done) return headPair(j.src) + `<div class="imb"><h2 id="imd-title">${esc(j.name)} is ready</h2><p class="lead">${j.screens} screens, ready to edit.</p><div class="ready" aria-hidden="true">${"<span></span>".repeat(4)}</div><div class="foot"><button class="b ghost" data-act="again">Import another</button><button class="b primary" data-act="open-design">Open design</button></div></div>`;
  const foot = j.failed ? `<div class="foot"><button class="b ghost" data-act="back">Back</button><button class="b primary" data-act="retry">Try again</button></div>` : "";
  const err = j.failed ? `<div class="after"><p class="warn" role="alert">${ic("alert-triangle")}<span>${esc(j.error)}</span></p></div>` : "";
  return headPair(j.src, !j.failed) + `<div class="imb ${j.failed ? "bad" : ""}"><h2 id="imd-title">${j.failed ? "Import stopped" : `Importing ${esc(j.name)}`}</h2><p class="lead">${j.failed ? "Nothing was added to your designs." : "This takes about a minute. You can close this window."}</p><div class="prog-bar" role="progressbar" aria-label="Import progress" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><ul class="prog" style="padding:0;margin-bottom:0">${rows}</ul>${err}${foot}</div>`;
}
function viewAnnouncement() {
  return `<div class="hero"><svg class="rings" viewBox="0 0 560 288" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><ellipse cx="280" cy="144" rx="240" ry="100"/><ellipse cx="280" cy="144" rx="154" ry="66"/></svg><div class="orbit" id="orbit" aria-hidden="true"></div><div class="core" aria-hidden="true">${MARK}</div><button class="pause" id="pause" aria-label="Pause animation">${ic("player-pause-filled")}</button></div>
  <div class="imb"><h2 id="imd-title">Import your website or project</h2><p class="lead">Bring an existing website or project into Design and keep building.</p>
  <ul class="checks"><li><i>${ic("check")}</i>Import a live website from its URL</li><li><i>${ic("check")}</i>Move a project from Lovable, v0, Bolt, and more</li><li><i>${ic("check")}</i>Bring in Figma files and GitHub repositories</li></ul>
  <div class="acts"><button class="b outline" data-act="learn">Learn more</button><button class="b primary" data-act="import-now">Import now</button></div></div>`;
}

/* ───────── render ───────── */
function html() {
  if (S.view === "announcement") return viewAnnouncement();
  if (S.view === "picker") return viewPicker();
  if (S.view === "progress") return viewProgress();
  const s = SRC[S.src];
  if (S.view === "upload") return viewUpload(S.src);
  return s.kind === "steps" ? viewSteps(S.src) : viewUrl(S.src);
}
function render({ focus = true, animate = true } = {}) {
  if (!S.open) return;
  let ov = root.querySelector(".imo:not(.closing)");
  if (!ov) {
    lastFocus = document.activeElement;
    root.insertAdjacentHTML("beforeend", `<div class="imo"><div class="imd" role="dialog" aria-modal="true" aria-labelledby="imd-title"><button class="imd-x" data-act="close" aria-label="Close">${ic("x")}</button><div class="imd-frame"><div class="imd-scroll"><div class="view"></div></div></div></div></div>`);
    ov = root.querySelector(".imo:not(.closing)");
    animate = false;
  }
  const dlg = ov.querySelector(".imd"), frame = ov.querySelector(".imd-frame"), scroll = ov.querySelector(".imd-scroll");
  const before = frame.getBoundingClientRect().height;
  const view = ov.querySelector(".view");
  const keep = view.dataset.key === key();
  dlg.classList.toggle("ann", S.view === "announcement");
  // Re-rendering the same view (typing, progress ticks) keeps the field focused and skips the fade.
  const active = document.activeElement?.id, caret = active === "imp-url" ? document.activeElement.selectionStart : null;
  const fresh = document.createElement("div");
  fresh.className = keep ? "view still" : "view";
  fresh.dataset.key = key();
  fresh.innerHTML = html();
  view.replaceWith(fresh);
  if (!keep) scroll.scrollTop = 0;
  if (animate && !keep && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    frame.style.height = before + "px";
    const after = scroll.scrollHeight > scroll.clientHeight ? scroll.clientHeight : fresh.getBoundingClientRect().height;
    requestAnimationFrame(() => { frame.style.height = after + "px"; });
    frame.addEventListener("transitionend", () => { frame.style.height = ""; }, { once: true });
  }
  bindView(fresh);
  if (keep && active) {
    const el = document.getElementById(active);
    if (el) { el.focus(); if (caret != null) el.setSelectionRange(caret, caret); }
  } else if (focus) {
    (fresh.querySelector("#imp-url") || fresh.querySelector(".src, .b, a, button"))?.focus({ preventScroll: true });
  }

}
const key = () => S.view === "progress" ? `progress:${S.job?.id}:${S.job?.step >= S.job?.phases.length ? "done" : S.job?.failed ? "fail" : "run"}` : `${S.view}:${S.src}:${S.from}:${!!S.file}`;
function open(view) {
  Object.assign(S, { open: true, view, src: null, from: null, file: null, err: "", value: "" });
  // A running import reopens on its progress; a finished or stopped one starts over at the picker.
  if (S.job && (S.job.failed || S.job.step >= S.job.phases.length)) S.job = null;
  if (view !== "announcement" && S.job) { S.view = "progress"; S.src = S.job.src; }
  render();
}
function close() {
  const ov = root.querySelector(".imo:not(.closing)");
  if (!ov) return;
  S.open = false;
  stopOrbit(); stopCycle();
  ov.classList.add("closing");
  setTimeout(() => ov.remove(), 150);
  if (lastFocus?.isConnected) lastFocus.focus({ preventScroll: true });
  else $("#dash").focus();
}
function go(view, patch = {}) { Object.assign(S, { err: "" }, patch, { view }); render(); }

/* ───────── validation ───────── */
function normalize(v) {
  v = v.trim();
  if (!v) return null;
  try { const u = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(v) ? v : `https://${v}`); return /^https?:$/.test(u.protocol) && /\.[a-z]{2,}$/i.test(u.hostname) ? u : null; } catch { return null; }
}
function valid(kind, v) {
  const u = normalize(v);
  if (!u) return false;
  if (kind === "repo") return /(^|\.)github\.com$/i.test(u.hostname) && /^\/[^/]+\/[^/]+/.test(u.pathname);
  return true;
}

/* ───────── handlers ───────── */
function bindView(v) {
  const input = v.querySelector("#imp-url");
  if (input) {
    input.addEventListener("input", () => {
      S.value = input.value;
      const btn = v.querySelector('[data-act="submit-url"]');
      const kind = SRC[S.src].field;
      if (btn) btn.disabled = !valid(kind, S.value);
      if (S.err) { S.err = ""; render({ animate: false }); }
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitUrl(); } });
  }
  const drop = v.querySelector("#drop"), file = v.querySelector("#imp-file");
  file?.addEventListener("change", () => { pick(file.files?.[0]); file.value = ""; });
  if (drop) {
    let depth = 0;
    drop.addEventListener("dragenter", (e) => { e.preventDefault(); depth++; drop.classList.add("over"); });
    drop.addEventListener("dragover", (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
    drop.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; drop.classList.remove("over"); } });
    drop.addEventListener("drop", (e) => { e.preventDefault(); depth = 0; drop.classList.remove("over"); pick(e.dataTransfer.files?.[0]); });
  }
  v.querySelector("#pause")?.addEventListener("click", togglePause);
}
function pick(f) {
  if (!f) return;
  const spec = FILES[SRC[S.src].file];
  if (!f.name.toLowerCase().endsWith(spec.ext)) return go("upload", { err: spec.bad, file: null });
  if (f.size > spec.max) return go("upload", { err: spec.big, file: null });
  go("upload", { file: { name: f.name, size: f.size } });
}
function submitUrl() {
  const kind = SRC[S.src].field;
  if (!valid(kind, S.value)) { S.err = FIELDS[kind].bad; render({ animate: false }); return; }
  const u = normalize(S.value);
  const name = kind === "repo" ? u.pathname.split("/")[2].replace(/\.git$/, "") : u.hostname.replace(/^www\./, "");
  start(S.src, name, kind === "repo" ? "code" : "web");
}
function back() {
  if (S.view === "progress") return go(S.job.back.view, { src: S.job.back.src, from: S.job.back.from, file: S.job.back.file, value: S.job.back.value, job: null });
  if (S.view === "upload" && S.from) return go("steps", { src: S.from, from: null, file: null });
  go("picker", { src: null, from: null, file: null, value: "" });
}
root.addEventListener("click", (e) => {
  if (e.target.classList.contains("imo")) return close();
  const t = e.target.closest("[data-src], [data-act]");
  if (!t) return;
  if (t.dataset.src) {
    const s = SRC[t.dataset.src];
    return go(s.kind === "steps" ? "steps" : s.kind === "upload" ? "upload" : "url", { src: t.dataset.src, from: null, file: null, value: "" });
  }
  const act = t.dataset.act;
  if (act === "close") close();
  else if (act === "back") back();
  else if (act === "import-now") go("picker");
  else if (act === "learn") toast("Opens the import guide in the Design docs");
  else if (act === "copy") copyText(SRC.manus.prompt, "Copied the prompt");
  else if (act === "to-upload") go("upload", { from: S.src, src: "upload", file: null });
  else if (act === "choose") root.querySelector("#imp-file")?.click();
  else if (act === "remove") go("upload", { file: null });
  else if (act === "submit-url") submitUrl();
  else if (act === "start-file") start(S.from || S.src, S.file.name.replace(/\.(zip|fig)$/i, ""), SRC[S.src].file === "fig" ? "fig" : "code");
  else if (act === "retry") start(S.job.src, S.job.name, S.job.kind, S.job.back);
  else if (act === "again") { S.job = null; go("picker", { src: null, from: null, file: null, value: "" }); }
  else if (act === "open-design") { const n = S.job.name; S.job = null; close(); toast(`Opens ${n} in the editor`); }
});
document.addEventListener("keydown", (e) => {
  if (!S.open) return;
  if (e.key === "Escape" && !closeMenu) { e.preventDefault(); close(); }
  if (e.key === "Tab") {
    const f = [...root.querySelectorAll('button:not([disabled]), a[href], input:not([hidden]), [tabindex="0"]')].filter((el) => el.offsetParent);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }

/* ───────── the simulated import ───────── */
const PHASES = {
  code: ["Reading your files", "Finding pages and components", "Building screens", "Matching fonts and colors"],
  web: (n) => [`Opening ${n}`, "Reading each page", "Building screens", "Matching fonts and colors"],
  fig: ["Reading the file", "Converting frames", "Building screens"],
};
const ERRORS = {
  code: "Couldn't find an app in this project. Check that it has a package.json at its top level.",
  web: "Couldn't open this site. Check the URL and that the site is public.",
  fig: "Couldn't read this file. Save a fresh local copy from Figma and try again.",
};
let jobSeq = 0;
function start(src, name, kind, back) {
  const phases = typeof PHASES[kind] === "function" ? PHASES[kind](name) : PHASES[kind];
  const job = { id: ++jobSeq, src, name, kind, phases, step: 0, failed: false, error: ERRORS[kind], screens: 4 + (name.length % 5),
    back: back || { view: S.view, src: S.src, from: S.from, file: S.file, value: S.value } };
  S.job = job;
  go("progress", { src });
  const tick = () => {
    if (S.job !== job) return;
    if (S.fail && job.step === 1) { job.failed = true; return S.open && S.view === "progress" ? render({ animate: false }) : toast(`Import of ${name} stopped`); }
    job.step++;
    const finished = job.step >= job.phases.length;
    if (S.open && S.view === "progress") render({ animate: finished, focus: finished });
    else if (finished) toast(`${name} is ready`);
    if (!finished) setTimeout(tick, 900 + Math.random() * 700);
  };
  setTimeout(tick, 1100);
}

/* ───────── announcement orbit ───────── */
const ORBITS = [
  { rx: 240, ry: 100, period: 90, ids: ["webflow", "v0", "framer", "replit", "github", "wix", "squarespace"] },
  { rx: 154, ry: 66, period: 64, ids: ["base44", "lovable", "figma", "manus", "bolt"] },
];
let orbitRaf = 0, orbitT = 0, orbitLast = 0, paused = matchMedia("(prefers-reduced-motion: reduce)").matches;
function startOrbit() {
  const el = $("#orbit");
  if (!el || el.childElementCount) return;
  el.innerHTML = ORBITS.flatMap((o, oi) => o.ids.map((id, i) => `<span class="orb" data-o="${oi}" data-i="${i}">${logo(id)}</span>`)).join("");
  syncPause();
  orbitLast = performance.now();
  const frame = (now) => {
    if (!paused) orbitT += (now - orbitLast) / 1000;
    orbitLast = now;
    placeOrbit();
    orbitRaf = requestAnimationFrame(frame);
  };
  cancelAnimationFrame(orbitRaf);
  orbitRaf = requestAnimationFrame(frame);
}
function placeOrbit() {
  const hero = $(".hero");
  if (!hero) return;
  const k = hero.clientWidth / 560, cx = hero.clientWidth / 2, cy = hero.clientHeight / 2;
  for (const orb of hero.querySelectorAll(".orb")) {
    const o = ORBITS[+orb.dataset.o], n = o.ids.length, i = +orb.dataset.i;
    const a = (i / n) * Math.PI * 2 + (orbitT / o.period) * Math.PI * 2 + (+orb.dataset.o ? .5 : 0);
    const x = cx + Math.cos(a) * o.rx * k, y = cy + Math.sin(a) * o.ry * Math.min(1, k * 1.15);
    const depth = Math.sin(a); // 1 is nearest the viewer, at the bottom of the ring
    const s = (.82 + .3 * (depth + 1) / 2) * Math.min(1, .7 + k * .3);
    orb.style.transform = `translate(${x}px, ${y}px) scale(${s.toFixed(3)})`;
    orb.style.opacity = (.62 + .38 * (depth + 1) / 2).toFixed(3);
    orb.style.zIndex = String(depth > 0 ? 60 + Math.round(depth * 10) : 40 + Math.round(depth * 10));
  }
}
function stopOrbit() { cancelAnimationFrame(orbitRaf); orbitRaf = 0; }
function togglePause() { paused = !paused; syncPause(); }
function syncPause() {
  const b = $("#pause");
  if (!b) return;
  b.innerHTML = ic(paused ? "player-play-filled" : "player-pause-filled");
  b.setAttribute("aria-label", paused ? "Play animation" : "Pause animation");
}
let cycleTimer = 0;
function startCycle() {
  if (cycleTimer) return;
  cycleTimer = setInterval(() => {
    const c = root.querySelector(".cycle");
    if (!c) return stopCycle();
    const l = [...c.children], i = l.findIndex((x) => x.classList.contains("on"));
    l[i]?.classList.remove("on"); l[(i + 1) % l.length].classList.add("on");
  }, 1800);
}
function stopCycle() { clearInterval(cycleTimer); cycleTimer = 0; }

/* ───────── the dashboard ───────── */
const themeNow = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
// The dialogs use the dashboard's own Inter faces, so both draw the same glyphs.
const faces = DASH.css.match(/@font-face\s*\{[^}]*\}/g) || [];
document.head.insertAdjacentHTML("beforeend", `<style>${faces.join("\n")}</style>`);
const dash = $("#dash");
// The dashboard talks to this page by message, so it works whether or not the host lets frames reach each other.
function syncDashTheme() { dash.contentWindow?.postMessage({ protoTheme: themeNow() }, "*"); }
addEventListener("message", (e) => {
  if (e.source !== dash.contentWindow) return;
  if (e.data?.proto === "import") open("picker");
  else if (e.data?.proto === "escape" && S.open) close();
});
// Only Import is live; links and forms in the snapshot stay put.
const DASH_SCRIPT = `<script>
addEventListener("click", (e) => {
  if (e.target.closest('[data-proto="import"]')) { e.preventDefault(); parent.postMessage({ proto: "import" }, "*"); return; }
  if (e.target.closest("a[href], button[type=submit]")) e.preventDefault();
});
addEventListener("submit", (e) => e.preventDefault());
addEventListener("keydown", (e) => { if (e.key === "Escape") parent.postMessage({ proto: "escape" }, "*"); });
addEventListener("message", (e) => { const t = e.data && e.data.protoTheme; if (!t) return; const h = document.documentElement; h.className = t; h.dataset.theme = t; h.style.colorScheme = t; });

dash.srcdoc = `<!doctype html><html lang="${DASH.lang}" class="${themeNow()}" data-theme="${themeNow()}" style="color-scheme:${themeNow()}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>${DASH.css}</style></head><body class="${DASH.bodyClass}">${DASH.html}${DASH_SCRIPT}</body></html>`;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncDashTheme);
new MutationObserver(syncDashTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ───────── review strip ───────── */
function toggleTheme() { document.documentElement.dataset.theme = themeNow() === "dark" ? "light" : "dark"; }
$("#theme-btn").addEventListener("click", toggleTheme);
$("#ann-btn").addEventListener("click", () => { root.innerHTML = ""; S.open = false; open("announcement"); });
$("#fail-btn").addEventListener("click", (e) => { S.fail = !S.fail; e.currentTarget.setAttribute("aria-pressed", String(S.fail)); toast(S.fail ? "Imports now stop on the second step" : "Imports now finish"); });
kitChangesInit($("#changes-btn"));
addEventListener("resize", () => { if (S.view === "announcement") placeOrbit(); });

// The announcement greets the viewer once; the review strip's Announcement button brings it back.
let seen = false;
try { seen = localStorage.getItem("design-import-announcement") === "seen"; localStorage.setItem("design-import-announcement", "seen"); } catch {}
if (!seen || new URLSearchParams(location.search).has("announce")) open("announcement");
</script>
