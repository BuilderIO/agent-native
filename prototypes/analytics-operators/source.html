<!--
  Analytics operators prototype: new surfaces for the Analytics template on top of its shipped shell
  (docs/plans/2026-10-13-analytics-operators). Build with: node prototypes/kit/build.ts analytics-operators.
  The sidebar, header, Ask, dashboard, agent sidebar, menus, and dialogs are copied from prototypes/analytics.
  Layout of this file:
    <style>   the copied shell, then "operators" blocks: New badge, saved toast, table columns, chart toolbar,
              notebook, published app, funnel, retention, alerts, sessions, investigations
    markup    review strip (Screen, Theme, Changes) and the app root
    <script>  the copied shell, then "operators" banners: data, edits and undo, table columns, chart toolbar,
              notebooks, funnels and alerts, sessions, behavior, investigations, review strip
  Controls the shipped code doesn't have carry a "New" badge. The review strip exists only in the prototype.
  The test build (build.ts --test, dist/test.html) is for sessions with new users: no review strip, no New badges,
  and one starting state set up at load, so a reload starts the next tester over.
-->

.org .t small { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.25; color: var(--color-muted-foreground); }
.collapsed .org .t, .collapsed .org .wide { display: none; }
.sk-line { height: 12px; border-radius: 4px; background: color-mix(in srgb, var(--color-muted-foreground) 12%, transparent); }

/* ───────── header (Header.tsx): 64px at md+, borderless on the raised surface ───────── */
.hdr { flex: none; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--agent-kit-recessed-surface); }
.hdr .ttl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.hdr h1 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hdr .hacts { display: flex; align-items: center; gap: 8px; flex: none; }
.dname { display: flex; align-items: center; gap: 4px; min-width: 0; font-size: 18px; line-height: 28px; font-weight: 600; }
.dname:hover { color: var(--color-primary); }
.dname span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dname svg.i { width: 14px; height: 14px; color: var(--color-muted-foreground); opacity: 0; }
.dname:hover svg.i { opacity: 1; }
.dname-in { height: 32px; width: 256px; font-size: 18px; font-weight: 600; }
.cert { color: var(--color-primary); display: inline-flex; }
/* JoinedShareControl, primary variant (solid bg-primary text-primary-foreground) on both segments: Share is the primary action on
   the page. Compact header size, level with Add and the icon buttons: 32px, 12px/500 text, 14px icon, 10px padding, no user-plus icon. */
.share-split { display: inline-flex; flex: none; }
.share-split > button { height: 32px; display: inline-flex; align-items: center; justify-content: center; background: var(--color-primary); color: var(--color-primary-foreground); font-size: 12px; font-weight: 500; }
.share-split > button:hover { background: color-mix(in srgb, var(--color-primary) 90%, transparent); }
.share-split .st { padding: 0 10px; border-radius: 6px 0 0 6px; }
.share-split .sc { width: 32px; border-radius: 0 6px 6px 0; border-left: 1px solid color-mix(in srgb, var(--color-primary-foreground) 20%, transparent); }
.share-split svg.i { width: 14px; height: 14px; }
/* Add: the secondary Button variant (bg-secondary text-secondary-foreground hover:bg-secondary/80) at Share's compact header size. */
.add-t { height: 32px; padding: 0 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; flex: none; background: var(--color-secondary); color: var(--color-secondary-foreground); }
.add-t:hover, .add-t[aria-expanded="true"] { background: color-mix(in srgb, var(--color-secondary) 80%, transparent); }
.add-t svg.i { width: 14px; height: 14px; }
.add-t .cv { width: 12px; height: 12px; opacity: .6; }
.agent-t { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.agent-t:hover { background: color-mix(in srgb, var(--color-accent) 40%, transparent); color: var(--color-foreground); }
.agent-t svg.i { width: 18px; height: 18px; }
.runs-t .bdg { position: absolute; top: -2px; right: -2px; padding: 0 4px; border-radius: 999px; background: var(--color-primary); color: var(--color-primary-foreground); font-size: 10px; line-height: 14px; }
.presence { display: flex; align-items: center; }
.pav { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; border: 2px solid var(--agent-kit-recessed-surface); flex: none; }
.pav + .pav { margin-left: -6px; }
.pav.ai { background: var(--an-agent); }
.pav.ai.active { animation: pulse 2s infinite; }

/* ───────── Ask (AgentChatHome, hero composer) ───────── */
.ask { height: 100%; display: flex; flex-direction: column; background: var(--color-background); position: relative; }
:root[data-theme="dark"] .ask { background: transparent; }
.ask-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px 16px 96px; }
.ask-empty h1 { margin: 0; font-size: 36px; line-height: 1.12; font-weight: 600; letter-spacing: 0; text-align: center; }
.ask-empty .composer { width: 100%; max-width: min(750px, 100%); min-height: 7.875rem; border-radius: 1rem; border-color: var(--color-border); background: var(--color-card); box-shadow: none; }
:root[data-theme="dark"] .ask-empty .composer { background: color-mix(in srgb, hsl(var(--secondary)) 72%, color-mix(in srgb, hsl(var(--card)) 97%, hsl(var(--foreground)) 3%)); }
.ask-empty .cmp-input { min-height: 5.0625rem; font-size: 16px; line-height: 1.625rem; }
.ask-h { position: absolute; inset: 0 0 auto 0; height: var(--agent-kit-page-header-height); z-index: 2; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent); background: var(--agent-kit-recessed-surface); }
.ask-h .l { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
.ask-h h1 { margin: 0; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ask-h .sq { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.ask-h .sq:hover, .ask-h .sq[aria-expanded="true"] { background: color-mix(in srgb, var(--color-accent) 60%, transparent); color: var(--color-foreground); }
.ask-h .sq svg.i { width: 14px; height: 14px; }
.ask-h .nc { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-background) 95%, transparent); font-size: 12px; font-weight: 500; box-shadow: 0 1px 2px rgb(0 0 0 / 5%); }
.ask-h .nc:hover { background: var(--color-accent); }
.ask-h .nc svg.i { width: 14px; height: 14px; }
.ask-h .sh { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; }
.ask-h .sh:hover { background: color-mix(in srgb, var(--color-accent) 60%, transparent); }
.ask-h .sh svg.i { width: 15px; height: 15px; }
.ask-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-top: var(--agent-kit-page-header-height); }
.transcript { width: min(100%, var(--agent-kit-conversation-max-width)); margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; font-size: 14px; line-height: 1.52; }
.ask-foot { flex: none; padding: 0 16px 16px; }
.ask-foot .composer { width: min(100%, var(--agent-kit-conversation-max-width)); margin: 0 auto; }

/* messages and work rows (AgentKit transcript) */
.msg { display: flex; flex-direction: column; gap: 4px; }
.msg.user { align-items: flex-end; }
.bubble { max-width: min(88%, 38rem); padding: .625rem .8125rem; border-radius: var(--radius); background: var(--color-muted); white-space: pre-wrap; }
.prose > :first-child { margin-top: 0; }
.prose > :last-child { margin-bottom: 0; }
.prose p, .prose ul, .prose ol { margin: 0 0 .75em; }
.prose ul, .prose ol { padding-left: 1.25em; }
.prose li { margin: .2em 0; }
.prose code { font-family: var(--mono); font-size: 13px; background: var(--color-muted); padding: 1px 4px; border-radius: 4px; }
.acts { display: flex; align-items: center; gap: 2px; opacity: 0; transition: opacity .12s; color: var(--color-muted-foreground); }
.msg:hover .acts { opacity: 1; }
.acts button { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
.acts button:hover, .acts button[aria-pressed="true"] { background: var(--color-accent); color: var(--color-foreground); }
.acts svg.i { width: 14px; height: 14px; }
.acts .grow { flex: 1; }
.acts .time { font-size: 11px; padding-inline: 4px; }
.work { font-size: 13px; color: var(--color-muted-foreground); }
.work > button { display: inline-flex; align-items: center; gap: 4px; min-height: 1.75rem; border-radius: 6px; }
.work > button:hover { color: var(--color-foreground); }
.work > button svg.i { width: 14px; height: 14px; transition: transform .15s; }
.work.open > button svg.i { transform: rotate(90deg); }
.work .live { background: linear-gradient(90deg, var(--color-muted-foreground) 0 40%, var(--color-foreground) 50%, var(--color-muted-foreground) 60% 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
.work .groups { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 6px 0 4px 18px; }
.work .gl { font-size: 11px; font-weight: 500; margin-bottom: 2px; }
.work .ar { min-height: 1.75rem; display: flex; align-items: center; gap: 8px; color: var(--color-foreground); min-width: 0; }
.work .ar svg.i { width: 14px; height: 14px; color: var(--color-muted-foreground); }
.work .ar span { flex: none; }
.work .ar small { color: var(--color-muted-foreground); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
/* inline chart embed (toolkit IframeEmbed around the /chart route) */
.embed { margin: 8px 0; width: 100%; overflow: hidden; border-radius: 8px; border: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-background) 60%, transparent); }
.embed-h { min-height: 32px; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-muted) 30%, transparent); }
.embed-h .k { flex: none; font-size: 10px; font-weight: 500; text-transform: uppercase; color: var(--color-muted-foreground); }
.embed-h .sep { width: 1px; height: 12px; background: var(--color-border); flex: none; }
.embed-h .tt { flex: 1; min-width: 0; font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.embed-b { position: relative; background: color-mix(in srgb, var(--color-muted) 20%, transparent); padding: 8px; display: flex; flex-direction: column; }
.embed-b .ct { margin-bottom: 4px; padding: 0 4px; font-size: 12px; font-weight: 500; color: var(--color-muted-foreground); }
/* analysis-result renderer */
.ares { margin: 0; min-width: 0; }
.ares figcaption { font-size: 12px; font-weight: 500; color: var(--color-muted-foreground); }
.ares output { margin-top: 8px; display: flex; align-items: baseline; gap: 8px; font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -.025em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.ares output span + span { font-size: 16px; font-weight: 500; }
.ares p { margin: 4px 0 0; font-size: 12px; color: var(--color-muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* the shared composer (AgentComposerFrame + PromptComposer) */
.composer { border: 1px solid var(--agent-kit-composer-border-color); border-radius: var(--agent-kit-composer-radius); background: var(--agent-kit-raised-surface); box-shadow: var(--agent-kit-composer-elevation); display: flex; flex-direction: column; min-height: var(--agent-kit-composer-min-height); }
.composer:focus-within { border-color: var(--agent-kit-composer-focus-border-color); }
.cmp-input { flex: 1; min-height: var(--agent-kit-composer-editor-min-height); max-height: 12rem; overflow-y: auto; padding: 14px 16px 2px; font-size: 14px; line-height: 20px; outline: none; white-space: pre-wrap; text-align: left; }
.cmp-input:empty::before { content: attr(data-ph); color: var(--color-muted-foreground); pointer-events: none; }
.cmp-bar { display: flex; align-items: center; gap: 4px; padding: 4px 12px 8px 10px; }
.cmp-bar .grow { flex: 1; }
.cmp-btn { height: 28px; min-width: 28px; padding: 0 6px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--color-muted-foreground); }
.cmp-btn:hover, .cmp-btn[aria-expanded="true"] { background: var(--color-accent); color: var(--color-foreground); }
.cmp-btn svg.s12 { width: 12px; height: 12px; }
.cmp-send { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; background: var(--color-primary); color: var(--color-primary-foreground); flex: none; }
.cmp-send[disabled] { opacity: .35; cursor: default; }
.cmp-send.stop { background: var(--color-foreground); color: var(--color-background); }
.composer.compact { min-height: 0; box-shadow: none; }
.composer.compact .cmp-input { min-height: 56px; padding: 10px 12px 2px; }
.composer.compact .cmp-bar { padding: 4px 8px 8px; }
.ctx-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 0; }
.ctx-chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; border: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-muted) 50%, transparent); padding: 2px 4px 2px 8px; font-size: 11px; font-weight: 500; max-width: 100%; }
.ctx-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx-chip button { width: 16px; height: 16px; display: grid; place-items: center; color: var(--color-muted-foreground); border-radius: 4px; flex: none; }
.ctx-chip button:hover { background: var(--color-accent); color: var(--color-foreground); }

/* ───────── dashboards overview (DashboardOverview.tsx) ───────── */
.wrap { max-width: 64rem; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
.wrap > p.intro { margin: 0; max-width: 42rem; font-size: 14px; color: var(--color-muted-foreground); }
.toolbar { display: flex; align-items: center; gap: 8px; }
.search { position: relative; flex: 1; min-width: 0; }
.search > svg.i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--color-muted-foreground); pointer-events: none; }
.search .input { padding-left: 36px; }
.ov { overflow: hidden; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent); background: var(--color-card); }
:root[data-theme="dark"] .ov { background: var(--agent-kit-raised-surface); }
.ov section + section { border-top: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent); }
.ov-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: color-mix(in srgb, var(--color-muted) 20%, transparent); }
.ov-h > div { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ov-h h2 { margin: 0; font-size: 14px; font-weight: 600; }
.ov-h svg.i { color: var(--color-muted-foreground); }
.ov-h .badge-s { border-radius: 6px; padding: 2px 8px; font-weight: 400; }
.fd-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent); }
.fd-h svg.i { color: var(--color-muted-foreground); }
.fd-h h3 { margin: 0; font-size: 14px; font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fd-h small { font-size: 12px; color: var(--color-muted-foreground); }
.fd-empty { margin: 0; border-top: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent); padding: 16px; font-size: 14px; color: var(--color-muted-foreground); }
.drow { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent); }
.drow:hover { background: color-mix(in srgb, var(--color-muted) 30%, transparent); }
.drow > button.dl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; }
.dico { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--color-primary) 10%, transparent); color: var(--color-primary); flex: none; }
.drow .nm { min-width: 0; }
.drow .nm p { margin: 0; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow:hover .nm p { color: var(--color-primary); }
.drow .nm small { display: block; font-size: 12px; color: var(--color-muted-foreground); }
.ecard { border-radius: 8px; border: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent); background: var(--color-card); display: flex; align-items: flex-start; gap: 12px; padding: 20px; }
.ecard .dico svg.i { width: 20px; height: 20px; }
.ecard p { margin: 0; font-size: 14px; }
.ecard p + p { margin-top: 4px; color: var(--color-muted-foreground); }

/* ───────── dashboard (sql-dashboard/index.tsx) ───────── */
.dash { display: flex; flex-direction: column; gap: 16px; }
.ddesc { display: flex; align-items: flex-start; gap: 6px; width: 100%; text-align: left; font-size: 14px; color: var(--color-muted-foreground); }
.ddesc:hover { color: var(--color-foreground); }
.ddesc span { flex: 1; }
.ddesc svg.i { width: 12px; height: 12px; margin-top: 2px; opacity: 0; }
.ddesc:hover svg.i { opacity: .6; }
.ddesc-add { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; font-size: 12px; color: color-mix(in srgb, var(--color-muted-foreground) 60%, transparent); }
.ddesc-add:hover { color: var(--color-muted-foreground); }
.ddesc-add svg.i { width: 12px; height: 12px; }
textarea.ta { width: 100%; resize: vertical; border: 1px solid var(--color-input); border-radius: 6px; background: transparent; padding: 8px 12px; font: inherit; font-size: 14px; color: var(--color-foreground); outline: none; }
.demo { position: relative; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--an-cyan) 50%, transparent); background: color-mix(in srgb, var(--an-cyan) 10%, transparent); padding: 16px 48px 16px 44px; box-shadow: 0 1px 2px color-mix(in srgb, var(--an-cyan) 10%, transparent); }
.demo > svg.i { position: absolute; left: 16px; top: 16px; color: var(--an-cyan); }
.demo h5 { margin: 0 0 4px; font-size: 14px; font-weight: 500; line-height: 1; }
.demo p { margin: 0; font-size: 14px; line-height: 1.5; color: color-mix(in srgb, var(--color-foreground) 80%, transparent); }
.demo .x { position: absolute; right: 8px; top: 8px; width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; }
.demo .x:hover { background: color-mix(in srgb, var(--an-cyan) 20%, transparent); }
.tabs { display: inline-flex; max-width: 100%; overflow-x: auto; height: 36px; align-items: center; padding: 3px; border-radius: 8px; background: var(--color-muted); color: var(--color-muted-foreground); }
.tabs.full { display: flex; width: 100%; justify-content: flex-start; }
.tabs button { height: 100%; padding: 0 12px; border-radius: 6px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--color-background); color: var(--color-foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 10%); }
.fbar { border-radius: 8px; background: var(--color-card); padding: 8px 12px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
:root[data-theme="dark"] .fbar, :root[data-theme="dark"] .card, :root[data-theme="dark"] .ecard { background: var(--agent-kit-raised-surface); }
.fbar .ctrls { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.fbar .fl { font-size: 12px; font-weight: 500; color: var(--color-muted-foreground); align-self: center; }
.fctl { display: flex; flex-direction: column; gap: 4px; }
.fctl > label { font-size: 12px; font-weight: 500; color: var(--color-muted-foreground); }
.fctl .sel.sm { width: 140px; justify-content: flex-start; }
.fctl .sel.sm .v { flex: 1; }
.fctl .input.sm { width: 160px; font-size: 12px; }
.drange { display: flex; align-items: center; gap: 6px; }
.drange > span { font-size: 12px; color: var(--color-muted-foreground); }
.dp { height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--color-input); background: color-mix(in srgb, var(--color-input) 30%, transparent); display: inline-flex; align-items: center; gap: 8px; font-size: 12px; }
.dp svg.i { width: 14px; height: 14px; color: var(--color-muted-foreground); }
.fbar .fa { display: flex; align-items: center; gap: 4px; flex: none; align-self: center; opacity: 0; transition: opacity .15s; }
.fbar:hover .fa, .fbar:focus-within .fa, .fbar.closed .fa, .fbar.edited .fa { opacity: 1; }
/* New: the view picker is the filter bar's first control; a saved view's unsaved changes read "· Edited". */
.fctl .sel.sm.vpick { width: auto; min-width: 140px; max-width: 240px; }
.vpick .ed { color: var(--color-muted-foreground); }
.menu .vdef { margin-left: auto; padding-left: 12px; font-size: 11px; color: var(--color-muted-foreground); }
.fa button { height: 24px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--color-muted-foreground); }
.fa button:hover { background: var(--color-accent); color: var(--color-foreground); }
.fa button svg.i { width: 12px; height: 12px; }
.fa .cv svg { transition: transform .15s; }
.fa .cv.up svg { transform: rotate(180deg); }
/* .dashboard-grid: a row's panels stack until the grid is 768px wide (the agent sidebar open narrows it). */
.grid { display: flex; flex-direction: column; gap: 16px; container: dashboard-grid / inline-size; }
.grow-row { display: flex; flex-direction: column; gap: 16px; align-items: stretch; }
.grow-row > .cell { flex: 1 1 100%; min-width: 0; position: relative; }
@container dashboard-grid (min-width: 768px) { .grow-row { flex-direction: row; } .grow-row > .cell { flex-basis: 0; } }
.sect { margin-top: 8px; position: relative; }
.sect-h { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
.sect-h h2 { margin: 0; flex: 1; font-size: 16px; font-weight: 600; }
.sect p { margin: 4px 0 0; font-size: 14px; color: var(--color-muted-foreground); }
.card { height: 100%; border-radius: 8px; background: var(--color-card); box-shadow: 0 1px 3px 0 rgb(0 0 0 / 10%), 0 1px 2px -1px rgb(0 0 0 / 10%); display: flex; flex-direction: column; position: relative; }
.card.sel-chat { box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-foreground) 10%, transparent); }
.card.new { animation: rise .4s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.card-h { display: flex; align-items: center; gap: 8px; padding: 24px 24px 8px; flex: none; }
.card-h h3 { margin: 0; flex: 1; min-width: 0; font-size: 14px; line-height: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-acts { display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity .15s; }
.cell:hover .p-acts, .sect:hover .p-acts, .p-acts:focus-within, .p-acts.keep { opacity: 1; }
.p-acts button { padding: 4px; border-radius: 4px; color: var(--color-muted-foreground); display: grid; }
.p-acts button:hover, .p-acts button[aria-expanded="true"] { color: var(--color-foreground); }
.p-acts button.grip { color: color-mix(in srgb, var(--color-muted-foreground) 50%, transparent); cursor: grab; }
.p-acts svg.i { width: 14px; height: 14px; }
.card-b { flex: 1; display: flex; flex-direction: column; padding: 0 24px 24px; min-width: 0; }
.remote { outline: 2px solid var(--an-agent); outline-offset: 2px; border-radius: 8px; }
.remote-l { position: absolute; top: -10px; left: 12px; z-index: 10; padding: 0 6px; border-radius: 4px; font-size: 10px; font-weight: 500; background: var(--an-agent); color: #fff; }
.dragging { opacity: .55; }
.drop-line { height: 3px; border-radius: 999px; background: var(--an-drop); box-shadow: 0 0 0 1px color-mix(in srgb, var(--an-drop) 18%, transparent); margin: -9px 0 -10px; }
/* New: the insert bar overlays the row gap, so showing it never moves a row. It hides while a panel drags, leaving the drop line alone. */
.grow-row { position: relative; }
.ins { position: absolute; left: 0; right: 0; z-index: 4; display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity .12s; }
.ins.above { top: -16px; height: 16px; }
.sect > .ins.above { top: -24px; height: 24px; }
.ins.below { bottom: -16px; height: 16px; }
.ins:hover, .ins:focus-within, .ins.keep, .ins:has([aria-expanded="true"]) { opacity: 1; }
.ins .line { flex: 1; height: 1px; background: var(--color-border); }
.ins button { height: 20px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: var(--color-muted-foreground); background: var(--color-background); }
.ins button:hover, .ins button[aria-expanded="true"] { background: var(--color-accent); color: var(--color-foreground); }
.ins button svg.i { width: 12px; height: 12px; }
.ins .nb { margin-left: 2px; }
#dgrid.panel-dragging .ins { display: none; }
.empty-card { border-radius: 8px; background: var(--color-card); height: 256px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 14px; color: var(--color-muted-foreground); }
:root[data-theme="dark"] .empty-card { background: var(--agent-kit-raised-surface); }
.empty-card p { margin: 0; }

/* charts (SqlChart.tsx): 250px plot, custom series legend, portal tooltip */
.ch { position: relative; width: 100%; height: 250px; }
.ch svg { display: block; overflow: visible; }
.ch text { font-family: var(--font); }
.fill .ch { height: 100%; min-height: 250px; flex: 1; }
.legend { margin-top: 4px; max-height: 64px; overflow-y: auto; overflow-x: hidden; padding-right: 4px; font-size: 11px; line-height: 16px; color: var(--color-muted-foreground); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.lg { display: inline-flex; min-height: 24px; max-width: 14rem; align-items: center; gap: 6px; padding: 0 6px; border-radius: 6px; text-align: left; }
.lg:hover { color: var(--color-foreground); }
.lg.off { opacity: .35; }
.lg .lsw { position: relative; width: 12px; height: 10px; flex: none; }
.lg .lsw i { position: absolute; left: 0; right: 0; top: 50%; height: 1px; transform: translateY(-50%); }
.lg .lsw b { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; border-radius: 50%; transform: translate(-50%, -50%); }
.lg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg-pop { position: fixed; z-index: 58; padding: 4px; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-popover); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 10%); display: flex; gap: 2px; }
.lg-pop button { min-height: 32px; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.lg-pop button:hover { background: var(--color-accent); }
.lg-pop button[disabled] { opacity: .4; pointer-events: none; }
.ctip { position: fixed; z-index: 60; min-width: 160px; max-width: 280px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-card); padding: 8px 12px; font-size: 12px; color: var(--color-foreground); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 10%), 0 4px 6px -4px rgb(0 0 0 / 10%); pointer-events: none; }
.ctip .tot { margin-bottom: 6px; font-weight: 600; }
.ctip .lb { margin-bottom: 6px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctip .rw { display: flex; align-items: center; gap: 8px; }
.ctip .rw + .rw { margin-top: 4px; }
.ctip .rw i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.ctip .rw span { flex: 1; min-width: 0; color: var(--color-muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctip .rw b { font-weight: 500; font-variant-numeric: tabular-nums; }
.metric { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0; text-align: center; }
.metric .v { font-size: 30px; line-height: 36px; font-weight: 700; }
.metric p { margin: 4px 0 0; font-size: 12px; color: var(--color-muted-foreground); }
.tbl-w { min-height: 386px; display: flex; flex-direction: column; gap: 4px; }
.tbl-s { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; padding: 6px 8px; font-weight: 500; color: var(--color-muted-foreground); white-space: nowrap; border-bottom: 1px solid var(--color-border); cursor: pointer; user-select: none; }
.tbl th:hover { color: var(--color-foreground); }
.tbl th span { display: inline-flex; align-items: center; gap: 4px; }
.tbl th svg.i { width: 12px; height: 12px; }
.tbl th svg.i.dim { opacity: .3; }
.tbl td { padding: 6px 8px; white-space: nowrap; border-bottom: 1px solid color-mix(in srgb, var(--color-border) 50%, transparent); }
.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.hm { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.rl { font-weight: 500; color: var(--color-muted-foreground); }
.tbl th.r { text-align: right; cursor: default; }
.delta { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; }
.delta svg.i { width: 14px; height: 14px; }
.delta.up { color: var(--an-emerald); }
.delta.down { color: var(--an-red); }
.tbl-p { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 0; border-top: 1px solid var(--color-border); font-size: 12px; color: var(--color-muted-foreground); }
.tbl-p > div { display: flex; align-items: center; gap: 8px; }
.tbl-p .pg { gap: 4px; }
.tbl-p .sel { height: 24px; width: 64px; padding: 0 8px; font-size: 12px; }
.tbl-p .sel svg.i { width: 12px; height: 12px; }
.tbl-p .pb { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; }
.tbl-p .pb:hover { background: var(--color-accent); }
.tbl-p .pb[disabled] { opacity: .5; pointer-events: none; }
.tbl-p .pb svg.i { width: 14px; height: 14px; }
.funnel { display: flex; flex-direction: column; gap: 12px; padding: 8px 0; }
.fn-r { display: flex; flex-direction: column; gap: 4px; }
.fn-r .t { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 12px; }
.fn-r .t b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fn-r .t span { flex: none; color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }
.fn-r .bar { height: 20px; overflow: hidden; border-radius: 2px; background: color-mix(in srgb, var(--color-muted) 60%, transparent); }
.fn-r .bar i { display: block; height: 100%; border-radius: 2px; }
.callouts { display: flex; flex-direction: column; gap: 8px; }
.callout { display: flex; align-items: flex-start; gap: 8px; border-radius: 6px; border: 1px solid; padding: 8px 12px; font-size: 14px; }
.callout svg.i { margin-top: 2px; }
.callout.warning { border-color: color-mix(in srgb, var(--an-amber) 40%, transparent); background: color-mix(in srgb, var(--an-amber) 10%, transparent); color: var(--an-amber-text); }
.ch-sk { flex: 1; min-height: 250px; border-radius: 6px; background: color-mix(in srgb, var(--color-muted-foreground) 12%, transparent); animation: blink 1.6s ease-in-out infinite; }


/* ───────── agent sidebar (toolkit AgentSidebar): 380 wide, nav surface, 13px density ───────── */
.agent { flex: none; width: 0; overflow: clip; transition: width 260ms var(--ease-drawer); background: var(--agent-kit-nav-surface); display: flex; font-size: 13px; }
.agent.open { width: 380px; border-left: 1px solid hsl(var(--border) / .72); }
.agent-in { width: 380px; min-width: 380px; display: flex; flex-direction: column; height: 100%; }
.ag-h { flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px; border-bottom: 1px solid hsl(var(--border) / .72); }
.ag-tabs { display: flex; gap: 2px; min-width: 0; padding: 4px; }
.ag-tab { position: relative; min-width: 56px; max-width: 180px; padding: 6px 10px; border-radius: 8px; border: 1px solid transparent; font-size: 11px; font-weight: 500; color: var(--color-muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 6px; }
.ag-tab[aria-selected="true"] { background: var(--color-accent); color: var(--color-foreground); }
.ag-tab .run { width: 6px; height: 6px; border-radius: 50%; background: var(--an-agent); animation: blink 1.2s infinite; flex: none; }
.ag-acts { display: flex; gap: 2px; flex: none; }
.ag-acts button { width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.ag-acts button:hover { color: var(--color-foreground); background: color-mix(in srgb, var(--color-accent) 50%, transparent); }
.ag-b { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.ag-b .msg { font-size: 13px; }
.ag-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: color-mix(in srgb, var(--color-muted-foreground) 60%, transparent); }
.ag-empty svg.i { width: 20px; height: 20px; }
.ag-sugs { display: flex; gap: 4px; overflow-x: auto; padding: 8px 12px; scrollbar-width: none; }
.chip-s { flex: none; height: 28px; padding: 0 10px; border-radius: 999px; background: color-mix(in srgb, var(--color-muted) 55%, transparent); border: 1px solid transparent; font-size: 11px; color: color-mix(in srgb, var(--color-foreground) 80%, transparent); white-space: nowrap; }
.chip-s:hover { background: var(--color-muted); border-color: color-mix(in srgb, var(--color-border) 55%, transparent); color: var(--color-foreground); }
.ag-f { flex: none; padding: 0 12px 12px; }
.ag-f .composer { border-radius: 14px; border: 1px solid hsl(var(--border) / .9); min-height: 0; box-shadow: 0 .5rem 1.875rem hsl(var(--foreground) / .06); }
.ag-f .cmp-input { min-height: 52px; padding: 12px 14px 4px; }
.ag-f .cmp-bar { padding: 6px 8px 8px; }

/* ───────── phone width (below md, 767px): MobileNav, the sidebar in a left Sheet, the agent sidebar as an overlay ───────── */
/* MobileNav.tsx: an h-11 bar with the menu button (size-9, 20px icon), the brand and New chat on Ask; it opens the sidebar in the
   toolkit Sheet (280px, bg-background/35 overlay, close button at end-3 top-3) without the collapse and resize controls. The toolkit
   AgentSidebar becomes a fixed overlay, 85vw at most, over a bg-foreground/40 backdrop that closes it. The shipped Header is
   hidden md:flex; the prototype keeps it as a compact row under
   MobileNav, wrapping the actions under a long title, so the drawn header actions stay reachable. */
.mnav, .nav-scrim, .agent-scrim, .side .m-x { display: none; }
@media (max-width: 767px) {
  .app { flex-direction: column; }
  .mnav { flex: none; height: 44px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid var(--color-border); background: var(--color-background); }
  .mnav .mt { width: 36px; height: 36px; margin: 0 8px 0 -4px; border-radius: 6px; display: grid; place-items: center; flex: none; }
  .mnav .mt:hover { background: color-mix(in srgb, hsl(var(--sidebar-accent)) 50%, transparent); }
  .mnav .mt svg.i { width: 20px; height: 20px; }
  .mnav .br { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mnav .nc { margin-left: 8px; height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--color-border); background: var(--color-background); font-size: 12px; font-weight: 500; flex: none; }
  .mnav .nc:hover { background: var(--color-accent); }
  .mnav .nc svg.i { width: 16px; height: 16px; }
  .side, .side.collapsed { position: fixed; top: var(--kit-review-h); bottom: 0; left: 0; z-index: 60; width: 280px; border-right: 1px solid var(--color-border); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 10%); transform: translateX(-100%); visibility: hidden; transition: transform 200ms cubic-bezier(.32, .72, 0, 1), visibility 0s 200ms; }
  .side.msheet { transform: none; visibility: visible; transition: transform 300ms cubic-bezier(.32, .72, 0, 1); }
  .side .resize, .side [data-act="collapse"] { display: none; }
  .side .m-x { position: absolute; top: 12px; right: 12px; z-index: 1; width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--color-muted-foreground); }
  .side .m-x:hover { background: var(--color-accent); color: var(--color-foreground); }
  .side .m-x svg.i { width: 16px; height: 16px; }
  .nav-scrim { position: fixed; inset: var(--kit-review-h) 0 0; z-index: 59; background: color-mix(in srgb, var(--color-background) 35%, transparent); backdrop-filter: blur(1px); }
  .side.msheet + .nav-scrim { display: block; }
  .surface { border-radius: 0; }
  .hdr { height: auto; min-height: 48px; flex-wrap: wrap; gap: 4px 8px; padding: 8px 16px; }
  .hdr .ttl { flex: 1 1 200px; gap: 8px; }
  .hdr .hacts { gap: 4px; margin-left: auto; }
  .add-t > span { display: none; }
  .main-scroll { padding: 8px 16px 16px; }
  .ask-h .nc { display: none; }
  .ask-empty h1 { font-size: 24px; }
  .agent, .agent.open { position: fixed; top: var(--kit-review-h); right: 0; bottom: 0; z-index: 60; width: min(380px, 85vw); border-left: 1px solid hsl(var(--border)); transform: translateX(calc(100% + 1px)); visibility: hidden; transition: transform 260ms var(--ease-drawer), visibility 0s 260ms; }
  .agent.open { transform: none; visibility: visible; transition: transform 260ms var(--ease-drawer); }
  .agent-in { width: 100%; min-width: 0; }
  .agent-scrim { position: fixed; inset: var(--kit-review-h) 0 0; z-index: 59; background: color-mix(in srgb, var(--color-foreground) 40%, transparent); }
  .agent.open + .agent-scrim { display: block; }
  .dlg { max-width: calc(100vw - 32px); }
  .toast { left: 16px; max-width: calc(100vw - 32px); }
  .toast.ntoast { white-space: normal; }
  .review .name, .review .ver { display: none; }
  .review { gap: 6px; padding-inline: 8px; }
  .review .chip select { max-width: 136px; }
}

/* ───────── popovers, sheets, dialogs ───────── */
.pop { position: fixed; z-index: 55; background: var(--color-popover); color: var(--color-popover-foreground); border: 1px solid var(--color-border); border-radius: 6px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 10%), 0 4px 6px -4px rgb(0 0 0 / 10%); }
.pop h2 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1; letter-spacing: -.01em; }
.prompt-pop { width: 420px; padding: 12px; }
.prompt-pop .t { padding: 0 4px 8px; font-size: 14px; font-weight: 600; }
.prompt-pop .d { margin-top: -4px; padding: 0 4px 12px; font-size: 12px; color: var(--color-muted-foreground); }
.add-pop { width: 640px; padding: 20px; max-height: calc(100vh - 120px); overflow-y: auto; }
.add-pop h2 { margin-bottom: 16px; }
.seg2 { display: grid; grid-template-columns: 1fr 1fr; height: 36px; padding: 3px; border-radius: 8px; background: var(--color-muted); color: var(--color-muted-foreground); }
.seg2 button { border-radius: 6px; font-size: 14px; font-weight: 500; }
.seg2 button[aria-selected="true"] { background: var(--color-background); color: var(--color-foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 10%); }
.form { display: grid; gap: 16px; padding: 8px 0; }
.form .fg { display: grid; gap: 6px; }
.form .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.form .help { margin: 0; font-size: 12px; color: var(--color-muted-foreground); }
.form .sqlh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ed-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.sqled { position: relative; min-height: 200px; border: 1px solid var(--color-input); border-radius: 6px; background: var(--color-background); }
.sqled:focus-within { box-shadow: 0 0 0 2px hsl(var(--ring)); }
.sqled pre, .sqled textarea { margin: 0; padding: 12px; font-family: var(--mono); font-size: 12px; line-height: 20px; white-space: pre-wrap; word-break: break-word; }
.sqled pre { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--color-foreground); }
.sqled textarea { position: relative; z-index: 1; width: 100%; min-height: inherit; height: 100%; border: 0; background: transparent; color: transparent; caret-color: var(--color-foreground); resize: vertical; outline: none; }
.sq-k { color: var(--an-sql-keyword); font-weight: 600; } .sq-s { color: var(--an-sql-string); } .sq-n { color: var(--an-sql-number); } .sq-f { color: var(--an-sql-fn); } .sq-c { color: var(--an-sql-comment); font-style: italic; } .sq-v { color: var(--an-sql-number); font-weight: 500; }
.sql-pop { width: 640px; padding: 16px; }
.sql-pop .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.sql-pop .hd > div { display: flex; align-items: center; gap: 8px; }
.sql-pop h3 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1; }
.sql-pop .badge-s { font-size: 10px; font-weight: 400; padding: 1px 8px; }
.sql-pop .help { margin: 6px 0 0; font-size: 11px; color: var(--color-muted-foreground); }
.sql-pop .ft { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
/* ShareButton with agentTabContent and quickCopy (toolkit app/sharing/ShareButton.tsx), drawn at the compact panel density
   the owner decided for every app (1.9): a 320px popover, p-3, 24px tabs and controls with 12/16 text, 28px rows, 8px between
   sections. With quickCopy the People panel drops the "Share link" row, since the split button's link segment copies it; it
   reads the invite field, People with access, and General access last as a sentence. The popover and disclosure borders are rings, so no
   1px border pushes a height off the grid. */
.shp { width: min(320px, calc(100vw - 16px)); padding: 12px; border: 0; border-radius: 8px; box-shadow: 0 0 0 1px var(--color-border), 0 10px 15px -3px rgb(0 0 0 / 10%), 0 4px 6px -4px rgb(0 0 0 / 10%); font-size: 12px; line-height: 16px; }
.shp-tabs { display: flex; gap: 4px; height: 24px; margin-bottom: 8px; }
.shp-tabs button { position: relative; height: 24px; padding: 0 8px; display: inline-flex; align-items: center; font-size: 12px; line-height: 16px; font-weight: 400; color: var(--color-muted-foreground); }
.shp-tabs button:hover { color: var(--color-foreground); }
.shp-tabs button[aria-selected="true"] { color: var(--color-foreground); font-weight: 500; }
.shp-tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; background: var(--color-foreground); }
.shp-tabs .nb { margin-left: 4px; }
.shp-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.shp-row .lb { font-size: 12px; line-height: 16px; font-weight: 500; }
.shp-row .ds { font-size: 12px; line-height: 16px; color: var(--color-muted-foreground); }
.shp .b.sm { height: 24px; padding: 0 8px; gap: 4px; font-size: 12px; line-height: 16px; }
.shp-inv { display: flex; gap: 8px; }
.shp-inv .fld { flex: 1; min-width: 0; height: 24px; display: flex; align-items: center; overflow: hidden; border: 1px solid var(--color-input); border-radius: 6px; background: var(--color-card); }
.shp-inv .fld:focus-within { box-shadow: 0 0 0 1px hsl(var(--ring)); }
.shp-inv input { flex: 1; min-width: 0; height: 100%; padding: 0 8px; border: 0; background: transparent; font-size: 12px; line-height: 16px; color: var(--color-foreground); outline: none; }
.shp-inv input::placeholder { color: var(--color-muted-foreground); }
.shp-inv .role { height: 100%; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; color: var(--color-muted-foreground); }
.shp-inv .role:hover { background: var(--color-accent); color: var(--color-accent-foreground); }
.shp-inv .role svg.i { width: 12px; height: 12px; }
.shp-inv .send { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; flex: none; background: var(--color-primary); color: var(--color-primary-foreground); }
.shp-inv .send:hover:not(:disabled) { background: color-mix(in srgb, var(--color-primary) 90%, transparent); }
.shp-inv .send:disabled { opacity: .5; }
.shp-inv .send svg.i { width: 14px; height: 14px; }
.shp-notify { display: flex; align-items: center; gap: 8px; height: 16px; margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--color-muted-foreground); }

/* Dialog's overlay is bg-background/45 with a 1px blur; AlertDialog's is bg-black/80. */

/* ───────── command menu (CommandPalette.tsx, shadcn CommandDialog) ───────── */

.cmd { width: min(512px, calc(100% - 32px)); border-radius: 8px; background: var(--color-popover); border: 1px solid var(--color-border); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 10%); overflow: hidden; }

/* ═════════ operators: the new surfaces ═════════ */
/* New badge: the toolkit Badge's outline variant (rounded-full, border, semibold, text-foreground) at 10px. */
.nb { display: inline-flex; align-items: center; height: 16px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--color-border); background: var(--color-background); color: var(--color-foreground); font-size: 10px; font-weight: 600; line-height: 1; letter-spacing: 0; white-space: nowrap; flex: none; vertical-align: middle; }
.menu .nb { margin-left: 8px; }

/* Saved toast: every edit, by hand or by the agent, lands with Saved and Undo. */
.etoast { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; }

/* Table panel columns: menu, resize, reorder. Fixed layout so hover tools never move a column. */
table.tbl.cols { table-layout: fixed; width: max-content; min-width: 100%; }
.tbl.cols th { position: relative; padding: 0; cursor: default; }
.tbl.cols th .th-in { display: flex; align-items: center; height: 32px; }
.tbl.cols th .th-l { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; height: 100%; padding: 0 8px; overflow: hidden; cursor: pointer; touch-action: none; }
.tbl.cols th .th-l > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl.cols th .th-tools { display: none; align-items: center; gap: 4px; padding-right: 6px; flex: none; }
.tbl.cols th:hover .th-tools, .tbl.cols th.hot .th-tools, .tbl.cols th .th-tools:has([aria-expanded="true"]) { display: flex; }
.tbl.cols th:is(:hover, .hot) .th-l { padding-right: 2px; }
.tbl.cols th:is(:hover, .hot) .th-l svg.dim { display: none; }
.th-m { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--color-muted-foreground); }

.th-rs { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 2; touch-action: none; }
.th-rs::after { content: ""; position: absolute; top: 6px; bottom: 6px; left: 3px; width: 2px; border-radius: 1px; background: var(--an-drop); opacity: 0; }
.tbl.cols th:hover .th-rs::after { opacity: .35; }
.th-rs:hover::after, .th-rs.on::after { opacity: 1; }
.tbl.cols th.moving { opacity: .4; }
.col-drop { position: fixed; z-index: 70; width: 3px; border-radius: 999px; background: var(--an-drop); pointer-events: none; }
.col-ghost { position: fixed; z-index: 71; height: 28px; padding: 0 10px; border-radius: 6px; display: flex; align-items: center; background: var(--color-popover); border: 1px solid var(--color-border); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 10%); font-size: 12px; font-weight: 500; pointer-events: none; }
.col-w { position: fixed; z-index: 71; padding: 2px 6px; border-radius: 4px; background: var(--color-primary); color: var(--color-primary-foreground); font-size: 11px; font-variant-numeric: tabular-nums; pointer-events: none; }
.tbl-empty { flex: 1; min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 14px; color: var(--color-muted-foreground); }
.fctl.fresh-f .sel { box-shadow: 0 0 0 2px color-mix(in srgb, var(--an-drop) 45%, transparent); }

/* Chart toolbar: title, type, series color, and axis format, edited in place on the panel. */

.v9-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

/* Result tools: Top N and calculations on a result. */

/* Typeahead: one list for SQL, formulas and inputs. */

.v9-fc { height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 2px 0 8px; border-radius: 6px; border: 1px solid var(--color-input); background: var(--color-background); font-size: 12px; font-family: var(--mono); }

.v9-ask-th { max-height: min(280px, 40vh); overflow-y: auto; border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-card); padding: 12px; display: grid; gap: 10px; font-size: 13px; line-height: 1.55; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 10%); }

.v9-ask-th .q { justify-self: end; max-width: 85%; padding: 6px 10px; border-radius: 12px; background: var(--color-secondary); }
.v9-ask-th .a p { margin: 0 0 6px; }
.v9-ask-th .sk { height: 12px; border-radius: 4px; background: color-mix(in srgb, var(--color-muted-foreground) 12%, transparent); animation: blink 1.6s ease-in-out infinite; }

.v9-ask-h { display: flex; align-items: center; gap: 6px; }
.v9-ask-h .grow { flex: 1; }
.v9-ask-h .ib { width: 24px; height: 24px; }
.v9-ask-h .ib svg.i { width: 12px; height: 12px; }

/* Funnel panel: one series color per step, amber drop-off, replays, and a conversion bell between steps. */
.fn2 { display: flex; flex-direction: column; padding: 4px 0; }
.fn-row { position: relative; display: flex; align-items: center; gap: 8px; }
.fn-step { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px; margin: 0 -8px; border-radius: 6px; text-align: left; }
.fn-step:hover { background: color-mix(in srgb, var(--color-muted) 50%, transparent); }
.fn-step .t { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; font-size: 12px; }
.fn-step .t b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-flex; align-items: baseline; gap: 8px; }
.fn-step .t b small { font-weight: 400; font-size: 11px; color: var(--color-muted-foreground); font-family: var(--mono); }
.fn-step .t span { flex: none; color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }
.fn-step .bar { position: relative; height: 20px; border-radius: 2px; background: color-mix(in srgb, var(--color-muted) 60%, transparent); overflow: hidden; }
.fn-step .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
.fn-step .bar s { position: absolute; top: 0; bottom: 0; border-radius: 0 2px 2px 0; background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--an-amber) 35%, transparent) 0 4px, color-mix(in srgb, var(--an-amber) 15%, transparent) 4px 8px); }
.fn-bell { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--color-muted-foreground); flex: none; }
.fn-tools { display: flex; align-items: center; gap: 4px; flex: none; opacity: 0; }
.fn-conv:hover .fn-tools, .fn-conv.hot .fn-tools, .fn-tools:has(.on), .fn-tools:focus-within { opacity: 1; }
.fn-tools .nb { visibility: hidden; }
.fn-conv:hover .fn-tools .nb, .fn-conv.hot .fn-tools .nb { visibility: visible; }
.fn-bell:hover { background: var(--color-accent); color: var(--color-foreground); }
.fn-bell.on { color: var(--an-amber); }
.fn-bell svg.i { width: 14px; height: 14px; }
.fn-conv { display: flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 0 0 8px; border-radius: 6px; font-size: 11px; color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }
.fn-conv svg.i { width: 12px; height: 12px; }
.fn-conv b { font-weight: 500; color: var(--color-foreground); }
.fn-conv .dr { margin-left: 4px; }
.fn-conv .grow { flex: 1; }
.fn-conv:hover, .fn-conv.hot { background: color-mix(in srgb, var(--color-muted) 35%, transparent); }
.fn-legend { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 11px; color: var(--color-muted-foreground); }
.fn-legend span { display: inline-flex; align-items: center; gap: 6px; }
.fn-legend i { width: 12px; height: 8px; border-radius: 2px; }
.fresh { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--color-muted-foreground); white-space: nowrap; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--an-emerald); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--an-emerald) 20%, transparent); }

/* Retention cohorts */
.ret { overflow-x: auto; }
.ret table { width: 100%; border-collapse: separate; border-spacing: 2px; font-size: 12px; font-variant-numeric: tabular-nums; }
.ret th { padding: 4px 6px; font-weight: 500; color: var(--color-muted-foreground); text-align: right; white-space: nowrap; }
.ret th:first-child, .ret td:first-child { text-align: left; }
.ret td { padding: 0 6px; height: 28px; text-align: right; white-space: nowrap; border-radius: 3px; }
.ret td.c { font-weight: 500; }
.ret td.n { color: var(--color-muted-foreground); }
.ret td.v { cursor: default; }
.ret tr.avg td { font-weight: 600; border-top: 1px solid var(--color-border); }
.ret-scale { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 11px; color: var(--color-muted-foreground); }
.ret-scale i { width: 96px; height: 8px; border-radius: 2px; background: linear-gradient(90deg, color-mix(in srgb, var(--brand-blue) 6%, transparent), color-mix(in srgb, var(--brand-blue) 60%, transparent)); }

/* Alert dialog */
.al-fresh { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; background: color-mix(in srgb, var(--an-emerald) 8%, transparent); font-size: 12px; }
.al-fresh .grow { flex: 1; }
.al-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.al-grid .fg { display: grid; gap: 6px; align-content: start; }
.al-grid .full { grid-column: 1 / -1; }
.al-grid .lab { height: 16px; display: flex; align-items: center; gap: 6px; font-size: 13px; }
.al-grid textarea.ta { height: 36px; min-height: 36px; }
.al-prev { border-radius: 6px; border: 1px solid var(--color-border); padding: 8px 12px 6px; }
.al-prev .hd { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--color-muted-foreground); margin-bottom: 6px; }
.al-prev svg { display: block; width: 100%; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; margin-right: 16px; }
.chk input { width: 16px; height: 16px; margin: 0; accent-color: var(--color-primary); }
textarea.ta.mono { font-family: var(--mono); font-size: 12px; }

/* Sessions (the replay list a funnel step opens) */
.sess { display: flex; flex-direction: column; gap: 12px; }
.sess-f { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.f-chip { height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 4px 0 10px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--an-drop) 50%, transparent); background: color-mix(in srgb, var(--an-drop) 8%, transparent); font-size: 12px; font-weight: 500; }
.f-chip svg.i { width: 14px; height: 14px; }
.f-chip button { width: 24px; height: 24px; border-radius: 4px; display: grid; place-items: center; color: var(--color-muted-foreground); }
.f-chip button:hover { background: var(--color-accent); color: var(--color-foreground); }
.sess-list { border-radius: 8px; border: 1px solid var(--color-border); background: var(--color-card); overflow: hidden; }
:root[data-theme="dark"] .sess-list { background: var(--agent-kit-raised-surface); }
.sess-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--color-border); font-size: 12px; color: var(--color-muted-foreground); }
.srow { display: flex; align-items: stretch; border-top: 1px solid var(--color-border); }
.srow:first-of-type { border-top: 0; }
.srow .ck { display: grid; place-items: center; padding: 0 12px; }
.srow .ck input { width: 16px; height: 16px; margin: 0; accent-color: var(--color-primary); }
.srow > button { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 12px 8px; text-align: left; }
.srow > button:hover { background: color-mix(in srgb, var(--color-muted) 35%, transparent); }
.srow .du { font-weight: 500; color: var(--color-primary); }
.srow .who b, .srow .pa b { display: block; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .pa b { font-weight: 400; color: var(--color-primary); }
.srow small { display: block; font-size: 12px; color: var(--color-muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .ev { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--color-muted-foreground); }
.srow .ev .er { color: var(--color-destructive); }
.srow .ev .st { color: var(--an-amber-text); }
/* ═════════ operators: Design apps (8.3) and dashboard filters ═════════ */
/* Make an app in Design: the outputs dialog. */
.dlg.mk { width: min(560px, calc(100vw - 24px)); }
.mk-l { display: grid; max-height: 320px; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.mk-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) 192px; align-items: center; gap: 4px 12px; padding: 6px 0; border-top: 1px solid color-mix(in srgb, var(--color-border) 60%, transparent); }
.mk-row:first-child { border-top: 0; }
.mk-row input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--color-primary); }
.mk-t { min-width: 0; display: flex; align-items: baseline; gap: 8px; font-size: 14px; }
.mk-t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mk-t small { flex: none; font-size: 12px; color: var(--color-muted-foreground); }
.input.mk-n { height: 24px; padding: 0 8px; font-family: var(--mono); font-size: 12px; }
.input.mk-n[aria-invalid="true"] { border-color: var(--an-amber); }
.mk-row.off .mk-t, .mk-row.off .mk-n { opacity: .5; }
.mk-err { grid-column: 2 / -1; margin: 0; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--an-amber-text); }
.mk-err svg.i { width: 12px; height: 12px; color: var(--an-amber); flex: none; }
.mk-note { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-muted-foreground); }
.mk-note svg.i { width: 12px; height: 12px; flex: none; }
@media (max-width: 560px) { .mk-row { grid-template-columns: 16px minmax(0, 1fr); } .input.mk-n { grid-column: 2; } }
/* A Design app reads this dashboard or notebook: the header chip, the panel marker, and their popover. */
.dapp-ind { display: inline-flex; align-items: center; gap: 4px; height: 20px; max-width: 176px; padding: 0 6px; border-radius: 6px; flex: none; font-size: 11px; font-weight: 500; color: var(--color-foreground); background: color-mix(in srgb, var(--color-primary) 8%, transparent); }
.dapp-ind:hover, .dapp-ind[aria-expanded="true"] { background: color-mix(in srgb, var(--color-primary) 14%, transparent); }
.dapp-ind svg.i { width: 12px; height: 12px; flex: none; }
.dapp-ind span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 720px) { .dapp-ind span { display: none; } }
.v9-ind { display: inline-flex; align-items: center; gap: 2px; flex: none; }
.card-h:has(.v9-ind) h3 { flex: 0 1 auto; }
.card-h:has(.v9-ind) .p-acts { margin-left: auto; }
.v9-ind button { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; color: var(--color-muted-foreground); }

.v9-ind svg.i { width: 12px; height: 12px; }
.dai-pop { width: min(320px, calc(100vw - 16px)); padding: 12px; display: grid; gap: 12px; font-size: 12px; }
.dai-row { display: flex; align-items: center; gap: 8px; }
.dai-row .ic { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; flex: none; background: var(--color-muted); color: var(--color-muted-foreground); }
.dai-row .ic svg.i { width: 14px; height: 14px; }
.dai-row > div { flex: 1; min-width: 0; }
.dai-row b { display: block; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dai-row small { color: var(--color-muted-foreground); }
.dai-l { margin-bottom: 6px; font-weight: 500; color: var(--color-muted-foreground); }
.dai-outs { display: flex; flex-wrap: wrap; gap: 4px; }
.dai-outs code, .dzp-l code { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--color-muted); }
.dai-note { margin: 0; display: flex; align-items: flex-start; gap: 6px; color: var(--color-muted-foreground); }
.dai-note svg.i { width: 12px; height: 12px; margin-top: 2px; flex: none; }
/* Design, framed: the editor's top bar, the screen list, and the generated app on the canvas (illustrative). */
.dz { position: fixed; inset: var(--kit-review-h) 0 0 0; z-index: 50; display: flex; flex-direction: column; background: var(--agent-kit-recessed-surface); color: var(--color-foreground); }
.dz-h { flex: none; min-height: 48px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; border-bottom: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent); }
.dz-brand { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--color-primary); flex: none; }
.dz-brand svg.i { width: 16px; height: 16px; }
.dz-sep { width: 1px; height: 16px; background: var(--color-border); flex: none; }
.dz-name { min-width: 0; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dz-h .badge-s { font-size: 10px; padding: 0 8px; flex: none; }
.dz-ill { height: 20px; display: inline-flex; align-items: center; padding: 0 6px; border-radius: 6px; border: 1px dashed var(--color-border); font-size: 11px; color: var(--color-muted-foreground); flex: none; }
.dz-h .grow { flex: 1; }
.dz-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.dz-acts .nb { margin-left: -4px; }
.dz-body { flex: 1; min-height: 0; display: flex; }
.dz-screens { flex: none; width: 224px; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; background: var(--agent-kit-nav-surface); border-right: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent); }
.dz-screens .lbl { padding: 4px 8px 6px; font-size: 11px; font-weight: 500; color: var(--color-muted-foreground); }
.dz-scr { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 12px; text-align: left; color: var(--color-muted-foreground); }
.dz-scr:hover { background: color-mix(in srgb, var(--color-accent) 60%, transparent); color: var(--color-foreground); }
.dz-scr[aria-current="true"] { background: color-mix(in srgb, var(--color-primary) 10%, transparent); color: var(--color-foreground); font-weight: 500; }
.dz-scr i { width: 32px; height: 24px; flex: none; border-radius: 3px; border: 1px solid var(--color-border); background: linear-gradient(var(--color-muted), var(--color-muted)) 4px 4px / 12px 3px no-repeat, linear-gradient(color-mix(in srgb, var(--color-muted-foreground) 25%, transparent), color-mix(in srgb, var(--color-muted-foreground) 25%, transparent)) 4px 11px / 22px 8px no-repeat, var(--color-background); }
.dz-canvas { flex: 1; min-width: 0; overflow: auto; padding: 32px; }
.dz-frame { max-width: 1024px; margin: 0 auto; border-radius: 12px; border: 1px solid var(--color-border); background: var(--color-background); overflow: hidden; box-shadow: 0 10px 30px -12px rgb(0 0 0 / 25%); }
.dz-frame-h { height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--color-border); background: color-mix(in srgb, var(--color-muted) 40%, transparent); font-size: 11px; color: var(--color-muted-foreground); }

@media (max-width: 720px) { .dz-screens, .dz-ill, .dz-sep { display: none; } .dz-canvas { padding: 12px; } .dz-h { padding-left: 12px; } }
.dza { padding: 24px; display: grid; gap: 16px; font-size: 14px; min-width: 0; }
.dza-h { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.dza-logo { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--color-primary); color: var(--color-primary-foreground); font-size: 12px; font-weight: 700; }

.dza-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.dza-sel { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--color-border); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-muted-foreground); background: var(--color-background); }

.dza-k { display: grid; grid-template-columns: repeat(auto-fit, minmax(152px, 1fr)); gap: 12px; }
.dza-kpi { min-width: 0; display: grid; gap: 4px; padding: 16px; border-radius: 12px; border: 1px solid var(--color-border); }
.dza-kpi small { font-size: 12px; color: var(--color-muted-foreground); }
.dza-kpi b { font-size: 24px; line-height: 32px; font-weight: 700; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dza-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.dza-card { min-width: 0; display: grid; gap: 8px; align-content: start; padding: 16px; border-radius: 12px; border: 1px solid var(--color-border); }
.dza-card h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }

.dza-sk { height: 16px; border-radius: 4px; background: color-mix(in srgb, var(--color-muted-foreground) 12%, transparent); animation: blink 1.6s ease-in-out infinite; }

.dza-back { justify-self: start; height: 24px; padding: 0 8px; margin-left: -8px; border-radius: 6px; font-size: 12px; color: var(--color-muted-foreground); }
.dza-back:hover { background: var(--color-accent); color: var(--color-foreground); }
.dza-dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(152px, 1fr)); gap: 12px; }
/* Data from Analytics, Publish, and the published state. */
.dz-pop { width: min(352px, calc(100vw - 16px)); padding: 8px; font-size: 12px; }

.dzp-src svg.i { width: 14px; height: 14px; color: var(--color-muted-foreground); flex: none; }
.dzp-src > span, .dzp-f > span { flex: 1; min-width: 0; color: var(--color-muted-foreground); }
.dzp-src > span b { color: var(--color-foreground); font-weight: 500; }
.dzp-f { border-top: 0; margin-top: 0; }
.dlg.dzp { width: min(448px, calc(100vw - 24px)); }
.dzp-p { margin: 0; font-size: 14px; line-height: 20px; color: var(--color-muted-foreground); }
.dzp-fg { display: grid; gap: 6px; }
.dzp-fg .input { font-size: 14px; }
.dzp-fg .input.mono { font-family: var(--mono); font-size: 13px; }
.dzp-acct, .dzp-aud { margin: 0; display: flex; align-items: flex-start; gap: 8px; font-size: 13px; line-height: 18px; }

function chipFill(b) {

  S.chipHandoff = { where, kind: k }; S.invHandoff = null;

// Called first by sendFrom: any send retires the chips in that thread, and a pending chip runs its own playback.
function chipSend(id, el, text) {
  const where = id === "ask-input" ? "ask" : id === "agent-input" ? "agent" : null; if (!where) return false;
  chipThread(where)?.forEach(m => m.next && (m.nextUsed = true));
  const h = S.chipHandoff; S.chipHandoff = null;
  if (!h || h.where !== where) return false;
  if (S.running) { toast("The agent is still working"); return true; }
  el.textContent = ""; if (where === "agent") S.agentDraft = "";
  const R = CHIP_RUNS[h.kind];
  if (h.kind === "investigate") { startInvestigation("activation", { kind: "panel", panel: "Activation funnel", ask: text }, { panel: findPanel("activation-funnel"), watch: true }); return true; }
  const ch = where === "ask" ? S.chats.find(c => c.id === S.chat) : null, msgs = chipThread(where);
  const rerender = where === "ask" ? () => renderSurface() : () => { renderAgent(); if (S.route === "dash") renderSurface(), requestAnimationFrame(drawCharts); };
  msgs.push({ u: text, time: nowTime() }); if (ch) ch.live = true;
  playRun(msgs, R.plan, () => { if (ch) ch.live = false; const dr = R.draft ? "dr" + Date.now() : null; if (dr) S.drafts[dr] = { kind: R.draft, status: R.draft === "alert" ? "applied" : "draft" }; R.after?.(); msgs.push({ a: R.answer, draft: dr, time: nowTime() }); }, rerender, where);
  return true;
}
