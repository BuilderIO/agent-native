}

.dur { position: absolute; right: 8px; bottom: 8px; border-radius: 4px; padding: 2px 6px; font-size: 11px; line-height: 16px; font-weight: 500; background: color-mix(in srgb, var(--color-foreground) 80%, transparent); color: var(--color-background); font-variant-numeric: tabular-nums; }
.pill-st { position: absolute; right: 8px; top: 8px; border-radius: 999px; padding: 2px 8px; font-size: 10px; line-height: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: .025em; background: color-mix(in srgb, var(--color-foreground) 80%, transparent); color: var(--color-background); }

.card:hover .ck, .selmode .ck { opacity: .7; }

.cbody { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.ctitle { display: flex; align-items: center; gap: 12px; }

.meta { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; font-size: 12px; line-height: 16px; color: var(--color-muted-foreground); }

/* Fake recordings: positioned blocks drawn from the theme so they read as screens in both themes. */
.scr { position: absolute; inset: 0; background: var(--color-card); overflow: hidden; container-type: size; }

.cam { position: absolute; left: 3.5%; bottom: 6%; width: 18cqh; aspect-ratio: 1; border-radius: 50%; background: color-mix(in srgb, var(--color-muted-foreground) 35%, var(--color-muted)); display: grid; place-items: center; box-shadow: 0 0 0 .6cqh var(--color-background); }

.ract { display: flex; align-items: center; gap: 8px; flex: none; }

.stack { display: flex; }

.desc { margin: 8px 4px 0; border-radius: 8px; padding: 10px 12px; background: color-mix(in srgb, var(--color-muted) 50%, transparent); font-size: 14px; line-height: 20px; color: color-mix(in srgb, var(--color-foreground) 85%, transparent); }

.taginput { margin: 12px 4px 0; max-width: 448px; min-height: 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px 8px; border: 1px solid var(--color-input); border-radius: 6px; }

.proc { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 72rem; width: 100%; margin-inline: auto; }
.proc .stage { aspect-ratio: 16 / 9; border-radius: 12px; background: var(--color-foreground); color: var(--color-background); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 14px; font-weight: 500; }

/* side panel */
.side { margin: 16px 16px 16px 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--color-border); border-radius: 12px; background: var(--color-background); box-shadow: 0 1px 2px rgb(0 0 0 / 5%); }

.tabs { flex: none; height: 40px; display: flex; align-items: center; border-bottom: 1px solid var(--color-border); }

.rec.collapsed .tabs .tl { display: none; }
.tab { position: relative; height: 40px; padding: 0 8px; font-size: 14px; font-weight: 500; color: color-mix(in srgb, var(--color-foreground) 60%, transparent); }
.tab:first-child { padding: 0; margin-inline-end: 8px; }

.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 0; height: 2px; background: var(--color-foreground); }
.tab:first-child[aria-selected="true"]::after { left: 0; right: 0; }
.tabs .ib { margin: 0 4px 0 auto; width: 32px; height: 32px; color: var(--color-foreground); }
.tabs .ib:hover { background: var(--color-accent); }
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }

.cmts { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 12px 64px; }
.cmt { display: flex; gap: 8px; padding-top: 8px; align-items: flex-start; }

.cmt .h .ts { margin-inline-start: auto; font: 12px/16px var(--mono); }
.cmt .h .ts:hover { text-decoration: underline; }
.cmt .txt { margin-top: 2px; font-size: 14px; line-height: 20px; overflow-wrap: anywhere; }

.cmt .row { margin-top: 4px; display: flex; align-items: center; gap: 2px; min-height: 28px; }

.cmt .row .ib { width: 28px; height: 28px; color: var(--color-foreground); }

.cmt .cnt { height: 28px; padding: 0 6px; border-radius: 6px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--color-border); }
.replies { padding-inline-start: 32px; }
.reply-box { padding-inline-start: 32px; display: flex; gap: 10px; align-items: center; margin-top: 4px; }
.reply-box .av { width: 24px; height: 24px; font-size: 10px; }
.reply-box .f { flex: 1; display: flex; align-items: flex-end; gap: 4px; border-radius: 16px; padding: 3px 3px 3px 9px; background: color-mix(in srgb, var(--color-muted) 60%, transparent); border: 1px solid transparent; }

.cwidget { pointer-events: auto; position: relative; background: var(--color-background); padding: 12px 10px; filter: drop-shadow(var(--comment-widget-shadow)); }
.cbox { position: relative; min-height: 72px; border-radius: 12px; border: 1px solid hsl(var(--comment-input-border)); background: var(--color-background); box-shadow: var(--comment-input-shadow); }

.emptyc { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 40px 32px; min-height: 100%; }

.emptyc .media svg { width: 24px; height: 24px; }
.emptyc b { font-size: 14px; font-weight: 500; color: var(--color-muted-foreground); }

.tr-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid var(--color-border); }

.setp { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.scard { border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent); border-radius: 8px; background: var(--color-card); }

.scard .cc { padding: 0 12px 12px; }
.trow { min-height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 14px; }
.sw { position: relative; width: 28px; height: 16px; border-radius: 99px; background: var(--color-input); flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--color-background); box-shadow: 0 1px 2px rgb(0 0 0 / 20%); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--color-primary); }
.sw[aria-checked="true"]::after { transform: translateX(12px); }
.selb { height: 32px; padding: 0 8px; border: 1px solid var(--color-input); border-radius: 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; background: var(--color-background); }
.note { font-size: 12px; line-height: 20px; color: var(--color-muted-foreground); padding: 4px 0; }

/* agent chat (toolkit AgentPanel) */
.agent { display: flex; flex-direction: column; min-height: 0; flex: 1; background: var(--agent-kit-nav-surface); }
.pane .agent { background: var(--color-background); }

.ag-head { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid color-mix(in srgb, var(--color-border) 72%, transparent); }
.ag-tab { display: flex; align-items: center; height: 28px; padding: 0 10px; border-radius: 8px; font-size: 11px; font-weight: 500; max-width: 150px; background: var(--color-accent); }

.ag-head .ib { width: 28px; height: 28px; }
.convo { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 8px; }
.msg { margin-bottom: 20px; font-size: 14px; line-height: 1.52; display: flex; flex-direction: column; align-items: flex-start; }

.msg .mc ul { margin: 0 0 10px; padding-left: 20px; }
.msg .mc li { margin-bottom: 4px; }
.msg .mc a { color: var(--color-link); cursor: pointer; }
.msg .mc a:hover { text-decoration: underline; }
.msg .mc code { font: 12px var(--mono); padding: 1px 4px; border-radius: 4px; background: var(--color-muted); }
.act-row { min-height: var(--agent-kit-activity-row-min-height); display: flex; align-items: center; gap: 8px; margin: -12px 0 8px; font-size: var(--agent-kit-density-font-size); color: var(--agent-kit-muted-text); }
.act-row .i { width: var(--agent-kit-activity-icon-size); height: var(--agent-kit-activity-icon-size); }
.thinking { display: flex; gap: 4px; padding: 4px 0 16px; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-muted-foreground); animation: pulse 1s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
.ag-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 64px 16px; }
.ag-empty > svg { width: 20px; height: 20px; color: color-mix(in srgb, var(--color-muted-foreground) 60%, transparent); }
.sugg { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 6px; }
.sugg button { width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--color-border) 70%, transparent); background: color-mix(in srgb, var(--color-card) 60%, transparent); font-size: 13px; color: var(--color-muted-foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 5%); }
.sugg button:hover { border-color: var(--color-border); background: var(--color-card); color: var(--color-foreground); }
.acomp { flex: none; padding: var(--agent-kit-composer-block-padding-start) 12px var(--agent-kit-composer-block-padding-end); }
.acbox { min-height: var(--agent-kit-composer-min-height); border-radius: var(--agent-kit-composer-radius); border: 1px solid var(--agent-kit-composer-border-color); background: var(--agent-kit-raised-surface); box-shadow: var(--agent-kit-composer-elevation); display: flex; flex-direction: column; }
.acbox textarea { flex: 1; resize: none; border: 0; background: none; outline: none; min-height: var(--agent-kit-composer-editor-min-height); padding: var(--agent-kit-composer-editor-padding-block-start) var(--agent-kit-composer-editor-padding-inline) var(--agent-kit-composer-editor-padding-block-end); font: var(--agent-kit-composer-font-size)/var(--agent-kit-composer-line-height) var(--font); color: var(--agent-kit-text); }
.actool { display: flex; align-items: center; gap: var(--agent-kit-composer-toolbar-control-gap); padding: 4px 8px 8px; }
.actool .tb { height: var(--agent-kit-composer-toolbar-control-size); min-width: var(--agent-kit-composer-toolbar-control-size); padding: 0 6px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--agent-kit-muted-text); }
.actool .tb:hover { background: var(--color-accent); color: var(--color-foreground); }
.asend { margin-inline-start: auto; width: var(--agent-kit-composer-control-size); height: var(--agent-kit-composer-control-size); border-radius: 50%; display: grid; place-items: center; background: var(--agent-kit-accent); color: var(--agent-kit-accent-text); }
.asend[disabled] { opacity: .4; }

/* popovers and dialogs */
.pop { position: fixed; z-index: 50; background: var(--color-popover); color: var(--color-popover-foreground); border: 1px solid var(--color-border); border-radius: 6px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 10%), 0 2px 4px -2px rgb(0 0 0 / 10%); overflow: hidden; animation: swap .12s ease-out; }
@keyframes swap { from { opacity: 0; transform: translateY(-2px); } }
.sh-h { height: 40px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid var(--color-border); }
.sh-h .back { height: 28px; margin-inline-start: -4px; padding: 0 6px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.sh-h .back:hover { background: var(--color-accent); }
.sh-b { padding: 8px 12px; }
.mtabs { display: flex; gap: 4px; height: 32px; margin-bottom: 12px; }
.mtabs button { flex: 1; border-radius: 4px; font-size: 14px; font-weight: 500; color: color-mix(in srgb, var(--color-foreground) 60%, transparent); border: 1px solid transparent; }
.mtabs button:hover { color: var(--color-foreground); }
.mtabs button[aria-selected="true"] { background: var(--color-background); color: var(--color-foreground); box-shadow: 0 1px 2px rgb(0 0 0 / 5%); border-color: var(--color-border); }
.inv { display: flex; gap: 6px; }
.inv .fld { flex: 1; min-width: 0; height: 32px; display: flex; align-items: center; border: 1px solid var(--color-input); border-radius: 6px; background: var(--color-background); overflow: hidden; }
.inv .fld:focus-within { box-shadow: 0 0 0 1px var(--color-ring); }
.inv input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; padding: 0 10px; font-size: 14px; }
.inv .role { height: 100%; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--color-muted-foreground); }
.notify { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color-muted-foreground); }
.cbx { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--color-primary); display: grid; place-items: center; }
.cbx.on { background: var(--color-primary); color: var(--color-primary-foreground); }
.sl { margin: 12px 0 6px; font-size: 12px; font-weight: 500; color: var(--color-muted-foreground); }
.arow { width: 100%; min-height: 32px; display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; font-size: 14px; text-align: start; }
.arow:hover { background: color-mix(in srgb, var(--color-muted) 50%, transparent); }
.arow .grow { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow small { font-size: 12px; color: var(--color-muted-foreground); }
.arow .vi { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--color-muted); color: var(--color-muted-foreground); flex: none; }
.arow .av { width: 24px; height: 24px; font-size: 10px; font-weight: 600; background: var(--color-muted); color: var(--color-muted-foreground); }
.arow .chev { color: var(--color-muted-foreground); }
.opts { margin: 12px -12px 0; padding: 6px 6px 0; border-top: 1px solid var(--color-border); }
.optr { width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 6px; border-radius: 6px; font-size: 14px; }
.optr:hover { background: var(--color-accent); }
.optr > svg:first-child { color: var(--color-muted-foreground); }
.dest { width: 100%; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 6px; border-radius: 6px; font-size: 14px; }
.dest:hover { background: var(--color-accent); }
.dest svg { color: var(--color-muted-foreground); }
.socl { border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; }
.socl button { width: 100%; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 14px; border-top: 1px solid var(--color-border); }
.socl button:first-child { border-top: 0; }
.socl button:hover { background: color-mix(in srgb, var(--color-muted) 50%, transparent); }
.socl svg { color: var(--color-muted-foreground); }
.warnp { padding: 4px 0; display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--color-muted-foreground); }
.warnp b { font-size: 14px; font-weight: 500; color: var(--warning); }
.code { margin-top: 8px; padding: 8px; border-radius: 6px; background: var(--color-muted); font: 11px/16px var(--mono); word-break: break-all; color: var(--color-muted-foreground); }
.vp-tabs { display: flex; height: 40px; padding: 0 12px; gap: 4px; border-bottom: 1px solid var(--color-border); }
.vlist { padding: 12px; }
.vlist .lb { display: flex; justify-content: space-between; padding: 0 8px 4px; font-size: 12px; color: var(--color-muted-foreground); }
.vrow { min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; font-size: 12px; }
.vrow:hover { background: color-mix(in srgb, var(--color-muted) 60%, transparent); }
.vrow .av { width: 20px; height: 20px; font-size: 9px; }
.vrow .grow { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow .tn { color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 16px; }
.stat { border: 1px solid var(--color-border); border-radius: 8px; padding: 12px; }
.stat small { display: block; font-size: 12px; color: var(--color-muted-foreground); }
.stat b { font-size: 20px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bars { grid-column: 1 / -1; height: 96px; display: flex; align-items: flex-end; gap: 4px; padding: 8px 0 0; }
.bars i { flex: 1; border-radius: 3px 3px 0 0; background: color-mix(in srgb, var(--color-primary) 70%, transparent); }
.sres { width: 420px; padding: 4px; }
.sres button { width: 100%; display: flex; gap: 12px; align-items: flex-start; padding: 10px; border-radius: 6px; text-align: left; }
.sres button:hover { background: var(--color-accent); }
.sres .st { position: relative; width: 80px; height: 48px; border-radius: 2px; overflow: hidden; flex: none; }
.sres b { display: block; font-size: 14px; font-weight: 500; }
.sres small { font-size: 12px; color: var(--color-muted-foreground); }
.sres small mark { background: color-mix(in srgb, var(--color-highlight) 30%, transparent); color: var(--color-foreground); border-radius: 2px; padding: 0 2px; }
.sres .none { padding: 12px; font-size: 14px; color: var(--color-muted-foreground); }
.reactp { display: flex; gap: 2px; padding: 6px; }
.reactp button { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
.reactp button:hover { background: var(--color-accent); }
.overlay { position: fixed; inset: 0; z-index: 80; background: rgb(0 0 0 / 50%); display: grid; place-items: center; animation: swap .12s ease-out; }
.dlg { width: min(512px, calc(100% - 32px)); background: var(--color-background); border: 1px solid var(--color-border); border-radius: 8px; padding: 24px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 25%); }

let closePop = null;
function openPop(anchor, html, { width = 360, align = "end", onMount } = {}) {
  closePop?.(); closeMenu?.();
  const scrim = document.createElement("div"); scrim.className = "scrim";
  const p = document.createElement("div"); p.className = "pop"; p.style.width = width + "px";
  p.innerHTML = html;
  document.body.append(scrim, p);
  const r = anchor.getBoundingClientRect();
  const place = () => {
    const h = p.offsetHeight;
    p.style.left = Math.max(8, Math.min(innerWidth - width - 8, align === "end" ? r.right - width : align === "center" ? r.left + r.width / 2 - width / 2 : r.left)) + "px";
    p.style.top = (r.bottom + 4 + h > innerHeight - 8 ? Math.max(8, r.top - 4 - h) : r.bottom + 4) + "px";
  };
  place();
  anchor.setAttribute("aria-expanded", "true");
  const esc = (e) => e.key === "Escape" && close();
  const close = () => { scrim.remove(); p.remove(); anchor.setAttribute("aria-expanded", "false"); document.removeEventListener("keydown", esc); closePop = null; };
  scrim.onclick = close;
  document.addEventListener("keydown", esc);
  closePop = close;
  onMount?.(p, place);
  return p;
}
function dialog({ title, body, field, confirm, danger, onConfirm }) {
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="dlg" role="alertdialog" aria-label="${esc(title)}"><h2>${title}</h2>${body ? `<p>${body}</p>` : ""}${field ? `<input id="dlg-in" placeholder="${field}" aria-label="${field}">` : ""}<div class="ft"><button class="b out h9" data-x>Cancel</button><button class="b h9 ${danger ? "des" : "pri"}" data-ok>${confirm}</button></div></div>`;
  document.body.append(o);
  const close = () => { o.remove(); document.removeEventListener("keydown", k); };
  const k = (e) => { if (e.key === "Escape") close(); if (e.key === "Enter" && field) ok(); };
  const ok = () => { const v = $("#dlg-in", o)?.value; close(); onConfirm?.(v); };
  o.addEventListener("click", (e) => { if (e.target === o || e.target.closest("[data-x]")) close(); if (e.target.closest("[data-ok]")) ok(); });
  document.addEventListener("keydown", k);
  ($("#dlg-in", o) || $("[data-ok]", o)).focus();
}

  if (t.id === "import-btn") { openMenu(t, [{ t: "Upload video", icon: "upload", toast: "Choose a video to upload" }, { t: "Take screenshot", icon: "camera", toast: "Choose a screen to capture" }, { t: "Import Loom", icon: "link", run: () => dialog({ title: "Import Loom", field: "Paste a Loom or video link", confirm: "Import", onConfirm: () => toast("Importing Loom...") }) }], { align: "right", minWidth: 224 }); return; }
  if (t.id === "sort-btn") { openMenu(t, Object.entries(SORTS).map(([k, v]) => ({ t: v, k: S.sort === k ? ic("check", "s14") : "", run: () => { S.sort = k; render(); } })), { align: "right", minWidth: 176 }); document.querySelector('.menu[data-depth="0"]')?.classList.add("xs"); return; }
  if (t.id === "bulk-move") { openMenu(t, [{ label: `Move ${S.sel.size} selected` }, ...moveTargets(null, (f) => { S.sel.forEach((id) => (rec(id).folder = f)); toast(`${S.sel.size} clips moved`); S.sel.clear(); render(); })], { above: true, minWidth: 256 }); return; }
  if (t.id === "share-btn") { openShare(); return; }
  if (t.id === "clip-menu") { openMenu(t, clipMenu(r), { align: "right", minWidth: 256 }); return; }
  if (t.id === "views-btn") { openViewers(t, r); return; }
  if (t.id === "react-btn") { openReact(t, (emoji) => toast(`Reacted ${emoji}`)); return; }
  if (t.id === "speed-btn" || t.id === "dspeed") { openMenu(t, [{ label: "Speed" }, "-", ...[0.5, 0.8, 1, 1.2, 1.5, 1.7, 2, 2.5].map((s) => ({ t: s + "x", radio: true, on: S.speed === s, run: () => { S.speed = s; render(); } }))], { align: "right", above: t.id === "speed-btn" }); return; }
  if (t.id === "ag-opts") { openMenu(t, [{ t: "Open full view", toast: "Opens the agent page" }, { t: "Integrations", icon: "plug-connected", toast: "Opens integrations" }, "-", { t: "New chat", icon: "plus", run: () => { S.libThread = []; render(); } }, { t: "All chats", icon: "history", toast: "Shows all chats" }], { align: "right" }); return; }
  if (t.id === "ag-add") { openMenu(t, [{ t: "Schedule Task", toast: "Schedule Task" }, { t: "Create Automation", toast: "Create Automation" }, { t: "Integrations", toast: "Integrations" }, { t: "Create Skill", toast: "Create Skill" }], { above: true }); return; }
  if (t.id === "ag-model") { openMenu(t, ["Auto", "Claude", "GPT", "Gemini"].map((m) => ({ t: m, radio: true, on: m === "Auto" })), { above: true }); return; }
  switch (d.act) {
    case "collapse-sb": S.sbCollapsed = !S.sbCollapsed; render(); break;
    case "toggle-agent": S.agentOpen = !S.agentOpen; render(); break;
    case "feedback": dialog({ title: "Send feedback", field: "What should we improve?", confirm: "Send", onConfirm: () => toast("Thanks for the feedback") }); break;
    case "record": toast("Opens the recorder"); break;
    case "screenshot": toast("Choose a screen to capture"); break;
    case "loom": dialog({ title: "Import Loom", field: "Paste a Loom or video link", confirm: "Import", onConfirm: () => toast("Importing Loom...") }); break;
    case "select-all": { const l = listFor(S.route).filter((x) => x.owner === "alex"); const all = l.every((x) => S.sel.has(x.id)); l.forEach((x) => (all ? S.sel.delete(x.id) : S.sel.add(x.id))); render(); break; }
    case "clear-sel": S.sel.clear(); render(); break;
    case "bulk-archive": { const n = S.sel.size; S.sel.forEach((id) => (rec(id).archived = true)); S.sel.clear(); toast(`${n} clips archived`); render(); break; }
    case "bulk-trash": { const n = S.sel.size; S.sel.forEach((id) => (rec(id).trashed = true)); S.sel.clear(); toast(`${n} clips moved to trash`); render(); break; }
    case "play": togglePlay(); break;
    case "back5": S.ms = Math.max(0, S.ms - 5000); render(); break;
    case "fwd5": S.ms = Math.min(r.ms, S.ms + 5000); render(); break;
    case "mute": S.muted = !S.muted; render(); break;
    case "captions": S.captions = !S.captions; render(); break;
    case "pip": toast("Picture in picture"); break;
    case "theater": toast("Theater mode"); break;
    case "fullscreen": toast("Fullscreen"); break;
    case "collapse-panel": S.panelCollapsed = !S.panelCollapsed; render(); break;
    case "copy-link": S.copied = true; render(); toast("Link copied"); setTimeout(() => { S.copied = false; S.route === "clip" && render(); }, 1400); break;
    case "edit-title": S.editingTitle = true; render(); break;
    case "desc": S.descOpen = !S.descOpen; render(); break;
    case "send-comment": sendComment(); break;
    case "send-reply": sendReply(); break;
    case "copy-transcript": toast("Copied"); break;
    case "srt": toast("Downloading .srt"); break;
    case "regen-transcript": toast("Transcribing…"); break;
    case "add-cta": dialog({ title: "Call to action", field: "Button label", confirm: "Save", onConfirm: (v) => { S.cta = v || "Learn more"; render(); } }); break;
    case "ag-send": sendAgent(); break;
    case "new-chat": S.libThread = []; render(); break;
  }
});
document.addEventListener("contextmenu", (e) => {
  const c = e.target.closest("[data-open]");
  const lib = e.target.closest("#lib-main");
  const sp = e.target.closest("[data-space-menu]");
  if (sp) { e.preventDefault(); openMenu(sp, [{ t: "View", icon: "users-group", run: () => go("space:" + sp.dataset.spaceMenu) }, "-", { t: "Rename space", icon: "edit", toast: "Rename space" }, { t: "Delete space", icon: "trash", danger: true, toast: "Delete space" }], { at: { x: e.clientX, y: e.clientY } }); return; }
  if (c && rec(c.dataset.open).owner === "alex") { e.preventDefault(); openMenu(c, cardMenu(rec(c.dataset.open), { context: true }), { at: { x: e.clientX, y: e.clientY } }); return; }
  if (lib && S.route === "library") { e.preventDefault(); openMenu(lib, [{ t: "New folder", icon: "folder-plus", run: () => newFolder() }, { t: "Upload video", icon: "upload", toast: "Choose a video to upload" }, { t: "Import Loom", icon: "link", toast: "Importing Loom..." }], { at: { x: e.clientX, y: e.clientY } }); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "c-in") { $("#c-send").disabled = !t.value.trim(); }
  if (t.id === "tq") { S.tq = t.value; const pane = $("#pane"); pane.innerHTML = renderPane(rec(S.rid)); const i = $("#tq"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  if (t.id === "q") { S.q = t.value; openSearch(t); }
});
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t.id === "c-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendComment(); }
  if (t.id === "reply-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendReply(); }
  if (t.id === "reply-in" && e.key === "Escape") { S.replyTo = null; render(); }
  if (t.id === "ag-in" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendAgent(); }
  if (t.id === "tag-in" && e.key === "Enter" && t.value.trim()) { rec(S.rid).tags.push(t.value.trim().toLowerCase()); t.value = ""; render(); $("#tag-in").focus(); }
  if (t.id === "title-in" && (e.key === "Enter" || e.key === "Escape")) { if (e.key === "Enter" && t.value.trim()) { rec(S.rid).title = t.value.trim(); toast("Title updated"); } S.editingTitle = false; render(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "k") { const q = $("#q"); if (q) { e.preventDefault(); q.focus(); } }
  const typing = /INPUT|TEXTAREA/.test(t.tagName);
  if (!typing && S.route === "clip" && rec(S.rid).status !== "processing") {
    if (e.key === "k" || e.key === " ") { e.preventDefault(); togglePlay(); }
    if (e.key === "c") { S.captions = !S.captions; render(); }
  }
});
document.addEventListener("focusout", (e) => { if (e.target.id === "title-in" && S.editingTitle) { S.editingTitle = false; render(); } });
document.addEventListener("pointerdown", (e) => {
  const s = e.target.closest("#scrub");
  if (!s || e.target.closest("[data-seek]")) return;
  const tr = $(".track", s).getBoundingClientRect();
  S.ms = Math.round(Math.max(0, Math.min(1, (e.clientX - tr.left) / tr.width)) * rec(S.rid).ms);
  render();
});
function sendComment() {
  const v = $("#c-in")?.value.trim(); if (!v) return;
  (COMMENTS[S.rid] ??= []).push({ id: "c" + ++cid, who: "alex", at: Date.now(), ms: S.ms, text: v, parent: null });
  render(); const c = $(".cmts"); if (c) c.scrollTop = c.scrollHeight;
}
function sendReply() {
  const v = $("#reply-in")?.value.trim(); if (!v) return;
  const parent = COMMENTS[S.rid].find((c) => c.id === S.replyTo);
  COMMENTS[S.rid].push({ id: "c" + ++cid, who: "alex", at: Date.now(), ms: parent.ms, text: v, parent: parent.parent || parent.id });
  S.replyTo = null; render();
}
function sendAgent() {
  const v = $("#ag-in")?.value.trim(); if (!v) return;
  if (S.route === "clip") runAgent(clipThread(rec(S.rid)), v, rec(S.rid));
  else { if (S.libThread === "seed") S.libThread = [...LIB_SEED]; runAgent(S.libThread, v, null); }
}
function openReact(anchor, done) {
  const p = openPop(anchor, `<div class="reactp">${REACTION_EMOJIS.map(([e, n]) => `<button data-r="${e}" aria-label="React ${n}">${e}</button>`).join("")}</div>`, { width: 292, align: "center" });
  p.addEventListener("click", (e) => { const b = e.target.closest("[data-r]"); if (b) { closePop(); done(b.dataset.r); } });
}
function openViewers(anchor, r) {
  let tab = "views";
  const html = () => `<div class="vp-tabs" role="tablist"><button class="tab" style="padding:0 8px;margin:0" role="tab" aria-selected="${tab === "views"}" data-vt="views">Views</button><button class="tab" role="tab" aria-selected="${tab === "insights"}" data-vt="insights">Insights</button></div>
    ${tab === "views" ? `<div class="vlist"><div class="lb"><span>Human views</span><span>Completion</span></div>${VIEWERS.map((v) => `<div class="vrow">${av(v.who ? PEOPLE[v.who].name : "?", 20, 9)}<span class="grow">${v.who ? PEOPLE[v.who].name : "Anonymous"}</span><span class="tn">${v.pct}%</span></div>`).join("")}${r.agentViews ? `<div class="lb" style="margin-top:8px"><span>Agent views</span></div><div class="vrow"><span class="av" style="width:20px;height:20px">${ic("tool", "s12")}</span><span class="grow">Claude</span><span class="tn">${r.agentViews} views</span></div>` : ""}</div>`
      : `<div class="stats"><div class="stat"><small>Total video views</small><b>${r.views + r.agentViews}</b></div><div class="stat"><small>Average completion rate</small><b>64%</b></div><div class="bars" aria-label="Views over the last two weeks">${[3, 5, 2, 8, 12, 9, 4, 6, 10, 7, 5, 3, 6, 9].map((h) => `<i style="height:${h * 8}%"></i>`).join("")}</div></div>`}`;
  const p = openPop(anchor, html(), { width: 460 });
  p.addEventListener("click", (e) => { const b = e.target.closest("[data-vt]"); if (b) { tab = b.dataset.vt; p.innerHTML = html(); } });
}
function openSearch(input) {
  const q = S.q.trim().toLowerCase();
  if (!q) { closePop?.(); return; }
  const hits = ALL().filter((r) => !r.trashed && (titleOf(r).toLowerCase().includes(q) || segsFor(r).some((s) => s.text.toLowerCase().includes(q))));
  const body = hits.length ? hits.slice(0, 6).map((r) => { const seg = segsFor(r).find((s) => s.text.toLowerCase().includes(q)); const inTitle = titleOf(r).toLowerCase().includes(q); return `<button data-hit="${r.id}:${seg && !inTitle ? seg.ms : 0}"><span class="st">${screen(r)}</span><span style="min-width:0"><b>${esc(titleOf(r))}</b><small>${inTitle ? "Title" : `Match at ${clock(seg.ms)} in video`}</small></span></button>`; }).join("") : `<div class="none">No matches for “${esc(S.q)}”</div>`;
  if (closePop && $(".pop .sres")) { $(".pop .sres").innerHTML = body; return; }
  const p = openPop(input, `<div class="sres">${body}</div>`, { width: 420, align: "start" });
  $(".scrim").style.pointerEvents = "none";
  setTimeout(() => input.focus(), 0);
  p.addEventListener("click", (e) => { const b = e.target.closest("[data-hit]"); if (b) { const [id, ms] = b.dataset.hit.split(":"); go("clip", id, +ms); } });
  document.addEventListener("pointerdown", function off(ev) { if (!ev.target.closest(".pop, #q")) { closePop?.(); document.removeEventListener("pointerdown", off); } });
}

/* ───────── player clock ───────── */
function togglePlay() { S.playing = !S.playing; render(); }
setInterval(() => {
  if (!S.playing || S.route !== "clip") return;
  const r = rec(S.rid);
  S.ms = Math.min(r.ms, S.ms + 250 * S.speed);
  if (S.ms >= r.ms) { S.playing = false; render(); return; }
  const pct = (S.ms / r.ms) * 100 + "%";
  $("#fillb") && ($("#fillb").style.width = pct);
  $("#thumbk") && ($("#thumbk").style.left = pct);
  $("#ptime") && ($("#ptime").firstChild.textContent = clock(S.ms));
  const seg = segsFor(r).filter((s) => s.ms <= S.ms).pop();
  if ($("#cap") && seg) $("#cap").textContent = seg.text;
  const list = $("#tr-list");
  if (list && seg && !S.tq) {
    list.classList.add("has-active");
    list.querySelectorAll(".tseg").forEach((b) => b.classList.toggle("on", +b.dataset.tseg === seg.ms));
  }
}, 250);

/* ───────── review strip ───────── */
$("#theme-btn").onclick = () => { const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); const nx = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = nx; try { localStorage.setItem("clips-theme", nx); } catch {} };
$("#scenario").onchange = (e) => { S.scenario = e.target.value; if (S.scenario === "fresh") { FRESH.status = "processing"; FRESH.title = ""; FRESH.desc = ""; } go("library"); };
kitChangesInit($("#changes-btn"));
kitSettingsInit({ app: "Clips", mcpName: "clips", mcpUrl: "https://clips.agent-native.com/mcp", initial: "A" });
render();
</script>
