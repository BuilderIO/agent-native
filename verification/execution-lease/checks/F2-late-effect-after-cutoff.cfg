\* A late handler may finish after the recovery cutoff. Keep its never-replay
\* receipt while pruning the expired lease so a same-turn continuation is safe.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2, r3}
  NoRun = NoRun
  PolicyChoices = {"never"}
  Mutation = "none"
  WithPrune = TRUE
  PruneWhileTurnActive = FALSE
SYMMETRY Perms
INVARIANTS P8
CHECK_DEADLOCK FALSE
