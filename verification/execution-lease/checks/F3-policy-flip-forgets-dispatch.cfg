\* Regression check for F3: a retry-safe re-adoption preserves dispatch
\* history so a later never-replay intent cannot run the effect again.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2, r3}
  NoRun = NoRun
  PolicyChoices = {"never", "retry-safe", "read-only"}
  Mutation = "none"
  WithPrune = TRUE
  PruneWhileTurnActive = FALSE
  AssumeNoTurnIdReuseAfterRetention = TRUE
SYMMETRY Perms
INVARIANTS P8Strict
CHECK_DEADLOCK FALSE
