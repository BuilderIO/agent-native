\* Finding F3 (NOTES.md): when a deploy changes an action's replay policy
\* between runs of one turn, re-adopting a dispatched retry-safe step resets it
\* to 'prepared' (RS:795-809), so a later never-replay run cannot tell the
\* effect already happened and runs it again. Expected to violate P8Strict
\* until begin treats a row with dispatched_at set as dispatched.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2, r3}
  NoRun = NoRun
  PolicyChoices = {"never", "retry-safe", "read-only"}
  Mutation = "none"
  WithPrune = TRUE
  PruneWhileTurnActive = FALSE
SYMMETRY Perms
INVARIANTS P8Strict
CHECK_DEADLOCK FALSE
