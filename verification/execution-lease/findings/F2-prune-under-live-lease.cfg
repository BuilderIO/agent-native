\* Finding F2 (NOTES.md): the retention prune deletes agent_execution_steps
\* and agent_execution_leases without checking whether work on the turn can
\* still happen (RS:5166-5188): a worker that outlives retention, a
\* continuation that reuses the turn id after the prune, or a retention
\* setting near 0. Expected to violate P8 until the prune checks the lease and
\* retention has a floor.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2, r3}
  NoRun = NoRun
  PolicyChoices = {"never"}
  Mutation = "none"
  WithPrune = TRUE
  PruneWhileTurnActive = TRUE
SYMMETRY Perms
INVARIANTS P8
CHECK_DEADLOCK FALSE
