\* Deploy flip: each run's intent.replayPolicy is chosen independently, so a
\* successor's policy may differ from the stored row's replay_policy
\* (RS:774-784 compare them).
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2, r3}
  NoRun = NoRun
  PolicyChoices = {"never", "retry-safe", "read-only"}
  Mutation = "none"
  WithPrune = TRUE
  PruneWhileTurnActive = FALSE
SYMMETRY Perms
INVARIANTS TypeOK P8 P1 P6 ClaimRespectsLiveOwner
CHECK_DEADLOCK FALSE
