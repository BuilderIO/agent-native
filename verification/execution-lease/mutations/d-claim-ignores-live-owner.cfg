\* Broken variant d: claimExecutionLease takes a live lease from a running
\* owner (drops TurnExecutionLeaseBusyError, RS:484-499). Must violate
\* ClaimRespectsLiveOwner.
SPECIFICATION Spec
CONSTANTS
  Runs = {r1, r2, r3}
  NoRun = NoRun
  PolicyChoices = {"never"}
  Mutation = "d"
  WithPrune = TRUE
  PruneWhileTurnActive = FALSE
  AssumeNoTurnIdReuseAfterRetention = TRUE
SYMMETRY Perms
INVARIANTS ClaimRespectsLiveOwner
CHECK_DEADLOCK FALSE
