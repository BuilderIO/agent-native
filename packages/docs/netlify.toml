[build]
command = "export DATABASE_URL=${NETLIFY_DATABASE_URL:-$DATABASE_URL} && pnpm install && NITRO_PRESET=netlify pnpm --filter @agent-native/docs build && if { [ \"${CONTEXT:-}\" = \"production\" ] || [ \"${AGENT_NATIVE_RUN_RELEASE_MIGRATIONS:-}\" = \"1\" ]; } && [ \"${AGENT_NATIVE_PREBUILT_SKIP_RELEASE_MIGRATIONS:-}\" != \"1\" ]; then pnpm --filter @agent-native/docs migrate:production; fi"
publish = "packages/docs/dist"
edge_functions = "packages/docs/netlify/edge-functions"


[[redirects]]
from = "/examples/self-hosted-chat/Dockerfile"
to = "/examples/self-hosted-chat/Dockerfile.txt"
status = 200
force = true

[[redirects]]
from = "/templates"
to = "/apps/"
status = 301
force = true

[[redirects]]
from = "/templates/"
to = "/apps/"
status = 301
force = true

[[redirects]]
from = "/templates/*"
to = "/apps/:splat"
status = 301
force = true

[[redirects]]
from = "/:locale/templates"
to = "/:locale/apps/"
status = 301
force = true

[[redirects]]
from = "/:locale/templates/"
to = "/:locale/apps/"
status = 301
force = true

[[redirects]]
from = "/:locale/templates/*"
to = "/:locale/apps/:splat"
status = 301
force = true

[[redirects]]
from = "/docs/getting-started"
to = "/docs/"
status = 301
force = true

[[redirects]]
from = "/:locale/docs/getting-started"
to = "/:locale/docs/"
status = 301
force = true

[[redirects]]
from = "/docs/resources"
to = "/docs/agent-resources/"
status = 301
force = true

[[redirects]]
from = "/docs/workspace"
to = "/docs/agent-resources/"
status = 301
force = true

[[redirects]]
from = "/:locale/docs/workspace"
to = "/:locale/docs/agent-resources/"
status = 301
force = true

[[redirects]]
from = "/docs/:locale/workspace"
to = "/:locale/docs/agent-resources/"
status = 301
force = true

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
NITRO_PRESET = "netlify"
AGENT_NATIVE_WORKSPACE_APP_AUDIENCE = "public"
VITE_AGENT_NATIVE_WORKSPACE_APP_AUDIENCE = "public"
[context.production.environment]
# request functions do not spend their cold-start budget on migration probes.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"
AGENT_NATIVE_ENABLE_KEEP_WARM = "1"
AGENT_NATIVE_DISABLE_KEEP_WARM_BACKGROUND = "1"
