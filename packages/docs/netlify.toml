[build]
command = "export DATABASE_URL=${NETLIFY_DATABASE_URL:-$DATABASE_URL} && pnpm install && NITRO_PRESET=netlify pnpm --filter @agent-native/docs build && if [ \"${CONTEXT:-}\" = \"production\" ]; then pnpm --filter @agent-native/docs migrate:production; fi"
publish = "packages/docs/dist"

# React Router prerendered pages are served from Netlify's static backing
# store, so they bypass the framework SSR handler that normally emits these
# headers. Keep the public shell fast in browsers and aggressively cached at
# the CDN while still allowing deploy invalidation to publish new content.
[[headers]]
for = "/*"
  [headers.values]
  Cache-Control = "public, max-age=600, stale-while-revalidate=604800, stale-if-error=3600"
  CDN-Cache-Control = "public, max-age=600, stale-while-revalidate=604800, stale-if-error=3600"
  Netlify-CDN-Cache-Control = "public, s-maxage=31536000, stale-while-revalidate=604800, stale-if-error=3600"

# Vite's production assets are content-addressed and can stay cached for a
# year. This also preserves the static-site equivalent of core's asset rule.
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
  CDN-Cache-Control = "public, max-age=31536000, immutable"
  Netlify-CDN-Cache-Control = "public, max-age=31536000, immutable"

# Keep any static internal framework artifacts out of browser caches.
[[headers]]
for = "/_agent-native/*"
  [headers.values]
  Cache-Control = "no-cache, no-store"

# Netlify's static asset handling sends extensionless Dockerfile requests to
# the SSR fallback. Rewrite the documented endpoint to the served text asset
# while keeping the browser/download filename compatible with Compose.
[[redirects]]
from = "/examples/self-hosted-chat/Dockerfile"
to = "/examples/self-hosted-chat/Dockerfile.txt"
status = 200
force = true

# Keep legacy template links at the CDN edge instead of running the SSR
# redirect loader for every request.
[[redirects]]
from = "/templates"
to = "/apps"
status = 301
force = true

[[redirects]]
from = "/templates/"
to = "/apps/"
status = 301
force = true

[[redirects]]
from = "/templates/*"
to = "/apps/:splat"
status = 301
force = true

[[redirects]]
from = "/:locale/templates"
to = "/:locale/apps"
status = 301
force = true

[[redirects]]
from = "/:locale/templates/"
to = "/:locale/apps/"
status = 301
force = true

[[redirects]]
from = "/:locale/templates/*"
to = "/:locale/apps/:splat"
status = 301
force = true

# Slug redirects for renamed docs — keep in sync with SLUG_REDIRECTS in app/routes/docs.$slug.tsx.
[[redirects]]
from = "/docs/resources"
to = "/docs/agent-resources"
status = 301
force = true

[[redirects]]
from = "/docs/workspace"
to = "/docs/agent-resources"
status = 301
force = true

[[redirects]]
from = "/:locale/docs/workspace"
to = "/:locale/docs/agent-resources"
status = 301
force = true

[[redirects]]
from = "/docs/:locale/workspace"
to = "/:locale/docs/agent-resources"
status = 301
force = true

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
GTM_CONTAINER_ID = "GTM-N3WSTXZ"
NITRO_PRESET = "netlify"
AGENT_NATIVE_WORKSPACE_APP_AUDIENCE = "public"
VITE_AGENT_NATIVE_WORKSPACE_APP_AUDIENCE = "public"

[context.production.environment]
# The docs app owns the framework schema at release time, so production
# request functions do not spend their cold-start budget on migration probes.
AGENT_NATIVE_RELEASE_MIGRATIONS = "1"
