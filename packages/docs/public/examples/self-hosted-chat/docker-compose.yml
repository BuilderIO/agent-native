services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://agent_native@postgres:5432/agent_native
      BETTER_AUTH_SECRET: local-development-secret-change-me-1234567890
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: agent_native
      POSTGRES_USER: agent_native
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_native -d agent_native"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data-v18:
