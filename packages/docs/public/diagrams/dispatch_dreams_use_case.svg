<svg width="680" height="302" viewBox="0 0 680 302" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img">
<title>A concrete use case in Dispatch's Dreams view</title>
<desc>Opening Dreams updates shared state with candidates and proposals. Asking who's pending doesn't require naming the page — the agent already has the state and answers directly. Legend: gray = you, purple = system, teal = agent.</desc>

<rect x="0" y="0" width="680" height="302" fill="#ffffff"/>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Legend -->
<rect x="214" y="20" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="234" y="27" font-size="12" fill="#444441" dominant-baseline="central">You</text>

<rect x="298" y="20" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="318" y="27" font-size="12" fill="#3C3489" dominant-baseline="central">System</text>

<rect x="406" y="20" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="426" y="27" font-size="12" fill="#085041" dominant-baseline="central">Agent</text>

<!-- Arrows -->
<line x1="190" y1="108" x2="210" y2="108" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="430" y1="108" x2="450" y2="108" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M545 136 L545 176 L160 176 L160 206" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="280" y1="234" x2="300" y2="234" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Row 1 -->
<g>
<rect x="40" y="80" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="108" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">Open Dreams</text>
</g>

<g>
<rect x="210" y="80" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="320" y="98" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">State updates</text>
<text x="320" y="116" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Candidates + proposals</text>
</g>

<g>
<rect x="450" y="80" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="545" y="108" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">"Who's pending?"</text>
</g>

<!-- Row 2 -->
<g>
<rect x="40" y="206" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="160" y="224" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Agent reads state</text>
<text x="160" y="242" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">No need to name the page</text>
</g>

<g>
<rect x="300" y="206" width="310" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="455" y="224" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Answers directly</text>
<text x="455" y="242" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Lists which proposals are pending</text>
</g>
</svg>
