template: v2
slug: ai-kpi-dashboard
app: analytics
title: Build a KPI dashboard for your startup
seo_title: AI KPI dashboard for startup founders
meta_description: Describe the metrics you track, and Agent-Native Analytics builds your startup's KPI dashboard from Stripe, HubSpot and product data, then tells you what moved.
updated: 2026-10-27
hero:
  body: Agent-Native Analytics puts your MRR, churn and signups in one dashboard, built from Stripe, HubSpot and product data. Describe what you track, and the agent builds it and says why any number moved.
  button:
    label: Build your dashboard
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb23d4e197c9841e7b0eeaefc15090443
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F260764ee953f4b4f80f6a6cf631b2143
    alt: A startup's KPI dashboard in Analytics, with MRR, churn, new signups and activation cards above monthly MRR and signup charts. The agent sidebar answers which plan drove MRR growth this quarter, with a table by plan.
how_to:
  heading: How to build a KPI dashboard with AI
  steps:
    - title: Connect your revenue and product data
      body: On the **Data Sources** page, paste your Stripe secret key, then add HubSpot and the product analytics tool you use. Choose **Test connection** from a source's menu to check that Analytics can read it.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ea7e1568d3b4afd9fc6a2a01bc969b0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F78b97b8d077644f28c627377157f1331
        alt: Close-up of Stripe on the Data Sources page, marked Connected, with its secret key configured and "Connection successful" after testing the connection.
    - title: Describe the dashboard you want
      body: Click **New Dashboard** and describe the [SaaS metrics you track](https://www.agent-native.com/articles/what-should-a-saas-metrics-dashboard-include/), for example "MRR and churn from Stripe, new signups and activation from PostHog, month by month". The agent may ask questions first, then builds each panel and opens the dashboard.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fca8b7f3746ca419383e042cc0c142271
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb167e98f0ac049fa8ad4b169e8f77ec9
        alt: Close-up of the New dashboard box opened from the sidebar's Dashboards list, with a description of a startup KPI dashboard typed in.
    - title: Ask why a number moved
      body: Choose **Chat with panel** from a chart's menu and ask a question, such as "Why did churn go up in September?". The agent answers from your connected data, and adds a panel to the dashboard when you ask it to.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9b18fbf5a7cd4b4ba65d9efede75538b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9edee9cd613741e2ba670e414be767c7
        alt: "The churn by month panel with the agent chat beside it. Asked why churn went up in September, the agent breaks the rise down by plan: Starter churn nearly doubled."
features:
  heading: Everything you need to track your startup's KPIs
  items:
    - title: Revenue, pipeline and usage together
      body: MRR from Stripe, deals from HubSpot and signups from PostHog or Mixpanel sit side by side in one dashboard.
    - title: Edit by hand or ask
      body: Change a filter yourself or ask the agent for a new panel. Both land on the same dashboard, and its history restores any earlier version.
    - title: The query behind each number
      body: Click any point on a chart to see the records behind it, the SQL that found them, and a CSV download.
    - title: Your definition of MRR
      body: Write down how your company counts MRR or an active user on the **Semantic Layer** page. The agent checks it before writing a query.
    - title: Private until you share it
      body: A new dashboard is yours alone. Share it with a co-founder or your whole company when it's ready, to view or to edit.
    - title: Your KPIs by email
      body: "The numbers come to you: get the dashboard as an email every morning, at the time you choose, for up to five people."
