faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Analytics free?
      a: Yes, Agent-Native Analytics is free and open source. The agent runs on Builder.io AI credits or your own model key, and each data source needs its own credentials, such as a Stripe secret key. Analytics is in alpha, so screens and features may still change.
    - q: Which tools can Analytics pull my KPIs from?
      a: Analytics connects to Stripe, HubSpot, PostHog, Mixpanel, Amplitude, Google Analytics (GA4), BigQuery and more than a dozen other sources. You add each one on the [Data Sources page](https://www.agent-native.com/docs/template-analytics-connectors/) with its own key, and one dashboard can mix several sources.
    - q: Do I need to know SQL to build a KPI dashboard?
      a: No. You describe the dashboard or ask a question in plain English, and the agent writes the SQL. The query stays visible behind every chart, so someone who knows your data can check it or edit it.
    - q: How do I know the numbers are right?
      a: Every number on the dashboard comes from a query the agent ran on your connected data, and you can open the query and the records behind any chart. When the agent couldn't run a query, it marks the figure "Unverified". Check a few numbers against Stripe before you rely on the dashboard.
    - q: Who can see my KPI dashboard?
      a: Only you, until you share it. You can [share a dashboard](https://www.agent-native.com/docs/sharing/) with a teammate or your whole organization as a viewer, editor or admin. Filters you change apply only to you; save a view or send the link to share them.
    - q: How is Analytics different from the AI in my analytics tool?
      a: "An AI assistant inside one analytics tool works with that tool's data. Analytics works across Stripe, your CRM and your product data, and its agent builds and edits the dashboard you look at, so its answers become panels you keep. That's what makes Analytics an [agentic app](https://www.agent-native.com/articles/what-is-an-agent-native-app/): the brains of an agent, the intuitiveness of an app."
