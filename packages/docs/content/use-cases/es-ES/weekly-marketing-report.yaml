title: Haz tu informe semanal sin hojas de cálculo
seo_title: Informe semanal de marketing con GA4 y HubSpot
meta_description: Crea tu informe semanal de marketing con Google Analytics y HubSpot en Agent-Native Analytics. Pregunta cómo fue la semana y comparte las respuestas en un panel.
updated: 2026-10-27
hero:
  body: Agent-Native Analytics convierte tus datos de Google Analytics y HubSpot en tu informe de marketing del lunes. Pregunta cómo fue la semana y el agente guarda cada respuesta en un panel que no rehaces.
  button:
    label: Crea tu panel
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8b9582619b1b42e4a44e6246e01ff7f8
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F70d3b80ce73f472c95b94f7f5c0d65d6
    alt: Un panel semanal de marketing abierto en Analytics. Las tarjetas de métricas de arriba muestran las sesiones de esta semana, los registros orgánicos, los nuevos contactos de HubSpot y las oportunidades creadas, cada una con el cambio respecto a la semana anterior. Debajo, un gráfico de barras compara las sesiones por canal de esta semana y la anterior, y un gráfico de líneas muestra las oportunidades de HubSpot creadas por día. El chat del agente, a la derecha, contiene la pregunta «How did the week go?» y una respuesta breve que señala la búsqueda orgánica como la mayor subida.
how_to:
  heading: Cómo hacer un informe semanal de marketing con IA
  steps:
    - title: Conecta tus datos de marketing
      body: Abre **Fuentes de datos**, sigue los [pasos de configuración](https://www.agent-native.com/docs/template-analytics-connectors/) de las tarjetas de Google Analytics y HubSpot, y haz clic en **Probar conexión**. Google Analytics necesita una cuenta de servicio de Google Cloud con acceso de lector a tu propiedad, una configuración única.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0218d6c271db4bbe8534c00e6f5e85a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa38de1d80c2e4f7fb8e1407d95f97984
        alt: Primer plano de la página Data Sources con Google Analytics y HubSpot como conectados. El panel de configuración de HubSpot está abierto al lado, con su token configurado y Test connection mostrando Connection successful.
    - title: Pregunta cómo fue la semana
      body: "Pregunta lo que preguntarías a un analista. Por ejemplo: «¿Cómo han ido los registros de búsqueda orgánica esta semana frente a la anterior?». El agente lanza una consulta en vivo y responde con un gráfico."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fcd7a4f648f5b4dee8a6282c3f512f698
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F74bf8b013f944b96a414979ff7234deb
        alt: El chat del agente con esa pregunta y su respuesta. Dos frases dicen que los registros orgánicos subieron respecto a la semana anterior, sobre un gráfico de barras de registros por canal de esta semana y la anterior.
    - title: Guarda y comparte tu panel
      body: Pide al agente que lo «convierta en mi panel semanal de marketing». Haz clic en **Compartir** para dar a un compañero o a toda tu organización [acceso para ver o editar](https://www.agent-native.com/docs/sharing/), o abre **Informes por correo** para enviarlo a diario a la hora que elijas.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F04feeeb2a1384ce0adecb7bee676b806
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F61fd64ac2bff4f53a3ca6cfbd97225fe
        alt: "El panel semanal de marketing con el diálogo Email reports abierto: envío por Email y Slack, dos direcciones del equipo, hora de envío a las 9:00 y un botón Send now."
features:
  heading: Todo lo que necesitas para informar de tu semana de marketing
  items:
    - title: Las dos herramientas en una pregunta
      body: Pregunta por las sesiones de Google Analytics y los contactos de HubSpot a la vez, y el agente responde con ambos lado a lado.
    - title: Posiciones junto al tráfico
      body: Conecta DataForSEO y pregunta cómo se han movido tus palabras clave junto a las sesiones orgánicas de la semana.
    - title: Cifras siempre al día
      body: "Los gráficos de Google Analytics consultan en vivo y los de HubSpot se actualizan solos: el informe siempre muestra la última semana."
    - title: Repite el análisis de la semana pasada
      body: Guarda una investigación con su pregunta y sus pasos, y pide al agente que la repita con los datos de esta semana.
    - title: Las definiciones de tu equipo
      body: Tus administradores definen qué cuenta como lead o como registro en la página Capa semántica, y el agente usa esas definiciones en cada respuesta.
    - title: Pregunta por cualquier gráfico
      body: Haz clic en un gráfico y pregunta qué ha cambiado. El agente recibe ese gráfico con tu pregunta y responde con los datos que hay detrás.
