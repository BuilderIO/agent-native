faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Analytics es gratis?
      a: Sí, Agent-Native Analytics es gratuito y de código abierto. Conectas tus propias cuentas de Google Analytics y HubSpot. Para empezar, eliges créditos de IA gratuitos de Builder.io o tu propia clave de modelo de IA para el agente, así que el uso de IA tiene límites. Analytics está en alfa, así que espera cambios.
    - q: ¿Qué fuentes de datos de marketing puedo conectar?
      a: Agent-Native Analytics se conecta a Google Analytics (GA4), HubSpot, DataForSEO para posiciones de palabras clave y volumen de búsqueda, y X para la interacción con tus posts. También se conecta a BigQuery, Amplitude, Mixpanel, PostHog y Stripe. Cada fuente necesita sus propias credenciales, y Google Analytics necesita una cuenta de servicio de Google Cloud.
    - q: ¿Agent-Native Analytics puede enviar el informe cada lunes?
      a: Todavía no con una programación semanal. Los [informes por correo de los paneles](https://www.agent-native.com/docs/template-analytics-dashboards/) se envían a diario, a la hora y en la zona horaria que elijas, a hasta cinco direcciones de correo, a un canal de Slack o a ambos. Antes de tu reunión del lunes, haz clic en **Enviar ahora** en **Informes por correo** para enviar el panel más reciente.
    - q: ¿Necesito saber SQL?
      a: No. Preguntas con tus palabras y el agente elige la fuente y escribe la consulta. Puedes pedirle al agente que te muestre la consulta de cualquier respuesta si quieres revisarla.
    - q: ¿Puedo fiarme de las cifras?
      a: El agente lanza una consulta en vivo sobre tus datos antes de darte una cifra, y marca como «Sin verificar» cualquier cifra sin consulta detrás. Aun así, compara el informe de la primera semana con Google Analytics y HubSpot antes de enviárselo al equipo.
    - q: ¿En qué se diferencia Agent-Native Analytics de los informes de GA4 y HubSpot?
      a: "Google Analytics y HubSpot informan cada uno de sus propios datos. Agent-Native Analytics responde a una misma pregunta con los dos, con tus palabras, y guarda las respuestas en un solo panel que puedes ir afinando con preguntas. Eso es una [aplicación agéntica](https://www.agent-native.com/articles/what-is-an-agent-native-app/): la inteligencia de un agente, la intuición de una aplicación."
