hero:
  body: Agent-Native Content pasa tus notas a una especificación que tú, tu equipo y tu agente de código usáis en una página. Claude Code, Codex o Cursor leen la página en vivo y proponen cambios que aceptas.
  button:
    label: Escribe una especificación
    url: https://content.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd7f1bf8fa6054abcafa30bd60751ae40
