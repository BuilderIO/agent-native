faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Content es gratis?
      a: Sí, Agent-Native Content es gratuito y de código abierto. Tu agente de código lee y edita la especificación con su propio modelo, así que cuenta para el uso de tu agente. El agente integrado de Content funciona con créditos de Builder.io o con tu propia clave de modelo. Content está en alfa, así que espera cambios.
    - q: ¿Qué agentes de código pueden leer mi especificación?
      a: Claude Code y Codex abren la página desde **Compartir** y te piden conectarte una vez. Cursor y GitHub Copilot en VS Code añaden Content desde ahí con un clic. Claude Cowork, Goose y OpenCode se conectan desde tu terminal, y cualquier cliente MCP con inicio de sesión puede [conectarse a Content con su URL](https://www.agent-native.com/docs/external-agents/#private-content-links). Cada agente ve solo lo que puede ver tu cuenta.
    - q: ¿En qué se diferencia de un archivo de especificación en mi repositorio?
      a: Un archivo de especificación en tu repositorio es una copia que suele editar solo quien trabaja en el código. En Content, tu equipo escribe y comenta en la misma página que lee tu agente de código, y los cambios del agente llegan como sugerencias. Si también quieres Markdown en el repositorio, Content [se sincroniza con una carpeta local](https://www.agent-native.com/docs/template-content-sync/).
    - q: ¿Mi agente de código puede cambiar la especificación?
      a: Sí, con el acceso que tenga tu cuenta. Pídele que sugiera ediciones, y la página no cambia hasta que aceptes cada una. También puede editar la página directamente, pero si la página ha cambiado desde que el agente la leyó, Content rechaza la edición. El [historial de versiones](https://www.agent-native.com/docs/template-content-editing/) guarda las versiones anteriores.
    - q: ¿Puedo guardar mis especificaciones en mi repositorio?
      a: Sí. Conecta una [carpeta local de Markdown o MDX](https://www.agent-native.com/docs/template-content-local-files/) en Content y trae, revisa o sube cambios, o inicia Content desde tu repositorio con un solo comando. Los conflictos se muestran para que los revises. El navegador no puede leer archivos locales por sí solo, así que necesitas una app local de Content o Agent-Native Desktop.
