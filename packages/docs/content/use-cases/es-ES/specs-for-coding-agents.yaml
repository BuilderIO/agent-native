how_to:
  heading: Cómo escribir una especificación para tu agente de código
  steps:
    - title: Escribe la especificación con el agente
      body: Haz clic en **+** en la barra lateral, elige **Página** y pega tus notas, o pide al [agente integrado de Content](https://www.agent-native.com/docs/template-content/) que «redacte un PRD para una nueva funcionalidad» a partir de ellas. Edítala a mano, o selecciona una sección y pide que la reescriba.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2f4dd334ddfa4ec5bd74e67315414e8b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F15247dff32574395a608e454b510e22b
        alt: En el chat, se pide al agente una especificación de invitaciones de equipo a partir de unas notas de reunión. La respuesta del agente enumera las secciones que ha escrito, junto a la página nueva.
    - title: Ábrela en tu agente de código
      body: En **Compartir**, abre **Agentes** y elige **Abrir en Claude Code** o **Abrir en Codex**. Tu agente lee la página, o antes te pide que conectes Content. Para Cursor o VS Code, añade Content, haz clic en **Copiar instrucciones para el agente** y pégalas.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa052d84a44fb4e6ead8b69535f25c726
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fc574e414836749119ad937c14623d14e
        alt: "Primer plano de la pestaña Agents del menú Share: Copy agent prompt, Open in Claude, Open in Claude Code y Open in Codex. Debajo, Connect Content ofrece Add to Cursor, Add to VS Code y Other agents."
    - title: Mantén la especificación al día
      body: Cuando el desarrollo resuelva una pregunta abierta, pide a tu agente de código que proponga el cambio en la página. Cada sugerencia muestra el motivo del agente. Haz clic en el check para aceptarla o en la X para rechazarla.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F156092664ebc424bb86899f876b88a97
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0c0108d3427d4641b5c3a2b266e8c4aa
        alt: Primer plano de la sección Open questions de la especificación con una edición sugerida por el agente de código, marcada como Agent, con su motivo y los botones Accept (check) y Reject (X).
features:
  heading: Todo lo que necesitas para escribir especificaciones para tu agente
  items:
    - title: Opiniones en comentarios
      body: Pide al agente que revise tu especificación y dejará comentarios en los puntos débiles en lugar de reescribir tu texto.
    - title: Una página por funcionalidad
      body: Anida investigación, notas de la API y decisiones pasadas bajo cada especificación, y busca por título o texto para encontrarlas.
    - title: Un tablero de especificaciones
      body: Guarda tus especificaciones en una colección con campos de responsable y estado, como tabla o tablero, con la página completa en cada fila.
    - title: Notas para tu agente
      body: Indica en la descripción de la página qué secciones están cerradas, y cualquier agente que lea la especificación lo leerá también.
    - title: Lee lo que no has guardado
      body: Tu agente de código ve las ediciones aún abiertas en tu editor, así que siempre trabaja con la página tal y como está ahora.
    - title: Revísala con tu equipo
      body: Comenta cualquier fragmento, menciona a un compañero con @ y responde en hilos. El historial de versiones restaura una versión anterior.
