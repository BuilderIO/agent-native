template: v2
slug: ai-dictation
app: clips
title: Dictado con IA
seo_title: Dictado con IA para agentes de código, Slack y documentos
meta_description: Dicta prompts largos en Claude Code, Slack o un documento en vez de escribirlos. Agent-Native Clips es un dictado con IA gratuito y de código abierto que guarda cada dictado.
updated: 2026-10-26
hero:
  body: Di el prompt entero en vez de escribirlo y aparece en tu cursor, de Claude Code a Slack. Agent-Native Clips guarda cada dictado, y su agente lo reelabora cuando se lo pides.
  button:
    label: Empieza a dictar
    url: https://clips.agent-native.com
  image:
