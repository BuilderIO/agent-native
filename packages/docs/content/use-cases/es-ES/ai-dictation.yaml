how_to:
  heading: Cómo usar el dictado con IA
  steps:
    - title: Dicta en cualquier aplicación
      body: Instala Clips Desktop, haz clic en Claude Code, Linear o Slack y mantén pulsado tu atajo (Fn por defecto, o el que elijas en Ajustes) mientras hablas. Suéltalo y Clips pone tus palabras en el cursor.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F493f3728ed1246bb841a651e3aa76300
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb3785ba8ec804690836d94e31ff92e17
        alt: "El chat de un agente de código: se envió un prompt dictado sobre reintentos de webhooks y el agente hizo el cambio. El cursor espera en el cuadro de mensaje mientras la píldora de Clips de debajo escucha el siguiente prompt, con su onda verde en movimiento."
    - title: Enseña a Clips tus palabras
      body: Abre Diccionario en la página Dictar y añade el nombre de tu producto, tus librerías y tus compañeros, o «término → reemplazo» para una palabra que Clips entiende mal. Importa un archivo CSV para añadir una lista entera de golpe.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F855c88996488417e8dc3a532a0fd21a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff4e9c0557a1344f6a55e7e9c4356a5ab
        alt: El panel Diccionario de Clips, con Añadir términos, Importar y Exportar CSV. Debajo hay términos como Agent-Native, "web hooks → webhooks" y "kube control → kubectl".
    - title: Encuentra un dictado anterior
      body: Pulsa Cmd+K en Clips y escribe una palabra que dijiste, y aparecen los dictados que coinciden con la aplicación en la que los dijiste. Elige uno para abrirlo en la página Dictar.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5e344071b49f4e51ae5eef2708c46605
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F13f558e09094404f975350ad0c359acc
        alt: 'El menú de búsqueda de Clips con "webhook" escrito, que lista dos dictados anteriores bajo Dictar: un prompt dictado en Cursor y un mensaje dictado en Slack.'
features:
  heading: Todo lo que necesitas para dictar en vez de escribir
  items:
    - title: Tu portapapeles no se toca
      body: Clips pega en las aplicaciones y te devuelve el portapapeles, así que el enlace que habías copiado sigue ahí. En las terminales, escribe en lugar de pegar.
    - title: Limpieza con IA que puedes deshacer
      body: "Clips corrige palabras mal entendidas, comas y mayúsculas, y elimina los titubeos: automáticamente con un motor en la nube, o con un clic. El original se conserva."
    - title: Aprende de tus correcciones
      body: Corrige una palabra mal entendida justo después de que Clips la pegue, y la aplicación de escritorio añade esa corrección a tu Diccionario, para que el siguiente dictado la acierte.
    - title: Manos libres para prompts largos
      body: Pulsa tu atajo dos veces para seguir escuchando mientras piensas en voz alta, y una vez más para parar. Pulsa Esc para descartar un dictado.
    - title: Pégalo otra vez
      body: Pulsa Cmd+Ctrl+V para volver a pegar tu último dictado en otro campo de texto, útil cuando el cursor estaba en el sitio equivocado.
    - title: Pregunta al agente sobre él
      body: Pregunta «¿Qué dije sobre el presupuesto del tercer trimestre?» o «Convierte ese discurso en viñetas», y el agente trabaja con tu historial.
