faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Clips es gratis?
      a: Sí. Agent-Native Clips es gratuito y de código abierto, y el dictado por voz viene activado por defecto en la aplicación de escritorio. La limpieza con IA funciona con créditos de IA de Builder.io o con tu propia clave, así que no es ilimitada. Clips está en alfa, así que espera cambios a medida que crece.
    - q: ¿En qué se diferencia Clips del dictado integrado en mi ordenador?
      a: El dictado integrado no necesita configuración, pero no guarda un [historial consultable de lo que dijiste](https://www.agent-native.com/articles/what-should-you-look-for-in-dictation-software/). Clips guarda cada dictado con su texto original y limpio, aprende tus palabras y ordena el texto con IA. El agente de Clips puede encontrar lo que dijiste y reelaborarlo, por ejemplo convertir un discurso en viñetas.
    - q: ¿Escribirá Clips bien la jerga de mi equipo?
      a: Sí, una vez que los términos estén en tu Diccionario. Añádelos uno por línea, o como «término → reemplazo» para una palabra que entiende mal. También puedes importar un archivo CSV de términos. Cuando corriges una palabra justo después de que Clips la pegue, la aplicación de escritorio guarda esa corrección en tu Diccionario para la próxima vez.
    - q: ¿Se guardan mis dictados y puedo encontrar uno antiguo?
      a: Cada dictado se guarda con su texto original y limpio, la hora y la duración, y aparece en la página Dictar, agrupado por día. Pulsa Cmd+K para buscarlos por lo que dijiste, o pregunta al [agente de Clips](https://www.agent-native.com/docs/template-clips-agent/), por ejemplo «Muéstrame lo que dicté ayer». Puedes eliminar cualquier dictado.
    - q: ¿Mi voz sale de mi ordenador?
      a: No tiene por qué. Clips Desktop puede transcribir en tu dispositivo, con el reconocimiento de voz integrado o con Local Whisper ([motores de transcripción en Clips](https://www.agent-native.com/docs/template-clips-features/)). Con Builder.io o tu propia clave, Clips envía tu dictado a ese servicio de IA para limpiarlo. El texto de cada dictado se guarda en tu cuenta de Clips.
