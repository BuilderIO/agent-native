how_to:
  heading: Cómo crear un prototipo de landing page con IA
  steps:
    - title: Describe tu lanzamiento
      body: "En la pantalla de inicio de Design, pega tu briefing de lanzamiento en el cuadro **Nuevo diseño**: [la oferta, para quién es y la llamada a la acción](https://www.agent-native.com/articles/how-do-you-build-a-landing-page-with-ai/). O adjunta el briefing como archivo y elige el sistema de diseño de tu marca debajo del cuadro."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8d189f62f944b3d935b058b826150b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8db8cda1abfe476f954bfa5bc50a7b6d
        alt: Primer plano del cuadro New design en la pantalla de inicio de Design. Hay escrito un briefing de lanzamiento para los pagos en el día de Ledgerlane, con el PDF del briefing adjunto y el sistema de diseño Ledgerlane Brand elegido.
    - title: Compara varias versiones
      body: Pide al agente «tres versiones». Cada una aparece como su propia pantalla, lado a lado en el tablero. Elige una en el chat y el agente la convierte en la página completa y retira las demás.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F45d7dcdb0a2d473e82e516e2419e21f0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe7aac725b27c4046b57faf5e69a2abf2
        alt: Tres versiones de la landing de lanzamiento de pagos en el día, Product-first, Editorial y Proof-led, lado a lado en el tablero. El chat del agente pregunta cuál desarrollar, con un botón para cada una.
    - title: Exporta el HTML de la página
      body: En el menú del editor, elige **Archivo** y luego **Exportar**. **Descargar HTML** te da un solo archivo que se abre en cualquier navegador. **Copiar prompt del agente** da a un agente de código lo que necesita para integrar la página en tu web.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F171cf01db5ca44ee8d31ebb6f98a73b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd2640c796dc44746ae1c8a622ec49bdc
        alt: Primer plano del menú del editor con File y Export abiertos sobre la landing Product-first. Las opciones incluyen Download HTML, Download ZIP, Download for Figma (SVG) y Copy agent prompt.
features:
  heading: Todo lo que necesitas para diseñar tu landing de lanzamiento
  items:
    - title: Del briefing a la landing
      body: El agente parte de las afirmaciones de tu briefing en lugar de inventar otras. Si el briefing deja una decisión abierta, pregunta o dice lo que ha supuesto.
    - title: Edición con IA y visual
      body: Cambia tú un titular, un color o el espaciado, o pide al agente que rehaga una sección. Los dos editáis la misma página.
    - title: Versiones lado a lado
      body: Cada versión tiene su propio estilo y una versión móvil, para que tu equipo compare direcciones reales antes de publicar nada.
    - title: Cada lanzamiento, con tu marca
      body: Crea una vez un sistema de diseño a partir de tu archivo de Figma, tu web o tu código. Cada landing nueva usa tus colores, fuentes y estilos.
    - title: Comentarios fijados en la página
      body: "Los revisores fijan comentarios en el titular o el botón exacto. Envía uno al agente: hace ese cambio o te pide que decidas."
    - title: Entrega de código a tu desarrollador
      body: El prompt del agente incluye tus design tokens, los archivos de la página y las instrucciones que necesita un agente de código para integrarla en tu web.
