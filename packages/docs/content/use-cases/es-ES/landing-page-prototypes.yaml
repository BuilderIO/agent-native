faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Design es gratis?
      a: Sí, Agent-Native Design es gratuito y de código abierto. Crear una página necesita una conexión de IA, ya sea con créditos de IA de Builder.io o con tu propia clave de IA, así que el uso de IA no es ilimitado. Design está en alfa, así que espera cambios a medida que crece.
    - q: ¿Design publica o aloja mi landing page?
      a: No. Design crea la landing page y la exporta, y tú la despliegas con las herramientas que ya usas. Descarga el HTML o un ZIP con los archivos, o copia un prompt que tu agente de código usa para añadir la página a tu web.
    - q: ¿Puedo usar mi propia marca?
      a: Sí. Crea un sistema de diseño a partir de un archivo de Figma, tu web, un repositorio de GitHub o archivos que subas, y elígelo al empezar una página. El agente mantiene sus colores, fuentes y estilos en cada versión que crea.
    - q: ¿Puedo editar la landing page después de que la cree la IA?
      a: Sí. Cambia textos, colores, espaciado y maquetación a mano en la página, o pide al agente que cambie una sección. Puedes restaurar una versión anterior desde **Historial de versiones** en cualquier momento.
    - q: ¿Qué obtengo al exportar la landing page?
      a: "**Descargar HTML** te da un solo archivo que se abre en cualquier navegador y carga sus estilos por internet. **Descargar ZIP** contiene todos los archivos de la página, y **Descargar para Figma (SVG)** te da capas que puedes editar en Figma. La documentación recoge [todas las opciones de exportación](https://www.agent-native.com/docs/template-design-features/#export)."
    - q: ¿En qué se diferencia Design de pedirle una landing page a un chatbot?
      a: "Un chatbot te da código que tienes que pegar en algún sitio antes de poder ver la página. En Design, el agente crea la página en un editor que puedes ver y en el que puedes hacer clic, en varias versiones. La cambias a mano o pidiéndoselo, en la misma página. Eso es una [aplicación agéntica](https://www.agent-native.com/articles/what-is-an-agent-native-app/): la inteligencia de un agente, la intuición de una aplicación."
