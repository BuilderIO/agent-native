faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Plan es gratis?
      a: Sí, [Agent-Native Plan](https://www.agent-native.com/docs/template-plan/) es gratuito y de código abierto. Tu propio agente de código dibuja las pantallas, así que cada plan usa el modelo de tu agente y cuenta para su uso, y un plan más largo consume más. Plan está en alfa, así que espera cambios.
    - q: ¿Qué agentes de código funcionan con Plan?
      a: Agent-Native Plan tiene plugins para Claude Code y Codex. El comando de instalación configura Cursor, OpenCode y GitHub Copilot de la misma forma, y añade `/visual-plan` con un único inicio de sesión. Cline, Goose y otros agentes compatibles con MCP se conectan añadiendo la URL de Plan.
    - q: ¿Cómo cambio lo que muestra el plan?
      a: "Cambias una pantalla [comentándola](https://www.agent-native.com/docs/template-plan-review-workflow/), y tu agente de código la vuelve a dibujar. Plan no permite arrastrar ni redimensionar partes de una pantalla a mano. El plan escrito, debajo de las pantallas, es distinto: puedes editar su texto directamente."
    - q: ¿Las pantallas se parecerán a mi app actual?
      a: Sí, cuando la pantalla forma parte de una app que ya tienes. Antes de dibujar, tu agente de código lee el código de tu app, su diseño y sus componentes, así que el plan muestra tu barra lateral, tu barra de herramientas y tus menús reales. Una app totalmente nueva recibe pantallas dibujadas a partir de tu descripción.
    - q: ¿En qué se diferencia Plan del modo plan de mi agente de código?
      a: Plan funciona con el modo plan de tu agente y muestra su plan como pantallas. Pasa a `/visual-plan` un plan de Claude Code, Codex o Markdown que tu agente ya haya escrito, y Plan lo convierte en las pantallas que describe, listas para comentarios fijados en el punto exacto.
