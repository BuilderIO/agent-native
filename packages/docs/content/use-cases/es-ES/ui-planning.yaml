template: v2
slug: ui-planning
app: plans
title: Planifica pantallas nuevas con tu agente de código
seo_title: Planifica la UI con Claude Code, Codex y Cursor
meta_description: Con Agent-Native Plan, tu agente de código planifica una pantalla en wireframes, estado a estado y con el diseño de tu app. Comenta y la corrige antes de crearla.
updated: 2026-10-27
hero:
  body: Con Agent-Native Plan, tu agente de código planifica una pantalla nueva con wireframes de cada estado, en el diseño real de tu app. Comenta qué cambiar y el agente redibuja el plan antes de desarrollar.
  button:
    label: Planifica una pantalla
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4f78a2d9f380427bb3da0723b14fcbe4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8547890f69d44a0bb7e9d9d05246850a
    alt: "Un plan para una nueva pantalla de Facturas en Plan. Tres bocetos aparecen uno al lado del otro: la lista de facturas, su estado vacío y un error de pago fallido, cada uno dentro de la barra lateral y la barra de herramientas de la propia app de facturación. Hay un comentario fijado en el filtro de estado de la lista, y debajo empieza el plan escrito."
how_to:
  heading: Cómo hacer el wireframe de una pantalla antes de que tu agente la desarrolle
  steps:
    - title: Pide la pantalla a tu agente
      body: Añade Plan a Claude Code, Codex, Cursor, OpenCode o GitHub Copilot con [un solo comando de instalación](https://www.agent-native.com/docs/plan-plugin/), escribe `/visual-plan` y describe la pantalla que quieres. Tu agente de código lee tu app, hace el wireframe de la pantalla y responde con el enlace del plan.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F96c7a6d6f73a42ed96a551c112cb269a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F60c66f4f9b2442a290e2a258cc70b3f2
        alt: "Primer plano del chat de un agente de código: la petición /visual-plan para una pantalla de Facturas con un filtro de estado, un estado vacío y un error de pago fallido. El agente lee cinco archivos de diseño y componentes de la app, crea el plan y responde con el enlace para revisarlo."
    - title: Comenta lo que debe cambiar
      body: Abre el plan, haz clic en el punto exacto de la pantalla que está mal y escribe qué debe cambiar. Asigna el comentario a **Agente** para que tu agente de código se encargue, o a **Humano** para un compañero.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb9adb0ff68324479a0c18c8124a77b2e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F765ae87885404c408e1f4ee46d15711d
        alt: "Primer plano del boceto de la lista de facturas con un comentario fijado en el filtro de estado. El cuadro del comentario está en Agent y dice: convierte el filtro de estado en un control segmentado con All, Paid y Overdue."
    - title: Envía tus comentarios al agente
      body: Haz clic en **Enviar al agente**, elige **Copiar para tu agente** y pega el prompt en el chat de tu agente. Tu agente de código actualiza el plan y resuelve los comentarios que ha corregido. Cuando la pantalla esté bien, pídele al agente que la desarrolle.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9263e46c4be445389bfc97bee3a78e74
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5910f3c944e9443aafe166a356c27bff
        alt: "Primer plano del botón Send to agent con 3 comentarios abiertos. Su menú está abierto con dos opciones: Copy for your agent y Send to inline agent."
features:
  heading: Todo lo que necesitas para acertar con la pantalla a la primera
  items:
    - title: Dibujada dentro de tu app real
      body: Tu agente de código lee tus pantallas y componentes antes de dibujar, así que la pantalla nueva mantiene la barra lateral, la barra de herramientas y los menús en su sitio.
    - title: Cada estado de la pantalla
      body: Tu agente dibuja un boceto por cada estado importante, como carga, vacío, error o un menú abierto, para que veas lo que un prompt deja fuera.
    - title: Comentarios en el elemento exacto
      body: Tu agente de código recibe el botón, la fila o la tarjeta exacta donde está fijado cada comentario, así que basta con una nota como «haz esto un control segmentado».
    - title: Los comentarios abiertos siguen abiertos
      body: Tu agente de código confirma que cada cambio se ha aplicado antes de resolver un comentario, así que lo que se le escape te sigue esperando.
    - title: Un prototipo para flujos de varios pasos
      body: Para un flujo como el onboarding o el pago, tu agente añade un prototipo clicable en la pestaña **Prototipo**, junto a las pantallas.
    - title: Revísalo con tu equipo
      body: Comparte el plan por enlace para que tus compañeros abran las pantallas en su navegador. Cualquiera con una cuenta de Agent-Native puede comentar.
