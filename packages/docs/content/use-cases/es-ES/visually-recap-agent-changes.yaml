how_to:
  heading: Cómo obtener un resumen visual de los cambios de tu agente
  steps:
    - title: Pide un resumen a tu agente
      body: Añade Plan a tu agente de código con su [instalación de una línea](https://www.agent-native.com/docs/template-plan/#install). En el chat donde el agente hizo el cambio, ejecuta `/visual-recap` y abre el enlace que te devuelve.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F060c82d850f34b3096f166c04ead386c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F287f076a9ec84124a0afc7fbaeda2ece
        alt: El chat del agente de código con el mensaje «/visual-recap of everything you changed in this thread» enviado y la respuesta del agente con el enlace al resumen publicado.
    - title: Lee primero el cambio en imágenes
      body: Empieza por los wireframes de antes y después, los cambios de datos señalados y el mapa de archivos modificados. Después abre **Cambios clave**, donde cada archivo importante tiene su pestaña con un diff lado a lado y notas.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff15296c5ef824f5ead19d6e64de1388f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faf5572fc8bbd4962972bfc0b24cf2bc0
        alt: Wireframes de antes y después de la página de Miembros; en el de después aparecen un botón Invite y una invitación pendiente. Al lado, el modelo de datos marca la nueva tabla de invitaciones como añadida y el campo de rol de los miembros como modificado, de texto a una lista fija de roles.
    - title: Envía tus comentarios al agente
      body: Deja [comentarios de revisión](https://www.agent-native.com/docs/template-plan-review-workflow/) en cualquier texto o en un punto de un wireframe. Haz clic en **Enviar al agente**, elige **Copiar para tu agente** y pega el prompt en tu agente de código, que hace los cambios y resuelve tus comentarios.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2256a69fdcd542a18a14a292050ff391
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2b4a48126c4f45c39c0b6f0389673387
        alt: Un comentario para el agente, fijado en el botón Invite del wireframe de después, pide que solo lo vean los administradores. El menú Send to agent está abierto, con Copy for your agent y Send to inline agent.
features:
  heading: Todo lo que necesitas en un resumen visual
  items:
    - title: Pantallas antes que código
      body: Si el cambio afecta a la interfaz, el resumen empieza con wireframes de antes y después, para que veas primero lo que verán los usuarios.
    - title: Cambios de datos señalados
      body: Los cambios de esquema y de API marcan cada campo como añadido, cambiado, eliminado o renombrado, con el tipo anterior junto al nuevo.
    - title: Todos los archivos, en un mapa
      body: Un árbol lista cada archivo que tocó el cambio, marcado como añadido, modificado, eliminado o renombrado, con notas sobre qué cambió.
    - title: Diffs clave comentados
      body: De tres a ocho archivos clave tienen diffs lado a lado, cada uno con un resumen de una línea y notas en las líneas que merecen tu atención.
    - title: Cubre todo el hilo
      body: Ejecuta `/visual-recap` en el chat al terminar, y el resumen cubre todo lo que hizo el agente ahí, del primer cambio a los últimos arreglos.
    - title: Revísalo con tu equipo
      body: "Comparte el enlace: los invitados lo abren sin cuenta e inician sesión para comentar. Expórtalo en HTML, Markdown o JSON para guardar una copia."
