hero:
  body: Agent-Native Plan muestra lo que hizo tu agente con pantallas de antes y después, cambios de datos señalados y un mapa de los archivos modificados. Si algo no cuadra, coméntalo y el agente lo corrige.
  button:
    label: Resume un cambio
