faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Plan es gratis?
      a: Sí, Agent-Native Plan es gratuito y de código abierto. Cada resumen visual ejecuta una sesión completa del agente con el modelo que elijas, así que los cambios más grandes consumen más de ese modelo. Plan está en alfa, así que espera cambios.
    - q: ¿En qué cambios merece la pena un resumen visual?
      a: "Usa un resumen visual en los cambios grandes: los que abarcan varios archivos o tocan el esquema de datos, una API o cómo encaja la aplicación. Para un cambio pequeño en un solo archivo, leer el diff es más rápido que esperar a un resumen."
    - q: ¿En qué se diferencia un resumen visual de leer el diff?
      a: "Un diff lista cada línea cambiada, archivo por archivo. Un resumen visual empieza por lo que hace el cambio: las pantallas que modifica, como wireframes, los campos de datos que cambia y un mapa de los archivos implicados. Después muestra solo los diffs que merece la pena leer, con notas."
    - q: ¿Con qué agentes de código funciona Plan?
      a: El comando de instalación configura Plan en Claude Code, Codex, Cursor, OpenCode, GitHub Copilot en VS Code y Claude Cowork, e inicia tu sesión. Plan también funciona en Cline, Goose y cualquier otro agente que se conecte a servidores MCP, mediante su conector alojado.
    - q: ¿Puedo tener un resumen en cada pull request?
      a: Sí. La [GitHub Action PR Visual Recap](https://www.agent-native.com/docs/pr-visual-recap/) ejecuta Claude Code, Codex o cualquier modelo compatible con OpenAI con tu propia clave de API en cada push. Mantiene actualizado un único comentario en la pull request, con una captura del resumen, y nunca bloquea un merge. Los diffs de más de unos 600 KB se recortan.
    - q: ¿Quién puede ver mis resúmenes?
      a: Por defecto, solo las personas que han iniciado sesión en tu organización pueden abrir un resumen; si lo haces privado, solo tú. Con la GitHub Action, cualquiera que vea la pull request ve la captura del resumen. El [modo de archivos locales](https://www.agent-native.com/docs/template-plan-local-and-desktop/) deja el resumen fuera de la aplicación alojada, aunque el modelo de tu agente se sigue ejecutando donde siempre.
