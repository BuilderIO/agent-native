how_to:
  heading: Cómo crear un panel de KPI con IA
  steps:
    - title: Conecta tus datos de ingresos y de producto
      body: En la página **Fuentes de datos**, pega tu clave secreta de Stripe y añade HubSpot y la herramienta de analítica de producto que uses. Elige **Probar conexión** en el menú de una fuente para comprobar que Analytics puede leerla.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ea7e1568d3b4afd9fc6a2a01bc969b0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F78b97b8d077644f28c627377157f1331
        alt: Primer plano de Stripe en la página Data Sources, marcado como Connected, con su clave secreta configurada y «Connection successful» tras probar la conexión.
    - title: Describe el panel que quieres
      body: Haz clic en **Nuevo panel** y describe las [métricas SaaS que sigues](https://www.agent-native.com/articles/what-should-a-saas-metrics-dashboard-include/), por ejemplo «MRR y churn de Stripe, nuevos registros y activación de PostHog, mes a mes». Puede que el agente pregunte antes; después crea cada gráfico y abre el panel.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fca8b7f3746ca419383e042cc0c142271
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb167e98f0ac049fa8ad4b169e8f77ec9
        alt: Primer plano del cuadro New dashboard, abierto desde la lista Dashboards de la barra lateral, con la descripción de un panel de KPI para una startup ya escrita.
    - title: Pregunta por qué cambió una cifra
      body: Elige **Chatear sobre el panel** en el menú de un gráfico y haz una pregunta, como «¿Por qué subió el churn en septiembre?». El agente responde con tus datos conectados y añade un gráfico al panel cuando se lo pides.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9b18fbf5a7cd4b4ba65d9efede75538b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9edee9cd613741e2ba670e414be767c7
        alt: "El gráfico de churn por mes con el chat del agente al lado. Ante la pregunta de por qué subió el churn en septiembre, el agente desglosa la subida por plan: el churn de Starter casi se duplicó."
features:
  heading: Todo lo que necesitas para seguir los KPI de tu startup
  items:
    - title: Ingresos, pipeline y uso, juntos
      body: El MRR de Stripe, las oportunidades de HubSpot y los registros de PostHog o Mixpanel, uno al lado del otro en un solo panel.
    - title: Edítalo a mano o pídelo
      body: Cambia un filtro tú mismo o pide al agente un gráfico nuevo. Ambos van al mismo panel, y su historial restaura cualquier versión anterior.
    - title: La consulta detrás de cada cifra
      body: Haz clic en un punto de un gráfico para ver los registros que hay detrás, el SQL que los encontró y una descarga en CSV.
    - title: Tu definición de MRR
      body: Escribe cómo cuenta tu empresa el MRR o un usuario activo en la página **Capa semántica**. El agente lo consulta antes de escribir una consulta.
    - title: Privado hasta que lo compartas
      body: Un panel nuevo es solo tuyo. Compártelo con tu cofundador o con toda la empresa cuando esté listo, para verlo o editarlo.
    - title: Tus KPI por correo
      body: "Las cifras te llegan a ti: recibe el panel por correo cada mañana, a la hora que elijas, para hasta cinco personas."
