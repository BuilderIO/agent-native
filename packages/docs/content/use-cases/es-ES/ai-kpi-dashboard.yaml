faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Analytics es gratis?
      a: Sí, Agent-Native Analytics es gratuito y de código abierto. El agente funciona con créditos de IA de Builder.io o con tu propia clave de modelo, y cada fuente de datos necesita sus propias credenciales, como una clave secreta de Stripe. Analytics está en alfa, así que las pantallas y las funciones aún pueden cambiar.
    - q: ¿De qué herramientas puede sacar Analytics mis KPI?
      a: Analytics se conecta a Stripe, HubSpot, PostHog, Mixpanel, Amplitude, Google Analytics (GA4), BigQuery y más de una docena de fuentes más. Añades cada una en la [página Fuentes de datos](https://www.agent-native.com/docs/template-analytics-connectors/) con su propia clave, y un mismo panel puede combinar varias fuentes.
    - q: ¿Necesito saber SQL para crear un panel de KPI?
      a: No. Describes el panel o haces una pregunta con tus palabras, y el agente escribe el SQL. La consulta sigue visible detrás de cada gráfico, así que alguien que conozca tus datos puede revisarla o editarla.
    - q: ¿Cómo sé que las cifras son correctas?
      a: Cada cifra del panel sale de una consulta que el agente ha ejecutado sobre tus datos conectados, y puedes abrir la consulta y los registros que hay detrás de cualquier gráfico. Cuando el agente no ha podido ejecutar una consulta, marca la cifra como «Sin verificar». Compara algunas cifras con Stripe antes de confiar en el panel.
    - q: ¿Quién puede ver mi panel de KPI?
      a: Solo tú, hasta que lo compartas. Puedes [compartir un panel](https://www.agent-native.com/docs/sharing/) con un compañero o con toda tu organización como lector, editor o administrador. Los filtros que cambies solo se aplican a ti; guarda una vista o envía el enlace para compartirlos.
    - q: ¿En qué se diferencia Analytics de la IA de mi herramienta de analítica?
      a: "Un asistente de IA dentro de una herramienta de analítica trabaja con los datos de esa herramienta. Analytics trabaja con Stripe, tu CRM y tus datos de producto, y su agente crea y edita el panel que consultas, así que sus respuestas se convierten en gráficos que conservas. Eso es lo que hace de Analytics una [aplicación agéntica](https://www.agent-native.com/articles/what-is-an-agent-native-app/): la inteligencia de un agente, la intuición de una aplicación."
