faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Plan es gratis?
      a: Sí, Agent-Native Plan es gratuito y de código abierto. Cada plan funciona como una sesión de tu agente de código, con el modelo que elijas. Eso consume tokens de tu agente, y un plan más grande consume más. Plan está en alfa, así que espera cambios.
    - q: ¿Con qué agentes de código funciona Plan?
      a: Claude Code y Codex se instalan como plugin. Un solo comando de instalación también configura Plan en Cursor, OpenCode, GitHub Copilot en VS Code y Claude Cowork. Cualquier otro host MCP, como Cline o Goose, puede añadir el conector de Plan con su URL. Revisas cada plan en tu navegador.
    - q: ¿En qué se diferencia Plan del modo plan de mi agente de código?
      a: El modo plan de Claude Code, Codex, Cursor u OpenCode te da el plan como texto en el chat. Plan convierte ese plan, o uno de un archivo Markdown, en una página con diagramas, árboles de archivos y código comentado. Ahí comentas partes concretas, respondes a las preguntas del agente e invitas a un compañero.
    - q: ¿El agente cambia mi código mientras planifica?
      a: No. Mientras escribe o corrige el plan, las instrucciones de Plan hacen que el agente solo lea tu código. Empieza a editar después de que apruebes el plan, y vuelve a leer el plan aprobado antes de los pasos importantes.
    - q: ¿Un compañero puede revisar un plan sin cuenta?
      a: En parte. Cualquiera con quien compartas el enlace puede abrir y editar el plan como invitado. Para comentar, guardar y compartir se necesita una cuenta de Agent-Native, así que un compañero que quiera comentar inicia sesión primero.
    - q: ¿Puedo guardar los planes en mi propio ordenador?
      a: Sí. El [modo de archivos locales](https://www.agent-native.com/docs/template-plan-local-and-desktop/) guarda un plan como archivos MDX en tu ordenador, así que su contenido nunca llega a la aplicación alojada. A cambio, no puedes compartir un plan local ni comentarlo en el navegador, y su enlace solo se abre en tu ordenador. El modo de archivos locales no cambia dónde se ejecuta el modelo de IA de tu agente de código.
