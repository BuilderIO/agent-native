hero:
  body: Agent-Native Plan convierte el plan de tu agente en una página de diagramas, árboles de archivos y código comentado. Comentas cualquier parte y el agente corrige el plan sin tocar código hasta que lo apruebes.
  button:
    label: Planifica tu desarrollo
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faad0afc668dc461f9023eeba3ba55800
