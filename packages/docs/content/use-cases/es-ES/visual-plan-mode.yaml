how_to:
  heading: Cómo usar el modo plan visual con tu agente de código
  steps:
    - title: Pide un plan visual
      body: Añade Plan a Claude Code, Codex o Cursor con [un solo comando de instalación](https://www.agent-native.com/docs/plan-plugin/). Después escribe `/visual-plan` y la tarea. El agente lee tu código y publica un enlace al plan.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F15e26ab97a68472a958aabf9657fdeb2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F01168fa31ed5412080d49febc37f1068
        alt: El chat de un agente de código en el que el usuario ha escrito /visual-plan con la tarea de añadir invitaciones de equipo. El agente enumera los archivos que ha leído, publica el plan y responde con su enlace.
    - title: Comenta lo que debe cambiar
      body: Selecciona una frase o un punto de un diagrama y escribe qué debe cambiar. [Asigna el comentario](https://www.agent-native.com/docs/template-plan-review-workflow/) a **Agente** para que lo corrija el agente, o a **Humano** para un compañero. Responde también a las preguntas abiertas del plan.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8a16bd566384f4080dde591a1b30c3f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F598a137b56d149f98409ed79c024cb2b
        alt: Primer plano de un comentario nuevo fijado en el paso del correo de invitación del diagrama, con el selector Agent/Human en Agent y el comentario ya escrito.
    - title: Envía tus comentarios al agente
      body: Haz clic en **Enviar al agente** y elige **Copiar para tu agente** para copiar tus comentarios como un prompt. Pégalo en el chat de tu agente para actualizar el plan. Cuando el plan esté bien, apruébalo ahí y el agente empieza a desarrollar.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0f841d0983ec4e3386d13c4c4ad7895d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F356c269c867048c392ca26ef5c5767c8
        alt: "Primer plano del botón Send to agent del plan con su menú abierto: Copy for your agent y Send to inline agent, cada uno con su descripción de una línea."
features:
  heading: Todo lo que necesitas para revisar el plan de tu agente
  items:
    - title: Diagramas del enfoque
      body: Flujos de peticiones, modelos de datos y endpoints de la API dibujados, para ver un endpoint erróneo o una tabla que falta antes de desarrollar.
    - title: Qué archivos cambian
      body: Los árboles de archivos y el código comentado muestran dónde cae el trabajo y qué reutiliza cada paso de tu código.
    - title: Preguntas con respuesta propuesta
      body: Lo que el agente no puede decidir con tu código va en un formulario al final, cada pregunta con la respuesta que recomienda.
    - title: Parte del modo plan
      body: ¿Ya tienes un plan de Claude Code, Codex o un archivo Markdown? `/visual-plan` crea la página a partir de él en lugar de empezar de cero.
    - title: Nada de código sin aprobación
      body: Las instrucciones de Plan hacen que el agente solo lea tu código mientras planifica. Empieza a editar después de que apruebes el plan.
    - title: Revísalo con un compañero
      body: Envía el enlace del plan a un compañero. Puede leerlo y editarlo como invitado, e iniciar sesión en Agent-Native para comentar.
