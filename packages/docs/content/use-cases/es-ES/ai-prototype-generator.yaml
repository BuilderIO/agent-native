faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Design es gratis?
      a: Sí, Agent-Native Design es gratuito y de código abierto. El agente necesita una conexión de IA, ya sea a través de Builder.io o con tu propia clave de IA. Design está en alfa, así que espera cambios a medida que crece.
    - q: ¿Puedo empezar desde mi PRD o mi briefing de producto?
      a: Sí. Pega el briefing, o la parte que interese de tu documento de requisitos de producto (PRD), en el cuadro de texto, y pide direcciones si quieres opciones. El agente mantiene tus términos y tus afirmaciones exactas, y si el briefing omite una decisión que cambia el diseño, pregunta o explica lo que ha supuesto. Aquí tienes [qué incluir en un briefing de diseño](https://www.agent-native.com/articles/how-to-turn-a-design-brief-into-a-prototype-with-ai/).
    - q: ¿Puedo hacer clic por el prototipo?
      a: Sí. Cada pantalla es HTML real con interacciones que funcionan, y la dirección que eliges tiene marcos de escritorio y móvil por defecto. Usa el modo **Interactuar** para probarla en el lienzo, o **Vista previa de Design** para abrir la pantalla en una nueva pestaña del navegador.
    - q: ¿Puedo usar mi propio sistema de diseño o mis diseños de Figma?
      a: Sí. Un [sistema de diseño](https://www.agent-native.com/docs/template-design-features/) puede salir de un archivo de Figma, tu web, un repositorio de GitHub, un archivo design.md o unas notas, y los diseños nuevos lo siguen. También puedes importar un marco de Figma como pantalla editable, y Design te indica lo que no ha podido reproducir con exactitud.
    - q: ¿El prototipo es código de producción?
      a: No. El prototipo es un punto de partida, y la lógica de la app, las integraciones, las pruebas y el despliegue aún hay que desarrollarlos. Exporta HTML o un ZIP con los archivos, o usa **Copiar prompt del agente** para dar a un agente de código los archivos, los design tokens y un prompt listo. Claude Code y Codex también pueden [abrir diseños con el servidor MCP de Design](https://www.agent-native.com/docs/template-design-integrations/).
    - q: ¿En qué se diferencia Design de pedirle una interfaz a un chatbot?
      a: "En Design, el agente crea el prototipo en un lienzo donde haces clic por él, comparas direcciones y lo editas, y los comentarios de tu equipo van directos al agente. Con un chatbot, el resultado se queda en la conversación. Eso hace de Design una [aplicación agéntica](https://www.agent-native.com/articles/what-is-an-agent-native-app/): la inteligencia de un agente, la intuición de una aplicación."
