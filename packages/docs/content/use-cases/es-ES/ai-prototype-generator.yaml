meta_description: Pega un briefing de producto o de diseño y Agent-Native Design crea pantallas que funcionan. Pide al agente de IA varias direcciones y pule la que elijas.
updated: 2026-10-27
hero:
  body: Agent-Native Design crea las pantallas que describe tu briefing de producto o de diseño, en HTML que funciona. Pide al agente de IA varias direcciones y pule la que elijas, a mano o pidiéndoselo.
  button:
    label: Prototipa tu briefing
    url: https://design.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F003e186182b74e3cbe462fe098559bc6
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8f432f3b71d432698c025a7147301bc
    alt: El editor de Design con Guided checklist, la dirección de onboarding elegida para una app de gastos de equipo, en sus marcos de escritorio y móvil. El chat del agente muestra el briefing pegado, la opción Pick a direction y lo que el agente cambió después.
how_to:
  heading: Cómo convertir un briefing en un prototipo con IA
  steps:
    - title: Describe la pantalla que necesitas
      body: "En la pantalla de inicio de Design, pega tu briefing en el cuadro de texto: para quién es, la pantalla o el flujo, y qué tiene que hacer. Pide tres direcciones. Si falta algo importante, Design pregunta antes."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ef31fb673e2437fb4dd6ed256a7ba9d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8209bd4f55d7432c94e05172c5475f17
        alt: Primer plano del cuadro de texto de la pantalla de inicio de Design con un breve briefing para el flujo de onboarding de una app de gastos, que termina con «Show me three directions».
    - title: Elige la dirección que te guste
      body: Design coloca tres direcciones una al lado de otra en el lienzo, cada una como una pantalla que funciona y con su propio estilo. Prueba cada una en **Interactuar**, elige una en **Elegir una dirección** y el agente desarrolla el resto.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F137893c57370435d94967b9d5bc6a82a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fda7cdd9a2f3e42b58f44efec2b950fc9
        alt: El lienzo con las tres direcciones de onboarding una al lado de otra, y el chat del agente mostrando «Pick a direction» con un botón para cada dirección.
    - title: Púlelo con tu equipo
      body: Edita textos, espaciado y color en la pestaña **Diseño**, o selecciona un elemento y pídeselo al agente. Cuando un compañero fije un comentario, haz clic en **Enviar al agente** y el agente hace ese cambio.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F406b66f9b62e49c09f697f5d08599b5e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F566ca2f3c44f439aac2c5307c72aa572
        alt: La pantalla de onboarding elegida con el comentario de un compañero fijado en el paso de invitación, y el hilo del comentario abierto en la pestaña Comments con el botón Send to agent.
features:
  heading: Todo lo que necesitas para pasar del briefing al prototipo
  items:
    - title: Interactivo desde el principio
      body: La dirección que eliges se convierte en HTML interactivo, en marcos de escritorio y móvil. **Vista previa de Design** lo abre en una pestaña.
    - title: Respeta las palabras del briefing
      body: El agente usa tus términos y tus afirmaciones. Si el briefing omite una decisión importante, te pregunta o explica lo que ha supuesto.
    - title: Revisado antes de estar listo
      body: El agente hace su propia revisión visual y de accesibilidad de un prototipo antes de decirte que el diseño está listo.
    - title: Prototipos con tu marca
      body: Crea un sistema de diseño a partir de un archivo de Figma, tu web o un repositorio de GitHub, y los prototipos nuevos usan tus colores y fuentes.
    - title: Comentarios que el agente aplica
      body: Un comentario queda fijado a su elemento. El agente edita ese punto, comprueba el cambio y cierra el hilo o te pide que decidas.
    - title: Pásalo a tu agente de código
      body: Exporta HTML o un ZIP con los archivos, o copia un prompt listo que da a tu agente de código los archivos y los design tokens.
