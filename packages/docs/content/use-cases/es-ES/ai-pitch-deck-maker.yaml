features:
  heading: Todo lo que necesitas para crear y presentar tu deck
  items:
    - title: Pitch decks a partir de tus notas
      body: Parte de una instrucción, tus notas, un documento o tu último deck. Cuéntale al agente sobre tu empresa y tu ronda, y crea el deck.
    - title: Edición visual y con IA
      body: Edita tú mismo el texto y el diseño en la diapositiva, o selecciona una línea y pídeselo al agente. Solo cambia lo que pediste.
    - title: Tu marca en cada diapositiva
      body: Guarda tus colores, fuentes y logo como sistema de diseño, y cada deck que hagas tendrá el aspecto de tu empresa.
    - title: Imágenes y logos
      body: Pide al agente que genere imágenes, busque fotos de stock o añada logos de clientes y partners a tus diapositivas de tracción.
    - title: Colaboración entre cofundadores
      body: Edita el mismo deck con tu cofundador y el agente, comenta cualquier diapositiva y restaura cualquier versión anterior.
    - title: Presenta, comparte y exporta
      body: Presenta con notas del orador, comparte un enlace de solo lectura con inversores o exporta un archivo de PowerPoint editable.
