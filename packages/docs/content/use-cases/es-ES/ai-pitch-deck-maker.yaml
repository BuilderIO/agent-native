faqs:
  heading: ¿Tienes preguntas? Tenemos respuestas
  items:
    - q: ¿Agent-Native Slides es gratis?
      a: Sí, Agent-Native Slides es gratuito y de código abierto. Para crear un deck necesitas una conexión de IA, a través de Builder.io o con tu propia clave de IA, y para generar imágenes necesitas tu propia clave de Gemini u OpenAI. Slides está en fase alfa, así que habrá cambios a medida que crezca.
    - q: ¿Puedo exportar mi pitch deck a PowerPoint o Google Slides?
      a: Slides exporta un archivo de PowerPoint (PPTX) editable. Para Google Slides, te da un archivo PPTX con un enlace de importación, que abres tú mismo en Google Slides. También puedes exportar el deck como un único archivo HTML.
    - q: ¿Puede Slides partir de mis notas, un documento o mi web?
      a: Describe tu pitch en la pantalla de inicio de Slides y adjunta tus notas o un documento, o añade el enlace de tu web. También puedes importar un documento de Google Docs, un archivo de Word o un PowerPoint. Si el agente no puede leer un PDF o una web, te lo dice en lugar de inventárselo.
    - q: ¿En qué se diferencia Slides de pedirle a un chatbot que escriba mis diapositivas?
      a: "Un chatbot te da texto para que lo copies tú mismo en las diapositivas. En Slides, el agente crea el deck real en un editor que puedes ver. Puedes cambiar cualquier diapositiva a mano o pedírselo al agente, sobre el mismo deck, y cada cambio se puede deshacer. Eso es lo que convierte a Slides en una [app agéntica](https://www.agent-native.com/articles/what-is-an-agent-native-app/): el cerebro de un agente con la sencillez de una app."
    - q: ¿Puede mi cofundador editar el pitch deck conmigo?
      a: Tú, tu cofundador y el agente podéis editar el mismo deck a la vez. Puedes comentar una diapositiva o una parte concreta de ella. Slides guarda una versión antes de cada cambio importante, así que puedes restaurar una versión anterior en cualquier momento.
    - q: ¿Cuántas diapositivas debe tener un pitch deck?
      a: "Unas diez es una buena extensión para un primer pitch ([qué incluir en un pitch deck](https://www.agent-native.com/articles/how-to-make-a-pitch-deck-with-ai/)), y Slides sugiere \"Crea un pitch de 10 diapositivas desde este doc\". Si quieres otra extensión, díselo al agente y planificará el esquema para ajustarse a ella."
