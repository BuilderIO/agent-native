faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Analytics es gratis?
      a: Sí, Agent-Native Analytics es gratuito y de código abierto. Usa la app alojada o ejecuta tu propia copia. El agente necesita una conexión de IA, a través de Builder.io o de tu propia clave de modelo, así que el uso de IA no es ilimitado. Analytics está en alfa, así que habrá cambios.
    - q: ¿Necesito saber SQL?
      a: No. Preguntas con tus palabras y el agente escribe el SQL. Puede que alguien que conozca tus datos tenga que [conectar BigQuery](https://www.agent-native.com/docs/template-analytics-connectors/) primero. Un administrador puede añadir tus [definiciones de métricas](https://www.agent-native.com/docs/template-analytics-dashboards/) en la página **Capa semántica**, para que el agente elija las tablas y columnas correctas.
    - q: ¿Funciona con Postgres, Supabase o Neon?
      a: Sí, con Postgres en Supabase o Neon. Conéctalo [mediante MCP](https://www.agent-native.com/docs/mcp-clients/) desde el menú + del chat y haz tu pregunta en el chat. Esas respuestas se quedan en el chat, porque los gráficos del panel aún no pueden consultar Postgres. Otras bases de datos Postgres todavía no se pueden consultar, por eso los pasos de esta página usan BigQuery.
    - q: ¿Puede el agente cambiar mis datos?
      a: En BigQuery, no. Analytics rechaza allí cualquier consulta del agente que inserte, actualice, borre o elimine datos. La configuración también pide una cuenta de servicio con roles de solo lectura, que puede leer tus tablas y ejecutar consultas, pero no modificarlas. A través de Supabase o Neon, el agente puede hacer lo que permitas a esa conexión.
    - q: ¿Cómo sé que una respuesta es correcta?
      a: Revisa la consulta que hay detrás. Pide al agente que te muestre su SQL o abre **Ver SQL** en un gráfico del panel. También puedes preguntarle qué tablas y filtros usó. El agente marca una cifra como **Sin verificar** cuando no se ha ejecutado ninguna consulta en vivo.
    - q: ¿En qué se diferencia de preguntarle a ChatGPT por un CSV exportado?
      a: "Un asistente de chat responde a partir del archivo que exportaste, así que cada pregunta nueva empieza con una exportación nueva. Analytics consulta tu almacén de datos directamente, usa las definiciones de métricas de tu equipo y guarda en un panel las respuestas que vuelves a necesitar. Eso es una [aplicación agéntica](https://www.agent-native.com/articles/what-is-an-agent-native-app/): la inteligencia de un agente, la intuición de una aplicación."
