title: Pregunta a tus datos en lenguaje natural
seo_title: Pregunta a tu base de datos sin saber SQL
meta_description: Pregunta sobre tus datos de BigQuery y Agent-Native Analytics responde con SQL de solo lectura que puedes revisar, y guarda en un panel las preguntas que repites.
updated: 2026-10-27
hero:
  body: Agent-Native Analytics responde con tus datos de BigQuery y guarda en un panel las preguntas que repites. El agente escribe SQL de solo lectura revisable.
  button:
    label: Pregunta a tus datos
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd1120abfcd1447b9ab48ff98a9b7592d
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2db877a772674ad4af41e7efbb062d50
    alt: Analytics abierto en Ask. El agente responde a una pregunta sobre los registros de la semana pasada con un gráfico de barras por plan y la tabla de la que salen las cuentas. Debajo, una pregunta de seguimiento muestra que Pro fue el plan que más creció.
how_to:
  heading: Cómo hacer preguntas a tu base de datos en lenguaje natural
  steps:
    - title: Conecta tu almacén de datos
      body: En la página **Fuentes de datos**, abre BigQuery. Sube la clave JSON de una cuenta de servicio con los roles BigQuery Data Viewer y BigQuery Job User, escribe el ID de tu proyecto y haz clic en **Guardar credenciales** y **Probar conexión**.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F62008ebd98594f02b1c0bf3ae565ef49
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb01d428bca15467eb4c04299dd9575b8
        alt: Primer plano de la tarjeta de BigQuery en Data Sources, marcada como Connected, con el ID del proyecto y la cuenta de servicio como Configured, y «Connection successful».
    - title: Haz tu pregunta en lenguaje natural
      body: "En **Preguntar**, escribe una pregunta como se la harías a un compañero: «¿Cuántas cuentas se registraron la semana pasada, por plan?». El agente encuentra las tablas adecuadas, ejecuta la consulta y responde con un gráfico."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3e9ac5b30a924dab9b09bc76ed24b2de
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F31c48c5ccc9247b792c00474b01f97b0
        alt: Primer plano del chat de Ask. El agente buscó en el esquema de BigQuery, ejecutó una consulta y respondió con 723 registros y un gráfico de barras por plan.
    - title: Guarda la respuesta en un panel
      body: Pide al agente que «añada esto a un panel». Crea el gráfico, comprueba que su SQL funciona y guarda el panel. El panel es privado hasta que lo compartas con un compañero o con toda tu organización.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F957858f8613241a2b2249d88430b3cc4
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd0111e9f420149fc8a35cad845ad8e2e
        alt: Un nuevo panel Weekly signups con el gráfico de registros por plan y otro de registros por semana. El chat del agente, al lado, dice que ambos gráficos se comprobaron con BigQuery.
features:
  heading: Todo lo que necesitas para sacar respuestas de tu base de datos
  items:
    - title: El SQL de cada respuesta
      body: Abre **Ver SQL** en cualquier gráfico del panel, o pregunta en el chat, para ver la consulta que escribió el agente y copiarla para ejecutarla tú.
    - title: Las definiciones de métricas de tu equipo
      body: Un administrador escribe qué significa «activo» o «registro» en la página **Capa semántica**. El agente la lee antes de escribir SQL.
    - title: Consultas que no pueden cambiar datos
      body: En BigQuery, el SQL del agente no puede insertar, actualizar ni borrar, y se conecta con una cuenta de servicio que solo puede leer tablas y ejecutar consultas.
    - title: Paneles que edita el agente
      body: Pide en el chat otro gráfico, un filtro o un desglose por plan, y el agente cambia el panel para todas las personas con las que lo has compartido.
    - title: Preguntas que cruzan tus herramientas
      body: Haz una sola pregunta que combine las tablas de tu almacén con ingresos de Stripe, oportunidades de HubSpot o eventos de PostHog.
    - title: El panel en tu bandeja de entrada
      body: Recibe un panel por correo cada día a la hora que elijas, con sus gráficos y tablas en el propio correo, para hasta cinco personas.
