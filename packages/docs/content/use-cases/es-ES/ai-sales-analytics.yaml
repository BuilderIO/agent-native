title: Revisa tu pipeline de ventas con datos de HubSpot y Gong
seo_title: Analítica de ventas con IA para HubSpot y Gong
meta_description: Mira qué oportunidades se estancaron y por qué antes de revisar el pipeline. Pregunta a Agent-Native Analytics por HubSpot y Gong y guárdalo en un panel.
updated: 2026-10-27
hero:
  body: Agent-Native Analytics convierte tus oportunidades de HubSpot y tus llamadas de Gong en un panel para cada revisión del pipeline. Pregunta qué se ha estancado y por qué, y el agente responde con ambos.
  button:
    label: Consulta tu pipeline
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe534007e491840cc86570110b7d00de4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4780c6d1885541bcaf3d949dbdbc1eb7
    alt: El panel Weekly pipeline review en Analytics, con gráficos del pipeline abierto por fase, las oportunidades por responsable y las oportunidades estancadas 30 días. El chat del agente, a la derecha, explica por qué se estancó una de ellas, con su historial de fases en HubSpot y su última llamada en Gong.
how_to:
  heading: Cómo analizar tu pipeline de ventas con IA
  steps:
    - title: Conecta tu CRM y tus llamadas
      body: Abre **Fuentes de datos** y haz clic en **Conectar** junto a HubSpot, en **CRM y ventas**. Pega el token de una app privada que crees en los ajustes de HubSpot y haz clic en **Guardar credenciales**. Gong funciona igual, con una clave de acceso y un secreto.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fdeea3eb7d84048eca0f534b7b00390ee
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd918aa95f46047559b1f30c42d89d62f
        alt: La página Data Sources con HubSpot en Connected y Gong en CRM & Sales. El panel de configuración de Gong está abierto en el paso Access Key Secret, ya pegado, encima de Save Credentials.
    - title: Pregunta por tu pipeline
      body: "En **Preguntar**, pregunta con tus palabras: «¿Qué oportunidades abiertas llevan 30 días o más en la misma fase?». El agente busca en tus oportunidades de HubSpot y responde con una tabla que puedes ordenar y seguir consultando."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7acaa378761c453bb79f9f246d8cab72
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe66acdb3c24e41c7b5caef3e0251b17a
        alt: "El chat Ask con la pregunta sobre las oportunidades estancadas 30 días. El agente responde con una tabla de seis oportunidades abiertas: fase, responsable, importe y días en la fase."
    - title: Guarda las respuestas en un panel
      body: Pide al agente que lo «guarde como panel para la revisión del pipeline». Crea un gráfico por cada respuesta, y se actualizan con los datos nuevos de HubSpot. Comparte el panel con tu equipo antes de la revisión del pipeline.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F69b61731b5b74d61ad0e510f57522796
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2720d0e5fd8f40bfa3b72c056270f174
        alt: El chat del agente confirma que ha guardado el panel Weekly pipeline review, junto al panel nuevo con su tabla de oportunidades estancadas y su gráfico del pipeline por fase.
features:
  heading: Todo lo que necesitas para revisar el pipeline
  items:
    - title: Oportunidades y llamadas juntas
      body: Una sola pregunta trae de HubSpot la fase y el responsable de una oportunidad, y de Gong lo que dijo el comprador en sus llamadas.
    - title: Paneles que edita el agente
      body: Pide un gráfico nuevo, un filtro por responsable u otro tipo de gráfico, y el agente actualiza el panel que comparte tu equipo.
    - title: Respuestas que puedes comprobar
      body: El agente marca una cifra como «Sin verificar» cuando no sale de una consulta en vivo a HubSpot o Gong, para que sepas qué revisar.
    - title: Tu pipeline junto a los ingresos
      body: Conecta también Stripe y BigQuery, y el mismo chat responde sobre ingresos y uso del producto junto a tus oportunidades.
    - title: Tus definiciones del pipeline
      body: Un administrador define qué es una oportunidad estancada o un pipeline cualificado en la página **Capa semántica**. El agente la lee antes de responder.
    - title: Un informe diario del pipeline
      body: Recibe el panel cada día por correo, hasta cinco personas, o en un canal de Slack, sin abrir la aplicación.
