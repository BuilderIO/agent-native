faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Analytics es gratis?
      a: Sí, Agent-Native Analytics es gratuito y de código abierto. El agente funciona con créditos de IA de Builder.io o con tu propia clave de IA, así que el uso de IA no es ilimitado. Las preguntas sobre llamadas también pueden consumir créditos de la API de Gong, algo que un administrador puede desactivar. Analytics está en alfa.
    - q: ¿Con qué herramientas de CRM y de llamadas se conecta Agent-Native Analytics?
      a: Analytics se conecta a HubSpot para tu CRM y a Gong para tus llamadas de ventas. También se conectan Apollo y Clay, para datos de contactos y empresas. Cada uno [se conecta en la página Fuentes de datos](https://www.agent-native.com/docs/template-analytics-connectors/) con su propia clave, y una sola pregunta puede usar HubSpot y Gong a la vez.
    - q: ¿Tengo que escribir SQL?
      a: No. Preguntas con tus palabras y el agente busca los datos en HubSpot o Gong, ejecuta la consulta y responde con una cifra, una tabla o un gráfico. Cuando guardas una respuesta en un panel, el agente configura cómo obtiene datos actualizados cada gráfico.
    - q: ¿Puedo fiarme de las cifras?
      a: "Sí, comprobándolas: el agente responde con datos en vivo de HubSpot y Gong y marca una cifra como «Sin verificar» cuando no sale de una consulta en vivo. Sigue las [definiciones de tu equipo en la página Capa semántica](https://www.agent-native.com/docs/template-analytics-dashboards/). Compara las primeras respuestas con HubSpot antes de confiar en ellas."
    - q: ¿En qué se diferencia Agent-Native Analytics de la IA que incluyen HubSpot o Gong?
      a: La IA de HubSpot o Gong está integrada en esa herramienta. Analytics responde a una misma pregunta con HubSpot y Gong a la vez, también lee Stripe y BigQuery, y guarda la respuesta en un panel que tu equipo vuelve a abrir cada semana. Sigues usando HubSpot y Gong como siempre, y Analytics lee de los dos.
    - q: ¿Quién puede ver mis paneles?
      a: Solo tú, hasta que compartas uno. Comparte un panel con un compañero o con toda tu organización como lector, editor o administrador. Tus compañeros ven los datos de HubSpot y Gong con su propia conexión o con una que un administrador haya configurado para la organización; sin ninguna de las dos, esos gráficos muestran un error.
