features:
  heading: Todo lo que necesitas de cada reunión
  items:
    - title: Sin bots en tus llamadas
      body: Clips Desktop graba tu micrófono y el audio de la llamada en tu propio ordenador, así que la reunión se ve igual para todos los demás.
    - title: Tareas por persona
      body: Cada tarea indica quién es el responsable, según quién dijo qué en la llamada. Añade, edita o elimina tareas antes de compartirlas.
    - title: Pregunta durante la llamada
      body: "Pregunta sobre la reunión mientras ocurre: qué te has perdido, un resumen de los últimos cinco minutos o una buena pregunta para hacer a continuación."
    - title: Busca por lo que se dijo
      body: Encuentra una reunión por una palabra de la transcripción, de las notas o por el nombre de un asistente, o pídele al agente la llamada en la que salió un tema.
    - title: Notas que enlazan al momento
      body: Haz clic en cualquier punto clave de las notas de IA para saltar al momento exacto de la transcripción en que se dijo.
    - title: Notas de reunión para compartir
      body: Un único enlace comparte el resumen, los puntos clave, las tareas y la transcripción completa, sin el vídeo ni los comentarios de la grabación.
