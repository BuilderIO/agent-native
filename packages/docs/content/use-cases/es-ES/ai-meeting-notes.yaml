how_to:
  heading: Cómo tomar notas de reuniones con IA
  steps:
    - title: Conecta tu calendario
      body: Instala Clips Desktop, activa Reuniones en los Ajustes de Clips y conecta Google Calendar en la página Reuniones. Tus próximas reuniones aparecen en la pestaña Agenda.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F58ac771a7a8547ecbb770e5e560f8ecd
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6d5d38e3c0124bbb8a51b2d0b89582c4
        alt: Primer plano de la pestaña Agenda de la página Reuniones, con las reuniones de hoy de Google Calendar y los botones Unirse y Abrir notas en la reunión que empieza en 2 minutos.
    - title: Empieza las notas desde el recordatorio
      body: Clips Desktop muestra un recordatorio un minuto antes de cada reunión del calendario. Su botón Join entra en la llamada y empieza las notas al instante, y el menú del botón las empieza sin entrar. Clips captura entonces tu micrófono y el audio de la llamada.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff048f1dd0e18443d93fdeb4a4f03fada
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe58e7dd45fa3459fb1cdb3840fed0126
        alt: "Primer plano del recordatorio de Clips Desktop para la reunión semanal de producto. Su botón Join Meet & open Clips tiene el menú abierto: Join only, Start notes only y Snooze 5 min."
    - title: Lee tus notas y tareas
      body: "Cuando acaba la llamada, la página de la reunión muestra tus notas y las notas de IA junto a la transcripción: un resumen, los puntos clave y las tareas por asistente. [Revisa las notas de reuniones con IA](https://www.agent-native.com/articles/how-to-use-ai-to-take-meeting-notes/) con la transcripción antes de compartirlas."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0ba0a151caef41e8904d6535671c47bc
