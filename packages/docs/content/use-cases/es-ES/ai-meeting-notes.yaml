faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Clips es gratis?
      a: Sí, Agent-Native Clips es gratuito y de código abierto. Los resúmenes, los títulos y la limpieza de transcripciones funcionan por defecto con [créditos de IA de Builder.io](https://www.agent-native.com/docs/template-clips-features/). Cuando se acaban los créditos, esas funciones se detienen hasta que añadas créditos o conectes tu propia clave de Gemini. Clips está en alfa, así que espera cambios.
    - q: ¿Entra un bot en mis reuniones?
      a: "No. Clips toma notas desde tu propio ordenador: Clips Desktop graba tu micrófono y el audio de la llamada, así que no entra nada en tu llamada de Zoom, Google Meet o Microsoft Teams. Como no entra ningún bot, avisa a los demás de que estás tomando notas."
    - q: ¿Con qué calendarios y aplicaciones de videollamada funciona Clips?
      a: Clips solo se conecta con Google Calendar. Las notas funcionan en Zoom, Google Meet, Microsoft Teams, Webex o cualquier otra llamada cuyo audio reproduzca tu ordenador. En Mac, Clips Desktop también detecta esas llamadas cuando no están en tu calendario y te ofrece empezar las notas. Las voces de los demás asistentes solo se capturan en Mac.
    - q: ¿Clips toma notas de reuniones en Windows?
      a: Clips Desktop funciona en Mac, Windows y Linux, pero la captura de las voces de los demás asistentes solo funciona en Mac. En Windows y Linux, Clips graba solo tu micrófono, así que los asistentes remotos no aparecen en la transcripción ni en las tareas.
    - q: ¿En qué se diferencia Clips del asistente de notas con IA de Zoom o Google Meet?
      a: "El asistente de notas con IA de una aplicación de llamadas está ligado a las llamadas de esa aplicación. Clips guarda todas tus reuniones, de cualquier aplicación, en una única biblioteca. Pregunta al [agente de Clips](https://www.agent-native.com/docs/template-clips-agent/) «¿a qué se comprometió Daniel el martes pasado?» y buscará en tus reuniones por lo que se dijo. Eso es una [aplicación agéntica](https://www.agent-native.com/articles/what-is-an-agent-native-app/): la inteligencia de un agente, la intuición de una aplicación."
