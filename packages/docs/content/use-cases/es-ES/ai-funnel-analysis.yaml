title: Descubre dónde abandonan los nuevos usuarios
seo_title: Análisis de embudo con IA y sesiones grabadas
meta_description: Pregunta a Agent-Native Analytics qué paso del registro pierde usuarios, obtén el embudo con tus propios eventos y mira las grabaciones de quienes se fueron.
updated: 2026-10-27
hero:
  body: Pregunta a Agent-Native Analytics qué paso del registro pierde más gente, y el agente crea el embudo con tus eventos. Luego mira las grabaciones de quienes se fueron y pregunta al agente por qué.
  button:
    label: Encuentra el abandono
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F55295bda356c490984f639946e838ebe
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd84d0fd7f856406e85b739ac0429b0f3
    alt: "La ventana de Analytics en un panel «Activation funnel». Su embudo tiene cuatro pasos: Signed up, Created a project, Connected a data source e Invited a teammate. Cada paso muestra su recuento, su porcentaje sobre los registros y la caída respecto al paso anterior, y la mayor caída está en Created a project. El chat del agente, al lado, explica dónde se detuvieron los registros de la semana pasada."
how_to:
  heading: Cómo hacer un análisis de embudo con IA
  steps:
    - title: Pregunta dónde se detienen
      body: "Lleva tus eventos de registro a Analytics. Pregunta en **Preguntar** y el agente escribe el SQL y añade un [gráfico de embudo](https://www.agent-native.com/docs/template-analytics-dashboards/) con el recuento y la caída de cada paso. Prueba: «Añade un embudo a mi panel Activation funnel: ¿dónde se detuvieron los registros de la semana pasada?»"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa752431cecb8420c88d3d6a8f7980ea9
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F16ab210c27504ed1b71c37ebdabea744
        alt: El chat del agente con esa petición y su respuesta, junto al embudo que ha añadido. Los pasos indican Signed up 1240, Created a project 612, Connected a data source 418 e Invited a teammate 302, cada uno con su caída.
    - title: Encuentra a quienes se detuvieron
      body: Activa Clasificación de sesiones en los Ajustes de Analytics. En **Sesiones**, abre **Eventos**. Elige **Con** para el paso anterior a la caída, como «signed_up», y **Sin** para el paso al que nunca llegaron, como «project_created».
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F327bf36c28ab452da87cf4f4dc65debe
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F49b79e0de78041bb93444ec4d24ce11a
        alt: Primer plano de la página Sessions con el filtro Events abierto, signed_up en Did y project_created en Didn't. Debajo, la lista filtrada de sesiones de nuevos usuarios, cada una con su duración, su página y sus clics de frustración.
    - title: Pregunta qué pasó en una sesión
      body: Abre una grabación para ver la página, los clics y las peticiones de red. Haz clic en **Preguntar al agente sobre esta sesión** y pregunta «¿Qué pasó en esta sesión?». El agente resume los errores, los clics repetidos y las páginas que vio esa persona.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7e0b3a4750a143f6bcd609e1c5460fd2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe44e9321e80d4c3f826bd7b25fa54025
        alt: Una grabación de un nuevo usuario en la página de crear proyecto, con la respuesta del agente al lado. La persona escribió un nombre de proyecto y pulsó Create project tres veces. La petición a la API de proyectos falló todas las veces y se fue.
features:
  heading: Todo lo que necesitas para encontrar y corregir el abandono
  items:
    - title: Saltarse un paso no es abandonar
      body: Indica al agente qué pasos se pueden saltar, y el embudo separa a quienes se los saltaron de quienes dejaron la app ahí.
    - title: Tus propios nombres de eventos
      body: Los administradores describen tus eventos y métricas en la página **Capa semántica**, y el agente usa esos nombres exactos en cada consulta.
    - title: Ve la petición que falló
      body: Abre **Herramientas de desarrollo** en una grabación para ver su consola y sus peticiones de red, y salta al momento del fallo.
    - title: Grabaciones censuradas para agentes
      body: Un agente externo recibe las entradas de consola y de red de la grabación, primero los errores, nunca la grabación. Su enlace caduca en dos horas.
    - title: Privado por defecto
      body: Lo que se escribe se oculta en todas las grabaciones, y tú eliges qué más de la página queda oculto.
    - title: El embudo, cada día
      body: Pide al agente que envíe tu panel del embudo a diario, a la hora que elijas, por correo a hasta cinco personas o a Slack.
