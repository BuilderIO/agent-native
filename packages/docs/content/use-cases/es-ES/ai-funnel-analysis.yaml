faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Analytics es gratis?
      a: "Sí, Agent-Native Analytics es gratuito y de código abierto. Usa la aplicación alojada o [ejecuta tu propia copia](https://www.agent-native.com/docs/template-analytics/). Los datos los pones tú: tus propios eventos o las herramientas que conectes. Analytics está en alfa, así que espera cambios."
    - q: ¿Necesito saber SQL?
      a: No. Pregunta con tus palabras y el agente escribe y ejecuta el SQL, y responde con un gráfico, una tabla o una cifra. Pide ver la consulta cuando quieras revisarla. Puede que alguien que conozca tus datos tenga que [conectar tus fuentes](https://www.agent-native.com/docs/template-analytics-connectors/) primero.
    - q: ¿De dónde salen las grabaciones de sesiones?
      a: "De tu propia aplicación web. Crea una clave pública en **Fuentes de datos** y añade a tu app el breve fragmento de seguimiento de la página **Sesiones**, con la reproducción de sesiones activada. Conecta un almacenamiento para las grabaciones: Builder.io o tu propio bucket de S3. Por defecto, las [grabaciones](https://www.agent-native.com/docs/template-analytics-monitoring-and-sessions/) solo registran a usuarios con sesión iniciada."
    - q: ¿Qué registra una grabación de sesión?
      a: Una grabación reproduce la página, los clics y el desplazamiento, la salida de la consola y las peticiones de red. Lo que se escribe se oculta por defecto, y los campos de contraseñas o datos de tarjeta nunca se capturan. Para ocultar cualquier otra cosa, añade una clase a esa parte de la página.
    - q: ¿Puedo usar mis datos de PostHog, Amplitude o Mixpanel?
      a: Sí. Conéctalos en **Fuentes de datos** y pregunta por los eventos que mides ahí. El agente consulta cada herramienta por ti. Las grabaciones de sesiones solo salen del seguimiento propio de Analytics, así que añádelo a tu app para ver a las personas que se detuvieron.
    - q: ¿En qué se diferencia Analytics de la IA de mi herramienta de analítica?
      a: "La IA de una herramienta de analítica trabaja con los datos de esa herramienta. El agente de Analytics trabaja con todas las fuentes que conectes, encuentra las grabaciones de las personas exactas que se detuvieron y explica cualquiera de ellas o se la pasa a tu agente de código. Además, es de código abierto. Eso es una [aplicación agéntica](https://www.agent-native.com/articles/what-is-an-agent-native-app/): la inteligencia de un agente, la intuición de una aplicación."
