features:
  heading: Todo lo que necesitas para reportar un bug
  items:
    - title: Pensado para tu agente de código
      body: Pega el enlace en Claude Code, Cursor o Codex. El agente lee la transcripción, los fotogramas y los registros, sin descargar el vídeo.
    - title: Registros de consola y de red
      body: Clips guarda mensajes de consola, errores y peticiones de hasta cinco pestañas, con el estado, el tiempo y el posible fallo de cada petición.
    - title: Los 30 segundos anteriores
      body: Clips retrocede hasta 30 segundos antes de que pulsaras grabar, así que un error ocurrido mientras cargaba la página también puede entrar en el reporte.
    - title: Tus secretos se quedan fuera
      body: Clips nunca guarda cuerpos de peticiones, cabeceras, cookies ni lo que escribes, y oculta los valores que parecen tokens o contraseñas.
    - title: Salta directo al error
      body: En la pestaña Depuración del clip, haz clic en la hora junto a un error o una petición fallida y el vídeo salta a ese momento.
    - title: Busca en todos tus reportes de bugs
      body: Encuentra cualquier reporte por lo que se dijo en él, o pregunta al agente de Clips por todas las grabaciones de tu biblioteca.
