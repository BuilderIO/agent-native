how_to:
  heading: Cómo reportar un bug con IA
  steps:
    - title: Empieza a grabar desde Chrome
      body: "Haz clic en la extensión de Clips para Chrome en tu barra de herramientas y elige la fuente: una pestaña del navegador, una ventana o toda la pantalla. Activa o desactiva tu cámara y tu micrófono y haz clic en Start recording."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6996593713c74108967e120111378c14
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff7991811f7a346e0a99cf9fe81496e34
        alt: Primer plano de la ventana emergente de la extensión de Clips sobre una aplicación web, con Browser tab elegida como fuente, la cámara y el micrófono activados y el botón Start recording.
    - title: Muestra el bug y explícalo
      body: Haz clic en los pasos que fallan y di qué esperabas que ocurriera. Mientras grabas, la extensión guarda los errores de la página y las peticiones que envió, los detalles que un ingeniero tendría que sacar de las herramientas de desarrollo de Chrome.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe01ffb73c62c427b8077f05657fdeb47
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff895d85667344971baec96eb0b2ec956
        alt: Los controles de grabación de Clips y la burbuja de cámara sobre la página de pago de una aplicación web, donde aparece un mensaje de "Something went wrong".
    - title: Comparte un único enlace
      body: Al parar, Clips copia el enlace de la grabación por ti. Pégalo en un ticket, un chat o tu agente de código. La pestaña Agentes del menú Compartir también lo abre directamente en Claude, Claude Code o Codex.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F10933b64225545e1b5ecd666f5803832
