faqs:
  heading: ¿Dudas? Aquí tienes las respuestas
  items:
    - q: ¿Agent-Native Clips es gratis?
      a: Sí. Agent-Native Clips es gratuito y de código abierto, extensión de Chrome incluida. Los títulos, los resúmenes y la limpieza de transcripciones funcionan por defecto con créditos de IA de Builder.io, así que el uso de IA no es ilimitado, y las grabaciones necesitan un sitio donde guardar el vídeo. Clips está en alfa, así que espera cambios a medida que crece.
    - q: ¿Qué captura Clips de mi navegador?
      a: La extensión de Clips para Chrome captura [mensajes de consola, errores de JavaScript y peticiones de red](https://www.agent-native.com/docs/template-clips-features/#chrome-extension-browser-logs) de hasta cinco pestañas, retrocediendo hasta 30 segundos antes de que pulsaras grabar. Cada petición conserva su dirección, estado, tiempo y si falló. Los editores lo ven todo en la pestaña Depuración del clip, y los agentes lo reciben a través del enlace.
    - q: ¿Clips graba contraseñas o datos privados?
      a: Clips nunca guarda cuerpos de peticiones o respuestas, cabeceras, cookies ni el texto que escribes, y oculta los valores que parecen tokens, contraseñas o claves. Puedes desactivar los registros de desarrollo en los ajustes de la extensión. Las grabaciones nuevas son públicas para quien tenga el enlace, así que pon un reporte de bug como privado o de tu organización cuando muestre datos internos.
    - q: ¿Cómo le paso la grabación de un bug a Claude Code, Cursor o Codex?
      a: Pega el enlace del clip en Claude Code, Cursor o Codex, y el agente [lee la transcripción, los fotogramas y los registros del navegador](https://www.agent-native.com/docs/template-clips-integrations/#agent-readable-clips) sin descargar el vídeo. Para un clip privado, haz clic en Copiar indicación para agente en la pestaña Agentes del menú Compartir, que le da al agente un enlace válido durante dos horas. Esa pestaña también abre el clip en Claude Code o Codex.
    - q: ¿Captura Clips registros en otros navegadores o en la aplicación de escritorio?
      a: No. Los registros de consola y de red vienen solo de la extensión de Clips para Chrome. Clips Desktop y la aplicación web siguen grabando tu pantalla, tu cámara y tu voz, con transcripción y resumen, pero la grabación no incluirá registros del navegador.
    - q: ¿Clips es un gestor de bugs como Jira?
      a: "No. Clips crea [un reporte de bug con el que un ingeniero puede actuar](https://www.agent-native.com/articles/how-to-write-a-bug-report/), y tu gestor lo almacena: pega el enlace en Jira, GitHub, Linear o Slack. Tu agente de código o el [agente de Clips](https://www.agent-native.com/docs/template-clips-agent/) lee la propia grabación y sus registros. Eso es lo que hace de Clips una [aplicación agéntica](https://www.agent-native.com/articles/what-is-an-agent-native-app/): la inteligencia de un agente, la intuición de una aplicación."
