faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Design free?
      a: Yes, Agent-Native Design is free and open source. The agent needs an AI connection, either through Builder.io or your own AI key. Design is in alpha, so expect changes as it grows.
    - q: Can I start from my PRD or product brief?
      a: Yes. Paste the brief, or the relevant part of your product requirements doc (PRD), into the prompt box, and ask for directions if you want options. The agent keeps your terms and exact claims, and if the brief leaves out a choice that changes the design, it asks or states its assumption. Here's [what to put in a design brief](https://www.agent-native.com/articles/how-to-turn-a-design-brief-into-a-prototype-with-ai/).
    - q: Can I click through the prototype?
      a: Yes. Each screen is real HTML with working interactions, and the direction you pick gets desktop and mobile frames by default. Use **Interact** mode to try it on the canvas, or **Design Preview** to open the screen in a new browser tab.
    - q: Can I use my own design system or Figma designs?
      a: Yes. A [design system](https://www.agent-native.com/docs/template-design-features/) can come from a Figma file, your website, a GitHub repo, a design.md file or notes, and new designs follow it. You can also import a Figma frame as an editable screen, and Design lists anything it couldn't match exactly.
    - q: Is the prototype production code?
      a: No. The prototype is a starting point, and app logic, integrations, testing and deployment still need building. Export HTML or a ZIP of the files, or use **Copy agent prompt** to give a coding agent the files, design tokens and a ready prompt. Claude Code and Codex can also [open designs through Design's MCP server](https://www.agent-native.com/docs/template-design-integrations/).
    - q: How is Design different from asking a chatbot for a UI?
      a: "In Design, the agent builds the prototype on a canvas where you click through it, compare directions and edit it, and your team's comments go straight to the agent. With a chatbot, the result stays in the conversation. That makes Design an [agentic app](https://www.agent-native.com/articles/what-is-an-agent-native-app/): the brains of an agent, the intuitiveness of an app."
