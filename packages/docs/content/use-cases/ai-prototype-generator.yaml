how_to:
  heading: How to turn a brief into a prototype with AI
  steps:
    - title: Describe the screen you need
      body: "On the Design home screen, paste your brief into the prompt box: who it's for, the screen or flow, and what it has to do. Ask for three directions. If something important is missing, Design asks first."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ef31fb673e2437fb4dd6ed256a7ba9d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8209bd4f55d7432c94e05172c5475f17
        alt: Close-up of the Design home prompt box with a short brief for an expense app's onboarding flow pasted in, ending with "Show me three directions".
    - title: Pick the direction you like
      body: Design puts three directions side by side on the canvas, each a working screen in its own style. Try each one in **Interact**, choose one under **Pick a direction**, and the agent builds out the rest of it.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F137893c57370435d94967b9d5bc6a82a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fda7cdd9a2f3e42b58f44efec2b950fc9
        alt: The canvas with the three onboarding directions side by side, and the agent chat showing "Pick a direction" with a button for each direction name.
    - title: Refine it with your team
      body: Edit copy, spacing and color in the **Design** tab, or select an element and ask the agent. When a teammate pins a comment, click **Send to agent** and the agent makes that change.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F406b66f9b62e49c09f697f5d08599b5e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F566ca2f3c44f439aac2c5307c72aa572
        alt: The chosen onboarding screen with a teammate's comment pinned to the invite step, and the comment thread open in the Comments tab with the Send to agent button.
features:
  heading: Everything you need to go from brief to prototype
  items:
    - title: Clickable from the start
      body: The direction you pick becomes HTML with working interactions, in desktop and mobile frames. **Design Preview** opens it in a browser tab.
    - title: Keeps your brief's words
      body: The agent uses your terms and claims. When the brief leaves out a choice that matters, it asks you or states its assumption.
    - title: Checked before it's ready
      body: The agent runs its own accessibility and visual check on a prototype before it tells you the design is ready.
    - title: Prototypes in your brand
      body: Build a design system from a Figma file, your website or a GitHub repo, and new prototypes start in your colors and fonts.
    - title: Feedback the agent acts on
      body: A comment stays pinned to its element. The agent edits that spot, checks the change landed, then resolves the thread or asks you to decide.
    - title: Hand off to coding agents
      body: Export HTML or a ZIP of the files, or copy a ready prompt that gives your coding agent the files and design tokens.
