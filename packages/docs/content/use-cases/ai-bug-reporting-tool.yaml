app: clips
title: AI Bug Reporting Tool
seo_title: AI bug reporting tool with console and network logs
meta_description: Agent-Native Clips is a free AI bug reporting tool. Record the bug in Chrome and share one link with the console and network logs your coding agent can read.
updated: 2026-10-26
hero:
  body: Agent-Native Clips turns a recording of the bug into a report your engineer and your coding agent can act on. You show the bug in Chrome, and the page's errors and failed requests come with the link.
  button:
    label: Record a bug
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe36fd7fdff9b49bca2c6787f302964c6
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff375e2d60b2048508c23ea90a9761e08
    alt: A bug recording open in Clips, paused on a checkout page that shows an error message. The Debug tab beside the video lists a red console error and a failed request with a 500 status.
how_to:
  heading: How to report a bug with AI
  steps:
    - title: Start recording from Chrome
      body: "Click the Clips Chrome extension in your toolbar and pick the source: a browser tab, a window or your full screen. Switch your camera and microphone on or off, then click Start recording."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6996593713c74108967e120111378c14
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff7991811f7a346e0a99cf9fe81496e34
        alt: Close-up of the Clips extension popup over a web app, with Browser tab chosen as the source, the camera and microphone switched on, and the Start recording button.
    - title: Show the bug and explain it
      body: Click through the steps that break and say what you expected to happen. While you record, the extension saves the page's errors and the requests it sent, the details an engineer would otherwise dig out of Chrome's developer tools.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe01ffb73c62c427b8077f05657fdeb47
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff895d85667344971baec96eb0b2ec956
        alt: The Clips recording controls and camera bubble over a web app's checkout page, where a "Something went wrong" message appears.
    - title: Share one link
      body: When you stop, Clips copies the recording's link for you. Paste it into a ticket, a chat or your coding agent. The Agents tab in the Share menu also opens it in Claude, Claude Code or Codex directly.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F10933b64225545e1b5ecd666f5803832
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2894036362f7409d8a4961536719b399
        alt: Close-up of the Clips Share menu on its Agents tab, with Copy agent prompt and the Open in Claude, Open in Claude Code and Open in Codex buttons.
features:
  heading: Everything you need to report a bug
  items:
    - title: Made for your coding agent
      body: Paste the link into Claude Code, Cursor or Codex. The agent reads the transcript, the frames and the logs, without downloading the video.
    - title: Console and network logs
      body: Clips saves console messages, errors and requests from up to five tabs, with each request's status, timing and whether it failed.
    - title: The 30 seconds before
      body: Clips reaches back up to 30 seconds before you pressed record, so an error from while the page loaded can still make the report.
    - title: Secrets stay out
      body: Clips never saves request bodies, headers, cookies or what you type, and blanks out values that look like tokens or passwords.
    - title: Jump straight to the error
      body: In the clip's Debug tab, click the time beside an error or failed request and the video jumps to that moment.
    - title: Search every bug report
      body: Find any bug report by what was said in it, or ask the Clips agent across every recording in your library.
