faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Clips free?
      a: Yes. Agent-Native Clips is free and open source, including the Chrome extension. Titles, summaries and transcript cleanup run on Builder.io AI credits by default, so AI use isn't unlimited, and recordings need a place to store the video. Clips is in alpha, so expect changes as it grows.
    - q: What does Clips capture from my browser?
      a: The Clips Chrome extension captures [console messages, JavaScript errors and network requests](https://www.agent-native.com/docs/template-clips-features/#chrome-extension-browser-logs) from up to five tabs, reaching back up to 30 seconds before you pressed record. Each request keeps its address, status, timing and whether it failed. Editors see it all in the clip's Debug tab, and agents get it through the link.
    - q: Does Clips record passwords or private data?
      a: Clips never saves request or response bodies, headers, cookies or the text you type, and it blanks out values that look like tokens, passwords or keys. You can turn developer logs off in the extension's settings. New recordings are public by link, so set a bug report to private or your organization when it shows internal data.
    - q: How do I give a bug recording to Claude Code, Cursor or Codex?
      a: Paste the clip's link into Claude Code, Cursor or Codex, and the agent [reads the transcript, frames and browser logs](https://www.agent-native.com/docs/template-clips-integrations/#agent-readable-clips) without downloading the video. For a private clip, click Copy agent prompt on the Share menu's Agents tab, which gives the agent a link that lasts two hours. That tab also opens the clip in Claude Code or Codex.
    - q: Does Clips capture logs in other browsers or the desktop app?
      a: No. Console and network logs come only from the Clips Chrome extension. Clips Desktop and the web app still record your screen, camera and voice, with a transcript and summary, but the recording won't include browser logs.
    - q: Is Clips a bug tracker like Jira?
      a: "No. Clips makes [a bug report an engineer can act on](https://www.agent-native.com/articles/how-to-write-a-bug-report/), and your tracker stores it: paste the link into Jira, GitHub, Linear or Slack. Your coding agent or the [Clips agent](https://www.agent-native.com/docs/template-clips-agent/) gets the recording and its logs, not only a ticket's text. That's what makes Clips an [agentic app](https://www.agent-native.com/articles/what-is-an-agent-native-app/): the brains of an agent, the intuitiveness of an app."
