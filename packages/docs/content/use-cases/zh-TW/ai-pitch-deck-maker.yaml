features:
  heading: "製作與發表簡報所需的一切"
  items:
    - title: "從筆記產生募資簡報"
      body: "從一段提示、你的筆記、一份文件或上一份簡報開始。告訴 agent 你的公司和這輪募資，它就會做出簡報。"
    - title: "AI 與視覺化編輯"
      body: "你可以自己在投影片上修改文字和版面，也可以選取一行請 agent 處理。只有你指定的部分會變動。"
    - title: "每一頁都是你的品牌"
      body: "把你的顏色、字型和標誌存成設計系統，之後做的每份簡報都會有你公司的樣子。"
    - title: "圖片與標誌"
      body: "請 agent 產生圖片、找圖庫照片，或為你的成長數據頁放入客戶和合作夥伴的標誌。"
    - title: "與共同創辦人協作"
      body: "和共同創辦人與 agent 一起編輯同一份簡報，在任何一頁留言，也能還原任何先前的版本。"
    - title: "發表、分享與匯出"
      body: "搭配講者備忘稿進行簡報、分享唯讀連結給投資人，或匯出可編輯的 PowerPoint 檔案。"
