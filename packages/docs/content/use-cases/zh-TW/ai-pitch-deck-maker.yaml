faqs:
  heading: "有問題？我們來解答"
  items:
    - q: "Slides 是免費的嗎？"
      a: "是的，Agent-Native Slides 免費且開源。製作簡報需要連接 AI，可以透過 Builder.io 或你自己的 AI 金鑰；產生圖片則需要你自己的 Gemini 或 OpenAI 金鑰。Slides 目前是 alpha 版，功能會隨著發展持續調整。"
    - q: "我可以把募資簡報匯出成 PowerPoint 或 Google Slides 嗎？"
      a: "Slides 可以匯出可編輯的 PowerPoint（PPTX）檔案。若要用 Google Slides，它會給你一個 PPTX 檔案和匯入連結，由你自己在 Google Slides 中開啟。你也可以把簡報匯出成單一 HTML 檔案。"
    - q: "Slides 可以從我的筆記、文件或網站開始嗎？"
      a: "在 Slides 首頁描述你的募資內容，並附上筆記或文件，或加入你網站的連結。你也可以匯入 Google Doc、Word 檔案或 PowerPoint。如果 agent 讀不到某個 PDF 或網站，它會直接告訴你，而不是自己猜。"
    - q: "Slides 和請聊天機器人幫我寫投影片有什麼不同？"
      a: "聊天機器人給你的是文字，你得自己複製到投影片裡。在 Slides 中，agent 會在你看得到的編輯器裡做出真正的簡報。任何一頁你都能手動修改或請 agent 處理，都在同一份簡報上進行，而且每次變更都能復原。這就是 Slides 之所以是 [agentic 應用程式](https://www.agent-native.com/articles/what-is-an-agent-native-app/) 的原因：擁有 agent 的智慧，也有應用程式的直覺易用。"
    - q: "我的共同創辦人可以和我一起編輯募資簡報嗎？"
      a: "你、你的共同創辦人和 agent 可以同時編輯同一份簡報。你可以針對某一頁或其中某個部分留言。每次有實質變更前，Slides 都會先儲存一個版本，所以你隨時都能還原先前的版本。"
    - q: "一份募資簡報應該有幾頁？"
      a: "第一次提案大約十頁是不錯的長度（[募資簡報該放哪些內容](https://www.agent-native.com/articles/how-to-make-a-pitch-deck-with-ai/)），Slides 也會建議「根據這份檔案製作 10 頁面推介幻燈片」。如果你想要不同的長度，告訴 agent 即可，它會依此規劃大綱。"
