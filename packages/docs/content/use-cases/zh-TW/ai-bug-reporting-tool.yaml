faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Clips 是免費的嗎？
      a: 是的。Agent-Native Clips 免費且開源，包括 Chrome 擴充功能。標題、摘要和逐字稿清理預設使用 Builder.io AI 點數，所以 AI 用量並非無限，錄影也需要有地方儲存影片。Clips 目前是 alpha 版，功能會隨著發展持續調整。
    - q: Clips 會從我的瀏覽器擷取什麼？
      a: Clips Chrome 擴充功能會擷取最多五個分頁的[主控台訊息、JavaScript 錯誤和網路請求](https://www.agent-native.com/docs/template-clips-features/#chrome-extension-browser-logs)，並回溯到你按下錄製前最多 30 秒。每個請求都會保留它的網址、狀態、耗時和是否失敗。編輯者可以在剪輯的「偵錯」分頁看到全部內容，agent 則透過連結取得。
    - q: Clips 會錄下密碼或私人資料嗎？
      a: Clips 絕不儲存請求或回應內容、標頭、cookie 或你輸入的文字，並會遮蔽看起來像權杖、密碼或金鑰的值。你可以在擴充功能的設定中關閉開發者記錄。新的錄影預設以連結公開，所以當錯誤回報顯示內部資料時，請把它設為「私人」或「組織」。
    - q: 我要怎麼把錯誤錄影交給 Claude Code、Cursor 或 Codex？
      a: 把剪輯的連結貼到 Claude Code、Cursor 或 Codex，agent 就會[讀取逐字稿、畫面和瀏覽器記錄](https://www.agent-native.com/docs/template-clips-integrations/#agent-readable-clips)，不需要下載影片。若是私人剪輯，請在分享選單的「Agent」分頁點選「複製 Agent 提示」，它會給 agent 一個有效兩小時的連結。該分頁也能在 Claude Code 或 Codex 中開啟剪輯。
    - q: Clips 會擷取其他瀏覽器或桌面應用程式的記錄嗎？
      a: 不會。主控台和網路記錄只來自 Clips Chrome 擴充功能。Clips Desktop 和網頁版應用程式仍會錄下你的螢幕、相機和聲音，並附上逐字稿和摘要，但錄影內容不會包含瀏覽器記錄。
    - q: Clips 是像 Jira 那樣的錯誤追蹤工具嗎？
      a: 不是。Clips 製作的是[工程師能直接處理的錯誤回報](https://www.agent-native.com/articles/how-to-write-a-bug-report/)，由你的追蹤工具負責存放：把連結貼到 Jira、GitHub、Linear 或 Slack 即可。你的程式開發 agent 或 [Clips agent](https://www.agent-native.com/docs/template-clips-agent/) 會直接讀取錄影本身和它的記錄。這就是 Clips 之所以是 [agentic 應用程式](https://www.agent-native.com/articles/what-is-an-agent-native-app/) 的原因：擁有 agent 的智慧，也有應用程式的直覺易用。
