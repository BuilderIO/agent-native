title: 錄下錯誤，附上主控台與網路記錄
seo_title: 附帶主控台記錄的 AI 錯誤回報工具
meta_description: 在 Chrome 中示範錯誤，Agent-Native Clips 就會把你的錄影變成一個連結，附上頁面的錯誤訊息和失敗的請求，交給你的工程師或程式開發 agent。
updated: 2026-10-27
hero:
  body: Agent-Native Clips 把錯誤的錄影變成一個連結，讓你的工程師或程式開發 agent 直接處理。你在 Chrome 中示範錯誤，頁面的錯誤訊息和失敗的請求就會一起附上。
  button:
    label: 錄製錯誤
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe36fd7fdff9b49bca2c6787f302964c6
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff375e2d60b2048508c23ea90a9761e08
    alt: Clips 中開啟的一段錯誤錄影，停在顯示錯誤訊息的結帳頁面。影片旁的「偵錯」分頁列出一則紅色的主控台錯誤，和一筆狀態為 500 的失敗請求。
how_to:
  heading: 如何用 AI 回報錯誤
  steps:
    - title: 從 Chrome 開始錄製
      body: 點選工具列中的 Clips Chrome 擴充功能，選擇來源：瀏覽器分頁、視窗或整個螢幕。開啟或關閉你的相機和麥克風，然後點選「開始錄製」。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6996593713c74108967e120111378c14
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff7991811f7a346e0a99cf9fe81496e34
        alt: 網頁應用程式上方 Clips 擴充功能彈出視窗的特寫，來源選了「瀏覽器分頁」，相機和麥克風已開啟，並有「開始錄製」按鈕。
    - title: 示範錯誤並說明
      body: 依序點選會出錯的步驟，並說出你預期會發生什麼。錄製期間，擴充功能會儲存頁面的錯誤和它送出的請求，這些是工程師原本得從 Chrome 開發人員工具裡挖出來的細節。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe01ffb73c62c427b8077f05657fdeb47
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff895d85667344971baec96eb0b2ec956
        alt: 網頁應用程式結帳頁面上方的 Clips 錄製控制項和相機泡泡，頁面出現「出了點問題」的訊息。
    - title: 分享一個連結
      body: 停止後，Clips 會幫你複製錄影的連結。把它貼到工單、聊天或你的程式開發 agent 中。分享選單的「Agent」分頁也能直接在 Claude、Claude Code 或 Codex 中開啟。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F10933b64225545e1b5ecd666f5803832
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2894036362f7409d8a4961536719b399
        alt: Clips 分享選單「Agent」分頁的特寫，有「複製 Agent 提示」，以及「在 Claude 中開啟」、「在 Claude Code 中開啟」和「在 Codex 中開啟」按鈕。
features:
  heading: 回報錯誤所需的一切
  items:
    - title: 為你的程式開發 agent 而設計
      body: 把連結貼到 Claude Code、Cursor 或 Codex。agent 會讀取逐字稿、畫面和記錄，不需要下載影片。
    - title: 主控台與網路記錄
      body: Clips 會儲存最多五個分頁的主控台訊息、錯誤和請求，包含每個請求的狀態、耗時和是否失敗。
    - title: 按下錄製前的 30 秒
      body: Clips 會回溯你按下錄製前最多 30 秒，所以頁面載入期間發生的錯誤，也能進入回報。
    - title: 機密資料不外洩
      body: Clips 不會儲存請求內容、標頭、cookie 或你輸入的文字，並會遮蔽看起來像權杖或密碼的值。
    - title: 直接跳到錯誤
      body: 在剪輯的「偵錯」分頁中，點選錯誤或失敗請求旁的時間，影片就會跳到那一刻。
    - title: 搜尋每一份錯誤回報
      body: 依錄影中說過的內容找出任何一份錯誤回報，或請 Clips agent 在你資料庫的所有錄製內容中查找。
