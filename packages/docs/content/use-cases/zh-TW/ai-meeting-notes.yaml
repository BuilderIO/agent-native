how_to:
  heading: 如何用 AI 做會議筆記
  steps:
    - title: 連接你的行事曆
      body: 安裝 Clips Desktop，在 Clips 的設定中開啟「會議」，再到「會議」頁面連線 Google Calendar。你即將開始的會議會顯示在「議程」分頁。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F58ac771a7a8547ecbb770e5e560f8ecd
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6d5d38e3c0124bbb8a51b2d0b89582c4
        alt: 「會議」頁面「議程」分頁的特寫，列出來自 Google Calendar 的今日會議；2 分鐘後開始的那場會議旁有「加入」和「開啟筆記」按鈕。
    - title: 從提醒開始記筆記
      body: Clips Desktop 會在每場行事曆會議開始前一分鐘顯示提醒。按下提醒上的 Join 按鈕會加入通話並立即開始記筆記，按鈕的選單則可以只開始記筆記、不加入通話。接著 Clips 會擷取你的麥克風和通話的音訊。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff048f1dd0e18443d93fdeb4a4f03fada
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe58e7dd45fa3459fb1cdb3840fed0126
        alt: 每週產品同步會議的 Clips Desktop 提醒特寫。Join Meet & open Clips 按鈕的選單已展開：Join only、Start notes only 和 Snooze 5 min。
    - title: 閱讀你的筆記與行動項目
      body: 通話結束後，會議頁面會在逐字稿旁顯示你的筆記和 AI 筆記：摘要、要點，以及依與會者整理的行動項目。分享之前，請先對照逐字稿[檢查 AI 會議筆記](https://www.agent-native.com/articles/how-to-use-ai-to-take-meeting-notes/)。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0ba0a151caef41e8904d6535671c47bc
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fbdf5e7b84ab64a288c0837959eedb85b
        alt: 已結束會議的 AI 筆記窗格特寫：摘要、四個要點，以及分別歸在兩位與會者名下的行動項目。
features:
  heading: 每場會議所需的一切
  items:
    - title: 通話中沒有機器人
      body: Clips Desktop 在你自己的電腦上錄下麥克風和通話的音訊，所以在其他人眼中，這場會議跟平常沒有兩樣。
    - title: 依負責人整理的行動項目
      body: 每個行動項目都會寫明由誰負責，依據是通話中誰說了什麼。分享之前，你可以新增、編輯或移除項目。
    - title: 通話中隨時提問
      body: 會議進行時就能提問：剛才錯過了什麼、最近五分鐘的重點回顧，或是下一個適合提出的好問題。
    - title: 用說過的話搜尋
      body: 用逐字稿或筆記裡的一個詞，或是與會者的名字，就能找到會議，也可以請 agent 找出談到某件事的那場通話。
    - title: 可回溯原話的筆記
      body: 點選 AI 筆記中的任一要點，就會跳到逐字稿裡說出那句話的時間點。
    - title: 可分享的會議筆記
      body: 一個連結就能分享摘要、要點、行動項目和完整逐字稿，但不包含錄影的影像或留言。
