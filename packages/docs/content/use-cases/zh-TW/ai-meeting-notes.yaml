title: AI 會議筆記
seo_title: 不需要機器人加入通話的 AI 會議筆記
meta_description: Agent-Native Clips 是免費開源的 AI 會議筆記工具，直接在你自己的電腦上記錄：每場通話都有逐字稿、摘要和行動項目。
updated: 2026-10-26
hero:
  body: Agent-Native Clips 把你的通話變成筆記：逐字稿、摘要，以及依與會者整理的行動項目。它直接在你自己的電腦上錄製，不會有機器人加入通話，任何一場會議你都能搜尋或提問。
  button:
    label: 開始做會議筆記
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4b1f55d396c64beea49da96d9d02b38c
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F03741a45126c451e8458872aebd9f480
