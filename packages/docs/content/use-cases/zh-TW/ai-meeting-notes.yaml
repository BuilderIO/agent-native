faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Clips 是免費的嗎？
      a: 是的，Agent-Native Clips 免費且開源。摘要、標題和逐字稿清理預設使用 [Builder.io AI 點數](https://www.agent-native.com/docs/template-clips-features/)。點數用完後，這些功能就會停止，直到你加購點數或連接自己的 Gemini 金鑰。Clips 目前是 alpha 版，功能會持續調整。
    - q: 會有機器人加入我的會議嗎？
      a: 不會。Clips 從你自己的電腦做筆記：Clips Desktop 會錄下你的麥克風和通話的音訊，所以不會有任何東西加入你的 Zoom、Google Meet 或 Microsoft Teams 通話。因為沒有機器人加入，記得告訴大家你在做筆記。
    - q: Clips 支援哪些行事曆和視訊通話應用程式？
      a: Clips 只能連接 Google Calendar。筆記可用於 Zoom、Google Meet、Microsoft Teams、Webex，或任何由你的電腦播放音訊的通話。在 Mac 上，這些通話即使不在行事曆中，Clips Desktop 也能偵測到，並提議開始做筆記。其他與會者的聲音只有在 Mac 上才能擷取。
    - q: Clips 可以在 Windows 上做會議筆記嗎？
      a: Clips Desktop 可在 Mac、Windows 和 Linux 上執行，但擷取其他與會者聲音的功能只支援 Mac。在 Windows 和 Linux 上，Clips 只會錄下你的麥克風，因此遠端與會者不會出現在逐字稿和行動項目中。
    - q: Clips 和 Zoom 或 Google Meet 內建的 AI 記錄功能有什麼不同？
      a: 通話應用程式的 AI 記錄功能只限於該應用程式的通話。Clips 則把所有會議，不論來自哪個通話應用程式，都放在同一個資料庫。問 [Clips agent](https://www.agent-native.com/docs/template-clips-agent/)「Daniel 上週二承諾了什麼？」，它就會依你說過的話搜尋你的會議。這就是 [agentic 應用程式](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：擁有 agent 的智慧，也有應用程式的直覺易用。
