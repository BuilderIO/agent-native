faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Analytics 是免費的嗎？
      a: 是的，Agent-Native Analytics 免費且開源。agent 使用 Builder.io AI 點數或你自己的 AI 金鑰，所以 AI 用量並非無限。關於通話的問題也可能用到你的 Gong API 額度，管理員可以關閉這項功能。Analytics 目前是 alpha 版。
    - q: Agent-Native Analytics 可以連接哪些 CRM 和通話工具？
      a: Analytics 可連接 HubSpot 作為 CRM，連接 Gong 取得業務通話。Apollo 和 Clay 也能連接，提供聯絡人和公司資料。每個工具都[在「資料來源」頁面連接](https://www.agent-native.com/docs/template-analytics-connectors/)，各自使用自己的金鑰，一個問題就能同時用到 HubSpot 和 Gong。
    - q: 我需要會寫 SQL 嗎？
      a: 不需要。你用日常語言提問，agent 會在 HubSpot 或 Gong 中找到資料、執行查詢，並以數字、表格或圖表回答。把答案存到儀表板時，agent 會設定每個面板如何取得最新資料。
    - q: 這些數字可信嗎？
      a: 可以，但要查證：agent 根據即時的 HubSpot 和 Gong 資料回答，數字若不是來自即時查詢就會標為「Unverified」。它會遵循你團隊[在「語意層」頁面寫下的定義](https://www.agent-native.com/docs/template-analytics-dashboards/)。在依賴這些答案之前，先把最初幾個答案和 HubSpot 對照一下。
    - q: Agent-Native Analytics 和 HubSpot 或 Gong 內建的 AI 有什麼不同？
      a: HubSpot 或 Gong 的 AI 只內建在那一個工具中。Analytics 能綜合 HubSpot 和 Gong 回答同一個問題，也能讀取 Stripe 和 BigQuery，還會把答案保存成團隊每週都會打開的儀表板。你照常使用 HubSpot 和 Gong，Analytics 則從兩者讀取資料。
    - q: 誰能看到我的儀表板？
      a: 在你分享之前只有你能看到。你可以把儀表板分享給隊友或整個組織，身分可設為檢視者、編輯者或管理員。隊友透過自己的連線，或管理員為組織設定的連線，查看 HubSpot 和 Gong 資料；兩者都沒有時，那些面板會顯示錯誤。
