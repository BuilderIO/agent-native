title: 用 HubSpot 和 Gong 資料檢視銷售管道
seo_title: 適用於 HubSpot 和 Gong 的 AI 銷售分析
meta_description: 在銷售管道檢討會前，先掌握哪些交易停滯、原因為何。用日常語言詢問 Agent-Native Analytics 關於 HubSpot 和 Gong 的問題，再把答案存成儀表板。
updated: 2026-10-27
hero:
  body: Agent-Native Analytics 把 HubSpot 交易和 Gong 通話變成每次銷售管道檢討都能用的儀表板。用日常語言問哪些交易停滯、原因為何，agent 會綜合兩者回答。
  button:
    label: 詢問你的銷售管道
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe534007e491840cc86570110b7d00de4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4780c6d1885541bcaf3d949dbdbc1eb7
    alt: Analytics 中的「Weekly pipeline review」儀表板，面板包括各階段的未成交管道、各負責人的交易，以及停滯 30 天的交易。右側的 agent 對話根據 HubSpot 階段記錄和最近一次 Gong 通話，說明其中一筆交易為何停滯。
how_to:
  heading: 如何用 AI 分析銷售管道
  steps:
    - title: 連接 CRM 和通話資料
      body: 開啟 **資料來源**，在 **CRM & Sales** 底下點選 HubSpot 旁的 **連線**。貼上你在 HubSpot 設定中建立的私人應用程式權杖，再點選 **儲存憑證**。Gong 的做法相同，使用存取金鑰和密鑰。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fdeea3eb7d84048eca0f534b7b00390ee
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd918aa95f46047559b1f30c42d89d62f
        alt: 「資料來源」頁面，HubSpot 位於「已連線」底下，Gong 位於 CRM & Sales 底下。Gong 的設定面板停在 Access Key Secret 步驟，已貼上金鑰，下方是「儲存憑證」。
    - title: 詢問你的銷售管道
      body: 在 **提問** 中用日常語言提問：「哪些未成交的交易在同一個階段停留了 30 天以上？」agent 會搜尋你的 HubSpot 交易，並以可排序、可追問的表格回答。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7acaa378761c453bb79f9f246d8cab72
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe66acdb3c24e41c7b5caef3e0251b17a
        alt: 「提問」對話中詢問停滯 30 天的交易。agent 以六筆未成交交易的表格回答：階段、負責人、金額和停留天數。
    - title: 把答案存成儀表板
      body: 請 agent「把這個存成銷售管道檢討用的儀表板」。它會為每個答案建立一個面板，面板會隨 HubSpot 的新資料更新。在銷售管道檢討會之前，把儀表板分享給團隊。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F69b61731b5b74d61ad0e510f57522796
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2720d0e5fd8f40bfa3b72c056270f174
        alt: agent 對話確認已儲存「Weekly pipeline review」儀表板，旁邊是新的儀表板，有停滯交易表格和各階段管道圖表。
features:
  heading: 銷售管道檢討所需的一切
  items:
    - title: 交易和通話放在一起
      body: 一個問題就能同時取得 HubSpot 中交易的階段和負責人，以及 Gong 通話中買方說了什麼。
    - title: agent 會編輯的儀表板
      body: 要一個新面板、依負責人篩選或換一種圖表，agent 都會更新團隊共用的儀表板。
    - title: 可以查證的答案
      body: 數字若不是來自即時的 HubSpot 或 Gong 查詢，agent 會標為「Unverified」，讓你知道要檢查什麼。
    - title: 銷售管道和營收並列
      body: 再連接 Stripe 和 BigQuery，同一個對話就能在交易旁回答營收和產品使用的問題。
    - title: 你的銷售管道定義
      body: 管理員在 **語意層** 頁面寫下停滯交易或合格管道的定義，agent 回答前會先讀取。
    - title: 每日銷售管道報告
      body: 每天透過電子郵件把儀表板寄給最多五個人，或發到 Slack 頻道，不必開啟應用程式。
