faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Plan 是免費的嗎？
      a: 是的，Agent-Native Plan 免費且開源。每份計畫都以你的程式開發 agent 的一個工作階段執行，使用你選擇的模型。這會用到 agent 的 token，計畫越大用得越多。Plan 目前是 alpha 版，功能會持續調整。
    - q: Plan 支援哪些程式開發 agent？
      a: Claude Code 和 Codex 可以用外掛程式安裝。一行安裝指令也能在 Cursor、OpenCode、VS Code 的 GitHub Copilot 和 Claude Cowork 中設定 Plan。其他 MCP 主機，例如 Cline 或 Goose，可以用網址加入 Plan 的連接器。每份計畫都在你的瀏覽器中審查。
    - q: Plan 和程式開發 agent 內建的計畫模式有什麼不同？
      a: Claude Code、Codex、Cursor 或 OpenCode 的計畫模式，會在對話中以文字給你計畫。Plan 則把這份計畫，或 Markdown 檔案中的計畫，變成有圖表、檔案樹和加註解程式碼的頁面。你可以在頁面上針對確切的部分留言、回答 agent 的問題，並邀請隊友加入。
    - q: agent 在規劃時會更動我的程式碼嗎？
      a: 不會。在撰寫或修改計畫期間，Plan 的指示讓 agent 只讀取你的程式碼。你核准計畫後它才開始編輯，而且在每個主要步驟之前都會重新讀取已核准的計畫。
    - q: 隊友沒有帳號也能審查計畫嗎？
      a: 部分可以。任何拿到連結的人都能以訪客身分開啟和編輯計畫。留言、儲存和分享則需要 Agent-Native 帳號，所以想留言的隊友要先登入。
    - q: 我可以把計畫留在自己的電腦上嗎？
      a: 可以。[本機檔案模式](https://www.agent-native.com/docs/template-plan-local-and-desktop/)會把計畫以 MDX 檔案存在你的電腦上，內容不會傳到託管的應用程式。相對地，本機計畫無法分享，也不能在瀏覽器中留言，它的連結只能在你的電腦上開啟。本機檔案模式不會改變程式開發 agent 的 AI 模型在哪裡執行。
