title: 在程式開發 agent 寫程式前，先審查計畫
seo_title: Claude Code、Codex 和 Cursor 的視覺化計畫模式
meta_description: Agent-Native Plan 把程式開發 agent 的計畫變成一個可以審查的頁面，附上圖表、檔案樹和加註解的程式碼，讓你在它寫任何程式之前先看過。
updated: 2026-10-27
hero:
  body: Agent-Native Plan 把 agent 寫的計畫變成一頁圖表、檔案樹和加註解的程式碼。你可以針對任何部分留言，agent 會修改計畫，在你核准之前不會動任何程式碼。
  button:
    label: 規劃你的開發
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faad0afc668dc461f9023eeba3ba55800
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2c2e3c83e79248e69829bb38f71a6704
    alt: 在 Plan 中開啟的一份新增團隊邀請的計畫。圖表顯示邀請流程，從設定頁面經過 API 和邀請資料表，到邀請電子郵件。下方的檔案樹標出會變更的五個檔案。一位隊友給 agent 的留言釘在電子郵件步驟上。
how_to:
  heading: 如何搭配程式開發 agent 使用視覺化計畫模式
  steps:
    - title: 要求一份視覺化計畫
      body: 用[一行安裝指令](https://www.agent-native.com/docs/plan-plugin/)把 Plan 加到 Claude Code、Codex 或 Cursor。接著輸入 `/visual-plan` 和任務，agent 會讀取你的程式碼，並貼出計畫的連結。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F15e26ab97a68472a958aabf9657fdeb2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F01168fa31ed5412080d49febc37f1068
        alt: 程式開發 agent 的對話，使用者輸入 /visual-plan 和新增團隊邀請的任務。agent 列出它讀過的檔案，發布計畫，並回覆計畫的連結。
    - title: 針對要修改的地方留言
      body: 選取一個句子或圖表上的一處，寫下該怎麼改。[把留言設為](https://www.agent-native.com/docs/template-plan-review-workflow/) **代理** 交給 agent 修正，或設為 **真人** 交給隊友。也順便回答計畫中的待解問題。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8a16bd566384f4080dde591a1b30c3f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F598a137b56d149f98409ed79c024cb2b
        alt: 計畫圖表中邀請電子郵件步驟上一則新留言的特寫，「代理」與「真人」切換設為「代理」，留言已輸入。
    - title: 把留言傳給 agent
      body: 點選 **傳送給代理**，選擇 **複製給您的代理**，把留言複製成提示。貼到 agent 的對話中更新計畫。計畫沒問題後，在對話中核准，agent 就會開始開發。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0f841d0983ec4e3386d13c4c4ad7895d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F356c269c867048c392ca26ef5c5767c8
        alt: 計畫的「傳送給代理」按鈕特寫，選單已展開：「複製給您的代理」和「傳送給內嵌代理」，各附一行說明。
features:
  heading: 審查 agent 計畫所需的一切
  items:
    - title: 把做法畫成圖表
      body: 請求流程、資料模型和 API 端點都會畫出來，錯誤的端點或缺少的資料表在開發之前就一目了然。
    - title: 看出哪些檔案會變更
      body: 檔案樹和加註解的程式碼會顯示工作落在哪裡，以及每個步驟沿用了程式碼庫中的哪些部分。
    - title: 附預設答案的問題
      body: agent 無法從程式碼判斷的決定，會集中在最後的一張表單，每題都附上它建議的答案。
    - title: 從計畫模式開始
      body: 已經有來自 Claude Code、Codex 或 Markdown 檔案的計畫？`/visual-plan` 會直接用它建立頁面，不必從頭來過。
    - title: 核准之前不寫程式
      body: Plan 的指示讓 agent 在規劃期間只讀取你的程式碼。你核准計畫之後，它才會開始編輯。
    - title: 和隊友一起審查
      body: 把計畫的連結傳給隊友。他們能以訪客身分閱讀和編輯，登入 Agent-Native 帳號後就能留言。
