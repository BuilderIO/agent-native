title: 找出新使用者在哪一步流失
seo_title: 結合工作階段回放的 AI 漏斗分析
meta_description: 用日常語言問 Agent-Native Analytics 哪個註冊步驟流失最多新使用者，從你自己的事件取得漏斗，再觀看離開者的工作階段回放。
updated: 2026-10-27
hero:
  body: 問 Agent-Native Analytics 哪個註冊步驟流失最多人，agent 會用你自己的事件建立漏斗。接著觀看離開者的回放，並問 agent 原因。
  button:
    label: 找出流失點
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F55295bda356c490984f639946e838ebe
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd84d0fd7f856406e85b739ac0429b0f3
    alt: Analytics 視窗中的「Activation funnel」儀表板。漏斗有四個步驟：Signed up、Created a project、Connected a data source 和 Invited a teammate。每個步驟顯示人數、占註冊人數的比例，以及相較前一步的流失，最大的流失在 Created a project。旁邊的 agent 對話說明上週的註冊者停在哪裡。
how_to:
  heading: 如何用 AI 做漏斗分析
  steps:
    - title: 詢問新使用者停在哪裡
      body: 把註冊事件匯入 Analytics。在 **提問** 中提問，agent 會撰寫 SQL，並加入一個[漏斗面板](https://www.agent-native.com/docs/template-analytics-dashboards/)，顯示每個步驟的人數和流失。試試看：「在我的 Activation funnel 儀表板加一個漏斗：上週的註冊者停在哪裡？」
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa752431cecb8420c88d3d6a8f7980ea9
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F16ab210c27504ed1b71c37ebdabea744
        alt: agent 對話中的這則請求和 agent 的回覆，旁邊是它加入的漏斗。各步驟為 Signed up 1,240、Created a project 612、Connected a data source 418 和 Invited a teammate 302，各自顯示流失。
    - title: 找出中途停下的人
      body: 在 Analytics 設定中開啟「工作階段篩選」。在 **工作階段** 中開啟 **事件**。流失前的步驟選 **做過**，例如「signed_up」；他們沒走到的步驟選 **沒做過**，例如「project_created」。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F327bf36c28ab452da87cf4f4dc65debe
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F49b79e0de78041bb93444ec4d24ce11a
        alt: 「工作階段」頁面的特寫，「事件」篩選器已開啟，signed_up 設為「做過」，project_created 設為「沒做過」。下方是篩選後的新使用者工作階段清單，各自顯示長度、頁面和憤怒點擊次數。
    - title: 問 agent 工作階段裡發生了什麼
      body: 開啟回放，觀看頁面、點擊和網路請求。點選 **詢問代理**，問「這個工作階段發生了什麼事？」agent 會整理出錯誤、重複點擊，以及這個人看過的頁面。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7e0b3a4750a143f6bcd609e1c5460fd2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe44e9321e80d4c3f826bd7b25fa54025
        alt: 一位新使用者在建立專案頁面的回放，旁邊是 agent 的回答。這個人輸入了專案名稱，點了三次 Create project。每次對專案 API 的請求都失敗，於是他離開了。
features:
  heading: 找出並修正流失所需的一切
  items:
    - title: 跳過不等於流失
      body: 告訴 agent 哪些步驟可以跳過，漏斗就會把跳過的人和在那裡離開應用程式的人分開顯示。
    - title: 用你自己的事件名稱
      body: 管理員在 **語意層** 頁面描述你的事件和指標，agent 在每次查詢中都使用這些確切的名稱。
    - title: 看到失敗的請求
      body: 在回放中開啟 **開發工具**，查看主控台和網路請求，並直接跳到請求失敗的那一刻。
    - title: 給 agent 的去敏回放
      body: 外部 agent 取得的是回放的主控台和網路記錄，錯誤優先，絕不包含錄影本身。連結兩小時後失效。
    - title: 預設保護隱私
      body: 每段回放都會遮蔽輸入內容，頁面的其他部分要隱藏哪些也由你決定。
    - title: 每天收到漏斗
      body: 請 agent 每天在你指定的時間寄出漏斗儀表板，透過電子郵件寄給最多五個人，或發到 Slack。
