faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Analytics 是免費的嗎？
      a: 是的，Agent-Native Analytics 免費且開源。你可以使用託管的應用程式，或[自行架設一份](https://www.agent-native.com/docs/template-analytics/)。資料由你提供：你自己的事件，或你連接的工具。Analytics 目前是 alpha 版，功能會持續調整。
    - q: 我需要懂 SQL 嗎？
      a: 不需要。用日常語言提問，agent 會撰寫並執行 SQL，再以圖表、表格或數字回答。想檢查時，可以請它顯示查詢。熟悉你資料的人可能需要先[連接資料來源](https://www.agent-native.com/docs/template-analytics-connectors/)。
    - q: 工作階段回放從哪裡來？
      a: 來自你自己的網頁應用程式。在 **資料來源** 建立一組公開金鑰，再把 **工作階段** 頁面上的簡短追蹤程式碼加到你的應用程式，並開啟工作階段回放。接著連接存放錄影的儲存空間：Builder.io 或你自己的 S3 bucket。[回放](https://www.agent-native.com/docs/template-analytics-monitoring-and-sessions/)預設只錄製已登入的使用者。
    - q: 工作階段回放會錄下什麼？
      a: 回放會重現頁面、點擊和捲動、主控台輸出和網路請求。輸入內容預設會遮蔽，標示為密碼或信用卡資料的欄位則絕不擷取。要隱藏其他部分，就在頁面的那個部分加上一個 class。
    - q: 我可以使用 PostHog、Amplitude 或 Mixpanel 的資料嗎？
      a: 可以。在 **資料來源** 連接它們，就能詢問你在那裡追蹤的事件，agent 會替你查詢每個工具。工作階段回放只來自 Analytics 自己的追蹤，所以要把它加到你的應用程式，才能觀看中途停下的人。
    - q: Analytics 和我的分析工具內建的 AI 有什麼不同？
      a: 分析工具的 AI 只處理該工具的資料。Analytics 的 agent 能跨越你連接的所有來源，找出那些中途停下的人的回放，並解說任何一段，或交給你的程式開發 agent。它也是開源的。這就是 [agentic 應用程式](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：擁有 agent 的智慧，也有應用程式的直覺易用。
