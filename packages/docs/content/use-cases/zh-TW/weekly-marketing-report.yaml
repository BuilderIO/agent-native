faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Analytics 是免費的嗎？
      a: 是的，Agent-Native Analytics 免費且開源。你連接自己的 Google Analytics 和 HubSpot 帳號。開始使用時，你可以為 agent 選擇免費的 Builder.io AI 點數或自己的 AI 模型金鑰，所以 AI 用量有上限。Analytics 目前是 alpha 版，功能會持續調整。
    - q: 我可以連接哪些行銷資料來源？
      a: Agent-Native Analytics 可連接 Google Analytics (GA4)、HubSpot、提供關鍵字排名和搜尋量的 DataForSEO，以及提供貼文互動的 X。它也能連接 BigQuery、Amplitude、Mixpanel、PostHog 和 Stripe。每個來源都需要各自的憑證，Google Analytics 則需要 Google Cloud 服務帳戶。
    - q: Agent-Native Analytics 可以每週一寄出報告嗎？
      a: 目前還不能每週排程。[儀表板電子郵件報告](https://www.agent-native.com/docs/template-analytics-dashboards/)每天在你選的時間和時區寄出，對象最多五個電子郵件地址、一個 Slack 頻道，或兩者都有。週一開會前，在 **電子郵件報告** 中點選 **立即傳送**，就能寄出最新的儀表板。
    - q: 我需要懂 SQL 嗎？
      a: 不需要。你用一般的話提問，agent 會選擇來源並撰寫查詢。想檢查時，可以請 agent 顯示任何答案背後的查詢。
    - q: 這些數字可信嗎？
      a: agent 給你數字之前，會先對你的資料執行即時查詢，沒有執行查詢的數字會標為「Unverified」。不過，第一週的報告寄給團隊之前，還是先和 Google Analytics 和 HubSpot 對照一下。
    - q: Agent-Native Analytics 和 GA4、HubSpot 的報表有什麼不同？
      a: Google Analytics 和 HubSpot 各自只報告自己的資料。Agent-Native Analytics 用一般的話回答橫跨兩者的問題，並把答案保存成一個儀表板，你只要提問就能繼續調整。這就是 [agentic 應用程式](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：擁有 agent 的智慧，也有應用程式的直覺易用。
