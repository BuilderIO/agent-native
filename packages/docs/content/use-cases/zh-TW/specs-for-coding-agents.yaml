faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Content 是免費的嗎？
      a: 是的，Agent-Native Content 免費且開源。程式開發 agent 用它自己的模型讀取和編輯規格，所以會計入 agent 的用量。Content 內建的 agent 使用 Builder.io 點數或你自己的模型金鑰。Content 目前是 alpha 版，功能會持續調整。
    - q: 哪些程式開發 agent 可以讀取我的規格？
      a: Claude Code 和 Codex 從 **分享** 開啟頁面，只需連接一次。Cursor 和 VS Code 的 GitHub Copilot 可在同一處一鍵加入 Content。Claude Cowork、Goose 和 OpenCode 從終端機連接，任何支援登入的 MCP 用戶端都能[用網址連接 Content](https://www.agent-native.com/docs/external-agents/#private-content-links)。每個 agent 只看得到你帳號能看到的內容。
    - q: 這和放在程式碼庫裡的規格檔有什麼不同？
      a: 程式碼庫裡的規格檔是一份副本，通常只有寫程式的人會去編輯。在 Content 中，團隊撰寫和留言的頁面，就是程式開發 agent 讀取的那一頁，而 agent 的修改會以建議的形式出現。如果你也想在程式碼庫中保留 Markdown，Content 可以[與本機資料夾同步](https://www.agent-native.com/docs/template-content-sync/)。
    - q: 程式開發 agent 可以修改規格嗎？
      a: 可以，權限與你的帳號相同。請它提出修改建議，在你逐一接受之前，頁面都不會變動。它也能直接編輯頁面，但如果頁面在 agent 讀取後有過變更，Content 會拒絕這次編輯。[版本記錄](https://www.agent-native.com/docs/template-content-editing/)會保留較早的版本。
    - q: 我可以把規格保留在程式碼庫中嗎？
      a: 可以。在 Content 中連接一個[本機 Markdown 或 MDX 資料夾](https://www.agent-native.com/docs/template-content-local-files/)，就能拉取、檢查或推送變更，或用一行指令從程式碼庫啟動 Content。衝突會列出來讓你審查。瀏覽器無法自行讀取本機檔案，所以這需要本機的 Content 應用程式或 Agent-Native Desktop。
