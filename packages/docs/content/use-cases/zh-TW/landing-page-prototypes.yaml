other_uses:
  heading: 你還能用 Agent-Native Design 做的其他事
  cards:
    - title: 把需求說明變成可點擊的原型
      url: https://www.agent-native.com/use-cases/ai-prototype-generator/
      body: 根據設計需求說明，為新畫面或產品流程做出原型，再和團隊一起點擊試用。
faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Design 是免費的嗎？
      a: 是的，Agent-Native Design 免費且開源。製作頁面需要 AI 連線，可以透過 Builder.io AI 點數或你自己的 AI 金鑰，所以 AI 用量並非無限。Design 目前是 alpha 版，功能會隨著發展持續調整。
    - q: Design 會發布或託管我的到達頁嗎？
      a: 不會。Design 負責製作並匯出到達頁，你再用現有的工具部署。下載 HTML 或檔案的 ZIP，或複製一段提示，讓你的程式開發 agent 把頁面加到網站上。
    - q: 我可以使用自己的品牌嗎？
      a: 可以。從 Figma 檔案、你的網站、GitHub repo 或上傳的檔案建立設計系統，開始製作頁面時選擇它。agent 做的每個版本都會沿用它的顏色、字型和樣式。
    - q: AI 做好到達頁之後，我還能編輯嗎？
      a: 可以。在頁面上手動修改文字、顏色、間距和版面，或請 agent 修改某個區塊。你隨時都能從 **版本記錄** 還原較早的版本。
    - q: 匯出到達頁時會得到什麼？
      a: "**下載 HTML** 會給你一個在任何瀏覽器都能開啟、透過網路載入樣式的檔案。**下載 ZIP** 包含頁面的所有檔案，**下載用於 Figma 的 SVG** 則提供可在 Figma 中編輯的圖層。文件中列出了[所有匯出選項](https://www.agent-native.com/docs/template-design-features/#export)。"
    - q: Design 和請聊天機器人做到達頁有什麼不同？
      a: 聊天機器人給你的是程式碼，得先貼到某個地方才看得到頁面。在 Design 中，agent 在你看得到、點得到的編輯器裡做出頁面，而且有好幾個版本。你可以手動修改或透過提問修改，都在同一個頁面上。這就是 [agentic 應用程式](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：擁有 agent 的智慧，也有應用程式的直覺易用。
