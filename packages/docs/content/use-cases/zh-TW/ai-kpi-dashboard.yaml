faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Analytics 是免費的嗎？
      a: 是的，Agent-Native Analytics 免費且開源。agent 使用 Builder.io AI 點數或你自己的模型金鑰，每個資料來源也需要各自的憑證，例如 Stripe 密鑰。Analytics 目前是 alpha 版，畫面和功能仍可能調整。
    - q: Analytics 可以從哪些工具取得我的 KPI？
      a: Analytics 可連接 Stripe、HubSpot、PostHog、Mixpanel、Amplitude、Google Analytics (GA4)、BigQuery，以及十幾種其他來源。每個來源都在[「資料來源」頁面](https://www.agent-native.com/docs/template-analytics-connectors/)用各自的金鑰加入，一個儀表板可以混用多個來源。
    - q: 建立 KPI 儀表板需要懂 SQL 嗎？
      a: 不需要。你用日常語言描述儀表板或提問，agent 會撰寫 SQL。每張圖表背後的查詢都看得到，熟悉你資料的人可以檢查或修改。
    - q: 我怎麼知道數字是對的？
      a: 儀表板上的每個數字，都來自 agent 對你連接的資料執行的查詢，任何圖表背後的查詢和記錄都能打開來看。agent 無法執行查詢時，會把數字標為「Unverified」。在依賴儀表板之前，先拿幾個數字和 Stripe 對照一下。
    - q: 誰能看到我的 KPI 儀表板？
      a: 在你分享之前只有你能看到。你可以把[儀表板分享](https://www.agent-native.com/docs/sharing/)給隊友或整個組織，身分可設為檢視者、編輯者或管理員。你調整的篩選條件只對你生效；要分享它們，請儲存檢視或傳送連結。
    - q: Analytics 和我的分析工具內建的 AI 有什麼不同？
      a: 單一分析工具內建的 AI 助理，只處理該工具的資料。Analytics 能跨越 Stripe、你的 CRM 和產品資料，它的 agent 還會建立和編輯你正在看的儀表板，讓答案變成你能保留的面板。這就是 Analytics 之所以是 [agentic 應用程式](https://www.agent-native.com/articles/what-is-an-agent-native-app/) 的原因：擁有 agent 的智慧，也有應用程式的直覺易用。
