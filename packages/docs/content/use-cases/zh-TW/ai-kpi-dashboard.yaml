title: 為你的新創公司打造 KPI 儀表板
seo_title: 給新創創辦人的 AI KPI 儀表板
meta_description: 描述你追蹤的指標，Agent-Native Analytics 就會用 Stripe、HubSpot 和產品資料建立新創公司的 KPI 儀表板，並告訴你哪些數字有變動。
updated: 2026-10-27
hero:
  body: Agent-Native Analytics 用 Stripe、HubSpot 和產品資料，把 MRR、流失率和註冊數放進同一個儀表板。描述你追蹤的指標，agent 就會建好，並說明數字變動的原因。
  button:
    label: 建立你的儀表板
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb23d4e197c9841e7b0eeaefc15090443
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F260764ee953f4b4f80f6a6cf631b2143
    alt: Analytics 中一家新創公司的 KPI 儀表板，MRR、流失率、新註冊數和啟用率卡片下方是每月 MRR 和註冊數圖表。agent 側邊欄回答本季是哪個方案帶動了 MRR 成長，並附上依方案分列的表格。
how_to:
  heading: 如何用 AI 建立 KPI 儀表板
  steps:
    - title: 連接營收和產品資料
      body: 在 **資料來源** 頁面貼上你的 Stripe 密鑰，再加入 HubSpot 和你使用的產品分析工具。從來源的選單中選擇 **測試連線**，確認 Analytics 能讀取。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ea7e1568d3b4afd9fc6a2a01bc969b0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F78b97b8d077644f28c627377157f1331
        alt: 「資料來源」頁面上 Stripe 的特寫，標示為「已連線」，密鑰已設定，測試連線後顯示「Connection successful」。
    - title: 描述你想要的儀表板
      body: 點選 **新儀表板**，描述你追蹤的 [SaaS 指標](https://www.agent-native.com/articles/what-should-a-saas-metrics-dashboard-include/)，例如「Stripe 的 MRR 和流失率、PostHog 的新註冊數和啟用率，按月呈現」。agent 可能會先問幾個問題，再建立每個面板並開啟儀表板。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fca8b7f3746ca419383e042cc0c142271
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb167e98f0ac049fa8ad4b169e8f77ec9
        alt: 從側邊欄「儀表板」清單開啟的「新儀表板」方塊特寫，已輸入一段新創公司 KPI 儀表板的描述。
    - title: 問問數字為什麼變動
      body: 從圖表的選單中選擇 **與面板聊天** 並提問，例如「為什麼九月的流失率上升？」agent 會根據你連接的資料回答，你要求時也會在儀表板加上面板。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9b18fbf5a7cd4b4ba65d9efede75538b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9edee9cd613741e2ba670e414be767c7
        alt: 每月流失率面板，旁邊是 agent 對話。被問到九月流失率為何上升時，agent 依方案拆解這次上升：Starter 方案的流失率幾乎翻倍。
features:
  heading: 追蹤新創公司 KPI 所需的一切
  items:
    - title: 營收、銷售管道和使用量一起看
      body: Stripe 的 MRR、HubSpot 的交易，以及 PostHog 或 Mixpanel 的註冊數，並列在同一個儀表板。
    - title: 手動編輯或直接詢問
      body: 自己調整篩選條件，或請 agent 加一個新面板。兩者都會落在同一個儀表板，歷史記錄可還原任何較早的版本。
    - title: 每個數字背後的查詢
      body: 點選圖表上的任一點，就能看到背後的記錄、找出它們的 SQL，並下載 CSV。
    - title: 你對 MRR 的定義
      body: 在 **語意層** 頁面寫下公司如何計算 MRR 或活躍使用者。agent 撰寫查詢前會先查看。
    - title: 分享之前只有你看得到
      body: 新的儀表板只屬於你。準備好後，再分享給共同創辦人或整間公司，可設為檢視或編輯。
    - title: 用電子郵件收 KPI
      body: 數字會自己送上門：每天早上在你選的時間，以電子郵件把儀表板寄給最多五個人。
