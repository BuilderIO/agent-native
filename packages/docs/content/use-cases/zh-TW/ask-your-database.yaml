how_to:
  heading: 如何用日常語言向資料庫提問
  steps:
    - title: 連接你的資料倉儲
      body: 在 **資料來源** 頁面開啟 BigQuery。上傳具備 BigQuery Data Viewer 和 BigQuery Job User 角色的服務帳戶 JSON 金鑰，輸入你的專案 ID，再點選 **儲存憑證** 和 **測試連線**。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F62008ebd98594f02b1c0bf3ae565ef49
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb01d428bca15467eb4c04299dd9575b8
        alt: 「資料來源」頁面上 BigQuery 卡片的特寫，標示為「已連線」，專案 ID 和服務帳戶標示為已設定，並顯示「Connection successful」。
    - title: 用日常語言提出問題
      body: 在 **提問** 中，像問同事一樣輸入問題：「上週各方案分別有多少帳號註冊？」agent 會找到合適的資料表、執行查詢，並以圖表回答。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3e9ac5b30a924dab9b09bc76ed24b2de
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F31c48c5ccc9247b792c00474b01f97b0
        alt: 「提問」對話的特寫。agent 搜尋了 BigQuery 結構描述，執行一次查詢，並以 723 筆註冊和依方案分列的長條圖回答。
    - title: 把答案保留在儀表板上
      body: 請 agent「把這個加到儀表板」。它會建立面板、確認 SQL 能執行，然後儲存儀表板。在你分享給隊友或整個組織之前，儀表板只有你看得到。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F957858f8613241a2b2249d88430b3cc4
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd0111e9f420149fc8a35cad845ad8e2e
        alt: 新的「每週註冊數」儀表板，含依方案的註冊數面板和每週註冊數圖表。旁邊的 agent 對話表示兩個面板都已對照 BigQuery 檢查過。
features:
  heading: 從資料庫取得答案所需的一切
  items:
    - title: 每個答案背後的 SQL
      body: 在任何儀表板圖表上開啟 **檢視 SQL**，或在對話中詢問，就能看到 agent 撰寫的查詢，並複製下來自己執行。
    - title: 團隊的指標定義
      body: 管理員在 **語意層** 頁面寫下「活躍」或「註冊」的意思。agent 撰寫 SQL 前會先讀取。
    - title: 無法變更資料的查詢
      body: 在 BigQuery 中，agent 的 SQL 無法插入、更新或刪除資料，而且它透過只能讀取資料表和執行查詢的服務帳戶連線。
    - title: agent 幫你編輯的儀表板
      body: 在對話中要求再加一個面板、篩選條件或依方案細分，agent 就會為你分享過的所有人更新儀表板。
    - title: 跨工具提問
      body: 一個問題就能結合資料倉儲中的資料表與 Stripe 營收、HubSpot 交易或 PostHog 事件。
    - title: 寄到收件匣的儀表板
      body: 每天在你選的時間以電子郵件收到儀表板，圖表和表格直接放在郵件裡，最多可寄給五個人。
