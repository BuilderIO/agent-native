faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Analytics 是免費的嗎？
      a: 是的，Agent-Native Analytics 免費且開源。你可以使用代管的應用程式，或自行執行一份。agent 需要透過 Builder.io 或你自己的模型金鑰連接 AI，所以 AI 用量並非無限。Analytics 目前是 alpha 版，仍可能有所調整。
    - q: 我需要懂 SQL 嗎？
      a: 不需要。你用日常語言提問，agent 會撰寫 SQL。可能需要熟悉資料的人先[連接 BigQuery](https://www.agent-native.com/docs/template-analytics-connectors/)。管理員可以在 **語意層** 頁面加入你們的[指標定義](https://www.agent-native.com/docs/template-analytics-dashboards/)，讓 agent 選對資料表和欄位。
    - q: 支援 Postgres、Supabase 或 Neon 嗎？
      a: 支援 Supabase 或 Neon 上的 Postgres。從對話的 + 選單[透過 MCP](https://www.agent-native.com/docs/mcp-clients/) 連接，再在對話中提問。這些答案只會留在對話裡，因為儀表板面板還無法查詢 Postgres。其他 Postgres 資料庫目前還無法查詢，所以本頁步驟使用 BigQuery。
    - q: agent 會變更我的資料嗎？
      a: 在 BigQuery 中不會。Analytics 會拒絕 agent 在那裡插入、更新、刪除或清除資料的任何查詢。設定時也要求使用唯讀角色的服務帳戶，它能讀取資料表和執行查詢，但不能變更資料。透過 Supabase 或 Neon，agent 能做的就是你允許該連線做的事。
    - q: 我怎麼知道答案是對的？
      a: 檢查背後的查詢。請 agent 顯示它的 SQL，或在儀表板圖表上開啟 **檢視 SQL**。你也可以問它用了哪些資料表和篩選條件。沒有執行即時查詢時，agent 會把數字標為 **Unverified**。
    - q: 這和把 CSV 匯出後問 ChatGPT 有什麼不同？
      a: 聊天助理根據你匯出的檔案回答，所以每個新問題都得重新匯出。Analytics 直接查詢你的資料倉儲、使用團隊的指標定義，並把你還會用到的答案保留在儀表板上。這就是 [agentic 應用程式](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：擁有 agent 的智慧，也有應用程式的直覺易用。
