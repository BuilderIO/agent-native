faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Design 是免費的嗎？
      a: 是的，Agent-Native Design 免費且開源。agent 需要 AI 連線，可以透過 Builder.io 或你自己的 AI 金鑰。Design 目前是 alpha 版，功能會隨著發展持續調整。
    - q: 我可以從 PRD 或產品需求說明開始嗎？
      a: 可以。把需求說明，或產品需求文件（PRD）中相關的部分貼到提示框；想要多個選項的話，就請它提出幾個方向。agent 會保留你的用語和確切主張；如果需求說明漏掉會影響設計的選擇，它會問你或說明它的假設。這裡有[設計需求說明該寫些什麼](https://www.agent-native.com/articles/how-to-turn-a-design-brief-into-a-prototype-with-ai/)。
    - q: 原型可以點擊操作嗎？
      a: 可以。每個畫面都是有實際互動的真正 HTML，你選的方向預設會有桌面版和行動版畫框。用 **互動** 模式在畫布上試用，或用 **Design 預覽** 在新的瀏覽器分頁中開啟畫面。
    - q: 我可以使用自己的設計系統或 Figma 設計嗎？
      a: 可以。[設計系統](https://www.agent-native.com/docs/template-design-features/)可以來自 Figma 檔案、你的網站、GitHub repo、design.md 檔案或筆記，新的設計都會遵循它。你也可以把 Figma 畫框匯入成可編輯的畫面，Design 會列出無法完全對應的部分。
    - q: 原型是正式上線用的程式碼嗎？
      a: 不是。原型是一個起點，應用程式邏輯、整合、測試和部署仍需要開發。匯出 HTML 或檔案的 ZIP，或用 **複製代理提示** 把檔案、設計權杖和現成提示交給程式開發 agent。Claude Code 和 Codex 也能[透過 Design 的 MCP 伺服器開啟設計](https://www.agent-native.com/docs/template-design-integrations/)。
    - q: Design 和請聊天機器人做 UI 有什麼不同？
      a: 在 Design 中，agent 在畫布上做出原型，你可以點擊操作、比較方向並編輯，團隊的留言也會直接送到 agent。用聊天機器人的話，結果只留在對話裡。這就是 Design 之所以是 [agentic 應用程式](https://www.agent-native.com/articles/what-is-an-agent-native-app/) 的原因：擁有 agent 的智慧，也有應用程式的直覺易用。
