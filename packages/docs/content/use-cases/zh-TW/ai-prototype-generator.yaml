how_to:
  heading: 如何用 AI 把需求說明變成原型
  steps:
    - title: 描述你需要的畫面
      body: 在 Design 首頁把需求說明貼到提示框：給誰用、哪個畫面或流程，以及它要做到什麼。請它提出三個方向。如果缺少重要資訊，Design 會先問你。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ef31fb673e2437fb4dd6ed256a7ba9d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8209bd4f55d7432c94e05172c5475f17
        alt: Design 首頁提示框的特寫，貼上了一段報帳應用程式新手引導流程的簡短需求說明，結尾是「Show me three directions」。
    - title: 選出你喜歡的方向
      body: Design 會把三個方向並排在畫布上，每個都是風格各異、可實際操作的畫面。在 **互動** 中逐一試用，在 **選取方向** 中選一個，agent 就會把其餘部分做完。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F137893c57370435d94967b9d5bc6a82a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fda7cdd9a2f3e42b58f44efec2b950fc9
        alt: 畫布上並排的三個新手引導方向，agent 對話顯示「選取方向」，每個方向名稱各有一個按鈕。
    - title: 和團隊一起細修
      body: 在 **設計** 分頁編輯文案、間距和顏色，或選取一個元素請 agent 修改。隊友釘上留言後，點選 **傳送給代理**，agent 就會做出那項修改。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F406b66f9b62e49c09f697f5d08599b5e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F566ca2f3c44f439aac2c5307c72aa572
        alt: 選定的新手引導畫面，一則隊友的留言釘在邀請步驟上，「留言」分頁中開著這則留言的討論串，並有「傳送給代理」按鈕。
features:
  heading: 從需求說明到原型所需的一切
  items:
    - title: 一開始就能點擊
      body: 你選的方向會變成有實際互動的 HTML，放在桌面版和行動版畫框中。**Design 預覽** 會在瀏覽器分頁中開啟它。
    - title: 保留需求說明的用詞
      body: agent 會沿用你的用語和主張。需求說明漏掉重要的選擇時，它會問你，或說明它的假設。
    - title: 完成前先檢查
      body: 在告訴你設計完成之前，agent 會先對原型執行自己的無障礙和視覺檢查。
    - title: 符合品牌的原型
      body: 從 Figma 檔案、你的網站或 GitHub repo 建立設計系統，新的原型就會以你的顏色和字型開始。
    - title: agent 會處理的意見
      body: 留言會釘在對應的元素上。agent 修改那個位置，確認修改到位，再解決討論串，或請你決定。
    - title: 交給程式開發 agent
      body: 匯出 HTML 或檔案的 ZIP，或複製一段現成的提示，把檔案和設計權杖交給你的程式開發 agent。
