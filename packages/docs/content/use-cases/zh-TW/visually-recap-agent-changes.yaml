how_to:
  heading: 如何用視覺化方式回顧 agent 的變更
  steps:
    - title: 請 agent 產生回顧
      body: 用[一行安裝指令](https://www.agent-native.com/docs/template-plan/#install)把 Plan 加到你的程式開發 agent。在 agent 做出變更的那個對話中執行 `/visual-recap`，再開啟它回傳的連結。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F060c82d850f34b3096f166c04ead386c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F287f076a9ec84124a0afc7fbaeda2ece
        alt: 程式開發 agent 的對話，已送出「/visual-recap of everything you changed in this thread」，agent 回覆了已發布回顧的連結。
    - title: 先用圖像看懂變更
      body: 從前後對照線框圖、標示出的資料變更和變更檔案地圖看起。接著開啟 **Key changes**，每個重要檔案都有自己的分頁，附並排 diff 和說明。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff15296c5ef824f5ead19d6e64de1388f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faf5572fc8bbd4962972bfc0b24cf2bc0
        alt: 「成員」頁面的前後對照線框圖，變更後多了「邀請」按鈕和一筆待處理的邀請。旁邊的資料模型把新的邀請資料表標為新增，把成員的角色欄位標為修改，從文字改成固定的角色清單。
    - title: 把留言傳給 agent
      body: 在任何文字或線框圖的某一處留下[審查留言](https://www.agent-native.com/docs/template-plan-review-workflow/)。點選 **傳送給代理**，選擇 **複製給您的代理**，把提示貼到程式開發 agent，它會做出修改並解決你的留言。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2256a69fdcd542a18a14a292050ff391
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2b4a48126c4f45c39c0b6f0389673387
        alt: 一則給 agent 的留言釘在變更後線框圖的「邀請」按鈕上，要求只對管理員顯示。「傳送給代理」選單已展開，有「複製給您的代理」和「傳送給內嵌代理」。
features:
  heading: 視覺化回顧所需的一切
  items:
    - title: 先看畫面，再看程式碼
      body: 變更涉及 UI 時，回顧會先呈現前後對照線框圖，讓你先看到使用者會看到的樣子。
    - title: 標示出資料變更
      body: 結構描述和 API 的變更會把每個欄位標為新增、變更、移除或重新命名，並把舊型別和新型別並列。
    - title: 每個變更檔案都在地圖上
      body: 檔案樹列出這次變更動到的每個檔案，標上新增、修改、移除或重新命名，並說明改了什麼。
    - title: 加註解的關鍵 diff
      body: 三到八個關鍵檔案有並排 diff，各附一行摘要，並註明值得你留意的程式碼行。
    - title: 涵蓋整個對話
      body: 工作完成後在對話中執行 `/visual-recap`，回顧會涵蓋 agent 在那裡做的所有事，從第一個變更到最後的修正。
    - title: 和團隊一起審查
      body: 分享回顧的連結：訪客不需帳號就能開啟，登入後即可留言。也可以匯出為 HTML、Markdown 或 JSON 保留一份副本。
