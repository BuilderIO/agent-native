faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Plan 是免費的嗎？
      a: 是的，Agent-Native Plan 免費且開源。每次視覺化回顧都會在你選擇的模型上執行完整的 agent 工作階段，所以變更越大，用掉的模型用量越多。Plan 目前是 alpha 版，功能會持續調整。
    - q: 哪些變更值得做視覺化回顧？
      a: 較大的變更值得做視覺化回顧：橫跨多個檔案，或動到資料結構描述、API 或應用程式整體架構的變更。如果只是單一檔案的小改動，直接看 diff 會比等回顧更快。
    - q: 視覺化回顧和直接看 diff 有什麼不同？
      a: diff 會逐檔列出每一行變更。視覺化回顧則從這次變更做了什麼開始：以線框圖呈現它改動的畫面、它變更的資料欄位，以及相關檔案的地圖。接著只顯示值得閱讀的 diff，並附上說明。
    - q: Plan 支援哪些程式開發 agent？
      a: 安裝指令會在 Claude Code、Codex、Cursor、OpenCode、VS Code 的 GitHub Copilot 和 Claude Cowork 中設定 Plan，並幫你登入。Plan 也能透過託管的連接器，在 Cline、Goose 和其他可連接 MCP 伺服器的 agent 中使用。
    - q: 每個 pull request 都能有回顧嗎？
      a: 可以。[PR Visual Recap GitHub Action](https://www.agent-native.com/docs/pr-visual-recap/) 會在每次 push 時，用你自己的 API 金鑰執行 Claude Code、Codex 或任何相容 OpenAI 的模型。它會在 pull request 上維持一則持續更新的留言，附上回顧的螢幕截圖，而且絕不會阻擋合併。超過約 600 KB 的 diff 會被截斷。
    - q: 誰能看到我的回顧？
      a: 預設只有登入你組織的人能開啟回顧；設為私人則只有你能看。使用 GitHub Action 時，看得到 pull request 的人都能看到回顧的螢幕截圖。[本機檔案模式](https://www.agent-native.com/docs/template-plan-local-and-desktop/)讓回顧不經過託管的應用程式，不過你的 agent 模型仍在原本的地方執行。
