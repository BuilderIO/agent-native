title: 和程式開發 agent 一起規劃新畫面
seo_title: Claude Code、Codex 和 Cursor 的 UI 規劃
meta_description: 用 Agent-Native Plan，你和程式開發 agent 以應用程式的真實版面，逐一狀態把畫面規劃成線框圖。留言後它會修改，再動手開發。
updated: 2026-10-27
hero:
  body: 有了 Agent-Native Plan，程式開發 agent 會在應用程式的真實版面中，把新畫面的每種狀態畫成線框圖。針對要改的地方留言，agent 會先重畫計畫再開發。
  button:
    label: 規劃一個畫面
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4f78a2d9f380427bb3da0723b14fcbe4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8547890f69d44a0bb7e9d9d05246850a
    alt: Plan 中一份新「Invoices」畫面的計畫。三個手繪風格的畫框並排：發票清單、空白狀態和付款失敗錯誤，每個都位於帳務應用程式本身的側邊欄和工具列中。一則留言釘在清單的狀態篩選器上，書面計畫從下方開始。
how_to:
  heading: 如何在程式開發 agent 開發前先畫出畫面線框圖
  steps:
    - title: 請 agent 規劃畫面
      body: 用[一行安裝指令](https://www.agent-native.com/docs/plan-plugin/)把 Plan 加到 Claude Code、Codex、Cursor、OpenCode 或 GitHub Copilot，然後輸入 `/visual-plan` 並描述你要的畫面。程式開發 agent 會讀取你的應用程式、畫出畫面線框圖，並回覆計畫的連結。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F96c7a6d6f73a42ed96a551c112cb269a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F60c66f4f9b2442a290e2a258cc70b3f2
        alt: 程式開發 agent 對話的特寫：一則 /visual-plan 請求，要一個有狀態篩選器、空白狀態和付款失敗錯誤的「Invoices」畫面。agent 讀取應用程式的五個版面和元件檔案，建立計畫，並回覆審查用的連結。
    - title: 針對要修改的地方留言
      body: 開啟計畫，點選畫面上確切出錯的位置，寫下該怎麼改。把留言設為 **代理**，讓程式開發 agent 處理，或設為 **真人** 交給隊友。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb9adb0ff68324479a0c18c8124a77b2e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F765ae87885404c408e1f4ee46d15711d
        alt: 發票清單畫框的特寫，一則留言釘在狀態篩選器上。留言框設為「代理」，內容是：把狀態篩選器改成有 All、Paid 和 Overdue 的分段控制項。
    - title: 把留言傳給 agent
      body: 點選 **傳送給代理**，選擇 **複製給您的代理**，把提示貼到 agent 的對話中。程式開發 agent 會更新計畫，並解決它已修正的留言。畫面看起來沒問題後，再請 agent 開發。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9263e46c4be445389bfc97bee3a78e74
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5910f3c944e9443aafe166a356c27bff
        alt: 有 3 則未解決留言的「傳送給代理」按鈕特寫。選單已展開，有兩個選項：「複製給您的代理」和「傳送給內嵌代理」。
features:
  heading: 一次就把畫面做對所需的一切
  items:
    - title: 畫在你真正的應用程式裡
      body: 程式開發 agent 會先讀取你現有的畫面和元件再動筆，所以新畫面的側邊欄、工具列和選單都維持原位。
    - title: 畫面的每一種狀態
      body: agent 會為每個重要狀態畫一個畫框，例如載入中、空白、錯誤或展開的選單，讓你看到提示沒寫到的部分。
    - title: 留言精準對應元素
      body: 程式開發 agent 會知道每則留言釘在哪個按鈕、哪一列或哪張卡片上，所以一句「改成分段控制項」就夠了。
    - title: 未解決的留言會保留
      body: 程式開發 agent 會先確認每項變更確實完成，才解決留言，所以它漏掉的地方都還在等你處理。
    - title: 多步驟流程的原型
      body: 像新手引導或結帳這類流程，agent 會在畫面旁的 **原型** 分頁加上可點擊的原型。
    - title: 和團隊一起審查
      body: 用連結分享計畫，隊友就能在瀏覽器中開啟畫面。任何有 Agent-Native 帳號的人都能留言。
