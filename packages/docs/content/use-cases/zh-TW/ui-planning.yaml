faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Plan 是免費的嗎？
      a: 是的，[Agent-Native Plan](https://www.agent-native.com/docs/template-plan/) 免費且開源。畫面是由你自己的程式開發 agent 畫的，所以每份計畫都在 agent 的模型上執行，並計入它的用量，計畫越長用得越多。Plan 目前是 alpha 版，功能會持續調整。
    - q: 哪些程式開發 agent 可以搭配 Plan 使用？
      a: Agent-Native Plan 有 Claude Code 和 Codex 的外掛程式。安裝指令也會以同樣方式設定 Cursor、OpenCode 和 GitHub Copilot，只要登入一次就能使用 `/visual-plan`。Cline、Goose 和其他支援 MCP 的 agent，則加入 Plan 的網址即可連接。
    - q: 我要怎麼修改計畫顯示的內容？
      a: 要修改畫面，就[在畫面上留言](https://www.agent-native.com/docs/template-plan-review-workflow/)，程式開發 agent 會重畫。Plan 不能讓你手動拖曳或調整畫面元素的大小。畫面下方的書面計畫則不同：你可以直接編輯它的文字。
    - q: 畫面會和我現有的應用程式一致嗎？
      a: 會，只要這個畫面屬於你已經有的應用程式。程式開發 agent 動筆之前會讀取應用程式的程式碼、版面和元件，所以計畫會呈現你真正的側邊欄、工具列和選單。全新的應用程式則會依你的描述畫出畫面。
    - q: Plan 和程式開發 agent 內建的計畫模式有什麼不同？
      a: Plan 搭配 agent 的計畫模式使用，把它的計畫呈現為畫面。把 agent 已經寫好的 Claude Code、Codex 或 Markdown 計畫交給 `/visual-plan`，Plan 就會把它變成計畫描述的畫面，讓你在確切的位置釘上留言。
