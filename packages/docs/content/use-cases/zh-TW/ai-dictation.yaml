faqs:
  heading: 有問題？我們來解答
  items:
    - q: Agent-Native Clips 是免費的嗎？
      a: 是的。Agent-Native Clips 免費且開源，桌面應用程式預設就開啟語音聽寫。AI 清理使用 Builder.io AI 點數或你自己的金鑰，因此並非無限使用。Clips 目前是 alpha 版，功能會隨著發展持續調整。
    - q: Clips 和我電腦內建的聽寫有什麼不同？
      a: 內建聽寫不需要設定，但不會保留[可搜尋的口述記錄](https://www.agent-native.com/articles/what-should-you-look-for-in-dictation-software/)。Clips 會儲存每一次聽寫的原文和清理後的文字、學習你的用詞，並用 AI 整理文字。Clips agent 可以找出你說過的內容並重新修改，例如把一段碎碎念變成重點條列。
    - q: Clips 能把我團隊的專業用語拼對嗎？
      a: 可以，只要把詞彙加進你的字典。每行加入一個，或用「詞彙 → 替換內容」處理它一直聽錯的字。你也可以匯入 CSV 詞彙檔。在 Clips 貼上後立刻修正某個字，桌面應用程式就會把這個修正存進你的字典，供下次使用。
    - q: 我的聽寫會被儲存嗎？舊的還找得到嗎？
      a: 每一次聽寫都會連同原文、清理後的文字、時間和長度一起儲存，並依日期分組顯示在「聽寫」頁面。按 Cmd+K 可以用你說過的內容搜尋，也可以詢問 [Clips agent](https://www.agent-native.com/docs/template-clips-agent/)，例如「給我看我昨天聽寫的內容」。你可以刪除任何一筆聽寫。
    - q: 我的聲音會離開我的電腦嗎？
      a: 不一定。Clips Desktop 可以在你的裝置上轉錄，使用內建語音辨識或 Local Whisper（[Clips 中的轉錄引擎](https://www.agent-native.com/docs/template-clips-features/)）。若使用 Builder.io 或你自己的金鑰，Clips 會把你的聽寫送到該 AI 服務做清理。每次聽寫的文字都會儲存到你的 Clips 帳號。
