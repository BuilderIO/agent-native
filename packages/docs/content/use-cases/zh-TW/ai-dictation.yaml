title: 用說的輸入提示，不必再打字
seo_title: 能在任何應用程式中輸入文字的 AI 聽寫
meta_description: 用 AI 聽寫對 Claude Code、Slack 或文件說話，整理好的文字就會出現在你的游標處。Agent-Native Clips 會儲存每一次聽寫，方便日後搜尋。
updated: 2026-10-26
hero:
  body: 你口述的提示、工單和回覆，會變成整理好的文字出現在你的游標處，從 Claude Code 到 Slack 都行。Agent-Native Clips 會儲存每一次聽寫，你開口要求時，它的 agent 還能重新修改內容。
  button:
    label: 開始聽寫
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb42e201ec33f4acf8f8b6d39f67a2503
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3b0e34d91eee4240a0211ba4ca9b0859
    alt: Clips 的「聽寫」頁面，顯示今天的聽寫：給程式開發 agent 的長提示、一張錯誤工單和一則 Slack 更新。提示的卡片已展開，顯示「原文」與「已清理」的文字。
how_to:
  heading: 如何使用 AI 聽寫
  steps:
    - title: 在任何應用程式中聽寫
      body: 安裝 Clips Desktop，點進 Claude Code、Linear 或 Slack，說話時按住你的快捷鍵（預設是 Fn，也可以在「設定」中自選）。放開後，Clips 就會把你說的話放在游標處。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F493f3728ed1246bb841a651e3aa76300
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb3785ba8ec804690836d94e31ff92e17
        alt: 程式開發 agent 的對話：一段關於 webhook 重試的聽寫提示已送出，agent 也完成了修改。游標停在訊息框中，下方的 Clips 膠囊正在聆聽下一段提示，綠色波形升起。
    - title: 教 Clips 認識你的用詞
      body: 在「聽寫」頁面開啟「字典」，加入你的產品、函式庫和同事的名字，或用「詞彙 → 替換內容」處理 Clips 一直聽錯的字。也可以匯入 CSV 檔案，一次加入整份清單。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F855c88996488417e8dc3a532a0fd21a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff4e9c0557a1344f6a55e7e9c4356a5ab
        alt: Clips 的「字典」面板，有「新增詞條」、「匯入」和「匯出 CSV」。下方是 Agent-Native、「web hooks → webhooks」和「kube control → kubectl」等詞彙。
    - title: 找出過去的聽寫
      body: 在 Clips 按下 Cmd+K 並輸入你說過的一個詞，符合的聽寫就會連同你說話時所在的應用程式一起顯示。選一筆，就會在「聽寫」頁面開啟。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5e344071b49f4e51ae5eef2708c46605
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F13f558e09094404f975350ad0c359acc
        alt: Clips 搜尋選單，輸入了「webhook」，在「聽寫」下列出兩筆過去的聽寫：一段聽寫到 Cursor 的提示，和一則聽寫到 Slack 的訊息。
features:
  heading: 用說的取代打字，所需的一切
  items:
    - title: 剪貼簿維持原樣
      body: Clips 貼進應用程式後會把你的剪貼簿還原，所以你複製的連結還在。在終端機裡，它則是直接輸入文字。
    - title: 可以復原的 AI 清理
      body: Clips 會修正聽錯的字、逗號和大小寫，並刪掉說到一半重來的部分：使用雲端引擎時自動進行，也可以一鍵完成。原文會保留。
    - title: 從你的修正中學習
      body: 在 Clips 貼上後立刻修正聽錯的字，桌面應用程式就會把這個修正加入你的字典，下次聽寫就會正確。
    - title: 長提示可免持操作
      body: 連按兩下快捷鍵，就能在你邊想邊說時持續聆聽，再按一下即可停止。按 Esc 可以捨棄這次聽寫。
    - title: 再貼一次
      body: 按 Cmd+Ctrl+V，就能把你最近一次的聽寫再貼到另一個文字欄位，游標放錯位置時很方便。
    - title: 向 agent 詢問聽寫內容
      body: 問「我說過關於第三季預算的什麼？」或「把這段碎碎念整理成重點條列」，agent 就會根據你的歷史記錄處理。
