story: null
faqs:
  - q: "Which databases can I connect?"
    a: "Analytics lists PostgreSQL and BigQuery among its 23 data sources, along with product, billing, and CRM tools like Stripe and HubSpot."
  - q: "Do I need to write SQL?"
    a: "No. You ask in plain English, and the agent turns your question into SQL."
  - q: "Can Claude, Codex, or ChatGPT use Analytics?"
    a: "Every Agent-Native app exposes an MCP URL that Claude, Claude Code, Codex, ChatGPT, and Cursor can connect to. Connected agents use the app's own actions. ChatGPT custom MCP apps require a supported ChatGPT web workspace."
  - q: "I'm building my own Agent-Native app. Can its agent query the app's database?"
    a: "Yes. By default, a production agent can read the app's database with SQL, through the db-schema and db-query tools, and must use the app's actions for writes. Write access is opt-in, and you can turn raw database tools off."
  - q: "Who can see my dashboards?"
    a: "Dashboards are private by default. You can share one with a teammate or your whole organization as a viewer, editor, or admin."
  - q: "Is Analytics open source?"
    a: "Yes. Analytics is an open-source replacement for Amplitude, Mixpanel, and Looker."
