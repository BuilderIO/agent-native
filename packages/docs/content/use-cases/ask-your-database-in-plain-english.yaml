new_way:
  heading: "How it works in Analytics"
  steps:
    - "Connect PostgreSQL in Analytics with its connection URL. BigQuery is supported too."
    - "Ask a question in plain English. The agent turns your question into SQL against your tables."
    - "Save the answers as a dashboard. Dashboards are private by default, and you can share one with a teammate or your whole organization."
todays_stack:
  heading: "What changes for data questions"
  items:
    - text: "**Routing every question to whoever writes SQL,** then waiting for the answer."
    - text: "**A BI tool, like Looker,** covers the questions someone planned for, and new ones wait for a data request."
    - text: "**A chat assistant with a CSV export** can answer a question, but every answer starts with exporting the data again."
  in_app: "Your database stays where it is. Analytics connects to PostgreSQL, answers plain-English questions about your tables, and keeps the answers in dashboards your team can open."
