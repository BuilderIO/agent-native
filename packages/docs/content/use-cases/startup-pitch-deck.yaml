old_way:
  heading: "How most people do it today"
  body: "You start from a template, paste in last round's slides, and restyle everything by hand. Then each investor conversation sends you back in to rework it."
new_way:
  heading: "How it works in Slides"
  steps:
    - "Attach your product brief, your notes, or an existing deck as reference material, and say who the deck is for."
    - "Apply your brand with a design system. Edit text, layout, and styling on the slide, or select text and ask the agent to revise it."
    - "Share a viewing link, present full-screen with speaker notes, or export a PowerPoint file."
