screenshot_alt: "The Slides editor with a quarterly review deck open, showing a bar chart slide, with the agent chat on the right"
old_way:
  heading: "How most people do it today"
  body: "You start from a template, paste in last round's slides, and restyle everything by hand. Then each investor conversation sends you back in to rework it."
new_way:
  heading: "How it works in Slides"
  steps:
    - "Attach your product brief, your notes, or an existing deck as reference material, and say who the deck is for."
    - "Apply your brand with a design system. Edit text, layout, and styling on the slide, or select text and ask the agent to revise it."
    - "Share a viewing link, present full-screen with speaker notes, or export a PowerPoint file."
todays_stack:
  heading: "What goes into a pitch deck today"
  items:
    - text: "**A template or last round's deck** is the starting point, so you restyle it by hand and hunt for stale numbers."
    - text: "**A spreadsheet** holds the traction and financials, and every number gets pasted into slides by hand."
    - text: "**Product screenshots** show the product, but they go stale as the product changes."
    - text: "**A general AI chat** can draft the story, but you still build every slide in your brand yourself."
  in_app: "In Slides, the deck is drafted from your brief in your brand, and you edit it slide by slide or with the agent."
story: null
faqs:
  - q: "Can Slides make a pitch deck?"
    a: "Yes. Slides can turn a product brief into a deck for prospects or investors."
  - q: "Does it write the content for me?"
    a: "Slides drafts from the material you give it. Check every claim and number before you send it."
  - q: "Can I use my own brand colors, fonts, and logo?"
    a: "Yes. Apply a design system with your brand's colors, typography, and logos, then reuse it across decks."
  - q: "Can I use the deck in PowerPoint or Google Slides?"
    a: "Export a PPTX file to open in PowerPoint. To use it in Google Slides, import that file there. Review fonts and layouts after export because they can render differently between editors."
  - q: "Is Slides free?"
    a: "Yes. Slides is free and open source. It's labeled alpha, so expect rough edges."
