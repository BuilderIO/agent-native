subhead: "Give Slides your brief and your numbers. It drafts an on-brand pitch deck, and you edit it slide by slide before you share it or export it to PowerPoint."
meta_description: "Draft a startup pitch deck from your brief, apply your brand, edit slide by slide, then share a link or export to PowerPoint. Free, open-source Slides from Agent-Native."
