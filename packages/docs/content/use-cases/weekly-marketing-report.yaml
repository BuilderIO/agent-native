faqs:
  - q: "Which marketing data sources can I connect?"
    a: "Analytics lists Google Analytics (GA4), HubSpot, DataForSEO, and X / Twitter among its data sources."
  - q: "Do I need to write SQL?"
    a: "No. You ask in plain English, and the agent turns your question into SQL."
  - q: "Can I share the report?"
    a: "Yes. Dashboards are private by default, and you can share one with a teammate or your whole organization as a viewer, editor, or admin."
  - q: "Can I trust the numbers?"
    a: "Check the first few answers against Google Analytics and your CRM before you rely on them."
