hero:
  body: Agent-Native Analytics turns your Google Analytics and HubSpot data into your Monday marketing report. Ask how the week went, and the agent keeps each answer in a dashboard you never rebuild.
  button:
    label: Build your dashboard
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8b9582619b1b42e4a44e6246e01ff7f8
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F70d3b80ce73f472c95b94f7f5c0d65d6
    alt: A weekly marketing dashboard open in Analytics. Metric cards across the top show this week's sessions, organic signups, new HubSpot contacts and deals created, each with the change from last week. Below them, a bar chart compares sessions by channel this week and last, and a line chart shows HubSpot deals created per day. The agent chat on the right holds the question "How did the week go?" and a short answer naming organic search as the biggest gain.
how_to:
  heading: How to make a weekly marketing report with AI
  steps:
    - title: Connect your marketing data
      body: Open **Data Sources**, follow the [setup steps](https://www.agent-native.com/docs/template-analytics-connectors/) on the Google Analytics and HubSpot cards, and click **Test connection**. Google Analytics needs a Google Cloud service account with Viewer access to your property, a one-time setup.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0218d6c271db4bbe8534c00e6f5e85a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa38de1d80c2e4f7fb8e1407d95f97984
        alt: Close-up of the Data Sources page with Google Analytics and HubSpot listed as connected. HubSpot's setup panel is open beside them, with its token configured and Test connection showing Connection successful.
    - title: Ask how the week went
      body: "Ask what you'd ask an analyst. For example: \"How did signups from organic search do this week compared with last week?\" The agent runs a live query on your data and answers with a chart."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fcd7a4f648f5b4dee8a6282c3f512f698
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F74bf8b013f944b96a414979ff7234deb
        alt: The agent chat with that question and its answer. Two sentences say organic signups rose week over week, above a bar chart of signups by channel for this week and last.
    - title: Save and share your dashboard
      body: Ask the agent to "make this my weekly marketing dashboard". Click **Share** to give a teammate or your whole organization [view or edit access](https://www.agent-native.com/docs/sharing/), or open **Email reports** to send it daily at a time you pick.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F04feeeb2a1384ce0adecb7bee676b806
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F61fd64ac2bff4f53a3ca6cfbd97225fe
        alt: "The weekly marketing dashboard with the Email reports dialog open: Send to set to Email and Slack, two team addresses, a 9:00 send time and a Send now button."
features:
  heading: Everything you need to report on your marketing week
  items:
    - title: Both tools in one question
      body: Ask about Google Analytics sessions and HubSpot contacts in the same question, and the agent answers with both side by side.
    - title: Search rankings next to traffic
      body: Connect DataForSEO and ask how your keyword rankings moved alongside this week's organic sessions.
    - title: Numbers that stay current
      body: Google Analytics charts query live and HubSpot charts refresh on their own, so the report always shows the latest week.
    - title: Re-run last week's analysis
      body: Save an investigation with its question and steps, then ask the agent to run it again on this week's data.
    - title: Your team's definitions
      body: Your admins set what counts as a lead or a signup on the Semantic Layer page, and the agent uses those definitions in every answer.
    - title: Ask about any chart
      body: Click a chart and ask what changed. The agent gets that chart with your question and answers from the data behind it.
