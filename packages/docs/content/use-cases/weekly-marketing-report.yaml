faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Analytics free?
      a: Yes, Agent-Native Analytics is free and open source. You connect your own Google Analytics and HubSpot accounts. To start, you choose free Builder.io AI credits or your own AI model key for the agent, so AI use has limits. Analytics is in alpha, so expect changes.
    - q: Which marketing data sources can I connect?
      a: Agent-Native Analytics connects to Google Analytics (GA4), HubSpot, DataForSEO for keyword rankings and search volume, and X for post engagement. It also connects to BigQuery, Amplitude, Mixpanel, PostHog and Stripe. Each source needs its own credentials, and Google Analytics needs a Google Cloud service account.
    - q: Can Agent-Native Analytics send the report every Monday?
      a: Not on a weekly schedule yet. [Dashboard email reports](https://www.agent-native.com/docs/template-analytics-dashboards/) go out daily, at a time and timezone you pick, to up to five email addresses, a Slack channel or both. Before your Monday meeting, click **Send now** in **Email reports** to send the latest dashboard.
    - q: Do I need to know SQL?
      a: No. You ask in plain words, and the agent picks the source and writes the query. You can ask the agent to show the query behind any answer if you want to check it.
    - q: Can I trust the numbers?
      a: The agent runs a live query on your data before it gives you a number, and labels a figure "Unverified" when no query ran. Still, compare the first week's report with Google Analytics and HubSpot before you send it to the team.
    - q: How is Agent-Native Analytics different from GA4 and HubSpot reports?
      a: "Google Analytics and HubSpot each report on their own data. Agent-Native Analytics answers one question across both, in plain words, and keeps the answers as one dashboard you can refine by asking. That's an [agentic app](https://www.agent-native.com/articles/what-is-an-agent-native-app/): the brains of an agent, the intuitiveness of an app."
