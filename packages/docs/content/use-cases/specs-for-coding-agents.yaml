faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Content free?
      a: Yes, Agent-Native Content is free and open source. Your coding agent reads and edits the spec on its own model, so that counts toward your agent's usage. Content's built-in agent runs on Builder.io credits or your own model key. Content is in alpha, so expect changes.
    - q: Which coding agents can read my spec?
      a: Claude Code and Codex open the page from **Share** and ask you to connect once. Cursor and GitHub Copilot in VS Code add Content there in one click. Claude Cowork, Goose and OpenCode connect from your terminal, and any MCP client with sign-in can [connect to Content by its URL](https://www.agent-native.com/docs/external-agents/#private-content-links). Each agent sees only what your account can see.
    - q: How is this different from a spec file in my repo?
      a: A spec file in your repo is a copy that only people working in the code tend to edit. In Content, your team writes and comments on the same page your coding agent reads, and the agent's changes arrive as suggestions. If you want Markdown in the repo too, Content [syncs with a local folder](https://www.agent-native.com/docs/template-content-sync/).
    - q: Can my coding agent change the spec?
      a: Yes, with the access your account has. Ask it to suggest edits, and the page stays the same until you accept each one. It can also edit the page directly, but if the page changed after the agent read it, Content refuses the edit. [Version history](https://www.agent-native.com/docs/template-content-editing/) keeps earlier versions.
    - q: Can I keep my specs in my repo?
      a: Yes. Connect a [local Markdown or MDX folder](https://www.agent-native.com/docs/template-content-local-files/) in Content and pull, check or push changes, or start Content from your repo with one command. Conflicts are shown for you to review. The browser can't read local files on its own, so this needs a local Content app or Agent-Native Desktop.
