how_to:
  heading: How to ask your database questions in plain English
  steps:
    - title: Connect your data warehouse
      body: On the **Data Sources** page, open BigQuery. Upload the JSON key of a service account with the BigQuery Data Viewer and BigQuery Job User roles, enter your project ID, then click **Save Credentials** and **Test connection**.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F62008ebd98594f02b1c0bf3ae565ef49
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb01d428bca15467eb4c04299dd9575b8
        alt: Close-up of the BigQuery card on Data Sources, showing Connected, the project ID and service account marked Configured, and Connection successful.
    - title: Ask your question in plain English
      body: "In **Ask**, type a question the way you'd ask a teammate: \"How many accounts signed up last week, by plan?\" The agent finds the right tables, runs the query and answers with a chart."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3e9ac5b30a924dab9b09bc76ed24b2de
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F31c48c5ccc9247b792c00474b01f97b0
        alt: Close-up of the Ask chat. The agent searched the BigQuery schema, ran one query, and answered with 723 signups and a bar chart by plan.
    - title: Keep the answer on a dashboard
      body: Ask the agent to "add this to a dashboard." It builds the panel, checks that its SQL runs and saves the dashboard. The dashboard stays private until you share it with a teammate or your whole organization.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F957858f8613241a2b2249d88430b3cc4
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd0111e9f420149fc8a35cad845ad8e2e
        alt: A new Weekly signups dashboard with the signups-by-plan panel and a signups-by-week chart. The agent chat beside it says both panels were checked against BigQuery.
features:
  heading: Everything you need to get answers from your database
  items:
    - title: The SQL behind every answer
      body: Open **View SQL** on any dashboard chart, or ask in chat, to see the query the agent wrote, and copy it to run yourself.
    - title: Your team's metric definitions
      body: An admin writes down what "active" or "signup" means on the **Semantic Layer** page. The agent reads it before it writes SQL.
    - title: Queries that can't change data
      body: In BigQuery, the agent's SQL can't insert, update or delete, and it connects through a service account that can only read tables and run queries.
    - title: Dashboards the agent edits
      body: Ask in chat for another panel, a filter or a breakdown by plan, and the agent changes the dashboard for everyone you've shared it with.
    - title: Questions across your tools
      body: Ask one question that mixes your warehouse tables with Stripe revenue, HubSpot deals or PostHog events.
    - title: The dashboard in your inbox
      body: Get a dashboard by email every day at the time you pick, with its charts and tables in the email, for up to five people.
