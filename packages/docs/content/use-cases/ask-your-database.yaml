faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Analytics free?
      a: Yes, Agent-Native Analytics is free and open source. Use the hosted app or run your own copy. The agent needs an AI connection, through Builder.io or your own model key, so AI use isn't unlimited. Analytics is in alpha, so expect changes.
    - q: Do I need to know SQL?
      a: No. You ask in plain English and the agent writes the SQL. Someone who knows your data may need to [connect BigQuery](https://www.agent-native.com/docs/template-analytics-connectors/) first. An admin can add your [metric definitions](https://www.agent-native.com/docs/template-analytics-dashboards/) on the **Semantic Layer** page, so the agent picks the right tables and columns.
    - q: Does it work with Postgres, Supabase or Neon?
      a: Yes, for Postgres on Supabase or Neon. Connect it [through MCP](https://www.agent-native.com/docs/mcp-clients/) from the chat's + menu and ask your question in chat. Those answers stay in the chat, because dashboard panels can't query Postgres yet. Other Postgres databases can't be queried yet, so the steps on this page use BigQuery.
    - q: Can the agent change my data?
      a: Not in BigQuery. Analytics rejects any query from the agent that would insert, update, delete or drop data there. The setup also asks for a service account with read-only roles, which can read your tables and run queries but not change them. Through Supabase or Neon, the agent can do what you allow that connection.
    - q: How do I know an answer is right?
      a: Check the query behind it. Ask the agent to show its SQL, or open **View SQL** on a dashboard chart. You can also ask which tables and filters it used. The agent marks a number **Unverified** when no live query ran.
    - q: How is this different from asking ChatGPT about a CSV export?
      a: "A chat assistant answers from the file you exported, so every new question starts with a new export. Analytics queries your warehouse directly, uses your team's metric definitions, and keeps the answers you need again on a dashboard. That's an [agentic app](https://www.agent-native.com/articles/what-is-an-agent-native-app/): the brains of an agent, the intuitiveness of an app."
