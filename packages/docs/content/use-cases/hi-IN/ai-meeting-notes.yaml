how_to:
  heading: "AI से मीटिंग नोट्स कैसे लें"
  steps:
    - title: "अपना कैलेंडर कनेक्ट करें"
      body: "Clips Desktop इंस्टॉल करें, Clips की सेटिंग्स में मीटिंग चालू करें और मीटिंग पेज पर Google Calendar कनेक्ट करें। आपकी आने वाली मीटिंग्स Agenda टैब में दिखने लगती हैं।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F58ac771a7a8547ecbb770e5e560f8ecd
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6d5d38e3c0124bbb8a51b2d0b89582c4
        alt: "मीटिंग पेज के Agenda टैब का क्लोज़-अप, जिसमें Google Calendar से आज की मीटिंग्स की लिस्ट है। 2 मिनट में शुरू होने वाली मीटिंग पर जुड़ें और नोट्स खोलें बटन हैं।"
    - title: "रिमाइंडर से नोट्स शुरू करें"
      body: "Clips Desktop हर कैलेंडर मीटिंग से एक मिनट पहले रिमाइंडर दिखाता है। उसका जुड़ें बटन कॉल में जोड़कर तुरंत नोट्स शुरू कर देता है, और बटन का मेन्यू कॉल में जुड़े बिना नोट्स शुरू करता है। फिर Clips आपका माइक्रोफ़ोन और कॉल का ऑडियो रिकॉर्ड करता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff048f1dd0e18443d93fdeb4a4f03fada
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe58e7dd45fa3459fb1cdb3840fed0126
        alt: "वीकली प्रोडक्ट सिंक के लिए Clips Desktop रिमाइंडर का क्लोज़-अप। उसके Join Meet & open Clips बटन का मेन्यू खुला है: Join only, Start notes only और Snooze 5 min।"
    - title: "अपने नोट्स और एक्शन आइटम्स पढ़ें"
      body: "कॉल खत्म होने पर मीटिंग पेज पर ट्रांसक्रिप्ट के बगल में आपके नोट्स और AI नोट्स दिखते हैं: समरी, मुख्य बातें और हर अटेंडी के एक्शन आइटम्स। शेयर करने से पहले [AI मीटिंग नोट्स](https://www.agent-native.com/articles/how-to-use-ai-to-take-meeting-notes/) को ट्रांसक्रिप्ट से मिलाकर जाँच लें।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0ba0a151caef41e8904d6535671c47bc
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fbdf5e7b84ab64a288c0837959eedb85b
        alt: "खत्म हो चुकी मीटिंग के AI नोट्स पैनल का क्लोज़-अप: समरी, चार मुख्य बातें, और दो अटेंडीज़ के नीचे एक्शन आइटम्स।"
features:
  heading: "हर मीटिंग से आपको जो कुछ चाहिए"
  items:
    - title: "आपकी कॉल्स में कोई बॉट नहीं"
      body: "Clips Desktop आपके अपने कंप्यूटर पर आपका माइक्रोफ़ोन और कॉल का ऑडियो रिकॉर्ड करता है, इसलिए बाकी सबको मीटिंग पहले जैसी ही दिखती है।"
    - title: "हर व्यक्ति के एक्शन आइटम्स"
      body: "हर एक्शन आइटम में लिखा होता है कि ज़िम्मेदारी किसकी है, यह कॉल में किसने क्या कहा उसी से तय होता है। शेयर करने से पहले आइटम जोड़ें, बदलें या हटाएँ।"
    - title: "कॉल के दौरान ही पूछें"
      body: "मीटिंग चलते-चलते उसके बारे में पूछें: आपने क्या मिस किया, पिछले पाँच मिनट की रीकैप, या आगे पूछने लायक कोई अच्छा सवाल।"
    - title: "जो कहा गया, उससे खोजें"
      body: "ट्रांसक्रिप्ट या नोट्स का कोई शब्द, या किसी अटेंडी का नाम डालकर मीटिंग ढूँढें, या एजेंट से उस कॉल के बारे में पूछें जिसमें कोई बात उठी थी।"
    - title: "वापस ले जाने वाले नोट्स"
      body: "AI नोट्स की किसी भी मुख्य बात पर क्लिक करें और आप ट्रांसक्रिप्ट में ठीक उसी पल पर पहुँच जाएँगे जब वह बात कही गई थी।"
    - title: "शेयर करने लायक मीटिंग नोट्स"
      body: "एक लिंक से समरी, मुख्य बातें, एक्शन आइटम्स और पूरा ट्रांसक्रिप्ट शेयर होता है, रिकॉर्डिंग के वीडियो या कमेंट्स के बिना।"
