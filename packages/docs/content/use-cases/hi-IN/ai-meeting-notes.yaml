faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Clips फ़्री है?"
      a: "हाँ, Agent-Native Clips फ़्री और ओपन सोर्स है। समरी, टाइटल और ट्रांसक्रिप्ट क्लीनअप डिफ़ॉल्ट रूप से [Builder.io AI क्रेडिट्स](https://www.agent-native.com/docs/template-clips-features/) पर चलते हैं। क्रेडिट्स खत्म होने पर ये फ़ीचर तब तक बंद रहते हैं जब तक आप क्रेडिट्स नहीं जोड़ते या अपनी Gemini key कनेक्ट नहीं करते। Clips अभी alpha में है, इसलिए बदलाव होते रहेंगे।"
    - q: "क्या मेरी मीटिंग्स में कोई बॉट जुड़ता है?"
      a: "नहीं। Clips आपके अपने कंप्यूटर से नोट्स लेता है: Clips Desktop आपका माइक्रोफ़ोन और कॉल का ऑडियो रिकॉर्ड करता है, इसलिए आपकी Zoom, Google Meet या Microsoft Teams कॉल में कुछ नहीं जुड़ता। चूँकि कोई बॉट नहीं जुड़ता, लोगों को बता दें कि आप नोट्स ले रहे हैं।"
    - q: "Clips कौन-से कैलेंडर और वीडियो कॉल ऐप्स के साथ काम करता है?"
      a: "Clips सिर्फ़ Google Calendar से कनेक्ट होता है। नोट्स Zoom, Google Meet, Microsoft Teams, Webex या ऐसी किसी भी कॉल में काम करते हैं जिसका ऑडियो आपका कंप्यूटर चलाता है। Mac पर Clips Desktop कैलेंडर में न होने वाली ऐसी कॉल्स को भी पहचान लेता है और नोट्स शुरू करने का सुझाव देता है। बाकी अटेंडीज़ की आवाज़ें सिर्फ़ Mac पर रिकॉर्ड होती हैं।"
    - q: "क्या Clips Windows पर मीटिंग नोट्स लेता है?"
      a: "Clips Desktop Mac, Windows और Linux पर चलता है, लेकिन बाकी अटेंडीज़ की आवाज़ें सिर्फ़ Mac पर रिकॉर्ड होती हैं। Windows और Linux पर Clips सिर्फ़ आपका माइक्रोफ़ोन रिकॉर्ड करता है, इसलिए रिमोट अटेंडीज़ ट्रांसक्रिप्ट और एक्शन आइटम्स में नहीं आते।"
    - q: "Clips, Zoom या Google Meet के AI नोट टेकर से कैसे अलग है?"
      a: "किसी कॉल ऐप का AI नोट टेकर उसी ऐप की कॉल्स तक सीमित रहता है। Clips हर मीटिंग को, किसी भी कॉल ऐप की हो, एक ही लाइब्रेरी में रखता है। [Clips एजेंट](https://www.agent-native.com/docs/template-clips-agent/) से पूछें \"पिछले मंगलवार को Daniel ने क्या कमिट किया था?\" और वह जो कहा गया उसके आधार पर आपकी मीटिंग्स खोज लेगा। यही इसे एक [एजेंटिक ऐप](https://www.agent-native.com/articles/what-is-an-agent-native-app/) बनाता है: एजेंट का दिमाग, ऐप जैसी आसानी।"
