  body: "Agent-Native Clips कॉल्स को नोट्स में बदलता है: ट्रांसक्रिप्ट, समरी और हर अटेंडी के एक्शन आइटम्स। यह आपके कंप्यूटर से रिकॉर्ड करता है, यानी कोई बॉट नहीं, और हर मीटिंग खोज सकते हैं।"
