faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Analytics फ़्री है?"
      a: "हाँ, Agent-Native Analytics फ़्री और ओपन सोर्स है। एजेंट Builder.io AI क्रेडिट्स या आपकी अपनी AI key पर चलता है, इसलिए AI का इस्तेमाल असीमित नहीं है। कॉल्स के बारे में सवाल आपके Gong API क्रेडिट्स भी इस्तेमाल कर सकते हैं, जिसे एडमिन बंद कर सकता है। Analytics अभी alpha में है।"
    - q: "Agent-Native Analytics किन CRM और कॉल टूल्स से जुड़ता है?"
      a: "Analytics आपके CRM के लिए HubSpot और सेल्स कॉल्स के लिए Gong से जुड़ता है। कॉन्टैक्ट और कंपनी डेटा के लिए Apollo और Clay भी जुड़ते हैं। हर एक [डेटा स्रोत पेज पर जुड़ता है](https://www.agent-native.com/docs/template-analytics-connectors/), अपनी key के साथ, और एक सवाल HubSpot और Gong दोनों से जवाब ला सकता है।"
    - q: "क्या मुझे SQL लिखना होगा?"
      a: "नहीं। आप आसान भाषा में पूछते हैं, और एजेंट HubSpot या Gong में डेटा ढूँढता है, क्वेरी चलाता है और किसी संख्या, टेबल या चार्ट के साथ जवाब देता है। जब आप कोई जवाब डैशबोर्ड में सेव करते हैं, तो एजेंट तय करता है कि हर पैनल ताज़ा डेटा कैसे लाएगा।"
    - q: "क्या मैं इन नंबरों पर भरोसा कर सकता हूँ?"
      a: "हाँ, एक जाँच के साथ: एजेंट लाइव HubSpot और Gong डेटा से जवाब देता है और जो आँकड़ा लाइव क्वेरी से नहीं आया उसे Unverified मार्क करता है। वह आपकी टीम की [सिमेंटिक लेयर पेज वाली परिभाषाओं](https://www.agent-native.com/docs/template-analytics-dashboards/) को मानता है। इन पर भरोसा करने से पहले शुरुआती जवाबों को HubSpot से मिलाएँ।"
    - q: "Agent-Native Analytics, HubSpot या Gong के साथ आने वाले AI से कैसे अलग है?"
      a: "HubSpot या Gong का AI उसी एक टूल में बना है। Analytics एक ही सवाल का जवाब HubSpot और Gong दोनों से देता है, Stripe और BigQuery भी पढ़ता है, और जवाब को ऐसे डैशबोर्ड में रखता है जिसे आपकी टीम हर हफ़्ते दोबारा खोलती है। आप HubSpot और Gong पहले की तरह इस्तेमाल करते रहते हैं, और Analytics दोनों से पढ़ता है।"
    - q: "मेरे डैशबोर्ड कौन देख सकता है?"
      a: "सिर्फ़ आप, जब तक आप कोई शेयर न करें। डैशबोर्ड किसी टीममेट या पूरे संगठन के साथ viewer, editor या admin के रूप में शेयर करें। टीममेट्स HubSpot और Gong डेटा अपने कनेक्शन से देखते हैं, या उस कनेक्शन से जो एडमिन ने संगठन के लिए सेट किया है; दोनों में से कोई न हो तो वे पैनल एरर दिखाते हैं।"
