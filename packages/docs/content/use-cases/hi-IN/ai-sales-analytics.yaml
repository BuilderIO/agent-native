title: "HubSpot और Gong डेटा से अपनी सेल्स पाइपलाइन रिव्यू करें"
seo_title: "HubSpot और Gong के लिए AI सेल्स एनालिटिक्स"
meta_description: "पाइपलाइन रिव्यू से पहले देखें कि कौन-सी डील्स अटकीं और क्यों। Agent-Native Analytics से HubSpot और Gong के बारे में आसान भाषा में पूछें, और जवाब डैशबोर्ड में रखें।"
updated: 2026-10-27
hero:
  body: "Agent-Native Analytics आपकी HubSpot डील्स और Gong कॉल्स को हर पाइपलाइन रिव्यू के लिए डैशबोर्ड में बदलता है। आप आसान भाषा में पूछते हैं कि कौन-सी डील्स अटकीं और क्यों, और एजेंट दोनों से जवाब देता है।"
  button:
    label: "अपनी पाइपलाइन से पूछें"
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe534007e491840cc86570110b7d00de4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4780c6d1885541bcaf3d949dbdbc1eb7
    alt: "Analytics में Weekly pipeline review डैशबोर्ड, जिसमें स्टेज के हिसाब से खुली पाइपलाइन, ओनर के हिसाब से डील्स और 30 दिन से अटकी डील्स के पैनल हैं। दाईं ओर एजेंट चैट बताती है कि एक अटकी डील क्यों रुकी, उसकी HubSpot स्टेज हिस्ट्री और आखिरी Gong कॉल के आधार पर।"
how_to:
  heading: "AI से अपनी सेल्स पाइपलाइन का विश्लेषण कैसे करें"
  steps:
    - title: "अपना CRM और कॉल डेटा कनेक्ट करें"
      body: "**डेटा स्रोत** खोलें और **CRM & Sales** के नीचे HubSpot के आगे **कनेक्ट करें** पर क्लिक करें। HubSpot की सेटिंग्स में बनाए गए प्राइवेट ऐप का टोकन पेस्ट करें और **क्रेडेंशियल सहेजें** पर क्लिक करें। Gong भी इसी तरह जुड़ता है, एक्सेस key और secret के साथ।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fdeea3eb7d84048eca0f534b7b00390ee
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd918aa95f46047559b1f30c42d89d62f
        alt: "Data Sources पेज, जिसमें HubSpot, Connected के नीचे और Gong, CRM & Sales के नीचे है। Gong की सेटअप शीट अपने Access Key Secret स्टेप पर खुली है, key पेस्ट की हुई है, और नीचे Save Credentials है।"
    - title: "अपनी पाइपलाइन के बारे में पूछें"
      body: '**पूछें** पर आसान भाषा में पूछें: "कौन-सी खुली डील्स 30 दिन या उससे ज़्यादा से एक ही स्टेज में हैं?"। एजेंट आपकी HubSpot डील्स खोजता है और एक टेबल के साथ जवाब देता है, जिसे आप सॉर्ट कर सकते हैं और आगे सवाल पूछ सकते हैं।'
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7acaa378761c453bb79f9f246d8cab72
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe66acdb3c24e41c7b5caef3e0251b17a
        alt: "Ask चैट में 30 दिन से अटकी डील्स वाला सवाल। एजेंट छह खुली डील्स की टेबल के साथ जवाब देता है: स्टेज, ओनर, रकम और स्टेज में बीते दिन।"
    - title: "जवाबों को डैशबोर्ड में सेव करें"
      body: 'एजेंट से कहें कि "इसे पाइपलाइन रिव्यू के लिए डैशबोर्ड के रूप में सेव करो।" वह हर जवाब का एक पैनल बनाता है, और पैनल HubSpot के नए डेटा से रिफ़्रेश होते हैं। पाइपलाइन रिव्यू से पहले डैशबोर्ड अपनी टीम के साथ शेयर करें।'
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F69b61731b5b74d61ad0e510f57522796
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2720d0e5fd8f40bfa3b72c056270f174
        alt: "एजेंट चैट पुष्टि करती है कि उसने Weekly pipeline review डैशबोर्ड सेव कर दिया, बगल में नया डैशबोर्ड अपनी अटकी डील्स की टेबल और स्टेज के हिसाब से पाइपलाइन चार्ट के साथ।"
features:
  heading: "पाइपलाइन रिव्यू के लिए आपको जो कुछ चाहिए"
  items:
    - title: "आपकी डील्स और कॉल्स एक साथ"
      body: "एक सवाल HubSpot से डील की स्टेज और ओनर, और Gong से यह ला सकता है कि उसकी कॉल्स में खरीदार ने क्या कहा।"
    - title: "एजेंट जिन्हें एडिट करता है, ऐसे डैशबोर्ड"
      body: "नया पैनल, ओनर के हिसाब से फ़िल्टर या अलग चार्ट माँगें, और एजेंट वह डैशबोर्ड अपडेट कर देता है जिसे आपकी टीम शेयर करती है।"
    - title: "जवाब जिन्हें आप जाँच सकें"
      body: "जब कोई आँकड़ा लाइव HubSpot या Gong क्वेरी से नहीं आया, तो एजेंट उसे Unverified मार्क करता है, ताकि आपको पता रहे कि क्या जाँचना है।"
    - title: "रेवेन्यू के बगल में आपकी पाइपलाइन"
      body: "Stripe और BigQuery भी कनेक्ट करें, और वही चैट आपकी डील्स के साथ-साथ रेवेन्यू और प्रोडक्ट इस्तेमाल के सवालों के जवाब देती है।"
    - title: "आपकी पाइपलाइन की परिभाषाएँ"
      body: "एक एडमिन **सिमेंटिक लेयर** पेज पर लिखता है कि अटकी डील या क्वालिफ़ाइड पाइपलाइन का मतलब क्या है। एजेंट जवाब देने से पहले उसे पढ़ता है।"
    - title: "रोज़ की पाइपलाइन रिपोर्ट"
      body: "ऐप खोले बिना, डैशबोर्ड हर दिन ईमेल से पाँच लोगों तक को या किसी Slack चैनल में पाएँ।"
