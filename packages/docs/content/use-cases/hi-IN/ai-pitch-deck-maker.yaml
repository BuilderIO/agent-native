faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Slides फ़्री है?"
      a: "हाँ, Agent-Native Slides फ़्री और ओपन सोर्स है। डेक बनाने के लिए AI कनेक्शन चाहिए, या तो Builder.io से या आपकी अपनी AI key से, और इमेज बनाने के लिए आपकी अपनी Gemini या OpenAI key चाहिए। Slides अभी alpha में है, इसलिए आगे इसमें बदलाव होते रहेंगे।"
    - q: "क्या मैं अपना पिच डेक PowerPoint या Google Slides में एक्सपोर्ट कर सकता हूँ?"
      a: "Slides एडिट करने लायक PowerPoint (PPTX) फ़ाइल एक्सपोर्ट करता है। Google Slides के लिए यह आपको इम्पोर्ट लिंक के साथ एक PPTX फ़ाइल देता है, जिसे आप खुद Google Slides में खोलते हैं। आप डेक को एक HTML फ़ाइल के रूप में भी एक्सपोर्ट कर सकते हैं।"
    - q: "क्या Slides मेरे नोट्स, डॉक या वेबसाइट से शुरू कर सकता है?"
      a: "Slides की होम स्क्रीन पर अपनी पिच के बारे में बताएँ और अपने नोट्स या कोई डॉक अटैच करें, या अपनी वेबसाइट का लिंक जोड़ें। आप Google Doc, Word फ़ाइल या PowerPoint भी इम्पोर्ट कर सकते हैं। अगर एजेंट कोई PDF या वेबसाइट नहीं पढ़ पाता, तो अंदाज़ा लगाने के बजाय आपको बता देता है।"
    - q: "Slides किसी चैटबॉट से स्लाइड्स लिखवाने से कैसे अलग है?"
      a: "चैटबॉट आपको टेक्स्ट देता है, जिसे आपको खुद स्लाइड्स में कॉपी करना पड़ता है। Slides में एजेंट असली डेक एक ऐसे एडिटर में बनाता है जो आपको दिखता है। आप किसी भी स्लाइड को खुद बदल सकते हैं या एजेंट से कह सकते हैं, उसी डेक पर, और हर बदलाव को undo किया जा सकता है। यही Slides को एक [एजेंटिक ऐप](https://www.agent-native.com/articles/what-is-an-agent-native-app/) बनाता है: एजेंट का दिमाग, ऐप जैसी आसानी।"
    - q: "क्या मेरा को-फ़ाउंडर मेरे साथ पिच डेक एडिट कर सकता है?"
      a: "आप, आपका को-फ़ाउंडर और एजेंट एक ही समय पर एक ही डेक एडिट कर सकते हैं। आप किसी स्लाइड पर या उसके किसी एक हिस्से पर कमेंट कर सकते हैं। Slides हर अहम बदलाव से पहले एक वर्शन सेव करता है, ताकि आप कभी भी पुराना वर्शन वापस ला सकें।"
    - q: "पिच डेक में कितनी स्लाइड्स होनी चाहिए?"
      a: "पहली पिच के लिए लगभग दस स्लाइड्स सही रहती हैं ([पिच डेक में क्या होना चाहिए](https://www.agent-native.com/articles/how-to-make-a-pitch-deck-with-ai/)), और Slides सुझाव देता है \"इस दस्तावेज़ से 10-स्लाइड पिच बनाएं\"। अगर आपको अलग लंबाई चाहिए, तो एजेंट को बताएँ, और वह उसी हिसाब से आउटलाइन बनाएगा।"
