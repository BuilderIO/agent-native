slug: visual-plan-mode
app: plans
roles:
  - engineering
title: "कोड लिखने से पहले अपने कोडिंग एजेंट का प्लान रिव्यू करें"
seo_title: "Claude Code, Codex और Cursor में विज़ुअल प्लान मोड"
meta_description: "Agent-Native Plan आपके कोडिंग एजेंट के प्लान को डायग्राम, फ़ाइल ट्री और एनोटेटेड कोड वाले पेज में बदलता है, ताकि कोड लिखने से पहले आप उसे रिव्यू कर सकें।"
updated: 2026-10-27
hero:
  body: "Agent-Native Plan आपके एजेंट के लिखे प्लान को डायग्राम, फ़ाइल ट्री और एनोटेटेड कोड वाले पेज में बदलता है। आप किसी भी हिस्से पर कमेंट करते हैं, एजेंट प्लान बदलता है और आपकी मंज़ूरी तक कोई कोड नहीं छूता।"
  button:
    label: "अपना बिल्ड प्लान करें"
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faad0afc668dc461f9023eeba3ba55800
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2c2e3c83e79248e69829bb38f71a6704
    alt: "Plan में खुला टीम इनवाइट्स जोड़ने का प्लान। एक डायग्राम इनवाइट फ़्लो दिखाता है: Settings पेज से API और invites टेबल होते हुए इनवाइट ईमेल तक। उसके नीचे फ़ाइल ट्री में बदलने वाली पाँच फ़ाइलें मार्क हैं। ईमेल वाले स्टेप पर एजेंट के लिए एक टीममेट का कमेंट पिन है।"
how_to:
  heading: "अपने कोडिंग एजेंट के साथ विज़ुअल प्लान मोड कैसे इस्तेमाल करें"
  steps:
    - title: "विज़ुअल प्लान माँगें"
      body: "[एक इंस्टॉल कमांड](https://www.agent-native.com/docs/plan-plugin/) से Plan को Claude Code, Codex या Cursor में जोड़ें। फिर `/visual-plan` और अपना टास्क टाइप करें। एजेंट आपका कोड पढ़ता है और प्लान का लिंक भेज देता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F15e26ab97a68472a958aabf9657fdeb2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F01168fa31ed5412080d49febc37f1068
        alt: "कोडिंग एजेंट की चैट, जिसमें यूज़र ने टीम इनवाइट्स जोड़ने के टास्क के साथ /visual-plan टाइप किया है। एजेंट अपनी पढ़ी हुई फ़ाइलों की लिस्ट देता है, प्लान पब्लिश करता है और उसके लिंक के साथ जवाब देता है।"
    - title: "जो बदलना है, उस पर कमेंट करें"
      body: "कोई वाक्य या डायग्राम पर कोई जगह चुनें और लिखें कि क्या बदलना है। एजेंट से ठीक करवाने के लिए [कमेंट को](https://www.agent-native.com/docs/template-plan-review-workflow/) **एजेंट** पर सेट करें, या टीममेट के लिए **इंसान** पर। प्लान के खुले सवालों के जवाब भी दें।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8a16bd566384f4080dde591a1b30c3f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F598a137b56d149f98409ed79c024cb2b
        alt: "प्लान के डायग्राम में इनवाइट ईमेल वाले स्टेप पर पिन किए गए नए कमेंट का क्लोज़-अप। Agent और Human टॉगल Agent पर सेट है और कमेंट टाइप किया हुआ है।"
    - title: "अपने कमेंट्स एजेंट को भेजें"
      body: "**एजेंट को भेजें** पर क्लिक करें और **अपने एजेंट के लिए कॉपी करें** चुनें, ताकि आपके कमेंट्स एक प्रॉम्प्ट के रूप में कॉपी हो जाएँ। प्लान अपडेट करवाने के लिए इसे एजेंट की चैट में पेस्ट करें। प्लान सही हो जाए तो वहीं मंज़ूरी दें, और एजेंट बिल्ड शुरू कर देता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0f841d0983ec4e3386d13c4c4ad7895d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F356c269c867048c392ca26ef5c5767c8
        alt: "प्लान के Send to agent बटन का क्लोज़-अप, जिसका मेन्यू खुला है: Copy for your agent और Send to inline agent, दोनों के साथ एक लाइन का विवरण।"
features:
  heading: "अपने एजेंट का प्लान रिव्यू करने के लिए आपको जो कुछ चाहिए"
  items:
    - title: "तरीके के डायग्राम"
      body: "रिक्वेस्ट फ़्लो, डेटा मॉडल और API एंडपॉइंट्स चित्र के रूप में दिखते हैं, ताकि गलत एंडपॉइंट या छूटी हुई टेबल बनने से पहले ही नज़र आ जाए।"
    - title: "देखें कौन-सी फ़ाइलें बदलेंगी"
      body: "फ़ाइल ट्री और एनोटेटेड कोड बताते हैं कि काम कहाँ होगा और हर स्टेप आपके कोडबेस से क्या दोबारा इस्तेमाल करता है।"
    - title: "डिफ़ॉल्ट जवाब वाले सवाल"
      body: "जो फ़ैसले एजेंट आपके कोड से तय नहीं कर सकता, वे आखिर में एक फ़ॉर्म में आते हैं, हर एक के साथ उसका सुझाया हुआ जवाब।"
    - title: "प्लान मोड से शुरुआत"
      body: "Claude Code, Codex या किसी Markdown फ़ाइल में पहले से प्लान है? `/visual-plan` नए सिरे से शुरू करने के बजाय उसी से पेज बनाता है।"
    - title: "मंज़ूरी से पहले कोई कोड नहीं"
      body: "प्लान बनाते समय Plan के निर्देश एजेंट को सिर्फ़ आपका कोड पढ़ने देते हैं। आपके प्लान मंज़ूर करने के बाद ही वह बदलाव शुरू करता है।"
    - title: "टीममेट के साथ रिव्यू करें"
      body: "किसी टीममेट को प्लान का लिंक भेजें। वे गेस्ट के तौर पर उसे पढ़ और एडिट कर सकते हैं, और कमेंट करने के लिए Agent-Native अकाउंट से साइन इन करते हैं।"
