other_uses:
  heading: "Agent-Native Plan से आप और क्या कर सकते हैं"
  cards:
    - title: "अपने कोडिंग एजेंट के बदलावों का विज़ुअल रीकैप पाएँ"
      url: https://www.agent-native.com/use-cases/visually-recap-agent-changes/
      body: "किसी पुल रिक्वेस्ट, कमिट या diff को इस विज़ुअल वॉकथ्रू में बदलें कि क्या-क्या बदला।"
    - title: "अपने कोडिंग एजेंट के साथ नई स्क्रीन्स प्लान करें"
      url: https://www.agent-native.com/use-cases/ui-planning/
      body: "अपने कोडिंग एजेंट से स्क्रीन का वायरफ़्रेम बनवाएँ, और कुछ भी बनने से पहले फ़ीडबैक दें।"
faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Plan फ़्री है?"
      a: "हाँ, Agent-Native Plan फ़्री और ओपन सोर्स है। हर प्लान आपके कोडिंग एजेंट के एक सेशन की तरह, आपके चुने हुए मॉडल पर चलता है। इसमें आपके एजेंट के टोकन लगते हैं, और बड़ा प्लान ज़्यादा टोकन लेता है। Plan अभी alpha में है, इसलिए बदलाव होते रहेंगे।"
    - q: "Plan किन कोडिंग एजेंट्स के साथ काम करता है?"
      a: "Claude Code और Codex के लिए प्लगइन इंस्टॉल हैं। एक इंस्टॉल कमांड Plan को Cursor, OpenCode, VS Code के GitHub Copilot और Claude Cowork में भी सेट कर देता है। Cline या Goose जैसा कोई भी दूसरा MCP होस्ट Plan के कनेक्टर को उसके URL से जोड़ सकता है। हर प्लान आप अपने ब्राउज़र में रिव्यू करते हैं।"
    - q: "Plan मेरे कोडिंग एजेंट के प्लान मोड से कैसे अलग है?"
      a: "Claude Code, Codex, Cursor या OpenCode का प्लान मोड आपको चैट में टेक्स्ट के रूप में प्लान देता है। Plan उस प्लान को, या किसी Markdown फ़ाइल वाले प्लान को, डायग्राम, फ़ाइल ट्री और एनोटेटेड कोड वाले पेज में बदलता है। वहाँ आप ठीक-ठीक हिस्सों पर कमेंट करते हैं, एजेंट के सवालों के जवाब देते हैं और किसी टीममेट को भी शामिल करते हैं।"
    - q: "क्या प्लान बनाते समय एजेंट मेरा कोड बदलता है?"
      a: "नहीं। प्लान लिखते या बदलते समय Plan के निर्देश एजेंट को सिर्फ़ आपका कोड पढ़ने देते हैं। आपके प्लान मंज़ूर करने के बाद ही वह एडिट करना शुरू करता है, और बड़े स्टेप्स से पहले मंज़ूर किया हुआ प्लान दोबारा पढ़ता है।"
    - q: "क्या कोई टीममेट बिना अकाउंट के प्लान रिव्यू कर सकता है?"
      a: "कुछ हद तक। जिसे भी आप लिंक भेजते हैं, वह गेस्ट के तौर पर प्लान खोल और एडिट कर सकता है। कमेंट करने, सेव करने और शेयर करने के लिए Agent-Native अकाउंट चाहिए, इसलिए कमेंट करने वाला टीममेट पहले साइन इन करता है।"
    - q: "क्या मैं प्लान्स अपनी मशीन पर ही रख सकता हूँ?"
      a: "हाँ। [लोकल-फ़ाइल्स मोड](https://www.agent-native.com/docs/template-plan-local-and-desktop/) प्लान को आपके कंप्यूटर पर MDX फ़ाइलों के रूप में रखता है, इसलिए उसका कंटेंट कभी होस्टेड ऐप तक नहीं पहुँचता। बदले में, आप लोकल प्लान को शेयर नहीं कर सकते, न ब्राउज़र में उस पर कमेंट कर सकते हैं, और उसका लिंक सिर्फ़ आपकी मशीन पर खुलता है। लोकल-फ़ाइल्स मोड यह नहीं बदलता कि आपके कोडिंग एजेंट का AI मॉडल कहाँ चलता है।"
