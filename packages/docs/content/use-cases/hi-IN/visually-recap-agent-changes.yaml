faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Plan फ़्री है?"
      a: "हाँ, Agent-Native Plan फ़्री और ओपन सोर्स है। हर विज़ुअल रीकैप आपके चुने हुए मॉडल पर एजेंट का पूरा सेशन चलाता है, इसलिए बड़े बदलाव उस मॉडल का ज़्यादा इस्तेमाल करते हैं। Plan अभी alpha में है, इसलिए बदलाव होते रहेंगे।"
    - q: "किन बदलावों पर विज़ुअल रीकैप चलाना फ़ायदेमंद है?"
      a: "बड़े बदलावों पर विज़ुअल रीकैप चलाएँ: जो कई फ़ाइलों में फैले हों या डेटा स्कीमा, किसी API या ऐप के हिस्सों के आपस में जुड़ने के तरीके को छूते हों। एक फ़ाइल के छोटे बदलाव के लिए रीकैप का इंतज़ार करने से सीधा diff पढ़ना जल्दी होता है।"
    - q: "विज़ुअल रीकैप, diff पढ़ने से कैसे अलग है?"
      a: "diff हर बदली गई लाइन को फ़ाइल-दर-फ़ाइल दिखाता है। विज़ुअल रीकैप इससे शुरू होता है कि बदलाव करता क्या है: उसने जो स्क्रीन्स बदलीं वे वायरफ़्रेम के रूप में, जो डेटा फ़ील्ड बदले वे, और शामिल फ़ाइलों का मैप। फिर वह नोट्स के साथ सिर्फ़ पढ़ने लायक diffs दिखाता है।"
    - q: "Plan किन कोडिंग एजेंट्स के साथ काम करता है?"
      a: "इंस्टॉल कमांड Plan को Claude Code, Codex, Cursor, OpenCode, VS Code के GitHub Copilot और Claude Cowork में सेट करता है, और आपको साइन इन भी करा देता है। Plan अपने होस्टेड कनेक्टर के ज़रिए Cline, Goose और MCP सर्वर से जुड़ने वाले किसी भी दूसरे एजेंट में भी काम करता है।"
    - q: "क्या मुझे हर पुल रिक्वेस्ट पर रीकैप मिल सकता है?"
      a: "हाँ। [PR Visual Recap GitHub Action](https://www.agent-native.com/docs/pr-visual-recap/) हर push पर आपकी अपनी API key के साथ Claude Code, Codex या कोई भी OpenAI-compatible मॉडल चलाता है। यह पुल रिक्वेस्ट पर एक कमेंट को रीकैप के स्क्रीनशॉट के साथ अपडेट रखता है, और कभी merge नहीं रोकता। लगभग 600 KB से बड़े diffs छोटे कर दिए जाते हैं।"
    - q: "मेरे रीकैप्स कौन देख सकता है?"
      a: "डिफ़ॉल्ट रूप से सिर्फ़ आपके संगठन में साइन इन किए लोग रीकैप खोल सकते हैं; उसे प्राइवेट करें तो सिर्फ़ आप। GitHub Action के साथ, पुल रिक्वेस्ट देखने वाला हर व्यक्ति रीकैप का स्क्रीनशॉट देखता है। [लोकल-फ़ाइल्स मोड](https://www.agent-native.com/docs/template-plan-local-and-desktop/) रीकैप को होस्टेड ऐप से दूर रखता है, हालाँकि आपके एजेंट का मॉडल वहीं चलता है जहाँ हमेशा चलता है।"
