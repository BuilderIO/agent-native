title: "कंसोल और नेटवर्क लॉग्स के साथ बग रिकॉर्ड करें"
seo_title: "कंसोल लॉग्स के साथ AI बग रिपोर्टिंग टूल"
meta_description: "Chrome में बग दिखाएँ, और Agent-Native Clips आपकी रिकॉर्डिंग को आपके इंजीनियर या कोडिंग एजेंट के लिए एक लिंक में बदल देता है, जिसमें पेज के एरर और फ़ेल हुए रिक्वेस्ट होते हैं।"
updated: 2026-10-27
hero:
  body: "Agent-Native Clips बग की रिकॉर्डिंग को एक ऐसे लिंक में बदल देता है जिस पर आपका इंजीनियर या कोडिंग एजेंट काम कर सके। आप Chrome में बग दिखाते हैं, और पेज के एरर और फ़ेल हुए रिक्वेस्ट उसके साथ आ जाते हैं।"
  button:
    label: "बग रिकॉर्ड करें"
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe36fd7fdff9b49bca2c6787f302964c6
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff375e2d60b2048508c23ea90a9761e08
    alt: "Clips में खुली बग रिकॉर्डिंग, चेकआउट पेज पर रुकी हुई जहाँ एक एरर मैसेज दिख रहा है। वीडियो के बगल के डीबग टैब में एक लाल कंसोल एरर और 500 स्टेटस वाला फ़ेल हुआ रिक्वेस्ट लिस्ट है।"
how_to:
  heading: "AI से बग की रिपोर्ट कैसे करें"
  steps:
    - title: "Chrome से रिकॉर्डिंग शुरू करें"
      body: "अपने टूलबार में Clips Chrome एक्सटेंशन पर क्लिक करें और सोर्स चुनें: एक ब्राउज़र टैब, एक विंडो या पूरी स्क्रीन। अपना कैमरा और माइक्रोफ़ोन चालू या बंद करें, फिर Start recording पर क्लिक करें।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6996593713c74108967e120111378c14
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff7991811f7a346e0a99cf9fe81496e34
        alt: "वेब ऐप के ऊपर Clips एक्सटेंशन पॉपअप का क्लोज़-अप, जिसमें सोर्स के रूप में Browser tab चुना हुआ है, कैमरा और माइक्रोफ़ोन चालू हैं, और Start recording बटन है।"
    - title: "बग दिखाएँ और समझाएँ"
      body: "जिन स्टेप्स में बग आता है उन पर क्लिक करें और बताएँ कि आप क्या होने की उम्मीद कर रहे थे। रिकॉर्डिंग के दौरान एक्सटेंशन पेज के एरर और उसके भेजे रिक्वेस्ट सेव करता है, वही डिटेल्स जो इंजीनियर को वरना Chrome के डेवलपर टूल्स में खोदने पड़ते।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe01ffb73c62c427b8077f05657fdeb47
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff895d85667344971baec96eb0b2ec956
        alt: "एक वेब ऐप के चेकआउट पेज पर Clips के रिकॉर्डिंग कंट्रोल और कैमरा बबल, जहाँ \"Something went wrong\" मैसेज दिख रहा है।"
    - title: "एक लिंक शेयर करें"
      body: "रोकते ही Clips रिकॉर्डिंग का लिंक आपके लिए कॉपी कर देता है। उसे टिकट, चैट या अपने कोडिंग एजेंट में पेस्ट करें। शेयर मेन्यू का एजेंट टैब उसे सीधे Claude, Claude Code या Codex में भी खोलता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F10933b64225545e1b5ecd666f5803832
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2894036362f7409d8a4961536719b399
        alt: "Clips के शेयर मेन्यू का एजेंट टैब पर क्लोज़-अप, जिसमें एजेंट प्रॉम्प्ट कॉपी करें और Claude में खोलें, Claude Code में खोलें और Codex में खोलें बटन हैं।"
features:
  heading: "बग रिपोर्ट करने के लिए आपको जो कुछ चाहिए"
  items:
    - title: "आपके कोडिंग एजेंट के लिए बना"
      body: "लिंक को Claude Code, Cursor या Codex में पेस्ट करें। एजेंट वीडियो डाउनलोड किए बिना ट्रांसक्रिप्ट, फ़्रेम्स और लॉग्स पढ़ लेता है।"
    - title: "कंसोल और नेटवर्क लॉग्स"
      body: "Clips पाँच टैब तक के कंसोल मैसेज, एरर और रिक्वेस्ट सेव करता है, हर रिक्वेस्ट के स्टेटस, टाइमिंग और फ़ेल होने की जानकारी के साथ।"
    - title: "पहले के 30 सेकंड"
      body: "Clips आपके रिकॉर्ड दबाने से 30 सेकंड पहले तक पीछे जाता है, इसलिए पेज लोड होते समय आया एरर भी रिपोर्ट में आ सकता है।"
    - title: "सीक्रेट्स बाहर रहते हैं"
      body: "Clips रिक्वेस्ट बॉडी, हेडर, कुकीज़ या आपका टाइप किया हुआ कभी सेव नहीं करता, और टोकन या पासवर्ड जैसी दिखने वाली वैल्यू छिपा देता है।"
    - title: "सीधे एरर पर जाएँ"
      body: "क्लिप के डीबग टैब में किसी एरर या फ़ेल हुए रिक्वेस्ट के बगल के समय पर क्लिक करें और वीडियो उसी पल पर पहुँच जाता है।"
    - title: "हर बग रिपोर्ट खोजें"
      body: "किसी भी बग रिपोर्ट को उसमें कही गई बात से ढूँढें, या अपनी लाइब्रेरी की हर रिकॉर्डिंग के बारे में Clips एजेंट से पूछें।"
