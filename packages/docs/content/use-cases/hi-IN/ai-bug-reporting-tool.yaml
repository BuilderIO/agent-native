faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Clips फ़्री है?"
      a: "हाँ। Agent-Native Clips फ़्री और ओपन सोर्स है, Chrome एक्सटेंशन समेत। टाइटल, समरी और ट्रांसक्रिप्ट क्लीनअप डिफ़ॉल्ट रूप से Builder.io AI क्रेडिट्स पर चलते हैं, इसलिए AI का इस्तेमाल अनलिमिटेड नहीं है, और रिकॉर्डिंग्स के वीडियो के लिए स्टोरेज की जगह चाहिए। Clips अभी alpha में है, इसलिए आगे बदलाव होते रहेंगे।"
    - q: "Clips मेरे ब्राउज़र से क्या कैप्चर करता है?"
      a: "Clips Chrome एक्सटेंशन पाँच टैब तक के [कंसोल मैसेज, JavaScript एरर और नेटवर्क रिक्वेस्ट](https://www.agent-native.com/docs/template-clips-features/#chrome-extension-browser-logs) कैप्चर करता है, और आपके रिकॉर्ड दबाने से 30 सेकंड पहले तक पीछे जाता है। हर रिक्वेस्ट का एड्रेस, स्टेटस, टाइमिंग और फ़ेल होने की जानकारी रखी जाती है। एडिटर्स यह सब क्लिप के डीबग टैब में देखते हैं, और एजेंट्स इसे लिंक से पाते हैं।"
    - q: "क्या Clips पासवर्ड या प्राइवेट डेटा रिकॉर्ड करता है?"
      a: "Clips रिक्वेस्ट या रिस्पॉन्स बॉडी, हेडर, कुकीज़ या आपका टाइप किया टेक्स्ट कभी सेव नहीं करता, और टोकन, पासवर्ड या key जैसी दिखने वाली वैल्यू छिपा देता है। आप एक्सटेंशन की सेटिंग्स में डेवलपर लॉग्स बंद कर सकते हैं। नई रिकॉर्डिंग्स लिंक वाले किसी भी व्यक्ति के लिए पब्लिक होती हैं, इसलिए जब बग रिपोर्ट में इंटरनल डेटा दिखे, तो उसे प्राइवेट या अपने ऑर्गनाइज़ेशन तक सीमित कर दें।"
    - q: "बग रिकॉर्डिंग Claude Code, Cursor या Codex को कैसे दें?"
      a: "क्लिप का लिंक Claude Code, Cursor या Codex में पेस्ट करें, और एजेंट वीडियो डाउनलोड किए बिना [ट्रांसक्रिप्ट, फ़्रेम्स और ब्राउज़र लॉग्स पढ़ लेता है](https://www.agent-native.com/docs/template-clips-integrations/#agent-readable-clips)। प्राइवेट क्लिप के लिए शेयर मेन्यू के एजेंट टैब में एजेंट प्रॉम्प्ट कॉपी करें पर क्लिक करें, जो एजेंट को दो घंटे चलने वाला लिंक देता है। वही टैब क्लिप को Claude Code या Codex में भी खोलता है।"
    - q: "क्या Clips दूसरे ब्राउज़र्स या डेस्कटॉप ऐप में भी लॉग्स कैप्चर करता है?"
      a: "नहीं। कंसोल और नेटवर्क लॉग्स सिर्फ़ Clips Chrome एक्सटेंशन से आते हैं। Clips Desktop और वेब ऐप फिर भी आपकी स्क्रीन, कैमरा और आवाज़ को ट्रांसक्रिप्ट और समरी के साथ रिकॉर्ड करते हैं, लेकिन रिकॉर्डिंग में ब्राउज़र लॉग्स नहीं होंगे।"
    - q: "क्या Clips, Jira जैसा बग ट्रैकर है?"
      a: "नहीं। Clips [ऐसी बग रिपोर्ट बनाता है जिस पर इंजीनियर काम कर सके](https://www.agent-native.com/articles/how-to-write-a-bug-report/), और उसे आपका ट्रैकर स्टोर करता है: लिंक को Jira, GitHub, Linear या Slack में पेस्ट करें। आपका कोडिंग एजेंट या [Clips एजेंट](https://www.agent-native.com/docs/template-clips-agent/) खुद रिकॉर्डिंग और उसके लॉग्स पढ़ता है। यही Clips को एक [एजेंटिक ऐप](https://www.agent-native.com/articles/what-is-an-agent-native-app/) बनाता है: एजेंट का दिमाग, ऐप जैसी आसानी।"
