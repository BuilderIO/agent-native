title: "अपने प्रॉम्प्ट टाइप करने के बजाय बोलकर लिखें"
seo_title: "AI डिक्टेशन जो किसी भी ऐप में टाइप करता है"
meta_description: "AI डिक्टेशन से Claude Code, Slack या किसी डॉक में बोलें और अपने कर्सर पर साफ़ टेक्स्ट पाएँ। Agent-Native Clips हर डिक्टेशन सेव करता है, ताकि आप उसे बाद में खोज सकें।"
updated: 2026-10-26
hero:
  body: "आपके बोले गए प्रॉम्प्ट, टिकट और जवाब साफ़ टेक्स्ट बनकर आपके कर्सर पर पहुँचते हैं, Claude Code से लेकर Slack तक। Agent-Native Clips हर डिक्टेशन सेव करता है, और कहने पर उसका एजेंट किसी डिक्टेशन को दोबारा लिख देता है।"
  button:
    label: "डिक्टेट करना शुरू करें"
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb42e201ec33f4acf8f8b6d39f67a2503
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3b0e34d91eee4240a0211ba4ca9b0859
    alt: "आज के डिक्टेशन के साथ Clips का डिक्टेट पेज: कोडिंग एजेंट के लिए एक लंबा प्रॉम्प्ट, एक बग टिकट और एक Slack अपडेट। प्रॉम्प्ट का कार्ड खुला है और उसमें मूल और साफ़ किया हुआ टेक्स्ट दिख रहा है।"
how_to:
  heading: "AI डिक्टेशन कैसे इस्तेमाल करें"
  steps:
    - title: "किसी भी ऐप में डिक्टेट करें"
      body: "Clips Desktop इंस्टॉल करें, Claude Code, Linear या Slack में क्लिक करें, और बोलते समय अपना शॉर्टकट दबाए रखें (डिफ़ॉल्ट Fn है, या सेटिंग्स में अपनी पसंद का चुनें)। छोड़ते ही Clips आपके शब्द कर्सर पर रख देता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F493f3728ed1246bb841a651e3aa76300
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb3785ba8ec804690836d94e31ff92e17
        alt: "एक कोडिंग एजेंट की चैट: webhook retries के बारे में बोलकर लिखा प्रॉम्प्ट भेजा गया और एजेंट ने बदलाव कर दिया। कर्सर मैसेज बॉक्स में इंतज़ार कर रहा है, और नीचे Clips पिल अगला प्रॉम्प्ट सुन रही है, उसकी हरी वेवफ़ॉर्म ऊपर उठी है।"
    - title: "Clips को अपने शब्द सिखाएँ"
      body: 'डिक्टेट पेज पर शब्दकोश खोलें और अपना प्रोडक्ट, लाइब्रेरी और साथियों के नाम जोड़ें, या जिस शब्द को Clips बार-बार गलत सुनता है उसके लिए "term → replacement" जोड़ें। पूरी लिस्ट एक साथ जोड़ने के लिए CSV फ़ाइल इम्पोर्ट करें।'
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F855c88996488417e8dc3a532a0fd21a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff4e9c0557a1344f6a55e7e9c4356a5ab
        alt: 'Clips में शब्दकोश पैनल, जिसमें शब्द जोड़ें, इम्पोर्ट करें और CSV एक्सपोर्ट करें बटन हैं। नीचे Agent-Native, "web hooks → webhooks" और "kube control → kubectl" जैसे शब्द हैं।'
    - title: "पुराना डिक्टेशन ढूँढें"
      body: "Clips में Cmd+K दबाएँ और अपना बोला हुआ कोई शब्द टाइप करें। मैच करने वाले डिक्टेशन उस ऐप के साथ दिखते हैं जिसमें आपने उन्हें बोला था। किसी एक को चुनें और वह डिक्टेट पेज पर खुल जाएगा।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5e344071b49f4e51ae5eef2708c46605
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F13f558e09094404f975350ad0c359acc
        alt: 'Clips का सर्च मेन्यू, जिसमें "webhook" टाइप किया हुआ है और डिक्टेट के नीचे दो पुराने डिक्टेशन दिख रहे हैं: Cursor में बोला गया एक प्रॉम्प्ट और Slack में बोला गया एक मैसेज।'
features:
  heading: "टाइप करने के बजाय डिक्टेट करने के लिए आपको जो कुछ चाहिए"
  items:
    - title: "आपका क्लिपबोर्ड वैसा ही रहता है"
      body: "Clips ऐप्स में पेस्ट करता है और आपका क्लिपबोर्ड वापस रख देता है, इसलिए आपका कॉपी किया हुआ लिंक वहीं रहता है। टर्मिनल में वह पेस्ट करने के बजाय टाइप करता है।"
    - title: "AI क्लीनअप, जिसे आप undo कर सकते हैं"
      body: "Clips गलत सुने शब्द, कॉमा और कैपिटल ठीक करता है और हकलाहट वाली शुरुआतें हटा देता है: क्लाउड इंजन के साथ अपने आप, या एक क्लिक में। मूल टेक्स्ट बना रहता है।"
    - title: "आपके सुधारों से सीखता है"
      body: "Clips के पेस्ट करते ही गलत सुना शब्द ठीक करें, और डेस्कटॉप ऐप उस सुधार को आपके शब्दकोश में जोड़ देता है, ताकि अगला डिक्टेशन सही आए।"
    - title: "लंबे प्रॉम्प्ट के लिए हैंड्स-फ़्री"
      body: "सोचते हुए ज़ोर से बोलने के लिए शॉर्टकट दो बार टैप करें ताकि Clips सुनता रहे, और रोकने के लिए एक बार और टैप करें। डिक्टेशन हटाने के लिए Esc दबाएँ।"
    - title: "दोबारा पेस्ट करें"
      body: "अपना आखिरी डिक्टेशन किसी दूसरे टेक्स्ट फ़ील्ड में दोबारा पेस्ट करने के लिए Cmd+Ctrl+V दबाएँ, जब कर्सर गलत जगह रह गया हो तब यह काम आता है।"
    - title: "एजेंट से इसके बारे में पूछें"
      body: 'पूछें "Q3 बजट के बारे में मैंने क्या कहा था?" या "मेरी इस बड़बड़ को बुलेट पॉइंट्स में बदल दो", और एजेंट आपकी हिस्ट्री से जवाब देगा।'
