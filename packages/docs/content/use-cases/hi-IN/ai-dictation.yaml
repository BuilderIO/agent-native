faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Clips फ़्री है?"
      a: "हाँ। Agent-Native Clips फ़्री और ओपन सोर्स है, और डेस्कटॉप ऐप में वॉइस डिक्टेशन डिफ़ॉल्ट रूप से चालू रहता है। AI क्लीनअप Builder.io AI क्रेडिट्स या आपकी अपनी key पर चलता है, इसलिए यह अनलिमिटेड नहीं है। Clips अभी alpha में है, इसलिए आगे बदलाव होते रहेंगे।"
    - q: "Clips मेरे कंप्यूटर में बने डिक्टेशन से कैसे अलग है?"
      a: "बिल्ट-इन डिक्टेशन को किसी सेटअप की ज़रूरत नहीं होती, लेकिन वह [आपके बोले हुए की खोजने लायक हिस्ट्री](https://www.agent-native.com/articles/what-should-you-look-for-in-dictation-software/) नहीं रखता। Clips हर डिक्टेशन को उसके मूल और साफ़ किए हुए टेक्स्ट के साथ सेव करता है, आपके शब्द सीखता है और AI से टेक्स्ट सुधारता है। Clips एजेंट आपका बोला हुआ ढूँढ सकता है और उसे दोबारा लिख सकता है, जैसे किसी बड़बड़ को बुलेट पॉइंट्स में बदलना।"
    - q: "क्या Clips मेरी टीम के जार्गन सही लिखेगा?"
      a: 'हाँ, जब वे शब्द आपके शब्दकोश में हों। उन्हें एक-एक लाइन में जोड़ें, या जिस शब्द को वह बार-बार गलत सुनता है उसके लिए "term → replacement" के रूप में। आप शब्दों की CSV फ़ाइल भी इम्पोर्ट कर सकते हैं। जब आप Clips के पेस्ट करते ही कोई शब्द ठीक करते हैं, तो डेस्कटॉप ऐप वह सुधार अगली बार के लिए आपके शब्दकोश में सेव कर लेता है।'
    - q: "क्या मेरे डिक्टेशन सेव होते हैं, और क्या मैं पुराना डिक्टेशन ढूँढ सकता हूँ?"
      a: 'हर डिक्टेशन अपने मूल और साफ़ किए हुए टेक्स्ट, समय और लंबाई के साथ सेव होता है, और डिक्टेट पेज पर दिन के हिसाब से ग्रुप होकर दिखता है। उन्हें आपके बोले हुए से खोजने के लिए Cmd+K दबाएँ, या [Clips एजेंट](https://www.agent-native.com/docs/template-clips-agent/) से पूछें, जैसे "कल मैंने क्या डिक्टेट किया था, दिखाओ"। आप कोई भी डिक्टेशन डिलीट कर सकते हैं।'
    - q: "क्या मेरी आवाज़ मेरे कंप्यूटर से बाहर जाती है?"
      a: "ज़रूरी नहीं। Clips Desktop आपके डिवाइस पर ही ट्रांसक्राइब कर सकता है, बिल्ट-इन स्पीच रिकग्निशन या Local Whisper के साथ ([Clips के ट्रांसक्रिप्शन इंजन](https://www.agent-native.com/docs/template-clips-features/))। Builder.io या अपनी key के साथ Clips आपका डिक्टेशन क्लीनअप के लिए उस AI सर्विस को भेजता है। हर डिक्टेशन का टेक्स्ट आपके Clips अकाउंट में सेव होता है।"
