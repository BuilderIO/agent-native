faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Design फ़्री है?"
      a: "हाँ, Agent-Native Design फ़्री और ओपन सोर्स है। एजेंट को AI कनेक्शन चाहिए, Builder.io के ज़रिए या आपकी अपनी AI key से। Design अभी alpha में है, इसलिए आगे बढ़ते हुए इसमें बदलाव होते रहेंगे।"
    - q: "क्या मैं अपने PRD या प्रोडक्ट ब्रीफ़ से शुरुआत कर सकता हूँ?"
      a: "हाँ। ब्रीफ़, या अपने प्रोडक्ट रिक्वायरमेंट्स डॉक (PRD) का ज़रूरी हिस्सा प्रॉम्प्ट बॉक्स में पेस्ट करें, और विकल्प चाहिए तो दिशाएँ माँगें। एजेंट आपके शब्द और सटीक दावे बनाए रखता है, और अगर ब्रीफ़ में डिज़ाइन बदल देने वाला कोई फ़ैसला छूटा हो, तो वह पूछता है या अपनी मान्यता बताता है। देखें [डिज़ाइन ब्रीफ़ में क्या लिखें](https://www.agent-native.com/articles/how-to-turn-a-design-brief-into-a-prototype-with-ai/)।"
    - q: "क्या मैं प्रोटोटाइप में क्लिक करके चल सकता हूँ?"
      a: "हाँ। हर स्क्रीन काम करते इंटरैक्शन वाला असली HTML है, और आपकी चुनी दिशा को डिफ़ॉल्ट रूप से डेस्कटॉप और मोबाइल फ़्रेम मिलते हैं। कैनवस पर आज़माने के लिए **इंटरैक्ट** मोड इस्तेमाल करें, या स्क्रीन को नए ब्राउज़र टैब में खोलने के लिए **Design पूर्वावलोकन**।"
    - q: "क्या मैं अपना डिज़ाइन सिस्टम या Figma डिज़ाइन इस्तेमाल कर सकता हूँ?"
      a: "हाँ। [डिज़ाइन सिस्टम](https://www.agent-native.com/docs/template-design-features/) Figma फ़ाइल, आपकी वेबसाइट, GitHub repo, design.md फ़ाइल या नोट्स से बन सकता है, और नए डिज़ाइन उसी को फ़ॉलो करते हैं। आप Figma फ़्रेम को एडिट करने लायक स्क्रीन के रूप में भी इंपोर्ट कर सकते हैं, और जो कुछ Design ठीक-ठीक मैच नहीं कर पाया, उसकी लिस्ट देता है।"
    - q: "क्या प्रोटोटाइप प्रोडक्शन कोड है?"
      a: "नहीं। प्रोटोटाइप एक शुरुआत है, और ऐप लॉजिक, इंटीग्रेशन, टेस्टिंग और डिप्लॉयमेंट अभी बनाने बाकी हैं। HTML या फ़ाइलों का ZIP एक्सपोर्ट करें, या कोडिंग एजेंट को फ़ाइलें, डिज़ाइन टोकन और तैयार प्रॉम्प्ट देने के लिए **एजेंट प्रॉम्प्ट कॉपी करें** इस्तेमाल करें। Claude Code और Codex भी [Design के MCP सर्वर से डिज़ाइन खोल](https://www.agent-native.com/docs/template-design-integrations/) सकते हैं।"
    - q: "Design, किसी चैटबॉट से UI माँगने से कैसे अलग है?"
      a: "Design में एजेंट प्रोटोटाइप को एक कैनवस पर बनाता है, जहाँ आप उसमें क्लिक करके चलते हैं, दिशाओं की तुलना करते हैं और उसे एडिट करते हैं, और आपकी टीम के कमेंट्स सीधे एजेंट तक जाते हैं। चैटबॉट के साथ नतीजा बातचीत में ही रह जाता है। यही Design को एक [एजेंटिक ऐप](https://www.agent-native.com/articles/what-is-an-agent-native-app/) बनाता है: एजेंट का दिमाग, ऐप जैसी आसानी।"
