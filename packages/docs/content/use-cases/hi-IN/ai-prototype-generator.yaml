title: "ब्रीफ़ को क्लिक करने लायक प्रोटोटाइप में बदलें"
seo_title: "प्रोडक्ट ब्रीफ़ के लिए AI प्रोटोटाइप जनरेटर"
meta_description: "प्रोडक्ट या डिज़ाइन ब्रीफ़ पेस्ट करें और Agent-Native Design क्लिक करने लायक, काम करती स्क्रीन्स बनाता है। AI एजेंट से कुछ दिशाएँ माँगें, फिर चुनी हुई को बेहतर बनाएँ।"
updated: 2026-10-27
hero:
  body: "Agent-Native Design आपके प्रोडक्ट या डिज़ाइन ब्रीफ़ में बताई स्क्रीन्स को काम करते HTML के रूप में बनाता है, जिसे आप आज़मा सकते हैं। AI एजेंट से कुछ दिशाएँ माँगें, फिर चुनी हुई को हाथ से या पूछकर बेहतर बनाएँ।"
  button:
    label: "अपने ब्रीफ़ का प्रोटोटाइप बनाएँ"
    url: https://design.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F003e186182b74e3cbe462fe098559bc6
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8f432f3b71d432698c025a7147301bc
    alt: "Design एडिटर में टीम एक्सपेंस ऐप के लिए चुनी गई ऑनबोर्डिंग दिशा Guided checklist, उसके डेस्कटॉप और मोबाइल फ़्रेम में। एजेंट चैट में पेस्ट किया हुआ ब्रीफ़, Pick a direction वाला विकल्प और उसके बाद एजेंट ने जो बदला, वह दिख रहा है।"
how_to:
  heading: "AI से ब्रीफ़ को प्रोटोटाइप में कैसे बदलें"
  steps:
    - title: "अपनी ज़रूरत की स्क्रीन बताएँ"
      body: "Design की होम स्क्रीन पर अपना ब्रीफ़ प्रॉम्प्ट बॉक्स में पेस्ट करें: यह किसके लिए है, कौन-सी स्क्रीन या फ़्लो, और उसे क्या करना है। तीन दिशाएँ माँगें। कोई ज़रूरी बात छूटी हो, तो Design पहले पूछता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ef31fb673e2437fb4dd6ed256a7ba9d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8209bd4f55d7432c94e05172c5475f17
        alt: "Design होम के प्रॉम्प्ट बॉक्स का क्लोज़-अप, जिसमें एक्सपेंस ऐप के ऑनबोर्डिंग फ़्लो का छोटा ब्रीफ़ पेस्ट है, जो \"Show me three directions\" पर खत्म होता है।"
    - title: "पसंद की दिशा चुनें"
      body: "Design तीनों दिशाओं को कैनवस पर अगल-बगल रखता है, हर एक अपनी स्टाइल में काम करती स्क्रीन। हर एक को **इंटरैक्ट** में आज़माएँ, **दिशा चुनें** के नीचे एक चुनें, और एजेंट उसका बाकी हिस्सा बना देता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F137893c57370435d94967b9d5bc6a82a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fda7cdd9a2f3e42b58f44efec2b950fc9
        alt: "कैनवस पर ऑनबोर्डिंग की तीनों दिशाएँ अगल-बगल, और एजेंट चैट में \"Pick a direction\" के साथ हर दिशा के नाम का बटन।"
    - title: "अपनी टीम के साथ बेहतर बनाएँ"
      body: "**डिज़ाइन** टैब में कॉपी, स्पेसिंग और रंग एडिट करें, या कोई एलिमेंट चुनकर एजेंट से कहें। जब कोई टीममेट कमेंट पिन करे, तो **एजेंट को भेजें** पर क्लिक करें और एजेंट वह बदलाव कर देता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F406b66f9b62e49c09f697f5d08599b5e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F566ca2f3c44f439aac2c5307c72aa572
        alt: "चुनी गई ऑनबोर्डिंग स्क्रीन, जिसके इनवाइट स्टेप पर एक टीममेट का कमेंट पिन है, और Comments टैब में कमेंट थ्रेड Send to agent बटन के साथ खुला है।"
features:
  heading: "ब्रीफ़ से प्रोटोटाइप तक पहुँचने के लिए आपको जो कुछ चाहिए"
  items:
    - title: "शुरू से ही क्लिक करने लायक"
      body: "आपकी चुनी दिशा डेस्कटॉप और मोबाइल फ़्रेम में काम करते इंटरैक्शन वाला HTML बन जाती है। **Design पूर्वावलोकन** उसे ब्राउज़र टैब में खोलता है।"
    - title: "आपके ब्रीफ़ के शब्द बने रहते हैं"
      body: "एजेंट आपके शब्द और दावे इस्तेमाल करता है। जब ब्रीफ़ में कोई अहम फ़ैसला छूटा हो, तो वह आपसे पूछता है या अपनी मान्यता बता देता है।"
    - title: "तैयार होने से पहले जाँचा हुआ"
      body: "डिज़ाइन तैयार बताने से पहले एजेंट प्रोटोटाइप पर अपनी accessibility और विज़ुअल जाँच चलाता है।"
    - title: "आपके ब्रांड में प्रोटोटाइप"
      body: "Figma फ़ाइल, अपनी वेबसाइट या GitHub repo से डिज़ाइन सिस्टम बनाएँ, और नए प्रोटोटाइप आपके रंगों और फ़ॉन्ट्स में शुरू होते हैं।"
    - title: "फ़ीडबैक जिस पर एजेंट काम करता है"
      body: "कमेंट अपने एलिमेंट पर पिन रहता है। एजेंट उस जगह को एडिट करता है, जाँचता है कि बदलाव हुआ, फिर थ्रेड रिज़ॉल्व करता है या फ़ैसला आप पर छोड़ता है।"
    - title: "कोडिंग एजेंट्स को सौंपें"
      body: "HTML या फ़ाइलों का ZIP एक्सपोर्ट करें, या एक तैयार प्रॉम्प्ट कॉपी करें जो आपके कोडिंग एजेंट को फ़ाइलें और डिज़ाइन टोकन देता है।"
