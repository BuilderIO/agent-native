faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Content फ़्री है?"
      a: "हाँ, Agent-Native Content फ़्री और ओपन सोर्स है। आपका कोडिंग एजेंट स्पेक को अपने मॉडल पर पढ़ता और एडिट करता है, इसलिए यह आपके एजेंट के इस्तेमाल में गिना जाता है। Content का बिल्ट-इन एजेंट Builder.io क्रेडिट्स या आपकी अपनी मॉडल key पर चलता है। Content अभी alpha में है, इसलिए बदलाव होते रहेंगे।"
    - q: "कौन-से कोडिंग एजेंट मेरा स्पेक पढ़ सकते हैं?"
      a: "Claude Code और Codex पेज को **साझा करें** से खोलते हैं और एक बार कनेक्ट करने को कहते हैं। Cursor और VS Code का GitHub Copilot वहाँ एक क्लिक में Content जोड़ते हैं। Claude Cowork, Goose और OpenCode आपके टर्मिनल से कनेक्ट होते हैं, और साइन-इन वाला कोई भी MCP क्लाइंट [Content से उसके URL के ज़रिए जुड़](https://www.agent-native.com/docs/external-agents/#private-content-links) सकता है। हर एजेंट को सिर्फ़ वही दिखता है जो आपके अकाउंट को दिखता है।"
    - q: "यह मेरी repo की स्पेक फ़ाइल से कैसे अलग है?"
      a: "आपकी repo की स्पेक फ़ाइल एक कॉपी है, जिसे आम तौर पर सिर्फ़ कोड पर काम करने वाले लोग एडिट करते हैं। Content में आपकी टीम उसी पेज पर लिखती और कमेंट करती है जिसे आपका कोडिंग एजेंट पढ़ता है, और एजेंट के बदलाव सुझावों के रूप में आते हैं। अगर आपको repo में भी Markdown चाहिए, तो Content [लोकल फ़ोल्डर के साथ सिंक](https://www.agent-native.com/docs/template-content-sync/) होता है।"
    - q: "क्या मेरा कोडिंग एजेंट स्पेक बदल सकता है?"
      a: "हाँ, उसी एक्सेस के साथ जो आपके अकाउंट के पास है। उससे एडिट सुझाने को कहें, और जब तक आप हर एक को मंज़ूर नहीं करते, पेज वैसा ही रहता है। वह पेज को सीधे एडिट भी कर सकता है, लेकिन अगर एजेंट के पढ़ने के बाद पेज बदल गया हो, तो Content वह एडिट नहीं होने देता। [वर्ज़न हिस्ट्री](https://www.agent-native.com/docs/template-content-editing/) पुराने वर्ज़न रखती है।"
    - q: "क्या मैं अपने स्पेक्स अपनी repo में रख सकता हूँ?"
      a: "हाँ। Content में [लोकल Markdown या MDX फ़ोल्डर](https://www.agent-native.com/docs/template-content-local-files/) कनेक्ट करें और बदलाव pull, check या push करें, या एक कमांड से अपनी repo से Content शुरू करें। कॉन्फ़्लिक्ट आपके रिव्यू के लिए दिखाए जाते हैं। ब्राउज़र खुद लोकल फ़ाइलें नहीं पढ़ सकता, इसलिए इसके लिए लोकल Content ऐप या Agent-Native Desktop चाहिए।"
