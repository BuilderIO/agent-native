faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Analytics फ़्री है?"
      a: "हाँ, Agent-Native Analytics फ़्री और ओपन सोर्स है। होस्टेड ऐप इस्तेमाल करें या अपनी कॉपी खुद चलाएँ। एजेंट को Builder.io या आपकी अपनी मॉडल key के ज़रिए AI कनेक्शन चाहिए, इसलिए AI का इस्तेमाल अनलिमिटेड नहीं है। Analytics अभी alpha में है, इसलिए बदलावों की उम्मीद रखें।"
    - q: "क्या मुझे SQL आना चाहिए?"
      a: "नहीं। आप आसान भाषा में पूछते हैं और एजेंट SQL लिखता है। हो सकता है आपके डेटा को जानने वाले किसी व्यक्ति को पहले [BigQuery कनेक्ट](https://www.agent-native.com/docs/template-analytics-connectors/) करना पड़े। एडमिन **सिमेंटिक लेयर** पेज पर आपकी [मेट्रिक परिभाषाएँ](https://www.agent-native.com/docs/template-analytics-dashboards/) जोड़ सकता है, ताकि एजेंट सही टेबल्स और कॉलम चुने।"
    - q: "क्या यह Postgres, Supabase या Neon के साथ काम करता है?"
      a: "हाँ, Supabase या Neon पर Postgres के लिए। चैट के + मेन्यू से उसे [MCP के ज़रिए](https://www.agent-native.com/docs/mcp-clients/) कनेक्ट करें और चैट में अपना सवाल पूछें। ये जवाब चैट में ही रहते हैं, क्योंकि डैशबोर्ड पैनल अभी Postgres पर क्वेरी नहीं चला सकते। दूसरे Postgres डेटाबेस पर अभी क्वेरी नहीं चल सकती, इसलिए इस पेज के स्टेप्स BigQuery इस्तेमाल करते हैं।"
    - q: "क्या एजेंट मेरा डेटा बदल सकता है?"
      a: "BigQuery में नहीं। Analytics वहाँ एजेंट की ऐसी हर क्वेरी को रिजेक्ट करता है जो डेटा insert, update, delete या drop करे। सेटअप में read-only रोल वाला सर्विस अकाउंट भी माँगा जाता है, जो आपकी टेबल्स पढ़ और क्वेरी चला सकता है, पर उन्हें बदल नहीं सकता। Supabase या Neon के ज़रिए, एजेंट वही कर सकता है जिसकी आप उस कनेक्शन को अनुमति दें।"
    - q: "मुझे कैसे पता चलेगा कि जवाब सही है?"
      a: "उसके पीछे की क्वेरी जाँचें। एजेंट से उसका SQL दिखाने को कहें, या डैशबोर्ड चार्ट पर **SQL देखें** खोलें। आप यह भी पूछ सकते हैं कि उसने कौन-सी टेबल्स और फ़िल्टर इस्तेमाल किए। जब कोई लाइव क्वेरी नहीं चली, तो एजेंट नंबर को **Unverified** मार्क करता है।"
    - q: "CSV एक्सपोर्ट के बारे में ChatGPT से पूछने से यह कैसे अलग है?"
      a: "चैट असिस्टेंट आपकी एक्सपोर्ट की हुई फ़ाइल से जवाब देता है, इसलिए हर नया सवाल नए एक्सपोर्ट से शुरू होता है। Analytics सीधे आपके वेयरहाउस पर क्वेरी चलाता है, आपकी टीम की मेट्रिक परिभाषाएँ इस्तेमाल करता है, और जो जवाब आपको फिर चाहिए उन्हें डैशबोर्ड पर रखता है। यही एक [एजेंटिक ऐप](https://www.agent-native.com/articles/what-is-an-agent-native-app/) है: एजेंट का दिमाग, ऐप जैसी आसानी।"
