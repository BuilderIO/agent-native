title: "अपने डेटा से आसान भाषा में सवाल पूछें"
seo_title: "SQL के बिना अपने डेटाबेस से सवाल पूछें"
meta_description: "अपने BigQuery डेटा के बारे में सवाल पूछें, Agent-Native Analytics जाँचने लायक read-only SQL से जवाब देता है और बार-बार पूछे जाने वाले सवाल डैशबोर्ड पर रखता है।"
updated: 2026-10-27
hero:
  body: "Agent-Native Analytics आपके BigQuery डेटा से जवाब देता है और दोबारा पूछे जाने वाले सवालों को डैशबोर्ड पर रखता है। एजेंट read-only SQL लिखता है, जिसे आप जाँच सकते हैं।"
  button:
    label: "अपने डेटा से पूछें"
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd1120abfcd1447b9ab48ff98a9b7592d
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2db877a772674ad4af41e7efbb062d50
    alt: "Analytics में Ask खुला है। एजेंट पिछले हफ़्ते के साइनअप्स वाले सवाल का जवाब प्लान के हिसाब से बार चार्ट और उस टेबल के साथ देता है जिससे उसने गिनती की। नीचे, एक फ़ॉलो-अप सवाल दिखाता है कि Pro सबसे ज़्यादा बढ़ा।"
how_to:
  heading: "अपने डेटाबेस से आसान भाषा में सवाल कैसे पूछें"
  steps:
    - title: "अपना डेटा वेयरहाउस कनेक्ट करें"
      body: "**डेटा स्रोत** पेज पर BigQuery खोलें। BigQuery Data Viewer और BigQuery Job User रोल वाले सर्विस अकाउंट की JSON key अपलोड करें, अपना प्रोजेक्ट ID डालें, फिर **क्रेडेंशियल सहेजें** और **कनेक्शन का परीक्षण करें** पर क्लिक करें।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F62008ebd98594f02b1c0bf3ae565ef49
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb01d428bca15467eb4c04299dd9575b8
        alt: "Data Sources पर BigQuery कार्ड का क्लोज़-अप, Connected मार्क किया हुआ, प्रोजेक्ट ID और सर्विस अकाउंट Configured, और \"Connection successful\"।"
    - title: "अपना सवाल आसान भाषा में पूछें"
      body: "**पूछें** में सवाल वैसे ही टाइप करें जैसे किसी टीममेट से पूछते: \"पिछले हफ़्ते प्लान के हिसाब से कितने अकाउंट साइन अप हुए?\" एजेंट सही टेबल्स ढूँढता है, क्वेरी चलाता है और चार्ट के साथ जवाब देता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3e9ac5b30a924dab9b09bc76ed24b2de
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F31c48c5ccc9247b792c00474b01f97b0
        alt: "Ask चैट का क्लोज़-अप। एजेंट ने BigQuery स्कीमा खोजा, एक क्वेरी चलाई और 723 साइनअप्स और प्लान के हिसाब से बार चार्ट के साथ जवाब दिया।"
    - title: "जवाब को डैशबोर्ड पर रखें"
      body: "एजेंट से कहें \"इसे डैशबोर्ड में जोड़ दो\"। वह पैनल बनाता है, जाँचता है कि उसका SQL चलता है और डैशबोर्ड सेव करता है। डैशबोर्ड तब तक प्राइवेट रहता है जब तक आप उसे किसी टीममेट या पूरे संगठन के साथ शेयर न करें।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F957858f8613241a2b2249d88430b3cc4
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd0111e9f420149fc8a35cad845ad8e2e
        alt: "एक नया Weekly signups डैशबोर्ड, जिसमें प्लान के हिसाब से साइनअप्स वाला पैनल और हफ़्ते के हिसाब से साइनअप्स का चार्ट है। बगल की एजेंट चैट बताती है कि दोनों पैनल BigQuery पर जाँचे गए।"
features:
  heading: "अपने डेटाबेस से जवाब पाने के लिए आपको जो कुछ चाहिए"
  items:
    - title: "हर जवाब के पीछे का SQL"
      body: "किसी भी डैशबोर्ड चार्ट पर **SQL देखें** खोलें, या चैट में पूछें, ताकि एजेंट की लिखी क्वेरी दिखे और आप उसे कॉपी करके खुद चला सकें।"
    - title: "आपकी टीम की मेट्रिक परिभाषाएँ"
      body: "एडमिन **सिमेंटिक लेयर** पेज पर लिखता है कि \"active\" या \"signup\" का मतलब क्या है। SQL लिखने से पहले एजेंट उसे पढ़ता है।"
    - title: "ऐसी क्वेरीज़ जो डेटा नहीं बदल सकतीं"
      body: "BigQuery में एजेंट का SQL insert, update या delete नहीं कर सकता, और वह ऐसे सर्विस अकाउंट से जुड़ता है जो सिर्फ़ टेबल्स पढ़ सकता है और क्वेरी चला सकता है।"
    - title: "डैशबोर्ड, जिन्हें एजेंट एडिट करता है"
      body: "चैट में एक और पैनल, फ़िल्टर या प्लान के हिसाब से ब्रेकडाउन माँगें, और एजेंट उन सभी के लिए डैशबोर्ड बदल देता है जिनके साथ आपने उसे शेयर किया है।"
    - title: "आपके टूल्स में फैले सवाल"
      body: "एक ही सवाल पूछें जो आपके वेयरहाउस की टेबल्स को Stripe रेवेन्यू, HubSpot डील्स या PostHog इवेंट्स के साथ मिलाए।"
    - title: "आपके इनबॉक्स में डैशबोर्ड"
      body: "हर दिन अपने चुने समय पर डैशबोर्ड ईमेल से पाएँ, उसके चार्ट और टेबल्स ईमेल में ही, पाँच लोगों तक के लिए।"
