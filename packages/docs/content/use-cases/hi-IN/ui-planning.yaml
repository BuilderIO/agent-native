faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Plan फ़्री है?"
      a: "हाँ, [Agent-Native Plan](https://www.agent-native.com/docs/template-plan/) फ़्री और ओपन सोर्स है। स्क्रीन्स आपका अपना कोडिंग एजेंट बनाता है, इसलिए हर प्लान आपके एजेंट के मॉडल पर चलता है और उसके इस्तेमाल में गिना जाता है, और लंबा प्लान ज़्यादा इस्तेमाल करता है। Plan अभी alpha में है, इसलिए बदलाव होते रहेंगे।"
    - q: "Plan के साथ कौन-से कोडिंग एजेंट्स काम करते हैं?"
      a: "Agent-Native Plan के Claude Code और Codex के लिए प्लगइन हैं। इंस्टॉल कमांड Cursor, OpenCode और GitHub Copilot को भी इसी तरह सेट करता है, और एक बार साइन इन करके `/visual-plan` जोड़ देता है। Cline, Goose और MCP सपोर्ट करने वाले दूसरे एजेंट्स Plan का URL जोड़कर कनेक्ट होते हैं।"
    - q: "प्लान में जो दिखता है, उसे मैं कैसे बदलूँ?"
      a: "आप किसी स्क्रीन को [उस पर कमेंट करके](https://www.agent-native.com/docs/template-plan-review-workflow/) बदलते हैं, और आपका कोडिंग एजेंट उसे दोबारा बनाता है। Plan में स्क्रीन के हिस्सों को हाथ से ड्रैग या रीसाइज़ नहीं किया जा सकता। स्क्रीन्स के नीचे लिखा हुआ प्लान अलग है: उसका टेक्स्ट आप सीधे एडिट कर सकते हैं।"
    - q: "क्या स्क्रीन्स मेरे मौजूदा ऐप जैसी दिखेंगी?"
      a: "हाँ, जब स्क्रीन आपके पहले से मौजूद ऐप का हिस्सा हो। बनाने से पहले आपका कोडिंग एजेंट आपके ऐप का कोड, उसका लेआउट और कंपोनेंट्स पढ़ता है, ताकि प्लान में आपका असली साइडबार, टूलबार और मेन्यू दिखें। बिल्कुल नए ऐप की स्क्रीन्स आपके बताए विवरण से बनती हैं।"
    - q: "Plan मेरे कोडिंग एजेंट के प्लान मोड से कैसे अलग है?"
      a: "Plan आपके एजेंट के प्लान मोड के साथ काम करता है और उसके प्लान को स्क्रीन्स के रूप में दिखाता है। `/visual-plan` को वह Claude Code, Codex या Markdown प्लान दें जो आपका एजेंट पहले लिख चुका है, और Plan उसे उन स्क्रीन्स में बदल देता है जिनका उसमें ज़िक्र है, ठीक-ठीक जगह पर पिन किए जाने वाले कमेंट्स के लिए तैयार।"
