title: "अपने कोडिंग एजेंट के साथ नई स्क्रीन्स प्लान करें"
seo_title: "Claude Code, Codex और Cursor के लिए UI प्लानिंग"
meta_description: "Agent-Native Plan के साथ आप और आपका कोडिंग एजेंट ऐप के असली लेआउट में, हर स्थिति के वायरफ़्रेम से स्क्रीन प्लान करते हैं। कमेंट करें, एजेंट सुधारता है, फिर बनाता है।"
updated: 2026-10-27
hero:
  body: "Agent-Native Plan के साथ आपका कोडिंग एजेंट नई स्क्रीन को उसकी हर स्थिति के वायरफ़्रेम में, आपके ऐप के असली लेआउट में प्लान करता है। जो बदलना है उस पर कमेंट करें, और एजेंट बनाने से पहले प्लान दोबारा बनाता है।"
  button:
    label: "स्क्रीन प्लान करें"
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4f78a2d9f380427bb3da0723b14fcbe4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8547890f69d44a0bb7e9d9d05246850a
    alt: "Plan में नई Invoices स्क्रीन का प्लान। तीन स्केच किए गए फ़्रेम अगल-बगल हैं: इनवॉइस लिस्ट, उसकी खाली स्थिति और फ़ेल हुए पेमेंट की एरर, हर एक बिलिंग ऐप के अपने साइडबार और टूलबार के अंदर। लिस्ट के स्टेटस फ़िल्टर पर एक कमेंट पिन है, और नीचे लिखा हुआ प्लान शुरू होता है।"
how_to:
  heading: "कोडिंग एजेंट के बनाने से पहले स्क्रीन का वायरफ़्रेम कैसे बनाएँ"
  steps:
    - title: "अपने एजेंट से स्क्रीन माँगें"
      body: "[एक इंस्टॉल कमांड](https://www.agent-native.com/docs/plan-plugin/) से Plan को Claude Code, Codex, Cursor, OpenCode या GitHub Copilot में जोड़ें, फिर `/visual-plan` टाइप करें और अपनी चाही स्क्रीन बताएँ। आपका कोडिंग एजेंट आपका ऐप पढ़ता है, स्क्रीन का वायरफ़्रेम बनाता है और प्लान का लिंक भेजता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F96c7a6d6f73a42ed96a551c112cb269a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F60c66f4f9b2442a290e2a258cc70b3f2
        alt: "कोडिंग एजेंट की चैट का क्लोज़-अप: स्टेटस फ़िल्टर, खाली स्थिति और फ़ेल हुए पेमेंट की एरर वाली Invoices स्क्रीन के लिए /visual-plan रिक्वेस्ट। एजेंट ऐप की लेआउट और कंपोनेंट की पाँच फ़ाइलें पढ़ता है, प्लान बनाता है और रिव्यू के लिंक के साथ जवाब देता है।"
    - title: "जो बदलना है, उस पर कमेंट करें"
      body: "प्लान खोलें, स्क्रीन पर ठीक उस जगह क्लिक करें जो गलत है और लिखें कि क्या बदलना है। कमेंट को **एजेंट** पर सेट करें ताकि आपका कोडिंग एजेंट उस पर काम करे, या टीममेट के लिए **इंसान** पर।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb9adb0ff68324479a0c18c8124a77b2e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F765ae87885404c408e1f4ee46d15711d
        alt: "इनवॉइस लिस्ट फ़्रेम का क्लोज़-अप, जिसमें स्टेटस फ़िल्टर पर एक कमेंट पिन है। कमेंट बॉक्स Agent पर सेट है और उसमें लिखा है: स्टेटस फ़िल्टर को All, Paid और Overdue वाला segmented control बनाओ।"
    - title: "अपने कमेंट्स एजेंट को भेजें"
      body: "**एजेंट को भेजें** पर क्लिक करें, **अपने एजेंट के लिए कॉपी करें** चुनें और प्रॉम्प्ट को एजेंट की चैट में पेस्ट करें। आपका कोडिंग एजेंट प्लान अपडेट करता है और जिन कमेंट्स को ठीक किया उन्हें रिज़ॉल्व करता है। स्क्रीन सही लगे तो एजेंट से उसे बनाने को कहें।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9263e46c4be445389bfc97bee3a78e74
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5910f3c944e9443aafe166a356c27bff
        alt: "3 खुले कमेंट्स के साथ Send to agent बटन का क्लोज़-अप। इसका मेन्यू खुला है, जिसमें दो विकल्प हैं: Copy for your agent और Send to inline agent।"
features:
  heading: "पहली बार में ही सही स्क्रीन के लिए आपको जो कुछ चाहिए"
  items:
    - title: "आपके असली ऐप के अंदर बनी"
      body: "आपका कोडिंग एजेंट बनाने से पहले आपकी मौजूदा स्क्रीन्स और कंपोनेंट्स पढ़ता है, ताकि नई स्क्रीन में साइडबार, टूलबार और मेन्यू अपनी जगह पर रहें।"
    - title: "स्क्रीन की हर स्थिति"
      body: "आपका एजेंट हर अहम स्थिति का फ़्रेम बनाता है, जैसे लोडिंग, खाली, एरर या खुला मेन्यू, ताकि आप देख सकें कि प्रॉम्प्ट में क्या छूट गया।"
    - title: "ठीक उसी एलिमेंट पर कमेंट"
      body: "आपके कोडिंग एजेंट को वही बटन, रो या कार्ड मिलता है जिस पर कमेंट पिन है, इसलिए \"इसे segmented control बनाओ\" जैसा छोटा नोट काफ़ी है।"
    - title: "खुले कमेंट्स खुले रहते हैं"
      body: "आपका कोडिंग एजेंट कमेंट रिज़ॉल्व करने से पहले पुष्टि करता है कि बदलाव हो गया, इसलिए जो कुछ छूट गया वह आपके लिए इंतज़ार करता रहता है।"
    - title: "कई स्टेप वाले फ़्लो का प्रोटोटाइप"
      body: "ऑनबोर्डिंग या चेकआउट जैसे फ़्लो के लिए आपका एजेंट स्क्रीन्स के बगल में **प्रोटोटाइप** टैब में क्लिक करने लायक प्रोटोटाइप जोड़ता है।"
    - title: "अपनी टीम के साथ रिव्यू करें"
      body: "प्लान लिंक से शेयर करें ताकि टीममेट्स अपने ब्राउज़र में स्क्रीन्स खोल सकें। Agent-Native अकाउंट वाला कोई भी व्यक्ति कमेंट जोड़ सकता है।"
