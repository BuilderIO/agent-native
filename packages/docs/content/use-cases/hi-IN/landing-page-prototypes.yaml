other_uses:
  heading: "Agent-Native Design से आप और क्या कर सकते हैं"
  cards:
    - title: "ब्रीफ़ को क्लिक करने लायक प्रोटोटाइप में बदलें"
      url: https://www.agent-native.com/use-cases/ai-prototype-generator/
      body: "अपने डिज़ाइन ब्रीफ़ से नई स्क्रीन या प्रोडक्ट फ़्लो का प्रोटोटाइप बनाएँ, फिर अपनी टीम के साथ उसमें क्लिक करके देखें।"
faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Design फ़्री है?"
      a: "हाँ, Agent-Native Design फ़्री और ओपन सोर्स है। पेज बनाने के लिए AI कनेक्शन चाहिए, Builder.io AI क्रेडिट्स से या आपकी अपनी AI key से, इसलिए AI का इस्तेमाल असीमित नहीं है। Design अभी alpha में है, इसलिए आगे बढ़ते हुए इसमें बदलाव होते रहेंगे।"
    - q: "क्या Design मेरा लैंडिंग पेज पब्लिश या होस्ट करता है?"
      a: "नहीं। Design लैंडिंग पेज बनाकर एक्सपोर्ट करता है, और आप उसे उन्हीं टूल्स से डिप्लॉय करते हैं जो आज इस्तेमाल करते हैं। HTML या फ़ाइलों का ZIP डाउनलोड करें, या वह प्रॉम्प्ट कॉपी करें जिससे आपका कोडिंग एजेंट पेज आपकी साइट में जोड़ता है।"
    - q: "क्या मैं अपना ब्रांड इस्तेमाल कर सकता हूँ?"
      a: "हाँ। Figma फ़ाइल, अपनी वेबसाइट, GitHub repo या अपलोड की गई फ़ाइलों से डिज़ाइन सिस्टम बनाएँ, और पेज शुरू करते समय उसे चुनें। एजेंट अपने बनाए हर वर्ज़न पर उसके रंग, फ़ॉन्ट्स और स्टाइल्स बनाए रखता है।"
    - q: "क्या AI के बनाने के बाद मैं लैंडिंग पेज एडिट कर सकता हूँ?"
      a: "हाँ। पेज पर टेक्स्ट, रंग, स्पेसिंग और लेआउट हाथ से बदलें, या एजेंट से कोई सेक्शन बदलने को कहें। आप कभी भी **संस्करण इतिहास** से पुराना वर्ज़न वापस ला सकते हैं।"
    - q: "लैंडिंग पेज एक्सपोर्ट करने पर मुझे क्या मिलता है?"
      a: "**HTML डाउनलोड करें** एक फ़ाइल देता है जो किसी भी ब्राउज़र में खुलती है और अपनी स्टाइल्स इंटरनेट से लोड करती है। **ZIP डाउनलोड करें** में पेज की सभी फ़ाइलें होती हैं, और **Figma के लिए डाउनलोड करें (SVG)** ऐसी लेयर्स देता है जिन्हें आप Figma में एडिट कर सकते हैं। डॉक्स में [हर एक्सपोर्ट विकल्प](https://www.agent-native.com/docs/template-design-features/#export) की लिस्ट है।"
    - q: "Design, किसी चैटबॉट से लैंडिंग पेज माँगने से कैसे अलग है?"
      a: "चैटबॉट आपको कोड देता है जिसे पेज देखने से पहले कहीं पेस्ट करना पड़ता है। Design में एजेंट पेज को ऐसे एडिटर में, कई वर्ज़न में बनाता है जिसे आप देख और क्लिक कर सकते हैं। आप उसे हाथ से या पूछकर, उसी पेज पर बदलते हैं। यही एक [एजेंटिक ऐप](https://www.agent-native.com/articles/what-is-an-agent-native-app/) है: एजेंट का दिमाग, ऐप जैसी आसानी।"
