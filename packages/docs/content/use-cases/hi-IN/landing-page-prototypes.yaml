title: "लॉन्च ब्रीफ़ को लैंडिंग पेज प्रोटोटाइप में बदलें"
seo_title: "आपके लॉन्च के लिए AI लैंडिंग पेज प्रोटोटाइप"
meta_description: "Agent-Native Design को लॉन्च ब्रीफ़ दें और अपने ब्रांड में लैंडिंग पेज के कुछ वर्ज़न पाएँ, जिन्हें क्लिक करके देखें, तुलना करें और HTML में एक्सपोर्ट करें। फ़्री और ओपन सोर्स।"
updated: 2026-10-27
hero:
  body: "Agent-Native Design आपके ब्रांड में कुछ वर्ज़न अगल-बगल बनाता है। जो चुनें उसे हाथ से या पूछकर एडिट करें, फिर अपनी साइट में जोड़ने के लिए उसे HTML फ़ाइल के रूप में डाउनलोड करें।"
  button:
    label: "अपना पेज डिज़ाइन करें"
    url: https://design.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9b9b61c476d745258cbb0f1b78da71be
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F921c26eb2c474e48b203e069b070269f
    alt: "Design एडिटर में Ledgerlane के same-day कॉन्ट्रैक्टर पेआउट्स के लॉन्च पेज का Product-first वर्ज़न, डेस्कटॉप और मोबाइल फ़्रेम में। बाईं ओर एजेंट चैट में लॉन्च ब्रीफ़, उसके दिए तीन वर्ज़न जिनमें Product-first चुना गया है, और यह नोट है कि पेज पूरा बन गया है।"
how_to:
  heading: "AI से लैंडिंग पेज प्रोटोटाइप कैसे बनाएँ"
  steps:
    - title: "अपना लॉन्च बताएँ"
      body: "Design की होम स्क्रीन पर अपना लॉन्च ब्रीफ़ **नया डिज़ाइन** बॉक्स में पेस्ट करें: [ऑफ़र, यह किसके लिए है और कॉल टू एक्शन](https://www.agent-native.com/articles/how-do-you-build-a-landing-page-with-ai/)। या ब्रीफ़ को फ़ाइल के रूप में अटैच करें, और बॉक्स के नीचे अपने ब्रांड का डिज़ाइन सिस्टम चुनें।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8d189f62f944b3d935b058b826150b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8db8cda1abfe476f954bfa5bc50a7b6d
        alt: "Design होम स्क्रीन के New design बॉक्स का क्लोज़-अप। Ledgerlane के same-day पेआउट्स का लॉन्च ब्रीफ़ टाइप किया हुआ है, ब्रीफ़ की PDF अटैच है और Ledgerlane Brand डिज़ाइन सिस्टम चुना हुआ है।"
    - title: "कुछ वर्ज़न की तुलना करें"
      body: "एजेंट से \"तीन वर्ज़न\" माँगें। हर एक बोर्ड पर अपनी अलग स्क्रीन के रूप में अगल-बगल दिखता है। चैट में एक चुनें, और एजेंट उसे पूरा पेज बनाकर बाकी हटा देता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F45d7dcdb0a2d473e82e516e2419e21f0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe7aac725b27c4046b57faf5e69a2abf2
        alt: "बोर्ड पर same-day पेआउट्स लॉन्च पेज के तीन वर्ज़न अगल-बगल: Product-first, Editorial और Proof-led। एजेंट चैट पूछती है कि किसे पूरा बनाया जाए, हर एक के लिए एक बटन के साथ।"
    - title: "पेज का HTML एक्सपोर्ट करें"
      body: "एडिटर के मेन्यू में **फ़ाइल**, फिर **निर्यात** चुनें। **HTML डाउनलोड करें** आपको एक फ़ाइल देता है जो किसी भी ब्राउज़र में खुलती है। **एजेंट प्रॉम्प्ट कॉपी करें** कोडिंग एजेंट को वह सब देता है जो पेज को आपकी साइट में बनाने के लिए चाहिए।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F171cf01db5ca44ee8d31ebb6f98a73b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd2640c796dc44746ae1c8a622ec49bdc
        alt: "Product-first लॉन्च पेज के ऊपर एडिटर के मेन्यू का क्लोज़-अप, जिसमें File और Export खुले हैं। विकल्पों में Download HTML, Download ZIP, Download for Figma (SVG) और Copy agent prompt हैं।"
features:
  heading: "अपना लॉन्च पेज डिज़ाइन करने के लिए आपको जो कुछ चाहिए"
  items:
    - title: "ब्रीफ़ से लैंडिंग पेज तक"
      body: "एजेंट नए दावे गढ़ने के बजाय आपके ब्रीफ़ के दावों से बनाता है। जब ब्रीफ़ में कोई फ़ैसला खुला हो, तो वह पूछता है या बताता है कि उसने क्या माना।"
    - title: "AI और विज़ुअल एडिटिंग"
      body: "हेडलाइन, रंग या स्पेसिंग खुद बदलें, या एजेंट से किसी सेक्शन को दोबारा बनाने को कहें। आप दोनों एक ही पेज एडिट करते हैं।"
    - title: "अगल-बगल वर्ज़न"
      body: "हर वर्ज़न को अपना लुक और मोबाइल लेआउट मिलता है, ताकि कुछ भी लाइव होने से पहले आपकी टीम असली दिशाओं की तुलना कर सके।"
    - title: "हर लॉन्च ब्रांड के मुताबिक"
      body: "अपनी Figma फ़ाइल, वेबसाइट या कोड से एक बार डिज़ाइन सिस्टम बनाएँ। हर नया लॉन्च पेज आपके रंग, फ़ॉन्ट्स और स्टाइल्स इस्तेमाल करता है।"
    - title: "पेज पर पिन किया फ़ीडबैक"
      body: "रिव्यूअर्स ठीक उसी हेडलाइन या बटन पर कमेंट पिन करते हैं। कोई कमेंट एजेंट को भेजें: वह बदलाव कर देता है, या फ़ैसला आप पर छोड़ता है।"
    - title: "आपके डेवलपर के लिए कोड हैंडऑफ़"
      body: "एजेंट प्रॉम्प्ट में आपके डिज़ाइन टोकन, पेज की फ़ाइलें और वे निर्देश होते हैं जिनसे कोडिंग एजेंट उसे आपकी साइट में बना सके।"
