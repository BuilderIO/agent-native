title: "स्प्रेडशीट के बिना अपनी वीकली मार्केटिंग रिपोर्ट बनाएँ"
seo_title: "GA4 और HubSpot से वीकली मार्केटिंग रिपोर्ट"
meta_description: "Agent-Native Analytics से Google Analytics और HubSpot डेटा पर अपनी वीकली मार्केटिंग रिपोर्ट बनाएँ। पूछें कि हफ़्ता कैसा रहा और जवाब डैशबोर्ड के रूप में शेयर करें।"
updated: 2026-10-27
hero:
  body: "Agent-Native Analytics आपके Google Analytics और HubSpot डेटा को सोमवार की मार्केटिंग रिपोर्ट में बदलता है। पूछें कि हफ़्ता कैसा रहा, और एजेंट हर जवाब एक डैशबोर्ड में रखता है, जिसे फिर कभी नहीं बनाना पड़ता।"
  button:
    label: "अपना डैशबोर्ड बनाएँ"
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8b9582619b1b42e4a44e6246e01ff7f8
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F70d3b80ce73f472c95b94f7f5c0d65d6
    alt: "Analytics में खुला वीकली मार्केटिंग डैशबोर्ड। ऊपर के मेट्रिक कार्ड्स इस हफ़्ते के सेशन्स, ऑर्गेनिक साइनअप्स, नए HubSpot कॉन्टैक्ट्स और बनी डील्स दिखाते हैं, हर एक के साथ पिछले हफ़्ते से बदलाव। उनके नीचे एक बार चार्ट इस हफ़्ते और पिछले हफ़्ते के चैनल-वार सेशन्स की तुलना करता है, और एक लाइन चार्ट रोज़ बनी HubSpot डील्स दिखाता है। दाईं ओर एजेंट चैट में सवाल \"How did the week go?\" और एक छोटा जवाब है, जो ऑर्गेनिक सर्च को सबसे बड़ी बढ़त बताता है।"
how_to:
  heading: "AI से वीकली मार्केटिंग रिपोर्ट कैसे बनाएँ"
  steps:
    - title: "अपना मार्केटिंग डेटा कनेक्ट करें"
      body: "**डेटा स्रोत** खोलें, Google Analytics और HubSpot कार्ड्स पर दिए [सेटअप स्टेप्स](https://www.agent-native.com/docs/template-analytics-connectors/) पूरे करें, और **कनेक्शन का परीक्षण करें** पर क्लिक करें। Google Analytics के लिए एक Google Cloud service account चाहिए जिसके पास आपकी property का Viewer एक्सेस हो, यह एक बार का सेटअप है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0218d6c271db4bbe8534c00e6f5e85a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa38de1d80c2e4f7fb8e1407d95f97984
        alt: "Data Sources पेज का क्लोज़-अप, जिसमें Google Analytics और HubSpot कनेक्टेड दिख रहे हैं। बगल में HubSpot का सेटअप पैनल खुला है, टोकन कॉन्फ़िगर है और Test connection पर Connection successful दिख रहा है।"
    - title: "पूछें कि हफ़्ता कैसा रहा"
      body: "वही पूछें जो आप किसी एनालिस्ट से पूछते। जैसे: \"इस हफ़्ते ऑर्गेनिक सर्च से साइनअप्स पिछले हफ़्ते के मुकाबले कैसे रहे?\" एजेंट आपके डेटा पर लाइव क्वेरी चलाता है और चार्ट के साथ जवाब देता है।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fcd7a4f648f5b4dee8a6282c3f512f698
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F74bf8b013f944b96a414979ff7234deb
        alt: "एजेंट चैट में वही सवाल और उसका जवाब। दो वाक्य बताते हैं कि ऑर्गेनिक साइनअप्स पिछले हफ़्ते से बढ़े, और उनके नीचे इस हफ़्ते और पिछले हफ़्ते के चैनल-वार साइनअप्स का बार चार्ट है।"
    - title: "अपना डैशबोर्ड सेव और शेयर करें"
      body: "एजेंट से कहें \"इसे मेरा वीकली मार्केटिंग डैशबोर्ड बना दो\"। किसी टीममेट या पूरे संगठन को [देखने या एडिट करने का एक्सेस](https://www.agent-native.com/docs/sharing/) देने के लिए **Share** पर क्लिक करें, या इसे रोज़ आपके चुने समय पर भेजने के लिए **ईमेल रिपोर्ट** खोलें।"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F04feeeb2a1384ce0adecb7bee676b806
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F61fd64ac2bff4f53a3ca6cfbd97225fe
        alt: "वीकली मार्केटिंग डैशबोर्ड, जिस पर Email reports डायलॉग खुला है: Send to, Email और Slack पर सेट है, टीम के दो पते हैं, भेजने का समय 9:00 है और Send now बटन है।"
features:
  heading: "अपने मार्केटिंग हफ़्ते की रिपोर्ट के लिए आपको जो कुछ चाहिए"
  items:
    - title: "एक सवाल में दोनों टूल्स"
      body: "एक ही सवाल में Google Analytics सेशन्स और HubSpot कॉन्टैक्ट्स के बारे में पूछें, और एजेंट दोनों को अगल-बगल रखकर जवाब देता है।"
    - title: "ट्रैफ़िक के बगल में सर्च रैंकिंग"
      body: "DataForSEO कनेक्ट करें और पूछें कि इस हफ़्ते के ऑर्गेनिक सेशन्स के साथ आपकी कीवर्ड रैंकिंग कैसे बदली।"
    - title: "हमेशा ताज़ा नंबर"
      body: "Google Analytics चार्ट लाइव क्वेरी करते हैं और HubSpot चार्ट अपने आप रिफ़्रेश होते हैं, इसलिए रिपोर्ट हमेशा ताज़ा हफ़्ता दिखाती है।"
    - title: "पिछले हफ़्ते का एनालिसिस दोबारा चलाएँ"
      body: "किसी जाँच को उसके सवाल और स्टेप्स के साथ सेव करें, फिर एजेंट से उसे इस हफ़्ते के डेटा पर दोबारा चलाने को कहें।"
    - title: "आपकी टीम की परिभाषाएँ"
      body: "आपके एडमिन सिमेंटिक लेयर पेज पर तय करते हैं कि लीड या साइनअप किसे गिना जाए, और एजेंट हर जवाब में वही परिभाषाएँ इस्तेमाल करता है।"
    - title: "किसी भी चार्ट के बारे में पूछें"
      body: "किसी चार्ट पर क्लिक करें और पूछें कि क्या बदला। एजेंट को आपके सवाल के साथ वह चार्ट मिलता है और वह उसके पीछे के डेटा से जवाब देता है।"
integrations:
  heading: "Analytics को उन टूल्स से जोड़ें जो आप पहले से इस्तेमाल करते हैं"
