    - title: "HubSpot और Gong डेटा से अपनी सेल्स पाइपलाइन रिव्यू करें"
      url: https://www.agent-native.com/use-cases/ai-sales-analytics/
      body: "अपनी HubSpot डील्स और Gong कॉल्स से आसान भाषा में सवाल पूछें।"
faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Analytics फ़्री है?"
      a: "हाँ, Agent-Native Analytics फ़्री और ओपन सोर्स है। आप अपने Google Analytics और HubSpot अकाउंट खुद कनेक्ट करते हैं। शुरुआत में आप एजेंट के लिए फ़्री Builder.io AI क्रेडिट्स या अपनी AI मॉडल key चुनते हैं, इसलिए AI इस्तेमाल की सीमा है। Analytics अभी alpha में है, इसलिए बदलाव होते रहेंगे।"
    - q: "मैं कौन-से मार्केटिंग डेटा सोर्स कनेक्ट कर सकता हूँ?"
      a: "Agent-Native Analytics, Google Analytics (GA4), HubSpot, कीवर्ड रैंकिंग और सर्च वॉल्यूम के लिए DataForSEO, और पोस्ट एंगेजमेंट के लिए X से जुड़ता है। यह BigQuery, Amplitude, Mixpanel, PostHog और Stripe से भी जुड़ता है। हर सोर्स के लिए उसके अपने क्रेडेंशियल्स चाहिए, और Google Analytics के लिए Google Cloud service account चाहिए।"
    - q: "क्या Agent-Native Analytics हर सोमवार रिपोर्ट भेज सकता है?"
      a: "अभी हफ़्तेवार शेड्यूल पर नहीं। [डैशबोर्ड ईमेल रिपोर्ट](https://www.agent-native.com/docs/template-analytics-dashboards/) रोज़ आपके चुने समय और टाइमज़ोन पर, पाँच ईमेल पतों तक, किसी Slack चैनल या दोनों पर जाती हैं। सोमवार की मीटिंग से पहले ताज़ा डैशबोर्ड भेजने के लिए **ईमेल रिपोर्ट** में **अभी भेजें** पर क्लिक करें।"
    - q: "क्या मुझे SQL आना चाहिए?"
      a: "नहीं। आप आसान शब्दों में पूछते हैं, और एजेंट सोर्स चुनकर क्वेरी लिखता है। जाँचना चाहें तो एजेंट से किसी भी जवाब के पीछे की क्वेरी दिखाने को कह सकते हैं।"
    - q: "क्या मैं इन नंबरों पर भरोसा कर सकता हूँ?"
      a: "एजेंट कोई नंबर देने से पहले आपके डेटा पर लाइव क्वेरी चलाता है, और जब कोई क्वेरी नहीं चली तो आँकड़े पर \"Unverified\" लेबल लगाता है। फिर भी, टीम को भेजने से पहले पहले हफ़्ते की रिपोर्ट को Google Analytics और HubSpot से मिलाएँ।"
    - q: "Agent-Native Analytics, GA4 और HubSpot रिपोर्ट्स से कैसे अलग है?"
      a: "Google Analytics और HubSpot अपने-अपने डेटा की रिपोर्ट देते हैं। Agent-Native Analytics दोनों पर एक सवाल का जवाब आसान शब्दों में देता है, और जवाबों को एक डैशबोर्ड में रखता है जिसे आप पूछकर बेहतर बना सकते हैं। यही एक [एजेंटिक ऐप](https://www.agent-native.com/articles/what-is-an-agent-native-app/) है: एजेंट का दिमाग, ऐप जैसी आसानी।"
