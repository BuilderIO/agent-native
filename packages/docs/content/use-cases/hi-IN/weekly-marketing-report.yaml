other_uses:
  heading: "Agent-Native Analytics से आप और क्या कर सकते हैं"
  cards:
    - title: "अपने स्टार्टअप के लिए KPI डैशबोर्ड बनाएँ"
      url: https://www.agent-native.com/use-cases/ai-kpi-dashboard/
      body: "अपने स्टार्टअप का रेवेन्यू, साइनअप्स और churn ट्रैक करें, और एजेंट से पूछें कि कोई नंबर क्यों बदला।"
    - title: "जानें कि नए यूज़र्स कहाँ छोड़ देते हैं"
