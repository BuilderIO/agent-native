      body: "Slack webhook के ज़रिए रोज़ की समरी और डैशबोर्ड लिंक किसी Slack चैनल में भेजें, और कोई भी टेबल कनेक्ट किए Google Sheets अकाउंट में एक्सपोर्ट करें।"
