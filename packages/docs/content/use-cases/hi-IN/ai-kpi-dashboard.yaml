faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Analytics फ़्री है?"
      a: "हाँ, Agent-Native Analytics फ़्री और ओपन सोर्स है। एजेंट Builder.io AI क्रेडिट्स या आपकी अपनी मॉडल key पर चलता है, और हर डेटा सोर्स के लिए उसके अपने क्रेडेंशियल्स चाहिए, जैसे Stripe secret key। Analytics अभी alpha में है, इसलिए स्क्रीन्स और फ़ीचर्स अभी बदल सकते हैं।"
    - q: "Analytics मेरे KPIs किन टूल्स से ला सकता है?"
      a: "Analytics, Stripe, HubSpot, PostHog, Mixpanel, Amplitude, Google Analytics (GA4), BigQuery और एक दर्जन से ज़्यादा दूसरे सोर्स से जुड़ता है। हर एक को आप [डेटा स्रोत पेज](https://www.agent-native.com/docs/template-analytics-connectors/) पर उसकी अपनी key के साथ जोड़ते हैं, और एक डैशबोर्ड में कई सोर्स मिल सकते हैं।"
    - q: "क्या KPI डैशबोर्ड बनाने के लिए मुझे SQL आना चाहिए?"
      a: "नहीं। आप आसान भाषा में डैशबोर्ड बताते हैं या सवाल पूछते हैं, और एजेंट SQL लिखता है। हर चार्ट के पीछे क्वेरी दिखती रहती है, ताकि आपके डेटा को जानने वाला कोई व्यक्ति उसे जाँच या एडिट कर सके।"
    - q: "मुझे कैसे पता चलेगा कि नंबर सही हैं?"
      a: "डैशबोर्ड का हर नंबर उस क्वेरी से आता है जो एजेंट ने आपके कनेक्ट किए डेटा पर चलाई, और आप किसी भी चार्ट के पीछे की क्वेरी और रिकॉर्ड खोल सकते हैं। जब एजेंट क्वेरी नहीं चला पाया, तो वह आँकड़े को \"Unverified\" मार्क करता है। डैशबोर्ड पर भरोसा करने से पहले कुछ नंबर Stripe से मिलाएँ।"
    - q: "मेरा KPI डैशबोर्ड कौन देख सकता है?"
      a: "सिर्फ़ आप, जब तक आप उसे शेयर न करें। आप किसी टीममेट या पूरे संगठन के साथ viewer, editor या admin के रूप में [डैशबोर्ड शेयर](https://www.agent-native.com/docs/sharing/) कर सकते हैं। आपके बदले फ़िल्टर सिर्फ़ आप पर लागू होते हैं; उन्हें शेयर करने के लिए व्यू सेव करें या लिंक भेजें।"
    - q: "Analytics मेरे एनालिटिक्स टूल के AI से कैसे अलग है?"
      a: "किसी एक एनालिटिक्स टूल के अंदर का AI असिस्टेंट उसी टूल के डेटा पर काम करता है। Analytics, Stripe, आपके CRM और प्रोडक्ट डेटा पर काम करता है, और उसका एजेंट वही डैशबोर्ड बनाता और एडिट करता है जिसे आप देखते हैं, इसलिए उसके जवाब ऐसे पैनल बन जाते हैं जिन्हें आप रखते हैं। यही Analytics को एक [एजेंटिक ऐप](https://www.agent-native.com/articles/what-is-an-agent-native-app/) बनाता है: एजेंट का दिमाग, ऐप जैसी आसानी।"
