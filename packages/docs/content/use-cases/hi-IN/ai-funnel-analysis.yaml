faqs:
  heading: "सवाल हैं? हमारे पास जवाब हैं"
  items:
    - q: "क्या Agent-Native Analytics फ़्री है?"
      a: "हाँ, Agent-Native Analytics फ़्री और ओपन सोर्स है। होस्टेड ऐप इस्तेमाल करें, या [अपनी कॉपी चलाएँ](https://www.agent-native.com/docs/template-analytics/)। डेटा आप लाते हैं: आपके अपने इवेंट्स, या आपके कनेक्ट किए टूल्स। Analytics अभी alpha में है, इसलिए बदलाव होते रहेंगे।"
    - q: "क्या मुझे SQL आना चाहिए?"
      a: "नहीं। आसान भाषा में पूछें, और एजेंट SQL लिखकर चलाता है, फिर चार्ट, टेबल या संख्या के साथ जवाब देता है। जाँचना हो तो क्वेरी दिखाने को कहें। हो सकता है आपके डेटा को जानने वाले किसी व्यक्ति को पहले [आपके सोर्स कनेक्ट](https://www.agent-native.com/docs/template-analytics-connectors/) करने पड़ें।"
    - q: "सेशन रीप्ले कहाँ से आते हैं?"
      a: "आपके अपने वेब ऐप से। **डेटा स्रोत** पर एक public key बनाएँ, फिर **सत्र** पेज से छोटा ट्रैकिंग स्निपेट अपने ऐप में जोड़ें, सेशन रीप्ले चालू करके। रिकॉर्डिंग्स के लिए स्टोरेज कनेक्ट करें: Builder.io या आपका अपना S3 bucket। डिफ़ॉल्ट रूप से [रीप्ले](https://www.agent-native.com/docs/template-analytics-monitoring-and-sessions/) सिर्फ़ साइन इन किए यूज़र्स को रिकॉर्ड करते हैं।"
    - q: "सेशन रीप्ले क्या-क्या रिकॉर्ड करता है?"
      a: "रीप्ले पेज, क्लिक्स और स्क्रॉलिंग, कंसोल आउटपुट और नेटवर्क रिक्वेस्ट्स दोबारा चलाता है। टाइपिंग डिफ़ॉल्ट रूप से छिपी रहती है, और पासवर्ड या कार्ड डिटेल्स वाले फ़ील्ड कभी कैप्चर नहीं होते। कुछ और छिपाने के लिए पेज के उस हिस्से में एक class जोड़ें।"
    - q: "क्या मैं अपना PostHog, Amplitude या Mixpanel डेटा इस्तेमाल कर सकता हूँ?"
      a: "हाँ। उन्हें **डेटा स्रोत** पर कनेक्ट करें और वहाँ ट्रैक होने वाले इवेंट्स के बारे में पूछें। एजेंट आपके लिए हर टूल पर क्वेरी करता है। सेशन रीप्ले सिर्फ़ Analytics की अपनी ट्रैकिंग से आते हैं, इसलिए रुकने वाले लोगों को देखने के लिए उसे अपने ऐप में जोड़ें।"
    - q: "Analytics मेरे एनालिटिक्स टूल के AI से कैसे अलग है?"
      a: "किसी एनालिटिक्स टूल का AI उसी टूल के डेटा पर काम करता है। Analytics एजेंट आपके कनेक्ट किए हर सोर्स पर काम करता है, ठीक उन्हीं लोगों के रीप्ले ढूँढता है जो रुक गए, और उनमें से किसी को भी समझाता है या आपके कोडिंग एजेंट को सौंप देता है। यह ओपन सोर्स भी है। यही एक [एजेंटिक ऐप](https://www.agent-native.com/articles/what-is-an-agent-native-app/) है: एजेंट का दिमाग, ऐप जैसी आसानी।"
