title: Get a visual recap of your coding agent's changes
seo_title: Visual recap of your coding agent's changes
meta_description: Agent-Native Plan shows what your coding agent changed as before and after screens, flagged data fields, a file map and annotated diffs you can comment on.
updated: 2026-10-27
hero:
  body: Agent-Native Plan shows what your coding agent did as before and after screens, flagged data changes and a map of changed files. If something looks wrong, comment on it, and the agent fixes it.
  button:
    label: Recap a change
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa973dc8304494af9b6d069e9a409d409
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F68e6bd29a3834942ad098459e08fbd42
    alt: A finished recap in Plan of a coding agent's change that adds team invites. The title and a short summary of what changed sit at the top. Below them are before and after wireframes of the Members settings page and a file tree of the changed files with added and modified badges.
how_to:
  heading: How to visually recap your agent's changes
  steps:
    - title: Ask your agent for a recap
      body: Add Plan to your coding agent with its [one-line install](https://www.agent-native.com/docs/template-plan/#install). In the chat where the agent made the change, run `/visual-recap` and open the link it returns.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F060c82d850f34b3096f166c04ead386c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F287f076a9ec84124a0afc7fbaeda2ece
        alt: The coding agent's chat with "/visual-recap of everything you changed in this thread" sent, and the agent's reply linking to the published recap.
    - title: Read the change as pictures first
      body: Start with the before and after wireframes, the flagged data changes and the map of changed files. Then open **Key changes**, where each important file has its own tab with a side-by-side diff and notes.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff15296c5ef824f5ead19d6e64de1388f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faf5572fc8bbd4962972bfc0b24cf2bc0
        alt: Before and after wireframes of the Members page, where the after one adds an Invite button and a pending invite. Next to them, the data model flags the new invites table as added and the members role field as modified, from text to a fixed list of roles.
    - title: Send your comments to the agent
      body: Leave [review comments](https://www.agent-native.com/docs/template-plan-review-workflow/) on any text or a spot on a wireframe. Click **Send to agent**, choose **Copy for your agent** and paste the prompt into your coding agent, which makes the changes and resolves your comments.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2256a69fdcd542a18a14a292050ff391
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2b4a48126c4f45c39c0b6f0389673387
        alt: A comment to the agent pinned to the Invite button on the after wireframe asks to show it only to admins. The Send to agent menu is open, with Copy for your agent and Send to inline agent.
features:
  heading: Everything you need in a visual recap
  items:
    - title: Screens before code
      body: When the change touches the UI, the recap opens with before and after wireframes, so you see what users will see first.
    - title: Data changes flagged
      body: Schema and API changes mark each field as added, changed, removed or renamed, and show the old type next to the new one.
    - title: Every changed file mapped
      body: A file tree lists every file the change touched, badged as added, modified, removed or renamed, with notes on what changed.
    - title: Annotated key diffs
      body: Three to eight key files get side-by-side diffs, each with a one-line summary and notes on the lines worth your attention.
    - title: Covers the whole thread
      body: Run `/visual-recap` in the chat after the work, and the recap covers everything the agent did there, from the first change to the late fixes.
    - title: Review it with your team
      body: "Share a recap's link: guests open it without an account and sign in to comment. Export it as HTML, Markdown or JSON to keep a copy."
