faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Plan free?
      a: Yes, Agent-Native Plan is free and open source. Each visual recap runs a full agent session on the model you choose, so bigger changes use more of that model. Plan is in alpha, so expect changes.
    - q: Which changes is a visual recap worth running on?
      a: "Run a visual recap on bigger changes: ones that span multiple files or touch the data schema, an API or how the app fits together. For a small change to one file, reading the plain diff is quicker than waiting for a recap."
    - q: How is a visual recap different from reading the diff?
      a: "A diff lists every changed line, file by file. A visual recap starts with what the change does: the screens it altered as wireframes, the data fields it changed, and a map of the files involved. Then it shows only the diffs worth reading, with notes."
    - q: Which coding agents does Plan work with?
      a: The install command sets Plan up in Claude Code, Codex, Cursor, OpenCode, GitHub Copilot in VS Code and Claude Cowork, and signs you in. Plan also works in Cline, Goose and any other agent that connects to MCP servers, through its hosted connector.
    - q: Can I get a recap on every pull request?
      a: Yes. The [PR Visual Recap GitHub Action](https://www.agent-native.com/docs/pr-visual-recap/) runs Claude Code, Codex or any OpenAI-compatible model with your own API key on each push. It keeps one comment on the pull request up to date, with a screenshot of the recap, and never blocks a merge. Diffs over about 600 KB are cut short.
    - q: Who can see my recaps?
      a: By default, only people signed in to your organization can open a recap; make it private and only you can. With the GitHub Action, anyone who sees the pull request sees the recap's screenshot. [Local-files mode](https://www.agent-native.com/docs/template-plan-local-and-desktop/) keeps a recap off the hosted app, though your agent's model still runs where it always does.
