how_to:
  heading: AI로 피치덱 만드는 방법
  steps:
    - title: 내 자료에서 시작하기
      body: "Slides 홈 화면에서 원하는 덱을 설명하세요. 회사 소개, 대상, 분량을 적고 가지고 있는 메모, 문서, 참고 자료를 첨부한 뒤 덱을 만들면 돼요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F12aade25b35944b396142acc3b8ff40c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff68c26a237fc45909db278af5b701e61
        alt: "Slides 프롬프트 입력창 확대 화면. 창업자가 입력한 피치 설명과 첨부된 메모 파일, 그 아래 추천 칩이 보여요."
    - title: 에이전트가 슬라이드를 만드는 과정 보기
      body: "Slides 에이전트는 먼저 피치덱 개요를 계획해요. 그다음 편집기에서 슬라이드를 한 장씩 만들고, 그 과정을 직접 볼 수 있어요. PDF나 웹사이트를 읽지 못하면 그렇다고 알려 줘요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F40529b37d7614ccc8ec582e933e57034
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3d3dd1d6c9eb4aafb791d086b46b4cd1
        alt: "슬라이드 1, 2가 완성되고 솔루션을 다루는 슬라이드 3이 캔버스에서 생성되는 Slides 편집기. 에이전트 채팅에 개요와 “슬라이드 3 추가 중 · 솔루션”이 보여요."
    - title: 완성된 덱 발표하거나 내보내기
      body: "Slides에서 피치덱을 전체 화면으로 발표하거나 내보낼 수 있어요. 편집 가능한 PowerPoint 파일, Google Slides로 가져올 파일, 또는 HTML 파일 하나로 내보낼 수 있어요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe65004f2089b48b6aaeb185fe529a28a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb621a0dad79042cc8bc145cc29c855b8
        alt: "완성된 표지 슬라이드 위에 열린 Slides 내보내기 메뉴 확대 화면. HTML, PDF, PowerPoint, Google Slides 옵션이 보여요."
features:
  heading: 덱을 만들고 피칭하는 데 필요한 모든 것
  items:
    - title: 메모로 만드는 피치덱
      body: "프롬프트, 메모, 문서, 지난번 덱에서 시작하세요. 에이전트에게 회사와 투자 라운드를 알려 주면 덱을 만들어 줘요."
    - title: AI 편집과 직접 편집
      body: "슬라이드의 텍스트와 레이아웃을 직접 고치거나, 한 줄을 선택해 에이전트에게 요청하세요. 요청한 부분만 바뀌어요."
    - title: 모든 슬라이드에 우리 브랜드
      body: "색상, 글꼴, 로고를 디자인 시스템으로 저장하면 만드는 모든 덱이 우리 회사다운 모습이 돼요."
    - title: 이미지와 로고
      body: "에이전트에게 이미지 생성, 스톡 사진 검색, 트랙션 슬라이드에 넣을 고객사와 파트너 로고 가져오기를 요청하세요."
    - title: 공동 창업자와 협업
      body: "공동 창업자, 에이전트와 같은 덱을 함께 편집하고, 어떤 슬라이드에든 댓글을 달고, 이전 버전으로 복원할 수 있어요."
    - title: 피칭, 공유, 내보내기
      body: "발표자 노트와 함께 발표하고, 투자자에게 보기 전용 링크를 공유하거나, 편집 가능한 PowerPoint 파일로 내보내세요."
