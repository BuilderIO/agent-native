faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Slides는 무료인가요?
      a: "네, Agent-Native Slides는 무료 오픈 소스예요. 덱을 만들려면 Builder.io 또는 내 AI 키를 통한 AI 연결이 필요하고, 이미지를 만들려면 내 Gemini 또는 OpenAI 키가 필요해요. Slides는 알파 버전이라 발전하면서 바뀌는 부분이 있을 수 있어요."
    - q: 피치덱을 PowerPoint나 Google Slides로 내보낼 수 있나요?
      a: "Slides는 편집 가능한 PowerPoint(PPTX) 파일로 내보내요. Google Slides의 경우 가져오기 링크가 포함된 PPTX 파일을 제공하니, Google Slides에서 직접 열면 돼요. 덱을 HTML 파일 하나로 내보낼 수도 있어요."
    - q: Slides는 내 메모, 문서, 웹사이트에서 시작할 수 있나요?
      a: "Slides 홈 화면에서 피치를 설명하고 메모나 문서를 첨부하거나 웹사이트 링크를 추가하세요. Google Doc, Word 파일, PowerPoint를 가져올 수도 있어요. 에이전트가 PDF나 웹사이트를 읽지 못하면 추측하지 않고 알려 줘요."
    - q: 챗봇에게 슬라이드를 써 달라고 하는 것과 Slides는 무엇이 다른가요?
      a: "챗봇은 슬라이드에 직접 옮겨야 할 텍스트를 줘요. Slides에서는 에이전트가 눈에 보이는 편집기에서 실제 덱을 만들어요. 같은 덱에서 어떤 슬라이드든 직접 고치거나 에이전트에게 요청할 수 있고, 모든 변경은 되돌릴 수 있어요. 그래서 Slides는 [에이전틱 앱](https://www.agent-native.com/articles/what-is-an-agent-native-app/)이에요. 에이전트의 두뇌와 앱의 직관성을 함께 갖췄죠."
    - q: 공동 창업자와 함께 피치덱을 편집할 수 있나요?
      a: "나, 공동 창업자, 에이전트가 같은 덱을 동시에 편집할 수 있어요. 슬라이드 전체나 특정 부분에 댓글을 달 수 있어요. Slides는 의미 있는 변경이 있을 때마다 버전을 저장하므로 언제든 이전 버전으로 복원할 수 있어요."
    - q: 피치덱은 몇 장이 적당한가요?
      a: "첫 피칭이라면 10장 안팎이 적당해요([피치덱에 들어갈 내용](https://www.agent-native.com/articles/how-to-make-a-pitch-deck-with-ai/)). Slides도 “이 문서로 10장짜리 피치덱 만들기”를 추천해요. 다른 분량을 원하면 에이전트에게 알려 주세요. 그에 맞게 개요를 계획해요."
