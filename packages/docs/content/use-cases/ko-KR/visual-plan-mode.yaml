faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Plan은 무료인가요?
      a: "네, Agent-Native Plan은 무료 오픈 소스예요. 각 계획은 내가 고른 모델에서 코딩 에이전트 세션으로 실행돼요. 그만큼 에이전트의 토큰을 쓰고, 계획이 클수록 더 많이 써요. Plan은 알파 버전이라 바뀌는 부분이 있을 수 있어요."
    - q: Plan은 어떤 코딩 에이전트와 함께 쓸 수 있나요?
      a: "Claude Code와 Codex는 플러그인으로 설치해요. 설치 명령어 하나로 Cursor, OpenCode, VS Code의 GitHub Copilot, Claude Cowork에도 Plan이 설정돼요. Cline이나 Goose 같은 다른 MCP 호스트는 URL로 Plan 커넥터를 추가할 수 있어요. 모든 계획은 브라우저에서 검토해요."
    - q: Plan은 코딩 에이전트의 플랜 모드와 무엇이 다른가요?
      a: "Claude Code, Codex, Cursor, OpenCode의 플랜 모드는 계획을 채팅 속 텍스트로 보여 줘요. Plan은 그 계획이나 마크다운 파일의 계획을 다이어그램, 파일 트리, 주석 달린 코드가 담긴 페이지로 바꿔요. 거기서 정확한 부분에 댓글을 달고, 에이전트의 질문에 답하고, 팀원을 부를 수 있어요."
    - q: 에이전트가 계획하는 동안 내 코드를 바꾸나요?
      a: "아니요. 계획을 쓰거나 고치는 동안 Plan의 지침에 따라 에이전트는 코드를 읽기만 해요. 계획을 승인한 뒤에 수정을 시작하고, 큰 단계마다 승인된 계획을 다시 읽어요."
    - q: 팀원이 계정 없이 계획을 검토할 수 있나요?
      a: "일부는 가능해요. 링크를 공유받은 사람은 누구나 게스트로 계획을 열고 편집할 수 있어요. 댓글, 저장, 공유에는 Agent-Native 계정이 필요하니, 댓글을 달려는 팀원은 먼저 로그인해야 해요."
    - q: 계획을 내 컴퓨터에만 둘 수 있나요?
      a: "네. [로컬 파일 모드](https://www.agent-native.com/docs/template-plan-local-and-desktop/)는 계획을 내 컴퓨터에 MDX 파일로 보관하니, 내용이 호스팅 앱에 가지 않아요. 대신 로컬 계획은 공유하거나 브라우저에서 댓글을 달 수 없고, 링크도 내 컴퓨터에서만 열려요. 로컬 파일 모드를 써도 코딩 에이전트의 AI 모델이 실행되는 곳은 그대로예요."
