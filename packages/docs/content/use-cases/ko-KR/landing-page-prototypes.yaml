other_uses:
  heading: Agent-Native Design으로 할 수 있는 다른 일
  cards:
    - title: 브리프를 클릭할 수 있는 프로토타입으로 만들어 보세요
      url: https://www.agent-native.com/use-cases/ai-prototype-generator/
      body: "디자인 브리프로 새 화면이나 제품 흐름의 프로토타입을 만들고, 팀과 함께 클릭해 보세요."
faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Design은 무료인가요?
      a: "네, Agent-Native Design은 무료 오픈 소스예요. 페이지를 만들려면 Builder.io AI 크레딧이나 내 AI 키를 통한 AI 연결이 필요하니, AI 사용량이 무제한은 아니에요. Design은 알파 버전이라 발전하면서 바뀌는 부분이 있을 수 있어요."
    - q: Design이 랜딩 페이지를 게시하거나 호스팅해 주나요?
      a: "아니요. Design은 랜딩 페이지를 만들고 내보내기까지 하고, 배포는 지금 쓰는 도구로 해요. HTML이나 파일 ZIP을 내려받거나, 코딩 에이전트가 사이트에 페이지를 추가할 때 쓸 프롬프트를 복사하세요."
    - q: 우리 브랜드를 쓸 수 있나요?
      a: "네. Figma 파일, 웹사이트, GitHub 저장소, 업로드한 파일로 디자인 시스템을 만들고, 페이지를 시작할 때 고르세요. 에이전트가 만드는 모든 버전에 그 색상, 글꼴, 스타일이 유지돼요."
    - q: AI가 만든 랜딩 페이지를 나중에 편집할 수 있나요?
      a: "네. 페이지에서 텍스트, 색상, 간격, 레이아웃을 직접 바꾸거나, 에이전트에게 섹션 수정을 요청하세요. **버전 기록**에서 언제든 이전 버전을 복원할 수 있어요."
    - q: 랜딩 페이지를 내보내면 무엇을 받나요?
      a: "**HTML 다운로드**는 어떤 브라우저에서든 열리고 스타일을 인터넷에서 불러오는 파일 하나를 줘요. **ZIP 다운로드**에는 페이지의 모든 파일이 들어 있고, **Figma용으로 다운로드(SVG)**는 Figma에서 편집할 수 있는 레이어를 줘요. 문서에서 [모든 내보내기 옵션](https://www.agent-native.com/docs/template-design-features/#export)을 확인하세요."
    - q: Design은 챗봇에게 랜딩 페이지를 요청하는 것과 무엇이 다른가요?
      a: "챗봇은 페이지를 보기 전에 어딘가에 붙여 넣어야 하는 코드를 줘요. Design에서는 에이전트가 보고 클릭할 수 있는 편집기 안에 여러 버전으로 페이지를 만들어요. 같은 페이지에서 직접 또는 요청해서 바꿀 수 있어요. 그래서 Design은 [에이전틱 앱](https://www.agent-native.com/articles/what-is-an-agent-native-app/)이에요. 에이전트의 두뇌와 앱의 직관성을 함께 갖췄죠."
