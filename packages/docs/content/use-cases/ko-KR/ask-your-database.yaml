faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Analytics는 무료인가요?
      a: "네, Agent-Native Analytics는 무료 오픈 소스예요. 호스팅된 앱을 쓰거나 직접 복사본을 실행할 수 있어요. 에이전트에는 Builder.io나 내 모델 키를 통한 AI 연결이 필요해서, AI 사용량이 무제한은 아니에요. Analytics는 알파 버전이라 바뀌는 부분이 있을 수 있어요."
    - q: SQL을 알아야 하나요?
      a: "아니요. 평소 말로 질문하면 에이전트가 SQL을 써요. 처음에는 데이터를 잘 아는 사람이 [BigQuery를 연결](https://www.agent-native.com/docs/template-analytics-connectors/)해야 할 수도 있어요. 관리자가 **시맨틱 레이어** 페이지에 [지표 정의](https://www.agent-native.com/docs/template-analytics-dashboards/)를 추가해 두면, 에이전트가 맞는 테이블과 열을 골라요."
    - q: Postgres, Supabase, Neon에서도 되나요?
      a: "네, Supabase나 Neon의 Postgres라면 돼요. 채팅의 + 메뉴에서 [MCP로 연결](https://www.agent-native.com/docs/mcp-clients/)하고 채팅으로 질문하세요. 대시보드 패널은 아직 Postgres를 쿼리할 수 없어서, 이 답은 채팅에만 남아요. 그 밖의 Postgres 데이터베이스는 아직 쿼리할 수 없어서, 이 페이지의 단계는 BigQuery를 사용해요."
    - q: 에이전트가 내 데이터를 바꿀 수 있나요?
      a: "BigQuery에서는 안 돼요. Analytics는 그곳의 데이터를 삽입, 수정, 삭제하거나 제거하려는 에이전트의 쿼리를 모두 거부해요. 설정할 때도 읽기 전용 역할을 가진 서비스 계정을 요구하므로, 테이블을 읽고 쿼리를 실행할 수는 있지만 바꿀 수는 없어요. Supabase나 Neon을 통하면 에이전트는 그 연결에 허용한 일을 할 수 있어요."
    - q: 답이 맞는지 어떻게 알 수 있나요?
      a: "답 뒤에 있는 쿼리를 확인하세요. 에이전트에게 SQL을 보여 달라고 하거나, 대시보드 차트에서 **SQL 보기**를 여세요. 어떤 테이블과 필터를 썼는지 물어볼 수도 있어요. 라이브 쿼리가 실행되지 않은 숫자에는 에이전트가 **Unverified** 표시를 해요."
    - q: CSV를 내보내 ChatGPT에 묻는 것과 무엇이 다른가요?
      a: "채팅 어시스턴트는 내보낸 파일로 답하기 때문에, 새 질문을 할 때마다 다시 내보내야 해요. Analytics는 웨어하우스를 직접 쿼리하고, 팀의 지표 정의를 쓰고, 다시 필요한 답은 대시보드에 남겨 둬요. 그게 바로 [에이전틱 앱](https://www.agent-native.com/articles/what-is-an-agent-native-app/)이에요. 에이전트의 두뇌와 앱의 직관성을 함께 갖췄죠."
