title: AI 받아쓰기
seo_title: 코딩 에이전트, Slack, 문서를 위한 AI 받아쓰기
meta_description: "긴 프롬프트를 타이핑하는 대신 Claude Code, Slack, 문서에 말로 입력하세요. Agent-Native Clips는 모든 받아쓰기를 저장해 주는 무료 오픈 소스 AI 받아쓰기예요."
updated: 2026-10-26
hero:
  body: "프롬프트를 타이핑하는 대신 통째로 말하면 Claude Code부터 Slack까지 커서 위치에 바로 입력돼요. Agent-Native Clips는 모든 받아쓰기를 저장하고, 요청하면 에이전트가 다시 다듬어 줘요."
  button:
    label: 받아쓰기 시작
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb42e201ec33f4acf8f8b6d39f67a2503
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3b0e34d91eee4240a0211ba4ca9b0859
    alt: "오늘의 받아쓰기가 보이는 Clips 받아쓰기 페이지. 코딩 에이전트용 긴 프롬프트, 버그 티켓, Slack 업데이트가 있어요. 프롬프트 카드가 열려 원본과 정리됨 텍스트가 보여요."
how_to:
  heading: AI 받아쓰기 사용 방법
  steps:
    - title: 어떤 앱에든 받아쓰기
      body: "Clips Desktop을 설치하고 Claude Code, Linear, Slack을 클릭한 뒤, 말하는 동안 단축키(기본값은 Fn, 설정에서 바꿀 수 있어요)를 누르고 계세요. 손을 떼면 Clips가 커서 위치에 내 말을 입력해요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F493f3728ed1246bb841a651e3aa76300
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb3785ba8ec804690836d94e31ff92e17
        alt: "코딩 에이전트 채팅. 웹훅 재시도에 관한 받아쓰기 프롬프트를 보내자 에이전트가 변경을 마쳤어요. 메시지 입력창에는 커서가 대기 중이고, 아래 Clips 알약 모양 표시가 초록색 파형으로 다음 프롬프트를 듣고 있어요."
    - title: Clips에 내 용어 알려 주기
      body: "받아쓰기 페이지에서 사전을 열고 제품, 라이브러리, 동료 이름을 추가하세요. Clips가 계속 잘못 알아듣는 단어는 “용어 → 대체어” 형식으로 넣으면 돼요. CSV 파일을 가져오면 목록을 한꺼번에 추가할 수 있어요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F855c88996488417e8dc3a532a0fd21a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff4e9c0557a1344f6a55e7e9c4356a5ab
        alt: "Clips의 사전 패널. 용어 추가, 가져오기, CSV 내보내기 버튼이 있고, 아래에 Agent-Native, “web hooks → webhooks”, “kube control → kubectl” 같은 용어가 보여요."
    - title: 지난 받아쓰기 찾기
      body: "Clips에서 Cmd+K를 누르고 말했던 단어를 입력하면, 일치하는 받아쓰기가 말했던 앱과 함께 나타나요. 하나를 고르면 받아쓰기 페이지에서 열려요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5e344071b49f4e51ae5eef2708c46605
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F13f558e09094404f975350ad0c359acc
        alt: "“webhook”을 입력한 Clips 검색 메뉴. 받아쓰기 아래에 Cursor에 받아쓴 프롬프트와 Slack에 받아쓴 메시지, 지난 받아쓰기 두 개가 나열돼요."
features:
  heading: 타이핑 대신 받아쓰기에 필요한 모든 것
  items:
    - title: 클립보드는 그대로예요
      body: "Clips는 앱에 붙여넣은 뒤 클립보드를 원래대로 돌려놓아서, 복사해 둔 링크가 그대로 남아 있어요. 터미널에서는 붙여넣지 않고 직접 입력해요."
    - title: 되돌릴 수 있는 AI 정리
      body: "Clips는 잘못 들은 단어, 쉼표, 대문자를 고치고 말 더듬은 부분을 잘라 줘요. 클라우드 엔진으로 자동 실행하거나 한 번 클릭해서 쓸 수 있고, 원본은 그대로 남아요."
    - title: 내가 고친 내용을 배워요
      body: "Clips가 붙여넣은 직후 잘못 들은 단어를 고치면 데스크톱 앱이 그 수정을 사전에 추가해서, 다음 받아쓰기부터는 제대로 알아들어요."
    - title: 긴 프롬프트를 위한 핸즈프리
      body: "단축키를 두 번 누르면 생각하며 말하는 동안 계속 듣고, 한 번 더 누르면 멈춰요. Esc를 누르면 받아쓰기를 버려요."
    - title: 다시 붙여넣기
      body: "Cmd+Ctrl+V를 누르면 마지막 받아쓰기를 다른 입력란에 다시 붙여넣어요. 커서가 엉뚱한 곳에 있었을 때 편해요."
    - title: 에이전트에게 물어보기
      body: "“3분기 예산에 대해 내가 뭐라고 했지?”나 “이 횡설수설을 글머리 기호로 정리해 줘”라고 물으면, 에이전트가 내 기록을 바탕으로 답해요."
