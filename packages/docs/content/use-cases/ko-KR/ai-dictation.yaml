faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Clips는 무료인가요?
      a: "네. Agent-Native Clips는 무료 오픈 소스이고, 데스크톱 앱에서는 음성 받아쓰기가 기본으로 켜져 있어요. AI 정리는 Builder.io AI 크레딧이나 내 키로 실행되므로 무제한은 아니에요. Clips는 알파 버전이라 발전하면서 바뀌는 부분이 있을 수 있어요."
    - q: Clips는 컴퓨터에 내장된 받아쓰기와 무엇이 다른가요?
      a: "내장 받아쓰기는 설정 없이 쓸 수 있지만 [말한 내용의 검색 가능한 기록](https://www.agent-native.com/articles/what-should-you-look-for-in-dictation-software/)은 남기지 않아요. Clips는 모든 받아쓰기를 원본과 정리된 텍스트로 저장하고, 내 용어를 배우고, AI로 텍스트를 다듬어요. Clips 에이전트는 내가 한 말을 찾아 횡설수설을 글머리 기호로 바꾸는 식으로 다시 정리해 줄 수도 있어요."
    - q: Clips가 우리 팀의 전문 용어도 정확하게 쓰나요?
      a: "네, 용어를 사전에 추가하면 돼요. 한 줄에 하나씩 추가하거나, 계속 잘못 알아듣는 단어는 “용어 → 대체어” 형식으로 넣으세요. 용어 CSV 파일을 가져올 수도 있어요. Clips가 붙여넣은 직후 단어를 고치면 데스크톱 앱이 그 수정을 사전에 저장해서 다음에 활용해요."
    - q: 받아쓰기는 저장되나요? 예전 것을 찾을 수 있나요?
      a: "모든 받아쓰기는 원본과 정리된 텍스트, 시간, 길이와 함께 저장되고, 받아쓰기 페이지에 날짜별로 묶여 나타나요. Cmd+K로 말한 내용으로 검색하거나 [Clips 에이전트](https://www.agent-native.com/docs/template-clips-agent/)에게 “어제 받아쓴 내용 보여 줘”처럼 물어보세요. 받아쓰기는 언제든 삭제할 수 있어요."
    - q: 내 목소리가 컴퓨터 밖으로 나가나요?
      a: "꼭 그렇지는 않아요. Clips Desktop은 내장 음성 인식이나 Local Whisper로 기기에서 직접 전사할 수 있어요([Clips의 전사 엔진](https://www.agent-native.com/docs/template-clips-features/)). Builder.io나 내 키를 쓰면 정리를 위해 받아쓰기가 해당 AI 서비스로 전송돼요. 각 받아쓰기의 텍스트는 내 Clips 계정에 저장돼요."
