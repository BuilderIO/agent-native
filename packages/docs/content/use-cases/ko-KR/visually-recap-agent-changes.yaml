faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Plan은 무료인가요?
      a: "네, Agent-Native Plan은 무료 오픈 소스예요. 시각적 요약은 매번 내가 고른 모델에서 에이전트 세션 전체를 실행하니, 변경이 클수록 그 모델을 더 많이 써요. Plan은 알파 버전이라 바뀌는 부분이 있을 수 있어요."
    - q: 어떤 변경에 시각적 요약을 쓰면 좋을까요?
      a: "큰 변경에 쓰세요. 여러 파일에 걸치거나 데이터 스키마, API, 앱 구조를 건드리는 변경이요. 파일 하나만 조금 바꿨다면 요약을 기다리는 것보다 diff를 그냥 읽는 편이 빨라요."
    - q: 시각적 요약은 diff를 읽는 것과 무엇이 다른가요?
      a: "diff는 바뀐 줄을 파일별로 전부 나열해요. 시각적 요약은 변경이 무엇을 하는지부터 보여 줘요. 바뀐 화면은 와이어프레임으로, 바뀐 데이터 필드, 관련 파일 맵까지요. 그다음 읽을 가치가 있는 diff만 메모와 함께 보여 줘요."
    - q: Plan은 어떤 코딩 에이전트와 함께 쓸 수 있나요?
      a: "설치 명령어가 Claude Code, Codex, Cursor, OpenCode, VS Code의 GitHub Copilot, Claude Cowork에 Plan을 설정하고 로그인까지 해 줘요. Cline, Goose 등 MCP 서버에 연결하는 다른 에이전트에서도 호스팅 커넥터로 Plan을 쓸 수 있어요."
    - q: 모든 풀 리퀘스트에서 요약을 받을 수 있나요?
      a: "네. [PR Visual Recap GitHub Action](https://www.agent-native.com/docs/pr-visual-recap/)이 푸시할 때마다 내 API 키로 Claude Code, Codex, 또는 OpenAI 호환 모델을 실행해요. 풀 리퀘스트에 요약 스크린샷이 담긴 댓글 하나를 최신 상태로 유지하고, 병합을 막지 않아요. 약 600KB가 넘는 diff는 잘려요."
    - q: 내 요약은 누가 볼 수 있나요?
      a: "기본적으로 내 조직에 로그인한 사람만 요약을 열 수 있고, 비공개로 바꾸면 나만 볼 수 있어요. GitHub Action을 쓰면 풀 리퀘스트를 볼 수 있는 사람은 누구나 요약 스크린샷을 봐요. [로컬 파일 모드](https://www.agent-native.com/docs/template-plan-local-and-desktop/)를 쓰면 요약이 호스팅 앱에 올라가지 않지만, 에이전트의 모델은 원래 실행되던 곳에서 그대로 실행돼요."
