title: 브리프를 클릭할 수 있는 프로토타입으로 만들어 보세요
seo_title: 제품 브리프를 위한 AI 프로토타입 생성기
meta_description: "제품이나 디자인 브리프를 붙여 넣으면 Agent-Native Design이 클릭해 볼 수 있는 화면을 만들어요. AI 에이전트에게 여러 방향을 받고, 고른 방향을 다듬으세요."
updated: 2026-10-27
hero:
  body: "Agent-Native Design은 제품이나 디자인 브리프가 설명하는 화면을 직접 써 볼 수 있는 HTML로 만들어 줘요. AI 에이전트에게 몇 가지 방향을 받은 뒤, 고른 방향을 직접 또는 요청해서 다듬으세요."
  button:
    label: 브리프로 프로토타입 만들기
    url: https://design.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F003e186182b74e3cbe462fe098559bc6
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8f432f3b71d432698c025a7147301bc
    alt: "팀 경비 앱의 온보딩 방향으로 Guided checklist를 고른 Design 편집기. 데스크톱과 모바일 프레임이 보여요. 에이전트 채팅에는 붙여 넣은 브리프, Pick a direction 선택지, 그다음 에이전트가 바꾼 내용이 보여요."
how_to:
  heading: AI로 브리프를 프로토타입으로 만드는 방법
  steps:
    - title: 필요한 화면 설명하기
      body: "Design 홈 화면의 프롬프트 입력창에 브리프를 붙여 넣으세요. 누구를 위한 것인지, 어떤 화면이나 흐름인지, 무엇을 해야 하는지요. 방향 세 가지를 요청하세요. 중요한 내용이 빠져 있으면 Design이 먼저 물어봐요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ef31fb673e2437fb4dd6ed256a7ba9d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8209bd4f55d7432c94e05172c5475f17
        alt: "Design 홈 프롬프트 입력창 확대 화면. 경비 앱 온보딩 흐름에 대한 짧은 브리프가 붙여 넣어져 있고, “Show me three directions”로 끝나요."
    - title: 마음에 드는 방향 고르기
      body: "Design이 캔버스에 세 방향을 나란히 놓아요. 각각 스타일이 다른, 실제로 동작하는 화면이에요. **인터랙션**에서 하나씩 써 보고 **방향 선택**에서 하나를 고르면, 에이전트가 나머지를 완성해요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F137893c57370435d94967b9d5bc6a82a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fda7cdd9a2f3e42b58f44efec2b950fc9
        alt: "세 가지 온보딩 방향이 나란히 놓인 캔버스와, 방향 이름마다 버튼이 있는 “Pick a direction”을 보여 주는 에이전트 채팅."
    - title: 팀과 함께 다듬기
      body: "**디자인** 탭에서 문구, 간격, 색상을 고치거나, 요소를 선택해 에이전트에게 요청하세요. 팀원이 댓글을 고정하면 **에이전트에게 보내기**를 클릭하고, 에이전트가 그 변경을 반영해요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F406b66f9b62e49c09f697f5d08599b5e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F566ca2f3c44f439aac2c5307c72aa572
        alt: "초대 단계에 팀원의 댓글이 고정된 선택된 온보딩 화면. Comments 탭에 댓글 스레드가 열려 있고 Send to agent 버튼이 보여요."
features:
  heading: 브리프에서 프로토타입까지 필요한 모든 것
  items:
    - title: 처음부터 클릭할 수 있어요
      body: "고른 방향은 인터랙션이 동작하는 HTML이 되고, 데스크톱과 모바일 프레임에 담겨요. **Design 미리보기**는 브라우저 탭에서 열어 줘요."
    - title: 브리프의 표현 그대로
      body: "에이전트는 내 용어와 주장을 그대로 써요. 브리프에 중요한 선택이 빠져 있으면 물어보거나 어떤 가정을 했는지 밝혀요."
    - title: 완성 전에 점검해요
      body: "에이전트는 디자인이 준비됐다고 알리기 전에, 프로토타입의 접근성과 시각적 품질을 직접 점검해요."
    - title: 우리 브랜드로 만드는 프로토타입
      body: "Figma 파일, 웹사이트, GitHub 저장소로 디자인 시스템을 만들면, 새 프로토타입이 우리 색상과 글꼴로 시작해요."
    - title: 에이전트가 반영하는 피드백
      body: "댓글은 해당 요소에 고정돼요. 에이전트가 그 지점을 고치고, 변경이 반영됐는지 확인한 뒤 스레드를 해결하거나 결정을 물어요."
    - title: 코딩 에이전트에게 넘기기
      body: "HTML이나 파일 ZIP으로 내보내거나, 코딩 에이전트에게 파일과 디자인 토큰을 넘기는 준비된 프롬프트를 복사하세요."
