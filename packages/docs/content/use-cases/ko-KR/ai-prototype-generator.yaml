      url: https://www.agent-native.com/use-cases/landing-page-prototypes/
      body: "출시 브리프를 나란히 비교할 수 있는 여러 버전의 랜딩 페이지로 만들어 보세요."
faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Design은 무료인가요?
      a: "네, Agent-Native Design은 무료 오픈 소스예요. 에이전트에는 Builder.io나 내 AI 키를 통한 AI 연결이 필요해요. Design은 알파 버전이라 발전하면서 바뀌는 부분이 있을 수 있어요."
    - q: PRD나 제품 브리프에서 시작할 수 있나요?
      a: "네. 브리프나 제품 요구사항 문서(PRD)의 관련 부분을 프롬프트 입력창에 붙여 넣고, 여러 안을 보고 싶다면 방향을 요청하세요. 에이전트는 내 용어와 정확한 주장을 그대로 쓰고, 브리프에 디자인을 바꿀 선택이 빠져 있으면 물어보거나 가정을 밝혀요. [디자인 브리프에 무엇을 넣을지](https://www.agent-native.com/articles/how-to-turn-a-design-brief-into-a-prototype-with-ai/)도 참고하세요."
    - q: 프로토타입을 클릭해 볼 수 있나요?
      a: "네. 화면마다 인터랙션이 동작하는 실제 HTML이고, 고른 방향에는 기본으로 데스크톱과 모바일 프레임이 생겨요. **인터랙션** 모드로 캔버스에서 써 보거나, **Design 미리보기**로 새 브라우저 탭에서 화면을 여세요."
    - q: 우리 디자인 시스템이나 Figma 디자인을 쓸 수 있나요?
      a: "네. [디자인 시스템](https://www.agent-native.com/docs/template-design-features/)은 Figma 파일, 웹사이트, GitHub 저장소, design.md 파일, 메모로 만들 수 있고, 새 디자인은 그 시스템을 따라요. Figma 프레임을 편집할 수 있는 화면으로 가져올 수도 있고, 정확히 맞추지 못한 부분은 Design이 목록으로 알려 줘요."
    - q: 프로토타입이 프로덕션 코드인가요?
      a: "아니요. 프로토타입은 출발점이고, 앱 로직, 연동, 테스트, 배포는 따로 만들어야 해요. HTML이나 파일 ZIP으로 내보내거나, **에이전트 프롬프트 복사**로 코딩 에이전트에게 파일, 디자인 토큰, 준비된 프롬프트를 넘기세요. Claude Code와 Codex는 [Design의 MCP 서버로 디자인을 열](https://www.agent-native.com/docs/template-design-integrations/) 수도 있어요."
    - q: Design은 챗봇에게 UI를 요청하는 것과 무엇이 다른가요?
      a: "Design에서는 에이전트가 캔버스에 프로토타입을 만들고, 거기서 클릭해 보고 방향을 비교하고 편집할 수 있어요. 팀의 댓글은 바로 에이전트에게 가요. 챗봇이라면 결과가 대화 안에만 머물러요. 그래서 Design은 [에이전틱 앱](https://www.agent-native.com/articles/what-is-an-agent-native-app/)이에요. 에이전트의 두뇌와 앱의 직관성을 함께 갖췄죠."
