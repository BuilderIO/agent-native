slug: specs-for-coding-agents
app: content
title: 코딩 에이전트가 읽을 수 있는 스펙을 작성하세요
seo_title: Claude Code, Codex, Cursor를 위한 스펙 작성
meta_description: "Agent-Native Content는 스펙을 Claude Code, Codex, Cursor가 MCP로 읽는 페이지 하나에 담아, 에이전트가 팀이 편집 중인 버전으로 만들게 해 줘요."
updated: 2026-10-27
hero:
  body: "Agent-Native Content는 메모를 나와 팀, 코딩 에이전트가 한 페이지에서 함께 쓰는 스펙으로 만들어 줘요. Claude Code, Codex, Cursor가 실시간 페이지를 읽고, 내가 수락할 변경을 제안해요."
  button:
    label: 스펙 작성하기
    url: https://content.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd7f1bf8fa6054abcafa30bd60751ae40
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F93c61e2bc6ba476a938b13934f237b0c
    alt: "Content에서 연 “Team invites” 스펙. Goals, Non-goals, Decisions, Open questions 섹션이 있고 왼쪽에 페이지 트리가 있어요. 오른쪽 에이전트 채팅이 초대 링크의 유효 기간에 대한 결정을 추가했어요."
how_to:
  heading: 코딩 에이전트를 위한 스펙을 작성하는 방법
  steps:
    - title: 에이전트와 함께 스펙 쓰기
      body: "사이드바에서 **+**를 클릭하고 **페이지**를 고른 뒤 메모를 붙여 넣거나, [Content의 내장 에이전트](https://www.agent-native.com/docs/template-content/)에게 메모로 “새 기능의 PRD 초안을 써 줘”라고 요청하세요. 직접 고치거나, 섹션을 선택해 다시 써 달라고 하세요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2f4dd334ddfa4ec5bd74e67315414e8b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F15247dff32574395a608e454b510e22b
        alt: "에이전트 채팅에서 회의 메모로 팀 초대 스펙을 요청해요. 새 페이지 옆에 에이전트가 쓴 섹션을 나열한 답장이 보여요."
    - title: 코딩 에이전트에서 열기
      body: "**공유**에서 **에이전트**를 열고 **Claude Code에서 열기**나 **Codex에서 열기**를 고르세요. 에이전트가 페이지를 읽거나, 먼저 Content를 연결해 달라고 해요. Cursor나 VS Code라면 Content를 추가하고 **에이전트 프롬프트 복사**를 클릭해 붙여 넣으세요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa052d84a44fb4e6ead8b69535f25c726
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fc574e414836749119ad937c14623d14e
        alt: "Share 메뉴의 Agents 탭 확대 화면. Copy agent prompt, Open in Claude, Open in Claude Code, Open in Codex가 있어요. 그 아래 Connect Content에서 Add to Cursor, Add to VS Code, Other agents를 고를 수 있어요."
    - title: 스펙을 최신으로 유지하기
      body: "빌드 중에 남은 질문이 정해지면, 코딩 에이전트에게 페이지에 변경을 제안해 달라고 하세요. 제안마다 에이전트가 든 이유가 보여요. 체크 표시를 클릭하면 수락, X를 클릭하면 거절이에요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F156092664ebc424bb86899f876b88a97
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0c0108d3427d4641b5c3a2b266e8c4aa
        alt: "스펙의 Open questions 섹션 확대 화면. 코딩 에이전트가 제안한 수정이 Agent로 표시돼 있고, 이유와 함께 Accept(체크)와 Reject(X) 버튼이 있어요."
features:
  heading: 코딩 에이전트를 위한 스펙 작성에 필요한 모든 것
  items:
    - title: 피드백은 댓글로
      body: "에이전트에게 스펙 검토를 요청하면, 내 글을 다시 쓰지 않고 약한 부분에 댓글을 남겨요."
    - title: 기능마다 페이지 하나
      body: "스펙마다 리서치, API 메모, 지난 결정을 하위 페이지로 두고, 제목과 본문을 검색해 무엇이든 찾으세요."
    - title: 스펙 보드
      body: "담당자와 상태 필드가 있는 컬렉션에 스펙을 표나 보드로 모아 두세요. 행마다 전체 페이지가 연결돼 있어요."
    - title: 에이전트를 위한 메모
      body: "페이지 설명에 어떤 섹션이 확정됐는지 적어 두면, 스펙을 읽는 모든 에이전트가 그 내용도 함께 읽어요."
    - title: 저장 전 편집까지 읽어요
      body: "코딩 에이전트는 편집기에 아직 열려 있는 수정 내용까지 보니, 언제나 지금 이 순간의 페이지로 작업해요."
    - title: 팀과 함께 검토하기
      body: "어느 구절에든 댓글을 달고, 팀원을 @멘션하고, 스레드로 답하세요. 버전 기록으로 이전 스펙을 복원할 수 있어요."
