faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Content는 무료인가요?
      a: "네, Agent-Native Content는 무료 오픈 소스예요. 코딩 에이전트는 자기 모델로 스펙을 읽고 편집하니, 그만큼 에이전트 사용량에 포함돼요. Content의 내장 에이전트는 Builder.io 크레딧이나 내 모델 키로 실행돼요. Content는 알파 버전이라 바뀌는 부분이 있을 수 있어요."
    - q: 어떤 코딩 에이전트가 내 스펙을 읽을 수 있나요?
      a: "Claude Code와 Codex는 **공유**에서 페이지를 열고, 처음 한 번 연결을 요청해요. Cursor와 VS Code의 GitHub Copilot은 거기서 클릭 한 번으로 Content를 추가해요. Claude Cowork, Goose, OpenCode는 터미널에서 연결하고, 로그인을 지원하는 MCP 클라이언트라면 [URL로 Content에 연결](https://www.agent-native.com/docs/external-agents/#private-content-links)할 수 있어요. 각 에이전트는 내 계정이 볼 수 있는 것만 봐요."
    - q: 저장소에 있는 스펙 파일과 무엇이 다른가요?
      a: "저장소의 스펙 파일은 보통 코드를 다루는 사람만 고치는 사본이에요. Content에서는 코딩 에이전트가 읽는 바로 그 페이지에 팀이 글을 쓰고 댓글을 달고, 에이전트의 변경은 제안으로 들어와요. 저장소에도 마크다운을 두고 싶다면 Content가 [로컬 폴더와 동기화](https://www.agent-native.com/docs/template-content-sync/)해요."
    - q: 코딩 에이전트가 스펙을 바꿀 수 있나요?
      a: "네, 내 계정이 가진 권한 안에서요. 수정 제안을 요청하면, 하나씩 수락하기 전까지 페이지는 그대로예요. 페이지를 직접 편집할 수도 있지만, 에이전트가 읽은 뒤에 페이지가 바뀌었다면 Content가 그 편집을 거부해요. [버전 기록](https://www.agent-native.com/docs/template-content-editing/)에 이전 버전이 남아 있어요."
    - q: 스펙을 저장소에 둘 수 있나요?
      a: "네. Content에서 [로컬 마크다운이나 MDX 폴더](https://www.agent-native.com/docs/template-content-local-files/)를 연결해 변경을 가져오고, 확인하고, 푸시하거나, 명령어 하나로 저장소에서 Content를 시작하세요. 충돌은 검토할 수 있게 보여 줘요. 브라우저는 혼자서 로컬 파일을 읽을 수 없으니, 로컬 Content 앱이나 Agent-Native Desktop이 필요해요."
