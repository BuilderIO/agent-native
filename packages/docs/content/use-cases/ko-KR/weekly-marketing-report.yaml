      body: "Slack 웹훅으로 매일 요약과 대시보드 링크를 Slack 채널에 보내고, 어떤 표든 연결된 Google Sheets 계정으로 내보내세요."
    - title: MCP로 무엇이든 연결하기
      logos:
        - name: Notion
