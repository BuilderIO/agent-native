faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Analytics는 무료인가요?
      a: "네, Agent-Native Analytics는 무료 오픈 소스예요. 내 Google Analytics와 HubSpot 계정을 연결해서 써요. 처음에 에이전트용으로 무료 Builder.io AI 크레딧이나 내 AI 모델 키를 고르니, AI 사용량에는 한도가 있어요. Analytics는 알파 버전이라 바뀌는 부분이 있을 수 있어요."
    - q: 어떤 마케팅 데이터 소스를 연결할 수 있나요?
      a: "Agent-Native Analytics는 Google Analytics(GA4), HubSpot, 키워드 순위와 검색량을 위한 DataForSEO, 게시물 참여를 위한 X에 연결돼요. BigQuery, Amplitude, Mixpanel, PostHog, Stripe에도 연결돼요. 소스마다 자격 증명이 필요하고, Google Analytics에는 Google Cloud 서비스 계정이 필요해요."
    - q: Agent-Native Analytics가 매주 월요일에 리포트를 보내 줄 수 있나요?
      a: "아직 주간 일정은 없어요. [대시보드 이메일 보고서](https://www.agent-native.com/docs/template-analytics-dashboards/)는 매일 원하는 시간과 시간대에 최대 다섯 개의 이메일 주소, Slack 채널, 또는 둘 다로 보내져요. 월요일 회의 전에 **이메일 보고서**에서 **지금 전송**을 클릭하면 최신 대시보드를 보낼 수 있어요."
    - q: SQL을 알아야 하나요?
      a: "아니요. 평소 말로 물으면 에이전트가 소스를 고르고 쿼리를 써요. 확인하고 싶다면 어떤 답이든 그 뒤의 쿼리를 보여 달라고 하세요."
    - q: 숫자를 믿어도 되나요?
      a: "에이전트는 숫자를 알려 주기 전에 내 데이터에 실시간 쿼리를 실행하고, 쿼리가 실행되지 않은 수치에는 “Unverified”라고 표시해요. 그래도 첫 주 리포트는 팀에 보내기 전에 Google Analytics와 HubSpot과 비교해 보세요."
    - q: Agent-Native Analytics는 GA4나 HubSpot 리포트와 무엇이 다른가요?
      a: "Google Analytics와 HubSpot은 각자 자기 데이터만 보고해요. Agent-Native Analytics는 질문 하나에 두 곳의 데이터로 평소 말로 답하고, 그 답을 물어보며 다듬을 수 있는 대시보드 하나로 남겨요. 그래서 Analytics는 [에이전틱 앱](https://www.agent-native.com/articles/what-is-an-agent-native-app/)이에요. 에이전트의 두뇌와 앱의 직관성을 함께 갖췄죠."
