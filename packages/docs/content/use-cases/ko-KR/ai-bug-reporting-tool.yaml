faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Clips는 무료인가요?
      a: "네. Agent-Native Clips는 Chrome 확장 프로그램을 포함해 무료 오픈 소스예요. 제목, 요약, 전사 정리는 기본적으로 Builder.io AI 크레딧으로 실행되므로 AI 사용량은 무제한이 아니고, 녹화 영상을 저장할 공간도 필요해요. Clips는 알파 버전이라 발전하면서 바뀌는 부분이 있을 수 있어요."
    - q: Clips는 내 브라우저에서 무엇을 캡처하나요?
      a: "Clips Chrome 확장 프로그램은 최대 다섯 개 탭에서 [콘솔 메시지, JavaScript 오류, 네트워크 요청](https://www.agent-native.com/docs/template-clips-features/#chrome-extension-browser-logs)을 캡처하고, 녹화 버튼을 누르기 최대 30초 전까지 거슬러 올라가요. 요청마다 주소, 상태, 소요 시간, 실패 여부가 남아요. 편집자는 클립의 디버그 탭에서 모두 볼 수 있고, 에이전트는 링크로 받아요."
    - q: Clips가 비밀번호나 개인 정보도 녹화하나요?
      a: "Clips는 요청과 응답 본문, 헤더, 쿠키, 입력한 텍스트를 저장하지 않고, 토큰, 비밀번호, 키처럼 보이는 값은 가려요. 확장 프로그램 설정에서 개발자 로그를 끌 수도 있어요. 새 녹화는 링크가 있으면 누구나 볼 수 있으니, 내부 정보가 보이는 버그 리포트는 비공개나 우리 조직 공개로 바꾸세요."
    - q: 버그 녹화를 Claude Code, Cursor, Codex에 어떻게 전달하나요?
      a: "클립 링크를 Claude Code, Cursor, Codex에 붙여넣으면 에이전트가 영상을 내려받지 않고도 [전사, 프레임, 브라우저 로그를 읽어요](https://www.agent-native.com/docs/template-clips-integrations/#agent-readable-clips). 비공개 클립이라면 공유 메뉴의 에이전트 탭에서 에이전트 프롬프트 복사를 클릭하세요. 두 시간 동안 유효한 링크가 에이전트에게 전달돼요. 이 탭에서 클립을 Claude Code나 Codex로 바로 열 수도 있어요."
    - q: 다른 브라우저나 데스크톱 앱에서도 로그를 캡처하나요?
      a: "아니요. 콘솔과 네트워크 로그는 Clips Chrome 확장 프로그램에서만 가져와요. Clips Desktop과 웹 앱도 화면, 카메라, 음성을 녹화하고 전사와 요약을 만들어 주지만, 녹화에 브라우저 로그는 포함되지 않아요."
    - q: Clips는 Jira 같은 버그 트래커인가요?
      a: "아니요. Clips는 [엔지니어가 바로 처리할 수 있는 버그 리포트](https://www.agent-native.com/articles/how-to-write-a-bug-report/)를 만들고, 보관은 트래커가 맡아요. 링크를 Jira, GitHub, Linear, Slack에 붙여넣으세요. 코딩 에이전트나 [Clips 에이전트](https://www.agent-native.com/docs/template-clips-agent/)는 녹화 자체와 로그를 직접 읽어요. 그래서 Clips는 [에이전틱 앱](https://www.agent-native.com/articles/what-is-an-agent-native-app/)이에요. 에이전트의 두뇌와 앱의 직관성을 함께 갖췄죠."
