template: v2
slug: ai-bug-reporting-tool
app: clips
title: 콘솔과 네트워크 로그까지 담아 버그를 녹화하세요
seo_title: 콘솔 로그가 담기는 AI 버그 리포트 도구
meta_description: "Chrome에서 버그를 보여 주세요. Agent-Native Clips가 녹화를 페이지의 오류와 실패한 요청이 담긴 링크 하나로 만들어 엔지니어나 코딩 에이전트에게 건네줘요."
updated: 2026-10-27
hero:
  body: "Agent-Native Clips는 버그 녹화를 엔지니어나 코딩 에이전트가 바로 처리할 수 있는 링크 하나로 만들어 줘요. Chrome에서 버그를 보여 주면 페이지의 오류와 실패한 요청이 함께 담겨요."
  button:
    label: 버그 녹화하기
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe36fd7fdff9b49bca2c6787f302964c6
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff375e2d60b2048508c23ea90a9761e08
    alt: "Clips에서 열린 버그 녹화. 오류 메시지가 뜬 결제 페이지에서 일시 정지되어 있어요. 영상 옆 디버그 탭에는 빨간색 콘솔 오류와 500 상태로 실패한 요청이 나열돼요."
how_to:
  heading: AI로 버그를 리포트하는 방법
  steps:
    - title: Chrome에서 녹화 시작하기
      body: "툴바에서 Clips Chrome 확장 프로그램을 클릭하고 소스를 고르세요. 브라우저 탭, 창, 전체 화면 중에서 선택할 수 있어요. 카메라와 마이크를 켜거나 끈 뒤 Start recording을 클릭하세요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6996593713c74108967e120111378c14
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff7991811f7a346e0a99cf9fe81496e34
        alt: "웹 앱 위에 뜬 Clips 확장 프로그램 팝업 확대 화면. 소스로 Browser tab이 선택되어 있고, 카메라와 마이크가 켜져 있으며, Start recording 버튼이 보여요."
    - title: 버그를 보여 주고 설명하기
      body: "문제가 생기는 단계를 클릭하며 따라가고, 기대했던 동작을 말로 설명하세요. 녹화하는 동안 확장 프로그램이 페이지의 오류와 보낸 요청을 저장해요. 엔지니어가 Chrome 개발자 도구에서 직접 찾아야 했던 정보예요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe01ffb73c62c427b8077f05657fdeb47
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff895d85667344971baec96eb0b2ec956
        alt: "웹 앱의 결제 페이지 위에 뜬 Clips 녹화 컨트롤과 카메라 버블. 페이지에는 “Something went wrong” 메시지가 보여요."
    - title: 링크 하나로 공유하기
      body: "녹화를 멈추면 Clips가 녹화 링크를 복사해 줘요. 티켓, 채팅, 코딩 에이전트에 붙여넣으세요. 공유 메뉴의 에이전트 탭에서는 Claude, Claude Code, Codex로 바로 열 수도 있어요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F10933b64225545e1b5ecd666f5803832
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2894036362f7409d8a4961536719b399
        alt: "에이전트 탭이 열린 Clips 공유 메뉴 확대 화면. 에이전트 프롬프트 복사 버튼과 Claude에서 열기, Claude Code에서 열기, Codex에서 열기 버튼이 보여요."
features:
  heading: 버그를 리포트하는 데 필요한 모든 것
  items:
    - title: 코딩 에이전트를 위해 만들었어요
      body: "링크를 Claude Code, Cursor, Codex에 붙여넣으세요. 에이전트가 영상을 내려받지 않고도 전사, 프레임, 로그를 읽어요."
    - title: 콘솔과 네트워크 로그
      body: "Clips는 최대 다섯 개 탭의 콘솔 메시지, 오류, 요청을 저장하고, 요청마다 상태, 소요 시간, 실패 여부를 함께 담아요."
    - title: 녹화 전 30초
      body: "Clips는 녹화 버튼을 누르기 최대 30초 전까지 거슬러 올라가요. 페이지가 로드되는 동안 생긴 오류도 리포트에 담길 수 있어요."
    - title: 민감한 정보는 저장하지 않아요
      body: "Clips는 요청 본문, 헤더, 쿠키, 입력한 내용을 저장하지 않고, 토큰이나 비밀번호처럼 보이는 값은 가려요."
    - title: 오류로 바로 이동하기
      body: "클립의 디버그 탭에서 오류나 실패한 요청 옆의 시간을 클릭하면 영상이 그 순간으로 이동해요."
    - title: 모든 버그 리포트 검색하기
      body: "말한 내용으로 버그 리포트를 찾거나, 라이브러리의 모든 녹화에 대해 Clips 에이전트에게 물어보세요."
