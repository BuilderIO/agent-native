faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Analytics는 무료인가요?
      a: "네, Agent-Native Analytics는 무료 오픈 소스예요. 에이전트는 Builder.io AI 크레딧이나 내 모델 키로 실행되고, 데이터 소스마다 Stripe 시크릿 키 같은 자격 증명이 필요해요. Analytics는 알파 버전이라 화면과 기능이 바뀔 수 있어요."
    - q: Analytics는 어떤 도구에서 KPI를 가져올 수 있나요?
      a: "Analytics는 Stripe, HubSpot, PostHog, Mixpanel, Amplitude, Google Analytics(GA4), BigQuery 외에도 십여 개가 넘는 소스에 연결돼요. 각 소스는 [데이터 소스 페이지](https://www.agent-native.com/docs/template-analytics-connectors/)에서 자체 키로 추가하고, 대시보드 하나에 여러 소스를 섞을 수 있어요."
    - q: KPI 대시보드를 만들려면 SQL을 알아야 하나요?
      a: "아니요. 대시보드를 설명하거나 평소 말로 질문하면 에이전트가 SQL을 써요. 모든 차트 뒤의 쿼리는 계속 볼 수 있으니, 데이터를 아는 사람이 확인하거나 고칠 수 있어요."
    - q: 숫자가 맞는지 어떻게 알 수 있나요?
      a: "대시보드의 모든 숫자는 에이전트가 연결된 데이터에 실행한 쿼리에서 나오고, 어느 차트든 쿼리와 그 뒤의 레코드를 열어 볼 수 있어요. 쿼리를 실행하지 못했을 때는 수치를 “Unverified”로 표시해요. 대시보드를 믿기 전에 몇 가지 숫자를 Stripe와 비교해 보세요."
    - q: 내 KPI 대시보드는 누가 볼 수 있나요?
      a: "공유하기 전까지는 나만 볼 수 있어요. 팀원이나 조직 전체와 보기, 편집, 관리자 권한으로 [대시보드를 공유](https://www.agent-native.com/docs/sharing/)할 수 있어요. 내가 바꾼 필터는 나에게만 적용되니, 공유하려면 뷰를 저장하거나 링크를 보내세요."
    - q: Analytics는 내 분석 도구에 들어 있는 AI와 무엇이 다른가요?
      a: "분석 도구 안의 AI 어시스턴트는 그 도구의 데이터로만 일해요. Analytics는 Stripe, CRM, 제품 데이터를 넘나들고, 에이전트가 내가 보는 대시보드를 직접 만들고 고치니 답이 그대로 남는 패널이 돼요. 그래서 Analytics는 [에이전틱 앱](https://www.agent-native.com/articles/what-is-an-agent-native-app/)이에요. 에이전트의 두뇌와 앱의 직관성을 함께 갖췄죠."
