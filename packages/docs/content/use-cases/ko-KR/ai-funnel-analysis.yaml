template: v2
slug: ai-funnel-analysis
app: analytics
title: 신규 사용자가 이탈하는 지점을 찾아보세요
seo_title: 세션 리플레이로 하는 AI 퍼널 분석
meta_description: "Agent-Native Analytics에 가입 단계 중 어디서 신규 사용자를 잃는지 평소 말로 물어보세요. 내 이벤트로 퍼널을 만들고, 떠난 사람들의 리플레이를 볼 수 있어요."
updated: 2026-10-27
hero:
  body: "Agent-Native Analytics에 가입 단계 중 어디서 가장 많이 이탈하는지 물으면, 에이전트가 내 이벤트로 퍼널을 만들어요. 그다음 떠난 사람들의 리플레이를 보고 에이전트에게 이유를 물어보세요."
  button:
    label: 이탈 지점 찾기
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F55295bda356c490984f639946e838ebe
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd84d0fd7f856406e85b739ac0429b0f3
    alt: "“Activation funnel” 대시보드를 연 Analytics 창. 퍼널은 Signed up, Created a project, Connected a data source, Invited a teammate의 네 단계예요. 단계마다 인원, 가입자 대비 비율, 이전 단계에서 빠진 수가 보이고, 가장 크게 빠진 곳은 Created a project예요. 옆의 에이전트 채팅이 지난주 가입자가 어디서 멈췄는지 설명해요."
how_to:
  heading: AI로 퍼널 분석하는 방법
  steps:
    - title: 신규 사용자가 어디서 멈추는지 묻기
      body: "가입 이벤트를 Analytics로 가져오세요. **질문**에서 물으면 에이전트가 SQL을 쓰고, 단계별 인원과 이탈이 담긴 [퍼널 패널](https://www.agent-native.com/docs/template-analytics-dashboards/)을 추가해요. 이렇게 물어보세요. “Activation funnel 대시보드에 퍼널을 추가해 줘. 지난주 가입자는 어디서 멈췄어?”"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa752431cecb8420c88d3d6a8f7980ea9
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F16ab210c27504ed1b71c37ebdabea744
        alt: "그 요청과 에이전트의 답이 담긴 채팅, 그리고 에이전트가 추가한 퍼널. 단계는 Signed up 1,240, Created a project 612, Connected a data source 418, Invited a teammate 302이고, 각 단계에 이탈 수가 붙어 있어요."
    - title: 멈춘 사람들 찾기
      body: "Analytics 설정에서 세션 분류를 켜세요. **세션**에서 **이벤트**를 여세요. 이탈 직전 단계(예: “signed_up”)에는 **있음**을, 도달하지 못한 단계(예: “project_created”)에는 **없음**을 고르세요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F327bf36c28ab452da87cf4f4dc65debe
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F49b79e0de78041bb93444ec4d24ce11a
        alt: "Events 필터가 열린 Sessions 페이지 확대 화면. signed_up은 Did, project_created는 Didn't로 설정돼 있어요. 아래에는 필터링된 신규 사용자 세션 목록이 길이, 페이지, 분노 클릭 수와 함께 보여요."
    - title: 세션에서 무슨 일이 있었는지 묻기
      body: "리플레이를 열어 페이지, 클릭, 네트워크 요청을 보세요. **이 세션에 대해 에이전트에게 질문**을 클릭하고 “이 세션에서 무슨 일이 있었어?”라고 물으면, 에이전트가 오류, 반복 클릭, 그 사람이 본 페이지를 요약해요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7e0b3a4750a143f6bcd609e1c5460fd2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe44e9321e80d4c3f826bd7b25fa54025
        alt: "프로젝트 생성 페이지에 있는 신규 사용자의 리플레이와 옆에 있는 에이전트의 답. 이 사용자는 프로젝트 이름을 입력하고 Create project를 세 번 클릭했어요. projects API 요청이 매번 실패했고, 사용자는 떠났어요."
features:
  heading: 이탈을 찾고 고치는 데 필요한 모든 것
  items:
    - title: 건너뛴 건 이탈이 아니에요
      body: "건너뛸 수 있는 단계를 에이전트에게 알려 주면, 퍼널이 그 단계를 건너뛴 사람과 거기서 앱을 떠난 사람을 나눠 보여 줘요."
    - title: 우리 팀의 이벤트 이름 그대로
      body: "관리자가 **시맨틱 레이어** 페이지에 이벤트와 지표를 설명해 두면, 에이전트가 모든 쿼리에서 그 이름을 정확히 써요."
    - title: 실패한 요청 확인하기
      body: "리플레이에서 **개발자 도구**를 열어 콘솔과 네트워크 요청을 읽고, 요청이 실패한 순간으로 바로 이동하세요."
    - title: 에이전트용 가린 리플레이
      body: "외부 에이전트는 녹화 자체가 아니라 리플레이의 콘솔과 네트워크 항목을 오류부터 받아요. 링크는 두 시간 뒤 만료돼요."
    - title: 기본은 비공개
      body: "모든 리플레이에서 입력 내용은 가려지고, 페이지의 다른 어떤 부분을 숨길지는 직접 정할 수 있어요."
    - title: 매일 받는 퍼널
      body: "에이전트에게 퍼널 대시보드를 원하는 시간에 매일 보내 달라고 하세요. 최대 다섯 명에게 이메일로, 또는 Slack으로 받아요."
