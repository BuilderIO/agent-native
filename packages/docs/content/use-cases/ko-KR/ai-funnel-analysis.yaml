other_uses:
  heading: Agent-Native Analytics로 할 수 있는 다른 일
  cards:
    - title: 스타트업 KPI 대시보드를 만들어 보세요
      url: https://www.agent-native.com/use-cases/ai-kpi-dashboard/
      body: "추적하는 KPI를 설명하면, 에이전트가 Stripe, HubSpot, 제품 데이터로 대시보드 하나를 만들어요."
    - title: 데이터에 평소 말로 질문해 보세요
      url: https://www.agent-native.com/use-cases/ask-your-database/
      body: "BigQuery 데이터에 질문하면, 에이전트가 확인할 수 있는 읽기 전용 SQL을 써요."
    - title: 스프레드시트 없이 주간 마케팅 리포트를 만들어 보세요
      url: https://www.agent-native.com/use-cases/weekly-marketing-report/
      body: "마케팅 한 주가 어땠는지 물으면, 에이전트가 Google Analytics와 HubSpot 데이터로 대시보드에 답해요."
faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Analytics는 무료인가요?
      a: "네, Agent-Native Analytics는 무료 오픈 소스예요. 호스팅 앱을 쓰거나 [직접 설치해 운영](https://www.agent-native.com/docs/template-analytics/)할 수 있어요. 데이터는 직접 가져와요. 내 이벤트나 연결한 도구의 데이터요. Analytics는 알파 버전이라 바뀌는 부분이 있을 수 있어요."
    - q: SQL을 알아야 하나요?
      a: "아니요. 평소 말로 물으면 에이전트가 SQL을 쓰고 실행해 차트, 표, 숫자로 답해요. 확인하고 싶을 때는 쿼리를 보여 달라고 하세요. 다만 처음에는 데이터를 아는 사람이 [소스를 연결](https://www.agent-native.com/docs/template-analytics-connectors/)해야 할 수도 있어요."
    - q: 세션 리플레이는 어디서 오나요?
      a: "내 웹 앱에서 와요. **데이터 소스**에서 공개 키를 만들고, **세션** 페이지의 짧은 추적 스니펫을 세션 리플레이를 켠 채 앱에 추가하세요. 녹화를 저장할 곳으로 Builder.io나 내 S3 버킷을 연결하세요. 기본적으로 [리플레이](https://www.agent-native.com/docs/template-analytics-monitoring-and-sessions/)는 로그인한 사용자만 녹화해요."
    - q: 세션 리플레이에는 무엇이 기록되나요?
      a: "리플레이는 페이지, 클릭과 스크롤, 콘솔 출력, 네트워크 요청을 재생해요. 입력 내용은 기본적으로 가려지고, 비밀번호나 카드 정보 필드는 절대 기록되지 않아요. 다른 부분을 숨기려면 페이지의 해당 부분에 클래스를 추가하세요."
    - q: PostHog, Amplitude, Mixpanel 데이터를 쓸 수 있나요?
      a: "네. **데이터 소스**에서 연결하고, 거기서 추적하는 이벤트에 대해 물어보세요. 에이전트가 도구마다 쿼리해 줘요. 세션 리플레이는 Analytics 자체 추적에서만 나오니, 멈춘 사람들을 보려면 앱에 추적을 추가하세요."
    - q: Analytics는 내 분석 도구에 들어 있는 AI와 무엇이 다른가요?
      a: "분석 도구의 AI는 그 도구의 데이터로만 일해요. Analytics 에이전트는 연결한 모든 소스를 넘나들고, 멈춘 바로 그 사람들의 리플레이를 찾아 설명하거나 코딩 에이전트에 넘겨요. 게다가 오픈 소스예요. 그래서 Analytics는 [에이전틱 앱](https://www.agent-native.com/articles/what-is-an-agent-native-app/)이에요. 에이전트의 두뇌와 앱의 직관성을 함께 갖췄죠."
