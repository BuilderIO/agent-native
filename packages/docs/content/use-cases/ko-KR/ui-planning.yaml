faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Plan은 무료인가요?
      a: "네, [Agent-Native Plan](https://www.agent-native.com/docs/template-plan/)은 무료 오픈 소스예요. 화면은 내 코딩 에이전트가 그리니, 각 계획은 에이전트의 모델에서 실행되고 사용량에 포함돼요. 계획이 길수록 더 많이 써요. Plan은 알파 버전이라 바뀌는 부분이 있을 수 있어요."
    - q: 어떤 코딩 에이전트가 Plan과 함께 동작하나요?
      a: "Agent-Native Plan에는 Claude Code와 Codex용 플러그인이 있어요. 설치 명령어는 Cursor, OpenCode, GitHub Copilot도 같은 방식으로 설정해, 한 번 로그인하면 `/visual-plan`이 추가돼요. Cline, Goose 등 MCP를 지원하는 다른 에이전트는 Plan의 URL을 추가해 연결해요."
    - q: 계획에 보이는 내용은 어떻게 바꾸나요?
      a: "화면은 [댓글을 달아](https://www.agent-native.com/docs/template-plan-review-workflow/) 바꾸고, 그러면 코딩 에이전트가 다시 그려요. Plan에서는 화면의 요소를 직접 끌거나 크기를 바꿀 수 없어요. 화면 아래의 글로 쓴 계획은 달라요. 텍스트를 바로 편집할 수 있어요."
    - q: 화면이 지금 쓰는 앱과 맞게 나오나요?
      a: "네, 이미 있는 앱의 화면이라면요. 코딩 에이전트가 그리기 전에 앱의 코드, 레이아웃, 컴포넌트를 읽으니, 계획에 실제 사이드바, 툴바, 메뉴가 나와요. 완전히 새로운 앱이라면 내 설명을 바탕으로 화면을 그려요."
    - q: Plan은 코딩 에이전트의 플랜 모드와 무엇이 다른가요?
      a: "Plan은 에이전트의 플랜 모드와 함께 동작하며, 그 계획을 화면으로 보여 줘요. 에이전트가 이미 쓴 Claude Code, Codex, 마크다운 계획을 `/visual-plan`에 주면, Plan이 그 계획이 설명하는 화면으로 바꿔 주고 정확한 지점에 댓글을 달 수 있어요."
