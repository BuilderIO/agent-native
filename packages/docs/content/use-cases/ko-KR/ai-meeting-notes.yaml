faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Clips는 무료인가요?
      a: "네, Agent-Native Clips는 무료 오픈 소스예요. 요약, 제목, 전사 정리는 기본적으로 [Builder.io AI 크레딧](https://www.agent-native.com/docs/template-clips-features/)으로 실행돼요. 크레딧이 떨어지면 크레딧을 추가하거나 내 Gemini 키를 연결할 때까지 이 기능들이 멈춰요. Clips는 알파 버전이라 바뀌는 부분이 있을 수 있어요."
    - q: 회의에 봇이 들어오나요?
      a: "아니요. Clips는 내 컴퓨터에서 노트를 만들어요. Clips Desktop이 마이크와 통화 소리를 녹음하니 Zoom, Google Meet, Microsoft Teams 통화에 아무것도 들어오지 않아요. 봇이 들어오지 않으니 노트를 만들고 있다는 사실은 참석자에게 알려 주세요."
    - q: Clips는 어떤 캘린더와 화상 통화 앱에서 쓸 수 있나요?
      a: "캘린더는 Google Calendar만 연결할 수 있어요. 노트는 Zoom, Google Meet, Microsoft Teams, Webex 등 내 컴퓨터에서 소리가 재생되는 모든 통화에서 만들 수 있어요. Mac에서는 캘린더에 없는 통화도 Clips Desktop이 알아채고 노트를 시작할지 물어봐요. 다른 참석자의 목소리는 Mac에서만 담겨요."
    - q: Windows에서도 회의 노트를 만들 수 있나요?
      a: "Clips Desktop은 Mac, Windows, Linux에서 실행되지만, 다른 참석자의 목소리를 담는 기능은 Mac에서만 돼요. Windows와 Linux에서는 내 마이크만 녹음하므로, 원격 참석자는 전사와 작업 항목에 나타나지 않아요."
    - q: Clips는 Zoom이나 Google Meet의 AI 노트 기능과 무엇이 다른가요?
      a: "통화 앱의 AI 노트 기능은 그 앱의 통화에만 묶여 있어요. Clips는 어떤 통화 앱이든 모든 회의를 한 라이브러리에 모아 둬요. [Clips 에이전트](https://www.agent-native.com/docs/template-clips-agent/)에게 “지난 화요일에 Daniel이 뭘 하기로 했지?”라고 물으면 말한 내용으로 회의를 검색해요. 그래서 Clips는 [에이전틱 앱](https://www.agent-native.com/articles/what-is-an-agent-native-app/)이에요. 에이전트의 두뇌와 앱의 직관성을 함께 갖췄죠."
