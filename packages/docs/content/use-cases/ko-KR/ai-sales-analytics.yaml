faqs:
  heading: 궁금한 점이 있으신가요? 답해 드릴게요
  items:
    - q: Agent-Native Analytics는 무료인가요?
      a: "네, Agent-Native Analytics는 무료 오픈 소스예요. 에이전트는 Builder.io AI 크레딧이나 내 AI 키로 실행되니, AI 사용량이 무제한은 아니에요. 통화에 대한 질문은 Gong API 크레딧도 쓸 수 있고, 관리자가 이를 끌 수 있어요. Analytics는 알파 버전이에요."
    - q: Agent-Native Analytics는 어떤 CRM과 통화 도구에 연결되나요?
      a: "Analytics는 CRM으로 HubSpot, 영업 통화로 Gong에 연결돼요. 연락처와 회사 데이터를 위해 Apollo와 Clay도 연결할 수 있어요. 각 도구는 [데이터 소스 페이지에서](https://www.agent-native.com/docs/template-analytics-connectors/) 자체 키로 연결하고, 질문 하나로 HubSpot과 Gong을 함께 볼 수 있어요."
    - q: SQL을 써야 하나요?
      a: "아니요. 평소 말로 물으면 에이전트가 HubSpot이나 Gong에서 데이터를 찾아 쿼리를 실행하고, 숫자, 표, 차트로 답해요. 답을 대시보드에 저장하면 에이전트가 패널마다 새 데이터를 가져오는 방법을 설정해요."
    - q: 숫자를 믿어도 되나요?
      a: "네, 확인을 거친다면요. 에이전트는 실시간 HubSpot과 Gong 데이터로 답하고, 실시간 쿼리에서 나오지 않은 수치는 Unverified로 표시해요. 또 팀이 [시맨틱 레이어 페이지에 적은 정의](https://www.agent-native.com/docs/template-analytics-dashboards/)를 따라요. 처음 몇 번의 답은 HubSpot과 비교해 본 뒤에 믿으세요."
    - q: Agent-Native Analytics는 HubSpot이나 Gong에 들어 있는 AI와 무엇이 다른가요?
      a: "HubSpot이나 Gong의 AI는 그 도구 하나에 들어 있어요. Analytics는 질문 하나에 HubSpot과 Gong을 함께 써서 답하고, Stripe와 BigQuery도 읽으며, 그 답을 팀이 매주 다시 여는 대시보드로 남겨요. HubSpot과 Gong은 지금처럼 쓰고, Analytics는 두 곳에서 데이터를 읽기만 해요."
    - q: 내 대시보드는 누가 볼 수 있나요?
      a: "공유하기 전까지는 나만 볼 수 있어요. 팀원이나 조직 전체와 보기, 편집, 관리자 권한으로 대시보드를 공유하세요. 팀원은 자신의 연결이나 관리자가 조직용으로 설정한 연결로 HubSpot과 Gong 데이터를 봐요. 둘 다 없으면 해당 패널에 오류가 표시돼요."
