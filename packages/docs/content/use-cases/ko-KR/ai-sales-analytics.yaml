title: HubSpot과 Gong 데이터로 영업 파이프라인을 검토하세요
seo_title: HubSpot과 Gong을 위한 AI 영업 분석
meta_description: "파이프라인 리뷰 전에 어떤 딜이 왜 멈췄는지 확인하세요. Agent-Native Analytics에 HubSpot과 Gong에 대해 평소 말로 묻고, 답을 대시보드로 남기세요."
updated: 2026-10-27
hero:
  body: "Agent-Native Analytics는 HubSpot 딜과 Gong 통화를 파이프라인 리뷰마다 쓸 대시보드로 만들어 줘요. 어떤 딜이 왜 멈췄는지 평소 말로 물으면, 에이전트가 두 곳의 데이터로 답해요."
  button:
    label: 파이프라인에 질문하기
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe534007e491840cc86570110b7d00de4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4780c6d1885541bcaf3d949dbdbc1eb7
    alt: "Analytics의 Weekly pipeline review 대시보드. 단계별 진행 중 파이프라인, 담당자별 딜, 30일째 멈춘 딜 패널이 있어요. 오른쪽 에이전트 채팅은 멈춘 딜 하나가 왜 멈췄는지 HubSpot 단계 기록과 마지막 Gong 통화로 답해요."
how_to:
  heading: AI로 영업 파이프라인을 분석하는 방법
  steps:
    - title: CRM과 통화 데이터 연결하기
      body: "**데이터 소스**를 열고 **CRM & Sales** 아래 HubSpot 옆의 **연결**를 클릭하세요. HubSpot 설정에서 만든 비공개 앱의 토큰을 붙여 넣고 **자격 증명 저장**을 클릭하세요. Gong도 액세스 키와 시크릿으로 똑같이 연결해요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fdeea3eb7d84048eca0f534b7b00390ee
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd918aa95f46047559b1f30c42d89d62f
        alt: "Connected 아래 HubSpot, CRM & Sales 아래 Gong이 있는 Data Sources 페이지. Gong 설정 시트가 Access Key Secret 단계에서 열려 있고, 값이 붙여 넣어진 채 Save Credentials 위에 있어요."
    - title: 파이프라인에 대해 질문하기
      body: "**질문**에서 평소 말로 물어보세요. “30일 넘게 같은 단계에 머문 진행 중 딜은 어떤 게 있어?” 에이전트가 HubSpot 딜을 찾아, 정렬하고 이어서 물어볼 수 있는 표로 답해요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7acaa378761c453bb79f9f246d8cab72
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe66acdb3c24e41c7b5caef3e0251b17a
        alt: "30일째 멈춘 딜에 대한 질문이 담긴 Ask 채팅. 에이전트가 진행 중 딜 6개를 단계, 담당자, 금액, 단계 체류 일수와 함께 표로 답해요."
    - title: 답을 대시보드로 저장하기
      body: "에이전트에게 “파이프라인 리뷰용 대시보드로 저장해 줘”라고 하세요. 답마다 패널이 생기고, HubSpot의 새 데이터로 새로 고쳐져요. 파이프라인 리뷰 전에 팀과 대시보드를 공유하세요."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F69b61731b5b74d61ad0e510f57522796
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2720d0e5fd8f40bfa3b72c056270f174
        alt: "Weekly pipeline review 대시보드를 저장했다고 알리는 에이전트 채팅과, 멈춘 딜 표와 단계별 파이프라인 차트가 있는 새 대시보드."
features:
  heading: 파이프라인 리뷰에 필요한 모든 것
  items:
    - title: 딜과 통화를 함께
      body: "질문 하나로 HubSpot의 딜 단계와 담당자, Gong 통화에서 구매자가 한 말을 함께 가져올 수 있어요."
    - title: 에이전트가 고치는 대시보드
      body: "새 패널, 담당자별 필터, 다른 차트를 요청하면 에이전트가 팀이 함께 보는 대시보드를 업데이트해요."
    - title: 확인할 수 있는 답
      body: "실시간 HubSpot이나 Gong 쿼리에서 나오지 않은 수치는 에이전트가 Unverified로 표시하니, 무엇을 확인할지 알 수 있어요."
    - title: 파이프라인과 매출을 나란히
      body: "Stripe와 BigQuery도 연결하면, 같은 채팅에서 딜과 함께 매출과 제품 사용에 대한 질문에도 답해요."
    - title: 우리 팀의 파이프라인 정의
      body: "관리자가 **시맨틱 레이어** 페이지에 멈춘 딜이나 적격 파이프라인의 뜻을 적어 두면, 에이전트가 답하기 전에 읽어요."
    - title: 매일 받는 파이프라인 리포트
      body: "앱을 열지 않아도 매일 대시보드를 최대 다섯 명에게 이메일로, 또는 Slack 채널로 받아 보세요."
