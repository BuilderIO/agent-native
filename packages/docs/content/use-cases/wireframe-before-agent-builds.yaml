slug: wireframe-before-agent-builds
job_id: job-agent-wireframe
app: plans
audience: technical
title: "Wireframe a screen before your coding agent builds it"
subhead: "Ask your agent for a plan with wireframes of the screens, review them, and comment before any code changes."
meta_description: "Get wireframes of the screens your coding agent plans to build, comment on them, and have the agent revise the plan first. Free, open-source Plans from Agent-Native."
cta_label: "Plan visually"
secondary_cta_label: "See how it works"
app_cta_url: "https://plan.agent-native.com"
screenshot_alt: "A visual plan in Plans: a canvas of three mobile screens above a written plan with a goal and a comment indicator"
old_way:
  heading: "How most people do it today"
  body: "You describe the layout in a prompt and find out what the agent pictured when the code shows up."
new_way:
  heading: "How it works in Plans"
  steps:
    - "Add the planning skills to your coding agent with the install command from the Plans page."
    - "Ask your agent for a visual plan of the screen. The plan includes wireframes and annotated code."
    - "Pin comments to the wireframes, then ask the agent to read them and revise the plan before it builds."
todays_stack:
  heading: "How a screen gets described today"
  items:
    - tool: "A prompt"
      used_for: "Describing the layout"
      breaks: "The agent guesses at what you meant."
    - tool: "A sketch on paper or a whiteboard"
      used_for: "Showing the layout"
      breaks: "The agent can't see it."
    - tool: "A design tool"
      used_for: "Detailed mockups"
      breaks: "More detail than you need before the agent builds a first version."
  in_app: "In Plans, the wireframes are part of the agent's plan, so your comments go straight back to the agent that will build the screen."
frequency: per-project
how_often_label: "Every new screen"
roles: [engineering, product]
connects_to: ["Claude Code", "Codex"]
next_jobs: [see-what-your-coding-agent-plans, design-brief-to-prototype]
recipes:
  - id: wireframe-screen
    title: "Ask for wireframes of a new screen"
    when: "You're about to have your agent build a screen."
    do: "Ask your agent for a visual plan of the screen."
    prompt: "/visual-plan [describe the screen and who uses it]"
    you_get: "Wireframes of the screen alongside the written plan."
    how_often: "Every new screen"
  - id: comment-wireframe
    title: "Comment on the layout, not the code"
    when: "The wireframe isn't what you pictured."
    do: "Pin feedback to the part of the wireframe that's wrong, then ask the agent to revise."
    you_get: "A revised plan before any code changes."
    how_often: "Every new screen"
  - id: go-to-design
    title: "Take it to Design when it needs polish"
    when: "The screen needs to be on brand and reviewed by others."
    do: "Use Design for an interactive, on-brand prototype."
    you_get: "A prototype you can compare in versions and share for feedback."
    how_often: "When needed"
story: null
faqs:
  - q: "Does Plans make wireframes?"
    a: "Plans can include wireframes and interactive prototype options alongside the written plan."
  - q: "Is Plans a design tool?"
    a: "No. Plans is for reviewing what your coding agent will build. For a polished, on-brand prototype, use Design."
  - q: "Where are plans saved, and can I share them?"
    a: "The default installation connects your agent to the hosted Plans app. New hosted plans are private until you share them, and commenting requires an account."
  - q: "Is Plans free?"
    a: "Yes. Plans is free and open source. It's labeled alpha, so expect rough edges."
cta_band_heading: "Wireframe your next screen first"
cta_band_subhead: "See what your agent will build, and fix it before it writes code."
