new_way:
  heading: "How it works in Analytics"
  steps:
    - "Connect a data source. Analytics has connectors for services like Stripe, HubSpot, and BigQuery."
    - "Ask a question in plain English, like how many signups you got last week. The agent writes and validates the SQL and returns a chart, table, or metric."
    - "Save it as a dashboard with filters and saved views, and share it with specific people or your whole organization."
story: null
faqs:
  - q: "What is Agent-Native Analytics?"
    a: "Agent-Native Analytics is an open-source app for asking analytics questions in plain English and getting charts, dashboards, and re-runnable investigations back. You own the code, the queries, and the data."
  - q: "Which data sources can I connect?"
    a: "Analytics includes connectors for services like BigQuery, GA4, Mixpanel, Amplitude, PostHog, HubSpot, Stripe, GitHub, Jira, and more, plus a built-in first-party event collector. The agent can write new connectors on request."
  - q: "Do I need to write SQL?"
    a: "No. The agent writes and validates the SQL for you. You can also use the SQL query explorer if you want to run queries directly."
  - q: "Can I trust the numbers?"
    a: "Check a few answers against a source you already trust before you rely on them. The agent works from your data and a data dictionary, so clear column names and definitions help."
  - q: "Who can see my dashboards?"
    a: "You can share dashboards per user or per organization with viewer, editor, or admin roles."
