audience: technical
title: "A startup KPI dashboard you can ask questions of"
subhead: "Connect your data, ask for the charts you need in plain English, and keep them in reusable dashboards. The agent writes the SQL."
meta_description: "Connect your data, ask questions in plain English, and build reusable KPI dashboards while the agent writes the SQL. Free, open-source Analytics from Agent-Native."
cta_label: "Try Analytics"
secondary_cta_label: "See how it works"
app_cta_url: "https://analytics.agent-native.com"
screenshot_alt: "An Analytics product overview dashboard with metric cards, a weekly active users chart, an activation funnel, and the agent chat open"
old_way:
  heading: "How most people do it today"
  body: "The metrics live in a spreadsheet someone rebuilds every month, or in an analytics tool only a few people know how to query. Everyone else asks a question and waits."
replaces:
  - "Amplitude"
  - "Mixpanel"
  - "Looker"
new_way:
  heading: "How it works in Analytics"
  steps:
    - "Connect a data source. Analytics has connectors for services like Stripe, HubSpot, and BigQuery."
    - "Ask a question in plain English, like how many signups you got last week. The agent turns your question into SQL."
    - "Save it as a dashboard with filters and saved views, and share it with specific people or your whole organization."
todays_stack:
  heading: "What changes for your numbers"
  items:
    - text: "**Exporting from your billing system by hand** every month, then pasting the numbers into a spreadsheet."
    - text: "**Rebuilding the spreadsheet** for MRR, churn, and growth, which goes stale between updates."
    - text: "**A product analytics tool, like Amplitude or Mixpanel,** covers usage and retention, but only a few people know how to query it."
    - text: "**ChatGPT with a CSV** can answer questions about the numbers, but every answer starts with uploading the data again."
  in_app: "Stripe stays your billing system. Analytics connects to it and your other sources, answers plain-English questions, and keeps the answers in dashboards."
story: null
faqs:
  - q: "What is Agent-Native Analytics?"
    a: "Agent-Native Analytics is an open-source app for asking analytics questions in plain English and getting charts, dashboards, and re-runnable investigations back. You own the code, the queries, and the data."
  - q: "Which data sources can I connect?"
    a: "Analytics lists 23 data sources, including first-party events, BigQuery, Google Analytics (GA4), Amplitude, Mixpanel, PostHog, PostgreSQL, Stripe, HubSpot, GitHub, and Jira."
  - q: "Do I need to write SQL?"
    a: "No. You ask in plain English, and the agent turns your question into SQL."
  - q: "Can I trust the numbers?"
    a: "Check a few answers against a source you already trust before you rely on them. The agent works from your data and a data dictionary, so clear column names and definitions help."
  - q: "Who can see my dashboards?"
    a: "Dashboards are private by default. You can share one with a teammate or your whole organization as a viewer, editor, or admin."
cta_band_heading: "Build your first dashboard"
cta_band_subhead: "Connect your data and ask a question."
