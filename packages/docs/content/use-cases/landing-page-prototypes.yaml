old_way:
  heading: "How most people do it today"
  body: "Every launch needs a page. You start from the last one, wait on a designer, or fight a page builder, and by the time there's something to react to, the launch date is close. Review happens on screenshots, so feedback arrives as a pile of comments about spacing."
new_way:
  heading: "How it works in Design"
  steps:
    - "Paste the brief: the offer, the audience, and the call to action. Link a design system so the page matches your brand."
    - "Ask for a few versions. Design shows them side by side on the canvas. Pin comments to specific elements and send them to the agent."
    - "Edit text and styling yourself, then export HTML or a ZIP of the files."
story: null
faqs:
  - q: "Does Design publish the page?"
    a: "No. Design creates interactive HTML prototypes you can share for feedback or export. Publishing and deploying the page is a separate step."
  - q: "Can I edit a page after AI generates it?"
    a: "Yes. Adjust text, spacing, and styling with visual controls, or ask the AI agent to change the design. You can compare different directions and keep refining the one you choose."
  - q: "Can I use my own brand?"
    a: "Yes. Link a design system to guide colors, typography, styling, and brand instructions. You can reuse it across designs."
  - q: "Is the export a finished page?"
    a: "The export is a starting point. Application logic, integrations, testing, and deployment still need implementation and review. HTML exports may use external runtime resources."
  - q: "Is Design free?"
    a: "Yes. Design is free and open source. It's labeled alpha, so expect rough edges."
