faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Design free?
      a: Yes, Agent-Native Design is free and open source. Building a page needs an AI connection, either through Builder.io AI credits or your own AI key, so AI use isn't unlimited. Design is in alpha, so expect changes as it grows.
    - q: Does Design publish or host my landing page?
      a: No. Design makes the landing page and exports it, and you deploy it with the tools you use today. Download the HTML or a ZIP of the files, or copy a prompt your coding agent uses to add the page to your site.
    - q: Can I use my own brand?
      a: Yes. Build a design system from a Figma file, your website, a GitHub repo or uploaded files, and pick it when you start a page. The agent keeps its colors, fonts and styles on every version it makes.
    - q: Can I edit the landing page after the AI makes it?
      a: Yes. Change text, colors, spacing and layout by hand on the page, or ask the agent to change a section. You can restore an earlier version from **Version history** at any time.
    - q: What do I get when I export the landing page?
      a: "**Download HTML** gives one file that opens in any browser and loads its styles over the internet. **Download ZIP** has all the page's files, and **Download for Figma (SVG)** gives layers you can edit in Figma. The docs list [every export option](https://www.agent-native.com/docs/template-design-features/#export)."
    - q: How is Design different from asking a chatbot for a landing page?
      a: "A chatbot gives you code to paste somewhere before you can see the page. In Design, the agent builds the page in an editor you can see and click, in several versions. You change it by hand or by asking, on the same page. That's an [agentic app](https://www.agent-native.com/articles/what-is-an-agent-native-app/): the brains of an agent, the intuitiveness of an app."
