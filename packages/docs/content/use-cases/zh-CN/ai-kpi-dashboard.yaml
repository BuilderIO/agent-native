faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Analytics 免费吗？
      a: 是的，Agent-Native Analytics 免费且开源。agent 使用 Builder.io AI 额度或你自己的模型密钥运行，每个数据源都需要各自的凭证，比如 Stripe 密钥。Analytics 目前处于 alpha 阶段，界面和功能可能还会变化。
    - q: Analytics 能从哪些工具获取我的 KPI？
      a: Analytics 可以连接 Stripe、HubSpot、PostHog、Mixpanel、Amplitude、Google Analytics (GA4)、BigQuery，以及十几个其他数据源。每个数据源都在[数据源页面](https://www.agent-native.com/docs/template-analytics-connectors/)用各自的密钥添加，一个仪表板可以混合多个数据源。
    - q: 搭建 KPI 仪表板需要懂 SQL 吗？
      a: 不需要。你用日常语言描述仪表板或提问，agent 会编写 SQL。每张图表背后的查询都可以查看，熟悉数据的人可以检查或修改。
    - q: 我怎么知道这些数字是对的？
      a: 仪表板上的每个数字都来自 agent 在你连接的数据上运行的查询，任何图表背后的查询和记录你都能打开查看。如果 agent 没能运行查询，就会把这个数字标为“Unverified”。在依赖仪表板之前，先拿几个数字和 Stripe 对照一下。
    - q: 谁能看到我的 KPI 仪表板？
      a: 在你分享之前，只有你自己能看。你可以把[仪表板分享](https://www.agent-native.com/docs/sharing/)给某位同事或整个组织，身份可以是查看者、编辑者或管理员。你修改的筛选条件只对你自己生效；想分享它们，就保存一个视图或发送链接。
    - q: Analytics 和我的分析工具里自带的 AI 有什么不同？
      a: 单个分析工具里的 AI 助手只处理那个工具的数据。Analytics 能跨 Stripe、CRM 和产品数据工作，它的 agent 会搭建和编辑你正在看的仪表板，所以它的回答会变成你能保留的面板。正因如此，Analytics 是一个[智能体应用](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：既有 agent 的智能，又有应用的直观易用。
