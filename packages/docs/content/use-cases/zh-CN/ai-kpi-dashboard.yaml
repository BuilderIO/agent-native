how_to:
  heading: 如何用 AI 搭建 KPI 仪表板
  steps:
    - title: 连接收入和产品数据
      body: 在 **数据源** 页面粘贴你的 Stripe 密钥，然后添加 HubSpot 和你在用的产品分析工具。在数据源的菜单中选择 **测试连接**，确认 Analytics 能读取它。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ea7e1568d3b4afd9fc6a2a01bc969b0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F78b97b8d077644f28c627377157f1331
        alt: 数据源页面上 Stripe 的特写，标为 Connected，密钥已配置，测试连接后显示“Connection successful”。
    - title: 描述你想要的仪表板
      body: 点击 **新仪表板**，描述你跟踪的 [SaaS 指标](https://www.agent-native.com/articles/what-should-a-saas-metrics-dashboard-include/)，例如“来自 Stripe 的 MRR 和流失率，来自 PostHog 的新注册和激活，按月显示”。agent 可能会先提几个问题，然后搭建每个面板并打开仪表板。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fca8b7f3746ca419383e042cc0c142271
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb167e98f0ac049fa8ad4b169e8f77ec9
        alt: 从侧边栏 Dashboards 列表打开的 New dashboard 输入框特写，里面输入了一段创业公司 KPI 仪表板的描述。
    - title: 问问数字为什么变了
      body: 在图表菜单中选择 **与面板聊天** 并提问，比如“9 月的流失率为什么上升了？”agent 会根据你连接的数据回答，你要求时它还会往仪表板里添加面板。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9b18fbf5a7cd4b4ba65d9efede75538b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9edee9cd613741e2ba670e414be767c7
        alt: 按月流失率面板，旁边是 agent 聊天。被问到 9 月流失率为什么上升时，agent 按套餐拆解了增幅：Starter 套餐的流失率几乎翻倍。
features:
  heading: 跟踪创业公司 KPI 所需的一切
  items:
    - title: 收入、管道和使用情况放在一起
      body: 来自 Stripe 的 MRR、来自 HubSpot 的商机，以及来自 PostHog 或 Mixpanel 的注册数，并排放在同一个仪表板里。
    - title: 手动编辑或直接提问
      body: 自己改筛选条件，或让 agent 加一个新面板。两种改动都落在同一个仪表板上，历史记录可以恢复任何旧版本。
    - title: 每个数字背后的查询
      body: 点击图表上的任意一点，就能看到背后的记录、找出这些记录的 SQL，还能下载 CSV。
    - title: 你对 MRR 的定义
      body: 在 **语义层** 页面写明你们公司如何计算 MRR 或活跃用户。agent 写查询前会先查看这些定义。
    - title: 分享前仅你可见
      body: 新建的仪表板只属于你。准备好后，再分享给联合创始人或全公司，可以设为查看或编辑。
    - title: KPI 发到邮箱
      body: 数字主动找上你：每天早上在你选定的时间，把仪表板通过邮件发给最多五个人。
