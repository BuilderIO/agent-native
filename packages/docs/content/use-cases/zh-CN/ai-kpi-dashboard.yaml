title: 为你的创业公司搭建 KPI 仪表板
seo_title: 面向创业公司创始人的 AI KPI 仪表板
meta_description: 描述你跟踪的指标，Agent-Native Analytics 就会用 Stripe、HubSpot 和产品数据搭建创业公司的 KPI 仪表板，并告诉你哪些数字变了。
updated: 2026-10-27
hero:
  body: Agent-Native Analytics 用 Stripe、HubSpot 和产品数据，把 MRR、流失率和注册数放进同一个仪表板。描述你跟踪的指标，agent 就会搭好它，并解释任何数字为什么变化。
  button:
    label: 搭建你的仪表板
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb23d4e197c9841e7b0eeaefc15090443
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F260764ee953f4b4f80f6a6cf631b2143
