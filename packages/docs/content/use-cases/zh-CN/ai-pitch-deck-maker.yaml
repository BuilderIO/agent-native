faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Slides 免费吗？
      a: 是的，Agent-Native Slides 免费且开源。制作 PPT 需要连接 AI，可以通过 Builder.io 或你自己的 AI 密钥；生成图片需要你自己的 Gemini 或 OpenAI 密钥。Slides 目前处于 alpha 阶段，后续还会有变化。
    - q: 我能把路演 PPT 导出为 PowerPoint 或 Google Slides 吗？
      a: Slides 可导出可编辑的 PowerPoint（PPTX）文件。对于 Google Slides，它会给你一个 PPTX 文件和导入链接，由你自己在 Google Slides 中打开。你也可以把 PPT 导出为单个 HTML 文件。
    - q: Slides 能从我的笔记、文档或官网开始吗？
      a: 在 Slides 首页描述你的路演内容，附上笔记或文档，或者添加官网链接。你也可以导入 Google Doc、Word 文件或 PowerPoint。如果 agent 读不了某个 PDF 或网站，它会直接告诉你，而不是凭空猜测。
    - q: Slides 和让聊天机器人帮我写幻灯片有什么不同？
      a: 聊天机器人给你的是文字，你还得自己复制到幻灯片里。在 Slides 中，agent 会在你看得到的编辑器里做出真正的 PPT。任何一页你都可以手动修改或让 agent 改，改的是同一份 PPT，而且每次修改都可以撤销。这正是 Slides 成为[智能体应用](https://www.agent-native.com/articles/what-is-an-agent-native-app/)的原因：既有 agent 的智能，又有应用的直观易用。
    - q: 联合创始人能和我一起编辑路演 PPT 吗？
      a: 你、你的联合创始人和 agent 可以同时编辑同一份 PPT。你可以对整页或页面中的某一部分发表评论。每次重要修改前 Slides 都会保存一个版本，你随时可以恢复到之前的版本。
    - q: 一份路演 PPT 应该有多少页？
      a: 首次路演大约十页比较合适（[路演 PPT 应该包含什么](https://www.agent-native.com/articles/how-to-make-a-pitch-deck-with-ai/)），Slides 也会推荐“根据这份文档制作 10 页推介幻灯片”。如果你想要其他页数，告诉 agent 即可，它会按页数规划大纲。
