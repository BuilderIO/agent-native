features:
  heading: 制作和演示路演 PPT 所需的一切
  items:
    - title: 用笔记生成路演 PPT
      body: 从一句提示、你的笔记、一份文档或上一版 PPT 开始。告诉 agent 你的公司和这轮融资的情况，它就会做出 PPT。
    - title: AI 编辑与可视化编辑
      body: 直接在页面上修改文字和排版，或者选中一行让 agent 来改。只有你指定的内容会变。
    - title: 每一页都是你的品牌
      body: 把你的配色、字体和 logo 保存为设计系统，之后做的每份 PPT 都有你公司的风格。
    - title: 图片与 logo
      body: 让 agent 生成图片、查找图库照片，或为你的业务进展页加入客户和合作伙伴的 logo。
    - title: 与联合创始人协作
      body: 和联合创始人、agent 一起编辑同一份 PPT，可在任意页面评论，并恢复任一历史版本。
    - title: 演示、分享和导出
      body: 带演讲者备注进行演示，给投资人分享只读链接，或导出可编辑的 PowerPoint 文件。
