how_to:
  heading: 如何为编码 agent 写规格文档
  steps:
    - title: 和 agent 一起写规格文档
      body: 点击侧边栏中的 **+**，选择 **页面** 并粘贴你的笔记，或者让 [Content 内置的 agent](https://www.agent-native.com/docs/template-content/) 根据笔记“为新功能起草一份 PRD”。你可以手动编辑，也可以选中某个部分让它重写。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2f4dd334ddfa4ec5bd74e67315414e8b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F15247dff32574395a608e454b510e22b
        alt: agent 聊天中请求根据会议笔记写一份团队邀请功能的规格文档。agent 的回复列出了它写好的各个部分，旁边是新页面。
    - title: 在编码 agent 中打开
      body: 在 **分享** 中打开 **Agent**，选择 **在 Claude Code 中打开** 或 **在 Codex 中打开**。agent 会读取页面，或者先请你连接 Content。如果用 Cursor 或 VS Code，先添加 Content，再点击 **复制 agent 提示词** 并粘贴。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa052d84a44fb4e6ead8b69535f25c726
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fc574e414836749119ad937c14623d14e
        alt: Share 菜单中 Agents 标签页的特写：Copy agent prompt、Open in Claude、Open in Claude Code 和 Open in Codex。下方的 Connect Content 提供 Add to Cursor、Add to VS Code 和 Other agents。
    - title: 让规格文档保持最新
      body: 构建过程中某个待定问题有了结论时，让编码 agent 在页面上提出修改建议。每条建议都会写明 agent 的理由。点击对勾接受，点击 X 拒绝。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F156092664ebc424bb86899f876b88a97
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0c0108d3427d4641b5c3a2b266e8c4aa
        alt: 规格文档 Open questions 部分的特写，其中有一条来自编码 agent 的修改建议，标为 Agent，附有理由以及接受（对勾）和拒绝（X）按钮。
features:
  heading: 为编码 agent 写规格文档所需的一切
  items:
    - title: 以评论形式给反馈
      body: 让 agent 审阅你的规格文档，它会在薄弱的地方留下评论，而不是重写你的文字。
    - title: 每个功能一个页面
      body: 把调研、API 笔记和过往决定都嵌套在对应的规格文档下，按标题和正文搜索就能找到。
    - title: 规格文档看板
      body: 把规格文档放进带负责人和状态字段的集合，以表格或看板查看，每一行背后都是完整页面。
    - title: 写给 agent 的说明
      body: 在页面描述里写明哪些部分已经定了，读取这份规格文档的每个 agent 也都会读到。
    - title: 读取未保存的编辑
      body: 编码 agent 能看到编辑器里尚未保存的修改，所以它始终基于页面此刻的样子工作。
    - title: 和团队一起审阅
      body: 对任意段落发表评论，@提及同事并在评论串中回复。版本历史可以恢复早先的规格文档。
