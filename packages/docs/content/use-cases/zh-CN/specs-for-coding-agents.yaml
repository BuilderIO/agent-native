title: 写出编码 agent 读得懂的规格文档
seo_title: 写给 Claude Code、Codex 和 Cursor 的规格文档
meta_description: Agent-Native Content 把规格文档放在同一个页面上，Claude Code、Codex 或 Cursor 通过 MCP 读取，让 agent 按团队正在编辑的版本来构建。
updated: 2026-10-27
hero:
  body: Agent-Native Content 把你的笔记变成规格文档，你、团队和编码 agent 都在同一个页面上协作。Claude Code、Codex 或 Cursor 读取实时页面，并提出由你来接受的修改建议。
  button:
    label: 写一份规格文档
    url: https://content.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd7f1bf8fa6054abcafa30bd60751ae40
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F93c61e2bc6ba476a938b13934f237b0c
