faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Content 免费吗？
      a: 是的，Agent-Native Content 免费且开源。编码 agent 用它自己的模型读取和编辑规格文档，所以会计入 agent 的用量。Content 内置的 agent 使用 Builder.io 额度或你自己的模型密钥运行。Content 目前处于 alpha 阶段，后续还会有变化。
    - q: 哪些编码 agent 能读取我的规格文档？
      a: Claude Code 和 Codex 可以从 **分享** 中打开页面，只需连接一次。Cursor 和 VS Code 中的 GitHub Copilot 可以一键添加 Content。Claude Cowork、Goose 和 OpenCode 从终端连接，任何支持登录的 MCP 客户端都可以[通过 URL 连接 Content](https://www.agent-native.com/docs/external-agents/#private-content-links)。每个 agent 只能看到你的账号能看到的内容。
    - q: 这和代码仓库里的规格文件有什么不同？
      a: 仓库里的规格文件是一份副本，通常只有写代码的人会去编辑。在 Content 中，团队在编码 agent 读取的同一个页面上撰写和评论，agent 的修改以建议的形式出现。如果你也想在仓库里保留 Markdown，Content 可以[与本地文件夹同步](https://www.agent-native.com/docs/template-content-sync/)。
    - q: 编码 agent 能修改规格文档吗？
      a: 可以，权限与你的账号一致。让它提出修改建议，在你逐条接受之前，页面保持不变。它也可以直接编辑页面，但如果页面在 agent 读取后又被改过，Content 会拒绝这次编辑。[版本历史](https://www.agent-native.com/docs/template-content-editing/)会保留早先的版本。
    - q: 我可以把规格文档保存在自己的仓库里吗？
      a: 可以。在 Content 中连接一个[本地 Markdown 或 MDX 文件夹](https://www.agent-native.com/docs/template-content-local-files/)，然后拉取、检查或推送修改，也可以用一条命令从仓库启动 Content。冲突会列出来供你审阅。浏览器本身无法读取本地文件，所以这需要本地 Content 应用或 Agent-Native Desktop。
