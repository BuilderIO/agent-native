title: 找出新用户在哪一步流失
seo_title: 结合会话回放的 AI 漏斗分析
meta_description: 用日常语言问 Agent-Native Analytics 哪一步注册流程流失的新用户最多，基于你自己的事件得到漏斗，再观看离开者的会话回放。
updated: 2026-10-27
hero:
  body: 问 Agent-Native Analytics 哪一步注册流程流失的人最多，agent 会用你自己的事件搭出漏斗。然后观看离开者的会话回放，再问 agent 原因。
  button:
    label: 找出流失环节
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F55295bda356c490984f639946e838ebe
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd84d0fd7f856406e85b739ac0429b0f3
    alt: Analytics 窗口中的 Activation funnel 仪表板。漏斗有四步：Signed up、Created a project、Connected a data source 和 Invited a teammate。每一步都显示人数、占注册用户的比例以及相对上一步的流失，最大的流失出现在 Created a project。旁边的 agent 聊天解释了上周注册的用户停在了哪里。
how_to:
  heading: 如何用 AI 做漏斗分析
  steps:
    - title: 问新用户停在了哪一步
      body: 先把注册事件导入 Analytics。在 **提问** 中发问，agent 会写 SQL 并添加一个[漏斗面板](https://www.agent-native.com/docs/template-analytics-dashboards/)，显示每一步的人数和流失。试试：“在我的 Activation funnel 仪表板里加一个漏斗：上周注册的用户停在了哪一步？”
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa752431cecb8420c88d3d6a8f7980ea9
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F16ab210c27504ed1b71c37ebdabea744
        alt: agent 聊天中是这个请求和 agent 的回复，旁边是它添加的漏斗。各步骤为 Signed up 1,240、Created a project 612、Connected a data source 418 和 Invited a teammate 302，每一步都标有流失。
    - title: 找到中途停下的人
      body: 在 Analytics 设置中打开会话筛选。在 **会话** 页面打开 **事件**。为流失前的那一步选择 **包含**，比如“signed_up”；为他们没走到的那一步选择 **不包含**，比如“project_created”。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F327bf36c28ab452da87cf4f4dc65debe
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F49b79e0de78041bb93444ec4d24ce11a
        alt: 会话页面的特写，Events 筛选已展开，signed_up 设为 Did，project_created 设为 Didn't。下方是筛选后的新用户会话列表，每条都显示时长、页面和愤怒点击次数。
    - title: 问问某次会话发生了什么
      body: 打开一段回放，查看页面、点击和网络请求。点击 **询问 agent**，问“这次会话发生了什么？”agent 会总结报错、重复点击以及这个人看过的页面。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7e0b3a4750a143f6bcd609e1c5460fd2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe44e9321e80d4c3f826bd7b25fa54025
        alt: 一位新用户在创建项目页面上的回放，旁边是 agent 的回答。这个人输入了项目名称，点了三次 Create project。每次对 projects API 的请求都失败了，随后他离开了。
features:
  heading: 找到并解决流失所需的一切
  items:
    - title: 跳过不等于流失
      body: 告诉 agent 哪些步骤可以跳过，漏斗就会把跳过的人和在那一步离开应用的人分开显示。
    - title: 用你自己的事件名称
      body: 管理员在 **语义层** 页面描述你们的事件和指标，agent 在每次查询中都使用这些准确的名称。
    - title: 看到失败的请求
      body: 在回放上打开 **开发工具**，查看控制台和网络请求，直接跳到请求失败的那一刻。
    - title: 给 agent 的脱敏回放
      body: 外部 agent 拿到的是回放的控制台和网络记录，报错排在最前，绝不会拿到录像本身。链接两小时后失效。
    - title: 默认保护隐私
      body: 每段回放中的输入内容都会被遮盖，页面上其他哪些部分需要隐藏由你决定。
    - title: 每天收到漏斗
      body: 让 agent 每天在你选定的时间，把漏斗仪表板通过邮件发给最多五个人，或发到 Slack。
