faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Analytics 免费吗？
      a: 是的，Agent-Native Analytics 免费且开源。你可以使用托管版应用，也可以[自己部署一份](https://www.agent-native.com/docs/template-analytics/)。数据由你提供：你自己的事件，或你连接的工具。Analytics 目前处于 alpha 阶段，后续还会有变化。
    - q: 我需要懂 SQL 吗？
      a: 不需要。用日常语言提问，agent 会编写并运行 SQL，然后用图表、表格或数字回答。想核对时，可以让它展示查询。可能需要一位熟悉你们数据的人先[连接数据源](https://www.agent-native.com/docs/template-analytics-connectors/)。
    - q: 会话回放从哪里来？
      a: 来自你自己的 Web 应用。在 **数据源** 中创建一个公钥，然后把 **会话** 页面上的简短跟踪代码添加到你的应用里，并开启会话回放。为录像连接存储：Builder.io 或你自己的 S3 存储桶。默认情况下，[回放](https://www.agent-native.com/docs/template-analytics-monitoring-and-sessions/)只录制已登录的用户。
    - q: 会话回放会记录什么？
      a: 回放会重现页面、点击和滚动、控制台输出以及网络请求。输入内容默认会被遮盖，标记为密码或银行卡信息的字段永远不会被采集。如需隐藏其他内容，给页面的那部分加一个 class 即可。
    - q: 能用我在 PostHog、Amplitude 或 Mixpanel 里的数据吗？
      a: 可以。在 **数据源** 中连接它们，然后询问你在那里跟踪的事件，agent 会替你查询每个工具。会话回放只来自 Analytics 自己的跟踪代码，所以要观看中途停下的人，需要把它添加到你的应用里。
    - q: Analytics 和我的分析工具里自带的 AI 有什么不同？
      a: 分析工具里的 AI 只处理那个工具的数据。Analytics 的 agent 能跨你连接的所有数据源工作，找到那些中途停下的具体用户的回放，解释其中任何一段，或把它交给你的编码 agent。它还是开源的。这就是[智能体应用](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：既有 agent 的智能，又有应用的直观易用。
