faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Plan 免费吗？
      a: 是的，Agent-Native Plan 免费且开源。每份计划都作为编码 agent 的一次会话运行，使用你选择的模型。这会消耗 agent 的 token，计划越大，消耗越多。Plan 目前处于 alpha 阶段，后续还会有变化。
    - q: Plan 支持哪些编码 agent？
      a: Claude Code 和 Codex 可以通过插件安装。一条安装命令还能在 Cursor、OpenCode、VS Code 中的 GitHub Copilot 和 Claude Cowork 里装好 Plan。Cline、Goose 等其他 MCP 宿主可以通过 URL 添加 Plan 的连接器。每份计划都在浏览器里审阅。
    - q: Plan 和编码 agent 自带的计划模式有什么不同？
      a: Claude Code、Codex、Cursor 或 OpenCode 的计划模式会在聊天里以文字形式给出计划。Plan 则把这份计划，或者 Markdown 文件里的计划，变成一个包含图表、文件树和带注释代码的页面。你可以在页面上针对具体部分评论、回答 agent 的问题，并拉同事一起看。
    - q: agent 在规划时会改我的代码吗？
      a: 不会。在撰写或修改计划期间，Plan 的指令让 agent 只读你的代码。你批准计划后它才开始修改，并且在每个重要步骤之前都会重新阅读已批准的计划。
    - q: 同事没有账号也能审阅计划吗？
      a: 部分可以。拿到链接的任何人都能以访客身份打开和编辑计划。评论、保存和分享需要 Agent-Native 账号，所以想评论的同事要先登录。
    - q: 计划能只保存在我自己的电脑上吗？
      a: 可以。[本地文件模式](https://www.agent-native.com/docs/template-plan-local-and-desktop/)会把计划以 MDX 文件保存在你的电脑上，内容不会进入托管应用。代价是本地计划无法分享，也不能在浏览器里评论，它的链接只能在你的电脑上打开。本地文件模式不会改变编码 agent 的 AI 模型在哪里运行。
