how_to:
  heading: 如何搭配编码 agent 使用可视化计划模式
  steps:
    - title: 请 agent 出一份可视化计划
      body: 用[一条安装命令](https://www.agent-native.com/docs/plan-plugin/)把 Plan 添加到 Claude Code、Codex 或 Cursor。然后输入 `/visual-plan` 和任务内容。agent 会读取你的代码，并发回计划的链接。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F15e26ab97a68472a958aabf9657fdeb2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F01168fa31ed5412080d49febc37f1068
        alt: 编码 agent 的聊天界面，用户输入了 /visual-plan 和添加团队邀请功能的任务。agent 列出它读过的文件，发布计划并回复链接。
    - title: 评论需要修改的地方
      body: 选中一句话或图表上的某个位置，写下需要怎么改。把[评论设为](https://www.agent-native.com/docs/template-plan-review-workflow/) **Agent** 交给 agent 修改，或设为 **人工** 交给同事。计划里待解决的问题也一并回答。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8a16bd566384f4080dde591a1b30c3f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F598a137b56d149f98409ed79c024cb2b
        alt: 计划图表中邀请邮件这一步上新建评论的特写，Agent 和 Human 开关设为 Agent，评论内容已经输入。
    - title: 把评论发给 agent
      body: 点击 **发送给 agent**，选择 **复制给你的 agent**，把评论复制成一段提示词。粘贴到 agent 的聊天里，让它更新计划。计划没问题后，在那里批准，agent 就开始构建。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0f841d0983ec4e3386d13c4c4ad7895d
