title: 在编码 agent 写代码前审阅它的计划
seo_title: Claude Code、Codex 和 Cursor 的可视化计划模式
meta_description: Agent-Native Plan 把编码 agent 的计划变成一个可审阅的页面，包含图表、文件树和带注释的代码，让你在它写任何代码之前先过目。
updated: 2026-10-27
hero:
  body: Agent-Native Plan 把 agent 写的计划变成一个页面，里面有图表、文件树和带注释的代码。你可以评论任何部分，agent 会据此修改计划，在你批准之前不改一行代码。
  button:
    label: 规划你的构建
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faad0afc668dc461f9023eeba3ba55800
