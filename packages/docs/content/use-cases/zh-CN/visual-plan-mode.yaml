        alt: 计划中 Send to agent 按钮的特写，菜单已展开：Copy for your agent 和 Send to inline agent，各带一行说明。
features:
  heading: 审阅 agent 计划所需的一切
  items:
    - title: 用图表呈现方案
      body: 请求流程、数据模型和 API 端点都会画出来，错误的端点或缺失的表在构建前就一目了然。
    - title: 看清哪些文件会改
      body: 文件树和带注释的代码会标明改动落在哪里，以及每一步复用了代码库里的什么。
    - title: 带默认答案的问题
      body: agent 无法从代码中确定的决定，会集中放在末尾的一张表单里，每一项都附上它推荐的答案。
    - title: 从计划模式接着来
      body: 已经有来自 Claude Code、Codex 或 Markdown 文件的计划？`/visual-plan` 会直接用它生成页面，不必从头再来。
    - title: 批准前不写代码
      body: Plan 的指令让 agent 在规划阶段只读代码。只有在你批准计划之后，它才开始修改。
    - title: 和同事一起审阅
      body: 把计划链接发给同事。对方可以以访客身份阅读和编辑，登录 Agent-Native 账号后即可评论。
