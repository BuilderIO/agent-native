faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Plan 免费吗？
      a: 是的，Agent-Native Plan 免费且开源。每次可视化回顾都会用你选择的模型运行一次完整的 agent 会话，改动越大，消耗的模型用量越多。Plan 目前处于 alpha 阶段，后续还会有变化。
    - q: 哪些改动值得做一次可视化回顾？
      a: 较大的改动值得做可视化回顾：跨多个文件，或涉及数据 schema、API、应用整体结构的改动。如果只是单个文件的小改动，直接看 diff 比等回顾更快。
    - q: 可视化回顾和直接看 diff 有什么不同？
      a: diff 逐个文件列出每一行改动。可视化回顾先讲清这次改动做了什么：以线框图展示改动的界面、改了哪些数据字段，以及涉及文件的地图。然后只展示值得细看的 diff，并附上注释。
    - q: Plan 支持哪些编码 agent？
      a: 安装命令会在 Claude Code、Codex、Cursor、OpenCode、VS Code 中的 GitHub Copilot 和 Claude Cowork 里装好 Plan，并帮你完成登录。通过托管连接器，Plan 也能在 Cline、Goose 以及任何能连接 MCP 服务器的 agent 中使用。
    - q: 能为每个 pull request 生成回顾吗？
      a: 可以。[PR Visual Recap GitHub Action](https://www.agent-native.com/docs/pr-visual-recap/) 会在每次推送时，用你自己的 API 密钥运行 Claude Code、Codex 或任何兼容 OpenAI 的模型。它会在 pull request 上保持一条持续更新的评论，附上回顾截图，并且从不阻止合并。超过约 600 KB 的 diff 会被截断。
    - q: 谁能看到我的回顾？
      a: 默认情况下，只有登录到你所在组织的人能打开回顾；设为私密后只有你自己能看。使用 GitHub Action 时，能看到 pull request 的人都能看到回顾截图。[本地文件模式](https://www.agent-native.com/docs/template-plan-local-and-desktop/)可以让回顾不进入托管应用，不过 agent 的模型仍在原来的地方运行。
