how_to:
  heading: 如何可视化回顾 agent 的改动
  steps:
    - title: 让 agent 生成回顾
      body: 用[一行安装命令](https://www.agent-native.com/docs/template-plan/#install)把 Plan 添加到编码 agent。在 agent 完成改动的那个聊天里运行 `/visual-recap`，打开它返回的链接。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F060c82d850f34b3096f166c04ead386c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F287f076a9ec84124a0afc7fbaeda2ece
        alt: 编码 agent 的聊天界面，已发送“/visual-recap of everything you changed in this thread”，agent 的回复里附有已发布回顾的链接。
    - title: 先看图，再看改动
      body: 先看前后对比线框图、标注出的数据改动和改动文件地图。然后打开 **Key changes**，每个重要文件都有自己的标签页，带并排 diff 和注释。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff15296c5ef824f5ead19d6e64de1388f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faf5572fc8bbd4962972bfc0b24cf2bc0
        alt: 成员页面的前后对比线框图，改动后多了一个 Invite 按钮和一条待接受的邀请。旁边的数据模型把新的 invites 表标为新增，把 members 的 role 字段标为修改，从文本改为固定的角色列表。
    - title: 把评论发给 agent
      body: 在任意文字或线框图的某个位置留下[审阅评论](https://www.agent-native.com/docs/template-plan-review-workflow/)。点击 **发送给 agent**，选择 **复制给你的 agent**，把提示词粘贴到编码 agent 里，它会完成修改并解决你的评论。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2256a69fdcd542a18a14a292050ff391
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2b4a48126c4f45c39c0b6f0389673387
        alt: 一条写给 agent 的评论固定在改动后线框图的 Invite 按钮上，要求只对管理员显示。Send to agent 菜单已展开，包含 Copy for your agent 和 Send to inline agent。
features:
  heading: 可视化回顾所需的一切
  items:
    - title: 先看界面，再看代码
      body: 改动涉及 UI 时，回顾会先展示前后对比线框图，让你先看到用户会看到的样子。
    - title: 数据改动一目了然
      body: Schema 和 API 的改动会把每个字段标为新增、修改、删除或重命名，并把旧类型和新类型并排列出。
    - title: 每个改动文件都有标注
      body: 文件树列出这次改动涉及的每个文件，标明新增、修改、删除或重命名，并附上改了什么的说明。
    - title: 带注释的关键 diff
      body: 三到八个关键文件会得到并排 diff，每个都有一行摘要，并对值得留意的代码行加上注释。
    - title: 覆盖整个对话
      body: 工作完成后在聊天里运行 `/visual-recap`，回顾会涵盖 agent 在这里做的所有事，从第一处改动到最后的修复。
    - title: 和团队一起审阅
      body: 分享回顾链接：访客无需账号即可打开，登录后即可评论。也可以导出为 HTML、Markdown 或 JSON 留存一份。
