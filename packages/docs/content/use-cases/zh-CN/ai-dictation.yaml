how_to:
  heading: 如何使用 AI 听写
  steps:
    - title: 在任何应用里听写
      body: 安装 Clips Desktop，点进 Claude Code、Linear 或 Slack，说话时按住你的快捷键（默认是 Fn，也可以在设置中自选）。松开后，Clips 会把你说的话放到光标处。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F493f3728ed1246bb841a651e3aa76300
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb3785ba8ec804690836d94e31ff92e17
        alt: "编码 agent 的对话：一段关于 webhook 重试的听写提示词已发送，agent 完成了修改。光标停在消息框里，下方的 Clips 胶囊正在聆听下一段提示词，绿色波形升起。"
    - title: 教 Clips 你的用词
      body: 在听写页面打开词典，添加你的产品、库和同事的名字，或者用“词条 → 替换词”处理 Clips 总是听错的词。导入 CSV 文件可以一次添加整个列表。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F855c88996488417e8dc3a532a0fd21a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff4e9c0557a1344f6a55e7e9c4356a5ab
        alt: "Clips 的词典面板，有添加词条、导入和导出 CSV。下方是 Agent-Native、“web hooks → webhooks”和“kube control → kubectl”等词条。"
    - title: 找回过去的听写
      body: 在 Clips 中按 Cmd+K，输入你说过的一个词，匹配的听写就会连同你当时使用的应用一起显示出来。选中一条，即可在听写页面打开它。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5e344071b49f4e51ae5eef2708c46605
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F13f558e09094404f975350ad0c359acc
        alt: 'Clips 搜索菜单，输入了“webhook”，在听写下列出两条过去的听写：一段对 Cursor 说的提示词，和一条对 Slack 说的消息。'
features:
  heading: 用说代替打字所需的一切
  items:
    - title: 你的剪贴板原样保留
      body: Clips 粘贴到应用后会把你的剪贴板内容还原，所以你复制的链接还在。在终端里，它则改为直接键入。
    - title: 可撤销的 AI 清理
      body: "Clips 会修正听错的词、逗号和大小写，并去掉说错重来的部分：用云端引擎自动完成，也可以一键完成。原文会保留。"
    - title: 从你的修改中学习
      body: Clips 粘贴后，马上改掉听错的词，桌面应用就会把这个修改加入词典，下次听写就能听对。
    - title: 长提示词免手持
      body: 连按两下快捷键，就能持续聆听，让你边想边说；再按一下即可停止。按 Esc 可以丢弃这次听写。
    - title: 再粘贴一次
      body: 按 Cmd+Ctrl+V，可以把上一次听写再粘贴到另一个文本框里，光标放错位置时很方便。
    - title: 向 agent 问问听写内容
      body: 问“我说过关于第三季度预算的什么？”或者“把这段絮叨整理成要点”，agent 会根据你的历史记录来处理。
