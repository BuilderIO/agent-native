title: AI 听写
seo_title: 适用于编码 agent、Slack 和文档的 AI 听写
meta_description: 向 Claude Code、Slack 或文档说出长提示词，不用再打字。Agent-Native Clips 是免费、开源的 AI 听写工具，会保存每一次听写。
updated: 2026-10-26
hero:
  body: 把整段提示词说出来，不用打字，文字就落在光标处，从 Claude Code 到 Slack 都行。Agent-Native Clips 会保存每一次听写，需要时，它的 agent 还能帮你改写。
  button:
    label: 开始听写
    url: https://clips.agent-native.com
  image:
