faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Clips 免费吗？
      a: 是的。Agent-Native Clips 免费且开源，桌面应用默认开启语音听写。AI 清理使用 Builder.io AI 额度或你自己的密钥运行，所以并非无限使用。Clips 目前处于 alpha 阶段，随着它成长还会有变化。
    - q: Clips 和我电脑自带的听写有什么不同？
      a: 自带的听写无需设置，但不会保留[可搜索的说话历史](https://www.agent-native.com/articles/what-should-you-look-for-in-dictation-software/)。Clips 会保存每一次听写的原文和已清理的文字，学习你的用词，并用 AI 整理文字。Clips agent 能找到你说过的内容并改写，比如把一段絮叨整理成要点。
    - q: Clips 能把我们团队的行话拼对吗？
      a: 能，只要这些词条已在你的词典里。每行添加一个，或者用“词条 → 替换词”处理总是听错的词。你也可以导入词条的 CSV 文件。Clips 粘贴后，你马上改掉某个词，桌面应用会把这个修改存进词典，供下次使用。
    - q: 我的听写会被保存吗？能找到以前的吗？
      a: 每一次听写都会连同原文和已清理的文字、时间与时长一起保存，并按天分组显示在听写页面。按 Cmd+K 可以按你说过的话搜索，也可以问 [Clips agent](https://www.agent-native.com/docs/template-clips-agent/)，比如“给我看看我昨天听写了什么”。任何一条听写你都可以删除。
    - q: 我的声音会离开我的电脑吗？
      a: 不一定。Clips Desktop 可以在你的设备上转录，使用内置语音识别或 Local Whisper（[Clips 中的转录引擎](https://www.agent-native.com/docs/template-clips-features/)）。如果使用 Builder.io 或你自己的密钥，Clips 会把你的听写发送给那个 AI 服务做清理。每次听写的文字都会保存到你的 Clips 账号。
