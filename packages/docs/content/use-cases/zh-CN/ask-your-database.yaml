faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Analytics 免费吗？
      a: 是的，Agent-Native Analytics 免费且开源。你可以使用托管版应用，也可以自己运行一份。agent 需要通过 Builder.io 或你自己的模型密钥连接 AI，所以 AI 用量不是无限的。Analytics 目前处于 alpha 阶段，可能还会有变化。
    - q: 我需要懂 SQL 吗？
      a: 不需要。你用日常语言提问，agent 编写 SQL。可能需要熟悉数据的人先[连接 BigQuery](https://www.agent-native.com/docs/template-analytics-connectors/)。管理员可以在 **语义层** 页面添加你们的[指标定义](https://www.agent-native.com/docs/template-analytics-dashboards/)，让 agent 选对表和列。
    - q: 支持 Postgres、Supabase 或 Neon 吗？
      a: 支持 Supabase 或 Neon 上的 Postgres。从聊天的 + 菜单[通过 MCP](https://www.agent-native.com/docs/mcp-clients/) 连接它，然后在聊天中提问。这些答案只留在聊天里，因为仪表板面板还不能查询 Postgres。其他 Postgres 数据库暂时还不能查询，所以本页的步骤使用 BigQuery。
    - q: agent 会修改我的数据吗？
      a: 在 BigQuery 中不会。Analytics 会拒绝 agent 在那里插入、更新、删除或清除数据的任何查询。设置时还要求使用只读角色的服务账号，它能读取表和运行查询，但不能修改它们。通过 Supabase 或 Neon，agent 能做的就是你允许该连接做的事。
    - q: 我怎么知道答案是对的？
      a: 查看它背后的查询。让 agent 展示它的 SQL，或在仪表板图表上打开 **查看 SQL**。你也可以问它用了哪些表和筛选条件。如果没有运行实时查询，agent 会把数字标为 **Unverified**。
    - q: 这和把 CSV 导出后问 ChatGPT 有什么不同？
      a: 聊天助手根据你导出的文件回答，所以每个新问题都要重新导出。Analytics 直接查询你的数据仓库，使用团队的指标定义，并把你还会用到的答案保留在仪表板上。这就是[智能体应用](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：既有 agent 的智能，又有应用的直观易用。
