title: 用日常语言向你的数据提问
seo_title: 不写 SQL，直接向数据库提问
meta_description: 就你的 BigQuery 数据提个问题，Agent-Native Analytics 会用可检查的只读 SQL 回答，并把反复问到的问题保留在仪表板上。
updated: 2026-10-27
hero:
  body: Agent-Native Analytics 根据你的 BigQuery 数据回答，并把你反复问的问题保留在仪表板上。agent 编写的是你可以检查的只读 SQL。
  button:
    label: 向你的数据提问
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd1120abfcd1447b9ab48ff98a9b7592d
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2db877a772674ad4af41e7efbb062d50
    alt: 打开“提问”页面的 Analytics。agent 用按套餐划分的柱状图和计数所依据的表格，回答了关于上周注册数的问题。下方的追问显示 Pro 套餐增长最多。
how_to:
  heading: 如何用日常语言向数据库提问
  steps:
    - title: 连接你的数据仓库
      body: 在 **数据源** 页面打开 BigQuery。上传一个具有 BigQuery Data Viewer 和 BigQuery Job User 角色的服务账号 JSON 密钥，输入你的项目 ID，然后点击 **保存凭证** 和 **测试连接**。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F62008ebd98594f02b1c0bf3ae565ef49
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb01d428bca15467eb4c04299dd9575b8
        alt: 数据源页面上 BigQuery 卡片的特写，标为 Connected，项目 ID 和服务账号标为 Configured，并显示“Connection successful”。
    - title: 用日常语言提出你的问题
      body: 在 **提问** 中，像问同事一样输入问题：“上周各套餐分别有多少账号注册？”agent 会找到合适的表，运行查询，并用图表回答。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3e9ac5b30a924dab9b09bc76ed24b2de
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F31c48c5ccc9247b792c00474b01f97b0
        alt: “提问”聊天的特写。agent 搜索了 BigQuery 架构，运行了一次查询，并用 723 个注册和按套餐划分的柱状图作答。
    - title: 把答案保留在仪表板上
      body: 让 agent“把这个加到仪表板”。它会搭建面板，检查 SQL 能否运行，然后保存仪表板。在你分享给同事或整个组织之前，仪表板仅你可见。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F957858f8613241a2b2249d88430b3cc4
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd0111e9f420149fc8a35cad845ad8e2e
        alt: 一个新的“每周注册”仪表板，包含按套餐的注册面板和按周的注册图表。旁边的 agent 聊天说两个面板都已对照 BigQuery 检查过。
features:
  heading: 从数据库获取答案所需的一切
  items:
    - title: 每个答案背后的 SQL
      body: 在任意仪表板图表上打开 **查看 SQL**，或在聊天中询问，就能看到 agent 编写的查询，并复制下来自己运行。
    - title: 团队的指标定义
      body: 管理员在 **语义层** 页面写明“活跃”或“注册”的含义。agent 编写 SQL 前会先读取这些定义。
    - title: 无法修改数据的查询
      body: 在 BigQuery 中，agent 的 SQL 无法插入、更新或删除数据，而且它通过只能读取表和运行查询的服务账号连接。
    - title: agent 帮你编辑的仪表板
      body: 在聊天中要求再加一个面板、一个筛选条件或按套餐拆分，agent 会为你分享过的所有人修改这个仪表板。
    - title: 跨工具提问
      body: 一个问题就能把数据仓库里的表与 Stripe 收入、HubSpot 商机或 PostHog 事件结合起来。
    - title: 仪表板发到收件箱
      body: 每天在你选定的时间通过邮件接收仪表板，图表和表格直接显示在邮件中，最多可发给五个人。
