faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Analytics 免费吗？
      a: 是的，Agent-Native Analytics 免费且开源。agent 使用 Builder.io AI 额度或你自己的 AI 密钥运行，所以 AI 用量不是无限的。关于通话的问题还可能消耗你的 Gong API 额度，管理员可以关闭这项功能。Analytics 目前处于 alpha 阶段。
    - q: Agent-Native Analytics 能连接哪些 CRM 和通话工具？
      a: Analytics 可以连接 HubSpot 作为 CRM，连接 Gong 获取销售通话。Apollo 和 Clay 也能连接，用于联系人和公司数据。每个工具都[在数据源页面连接](https://www.agent-native.com/docs/template-analytics-connectors/)，使用各自的密钥，一个问题可以同时用到 HubSpot 和 Gong 的数据。
    - q: 我需要会写 SQL 吗？
      a: 不需要。你用日常语言提问，agent 会在 HubSpot 或 Gong 中找到数据，运行查询，并用一个数字、一张表格或一张图表来回答。把答案保存到仪表板时，agent 会设置好每个面板如何获取最新数据。
    - q: 这些数字可信吗？
      a: 可信，但要核对：agent 基于 HubSpot 和 Gong 的实时数据回答，某个数字如果不是来自实时查询，会被标为 Unverified。它会遵循你们团队在[语义层页面上的定义](https://www.agent-native.com/docs/template-analytics-dashboards/)。在依赖这些数字之前，先拿最初几个答案和 HubSpot 对照一下。
    - q: Agent-Native Analytics 和 HubSpot 或 Gong 自带的 AI 有什么不同？
      a: HubSpot 或 Gong 里的 AI 只内置在那一个工具中。Analytics 能同时用 HubSpot 和 Gong 的数据回答一个问题，还能读取 Stripe 和 BigQuery，并把答案保存成团队每周都会打开的仪表板。你照常使用 HubSpot 和 Gong，Analytics 从两边读取数据。
    - q: 谁能看到我的仪表板？
      a: 在你分享之前，只有你自己能看。你可以把仪表板分享给某位同事或整个组织，身份可以是查看者、编辑者或管理员。同事通过自己的连接，或管理员为组织设置的连接查看 HubSpot 和 Gong 数据；两者都没有的话，这些面板会显示错误。
