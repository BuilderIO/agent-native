how_to:
  heading: 如何用 AI 报告 bug
  steps:
    - title: 从 Chrome 开始录制
      body: "点击工具栏中的 Clips Chrome 扩展，选择录制来源：浏览器标签页、窗口或整个屏幕。打开或关闭摄像头和麦克风，然后点击 Start recording。"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6996593713c74108967e120111378c14
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff7991811f7a346e0a99cf9fe81496e34
        alt: 网页应用上方的 Clips 扩展弹窗特写，来源选的是 Browser tab，摄像头和麦克风已打开，下方是 Start recording 按钮。
    - title: 演示 bug 并说明情况
      body: 点开出问题的那几步，并说出你本来期望发生什么。录制期间，扩展会保存页面的报错和它发出的请求，这些细节本来需要工程师从 Chrome 开发者工具里去挖。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe01ffb73c62c427b8077f05657fdeb47
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff895d85667344971baec96eb0b2ec956
        alt: 网页应用结账页面上方的 Clips 录制控件和摄像头气泡，页面上出现“Something went wrong”的提示。
    - title: 分享一个链接
      body: 停止录制后，Clips 会替你复制录屏链接。把它粘贴到工单、聊天或你的编码 agent 里。分享菜单里的智能体标签页，还能直接在 Claude、Claude Code 或 Codex 中打开它。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F10933b64225545e1b5ecd666f5803832
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2894036362f7409d8a4961536719b399
        alt: Clips 分享菜单智能体标签页的特写，有“复制代理提示”按钮，以及“在 Claude 中打开”“在 Claude Code 中打开”和“在 Codex 中打开”按钮。
features:
  heading: 报告 bug 所需的一切
  items:
    - title: 为你的编码 agent 而做
      body: 把链接粘贴到 Claude Code、Cursor 或 Codex。agent 会读取转录、画面帧和日志，无需下载视频。
    - title: 控制台和网络日志
      body: Clips 最多保存五个标签页的控制台消息、报错和请求，包括每个请求的状态、耗时以及是否失败。
    - title: 按下录制前的 30 秒
      body: Clips 能回溯到你按下录制之前最多 30 秒，所以页面加载期间出现的报错也能进入报告。
    - title: 敏感信息不外泄
      body: Clips 从不保存请求体、请求头、Cookie 或你键入的内容，并会隐藏看起来像令牌或密码的值。
    - title: 直接跳到报错处
      body: 在录屏的调试标签页里，点击报错或失败请求旁边的时间，视频就会跳到那一刻。
    - title: 搜索每一份 bug 报告
      body: 按其中说过的话找到任意一份 bug 报告，或者让 Clips agent 在你资料库里的所有录屏中查找。
