faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Clips 免费吗？
      a: 是的。Agent-Native Clips 免费且开源，包括 Chrome 扩展。标题、摘要和转录整理默认使用 Builder.io AI 额度运行，所以 AI 的使用并非无限，录屏也需要一个存放视频的地方。Clips 目前处于 alpha 阶段，随着它成长还会有变化。
    - q: Clips 会从我的浏览器采集什么？
      a: Clips Chrome 扩展会采集最多五个标签页的[控制台消息、JavaScript 报错和网络请求](https://www.agent-native.com/docs/template-clips-features/#chrome-extension-browser-logs)，并回溯到你按下录制之前最多 30 秒。每个请求都会保留其地址、状态、耗时以及是否失败。编辑者可以在录屏的调试标签页里看到全部内容，agent 则通过链接获取。
    - q: Clips 会录下密码或私人数据吗？
      a: Clips 从不保存请求或响应体、请求头、Cookie 或你键入的文字，并会隐藏看起来像令牌、密码或密钥的值。你可以在扩展的设置中关闭开发者日志。新的录屏默认通过链接公开，如果 bug 报告里出现内部数据，请把它设为私有或仅限你的组织。
    - q: 怎么把 bug 录屏交给 Claude Code、Cursor 或 Codex？
      a: 把录屏链接粘贴到 Claude Code、Cursor 或 Codex，agent 就会[读取转录、画面帧和浏览器日志](https://www.agent-native.com/docs/template-clips-integrations/#agent-readable-clips)，无需下载视频。对于私有录屏，请在分享菜单的智能体标签页点击“复制代理提示”，它会给 agent 一个两小时内有效的链接。这个标签页也能在 Claude Code 或 Codex 中打开该录屏。
    - q: Clips 能采集其他浏览器或桌面应用中的日志吗？
      a: 不能。控制台和网络日志只来自 Clips Chrome 扩展。Clips Desktop 和网页应用仍然会录下你的屏幕、摄像头和声音，并生成转录和摘要，但录屏中不会包含浏览器日志。
    - q: Clips 是像 Jira 这样的 bug 跟踪工具吗？
      a: "不是。Clips 做出[工程师能直接处理的 bug 报告](https://www.agent-native.com/articles/how-to-write-a-bug-report/)，由你的跟踪工具来存放它：把链接粘贴到 Jira、GitHub、Linear 或 Slack 即可。你的编码 agent 或 [Clips agent](https://www.agent-native.com/docs/template-clips-agent/) 拿到的是录屏和它的日志，而不只是工单上的文字。这就是 Clips 成为[智能体应用](https://www.agent-native.com/articles/what-is-an-agent-native-app/)的原因：既有 agent 的智能，又有应用的直观易用。"
