how_to:
  heading: 如何用 AI 把简报变成原型
  steps:
    - title: 描述你需要的界面
      body: 在 Design 首页，把简报粘贴到提示框里：面向谁、是哪个界面或流程、需要实现什么。请它给出三个方向。如果缺少关键信息，Design 会先问你。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ef31fb673e2437fb4dd6ed256a7ba9d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8209bd4f55d7432c94e05172c5475f17
        alt: Design 首页提示框的特写，里面粘贴了一段报销应用引导流程的简短简报，结尾是“Show me three directions”。
    - title: 选出你喜欢的方向
      body: Design 会把三个方向并排放在画布上，每个都是风格各异、可以运行的界面。在 **Interact** 中逐个试用，在 **选择方向** 下选一个，agent 就会把剩下的部分做完。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F137893c57370435d94967b9d5bc6a82a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fda7cdd9a2f3e42b58f44efec2b950fc9
        alt: 画布上并排放着三个引导流程方向，agent 聊天中显示“Pick a direction”，每个方向名称各有一个按钮。
    - title: 和团队一起细化
      body: 在 **设计** 标签页编辑文案、间距和颜色，或选中一个元素交给 agent。同事固定评论后，点击 **发送给 agent**，agent 就会做出那处修改。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F406b66f9b62e49c09f697f5d08599b5e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F566ca2f3c44f439aac2c5307c72aa572
        alt: 选定的引导界面，邀请步骤上固定着一位同事的评论，Comments 标签页里打开了评论串，并带有 Send to agent 按钮。
features:
  heading: 从简报到原型所需的一切
  items:
    - title: 一开始就能点击
      body: 你选中的方向会变成交互可用的 HTML，带桌面端和移动端画框。**Design 预览** 会在浏览器标签页中打开它。
    - title: 沿用简报的措辞
      body: agent 使用你的术语和表述。简报漏掉了重要的选择时，它会问你，或说明它做了什么假设。
    - title: 交付前先检查
      body: 在告诉你设计已就绪之前，agent 会对原型做一次无障碍和视觉检查。
    - title: 符合品牌的原型
      body: 用 Figma 文件、你的网站或 GitHub 仓库建立设计系统，新原型一开始就是你的配色和字体。
    - title: agent 会落实的反馈
      body: 评论固定在对应元素上。agent 修改那个位置，确认改动生效后，再关闭评论串或请你来决定。
    - title: 交给编码 agent
      body: 导出 HTML 或包含所有文件的 ZIP，或者复制一段现成的提示词，把文件和设计令牌交给编码 agent。
