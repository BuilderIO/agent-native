faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Design 免费吗？
      a: 是的，Agent-Native Design 免费且开源。agent 需要 AI 连接，可以通过 Builder.io，也可以用你自己的 AI 密钥。Design 目前处于 alpha 阶段，随着发展还会有变化。
    - q: 可以从我的 PRD 或产品简报开始吗？
      a: 可以。把简报，或产品需求文档（PRD）中相关的部分粘贴到提示框里，想要多个选项就让它给出几个方向。agent 会保留你的术语和原有表述；如果简报漏掉了会影响设计的选择，它会问你或说明它的假设。这里介绍了[设计简报里该写什么](https://www.agent-native.com/articles/how-to-turn-a-design-brief-into-a-prototype-with-ai/)。
    - q: 原型可以点击操作吗？
      a: 可以。每个界面都是带有可用交互的真实 HTML，你选中的方向默认会有桌面端和移动端画框。用 **Interact** 模式在画布上试用，或用 **Design 预览** 在新的浏览器标签页中打开界面。
    - q: 可以用我自己的设计系统或 Figma 设计吗？
      a: 可以。[设计系统](https://www.agent-native.com/docs/template-design-features/)可以来自 Figma 文件、你的网站、GitHub 仓库、design.md 文件或笔记，新设计都会遵循它。你也可以把 Figma 画框导入为可编辑的界面，Design 会列出它无法完全还原的部分。
    - q: 原型是生产代码吗？
      a: 不是。原型只是起点，应用逻辑、集成、测试和部署仍然需要开发。你可以导出 HTML 或包含所有文件的 ZIP，或用 **复制 agent 提示词** 把文件、设计令牌和现成的提示词交给编码 agent。Claude Code 和 Codex 还可以[通过 Design 的 MCP 服务器打开设计](https://www.agent-native.com/docs/template-design-integrations/)。
    - q: Design 和让聊天机器人生成 UI 有什么不同？
      a: 在 Design 中，agent 在画布上搭建原型，你可以点击试用、比较不同方向并直接编辑，团队的评论也会直接交给 agent。用聊天机器人的话，结果只停留在对话里。这让 Design 成为一个[智能体应用](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：既有 agent 的智能，又有应用的直观易用。
