faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Analytics 免费吗？
      a: 是的，Agent-Native Analytics 免费且开源。你连接的是自己的 Google Analytics 和 HubSpot 账号。开始时，你可以为 agent 选择免费的 Builder.io AI 额度或你自己的 AI 模型密钥，所以 AI 用量有上限。Analytics 目前处于 alpha 阶段，后续还会有变化。
    - q: 可以连接哪些营销数据源？
      a: Agent-Native Analytics 可以连接 Google Analytics (GA4)、HubSpot、提供关键词排名和搜索量的 DataForSEO，以及提供帖子互动数据的 X。它还能连接 BigQuery、Amplitude、Mixpanel、PostHog 和 Stripe。每个数据源都需要各自的凭证，Google Analytics 还需要一个 Google Cloud 服务账号。
    - q: Agent-Native Analytics 能每周一发送报告吗？
      a: 目前还不支持按周发送。[仪表板邮件报告](https://www.agent-native.com/docs/template-analytics-dashboards/)每天发送一次，时间和时区由你选择，可以发给最多五个邮箱、一个 Slack 频道或两者都发。周一开会前，在 **电子邮件报告** 中点击 **立即发送**，就能发出最新的仪表板。
    - q: 我需要懂 SQL 吗？
      a: 不需要。你用日常语言提问，agent 会选择数据源并编写查询。想核对时，可以让 agent 展示任意答案背后的查询。
    - q: 这些数字可信吗？
      a: agent 在给出数字之前，会对你的数据运行实时查询；如果没有运行查询，就会把这个数字标为“Unverified”。不过，在把第一周的报告发给团队之前，还是先和 Google Analytics、HubSpot 对照一下。
    - q: Agent-Native Analytics 和 GA4、HubSpot 自带的报告有什么不同？
      a: Google Analytics 和 HubSpot 各自只报告自己的数据。Agent-Native Analytics 能用日常语言跨两者回答一个问题，并把答案保存成一个仪表板，你可以继续提问来完善它。这就是[智能体应用](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：既有 agent 的智能，又有应用的直观易用。
