template: v2
slug: ui-planning
app: plans
title: 和编码 agent 一起规划新界面
seo_title: 面向 Claude Code、Codex 和 Cursor 的 UI 规划
meta_description: 借助 Agent-Native Plan，你和编码 agent 在应用的真实布局里，以线框图逐个状态规划界面。你来评论，它来修改，然后再构建。
updated: 2026-10-27
hero:
  body: 借助 Agent-Native Plan，编码 agent 会在应用的真实布局里，把新界面的每种状态画成线框图。评论需要修改的地方，agent 会先重画计划，再动手构建。
  button:
    label: 规划一个界面
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4f78a2d9f380427bb3da0723b14fcbe4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8547890f69d44a0bb7e9d9d05246850a
    alt: Plan 中一份新 Invoices 界面的计划。三个草图画框并排：发票列表、它的空状态和付款失败报错，每个都位于账单应用自己的侧边栏和工具栏中。列表的状态筛选器上固定着一条评论，下方是文字版计划的开头。
how_to:
  heading: 如何在编码 agent 构建前为界面画线框图
  steps:
    - title: 让 agent 画出这个界面
      body: 用[一条安装命令](https://www.agent-native.com/docs/plan-plugin/)把 Plan 添加到 Claude Code、Codex、Cursor、OpenCode 或 GitHub Copilot，然后输入 `/visual-plan` 并描述你想要的界面。编码 agent 会读取你的应用，画出界面线框图，并回复计划的链接。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F96c7a6d6f73a42ed96a551c112cb269a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F60c66f4f9b2442a290e2a258cc70b3f2
        alt: 编码 agent 聊天界面的特写：/visual-plan 请求一个带状态筛选、空状态和付款失败报错的 Invoices 界面。agent 读取了应用的五个布局和组件文件，创建计划，并回复审阅链接。
    - title: 评论需要修改的地方
      body: 打开计划，点击界面上出问题的那个具体位置，写下需要怎么改。把评论设为 **Agent**，让编码 agent 处理；或设为 **人工**，交给同事。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb9adb0ff68324479a0c18c8124a77b2e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F765ae87885404c408e1f4ee46d15711d
        alt: 发票列表画框的特写，状态筛选器上固定着一条评论。评论框设为 Agent，内容是：把状态筛选器改成包含 All、Paid 和 Overdue 的分段控件。
    - title: 把评论发给 agent
      body: 点击 **发送给 agent**，选择 **复制给你的 agent**，把提示词粘贴到 agent 的聊天里。编码 agent 会更新计划，并解决它已修好的评论。界面看起来没问题后，让 agent 开始构建。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9263e46c4be445389bfc97bee3a78e74
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5910f3c944e9443aafe166a356c27bff
        alt: Send to agent 按钮的特写，显示 3 条未解决的评论。菜单已展开，有两个选项：Copy for your agent 和 Send to inline agent。
features:
  heading: 一次就把界面做对所需的一切
  items:
    - title: 画在你真实的应用里
      body: 编码 agent 动笔前会先读取现有界面和组件，所以新界面的侧边栏、工具栏和菜单都保持原位。
    - title: 界面的每种状态
      body: agent 会为每种重要状态画一个画框，比如加载中、空状态、报错或展开的菜单，让你看到提示词漏掉的部分。
    - title: 评论精确到元素
      body: 编码 agent 能拿到每条评论所固定的具体按钮、行或卡片，所以一句“改成分段控件”就够了。
    - title: 未解决的评论会保留
      body: 编码 agent 会先确认每处修改已经生效，再解决评论，所以它漏掉的地方仍然在等你处理。
    - title: 多步骤流程的原型
      body: 对于注册引导或结账这样的流程，agent 会在界面旁边的 **原型** 标签页里加一个可点击的原型。
    - title: 和团队一起审阅
      body: 通过链接分享计划，同事在浏览器里就能打开这些界面。有 Agent-Native 账号的人都可以添加评论。
