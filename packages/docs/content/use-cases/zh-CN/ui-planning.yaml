faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Plan 免费吗？
      a: 是的，[Agent-Native Plan](https://www.agent-native.com/docs/template-plan/) 免费且开源。界面由你自己的编码 agent 绘制，所以每份计划都运行在 agent 的模型上，计入它的用量，计划越长，消耗越多。Plan 目前处于 alpha 阶段，后续还会有变化。
    - q: 哪些编码 agent 能和 Plan 一起用？
      a: Agent-Native Plan 提供 Claude Code 和 Codex 插件。安装命令也会以同样的方式为 Cursor、OpenCode 和 GitHub Copilot 添加 `/visual-plan`，只需登录一次。Cline、Goose 和其他支持 MCP 的 agent 添加 Plan 的 URL 即可连接。
    - q: 怎样修改计划里显示的内容？
      a: 要修改界面，就[在上面评论](https://www.agent-native.com/docs/template-plan-review-workflow/)，编码 agent 会重新绘制。Plan 不支持手动拖动或缩放界面的某个部分。界面下方的文字计划则不同：你可以直接编辑它的文字。
    - q: 画出来的界面会和我现有的应用一致吗？
      a: 会，只要这个界面属于你已有的应用。动笔之前，编码 agent 会读取应用的代码、布局和组件，所以计划里显示的是你真实的侧边栏、工具栏和菜单。全新的应用则会根据你的描述来画界面。
    - q: Plan 和编码 agent 自带的计划模式有什么不同？
      a: Plan 与 agent 的计划模式配合使用，把它的计划呈现为界面。把 agent 已经写好的 Claude Code、Codex 或 Markdown 计划交给 `/visual-plan`，Plan 就会把它变成计划中描述的界面，供你在具体位置固定评论。
