faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Design 免费吗？
      a: 是的，Agent-Native Design 免费且开源。生成页面需要 AI 连接，可以使用 Builder.io AI 额度，也可以用你自己的 AI 密钥，所以 AI 用量不是无限的。Design 目前处于 alpha 阶段，随着发展还会有变化。
    - q: Design 会发布或托管我的落地页吗？
      a: 不会。Design 负责制作并导出落地页，部署用你现在的工具完成。你可以下载 HTML 或包含所有文件的 ZIP，也可以复制一段提示词，让编码 agent 把页面添加到你的网站。
    - q: 可以使用我自己的品牌吗？
      a: 可以。用 Figma 文件、你的网站、GitHub 仓库或上传的文件建立设计系统，开始做页面时选中它。agent 生成的每个版本都会保留它的配色、字体和样式。
    - q: AI 生成落地页之后，我还能编辑吗？
      a: 可以。直接在页面上手动修改文字、颜色、间距和布局，或者让 agent 修改某个区块。你随时可以通过 **版本历史** 恢复之前的版本。
    - q: 导出落地页时会得到什么？
      a: "**下载 HTML** 会生成一个可以在任何浏览器中打开的文件，样式通过网络加载。**下载 ZIP** 包含页面的所有文件，**下载用于 Figma 的 SVG** 会生成可以在 Figma 中编辑的图层。文档列出了[所有导出选项](https://www.agent-native.com/docs/template-design-features/#export)。"
    - q: Design 和让聊天机器人生成落地页有什么不同？
      a: 聊天机器人给你一段代码，你得先把它粘贴到别处才能看到页面。在 Design 中，agent 会在一个看得见、点得动的编辑器里生成页面，而且有好几个版本。你可以手动修改，也可以通过提问修改，改的都是同一个页面。这就是[智能体应用](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：既有 agent 的智能，又有应用的直观易用。
