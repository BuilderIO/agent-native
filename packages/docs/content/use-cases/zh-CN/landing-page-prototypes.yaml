title: 把发布简报变成落地页原型
seo_title: 为你的发布打造 AI 落地页原型
meta_description: 把发布简报交给 Agent-Native Design，就能得到几版符合品牌的落地页，可以点击试用、比较，并导出为 HTML。免费且开源。
updated: 2026-10-27
hero:
  body: Agent-Native Design 会按你的品牌并排生成几个版本。手动或通过提问编辑你选中的那版，再下载成 HTML 文件添加到你的网站。
  button:
    label: 设计你的页面
    url: https://design.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9b9b61c476d745258cbb0f1b78da71be
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F921c26eb2c474e48b203e069b070269f
    alt: Design 编辑器中打开的 Product-first 版本，这是 Ledgerlane 当日承包商付款功能的发布页面，显示在桌面端和移动端画框中。左侧的 agent 聊天里显示发布简报、它提供的三个版本（选中了 Product-first），以及页面已经完成的说明。
how_to:
  heading: 如何用 AI 制作落地页原型
  steps:
    - title: 描述你的发布
      body: 在 Design 首页，把发布简报粘贴到 **新设计** 框里：写清[卖点、目标人群和行动号召](https://www.agent-native.com/articles/how-do-you-build-a-landing-page-with-ai/)。也可以把简报作为文件附上，并在框下方选择你品牌的设计系统。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8d189f62f944b3d935b058b826150b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8db8cda1abfe476f954bfa5bc50a7b6d
        alt: Design 首页 New design 框的特写。框里输入了 Ledgerlane 当日付款功能的发布简报，附上了简报 PDF，并选中了 Ledgerlane Brand 设计系统。
    - title: 比较几个版本
      body: 让 agent 给出“三个版本”。每个版本都是一个独立的界面，并排放在画板上。在聊天中选定一个，agent 就会把它做成完整页面，并清除其他版本。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F45d7dcdb0a2d473e82e516e2419e21f0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe7aac725b27c4046b57faf5e69a2abf2
        alt: 当日付款发布页面的三个版本 Product-first、Editorial 和 Proof-led 并排放在画板上。agent 聊天询问要完善哪一个，每个版本各有一个按钮。
    - title: 导出页面 HTML
      body: 在编辑器菜单中选择 **文件**，然后选 **导出**。**下载 HTML** 会生成一个可以在任何浏览器中打开的文件。**复制 agent 提示词** 会把编码 agent 需要的内容交给它，用来把页面接入你的网站。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F171cf01db5ca44ee8d31ebb6f98a73b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd2640c796dc44746ae1c8a622ec49bdc
        alt: 编辑器菜单的特写，在 Product-first 发布页面上展开了 File 和 Export。选项包括 Download HTML、Download ZIP、Download for Figma (SVG) 和 Copy agent prompt。
features:
  heading: 设计发布页面所需的一切
  items:
    - title: 从简报到落地页
      body: agent 依据简报里的表述来搭建页面，不会自己编造新的说法。简报没定的选择，它会问你，或说明它的假设。
    - title: AI 编辑与可视化编辑
      body: 标题、颜色或间距你可以自己改，也可以让 agent 重做某个区块。你们编辑的是同一个页面。
    - title: 多个版本并排比较
      body: 每个版本都有自己的风格和移动端布局，团队可以在上线前比较真正不同的方向。
    - title: 每次发布都符合品牌
      body: 用 Figma 文件、你的网站或代码建立一次设计系统，之后每个新的发布页面都会使用你的配色、字体和样式。
    - title: 固定在页面上的反馈
      body: 审阅者可以把评论固定在具体的标题或按钮上。把评论发给 agent，它会做出修改，或请你来决定。
    - title: 交给开发者的代码交接
      body: agent 提示词包含你的设计令牌、页面文件，以及编码 agent 把页面接入网站所需的说明。
