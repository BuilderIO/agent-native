app: clips
title: AI 会议笔记
seo_title: 通话里没有机器人的 AI 会议笔记
meta_description: "Agent-Native Clips 是一款免费、开源的 AI 会议笔记工具，直接在你自己的电脑上记录：每场通话都有转录、摘要和行动项。"
updated: 2026-10-26
hero:
  body: "Agent-Native Clips 把你的通话变成笔记：转录、摘要，以及按参会人整理的行动项。它在你自己的电脑上录音，不会有机器人加入通话，任何一场会议你都可以搜索或提问。"
  button:
    label: 记会议笔记
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4b1f55d396c64beea49da96d9d02b38c
