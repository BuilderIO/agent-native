faqs:
  heading: 有疑问？这里有答案
  items:
    - q: Agent-Native Clips 免费吗？
      a: 是的，Agent-Native Clips 免费且开源。摘要、标题和转录整理默认使用 [Builder.io AI 额度](https://www.agent-native.com/docs/template-clips-features/)运行。额度用完后，这些功能会暂停，直到你充值或接入自己的 Gemini 密钥。Clips 目前处于 alpha 阶段，后续还会有变化。
    - q: 会有机器人加入我的会议吗？
      a: "不会。Clips 在你自己的电脑上记笔记：Clips Desktop 录下你的麦克风和通话的音频，所以不会有任何东西加入你的 Zoom、Google Meet 或 Microsoft Teams 通话。因为没有机器人加入，请告诉大家你在记笔记。"
    - q: Clips 支持哪些日历和视频通话应用？
      a: Clips 只连接 Google Calendar。笔记适用于 Zoom、Google Meet、Microsoft Teams、Webex，或任何由你的电脑播放音频的通话。在 Mac 上，即使这些通话不在你的日历里，Clips Desktop 也能发现它们，并提示你开始记笔记。其他参会人的声音只有在 Mac 上才能采集。
    - q: Clips 能在 Windows 上记会议笔记吗？
      a: Clips Desktop 可在 Mac、Windows 和 Linux 上运行，但采集其他参会人的声音只支持 Mac。在 Windows 和 Linux 上，Clips 只录你的麦克风，所以远程参会人不会出现在转录和行动项里。
    - q: Clips 和 Zoom 或 Google Meet 自带的 AI 笔记有什么不同？
      a: "通话应用自带的 AI 笔记只绑定那个应用的通话。Clips 则把来自任何通话应用的每场会议都放在同一个资料库里。你可以问 [Clips agent](https://www.agent-native.com/docs/template-clips-agent/)：“Daniel 上周二承诺了什么？”它会按说过的话搜索你的会议。这就是[智能体应用](https://www.agent-native.com/articles/what-is-an-agent-native-app/)：既有 agent 的智能，又有应用的直观易用。"
