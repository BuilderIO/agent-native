how_to:
  heading: 如何用 AI 记会议笔记
  steps:
    - title: 连接你的日历
      body: 安装 Clips Desktop，在 Clips 的设置中打开会议，并在会议页面连接 Google Calendar。你接下来的会议会显示在 Agenda 标签页。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F58ac771a7a8547ecbb770e5e560f8ecd
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6d5d38e3c0124bbb8a51b2d0b89582c4
        alt: 会议页面 Agenda 标签页的特写，列出来自 Google Calendar 的今日会议；2 分钟后开始的那场会议旁有“加入”和“打开笔记”按钮。
    - title: 从提醒开始记笔记
      body: Clips Desktop 会在每场日历会议开始前一分钟弹出提醒。点它的 Join 按钮会加入通话并立即开始记笔记，按钮菜单里的选项则只开始记笔记、不加入通话。随后 Clips 会采集你的麦克风和通话的音频。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff048f1dd0e18443d93fdeb4a4f03fada
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe58e7dd45fa3459fb1cdb3840fed0126
        alt: "每周产品同步会的 Clips Desktop 提醒特写。Join Meet & open Clips 按钮的菜单已展开：Join only、Start notes only 和 Snooze 5 min。"
    - title: 查看你的笔记和行动项
      body: "通话结束后，会议页面会在转录旁边显示你的笔记和 AI 笔记：摘要、要点，以及按参会人整理的行动项。分享之前，请先对照转录[核对 AI 会议笔记](https://www.agent-native.com/articles/how-to-use-ai-to-take-meeting-notes/)。"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0ba0a151caef41e8904d6535671c47bc
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fbdf5e7b84ab64a288c0837959eedb85b
        alt: "一场已结束会议的 AI 笔记面板特写：摘要、四条要点，以及按两位参会人分组的行动项。"
features:
  heading: 每场会议你需要的一切
  items:
    - title: 通话里没有机器人
      body: Clips Desktop 在你自己的电脑上录下麦克风和通话的音频，所以对其他人来说，会议和平时没有两样。
    - title: 按人分配的行动项
      body: 每条行动项都会写明负责人，依据是通话中谁说了什么。分享之前，你可以添加、编辑或删除行动项。
    - title: 通话中随时提问
      body: "会议进行中就可以提问：你错过了什么、最近五分钟的回顾，或者接下来问什么好。"
    - title: 按说过的话搜索
      body: 用转录、笔记里的一个词或参会人的名字找到会议，也可以让 agent 找出聊到某件事的那场通话。
    - title: 能跳回原话的笔记
      body: 点击 AI 笔记里的任意一条要点，就会跳到转录中说这句话的那一刻。
    - title: 可分享的会议笔记
      body: 一个链接就能分享摘要、要点、行动项和完整转录，不包含录制的视频和评论。
