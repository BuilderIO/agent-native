recipes:
  - id: record-meeting
    title: "Record your next meeting"
    when: "Use this when a meeting is coming up on your calendar."
    steps:
      - "Connect Google Calendar in Clips."
      - "Find the meeting in the sidebar and hit record."
    result: "After the meeting, you'll have a transcript, an AI summary, notes, and action items."
    tip: "Your calendar stays connected, so every meeting after this is one click."
    how_often: "Every meeting"
  - id: find-decision
    title: "Find what was decided"
    when: "Use this when someone asks who agreed to what."
    steps:
      - "Ask the agent to find the meeting where you discussed it, like a rollout plan."
      - "Click a line in the transcript to replay that moment."
    result: "You'll have the meeting and the exact moment the decision came up."
    how_often: "Weekly"
  - id: recap-from-actions
    title: "Write the recap from the action items"
    when: "Use this right after the meeting ends."
    steps:
      - "Copy the action items into your recap email or tracker."
      - "Check names and dates against the transcript."
      - "Send it."
    result: "Your recap has owners and dates, and nobody had to rewrite it from memory."
    how_often: "Every meeting"
