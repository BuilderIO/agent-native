faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Clips free?
      a: Yes, Agent-Native Clips is free and open source. Summaries, titles and transcript cleanup run on [Builder.io AI credits](https://www.agent-native.com/docs/template-clips-features/) by default. When credits run out, those features stop until you add credits or connect your own Gemini key. Clips is in alpha, so expect changes.
    - q: Does a bot join my meetings?
      a: "No. Clips takes notes from your own computer: Clips Desktop records your microphone and the call's audio, so nothing joins your Zoom, Google Meet or Microsoft Teams call. Since no bot joins, tell people you're taking notes."
    - q: Which calendar and video call apps does Clips work with?
      a: Clips connects to Google Calendar only. Notes work in Zoom, Google Meet, Microsoft Teams, Webex or any other call whose audio your computer plays. On a Mac, Clips Desktop also notices those calls when they aren't on your calendar, and offers to start notes. Other attendees' voices are captured on Mac only.
    - q: Does Clips take meeting notes on Windows?
      a: Clips Desktop runs on Mac, Windows and Linux, but capturing the other attendees' voices works on Mac only. On Windows and Linux, Clips records only your microphone, so remote attendees are missing from the transcript and the action items.
    - q: How is Clips different from the AI note taker in Zoom or Google Meet?
      a: 'A call app''s AI note taker is tied to that app''s calls. Clips keeps every meeting, from any call app, in one library. Ask the [Clips agent](https://www.agent-native.com/docs/template-clips-agent/) "what did Daniel commit to last Tuesday?" and it searches your meetings by what was said. That''s an [agentic app](https://www.agent-native.com/articles/what-is-an-agent-native-app/): the brains of an agent, the intuitiveness of an app.'
