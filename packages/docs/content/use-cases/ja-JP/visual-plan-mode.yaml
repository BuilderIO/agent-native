faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Planは無料ですか？
      a: はい、Agent-Native Planは無料のオープンソースです。計画はそれぞれ、選んだモデルで動くコーディングエージェントのセッションとして実行されます。そのためエージェントのトークンを消費し、大きな計画ほど多く使います。Planはアルファ版のため、今後変更が加わる可能性があります。
    - q: Planはどのコーディングエージェントに対応していますか？
      a: Claude CodeとCodexはプラグインでインストールできます。1つのインストールコマンドで、Cursor、OpenCode、VS CodeのGitHub Copilot、Claude CoworkにもPlanを設定できます。ClineやGooseなど、ほかのMCPホストはURLでPlanのコネクターを追加できます。どの計画もブラウザーで確認します。
    - q: コーディングエージェントのプランモードと何が違いますか？
      a: Claude Code、Codex、Cursor、OpenCodeのプランモードでは、計画がチャットにテキストで表示されます。Planは、その計画やMarkdownファイルの計画を、図やファイルツリー、注釈付きコードのページにします。そのページで特定の箇所にコメントし、エージェントの質問に答え、チームメンバーを招くことができます。
    - q: 計画中にエージェントがコードを変更することはありますか？
      a: いいえ。計画を書いたり修正したりしている間、Planの指示によりエージェントはコードを読むだけです。編集を始めるのは計画を承認してからで、大きなステップの前には承認済みの計画を読み直します。
    - q: アカウントがなくてもチームメンバーは計画を確認できますか？
      a: 一部は可能です。リンクを共有された人は誰でも、ゲストとして計画を開いて編集できます。コメント、保存、共有にはAgent-Nativeアカウントが必要なので、コメントしたいチームメンバーは先にサインインします。
    - q: 計画を自分のパソコンだけに保存できますか？
      a: はい。[ローカルファイルモード](https://www.agent-native.com/docs/template-plan-local-and-desktop/)では、計画をMDXファイルとしてパソコンに保存するので、内容がホスト版アプリに届くことはありません。その代わり、ローカルの計画は共有したりブラウザーでコメントしたりできず、リンクも自分のパソコンでしか開けません。ローカルファイルモードにしても、コーディングエージェントのAIモデルが動く場所は変わりません。
