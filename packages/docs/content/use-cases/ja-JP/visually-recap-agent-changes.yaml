faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Planは無料ですか？
      a: はい、Agent-Native Planは無料のオープンソースです。ビジュアル要約は、選んだモデルでエージェントのセッションを丸ごと1回実行するため、変更が大きいほどモデルの使用量が増えます。Planはアルファ版のため、今後変更が加わる可能性があります。
    - q: ビジュアル要約はどんな変更で使うとよいですか？
      a: 大きめの変更で使いましょう。複数のファイルにまたがる変更や、データスキーマ、API、アプリ全体の構成に関わる変更です。1つのファイルへの小さな変更なら、要約を待つより差分をそのまま読むほうが早く済みます。
    - q: ビジュアル要約は差分を読むのと何が違いますか？
      a: 差分は、変更された行をファイルごとにすべて並べます。ビジュアル要約は、変更が何をするのかから始まります。変わった画面のワイヤーフレーム、変わったデータ項目、関係するファイルのマップです。そのうえで、読む価値のある差分だけをメモ付きで表示します。
    - q: Planはどのコーディングエージェントに対応していますか？
      a: インストールコマンドで、Claude Code、Codex、Cursor、OpenCode、VS CodeのGitHub Copilot、Claude CoworkにPlanが設定され、サインインも完了します。Cline、Gooseなど、MCPサーバーに接続できるエージェントでも、ホスト版のコネクターを通じてPlanを使えます。
    - q: すべてのプルリクエストで要約を作れますか？
      a: はい。[PR Visual Recap GitHub Action](https://www.agent-native.com/docs/pr-visual-recap/)は、プッシュのたびにご自身のAPIキーでClaude Code、Codex、またはOpenAI互換のモデルを実行します。プルリクエスト上の1つのコメントを要約のスクリーンショット付きで更新し続け、マージを妨げることはありません。約600KBを超える差分は途中で切り詰められます。
    - q: 要約は誰が見られますか？
      a: デフォルトでは、組織にサインインしている人だけが要約を開けます。非公開にすれば自分だけが見られます。GitHub Actionを使う場合、プルリクエストを見られる人は誰でも要約のスクリーンショットを見られます。[ローカルファイルモード](https://www.agent-native.com/docs/template-plan-local-and-desktop/)なら要約はホスト版アプリに置かれませんが、エージェントのモデルはこれまでどおりの場所で動きます。
