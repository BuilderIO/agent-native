faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Planは無料ですか？
      a: はい、[Agent-Native Plan](https://www.agent-native.com/docs/template-plan/)は無料のオープンソースです。画面を描くのはご自身のコーディングエージェントなので、計画はそれぞれエージェントのモデルで実行されてその使用量に含まれ、長い計画ほど多く使います。Planはアルファ版のため、今後変更が加わる可能性があります。
    - q: Planはどのコーディングエージェントで使えますか？
      a: Agent-Native PlanにはClaude CodeとCodex向けのプラグインがあります。インストールコマンドでCursor、OpenCode、GitHub Copilotも同じように設定でき、1回のサインインで`/visual-plan`が追加されます。Cline、GooseなどMCPに対応したエージェントは、PlanのURLを追加して接続します。
    - q: 計画に表示される内容はどう変えますか？
      a: 画面は[コメントする](https://www.agent-native.com/docs/template-plan-review-workflow/)ことで変更し、コーディングエージェントが描き直します。Planでは、画面の一部を手でドラッグしたりサイズを変えたりはできません。一方、画面の下にある文章の計画は、テキストを直接編集できます。
    - q: 画面は既存のアプリと一致しますか？
      a: はい、既存のアプリの一部となる画面であれば一致します。コーディングエージェントは描く前にアプリのコード、レイアウト、コンポーネントを読むので、計画には実際のサイドバー、ツールバー、メニューが表示されます。まったく新しいアプリの場合は、説明をもとに画面が描かれます。
    - q: コーディングエージェントのプランモードと何が違いますか？
      a: Planはエージェントのプランモードと組み合わせて使い、その計画を画面として見せます。エージェントが書いたClaude Code、Codex、Markdownの計画を`/visual-plan`に渡せば、Planが計画に書かれた画面を描き、特定の箇所にピン留めするコメントを受け付けられる状態にします。
