title: コーディングエージェントと新しい画面を計画
seo_title: Claude Code・Codex・Cursor向けUIプランニング
meta_description: Agent-Native Planなら、コーディングエージェントと一緒に、アプリの実際のレイアウトで状態ごとのワイヤーフレームを作って画面を計画できます。コメントすれば修正し、その後に実装します。
updated: 2026-10-27
hero:
  body: Agent-Native Planでは、コーディングエージェントが新しい画面を、アプリの実際のレイアウトで状態ごとのワイヤーフレームとして計画します。変えたい点にコメントすれば、実装前にエージェントが描き直します。
  button:
    label: 画面を計画する
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4f78a2d9f380427bb3da0723b14fcbe4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8547890f69d44a0bb7e9d9d05246850a
    alt: Planで開いた、新しい請求書画面の計画。請求書の一覧、空の状態、支払い失敗のエラーという3つのスケッチが横に並び、どれも請求アプリ自体のサイドバーとツールバーの中に描かれています。一覧のステータスフィルターにはコメントがピン留めされ、その下から文章の計画が始まります。
how_to:
  heading: コーディングエージェントが作る前に画面をワイヤーフレーム化する方法
  steps:
    - title: エージェントに画面を依頼する
      body: '[1つのインストールコマンド](https://www.agent-native.com/docs/plan-plugin/)でClaude Code、Codex、Cursor、OpenCode、GitHub CopilotにPlanを追加し、`/visual-plan`と入力して欲しい画面を説明します。コーディングエージェントがアプリを読み、画面のワイヤーフレームを作って計画のリンクを返します。'
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F96c7a6d6f73a42ed96a551c112cb269a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F60c66f4f9b2442a290e2a258cc70b3f2
        alt: コーディングエージェントのチャットの拡大図。ステータスフィルター、空の状態、支払い失敗のエラーを備えた請求書画面を/visual-planで依頼しています。エージェントはアプリのレイアウトとコンポーネントのファイルを5つ読み、計画を作成して、確認用のリンクを返信しています。
    - title: 変えてほしい点にコメントする
      body: 計画を開き、画面上の直したい箇所をクリックして、変更内容を書きます。コーディングエージェントに対応してもらうならコメントを**エージェント**に、チームメンバー宛てなら**人間**に設定します。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb9adb0ff68324479a0c18c8124a77b2e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F765ae87885404c408e1f4ee46d15711d
        alt: 請求書一覧のフレームの拡大図。ステータスフィルターにコメントがピン留めされています。コメント欄はエージェント宛てに設定され、ステータスフィルターを「すべて」「支払い済み」「期限超過」のセグメントコントロールにするよう書かれています。
    - title: コメントをエージェントに送る
      body: '**エージェントに送信**をクリックして**エージェント用にコピー**を選び、プロンプトをエージェントのチャットに貼り付けます。コーディングエージェントが計画を更新し、対応したコメントを解決します。画面に納得したら、エージェントに実装を頼みましょう。'
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9263e46c4be445389bfc97bee3a78e74
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5910f3c944e9443aafe166a356c27bff
        alt: 未解決のコメントが3件ある「Send to agent」ボタンの拡大図。メニューが開き、「Copy for your agent」と「Send to inline agent」の2つの選択肢が表示されています。
features:
  heading: 最初から画面を正しく作るために必要な機能がすべて揃っています
  items:
    - title: 実際のアプリの中に描く
      body: コーディングエージェントは描く前に既存の画面とコンポーネントを読むので、新しい画面でもサイドバー、ツールバー、メニューは今の位置のままです。
    - title: 画面のあらゆる状態
      body: 読み込み中、空、エラー、メニューを開いたときなど、重要な状態ごとにフレームを描くので、プロンプトでは抜け落ちる部分も確認できます。
    - title: 要素を指定してコメント
      body: 各コメントがどのボタン、行、カードにピン留めされたかがエージェントに伝わるので、「ここをセグメントコントロールに」といった短いメモで十分です。
    - title: 未対応のコメントは残る
      body: コーディングエージェントは変更が反映されたことを確かめてからコメントを解決するので、対応漏れがあればコメントは残ったままです。
    - title: 複数ステップのフローはプロトタイプで
      body: オンボーディングや決済などのフローでは、エージェントが画面の隣の**プロトタイプ**タブに、クリックできるプロトタイプを追加します。
    - title: チームで確認
      body: 計画をリンクで共有すれば、チームメンバーはブラウザーで画面を開けます。Agent-Nativeアカウントがあれば誰でもコメントできます。
