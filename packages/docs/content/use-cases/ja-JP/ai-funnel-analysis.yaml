other_uses:
  heading: Agent-Native Analyticsでできるその他のこと
  cards:
    - title: スタートアップのKPIダッシュボードを作成
      url: https://www.agent-native.com/use-cases/ai-kpi-dashboard/
      body: 追っているKPIを説明すれば、エージェントがStripe、HubSpot、製品データから1つのダッシュボードを作ります。
    - title: 普段の言葉でデータに質問
      url: https://www.agent-native.com/use-cases/ask-your-database/
      body: BigQueryのデータに質問すると、エージェントが確認できる読み取り専用のSQLを書きます。
    - title: 表計算なしで週次マーケティングレポートを作成
      url: https://www.agent-native.com/use-cases/weekly-marketing-report/
      body: マーケティングの1週間の成果を質問すると、エージェントがGoogle AnalyticsとHubSpotのデータからダッシュボードで答えます。
faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Analyticsは無料ですか？
      a: はい、Agent-Native Analyticsは無料のオープンソースです。ホスト版アプリを使うことも、[自分のコピーを動かす](https://www.agent-native.com/docs/template-analytics/)こともできます。データはご自身で用意します。自社のイベントか、連携したツールのデータです。Analyticsはアルファ版のため、今後変更が加わる可能性があります。
    - q: SQLの知識は必要ですか？
      a: いいえ。普段の言葉で質問すれば、エージェントがSQLを書いて実行し、グラフ、表、数値で答えます。確認したいときはクエリを見せるよう頼めます。最初に、データに詳しい人が[データソースを接続](https://www.agent-native.com/docs/template-analytics-connectors/)する必要がある場合もあります。
    - q: セッションリプレイはどこから取得しますか？
      a: ご自身のWebアプリからです。**データソース**で公開キーを作成し、**セッション**ページにある短いトラッキングスニペットを、セッションリプレイをオンにしてアプリに追加します。録画の保存先として、Builder.ioかご自身のS3バケットを接続します。デフォルトでは、[リプレイ](https://www.agent-native.com/docs/template-analytics-monitoring-and-sessions/)はサインイン済みのユーザーだけを記録します。
    - q: セッションリプレイには何が記録されますか？
      a: リプレイでは、ページ、クリックとスクロール、コンソール出力、ネットワークリクエストを再生できます。入力内容はデフォルトでマスクされ、パスワードやカード情報として名前の付いた入力欄は一切記録されません。ほかの部分を隠すには、その部分にクラスを追加します。
    - q: PostHog、Amplitude、Mixpanelのデータを使えますか？
      a: はい。**データソース**で接続すれば、それらのツールで計測しているイベントについて質問できます。エージェントが各ツールにクエリを実行します。セッションリプレイはAnalytics独自のトラッキングからのみ取得するので、離脱した人を見るにはアプリにトラッキングを追加しましょう。
    - q: 分析ツールに付属するAIと何が違いますか？
      a: 分析ツールのAIは、そのツールのデータを扱います。Analyticsのエージェントは連携したすべてのデータソースを横断し、離脱した人のリプレイを正確に見つけ、どれでも解説したり、コーディングエージェントに渡したりできます。しかもオープンソースです。これが[エージェント型アプリ](https://www.agent-native.com/articles/what-is-an-agent-native-app/)です。エージェントの頭脳と、アプリの直感的な使いやすさを兼ね備えています。
