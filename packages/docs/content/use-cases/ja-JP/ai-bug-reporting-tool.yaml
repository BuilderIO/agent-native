faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Clipsは無料ですか？
      a: はい。Agent-Native Clipsは、Chrome拡張機能を含めて無料のオープンソースです。タイトル、要約、文字起こしの整形は、デフォルトでBuilder.io AIクレジットを使って実行されるため、AIの利用は無制限ではなく、録画には動画の保存先も必要です。Clipsはアルファ版のため、今後変更が加わる可能性があります。
    - q: Clipsはブラウザから何を取得しますか？
      a: Clips Chrome拡張機能は、最大5つのタブから[コンソールメッセージ、JavaScriptエラー、ネットワークリクエスト](https://www.agent-native.com/docs/template-clips-features/#chrome-extension-browser-logs)を取得し、録画ボタンを押す最大30秒前までさかのぼります。各リクエストについて、アドレス、ステータス、所要時間、失敗したかどうかが記録されます。編集者はクリップの「デバッグ」タブですべて確認でき、エージェントはリンクから読み取れます。
    - q: Clipsはパスワードや個人情報を記録しますか？
      a: Clipsは、リクエストやレスポンスの本文、ヘッダー、Cookie、入力したテキストを一切保存せず、トークン、パスワード、キーに見える値は伏せ字にします。開発者向けログは、拡張機能の設定でオフにできます。新しい録画はリンクを知っていれば誰でも見られる状態になるため、社内の情報が映るバグ報告は、非公開または組織内のみに設定してください。
    - q: バグの録画をClaude Code、Cursor、Codexに渡すには？
      a: クリップのリンクをClaude Code、Cursor、Codexに貼り付けると、エージェントは動画をダウンロードせずに、[文字起こし、フレーム、ブラウザログを読み取ります](https://www.agent-native.com/docs/template-clips-integrations/#agent-readable-clips)。非公開のクリップは、「共有」メニューの「エージェント」タブで「エージェント用プロンプトをコピー」をクリックすると、2時間有効なリンクがエージェントに渡されます。このタブからは、Claude CodeやCodexでクリップを開くこともできます。
    - q: Clipsはほかのブラウザやデスクトップアプリのログも取得しますか？
      a: いいえ。コンソールログとネットワークログを取得できるのは、Clips Chrome拡張機能だけです。Clips Desktopやウェブアプリでも、画面、カメラ、音声を録画して文字起こしと要約を作成できますが、録画にブラウザログは含まれません。
    - q: ClipsはJiraのようなバグトラッカーですか？
      a: いいえ。Clipsが作るのは[エンジニアがすぐ対応できるバグ報告](https://www.agent-native.com/articles/how-to-write-a-bug-report/)で、保存はトラッカーが担います。リンクをJira、GitHub、Linear、Slackに貼り付けてください。コーディングエージェントや[Clipsエージェント](https://www.agent-native.com/docs/template-clips-agent/)は、録画そのものとそのログを読み取ります。これがClipsを[エージェント型アプリ](https://www.agent-native.com/articles/what-is-an-agent-native-app/)たらしめる点です。エージェントの頭脳と、アプリの直感的な使いやすさを兼ね備えています。
