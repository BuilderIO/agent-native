title: コンソールログとネットワークログ付きでバグを録画
seo_title: コンソールログ付きのAIバグ報告ツール
meta_description: Chromeでバグを再現すると、Agent-Native Clipsが録画を、ページのエラーと失敗したリクエスト付きのリンク1つにまとめます。エンジニアやコーディングエージェントにそのまま渡せます。
updated: 2026-10-27
hero:
  body: Agent-Native Clipsは、バグの録画を、エンジニアやコーディングエージェントがすぐ対応できるリンク1つに変えます。Chromeでバグを再現すれば、ページのエラーと失敗したリクエストも付いてきます。
  button:
    label: バグを録画する
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe36fd7fdff9b49bca2c6787f302964c6
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff375e2d60b2048508c23ea90a9761e08
    alt: Clipsで開いたバグの録画。エラーメッセージが表示されたチェックアウトページで一時停止しています。動画の横の「デバッグ」タブには、赤いコンソールエラーと、ステータス500で失敗したリクエストが表示されています。
how_to:
  heading: AIでバグを報告する方法
  steps:
    - title: Chromeから録画を開始する
      body: ツールバーのClips Chrome拡張機能をクリックし、ブラウザのタブ、ウィンドウ、画面全体のいずれかを録画の対象に選びます。カメラとマイクのオン・オフを切り替えて、「Start recording」をクリックします。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6996593713c74108967e120111378c14
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff7991811f7a346e0a99cf9fe81496e34
        alt: Webアプリの上に表示されたClips拡張機能のポップアップの拡大図。録画の対象として「Browser tab」が選ばれ、カメラとマイクがオンになっていて、「Start recording」ボタンがあります。
    - title: バグを再現して説明する
      body: 不具合が起きる手順をクリックして進め、本来どうなるはずだったかを話します。録画中、拡張機能はページのエラーと送信されたリクエストを保存します。これらは、本来ならエンジニアがChromeのデベロッパーツールから掘り出す情報です。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe01ffb73c62c427b8077f05657fdeb47
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff895d85667344971baec96eb0b2ec956
        alt: WebアプリのチェックアウトページにClipsの録画コントロールとカメラのバブルが重なって表示され、「Something went wrong」というメッセージが出ています。
    - title: リンクを1つ共有する
      body: 停止すると、Clipsが録画のリンクをコピーします。チケットやチャット、コーディングエージェントに貼り付けましょう。「共有」メニューの「エージェント」タブからは、ClaudeやClaude Code、Codexで直接開くこともできます。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F10933b64225545e1b5ecd666f5803832
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2894036362f7409d8a4961536719b399
        alt: Clipsの「共有」メニューの「エージェント」タブの拡大図。「エージェント用プロンプトをコピー」と、「Claude で開く」「Claude Code で開く」「Codex で開く」ボタンが表示されています。
features:
  heading: バグ報告に必要な機能がすべて揃っています
  items:
    - title: コーディングエージェント向けに設計
      body: リンクをClaude CodeやCursor、Codexに貼り付けるだけです。エージェントは動画をダウンロードせずに、文字起こし、フレーム、ログを読み取ります。
    - title: コンソールログとネットワークログ
      body: 最大5つのタブのコンソールメッセージ、エラー、リクエストを保存し、ステータスと所要時間、失敗の有無も記録します。
    - title: 録画前の30秒間も
      body: Clipsは録画ボタンを押す最大30秒前までさかのぼるため、ページの読み込み中に起きたエラーも報告に含められます。
    - title: 機密情報は保存しない
      body: Clipsはリクエストの本文、ヘッダー、Cookie、入力したテキストを一切保存せず、トークンやパスワードに見える値は伏せ字にします。
    - title: エラーの場所へすぐ移動
      body: クリップの「デバッグ」タブで、エラーや失敗したリクエストの横にある時刻をクリックすると、動画がその瞬間に移動します。
    - title: すべてのバグ報告を検索
      body: バグ報告は、その中で話された内容から探せます。ライブラリ内のすべての録画を対象に、Clipsエージェントに尋ねることもできます。
