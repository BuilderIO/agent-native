    - title: HubSpotとGongのデータで営業パイプラインを確認
      url: https://www.agent-native.com/use-cases/ai-sales-analytics/
      body: HubSpotの取引やGongの通話について、普段の言葉で質問できます。
faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Analyticsは無料ですか？
      a: はい、Agent-Native Analyticsは無料のオープンソースです。Google AnalyticsとHubSpotはご自身のアカウントを連携します。始める際に、エージェント用に無料のBuilder.io AIクレジットかご自身のAIモデルキーを選ぶため、AIの使用量には上限があります。Analyticsはアルファ版のため、今後変更が加わる可能性があります。
    - q: どのマーケティングデータソースを連携できますか？
      a: Agent-Native Analyticsは、Google Analytics（GA4）、HubSpot、キーワード順位と検索ボリューム用のDataForSEO、投稿のエンゲージメント用のXに接続します。BigQuery、Amplitude、Mixpanel、PostHog、Stripeにも接続できます。各データソースにはそれぞれの認証情報が必要で、Google AnalyticsにはGoogle Cloudのサービスアカウントが必要です。
    - q: Agent-Native Analyticsは毎週月曜日にレポートを送れますか？
      a: 週単位のスケジュールにはまだ対応していません。[ダッシュボードのメールレポート](https://www.agent-native.com/docs/template-analytics-dashboards/)は、指定した時刻とタイムゾーンで毎日、最大5件のメールアドレス、Slackチャンネル、またはその両方に送られます。月曜日の会議の前に、**メールレポート**で**今すぐ送信**をクリックすれば、最新のダッシュボードを送れます。
    - q: SQLの知識は必要ですか？
      a: いいえ。普段の言葉で質問すれば、エージェントがデータソースを選んでクエリを書きます。確認したいときは、どの回答でも裏にあるクエリを見せるようエージェントに頼めます。
    - q: 数値は信頼できますか？
      a: エージェントは数値を示す前にデータへのライブクエリを実行し、クエリが実行されなかった数値には「Unverified」と表示します。それでも、最初の週のレポートはチームに送る前にGoogle AnalyticsやHubSpotと照らし合わせましょう。
    - q: Agent-Native AnalyticsはGA4やHubSpotのレポートと何が違いますか？
      a: Google AnalyticsとHubSpotは、それぞれ自分のデータについてレポートします。Agent-Native Analyticsは、両方にまたがる1つの質問に普段の言葉で答え、その回答を、質問するだけで改善できる1つのダッシュボードに残します。これが[エージェント型アプリ](https://www.agent-native.com/articles/what-is-an-agent-native-app/)です。エージェントの頭脳と、アプリの直感的な使いやすさを兼ね備えています。
