faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Contentは無料ですか？
      a: はい、Agent-Native Contentは無料のオープンソースです。コーディングエージェントは自身のモデルで仕様書を読み書きするので、エージェントの使用量に含まれます。Contentの組み込みエージェントは、Builder.ioのクレジットかご自身のモデルキーで動きます。Contentはアルファ版のため、今後変更が加わる可能性があります。
    - q: どのコーディングエージェントが仕様書を読めますか？
      a: Claude CodeとCodexは**共有**からページを開き、初回だけ接続を求めます。CursorとVS CodeのGitHub Copilotは、そこからワンクリックでContentを追加できます。Claude Cowork、Goose、OpenCodeはターミナルから接続し、サインインに対応したMCPクライアントなら[URLでContentに接続](https://www.agent-native.com/docs/external-agents/#private-content-links)できます。各エージェントが見られるのは、ご自身のアカウントで見られる範囲だけです。
    - q: リポジトリにある仕様書ファイルと何が違いますか？
      a: リポジトリの仕様書ファイルはコピーであり、編集するのはたいていコードを触る人だけです。Contentでは、コーディングエージェントが読むのと同じページにチームが書き込み、コメントでき、エージェントの変更は提案として届きます。リポジトリにもMarkdownを置きたい場合は、Contentを[ローカルフォルダーと同期](https://www.agent-native.com/docs/template-content-sync/)できます。
    - q: コーディングエージェントは仕様書を変更できますか？
      a: はい、ご自身のアカウントの権限の範囲で変更できます。編集の提案を頼めば、1つずつ承認するまでページは変わりません。ページを直接編集することもできますが、エージェントが読んだ後にページが変わっていれば、Contentはその編集を拒否します。[バージョン履歴](https://www.agent-native.com/docs/template-content-editing/)には以前の版が残ります。
    - q: 仕様書をリポジトリに置いておけますか？
      a: はい。Contentで[ローカルのMarkdownまたはMDXフォルダー](https://www.agent-native.com/docs/template-content-local-files/)を接続し、変更の取得、確認、プッシュができます。コマンド1つでリポジトリからContentを起動することもできます。競合は確認できるように表示されます。ブラウザーだけではローカルファイルを読めないため、ローカルのContentアプリかAgent-Native Desktopが必要です。
