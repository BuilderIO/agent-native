faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Analyticsは無料ですか？
      a: はい、Agent-Native Analyticsは無料のオープンソースです。ホスト版のアプリを使うことも、自分でコピーを動かすこともできます。エージェントにはBuilder.ioかご自身のモデルキーによるAI接続が必要なため、AIを無制限に使えるわけではありません。Analyticsはアルファ版のため、今後変更される可能性があります。
    - q: SQLの知識は必要ですか？
      a: いいえ。普段の言葉で質問すれば、エージェントがSQLを書きます。最初に、データに詳しい人が[BigQueryを接続](https://www.agent-native.com/docs/template-analytics-connectors/)する必要があるかもしれません。管理者が**セマンティックレイヤー**ページに[指標の定義](https://www.agent-native.com/docs/template-analytics-dashboards/)を追加しておけば、エージェントが正しいテーブルと列を選べます。
    - q: Postgres、Supabase、Neonでも使えますか？
      a: はい、SupabaseまたはNeon上のPostgresなら使えます。チャットの+メニューから[MCPで接続](https://www.agent-native.com/docs/mcp-clients/)し、チャットで質問してください。ダッシュボードのパネルはまだPostgresにクエリを実行できないため、その答えはチャット内に残ります。それ以外のPostgresデータベースにはまだクエリを実行できないため、このページの手順ではBigQueryを使っています。
    - q: エージェントがデータを変更することはありますか？
      a: BigQueryではありません。Analyticsは、BigQueryのデータを挿入、更新、削除、破棄しようとするエージェントのクエリをすべて拒否します。また、設定時には読み取り専用ロールのサービスアカウントを求めるため、テーブルの読み取りとクエリの実行はできても、データの変更はできません。SupabaseやNeon経由の場合、エージェントはその接続で許可した操作を行えます。
    - q: 答えが正しいかどうかはどうすればわかりますか？
      a: 裏にあるクエリを確認しましょう。エージェントにSQLを見せるよう頼むか、ダッシュボードのグラフで**SQLを見る**を開きます。どのテーブルやフィルターを使ったかを聞くこともできます。ライブクエリが実行されなかった数値には、エージェントが**Unverified**と印を付けます。
    - q: CSVをエクスポートしてChatGPTに聞くのと何が違いますか？
      a: チャットアシスタントはエクスポートしたファイルから答えるので、新しい質問のたびにエクスポートし直すことになります。Analyticsはウェアハウスに直接クエリを実行し、チームの指標の定義を使い、また必要になる答えはダッシュボードに残します。これが[エージェント型アプリ](https://www.agent-native.com/articles/what-is-an-agent-native-app/)です。エージェントの頭脳と、アプリの直感的な使いやすさを兼ね備えています。
