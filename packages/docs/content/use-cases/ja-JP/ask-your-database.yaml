title: 普段の言葉でデータに質問
seo_title: SQLなしでデータベースに質問
meta_description: BigQueryのデータについて質問すると、Agent-Native Analyticsが確認できる読み取り専用のSQLで答え、繰り返し聞く質問はダッシュボードに残します。
updated: 2026-10-27
hero:
  body: Agent-Native AnalyticsがBigQueryのデータから答え、繰り返し聞く質問はダッシュボードに残します。エージェントが書くのは、確認できる読み取り専用のSQLです。
  button:
    label: データに質問する
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd1120abfcd1447b9ab48ff98a9b7592d
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2db877a772674ad4af41e7efbb062d50
    alt: 「質問」を開いたAnalytics。エージェントが先週の登録数についての質問に、プラン別の棒グラフと集計元の表で答えています。その下の追加の質問では、Proが最も伸びたことがわかります。
how_to:
  heading: 普段の言葉でデータベースに質問する方法
  steps:
    - title: データウェアハウスを接続する
      body: '**データソース**ページでBigQueryを開きます。BigQuery Data ViewerとBigQuery Job Userのロールを持つサービスアカウントのJSONキーをアップロードし、プロジェクトIDを入力して、**認証情報の保存**と**接続をテスト**をクリックします。'
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F62008ebd98594f02b1c0bf3ae565ef49
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb01d428bca15467eb4c04299dd9575b8
        alt: データソースページのBigQueryカードの拡大図。「接続済み」と表示され、プロジェクトIDとサービスアカウントが設定済みで、「接続成功」と表示されています。
    - title: 普段の言葉で質問する
      body: '**質問**で、同僚に聞くように質問を入力します。たとえば「先週登録したアカウント数をプラン別に教えて」。エージェントが適切なテーブルを探してクエリを実行し、グラフで答えます。'
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3e9ac5b30a924dab9b09bc76ed24b2de
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F31c48c5ccc9247b792c00474b01f97b0
        alt: 「質問」チャットの拡大図。エージェントがBigQueryのスキーマを検索してクエリを1回実行し、登録数723件とプラン別の棒グラフで答えています。
    - title: 答えをダッシュボードに残す
      body: エージェントに「これをダッシュボードに追加して」と頼みます。エージェントがパネルを作り、SQLが動くことを確認してダッシュボードを保存します。ダッシュボードは、チームメンバーや組織全体に共有するまで非公開です。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F957858f8613241a2b2249d88430b3cc4
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd0111e9f420149fc8a35cad845ad8e2e
        alt: 新しい「週次登録数」ダッシュボード。プラン別登録数のパネルと週別登録数のグラフがあります。横のエージェントチャットには、両方のパネルをBigQueryで確認したと表示されています。
features:
  heading: データベースから答えを得るために必要な機能がすべて揃っています
  items:
    - title: すべての答えの裏にあるSQL
      body: ダッシュボードのグラフで**SQLを見る**を開くか、チャットで聞けば、エージェントが書いたクエリを確認でき、コピーして自分で実行できます。
    - title: チームの指標の定義
      body: 「アクティブ」や「登録」の意味を、管理者が**セマンティックレイヤー**ページに書いておけます。エージェントはSQLを書く前にそれを読みます。
    - title: データを変更できないクエリ
      body: BigQueryでは、エージェントのSQLは挿入・更新・削除できません。接続には読み取りとクエリ実行のみのサービスアカウントを使います。
    - title: エージェントが編集するダッシュボード
      body: チャットでパネルやフィルター、プラン別の内訳を頼めば、共有しているすべての人に向けてエージェントがダッシュボードを変更します。
    - title: ツールをまたいだ質問
      body: ウェアハウスのテーブルと、Stripeの売上、HubSpotの取引、PostHogのイベントを組み合わせた質問が1つでできます。
    - title: ダッシュボードを受信トレイに
      body: 指定した時刻にダッシュボードを毎日メールで受け取れます。グラフと表はメール本文に入り、最大5人まで届けられます。
