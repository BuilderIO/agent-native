slug: ai-dictation
app: clips
title: AIディクテーション
seo_title: コーディングエージェント、Slack、ドキュメント向けAIディクテーション
meta_description: 長いプロンプトを入力する代わりに、Claude CodeやSlack、ドキュメントに話しかけられます。Agent-Native Clipsは、すべてのディクテーションを保存する無料のオープンソースAIディクテーションです。
updated: 2026-10-26
hero:
  body: プロンプトを入力する代わりに丸ごと話せば、Claude CodeからSlackまで、カーソルの位置に入力されます。Agent-Native Clipsはすべてのディクテーションを保存し、頼めばエージェントが書き直します。
  button:
    label: ディクテーションを始める
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb42e201ec33f4acf8f8b6d39f67a2503
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3b0e34d91eee4240a0211ba4ca9b0859
    alt: 本日のディクテーションが並ぶClipsの「ディクテーション」ページ。コーディングエージェント向けの長いプロンプト、バグチケット、Slackの更新連絡があり、プロンプトのカードが開いて「オリジナル」と「クリーンアップ済み」のテキストが表示されています。
how_to:
  heading: AIディクテーションの使い方
  steps:
    - title: どのアプリにもディクテーション
      body: Clips Desktopをインストールし、Claude CodeやLinear、Slackをクリックして、話している間ショートカット（デフォルトはFn、設定で変更可能）を押し続けます。離すと、Clipsがカーソルの位置に言葉を入力します。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F493f3728ed1246bb841a651e3aa76300
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb3785ba8ec804690836d94e31ff92e17
        alt: コーディングエージェントのチャット画面。Webhookの再試行についてディクテーションしたプロンプトが送信され、エージェントが変更を加えました。メッセージ欄にはカーソルが待機し、下のClipsのピルが緑の波形を立ち上げて次のプロンプトを聞き取っています。
    - title: Clipsに自分の言葉を教える
      body: 「ディクテーション」ページの「辞書」を開き、製品名やライブラリ名、同僚の名前を追加します。Clipsが聞き間違え続ける言葉には「用語 → 置き換え」の形で登録できます。CSVファイルを読み込めば、リストをまとめて追加できます。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F855c88996488417e8dc3a532a0fd21a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff4e9c0557a1344f6a55e7e9c4356a5ab
        alt: Clipsの辞書パネル。「用語を追加」「読み込む」「CSVを書き出す」が表示されています。その下には、Agent-Native、「web hooks → webhooks」、「kube control → kubectl」などの用語が並んでいます。
    - title: 過去のディクテーションを探す
      body: Clipsで Cmd+K を押して話した言葉を入力すると、一致するディクテーションが、話したアプリの名前とともに表示されます。1つ選ぶと、「ディクテーション」ページで開きます。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5e344071b49f4e51ae5eef2708c46605
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F13f558e09094404f975350ad0c359acc
        alt: 「webhook」と入力したClipsの検索メニュー。「ディクテーション」の下に、Cursorにディクテーションしたプロンプトと、Slackにディクテーションしたメッセージの2件の過去のディクテーションが表示されています。
features:
  heading: 入力する代わりにディクテーションするための機能がすべて揃っています
  items:
    - title: クリップボードはそのまま
      body: Clipsはアプリに貼り付けたあとクリップボードを元に戻すので、コピーしておいたリンクはそのまま残ります。ターミナルでは貼り付けではなく入力します。
    - title: 元に戻せるAIクリーンアップ
      body: Clipsは聞き間違い、句読点、大文字を直し、言い直しを削除。自動またはワンクリックで、元のテキストも残ります。
    - title: 修正から学習
      body: Clipsが貼り付けた直後に聞き間違いを直すと、デスクトップアプリがその修正を辞書に追加するので、次回のディクテーションは正しく入力されます。
    - title: 長いプロンプトもハンズフリー
      body: ショートカットを2回タップすると、考えながら話す間も聞き取りが続きます。もう1回タップで停止、Escで破棄できます。
    - title: もう一度貼り付け
      body: Cmd+Ctrl+V を押すと、直前のディクテーションを別のテキストフィールドに貼り付け直せます。カーソルの位置が違っていたときに便利です。
    - title: エージェントに質問
      body: 「第3四半期の予算について何て言った？」や「このとりとめのない話を箇条書きにして」と頼めば、エージェントが履歴をもとに対応します。
