faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Clipsは無料ですか？
      a: はい。Agent-Native Clipsは無料のオープンソースで、デスクトップアプリでは音声ディクテーションがデフォルトでオンです。AIクリーンアップはBuilder.io AIクレジットまたはご自身のキーで実行されるため、無制限ではありません。Clipsはアルファ版のため、今後変更が加わる可能性があります。
    - q: パソコン内蔵のディクテーションとは何が違いますか？
      a: 内蔵のディクテーションは設定不要ですが、[話した内容を検索できる履歴](https://www.agent-native.com/articles/what-should-you-look-for-in-dictation-software/)は残りません。Clipsは、すべてのディクテーションを元のテキストとクリーンアップ後のテキストで保存し、あなたの言葉を学習して、AIでテキストを整えます。Clipsエージェントは、話した内容を探し出して、とりとめのない話を箇条書きにするなど書き直すこともできます。
    - q: Clipsはチーム内の専門用語を正しく書けますか？
      a: はい、用語を辞書に登録すれば可能です。1行に1語ずつ、または聞き間違えやすい言葉には「用語 → 置き換え」の形で追加します。用語のCSVファイルを読み込むこともできます。Clipsが貼り付けた直後に言葉を直すと、デスクトップアプリがその修正を辞書に保存し、次回に活かします。
    - q: ディクテーションは保存されますか？過去のものを探せますか？
      a: すべてのディクテーションは、元のテキストとクリーンアップ後のテキスト、時刻、長さとともに保存され、「ディクテーション」ページに日ごとにまとめて表示されます。Cmd+K を押して話した内容で検索するか、[Clipsエージェント](https://www.agent-native.com/docs/template-clips-agent/)に「昨日ディクテーションした内容を見せて」のように尋ねてください。ディクテーションはいつでも削除できます。
    - q: 音声はパソコンの外に送信されますか？
      a: 必ずしもそうではありません。Clips Desktopは、内蔵の音声認識またはLocal Whisperを使って、お使いのデバイス上で文字起こしできます（[Clipsの文字起こしエンジン](https://www.agent-native.com/docs/template-clips-features/)）。Builder.ioやご自身のキーを使う場合、ClipsはクリーンアップのためにディクテーションをそのAIサービスに送信します。各ディクテーションのテキストは、ご自身のClipsアカウントに保存されます。
