faqs:
  heading: よくある質問
  items:
    - q: Clipsは無料ですか？
      a: はい、Agent-Native Clipsは無料のオープンソースです。要約、タイトル、文字起こしの整形は、デフォルトで[Builder.io AIクレジット](https://www.agent-native.com/docs/template-clips-features/)を使って実行されます。クレジットがなくなると、クレジットを追加するかご自身のGeminiキーを接続するまで、これらの機能は停止します。Clipsはアルファ版のため、今後変更が加わる可能性があります。
    - q: ボットが会議に参加しますか？
      a: いいえ。Clipsはご自身のパソコンからノートを作成します。Clips Desktopがマイクと通話の音声を録音するので、ZoomやGoogle Meet、Microsoft Teamsの通話に何かが参加することはありません。ボットは参加しないため、ノートを取っていることは参加者に伝えておきましょう。
    - q: Clipsはどのカレンダーやビデオ通話アプリに対応していますか？
      a: カレンダーはGoogle Calendarのみに対応しています。ノートの作成は、Zoom、Google Meet、Microsoft Teams、Webex、そのほかパソコンから音声が再生されるあらゆる通話で使えます。Macでは、カレンダーにない通話もClips Desktopが検知して、ノートの開始を提案します。ほかの参加者の声を取り込めるのはMacのみです。
    - q: ClipsはWindowsでも議事録を作成できますか？
      a: Clips DesktopはMac、Windows、Linuxで動作しますが、ほかの参加者の声を取り込めるのはMacのみです。WindowsとLinuxではマイクの音声だけが録音されるため、リモート参加者は文字起こしとアクションアイテムに含まれません。
    - q: ZoomやGoogle MeetのAIノートテイカーとは何が違いますか？
      a: 通話アプリのAIノートテイカーは、そのアプリの通話にしか対応しません。Clipsなら、どの通話アプリの会議も1つのライブラリにまとまります。[Clipsエージェント](https://www.agent-native.com/docs/template-clips-agent/)に「先週の火曜日にDanielは何を約束した？」と尋ねれば、発言内容から会議を検索します。これが[エージェント型アプリ](https://www.agent-native.com/articles/what-is-an-agent-native-app/)です。エージェントの頭脳と、アプリの直感的な使いやすさを兼ね備えています。
