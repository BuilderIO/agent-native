faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Analyticsは無料ですか？
      a: はい、Agent-Native Analyticsは無料のオープンソースです。エージェントはBuilder.io AIクレジットかご自身のモデルキーで動き、各データソースにはStripeのシークレットキーなど、それぞれの認証情報が必要です。Analyticsはアルファ版のため、画面や機能が今後変わる可能性があります。
    - q: AnalyticsはどのツールからKPIを取得できますか？
      a: AnalyticsはStripe、HubSpot、PostHog、Mixpanel、Amplitude、Google Analytics（GA4）、BigQueryのほか、十数種類以上のデータソースに接続します。それぞれ専用のキーで[データソースページ](https://www.agent-native.com/docs/template-analytics-connectors/)から追加でき、1つのダッシュボードで複数のデータソースを組み合わせられます。
    - q: KPIダッシュボードを作るのにSQLの知識は必要ですか？
      a: いいえ。ダッシュボードを説明したり、普段の言葉で質問したりすれば、エージェントがSQLを書きます。クエリはどのグラフの裏でも見られるので、データに詳しい人が確認や編集をできます。
    - q: 数値が正しいかどうかはどうすればわかりますか？
      a: ダッシュボードのすべての数値は、エージェントが連携データに対して実行したクエリから得られたもので、どのグラフでもクエリと元のレコードを開けます。クエリを実行できなかった場合、エージェントはその数値に「Unverified」と印を付けます。ダッシュボードに頼る前に、いくつかの数値をStripeと照らし合わせましょう。
    - q: KPIダッシュボードは誰が見られますか？
      a: 共有するまでは自分だけです。[ダッシュボードを共有](https://www.agent-native.com/docs/sharing/)すれば、チームメンバーや組織全体が閲覧者、編集者、管理者として見られます。変更したフィルターは自分にだけ適用されます。共有したい場合は、ビューを保存するかリンクを送りましょう。
    - q: 分析ツールに付属するAIと何が違いますか？
      a: 1つの分析ツールに組み込まれたAIアシスタントは、そのツールのデータを扱います。AnalyticsはStripe、CRM、製品データを横断し、あなたが見ているダッシュボードそのものをエージェントが作成・編集するので、回答はそのまま残るパネルになります。これがAnalyticsを[エージェント型アプリ](https://www.agent-native.com/articles/what-is-an-agent-native-app/)にしている点です。エージェントの頭脳と、アプリの直感的な使いやすさを兼ね備えています。
