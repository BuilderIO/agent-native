faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Designは無料ですか？
      a: はい、Agent-Native Designは無料のオープンソースです。ページを作るには、Builder.io AIクレジットかご自身のAIキーによるAI接続が必要なので、AIを無制限に使えるわけではありません。Designはアルファ版のため、成長に合わせて変更が加わる可能性があります。
    - q: Designはランディングページを公開またはホストしますか？
      a: いいえ。Designはランディングページを作って書き出すところまでで、デプロイは今お使いのツールで行います。HTMLやファイルのZIPをダウンロードするか、コーディングエージェントがページをサイトに追加するためのプロンプトをコピーします。
    - q: 自社ブランドを使えますか？
      a: はい。Figmaファイル、Webサイト、GitHubリポジトリ、アップロードしたファイルからデザインシステムを作り、ページを作り始めるときに選びます。エージェントは、作るすべての案でその色、フォント、スタイルを守ります。
    - q: AIが作ったランディングページを後から編集できますか？
      a: はい。テキスト、色、余白、レイアウトをページ上で手作業で変えるか、セクションの変更をエージェントに頼めます。**バージョン履歴**から、いつでも以前の版に戻せます。
    - q: ランディングページを書き出すと何が得られますか？
      a: "**HTML をダウンロード**では、どのブラウザーでも開け、スタイルをインターネット経由で読み込む1つのファイルが得られます。**ZIP をダウンロード**にはページのすべてのファイルが入り、**Figma 用にダウンロード（SVG）**ではFigmaで編集できるレイヤーが得られます。ドキュメントで[すべての書き出し方法](https://www.agent-native.com/docs/template-design-features/#export)を確認できます。"
    - q: チャットボットにランディングページを頼むのと何が違いますか？
      a: チャットボットでは、ページを見るにはまず受け取ったコードをどこかに貼り付ける必要があります。Designでは、エージェントが見てクリックできるエディター上に、複数の案でページを作ります。同じページを手作業でも、依頼でも変更できます。これが[エージェント型アプリ](https://www.agent-native.com/articles/what-is-an-agent-native-app/)です。エージェントの頭脳と、アプリの直感的な使いやすさを兼ね備えています。
