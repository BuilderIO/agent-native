title: AIピッチデッキメーカー
seo_title: メモから作れるAIピッチデッキメーカー
meta_description: Agent-Native Slidesは、創業者のための無料AIピッチデッキメーカーです。メモやドキュメント、ウェブサイトからデッキを作成し、手作業でもエージェントでも編集できます。
updated: 2026-10-23
hero:
  body: Agent-Native Slidesは、メモやPDF、ウェブサイトから創業者向けのピッチデッキを作成します。エージェントが1枚ずつ作り、編集は手作業でも指示でも可能です。
  button:
    label: デッキを作成する
    url: https://slides.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8c62a5083d6f4836a73b216a59d6399f
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fec52329368a54aa5aa2df755a202c6ef
