faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Slidesは無料ですか？
      a: はい、Agent-Native Slidesは無料のオープンソースです。デッキの作成にはAIとの接続が必要で、Builder.ioを経由するか、ご自身のAIキーを使用します。画像の生成には、ご自身のGeminiまたはOpenAIのキーが必要です。Slidesはアルファ版のため、今後変更が加わる可能性があります。
    - q: ピッチデッキをPowerPointやGoogle Slidesにエクスポートできますか？
      a: Slidesは編集可能なPowerPoint（PPTX）ファイルを書き出せます。Google Slides向けには、インポート用リンク付きのPPTXファイルが用意されるので、ご自身でGoogle Slidesで開いてください。デッキを1つのHTMLファイルとして書き出すこともできます。
    - q: メモやドキュメント、ウェブサイトから作成を始められますか？
      a: Slidesのホーム画面でピッチの内容を入力し、メモやドキュメントを添付するか、ウェブサイトのリンクを追加してください。Google Doc、Wordファイル、PowerPointをインポートすることもできます。エージェントがPDFやウェブサイトを読み取れない場合は、推測せずにその旨をお知らせします。
    - q: チャットボットにスライドを書いてもらうのと何が違いますか？
      a: "チャットボットが返すのはテキストだけで、スライドへの貼り付けはご自身で行う必要があります。Slidesでは、エージェントが目に見えるエディター上で実際のデッキを作成します。同じデッキ上で、どのスライドも手作業またはエージェントへの指示で変更でき、すべての変更は元に戻せます。これこそがSlidesを[エージェント型アプリ](https://www.agent-native.com/articles/what-is-an-agent-native-app/)たらしめる点です。エージェントの頭脳と、アプリの直感的な使いやすさを兼ね備えています。"
    - q: 共同創業者と一緒にピッチデッキを編集できますか？
      a: あなたと共同創業者、そしてエージェントが、同じデッキを同時に編集できます。スライド全体にも、スライドの一部にもコメントできます。Slidesは大きな変更の前にバージョンを保存するため、いつでも以前のバージョンに戻せます。
    - q: ピッチデッキは何枚のスライドにすべきですか？
      a: "最初のピッチなら10枚前後がちょうどよい長さです（[ピッチデッキに入れるべき内容](https://www.agent-native.com/articles/how-to-make-a-pitch-deck-with-ai/)）。Slidesでも「このドキュメントから 10 枚のピッチ資料を作成」という候補が表示されます。別の長さにしたい場合はエージェントに伝えれば、それに合わせて構成案を作成します。"
