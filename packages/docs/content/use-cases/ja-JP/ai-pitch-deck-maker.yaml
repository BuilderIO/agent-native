how_to:
  heading: AIでピッチデッキを作る方法
  steps:
    - title: 手持ちの資料から始める
      body: Slidesのホーム画面で、作りたいデッキの内容を入力します。会社のこと、誰に向けたものか、どのくらいの長さにするかを伝えましょう。手元のメモやドキュメント、参考資料を添付して、デッキを作成します。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F12aade25b35944b396142acc3b8ff40c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff68c26a237fc45909db278af5b701e61
        alt: Slidesのプロンプト入力欄の拡大図。創業者のピッチの説明が入力され、メモファイルが添付され、その下に候補チップが並んでいます。
    - title: エージェントがスライドを作る様子を確認
      body: Slidesのエージェントは、まずピッチデッキの構成案を作成します。その後、エディター上でスライドを1枚ずつ作成していく様子を確認できます。PDFやウェブサイトを読み取れない場合は、その旨を伝えます。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F40529b37d7614ccc8ec582e933e57034
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3d3dd1d6c9eb4aafb791d086b46b4cd1
        alt: "Slidesエディターで、スライド1と2が完成し、ソリューションを示すスライド3がキャンバス上で生成中の様子。エージェントのチャットには構成案と「スライド3を追加中 · ソリューション」が表示されています。"
    - title: 完成したデッキを発表・エクスポート
      body: 完成したピッチデッキは、Slidesからフルスクリーンで発表することも、エクスポートすることもできます。編集可能なPowerPointファイル、Google Slidesに取り込めるファイル、または1つのHTMLファイルとして書き出せます。
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe65004f2089b48b6aaeb185fe529a28a
