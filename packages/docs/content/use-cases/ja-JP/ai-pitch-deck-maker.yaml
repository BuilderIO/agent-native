        alt: 完成したタイトルスライドの上に開いたSlidesのエクスポートメニューの拡大図。HTML、PDF、PowerPoint、Google Slidesの選択肢があります。
features:
  heading: デッキ作成からピッチまで、必要な機能がすべて揃っています
  items:
    - title: メモからピッチデッキを作成
      body: プロンプト、メモ、ドキュメント、前回のデッキから始められます。会社や資金調達ラウンドについてエージェントに伝えれば、デッキを作成します。
    - title: AIとビジュアル編集
      body: スライド上のテキストやレイアウトを自分で編集することも、行を選んでエージェントに頼むこともできます。変わるのは依頼した部分だけです。
    - title: すべてのスライドに自社ブランドを
      body: カラー、フォント、ロゴをデザインシステムとして保存すれば、作成するすべてのデッキが自社らしい見た目になります。
    - title: 画像とロゴ
      body: エージェントに画像の生成やストック写真の検索を頼んだり、トラクションのスライド用に顧客やパートナーのロゴを取り込んだりできます。
    - title: 共同創業者とのコラボレーション
      body: 共同創業者やエージェントと同じデッキを編集し、どのスライドにもコメントでき、以前のバージョンにいつでも戻せます。
    - title: ピッチ、共有、エクスポート
      body: スピーカーノートを見ながら発表したり、投資家に閲覧専用リンクを共有したり、編集可能なPowerPointファイルとして書き出したりできます。
