faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Analyticsは無料ですか？
      a: はい、Agent-Native Analyticsは無料のオープンソースです。エージェントはBuilder.io AIクレジットかご自身のAIキーで動くため、AIを無制限に使えるわけではありません。通話についての質問ではGongのAPIクレジットも使うことがあり、管理者がオフにできます。Analyticsはアルファ版です。
    - q: Agent-Native AnalyticsはどのCRMや通話ツールと連携できますか？
      a: AnalyticsはCRMとしてHubSpotに、営業の通話としてGongに接続します。連絡先や企業のデータ向けにApolloとClayにも接続できます。それぞれ専用のキーを使って[データソースページで接続](https://www.agent-native.com/docs/template-analytics-connectors/)し、1つの質問でHubSpotとGongの両方を使えます。
    - q: SQLを書く必要はありますか？
      a: いいえ。普段の言葉で質問すれば、エージェントがHubSpotやGongからデータを探してクエリを実行し、数値、表、グラフで答えます。回答をダッシュボードに保存すると、各パネルが最新データを取得する方法もエージェントが設定します。
    - q: 数値は信頼できますか？
      a: はい、確認したうえでお使いください。エージェントはHubSpotとGongのライブデータから答え、ライブクエリで得たものではない数値にはUnverifiedと印を付けます。チームの[セマンティックレイヤーページの定義](https://www.agent-native.com/docs/template-analytics-dashboards/)にも従います。最初の回答はHubSpotと照らし合わせてから活用しましょう。
    - q: Agent-Native Analyticsは、HubSpotやGongに付属するAIと何が違いますか？
      a: HubSpotやGongのAIは、それぞれのツールに組み込まれたものです。Analyticsは1つの質問にHubSpotとGongの両方から答え、StripeやBigQueryも読み取り、チームが毎週開くダッシュボードとして回答を残します。HubSpotとGongはこれまでどおり使い続け、Analyticsはその両方からデータを読み取ります。
    - q: ダッシュボードは誰が見られますか？
      a: 共有するまでは自分だけです。ダッシュボードはチームメンバーや組織全体に、閲覧者、編集者、管理者として共有できます。チームメンバーは自分の接続か、管理者が組織用に設定した接続を通じてHubSpotとGongのデータを見ます。どちらもない場合、それらのパネルにはエラーが表示されます。
