      body: ダッシュボードをSlackチャンネルに投稿したり、取引の表を連携済みGoogleアカウントの新しいGoogle Sheetsに書き出したりできます。
    - title: MCPであらゆるツールと連携
      logos:
        - name: Notion
        - name: Granola
        - name: Exa
      more: true
      body: チームが使っているツールをMCPで連携できます。URLを指定して任意のMCPサーバーを追加することもできます。
