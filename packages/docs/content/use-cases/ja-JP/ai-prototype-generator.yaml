faqs:
  heading: よくある質問
  items:
    - q: Agent-Native Designは無料ですか？
      a: はい、Agent-Native Designは無料のオープンソースです。エージェントには、Builder.io経由かご自身のAIキーによるAI接続が必要です。Designはアルファ版のため、成長に合わせて変更が加わる可能性があります。
    - q: PRDやプロダクトブリーフから始められますか？
      a: はい。ブリーフ、または製品要求仕様書（PRD）の該当部分をプロンプト欄に貼り付け、選択肢が欲しければ方向性を頼みます。エージェントは用語や主張を正確に守り、デザインを左右する選択がブリーフになければ、質問するか置いた前提を伝えます。[デザインブリーフに書くべきこと](https://www.agent-native.com/articles/how-to-turn-a-design-brief-into-a-prototype-with-ai/)もご覧ください。
    - q: プロトタイプはクリックして操作できますか？
      a: はい。各画面は操作が実際に動く本物のHTMLで、選んだ方向性にはデフォルトでデスクトップとモバイルのフレームが付きます。**インタラクト**モードでキャンバス上で試すか、**Design プレビュー**で画面をブラウザーの新しいタブに開けます。
    - q: 自社のデザインシステムやFigmaのデザインを使えますか？
      a: はい。[デザインシステム](https://www.agent-native.com/docs/template-design-features/)は、Figmaファイル、Webサイト、GitHubリポジトリ、design.mdファイル、メモから作れ、新しいデザインはそれに従います。Figmaのフレームを編集可能な画面として取り込むこともでき、正確に再現できなかった部分はDesignが一覧にします。
    - q: プロトタイプはそのまま本番のコードになりますか？
      a: いいえ。プロトタイプは出発点で、アプリのロジック、連携、テスト、デプロイはこれから作る必要があります。HTMLやファイルのZIPを書き出すか、**コーディング引き継ぎをコピー**でファイル、デザイントークン、すぐ使えるプロンプトをコーディングエージェントに渡せます。Claude CodeとCodexは[DesignのMCPサーバー経由でデザインを開く](https://www.agent-native.com/docs/template-design-integrations/)こともできます。
    - q: チャットボットにUIを頼むのと何が違いますか？
      a: Designでは、エージェントがキャンバス上にプロトタイプを作り、そこでクリックして試し、方向性を比べ、編集できます。チームのコメントもそのままエージェントに届きます。チャットボットでは、結果は会話の中にとどまります。だからDesignは[エージェント型アプリ](https://www.agent-native.com/articles/what-is-an-agent-native-app/)なのです。エージェントの頭脳と、アプリの直感的な使いやすさを兼ね備えています。
