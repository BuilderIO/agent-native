faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Plan مجاني؟"
      a: "نعم، Agent-Native Plan مجاني ومفتوح المصدر. يشغّل كل ملخص مرئي جلسة وكيل كاملة على النموذج الذي تختاره، فالتغييرات الأكبر تستهلك من ذلك النموذج أكثر. لا يزال Plan في مرحلة ألفا، فتوقّع تغييرات."
    - q: "متى يستحق التغيير ملخصًا مرئيًا؟"
      a: "شغّل الملخص المرئي على التغييرات الكبيرة: التي تمتد عبر عدة ملفات، أو تمسّ مخطط البيانات أو الـ API أو طريقة ترابط أجزاء التطبيق. أما التغيير الصغير في ملف واحد، فقراءة الـ diff مباشرة أسرع من انتظار ملخص."
    - q: "كيف يختلف الملخص المرئي عن قراءة الـ diff؟"
      a: "يسرد الـ diff كل سطر تغيّر، ملفًا بعد ملف. أما الملخص المرئي فيبدأ بما يفعله التغيير: الشاشات التي عدّلها كمخططات أولية، وحقول البيانات التي غيّرها، وخريطة للملفات المعنية. ثم يعرض الفروقات الجديرة بالقراءة فقط، مع ملاحظات."
    - q: "مع أي وكلاء برمجة يعمل Plan؟"
      a: "يجهّز أمر التثبيت Plan في Claude Code وCodex وCursor وOpenCode وGitHub Copilot في VS Code وClaude Cowork، ويسجّل دخولك. ويعمل Plan أيضًا في Cline وGoose وأي وكيل آخر يتصل بخوادم MCP، عبر موصله المستضاف."
    - q: "هل يمكنني الحصول على ملخص لكل طلب سحب؟"
      a: "نعم. [PR Visual Recap GitHub Action](https://www.agent-native.com/docs/pr-visual-recap/) يشغّل Claude Code أو Codex أو أي نموذج متوافق مع OpenAI بمفتاح API الخاص بك مع كل push. ويُبقي تعليقًا واحدًا على طلب السحب محدّثًا، مع لقطة شاشة للملخص، ولا يمنع الدمج أبدًا. وتُقتطع الفروقات التي تتجاوز نحو 600 KB."
    - q: "من يمكنه رؤية ملخصاتي؟"
      a: "افتراضيًا، لا يفتح الملخص إلا من سجّل الدخول إلى مؤسستك؛ واجعله خاصًا فلا يفتحه غيرك. ومع GitHub Action، يرى لقطة الملخص كل من يرى طلب السحب. و[وضع الملفات المحلية](https://www.agent-native.com/docs/template-plan-local-and-desktop/) يُبقي الملخص خارج التطبيق المستضاف، مع أن نموذج وكيلك يظل يعمل حيث يعمل دائمًا."
