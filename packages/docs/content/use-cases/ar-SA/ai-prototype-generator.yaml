how_to:
  heading: "كيف تحوّل موجزًا إلى نموذج أولي بالذكاء الاصطناعي"
  steps:
    - title: "صِف الشاشة التي تحتاجها"
      body: "في الشاشة الرئيسية لـ Design، الصق موجزك في مربع المطالبة: لمن هو، والشاشة أو المسار، وما يجب أن يفعله. واطلب ثلاثة اتجاهات. وإن غاب شيء مهم، يسألك Design أولًا."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ef31fb673e2437fb4dd6ed256a7ba9d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8209bd4f55d7432c94e05172c5475f17
        alt: "لقطة مقرّبة لمربع المطالبة في الشاشة الرئيسية لـ Design، وفيه موجز قصير لمسار تهيئة تطبيق مصروفات، ينتهي بعبارة «Show me three directions»."
    - title: "اختر الاتجاه الذي يعجبك"
      body: "يضع Design ثلاثة اتجاهات جنبًا إلى جنب على اللوحة، كل منها شاشة تعمل بأسلوبها الخاص. جرّب كلًا منها في **تفاعل**، واختر واحدًا من **اختر اتجاهًا**، فيبني الوكيل بقيته."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F137893c57370435d94967b9d5bc6a82a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fda7cdd9a2f3e42b58f44efec2b950fc9
        alt: "اللوحة وعليها اتجاهات التهيئة الثلاثة جنبًا إلى جنب، ومحادثة الوكيل تعرض «Pick a direction» مع زر لاسم كل اتجاه."
    - title: "حسّنه مع فريقك"
      body: "عدّل النصوص والمسافات والألوان في تبويب **التصميم**، أو حدّد عنصرًا واطلب من الوكيل. وعندما يثبّت زميل تعليقًا، انقر على **إرسال إلى الوكيل** فيُجري الوكيل ذلك التغيير."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F406b66f9b62e49c09f697f5d08599b5e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F566ca2f3c44f439aac2c5307c72aa572
        alt: "شاشة التهيئة المختارة مع تعليق زميل مثبّت على خطوة الدعوة، وسلسلة التعليق مفتوحة في تبويب Comments مع زر Send to agent."
features:
  heading: "كل ما تحتاجه للانتقال من الموجز إلى النموذج الأولي"
  items:
    - title: "قابل للنقر من البداية"
      body: "يصبح الاتجاه الذي تختاره HTML بتفاعلات تعمل، في إطاري سطح المكتب والجوال. ويفتحه **معاينة Design** في تبويب متصفح."
    - title: "يحافظ على كلمات موجزك"
      body: "يستخدم الوكيل مصطلحاتك وادعاءاتك. وعندما يُغفل الموجز خيارًا مهمًا، يسألك أو يصرّح بافتراضه."
    - title: "مفحوص قبل أن يجهز"
      body: "يُجري الوكيل فحصه الخاص لإمكانية الوصول والمظهر على النموذج الأولي قبل أن يخبرك بأن التصميم جاهز."
    - title: "نماذج أولية بهوية علامتك"
      body: "أنشئ نظام تصميم من ملف Figma أو موقعك أو مستودع GitHub، فتبدأ النماذج الأولية الجديدة بألوانك وخطوطك."
    - title: "ملاحظات ينفّذها الوكيل"
      body: "يبقى التعليق مثبّتًا على عنصره. يعدّل الوكيل ذلك الموضع، ويتأكد من التغيير، ثم يغلق السلسلة أو يطلب منك أن تقرر."
    - title: "سلّمه لوكلاء البرمجة"
      body: "صدّر HTML أو ملف ZIP بالملفات، أو انسخ مطالبة جاهزة تعطي وكيل البرمجة الملفات ورموز التصميم."
