faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Design مجاني؟"
      a: "نعم، Agent-Native Design مجاني ومفتوح المصدر. يحتاج الوكيل إلى اتصال بالذكاء الاصطناعي، إما عبر Builder.io أو عبر مفتاح الذكاء الاصطناعي الخاص بك. لا يزال Design في مرحلة ألفا، فتوقّع تغييرات مع تطوّره."
    - q: "هل يمكنني البدء من وثيقة متطلبات المنتج أو موجز المنتج؟"
      a: "نعم. الصق الموجز، أو الجزء المعني من وثيقة متطلبات المنتج (PRD)، في مربع المطالبة، واطلب اتجاهات إن أردت خيارات. يحافظ الوكيل على مصطلحاتك وادعاءاتك كما هي، وإن أغفل الموجز خيارًا يغيّر التصميم، يسأل أو يصرّح بافتراضه. وإليك [ما تضعه في موجز التصميم](https://www.agent-native.com/articles/how-to-turn-a-design-brief-into-a-prototype-with-ai/)."
    - q: "هل يمكنني التنقل في النموذج الأولي بالنقر؟"
      a: "نعم. كل شاشة HTML حقيقي بتفاعلات تعمل، والاتجاه الذي تختاره يحصل على إطاري سطح المكتب والجوال افتراضيًا. استخدم وضع **تفاعل** لتجربته على اللوحة، أو **معاينة Design** لفتح الشاشة في تبويب متصفح جديد."
    - q: "هل يمكنني استخدام نظام التصميم الخاص بي أو تصاميم Figma؟"
      a: "نعم. يمكن أن يأتي [نظام التصميم](https://www.agent-native.com/docs/template-design-features/) من ملف Figma أو موقعك أو مستودع GitHub أو ملف design.md أو ملاحظات، وتتبعه التصاميم الجديدة. ويمكنك أيضًا استيراد إطار Figma كشاشة قابلة للتعديل، ويسرد Design ما لم يستطع مطابقته بدقة."
    - q: "هل النموذج الأولي كود جاهز للإنتاج؟"
      a: "لا. النموذج الأولي نقطة بداية، ولا يزال منطق التطبيق والتكاملات والاختبار والنشر بحاجة إلى بناء. صدّر HTML أو ملف ZIP بالملفات، أو استخدم **نسخ مطالبة الوكيل** لتعطي وكيل البرمجة الملفات ورموز التصميم ومطالبة جاهزة. ويمكن لـ Claude Code وCodex أيضًا [فتح التصاميم عبر خادم MCP الخاص بـ Design](https://www.agent-native.com/docs/template-design-integrations/)."
    - q: "كيف يختلف Design عن طلب واجهة من روبوت محادثة؟"
      a: "في Design، يبني الوكيل النموذج الأولي على لوحة تتنقل فيه بالنقر، وتقارن الاتجاهات، وتعدّله، وتصل تعليقات فريقك إلى الوكيل مباشرة. أما مع روبوت المحادثة، فتبقى النتيجة داخل المحادثة. وهذا ما يجعل Design [تطبيقًا وكيليًا](https://www.agent-native.com/articles/what-is-an-agent-native-app/): ذكاء الوكيل وسهولة التطبيق."
