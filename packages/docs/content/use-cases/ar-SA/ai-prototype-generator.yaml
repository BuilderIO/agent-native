  body: "يبني Agent-Native Design الشاشات التي يصفها موجز المنتج أو التصميم، كـ HTML يعمل وتستطيع تجربته. اطلب من وكيل الذكاء الاصطناعي بضعة اتجاهات، ثم حسّن ما تختاره بيدك أو بالطلب."
