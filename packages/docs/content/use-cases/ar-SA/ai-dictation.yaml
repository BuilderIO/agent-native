faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Clips مجاني؟"
      a: "نعم. Agent-Native Clips مجاني ومفتوح المصدر، والإملاء الصوتي مفعّل افتراضيًا في تطبيق سطح المكتب. يعمل التنظيف بالذكاء الاصطناعي على أرصدة Builder.io للذكاء الاصطناعي أو على مفتاحك الخاص، فهو ليس غير محدود. لا يزال Clips في مرحلة ألفا، فتوقّع تغييرات مع تطوّره."
    - q: "كيف يختلف Clips عن الإملاء المدمج في جهازي؟"
      a: "الإملاء المدمج لا يحتاج إلى إعداد، لكنه لا يحتفظ بـ[سجل قابل للبحث لما قلته](https://www.agent-native.com/articles/what-should-you-look-for-in-dictation-software/). أما Clips فيحفظ كل إملاء بنصه الأصلي والمنظّف، ويتعلم كلماتك وينقّح النص بالذكاء الاصطناعي. ويستطيع وكيل Clips أن يجد ما قلته ويعيد صياغته، كأن يحوّل كلامًا متشعبًا إلى نقاط."
    - q: "هل سيكتب Clips مصطلحات فريقي بشكل صحيح؟"
      a: "نعم، متى أصبحت المصطلحات في قاموسك. أضفها واحدًا في كل سطر، أو بصيغة «مصطلح → بديل» لكلمة يسيء سماعها دائمًا. ويمكنك أيضًا استيراد ملف CSV بالمصطلحات. وعندما تصحّح كلمة بعد لصق Clips لها مباشرة، يحفظ تطبيق سطح المكتب هذا التصحيح في قاموسك للمرة القادمة."
    - q: "هل تُحفظ إملاءاتي، وهل أستطيع العثور على إملاء قديم؟"
      a: "يُحفظ كل إملاء بنصه الأصلي والمنظّف ووقته ومدته، ويظهر في صفحة إملاء مجمّعًا حسب اليوم. اضغط Cmd+K للبحث فيها بما قلته، أو اسأل [وكيل Clips](https://www.agent-native.com/docs/template-clips-agent/)، مثل «أرني ما أمليته أمس». ويمكنك حذف أي إملاء."
    - q: "هل يغادر صوتي جهازي؟"
      a: "لا يلزم ذلك. يستطيع Clips Desktop تحويل الكلام إلى نص على جهازك، بالتعرف المدمج على الكلام أو Local Whisper ([محركات النسخ في Clips](https://www.agent-native.com/docs/template-clips-features/)). ومع Builder.io أو مفتاحك الخاص، يرسل Clips إملاءك إلى خدمة الذكاء الاصطناعي تلك لتنظيفه. ويُحفظ نص كل إملاء في حساب Clips الخاص بك."
