faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Analytics مجاني؟"
      a: "نعم، Agent-Native Analytics مجاني ومفتوح المصدر. استخدم التطبيق المستضاف، أو [شغّل نسختك الخاصة](https://www.agent-native.com/docs/template-analytics/). البيانات منك: أحداثك أنت، أو الأدوات التي تربطها. لا يزال Analytics في مرحلة ألفا، فتوقّع تغييرات."
    - q: "هل أحتاج إلى معرفة SQL؟"
      a: "لا. اسأل بلغة عادية، فيكتب الوكيل SQL ويشغّله، ثم يجيب بمخطط أو جدول أو رقم. واطلب رؤية الاستعلام متى أردت التحقق منه. وقد يحتاج شخص يعرف بياناتك إلى [ربط مصادرك](https://www.agent-native.com/docs/template-analytics-connectors/) أولًا."
    - q: "من أين تأتي إعادات الجلسات؟"
      a: "من تطبيق الويب الخاص بك. أنشئ مفتاحًا عامًا في **مصادر البيانات**، ثم أضف مقتطف التتبع القصير من صفحة **الجلسات** إلى تطبيقك، مع تفعيل إعادة الجلسات. واربط مساحة تخزين للتسجيلات: Builder.io أو حاوية S3 الخاصة بك. وافتراضيًا، [تسجّل إعادات الجلسات](https://www.agent-native.com/docs/template-analytics-monitoring-and-sessions/) المستخدمين المسجّلين دخولهم فقط."
    - q: "ماذا تسجّل إعادة الجلسة؟"
      a: "تعيد إعادة الجلسة عرض الصفحة والنقرات والتمرير ومخرجات وحدة التحكم وطلبات الشبكة. الكتابة مخفية افتراضيًا، والحقول المسمّاة ككلمات مرور أو بيانات بطاقات لا تُلتقط أبدًا. ولإخفاء أي شيء آخر، أضف class إلى ذلك الجزء من الصفحة."
    - q: "هل يمكنني استخدام بياناتي في PostHog أو Amplitude أو Mixpanel؟"
      a: "نعم. اربطها في **مصادر البيانات** واسأل عن الأحداث التي تتبّعها هناك. يستعلم الوكيل كل أداة نيابةً عنك. أما إعادات الجلسات فتأتي من تتبّع Analytics نفسه فقط، فأضفه إلى تطبيقك لتشاهد من توقفوا."
    - q: "كيف يختلف Analytics عن الذكاء الاصطناعي في أداة التحليلات لديّ؟"
      a: "الذكاء الاصطناعي في أداة التحليلات يعمل على بيانات تلك الأداة. أما وكيل Analytics فيعمل عبر كل مصدر تربطه، ويجد جلسات الأشخاص الذين توقفوا بالضبط، ويشرح أيًا منها أو يسلّمه إلى وكيل البرمجة. وهو مفتوح المصدر أيضًا. وهذا [تطبيق وكيلي](https://www.agent-native.com/articles/what-is-an-agent-native-app/): ذكاء الوكيل وسهولة التطبيق."
