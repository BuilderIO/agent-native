title: "اعرف أين يتوقف المستخدمون الجدد"
seo_title: "تحليل مسار التحويل بالذكاء الاصطناعي وإعادة الجلسة"
meta_description: "اسأل Agent-Native Analytics بلغة عادية عن خطوة التسجيل التي تخسر فيها المستخدمين الجدد، واحصل على المسار من أحداثك، ثم شاهد جلسات من غادروا."
updated: 2026-10-27
hero:
  body: "اسأل Agent-Native Analytics عن خطوة التسجيل التي تخسر فيها أكبر عدد من الناس، فيبني الوكيل المسار من أحداثك أنت. ثم شاهد إعادة جلسات من غادروا واسأل الوكيل عن السبب."
  button:
    label: "اكتشف أين تخسرهم"
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F55295bda356c490984f639946e838ebe
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd84d0fd7f856406e85b739ac0429b0f3
    alt: "نافذة Analytics على لوحة «Activation funnel». للمسار أربع خطوات: Signed up وCreated a project وConnected a data source وInvited a teammate. تعرض كل خطوة عددها ونسبتها من التسجيلات والانخفاض عن الخطوة السابقة، وأكبر انخفاض عند Created a project. وتشرح محادثة الوكيل بجانبها أين توقفت تسجيلات الأسبوع الماضي."
how_to:
  heading: "كيف تحلّل مسار التحويل بالذكاء الاصطناعي"
  steps:
    - title: "اسأل أين يتوقف المستخدمون الجدد"
      body: "أدخل أحداث التسجيل إلى Analytics. اسأل في **اسأل**، فيكتب الوكيل SQL ويضيف [لوحة مسار](https://www.agent-native.com/docs/template-analytics-dashboards/) بعدد كل خطوة والانخفاض فيها. جرّب: «أضف مسارًا إلى لوحة Activation funnel: أين توقفت تسجيلات الأسبوع الماضي؟»"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa752431cecb8420c88d3d6a8f7980ea9
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F16ab210c27504ed1b71c37ebdabea744
        alt: "محادثة الوكيل مع ذلك الطلب ورد الوكيل، بجانب المسار الذي أضافه. الخطوات: Signed up 1,240، وCreated a project 612، وConnected a data source 418، وInvited a teammate 302، ولكل منها الانخفاض."
    - title: "اعثر على من توقفوا"
      body: "فعّل فرز الجلسات في إعدادات Analytics. في **الجلسات**، افتح **الأحداث**. اختر **حدث** للخطوة السابقة للانخفاض، مثل «signed_up»، و**لم يحدث** للخطوة التي لم يصلوا إليها، مثل «project_created»."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F327bf36c28ab452da87cf4f4dc65debe
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F49b79e0de78041bb93444ec4d24ce11a
        alt: "لقطة مقرّبة لصفحة Sessions وفلتر Events مفتوح، وsigned_up مضبوط على Did وproject_created على Didn't. وتحته القائمة المفلترة لجلسات المستخدمين الجدد، ولكل منها مدتها وصفحتها والنقرات الغاضبة."
    - title: "اسأل عمّا حدث في الجلسة"
      body: "افتح إعادة الجلسة لتشاهد الصفحة والنقرات وطلبات الشبكة. انقر على **اسأل الوكيل عن هذه الجلسة** واسأل «ماذا حدث في هذه الجلسة؟». يلخّص الوكيل الأخطاء والنقرات المتكررة والصفحات التي رآها ذلك الشخص."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7e0b3a4750a143f6bcd609e1c5460fd2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe44e9321e80d4c3f826bd7b25fa54025
        alt: "إعادة جلسة لمستخدم جديد في صفحة إنشاء مشروع، وإجابة الوكيل بجانبها. كتب الشخص اسم المشروع ونقر على Create project ثلاث مرات. وفشل الطلب إلى API المشاريع في كل مرة، فغادر."
features:
  heading: "كل ما تحتاجه لتكتشف أين تخسرهم وتعالجه"
  items:
    - title: "التخطي ليس مغادرة"
      body: "أخبر الوكيل بالخطوات التي يمكن تخطيها، فيفصل المسار من تخطّاها عمّن غادر التطبيق عندها."
    - title: "أسماء أحداثك أنت"
      body: "يصف المسؤولون أحداثك ومقاييسك في صفحة **الطبقة الدلالية**، ويستخدم الوكيل تلك الأسماء بالضبط في كل استعلام."
    - title: "شاهد الطلب الفاشل"
      body: "افتح **أدوات المطوّر** في إعادة الجلسة لتقرأ وحدة التحكم وطلبات الشبكة، وانتقل إلى لحظة فشل الطلب."
    - title: "جلسات منقّحة للوكلاء"
      body: "يحصل الوكيل الخارجي على سجلات وحدة التحكم والشبكة من الجلسة، والأخطاء أولًا، لا التسجيل نفسه. وتنتهي صلاحية رابطه بعد ساعتين."
    - title: "خاصة افتراضيًا"
      body: "الكتابة مخفية في كل إعادة جلسة، وأنت تختار الأجزاء الأخرى من الصفحة التي تبقى مخفية."
    - title: "المسار كل يوم"
      body: "اطلب من الوكيل إرسال لوحة المسار يوميًا، في الوقت الذي تختاره، بالبريد لما يصل إلى خمسة أشخاص أو إلى Slack."
