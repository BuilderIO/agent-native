faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Plan مجاني؟"
      a: "نعم، [Agent-Native Plan](https://www.agent-native.com/docs/template-plan/) مجاني ومفتوح المصدر. وكيل البرمجة لديك هو من يرسم الشاشات، فتعمل كل خطة على نموذج وكيلك وتُحتسب من استخدامه، والخطة الأطول تستهلك أكثر. لا يزال Plan في مرحلة ألفا، فتوقّع تغييرات."
    - q: "ما وكلاء البرمجة التي تعمل مع Plan؟"
      a: "لدى Agent-Native Plan إضافات لـ Claude Code وCodex. ويجهّز أمر التثبيت Cursor وOpenCode وGitHub Copilot بالطريقة نفسها، فيضيف `/visual-plan` مع تسجيل دخول لمرة واحدة. أما Cline وGoose والوكلاء الآخرون الذين يدعمون MCP فيتصلون بإضافة عنوان URL الخاص بـ Plan."
    - q: "كيف أغيّر ما تعرضه الخطة؟"
      a: "تغيّر الشاشة [بالتعليق عليها](https://www.agent-native.com/docs/template-plan-review-workflow/)، فيعيد وكيل البرمجة رسمها. لا يتيح Plan سحب أجزاء الشاشة أو تغيير حجمها يدويًا. أما الخطة المكتوبة تحت الشاشات فمختلفة: يمكنك تعديل نصها مباشرة."
    - q: "هل ستطابق الشاشات تطبيقي الحالي؟"
      a: "نعم، عندما تكون الشاشة جزءًا من تطبيق لديك بالفعل. قبل الرسم، يقرأ وكيل البرمجة كود تطبيقك وتخطيطه ومكوّناته، فتعرض الخطة الشريط الجانبي وشريط الأدوات والقوائم الحقيقية. أما التطبيق الجديد كليًا فتُرسم شاشاته من وصفك."
    - q: "كيف يختلف Plan عن وضع التخطيط في وكيل البرمجة لديّ؟"
      a: "يعمل Plan مع وضع التخطيط في وكيلك ويعرض خطته كشاشات. أعطِ `/visual-plan` خطة من Claude Code أو Codex أو Markdown كتبها وكيلك بالفعل، فيحوّلها Plan إلى الشاشات التي تصفها، جاهزة لتعليقات مثبّتة على الموضع المحدد."
