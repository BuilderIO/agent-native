title: "خطّط للشاشات الجديدة مع وكيل البرمجة"
seo_title: "تخطيط الواجهات لـ Claude Code وCodex وCursor"
meta_description: "مع Agent-Native Plan تخطّط أنت ووكيل البرمجة لشاشة كمخططات أولية في تخطيط تطبيقك الحقيقي، حالةً بحالة. علّق فيعدّل الوكيل، ثم يبني."
updated: 2026-10-27
hero:
  body: "مع Agent-Native Plan، يخطّط وكيل البرمجة لشاشة جديدة كمخططات أولية لكل حالة، داخل تخطيط تطبيقك الحقيقي. علّق على ما يجب تغييره، فيعيد الوكيل رسم الخطة قبل البناء."
  button:
    label: "خطّط لشاشة"
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4f78a2d9f380427bb3da0723b14fcbe4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8547890f69d44a0bb7e9d9d05246850a
    alt: "خطة لشاشة Invoices جديدة في Plan. ثلاثة إطارات مرسومة جنبًا إلى جنب: قائمة الفواتير، وحالتها الفارغة، وخطأ فشل الدفع، وكل منها داخل الشريط الجانبي وشريط الأدوات الخاصين بتطبيق الفوترة. وتعليق مثبّت على فلتر الحالة في القائمة، وتبدأ الخطة المكتوبة تحتها."
how_to:
  heading: "كيف ترسم مخططًا أوليًا لشاشة قبل أن يبنيها وكيل البرمجة"
  steps:
    - title: "اطلب الشاشة من وكيلك"
      body: "أضف Plan إلى Claude Code أو Codex أو Cursor أو OpenCode أو GitHub Copilot [بأمر تثبيت واحد](https://www.agent-native.com/docs/plan-plugin/)، ثم اكتب `/visual-plan` وصِف الشاشة التي تريدها. يقرأ وكيل البرمجة تطبيقك، ويرسم الشاشة، ويرد برابط الخطة."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F96c7a6d6f73a42ed96a551c112cb269a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F60c66f4f9b2442a290e2a258cc70b3f2
        alt: "لقطة مقرّبة لمحادثة وكيل برمجة: طلب /visual-plan لشاشة Invoices فيها فلتر حالة وحالة فارغة وخطأ فشل الدفع. يقرأ الوكيل خمسة من ملفات التخطيط والمكوّنات في التطبيق، وينشئ الخطة، ويرد برابط مراجعتها."
    - title: "علّق على ما يجب تغييره"
      body: "افتح الخطة، وانقر على الموضع الخاطئ في الشاشة تحديدًا، واكتب ما يجب تغييره. اضبط التعليق على **الوكيل** ليعمل عليه وكيل البرمجة، أو على **بشري** ليعالجه زميل."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb9adb0ff68324479a0c18c8124a77b2e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F765ae87885404c408e1f4ee46d15711d
        alt: "لقطة مقرّبة لإطار قائمة الفواتير مع تعليق مثبّت على فلتر الحالة. مربع التعليق مضبوط على Agent ونصه: اجعل فلتر الحالة أزرارًا مقسّمة فيها All وPaid وOverdue."
    - title: "أرسل تعليقاتك إلى الوكيل"
      body: "انقر على **إرسال إلى الوكيل**، واختر **نسخ لوكيلك**، والصق المطالبة في محادثة وكيلك. يحدّث وكيل البرمجة الخطة ويغلق التعليقات التي عالجها. وعندما تبدو الشاشة صحيحة، اطلب من الوكيل بناءها."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9263e46c4be445389bfc97bee3a78e74
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5910f3c944e9443aafe166a356c27bff
        alt: "لقطة مقرّبة لزر Send to agent مع 3 تعليقات مفتوحة. قائمته مفتوحة وفيها خياران: Copy for your agent وSend to inline agent."
features:
  heading: "كل ما تحتاجه لتضبط الشاشة من البداية"
  items:
    - title: "مرسومة داخل تطبيقك الحقيقي"
      body: "يقرأ وكيل البرمجة شاشاتك ومكوّناتك الحالية قبل أن يرسم، فتحافظ الشاشة الجديدة على الشريط الجانبي وشريط الأدوات والقوائم في أماكنها."
    - title: "كل حالات الشاشة"
      body: "يرسم وكيلك إطارًا لكل حالة مهمة، مثل التحميل أو الفراغ أو الخطأ أو قائمة مفتوحة، فترى ما تُغفله المطالبة."
    - title: "تعليقات على العنصر نفسه"
      body: "يتلقى وكيل البرمجة الزر أو الصف أو البطاقة المثبّت عليها كل تعليق، فتكفي ملاحظة قصيرة مثل «اجعلها أزرارًا مقسّمة»."
    - title: "التعليقات المفتوحة تبقى مفتوحة"
      body: "يتأكد وكيل البرمجة من تطبيق كل تغيير قبل أن يغلق التعليق، فيبقى أي شيء فاته بانتظارك."
    - title: "نموذج أولي للمسارات متعددة الخطوات"
      body: "لمسار مثل التهيئة أو الدفع، يضيف وكيلك نموذجًا أوليًا قابلًا للنقر في تبويب **نموذج أولي**، بجانب الشاشات."
    - title: "راجعها مع فريقك"
      body: "شارك الخطة برابط ليفتح زملاؤك الشاشات في متصفحهم. ويمكن لأي شخص لديه حساب Agent-Native إضافة تعليقات."
