faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Content مجاني؟"
      a: "نعم، Agent-Native Content مجاني ومفتوح المصدر. يقرأ وكيل البرمجة المواصفات ويعدّلها على نموذجه الخاص، فيُحتسب ذلك من استخدام وكيلك. ويعمل الوكيل المدمج في Content على أرصدة Builder.io أو مفتاح النموذج الخاص بك. لا يزال Content في مرحلة ألفا، فتوقّع تغييرات."
    - q: "ما وكلاء البرمجة التي تستطيع قراءة مواصفاتي؟"
      a: "يفتح Claude Code وCodex الصفحة من **مشاركة** ويطلبان منك الربط مرة واحدة. ويضيف Cursor وGitHub Copilot في VS Code تطبيق Content هناك بنقرة واحدة. ويتصل Claude Cowork وGoose وOpenCode من الطرفية، ويمكن لأي عميل MCP يدعم تسجيل الدخول [الاتصال بـ Content بعنوان URL الخاص به](https://www.agent-native.com/docs/external-agents/#private-content-links). ولا يرى كل وكيل إلا ما يستطيع حسابك رؤيته."
    - q: "كيف يختلف هذا عن ملف مواصفات في مستودعي؟"
      a: "ملف المواصفات في المستودع نسخة لا يعدّلها عادةً إلا من يعمل على الكود. أما في Content، فيكتب فريقك ويعلّق على الصفحة نفسها التي يقرؤها وكيل البرمجة، وتصل تغييرات الوكيل كاقتراحات. وإن أردت Markdown في المستودع أيضًا، فإن Content [يتزامن مع مجلد محلي](https://www.agent-native.com/docs/template-content-sync/)."
    - q: "هل يمكن لوكيل البرمجة تغيير المواصفات؟"
      a: "نعم، بالصلاحيات التي يملكها حسابك. اطلب منه اقتراح تعديلات، فتبقى الصفحة كما هي حتى تقبل كل تعديل. ويمكنه أيضًا تعديل الصفحة مباشرة، لكن إن تغيّرت الصفحة بعد أن قرأها الوكيل، يرفض Content التعديل. ويحتفظ [سجل الإصدارات](https://www.agent-native.com/docs/template-content-editing/) بالنسخ السابقة."
    - q: "هل يمكنني إبقاء مواصفاتي في مستودعي؟"
      a: "نعم. اربط [مجلد Markdown أو MDX محليًا](https://www.agent-native.com/docs/template-content-local-files/) في Content واسحب التغييرات أو افحصها أو ادفعها، أو شغّل Content من مستودعك بأمر واحد. وتُعرض التعارضات لتراجعها. ولا يستطيع المتصفح قراءة الملفات المحلية وحده، لذا يحتاج هذا إلى تطبيق Content محلي أو Agent-Native Desktop."
