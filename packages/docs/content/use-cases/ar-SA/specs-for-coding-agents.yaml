title: "اكتب مواصفات يقرؤها وكيل البرمجة"
seo_title: "مواصفات لـ Claude Code وCodex وCursor"
meta_description: "يحفظ Agent-Native Content مواصفاتك في صفحة واحدة يقرؤها Claude Code أو Codex أو Cursor عبر MCP، فيبني وكيلك من النسخة التي يعدّلها فريقك الآن."
updated: 2026-10-27
hero:
  body: "يحوّل Agent-Native Content ملاحظاتك إلى مواصفات تعمل منها أنت وفريقك ووكيل البرمجة في صفحة واحدة. يقرأ Claude Code أو Codex أو Cursor الصفحة الحية ويقترح تغييرات تقبلها."
  button:
    label: "اكتب مواصفات"
    url: https://content.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd7f1bf8fa6054abcafa30bd60751ae40
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F93c61e2bc6ba476a938b13934f237b0c
    alt: "مواصفات بعنوان «Team invites» مفتوحة في Content، فيها أقسام Goals وNon-goals وDecisions وOpen questions، وشجرة الصفحات على اليسار. وأضافت محادثة الوكيل على اليمين قرارًا بشأن مدة صلاحية روابط الدعوة."
how_to:
  heading: "كيف تكتب مواصفات لوكيل البرمجة"
  steps:
    - title: "اكتب المواصفات مع الوكيل"
      body: "انقر على **+** في الشريط الجانبي، واختر **صفحة** والصق ملاحظاتك، أو اطلب من [الوكيل المدمج في Content](https://www.agent-native.com/docs/template-content/) «اكتب مسودة PRD لميزة جديدة» منها. عدّلها بيدك، أو حدّد قسمًا واطلب إعادة كتابته."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2f4dd334ddfa4ec5bd74e67315414e8b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F15247dff32574395a608e454b510e22b
        alt: "محادثة الوكيل تطلب مواصفات لدعوات الفريق من ملاحظات اجتماع. ويسرد رد الوكيل الأقسام التي كتبها، بجانب الصفحة الجديدة."
    - title: "افتحها في وكيل البرمجة"
      body: "في **مشاركة**، افتح **الوكلاء** واختر **فتح في Claude Code** أو **فتح في Codex**. يقرأ وكيلك الصفحة، أو يطلب منك أولًا ربط Content. ولـ Cursor أو VS Code، أضف Content، وانقر على **نسخ تعليمات الوكيل** والصقها."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa052d84a44fb4e6ead8b69535f25c726
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fc574e414836749119ad937c14623d14e
        alt: "لقطة مقرّبة لتبويب Agents في قائمة Share: Copy agent prompt وOpen in Claude وOpen in Claude Code وOpen in Codex. وتحتها يعرض Connect Content خيارات Add to Cursor وAdd to VS Code وOther agents."
    - title: "حافظ على تحديث المواصفات"
      body: "عندما يحسم البناء سؤالًا مفتوحًا، اطلب من وكيل البرمجة اقتراح التغيير على الصفحة. يعرض كل اقتراح سبب الوكيل. انقر على علامة الصح لتقبله، أو على X لترفضه."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F156092664ebc424bb86899f876b88a97
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0c0108d3427d4641b5c3a2b266e8c4aa
        alt: "لقطة مقرّبة لقسم Open questions في المواصفات مع تعديل مقترح من وكيل البرمجة، موسوم بـ Agent، مع سببه وزرَّي القبول (علامة الصح) والرفض (X)."
features:
  heading: "كل ما تحتاجه لكتابة مواصفات لوكيل البرمجة"
  items:
    - title: "ملاحظات كتعليقات"
      body: "اطلب من الوكيل مراجعة مواصفاتك، فيترك تعليقات على المواضع الضعيفة بدلًا من إعادة كتابة نصك."
    - title: "صفحة واحدة لكل ميزة"
      body: "ضع الأبحاث وملاحظات الـ API والقرارات السابقة تحت كل مواصفات، وابحث في العناوين والنصوص لتجد أيًا منها."
    - title: "لوحة للمواصفات"
      body: "احفظ المواصفات في مجموعة بحقلي المسؤول والحالة، كجدول أو لوحة، والصفحة الكاملة وراء كل صف."
    - title: "ملاحظات لوكيلك"
      body: "اكتب في وصف الصفحة الأقسام المحسومة، وكل وكيل يقرأ المواصفات يقرأ ذلك أيضًا."
    - title: "يقرأ التعديلات غير المحفوظة"
      body: "يرى وكيل البرمجة التعديلات التي لا تزال مفتوحة في محررك، فيعمل دائمًا من الصفحة كما هي الآن."
    - title: "راجعها مع فريقك"
      body: "علّق على أي فقرة، واذكر زميلًا بـ @، وردّ في سلاسل النقاش. ويستعيد سجل الإصدارات نسخة سابقة من المواصفات."
