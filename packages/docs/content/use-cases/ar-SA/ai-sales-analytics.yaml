title: "راجع مسار مبيعاتك ببيانات HubSpot وGong"
seo_title: "تحليل المبيعات بالذكاء الاصطناعي لـ HubSpot وGong"
meta_description: "اعرف الصفقات المتعثرة وسبب تعثرها قبل مراجعة المسار. اسأل Agent-Native Analytics عن HubSpot وGong بلغة عادية، واحفظ الإجابات كلوحة تحكم."
updated: 2026-10-27
hero:
  body: "يحوّل Agent-Native Analytics صفقاتك في HubSpot ومكالماتك في Gong إلى لوحة تحكم لكل مراجعة للمسار. تسأل بلغة عادية عن الصفقات المتعثرة وسببها، فيجيب الوكيل من الأداتين معًا."
  button:
    label: "اسأل عن مسارك"
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe534007e491840cc86570110b7d00de4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4780c6d1885541bcaf3d949dbdbc1eb7
    alt: "لوحة Weekly pipeline review في Analytics، فيها لوحات للمسار المفتوح حسب المرحلة، والصفقات حسب المسؤول، والصفقات المتوقفة منذ 30 يومًا. وتجيب محادثة الوكيل على اليمين عن سبب تعثر إحدى الصفقات، من سجل مراحلها في HubSpot وآخر مكالمة لها في Gong."
how_to:
  heading: "كيف تحلّل مسار مبيعاتك بالذكاء الاصطناعي"
  steps:
    - title: "اربط بيانات CRM والمكالمات"
      body: "افتح **مصادر البيانات** وانقر على **ربط** بجانب HubSpot، ضمن **CRM & Sales**. الصق الرمز من تطبيق خاص تنشئه في إعدادات HubSpot، وانقر على **حفظ بيانات الاعتماد**. ويعمل Gong بالطريقة نفسها، بمفتاح وصول وسرّ."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fdeea3eb7d84048eca0f534b7b00390ee
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd918aa95f46047559b1f30c42d89d62f
        alt: "صفحة Data Sources وفيها HubSpot ضمن Connected وGong ضمن CRM & Sales. ولوحة إعداد Gong مفتوحة على خطوة Access Key Secret بعد لصقه، فوق زر Save Credentials."
    - title: "اسأل عن مسارك"
      body: "في **اسأل**، اسأل بلغة عادية: «ما الصفقات المفتوحة التي بقيت في المرحلة نفسها 30 يومًا أو أكثر؟». يبحث الوكيل في صفقاتك على HubSpot ويجيب بجدول يمكنك ترتيبه ومتابعة السؤال عنه."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7acaa378761c453bb79f9f246d8cab72
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe66acdb3c24e41c7b5caef3e0251b17a
        alt: "محادثة Ask مع السؤال عن الصفقات المتوقفة منذ 30 يومًا. يجيب الوكيل بجدول لست صفقات مفتوحة: المرحلة والمسؤول والمبلغ والأيام في المرحلة."
    - title: "احفظ الإجابات كلوحة تحكم"
      body: "اطلب من الوكيل: «احفظ هذا كلوحة تحكم لمراجعة المسار». فيبني لوحة لكل إجابة، وتتحدّث اللوحات ببيانات جديدة من HubSpot. وشارك لوحة التحكم مع فريقك قبل مراجعة المسار."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F69b61731b5b74d61ad0e510f57522796
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2720d0e5fd8f40bfa3b72c056270f174
        alt: "محادثة الوكيل تؤكد حفظ لوحة Weekly pipeline review، بجانب اللوحة الجديدة بجدول الصفقات المتوقفة ومخطط المسار حسب المرحلة."
features:
  heading: "كل ما تحتاجه لمراجعة المسار"
  items:
    - title: "صفقاتك ومكالماتك معًا"
      body: "سؤال واحد يمكنه جلب مرحلة الصفقة ومسؤولها من HubSpot، وما قاله المشتري في مكالماتها من Gong."
    - title: "لوحات تحكم يعدّلها الوكيل"
      body: "اطلب لوحة جديدة أو فلترًا حسب المسؤول أو مخططًا مختلفًا، فيحدّث الوكيل لوحة التحكم التي يتشاركها فريقك."
    - title: "إجابات يمكنك التحقق منها"
      body: "يضع الوكيل علامة «Unverified» على أي رقم لم يأتِ من استعلام مباشر على HubSpot أو Gong، فتعرف ما الذي تتحقق منه."
    - title: "مسارك بجانب الإيرادات"
      body: "اربط Stripe وBigQuery أيضًا، فتجيب المحادثة نفسها عن أسئلة الإيرادات واستخدام المنتج بجانب صفقاتك."
    - title: "تعريفاتك للمسار"
      body: "يكتب المسؤول معنى الصفقة المتعثرة أو المسار المؤهل في صفحة **الطبقة الدلالية**، ويقرؤها الوكيل قبل أن يجيب."
    - title: "تقرير يومي عن المسار"
      body: "استلم لوحة التحكم يوميًا بالبريد لما يصل إلى خمسة أشخاص أو في قناة Slack، دون أن تفتح التطبيق."
integrations:
