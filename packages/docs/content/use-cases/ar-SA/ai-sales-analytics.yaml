faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Analytics مجاني؟"
      a: "نعم، Agent-Native Analytics مجاني ومفتوح المصدر. يعمل الوكيل على أرصدة Builder.io للذكاء الاصطناعي أو مفتاح الذكاء الاصطناعي الخاص بك، فاستخدام الذكاء الاصطناعي ليس بلا حدود. وقد تستهلك الأسئلة عن المكالمات أيضًا أرصدة Gong API، ويمكن للمسؤول إيقاف ذلك. لا يزال Analytics في مرحلة ألفا."
    - q: "بأي أدوات CRM ومكالمات يتصل Agent-Native Analytics؟"
      a: "يتصل Analytics بـ HubSpot لنظام CRM وبـ Gong لمكالمات المبيعات. ويتصل أيضًا بـ Apollo وClay لبيانات جهات الاتصال والشركات. يُربط كل منها [في صفحة مصادر البيانات](https://www.agent-native.com/docs/template-analytics-connectors/) بمفتاحه الخاص، ويمكن لسؤال واحد أن يستند إلى HubSpot وGong معًا."
    - q: "هل أحتاج إلى كتابة SQL؟"
      a: "لا. تسأل بلغة عادية، فيجد الوكيل البيانات في HubSpot أو Gong، ويشغّل الاستعلام، ويجيب برقم أو جدول أو مخطط. وعندما تحفظ إجابة في لوحة تحكم، يضبط الوكيل طريقة جلب كل لوحة للبيانات الجديدة."
    - q: "هل يمكنني الوثوق بالأرقام؟"
      a: "نعم، مع التحقق: يجيب الوكيل من بيانات HubSpot وGong المباشرة، ويضع علامة «Unverified» على أي رقم لم يأتِ من استعلام مباشر. ويتبع [تعريفات فريقك في صفحة الطبقة الدلالية](https://www.agent-native.com/docs/template-analytics-dashboards/). قارن الإجابات الأولى بـ HubSpot قبل أن تعتمد عليها."
    - q: "كيف يختلف Agent-Native Analytics عن الذكاء الاصطناعي المدمج في HubSpot أو Gong؟"
      a: "الذكاء الاصطناعي في HubSpot أو Gong مدمج في تلك الأداة وحدها. أما Analytics فيجيب عن سؤال واحد من HubSpot وGong معًا، ويقرأ أيضًا Stripe وBigQuery، ويحفظ الإجابة كلوحة تحكم يعود إليها فريقك كل أسبوع. وتواصل استخدام HubSpot وGong كما هما، ويقرأ Analytics منهما."
    - q: "من يمكنه رؤية لوحات التحكم الخاصة بي؟"
      a: "أنت وحدك، حتى تشارك إحداها. شارك لوحة التحكم مع زميل أو مع مؤسستك كلها كمشاهد أو محرر أو مسؤول. ويرى الزملاء بيانات HubSpot وGong عبر اتصالهم الخاص، أو عبر اتصال أعدّه مسؤول للمؤسسة؛ ومن دون أيٍّ منهما تعرض تلك اللوحات خطأ."
