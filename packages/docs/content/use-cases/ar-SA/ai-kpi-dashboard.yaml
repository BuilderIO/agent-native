faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Analytics مجاني؟"
      a: "نعم، Agent-Native Analytics مجاني ومفتوح المصدر. يعمل الوكيل على أرصدة Builder.io للذكاء الاصطناعي أو مفتاح النموذج الخاص بك، ويحتاج كل مصدر بيانات إلى بيانات اعتماده، مثل المفتاح السري لـ Stripe. لا يزال Analytics في مرحلة ألفا، فقد تتغيّر الشاشات والميزات."
    - q: "من أي أدوات يمكن لـ Analytics سحب مؤشرات الأداء؟"
      a: "يتصل Analytics بـ Stripe وHubSpot وPostHog وMixpanel وAmplitude وGoogle Analytics ‏(GA4) وBigQuery وأكثر من اثني عشر مصدرًا آخر. تضيف كلًا منها في [صفحة مصادر البيانات](https://www.agent-native.com/docs/template-analytics-connectors/) بمفتاحه الخاص، ويمكن للوحة تحكم واحدة الجمع بين عدة مصادر."
    - q: "هل أحتاج إلى معرفة SQL لإنشاء لوحة مؤشرات أداء؟"
      a: "لا. تصف لوحة التحكم أو تطرح سؤالًا بلغة عادية، فيكتب الوكيل SQL. ويبقى الاستعلام ظاهرًا وراء كل مخطط، فيستطيع من يعرف بياناتك مراجعته أو تعديله."
    - q: "كيف أعرف أن الأرقام صحيحة؟"
      a: "كل رقم في لوحة التحكم يأتي من استعلام شغّله الوكيل على بياناتك المرتبطة، ويمكنك فتح الاستعلام والسجلات وراء أي مخطط. وعندما يتعذّر على الوكيل تشغيل استعلام، يضع على الرقم علامة «Unverified». قارن بعض الأرقام بـ Stripe قبل أن تعتمد على لوحة التحكم."
    - q: "من يمكنه رؤية لوحة مؤشرات الأداء الخاصة بي؟"
      a: "أنت وحدك، حتى تشاركها. يمكنك [مشاركة لوحة التحكم](https://www.agent-native.com/docs/sharing/) مع زميل أو مع مؤسستك كلها كمشاهد أو محرر أو مسؤول. والفلاتر التي تغيّرها تنطبق عليك وحدك؛ احفظ عرضًا أو أرسل الرابط لتشاركها."
    - q: "كيف يختلف Analytics عن الذكاء الاصطناعي في أداة التحليلات لديّ؟"
      a: "المساعد الذكي داخل أداة تحليلات واحدة يعمل على بيانات تلك الأداة. أما Analytics فيعمل عبر Stripe ونظام CRM وبيانات منتجك، ووكيله يبني لوحة التحكم التي تراها ويعدّلها، فتصبح إجاباته لوحات تحتفظ بها. وهذا ما يجعل Analytics [تطبيقًا وكيليًا](https://www.agent-native.com/articles/what-is-an-agent-native-app/): ذكاء الوكيل وسهولة التطبيق."
