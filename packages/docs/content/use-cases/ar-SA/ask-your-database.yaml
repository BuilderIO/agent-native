title: "اطرح أسئلتك على بياناتك بلغة عادية"
seo_title: "اسأل قاعدة بياناتك دون كتابة SQL"
meta_description: "اطرح سؤالًا عن بياناتك في BigQuery، فيجيب Agent-Native Analytics باستعلام SQL للقراءة فقط يمكنك مراجعته، ويحفظ الأسئلة المتكررة في لوحة تحكم."
updated: 2026-10-27
hero:
  body: "يجيب Agent-Native Analytics عنها من بياناتك في BigQuery، ويحفظ ما يتكرر منها في لوحة تحكم. ويكتب الوكيل استعلامات SQL للقراءة فقط يمكنك مراجعتها."
  button:
    label: "اسأل بياناتك"
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd1120abfcd1447b9ab48ff98a9b7592d
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2db877a772674ad4af41e7efbb062d50
    alt: "Analytics مفتوح على Ask. يجيب الوكيل عن سؤال حول تسجيلات الأسبوع الماضي بمخطط أعمدة حسب الخطة والجدول الذي أحصى منه. وتحته سؤال متابعة يُظهر أن خطة Pro نمت أكثر من غيرها."
how_to:
  heading: "كيف تسأل قاعدة بياناتك بلغة عادية"
  steps:
    - title: "اربط مستودع بياناتك"
      body: "في صفحة **مصادر البيانات**، افتح BigQuery. ارفع مفتاح JSON لحساب خدمة لديه دورا BigQuery Data Viewer وBigQuery Job User، وأدخل معرّف مشروعك، ثم انقر على **حفظ بيانات الاعتماد** و**اختبار الاتصال**."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F62008ebd98594f02b1c0bf3ae565ef49
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb01d428bca15467eb4c04299dd9575b8
        alt: "لقطة مقرّبة لبطاقة BigQuery في صفحة Data Sources، بحالة Connected، ومعرّف المشروع وحساب الخدمة بحالة Configured، ورسالة «Connection successful»."
    - title: "اطرح سؤالك بلغة عادية"
      body: "في **اسأل**، اكتب سؤالك كما تسأل زميلًا: «كم حسابًا سجّل الأسبوع الماضي، حسب الخطة؟» يجد الوكيل الجداول المناسبة، ويشغّل الاستعلام، ويجيب بمخطط."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3e9ac5b30a924dab9b09bc76ed24b2de
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F31c48c5ccc9247b792c00474b01f97b0
        alt: "لقطة مقرّبة لمحادثة Ask. بحث الوكيل في مخطط قاعدة بيانات BigQuery، وشغّل استعلامًا واحدًا، وأجاب بـ 723 تسجيلًا ومخطط أعمدة حسب الخطة."
    - title: "احتفظ بالإجابة في لوحة تحكم"
      body: "اطلب من الوكيل «أضف هذا إلى لوحة تحكم». فيبني اللوحة، ويتحقق من أن استعلام SQL يعمل، ويحفظ لوحة التحكم. وتبقى لوحة التحكم خاصة حتى تشاركها مع زميل أو مع مؤسستك كلها."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F957858f8613241a2b2249d88430b3cc4
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd0111e9f420149fc8a35cad845ad8e2e
        alt: "لوحة تحكم جديدة باسم Weekly signups فيها لوحة التسجيلات حسب الخطة ومخطط التسجيلات حسب الأسبوع. وتقول محادثة الوكيل بجانبها إن اللوحتين جرى التحقق منهما على BigQuery."
features:
  heading: "كل ما تحتاجه للحصول على إجابات من قاعدة بياناتك"
  items:
    - title: "استعلام SQL وراء كل إجابة"
      body: "افتح **عرض SQL** على أي مخطط في لوحة التحكم، أو اسأل في المحادثة، لترى الاستعلام الذي كتبه الوكيل وتنسخه لتشغّله بنفسك."
    - title: "تعريفات المقاييس لدى فريقك"
      body: "يكتب المسؤول معنى «نشط» أو «تسجيل» في صفحة **الطبقة الدلالية**، ويقرأها الوكيل قبل أن يكتب SQL."
    - title: "استعلامات لا يمكنها تغيير البيانات"
      body: "في BigQuery، لا يستطيع SQL الذي يكتبه الوكيل الإدراج أو التحديث أو الحذف، ويتصل عبر حساب خدمة لا يمكنه سوى قراءة الجداول وتشغيل الاستعلامات."
    - title: "لوحات تحكم يعدّلها الوكيل"
      body: "اطلب في المحادثة لوحة أخرى أو فلترًا أو تفصيلًا حسب الخطة، فيغيّر الوكيل لوحة التحكم لكل من شاركتها معه."
    - title: "أسئلة عبر أدواتك"
      body: "اطرح سؤالًا واحدًا يجمع جداول مستودعك مع إيرادات Stripe أو صفقات HubSpot أو أحداث PostHog."
    - title: "لوحة التحكم في بريدك"
      body: "استلم لوحة تحكم بالبريد كل يوم في الوقت الذي تختاره، بمخططاتها وجداولها داخل الرسالة، لما يصل إلى خمسة أشخاص."
