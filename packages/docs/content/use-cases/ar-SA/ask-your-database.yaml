faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Analytics مجاني؟"
      a: "نعم، Agent-Native Analytics مجاني ومفتوح المصدر. استخدم التطبيق المستضاف أو شغّل نسختك الخاصة. يحتاج الوكيل إلى اتصال بالذكاء الاصطناعي، عبر Builder.io أو مفتاح النموذج الخاص بك، لذا فاستخدام الذكاء الاصطناعي ليس بلا حدود. لا يزال Analytics في مرحلة ألفا، فتوقّع تغييرات."
    - q: "هل أحتاج إلى معرفة SQL؟"
      a: "لا. تسأل بلغة عادية ويكتب الوكيل SQL. قد يحتاج شخص يعرف بياناتك إلى [ربط BigQuery](https://www.agent-native.com/docs/template-analytics-connectors/) أولًا. ويمكن للمسؤول إضافة [تعريفات المقاييس](https://www.agent-native.com/docs/template-analytics-dashboards/) في صفحة **الطبقة الدلالية**، ليختار الوكيل الجداول والأعمدة الصحيحة."
    - q: "هل يعمل مع Postgres أو Supabase أو Neon؟"
      a: "نعم، مع Postgres على Supabase أو Neon. اربطه [عبر MCP](https://www.agent-native.com/docs/mcp-clients/) من قائمة + في المحادثة، واطرح سؤالك في المحادثة. تبقى هذه الإجابات في المحادثة، لأن لوحات لوحة التحكم لا تستطيع الاستعلام من Postgres بعد. ولا يمكن الاستعلام من قواعد بيانات Postgres الأخرى بعد، لذا تستخدم خطوات هذه الصفحة BigQuery."
    - q: "هل يمكن للوكيل تغيير بياناتي؟"
      a: "ليس في BigQuery. يرفض Analytics هناك أي استعلام من الوكيل يُدرج البيانات أو يحدّثها أو يحذفها أو يُسقطها. ويطلب الإعداد أيضًا حساب خدمة بأدوار للقراءة فقط، يمكنه قراءة جداولك وتشغيل الاستعلامات لكن لا يمكنه تغييرها. أما عبر Supabase أو Neon، فيستطيع الوكيل فعل ما تسمح به لذلك الاتصال."
    - q: "كيف أعرف أن الإجابة صحيحة؟"
      a: "راجع الاستعلام الذي وراءها. اطلب من الوكيل أن يعرض SQL الخاص به، أو افتح **عرض SQL** على مخطط في لوحة التحكم. ويمكنك أيضًا أن تسأله عن الجداول والفلاتر التي استخدمها. ويضع الوكيل على الرقم علامة **Unverified** عندما لا يُشغَّل أي استعلام مباشر."
    - q: "ما الفرق بين هذا وسؤال ChatGPT عن ملف CSV مُصدَّر؟"
      a: "يجيب مساعد المحادثة من الملف الذي صدّرته، فيبدأ كل سؤال جديد بتصدير جديد. أما Analytics فيستعلم مستودعك مباشرة، ويستخدم تعريفات المقاييس لدى فريقك، ويحفظ الإجابات التي ستحتاجها مجددًا في لوحة تحكم. هذا هو [التطبيق الوكيلي](https://www.agent-native.com/articles/what-is-an-agent-native-app/): ذكاء الوكيل وسهولة التطبيق."
