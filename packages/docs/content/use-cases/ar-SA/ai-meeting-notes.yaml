title: "احصل على ملاحظات الاجتماعات دون بوت في المكالمة"
seo_title: "ملاحظات الاجتماعات بالذكاء الاصطناعي دون بوت"
meta_description: "احصل على نص وملخص وعناصر عمل من كل مكالمة. يسجّل Agent-Native Clips على جهازك، فتبحث في أي اجتماع أو تسأل عنه لاحقًا."
updated: 2026-10-26
hero:
  body: "يحوّل Agent-Native Clips مكالماتك إلى ملاحظات: نص وملخص وعناصر عمل حسب المشاركين. يسجّل الميكروفون وصوت المكالمة على جهازك، ويمكنك البحث في أي مكالمة أو السؤال عنها."
  button:
    label: "دوّن ملاحظات اجتماعك"
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4b1f55d396c64beea49da96d9d02b38c
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F03741a45126c451e8458872aebd9f480
    alt: "اجتماع أسبوعي منتهٍ لمزامنة المنتج في Clips. تعرض لوحة الملاحظات على اليسار ملخصًا قصيرًا ونقاطًا رئيسية وعناصر عمل مجمّعة تحت اسم كل مشارك. ويمتد النص على اليمين مع كلام كل متحدث."
how_to:
  heading: "كيف تدوّن ملاحظات الاجتماعات بالذكاء الاصطناعي"
  steps:
    - title: "اربط تقويمك"
      body: "ثبّت Clips Desktop، وفعّل الاجتماعات في الإعدادات داخل Clips، واربط Google Calendar من صفحة الاجتماعات. تظهر اجتماعاتك القادمة في تبويب Agenda."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F58ac771a7a8547ecbb770e5e560f8ecd
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6d5d38e3c0124bbb8a51b2d0b89582c4
        alt: "لقطة مقرّبة لتبويب Agenda في صفحة الاجتماعات، يعرض اجتماعات اليوم من Google Calendar، مع زرَّي انضمام وفتح الملاحظات على الاجتماع الذي يبدأ بعد دقيقتين."
    - title: "ابدأ الملاحظات من التذكير"
      body: "يعرض Clips Desktop تذكيرًا قبل كل اجتماع في التقويم بدقيقة. زر Join فيه ينضم إلى المكالمة ويبدأ الملاحظات فورًا، وقائمة الزر تبدأ الملاحظات دون الانضمام. بعدها يلتقط Clips ميكروفونك وصوت المكالمة."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff048f1dd0e18443d93fdeb4a4f03fada
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe58e7dd45fa3459fb1cdb3840fed0126
        alt: "لقطة مقرّبة لتذكير Clips Desktop بمزامنة المنتج الأسبوعية. قائمة زر Join Meet & open Clips مفتوحة وفيها: Join only وStart notes only وSnooze 5 min."
    - title: "اقرأ ملاحظاتك وعناصر العمل"
      body: "عند انتهاء المكالمة، تعرض صفحة الاجتماع ملاحظاتك وملاحظات الذكاء الاصطناعي بجانب النص: ملخص ونقاط رئيسية وعناصر عمل حسب المشاركين. [راجع ملاحظات الاجتماع المكتوبة بالذكاء الاصطناعي](https://www.agent-native.com/articles/how-to-use-ai-to-take-meeting-notes/) على النص قبل أن تشاركها."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0ba0a151caef41e8904d6535671c47bc
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fbdf5e7b84ab64a288c0837959eedb85b
        alt: "لقطة مقرّبة للوحة ملاحظات الذكاء الاصطناعي لاجتماع منتهٍ: الملخص وأربع نقاط رئيسية وعناصر عمل مجمّعة تحت مشاركَين."
features:
  heading: "كل ما تحتاجه من كل اجتماع"
  items:
    - title: "لا بوت في مكالماتك"
      body: "يسجّل Clips Desktop ميكروفونك وصوت المكالمة على جهازك، فيبدو الاجتماع كما هو لجميع الحاضرين."
    - title: "عناصر عمل لكل شخص"
      body: "يحدد كل عنصر عمل المسؤول عنه بحسب من قال ماذا في المكالمة. أضف العناصر أو عدّلها أو احذفها قبل أن تشاركها."
    - title: "اسأل أثناء المكالمة"
      body: "اسأل عن الاجتماع وهو جارٍ: ما فاتك، أو ملخصًا لآخر خمس دقائق، أو سؤالًا جيدًا تطرحه تاليًا."
    - title: "ابحث بما قيل"
      body: "اعثر على اجتماع بكلمة من النص أو الملاحظات أو باسم أحد الحاضرين، أو اطلب من الوكيل المكالمة التي ذُكر فيها أمر ما."
    - title: "ملاحظات تعيدك إلى مصدرها"
      body: "انقر على أي نقطة رئيسية في ملاحظات الذكاء الاصطناعي لتنتقل إلى اللحظة التي قيلت فيها في النص."
    - title: "ملاحظات اجتماعات قابلة للمشاركة"
      body: "رابط واحد يشارك الملخص والنقاط الرئيسية وعناصر العمل والنص الكامل، دون فيديو التسجيل أو تعليقاته."
