faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Clips مجاني؟"
      a: "نعم، Agent-Native Clips مجاني ومفتوح المصدر. تعمل الملخصات والعناوين وتنظيف النص على [أرصدة Builder.io للذكاء الاصطناعي](https://www.agent-native.com/docs/template-clips-features/) افتراضيًا. وعندما تنفد الأرصدة تتوقف هذه الميزات حتى تضيف أرصدة أو تربط مفتاح Gemini الخاص بك. لا يزال Clips في مرحلة ألفا، فتوقّع تغييرات."
    - q: "هل ينضم بوت إلى اجتماعاتي؟"
      a: "لا. يدوّن Clips الملاحظات من جهازك: يسجّل Clips Desktop ميكروفونك وصوت المكالمة، فلا ينضم شيء إلى مكالمتك في Zoom أو Google Meet أو Microsoft Teams. وبما أنه لا ينضم بوت، أخبر الحاضرين بأنك تدوّن ملاحظات."
    - q: "مع أي تقويم وتطبيقات مكالمات فيديو يعمل Clips؟"
      a: "يرتبط Clips بـ Google Calendar فقط. وتعمل الملاحظات في Zoom وGoogle Meet وMicrosoft Teams وWebex وأي مكالمة أخرى يشغّل جهازك صوتها. وعلى جهاز Mac يلاحظ Clips Desktop هذه المكالمات حتى لو لم تكن في تقويمك، ويعرض بدء الملاحظات. أما التقاط أصوات الحاضرين الآخرين فيعمل على Mac فقط."
    - q: "هل يدوّن Clips ملاحظات الاجتماعات على Windows؟"
      a: "يعمل Clips Desktop على Mac وWindows وLinux، لكن التقاط أصوات الحاضرين الآخرين يعمل على Mac فقط. وعلى Windows وLinux يسجّل Clips ميكروفونك فقط، فيغيب الحاضرون عن بُعد من النص ومن عناصر العمل."
    - q: "كيف يختلف Clips عن مدوّن الملاحظات بالذكاء الاصطناعي في Zoom أو Google Meet؟"
      a: "مدوّن الملاحظات في تطبيق المكالمات مرتبط بمكالمات ذلك التطبيق وحده. أما Clips فيحفظ كل اجتماع، من أي تطبيق مكالمات، في مكتبة واحدة. اسأل [وكيل Clips](https://www.agent-native.com/docs/template-clips-agent/) «ماذا التزم به دانيال الثلاثاء الماضي؟» فيبحث في اجتماعاتك بحسب ما قيل فيها. وهذا [تطبيق وكيلي](https://www.agent-native.com/articles/what-is-an-agent-native-app/): ذكاء الوكيل وسهولة التطبيق."
