title: "أعدّ تقرير التسويق الأسبوعي دون جداول بيانات"
seo_title: "تقرير تسويق أسبوعي من GA4 وHubSpot"
meta_description: "أنشئ تقرير التسويق الأسبوعي من Google Analytics وHubSpot باستخدام Agent-Native Analytics. اسأل كيف كان الأسبوع وشارك الإجابات كلوحة تحكم."
updated: 2026-10-27
hero:
  body: "يحوّل Agent-Native Analytics بيانات Google Analytics وHubSpot إلى تقرير التسويق ليوم الاثنين. اسأل كيف كان الأسبوع، فيحفظ الوكيل كل إجابة في لوحة تحكم لا تعيد بناءها أبدًا."
  button:
    label: "أنشئ لوحة التحكم"
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8b9582619b1b42e4a44e6246e01ff7f8
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F70d3b80ce73f472c95b94f7f5c0d65d6
    alt: "لوحة تسويق أسبوعية مفتوحة في Analytics. تعرض بطاقات المقاييس في الأعلى جلسات هذا الأسبوع، والتسجيلات العضوية، وجهات الاتصال الجديدة في HubSpot، والصفقات المنشأة، ولكل منها التغيّر عن الأسبوع الماضي. وتحتها مخطط أعمدة يقارن الجلسات حسب القناة بين هذا الأسبوع والماضي، ومخطط خطي للصفقات المنشأة يوميًا في HubSpot. وفي محادثة الوكيل على اليمين السؤال «How did the week go?» وإجابة قصيرة تذكر أن البحث العضوي حقق أكبر مكسب."
how_to:
  heading: "كيف تعدّ تقرير تسويق أسبوعيًا بالذكاء الاصطناعي"
  steps:
    - title: "اربط بيانات التسويق"
      body: "افتح **مصادر البيانات**، واتبع [خطوات الإعداد](https://www.agent-native.com/docs/template-analytics-connectors/) في بطاقتي Google Analytics وHubSpot، وانقر على **اختبار الاتصال**. يحتاج Google Analytics إلى حساب خدمة في Google Cloud بصلاحية Viewer على الموقع، وهو إعداد لمرة واحدة."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0218d6c271db4bbe8534c00e6f5e85a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa38de1d80c2e4f7fb8e1407d95f97984
        alt: "لقطة مقرّبة لصفحة Data Sources وفيها Google Analytics وHubSpot بحالة متصل. ولوحة إعداد HubSpot مفتوحة بجانبهما، ورمزه مضبوط، وTest connection يعرض Connection successful."
    - title: "اسأل كيف كان الأسبوع"
      body: "اسأل كما تسأل محللًا. مثلًا: «كيف كان أداء التسجيلات من البحث العضوي هذا الأسبوع مقارنةً بالأسبوع الماضي؟» يشغّل الوكيل استعلامًا مباشرًا على بياناتك ويجيب بمخطط."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fcd7a4f648f5b4dee8a6282c3f512f698
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F74bf8b013f944b96a414979ff7234deb
        alt: "محادثة الوكيل مع ذلك السؤال وإجابته. جملتان تقولان إن التسجيلات العضوية ارتفعت عن الأسبوع السابق، فوق مخطط أعمدة للتسجيلات حسب القناة لهذا الأسبوع والماضي."
    - title: "احفظ لوحة التحكم وشاركها"
      body: "اطلب من الوكيل: «اجعل هذه لوحة التسويق الأسبوعية». انقر على **Share** لتمنح زميلًا أو مؤسستك كلها [صلاحية العرض أو التعديل](https://www.agent-native.com/docs/sharing/)، أو افتح **تقارير البريد الإلكتروني** لترسلها يوميًا في وقت تختاره."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F04feeeb2a1384ce0adecb7bee676b806
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F61fd64ac2bff4f53a3ca6cfbd97225fe
        alt: "لوحة التسويق الأسبوعية ونافذة Email reports مفتوحة: Send to مضبوط على Email وSlack، وعنوانا بريد للفريق، ووقت إرسال 9:00، وزر Send now."
features:
  heading: "كل ما تحتاجه لتقرير أسبوعك التسويقي"
  items:
    - title: "الأداتان في سؤال واحد"
      body: "اسأل عن جلسات Google Analytics وجهات الاتصال في HubSpot في السؤال نفسه، فيجيب الوكيل بالاثنين جنبًا إلى جنب."
    - title: "ترتيب البحث بجانب الزيارات"
      body: "اربط DataForSEO واسأل كيف تغيّر ترتيب كلماتك المفتاحية مقارنةً بجلسات البحث العضوي هذا الأسبوع."
    - title: "أرقام محدّثة دائمًا"
      body: "مخططات Google Analytics تستعلم مباشرة، ومخططات HubSpot تتحدّث تلقائيًا، فيعرض التقرير دائمًا أحدث أسبوع."
    - title: "أعد تحليل الأسبوع الماضي"
      body: "احفظ تحقيقًا بسؤاله وخطواته، ثم اطلب من الوكيل تشغيله من جديد على بيانات هذا الأسبوع."
    - title: "تعريفات فريقك"
      body: "يحدّد المسؤولون ما يُعدّ عميلًا محتملًا أو تسجيلًا في صفحة الطبقة الدلالية، ويستخدم الوكيل هذه التعريفات في كل إجابة."
    - title: "اسأل عن أي مخطط"
      body: "انقر على مخطط واسأل عمّا تغيّر. يتلقى الوكيل ذلك المخطط مع سؤالك ويجيب من البيانات التي وراءه."
integrations:
