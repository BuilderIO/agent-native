faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Analytics مجاني؟"
      a: "نعم، Agent-Native Analytics مجاني ومفتوح المصدر. تربط حساباتك الخاصة في Google Analytics وHubSpot. وللبدء، تختار أرصدة Builder.io المجانية للذكاء الاصطناعي أو مفتاح نموذج الذكاء الاصطناعي الخاص بك للوكيل، فاستخدام الذكاء الاصطناعي له حدود. لا يزال Analytics في مرحلة ألفا، فتوقّع تغييرات."
    - q: "ما مصادر بيانات التسويق التي يمكنني ربطها؟"
      a: "يتصل Agent-Native Analytics بـ Google Analytics ‏(GA4) وHubSpot، وDataForSEO لترتيب الكلمات المفتاحية وحجم البحث، وX لتفاعل المنشورات. ويتصل أيضًا بـ BigQuery وAmplitude وMixpanel وPostHog وStripe. يحتاج كل مصدر إلى بيانات اعتماده، ويحتاج Google Analytics إلى حساب خدمة في Google Cloud."
    - q: "هل يمكن لـ Agent-Native Analytics إرسال التقرير كل اثنين؟"
      a: "ليس بجدول أسبوعي حتى الآن. [تقارير لوحة التحكم بالبريد](https://www.agent-native.com/docs/template-analytics-dashboards/) تُرسل يوميًا، في وقت ومنطقة زمنية تختارهما، إلى ما يصل إلى خمسة عناوين بريد أو قناة Slack أو كليهما. وقبل اجتماع الاثنين، انقر على **إرسال الآن** في **تقارير البريد الإلكتروني** لترسل أحدث نسخة من لوحة التحكم."
    - q: "هل أحتاج إلى معرفة SQL؟"
      a: "لا. تسأل بكلمات بسيطة، فيختار الوكيل المصدر ويكتب الاستعلام. ويمكنك أن تطلب من الوكيل عرض الاستعلام وراء أي إجابة إن أردت التحقق منه."
    - q: "هل يمكنني الوثوق بالأرقام؟"
      a: "يشغّل الوكيل استعلامًا مباشرًا على بياناتك قبل أن يعطيك أي رقم، ويضع علامة «Unverified» على الرقم عندما لا يُشغَّل استعلام. ومع ذلك، قارن تقرير الأسبوع الأول بـ Google Analytics وHubSpot قبل أن ترسله إلى الفريق."
    - q: "كيف يختلف Agent-Native Analytics عن تقارير GA4 وHubSpot؟"
      a: "يقدّم كل من Google Analytics وHubSpot تقارير عن بياناته وحده. أما Agent-Native Analytics فيجيب عن سؤال واحد عبر الاثنين، بكلمات بسيطة، ويحفظ الإجابات في لوحة تحكم واحدة تحسّنها بالسؤال. وهذا [تطبيق وكيلي](https://www.agent-native.com/articles/what-is-an-agent-native-app/): ذكاء الوكيل وسهولة التطبيق."
