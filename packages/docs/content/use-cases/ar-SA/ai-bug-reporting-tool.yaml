faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Clips مجاني؟"
      a: "نعم. Agent-Native Clips مجاني ومفتوح المصدر، بما في ذلك ملحق Chrome. تعمل العناوين والملخصات وتنظيف النص على أرصدة Builder.io للذكاء الاصطناعي افتراضيًا، فاستخدام الذكاء الاصطناعي ليس غير محدود، وتحتاج التسجيلات إلى مكان لتخزين الفيديو. لا يزال Clips في مرحلة ألفا، فتوقّع تغييرات مع تطوّره."
    - q: "ماذا يلتقط Clips من متصفحي؟"
      a: "يلتقط ملحق Clips لـ Chrome [رسائل وحدة التحكم وأخطاء JavaScript وطلبات الشبكة](https://www.agent-native.com/docs/template-clips-features/#chrome-extension-browser-logs) من خمس علامات تبويب كحدٍّ أقصى، ويعود إلى ما قبل ضغطك على التسجيل بما يصل إلى 30 ثانية. يحتفظ كل طلب بعنوانه وحالته وزمنه وهل فشل. ويرى المحررون كل ذلك في تبويب تصحيح الأخطاء بالمقطع، ويحصل الوكلاء عليه عبر الرابط."
    - q: "هل يسجّل Clips كلمات المرور أو البيانات الخاصة؟"
      a: "لا يحفظ Clips أبدًا محتوى الطلبات أو الاستجابات أو ترويساتها أو ملفات تعريف الارتباط أو النص الذي تكتبه، ويُخفي القيم التي تبدو كرموز أو كلمات مرور أو مفاتيح. ويمكنك إيقاف سجلات المطوّر من إعدادات الملحق. التسجيلات الجديدة عامة بالرابط، فاجعل تقرير الخطأ خاصًا أو لمؤسستك عندما يعرض بيانات داخلية."
    - q: "كيف أعطي تسجيل خطأ إلى Claude Code أو Cursor أو Codex؟"
      a: "الصق رابط المقطع في Claude Code أو Cursor أو Codex، فيقرأ الوكيل [النص والإطارات وسجلات المتصفح](https://www.agent-native.com/docs/template-clips-integrations/#agent-readable-clips) دون تنزيل الفيديو. وللمقطع الخاص، انقر على نسخ مطالبة الوكيل في تبويب الوكلاء بقائمة المشاركة، فيعطي الوكيل رابطًا يدوم ساعتين. ويفتح ذلك التبويب المقطع أيضًا في Claude Code أو Codex."
    - q: "هل يلتقط Clips السجلات في متصفحات أخرى أو في تطبيق سطح المكتب؟"
      a: "لا. تأتي سجلات وحدة التحكم والشبكة من ملحق Clips لـ Chrome فقط. أما Clips Desktop وتطبيق الويب فيسجّلان شاشتك وكاميراك وصوتك مع نص وملخص، لكن التسجيل لن يتضمن سجلات المتصفح."
    - q: "هل Clips أداة لتتبع الأخطاء مثل Jira؟"
      a: "لا. يصنع Clips [تقرير خطأ يستطيع المهندس العمل عليه](https://www.agent-native.com/articles/how-to-write-a-bug-report/)، وتحفظه أداة التتبع لديك: الصق الرابط في Jira أو GitHub أو Linear أو Slack. ويحصل وكيل البرمجة لديك أو [وكيل Clips](https://www.agent-native.com/docs/template-clips-agent/) على التسجيل وسجلاته، لا على نص التذكرة فقط. وهذا ما يجعل Clips [تطبيقًا وكيليًا](https://www.agent-native.com/articles/what-is-an-agent-native-app/): ذكاء الوكيل وسهولة التطبيق."
