title: "أداة الإبلاغ عن الأخطاء بالذكاء الاصطناعي"
seo_title: "أداة إبلاغ عن الأخطاء بالذكاء الاصطناعي مع سجلات وحدة التحكم والشبكة"
meta_description: "Agent-Native Clips أداة مجانية بالذكاء الاصطناعي للإبلاغ عن الأخطاء. سجّل الخطأ في Chrome وشارك رابطًا واحدًا مع سجلات وحدة التحكم والشبكة التي يقرأها وكيل البرمجة لديك."
updated: 2026-10-26
hero:
  body: "يحوّل Agent-Native Clips تسجيل الخطأ إلى تقرير يستطيع مهندسك ووكيل البرمجة لديك العمل عليه. تعرض الخطأ في Chrome، فتأتي أخطاء الصفحة وطلباتها الفاشلة مع الرابط."
  button:
    label: "سجّل خطأً"
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe36fd7fdff9b49bca2c6787f302964c6
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff375e2d60b2048508c23ea90a9761e08
    alt: "تسجيل لخطأ مفتوح في Clips، متوقف عند صفحة دفع تعرض رسالة خطأ. يسرد تبويب تصحيح الأخطاء بجانب الفيديو خطأً أحمر في وحدة التحكم وطلبًا فاشلًا بالحالة 500."
how_to:
  heading: "كيف تبلّغ عن خطأ بالذكاء الاصطناعي"
  steps:
    - title: "ابدأ التسجيل من Chrome"
      body: "انقر على ملحق Clips لـ Chrome في شريط الأدوات واختر المصدر: علامة تبويب في المتصفح أو نافذة أو الشاشة كاملة. شغّل الكاميرا والميكروفون أو أوقفهما، ثم انقر على Start recording."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6996593713c74108967e120111378c14
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff7991811f7a346e0a99cf9fe81496e34
        alt: "لقطة مقرّبة لنافذة ملحق Clips فوق تطبيق ويب، وقد اختير Browser tab مصدرًا، والكاميرا والميكروفون مشغّلان، وزر Start recording."
    - title: "اعرض الخطأ واشرحه"
      body: "انقر عبر الخطوات التي يحدث فيها العطل، وقل ما كنت تتوقع حدوثه. أثناء التسجيل يحفظ الملحق أخطاء الصفحة والطلبات التي أرسلتها، وهي التفاصيل التي كان المهندس سيستخرجها من أدوات المطوّر في Chrome."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe01ffb73c62c427b8077f05657fdeb47
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff895d85667344971baec96eb0b2ec956
        alt: "أزرار التحكم في تسجيل Clips وفقاعة الكاميرا فوق صفحة الدفع في تطبيق ويب، حيث تظهر رسالة «Something went wrong»."
    - title: "شارك رابطًا واحدًا"
      body: "عندما توقف التسجيل ينسخ Clips رابطه لك. الصقه في تذكرة أو محادثة أو في وكيل البرمجة. كما يفتحه تبويب الوكلاء في قائمة المشاركة في Claude أو Claude Code أو Codex مباشرة."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F10933b64225545e1b5ecd666f5803832
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2894036362f7409d8a4961536719b399
        alt: "لقطة مقرّبة لقائمة المشاركة في Clips على تبويب الوكلاء، وفيها نسخ مطالبة الوكيل وأزرار فتح في Claude وفتح في Claude Code وفتح في Codex."
features:
  heading: "كل ما تحتاجه للإبلاغ عن خطأ"
  items:
    - title: "مصمَّم لوكيل البرمجة لديك"
      body: "الصق الرابط في Claude Code أو Cursor أو Codex. يقرأ الوكيل النص والإطارات والسجلات دون تنزيل الفيديو."
    - title: "سجلات وحدة التحكم والشبكة"
      body: "يحفظ Clips رسائل وحدة التحكم والأخطاء والطلبات من خمس علامات تبويب كحدٍّ أقصى، مع حالة كل طلب وزمنه وهل فشل."
    - title: "الثلاثون ثانية السابقة"
      body: "يعود Clips إلى ما قبل ضغطك على التسجيل بما يصل إلى 30 ثانية، فيمكن لخطأ حدث أثناء تحميل الصفحة أن يدخل التقرير."
    - title: "الأسرار لا تُحفظ"
      body: "لا يحفظ Clips أبدًا محتوى الطلبات أو ترويساتها أو ملفات تعريف الارتباط أو ما تكتبه، ويُخفي القيم التي تبدو كرموز أو كلمات مرور."
    - title: "اقفز مباشرة إلى الخطأ"
      body: "في تبويب تصحيح الأخطاء بالمقطع، انقر على الوقت بجانب خطأ أو طلب فاشل فينتقل الفيديو إلى تلك اللحظة."
    - title: "ابحث في كل تقارير الأخطاء"
      body: "اعثر على أي تقرير خطأ بما قيل فيه، أو اسأل وكيل Clips عبر كل التسجيلات في مكتبتك."
