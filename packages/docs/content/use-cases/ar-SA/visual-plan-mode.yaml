title: "راجع خطة وكيل البرمجة قبل أن يكتب الكود"
seo_title: "وضع التخطيط المرئي لـ Claude Code وCodex وCursor"
meta_description: "يحوّل Agent-Native Plan خطة وكيل البرمجة إلى صفحة تراجعها، فيها مخططات وشجرة ملفات وكود مشروح، قبل أن يكتب الوكيل أي سطر من الكود."
updated: 2026-10-27
hero:
  body: "يحوّل Agent-Native Plan الخطة التي يكتبها وكيلك إلى صفحة من المخططات وشجرة الملفات والكود المشروح. تعلّق على أي جزء، فيعدّل الوكيل الخطة ولا يغيّر أي كود حتى توافق عليها."
  button:
    label: "خطّط لما ستبنيه"
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faad0afc668dc461f9023eeba3ba55800
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2c2e3c83e79248e69829bb38f71a6704
    alt: "خطة لإضافة دعوات الفريق، مفتوحة في Plan. يعرض مخطط مسار الدعوة من صفحة الإعدادات عبر الـ API وجدول الدعوات حتى رسالة الدعوة بالبريد. وتحته شجرة ملفات تحدد الملفات الخمسة التي ستتغيّر. وتعليق من زميل موجّه إلى الوكيل مثبّت على خطوة البريد."
how_to:
  heading: "كيف تستخدم وضع التخطيط المرئي مع وكيل البرمجة"
  steps:
    - title: "اطلب خطة مرئية"
      body: "أضف Plan إلى Claude Code أو Codex أو Cursor [بأمر تثبيت واحد](https://www.agent-native.com/docs/plan-plugin/). ثم اكتب `/visual-plan` والمهمة. يقرأ الوكيل الكود وينشر رابط الخطة."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F15e26ab97a68472a958aabf9657fdeb2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F01168fa31ed5412080d49febc37f1068
        alt: "محادثة وكيل برمجة كتب فيها المستخدم /visual-plan مع مهمة لإضافة دعوات الفريق. يعرض الوكيل الملفات التي قرأها، وينشر الخطة، ويرد برابطها."
    - title: "علّق على ما يجب تغييره"
      body: "حدّد جملة أو موضعًا في المخطط واكتب ما يجب تغييره. [اضبط التعليق](https://www.agent-native.com/docs/template-plan-review-workflow/) على **الوكيل** ليعالجه الوكيل، أو على **بشري** ليعالجه زميل. وأجب كذلك عن أسئلة الخطة المفتوحة."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8a16bd566384f4080dde591a1b30c3f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F598a137b56d149f98409ed79c024cb2b
        alt: "لقطة مقرّبة لتعليق جديد مثبّت على خطوة رسالة الدعوة في مخطط الخطة، ومفتاح Agent وHuman مضبوط على Agent، ونص التعليق مكتوب."
    - title: "أرسل تعليقاتك إلى الوكيل"
      body: "انقر على **إرسال إلى الوكيل** واختر **نسخ لوكيلك** لتنسخ تعليقاتك كمطالبة. الصقها في محادثة وكيلك ليحدّث الخطة. وعندما تصبح الخطة صحيحة، وافق عليها هناك فيبدأ الوكيل البناء."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0f841d0983ec4e3386d13c4c4ad7895d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F356c269c867048c392ca26ef5c5767c8
        alt: "لقطة مقرّبة لزر Send to agent في الخطة وقائمته مفتوحة: Copy for your agent وSend to inline agent، ولكل منهما وصف من سطر واحد."
features:
  heading: "كل ما تحتاجه لمراجعة خطة وكيلك"
  items:
    - title: "مخططات توضّح الطريقة"
      body: "تُرسم مسارات الطلبات ونماذج البيانات ونقاط الـ API، فيظهر أي خطأ في نقطة API أو جدول ناقص قبل أن يُبنى."
    - title: "اعرف الملفات التي ستتغيّر"
      body: "تُظهر شجرة الملفات والكود المشروح أين سيقع العمل، وما الذي تعيد كل خطوة استخدامه من قاعدة الكود لديك."
    - title: "أسئلة بإجابة مقترحة"
      body: "القرارات التي لا يحسمها الوكيل من الكود تُجمع في نموذج واحد في النهاية، ومع كل منها الإجابة التي يوصي بها."
    - title: "يبدأ من وضع التخطيط"
      body: "لديك خطة من Claude Code أو Codex أو ملف Markdown؟ يبني `/visual-plan` الصفحة منها بدلًا من البدء من الصفر."
    - title: "لا كود قبل الموافقة"
      body: "تُبقي تعليمات Plan الوكيلَ على قراءة الكود فقط أثناء التخطيط، ولا يبدأ التعديل إلا بعد أن توافق على الخطة."
    - title: "راجعها مع زميل"
      body: "أرسل رابط الخطة إلى زميل. يمكنه قراءتها وتعديلها كضيف، ويسجّل الدخول بحساب Agent-Native ليعلّق."
