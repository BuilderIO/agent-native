faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Plan مجاني؟"
      a: "نعم، Agent-Native Plan مجاني ومفتوح المصدر. تعمل كل خطة كجلسة لوكيل البرمجة لديك، على النموذج الذي تختاره. وهذا يستهلك رموز وكيلك، والخطة الأكبر تستهلك أكثر. لا يزال Plan في مرحلة ألفا، فتوقّع تغييرات."
    - q: "مع أي وكلاء برمجة يعمل Plan؟"
      a: "لـ Claude Code وCodex إضافات جاهزة للتثبيت. وأمر تثبيت واحد يجهّز Plan أيضًا في Cursor وOpenCode وGitHub Copilot في VS Code وClaude Cowork. ويمكن لأي مضيف MCP آخر، مثل Cline أو Goose، إضافة موصل Plan بعنوان URL الخاص به. وتراجع كل خطة في متصفحك."
    - q: "كيف يختلف Plan عن وضع التخطيط في وكيل البرمجة لديّ؟"
      a: "يعطيك وضع التخطيط في Claude Code أو Codex أو Cursor أو OpenCode الخطة نصًا في المحادثة. أما Plan فيحوّل تلك الخطة، أو خطة من ملف Markdown، إلى صفحة فيها مخططات وشجرة ملفات وكود مشروح. وهناك تعلّق على أجزاء محددة، وتجيب عن أسئلة الوكيل، وتُشرك زميلًا."
    - q: "هل يغيّر الوكيل الكود أثناء التخطيط؟"
      a: "لا. أثناء كتابة الخطة أو تعديلها، تُبقي تعليمات Plan الوكيلَ على قراءة الكود فقط. ويبدأ التعديل بعد أن توافق على الخطة، ويعيد قراءة الخطة المعتمدة قبل الخطوات الكبيرة."
    - q: "هل يمكن لزميل مراجعة خطة دون حساب؟"
      a: "جزئيًا. يمكن لأي شخص تشاركه الرابط فتح الخطة وتعديلها كضيف. أما التعليق والحفظ والمشاركة فتحتاج إلى حساب Agent-Native، لذا يسجّل الزميل الذي يريد التعليق دخوله أولًا."
    - q: "هل يمكنني إبقاء الخطط على جهازي؟"
      a: "نعم. [وضع الملفات المحلية](https://www.agent-native.com/docs/template-plan-local-and-desktop/) يحفظ الخطة كملفات MDX على جهازك، فلا يصل محتواها إلى التطبيق المستضاف. وفي المقابل، لا يمكنك مشاركة الخطة المحلية أو التعليق عليها في المتصفح، ولا يفتح رابطها إلا على جهازك. ولا يغيّر وضع الملفات المحلية مكان تشغيل نموذج الذكاء الاصطناعي لوكيل البرمجة."
