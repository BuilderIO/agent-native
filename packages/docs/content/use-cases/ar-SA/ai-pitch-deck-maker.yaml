how_to:
  heading: "كيف تصنع عرضًا للمستثمرين بالذكاء الاصطناعي"
  steps:
    - title: "ابدأ من موادك الخاصة"
      body: "في الشاشة الرئيسية لـ Slides، صِف العرض الذي تريده: شركتك، ولمن هو، وكم ينبغي أن يكون طوله. أرفق أي ملاحظات أو مستندات أو مواد مرجعية لديك، ثم أنشئ العرض."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F12aade25b35944b396142acc3b8ff40c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff68c26a237fc45909db278af5b701e61
        alt: "لقطة مقرّبة لمربع الطلب في Slides: وصف عرض المؤسس مكتوب فيه، وملف ملاحظات مرفق، وأزرار الاقتراحات أسفله."
    - title: "شاهد الوكيل يبني كل شريحة"
      body: "يضع وكيل Slides أولًا مخططًا لعرضك التقديمي، ثم يبني كل شريحة في المحرر وأنت تشاهد. وإن لم يستطع قراءة ملف PDF أو موقع إلكتروني، يخبرك بذلك."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F40529b37d7614ccc8ec582e933e57034
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3d3dd1d6c9eb4aafb791d086b46b4cd1
        alt: "محرر Slides وقد اكتملت الشريحتان 1 و2، والشريحة 3 (الحل) قيد الإنشاء على اللوحة. تُظهر محادثة الوكيل المخطط وعبارة «إضافة الشريحة 3 · الحل»."
    - title: "اعرض العرض النهائي أو صدّره"
      body: "اعرض عرضك التقديمي بملء الشاشة من Slides، أو صدّره. يمكنك تصدير ملف PowerPoint قابل للتعديل، أو ملف لاستيراده في Google Slides، أو ملف HTML واحد."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe65004f2089b48b6aaeb185fe529a28a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb621a0dad79042cc8bc145cc29c855b8
        alt: "لقطة مقرّبة لقائمة التصدير في Slides مفتوحة فوق شريحة العنوان النهائية، مع خيارات HTML وPDF وPowerPoint وGoogle Slides."
features:
  heading: "كل ما تحتاجه لبناء عرضك وتقديمه"
  items:
    - title: "عروض للمستثمرين من ملاحظاتك"
      body: "ابدأ من طلب نصي أو ملاحظاتك أو مستند أو عرضك السابق. أخبر الوكيل عن شركتك وجولتك التمويلية، وسيبني العرض."
    - title: "تعديل بالذكاء الاصطناعي وتعديل مرئي"
      body: "عدّل النص والتخطيط على الشريحة بنفسك، أو حدّد سطرًا واطلب من الوكيل. لا يتغيّر إلا ما طلبته."
    - title: "علامتك التجارية على كل شريحة"
      body: "احفظ ألوانك وخطوطك وشعارك كنظام تصميم، فيبدو كل عرض تصنعه وكأنه من شركتك."
    - title: "الصور والشعارات"
      body: "اطلب من الوكيل إنشاء صور، أو العثور على صور جاهزة، أو جلب شعارات العملاء والشركاء لشرائح النمو."
    - title: "التعاون مع شريكك المؤسس"
      body: "عدّل العرض نفسه مع شريكك المؤسس والوكيل، وعلّق على أي شريحة، واستعد أي نسخة سابقة."
    - title: "قدّم وشارك وصدّر"
      body: "قدّم مع ملاحظات المتحدث، أو شارك رابط عرض فقط مع المستثمرين، أو صدّر ملف PowerPoint قابلًا للتعديل."
