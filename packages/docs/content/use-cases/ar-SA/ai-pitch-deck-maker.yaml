faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Slides مجاني؟"
      a: "نعم، Agent-Native Slides مجاني ومفتوح المصدر. يحتاج بناء العرض إلى اتصال بالذكاء الاصطناعي، إما عبر Builder.io أو عبر مفتاحك الخاص، ويحتاج إنشاء الصور إلى مفتاح Gemini أو OpenAI الخاص بك. لا يزال Slides في مرحلة ألفا، فتوقّع تغييرات مع تطوّره."
    - q: "هل يمكنني تصدير عرضي التقديمي إلى PowerPoint أو Google Slides؟"
      a: "يصدّر Slides ملف PowerPoint (PPTX) قابلًا للتعديل. أما لـ Google Slides، فيعطيك ملف PPTX مع رابط استيراد تفتحه بنفسك في Google Slides. ويمكنك أيضًا تصدير العرض كملف HTML واحد."
    - q: "هل يمكن أن يبدأ Slides من ملاحظاتي أو مستندي أو موقعي الإلكتروني؟"
      a: "صِف عرضك في الشاشة الرئيسية لـ Slides وأرفق ملاحظاتك أو مستندًا، أو أضف رابط موقعك. يمكنك أيضًا استيراد مستند Google Docs أو ملف Word أو ملف PowerPoint. وإن لم يستطع الوكيل قراءة ملف PDF أو موقع إلكتروني، يخبرك بذلك بدلًا من التخمين."
    - q: "ما الفرق بين Slides وبين أن تطلب من روبوت محادثة كتابة شرائحك؟"
      a: "يعطيك روبوت المحادثة نصًا تنسخه إلى الشرائح بنفسك. أما في Slides، فيبني الوكيل العرض الفعلي في محرر تراه أمامك. يمكنك تغيير أي شريحة بيدك أو بطلب من الوكيل، على العرض نفسه، ويمكن التراجع عن كل تغيير. وهذا ما يجعل Slides [تطبيقًا وكيليًا](https://www.agent-native.com/articles/what-is-an-agent-native-app/): ذكاء الوكيل، وسهولة التطبيق."
    - q: "هل يمكن لشريكي المؤسس تعديل العرض معي؟"
      a: "يمكنك أنت وشريكك المؤسس والوكيل تعديل العرض نفسه في الوقت ذاته. ويمكنك التعليق على شريحة أو على جزء منها. يحفظ Slides نسخة قبل كل تغيير مهم، فتستطيع استعادة نسخة سابقة في أي وقت."
    - q: "كم شريحة ينبغي أن يحتوي العرض التقديمي للمستثمرين؟"
      a: "نحو عشر شرائح طول مناسب لعرض أول ([ما الذي يتضمنه عرض المستثمرين](https://www.agent-native.com/articles/how-to-make-a-pitch-deck-with-ai/))، ويقترح Slides «أنشئ عرضا من 10 شرائح من هذا المستند». أخبر الوكيل بطول مختلف إن أردت، وسيضع المخطط بما يناسبه."
