faqs:
  heading: "لديك أسئلة؟ لدينا الإجابات"
  items:
    - q: "هل Agent-Native Design مجاني؟"
      a: "نعم، Agent-Native Design مجاني ومفتوح المصدر. يحتاج بناء الصفحة إلى اتصال بالذكاء الاصطناعي، إما عبر أرصدة Builder.io للذكاء الاصطناعي أو مفتاح الذكاء الاصطناعي الخاص بك، فاستخدام الذكاء الاصطناعي ليس بلا حدود. لا يزال Design في مرحلة ألفا، فتوقّع تغييرات مع تطوّره."
    - q: "هل ينشر Design صفحة الهبوط أو يستضيفها؟"
      a: "لا. يصنع Design صفحة الهبوط ويصدّرها، وتنشرها أنت بالأدوات التي تستخدمها اليوم. نزّل HTML أو ملف ZIP بالملفات، أو انسخ مطالبة يستخدمها وكيل البرمجة لإضافة الصفحة إلى موقعك."
    - q: "هل يمكنني استخدام هوية علامتي؟"
      a: "نعم. أنشئ نظام تصميم من ملف Figma أو موقعك أو مستودع GitHub أو ملفات ترفعها، واختره عند بدء صفحة. ويحافظ الوكيل على ألوانه وخطوطه وأنماطه في كل نسخة يصنعها."
    - q: "هل يمكنني تعديل صفحة الهبوط بعد أن يصنعها الذكاء الاصطناعي؟"
      a: "نعم. غيّر النصوص والألوان والمسافات والتخطيط بيدك على الصفحة، أو اطلب من الوكيل تغيير قسم. ويمكنك استعادة نسخة سابقة من **سجل الإصدارات** في أي وقت."
    - q: "ماذا أحصل عليه عند تصدير صفحة الهبوط؟"
      a: "يعطيك **تنزيل HTML** ملفًا واحدًا يفتح في أي متصفح ويحمّل أنماطه عبر الإنترنت. ويضم **تنزيل ZIP** كل ملفات الصفحة، ويعطيك **تنزيل لـ Figma ‏(SVG)** طبقات يمكنك تعديلها في Figma. وتسرد الوثائق [كل خيارات التصدير](https://www.agent-native.com/docs/template-design-features/#export)."
    - q: "كيف يختلف Design عن طلب صفحة هبوط من روبوت محادثة؟"
      a: "يعطيك روبوت المحادثة كودًا تلصقه في مكان ما قبل أن ترى الصفحة. أما في Design، فيبني الوكيل الصفحة في محرر تراه وتنقر فيه، وبعدة نسخ. وتغيّرها بيدك أو بالطلب، على الصفحة نفسها. وهذا [تطبيق وكيلي](https://www.agent-native.com/articles/what-is-an-agent-native-app/): ذكاء الوكيل وسهولة التطبيق."
