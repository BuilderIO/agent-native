title: "حوّل موجز الإطلاق إلى نموذج أولي لصفحة هبوط"
seo_title: "نماذج صفحات هبوط أولية بالذكاء الاصطناعي لإطلاقك"
meta_description: "أعطِ Agent-Native Design موجز الإطلاق، واحصل على عدة نسخ من صفحة الهبوط بهوية علامتك لتتنقل فيها وتقارن بينها وتصدّرها HTML. مجاني ومفتوح المصدر."
updated: 2026-10-27
hero:
  body: "يبني Agent-Native Design عدة نسخ جنبًا إلى جنب، بهوية علامتك. عدّل ما تختاره بيدك أو بالطلب، ثم نزّله كملف HTML لتضيفه إلى موقعك."
  button:
    label: "صمّم صفحتك"
    url: https://design.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9b9b61c476d745258cbb0f1b78da71be
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F921c26eb2c474e48b203e069b070269f
    alt: "محرر Design مع نسخة Product-first من صفحة إطلاق لميزة الدفع للمتعاقدين في اليوم نفسه من Ledgerlane، في إطاري سطح المكتب والجوال. وتعرض محادثة الوكيل على اليسار موجز الإطلاق، والنسخ الثلاث التي اقترحها مع اختيار Product-first، وملاحظته بأن الصفحة اكتمل بناؤها."
how_to:
  heading: "كيف تصنع نموذجًا أوليًا لصفحة هبوط بالذكاء الاصطناعي"
  steps:
    - title: "صِف إطلاقك"
      body: "في الشاشة الرئيسية لـ Design، الصق موجز الإطلاق في مربع **تصميم جديد**: [العرض، ولمن هو، والدعوة إلى الإجراء](https://www.agent-native.com/articles/how-do-you-build-a-landing-page-with-ai/). أو أرفق الموجز كملف، واختر نظام تصميم علامتك أسفل المربع."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8d189f62f944b3d935b058b826150b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8db8cda1abfe476f954bfa5bc50a7b6d
        alt: "لقطة مقرّبة لمربع New design في الشاشة الرئيسية لـ Design. فيه موجز إطلاق لميزة الدفع في اليوم نفسه من Ledgerlane، وملف PDF للموجز مرفق، ونظام التصميم Ledgerlane Brand مختار."
    - title: "قارن بين عدة نسخ"
      body: "اطلب من الوكيل «ثلاث نسخ». تظهر كل نسخة كشاشة مستقلة، جنبًا إلى جنب على اللوحة. اختر واحدة في المحادثة، فيحوّلها الوكيل إلى الصفحة الكاملة ويزيل البقية."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F45d7dcdb0a2d473e82e516e2419e21f0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe7aac725b27c4046b57faf5e69a2abf2
        alt: "ثلاث نسخ من صفحة إطلاق الدفع في اليوم نفسه، Product-first وEditorial وProof-led، جنبًا إلى جنب على اللوحة. وتسأل محادثة الوكيل أيها يبني، مع زر لكل منها."
    - title: "صدّر HTML الصفحة"
      body: "من قائمة المحرر، اختر **ملف** ثم **تصدير**. يعطيك **تنزيل HTML** ملفًا واحدًا يفتح في أي متصفح. ويعطي **نسخ مطالبة الوكيل** وكيل البرمجة ما يحتاجه لبناء الصفحة في موقعك."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F171cf01db5ca44ee8d31ebb6f98a73b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd2640c796dc44746ae1c8a622ec49bdc
        alt: "لقطة مقرّبة لقائمة المحرر وفيها File وExport مفتوحتان فوق صفحة الإطلاق Product-first. ومن الخيارات Download HTML وDownload ZIP وDownload for Figma (SVG) وCopy agent prompt."
features:
  heading: "كل ما تحتاجه لتصميم صفحة إطلاقك"
  items:
    - title: "من الموجز إلى صفحة الهبوط"
      body: "يبني الوكيل من الادعاءات الموجودة في موجزك بدلًا من اختلاق ادعاءات جديدة. وعندما يترك الموجز خيارًا مفتوحًا، يسأل أو يذكر ما افترضه."
    - title: "تعديل بالذكاء الاصطناعي وبصريًا"
      body: "غيّر العنوان أو اللون أو المسافات بنفسك، أو اطلب من الوكيل إعادة صياغة قسم. أنتما تعدّلان الصفحة نفسها."
    - title: "نسخ جنبًا إلى جنب"
      body: "لكل نسخة مظهرها الخاص وتخطيط للجوال، فيقارن فريقك بين اتجاهات حقيقية قبل أن يُطلق أي شيء."
    - title: "كل إطلاق بهوية علامتك"
      body: "أنشئ نظام تصميم من ملف Figma أو موقعك أو الكود مرة واحدة. وكل صفحة إطلاق جديدة تستخدم ألوانك وخطوطك وأنماطك."
    - title: "ملاحظات مثبّتة على الصفحة"
      body: "يثبّت المراجعون تعليقاتهم على العنوان أو الزر بالضبط. أرسل أحدها إلى الوكيل: فيُجري التغيير، أو يطلب منك أن تقرر."
    - title: "تسليم الكود للمطوّر"
      body: "تحمل مطالبة الوكيل رموز التصميم وملفات الصفحة والتعليمات التي يحتاجها وكيل البرمجة لبنائها في موقعك."
