faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Analytics free?
      a: "Yes, Agent-Native Analytics is free and open source. Use the hosted app, or [run your own copy](https://www.agent-native.com/docs/template-analytics/). You bring the data: your own events, or the tools you connect. Analytics is in alpha, so expect changes."
    - q: Do I need to know SQL?
      a: No. Ask in plain English, and the agent writes and runs the SQL, then answers with a chart, a table or a number. Ask to see the query when you want to check it. Someone who knows your data may need to [connect your sources](https://www.agent-native.com/docs/template-analytics-connectors/) first.
    - q: Where do the session replays come from?
      a: "From your own web app. Create a public key on **Data Sources**, then add the short tracking snippet from the **Sessions** page to your app, with session replay turned on. Connect storage for the recordings: Builder.io or your own S3 bucket. By default, [replays](https://www.agent-native.com/docs/template-analytics-monitoring-and-sessions/) record only signed-in users."
    - q: What does a session replay record?
      a: A replay plays back the page, clicks and scrolling, console output and network requests. Typing is masked by default, and fields named as passwords or card details are never captured. To hide anything else, add a class to that part of the page.
    - q: Can I use my PostHog, Amplitude or Mixpanel data?
      a: Yes. Connect them on **Data Sources** and ask about the events you track there. The agent queries each tool for you. Session replays come only from Analytics' own tracking, so add it to your app to watch the people who stopped.
    - q: How is Analytics different from the AI in my analytics tool?
      a: "The AI in an analytics tool works on that tool's data. The Analytics agent works across every source you connect, finds the replays of the exact people who stopped, and explains any of them or hands it to your coding agent. It's also open source. That's an [agentic app](https://www.agent-native.com/articles/what-is-an-agent-native-app/): the brains of an agent, the intuitiveness of an app."
