slug: spec-your-coding-agent-builds-from
job_id: job-agent-spec
app: content
audience: technical
title: "Write the spec your coding agent builds from"
subhead: "Keep specs and decisions in Content, and connect Claude Code, Codex, or Cursor, so your agent works from the same page you wrote."
meta_description: "Keep specs and decisions in one place and connect Claude Code, Codex, or Cursor so your agent works from the same page. Free, open-source Content from Agent-Native."
cta_label: "Try Content"
secondary_cta_label: "See how it works"
app_cta_url: "https://content.agent-native.com"
screenshot_alt: "The Content app with a document open and the agent chat beside it"
old_way:
  heading: "How most people do it today"
  body: "The spec lives in a doc your agent can't open, so you paste chunks of it into every prompt. When the doc changes, your agent is still working from the old paste."
replaces:
  - "Notion"
  - "Google Docs"
new_way:
  heading: "How it works in Content"
  steps:
    - "Write the spec as a Content page."
    - "Connect your coding agent to Content through MCP. Claude Code, Codex, and Cursor are supported."
    - "Point your agent at the page, and add page instructions that tell it how to work with the spec."
todays_stack:
  heading: "Where a spec lives today"
  items:
    - tool: "A doc tool"
      used_for: "Writing the spec"
      breaks: "Your coding agent can't open it."
    - tool: "Your agent's prompt"
      used_for: "Giving the agent the spec"
      breaks: "You paste chunks, and the copy goes stale when the doc changes."
    - tool: "Chat threads"
      used_for: "Recording decisions"
      breaks: "Decisions get lost, and the spec never hears about them."
  in_app: "In Content, the spec, the decisions, and the tasks live in pages and databases your coding agent can reach through MCP."
frequency: per-project
how_often_label: "Every feature"
roles: [engineering, product]
connects_to: ["Claude Code", "Codex", "Cursor"]
next_jobs: [see-what-your-coding-agent-plans, wireframe-before-agent-builds]
recipes:
  - id: write-spec
    title: "Write a spec your agent can read"
    when: "You're about to hand a feature to your agent."
    do: "Write the spec as a Content page, then point your connected agent at it."
    you_get: "An agent working from the current spec instead of an old paste."
    save: "The MCP connection stays in place for every spec after this."
    how_often: "Every feature"
  - id: page-instructions
    title: "Tell the agent how to use the page"
    when: "You want the agent to follow your conventions."
    do: "Add page instructions, like which sections are decided and which are still open."
    you_get: "An agent that knows what to treat as settled."
    how_often: "Every feature"
  - id: track-requests
    title: "Track the work in a database"
    when: "Requests are piling up in chat."
    do: "Set up a database with field instructions, so the agent can ask for missing details."
    you_get: "Requests with the information you need, in one place."
    how_often: "Ongoing"
story: null
faqs:
  - q: "Which coding agents can connect to Content?"
    a: "Content connects to agents like Claude Code, Codex, and Cursor through MCP."
  - q: "What are page instructions?"
    a: "Instructions you attach to a page that tell the agent how to work with it. Databases can have field instructions too."
  - q: "What goes in a spec?"
    a: "The problem, the goals and non-goals, the proposed approach, and the open questions. Keep it short enough that your agent and your teammates read all of it."
  - q: "Is Content free?"
    a: "Yes. Content is free and open source. It's labeled alpha, so expect rough edges."
cta_band_heading: "Write your next spec where your agent can read it"
cta_band_subhead: "One page for you, your team, and your coding agent."
