template: v2
slug: ask-your-database
app: analytics
title: Ihren Daten Fragen in normaler Sprache stellen
seo_title: Fragen an Ihre Datenbank stellen, ohne SQL
meta_description: "Stellen Sie eine Frage zu Ihren BigQuery-Daten: Agent-Native Analytics antwortet mit prüfbarem, rein lesendem SQL und legt wiederkehrende Fragen im Dashboard ab."
updated: 2026-10-27
hero:
  body: Agent-Native Analytics beantwortet sie aus Ihren BigQuery-Daten und hält wiederkehrende im Dashboard fest. Der Agent schreibt rein lesendes, prüfbares SQL.
  button:
    label: Ihre Daten fragen
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd1120abfcd1447b9ab48ff98a9b7592d
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2db877a772674ad4af41e7efbb062d50
    alt: Analytics mit geöffnetem Bereich „Fragen“. Der Agent beantwortet eine Frage zu den Signups der letzten Woche mit einem Balkendiagramm nach Tarif und der Tabelle, aus der er gezählt hat. Darunter zeigt eine Folgefrage, dass Pro am stärksten gewachsen ist.
how_to:
  heading: So stellen Sie Ihrer Datenbank Fragen in normaler Sprache
  steps:
    - title: Ihr Data Warehouse verbinden
      body: Öffnen Sie auf der Seite **Datenquellen** BigQuery. Laden Sie den JSON-Schlüssel eines Dienstkontos mit den Rollen BigQuery Data Viewer und BigQuery Job User hoch, geben Sie Ihre Projekt-ID ein und klicken Sie auf **Anmeldeinformationen speichern** und **Verbindung testen**.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F62008ebd98594f02b1c0bf3ae565ef49
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb01d428bca15467eb4c04299dd9575b8
        alt: Nahaufnahme der BigQuery-Karte auf der Seite „Datenquellen“, als verbunden markiert, mit Projekt-ID und Dienstkonto als konfiguriert und „Verbindung erfolgreich“.
    - title: Ihre Frage in normaler Sprache stellen
      body: "Geben Sie unter **Fragen** Ihre Frage so ein, wie Sie ein Teammitglied fragen würden: „Wie viele Accounts haben sich letzte Woche registriert, nach Tarif?“ Der Agent findet die passenden Tabellen, führt die Abfrage aus und antwortet mit einem Diagramm."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3e9ac5b30a924dab9b09bc76ed24b2de
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F31c48c5ccc9247b792c00474b01f97b0
        alt: Nahaufnahme des Chats unter „Fragen“. Der Agent hat das BigQuery-Schema durchsucht, eine Abfrage ausgeführt und mit 723 Signups und einem Balkendiagramm nach Tarif geantwortet.
    - title: Die Antwort in einem Dashboard behalten
      body: Bitten Sie den Agenten, die Antwort „zu einem Dashboard hinzuzufügen“. Er baut das Panel, prüft, ob sein SQL läuft, und speichert das Dashboard. Es bleibt privat, bis Sie es mit einem Teammitglied oder Ihrer ganzen Organisation teilen.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F957858f8613241a2b2249d88430b3cc4
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd0111e9f420149fc8a35cad845ad8e2e
        alt: Ein neues Dashboard „Wöchentliche Signups“ mit dem Panel „Signups nach Tarif“ und einem Diagramm der Signups pro Woche. Der Agenten-Chat daneben meldet, dass beide Panels gegen BigQuery geprüft wurden.
features:
  heading: Alles, um Antworten aus Ihrer Datenbank zu bekommen
  items:
    - title: Das SQL hinter jeder Antwort
      body: Öffnen Sie **SQL anzeigen** an einem Dashboard-Diagramm oder fragen Sie im Chat, um die Abfrage des Agenten zu sehen und sie zum eigenen Ausführen zu kopieren.
    - title: Die Kennzahl-Definitionen Ihres Teams
      body: Ein Admin hält auf der Seite **Semantische Ebene** fest, was „aktiv“ oder „Signup“ bedeutet. Der Agent liest das, bevor er SQL schreibt.
    - title: Abfragen, die keine Daten ändern können
      body: In BigQuery kann das SQL des Agenten nichts einfügen, ändern oder löschen, und er verbindet sich über ein Dienstkonto, das nur Tabellen lesen und Abfragen ausführen darf.
    - title: Dashboards, die der Agent bearbeitet
      body: Bitten Sie im Chat um ein weiteres Panel, einen Filter oder eine Aufschlüsselung nach Tarif, und der Agent ändert das Dashboard für alle, mit denen Sie es geteilt haben.
    - title: Fragen über Ihre Tools hinweg
      body: Stellen Sie eine Frage, die Tabellen aus Ihrem Warehouse mit Umsatz aus Stripe, Deals aus HubSpot oder Events aus PostHog verbindet.
    - title: Das Dashboard im Postfach
      body: Erhalten Sie ein Dashboard jeden Tag zur gewünschten Zeit per E-Mail, mit Diagrammen und Tabellen direkt in der Mail, für bis zu fünf Personen.
integrations:
  heading: Verbinden Sie Analytics mit den Tools, die Sie schon nutzen
  cards:
    - title: Ihr Warehouse und Ihre Kennzahlen
      logos:
        - name: BigQuery
      body: Analytics fragt Ihre BigQuery-Tabellen ab und antwortet mit den Kennzahl-Definitionen, die Ihr Team auf der Seite **Semantische Ebene** pflegt.
    - title: Umsatz- und Produktdaten ergänzen
      logos:
        - name: Stripe
        - name: HubSpot
        - name: PostHog
      body: Verbinden Sie Stripe, HubSpot oder PostHog, damit eine Antwort Zahlen aus der Datenbank neben Umsatz, Deals oder Produkt-Events stellen kann.
    - title: Alles per MCP verbinden
      logos:
        - name: Supabase
        - name: Neon
        - name: Notion
      more: true
      body: Verbinden Sie die Tools Ihres Teams per MCP oder fügen Sie einen beliebigen MCP-Server über seine URL hinzu.
