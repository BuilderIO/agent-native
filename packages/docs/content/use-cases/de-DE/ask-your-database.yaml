faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Analytics kostenlos?
      a: Ja, Agent-Native Analytics ist kostenlos und Open Source. Nutzen Sie die gehostete App oder betreiben Sie Ihre eigene Kopie. Der Agent braucht eine KI-Anbindung über Builder.io oder Ihren eigenen Modell-Schlüssel, die KI-Nutzung ist also nicht unbegrenzt. Analytics ist in der Alpha-Phase, rechnen Sie also mit Änderungen.
    - q: Muss ich SQL können?
      a: Nein. Sie fragen in normaler Sprache, und der Agent schreibt das SQL. Eventuell muss jemand, der Ihre Daten kennt, zuerst [BigQuery verbinden](https://www.agent-native.com/docs/template-analytics-connectors/). Ein Admin kann Ihre [Kennzahl-Definitionen](https://www.agent-native.com/docs/template-analytics-dashboards/) auf der Seite **Semantische Ebene** hinterlegen, damit der Agent die richtigen Tabellen und Spalten wählt.
    - q: Funktioniert es mit Postgres, Supabase oder Neon?
      a: Ja, für Postgres auf Supabase oder Neon. Verbinden Sie es [per MCP](https://www.agent-native.com/docs/mcp-clients/) über das +-Menü im Chat und stellen Sie Ihre Frage im Chat. Diese Antworten bleiben im Chat, weil Dashboard-Panels Postgres noch nicht abfragen können. Andere Postgres-Datenbanken lassen sich noch nicht abfragen, deshalb nutzen die Schritte auf dieser Seite BigQuery.
    - q: Kann der Agent meine Daten ändern?
      a: In BigQuery nicht. Analytics lehnt dort jede Abfrage des Agenten ab, die Daten einfügen, ändern, löschen oder verwerfen würde. Die Einrichtung verlangt außerdem ein Dienstkonto mit reinen Leserollen, das Ihre Tabellen lesen und Abfragen ausführen, sie aber nicht ändern kann. Über Supabase oder Neon kann der Agent das tun, was Sie dieser Verbindung erlauben.
    - q: Woher weiß ich, dass eine Antwort stimmt?
      a: Prüfen Sie die Abfrage dahinter. Bitten Sie den Agenten, sein SQL zu zeigen, oder öffnen Sie **SQL anzeigen** an einem Dashboard-Diagramm. Sie können auch fragen, welche Tabellen und Filter er genutzt hat. Der Agent markiert eine Zahl als **Unverified**, wenn keine Live-Abfrage lief.
    - q: Was ist anders, als ChatGPT zu einem CSV-Export zu fragen?
      a: "Ein Chat-Assistent antwortet aus der exportierten Datei, also beginnt jede neue Frage mit einem neuen Export. Analytics fragt Ihr Warehouse direkt ab, nutzt die Kennzahl-Definitionen Ihres Teams und hält Antworten, die Sie wieder brauchen, in einem Dashboard fest. Das ist eine [agentische App](https://www.agent-native.com/articles/what-is-an-agent-native-app/): die Intelligenz eines Agenten, die Intuitivität einer App."
