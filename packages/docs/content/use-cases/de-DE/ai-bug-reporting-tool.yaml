faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Clips kostenlos?
      a: Ja. Agent-Native Clips ist kostenlos und Open Source, auch die Chrome-Erweiterung. Titel, Zusammenfassungen und die Bereinigung des Transkripts laufen standardmäßig über Builder.io-KI-Guthaben, die KI-Nutzung ist also nicht unbegrenzt, und Aufnahmen brauchen einen Speicherort für das Video. Clips ist in der Alpha-Phase, rechnen Sie also mit Änderungen.
    - q: Was erfasst Clips aus meinem Browser?
      a: Die Clips-Chrome-Erweiterung erfasst [Konsolenmeldungen, JavaScript-Fehler und Netzwerkanfragen](https://www.agent-native.com/docs/template-clips-features/#chrome-extension-browser-logs) aus bis zu fünf Tabs, bis zu 30 Sekunden vor dem Aufnahmestart. Jede Anfrage behält Adresse, Status, Dauer und ob sie fehlgeschlagen ist. Bearbeiter sehen alles im Tab „Debug“ des Clips, Agenten erhalten es über den Link.
    - q: Zeichnet Clips Passwörter oder private Daten auf?
      a: Clips speichert nie Anfrage- oder Antwort-Bodys, Header, Cookies oder eingegebenen Text und schwärzt Werte, die nach Tokens, Passwörtern oder Schlüsseln aussehen. Entwickler-Logs lassen sich in den Einstellungen der Erweiterung abschalten. Neue Aufnahmen sind per Link öffentlich, stellen Sie einen Fehlerbericht daher auf privat oder auf Ihre Organisation, wenn er interne Daten zeigt.
    - q: Wie gebe ich eine Fehleraufnahme an Claude Code, Cursor oder Codex weiter?
      a: Fügen Sie den Link des Clips in Claude Code, Cursor oder Codex ein, und der Agent [liest Transkript, Frames und Browser-Logs](https://www.agent-native.com/docs/template-clips-integrations/#agent-readable-clips), ohne das Video herunterzuladen. Bei einem privaten Clip klicken Sie im Tab „Agenten“ des Menüs „Teilen“ auf „Agent-Prompt kopieren“, was dem Agenten einen Link gibt, der zwei Stunden gültig ist. Dieser Tab öffnet den Clip auch in Claude Code oder Codex.
    - q: Erfasst Clips Logs in anderen Browsern oder in der Desktop-App?
      a: Nein. Konsolen- und Netzwerk-Logs kommen nur von der Clips-Chrome-Erweiterung. Clips Desktop und die Web-App nehmen weiterhin Bildschirm, Kamera und Stimme mit Transkript und Zusammenfassung auf, aber die Aufnahme enthält keine Browser-Logs.
    - q: Ist Clips ein Bug-Tracker wie Jira?
      a: "Nein. Clips erstellt [einen Fehlerbericht, mit dem ein Entwickler arbeiten kann](https://www.agent-native.com/articles/how-to-write-a-bug-report/), und Ihr Tracker speichert ihn: Fügen Sie den Link in Jira, GitHub, Linear oder Slack ein. Ihr Coding-Agent oder der [Clips-Agent](https://www.agent-native.com/docs/template-clips-agent/) liest die Aufnahme selbst und ihre Logs. Das macht Clips zu einer [agentischen App](https://www.agent-native.com/articles/what-is-an-agent-native-app/): die Intelligenz eines Agenten, die Intuitivität einer App."
