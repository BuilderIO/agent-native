how_to:
  heading: So melden Sie einen Fehler mit KI
  steps:
    - title: Die Aufnahme in Chrome starten
      body: "Klicken Sie in der Symbolleiste auf die Clips-Chrome-Erweiterung und wählen Sie die Quelle: einen Browser-Tab, ein Fenster oder den ganzen Bildschirm. Schalten Sie Kamera und Mikrofon ein oder aus und klicken Sie auf „Start recording“."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6996593713c74108967e120111378c14
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff7991811f7a346e0a99cf9fe81496e34
        alt: Nahaufnahme des Clips-Erweiterungs-Popups über einer Web-App, mit „Browser tab“ als Quelle, eingeschalteter Kamera und eingeschaltetem Mikrofon und der Schaltfläche „Start recording“.
    - title: Den Fehler zeigen und erklären
      body: Klicken Sie durch die Schritte, die scheitern, und sagen Sie, was Sie erwartet hätten. Während der Aufnahme speichert die Erweiterung die Fehler der Seite und die gesendeten Anfragen, also das, was ein Entwickler sonst mühsam aus den Entwicklertools von Chrome holt.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe01ffb73c62c427b8077f05657fdeb47
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff895d85667344971baec96eb0b2ec956
        alt: Die Clips-Aufnahmesteuerung und die Kamerablase über der Checkout-Seite einer Web-App, auf der die Meldung „Something went wrong“ erscheint.
    - title: Einen Link teilen
      body: Beim Stoppen kopiert Clips den Link der Aufnahme für Sie. Fügen Sie ihn in ein Ticket, einen Chat oder Ihren Coding-Agenten ein. Der Tab „Agenten“ im Menü „Teilen“ öffnet ihn auch direkt in Claude, Claude Code oder Codex.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F10933b64225545e1b5ecd666f5803832
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2894036362f7409d8a4961536719b399
        alt: "Nahaufnahme des Clips-Menüs „Teilen“ im Tab „Agenten“ mit „Agent-Prompt kopieren“ und den Schaltflächen „In Claude öffnen“, „In Claude Code öffnen“ und „In Codex öffnen“."
features:
  heading: Alles, was Sie für einen Fehlerbericht brauchen
  items:
    - title: Für Ihren Coding-Agenten gemacht
      body: Fügen Sie den Link in Claude Code, Cursor oder Codex ein. Der Agent liest Transkript, Frames und Logs, ohne das Video herunterzuladen.
    - title: Konsolen- und Netzwerk-Logs
      body: Clips speichert Konsolenmeldungen, Fehler und Anfragen aus bis zu fünf Tabs, mit Status und Dauer jeder Anfrage und ob sie fehlgeschlagen ist.
    - title: Die 30 Sekunden davor
      body: Clips greift bis zu 30 Sekunden vor den Aufnahmestart zurück, sodass auch ein Fehler beim Laden der Seite im Bericht landen kann.
    - title: Geheimnisse bleiben draußen
      body: Clips speichert nie Anfrage-Bodys, Header, Cookies oder Eingaben und schwärzt Werte, die nach Tokens oder Passwörtern aussehen.
    - title: Direkt zum Fehler springen
      body: Klicken Sie im Tab „Debug“ des Clips auf die Zeit neben einem Fehler oder einer fehlgeschlagenen Anfrage, und das Video springt zu diesem Moment.
    - title: Alle Fehlerberichte durchsuchen
      body: Finden Sie jeden Fehlerbericht über das, was darin gesagt wurde, oder fragen Sie den Clips-Agenten über alle Aufnahmen Ihrer Bibliothek.
