title: KI-Diktat
seo_title: KI-Diktat für Coding-Agenten, Slack und Dokumente
meta_description: Sprechen Sie lange Prompts in Claude Code, Slack oder ein Dokument, statt sie zu tippen. Agent-Native Clips ist kostenloses Open-Source-KI-Diktat, das jedes Diktat speichert.
updated: 2026-10-26
hero:
  body: Sprechen Sie Ihren ganzen Prompt, statt ihn zu tippen, und er landet am Cursor, von Claude Code bis Slack. Agent-Native Clips speichert jedes Diktat, und sein Agent überarbeitet es auf Anfrage.
  button:
    label: Diktieren starten
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb42e201ec33f4acf8f8b6d39f67a2503
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3b0e34d91eee4240a0211ba4ca9b0859
    alt: "Die Clips-Seite „Diktieren“ mit den heutigen Diktaten: ein langer Prompt für einen Coding-Agenten, ein Bug-Ticket und ein Slack-Update. Die Karte des Prompts ist geöffnet und zeigt „Original“ und „Bereinigt“."
how_to:
  heading: So nutzen Sie KI-Diktat
  steps:
    - title: In jeder App diktieren
      body: Installieren Sie Clips Desktop, klicken Sie in Claude Code, Linear oder Slack und halten Sie beim Sprechen Ihr Kürzel gedrückt (standardmäßig Fn, oder eines, das Sie in den Einstellungen wählen). Lassen Sie los, und Clips setzt Ihre Worte an den Cursor.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F493f3728ed1246bb841a651e3aa76300
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb3785ba8ec804690836d94e31ff92e17
        alt: "Der Chat eines Coding-Agenten: Ein diktierter Prompt zu Webhook-Wiederholungen wurde gesendet, und der Agent hat die Änderung vorgenommen. Der Cursor wartet im Nachrichtenfeld, während die Clips-Pille darunter auf den nächsten Prompt hört, ihre grüne Wellenform ausgeschlagen."
    - title: Clips Ihre Wörter beibringen
      body: Öffnen Sie auf der Seite „Diktieren“ das „Wörterbuch“ und tragen Sie Produkt-, Bibliotheks- und Kollegennamen ein, oder „Begriff → Ersatz“ für ein Wort, das Clips immer falsch versteht. Mit dem Import einer CSV-Datei fügen Sie eine ganze Liste auf einmal hinzu.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F855c88996488417e8dc3a532a0fd21a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff4e9c0557a1344f6a55e7e9c4356a5ab
        alt: "Das „Wörterbuch“ in Clips mit „Begriffe hinzufügen“, „Importieren“ und „CSV exportieren“. Darunter stehen Begriffe wie Agent-Native, „web hooks → webhooks“ und „kube control → kubectl“."
    - title: Ein früheres Diktat finden
      body: Drücken Sie in Clips Cmd+K und tippen Sie ein Wort, das Sie gesagt haben. Die passenden Diktate erscheinen mit der App, in der Sie sie gesprochen haben. Wählen Sie eines, um es auf der Seite „Diktieren“ zu öffnen.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5e344071b49f4e51ae5eef2708c46605
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F13f558e09094404f975350ad0c359acc
        alt: 'Das Clips-Suchmenü mit dem Suchbegriff „webhook“ und zwei früheren Diktaten unter „Diktieren“: ein Prompt, der in Cursor diktiert wurde, und eine Nachricht, die in Slack diktiert wurde.'
features:
  heading: Alles, was Sie zum Diktieren statt Tippen brauchen
  items:
    - title: Ihre Zwischenablage bleibt erhalten
      body: Clips fügt in Apps ein und stellt Ihre Zwischenablage wieder her, der kopierte Link ist also noch da. In Terminals tippt es stattdessen.
    - title: Umkehrbare KI-Bereinigung
      body: Clips korrigiert falsch verstandene Wörter, Kommas und Großschreibung, automatisch oder per Klick. Das Original bleibt erhalten.
    - title: Lernt aus Ihren Korrekturen
      body: Korrigieren Sie ein falsch verstandenes Wort direkt nach dem Einfügen, und die Desktop-App merkt es sich im Wörterbuch.
    - title: Freihändig für lange Prompts
      body: Tippen Sie Ihr Kürzel zweimal, damit Clips weiter zuhört, während Sie laut nachdenken, und einmal, um zu stoppen. Mit Esc verwerfen Sie ein Diktat.
    - title: Erneut einfügen
      body: Drücken Sie Cmd+Ctrl+V, um Ihr letztes Diktat in ein anderes Textfeld erneut einzufügen, praktisch, wenn der Cursor an der falschen Stelle stand.
    - title: Den Agenten dazu fragen
      body: Fragen Sie „Was habe ich zum Q3-Budget gesagt?“ oder „Mach aus dem Gerede Stichpunkte“, und der Agent arbeitet mit Ihrem Verlauf.
