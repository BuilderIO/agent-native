faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Clips kostenlos?
      a: Ja. Agent-Native Clips ist kostenlos und Open Source, und das Sprachdiktat ist in der Desktop-App standardmäßig aktiv. Die KI-Bereinigung läuft über Builder.io-KI-Guthaben oder Ihren eigenen Schlüssel und ist daher nicht unbegrenzt. Clips ist in der Alpha-Phase, rechnen Sie also mit Änderungen.
    - q: Worin unterscheidet sich Clips vom Diktat, das mein Computer schon mitbringt?
      a: Das eingebaute Diktat braucht keine Einrichtung, führt aber keinen [durchsuchbaren Verlauf des Gesagten](https://www.agent-native.com/articles/what-should-you-look-for-in-dictation-software/). Clips speichert jedes Diktat mit Original- und bereinigtem Text, lernt Ihre Wörter und glättet den Text mit KI. Der Clips-Agent kann Gesagtes finden und überarbeiten, etwa Gerede in Stichpunkte verwandeln.
    - q: Schreibt Clips den Fachjargon meines Teams richtig?
      a: Ja, sobald die Begriffe in Ihrem Wörterbuch stehen. Tragen Sie sie zeilenweise ein, oder als „Begriff → Ersatz“ für ein Wort, das es immer falsch versteht. Sie können auch eine CSV-Datei mit Begriffen importieren. Korrigieren Sie ein Wort direkt nach dem Einfügen, speichert die Desktop-App die Korrektur für das nächste Mal in Ihrem Wörterbuch.
    - q: Werden meine Diktate gespeichert, und finde ich ein altes wieder?
      a: Jedes Diktat wird mit Original- und bereinigtem Text, Zeit und Länge gespeichert und erscheint, nach Tagen gruppiert, auf der Seite „Diktieren“. Mit Cmd+K durchsuchen Sie sie nach Gesagtem, oder fragen Sie den [Clips-Agenten](https://www.agent-native.com/docs/template-clips-agent/), zum Beispiel „Zeig mir, was ich gestern diktiert habe“. Jedes Diktat lässt sich löschen.
    - q: Verlässt meine Stimme meinen Computer?
      a: Das muss sie nicht. Clips Desktop kann auf Ihrem Gerät transkribieren, mit eingebauter Spracherkennung oder Local Whisper ([Transkriptions-Engines in Clips](https://www.agent-native.com/docs/template-clips-features/)). Mit Builder.io oder Ihrem eigenen Schlüssel sendet Clips Ihr Diktat zur Bereinigung an diesen KI-Dienst. Der Text jedes Diktats wird in Ihrem Clips-Konto gespeichert.
