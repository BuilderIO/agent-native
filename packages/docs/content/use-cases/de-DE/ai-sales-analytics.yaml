faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Analytics kostenlos?
      a: Ja, Agent-Native Analytics ist kostenlos und Open Source. Der Agent läuft über Builder.io-KI-Guthaben oder Ihren eigenen KI-Schlüssel, die KI-Nutzung ist also nicht unbegrenzt. Fragen zu Anrufen können auch Ihre Gong-API-Guthaben nutzen, was ein Admin abschalten kann. Analytics ist in der Alpha-Phase.
    - q: Mit welchen CRM- und Anruf-Tools verbindet sich Agent-Native Analytics?
      a: Analytics verbindet sich mit HubSpot für Ihr CRM und Gong für Ihre Vertriebsanrufe. Apollo und Clay lassen sich ebenfalls verbinden, für Kontakt- und Firmendaten. Jedes Tool [verbinden Sie auf der Seite „Datenquellen“](https://www.agent-native.com/docs/template-analytics-connectors/) mit eigenem Schlüssel, und eine Frage kann HubSpot und Gong zusammen nutzen.
    - q: Muss ich SQL schreiben?
      a: Nein. Sie fragen in normaler Sprache, und der Agent findet die Daten in HubSpot oder Gong, führt die Abfrage aus und antwortet mit einer Zahl, einer Tabelle oder einem Diagramm. Wenn Sie eine Antwort in einem Dashboard speichern, legt der Agent fest, wie jedes Panel frische Daten abruft.
    - q: Kann ich den Zahlen vertrauen?
      a: "Ja, mit einer Prüfung: Der Agent antwortet aus Live-Daten von HubSpot und Gong und markiert eine Zahl als „Unverified“, wenn sie nicht aus einer Live-Abfrage stammt. Er folgt den [Definitionen Ihres Teams auf der Seite „Semantische Ebene“](https://www.agent-native.com/docs/template-analytics-dashboards/). Vergleichen Sie die ersten Antworten mit HubSpot, bevor Sie sich darauf verlassen."
    - q: Worin unterscheidet sich Agent-Native Analytics von der KI in HubSpot oder Gong?
      a: Die KI in HubSpot oder Gong ist in dieses eine Tool eingebaut. Analytics beantwortet eine Frage aus HubSpot und Gong zusammen, liest auch Stripe und BigQuery und behält die Antwort als Dashboard, das Ihr Team jede Woche wieder öffnet. Sie nutzen HubSpot und Gong weiter wie bisher, und Analytics liest aus beiden.
    - q: Wer kann meine Dashboards sehen?
      a: Nur Sie, bis Sie eines teilen. Teilen Sie ein Dashboard mit einem Teammitglied oder Ihrer ganzen Organisation als Betrachter, Bearbeiter oder Admin. Teammitglieder sehen HubSpot- und Gong-Daten über ihre eigene Verbindung oder eine, die ein Admin für die Organisation eingerichtet hat; ohne beides zeigen diese Panels einen Fehler.
