how_to:
  heading: So analysieren Sie Ihre Sales-Pipeline mit KI
  steps:
    - title: CRM- und Anrufdaten verbinden
      body: Öffnen Sie **Datenquellen** und klicken Sie unter **CRM & Sales** neben HubSpot auf **Verbinden**. Fügen Sie das Token einer privaten App ein, die Sie in den HubSpot-Einstellungen anlegen, und klicken Sie auf **Anmeldeinformationen speichern**. Gong funktioniert genauso, mit Access Key und Secret.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fdeea3eb7d84048eca0f534b7b00390ee
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd918aa95f46047559b1f30c42d89d62f
        alt: Die Seite „Datenquellen“ mit HubSpot unter „Verbunden“ und Gong unter „CRM & Sales“. Das Gong-Einrichtungsfenster ist beim Schritt „Access Key Secret“ geöffnet, mit eingefügtem Wert, über „Anmeldeinformationen speichern“.
    - title: Fragen zur Pipeline stellen
      body: "Fragen Sie unter **Fragen** in normaler Sprache: „Welche offenen Deals stehen seit 30 Tagen oder länger in derselben Phase?“ Der Agent durchsucht Ihre HubSpot-Deals und antwortet mit einer sortierbaren Tabelle für Folgefragen."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7acaa378761c453bb79f9f246d8cab72
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe66acdb3c24e41c7b5caef3e0251b17a
        alt: "Der Chat unter „Fragen“ mit der Frage nach Deals, die seit 30 Tagen feststecken. Der Agent antwortet mit einer Tabelle von sechs offenen Deals: Phase, Verantwortlicher, Betrag und Tage in der Phase."
    - title: Antworten als Dashboard speichern
      body: Bitten Sie den Agenten, „das als Dashboard fürs Pipeline-Review zu speichern“. Er baut ein Panel pro Antwort, und die Panels aktualisieren sich mit neuen HubSpot-Daten. Teilen Sie das Dashboard vor dem Pipeline-Review mit Ihrem Team.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F69b61731b5b74d61ad0e510f57522796
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2720d0e5fd8f40bfa3b72c056270f174
        alt: Der Agenten-Chat bestätigt, dass er das Dashboard „Weekly pipeline review“ gespeichert hat, daneben das neue Dashboard mit der Tabelle feststeckender Deals und dem Diagramm der Pipeline nach Phase.
features:
  heading: Alles, was Sie fürs Pipeline-Review brauchen
  items:
    - title: Deals und Anrufe zusammen
      body: Eine Frage holt Phase und Verantwortlichen eines Deals aus HubSpot und das, was der Käufer in den Anrufen sagte, aus Gong.
    - title: Dashboards, die der Agent bearbeitet
      body: Bitten Sie um ein neues Panel, einen Filter nach Verantwortlichem oder ein anderes Diagramm, und der Agent passt das Team-Dashboard an.
    - title: Prüfbare Antworten
      body: Der Agent markiert eine Zahl als „Unverified“, wenn sie nicht live aus HubSpot oder Gong kommt. So wissen Sie, was zu prüfen ist.
    - title: Pipeline neben Umsatz
      body: Verbinden Sie auch Stripe und BigQuery, und derselbe Chat beantwortet Fragen zu Umsatz und Produktnutzung neben Ihren Deals.
    - title: Ihre Pipeline-Definitionen
      body: Ein Admin legt auf der Seite **Semantische Ebene** fest, was ein feststeckender Deal oder qualifizierte Pipeline bedeutet. Der Agent liest das vorher.
    - title: Täglicher Pipeline-Bericht
      body: Erhalten Sie das Dashboard täglich per E-Mail an bis zu fünf Personen oder in einem Slack-Kanal, ohne die App zu öffnen.
