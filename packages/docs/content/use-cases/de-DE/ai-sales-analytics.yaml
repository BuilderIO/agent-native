title: Ihre Sales-Pipeline mit HubSpot und Gong prüfen
seo_title: KI-Vertriebsanalyse für HubSpot und Gong
meta_description: Welche Deals stocken und warum? Fragen Sie Agent-Native Analytics vor dem Pipeline-Review zu HubSpot und Gong und behalten Sie die Antworten als Dashboard.
updated: 2026-10-27
hero:
  body: Agent-Native Analytics macht aus HubSpot-Deals und Gong-Anrufen ein Dashboard für jedes Pipeline-Review. Fragen Sie in Ihren Worten, welche Deals stocken und warum, und der Agent antwortet aus beiden.
  button:
    label: Pipeline befragen
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe534007e491840cc86570110b7d00de4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4780c6d1885541bcaf3d949dbdbc1eb7
