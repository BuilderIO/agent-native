title: Agenten-Änderungen visuell nachvollziehen
seo_title: Visueller Rückblick auf Änderungen Ihres Agenten
meta_description: Agent-Native Plan zeigt, was Ihr Coding-Agent geändert hat, als Vorher-nachher-Screens, markierte Datenfelder, Dateiübersicht und kommentierbare Diffs.
updated: 2026-10-27
hero:
  body: Agent-Native Plan zeigt die Arbeit Ihres Coding-Agenten als Vorher-nachher-Screens, markierte Datenänderungen und Dateiübersicht. Stimmt etwas nicht, kommentieren Sie es, und der Agent behebt es.
  button:
    label: Änderung zusammenfassen
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa973dc8304494af9b6d069e9a409d409
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F68e6bd29a3834942ad098459e08fbd42
    alt: Ein fertiger Rückblick in Plan auf die Änderung eines Coding-Agenten, die Team-Einladungen hinzufügt. Oben stehen der Titel und eine kurze Zusammenfassung der Änderung. Darunter folgen Vorher-nachher-Wireframes der Mitglieder-Einstellungsseite und ein Dateibaum der geänderten Dateien mit Markierungen für hinzugefügt und geändert.
how_to:
  heading: So fassen Sie die Änderungen Ihres Agenten visuell zusammen
  steps:
    - title: Den Agenten um einen Rückblick bitten
      body: Fügen Sie Plan per [Einzeiler](https://www.agent-native.com/docs/template-plan/#install) zu Ihrem Coding-Agenten hinzu. Führen Sie im Chat, in dem der Agent die Änderung gemacht hat, `/visual-recap` aus und öffnen Sie den zurückgegebenen Link.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F060c82d850f34b3096f166c04ead386c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F287f076a9ec84124a0afc7fbaeda2ece
        alt: Der Chat des Coding-Agenten mit der gesendeten Nachricht „/visual-recap of everything you changed in this thread“ und der Antwort des Agenten mit dem Link zum veröffentlichten Rückblick.
    - title: Die Änderung zuerst als Bilder lesen
      body: Beginnen Sie mit den Vorher-nachher-Wireframes, den markierten Datenänderungen und der Dateiübersicht. Öffnen Sie dann **Key changes**, wo jede wichtige Datei einen eigenen Tab mit Diff nebeneinander und Notizen hat.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff15296c5ef824f5ead19d6e64de1388f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faf5572fc8bbd4962972bfc0b24cf2bc0
        alt: Vorher-nachher-Wireframes der Mitgliederseite, wobei die Nachher-Version eine Einladen-Schaltfläche und eine ausstehende Einladung ergänzt. Daneben markiert das Datenmodell die neue Einladungstabelle als hinzugefügt und das Rollenfeld der Mitglieder als geändert, von Text zu einer festen Liste von Rollen.
    - title: Kommentare an den Agenten senden
      body: Hinterlassen Sie [Review-Kommentare](https://www.agent-native.com/docs/template-plan-review-workflow/) an beliebigem Text oder einer Stelle im Wireframe. Klicken Sie auf **An den Agenten senden**, wählen Sie **Für Ihren Agenten kopieren** und fügen Sie den Prompt in Ihren Coding-Agenten ein, der die Änderungen umsetzt und Ihre Kommentare schließt.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2256a69fdcd542a18a14a292050ff391
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2b4a48126c4f45c39c0b6f0389673387
        alt: Ein Kommentar an den Agenten an der Einladen-Schaltfläche im Nachher-Wireframe bittet darum, sie nur Admins zu zeigen. Das Menü „An den Agenten senden“ ist geöffnet, mit „Für Ihren Agenten kopieren“ und „An den Inline-Agenten senden“.
features:
  heading: Alles, was ein visueller Rückblick braucht
  items:
    - title: Screens vor Code
      body: Betrifft die Änderung die UI, beginnt der Rückblick mit Vorher-nachher-Wireframes, damit Sie zuerst sehen, was Nutzer sehen.
    - title: Datenänderungen markiert
      body: Schema- und API-Änderungen markieren jedes Feld als hinzugefügt, geändert, entfernt oder umbenannt, mit altem und neuem Typ.
    - title: Jede geänderte Datei erfasst
      body: Ein Dateibaum listet jede berührte Datei, markiert als hinzugefügt, geändert, entfernt oder umbenannt, mit Notizen zur Änderung.
    - title: Kommentierte Key-Diffs
      body: Drei bis acht zentrale Dateien erhalten Diffs nebeneinander, je mit einzeiliger Zusammenfassung und Notizen zu wichtigen Zeilen.
    - title: Deckt den ganzen Thread ab
      body: Führen Sie `/visual-recap` nach der Arbeit im Chat aus, und der Rückblick umfasst alles, was der Agent dort getan hat, bis zu späten Korrekturen.
    - title: Mit dem Team prüfen
      body: "Teilen Sie den Link: Gäste öffnen ihn ohne Konto und melden sich zum Kommentieren an. Exportieren Sie ihn als HTML, Markdown oder JSON."
