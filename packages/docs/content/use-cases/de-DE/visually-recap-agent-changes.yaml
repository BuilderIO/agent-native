faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Plan kostenlos?
      a: Ja, Agent-Native Plan ist kostenlos und Open Source. Jeder visuelle Rückblick läuft als vollständige Agenten-Sitzung mit dem Modell Ihrer Wahl, größere Änderungen verbrauchen also mehr von diesem Modell. Plan ist in der Alpha-Phase, rechnen Sie also mit Änderungen.
    - q: Bei welchen Änderungen lohnt sich ein visueller Rückblick?
      a: "Bei größeren Änderungen: solchen, die mehrere Dateien umfassen oder das Datenschema, eine API oder den Aufbau der App betreffen. Bei einer kleinen Änderung an einer Datei ist der einfache Diff schneller gelesen, als ein Rückblick dauert."
    - q: Worin unterscheidet sich ein visueller Rückblick vom Lesen des Diffs?
      a: "Ein Diff listet jede geänderte Zeile, Datei für Datei. Ein visueller Rückblick beginnt damit, was die Änderung bewirkt: die geänderten Screens als Wireframes, die geänderten Datenfelder und eine Übersicht der beteiligten Dateien. Danach zeigt er nur die Diffs, die sich zu lesen lohnen, mit Notizen."
    - q: Mit welchen Coding-Agenten funktioniert Plan?
      a: Der Installationsbefehl richtet Plan in Claude Code, Codex, Cursor, OpenCode, GitHub Copilot in VS Code und Claude Cowork ein und meldet Sie an. Plan funktioniert über seinen gehosteten Connector auch in Cline, Goose und jedem anderen Agenten, der sich mit MCP-Servern verbindet.
    - q: Kann ich zu jedem Pull Request einen Rückblick bekommen?
      a: Ja. Die [GitHub Action PR Visual Recap](https://www.agent-native.com/docs/pr-visual-recap/) führt bei jedem Push Claude Code, Codex oder ein beliebiges OpenAI-kompatibles Modell mit Ihrem eigenen API-Schlüssel aus. Sie hält einen Kommentar im Pull Request aktuell, mit einem Screenshot des Rückblicks, und blockiert nie einen Merge. Diffs über etwa 600 KB werden gekürzt.
    - q: Wer kann meine Rückblicke sehen?
      a: Standardmäßig nur Personen, die in Ihrer Organisation angemeldet sind; stellen Sie einen Rückblick auf privat, sehen nur Sie ihn. Mit der GitHub Action sieht jeder, der den Pull Request sieht, den Screenshot des Rückblicks. Der [Modus für lokale Dateien](https://www.agent-native.com/docs/template-plan-local-and-desktop/) hält einen Rückblick aus der gehosteten App heraus, das Modell Ihres Agenten läuft aber weiterhin dort, wo es immer läuft.
