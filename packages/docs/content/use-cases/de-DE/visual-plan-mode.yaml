slug: visual-plan-mode
app: plans
roles:
  - engineering
title: Den Plan Ihres Agenten vor dem Coden prüfen
seo_title: Visueller Planmodus für Claude Code, Codex, Cursor
meta_description: Agent-Native Plan macht aus dem Plan Ihres Coding-Agenten eine prüfbare Seite mit Diagrammen, Dateibäumen und kommentiertem Code, bevor Code entsteht.
updated: 2026-10-27
hero:
  body: Agent-Native Plan zeigt den Plan Ihres Agenten mit Diagrammen, Dateibäumen und kommentiertem Code. Sie kommentieren, der Agent überarbeitet ihn und codet erst nach Ihrer Freigabe.
  button:
    label: Ihren Build planen
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faad0afc668dc461f9023eeba3ba55800
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2c2e3c83e79248e69829bb38f71a6704
    alt: Ein Plan für Team-Einladungen, geöffnet in Plan. Ein Diagramm zeigt den Einladungsablauf von der Einstellungsseite über die API und die Einladungstabelle bis zur Einladungs-E-Mail. Darunter markiert ein Dateibaum die fünf Dateien, die sich ändern. Am E-Mail-Schritt hängt der Kommentar eines Teammitglieds für den Agenten.
how_to:
  heading: So nutzen Sie den visuellen Planmodus mit Ihrem Coding-Agenten
  steps:
    - title: Einen visuellen Plan anfordern
      body: Fügen Sie Plan mit [einem Installationsbefehl](https://www.agent-native.com/docs/plan-plugin/) zu Claude Code, Codex oder Cursor hinzu. Geben Sie dann `/visual-plan` und die Aufgabe ein. Der Agent liest Ihren Code und postet einen Link zum Plan.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F15e26ab97a68472a958aabf9657fdeb2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F01168fa31ed5412080d49febc37f1068
        alt: Der Chat eines Coding-Agenten, in dem der Nutzer /visual-plan mit der Aufgabe eingegeben hat, Team-Einladungen hinzuzufügen. Der Agent listet die gelesenen Dateien auf, veröffentlicht den Plan und antwortet mit dem Link.
    - title: Kommentieren, was sich ändern soll
      body: Markieren Sie einen Satz oder eine Stelle im Diagramm und notieren Sie die Änderung. [Stellen Sie den Kommentar](https://www.agent-native.com/docs/template-plan-review-workflow/) auf **Agent** für den Agenten oder auf **Mensch** für ein Teammitglied. Beantworten Sie auch die offenen Fragen des Plans.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8a16bd566384f4080dde591a1b30c3f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F598a137b56d149f98409ed79c024cb2b
        alt: Nahaufnahme eines neuen Kommentars am Schritt der Einladungs-E-Mail im Diagramm des Plans. Der Schalter „Agent“/„Mensch“ steht auf „Agent“, der Kommentar ist eingegeben.
    - title: Kommentare an den Agenten senden
      body: Klicken Sie auf **An den Agenten senden** und wählen Sie **Für Ihren Agenten kopieren**, um Ihre Kommentare als Prompt zu kopieren. Fügen Sie ihn im Chat Ihres Agenten ein, der den Plan aktualisiert. Passt er, geben Sie ihn dort frei, und der Agent legt los.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0f841d0983ec4e3386d13c4c4ad7895d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F356c269c867048c392ca26ef5c5767c8
        alt: "Nahaufnahme der Schaltfläche „An den Agenten senden“ des Plans mit geöffnetem Menü: „Für Ihren Agenten kopieren“ und „An den Inline-Agenten senden“, jeweils mit einer einzeiligen Beschreibung."
features:
  heading: Alles, was Sie zum Prüfen des Agenten-Plans brauchen
  items:
    - title: Diagramme des Ansatzes
      body: Request-Abläufe, Datenmodelle und API-Endpunkte werden gezeichnet, sodass ein falscher Endpunkt oder eine fehlende Tabelle vor dem Bauen auffällt.
    - title: Sehen, welche Dateien sich ändern
      body: Dateibäume und kommentierter Code zeigen, wo die Arbeit landet und was jeder Schritt aus Ihrem Code nutzt.
    - title: Fragen mit Vorschlag
      body: Was der Agent nicht aus Ihrem Code klären kann, landet am Ende in einem Formular, jeweils mit seiner empfohlenen Antwort.
    - title: Baut auf dem Planmodus auf
      body: Sie haben schon einen Plan aus Claude Code, Codex oder einer Markdown-Datei? `/visual-plan` baut die Seite daraus, statt neu anzufangen.
    - title: Kein Code vor der Freigabe
      body: Die Anweisungen von Plan beschränken den Agenten beim Planen aufs Lesen Ihres Codes. Er ändert erst etwas, wenn Sie den Plan freigeben.
    - title: Mit dem Team prüfen
      body: Schicken Sie einem Teammitglied den Link zum Plan. Es kann ihn als Gast lesen und bearbeiten und mit einem Agent-Native-Konto kommentieren.
