faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Plan kostenlos?
      a: Ja, Agent-Native Plan ist kostenlos und Open Source. Jeder Plan läuft als Sitzung Ihres Coding-Agenten, mit dem Modell Ihrer Wahl. Das verbraucht Tokens Ihres Agenten, und ein größerer Plan verbraucht mehr. Plan ist in der Alpha-Phase, rechnen Sie also mit Änderungen.
    - q: Mit welchen Coding-Agenten funktioniert Plan?
      a: Für Claude Code und Codex gibt es Plugins. Ein Installationsbefehl richtet Plan außerdem in Cursor, OpenCode, GitHub Copilot in VS Code und Claude Cowork ein. Jeder andere MCP-Host, etwa Cline oder Goose, kann den Connector von Plan über seine URL einbinden. Jeden Plan prüfen Sie in Ihrem Browser.
    - q: Worin unterscheidet sich Plan vom Planmodus meines Coding-Agenten?
      a: Der Planmodus in Claude Code, Codex, Cursor oder OpenCode liefert den Plan als Text im Chat. Plan macht aus diesem Plan, oder einem aus einer Markdown-Datei, eine Seite mit Diagrammen, Dateibäumen und kommentiertem Code. Dort kommentieren Sie genaue Stellen, beantworten die Fragen des Agenten und holen ein Teammitglied dazu.
    - q: Ändert der Agent meinen Code, während er plant?
      a: Nein. Während er den Plan schreibt oder überarbeitet, beschränken die Anweisungen von Plan den Agenten aufs Lesen Ihres Codes. Er beginnt mit Änderungen erst nach Ihrer Freigabe und liest den freigegebenen Plan vor größeren Schritten erneut.
    - q: Kann ein Teammitglied einen Plan ohne Konto prüfen?
      a: Teilweise. Jeder, mit dem Sie den Link teilen, kann den Plan als Gast öffnen und bearbeiten. Kommentieren, Speichern und Teilen erfordern ein Agent-Native-Konto, wer kommentieren möchte, meldet sich also zuerst an.
    - q: Kann ich Pläne auf meinem eigenen Rechner behalten?
      a: Ja. Der [Modus für lokale Dateien](https://www.agent-native.com/docs/template-plan-local-and-desktop/) speichert einen Plan als MDX-Dateien auf Ihrem Computer, sodass sein Inhalt nie die gehostete App erreicht. Dafür können Sie einen lokalen Plan nicht teilen oder im Browser kommentieren, und sein Link öffnet sich nur auf Ihrem Rechner. Der Modus für lokale Dateien ändert nichts daran, wo das KI-Modell Ihres Coding-Agenten läuft.
