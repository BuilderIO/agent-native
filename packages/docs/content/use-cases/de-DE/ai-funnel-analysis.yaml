title: Erkennen, wo neue Nutzer abspringen
seo_title: KI-Funnel-Analyse mit Session-Replays
meta_description: Fragen Sie Agent-Native Analytics, welcher Signup-Schritt neue Nutzer verliert, erhalten Sie den Funnel aus Ihren Events und sehen Sie Replays derer, die gingen.
updated: 2026-10-27
hero:
  body: Fragen Sie Agent-Native Analytics, wo im Signup die meisten abspringen, und der Agent baut den Funnel aus Ihren Events. Dann sehen Sie Replays der Abgesprungenen und fragen den Agenten, warum.
  button:
    label: Absprünge finden
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F55295bda356c490984f639946e838ebe
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd84d0fd7f856406e85b739ac0429b0f3
    alt: "Das Analytics-Fenster mit einem Dashboard „Activation funnel“. Sein Funnel hat vier Schritte: Signed up, Created a project, Connected a data source und Invited a teammate. Jeder Schritt zeigt seine Anzahl, seinen Anteil an den Signups und den Rückgang gegenüber dem vorigen Schritt; der größte Rückgang liegt bei Created a project. Der Agenten-Chat daneben erklärt, wo die Signups der letzten Woche aufhörten."
how_to:
  heading: So machen Sie Funnel-Analysen mit KI
  steps:
    - title: Fragen, wo neue Nutzer aufhören
      body: "Bringen Sie Ihre Signup-Events in Analytics. Fragen Sie unter **Fragen**, und der Agent schreibt SQL und fügt ein [Funnel-Panel](https://www.agent-native.com/docs/template-analytics-dashboards/) mit Anzahl und Rückgang je Schritt hinzu. Zum Beispiel: „Füge meinem Dashboard Activation funnel einen Funnel hinzu: Wo hörten die Signups der letzten Woche auf?“"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa752431cecb8420c88d3d6a8f7980ea9
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F16ab210c27504ed1b71c37ebdabea744
        alt: Der Agenten-Chat mit dieser Anfrage und der Antwort des Agenten, neben dem hinzugefügten Funnel. Die Schritte lauten Signed up 1.240, Created a project 612, Connected a data source 418 und Invited a teammate 302, jeweils mit ihrem Rückgang.
    - title: Die Abgesprungenen finden
      body: Aktivieren Sie „Sitzungen prüfen“ in den Analytics-Einstellungen. Öffnen Sie unter **Sitzungen** den Filter **Ereignisse**. Wählen Sie **Mit** für den Schritt vor dem Absprung, etwa „signed_up“, und **Ohne** für den nie erreichten Schritt, etwa „project_created“.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F327bf36c28ab452da87cf4f4dc65debe
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F49b79e0de78041bb93444ec4d24ce11a
        alt: Nahaufnahme der Seite „Sitzungen“ mit geöffnetem Filter „Ereignisse“, signed_up auf „Mit“ und project_created auf „Ohne“. Darunter die gefilterte Liste der Sitzungen neuer Nutzer, jeweils mit Dauer, Seite und Rage-Clicks.
    - title: Fragen, was in einer Sitzung passierte
      body: Öffnen Sie ein Replay, um Seite, Klicks und Netzwerkanfragen zu sehen. Klicken Sie auf **Agent zu dieser Sitzung fragen** und fragen Sie „Was ist in dieser Sitzung passiert?“ Der Agent fasst Fehler, wiederholte Klicks und besuchte Seiten zusammen.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7e0b3a4750a143f6bcd609e1c5460fd2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe44e9321e80d4c3f826bd7b25fa54025
        alt: Das Replay eines neuen Nutzers auf der Seite zum Anlegen eines Projekts, mit der Antwort des Agenten daneben. Die Person gab einen Projektnamen ein und klickte dreimal auf Create project. Die Anfrage an die Projekt-API schlug jedes Mal fehl, und die Person ging.
features:
  heading: Alles, um Absprünge zu finden und zu beheben
  items:
    - title: Übersprungen ist nicht abgesprungen
      body: Sagen Sie dem Agenten, welche Schritte man überspringen kann, und der Funnel trennt, wer sie übersprang und wer dort die App verließ.
    - title: Ihre eigenen Event-Namen
      body: Admins beschreiben Ihre Events und Metriken auf der Seite **Semantische Ebene**, und der Agent nutzt genau diese Namen in jeder Abfrage.
    - title: Die fehlgeschlagene Anfrage sehen
      body: Öffnen Sie **Dev-Tools** in einem Replay, um Konsole und Netzwerkanfragen zu lesen, und springen Sie zum Moment des Fehlers.
    - title: Geschwärzte Replays für Agenten
      body: Ein externer Agent erhält Konsolen- und Netzwerkeinträge des Replays, Fehler zuerst, nie die Aufnahme selbst. Der Link läuft nach zwei Stunden ab.
    - title: Standardmäßig privat
      body: Eingaben werden in jedem Replay maskiert, und Sie wählen, welche anderen Teile der Seite verborgen bleiben.
    - title: Der Funnel jeden Tag
      body: Lassen Sie den Agenten Ihr Funnel-Dashboard täglich zur gewünschten Zeit senden, per E-Mail an bis zu fünf Personen oder an Slack.
