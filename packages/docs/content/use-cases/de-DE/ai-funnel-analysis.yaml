faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Analytics kostenlos?
      a: "Ja, Agent-Native Analytics ist kostenlos und Open Source. Nutzen Sie die gehostete App oder [betreiben Sie Ihre eigene Kopie](https://www.agent-native.com/docs/template-analytics/). Die Daten bringen Sie mit: Ihre eigenen Events oder die Tools, die Sie verbinden. Analytics ist in der Alpha-Phase, rechnen Sie also mit Änderungen."
    - q: Muss ich SQL können?
      a: Nein. Fragen Sie in normaler Sprache, und der Agent schreibt und führt das SQL aus und antwortet mit einem Diagramm, einer Tabelle oder einer Zahl. Lassen Sie sich die Abfrage zeigen, wenn Sie sie prüfen möchten. Eventuell muss jemand, der Ihre Daten kennt, zuerst [Ihre Quellen verbinden](https://www.agent-native.com/docs/template-analytics-connectors/).
    - q: Woher kommen die Session-Replays?
      a: "Aus Ihrer eigenen Web-App. Erstellen Sie unter **Datenquellen** einen öffentlichen Schlüssel und fügen Sie das kurze Tracking-Snippet von der Seite **Sitzungen** in Ihre App ein, mit aktiviertem Session-Replay. Verbinden Sie Speicher für die Aufnahmen: Builder.io oder Ihren eigenen S3-Bucket. Standardmäßig zeichnen [Replays](https://www.agent-native.com/docs/template-analytics-monitoring-and-sessions/) nur angemeldete Nutzer auf."
    - q: Was zeichnet ein Session-Replay auf?
      a: Ein Replay spielt Seite, Klicks und Scrollen, Konsolenausgaben und Netzwerkanfragen ab. Eingaben sind standardmäßig maskiert, und Felder für Passwörter oder Kartendaten werden nie erfasst. Um weitere Bereiche zu verbergen, geben Sie diesem Teil der Seite eine Klasse.
    - q: Kann ich meine Daten aus PostHog, Amplitude oder Mixpanel nutzen?
      a: Ja. Verbinden Sie sie unter **Datenquellen** und fragen Sie zu den Events, die Sie dort tracken. Der Agent fragt jedes Tool für Sie ab. Session-Replays kommen nur aus dem eigenen Tracking von Analytics, fügen Sie es also Ihrer App hinzu, um die Abgesprungenen zu sehen.
    - q: Worin unterscheidet sich Analytics von der KI in meinem Analytics-Tool?
      a: "Die KI in einem Analytics-Tool arbeitet mit den Daten dieses Tools. Der Analytics-Agent arbeitet über alle verbundenen Quellen hinweg, findet die Replays genau der Personen, die abgesprungen sind, und erklärt jedes davon oder übergibt es Ihrem Coding-Agenten. Außerdem ist Analytics Open Source. Das ist eine [agentische App](https://www.agent-native.com/articles/what-is-an-agent-native-app/): die Intelligenz eines Agenten, die Intuitivität einer App."
