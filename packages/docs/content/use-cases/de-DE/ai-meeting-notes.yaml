template: v2
slug: ai-meeting-notes
app: clips
title: KI-Meeting-Notizen
seo_title: KI-Meeting-Notizen ohne Bot im Gespräch
meta_description: "Agent-Native Clips ist eine kostenlose Open-Source-Lösung für KI-Meeting-Notizen von Ihrem eigenen Computer: Transkript, Zusammenfassung und Aufgaben für jeden Anruf."
updated: 2026-10-26
hero:
  body: "Agent-Native Clips macht aus Anrufen Notizen: Transkript, Zusammenfassung und Aufgaben pro Teilnehmer. Es nimmt auf Ihrem Computer auf, ohne Bot, und Meetings lassen sich durchsuchen."
  button:
    label: Meeting-Notizen erstellen
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4b1f55d396c64beea49da96d9d02b38c
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F03741a45126c451e8458872aebd9f480
    alt: Ein abgeschlossener wöchentlicher Produkt-Sync in Clips. Links zeigt der Notizbereich eine kurze Zusammenfassung, Kernpunkte und Aufgaben, gruppiert nach Teilnehmer. Rechts läuft das Transkript mit den Beiträgen der einzelnen Sprecher.
how_to:
  heading: So erstellen Sie Meeting-Notizen mit KI
  steps:
    - title: Kalender verbinden
      body: Installieren Sie Clips Desktop, aktivieren Sie in den Clips-Einstellungen „Meetings und Transkription“ und verbinden Sie auf der Seite „Treffen“ Google Calendar. Ihre kommenden Meetings erscheinen im Tab „Agenda“.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F58ac771a7a8547ecbb770e5e560f8ecd
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6d5d38e3c0124bbb8a51b2d0b89582c4
        alt: Nahaufnahme des Tabs „Agenda“ auf der Seite „Treffen“ mit den heutigen Meetings aus Google Calendar. Beim Meeting, das in 2 Minuten beginnt, stehen die Schaltflächen „Beitreten“ und „Notizen öffnen“.
    - title: Notizen über die Erinnerung starten
      body: Clips Desktop zeigt eine Minute vor jedem Kalender-Meeting eine Erinnerung an. Mit „Join“ treten Sie dem Anruf bei und starten sofort die Notizen, über das Menü der Schaltfläche starten Sie Notizen ohne Beitritt. Clips nimmt dann Ihr Mikrofon und den Ton des Anrufs auf.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff048f1dd0e18443d93fdeb4a4f03fada
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe58e7dd45fa3459fb1cdb3840fed0126
        alt: "Nahaufnahme der Clips-Desktop-Erinnerung für den wöchentlichen Produkt-Sync. Das Menü der Schaltfläche „Join Meet & open Clips“ ist geöffnet: Join only, Start notes only und Snooze 5 min."
    - title: Notizen und Aufgaben lesen
      body: "Nach dem Anruf zeigt die Meeting-Seite Ihre Notizen und die KI-Notizen neben dem Transkript: Zusammenfassung, Kernpunkte und Aufgaben pro Teilnehmer. [Prüfen Sie KI-Meeting-Notizen](https://www.agent-native.com/articles/how-to-use-ai-to-take-meeting-notes/) am Transkript, bevor Sie sie teilen."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0ba0a151caef41e8904d6535671c47bc
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fbdf5e7b84ab64a288c0837959eedb85b
        alt: "Nahaufnahme des Bereichs „KI-Notizen“ eines abgeschlossenen Meetings: die Zusammenfassung, vier Kernpunkte und Aufgaben, gruppiert unter zwei Teilnehmern."
features:
  heading: Alles, was Sie aus jedem Meeting brauchen
  items:
    - title: Kein Bot in Ihren Anrufen
      body: Clips Desktop nimmt Ihr Mikrofon und den Ton des Anrufs auf Ihrem eigenen Computer auf, damit das Meeting für alle anderen unverändert aussieht.
    - title: Aufgaben pro Person
      body: Jede Aufgabe nennt, wer zuständig ist, abgeleitet aus dem Anruf. Vor dem Teilen lässt sie sich bearbeiten.
    - title: Fragen während des Anrufs
      body: "Fragen Sie live zum Meeting: was Sie verpasst haben, eine Zusammenfassung der letzten fünf Minuten oder eine gute nächste Frage."
    - title: Suche nach Gesagtem
      body: Finden Sie Meetings über Wörter aus Transkript oder Notizen oder über Teilnehmernamen, oder fragen Sie den Agenten.
    - title: Notizen mit Rücksprung
      body: Klicken Sie in den KI-Notizen auf einen Kernpunkt, um im Transkript zu der Stelle zu springen, an der er gesagt wurde.
    - title: Meeting-Notizen teilen
      body: Ein Link teilt Zusammenfassung, Kernpunkte, Aufgaben und das gesamte Transkript, ohne Video und Kommentare der Aufnahme.
