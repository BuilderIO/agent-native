faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Clips kostenlos?
      a: Ja, Agent-Native Clips ist kostenlos und Open Source. Zusammenfassungen, Titel und die Bereinigung des Transkripts laufen standardmäßig über [Builder.io-KI-Guthaben](https://www.agent-native.com/docs/template-clips-features/). Ist das Guthaben aufgebraucht, pausieren diese Funktionen, bis Sie Guthaben ergänzen oder Ihren eigenen Gemini-Schlüssel verbinden. Clips ist in der Alpha-Phase, rechnen Sie also mit Änderungen.
    - q: Tritt ein Bot meinen Meetings bei?
      a: "Nein. Clips erstellt Notizen von Ihrem eigenen Computer: Clips Desktop nimmt Ihr Mikrofon und den Ton des Anrufs auf, es tritt also nichts Ihrem Zoom-, Google-Meet- oder Microsoft-Teams-Anruf bei. Da kein Bot beitritt, sagen Sie den Teilnehmern, dass Sie Notizen erstellen."
    - q: Mit welchen Kalender- und Videoanruf-Apps funktioniert Clips?
      a: Clips verbindet sich nur mit Google Calendar. Notizen funktionieren in Zoom, Google Meet, Microsoft Teams, Webex und jedem anderen Anruf, dessen Ton Ihr Computer wiedergibt. Auf einem Mac erkennt Clips Desktop solche Anrufe auch, wenn sie nicht im Kalender stehen, und bietet an, Notizen zu starten. Die Stimmen der anderen Teilnehmer werden nur auf dem Mac aufgenommen.
    - q: Erstellt Clips auch unter Windows Meeting-Notizen?
      a: Clips Desktop läuft auf Mac, Windows und Linux, aber die Stimmen der anderen Teilnehmer werden nur auf dem Mac erfasst. Unter Windows und Linux nimmt Clips nur Ihr Mikrofon auf, sodass externe Teilnehmer im Transkript und in den Aufgaben fehlen.
    - q: Worin unterscheidet sich Clips vom KI-Notizassistenten in Zoom oder Google Meet?
      a: "Der KI-Notizassistent einer Anruf-App ist an die Anrufe dieser App gebunden. Clips bewahrt jedes Meeting aus jeder Anruf-App in einer Bibliothek auf. Fragen Sie den [Clips-Agenten](https://www.agent-native.com/docs/template-clips-agent/) „Was hat Daniel letzten Dienstag zugesagt?“, und er durchsucht Ihre Meetings nach dem Gesagten. Das ist eine [agentische App](https://www.agent-native.com/articles/what-is-an-agent-native-app/): die Intelligenz eines Agenten, die Intuitivität einer App."
