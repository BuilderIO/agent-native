faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Analytics kostenlos?
      a: Ja, Agent-Native Analytics ist kostenlos und Open Source. Sie verbinden Ihre eigenen Google-Analytics- und HubSpot-Konten. Zum Start wählen Sie kostenlose Builder.io-KI-Guthaben oder Ihren eigenen KI-Modell-Schlüssel für den Agenten, die KI-Nutzung hat also Grenzen. Analytics ist in der Alpha-Phase, rechnen Sie also mit Änderungen.
    - q: Welche Marketing-Datenquellen kann ich verbinden?
      a: Agent-Native Analytics verbindet sich mit Google Analytics (GA4), HubSpot, DataForSEO für Keyword-Rankings und Suchvolumen sowie X für Post-Engagement. Außerdem mit BigQuery, Amplitude, Mixpanel, PostHog und Stripe. Jede Quelle braucht eigene Zugangsdaten, und Google Analytics braucht ein Google-Cloud-Dienstkonto.
    - q: Kann Agent-Native Analytics den Bericht jeden Montag senden?
      a: Einen Wochenrhythmus gibt es noch nicht. [Dashboard-E-Mail-Berichte](https://www.agent-native.com/docs/template-analytics-dashboards/) gehen täglich raus, zu einer Uhrzeit und Zeitzone Ihrer Wahl, an bis zu fünf E-Mail-Adressen, einen Slack-Kanal oder beides. Klicken Sie vor Ihrem Montagsmeeting in **E-Mail-Berichte** auf **Jetzt senden**, um das aktuelle Dashboard zu senden.
    - q: Muss ich SQL können?
      a: Nein. Sie fragen in normalen Worten, und der Agent wählt die Quelle und schreibt die Abfrage. Sie können sich die Abfrage hinter jeder Antwort zeigen lassen, wenn Sie sie prüfen möchten.
    - q: Kann ich den Zahlen vertrauen?
      a: Der Agent fragt Ihre Daten live ab, bevor er Ihnen eine Zahl nennt, und markiert eine Zahl als „Unverified“, wenn keine Abfrage lief. Vergleichen Sie den Bericht der ersten Woche trotzdem mit Google Analytics und HubSpot, bevor Sie ihn ans Team senden.
    - q: Worin unterscheidet sich Agent-Native Analytics von den Berichten in GA4 und HubSpot?
      a: "Google Analytics und HubSpot berichten jeweils über ihre eigenen Daten. Agent-Native Analytics beantwortet eine Frage über beide hinweg, in normalen Worten, und hält die Antworten in einem Dashboard fest, das Sie per Frage verfeinern. Das ist eine [agentische App](https://www.agent-native.com/articles/what-is-an-agent-native-app/): die Intelligenz eines Agenten, die Intuitivität einer App."
