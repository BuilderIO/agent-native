title: Ein Briefing zum klickbaren Prototyp machen
seo_title: KI-Prototyp-Generator für Produkt-Briefings
meta_description: Fügen Sie ein Produkt- oder Design-Briefing ein, und Agent-Native Design baut klickbare Screens. Lassen Sie sich Richtungen zeigen und verfeinern Sie Ihre Wahl.
updated: 2026-10-27
hero:
  body: Agent-Native Design baut die Screens aus Ihrem Produkt- oder Design-Briefing als funktionierendes HTML. Lassen Sie den KI-Agenten einige Richtungen zeigen und verfeinern Sie Ihre Wahl selbst oder per Frage.
  button:
    label: Briefing prototypen
    url: https://design.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F003e186182b74e3cbe462fe098559bc6
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8f432f3b71d432698c025a7147301bc
    alt: Der Design-Editor mit „Guided checklist“, der gewählten Onboarding-Richtung für eine Team-Spesen-App, in Desktop- und Mobil-Frames. Der Agenten-Chat zeigt das eingefügte Briefing, die Auswahl „Richtung auswählen“ und was der Agent danach geändert hat.
how_to:
  heading: So machen Sie mit KI aus einem Briefing einen Prototyp
  steps:
    - title: Den benötigten Screen beschreiben
      body: "Fügen Sie Ihr Briefing auf dem Startbildschirm von Design ins Prompt-Feld ein: für wen, welcher Screen oder Ablauf und was er leisten muss. Bitten Sie um drei Richtungen. Fehlt etwas Wichtiges, fragt Design zuerst nach."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ef31fb673e2437fb4dd6ed256a7ba9d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8209bd4f55d7432c94e05172c5475f17
        alt: Nahaufnahme des Prompt-Felds auf dem Design-Startbildschirm mit einem kurzen Briefing für den Onboarding-Ablauf einer Spesen-App, das mit „Show me three directions“ endet.
    - title: Die passende Richtung wählen
      body: Design stellt drei Richtungen nebeneinander auf die Arbeitsfläche, jede ein funktionierender Screen in eigenem Stil. Testen Sie jede unter **Interagieren**, wählen Sie eine unter **Richtung auswählen**, und der Agent baut sie aus.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F137893c57370435d94967b9d5bc6a82a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fda7cdd9a2f3e42b58f44efec2b950fc9
        alt: Die Arbeitsfläche mit den drei Onboarding-Richtungen nebeneinander und der Agenten-Chat mit „Richtung auswählen“ und einer Schaltfläche für jede Richtung.
    - title: Mit dem Team verfeinern
      body: Ändern Sie Text, Abstände und Farben im Tab **Design**, oder markieren Sie ein Element und fragen Sie den Agenten. Pinnt jemand einen Kommentar, klicken Sie auf **An den Agenten senden**, und der Agent setzt ihn um.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F406b66f9b62e49c09f697f5d08599b5e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F566ca2f3c44f439aac2c5307c72aa572
        alt: Der gewählte Onboarding-Screen mit dem Kommentar eines Teammitglieds am Einladungsschritt und dem geöffneten Kommentar-Thread im Tab „Kommentare“ mit der Schaltfläche „An den Agenten senden“.
features:
  heading: Alles für den Weg vom Briefing zum Prototyp
  items:
    - title: Von Anfang an klickbar
      body: Die gewählte Richtung wird HTML mit echten Interaktionen, in Desktop- und Mobil-Frames. **Design-Vorschau** öffnet sie im Browser-Tab.
    - title: Behält die Worte Ihres Briefings
      body: Der Agent nutzt Ihre Begriffe und Aussagen. Lässt das Briefing eine wichtige Entscheidung offen, fragt er nach oder nennt seine Annahme.
    - title: Geprüft, bevor es fertig ist
      body: Der Agent prüft Barrierefreiheit und Optik eines Prototyps selbst, bevor er Ihnen sagt, dass das Design fertig ist.
    - title: Prototypen in Ihrer Marke
      body: Bauen Sie ein Designsystem aus Figma, Ihrer Website oder einem GitHub-Repo, und neue Prototypen starten in Ihren Farben und Schriften.
    - title: Feedback, das der Agent umsetzt
      body: Ein Kommentar bleibt an seinem Element. Der Agent ändert diese Stelle, prüft das Ergebnis und schließt den Thread oder lässt Sie entscheiden.
    - title: Übergabe an Coding-Agenten
      body: Exportieren Sie HTML oder ein ZIP, oder kopieren Sie einen fertigen Prompt mit Dateien und Design-Tokens für Ihren Coding-Agenten.
