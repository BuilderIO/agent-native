faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Design kostenlos?
      a: Ja, Agent-Native Design ist kostenlos und Open Source. Der Agent braucht eine KI-Verbindung, entweder über Builder.io oder Ihren eigenen KI-Schlüssel. Design ist in der Alpha-Phase, rechnen Sie also mit Änderungen, während es wächst.
    - q: Kann ich mit meinem PRD oder Produkt-Briefing starten?
      a: Ja. Fügen Sie das Briefing oder den relevanten Teil Ihres Product Requirements Document (PRD) ins Prompt-Feld ein, und bitten Sie um Richtungen, wenn Sie Optionen möchten. Der Agent behält Ihre Begriffe und genauen Aussagen, und lässt das Briefing eine Entscheidung offen, die das Design verändert, fragt er nach oder nennt seine Annahme. Hier steht, [was in ein Design-Briefing gehört](https://www.agent-native.com/articles/how-to-turn-a-design-brief-into-a-prototype-with-ai/).
    - q: Kann ich mich durch den Prototyp klicken?
      a: Ja. Jeder Screen ist echtes HTML mit funktionierenden Interaktionen, und die gewählte Richtung erhält standardmäßig Desktop- und Mobil-Frames. Nutzen Sie den Modus **Interagieren**, um ihn auf der Arbeitsfläche zu testen, oder **Design-Vorschau**, um den Screen in einem neuen Browser-Tab zu öffnen.
    - q: Kann ich mein eigenes Designsystem oder Figma-Designs nutzen?
      a: Ja. Ein [Designsystem](https://www.agent-native.com/docs/template-design-features/) kann aus einer Figma-Datei, Ihrer Website, einem GitHub-Repo, einer design.md-Datei oder Notizen entstehen, und neue Designs folgen ihm. Sie können auch einen Figma-Frame als bearbeitbaren Screen importieren, und Design listet auf, was es nicht exakt treffen konnte.
    - q: Ist der Prototyp Produktionscode?
      a: Nein. Der Prototyp ist ein Ausgangspunkt, App-Logik, Integrationen, Tests und Deployment müssen noch gebaut werden. Exportieren Sie HTML oder ein ZIP der Dateien, oder geben Sie einem Coding-Agenten mit **Agent-Prompt kopieren** die Dateien, Design-Tokens und einen fertigen Prompt. Claude Code und Codex können Designs auch [über den MCP-Server von Design öffnen](https://www.agent-native.com/docs/template-design-integrations/).
    - q: Worin unterscheidet sich Design davon, einen Chatbot nach einer UI zu fragen?
      a: "In Design baut der Agent den Prototyp auf einer Arbeitsfläche, auf der Sie sich durchklicken, Richtungen vergleichen und ihn bearbeiten, und die Kommentare Ihres Teams gehen direkt an den Agenten. Bei einem Chatbot bleibt das Ergebnis im Gespräch. Das macht Design zu einer [agentischen App](https://www.agent-native.com/articles/what-is-an-agent-native-app/): die Intelligenz eines Agenten, die Intuitivität einer App."
