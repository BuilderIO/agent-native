features:
  heading: Alles, was Sie zum Erstellen und Pitchen Ihres Decks brauchen
  items:
    - title: Pitch Decks aus Ihren Notizen
      body: Starten Sie mit Prompt, Notizen, Dokument oder letztem Deck. Beschreiben Sie Unternehmen und Runde, und der Agent baut das Deck.
    - title: Bearbeiten mit KI und visuell
      body: Ändern Sie Text und Layout direkt auf der Folie oder markieren Sie eine Zeile und fragen Sie den Agenten. Nur das Angefragte ändert sich.
    - title: Ihre Marke auf jeder Folie
      body: Speichern Sie Farben, Schriften und Logo als Designsystem, und jedes Deck sieht nach Ihrem Unternehmen aus.
    - title: Bilder und Logos
      body: Lassen Sie den Agenten Bilder generieren, Stockfotos finden oder Kunden- und Partnerlogos für Ihre Traction-Folien einfügen.
    - title: Zusammenarbeit mit Mitgründern
      body: Bearbeiten Sie dasselbe Deck mit Ihrem Mitgründer und dem Agenten, kommentieren Sie jede Folie und stellen Sie frühere Versionen wieder her.
    - title: Pitchen, teilen und exportieren
      body: Präsentieren Sie mit Sprechernotizen, teilen Sie einen Nur-Lese-Link mit Investoren oder exportieren Sie eine bearbeitbare PowerPoint-Datei.
