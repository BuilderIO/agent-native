    - title: Das fertige Deck präsentieren oder exportieren
      body: Präsentieren Sie Ihr Pitch Deck im Vollbild aus Slides oder exportieren Sie es – als bearbeitbare PowerPoint-Datei, als Datei für den Import in Google Slides oder als eine HTML-Datei.
