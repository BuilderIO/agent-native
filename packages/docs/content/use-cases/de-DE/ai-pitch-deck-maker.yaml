how_to:
  heading: So erstellen Sie ein Pitch Deck mit KI
  steps:
    - title: Mit Ihrem eigenen Material starten
      body: "Beschreiben Sie auf dem Startbildschirm von Slides das gewünschte Deck: Ihr Unternehmen, die Zielgruppe und die Länge. Hängen Sie Notizen, Dokumente oder Referenzmaterial an und erstellen Sie das Deck."
