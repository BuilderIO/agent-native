faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Slides kostenlos?
      a: Ja, Agent-Native Slides ist kostenlos und Open Source. Zum Erstellen eines Decks brauchen Sie eine KI-Verbindung, entweder über Builder.io oder Ihren eigenen KI-Schlüssel, und für Bilder Ihren eigenen Gemini- oder OpenAI-Schlüssel. Slides ist in der Alpha-Phase, rechnen Sie also mit Änderungen.
    - q: Kann ich mein Pitch Deck nach PowerPoint oder Google Slides exportieren?
      a: Slides exportiert eine bearbeitbare PowerPoint-Datei (PPTX). Für Google Slides erhalten Sie eine PPTX-Datei mit Import-Link, die Sie selbst in Google Slides öffnen. Sie können das Deck auch als eine HTML-Datei exportieren.
    - q: Kann Slides mit meinen Notizen, einem Dokument oder meiner Website starten?
      a: Beschreiben Sie Ihren Pitch auf dem Startbildschirm von Slides und hängen Sie Notizen oder ein Dokument an, oder fügen Sie den Link Ihrer Website hinzu. Sie können auch ein Google Doc, eine Word-Datei oder eine PowerPoint importieren. Kann der Agent ein PDF oder eine Website nicht lesen, sagt er es Ihnen, statt zu raten.
    - q: Was unterscheidet Slides davon, einen Chatbot meine Folien schreiben zu lassen?
      a: "Ein Chatbot liefert Ihnen Text, den Sie selbst in Folien kopieren. In Slides baut der Agent das echte Deck in einem Editor, den Sie sehen. Sie ändern jede Folie von Hand oder per Anfrage an den Agenten, im selben Deck, und jede Änderung lässt sich rückgängig machen. Das macht Slides zu einer [agentischen App](https://www.agent-native.com/articles/what-is-an-agent-native-app/): die Intelligenz eines Agenten, die Bedienbarkeit einer App."
    - q: Kann mein Mitgründer das Pitch Deck mit mir bearbeiten?
      a: Sie, Ihr Mitgründer und der Agent können dasselbe Deck gleichzeitig bearbeiten. Sie können eine Folie oder einen Teil davon kommentieren. Slides speichert vor jeder größeren Änderung eine Version, sodass Sie jederzeit eine frühere Version wiederherstellen können.
    - q: Wie viele Folien sollte ein Pitch Deck haben?
      a: "Rund zehn Folien sind eine gute Länge für einen ersten Pitch ([was in ein Pitch Deck gehört](https://www.agent-native.com/articles/how-to-make-a-pitch-deck-with-ai/)), und Slides schlägt „Erstelle aus diesem Dokument ein Pitch-Deck mit 10 Folien“ vor. Nennen Sie dem Agenten eine andere Länge, wenn Sie möchten, und er plant die Gliederung passend dazu."
