        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff68c26a237fc45909db278af5b701e61
        alt: "Nahaufnahme des Eingabefelds in Slides: eine eingetippte Pitch-Beschreibung, eine angehängte Notizdatei und darunter die Vorschläge."
    - title: Zusehen, wie der Agent jede Folie baut
      body: Der Slides-Agent plant zuerst eine Gliederung für Ihr Pitch Deck. Dann baut er jede Folie im Editor, während Sie zusehen. Kann er ein PDF oder eine Website nicht lesen, sagt er es.
      image:
