how_to:
  heading: So erstellen Sie einen Landingpage-Prototyp mit KI
  steps:
    - title: Ihren Launch beschreiben
      body: "Fügen Sie Ihr Launch-Briefing auf dem Design-Startbildschirm ins Feld **Neues Design** ein: [Angebot, Zielgruppe und Call-to-Action](https://www.agent-native.com/articles/how-do-you-build-a-landing-page-with-ai/). Oder hängen Sie das Briefing als Datei an und wählen Sie darunter das Designsystem Ihrer Marke."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8d189f62f944b3d935b058b826150b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8db8cda1abfe476f954bfa5bc50a7b6d
        alt: Nahaufnahme des Felds „Neues Design“ auf dem Design-Startbildschirm. Ein Launch-Briefing für die Auszahlungen am selben Tag von Ledgerlane ist eingegeben, das PDF des Briefings angehängt und das Designsystem „Ledgerlane Brand“ ausgewählt.
    - title: Einige Versionen vergleichen
      body: Bitten Sie den Agenten um „drei Versionen“. Jede erscheint als eigener Screen, nebeneinander auf dem Board. Wählen Sie eine im Chat, und der Agent baut daraus die ganze Seite und räumt die anderen weg.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F45d7dcdb0a2d473e82e516e2419e21f0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe7aac725b27c4046b57faf5e69a2abf2
        alt: Drei Versionen der Launch-Seite für Auszahlungen am selben Tag, Product-first, Editorial und Proof-led, nebeneinander auf dem Board. Der Agenten-Chat fragt, welche ausgebaut werden soll, mit einer Schaltfläche für jede.
    - title: Das HTML der Seite exportieren
      body: Wählen Sie im Editor-Menü **Datei** und dann **Export**. **HTML herunterladen** liefert eine Datei, die in jedem Browser öffnet. **Agent-Prompt kopieren** gibt einem Coding-Agenten alles, um die Seite in Ihre Website einzubauen.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F171cf01db5ca44ee8d31ebb6f98a73b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd2640c796dc44746ae1c8a622ec49bdc
        alt: Nahaufnahme des Editor-Menüs mit geöffnetem „Datei“ und „Export“ über der Launch-Seite „Product-first“. Die Optionen umfassen „HTML herunterladen“, „ZIP herunterladen“, „Für Figma herunterladen (SVG)“ und „Agent-Prompt kopieren“.
features:
  heading: Alles, um Ihre Launch-Seite zu gestalten
  items:
    - title: Vom Briefing zur Landingpage
      body: Der Agent baut auf den Aussagen Ihres Briefings auf, statt neue zu erfinden. Lässt das Briefing etwas offen, fragt er oder nennt seine Annahme.
    - title: KI und visuelles Bearbeiten
      body: Ändern Sie Überschrift, Farbe oder Abstände selbst, oder lassen Sie den Agenten einen Abschnitt überarbeiten. Sie bearbeiten dieselbe Seite.
    - title: Versionen nebeneinander
      body: Jede Version erhält einen eigenen Look und ein Mobil-Layout, damit Ihr Team echte Richtungen vergleicht, bevor etwas live geht.
    - title: Jeder Launch in Ihrer Marke
      body: Erstellen Sie einmal ein Designsystem aus Figma, Ihrer Website oder Ihrem Code. Jede neue Launch-Seite nutzt Ihre Farben, Schriften und Stile.
    - title: Feedback direkt auf der Seite
      body: "Reviewer pinnen Kommentare an genau die Überschrift oder den Button. Senden Sie einen an den Agenten: Er setzt ihn um oder lässt Sie entscheiden."
    - title: Code-Übergabe an Ihre Entwickler
      body: Der Agent-Prompt enthält Ihre Design-Tokens, die Dateien der Seite und die Anweisungen, die ein Coding-Agent zum Einbau in Ihre Website braucht.
