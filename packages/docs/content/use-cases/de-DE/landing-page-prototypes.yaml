faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Design kostenlos?
      a: Ja, Agent-Native Design ist kostenlos und Open Source. Eine Seite zu bauen braucht eine KI-Verbindung, entweder über Builder.io-KI-Guthaben oder Ihren eigenen KI-Schlüssel, die KI-Nutzung ist also nicht unbegrenzt. Design ist in der Alpha-Phase, rechnen Sie also mit Änderungen, während es wächst.
    - q: Veröffentlicht oder hostet Design meine Landingpage?
      a: Nein. Design erstellt die Landingpage und exportiert sie, und Sie deployen sie mit Ihren gewohnten Tools. Laden Sie das HTML oder ein ZIP der Dateien herunter, oder kopieren Sie einen Prompt, mit dem Ihr Coding-Agent die Seite in Ihre Website einbaut.
    - q: Kann ich meine eigene Marke verwenden?
      a: Ja. Erstellen Sie ein Designsystem aus einer Figma-Datei, Ihrer Website, einem GitHub-Repo oder hochgeladenen Dateien, und wählen Sie es beim Start einer Seite. Der Agent behält Farben, Schriften und Stile in jeder Version bei, die er erstellt.
    - q: Kann ich die Landingpage bearbeiten, nachdem die KI sie erstellt hat?
      a: Ja. Ändern Sie Text, Farben, Abstände und Layout direkt auf der Seite, oder bitten Sie den Agenten, einen Abschnitt zu ändern. Über **Versionsverlauf** stellen Sie jederzeit eine frühere Version wieder her.
    - q: Was erhalte ich beim Export der Landingpage?
      a: "**HTML herunterladen** liefert eine Datei, die in jedem Browser öffnet und ihre Styles aus dem Internet lädt. **ZIP herunterladen** enthält alle Dateien der Seite, und **Für Figma herunterladen (SVG)** liefert Ebenen, die Sie in Figma bearbeiten können. Die Doku listet [alle Exportoptionen](https://www.agent-native.com/docs/template-design-features/#export)."
    - q: Worin unterscheidet sich Design davon, einen Chatbot nach einer Landingpage zu fragen?
      a: "Ein Chatbot gibt Ihnen Code, den Sie erst irgendwo einfügen müssen, bevor Sie die Seite sehen. In Design baut der Agent die Seite in einem Editor, den Sie sehen und anklicken können, in mehreren Versionen. Sie ändern sie selbst oder per Frage, auf derselben Seite. Das ist eine [agentische App](https://www.agent-native.com/articles/what-is-an-agent-native-app/): die Intelligenz eines Agenten, die Intuitivität einer App."
