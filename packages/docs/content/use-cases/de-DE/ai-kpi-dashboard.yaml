how_to:
  heading: So erstellen Sie ein KPI-Dashboard mit KI
  steps:
    - title: Umsatz- und Produktdaten verbinden
      body: Fügen Sie auf der Seite **Datenquellen** Ihren Stripe-Secret-Key ein und ergänzen Sie HubSpot und Ihr Produktanalyse-Tool. Wählen Sie **Verbindung testen** im Menü einer Quelle, um zu prüfen, ob Analytics sie lesen kann.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ea7e1568d3b4afd9fc6a2a01bc969b0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F78b97b8d077644f28c627377157f1331
        alt: Nahaufnahme von Stripe auf der Seite „Datenquellen“, als verbunden markiert, mit konfiguriertem Secret Key und „Verbindung erfolgreich“ nach dem Verbindungstest.
    - title: Das gewünschte Dashboard beschreiben
      body: Klicken Sie auf **Neues Dashboard** und beschreiben Sie die [SaaS-Kennzahlen, die Sie verfolgen](https://www.agent-native.com/articles/what-should-a-saas-metrics-dashboard-include/), etwa „MRR und Churn aus Stripe, neue Signups und Aktivierung aus PostHog, Monat für Monat“. Der Agent stellt eventuell erst Fragen, baut dann jedes Panel und öffnet das Dashboard.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fca8b7f3746ca419383e042cc0c142271
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb167e98f0ac049fa8ad4b169e8f77ec9
        alt: Nahaufnahme des Felds „Neues Dashboard“, geöffnet aus der Dashboard-Liste der Seitenleiste, mit der eingegebenen Beschreibung eines Startup-KPI-Dashboards.
    - title: Fragen, warum sich eine Zahl bewegt hat
      body: Wählen Sie **Mit Panel chatten** im Menü eines Diagramms und stellen Sie eine Frage, etwa „Warum ist der Churn im September gestiegen?“. Der Agent antwortet aus Ihren verbundenen Daten und fügt auf Wunsch ein Panel hinzu.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9b18fbf5a7cd4b4ba65d9efede75538b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9edee9cd613741e2ba670e414be767c7
        alt: "Das Panel „Churn nach Monat“ mit dem Agenten-Chat daneben. Auf die Frage, warum der Churn im September stieg, schlüsselt der Agent den Anstieg nach Tarif auf: Der Churn im Starter-Tarif hat sich fast verdoppelt."
features:
  heading: Alles, um die KPIs Ihres Startups zu verfolgen
  items:
    - title: Umsatz, Pipeline und Nutzung zusammen
      body: MRR aus Stripe, Deals aus HubSpot und Signups aus PostHog oder Mixpanel stehen nebeneinander in einem Dashboard.
    - title: Selbst bearbeiten oder fragen
      body: Ändern Sie einen Filter selbst oder bitten Sie den Agenten um ein Panel. Beides landet im selben Dashboard, dessen Verlauf jede Version zurückholt.
    - title: Die Abfrage hinter jeder Zahl
      body: Klicken Sie auf einen Punkt im Diagramm, um die Datensätze dahinter, das SQL dazu und einen CSV-Download zu sehen.
    - title: Ihre Definition von MRR
      body: Legen Sie auf der Seite **Semantische Ebene** fest, wie Ihre Firma MRR oder aktive Nutzer zählt. Der Agent prüft das vor jeder Abfrage.
    - title: Privat, bis Sie teilen
      body: Ein neues Dashboard sehen nur Sie. Teilen Sie es, wenn es fertig ist, mit Mitgründern oder der Firma, zum Ansehen oder Bearbeiten.
    - title: Ihre KPIs per E-Mail
      body: "Die Zahlen kommen zu Ihnen: Erhalten Sie das Dashboard jeden Morgen zur gewünschten Zeit per E-Mail, für bis zu fünf Personen."
