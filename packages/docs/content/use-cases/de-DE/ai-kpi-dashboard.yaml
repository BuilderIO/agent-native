faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Analytics kostenlos?
      a: Ja, Agent-Native Analytics ist kostenlos und Open Source. Der Agent läuft über Builder.io-KI-Guthaben oder Ihren eigenen Modell-Schlüssel, und jede Datenquelle braucht eigene Zugangsdaten, etwa einen Stripe-Secret-Key. Analytics ist in der Alpha-Phase, Screens und Funktionen können sich also noch ändern.
    - q: Aus welchen Tools kann Analytics meine KPIs holen?
      a: Analytics verbindet sich mit Stripe, HubSpot, PostHog, Mixpanel, Amplitude, Google Analytics (GA4), BigQuery und mehr als einem Dutzend weiterer Quellen. Sie fügen jede auf der [Seite „Datenquellen“](https://www.agent-native.com/docs/template-analytics-connectors/) mit eigenem Schlüssel hinzu, und ein Dashboard kann mehrere Quellen mischen.
    - q: Muss ich SQL können, um ein KPI-Dashboard zu erstellen?
      a: Nein. Sie beschreiben das Dashboard oder stellen eine Frage in normaler Sprache, und der Agent schreibt das SQL. Die Abfrage bleibt hinter jedem Diagramm sichtbar, sodass jemand, der Ihre Daten kennt, sie prüfen oder bearbeiten kann.
    - q: Woher weiß ich, dass die Zahlen stimmen?
      a: Jede Zahl im Dashboard stammt aus einer Abfrage, die der Agent auf Ihren verbundenen Daten ausgeführt hat, und Sie können die Abfrage und die Datensätze hinter jedem Diagramm öffnen. Konnte der Agent keine Abfrage ausführen, markiert er die Zahl als „Unverified“. Gleichen Sie einige Zahlen mit Stripe ab, bevor Sie sich auf das Dashboard verlassen.
    - q: Wer kann mein KPI-Dashboard sehen?
      a: Nur Sie, bis Sie es teilen. Sie können [ein Dashboard teilen](https://www.agent-native.com/docs/sharing/), mit einem Teammitglied oder Ihrer ganzen Organisation, als Betrachter, Bearbeiter oder Admin. Geänderte Filter gelten nur für Sie; speichern Sie eine Ansicht oder senden Sie den Link, um sie zu teilen.
    - q: Worin unterscheidet sich Analytics von der KI in meinem Analytics-Tool?
      a: "Ein KI-Assistent in einem Analytics-Tool arbeitet mit den Daten dieses Tools. Analytics arbeitet über Stripe, Ihr CRM und Ihre Produktdaten hinweg, und sein Agent baut und bearbeitet das Dashboard, das Sie sich ansehen, sodass seine Antworten zu Panels werden, die Sie behalten. Das macht Analytics zu einer [agentischen App](https://www.agent-native.com/articles/what-is-an-agent-native-app/): die Intelligenz eines Agenten, die Intuitivität einer App."
