faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Content kostenlos?
      a: Ja, Agent-Native Content ist kostenlos und Open Source. Ihr Coding-Agent liest und bearbeitet die Spec mit seinem eigenen Modell, das zählt also zur Nutzung Ihres Agenten. Der integrierte Agent von Content läuft über Builder.io-Guthaben oder Ihren eigenen Modell-Schlüssel. Content ist in der Alpha-Phase, rechnen Sie also mit Änderungen.
    - q: Welche Coding-Agenten können meine Spec lesen?
      a: Claude Code und Codex öffnen die Seite über **Teilen** und bitten Sie einmalig, sich zu verbinden. Cursor und GitHub Copilot in VS Code fügen Content dort mit einem Klick hinzu. Claude Cowork, Goose und OpenCode verbinden sich über Ihr Terminal, und jeder MCP-Client mit Anmeldung kann sich [über die URL mit Content verbinden](https://www.agent-native.com/docs/external-agents/#private-content-links). Jeder Agent sieht nur, was Ihr Konto sehen darf.
    - q: Worin unterscheidet sich das von einer Spec-Datei in meinem Repo?
      a: Eine Spec-Datei in Ihrem Repo ist eine Kopie, die meist nur Leute bearbeiten, die im Code arbeiten. In Content schreibt und kommentiert Ihr Team auf derselben Seite, die Ihr Coding-Agent liest, und die Änderungen des Agenten kommen als Vorschläge. Wenn Sie Markdown zusätzlich im Repo möchten, [synchronisiert Content mit einem lokalen Ordner](https://www.agent-native.com/docs/template-content-sync/).
    - q: Kann mein Coding-Agent die Spec ändern?
      a: Ja, mit den Rechten Ihres Kontos. Bitten Sie ihn, Änderungen vorzuschlagen, und die Seite bleibt unverändert, bis Sie jede einzelne annehmen. Er kann die Seite auch direkt bearbeiten, aber hat sie sich geändert, nachdem der Agent sie gelesen hat, lehnt Content die Bearbeitung ab. Der [Versionsverlauf](https://www.agent-native.com/docs/template-content-editing/) bewahrt frühere Versionen auf.
    - q: Kann ich meine Specs in meinem Repo behalten?
      a: Ja. Verbinden Sie in Content einen [lokalen Markdown- oder MDX-Ordner](https://www.agent-native.com/docs/template-content-local-files/) und holen, prüfen oder übertragen Sie Änderungen, oder starten Sie Content mit einem Befehl aus Ihrem Repo. Konflikte werden Ihnen zur Prüfung angezeigt. Der Browser kann lokale Dateien nicht selbst lesen, daher braucht das eine lokale Content-App oder Agent-Native Desktop.
