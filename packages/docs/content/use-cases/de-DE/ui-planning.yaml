faqs:
  heading: Fragen? Wir haben Antworten
  items:
    - q: Ist Agent-Native Plan kostenlos?
      a: Ja, [Agent-Native Plan](https://www.agent-native.com/docs/template-plan/) ist kostenlos und Open Source. Ihr eigener Coding-Agent zeichnet die Screens, also läuft jeder Plan auf dem Modell Ihres Agenten und zählt zu dessen Nutzung, und ein längerer Plan verbraucht mehr. Plan ist in der Alpha-Phase, rechnen Sie also mit Änderungen.
    - q: Welche Coding-Agenten funktionieren mit Plan?
      a: Agent-Native Plan hat Plugins für Claude Code und Codex. Der Installationsbefehl richtet Cursor, OpenCode und GitHub Copilot genauso ein und fügt `/visual-plan` mit einer einmaligen Anmeldung hinzu. Cline, Goose und andere MCP-fähige Agenten verbinden sich, indem sie die URL von Plan hinzufügen.
    - q: Wie ändere ich, was der Plan zeigt?
      a: "Sie ändern einen Screen, indem Sie [ihn kommentieren](https://www.agent-native.com/docs/template-plan-review-workflow/), und Ihr Coding-Agent zeichnet ihn neu. In Plan können Sie Teile eines Screens nicht von Hand verschieben oder in der Größe ändern. Beim schriftlichen Plan unter den Screens ist das anders: Seinen Text können Sie direkt bearbeiten."
    - q: Passen die Screens zu meiner bestehenden App?
      a: Ja, wenn der Screen Teil einer App ist, die Sie schon haben. Vor dem Zeichnen liest Ihr Coding-Agent den Code, das Layout und die Komponenten Ihrer App, sodass der Plan Ihre echte Seitenleiste, Symbolleiste und Menüs zeigt. Eine ganz neue App erhält Screens nach Ihrer Beschreibung.
    - q: Worin unterscheidet sich Plan vom Planmodus meines Coding-Agenten?
      a: Plan arbeitet mit dem Planmodus Ihres Agenten zusammen und zeigt dessen Plan als Screens. Geben Sie `/visual-plan` einen Plan aus Claude Code, Codex oder Markdown, den Ihr Agent schon geschrieben hat, und Plan macht daraus die beschriebenen Screens, bereit für Kommentare an genau der richtigen Stelle.
