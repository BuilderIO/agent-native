title: Review your sales pipeline with HubSpot and Gong data
seo_title: AI sales analytics for HubSpot and Gong
meta_description: See which deals stalled and why before pipeline review. Ask Agent-Native Analytics about HubSpot and Gong in plain English, and keep the answers as a dashboard.
updated: 2026-10-27
hero:
  body: Agent-Native Analytics turns your HubSpot deals and Gong calls into a dashboard for every pipeline review. You ask which deals stalled and why in plain English, and the agent answers from both.
  button:
    label: Ask your pipeline
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe534007e491840cc86570110b7d00de4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4780c6d1885541bcaf3d949dbdbc1eb7
    alt: The Weekly pipeline review dashboard in Analytics, with panels for open pipeline by stage, deals by owner and deals stuck for 30 days. The agent chat on the right answers why one stuck deal stalled, using its HubSpot stage history and its last Gong call.
how_to:
  heading: How to analyze your sales pipeline with AI
  steps:
    - title: Connect your CRM and call data
      body: Open **Data Sources** and click **Connect** next to HubSpot, under **CRM & Sales**. Paste the token from a private app you create in HubSpot's settings and click **Save Credentials**. Gong works the same way, with an access key and secret.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fdeea3eb7d84048eca0f534b7b00390ee
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd918aa95f46047559b1f30c42d89d62f
        alt: The Data Sources page with HubSpot under Connected and Gong under CRM & Sales. The Gong setup sheet is open on its Access Key Secret step, pasted in, above Save Credentials.
    - title: Ask about your pipeline
      body: 'On **Ask**, ask in plain English: "Which open deals have sat in the same stage for 30 days or more?". The agent searches your HubSpot deals and answers with a table you can sort and follow up on.'
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7acaa378761c453bb79f9f246d8cab72
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe66acdb3c24e41c7b5caef3e0251b17a
        alt: "The Ask chat with the question about deals stuck for 30 days. The agent answers with a table of six open deals: stage, owner, amount and days in stage."
    - title: Save the answers as a dashboard
      body: Ask the agent to "save this as a dashboard for pipeline review." It builds a panel for each answer, and the panels refresh with new data from HubSpot. Share the dashboard with your team before your pipeline review.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F69b61731b5b74d61ad0e510f57522796
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2720d0e5fd8f40bfa3b72c056270f174
        alt: The agent chat confirming it saved the Weekly pipeline review dashboard, next to the new dashboard with its stuck-deals table and pipeline-by-stage chart.
features:
  heading: Everything you need for pipeline review
  items:
    - title: Your deals and calls together
      body: One question can pull a deal's stage and owner from HubSpot and what the buyer said on its calls from Gong.
    - title: Dashboards the agent edits
      body: Ask for a new panel, a filter by owner or a different chart, and the agent updates the dashboard your team shares.
    - title: Answers you can check
      body: The agent marks a figure Unverified when it didn't come from a live HubSpot or Gong query, so you know what to check.
    - title: Your pipeline next to revenue
      body: Connect Stripe and BigQuery too, and the same chat answers questions about revenue and product use beside your deals.
    - title: Your pipeline definitions
      body: An admin writes down what a stuck deal or qualified pipeline means on the **Semantic Layer** page. The agent reads it before answering.
    - title: A daily pipeline report
      body: Get the dashboard every day by email to up to five people or in a Slack channel, without opening the app.
