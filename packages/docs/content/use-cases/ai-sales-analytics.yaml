faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Analytics free?
      a: Yes, Agent-Native Analytics is free and open source. The agent runs on Builder.io AI credits or your own AI key, so AI use isn't unlimited. Questions about calls can also use your Gong API credits, which an admin can turn off. Analytics is in alpha.
    - q: Which CRM and call tools does Agent-Native Analytics connect to?
      a: Analytics connects to HubSpot for your CRM and Gong for your sales calls. Apollo and Clay connect too, for contact and company data. Each one [connects on the Data Sources page](https://www.agent-native.com/docs/template-analytics-connectors/) with its own key, and one question can draw on HubSpot and Gong together.
    - q: Do I need to write SQL?
      a: No. You ask in plain English, and the agent finds the data in HubSpot or Gong, runs the query and answers with a number, a table or a chart. When you save an answer to a dashboard, the agent sets up how each panel fetches fresh data.
    - q: Can I trust the numbers?
      a: "Yes, with a check: the agent answers from live HubSpot and Gong data and marks a figure Unverified when it didn't come from a live query. It follows your team's [definitions on the Semantic Layer page](https://www.agent-native.com/docs/template-analytics-dashboards/). Compare the first answers with HubSpot before you rely on them."
    - q: How is Agent-Native Analytics different from the AI that comes with HubSpot or Gong?
      a: The AI in HubSpot or Gong is built into that one tool. Analytics answers one question from HubSpot and Gong together, also reads Stripe and BigQuery, and keeps the answer as a dashboard your team reopens every week. You keep using HubSpot and Gong as before, and Analytics reads from both.
    - q: Who can see my dashboards?
      a: Only you, until you share one. Share a dashboard with a teammate or your whole organization as a viewer, editor or admin. Teammates see HubSpot and Gong data through their own connection, or through one an admin set up for the organization; without either, those panels show an error.
