how_to:
  heading: Comment créer un rapport marketing hebdomadaire avec l'IA
  steps:
    - title: Connectez vos données marketing
      body: Ouvrez **Sources de données**, suivez les [étapes de configuration](https://www.agent-native.com/docs/template-analytics-connectors/) des cartes Google Analytics et HubSpot, et cliquez sur **Tester la connexion**. Google Analytics demande un compte de service Google Cloud avec un accès Lecteur à votre propriété, à configurer une fois.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0218d6c271db4bbe8534c00e6f5e85a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa38de1d80c2e4f7fb8e1407d95f97984
        alt: Gros plan sur la page Sources de données avec Google Analytics et HubSpot listés comme connectés. Le panneau de configuration de HubSpot est ouvert à côté, avec son token configuré et Tester la connexion affichant Connexion réussie.
    - title: Demandez comment s'est passée la semaine
      body: "Demandez ce que vous demanderiez à un analyste. Par exemple : « Comment ont évolué les inscriptions issues de la recherche organique cette semaine par rapport à la semaine dernière ? » L'agent lance une requête en direct sur vos données et répond avec un graphique."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fcd7a4f648f5b4dee8a6282c3f512f698
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F74bf8b013f944b96a414979ff7234deb
        alt: Le chat de l'agent avec cette question et sa réponse. Deux phrases indiquent que les inscriptions organiques ont progressé d'une semaine sur l'autre, au-dessus d'un graphique en barres des inscriptions par canal pour cette semaine et la précédente.
    - title: Enregistrez et partagez votre tableau de bord
      body: Demandez à l'agent d'« en faire mon tableau de bord marketing hebdomadaire ». Cliquez sur **Partager** pour donner à un collègue ou à toute votre organisation un [accès en lecture ou en édition](https://www.agent-native.com/docs/sharing/), ou ouvrez **Rapports par e-mail** pour l'envoyer chaque jour à l'heure choisie.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F04feeeb2a1384ce0adecb7bee676b806
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F61fd64ac2bff4f53a3ca6cfbd97225fe
        alt: "Le tableau de bord marketing hebdomadaire avec la fenêtre Rapports par e-mail ouverte : envoi par e-mail et Slack, deux adresses d'équipe, un envoi à 9 h 00 et un bouton Envoyer maintenant."
features:
  heading: Tout ce qu'il faut pour le bilan de votre semaine marketing
  items:
    - title: Les deux outils dans une question
      body: Interrogez les sessions Google Analytics et les contacts HubSpot dans la même question, et l'agent répond avec les deux côte à côte.
    - title: Positionnements et trafic côte à côte
      body: Connectez DataForSEO et demandez comment vos positions ont bougé, face aux sessions organiques de la semaine.
    - title: Des chiffres toujours à jour
      body: "Les graphiques Google Analytics sont en direct et ceux de HubSpot se rafraîchissent seuls : le rapport montre toujours la dernière semaine."
    - title: Relancez l'analyse de la semaine dernière
      body: Enregistrez une analyse avec sa question et ses étapes, puis faites-la relancer sur les données de la semaine.
    - title: Les définitions de votre équipe
      body: Vos admins définissent un lead ou une inscription dans la page Couche sémantique, et l'agent applique ces définitions partout.
    - title: Interrogez n'importe quel graphique
      body: Cliquez sur un graphique et demandez ce qui a changé. L'agent reçoit le graphique et votre question, et répond d'après ses données.
