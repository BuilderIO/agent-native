faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Agent-Native Analytics est-il gratuit ?
      a: Oui, Agent-Native Analytics est gratuit et open source. Vous connectez vos propres comptes Google Analytics et HubSpot. Pour commencer, vous choisissez les crédits IA Builder.io gratuits ou votre propre clé de modèle IA pour l'agent, l'usage de l'IA a donc des limites. Analytics est en alpha, attendez-vous à des changements.
    - q: Quelles sources de données marketing puis-je connecter ?
      a: Agent-Native Analytics se connecte à Google Analytics (GA4), HubSpot, DataForSEO pour les positions sur les mots-clés et les volumes de recherche, et X pour l'engagement des posts. Il se connecte aussi à BigQuery, Amplitude, Mixpanel, PostHog et Stripe. Chaque source a besoin de ses propres identifiants, et Google Analytics demande un compte de service Google Cloud.
    - q: Agent-Native Analytics peut-il envoyer le rapport chaque lundi ?
      a: Pas encore selon un rythme hebdomadaire. Les [rapports par e-mail des tableaux de bord](https://www.agent-native.com/docs/template-analytics-dashboards/) partent chaque jour, à l'heure et dans le fuseau horaire de votre choix, vers cinq adresses e-mail au plus, un canal Slack ou les deux. Avant votre réunion du lundi, cliquez sur **Envoyer maintenant** dans **Rapports par e-mail** pour envoyer le dernier tableau de bord.
    - q: Dois-je connaître le SQL ?
      a: Non. Vous posez votre question avec vos mots, et l'agent choisit la source et écrit la requête. Vous pouvez lui demander de montrer la requête derrière n'importe quelle réponse si vous voulez la vérifier.
    - q: Puis-je me fier aux chiffres ?
      a: L'agent lance une requête en direct sur vos données avant de vous donner un chiffre, et marque un chiffre « Unverified » quand aucune requête n'a tourné. Comparez tout de même le rapport de la première semaine avec Google Analytics et HubSpot avant de l'envoyer à l'équipe.
    - q: En quoi Agent-Native Analytics diffère-t-il des rapports GA4 et HubSpot ?
      a: "Google Analytics et HubSpot font chacun des rapports sur leurs propres données. Agent-Native Analytics répond à une même question à partir des deux, avec vos mots, et garde les réponses dans un seul tableau de bord que vous affinez en demandant. C'est une [application agentique](https://www.agent-native.com/articles/what-is-an-agent-native-app/) : l'intelligence d'un agent, l'intuitivité d'une application."
