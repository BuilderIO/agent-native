faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Agent-Native Plan est-il gratuit ?
      a: Oui, Agent-Native Plan est gratuit et open source. Chaque plan tourne comme une session de votre agent de code, sur le modèle de votre choix. Il consomme les tokens de votre agent, et un plan plus gros en consomme davantage. Plan est en alpha, attendez-vous à des changements.
    - q: Avec quels agents de code Plan fonctionne-t-il ?
      a: Claude Code et Codex s'installent par plugin. Une seule commande d'installation configure aussi Plan dans Cursor, OpenCode, GitHub Copilot dans VS Code et Claude Cowork. Tout autre hôte MCP, comme Cline ou Goose, peut ajouter le connecteur de Plan par son URL. Vous relisez chaque plan dans votre navigateur.
    - q: En quoi Plan diffère-t-il du mode plan de mon agent de code ?
      a: Le mode plan de Claude Code, Codex, Cursor ou OpenCode vous donne le plan sous forme de texte dans le chat. Plan transforme ce plan, ou celui d'un fichier Markdown, en une page avec diagrammes, arborescences et code annoté. Vous y commentez des passages précis, répondez aux questions de l'agent et faites intervenir un collègue.
    - q: L'agent modifie-t-il mon code pendant qu'il planifie ?
      a: Non. Pendant qu'il écrit ou révise le plan, les instructions de Plan limitent l'agent à la lecture de votre code. Il commence à modifier après votre accord, et relit le plan approuvé avant les étapes importantes.
    - q: Un collègue peut-il relire un plan sans compte ?
      a: En partie. Toute personne avec qui vous partagez le lien peut ouvrir et modifier le plan en invité. Commenter, enregistrer et partager nécessitent un compte Agent-Native, donc un collègue qui veut commenter se connecte d'abord.
    - q: Puis-je garder mes plans sur ma machine ?
      a: Oui. Le [mode fichiers locaux](https://www.agent-native.com/docs/template-plan-local-and-desktop/) conserve un plan sous forme de fichiers MDX sur votre ordinateur, donc son contenu n'atteint jamais l'application hébergée. En contrepartie, vous ne pouvez ni partager un plan local ni le commenter dans le navigateur, et son lien ne s'ouvre que sur votre machine. Ce mode ne change pas l'endroit où tourne le modèle d'IA de votre agent de code.
