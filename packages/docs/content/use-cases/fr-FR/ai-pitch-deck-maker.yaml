faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Slides est-il gratuit ?
      a: Oui, Agent-Native Slides est gratuit et open source. Créer un deck nécessite une connexion IA, via Builder.io ou votre propre clé IA, et générer des images nécessite votre propre clé Gemini ou OpenAI. Slides est en alpha, attendez-vous donc à des changements au fil de son évolution.
    - q: Puis-je exporter mon pitch deck vers PowerPoint ou Google Slides ?
      a: Slides exporte un fichier PowerPoint (PPTX) modifiable. Pour Google Slides, il vous donne un fichier PPTX avec un lien d'import, que vous ouvrez vous-même dans Google Slides. Vous pouvez aussi exporter le deck en un seul fichier HTML.
    - q: Slides peut-il partir de mes notes, d'un doc ou de mon site ?
      a: Décrivez votre pitch sur l'écran d'accueil de Slides et joignez vos notes ou un doc, ou ajoutez le lien de votre site. Vous pouvez aussi importer un Google Doc, un fichier Word ou un PowerPoint. Si l'agent ne peut pas lire un PDF ou un site, il vous le dit au lieu de deviner.
    - q: En quoi Slides diffère-t-il d'un chatbot à qui l'on demande d'écrire ses slides ?
      a: "Un chatbot vous donne du texte à copier vous-même dans des slides. Dans Slides, l'agent construit le vrai deck dans un éditeur que vous voyez. Vous pouvez modifier n'importe quelle slide à la main ou demander à l'agent, sur le même deck, et chaque modification peut être annulée. C'est ce qui fait de Slides une [app agentique](https://www.agent-native.com/articles/what-is-an-agent-native-app/) : l'intelligence d'un agent, la simplicité d'une app."
    - q: Mon cofondateur peut-il modifier le pitch deck avec moi ?
      a: Vous, votre cofondateur et l'agent pouvez modifier le même deck en même temps. Vous pouvez commenter une slide ou une partie de celle-ci. Slides enregistre une version avant chaque modification importante, pour que vous puissiez restaurer une version antérieure à tout moment.
    - q: Combien de slides doit contenir un pitch deck ?
      a: "Une dizaine de slides est une bonne longueur pour un premier pitch ([ce que doit contenir un pitch deck](https://www.agent-native.com/articles/how-to-make-a-pitch-deck-with-ai/)), et Slides suggère « Build a 10-slide pitch from this doc ». Indiquez une autre longueur à l'agent si vous le souhaitez, et il adapte le plan."
