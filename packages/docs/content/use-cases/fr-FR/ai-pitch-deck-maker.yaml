app: slides
title: Créateur de pitch deck par IA
seo_title: Créateur de pitch deck par IA qui part de vos notes
meta_description: Agent-Native Slides est un créateur de pitch deck par IA gratuit pour les fondateurs. Il transforme vos notes, docs ou site en deck à modifier vous-même ou avec l'agent.
updated: 2026-10-23
hero:
  body: Agent-Native Slides transforme vos notes, un doc, un PDF ou votre site en pitch deck pour fondateurs. L'agent le crée slide par slide, et vous modifiez chaque slide à la main ou en le demandant.
  button:
    label: Créer votre deck
    url: https://slides.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8c62a5083d6f4836a73b216a59d6399f
