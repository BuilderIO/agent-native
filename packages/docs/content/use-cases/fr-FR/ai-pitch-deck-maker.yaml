    alt: Un pitch deck à moitié construit dans l'éditeur Slides. Le panneau de l'agent montre le plan établi à partir des notes de réunion du fondateur, et les nouvelles slides apparaissent une à une.
how_to:
  heading: Comment créer un pitch deck avec l'IA
  steps:
    - title: Partez de vos propres contenus
      body: "Sur l'écran d'accueil de Slides, décrivez le deck que vous voulez : votre entreprise, à qui il s'adresse et sa longueur. Joignez vos notes, docs ou documents de référence, puis créez le deck."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F12aade25b35944b396142acc3b8ff40c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff68c26a237fc45909db278af5b701e61
        alt: "Gros plan sur la zone de saisie de Slides : la description du pitch d'un fondateur, un fichier de notes joint et les suggestions en dessous."
    - title: Regardez l'agent construire chaque slide
      body: L'agent Slides commence par établir le plan de votre pitch deck. Il construit ensuite chaque slide dans l'éditeur sous vos yeux. S'il ne peut pas lire un PDF ou un site, il vous le dit.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F40529b37d7614ccc8ec582e933e57034
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3d3dd1d6c9eb4aafb791d086b46b4cd1
        alt: "L'éditeur Slides avec les slides 1 et 2 terminées et la slide 3, la solution, en cours de génération. Le chat de l'agent affiche le plan et « Ajout de la slide 3 · La solution »."
    - title: Présentez ou exportez le deck terminé
      body: Présentez votre pitch deck en plein écran depuis Slides, ou exportez-le. Vous pouvez exporter un fichier PowerPoint modifiable, un fichier à importer dans Google Slides ou un seul fichier HTML.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe65004f2089b48b6aaeb185fe529a28a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb621a0dad79042cc8bc145cc29c855b8
        alt: Gros plan sur le menu Exporter de Slides, ouvert sur la slide de titre terminée, avec les options HTML, PDF, PowerPoint et Google Slides.
features:
  heading: Tout ce qu'il faut pour créer et pitcher votre deck
  items:
    - title: Des pitch decks à partir de vos notes
      body: Partez d'un prompt, de vos notes, d'un doc ou de votre dernier deck. Parlez à l'agent de votre entreprise et de votre levée, et il crée le deck.
    - title: Édition par IA et visuelle
      body: Modifiez vous-même le texte et la mise en page sur la slide, ou sélectionnez une ligne et demandez à l'agent. Seul ce que vous visez change.
    - title: Votre marque sur chaque slide
      body: Enregistrez vos couleurs, polices et logo comme design system, et chaque deck que vous créez ressemble à votre entreprise.
    - title: Images et logos
      body: Demandez à l'agent de générer des images, de trouver des photos de stock ou d'ajouter des logos de clients et partenaires pour vos slides de traction.
    - title: Collaboration entre cofondateurs
      body: Modifiez le même deck avec votre cofondateur et l'agent, commentez n'importe quelle slide et restaurez une version antérieure.
    - title: Pitchez, partagez et exportez
      body: Présentez avec des notes d'orateur, partagez un lien en lecture seule avec vos investisseurs ou exportez un fichier PowerPoint modifiable.
