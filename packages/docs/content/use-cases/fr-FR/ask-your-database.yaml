faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Agent-Native Analytics est-il gratuit ?
      a: "Oui, Agent-Native Analytics est gratuit et open source. Utilisez l'app hébergée ou faites tourner votre propre copie. L'agent a besoin d'une connexion IA, via Builder.io ou votre propre clé de modèle, donc l'usage de l'IA n'est pas illimité. Analytics est en alpha : attendez-vous à des changements."
    - q: Faut-il connaître le SQL ?
      a: Non. Vous posez votre question en langage courant et l'agent écrit le SQL. Une personne qui connaît vos données devra peut-être d'abord [connecter BigQuery](https://www.agent-native.com/docs/template-analytics-connectors/). Un admin peut ajouter vos [définitions de métriques](https://www.agent-native.com/docs/template-analytics-dashboards/) dans la page **Couche sémantique**, pour que l'agent choisisse les bonnes tables et colonnes.
    - q: Est-ce que ça marche avec Postgres, Supabase ou Neon ?
      a: Oui, pour Postgres sur Supabase ou Neon. Connectez-le [via MCP](https://www.agent-native.com/docs/mcp-clients/) depuis le menu + du chat et posez votre question dans le chat. Ces réponses restent dans le chat, car les panneaux de tableau de bord ne peuvent pas encore interroger Postgres. Les autres bases Postgres ne peuvent pas encore être interrogées, c'est pourquoi les étapes de cette page utilisent BigQuery.
    - q: L'agent peut-il modifier mes données ?
      a: Pas dans BigQuery. Analytics y rejette toute requête de l'agent qui insérerait, modifierait, supprimerait ou effacerait des données. La configuration demande aussi un compte de service aux rôles en lecture seule, qui peut lire vos tables et exécuter des requêtes, mais pas les modifier. Via Supabase ou Neon, l'agent peut faire ce que vous autorisez à cette connexion.
    - q: Comment savoir si une réponse est juste ?
      a: Vérifiez la requête qui se trouve derrière. Demandez à l'agent d'afficher son SQL, ou ouvrez **Voir SQL** sur un graphique du tableau de bord. Vous pouvez aussi lui demander quelles tables et quels filtres il a utilisés. L'agent marque un chiffre **Unverified** quand aucune requête en direct n'a été exécutée.
    - q: En quoi est-ce différent de demander à ChatGPT d'analyser un export CSV ?
      a: "Un assistant de chat répond à partir du fichier exporté, donc chaque nouvelle question commence par un nouvel export. Analytics interroge directement votre entrepôt, utilise les définitions de métriques de votre équipe et garde dans un tableau de bord les réponses dont vous aurez encore besoin. C'est une [application agentique](https://www.agent-native.com/articles/what-is-an-agent-native-app/) : l'intelligence d'un agent, l'intuitivité d'une application."
