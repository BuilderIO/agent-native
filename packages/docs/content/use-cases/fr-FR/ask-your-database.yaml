how_to:
  heading: Comment interroger votre base de données en langage courant
  steps:
    - title: Connectez votre entrepôt de données
      body: Dans la page **Sources de données**, ouvrez BigQuery. Importez la clé JSON d'un compte de service doté des rôles BigQuery Data Viewer et BigQuery Job User, saisissez l'ID de votre projet, puis cliquez sur **Enregistrer les informations d'identification** et **Tester la connexion**.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F62008ebd98594f02b1c0bf3ae565ef49
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb01d428bca15467eb4c04299dd9575b8
        alt: Gros plan sur la carte BigQuery dans Sources de données, marquée Connecté, avec l'ID du projet et le compte de service configurés, et « Connexion réussie ».
    - title: Posez votre question en langage courant
      body: "Dans **Demander**, tapez votre question comme vous la poseriez à un collègue : « Combien de comptes se sont inscrits la semaine dernière, par offre ? » L'agent trouve les bonnes tables, exécute la requête et répond avec un graphique."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3e9ac5b30a924dab9b09bc76ed24b2de
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F31c48c5ccc9247b792c00474b01f97b0
        alt: Gros plan sur le chat de Demander. L'agent a parcouru le schéma BigQuery, exécuté une requête et répondu avec 723 inscriptions et un graphique en barres par offre.
    - title: Gardez la réponse dans un tableau de bord
      body: Demandez à l'agent d'« ajouter ça à un tableau de bord ». Il crée le panneau, vérifie que son SQL s'exécute et enregistre le tableau de bord. Celui-ci reste privé jusqu'à ce que vous le partagiez avec un collègue ou toute votre organisation.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F957858f8613241a2b2249d88430b3cc4
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd0111e9f420149fc8a35cad845ad8e2e
        alt: Un nouveau tableau de bord Inscriptions hebdomadaires avec le panneau des inscriptions par offre et un graphique des inscriptions par semaine. Le chat de l'agent, à côté, indique que les deux panneaux ont été vérifiés sur BigQuery.
features:
  heading: Tout ce qu'il faut pour obtenir des réponses de votre base de données
  items:
    - title: Le SQL derrière chaque réponse
      body: Ouvrez **Voir SQL** sur un graphique, ou demandez dans le chat, pour voir la requête de l'agent et la copier.
    - title: Les définitions de métriques de votre équipe
      body: Un admin note ce que « actif » ou « inscription » veut dire dans la page **Couche sémantique**. L'agent la lit avant d'écrire du SQL.
    - title: Des requêtes en lecture seule
      body: Dans BigQuery, le SQL de l'agent ne peut rien insérer, modifier ou supprimer, et son compte de service peut seulement lire et lancer des requêtes.
    - title: Des tableaux de bord que l'agent modifie
      body: Demandez dans le chat un autre panneau, un filtre ou une ventilation par offre, et l'agent modifie le tableau de bord pour tous ceux avec qui vous l'avez partagé.
    - title: Des questions qui croisent vos outils
      body: Posez une seule question qui croise les tables de votre entrepôt avec les revenus Stripe, les deals HubSpot ou les événements PostHog.
    - title: Le tableau de bord dans votre boîte mail
      body: Recevez un tableau de bord par e-mail chaque jour à l'heure choisie, avec ses graphiques et tableaux dans l'e-mail, jusqu'à cinq personnes.
