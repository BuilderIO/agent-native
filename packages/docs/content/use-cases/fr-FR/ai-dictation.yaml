faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Clips est-il gratuit ?
      a: Oui. Agent-Native Clips est gratuit et open source, et la dictée vocale est activée par défaut dans l'application de bureau. Le nettoyage par IA utilise des crédits IA Builder.io ou votre propre clé, il n'est donc pas illimité. Clips est en alpha, attendez-vous à des changements au fil de son évolution.
    - q: En quoi Clips diffère-t-il de la dictée intégrée à mon ordinateur ?
      a: La dictée intégrée n'exige aucune configuration, mais elle ne garde pas d'[historique consultable de ce que vous avez dit](https://www.agent-native.com/articles/what-should-you-look-for-in-dictation-software/). Clips enregistre chaque dictée avec son texte original et nettoyé, apprend vos mots et met le texte au propre avec l'IA. L'agent Clips peut retrouver ce que vous avez dit et le retravailler, par exemple transformer un monologue en liste à puces.
    - q: Clips écrira-t-il correctement le jargon de mon équipe ?
      a: Oui, une fois les termes ajoutés à votre Dictionnaire. Ajoutez-les un par ligne, ou sous la forme « terme → remplacement » pour un mot qu'il comprend mal. Vous pouvez aussi importer un fichier CSV de termes. Quand vous corrigez un mot juste après que Clips l'a collé, l'application de bureau enregistre cette correction dans votre Dictionnaire pour la fois suivante.
    - q: Mes dictées sont-elles enregistrées, et puis-je retrouver une ancienne ?
      a: "Chaque dictée est enregistrée avec son texte original et nettoyé, son heure et sa durée, et apparaît sur la page Dicter, regroupée par jour. Appuyez sur Cmd+K pour les rechercher par ce que vous avez dit, ou demandez à l'[agent Clips](https://www.agent-native.com/docs/template-clips-agent/), par exemple « Montre-moi ce que j'ai dicté hier ». Vous pouvez supprimer n'importe quelle dictée."
    - q: Ma voix quitte-t-elle mon ordinateur ?
      a: Pas forcément. Clips Desktop peut transcrire sur votre appareil, avec la reconnaissance vocale intégrée ou Local Whisper ([moteurs de transcription dans Clips](https://www.agent-native.com/docs/template-clips-features/)). Avec Builder.io ou votre propre clé, Clips envoie votre dictée à ce service d'IA pour le nettoyage. Le texte de chaque dictée est enregistré dans votre compte Clips.
