seo_title: Dictée par IA pour agents de code, Slack et docs
meta_description: Dites vos longs prompts à Claude Code, Slack ou un doc au lieu de les taper. Agent-Native Clips est une dictée par IA gratuite et open source qui garde chaque dictée.
