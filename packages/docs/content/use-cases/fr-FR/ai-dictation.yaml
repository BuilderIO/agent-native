how_to:
  heading: Comment utiliser la dictée par IA
  steps:
    - title: Dictez dans n'importe quelle application
      body: Installez Clips Desktop, cliquez dans Claude Code, Linear ou Slack, puis maintenez votre raccourci (Fn par défaut, ou celui choisi dans les Paramètres) pendant que vous parlez. Relâchez, et Clips place vos mots au curseur.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F493f3728ed1246bb841a651e3aa76300
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb3785ba8ec804690836d94e31ff92e17
        alt: "Le chat d'un agent de code : un prompt dicté sur les nouvelles tentatives de webhook a été envoyé, et l'agent a fait la modification. Le curseur attend dans la zone de message pendant que la pastille Clips en dessous écoute le prochain prompt, sa forme d'onde verte levée."
    - title: Apprenez vos mots à Clips
      body: "Ouvrez Dictionnaire sur la page Dicter et ajoutez le nom de votre produit, de vos bibliothèques et de vos collègues, ou « terme → remplacement » pour un mot que Clips comprend mal. Importez un fichier CSV pour ajouter toute une liste d'un coup."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F855c88996488417e8dc3a532a0fd21a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff4e9c0557a1344f6a55e7e9c4356a5ab
        alt: "Le panneau Dictionnaire dans Clips, avec Ajouter des termes, Importer et Exporter en CSV. En dessous, des termes comme Agent-Native, « web hooks → webhooks » et « kube control → kubectl »."
    - title: Retrouvez une ancienne dictée
      body: Appuyez sur Cmd+K dans Clips et tapez un mot que vous avez dit, et les dictées correspondantes s'affichent avec l'application où vous les avez dites. Choisissez-en une pour l'ouvrir sur la page Dicter.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5e344071b49f4e51ae5eef2708c46605
