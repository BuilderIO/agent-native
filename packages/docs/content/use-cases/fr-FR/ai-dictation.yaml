features:
  heading: Tout ce qu'il faut pour dicter au lieu de taper
  items:
    - title: Votre presse-papiers reste intact
      body: Clips colle dans les applications puis remet votre presse-papiers en place, donc le lien que vous aviez copié est toujours là. Dans les terminaux, il tape le texte à la place.
    - title: Un nettoyage par IA annulable
      body: "Clips corrige les mots mal compris, les virgules et les majuscules et supprime les faux départs : automatiquement avec un moteur cloud, ou en un clic. L'original est conservé."
    - title: Il apprend de vos corrections
      body: Corrigez un mot mal compris juste après que Clips l'a collé, et l'application de bureau ajoute cette correction à votre Dictionnaire, pour que la prochaine dictée soit juste.
    - title: Mains libres pour les longs prompts
      body: Appuyez deux fois sur votre raccourci pour continuer à écouter pendant que vous réfléchissez à voix haute, puis une fois de plus pour arrêter. Appuyez sur Échap pour jeter une dictée.
    - title: Collez-la à nouveau
      body: Appuyez sur Cmd+Ctrl+V pour recoller votre dernière dictée dans un autre champ de texte, pratique quand le curseur était au mauvais endroit.
    - title: Interrogez l'agent à son sujet
      body: Demandez « Qu'ai-je dit sur le budget du T3 ? » ou « Transforme ce monologue en liste à puces », et l'agent travaille à partir de votre historique.
