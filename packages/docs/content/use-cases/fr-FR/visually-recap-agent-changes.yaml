faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Agent-Native Plan est-il gratuit ?
      a: Oui, Agent-Native Plan est gratuit et open source. Chaque récap visuel lance une session d'agent complète sur le modèle de votre choix, donc un gros changement consomme davantage ce modèle. Plan est en alpha, attendez-vous à des changements.
    - q: Pour quels changements un récap visuel vaut-il la peine ?
      a: "Lancez un récap visuel sur les changements importants : ceux qui touchent plusieurs fichiers, le schéma de données, une API ou l'architecture de l'application. Pour un petit changement dans un seul fichier, lire le diff brut va plus vite qu'attendre un récap."
    - q: En quoi un récap visuel diffère-t-il de la lecture du diff ?
      a: "Un diff liste chaque ligne modifiée, fichier par fichier. Un récap visuel commence par ce que fait le changement : les écrans modifiés en wireframes, les champs de données changés et une carte des fichiers concernés. Il ne montre ensuite que les diffs qui méritent d'être lus, avec des notes."
    - q: Avec quels agents de code Plan fonctionne-t-il ?
      a: La commande d'installation configure Plan dans Claude Code, Codex, Cursor, OpenCode, GitHub Copilot dans VS Code et Claude Cowork, et vous connecte. Plan fonctionne aussi dans Cline, Goose et tout autre agent qui se connecte à des serveurs MCP, via son connecteur hébergé.
    - q: Puis-je obtenir un récap sur chaque pull request ?
      a: Oui. La [GitHub Action PR Visual Recap](https://www.agent-native.com/docs/pr-visual-recap/) lance Claude Code, Codex ou tout modèle compatible OpenAI avec votre propre clé API à chaque push. Elle tient à jour un seul commentaire sur la pull request, avec une capture du récap, et ne bloque jamais un merge. Les diffs de plus de 600 Ko environ sont tronqués.
    - q: Qui peut voir mes récaps ?
      a: Par défaut, seules les personnes connectées à votre organisation peuvent ouvrir un récap ; rendez-le privé et vous seul y avez accès. Avec la GitHub Action, quiconque voit la pull request voit la capture du récap. Le [mode fichiers locaux](https://www.agent-native.com/docs/template-plan-local-and-desktop/) garde un récap hors de l'application hébergée, mais le modèle de votre agent tourne toujours au même endroit.
