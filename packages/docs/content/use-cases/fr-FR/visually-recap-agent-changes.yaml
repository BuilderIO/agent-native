how_to:
  heading: Comment récapituler visuellement les changements de votre agent
  steps:
    - title: Demandez un récap à votre agent
      body: Ajoutez Plan à votre agent de code avec son [installation en une ligne](https://www.agent-native.com/docs/template-plan/#install). Dans le chat où l'agent a fait le changement, lancez `/visual-recap` et ouvrez le lien qu'il renvoie.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F060c82d850f34b3096f166c04ead386c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F287f076a9ec84124a0afc7fbaeda2ece
        alt: Le chat de l'agent de code avec « /visual-recap of everything you changed in this thread » envoyé, et la réponse de l'agent avec le lien vers le récap publié.
    - title: Lisez d'abord le changement en images
      body: Commencez par les wireframes avant/après, les changements de données signalés et la carte des fichiers modifiés. Ouvrez ensuite **Key changes**, où chaque fichier important a son onglet, avec un diff côte à côte et des notes.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff15296c5ef824f5ead19d6e64de1388f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faf5572fc8bbd4962972bfc0b24cf2bc0
        alt: Wireframes avant/après de la page Members, où la version après ajoute un bouton Invite et une invitation en attente. À côté, le modèle de données signale la nouvelle table invites comme ajoutée et le champ role de members comme modifié, passé d'un texte libre à une liste fixe de rôles.
    - title: Envoyez vos commentaires à l'agent
      body: Laissez des [commentaires de relecture](https://www.agent-native.com/docs/template-plan-review-workflow/) sur n'importe quel texte ou point d'un wireframe. Cliquez sur **Envoyer à l'agent**, choisissez **Copier pour votre agent** et collez le prompt dans votre agent de code, qui fait les changements et résout vos commentaires.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2256a69fdcd542a18a14a292050ff391
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2b4a48126c4f45c39c0b6f0389673387
        alt: Un commentaire pour l'agent, épinglé sur le bouton Invite du wireframe après, demande de ne l'afficher qu'aux admins. Le menu Envoyer à l'agent est ouvert, avec Copier pour votre agent et Envoyer à l'agent intégré.
features:
  heading: Tout ce qu'il faut dans un récap visuel
  items:
    - title: Les écrans avant le code
      body: Si le changement touche l'UI, le récap s'ouvre sur des wireframes avant/après, pour voir d'abord ce que voient les utilisateurs.
    - title: Changements de données signalés
      body: Les changements de schéma et d'API marquent chaque champ comme ajouté, modifié, supprimé ou renommé, avec l'ancien type à côté du nouveau.
    - title: Chaque fichier modifié cartographié
      body: Une arborescence liste chaque fichier touché, badgé ajouté, modifié, supprimé ou renommé, avec des notes sur ce qui a changé.
    - title: Diffs clés annotés
      body: Trois à huit fichiers clés ont un diff côte à côte, chacun avec un résumé d'une ligne et des notes sur les lignes à surveiller.
    - title: Couvre tout le fil
      body: Lancez `/visual-recap` dans le chat après le travail, et le récap couvre tout ce que l'agent y a fait, du premier changement aux derniers correctifs.
    - title: Relisez-le en équipe
      body: "Partagez le lien : les invités ouvrent le récap sans compte et se connectent pour commenter. Exportez-le en HTML, Markdown ou JSON pour l'archiver."
