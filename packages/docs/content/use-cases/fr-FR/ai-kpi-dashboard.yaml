title: Créez le tableau de bord KPI de votre startup
seo_title: Tableau de bord KPI par IA pour fondateurs
meta_description: Décrivez les métriques que vous suivez, et Agent-Native Analytics crée le tableau de bord KPI de votre startup depuis Stripe, HubSpot et vos données produit.
updated: 2026-10-27
hero:
  body: "Agent-Native Analytics réunit MRR, churn et inscriptions dans un tableau de bord issu de Stripe, HubSpot et vos données produit. Décrivez ce que vous suivez : l'agent le crée et explique chaque variation."
  button:
    label: Créez votre tableau de bord
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb23d4e197c9841e7b0eeaefc15090443
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F260764ee953f4b4f80f6a6cf631b2143
    alt: Le tableau de bord KPI d'une startup dans Analytics, avec des cartes MRR, churn, nouvelles inscriptions et activation au-dessus de graphiques mensuels du MRR et des inscriptions. La barre latérale de l'agent indique quelle offre a porté la croissance du MRR ce trimestre, avec un tableau par offre.
how_to:
  heading: Comment créer un tableau de bord KPI avec l'IA
  steps:
    - title: Connectez vos données de revenus et produit
      body: Dans la page **Sources de données**, collez votre clé secrète Stripe, puis ajoutez HubSpot et votre outil d'analytics produit. Choisissez **Tester la connexion** dans le menu d'une source pour vérifier qu'Analytics peut la lire.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ea7e1568d3b4afd9fc6a2a01bc969b0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F78b97b8d077644f28c627377157f1331
        alt: Gros plan sur Stripe dans la page Sources de données, marqué Connecté, avec sa clé secrète configurée et « Connexion réussie » après le test de connexion.
    - title: Décrivez le tableau de bord voulu
      body: Cliquez sur **Nouveau tableau de bord** et décrivez les [métriques SaaS que vous suivez](https://www.agent-native.com/articles/what-should-a-saas-metrics-dashboard-include/), par exemple « MRR et churn depuis Stripe, nouvelles inscriptions et activation depuis PostHog, mois par mois ». L'agent peut poser des questions, puis crée chaque panneau et ouvre le tableau de bord.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fca8b7f3746ca419383e042cc0c142271
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb167e98f0ac049fa8ad4b169e8f77ec9
        alt: Gros plan sur la fenêtre Nouveau tableau de bord, ouverte depuis la liste Tableaux de bord de la barre latérale, avec la description d'un tableau de bord KPI de startup saisie.
    - title: Demandez pourquoi un chiffre a bougé
      body: Choisissez **Discuter du panneau** dans le menu d'un graphique et posez une question, comme « Pourquoi le churn a-t-il augmenté en septembre ? ». L'agent répond à partir de vos données connectées, et ajoute un panneau au tableau de bord si vous le demandez.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9b18fbf5a7cd4b4ba65d9efede75538b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9edee9cd613741e2ba670e414be767c7
        alt: "Le panneau du churn par mois avec le chat de l'agent à côté. Interrogé sur la hausse du churn en septembre, l'agent la détaille par offre : le churn de Starter a presque doublé."
features:
  heading: Tout ce qu'il faut pour suivre les KPI de votre startup
  items:
    - title: Revenus, pipeline et usage réunis
      body: Le MRR de Stripe, les deals de HubSpot et les inscriptions de PostHog ou Mixpanel côte à côte dans un seul tableau de bord.
    - title: Modifiez à la main ou demandez
      body: Changez un filtre vous-même ou demandez un panneau à l'agent. Tout arrive sur le même tableau de bord, et l'historique restaure toute version.
    - title: La requête derrière chaque chiffre
      body: Cliquez sur un point d'un graphique pour voir les enregistrements, le SQL qui les a trouvés et un export CSV.
    - title: Votre définition du MRR
      body: Notez comment votre entreprise compte le MRR ou un utilisateur actif dans **Couche sémantique**. L'agent la consulte avant chaque requête.
    - title: Privé jusqu'au partage
      body: Un nouveau tableau de bord n'est qu'à vous. Une fois prêt, partagez-le avec un associé ou l'entreprise, en lecture ou en édition.
    - title: Vos KPI par e-mail
      body: "Les chiffres viennent à vous : recevez le tableau de bord par e-mail chaque matin, à l'heure de votre choix, jusqu'à cinq personnes."
