faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Agent-Native Analytics est-il gratuit ?
      a: Oui, Agent-Native Analytics est gratuit et open source. L'agent fonctionne avec les crédits IA Builder.io ou votre propre clé de modèle, et chaque source de données a besoin de ses propres identifiants, comme une clé secrète Stripe. Analytics est en alpha, les écrans et fonctions peuvent donc encore changer.
    - q: Depuis quels outils Analytics peut-il récupérer mes KPI ?
      a: Analytics se connecte à Stripe, HubSpot, PostHog, Mixpanel, Amplitude, Google Analytics (GA4), BigQuery et plus d'une douzaine d'autres sources. Vous ajoutez chacune dans la [page Sources de données](https://www.agent-native.com/docs/template-analytics-connectors/) avec sa propre clé, et un tableau de bord peut mêler plusieurs sources.
    - q: Faut-il connaître le SQL pour créer un tableau de bord KPI ?
      a: Non. Vous décrivez le tableau de bord ou posez une question en langage courant, et l'agent écrit le SQL. La requête reste visible derrière chaque graphique, pour qu'une personne qui connaît vos données puisse la vérifier ou la modifier.
    - q: Comment savoir si les chiffres sont justes ?
      a: Chaque chiffre du tableau de bord vient d'une requête que l'agent a exécutée sur vos données connectées, et vous pouvez ouvrir la requête et les enregistrements derrière n'importe quel graphique. Quand l'agent n'a pas pu exécuter de requête, il marque le chiffre « Unverified ». Vérifiez quelques chiffres dans Stripe avant de vous fier au tableau de bord.
    - q: Qui peut voir mon tableau de bord KPI ?
      a: Vous seul, jusqu'à ce que vous le partagiez. Vous pouvez [partager un tableau de bord](https://www.agent-native.com/docs/sharing/) avec un collègue ou toute votre organisation, en lecture, en édition ou en admin. Les filtres que vous changez ne s'appliquent qu'à vous ; enregistrez une vue ou envoyez le lien pour les partager.
    - q: En quoi Analytics diffère-t-il de l'IA de mon outil d'analytics ?
      a: "Un assistant IA intégré à un outil d'analytics travaille sur les données de cet outil. Analytics travaille sur Stripe, votre CRM et vos données produit, et son agent crée et modifie le tableau de bord que vous consultez, donc ses réponses deviennent des panneaux que vous gardez. C'est ce qui fait d'Analytics une [application agentique](https://www.agent-native.com/articles/what-is-an-agent-native-app/) : l'intelligence d'un agent, l'intuitivité d'une application."
