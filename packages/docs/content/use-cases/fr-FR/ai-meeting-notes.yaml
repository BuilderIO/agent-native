faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Clips est-il gratuit ?
      a: Oui, Agent-Native Clips est gratuit et open source. Les résumés, les titres et le nettoyage des transcriptions utilisent par défaut les [crédits IA Builder.io](https://www.agent-native.com/docs/template-clips-features/). Quand les crédits sont épuisés, ces fonctions s'arrêtent jusqu'à ce que vous en ajoutiez ou connectiez votre propre clé Gemini. Clips est en alpha, attendez-vous à des changements.
    - q: Un bot rejoint-il mes réunions ?
      a: "Non. Clips prend des notes depuis votre propre ordinateur : Clips Desktop enregistre votre microphone et l'audio de l'appel, donc rien ne rejoint votre appel Zoom, Google Meet ou Microsoft Teams. Comme aucun bot ne rejoint l'appel, prévenez les participants que vous prenez des notes."
    - q: Avec quels calendriers et applications d'appel vidéo Clips fonctionne-t-il ?
      a: Clips se connecte uniquement à Google Calendar. Les notes fonctionnent dans Zoom, Google Meet, Microsoft Teams, Webex ou tout autre appel dont votre ordinateur lit l'audio. Sur Mac, Clips Desktop repère aussi ces appels quand ils ne figurent pas dans votre calendrier, et propose de lancer les notes. Les voix des autres participants ne sont captées que sur Mac.
    - q: Clips prend-il des notes de réunion sous Windows ?
      a: Clips Desktop fonctionne sur Mac, Windows et Linux, mais la capture des voix des autres participants n'est possible que sur Mac. Sous Windows et Linux, Clips n'enregistre que votre microphone, donc les participants à distance manquent dans la transcription et les actions à faire.
    - q: En quoi Clips diffère-t-il de l'assistant de notes IA de Zoom ou de Google Meet ?
      a: "L'assistant de notes IA d'une application d'appel est lié aux appels de cette application. Clips garde toutes vos réunions, quelle que soit l'application d'appel, dans une seule bibliothèque. Demandez à l'[agent Clips](https://www.agent-native.com/docs/template-clips-agent/) « qu'est-ce que Daniel a promis mardi dernier ? » et il cherche dans vos réunions selon ce qui a été dit. C'est une [application agentique](https://www.agent-native.com/articles/what-is-an-agent-native-app/) : l'intelligence d'un agent, l'intuitivité d'une application."
