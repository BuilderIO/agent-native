how_to:
  heading: Comment analyser un funnel avec l'IA
  steps:
    - title: Demandez où s'arrêtent les nouveaux utilisateurs
      body: "Envoyez vos événements d'inscription dans Analytics. Posez la question dans **Demander** : l'agent écrit le SQL et ajoute un [panneau funnel](https://www.agent-native.com/docs/template-analytics-dashboards/) avec le nombre et la perte de chaque étape. Essayez : « Ajoute un funnel à mon tableau de bord Activation funnel : où se sont arrêtés les inscrits de la semaine dernière ? »"
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa752431cecb8420c88d3d6a8f7980ea9
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F16ab210c27504ed1b71c37ebdabea744
        alt: Le chat de l'agent avec cette demande et la réponse de l'agent, à côté du funnel ajouté. Les étapes indiquent Signed up 1 240, Created a project 612, Connected a data source 418 et Invited a teammate 302, chacune avec sa perte.
    - title: Retrouvez les personnes qui ont arrêté
      body: Activez Tri des sessions dans les Paramètres d'Analytics. Dans **Sessions**, ouvrez **Événements**. Choisissez **Avec** pour l'étape avant la perte, comme « signed_up », et **Sans** pour l'étape jamais atteinte, comme « project_created ».
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F327bf36c28ab452da87cf4f4dc65debe
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F49b79e0de78041bb93444ec4d24ce11a
        alt: Gros plan sur la page Sessions avec le filtre Événements ouvert, signed_up réglé sur Avec et project_created sur Sans. En dessous, la liste filtrée des sessions des nouveaux utilisateurs, chacune avec sa durée, sa page et ses clics de rage.
    - title: Demandez ce qui s'est passé dans une session
      body: Ouvrez un replay pour voir la page, les clics et les requêtes réseau. Cliquez sur **Demander à l'agent** et posez la question « Que s'est-il passé dans cette session ? ». L'agent résume les erreurs, les clics répétés et les pages vues.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7e0b3a4750a143f6bcd609e1c5460fd2
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe44e9321e80d4c3f826bd7b25fa54025
        alt: Le replay d'un nouvel utilisateur sur la page de création de projet, avec la réponse de l'agent à côté. La personne a saisi un nom de projet et cliqué trois fois sur Create project. La requête vers l'API des projets a échoué à chaque fois, et elle est partie.
features:
  heading: Tout ce qu'il faut pour trouver et corriger les décrochages
  items:
    - title: Sauter une étape n'est pas décrocher
      body: Indiquez à l'agent les étapes facultatives, et le funnel distingue ceux qui les sautent de ceux qui quittent l'app.
    - title: Vos propres noms d'événements
      body: Les admins décrivent vos événements et métriques dans la page **Couche sémantique**, et l'agent utilise ces noms exacts dans chaque requête.
    - title: Voyez la requête échouée
      body: Ouvrez **Outils de dev** sur un replay pour lire sa console et ses requêtes réseau, et sauter au moment où une requête a échoué.
    - title: Des replays expurgés pour les agents
      body: Un agent externe reçoit la console et le réseau du replay, erreurs en tête, jamais l'enregistrement lui-même. Son lien expire en deux heures.
    - title: Privé par défaut
      body: La saisie est masquée dans chaque replay, et vous choisissez les autres parties de la page à cacher.
    - title: Le funnel chaque jour
      body: Faites envoyer votre tableau de bord funnel chaque jour, à l'heure choisie, par e-mail à cinq personnes au plus ou sur Slack.
