faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Agent-Native Analytics est-il gratuit ?
      a: "Oui, Agent-Native Analytics est gratuit et open source. Utilisez l'application hébergée, ou [faites tourner votre propre copie](https://www.agent-native.com/docs/template-analytics/). Vous apportez les données : vos propres événements, ou les outils que vous connectez. Analytics est en alpha, attendez-vous à des changements."
    - q: Dois-je connaître le SQL ?
      a: "Non. Posez votre question en langage courant : l'agent écrit et exécute le SQL, puis répond avec un graphique, un tableau ou un chiffre. Demandez à voir la requête quand vous voulez la vérifier. Quelqu'un qui connaît vos données devra peut-être d'abord [connecter vos sources](https://www.agent-native.com/docs/template-analytics-connectors/)."
    - q: D'où viennent les replays de sessions ?
      a: "De votre propre application web. Créez une clé publique dans **Sources de données**, puis ajoutez à votre app le court snippet de suivi de la page **Sessions**, avec le replay de session activé. Connectez un stockage pour les enregistrements : Builder.io ou votre propre bucket S3. Par défaut, les [replays](https://www.agent-native.com/docs/template-analytics-monitoring-and-sessions/) n'enregistrent que les utilisateurs connectés."
    - q: Qu'enregistre un replay de session ?
      a: Un replay restitue la page, les clics et le défilement, la sortie console et les requêtes réseau. La saisie est masquée par défaut, et les champs nommés comme mots de passe ou données de carte ne sont jamais capturés. Pour masquer autre chose, ajoutez une classe à cette partie de la page.
    - q: Puis-je utiliser mes données PostHog, Amplitude ou Mixpanel ?
      a: Oui. Connectez-les dans **Sources de données** et posez vos questions sur les événements que vous y suivez. L'agent interroge chaque outil pour vous. Les replays de sessions ne viennent que du suivi propre à Analytics, alors ajoutez-le à votre app pour voir les personnes qui ont arrêté.
    - q: En quoi Analytics diffère-t-il de l'IA de mon outil d'analytics ?
      a: "L'IA d'un outil d'analytics travaille sur les données de cet outil. L'agent Analytics travaille sur toutes les sources que vous connectez, retrouve les replays des personnes précises qui ont arrêté, et explique chacun d'eux ou le confie à votre agent de code. Il est aussi open source. C'est une [application agentique](https://www.agent-native.com/articles/what-is-an-agent-native-app/) : l'intelligence d'un agent, l'intuitivité d'une application."
