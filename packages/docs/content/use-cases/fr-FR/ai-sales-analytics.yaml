how_to:
  heading: Comment analyser votre pipeline commercial avec l'IA
  steps:
    - title: Connectez votre CRM et vos appels
      body: Ouvrez **Sources de données** et cliquez sur **Connecter** à côté de HubSpot, sous **CRM & Sales**. Collez le token d'une application privée créée dans les paramètres HubSpot et cliquez sur **Enregistrer les identifiants**. Gong fonctionne pareil, avec une clé d'accès et un secret.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fdeea3eb7d84048eca0f534b7b00390ee
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd918aa95f46047559b1f30c42d89d62f
        alt: La page Sources de données avec HubSpot sous Connecté et Gong sous CRM & Sales. Le panneau de configuration de Gong est ouvert sur l'étape Access Key Secret, collée, au-dessus du bouton Enregistrer les identifiants.
    - title: Interrogez votre pipeline
      body: "Dans **Demander**, posez votre question en langage courant : « Quels deals ouverts sont dans la même étape depuis 30 jours ou plus ? ». L'agent cherche dans vos deals HubSpot et répond avec un tableau à trier et à creuser."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7acaa378761c453bb79f9f246d8cab72
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe66acdb3c24e41c7b5caef3e0251b17a
        alt: "Le chat Demander avec la question sur les deals bloqués depuis 30 jours. L'agent répond avec un tableau de six deals ouverts : étape, responsable, montant et jours dans l'étape."
    - title: Gardez les réponses en tableau de bord
      body: Demandez à l'agent d'« enregistrer ceci comme tableau de bord pour la revue de pipeline ». Il crée un panneau par réponse, et les panneaux se mettent à jour avec les nouvelles données HubSpot. Partagez le tableau de bord avec votre équipe avant la revue.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F69b61731b5b74d61ad0e510f57522796
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2720d0e5fd8f40bfa3b72c056270f174
        alt: Le chat de l'agent confirme l'enregistrement du tableau de bord Weekly pipeline review, à côté du nouveau tableau de bord avec son tableau des deals bloqués et son graphique du pipeline par étape.
features:
  heading: Tout ce qu'il faut pour la revue de pipeline
  items:
    - title: Vos deals et vos appels réunis
      body: Une question peut croiser l'étape et le responsable d'un deal dans HubSpot avec ce que l'acheteur a dit en appel dans Gong.
    - title: Des tableaux de bord que l'agent modifie
      body: Demandez un panneau, un filtre par responsable ou un autre graphique, et l'agent met à jour le tableau de bord de l'équipe.
    - title: Des réponses vérifiables
      body: "L'agent marque « Unverified » un chiffre qui ne vient pas d'une requête HubSpot ou Gong en direct : vous savez quoi vérifier."
    - title: Votre pipeline à côté du chiffre d'affaires
      body: Connectez aussi Stripe et BigQuery, et le même chat répond sur le chiffre d'affaires et l'usage du produit, à côté de vos deals.
    - title: Vos définitions du pipeline
      body: Un admin définit ce qu'est un deal bloqué ou un pipeline qualifié dans la page **Couche sémantique**. L'agent la lit avant de répondre.
    - title: Un rapport de pipeline quotidien
      body: Recevez le tableau de bord chaque jour par e-mail, jusqu'à cinq personnes, ou sur Slack, sans ouvrir l'application.
