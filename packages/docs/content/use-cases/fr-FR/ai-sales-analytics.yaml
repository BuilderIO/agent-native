faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Agent-Native Analytics est-il gratuit ?
      a: Oui, Agent-Native Analytics est gratuit et open source. L'agent fonctionne avec les crédits IA Builder.io ou votre propre clé IA, l'usage de l'IA n'est donc pas illimité. Les questions sur les appels peuvent aussi consommer vos crédits API Gong, ce qu'un admin peut désactiver. Analytics est en alpha.
    - q: À quels outils de CRM et d'appels Agent-Native Analytics se connecte-t-il ?
      a: Analytics se connecte à HubSpot pour votre CRM et à Gong pour vos appels commerciaux. Apollo et Clay se connectent aussi, pour les données de contacts et d'entreprises. Chacun [se connecte depuis la page Sources de données](https://www.agent-native.com/docs/template-analytics-connectors/) avec sa propre clé, et une seule question peut s'appuyer à la fois sur HubSpot et Gong.
    - q: Dois-je écrire du SQL ?
      a: Non. Vous posez votre question en langage courant, et l'agent trouve les données dans HubSpot ou Gong, lance la requête et répond avec un chiffre, un tableau ou un graphique. Quand vous enregistrez une réponse dans un tableau de bord, l'agent configure la façon dont chaque panneau récupère des données à jour.
    - q: Puis-je me fier aux chiffres ?
      a: "Oui, en vérifiant : l'agent répond à partir des données HubSpot et Gong en direct et marque un chiffre comme « Unverified » quand il ne vient pas d'une requête en direct. Il suit les [définitions de votre équipe dans la page Couche sémantique](https://www.agent-native.com/docs/template-analytics-dashboards/). Comparez les premières réponses avec HubSpot avant de vous y fier."
    - q: En quoi Agent-Native Analytics diffère-t-il de l'IA intégrée à HubSpot ou Gong ?
      a: L'IA de HubSpot ou de Gong est intégrée à cet outil seul. Analytics répond à une même question à partir de HubSpot et Gong, lit aussi Stripe et BigQuery, et garde la réponse dans un tableau de bord que votre équipe rouvre chaque semaine. Vous continuez d'utiliser HubSpot et Gong comme avant, et Analytics lit les deux.
    - q: Qui peut voir mes tableaux de bord ?
      a: Vous seul, jusqu'à ce que vous en partagiez un. Partagez un tableau de bord avec un collègue ou toute votre organisation, en lecture, en édition ou en admin. Vos collègues voient les données HubSpot et Gong via leur propre connexion, ou via celle qu'un admin a configurée pour l'organisation ; sans l'une ou l'autre, ces panneaux affichent une erreur.
