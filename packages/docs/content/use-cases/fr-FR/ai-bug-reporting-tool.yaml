faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Clips est-il gratuit ?
      a: Oui. Agent-Native Clips est gratuit et open source, extension Chrome comprise. Les titres, les résumés et le nettoyage des transcriptions utilisent par défaut les crédits IA Builder.io, l'usage de l'IA n'est donc pas illimité, et les enregistrements ont besoin d'un endroit où stocker la vidéo. Clips est en alpha, attendez-vous à des changements au fil de son évolution.
    - q: Que capture Clips dans mon navigateur ?
      a: L'extension Chrome de Clips capture les [messages console, les erreurs JavaScript et les requêtes réseau](https://www.agent-native.com/docs/template-clips-features/#chrome-extension-browser-logs) de jusqu'à cinq onglets, en remontant jusqu'à 30 secondes avant que vous n'appuyiez sur enregistrer. Chaque requête conserve son adresse, son statut, sa durée et son éventuel échec. Les éditeurs voient tout dans l'onglet Débogage du clip, et les agents y accèdent via le lien.
    - q: Clips enregistre-t-il les mots de passe ou les données privées ?
      a: Clips ne sauvegarde jamais les corps de requêtes ou de réponses, les en-têtes, les cookies ni le texte que vous tapez, et il masque les valeurs qui ressemblent à des tokens, des mots de passe ou des clés. Vous pouvez désactiver les logs développeur dans les paramètres de l'extension. Les nouveaux enregistrements sont publics par lien, alors passez un rapport de bug en privé ou en visibilité organisation quand il montre des données internes.
    - q: Comment donner un enregistrement de bug à Claude Code, Cursor ou Codex ?
      a: Collez le lien du clip dans Claude Code, Cursor ou Codex, et l'agent [lit la transcription, les images et les logs du navigateur](https://www.agent-native.com/docs/template-clips-integrations/#agent-readable-clips) sans télécharger la vidéo. Pour un clip privé, cliquez sur Copier le prompt pour agent dans l'onglet Agents du menu Partager, qui donne à l'agent un lien valable deux heures. Cet onglet ouvre aussi le clip dans Claude Code ou Codex.
    - q: Clips capture-t-il les logs dans d'autres navigateurs ou dans l'application de bureau ?
      a: Non. Les logs console et réseau viennent uniquement de l'extension Chrome de Clips. Clips Desktop et l'application web enregistrent quand même votre écran, votre caméra et votre voix, avec une transcription et un résumé, mais l'enregistrement n'inclura pas les logs du navigateur.
    - q: Clips est-il un outil de suivi de bugs comme Jira ?
      a: "Non. Clips produit [un rapport de bug exploitable par un ingénieur](https://www.agent-native.com/articles/how-to-write-a-bug-report/), et votre outil de suivi le stocke : collez le lien dans Jira, GitHub, Linear ou Slack. Votre agent de code ou l'[agent Clips](https://www.agent-native.com/docs/template-clips-agent/) reçoit l'enregistrement et ses logs, pas seulement le texte d'un ticket. C'est ce qui fait de Clips une [application agentique](https://www.agent-native.com/articles/what-is-an-agent-native-app/) : l'intelligence d'un agent, l'intuitivité d'une application."
