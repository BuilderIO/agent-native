how_to:
  heading: Comment signaler un bug avec l'IA
  steps:
    - title: Lancez l'enregistrement depuis Chrome
      body: "Cliquez sur l'extension Chrome de Clips dans votre barre d'outils et choisissez la source : un onglet du navigateur, une fenêtre ou tout l'écran. Activez ou coupez votre caméra et votre microphone, puis cliquez sur Start recording."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6996593713c74108967e120111378c14
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff7991811f7a346e0a99cf9fe81496e34
        alt: Gros plan sur la fenêtre de l'extension Clips au-dessus d'une application web, avec Browser tab choisi comme source, la caméra et le microphone activés, et le bouton Start recording.
    - title: Montrez le bug et expliquez-le
      body: Cliquez sur les étapes qui plantent et dites ce que vous attendiez. Pendant l'enregistrement, l'extension sauvegarde les erreurs de la page et les requêtes envoyées, les détails qu'un ingénieur devrait sinon aller chercher dans les outils de développement de Chrome.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe01ffb73c62c427b8077f05657fdeb47
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff895d85667344971baec96eb0b2ec956
        alt: Les commandes d'enregistrement de Clips et la bulle de caméra au-dessus de la page de paiement d'une application web, où un message « Something went wrong » apparaît.
    - title: Partagez un seul lien
      body: Quand vous arrêtez, Clips copie le lien de l'enregistrement pour vous. Collez-le dans un ticket, un chat ou votre agent de code. L'onglet Agents du menu Partager l'ouvre aussi directement dans Claude, Claude Code ou Codex.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F10933b64225545e1b5ecd666f5803832
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2894036362f7409d8a4961536719b399
        alt: Gros plan sur le menu Partager de Clips, sur son onglet Agents, avec Copier le prompt pour agent et les boutons Ouvrir dans Claude, Ouvrir dans Claude Code et Ouvrir dans Codex.
features:
  heading: Tout ce qu'il faut pour signaler un bug
  items:
    - title: Pensé pour votre agent de code
      body: Collez le lien dans Claude Code, Cursor ou Codex. L'agent lit la transcription, les images et les logs, sans télécharger la vidéo.
    - title: Logs console et réseau
      body: Clips sauvegarde les messages console, les erreurs et les requêtes de jusqu'à cinq onglets, avec le statut et la durée de chaque requête et son éventuel échec.
    - title: Les 30 secondes d'avant
      body: Clips remonte jusqu'à 30 secondes avant que vous n'appuyiez sur enregistrer, donc une erreur survenue pendant le chargement de la page peut figurer dans le rapport.
    - title: Pas de secrets
      body: Clips ne sauvegarde jamais les corps de requêtes, les en-têtes, les cookies ni ce que vous tapez, et masque les valeurs qui ressemblent à des tokens ou des mots de passe.
    - title: Allez droit à l'erreur
      body: Dans l'onglet Débogage du clip, cliquez sur l'heure à côté d'une erreur ou d'une requête échouée et la vidéo saute à ce moment.
    - title: Recherchez tous vos rapports de bug
      body: Retrouvez un rapport de bug grâce à ce qui y a été dit, ou interrogez l'agent Clips sur tous les enregistrements de votre bibliothèque.
