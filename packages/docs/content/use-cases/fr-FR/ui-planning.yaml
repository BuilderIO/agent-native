faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Agent-Native Plan est-il gratuit ?
      a: Oui, [Agent-Native Plan](https://www.agent-native.com/docs/template-plan/) est gratuit et open source. C'est votre propre agent de code qui dessine les écrans, donc chaque plan tourne sur le modèle de votre agent et compte dans son usage, et un plan plus long consomme davantage. Plan est en alpha, attendez-vous à des changements.
    - q: Quels agents de code fonctionnent avec Plan ?
      a: Agent-Native Plan a des plugins pour Claude Code et Codex. La commande d'installation configure Cursor, OpenCode et GitHub Copilot de la même façon, en ajoutant `/visual-plan` avec une connexion unique. Cline, Goose et les autres agents compatibles MCP se connectent en ajoutant l'URL de Plan.
    - q: Comment modifier ce que montre le plan ?
      a: "Vous modifiez un écran en [le commentant](https://www.agent-native.com/docs/template-plan-review-workflow/), et votre agent de code le redessine. Plan ne permet pas de déplacer ou redimensionner à la main les éléments d'un écran. Le plan écrit sous les écrans, lui, est différent : vous pouvez modifier son texte directement."
    - q: Les écrans correspondront-ils à mon app existante ?
      a: Oui, quand l'écran fait partie d'une app que vous avez déjà. Avant de dessiner, votre agent de code lit le code de votre app, sa mise en page et ses composants, donc le plan montre votre vraie barre latérale, votre barre d'outils et vos menus. Une toute nouvelle app reçoit des écrans dessinés d'après votre description.
    - q: En quoi Plan diffère-t-il du mode plan de mon agent de code ?
      a: Plan fonctionne avec le mode plan de votre agent et montre son plan sous forme d'écrans. Donnez à `/visual-plan` un plan Claude Code, Codex ou Markdown déjà rédigé par votre agent, et Plan le transforme en écrans, prêts à recevoir des commentaires épinglés à l'endroit exact.
