how_to:
  heading: Comment créer un prototype de landing page avec l'IA
  steps:
    - title: Décrivez votre lancement
      body: "Sur l'écran d'accueil de Design, collez votre brief de lancement dans la zone **Nouveau design** : [l'offre, la cible et l'appel à l'action](https://www.agent-native.com/articles/how-do-you-build-a-landing-page-with-ai/). Ou joignez le brief en fichier, et choisissez le design system de votre marque sous la zone."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8d189f62f944b3d935b058b826150b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8db8cda1abfe476f954bfa5bc50a7b6d
        alt: Gros plan sur la zone Nouveau design de l'accueil de Design. Un brief de lancement pour les paiements le jour même de Ledgerlane est saisi, le PDF du brief est joint et le design system Ledgerlane Brand est choisi.
    - title: Comparez plusieurs versions
      body: Demandez à l'agent « trois versions ». Chacune apparaît comme un écran à part, côte à côte sur le tableau. Choisissez-en une dans le chat, et l'agent en fait la page complète et retire les autres.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F45d7dcdb0a2d473e82e516e2419e21f0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe7aac725b27c4046b57faf5e69a2abf2
        alt: Trois versions de la page de lancement des paiements le jour même, Product-first, Editorial et Proof-led, côte à côte sur le tableau. Le chat de l'agent demande laquelle construire, avec un bouton pour chacune.
    - title: Exportez le HTML de la page
      body: Dans le menu de l'éditeur, choisissez **Fichier**, puis **Exporter**. **Télécharger HTML** vous donne un fichier unique qui s'ouvre dans n'importe quel navigateur. **Copier le prompt de l'agent** donne à un agent de code ce qu'il faut pour intégrer la page à votre site.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F171cf01db5ca44ee8d31ebb6f98a73b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd2640c796dc44746ae1c8a622ec49bdc
        alt: Gros plan sur le menu de l'éditeur avec Fichier et Exporter ouverts au-dessus de la page de lancement Product-first. Les options comprennent Télécharger HTML, Télécharger ZIP, Télécharger pour Figma (SVG) et Copier le prompt de l'agent.
features:
  heading: Tout ce qu'il faut pour concevoir votre page de lancement
  items:
    - title: Du brief à la landing page
      body: L'agent part des affirmations de votre brief au lieu d'en inventer. Quand le brief laisse un choix ouvert, il pose la question ou dit ce qu'il a supposé.
    - title: Édition par IA et visuelle
      body: Changez vous-même un titre, une couleur ou un espacement, ou faites retravailler une section par l'agent. Vous modifiez la même page.
    - title: Des versions côte à côte
      body: Chaque version a son style et sa mise en page mobile, pour comparer de vraies pistes en équipe avant toute mise en ligne.
    - title: Chaque lancement à votre marque
      body: Créez une fois un design system depuis Figma, votre site ou votre code. Chaque page de lancement reprend vos couleurs, polices et styles.
    - title: Des retours épinglés sur la page
      body: "Les relecteurs commentent le titre ou le bouton exact. Envoyez un commentaire à l'agent : il le traite ou vous demande de trancher."
    - title: Passage au code pour votre développeur
      body: Le prompt de l'agent contient vos design tokens, les fichiers de la page et les instructions pour qu'un agent de code l'intègre à votre site.
