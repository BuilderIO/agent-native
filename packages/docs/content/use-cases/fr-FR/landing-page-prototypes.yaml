faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Agent-Native Design est-il gratuit ?
      a: Oui, Agent-Native Design est gratuit et open source. Créer une page nécessite une connexion IA, via les crédits IA Builder.io ou votre propre clé IA, l'usage de l'IA n'est donc pas illimité. Design est en alpha, attendez-vous à des changements au fil de son évolution.
    - q: Design publie-t-il ou héberge-t-il ma landing page ?
      a: Non. Design crée la landing page et l'exporte, et vous la déployez avec vos outils habituels. Téléchargez le HTML ou un ZIP des fichiers, ou copiez un prompt que votre agent de code utilise pour ajouter la page à votre site.
    - q: Puis-je utiliser ma propre marque ?
      a: Oui. Créez un design system depuis un fichier Figma, votre site, un repo GitHub ou des fichiers importés, et choisissez-le au démarrage d'une page. L'agent garde ses couleurs, polices et styles sur chaque version qu'il crée.
    - q: Puis-je modifier la landing page après sa création par l'IA ?
      a: Oui. Changez textes, couleurs, espacements et mise en page à la main sur la page, ou demandez à l'agent de changer une section. Vous pouvez restaurer une version antérieure depuis **Historique des versions** à tout moment.
    - q: Qu'est-ce que j'obtiens en exportant la landing page ?
      a: "**Télécharger HTML** donne un fichier unique qui s'ouvre dans n'importe quel navigateur et charge ses styles via Internet. **Télécharger ZIP** contient tous les fichiers de la page, et **Télécharger pour Figma (SVG)** donne des calques modifiables dans Figma. La documentation liste [toutes les options d'export](https://www.agent-native.com/docs/template-design-features/#export)."
    - q: En quoi Design diffère-t-il d'un chatbot à qui l'on demande une landing page ?
      a: "Un chatbot vous donne du code à coller quelque part avant de voir la page. Dans Design, l'agent construit la page dans un éditeur que vous voyez et où vous cliquez, en plusieurs versions. Vous la modifiez à la main ou en le demandant, sur la même page. C'est une [application agentique](https://www.agent-native.com/articles/what-is-an-agent-native-app/) : l'intelligence d'un agent, l'intuitivité d'une application."
