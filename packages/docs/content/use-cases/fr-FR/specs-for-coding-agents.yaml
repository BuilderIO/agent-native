faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Agent-Native Content est-il gratuit ?
      a: Oui, Agent-Native Content est gratuit et open source. Votre agent de code lit et modifie la spec avec son propre modèle, ce qui compte dans l'usage de votre agent. L'agent intégré de Content fonctionne avec les crédits Builder.io ou votre propre clé de modèle. Content est en alpha, attendez-vous à des changements.
    - q: Quels agents de code peuvent lire ma spec ?
      a: Claude Code et Codex ouvrent la page depuis **Partager** et vous demandent de vous connecter une fois. Cursor et GitHub Copilot dans VS Code y ajoutent Content en un clic. Claude Cowork, Goose et OpenCode se connectent depuis votre terminal, et tout client MCP avec connexion peut [se connecter à Content par son URL](https://www.agent-native.com/docs/external-agents/#private-content-links). Chaque agent ne voit que ce que votre compte peut voir.
    - q: En quoi est-ce différent d'un fichier de spec dans mon repo ?
      a: Un fichier de spec dans votre repo est une copie que seules les personnes qui travaillent dans le code ont tendance à modifier. Dans Content, votre équipe rédige et commente la page même que lit votre agent de code, et les changements de l'agent arrivent sous forme de suggestions. Si vous voulez aussi du Markdown dans le repo, Content [se synchronise avec un dossier local](https://www.agent-native.com/docs/template-content-sync/).
    - q: Mon agent de code peut-il modifier la spec ?
      a: Oui, avec les accès de votre compte. Demandez-lui de suggérer des modifications, et la page reste inchangée tant que vous ne les acceptez pas une par une. Il peut aussi modifier la page directement, mais si la page a changé depuis sa lecture, Content refuse la modification. L'[historique des versions](https://www.agent-native.com/docs/template-content-editing/) conserve les versions antérieures.
    - q: Puis-je garder mes specs dans mon repo ?
      a: Oui. Connectez un [dossier Markdown ou MDX local](https://www.agent-native.com/docs/template-content-local-files/) dans Content et récupérez, vérifiez ou poussez les changements, ou lancez Content depuis votre repo en une commande. Les conflits vous sont présentés pour relecture. Le navigateur ne peut pas lire seul les fichiers locaux, donc il faut une application Content locale ou Agent-Native Desktop.
