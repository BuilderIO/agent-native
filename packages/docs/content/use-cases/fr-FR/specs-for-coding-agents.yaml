how_to:
  heading: Comment rédiger une spec pour votre agent de code
  steps:
    - title: Rédigez la spec avec l'agent
      body: Cliquez sur **+** dans la barre latérale, choisissez **Page** et collez vos notes, ou demandez à [l'agent intégré de Content](https://www.agent-native.com/docs/template-content/) de « rédiger un PRD pour une nouvelle fonctionnalité » à partir d'elles. Modifiez-la à la main, ou sélectionnez une section et demandez une réécriture.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2f4dd334ddfa4ec5bd74e67315414e8b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F15247dff32574395a608e454b510e22b
        alt: Le chat de l'agent demande une spec d'invitations d'équipe à partir de notes de réunion. La réponse de l'agent liste les sections rédigées, à côté de la nouvelle page.
    - title: Ouvrez-la dans votre agent de code
      body: Dans **Partager**, ouvrez **Agents** et choisissez **Ouvrir dans Claude Code** ou **Ouvrir dans Codex**. Votre agent lit la page, ou vous demande d'abord de connecter Content. Pour Cursor ou VS Code, ajoutez Content, cliquez sur **Copier les instructions pour l'agent** et collez-les.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fa052d84a44fb4e6ead8b69535f25c726
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fc574e414836749119ad937c14623d14e
        alt: "Gros plan sur l'onglet Agents du menu Partager : Copier les instructions pour l'agent, Ouvrir dans Claude, Ouvrir dans Claude Code et Ouvrir dans Codex. En dessous, Connecter Content propose Add to Cursor, Add to VS Code et Autres agents."
    - title: Tenez la spec à jour
      body: Quand le développement tranche une question ouverte, demandez à votre agent de code de proposer la modification sur la page. Chaque suggestion indique la raison de l'agent. Cliquez sur la coche pour l'accepter, ou sur le X pour la refuser.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F156092664ebc424bb86899f876b88a97
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0c0108d3427d4641b5c3a2b266e8c4aa
        alt: Gros plan sur la section Open questions de la spec avec une modification suggérée par l'agent de code, marquée Agent, avec sa raison et les boutons Accepter (coche) et Refuser (X).
features:
  heading: Tout ce qu'il faut pour rédiger des specs pour votre agent de code
  items:
    - title: Des retours en commentaires
      body: Demandez à l'agent de relire votre spec, et il commente les points faibles au lieu de réécrire votre texte.
    - title: Une page par fonctionnalité
      body: Rangez recherches, notes d'API et décisions sous chaque spec, et retrouvez-les en cherchant titres et texte.
    - title: Un tableau de specs
      body: Rangez vos specs en collection avec champs responsable et statut, en table ou en tableau, chaque ligne ouvrant sa page.
    - title: Des notes pour votre agent
      body: Indiquez dans la description de la page quelles sections sont figées, et chaque agent qui lit la spec le lit aussi.
    - title: Lit les modifications non enregistrées
      body: Votre agent de code voit les modifications encore ouvertes dans votre éditeur, donc la page telle qu'elle est.
    - title: Relisez en équipe
      body: Commentez un passage, @mentionnez un collègue, répondez en fil. L'historique des versions restaure une spec antérieure.
