template: v2
slug: specs-for-coding-agents
app: content
title: Rédigez des specs que votre agent de code lit
seo_title: Specs pour Claude Code, Codex et Cursor
meta_description: Agent-Native Content garde votre spec sur une page que Claude Code, Codex ou Cursor lit via MCP, pour coder depuis la version que modifie votre équipe.
updated: 2026-10-27
hero:
  body: Agent-Native Content fait de vos notes une spec partagée par vous, votre équipe et votre agent de code. Claude Code, Codex ou Cursor la lit en direct et suggère des changements à valider.
  button:
    label: Rédigez une spec
    url: https://content.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd7f1bf8fa6054abcafa30bd60751ae40
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F93c61e2bc6ba476a938b13934f237b0c
