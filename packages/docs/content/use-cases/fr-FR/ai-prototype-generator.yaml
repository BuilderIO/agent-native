how_to:
  heading: Comment transformer un brief en prototype avec l'IA
  steps:
    - title: Décrivez l'écran dont vous avez besoin
      body: "Sur l'écran d'accueil de Design, collez votre brief dans la zone de prompt : à qui il s'adresse, l'écran ou le parcours, et ce qu'il doit faire. Demandez trois pistes. S'il manque quelque chose d'important, Design vous pose d'abord la question."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ef31fb673e2437fb4dd6ed256a7ba9d
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8209bd4f55d7432c94e05172c5475f17
        alt: Gros plan sur la zone de prompt de l'accueil de Design, avec un court brief pour le parcours d'onboarding d'une app de notes de frais, qui se termine par « Show me three directions ».
    - title: Choisissez la piste qui vous plaît
      body: Design place trois pistes côte à côte sur le canevas, chacune un écran fonctionnel dans son propre style. Essayez chacune en mode **Interagir**, choisissez-en une sous **Choisir une direction**, et l'agent construit le reste.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F137893c57370435d94967b9d5bc6a82a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fda7cdd9a2f3e42b58f44efec2b950fc9
        alt: Le canevas avec les trois pistes d'onboarding côte à côte, et le chat de l'agent affichant Choisir une direction avec un bouton pour chaque piste.
    - title: Affinez-le avec votre équipe
      body: Modifiez textes, espacements et couleurs dans l'onglet **Conception**, ou sélectionnez un élément et demandez à l'agent. Quand un collègue épingle un commentaire, cliquez sur **Envoyer à l'agent** et l'agent fait la modification.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F406b66f9b62e49c09f697f5d08599b5e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F566ca2f3c44f439aac2c5307c72aa572
        alt: L'écran d'onboarding choisi avec le commentaire d'un collègue épinglé sur l'étape d'invitation, et le fil de commentaires ouvert dans l'onglet Commentaires avec le bouton Envoyer à l'agent.
features:
  heading: Tout ce qu'il faut pour passer du brief au prototype
  items:
    - title: Cliquable dès le départ
      body: La piste choisie devient du HTML interactif, en cadres desktop et mobile. **Aperçu de Design** l'ouvre dans un onglet du navigateur.
    - title: Fidèle aux mots de votre brief
      body: L'agent reprend vos termes et vos affirmations. Quand le brief omet un choix important, il vous pose la question ou annonce son hypothèse.
    - title: Vérifié avant d'être prêt
      body: L'agent fait sa propre vérification d'accessibilité et visuelle sur un prototype avant de vous dire que le design est prêt.
    - title: Des prototypes à votre marque
      body: Créez un design system depuis Figma, votre site ou un repo GitHub, et vos nouveaux prototypes démarrent avec vos couleurs et polices.
    - title: Des retours que l'agent applique
      body: Un commentaire reste épinglé à son élément. L'agent modifie cet endroit, vérifie le résultat, puis clôt le fil ou vous demande de trancher.
    - title: Passez la main aux agents de code
      body: Exportez le HTML ou un ZIP, ou copiez un prompt prêt à l'emploi qui donne à votre agent de code les fichiers et design tokens.
