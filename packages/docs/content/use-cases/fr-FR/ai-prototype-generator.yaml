faqs:
  heading: Des questions ? Nous avons les réponses
  items:
    - q: Agent-Native Design est-il gratuit ?
      a: Oui, Agent-Native Design est gratuit et open source. L'agent a besoin d'une connexion IA, via Builder.io ou votre propre clé IA. Design est en alpha, attendez-vous à des changements au fil de son évolution.
    - q: Puis-je partir de mon PRD ou de mon brief produit ?
      a: Oui. Collez le brief, ou la partie utile de votre document d'exigences produit (PRD), dans la zone de prompt, et demandez des pistes si vous voulez des options. L'agent garde vos termes et vos affirmations exactes, et si le brief omet un choix qui change le design, il pose la question ou annonce son hypothèse. Voici [ce qu'il faut mettre dans un brief design](https://www.agent-native.com/articles/how-to-turn-a-design-brief-into-a-prototype-with-ai/).
    - q: Puis-je cliquer dans le prototype ?
      a: Oui. Chaque écran est du vrai HTML avec des interactions qui fonctionnent, et la piste choisie reçoit par défaut des cadres desktop et mobile. Utilisez le mode **Interagir** pour l'essayer sur le canevas, ou **Aperçu de Design** pour ouvrir l'écran dans un nouvel onglet.
    - q: Puis-je utiliser mon propre design system ou mes maquettes Figma ?
      a: Oui. Un [design system](https://www.agent-native.com/docs/template-design-features/) peut venir d'un fichier Figma, de votre site, d'un repo GitHub, d'un fichier design.md ou de notes, et les nouveaux designs le suivent. Vous pouvez aussi importer une frame Figma comme écran modifiable, et Design liste ce qu'il n'a pas pu reproduire exactement.
    - q: Le prototype est-il du code de production ?
      a: Non. Le prototype est un point de départ, et la logique applicative, les intégrations, les tests et le déploiement restent à construire. Exportez le HTML ou un ZIP des fichiers, ou utilisez **Copier le prompt de l'agent** pour donner à un agent de code les fichiers, les design tokens et un prompt prêt à l'emploi. Claude Code et Codex peuvent aussi [ouvrir les designs via le serveur MCP de Design](https://www.agent-native.com/docs/template-design-integrations/).
    - q: En quoi Design diffère-t-il d'un chatbot à qui l'on demande une interface ?
      a: "Dans Design, l'agent construit le prototype sur un canevas où vous cliquez, comparez les pistes et modifiez, et les commentaires de votre équipe vont droit à l'agent. Avec un chatbot, le résultat reste dans la conversation. C'est ce qui fait de Design une [application agentique](https://www.agent-native.com/articles/what-is-an-agent-native-app/) : l'intelligence d'un agent, l'intuitivité d'une application."
