faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Plan free?
      a: Yes, Agent-Native Plan is free and open source. Each plan runs as a session of your coding agent, on the model you choose. That uses your agent's tokens, and a bigger plan uses more. Plan is in alpha, so expect changes.
    - q: Which coding agents does Plan work with?
      a: Claude Code and Codex have plugin installs. One install command also sets up Plan in Cursor, OpenCode, GitHub Copilot in VS Code and Claude Cowork. Any other MCP host, such as Cline or Goose, can add Plan's connector by its URL. You review every plan in your browser.
    - q: How is Plan different from my coding agent's plan mode?
      a: Plan mode in Claude Code, Codex, Cursor or OpenCode gives you the plan as text in the chat. Plan turns that plan, or one from a Markdown file, into a page with diagrams, file trees and annotated code. There you comment on exact parts, answer the agent's questions and bring in a teammate.
    - q: Does the agent change my code while it plans?
      a: No. While it writes or revises the plan, Plan's instructions keep the agent to reading your code. It starts editing after you approve the plan, and it re-reads the approved plan before major steps.
    - q: Can a teammate review a plan without an account?
      a: Partly. Anyone you share the link with can open and edit the plan as a guest. Leaving comments, saving and sharing need an Agent-Native account, so a teammate who wants to comment signs in first.
    - q: Can I keep plans on my own machine?
      a: Yes. [Local-files mode](https://www.agent-native.com/docs/template-plan-local-and-desktop/) keeps a plan as MDX files on your computer, so its content never reaches the hosted app. In exchange, you can't share a local plan or comment on it in the browser, and its link opens only on your machine. Local-files mode doesn't change where your coding agent's AI model runs.
