slug: see-what-your-coding-agent-plans
job_id: job-agent-plan-review
app: plans
audience: technical
title: "See what your AI coding agent plans to build"
subhead: "Review your agent's approach as diagrams, wireframes, and annotated code before it changes anything. Comment on the plan and ask the agent to revise it."
meta_description: "Review your coding agent's plan with diagrams, wireframes, and comments before it writes code. Free, open-source Plans for Claude Code and Codex from Agent-Native."
cta_label: "Plan visually"
secondary_cta_label: "See how it works"
app_cta_url: "https://plan.agent-native.com"
screenshot_alt: "A visual plan in Plans: a canvas of three mobile screens above a written plan with a goal and a comment indicator"
old_way:
  heading: "How most people do it today"
  body: "Your agent writes a plan as a wall of text in a terminal. You skim it, say it looks fine, and find the misunderstanding later, in the diff."
new_way:
  heading: "How it works in Plans"
  steps:
    - "Add the planning skills to your coding agent by running npx @agent-native/core@latest skills add visual-plan. Claude Code and Codex also have plugin installs."
    - "Ask your agent for a visual plan. Review the diagrams, wireframes, and annotated code."
    - "Comment on the text or pin feedback to a visual, then ask the agent to read the comments and revise the plan."
todays_stack:
  heading: "What a visual plan replaces"
  items:
    - text: "**Skimming a long text plan** makes it easy to approve something you didn't read closely."
    - text: "**A separate design doc** captures the approach, but it isn't the plan your agent follows."
    - text: "**A whiteboard sketch** works for you, but your agent can't see it."
  in_app: "Plans works inside your coding agent, like Claude Code or Codex, and your agent still writes the code. Plans adds diagrams, wireframes, and annotated code to its plan, and your agent can read your comments and revise it."
story: null
faqs:
  - q: "What is Agent-Native Plans?"
    a: "Agent-Native Plans is a free and open-source visual planning tool for AI coding agents. Review implementation plans with diagrams, wireframes, annotated code, and comments, or generate visual recaps of completed changes."
  - q: "Can my agent revise a plan based on my comments?"
    a: "Yes. Leave comments on the text or pin them to a visual, then ask your agent to read and address the feedback. It can update the plan and reply to review threads. This supports your review process. It does not automatically stop the agent from changing code."
  - q: "Where are plans saved, and can I share them?"
    a: "Plans are stored in the hosted Plans app by default. A local-files mode keeps them off it, and you can export plans as HTML, Markdown, or JSON. People you share a plan with can open and edit it as guests, without signing up. You sign in to save or share your own plans."
  - q: "Is Plans free?"
    a: "Yes. Plans is free and open source. It's labeled alpha, so expect rough edges."
cta_band_heading: "Review your next plan visually"
cta_band_subhead: "Ask your agent for a plan, then work through the details together."
