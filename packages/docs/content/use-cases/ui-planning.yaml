faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Plan free?
      a: Yes, [Agent-Native Plan](https://www.agent-native.com/docs/template-plan/) is free and open source. Your own coding agent draws the screens, so each plan runs on your agent's model and counts toward its usage, and a longer plan uses more. Plan is in alpha, so expect changes.
    - q: Which coding agents work with Plan?
      a: Agent-Native Plan has plugins for Claude Code and Codex. The install command sets up Cursor, OpenCode and GitHub Copilot the same way, adding `/visual-plan` with a one-time sign-in. Cline, Goose and other agents that support MCP connect by adding Plan's URL.
    - q: How do I change what the plan shows?
      a: "You change a screen by [commenting on it](https://www.agent-native.com/docs/template-plan-review-workflow/), and your coding agent redraws it. Plan doesn't let you drag or resize parts of a screen by hand. The written plan below the screens is different: you can edit its text directly."
    - q: Will the screens match my existing app?
      a: Yes, when the screen is part of an app you already have. Before it draws, your coding agent reads your app's code, its layout and its components, so the plan shows your real sidebar, toolbar and menus. A brand-new app gets screens drawn from your description.
    - q: How is Plan different from my coding agent's plan mode?
      a: Plan works with your agent's plan mode and shows its plan as screens. Give `/visual-plan` a Claude Code, Codex or Markdown plan your agent already wrote, and Plan turns it into the screens it describes, ready for comments pinned on the exact spot.
