old_way:
  heading: "How most people do it today"
  body: "A design brief is a document. People agree with it, and then the first thing anyone can actually react to shows up after someone has interpreted it. Reacting to a brief isn't the same as clicking through something."
new_way:
  heading: "How it works in Design"
  steps:
    - "Paste the brief: the goal, the audience, the constraints, and any brand rules. Link a design system if you have one."
    - "Ask for a few directions. Design shows them side by side on the canvas."
    - "Refine the one you like with visual controls or by asking the agent. Pin comments to elements, then export HTML or a ZIP of the files."
story: null
faqs:
  - q: "What is a design brief?"
    a: "A design brief says what you're making, who it's for, and the limits it has to work within. Design starts from that and produces an interactive HTML prototype."
  - q: "Can I use my own design system?"
    a: "Yes. Link a design system to guide colors, typography, styling, and brand instructions. You can reuse it across designs."
  - q: "Can I edit the prototype after AI generates it?"
    a: "Yes. Adjust text, spacing, and styling with visual controls, or ask the AI agent to change the design. You can compare different directions and keep refining the one you choose."
  - q: "Is the prototype a finished app or page?"
    a: "No. It's a starting point. Application logic, integrations, testing, and deployment still need implementation and review. HTML exports may use external runtime resources."
  - q: "Is Design free?"
    a: "Yes. Design is free and open source. It's labeled alpha, so expect rough edges."
