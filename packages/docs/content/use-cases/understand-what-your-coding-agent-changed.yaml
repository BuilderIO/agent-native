recipes:
  - id: recap-pr
    title: "Recap a pull request before you review it"
    when: "Your agent opened a pull request."
    do: "Run the visual recap command on the pull request."
    prompt: "/visual-recap [pull request link]"
    you_get: "A walkthrough of the behavior that changed, the files it touched, and annotated code."
    how_often: "Every pull request"
  - id: share-recap
    title: "Share the recap with a reviewer"
    when: "Someone else needs to review the change."
    do: "Share the recap. People you share it with can open it in the browser without signing up."
    you_get: "A reviewer who knows where to look first."
    how_often: "Every pull request"
  - id: recap-every-pr
    title: "Recap every pull request automatically"
    when: "You want a recap on every pull request without asking for one."
    do: "Run npx @agent-native/core@latest skills add visual-plan --with-github-action, then npx @agent-native/recap-cli@latest recap setup. Commit the workflow and open a pull request."
    you_get: "A comment on each pull request with a screenshot and a link to the recap. It's informational and never blocks merging."
    how_often: "Every pull request"
