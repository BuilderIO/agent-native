faqs:
  heading: Questions? We have answers
  items:
    - q: Is Agent-Native Clips free?
      a: Yes. Agent-Native Clips is free and open source, and voice dictation is on by default in the desktop app. AI cleanup runs on Builder.io AI credits or your own key, so it isn't unlimited. Clips is in alpha, so expect changes as it grows.
    - q: How is Clips different from the dictation built into my computer?
      a: Built-in dictation needs no setup, but it doesn't keep a [searchable history of what you said](https://www.agent-native.com/articles/what-should-you-look-for-in-dictation-software/). Clips saves every dictation with its original and cleaned text, learns your words and tidies the text with AI. The Clips agent can find what you said and rework it, like turning a ramble into bullet points.
    - q: Will Clips spell my team's jargon right?
      a: Yes, once the terms are in your Dictionary. Add them one per line, or as "term → replacement" for a word it keeps mishearing. You can also import a CSV file of terms. When you fix a word right after Clips pastes it, the desktop app saves that fix to your Dictionary for next time.
    - q: Are my dictations saved, and can I find an old one?
      a: Every dictation is saved with its original and cleaned text, time and length, and shows up on the Dictate page, grouped by day. Press Cmd+K to search them by what you said, or ask the [Clips agent](https://www.agent-native.com/docs/template-clips-agent/), for example "Show me what I dictated yesterday". You can delete any dictation.
    - q: Does my voice leave my computer?
      a: It doesn't have to. Clips Desktop can transcribe on your device, with built-in speech recognition or Local Whisper ([transcription engines in Clips](https://www.agent-native.com/docs/template-clips-features/)). With Builder.io or your own key, Clips sends your dictation to that AI service for cleanup. Each dictation's text is saved to your Clips account.
