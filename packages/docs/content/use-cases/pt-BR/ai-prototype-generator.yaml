faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Design é gratuito?
      a: Sim, o Agent-Native Design é gratuito e open source. O agente precisa de uma conexão de IA, pelo Builder.io ou com sua própria chave de IA. O Design está em alfa, então espere mudanças à medida que ele evolui.
    - q: Posso começar pelo meu PRD ou briefing de produto?
      a: Sim. Cole o briefing, ou a parte relevante do seu documento de requisitos de produto (PRD), na caixa de prompt, e peça direções se quiser opções. O agente mantém seus termos e suas afirmações exatas, e se o briefing deixar de fora uma escolha que muda o design, ele pergunta ou diz o que presumiu. Veja [o que colocar em um briefing de design](https://www.agent-native.com/articles/how-to-turn-a-design-brief-into-a-prototype-with-ai/).
    - q: Dá para clicar pelo protótipo?
      a: Sim. Cada tela é HTML de verdade, com interações funcionais, e a direção que você escolhe ganha frames de desktop e de celular por padrão. Use o modo **Interagir** para testar no canvas, ou a **Visualização do Design** para abrir a tela em uma nova aba do navegador.
    - q: Posso usar meu próprio design system ou meus designs do Figma?
      a: Sim. Um [design system](https://www.agent-native.com/docs/template-design-features/) pode vir de um arquivo do Figma, do seu site, de um repositório do GitHub, de um arquivo design.md ou de notas, e os novos designs seguem esse sistema. Você também pode importar um frame do Figma como tela editável, e o Design lista tudo o que não conseguiu reproduzir com exatidão.
    - q: O protótipo é código de produção?
      a: Não. O protótipo é um ponto de partida, e a lógica do app, as integrações, os testes e o deploy ainda precisam ser construídos. Exporte HTML ou um ZIP com os arquivos, ou use **Copiar prompt do agente** para passar a um agente de código os arquivos, os design tokens e um prompt pronto. O Claude Code e o Codex também podem [abrir designs pelo servidor MCP do Design](https://www.agent-native.com/docs/template-design-integrations/).
    - q: Qual a diferença entre o Design e pedir uma interface a um chatbot?
      a: "No Design, o agente constrói o protótipo em um canvas onde você clica por ele, compara direções e edita, e os comentários da sua equipe vão direto para o agente. Com um chatbot, o resultado fica na conversa. É isso que faz do Design um [app agêntico](https://www.agent-native.com/articles/what-is-an-agent-native-app/): o cérebro de um agente, a intuitividade de um app."
