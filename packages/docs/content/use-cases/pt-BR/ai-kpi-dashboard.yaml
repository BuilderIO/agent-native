how_to:
  heading: Como montar um dashboard de KPIs com IA
  steps:
    - title: Conecte seus dados de receita e de produto
      body: Na página **Fontes de dados**, cole sua chave secreta do Stripe e depois adicione o HubSpot e a ferramenta de analytics de produto que você usa. Escolha **Testar conexão** no menu de uma fonte para confirmar que o Analytics consegue lê-la.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6ea7e1568d3b4afd9fc6a2a01bc969b0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F78b97b8d077644f28c627377157f1331
        alt: Detalhe do Stripe na página Fontes de dados, marcado como conectado, com a chave secreta configurada e "Connection successful" depois do teste de conexão.
    - title: Descreva o dashboard que você quer
      body: Clique em **Novo painel** e descreva as [métricas de SaaS que você acompanha](https://www.agent-native.com/articles/what-should-a-saas-metrics-dashboard-include/), por exemplo "MRR e churn do Stripe, novos cadastros e ativação do PostHog, mês a mês". O agente pode fazer perguntas antes, depois monta cada painel e abre o dashboard.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fca8b7f3746ca419383e042cc0c142271
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb167e98f0ac049fa8ad4b169e8f77ec9
        alt: Detalhe da caixa de novo dashboard, aberta pela lista de dashboards da barra lateral, com a descrição de um dashboard de KPIs de startup já digitada.
    - title: Pergunte por que um número mudou
      body: Escolha **Conversar sobre o painel** no menu de um gráfico e faça uma pergunta, como "Por que o churn subiu em setembro?". O agente responde com seus dados conectados e adiciona um painel ao dashboard quando você pede.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9b18fbf5a7cd4b4ba65d9efede75538b
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9edee9cd613741e2ba670e414be767c7
        alt: "O painel de churn por mês com o chat do agente ao lado. Perguntado por que o churn subiu em setembro, o agente detalha a alta por plano: o churn do Starter quase dobrou."
features:
  heading: Tudo o que você precisa para acompanhar os KPIs da sua startup
  items:
    - title: Receita, pipeline e uso juntos
      body: O MRR do Stripe, os negócios do HubSpot e os cadastros do PostHog ou do Mixpanel ficam lado a lado em um só dashboard.
    - title: Edite à mão ou peça
      body: Mude um filtro você mesmo ou peça um novo painel ao agente. Os dois vão para o mesmo dashboard, e o histórico restaura qualquer versão anterior.
    - title: A consulta por trás de cada número
      body: Clique em qualquer ponto de um gráfico para ver os registros por trás dele, o SQL que os encontrou e um download em CSV.
    - title: Sua definição de MRR
      body: Escreva como sua empresa conta o MRR ou um usuário ativo na página **Camada semântica**. O agente confere isso antes de escrever uma consulta.
    - title: Privado até você compartilhar
      body: Um dashboard novo é só seu. Compartilhe com um cofundador ou com a empresa toda quando estiver pronto, para ver ou para editar.
    - title: Seus KPIs por e-mail
      body: "Os números chegam até você: receba o dashboard por e-mail toda manhã, no horário que você escolher, para até cinco pessoas."
