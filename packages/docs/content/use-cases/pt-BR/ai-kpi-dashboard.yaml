faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Analytics é gratuito?
      a: Sim, o Agent-Native Analytics é gratuito e open source. O agente roda com créditos de IA do Builder.io ou com sua própria chave de modelo, e cada fonte de dados precisa das próprias credenciais, como uma chave secreta do Stripe. O Analytics está em alfa, então telas e recursos ainda podem mudar.
    - q: De quais ferramentas o Analytics consegue puxar meus KPIs?
      a: O Analytics se conecta ao Stripe, ao HubSpot, ao PostHog, ao Mixpanel, ao Amplitude, ao Google Analytics (GA4), ao BigQuery e a mais de uma dúzia de outras fontes. Você adiciona cada uma na [página Fontes de dados](https://www.agent-native.com/docs/template-analytics-connectors/) com sua própria chave, e um dashboard pode misturar várias fontes.
    - q: Preciso saber SQL para montar um dashboard de KPIs?
      a: Não. Você descreve o dashboard ou faz uma pergunta em português, e o agente escreve o SQL. A consulta fica visível por trás de cada gráfico, então alguém que conhece seus dados pode conferir ou editar.
    - q: Como sei que os números estão certos?
      a: Cada número do dashboard vem de uma consulta que o agente rodou nos seus dados conectados, e você pode abrir a consulta e os registros por trás de qualquer gráfico. Quando o agente não consegue rodar uma consulta, ele marca o número como "Não verificado". Confira alguns números com o Stripe antes de confiar no dashboard.
    - q: Quem pode ver meu dashboard de KPIs?
      a: Só você, até compartilhar. Você pode [compartilhar um dashboard](https://www.agent-native.com/docs/sharing/) com um colega ou com toda a organização como leitor, editor ou administrador. Os filtros que você muda valem só para você; salve uma visualização ou envie o link para compartilhá-los.
    - q: Qual a diferença entre o Analytics e a IA da minha ferramenta de analytics?
      a: "Um assistente de IA dentro de uma ferramenta de analytics trabalha com os dados daquela ferramenta. O Analytics trabalha com o Stripe, seu CRM e seus dados de produto, e o agente monta e edita o dashboard que você vê, então as respostas viram painéis que você guarda. É isso que faz do Analytics um [app agêntico](https://www.agent-native.com/articles/what-is-an-agent-native-app/): o cérebro de um agente, a intuitividade de um app."
