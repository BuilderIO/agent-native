faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Design é gratuito?
      a: Sim, o Agent-Native Design é gratuito e open source. Para criar uma página, é preciso uma conexão de IA, com créditos de IA do Builder.io ou com sua própria chave de IA, então o uso de IA não é ilimitado. O Design está em alfa, então espere mudanças à medida que ele evolui.
    - q: O Design publica ou hospeda minha landing page?
      a: Não. O Design cria a landing page e a exporta, e você publica com as ferramentas que já usa. Baixe o HTML ou um ZIP com os arquivos, ou copie um prompt que seu agente de código usa para adicionar a página ao seu site.
    - q: Posso usar minha própria marca?
      a: Sim. Crie um design system a partir de um arquivo do Figma, do seu site, de um repositório do GitHub ou de arquivos enviados, e escolha-o ao começar uma página. O agente mantém as cores, fontes e estilos em todas as versões que cria.
    - q: Posso editar a landing page depois que a IA a cria?
      a: Sim. Mude textos, cores, espaçamentos e layout à mão na própria página, ou peça ao agente para mudar uma seção. Você pode restaurar uma versão anterior pelo **Histórico de versões** a qualquer momento.
    - q: O que eu recebo quando exporto a landing page?
      a: "**Baixar HTML** gera um único arquivo que abre em qualquer navegador e carrega os estilos pela internet. **Baixar ZIP** traz todos os arquivos da página, e **Baixar para o Figma (SVG)** gera camadas que você pode editar no Figma. A documentação lista [todas as opções de exportação](https://www.agent-native.com/docs/template-design-features/#export)."
    - q: Qual a diferença entre o Design e pedir uma landing page a um chatbot?
      a: "Um chatbot te dá um código para colar em algum lugar antes de você conseguir ver a página. No Design, o agente constrói a página em um editor que você vê e clica, em várias versões. Você muda à mão ou pedindo, na mesma página. Isso é um [app agêntico](https://www.agent-native.com/articles/what-is-an-agent-native-app/): o cérebro de um agente, a intuitividade de um app."
