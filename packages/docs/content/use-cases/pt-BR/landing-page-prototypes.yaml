how_to:
  heading: Como fazer um protótipo de landing page com IA
  steps:
    - title: Descreva seu lançamento
      body: "Na tela inicial do Design, cole o briefing do lançamento na caixa **Novo design**: [a oferta, para quem é e a chamada para ação](https://www.agent-native.com/articles/how-do-you-build-a-landing-page-with-ai/). Ou anexe o briefing como arquivo e escolha o design system da sua marca abaixo da caixa."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe8d189f62f944b3d935b058b826150b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8db8cda1abfe476f954bfa5bc50a7b6d
        alt: Detalhe da caixa Novo design na tela inicial do Design. Um briefing de lançamento dos pagamentos no mesmo dia da Ledgerlane está digitado, o PDF do briefing está anexado e o design system Ledgerlane Brand está selecionado.
    - title: Compare algumas versões
      body: Peça ao agente "três versões". Cada uma aparece como uma tela própria, lado a lado no quadro. Escolha uma no chat, e o agente a transforma na página completa e remove as outras.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F45d7dcdb0a2d473e82e516e2419e21f0
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe7aac725b27c4046b57faf5e69a2abf2
        alt: Três versões da página de lançamento dos pagamentos no mesmo dia, Product-first, Editorial e Proof-led, lado a lado no quadro. O chat do agente pergunta qual delas desenvolver, com um botão para cada uma.
    - title: Exporte o HTML da página
      body: No menu do editor, escolha **Arquivo** e depois **Exportar**. **Baixar HTML** gera um único arquivo que abre em qualquer navegador. **Copiar prompt do agente** dá a um agente de código o que ele precisa para colocar a página no seu site.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F171cf01db5ca44ee8d31ebb6f98a73b3
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd2640c796dc44746ae1c8a622ec49bdc
        alt: Detalhe do menu do editor com Arquivo e Exportar abertos sobre a página de lançamento Product-first. As opções incluem Baixar HTML, Baixar ZIP, Baixar para o Figma (SVG) e Copiar prompt do agente.
features:
  heading: Tudo o que você precisa para criar sua página de lançamento
  items:
    - title: Do briefing à landing page
      body: O agente parte das afirmações do seu briefing, sem inventar novas. Se o briefing deixa uma escolha em aberto, ele pergunta ou diz o que presumiu.
    - title: Edição com IA e visual
      body: Mude um título, uma cor ou o espaçamento você mesmo, ou peça ao agente para refazer uma seção. Vocês dois editam a mesma página.
    - title: Versões lado a lado
      body: Cada versão ganha um visual próprio e um layout para celular, para sua equipe comparar direções reais antes de qualquer coisa ir ao ar.
    - title: Todo lançamento com a sua marca
      body: Crie uma vez um design system a partir do seu Figma, site ou código. Toda nova página de lançamento usa suas cores, fontes e estilos.
    - title: Feedback fixado na página
      body: "Os revisores fixam comentários no título ou no botão exato. Envie um ao agente: ele faz a mudança ou pede que você decida."
    - title: Código pronto para seu desenvolvedor
      body: O prompt do agente leva seus design tokens, os arquivos da página e as instruções de que um agente de código precisa para colocá-la no seu site.
