template: v2
slug: ui-planning
app: plans
title: Planeje novas telas com seu agente de código
seo_title: Planeje a UI com Claude Code, Codex e Cursor
meta_description: Com o Agent-Native Plan, você e seu agente de código planejam uma tela em wireframes no layout real do app, estado por estado. Comente, ele revisa e constrói.
updated: 2026-10-27
hero:
  body: Com o Agent-Native Plan, seu agente de código planeja uma nova tela em wireframes de cada estado, no layout real do seu app. Comente o que deve mudar, e o agente redesenha o plano antes de construir.
  button:
    label: Planeje uma tela
    url: https://plan.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4f78a2d9f380427bb3da0723b14fcbe4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F8547890f69d44a0bb7e9d9d05246850a
    alt: "Um plano para uma nova tela de Invoices no Plan. Três frames esboçados aparecem lado a lado: a lista de faturas, o estado vazio e um erro de pagamento recusado, cada um dentro da barra lateral e da barra de ferramentas do próprio app de cobrança. Um comentário está fixado no filtro de status da lista, e o plano escrito começa logo abaixo."
how_to:
  heading: Como fazer o wireframe de uma tela antes que seu agente de código a construa
  steps:
    - title: Peça a tela ao seu agente
      body: Adicione o Plan ao Claude Code, ao Codex, ao Cursor, ao OpenCode ou ao GitHub Copilot com [um único comando de instalação](https://www.agent-native.com/docs/plan-plugin/), depois digite `/visual-plan` e descreva a tela que você quer. Seu agente de código lê o app, faz o wireframe da tela e responde com o link do plano.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F96c7a6d6f73a42ed96a551c112cb269a
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F60c66f4f9b2442a290e2a258cc70b3f2
        alt: "Detalhe do chat de um agente de código: o pedido /visual-plan para uma tela de Invoices com filtro de status, estado vazio e erro de pagamento recusado. O agente lê cinco arquivos de layout e de componentes do app, cria o plano e responde com o link para revisar."
    - title: Comente o que deve mudar
      body: Abra o plano, clique no ponto exato da tela que está errado e escreva o que deve mudar. Marque o comentário como **Agente** para seu agente de código agir, ou como **Humano** para um colega.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb9adb0ff68324479a0c18c8124a77b2e
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F765ae87885404c408e1f4ee46d15711d
        alt: "Detalhe do frame da lista de faturas com um comentário fixado no filtro de status. A caixa do comentário está marcada como Agente e diz: transforme o filtro de status em um controle segmentado com All, Paid e Overdue."
    - title: Envie seus comentários ao agente
      body: Clique em **Enviar para o agente**, escolha **Copiar para seu agente** e cole o prompt no chat do seu agente. Seu agente de código atualiza o plano e resolve os comentários que corrigiu. Quando a tela estiver certa, peça ao agente para construí-la.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F9263e46c4be445389bfc97bee3a78e74
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5910f3c944e9443aafe166a356c27bff
        alt: "Detalhe do botão Enviar para o agente com 3 comentários em aberto. O menu está aberto com duas opções: Copiar para seu agente e Enviar ao agente integrado."
features:
  heading: Tudo o que você precisa para acertar a tela de primeira
  items:
    - title: Desenhada dentro do seu app real
      body: Seu agente de código lê suas telas e componentes atuais antes de desenhar, então a nova tela mantém a barra lateral, a barra de ferramentas e os menus onde estão.
    - title: Todos os estados da tela
      body: Seu agente desenha um frame para cada estado que importa, como carregando, vazio, erro ou menu aberto, para você ver o que um prompt deixa de fora.
    - title: Comentários no elemento exato
      body: Seu agente de código recebe o botão, a linha ou o card exato de cada comentário, então basta uma nota curta como "transforme isto em um controle segmentado".
    - title: Comentários abertos ficam abertos
      body: Seu agente de código confirma cada mudança antes de resolver um comentário, então o que ele deixou passar continua esperando por você.
    - title: Um protótipo para fluxos de várias etapas
      body: Para um fluxo como onboarding ou checkout, seu agente adiciona um protótipo clicável na aba **Protótipo**, ao lado das telas.
    - title: Revise com sua equipe
      body: Compartilhe o plano por link para que os colegas abram as telas no navegador. Qualquer pessoa com uma conta Agent-Native pode comentar.
