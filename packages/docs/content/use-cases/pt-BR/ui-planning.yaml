faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Plan é gratuito?
      a: Sim, o [Agent-Native Plan](https://www.agent-native.com/docs/template-plan/) é gratuito e open source. Quem desenha as telas é o seu próprio agente de código, então cada plano roda no modelo do seu agente e conta para o uso dele, e um plano mais longo usa mais. O Plan está em alfa, então espere mudanças.
    - q: Quais agentes de código funcionam com o Plan?
      a: O Agent-Native Plan tem plugins para o Claude Code e o Codex. O comando de instalação configura o Cursor, o OpenCode e o GitHub Copilot do mesmo jeito, adicionando o `/visual-plan` com um login único. O Cline, o Goose e outros agentes com suporte a MCP se conectam adicionando a URL do Plan.
    - q: Como eu mudo o que o plano mostra?
      a: "Você muda uma tela [comentando nela](https://www.agent-native.com/docs/template-plan-review-workflow/), e seu agente de código a redesenha. O Plan não deixa você arrastar nem redimensionar partes de uma tela à mão. O plano escrito abaixo das telas é diferente: você pode editar o texto direto."
    - q: As telas vão combinar com o app que eu já tenho?
      a: Sim, quando a tela faz parte de um app que você já tem. Antes de desenhar, seu agente de código lê o código do app, o layout e os componentes, então o plano mostra sua barra lateral, sua barra de ferramentas e seus menus reais. Um app totalmente novo recebe telas desenhadas a partir da sua descrição.
    - q: Qual a diferença entre o Plan e o plan mode do meu agente de código?
      a: O Plan funciona junto com o plan mode do seu agente e mostra o plano como telas. Dê ao `/visual-plan` um plano do Claude Code, do Codex ou em Markdown que seu agente já escreveu, e o Plan o transforma nas telas que ele descreve, prontas para comentários fixados no ponto exato.
