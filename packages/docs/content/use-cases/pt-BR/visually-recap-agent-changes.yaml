faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Plan é gratuito?
      a: Sim, o Agent-Native Plan é gratuito e open source. Cada resumo visual roda uma sessão completa do agente no modelo que você escolher, então mudanças maiores usam mais desse modelo. O Plan está em alfa, então espere mudanças.
    - q: Em quais mudanças vale a pena rodar um resumo visual?
      a: "Rode um resumo visual nas mudanças maiores: as que envolvem vários arquivos ou mexem no schema de dados, em uma API ou na forma como o app se encaixa. Para uma mudança pequena em um só arquivo, ler o diff puro é mais rápido do que esperar um resumo."
    - q: Qual a diferença entre um resumo visual e ler o diff?
      a: "Um diff lista cada linha alterada, arquivo por arquivo. Um resumo visual começa pelo que a mudança faz: as telas alteradas como wireframes, os campos de dados que mudaram e um mapa dos arquivos envolvidos. Depois mostra só os diffs que vale a pena ler, com notas."
    - q: Com quais agentes de código o Plan funciona?
      a: O comando de instalação configura o Plan no Claude Code, no Codex, no Cursor, no OpenCode, no GitHub Copilot no VS Code e no Claude Cowork, e já faz seu login. O Plan também funciona no Cline, no Goose e em qualquer outro agente que se conecte a servidores MCP, pelo conector hospedado.
    - q: Posso ter um resumo em cada pull request?
      a: Sim. A [GitHub Action PR Visual Recap](https://www.agent-native.com/docs/pr-visual-recap/) roda o Claude Code, o Codex ou qualquer modelo compatível com a OpenAI, com sua própria chave de API, a cada push. Ela mantém um único comentário atualizado no pull request, com uma captura de tela do resumo, e nunca bloqueia um merge. Diffs acima de uns 600 KB são cortados.
    - q: Quem pode ver meus resumos?
      a: Por padrão, só quem está conectado à sua organização pode abrir um resumo; deixe-o privado e só você pode. Com a GitHub Action, quem vê o pull request vê a captura de tela do resumo. O [modo de arquivos locais](https://www.agent-native.com/docs/template-plan-local-and-desktop/) mantém o resumo fora do app hospedado, mas o modelo do seu agente continua rodando onde sempre rodou.
