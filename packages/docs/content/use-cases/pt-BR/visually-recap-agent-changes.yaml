hero:
  body: O Agent-Native Plan mostra o que seu agente de código fez com telas de antes e depois, mudanças de dados sinalizadas e um mapa dos arquivos alterados. Se algo estiver errado, comente, e o agente corrige.
  button:
    label: Resuma uma mudança
