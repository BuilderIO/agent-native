how_to:
  heading: Como fazer um resumo visual das mudanças do seu agente
  steps:
    - title: Peça um resumo ao seu agente
      body: Adicione o Plan ao seu agente de código com a [instalação de uma linha](https://www.agent-native.com/docs/template-plan/#install). No chat em que o agente fez a mudança, rode `/visual-recap` e abra o link que ele devolver.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F060c82d850f34b3096f166c04ead386c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F287f076a9ec84124a0afc7fbaeda2ece
        alt: O chat do agente de código com "/visual-recap of everything you changed in this thread" enviado e a resposta do agente com o link do resumo publicado.
    - title: Veja a mudança primeiro em imagens
      body: Comece pelos wireframes de antes e depois, pelas mudanças de dados sinalizadas e pelo mapa dos arquivos alterados. Depois abra **Principais mudanças**, onde cada arquivo importante tem sua própria aba com um diff lado a lado e notas.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff15296c5ef824f5ead19d6e64de1388f
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Faf5572fc8bbd4962972bfc0b24cf2bc0
        alt: Wireframes de antes e depois da página Members, em que a versão depois ganha um botão Invite e um convite pendente. Ao lado, o modelo de dados marca a nova tabela de convites como adicionada e o campo de função dos membros como modificado, de texto para uma lista fixa de funções.
    - title: Envie seus comentários ao agente
      body: Deixe [comentários de revisão](https://www.agent-native.com/docs/template-plan-review-workflow/) em qualquer texto ou ponto de um wireframe. Clique em **Enviar para o agente**, escolha **Copiar para seu agente** e cole o prompt no seu agente de código, que faz as mudanças e resolve seus comentários.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2256a69fdcd542a18a14a292050ff391
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2b4a48126c4f45c39c0b6f0389673387
        alt: Um comentário para o agente, fixado no botão Invite do wireframe depois, pede para mostrá-lo só a administradores. O menu Enviar para o agente está aberto, com Copiar para seu agente e Enviar ao agente integrado.
features:
  heading: Tudo o que você precisa em um resumo visual
  items:
    - title: Telas antes do código
      body: Quando a mudança mexe na interface, o resumo abre com wireframes de antes e depois, para você ver primeiro o que os usuários vão ver.
    - title: Mudanças de dados sinalizadas
      body: Mudanças de schema e de API marcam cada campo como adicionado, alterado, removido ou renomeado, e mostram o tipo antigo ao lado do novo.
    - title: Todo arquivo alterado no mapa
      body: Uma árvore lista cada arquivo que a mudança tocou, com selos de adicionado, modificado, removido ou renomeado e notas sobre o que mudou.
    - title: Diffs principais anotados
      body: De três a oito arquivos principais ganham diffs lado a lado, cada um com um resumo de uma linha e notas nas linhas que merecem atenção.
    - title: Cobre a conversa inteira
      body: Rode `/visual-recap` no chat depois do trabalho, e o resumo cobre tudo o que o agente fez ali, da primeira mudança às últimas correções.
    - title: Revise com sua equipe
      body: "Compartilhe o link do resumo: convidados abrem sem conta e entram para comentar. Exporte como HTML, Markdown ou JSON para guardar uma cópia."
