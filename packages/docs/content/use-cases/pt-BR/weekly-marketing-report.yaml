faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Analytics é gratuito?
      a: Sim, o Agent-Native Analytics é gratuito e open source. Você conecta suas próprias contas do Google Analytics e do HubSpot. Para começar, você escolhe créditos de IA gratuitos do Builder.io ou sua própria chave de modelo de IA para o agente, então o uso de IA tem limites. O Analytics está em alfa, então espere mudanças.
    - q: Quais fontes de dados de marketing posso conectar?
      a: O Agent-Native Analytics se conecta ao Google Analytics (GA4), ao HubSpot, ao DataForSEO para rankings de palavras-chave e volume de busca, e ao X para o engajamento dos posts. Ele também se conecta ao BigQuery, ao Amplitude, ao Mixpanel, ao PostHog e ao Stripe. Cada fonte precisa das próprias credenciais, e o Google Analytics precisa de uma conta de serviço do Google Cloud.
    - q: O Agent-Native Analytics pode enviar o relatório toda segunda?
      a: Ainda não em uma programação semanal. Os [relatórios do dashboard por e-mail](https://www.agent-native.com/docs/template-analytics-dashboards/) saem todo dia, no horário e fuso que você escolher, para até cinco endereços de e-mail, um canal do Slack ou os dois. Antes da reunião de segunda, clique em **Enviar agora** em **Relatórios por e-mail** para enviar o dashboard mais recente.
    - q: Preciso saber SQL?
      a: Não. Você pergunta com suas palavras, e o agente escolhe a fonte e escreve a consulta. Você pode pedir ao agente para mostrar a consulta por trás de qualquer resposta se quiser conferir.
    - q: Posso confiar nos números?
      a: O agente roda uma consulta ao vivo nos seus dados antes de dar um número e marca um valor como "Não verificado" quando nenhuma consulta rodou. Mesmo assim, compare o relatório da primeira semana com o Google Analytics e o HubSpot antes de enviá-lo para a equipe.
    - q: Qual a diferença entre o Agent-Native Analytics e os relatórios do GA4 e do HubSpot?
      a: "O Google Analytics e o HubSpot fazem relatórios cada um dos próprios dados. O Agent-Native Analytics responde a uma pergunta com os dois juntos, com suas palavras, e guarda as respostas em um só dashboard que você ajusta pedindo. Isso é um [app agêntico](https://www.agent-native.com/articles/what-is-an-agent-native-app/): o cérebro de um agente, a intuitividade de um app."
