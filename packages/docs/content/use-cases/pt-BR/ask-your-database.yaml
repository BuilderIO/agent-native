faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Analytics é gratuito?
      a: Sim, o Agent-Native Analytics é gratuito e open source. Use o app hospedado ou rode sua própria cópia. O agente precisa de uma conexão de IA, pelo Builder.io ou pela sua própria chave de modelo, então o uso de IA não é ilimitado. O Analytics está em alfa, então espere mudanças.
    - q: Preciso saber SQL?
      a: Não. Você pergunta em português e o agente escreve o SQL. Talvez alguém que conheça seus dados precise [conectar o BigQuery](https://www.agent-native.com/docs/template-analytics-connectors/) antes. Um admin pode adicionar suas [definições de métricas](https://www.agent-native.com/docs/template-analytics-dashboards/) na página **Camada semântica**, para o agente escolher as tabelas e colunas certas.
    - q: Funciona com Postgres, Supabase ou Neon?
      a: Sim, para Postgres no Supabase ou no Neon. Conecte [via MCP](https://www.agent-native.com/docs/mcp-clients/) pelo menu + do chat e faça sua pergunta no chat. Essas respostas ficam no chat, porque os painéis de dashboard ainda não consultam Postgres. Outros bancos Postgres ainda não podem ser consultados, por isso os passos desta página usam o BigQuery.
    - q: O agente pode alterar meus dados?
      a: No BigQuery, não. O Analytics rejeita ali qualquer consulta do agente que insira, atualize, exclua ou apague dados. A configuração também pede uma conta de serviço com papéis somente leitura, que lê suas tabelas e roda consultas, mas não as altera. Pelo Supabase ou pelo Neon, o agente pode fazer o que você permitir nessa conexão.
    - q: Como sei que uma resposta está certa?
      a: Confira a consulta por trás dela. Peça ao agente para mostrar o SQL ou abra **Ver SQL** em um gráfico do dashboard. Você também pode perguntar quais tabelas e filtros ele usou. O agente marca um número como **Não verificado** quando nenhuma consulta ao vivo foi executada.
    - q: Qual a diferença para perguntar ao ChatGPT sobre um CSV exportado?
      a: "Um assistente de chat responde a partir do arquivo que você exportou, então cada pergunta nova começa com uma nova exportação. O Analytics consulta seu warehouse direto, usa as definições de métricas da sua equipe e guarda num dashboard as respostas de que você vai precisar de novo. Isso é um [app agêntico](https://www.agent-native.com/articles/what-is-an-agent-native-app/): o cérebro de um agente, a intuitividade de um app."
