title: Faça perguntas aos seus dados em português
seo_title: Pergunte ao seu banco de dados sem SQL
meta_description: Pergunte sobre seus dados no BigQuery e o Agent-Native Analytics responde com SQL somente leitura que você confere, e guarda num dashboard as perguntas recorrentes.
updated: 2026-10-27
hero:
  body: O Agent-Native Analytics responde com seus dados do BigQuery e guarda num dashboard as perguntas repetidas. O agente escreve SQL somente leitura que você confere.
  button:
    label: Pergunte aos seus dados
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd1120abfcd1447b9ab48ff98a9b7592d
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2db877a772674ad4af41e7efbb062d50
    alt: O Analytics aberto em Perguntar. O agente responde a uma pergunta sobre os cadastros da semana passada com um gráfico de barras por plano e a tabela da qual fez a contagem. Abaixo, uma pergunta de acompanhamento mostra que o Pro foi o que mais cresceu.
how_to:
  heading: Como fazer perguntas ao seu banco de dados em português
  steps:
    - title: Conecte seu data warehouse
      body: Na página **Fontes de dados**, abra o BigQuery. Envie a chave JSON de uma conta de serviço com os papéis BigQuery Data Viewer e BigQuery Job User, informe o ID do projeto e clique em **Salvar credenciais** e **Testar conexão**.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F62008ebd98594f02b1c0bf3ae565ef49
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb01d428bca15467eb4c04299dd9575b8
        alt: Detalhe do card do BigQuery em Fontes de dados, marcado como conectado, com o ID do projeto e a conta de serviço configurados e "Connection successful".
    - title: Faça sua pergunta em português
      body: "Em **Perguntar**, digite a pergunta como você faria a um colega: \"Quantas contas se cadastraram na semana passada, por plano?\" O agente encontra as tabelas certas, roda a consulta e responde com um gráfico."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F3e9ac5b30a924dab9b09bc76ed24b2de
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F31c48c5ccc9247b792c00474b01f97b0
        alt: Detalhe do chat em Perguntar. O agente pesquisou o schema do BigQuery, rodou uma consulta e respondeu com 723 cadastros e um gráfico de barras por plano.
    - title: Guarde a resposta num dashboard
      body: Peça ao agente para "adicionar isso a um dashboard". Ele monta o painel, confere se o SQL roda e salva o dashboard. O dashboard fica privado até você compartilhar com um colega ou com toda a organização.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F957858f8613241a2b2249d88430b3cc4
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd0111e9f420149fc8a35cad845ad8e2e
        alt: Um novo dashboard de cadastros semanais com o painel de cadastros por plano e um gráfico de cadastros por semana. O chat do agente ao lado diz que os dois painéis foram conferidos no BigQuery.
features:
  heading: Tudo o que você precisa para tirar respostas do seu banco de dados
  items:
    - title: O SQL por trás de cada resposta
      body: Abra **Ver SQL** em qualquer gráfico do dashboard, ou pergunte no chat, para ver a consulta que o agente escreveu e copiá-la para rodar você mesmo.
    - title: As definições de métricas da sua equipe
      body: Um admin escreve o que "ativo" ou "cadastro" significa na página **Camada semântica**. O agente lê isso antes de escrever o SQL.
    - title: Consultas que não alteram dados
      body: No BigQuery, o SQL do agente não consegue inserir, atualizar nem excluir, e ele se conecta por uma conta de serviço que só lê tabelas e roda consultas.
    - title: Dashboards que o agente edita
      body: Peça no chat outro painel, um filtro ou uma divisão por plano, e o agente altera o dashboard para todos com quem você o compartilhou.
    - title: Perguntas que cruzam suas ferramentas
      body: Faça uma única pergunta que misture as tabelas do seu warehouse com a receita do Stripe, os negócios do HubSpot ou os eventos do PostHog.
    - title: O dashboard na sua caixa de entrada
      body: Receba um dashboard por e-mail todo dia, no horário que você escolher, com gráficos e tabelas no próprio e-mail, para até cinco pessoas.
