faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Content é gratuito?
      a: Sim, o Agent-Native Content é gratuito e open source. Seu agente de código lê e edita a spec no próprio modelo, então isso conta para o uso do seu agente. O agente integrado do Content roda com créditos do Builder.io ou com sua própria chave de modelo. O Content está em alfa, então espere mudanças.
    - q: Quais agentes de código conseguem ler minha spec?
      a: O Claude Code e o Codex abrem a página pelo menu **Compartilhar** e pedem que você conecte uma vez. O Cursor e o GitHub Copilot no VS Code adicionam o Content ali com um clique. O Claude Cowork, o Goose e o OpenCode se conectam pelo terminal, e qualquer cliente MCP com login pode [se conectar ao Content pela URL](https://www.agent-native.com/docs/external-agents/#private-content-links). Cada agente vê só o que sua conta pode ver.
    - q: Qual a diferença para um arquivo de spec no meu repositório?
      a: Um arquivo de spec no repositório é uma cópia que normalmente só quem trabalha no código edita. No Content, sua equipe escreve e comenta na mesma página que seu agente de código lê, e as mudanças do agente chegam como sugestões. Se você também quer Markdown no repositório, o Content [sincroniza com uma pasta local](https://www.agent-native.com/docs/template-content-sync/).
    - q: Meu agente de código pode mudar a spec?
      a: Sim, com o acesso que sua conta tem. Peça para ele sugerir edições, e a página fica igual até você aceitar cada uma. Ele também pode editar a página direto, mas se a página mudou depois que o agente a leu, o Content recusa a edição. O [histórico de versões](https://www.agent-native.com/docs/template-content-editing/) guarda as versões anteriores.
    - q: Posso manter minhas specs no meu repositório?
      a: Sim. Conecte uma [pasta local de Markdown ou MDX](https://www.agent-native.com/docs/template-content-local-files/) no Content e puxe, confira ou envie mudanças, ou inicie o Content a partir do seu repositório com um comando. Os conflitos aparecem para você revisar. O navegador não lê arquivos locais sozinho, então isso exige um app local do Content ou o Agent-Native Desktop.
