faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Clips é gratuito?
      a: Sim. O Agent-Native Clips é gratuito e open source, e o ditado por voz vem ativado por padrão no app desktop. A limpeza com IA usa créditos de IA do Builder.io ou sua própria chave, então não é ilimitada. O Clips está em alfa, então espere mudanças conforme ele cresce.
    - q: Qual a diferença entre o Clips e o ditado que já vem no meu computador?
      a: O ditado nativo não exige configuração, mas não guarda um [histórico pesquisável do que você disse](https://www.agent-native.com/articles/what-should-you-look-for-in-dictation-software/). O Clips salva cada ditado com o texto original e o limpo, aprende suas palavras e deixa o texto em ordem com IA. O agente do Clips acha o que você disse e refaz, como transformar um desabafo em tópicos.
    - q: O Clips vai escrever direito o jargão da minha equipe?
      a: Sim, assim que os termos estiverem no seu Dicionário. Adicione um por linha, ou como "termo → substituição" para uma palavra que ele insiste em ouvir errado. Você também pode importar um arquivo CSV de termos. Quando você corrige uma palavra logo depois que o Clips cola, o app desktop salva essa correção no seu Dicionário para a próxima vez.
    - q: Meus ditados ficam salvos, e consigo achar um antigo?
      a: Cada ditado é salvo com o texto original e o limpo, a hora e a duração, e aparece na página Ditar, agrupado por dia. Pressione Cmd+K para pesquisar pelo que você disse, ou pergunte ao [agente do Clips](https://www.agent-native.com/docs/template-clips-agent/), por exemplo "Mostre o que eu ditei ontem". Você pode excluir qualquer ditado.
    - q: Minha voz sai do meu computador?
      a: Não precisa. O Clips Desktop pode transcrever no seu dispositivo, com o reconhecimento de fala nativo ou o Local Whisper ([mecanismos de transcrição no Clips](https://www.agent-native.com/docs/template-clips-features/)). Com o Builder.io ou sua própria chave, o Clips envia seu ditado a esse serviço de IA para a limpeza. O texto de cada ditado é salvo na sua conta do Clips.
