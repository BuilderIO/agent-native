template: v2
slug: ai-dictation
app: clips
title: Dite seus prompts em vez de digitá-los
seo_title: Ditado com IA que digita em qualquer app
meta_description: Use ditado com IA para falar no Claude Code, no Slack ou em um doc e receber texto limpo no cursor. O Agent-Native Clips salva cada ditado para você pesquisar depois.
updated: 2026-10-26
hero:
  body: Seus prompts, tickets e respostas falados viram texto limpo no cursor, do Claude Code ao Slack. O Agent-Native Clips salva cada ditado, e o agente dele refaz um quando você pede.
  button:
    label: Comece a ditar
    url: https://clips.agent-native.com
  image:
