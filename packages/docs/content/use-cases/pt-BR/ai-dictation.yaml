how_to:
  heading: Como usar o ditado com IA
  steps:
    - title: Dite em qualquer app
      body: Instale o Clips Desktop, clique no Claude Code, no Linear ou no Slack e segure seu atalho (Fn por padrão, ou o que você escolher em Configurações) enquanto fala. Solte, e o Clips coloca suas palavras no cursor.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F493f3728ed1246bb841a651e3aa76300
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fb3785ba8ec804690836d94e31ff92e17
        alt: "O chat de um agente de código: um prompt ditado sobre novas tentativas de webhook foi enviado, e o agente fez a mudança. O cursor espera na caixa de mensagem, enquanto a pílula do Clips logo abaixo escuta o próximo prompt, com a onda verde ativa."
    - title: Ensine suas palavras ao Clips
      body: Abra o Dicionário na página Ditar e adicione o nome do seu produto, de bibliotecas e de colegas, ou "termo → substituição" para uma palavra que o Clips insiste em ouvir errado. Importe um arquivo CSV para adicionar uma lista inteira de uma vez.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F855c88996488417e8dc3a532a0fd21a6
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff4e9c0557a1344f6a55e7e9c4356a5ab
        alt: O painel Dicionário do Clips, com Adicionar termos, Importar e Exportar CSV. Abaixo estão termos como Agent-Native, "web hooks → webhooks" e "kube control → kubectl".
    - title: Encontre um ditado antigo
      body: Pressione Cmd+K no Clips e digite uma palavra que você disse, e os ditados correspondentes aparecem com o app em que você os disse. Escolha um para abri-lo na página Ditar.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F5e344071b49f4e51ae5eef2708c46605
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F13f558e09094404f975350ad0c359acc
        alt: 'O menu de busca do Clips com "webhook" digitado, listando dois ditados antigos em Ditar: um prompt ditado no Cursor e uma mensagem ditada no Slack.'
features:
  heading: Tudo o que você precisa para ditar em vez de digitar
  items:
    - title: Sua área de transferência fica intacta
      body: O Clips cola nos apps e devolve o que estava na sua área de transferência, então o link que você copiou continua lá. Em terminais, ele digita.
    - title: Limpeza com IA que você pode desfazer
      body: O Clips corrige palavras mal ouvidas, vírgulas e maiúsculas, automaticamente ou com um clique. O original fica guardado.
    - title: Aprende com suas correções
      body: Corrija uma palavra mal ouvida logo depois que o Clips colar, e o app desktop adiciona essa correção ao seu Dicionário, para o próximo ditado acertar.
    - title: Mãos livres para prompts longos
      body: Toque duas vezes no atalho para o Clips seguir ouvindo enquanto você pensa, e de novo para parar. Esc descarta.
    - title: Cole de novo
      body: Pressione Cmd+Ctrl+V para colar seu último ditado de novo em outro campo de texto, útil quando o cursor estava no lugar errado.
    - title: Pergunte ao agente sobre ele
      body: Pergunte "O que eu disse sobre o orçamento do 3º trimestre?" ou "Transforme esse desabafo em tópicos", e o agente trabalha com o seu histórico.
