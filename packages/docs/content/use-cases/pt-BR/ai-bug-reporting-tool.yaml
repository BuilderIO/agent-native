faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Clips é gratuito?
      a: Sim. O Agent-Native Clips é gratuito e open source, inclusive a extensão do Chrome. Títulos, resumos e a limpeza da transcrição usam por padrão os créditos de IA do Builder.io, então o uso de IA não é ilimitado, e as gravações precisam de um lugar para guardar o vídeo. O Clips está em alfa, então espere mudanças conforme ele cresce.
    - q: O que o Clips captura do meu navegador?
      a: A extensão do Clips para Chrome captura [mensagens do console, erros de JavaScript e requisições de rede](https://www.agent-native.com/docs/template-clips-features/#chrome-extension-browser-logs) de até cinco abas, voltando até 30 segundos antes de você apertar gravar. Cada requisição guarda o endereço, o status, o tempo e se falhou. Quem edita vê tudo na aba Depuração do clipe, e os agentes recebem pelo link.
    - q: O Clips grava senhas ou dados privados?
      a: O Clips nunca salva corpos de requisição ou de resposta, cabeçalhos, cookies nem o texto que você digita, e apaga valores que parecem tokens, senhas ou chaves. Você pode desligar os logs de desenvolvedor nas configurações da extensão. As novas gravações são públicas por link, então defina o relatório de bug como privado ou restrito à sua organização quando ele mostrar dados internos.
    - q: Como entrego uma gravação de bug ao Claude Code, ao Cursor ou ao Codex?
      a: Cole o link do clipe no Claude Code, no Cursor ou no Codex, e o agente [lê a transcrição, os quadros e os logs do navegador](https://www.agent-native.com/docs/template-clips-integrations/#agent-readable-clips) sem baixar o vídeo. Para um clipe privado, clique em Copiar prompt para agente na aba Agentes do menu Compartilhar, que dá ao agente um link válido por duas horas. Essa aba também abre o clipe no Claude Code ou no Codex.
    - q: O Clips captura logs em outros navegadores ou no app desktop?
      a: Não. Os logs de console e de rede vêm apenas da extensão do Clips para Chrome. O Clips Desktop e o app web ainda gravam sua tela, sua câmera e sua voz, com transcrição e resumo, mas a gravação não terá os logs do navegador.
    - q: O Clips é um bug tracker como o Jira?
      a: "Não. O Clips faz [um relatório de bug que um engenheiro consegue usar](https://www.agent-native.com/articles/how-to-write-a-bug-report/), e o seu tracker guarda: cole o link no Jira, no GitHub, no Linear ou no Slack. Seu agente de código ou o [agente do Clips](https://www.agent-native.com/docs/template-clips-agent/) lê a própria gravação e os logs dela. É isso que faz do Clips um [app agêntico](https://www.agent-native.com/articles/what-is-an-agent-native-app/): o cérebro de um agente, a intuitividade de um app."
