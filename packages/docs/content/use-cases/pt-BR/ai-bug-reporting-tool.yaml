template: v2
slug: ai-bug-reporting-tool
app: clips
title: Grave bugs com os logs de console e de rede
seo_title: Relatório de bugs com IA e logs de console
meta_description: Mostre o bug no Chrome, e o Agent-Native Clips transforma sua gravação em um link com os erros e as requisições com falha da página para seu engenheiro ou agente de código.
updated: 2026-10-27
hero:
  body: O Agent-Native Clips transforma a gravação do bug em um link para seu engenheiro ou agente de código. Mostre o bug no Chrome, e os erros e requisições com falha da página vão junto.
  button:
    label: Grave um bug
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe36fd7fdff9b49bca2c6787f302964c6
