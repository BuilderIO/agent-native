    alt: A gravação de um bug aberta no Clips, pausada em uma página de checkout que mostra uma mensagem de erro. A aba Depuração, ao lado do vídeo, lista um erro vermelho no console e uma requisição com falha e status 500.
how_to:
  heading: Como relatar um bug com IA
  steps:
    - title: Comece a gravar pelo Chrome
      body: "Clique na extensão do Clips para Chrome na sua barra de ferramentas e escolha a fonte: uma aba do navegador, uma janela ou a tela inteira. Ligue ou desligue a câmera e o microfone e clique em Start recording."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6996593713c74108967e120111378c14
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff7991811f7a346e0a99cf9fe81496e34
        alt: Detalhe do pop-up da extensão do Clips sobre um app web, com Browser tab escolhida como fonte, a câmera e o microfone ligados e o botão Start recording.
    - title: Mostre o bug e explique
      body: Clique pelos passos que quebram e diga o que você esperava que acontecesse. Enquanto você grava, a extensão salva os erros da página e as requisições que ela enviou, os detalhes que um engenheiro teria que garimpar nas ferramentas de desenvolvedor do Chrome.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe01ffb73c62c427b8077f05657fdeb47
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff895d85667344971baec96eb0b2ec956
        alt: Os controles de gravação do Clips e o balão da câmera sobre a página de checkout de um app web, onde aparece a mensagem "Algo deu errado".
    - title: Compartilhe um link
      body: Ao parar, o Clips copia o link da gravação para você. Cole em um ticket, em um chat ou no seu agente de código. A aba Agentes do menu Compartilhar também abre a gravação direto no Claude, no Claude Code ou no Codex.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F10933b64225545e1b5ecd666f5803832
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2894036362f7409d8a4961536719b399
        alt: Detalhe do menu Compartilhar do Clips na aba Agentes, com Copiar prompt para agente e os botões Abrir no Claude, Abrir no Claude Code e Abrir no Codex.
features:
  heading: Tudo o que você precisa para relatar um bug
  items:
    - title: Feito para o seu agente de código
      body: Cole o link no Claude Code, no Cursor ou no Codex. O agente lê a transcrição, os quadros e os logs, sem baixar o vídeo.
    - title: Logs de console e de rede
      body: O Clips salva mensagens do console, erros e requisições de até cinco abas, com o status e o tempo de cada requisição e se ela falhou.
    - title: Os 30 segundos anteriores
      body: O Clips volta até 30 segundos antes de você apertar gravar, então um erro ocorrido durante o carregamento da página ainda entra no relatório.
    - title: Segredos ficam de fora
      body: O Clips nunca salva corpos de requisição, cabeçalhos, cookies nem o que você digita, e apaga valores que parecem tokens ou senhas.
    - title: Vá direto ao erro
      body: Na aba Depuração do clipe, clique no horário ao lado de um erro ou de uma requisição com falha, e o vídeo pula para esse momento.
    - title: Pesquise todos os relatórios de bug
      body: Encontre qualquer relatório de bug pelo que foi dito nele, ou pergunte ao agente do Clips sobre todas as gravações da sua biblioteca.
