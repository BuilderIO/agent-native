faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Analytics é gratuito?
      a: "Sim, o Agent-Native Analytics é gratuito e open source. Use o app hospedado ou [rode sua própria cópia](https://www.agent-native.com/docs/template-analytics/). Os dados são seus: seus próprios eventos ou as ferramentas que você conectar. O Analytics está em alfa, então espere mudanças."
    - q: Preciso saber SQL?
      a: Não. Pergunte em português, e o agente escreve e roda o SQL, depois responde com um gráfico, uma tabela ou um número. Peça para ver a consulta quando quiser conferir. Alguém que conhece seus dados pode precisar [conectar suas fontes](https://www.agent-native.com/docs/template-analytics-connectors/) antes.
    - q: De onde vêm os replays de sessão?
      a: "Do seu próprio app web. Crie uma chave pública em **Fontes de dados** e adicione ao app o pequeno snippet de rastreamento da página **Sessões**, com o replay de sessão ativado. Conecte um armazenamento para as gravações: o Builder.io ou seu próprio bucket S3. Por padrão, os [replays](https://www.agent-native.com/docs/template-analytics-monitoring-and-sessions/) gravam só usuários logados."
    - q: O que um replay de sessão grava?
      a: Um replay reproduz a página, os cliques e a rolagem, a saída do console e as requisições de rede. O que é digitado fica mascarado por padrão, e campos de senha ou de dados de cartão nunca são capturados. Para ocultar qualquer outra coisa, adicione uma classe àquela parte da página.
    - q: Posso usar meus dados do PostHog, do Amplitude ou do Mixpanel?
      a: Sim. Conecte-os em **Fontes de dados** e pergunte sobre os eventos que você rastreia ali. O agente consulta cada ferramenta por você. Os replays de sessão vêm só do rastreamento do próprio Analytics, então adicione-o ao seu app para assistir às pessoas que pararam.
    - q: Qual a diferença entre o Analytics e a IA da minha ferramenta de analytics?
      a: "A IA de uma ferramenta de analytics trabalha com os dados daquela ferramenta. O agente do Analytics trabalha com todas as fontes que você conecta, encontra os replays exatamente de quem parou e explica qualquer um deles ou o entrega ao seu agente de código. Ele também é open source. Isso é um [app agêntico](https://www.agent-native.com/articles/what-is-an-agent-native-app/): o cérebro de um agente, a intuitividade de um app."
