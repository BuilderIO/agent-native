how_to:
  heading: Como fazer um pitch deck com IA
  steps:
    - title: Comece pelo seu próprio material
      body: "Na tela inicial do Slides, descreva o deck que você quer: sua empresa, para quem é e qual deve ser o tamanho. Anexe as notas, docs ou materiais de referência que tiver e crie o deck."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F12aade25b35944b396142acc3b8ff40c
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff68c26a237fc45909db278af5b701e61
        alt: "Detalhe da caixa de prompt do Slides: a descrição do pitch de um fundador digitada, um arquivo de notas anexado e as sugestões logo abaixo."
    - title: Veja o agente montar cada slide
      body: O agente do Slides primeiro planeja um roteiro para o seu pitch deck. Depois, monta cada slide no editor enquanto você acompanha. Se não conseguir ler um PDF ou um site, ele avisa.
