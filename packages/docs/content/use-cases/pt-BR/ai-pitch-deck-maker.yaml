features:
  heading: Tudo o que você precisa para montar e apresentar seu deck
  items:
    - title: Pitch decks a partir das suas notas
      body: Comece com um prompt, suas notas, um doc ou seu último deck. Conte ao agente sobre sua empresa e sua rodada, e ele monta o deck.
    - title: Edição com IA e visual
      body: Edite o texto e o layout no próprio slide, ou selecione uma linha e peça ao agente. Só muda o que você pediu.
    - title: Sua marca em todos os slides
      body: Salve suas cores, fontes e logo como um design system, e todo deck que você criar terá a cara da sua empresa.
    - title: Imagens e logos
      body: Peça ao agente para gerar imagens, buscar fotos de banco ou trazer logos de clientes e parceiros para seus slides de tração.
    - title: Colaboração com seu cofundador
      body: Edite o mesmo deck com seu cofundador e o agente, comente em qualquer slide e restaure qualquer versão anterior.
    - title: Apresente, compartilhe e exporte
      body: Apresente com notas do apresentador, compartilhe um link só de visualização com investidores ou exporte um arquivo PowerPoint editável.
