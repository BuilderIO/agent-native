faqs:
  heading: Dúvidas? Temos as respostas
  items:
    - q: O Agent-Native Slides é gratuito?
      a: Sim, o Agent-Native Slides é gratuito e open source. Para montar um deck, é preciso uma conexão de IA, pelo Builder.io ou com sua própria chave de IA, e para gerar imagens é preciso sua própria chave do Gemini ou da OpenAI. O Slides está em alfa, então espere mudanças à medida que ele evolui.
    - q: Posso exportar meu pitch deck para PowerPoint ou Google Slides?
      a: O Slides exporta um arquivo PowerPoint (PPTX) editável. Para o Google Slides, ele gera um arquivo PPTX com um link de importação, que você abre no Google Slides. Você também pode exportar o deck como um único arquivo HTML.
    - q: O Slides pode partir das minhas notas, de um doc ou do meu site?
      a: Descreva seu pitch na tela inicial do Slides e anexe suas notas ou um doc, ou adicione o link do seu site. Você também pode importar um Google Doc, um arquivo do Word ou um PowerPoint. Se o agente não conseguir ler um PDF ou um site, ele avisa em vez de inventar.
    - q: Qual a diferença entre o Slides e pedir a um chatbot que escreva meus slides?
      a: "Um chatbot te dá um texto para você copiar nos slides. No Slides, o agente monta o deck de verdade, em um editor que você vê. Você pode alterar qualquer slide à mão ou pedir ao agente, no mesmo deck, e toda mudança pode ser desfeita. É isso que faz do Slides um [app agêntico](https://www.agent-native.com/articles/what-is-an-agent-native-app/): a inteligência de um agente, a facilidade de um app."
    - q: Meu cofundador pode editar o pitch deck comigo?
      a: Você, seu cofundador e o agente podem editar o mesmo deck ao mesmo tempo. Dá para comentar em um slide ou em uma parte dele. O Slides salva uma versão antes de cada mudança relevante, então você pode restaurar uma versão anterior quando quiser.
    - q: Quantos slides um pitch deck deve ter?
      a: Cerca de dez é um bom tamanho para um primeiro pitch ([o que entra em um pitch deck](https://www.agent-native.com/articles/how-to-make-a-pitch-deck-with-ai/)), e o Slides sugere "Crie um pitch de 10 slides a partir deste doc". Se quiser outro tamanho, é só dizer ao agente, e ele planeja o roteiro para caber.
