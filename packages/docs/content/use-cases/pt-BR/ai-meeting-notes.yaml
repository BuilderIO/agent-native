template: v2
slug: ai-meeting-notes
app: clips
title: Notas de reunião com IA
seo_title: Notas de reunião com IA, sem bot na sua chamada
meta_description: "O Agent-Native Clips é um jeito gratuito e open source de fazer notas de reunião com IA direto do seu computador: transcrição, resumo e itens de ação de cada chamada."
updated: 2026-10-26
hero:
  body: "O Agent-Native Clips transforma chamadas em notas: transcrição, resumo e itens de ação por participante. Grava no seu computador, sem bot, e qualquer reunião é pesquisável."
  button:
    label: Faça notas de reunião
    url: https://clips.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4b1f55d396c64beea49da96d9d02b38c
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F03741a45126c451e8458872aebd9f480
    alt: Uma reunião semanal de produto já finalizada no Clips. O painel de notas, à esquerda, mostra um resumo curto, os pontos principais e os itens de ação agrupados por participante. A transcrição corre pela direita, com as falas de cada pessoa.
how_to:
  heading: Como fazer notas de reunião com IA
  steps:
    - title: Conecte sua agenda
      body: Instale o Clips Desktop, ative Reuniões nas Configurações do Clips e conecte o Google Calendar na página Reuniões. Suas próximas reuniões aparecem na aba Agenda.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F58ac771a7a8547ecbb770e5e560f8ecd
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F6d5d38e3c0124bbb8a51b2d0b89582c4
        alt: Detalhe da aba Agenda da página Reuniões, com as reuniões de hoje vindas do Google Calendar e os botões Entrar e Abrir notas na reunião que começa em 2 minutos.
    - title: Comece as notas pelo lembrete
      body: O Clips Desktop mostra um lembrete um minuto antes de cada reunião da agenda. O botão Join entra na chamada e começa as notas na hora, e o menu do botão começa as notas sem entrar. Aí o Clips captura seu microfone e o áudio da chamada.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Ff048f1dd0e18443d93fdeb4a4f03fada
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe58e7dd45fa3459fb1cdb3840fed0126
        alt: "Detalhe do lembrete do Clips Desktop para a reunião semanal de produto. O botão Join Meet & open Clips está com o menu aberto: Join only, Start notes only e Snooze 5 min."
    - title: Leia suas notas e itens de ação
      body: "Quando a chamada termina, a página da reunião mostra suas notas e as notas de IA ao lado da transcrição: resumo, pontos principais e itens de ação por participante. [Confira as notas de reunião com IA](https://www.agent-native.com/articles/how-to-use-ai-to-take-meeting-notes/) com a transcrição antes de compartilhar."
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F0ba0a151caef41e8904d6535671c47bc
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fbdf5e7b84ab64a288c0837959eedb85b
        alt: "Detalhe do painel de notas de IA de uma reunião finalizada: o resumo, quatro pontos principais e itens de ação agrupados sob dois participantes."
features:
  heading: Tudo o que você precisa de cada reunião
  items:
    - title: Nenhum bot nas suas chamadas
      body: O Clips Desktop grava seu microfone e o áudio da chamada no seu próprio computador, então a reunião parece igual para todos os outros.
    - title: Itens de ação por pessoa
      body: Cada item de ação diz quem é o responsável, com base em quem disse o quê na chamada. Adicione, edite ou remova itens antes de compartilhar.
    - title: Pergunte durante a chamada
      body: "Pergunte sobre a reunião enquanto ela acontece: o que você perdeu, um resumo dos últimos cinco minutos ou uma boa pergunta para fazer em seguida."
    - title: Pesquise pelo que foi dito
      body: Encontre uma reunião por palavras da transcrição, das notas ou pelo nome de um participante, ou peça ao agente.
    - title: Notas que levam de volta
      body: Clique em qualquer ponto principal das notas de IA para ir ao momento em que ele foi dito na transcrição.
    - title: Notas de reunião para compartilhar
      body: Um link compartilha o resumo, os pontos principais, os itens de ação e a transcrição completa, sem o vídeo nem os comentários da gravação.
