faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Clips é gratuito?
      a: Sim, o Agent-Native Clips é gratuito e open source. Resumos, títulos e a limpeza da transcrição usam por padrão os [créditos de IA do Builder.io](https://www.agent-native.com/docs/template-clips-features/). Quando os créditos acabam, esses recursos param até você adicionar créditos ou conectar sua própria chave do Gemini. O Clips está em alfa, então espere mudanças.
    - q: Um bot entra nas minhas reuniões?
      a: "Não. O Clips faz as notas do seu próprio computador: o Clips Desktop grava seu microfone e o áudio da chamada, então nada entra na sua chamada do Zoom, do Google Meet ou do Microsoft Teams. Como nenhum bot entra, avise as pessoas de que você está fazendo notas."
    - q: Com quais apps de agenda e de videochamada o Clips funciona?
      a: O Clips se conecta apenas ao Google Calendar. As notas funcionam no Zoom, no Google Meet, no Microsoft Teams, no Webex ou em qualquer outra chamada cujo áudio seu computador reproduza. No Mac, o Clips Desktop também percebe essas chamadas quando elas não estão na sua agenda e oferece começar as notas. As vozes dos outros participantes só são capturadas no Mac.
    - q: O Clips faz notas de reunião no Windows?
      a: O Clips Desktop roda no Mac, no Windows e no Linux, mas capturar a voz dos outros participantes só funciona no Mac. No Windows e no Linux, o Clips grava apenas o seu microfone, então os participantes remotos ficam de fora da transcrição e dos itens de ação.
    - q: Qual a diferença entre o Clips e o assistente de notas com IA do Zoom ou do Google Meet?
      a: "O assistente de notas com IA de um app de chamada fica preso às chamadas daquele app. O Clips guarda todas as reuniões, de qualquer app de chamada, em uma única biblioteca. Pergunte ao [agente do Clips](https://www.agent-native.com/docs/template-clips-agent/) \"o que o Daniel se comprometeu a fazer na terça passada?\" e ele pesquisa suas reuniões pelo que foi dito. Isso é um [app agêntico](https://www.agent-native.com/articles/what-is-an-agent-native-app/): o cérebro de um agente, a intuitividade de um app."
