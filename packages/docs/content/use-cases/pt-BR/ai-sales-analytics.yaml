title: Revise seu pipeline de vendas com o HubSpot e o Gong
seo_title: Análise de vendas com IA para HubSpot e Gong
meta_description: Saiba quais negócios travaram e por quê antes da revisão do pipeline. Pergunte ao Agent-Native Analytics sobre HubSpot e Gong e salve tudo em um dashboard.
updated: 2026-10-27
hero:
  body: O Agent-Native Analytics transforma negócios do HubSpot e chamadas do Gong em um dashboard para cada revisão de pipeline. Pergunte em português quais travaram e por quê, e o agente responde com os dois.
  button:
    label: Pergunte ao seu pipeline
    url: https://analytics.agent-native.com
  image:
    dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe534007e491840cc86570110b7d00de4
    light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F4780c6d1885541bcaf3d949dbdbc1eb7
    alt: O dashboard Weekly pipeline review no Analytics, com painéis de pipeline aberto por etapa, negócios por responsável e negócios parados há 30 dias. O chat do agente, à direita, explica por que um negócio parado travou, com base no histórico de etapas do HubSpot e na última chamada do Gong.
how_to:
  heading: Como analisar seu pipeline de vendas com IA
  steps:
    - title: Conecte seus dados de CRM e de chamadas
      body: Abra **Fontes de dados** e clique em **Conectar** ao lado do HubSpot, em **CRM e vendas**. Cole o token de um app privado que você cria nas configurações do HubSpot e clique em **Salvar credenciais**. O Gong funciona do mesmo jeito, com uma chave de acesso e um segredo.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fdeea3eb7d84048eca0f534b7b00390ee
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fd918aa95f46047559b1f30c42d89d62f
        alt: A página Fontes de dados com o HubSpot em Connected e o Gong em CRM e vendas. O painel de configuração do Gong está aberto na etapa Access Key Secret, já colada, acima de Salvar credenciais.
    - title: Pergunte sobre seu pipeline
      body: 'Em **Perguntar**, pergunte em português: "Quais negócios abertos estão na mesma etapa há 30 dias ou mais?". O agente pesquisa seus negócios no HubSpot e responde com uma tabela que você pode ordenar e aprofundar.'
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F7acaa378761c453bb79f9f246d8cab72
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2Fe66acdb3c24e41c7b5caef3e0251b17a
        alt: "O chat Perguntar com a pergunta sobre negócios parados há 30 dias. O agente responde com uma tabela de seis negócios abertos: etapa, responsável, valor e dias na etapa."
    - title: Salve as respostas em um dashboard
      body: Peça ao agente para "salvar isto como um dashboard para a revisão do pipeline". Ele cria um painel para cada resposta, e os painéis se atualizam com novos dados do HubSpot. Compartilhe o dashboard com sua equipe antes da revisão do pipeline.
      image:
        dark: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F69b61731b5b74d61ad0e510f57522796
        light: https://cdn.builder.io/api/v1/image/assets%2FYJIGb4i01jvw0SRdL5Bt%2F2720d0e5fd8f40bfa3b72c056270f174
        alt: O chat do agente confirmando que salvou o dashboard Weekly pipeline review, ao lado do novo dashboard com a tabela de negócios parados e o gráfico de pipeline por etapa.
features:
  heading: Tudo o que você precisa para a revisão do pipeline
  items:
    - title: Seus negócios e chamadas juntos
      body: Uma única pergunta pode trazer a etapa e o responsável de um negócio do HubSpot e o que o comprador disse nas chamadas do Gong.
    - title: Dashboards que o agente edita
      body: Peça um novo painel, um filtro por responsável ou outro gráfico, e o agente atualiza o dashboard que sua equipe compartilha.
    - title: Respostas que você pode conferir
      body: O agente marca como "Não verificado" o número que não veio de uma consulta ao vivo no HubSpot ou no Gong, para você saber o que conferir.
    - title: Seu pipeline ao lado da receita
      body: Conecte também o Stripe e o BigQuery, e o mesmo chat responde sobre receita e uso do produto junto com seus negócios.
    - title: Suas definições de pipeline
      body: Um administrador escreve o que significa negócio parado ou pipeline qualificado na página **Camada semântica**. O agente lê isso antes de responder.
    - title: Um relatório diário do pipeline
      body: Receba o dashboard todo dia por e-mail, para até cinco pessoas, ou em um canal do Slack, sem abrir o app.
