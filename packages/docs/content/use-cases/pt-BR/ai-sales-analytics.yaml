faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Analytics é gratuito?
      a: Sim, o Agent-Native Analytics é gratuito e open source. O agente roda com créditos de IA do Builder.io ou com sua própria chave de IA, então o uso de IA não é ilimitado. Perguntas sobre chamadas também podem usar seus créditos de API do Gong, que um administrador pode desativar. O Analytics está em alfa.
    - q: A quais ferramentas de CRM e de chamadas o Agent-Native Analytics se conecta?
      a: O Analytics se conecta ao HubSpot para o seu CRM e ao Gong para suas chamadas de vendas. O Apollo e o Clay também se conectam, para dados de contatos e empresas. Cada um [se conecta na página Fontes de dados](https://www.agent-native.com/docs/template-analytics-connectors/) com sua própria chave, e uma pergunta pode usar o HubSpot e o Gong juntos.
    - q: Preciso escrever SQL?
      a: Não. Você pergunta em português, e o agente encontra os dados no HubSpot ou no Gong, roda a consulta e responde com um número, uma tabela ou um gráfico. Quando você salva uma resposta em um dashboard, o agente configura como cada painel busca dados novos.
    - q: Posso confiar nos números?
      a: "Sim, conferindo: o agente responde com dados ao vivo do HubSpot e do Gong e marca um número como \"Não verificado\" quando ele não veio de uma consulta ao vivo. Ele segue as [definições da sua equipe na página Camada semântica](https://www.agent-native.com/docs/template-analytics-dashboards/). Compare as primeiras respostas com o HubSpot antes de confiar nelas."
    - q: Qual a diferença entre o Agent-Native Analytics e a IA que vem com o HubSpot ou o Gong?
      a: A IA do HubSpot ou do Gong fica presa àquela ferramenta. O Analytics responde a uma pergunta com o HubSpot e o Gong juntos, também lê o Stripe e o BigQuery, e guarda a resposta em um dashboard que sua equipe reabre toda semana. Você continua usando o HubSpot e o Gong como antes, e o Analytics lê dos dois.
    - q: Quem pode ver meus dashboards?
      a: Só você, até compartilhar um. Compartilhe um dashboard com um colega ou com toda a organização como leitor, editor ou administrador. Os colegas veem os dados do HubSpot e do Gong pela própria conexão ou por uma que um administrador configurou para a organização; sem nenhuma das duas, esses painéis mostram um erro.
