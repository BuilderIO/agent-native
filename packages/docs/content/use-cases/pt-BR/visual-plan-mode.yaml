faqs:
  heading: Dúvidas? Temos respostas
  items:
    - q: O Agent-Native Plan é gratuito?
      a: Sim, o Agent-Native Plan é gratuito e open source. Cada plano roda como uma sessão do seu agente de código, no modelo que você escolher. Isso usa os tokens do seu agente, e um plano maior usa mais. O Plan está em alfa, então espere mudanças.
    - q: Com quais agentes de código o Plan funciona?
      a: O Claude Code e o Codex têm instalação por plugin. Um comando de instalação também configura o Plan no Cursor, no OpenCode, no GitHub Copilot no VS Code e no Claude Cowork. Qualquer outro host MCP, como o Cline ou o Goose, pode adicionar o conector do Plan pela URL. Você revisa todo plano no navegador.
    - q: Qual a diferença entre o Plan e o plan mode do meu agente de código?
      a: O plan mode do Claude Code, do Codex, do Cursor ou do OpenCode entrega o plano como texto no chat. O Plan transforma esse plano, ou um de um arquivo Markdown, em uma página com diagramas, árvores de arquivos e código anotado. Ali você comenta partes exatas, responde às perguntas do agente e chama um colega.
    - q: O agente mexe no meu código enquanto planeja?
      a: Não. Enquanto escreve ou revisa o plano, as instruções do Plan limitam o agente a ler seu código. Ele começa a editar depois que você aprova o plano e relê o plano aprovado antes das etapas principais.
    - q: Um colega pode revisar um plano sem ter conta?
      a: Em parte. Qualquer pessoa com quem você compartilhar o link pode abrir e editar o plano como convidado. Comentar, salvar e compartilhar exigem uma conta Agent-Native, então um colega que quer comentar precisa entrar antes.
    - q: Posso manter os planos no meu próprio computador?
      a: Sim. O [modo de arquivos locais](https://www.agent-native.com/docs/template-plan-local-and-desktop/) guarda o plano como arquivos MDX no seu computador, então o conteúdo nunca chega ao app hospedado. Em troca, você não pode compartilhar um plano local nem comentar nele pelo navegador, e o link só abre na sua máquina. O modo de arquivos locais não muda onde roda o modelo de IA do seu agente de código.
