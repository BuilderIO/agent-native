faqs:
  heading: "Questions? We have answers"
  items:
    - q: "Is Slides free?"
      a: "Yes, Agent-Native Slides is free and open source. Building a deck needs an AI connection, either through Builder.io or your own AI key, and making images needs your own Gemini or OpenAI key. Slides is in alpha, so expect changes as it grows."
    - q: "Can I export my pitch deck to PowerPoint or Google Slides?"
      a: "Slides exports an editable PowerPoint (PPTX) file. For Google Slides, it gives you a PPTX file with an import link, which you open in Google Slides yourself. You can also export the deck as one HTML file."
    - q: "Can Slides start from my notes, doc or website?"
      a: "Describe your pitch on the Slides home screen and attach your notes or a doc, or add your website's link. You can also import a Google Doc, a Word file or a PowerPoint. If the agent can't read a PDF or a website, it tells you instead of guessing."
    - q: "How is Slides different from asking a chatbot to write my slides?"
      a: "A chatbot gives you text to copy into slides yourself. In Slides, the agent builds the real deck in an editor you can see. You can change any slide by hand or ask the agent, on the same deck, and every change can be undone. That's what makes Slides an [agentic app](https://www.agent-native.com/articles/what-is-an-agent-native-app/): the brains of an agent, the intuitiveness of an app."
    - q: "Can my co-founder edit the pitch deck with me?"
      a: "You, your co-founder and the agent can edit the same deck at the same time. You can comment on a slide or on one part of it. Slides saves a version before each meaningful change, so you can restore an earlier version at any time."
    - q: "How many slides should a pitch deck have?"
      a: "Around ten is a good length for a first pitch ([what goes in a pitch deck](https://www.agent-native.com/articles/how-to-make-a-pitch-deck-with-ai/)), and Slides suggests \"Build a 10-slide pitch from this doc\". Tell the agent a different length if you want one, and it plans the outline to fit."
