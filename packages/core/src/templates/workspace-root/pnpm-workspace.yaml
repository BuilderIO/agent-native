packages:
  - "packages/*"
  - "apps/*"

overrides:
  "@assistant-ui/store": ">=0.2.9 <0.2.14"
  "@assistant-ui/tap": "^0.5.14"
  better-auth: "1.6.0"
  nf3: "0.3.17"
  # These four reach @agent-native/core through peer edges, so two apps that
  # drift even a patch apart fork a second ~175 MB physical copy of core.
  # One spec string per workspace is what keeps it at one copy — raise these
  # together, never per app.
  "@types/node": "^25.8.0"
  esbuild: "^0.28.1"
  srvx: "^0.12.4"
  zod: "^4.4.3"

onlyBuiltDependencies:
  - "@swc/core"
  - better-sqlite3
  - canvas
  - electron
  - esbuild
  - lightningcss
  - node-pty

allowBuilds:
  "@swc/core": true
  better-sqlite3: true
  canvas: true
  electron: true
  esbuild: true
  lightningcss: true
  node-pty: true
