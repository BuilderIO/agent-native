packages:
  - "packages/*"
  - "apps/*"

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@bacons/apple-targets"
  - "@agent-native/*"
  - "@modelcontextprotocol/client"
  - "@modelcontextprotocol/core"
  - "@modelcontextprotocol/node"
  - "@modelcontextprotocol/server"
  - "dom-to-pptx"
  - "fast-xml-parser"
  - "typescript"
  - "@typescript/typescript6"
  - "@typescript/typescript-*"

overrides:
  "@sentry/bundler-plugins": "10.73.0"
  "@assistant-ui/store": ">=0.2.9 <0.2.14"
  "@assistant-ui/tap": "^0.5.14"
  better-auth: "1.7.6"
  nf3: "0.3.17"
  "@types/node": "^25.8.0"
  "@tanstack/react-query": "^5.101.2"
  esbuild: "^0.28.1"
  srvx: "^0.12.4"
  zod: "^4.4.3"

packageExtensions:
  "node-pty@*":
    dependencies:
      node-gyp: "^12.4.0"

onlyBuiltDependencies:
  - "@swc/core"
  - canvas
  - electron
  - esbuild
  - ffmpeg-static
  - lightningcss
  - node-pty
  - tesseract.js

allowBuilds:
  "@swc/core": true
  canvas: true
  electron: true
  esbuild: true
  ffmpeg-static: true
  lightningcss: true
  node-pty: true
  tesseract.js: true
